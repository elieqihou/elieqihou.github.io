 {"idx": "04", "title": {"zh": "11 月 15 日凌晨 3 点，BLG 与 GEN 争 S16 冠军", "en": "BLG and GEN meet for the S16 title at 3 a.m. on 15 November", "es": "BLG y GEN pelean por el título de la S16 a las 3:00 del 15 de noviembre", "ja": "11 月 15 日午前 3 時、BLG と GEN が S16 優勝を争う"}, "body": {"zh": "2026 英雄联盟全球总决赛决赛定于北京时间 11 月 15 日凌晨 3 点在纽约布鲁克林巴克莱中心进行，赛制为 BO5，由 LPL 二号种子 BLG 对阵 LCK 一号种子 GEN，全程采用全局 BP（无畏征召）。GEN 瑞士轮 3-0 晋级，淘汰赛两个 3 比 0（对 LYON 与 iG），六小局零失局；BLG 从 2 比 2 生死局爬出，八强 3 比 0 胜 DK、半决赛 3 比 1 淘汰卫冕冠军 T1，终结了 LPL 队伍在 S 赛 BO5 对 T1 的十三连败，也挡下了 T1 的四连冠。赛前多家预测市场给 GEN 约 62% 的夺冠概率。若 BLG 夺冠，将成为单届世界赛逐一击败全部四支 LCK 参赛队的第一支队伍。中野对位被普遍视为胜负手：BLG 的 Knight 与 Xun 对上 GEN 的 Chovy 与 Canyon。", "en": "The 2026 League of Legends World Championship final will be played at 3 a.m. Beijing time on 15 November at Barclays Center in Brooklyn, a best-of-five between LPL second seed BLG and LCK first seed GEN, played under global ban rules. GEN went 3-0 in the Swiss stage and won both knockout rounds 3-0 (against LYON and iG) without dropping a game; BLG climbed out of a 2-2 elimination match, swept DK 3-0 in the quarter-finals and beat defending champions T1 3-1 in the semi-final, ending a 13-series losing run for LPL teams against T1 at Worlds and denying T1 a fourth straight title. Prediction markets put GEN at about 62%. A BLG win would make them the first team to beat all four LCK representatives in a single Worlds. The mid-jungle matchup — Knight and Xun against Chovy and Canyon — is widely seen as decisive.", "es": "La final del Mundial de League of Legends 2026 se jugará a las 3:00 de Pekín del 15 de noviembre en el Barclays Center de Brooklyn, al mejor de cinco, entre BLG (segundo cabeza de serie de la LPL) y GEN (primero de la LCK), con reglas de prohibición global. GEN pasó 3-0 la fase suiza y ganó sus dos eliminatorias por 3-0 (ante LYON e iG) sin ceder un mapa; BLG salió de un partido a vida o muerte 2-2, barrió 3-0 a DK en cuartos y venció 3-1 al campeón defensor T1 en semifinales, cortando una racha de 13 series perdidas por equipos de la LPL ante T1 en Mundiales y negándole a T1 el cuarto título consecutivo. Los mercados de predicción dan a GEN cerca del 62%. Si gana BLG, será el primer equipo en vencer a los cuatro representantes de la LCK en un mismo Mundial. El duelo de medio y jungla se ve como decisivo.", "ja": "2026 年リーグ・オブ・レジェンド世界大会の決勝は北京時間 11 月 15 日午前 3 時、ニューヨーク・ブルックリンのバークレイズ・センターで BO5、LPL 第 2 シードの BLG と LCK 第 1 シードの GEN が対戦する。全局 BAN（无畏征召）方式。GEN はスイス段階 3-0、決勝トーナメントも LYON と iG に 3-0 と 1 ゲームも落とさず勝ち上がった。BLG は 2-2 の崖っぷちから抜け出し、準々決勝で DK を 3-0、準決勝で王者 T1 を 3-1 で破り、世界大会 BO5 での LPL 対 T1 の 13 連敗を止め、T1 の 4 連覇を阻んだ。予測市場は GEN の優勝確率を約 62% とする。BLG が勝てば、1 大会で LCK の 4 チームすべてを破った初のチームとなる。中野の対決が鍵と見られる。"}, "why": {"zh": "一边是零失局的稳定，一边是连斩三支 LCK 的硬度。这场决赛真正的问题不是谁更强，而是“稳定”和“应变”在 BO5 里哪个更值钱。", "en": "On one side, a flawless run; on the other, three LCK scalps in a row. The real question is not who is stronger but whether steadiness or adaptability is worth more across five games.", "es": "A un lado, una trayectoria impecable; al otro, tres víctimas de la LCK seguidas. La pregunta no es quién es más fuerte, sino si vale más la estabilidad o la capacidad de adaptación en un BO5.", "ja": "一方は無失ゲームの安定、もう一方は LCK 三連破の硬さ。問われているのはどちらが強いかではなく、BO5 で『安定』と『対応力』のどちらが高いかだ。"}}, {"idx": "05", "title": {"zh": "马刺 9 胜 2 负紧追湖人：正负值前三被同一支队包揽", "en": "Spurs move to 9-2 behind the Lakers, with the top three plus-minus marks all theirs", "es": "Los Spurs, 9-2, acechan a los Lakers: los tres mejores +/- son suyos", "ja": "スパーズが 9 勝 2 敗でレイカーズを追走、プラスマイナス上位 3 を独占"}, "body": {"zh": "11 月 11 日，美媒 StatMuse 更新本赛季球员正负值榜：全联盟该项数据破百的只有 13 人，而前三名全部来自马刺——文班亚马 +196、哈珀 +159、福克斯 +149，其后是东契奇 +144、戴森·丹尼尔斯 +131。马刺目前 9 胜 2 负位列西部第二，仅落后 10 胜 2 负的湖人半个胜场；11 月 10 日他们 122 比 96 大胜太阳。个人数据方面，东契奇以场均 39.3 分领跑得分榜，库里 30.6 分次之，文班亚马 30.1 分第三；文班亚马同时以场均 4.4 次盖帽领跑盖帽榜，场均 11.9 个篮板列第五。", "en": "On 11 November StatMuse updated its season plus-minus table: only 13 players league-wide are above plus-100, and the top three all play for San Antonio — Victor Wembanyama at plus-196, Dylan Harper plus-159 and De'Aaron Fox plus-149 — followed by Luka Dončić at plus-144 and Dyson Daniels at plus-131. The Spurs are 9-2, second in the West and half a game behind the 10-2 Lakers, after beating Phoenix 122-96 on 10 November. Dončić leads scoring at 39.3 points a game, ahead of Stephen Curry's 30.6 and Wembanyama's 30.1; Wembanyama also leads blocks at 4.4 and ranks fifth in rebounding at 11.9.", "es": "El 11 de noviembre StatMuse actualizó su tabla de plus-minus de la temporada: solo 13 jugadores superan el +100 y los tres primeros son de San Antonio: Victor Wembanyama +196, Dylan Harper +159 y De'Aaron Fox +149, seguidos por Luka Dončić +144 y Dyson Daniels +131. Los Spurs están 9-2, segundos del Oeste y a medio partido de los Lakers (10-2), tras ganar 122-96 a Phoenix el 10 de noviembre. Dončić lidera la anotación con 39,3 puntos por partido, por delante de Stephen Curry (30,6) y Wembanyama (30,1), que además encabeza los tapones con 4,4 y es quinto en rebotes con 11,9.", "ja": "11 月 11 日、米メディアの StatMuse が今季のプラスマイナスランキングを更新した。リーグ全体で +100 超は 13 人だけ、その上位 3 人がすべてサンアントニオの選手だ。ウェンバンヤマ +196、ハーパー +159、フォックス +149 で、以下ドンチッチ +144、ダイソン・ダニエルズ +131 と続く。スパーズは 9 勝 2 敗で西 2 位、10 勝 2 敗のレイカーズに 0.5 ゲーム差。11 月 10 日はフェニックスに 122-96 で快勝した。個人ではドンチッチが平均 39.3 得点で首位、カリー 30.6、ウェンバンヤマ 30.1。ウェンバンヤマは平均 4.4 ブロックで 1 位、リバウンド 11.9 で 5 位。"}, "why": {"zh": "正负值最容易被顺风局美化，但三个人同时排进前三，至少说明马刺的轮换已经能稳定地“赢时间段”——这比某个人得多少分更能解释 9 胜 2 负。", "en": "Plus-minus is easily flattered by blowouts, but three players in the top three at once suggests San Antonio's rotations reliably win their minutes — a better explanation for 9-2 than any individual scoring line.", "es": "El plus-minus se infla fácil en partidos rotos, pero tres jugadores en el top tres a la vez sugiere que las rotaciones de San Antonio ganan sus minutos con regularidad: mejor explicación del 9-2 que cualquier línea individual.", "ja": "プラスマイナスは大差の試合で膨らみやすい。それでも 3 人が同時に上位 3 に入るのは、サンアントニオのローテーションが安定して『時間帯を勝つ』ということだ。9 勝 2 敗の説明としては個人成績より説得力がある。"}}]}, {"key": "hot", "num": "05", "color": "#6d28d9", "deep": "#55209f", "name": {"zh": "网络热点", "en": "TRENDING", "es": "TENDENCIAS", "ja": "ネット話題"}, "items": [{"idx": "01", "title": {"zh": "双 11 当天，“同款空调反而贵了 331 元”冲上热搜", "en": "On Double 11 itself, “the same air conditioner cost 331 yuan more” trends", "es": "El mismo día del Doble 11 se viraliza que “el mismo aire acondicionado costó 331 yuanes más”", "ja": "ダブル 11 当日、『同じエアコンが 331 元高くなった』がトレンドに"}, "body": {"zh": "11 月 11 日，一条“同款空调双 11 却贵了 331 元、安装费成隐形负担”的报道引发大量讨论。消费者发现，同一型号在促销期的到手价并不比平时便宜，部分优惠被安装费、辅材费悄悄吃掉——高空作业费、加长铜管、外机支架、打孔、拆旧机，逐项加起来往往几百元。与之呼应的还有两组数据：今年双 11 有平台半小时卖出约 2 万亿元 Token；1 至 10 月，经港珠澳大桥珠海公路口岸通过海关跨境电商管理平台出口达 1120 亿元、同比增长 33.1%，已超 2025 年全年，日均出口包裹超 300 万个。", "en": "On 11 November a report that the same air conditioner cost 331 yuan more on Double 11, with installation fees as a hidden burden, set off wide discussion. Buyers found that promo prices were no lower than usual once installation and materials were counted: high-altitude work, extra copper piping, brackets, wall drilling and old-unit removal can add several hundred yuan. Two other data points framed the day: one platform sold about 2 trillion yuan worth of AI tokens in half an hour, and exports through the customs cross-border e-commerce platform at the Hong Kong-Zhuhai-Macao Bridge checkpoint reached 112 billion yuan in January-October, up 33.1% and already above all of 2025, with more than 3 million parcels a day.", "es": "El 11 de noviembre, una información de que el mismo aire acondicionado costaba 331 yuanes más en el Doble 11, con la instalación como carga oculta, generó un gran debate. Los compradores comprobaron que el precio final no era menor que el habitual una vez sumados instalación y materiales: trabajo en altura, tubería adicional, soportes, perforaciones y retirada del equipo viejo pueden añadir cientos de yuanes. Otros dos datos acompañaron la jornada: una plataforma vendió unos 2 billones de yuanes en tokens de IA en media hora, y las exportaciones por la plataforma aduanera de comercio electrónico transfronterizo del puente Hong Kong-Zhuhai-Macao alcanzaron 112.000 millones de yuanes entre enero y octubre, un 33,1% más y por encima de todo 2025, con más de 3 millones de paquetes diarios.", "ja": "11 月 11 日、『同じ型のエアコンがダブル 11 で 331 元高くなり、設置費が隠れた負担になっている』という報道が大きな議論を呼んだ。設置費と資材費を足すと、プロモ価格は普段より安くないというわけだ。高所作業費、銅管の延長、室外機の架台、壁の穴あけ、旧機の撤去で数百元になる。この日は別の数字も話題になった。あるプラットフォームは 30 分で約 2 兆元分の AI トークンを販売し、港珠澳大橋の税関越境 EC プラットフォーム経由の輸出は 1〜10 月で 1120 億元、前年同期比 33.1% 増で 2025 年通年を超え、1 日平均 300 万個以上の荷物が運ばれた。"}, "why": {"zh": "当“最低价”变成一年 365 天都能在直播间找到的东西，大促的说服力就只能来自“算得清”——而隐性费用恰恰是最算不清的部分。", "en": "When the lowest price is available in a livestream on any day of the year, a big sale can only persuade through arithmetic that adds up — and hidden fees are exactly what never adds up.", "es": "Cuando el precio más bajo se encuentra en un directo cualquier día del año, una gran campaña solo convence con cuentas claras, y las tarifas ocultas son justo lo que nunca cuadra.", "ja": "『最安値』が年中ライブ配信で見つかる時代に、大型セールが説得力を持てるのは『計算が合う』ときだけだ。そして隠れた費用こそ、最も計算が合わない部分である。"}}, {"idx": "02", "title": {"zh": "5 个上门维修师傅，只有 2 个说了实话", "en": "Five repair technicians came to the door; only two told the truth", "es": "Cinco técnicos a domicilio, solo dos dijeron la verdad", "ja": "訪問修理の 5 人のうち、本当のことを言ったのは 2 人"}, "body": {"zh": "11 月 11 日，媒体对上门维修行业的暗访登上热搜：测试 5 位师傅，仅 2 位如实告知简单故障，其余存在夸大故障、偷换零件并收取高额费用的行为。报道把原因指向平台机制——部分维修平台抽取高额佣金，师傅缺乏底薪，收入依赖配件与工时提成，“小病大修”因此成为理性选择。相关讨论集中在两点：是该重罚违规师傅，还是该改革平台的派单与抽成规则。", "en": "An undercover investigation into home repair services trended on 11 November: of five technicians tested, only two honestly identified a simple fault, while the rest exaggerated the problem, swapped parts or charged inflated fees. The report traced the incentive to platform mechanics — high commissions, no base salary, income dependent on parts and labour markups, which makes upselling the rational choice. Debate has centred on whether to punish the technicians harder or reform how platforms dispatch jobs and take their cut.", "es": "Una investigación encubierta sobre reparaciones a domicilio se volvió tendencia el 11 de noviembre: de cinco técnicos probados, solo dos identificaron honestamente una avería simple; el resto exageró el problema, cambió piezas o cobró de más. El informe atribuyó el incentivo al diseño de las plataformas: comisiones altas, sin salario base, ingresos dependientes de piezas y mano de obra, lo que hace racional inflar el trabajo. El debate se centra en si castigar más a los técnicos o reformar el reparto de pedidos y comisiones.", "ja": "11 月 11 日、訪問修理業界への潜入取材がトレンド入りした。5 人の技術者のうち、簡単な故障を正直に伝えたのは 2 人だけで、残りは故障を誇張したり部品をすり替えたりして高額請求した。報道は原因をプラットフォームの仕組みに求める。手数料が高く、基本給がなく、収入が部品と工賃の上乗せに依存するため、『小さな故障を大きく修理する』ことが合理的選択になる。議論は、違反した技術者を厳罰にするのか、配車と手数料のルールを改めるのかに集まる。"}, "why": {"zh": "把板子只打在师傅身上最省事，也最没用——当一个人的收入结构鼓励他多换零件，道德劝说就注定跑不过考核表。", "en": "Blaming the technician is the easiest response and the least useful: when someone's income structure rewards replacing more parts, moral suasion will always lose to the scorecard.", "es": "Culpar al técnico es lo más fácil y lo menos útil: cuando la estructura de ingresos premia cambiar más piezas, la prédica moral siempre pierde frente a la tabla de objetivos.", "ja": "技術者だけを責めるのは最も簡単で、最も役に立たない。収入構造が部品交換を促すなら、道徳的な説得は評価表に勝てない。"}}, {"idx": "03", "title": {"zh": "南京“零元面馆”走红之后：日均送出近 3000 碗，隔壁面馆客流下滑", "en": "After Nanjing's free-noodle shops went viral: nearly 3,000 bowls a day, and neighbours losing customers", "es": "Tras el auge de los fideos gratis en Nankín: casi 3.000 cuencos al día y vecinos que pierden clientes", "ja": "南京の『0 元麺屋』が話題の後、1 日約 3000 杯提供・隣の店は客足減"}, "body": {"zh": "南京江宁殷巷、雨花台岱山两家“零元面馆”自 10 月 8 日首店开业后持续走红：只提供一种素面，不设年龄收入门槛、不做信息登记，排队即可领取，两家店日均合计送出近 3000 碗，高峰时队伍长达百米。周边部分薄利面馆反映客流被分流：一家称日营业额从上万元下降约 2000 元，一家安徽板面店每天少一二十位客人、打算租约到期后另寻店面，还有经营约 15 年的低价炒面店午市几乎无人进店。11 月 6 日起，雨花台区市场监管部门检查后表示面馆环境整洁、证照齐全，已安排第三方抽检食材；江宁区市场监管部门表示慈善行为本身不违反法律法规，不能仅因免费供餐要求停业。经营者称成本全部自担，单店一年运营开销约 250 万元，目前已收紧规则：只限堂食、不再提供公用碗筷、计划发号牌限流。", "en": "Two free-noodle shops in Nanjing, in Jiangning and Yuhuatai districts, have drawn crowds since the first opened on 8 October: one kind of vegetarian noodle, no income or age test, no registration, just queue and eat — nearly 3,000 bowls a day between them, with queues of up to 100 metres at peak. Nearby low-margin noodle shops say they are losing trade: one reports daily revenue down about 2,000 yuan from over 10,000, an Anhui-style shop is losing 10 to 20 customers a day and plans to move when the lease ends, and a 15-year-old fried-noodle shop has an almost empty lunch service. On 6 November market regulators in Yuhuatai said the shops were clean and properly licensed and ordered third-party food tests; Jiangning regulators said charity itself breaks no law and free meals alone are no reason to shut a business. The operator says it bears all costs, about 2.5 million yuan a year per shop, and has tightened rules: dine-in only, no shared bowls and chopsticks, and numbered tickets to cap the queue.", "es": "Dos locales de fideos gratis en Nankín, en los distritos de Jiangning y Yuhuatai, atraen multitudes desde que el primero abrió el 8 de octubre: un solo tipo de fideo vegetariano, sin requisitos de edad o ingresos ni registro, solo hacer cola; entre ambos sirven casi 3.000 cuencos al día, con colas de hasta 100 metros en hora punta. Locales cercanos de bajo margen dicen perder clientela: uno reporta unos 2.000 yuanes menos de facturación diaria frente a más de 10.000, otro pierde entre 10 y 20 clientes al día y planea mudarse al vencer el contrato, y un local de fritos con 15 años de historia tiene el servicio del mediodía casi vacío. El 6 de noviembre los reguladores de Yuhuatai dijeron que los locales están limpios y con licencias y ordenaron análisis de alimentos; los de Jiangning señalaron que la caridad no infringe la ley y que servir gratis no justifica cerrar. El operador asume todos los costes, unos 2,5 millones de yuanes anuales por local, y ha restringido el servicio: solo consumo en el local, sin cuencos ni palillos compartidos y tickets numerados para limitar la cola.", "ja": "南京の江寧区と雨花台区にある『0 元麺屋』2 店は、10 月 8 日の 1 号店開業以降人気が続く。提供するのは一種類の素麺のみで、年齢や収入の条件も登録もなく、並べば受け取れる。2 店合計で 1 日約 3000 杯、ピーク時は行列が 100 メートルに達する。周辺の薄利の麺屋は客足の流出を訴える。ある店は 1 日の売上が 1 万元台から約 2000 元減り、別の店は 1 日 10〜20 人の客減で契約更新後に移転を検討、15 年続く低価格焼きそば店は昼の営業がほぼ空になった。11 月 6 日以降、雨花台区の市場監督部門は店内が清潔で許可もそろっているとし、第三者による食材検査を手配。江寧区は慈善行為自体は違法ではなく、無料提供だけを理由に営業停止は求められないと説明した。運営者は費用を全額負担し、1 店あたり年約 250 万元かかるとし、店内飲食限定、共用の器と箸の廃止、整理券による入場制限へと規則を厳格化した。"}, "why": {"zh": "“不违法”回答的是能不能开，回答不了街面生态被改变之后怎么办。善意与生意撞在一起时，缺的从来不是热情，而是规则。", "en": "“Not illegal” answers whether the shop may open; it does not answer what happens to the street once it does. When kindness meets business, what is missing is never enthusiasm but rules.", "es": "“No es ilegal” responde si puede abrir, no qué pasa con la calle cuando abre. Cuando la bondad choca con el negocio, lo que falta nunca es entusiasmo, sino reglas.", "ja": "『違法ではない』は開店できるかへの答えで、開いた後で街の生態が変わったらどうするかへの答えではない。善意と商売がぶつかるとき、足りないのは熱意ではなくルールだ。"}}, {"idx": "04", "title": {"zh": "“株洲物流仓库大火”被证伪：属地消防部门称近期无此类火灾", "en": "“Zhuzhou warehouse fire” debunked: local firefighters say no such blaze occurred", "es": "Desmentido el “incendio en un almacén de Zhuzhou”: los bomberos locales dicen que no ocurrió", "ja": "『株洲の物流倉庫火災』は虚偽、地元消防は発生していないと断定"}, "body": {"zh": "近日，一则“湖南株洲一物流家具仓库突发大火”的帖文在网络流传，配文称“现场火光冲天、黑烟数公里外可见”，并称仓库内堆放大量家具等易燃物、钢架结构高温下易坍塌、“损失惨重”，还声称消防人员第一时间赶赴现场、万幸无人员伤亡。11 月 10 日，中国互联网联合辟谣平台发布核查结论：经属地消防部门核实，近期株洲市范围内并未发生类似火灾，帖文所述不实，配图系网络素材。湖南网络举报及多地网信、民政系统同步转发该辟谣信息。平台同时提醒，编造、故意传播虚假信息需承担法律责任。", "en": "A post claiming a furniture warehouse in Zhuzhou, Hunan, had caught fire spread online recently, describing flames visible for kilometres, a steel structure at risk of collapse, heavy losses and firefighters arriving quickly with no casualties. On 10 November the national internet rumour-busting platform published its finding: local fire authorities confirmed no such fire occurred in Zhuzhou in the period, the post was false and the images were unrelated material. Hunan's reporting channels and local cyber and civil affairs offices reposted the debunk, with a reminder that fabricating or knowingly spreading false information carries legal liability.", "es": "Una publicación que afirmaba que un almacén de muebles en Zhuzhou, Hunan, se había incendiado se difundió estos días, con llamas visibles a kilómetros, riesgo de colapso de la estructura metálica, grandes pérdidas y bomberos llegando de inmediato sin víctimas. El 10 de noviembre la plataforma nacional de verificación publicó su conclusión: las autoridades locales confirmaron que no hubo tal incendio en Zhuzhou, la publicación era falsa y las imágenes no tenían relación. Los canales de denuncia de Hunan y oficinas de internet y asuntos civiles republicaron el desmentido, recordando que inventar o difundir a sabiendas información falsa tiene responsabilidad legal.", "ja": "湖南省株洲市の家具物流倉庫で火災が起きたとする投稿がこのほど拡散した。炎が数キロ先まで見え、鉄骨が高温で崩落の恐れがあり、被害甚大で、消防が直ちに駆けつけ死傷者はなかったとしていた。11 月 10 日、中国インターネット共同デマ撃退プラットフォームは調査結果を公表した。地元消防が確認したところ、最近の株洲市内で同種の火災は発生しておらず、投稿は事実に反し、画像は無関係な素材だった。湖南省の通報窓口や各地のネット・民政部門も否定情報を転載し、虚偽情報の作成・故意の拡散には法的責任が伴うと注意を促した。"}, "why": {"zh": "这类谣言有固定模板——“火光冲天＋黑烟数公里”配一张无关旧图，靠视觉冲击换转发。核实路径其实很短：问一句属地消防“到底有没有发生过”就够了。", "en": "These rumours follow a template — towering flames, smoke seen for kilometres, an unrelated old photo — trading shock value for shares. The verification path is short: ask the local fire service whether it happened at all.", "es": "Estos rumores siguen una plantilla: llamas enormes, humo visible a kilómetros y una foto antigua sin relación, cambiando impacto visual por difusión. La verificación es corta: preguntar a los bomberos locales si ocurrió.", "ja": "こうしたデマには定型がある。『炎が天を衝く＋数キロ先まで黒煙』に無関係な古い写真を添え、視覚的衝撃で拡散を稼ぐ。確認は簡単で、地元消防に『本当に起きたのか』と聞けばよい。"}}, {"idx": "05", "title": {"zh": "30 元机选中 1330 万：中奖者说自己平时并不常买", "en": "A 30-yuan quick pick wins 13.3 million yuan — and the buyer says he rarely plays", "es": "30 yuanes al azar valen 13,3 millones: el ganador dice que casi nunca juega", "ja": "30 元のクイックピックが 1330 万元、当選者は『普段はほとんど買わない』"}, "body": {"zh": "11 月 7 日，体彩超级大乐透第 26127 期开奖，前区 05、06、17、18、27，后区 03、12，当期全国销售 3.32 亿元。上海松江区梅家浜路一家体彩网点传出喜讯：一张 30 元的“一票十注单式追加票”命中一等奖。11 月 9 日下午，中奖者姚先生（化姓）到上海体彩兑奖大厅办理兑奖。按规则拆分，该票中得一等奖 1 注、基本奖金 739 万余元，因追加投注额外获得追加奖金 591 万余元，另有七等奖 1 注，单票合计 1330 万余元，为上海今年第 5 个千万级以上大乐透头奖。姚先生自述平时并不常买、没有固定购彩习惯，也不研究号码走势，当天傍晚路过门店“想着碰碰运气”，选号全程交给机器。", "en": "On 7 November the 26127th draw of the Super Lotto produced front-zone numbers 05, 06, 17, 18 and 27 and back-zone 03 and 12, with 332 million yuan sold nationwide. A shop on Meijiabang Road in Shanghai's Songjiang district sold a 30-yuan ten-line ticket with the optional add-on that hit the top prize. The winner, surnamed Yao, collected the money on the afternoon of 9 November: one first prize worth about 7.39 million yuan plus about 5.91 million from the add-on, and a seventh prize, for 13.3 million yuan in total — Shanghai's fifth eight-figure Super Lotto jackpot this year. Yao said he rarely buys, has no routine, does not study number trends, stopped by on his way past and let the machine pick.", "es": "El 7 de noviembre, el sorteo 26127 del Super Lotto dio los números 05, 06, 17, 18 y 27 en la zona delantera y 03 y 12 en la trasera, con 332 millones de yuanes vendidos. Un punto de venta en la calle Meijiabang, en Songjiang (Shanghái), vendió un boleto de 30 yuanes con diez apuestas y la opción adicional que acertó el primer premio. El ganador, apellidado Yao, cobró el 9 de noviembre: un primer premio de unos 7,39 millones más unos 5,91 millones por la opción adicional, y un séptimo premio, 13,3 millones en total, el quinto gran premio de ocho cifras del año en Shanghái. Yao dijo que juega poco, no tiene rutina, no estudia tendencias y dejó que la máquina eligiera.", "ja": "11 月 7 日のスーパーロト第 26127 回は前区 05、06、17、18、27、後区 03、12 で、全国販売額は 3 億 3200 万元。上海松江区梅家浜路の販売店で、30 元の 10 口・追加投注券が 1 等に当たった。当選者の姚さんは 11 月 9 日午後に手続きに現れ、1 等の基本賞金 739 万余元に追加賞金 591 万余元、さらに 7 等 1 口を加えた合計 1330 万余元。上海で今年 5 件目の 1000 万元超級の当選となる。姚さんは普段ほとんど買わず、習慣もなく、数字の傾向も研究せず、通りがかりに『運試し』で機械に任せたと話した。"}, "why": {"zh": "这条新闻真正的信息量在“不常买、不研究”——它顺手拆掉了“技术流”的叙事。彩票是概率游戏，30 元对应的头奖概率依然是千万分之一，别把个案当方法。", "en": "The informative part is “rarely plays, does not study”: it quietly dismantles the idea that skill helps. This is a game of probability — 30 yuan still buys a one-in-ten-million shot. Do not mistake an anecdote for a method.", "es": "Lo informativo es “juega poco, no estudia”: desmonta en silencio la idea de que la técnica ayuda. Es un juego de probabilidad: 30 yuanes siguen comprando una posibilidad entre diez millones. No confundas una anécdota con un método.", "ja": "本当に情報量があるのは『普段買わない、研究しない』という部分で、『技術派』の物語を静かに崩す。宝くじは確率のゲームで、30 元でも 1 等の確率は千万分の一のままだ。事例を方法と取り違えてはいけない。"}}]}, {"key": "ent", "num": "06", "color": "#db2777", "deep": "#ad1a5e", "name": {"zh": "娱乐八卦", "en": "ENTERTAINMENT", "es": "ESPECTÁCULOS", "ja": "エンタメ"}, "items": [{"idx": "01", "title": {"zh": "双 11 好六夜：何炅与许飞合唱《思念的距离》，一曲终了相拥", "en": "He Jiong and Xu Fei duet on The Distance of Missing You, then embrace", "es": "He Jiong y Xu Fei cantan a dúo The Distance of Missing You y se abrazan", "ja": "何炅と許飛が『思念的距離』をデュエット、終演後に抱擁"}, "body": {"zh": "11 月 11 日晚的双 11 好六夜晚会上，何炅与许飞时隔多年再度同台，合唱两人联合创作的《思念的距离》——许飞作曲、何炅写词。一曲终了两人相拥，画面在社交平台快速传播。许飞随后晒出合照，特意把与何炅的合影放在 C 位，相关话题持续升温，被不少观众评为今年晚会“最治愈舞台”。", "en": "At the Double 11 gala on 11 November, He Jiong and singer Xu Fei shared a stage for the first time in years to duet The Distance of Missing You, which Xu composed and He wrote the lyrics for. They embraced as the song ended, and the clip spread quickly. Xu later posted photos with He Jiong placed front and centre, and the moment was widely called the most soothing performance of the year's galas.", "es": "En la gala del Doble 11 del 11 de noviembre, He Jiong y la cantante Xu Fei volvieron a compartir escenario tras años para cantar a dúo The Distance of Missing You, compuesta por ella con letra de él. Se abrazaron al terminar y el clip se difundió rápido. Xu publicó después fotos con He Jiong en el centro, y el momento fue calificado como el más reconfortante del año.", "ja": "11 月 11 日夜のダブル 11 のガラで、何炅と歌手の許飛が数年ぶりに同じステージに立ち、二人で作った『思念的距離』をデュエットした。作曲は許飛、作詞は何炅。歌い終わりに抱き合う映像が急速に広がり、許飛が後に何炅との写真を中央に置いて投稿すると話題はさらに加熱。今年のガラで『最も癒やされる舞台』との評価が相次いだ。"}, "why": {"zh": "晚会拼到最后拼的不是阵容，是“有没有一个能被记住的瞬间”。两个老朋友唱一首自己写的歌，比任何舞美都便宜，也更难复制。", "en": "In the end galas are not won on line-up but on whether there is one moment worth remembering. Two old friends singing a song they wrote themselves costs less than any stage design — and is far harder to replicate.", "es": "Al final las galas no se ganan con el cartel, sino con un momento que se recuerde. Dos viejos amigos cantando una canción que escribieron ellos cuesta menos que cualquier escenografía, y es mucho más difícil de replicar.", "ja": "ガラの勝負は最後には出演者ではなく、『記憶に残る一瞬』があるかどうかだ。旧友二人が自分たちで書いた歌を歌うのは、どんな舞台美術より安く、そしてはるかに再現が難しい。"}}, {"idx": "02", "title": {"zh": "赵露思《时尚芭莎》单人双封：24 小时销售额破 1208 万", "en": "Zhao Lusi's double solo cover for Harper's Bazaar: 12.08 million yuan in 24 hours", "es": "Zhao Lusi y su doble portada para Harper's Bazaar: 12,08 millones de yuanes en 24 horas", "ja": "趙露思『ハーパーズ バザー』単独ダブル表紙、24 時間で 1208 万元"}, "body": {"zh": "11 月 11 日，赵露思首登《时尚芭莎》11 月刊单人双封，开售 24 小时全渠道销售额突破 1208 万元、销量超 24.7 万本，拿下芭莎女艺人年度销售额冠军并刷新刊物纪录。同期上架的艺人封面中，其数据明显领先。相关讨论集中在两点：一是单人双封在芭莎的排位意义，二是“粉丝购买力”作为商业指标的权重正在上升。", "en": "Zhao Lusi's first solo double cover for the November issue of Harper's Bazaar China went on sale on 11 November and took 12.08 million yuan across all channels in 24 hours, with more than 247,000 copies sold — the magazine's best-selling female celebrity cover of the year and a new record. Her numbers clearly led other covers released in the same window. Discussion has focused on what a solo double cover signals in the magazine's hierarchy, and on how heavily fan purchasing power now weighs as a commercial metric.", "es": "La primera doble portada en solitario de Zhao Lusi para el número de noviembre de Harper's Bazaar China salió a la venta el 11 de noviembre y logró 12,08 millones de yuanes en todos los canales en 24 horas, con más de 247.000 ejemplares: la portada de una celebridad femenina más vendida del año y un récord de la revista. Sus cifras lideraron con claridad otras portadas del mismo periodo. El debate se centra en lo que una doble portada en solitario significa en la jerarquía de la revista y en el peso del poder de compra de los fans como métrica comercial.", "ja": "趙露思が『ハーパーズ バザー』中国版 11 月号で初の単独ダブル表紙を飾り、11 月 11 日の発売から 24 時間で全チャネル売上が 1208 万元を突破、部数は 24.7 万部超。女性芸能人の年間売上で首位となり、同誌の記録も更新した。同時期の他の表紙を大きく上回る数字だ。議論は、単独ダブル表紙の格付けの意味と、商業指標としてのファンの購買力の重みが増している点に集まる。"}, "why": {"zh": "杂志封面本是品牌曝光位，如今被读成一张“商业成绩单”。当销量可以实时公布，时尚资源的评价体系也就跟着变了——这对艺人是机会，也是硬约束。", "en": "A magazine cover used to be a branding slot; now it is read as a commercial report card. Once sales are published in real time, the way fashion resources are valued changes too — an opportunity for artists, and a hard constraint.", "es": "Una portada era un espacio de marca; hoy se lee como un boletín de resultados comerciales. Cuando las ventas se publican en tiempo real, la forma de valorar los recursos de moda también cambia: oportunidad para el artista y a la vez exigencia dura.", "ja": "雑誌の表紙はかつてブランド露出の場だったが、今は『商業成績表』として読まれる。売上が即時に公表されれば、ファッション資源の評価基準も変わる。芸能人にとっては機会であり、同時に厳しい制約でもある。"}}, {"idx": "03", "title": {"zh": "谢娜自曝与杨迪、沈凌等“温和解约”：产后精力有限，主动放手", "en": "Xie Na on releasing her artists gently: after giving birth she called each one to let them go", "es": "Xie Na revela que liberó a sus artistas con suavidad tras ser madre", "ja": "謝娜が『穏やかな契約解除』を告白、出産後に自ら順次連絡"}, "body": {"zh": "11 月 11 日，谢娜一段采访内容出圈。她首次公开谈到旗下艺人解约往事：生完孩子后精力有限、无法兼顾工作，便主动挨个打电话，与杨迪、沈凌、刘维、于洋等艺人温和解约。她表示过程中没有纠纷、没有捆绑，既体谅自己的状态，也成全艺人的发展。相关内容被大量转发，讨论集中在“经纪关系能不能好聚好散”。", "en": "An interview with Xie Na circulated widely on 11 November in which she spoke for the first time about releasing artists she had signed. After giving birth she found she could not juggle everything, so she called each of them — Yang Di, Shen Ling, Liu Wei, Yu Yang and others — to end their contracts amicably. She said there were no disputes and no strings, that she was being honest about her own capacity and letting them develop elsewhere. Discussion has centred on whether management relationships can end well.", "es": "Una entrevista a Xie Na circuló ampliamente el 11 de noviembre en la que habló por primera vez de cómo liberó a los artistas que representaba. Tras ser madre no podía con todo, así que llamó uno por uno a Yang Di, Shen Ling, Liu Wei, Yu Yang y otros para terminar los contratos de forma amistosa. Dijo que no hubo disputas ni ataduras, que reconocía su propia capacidad y dejaba que ellos crecieran en otro lugar. El debate se centra en si las relaciones de representación pueden terminar bien.", "ja": "11 月 11 日、謝娜のインタビューが大きく拡散した。所属していた芸能人との契約解除について初めて語ったもので、出産後に手が回らなくなり、楊迪、沈凌、劉維、于洋らに一人ずつ電話をかけ、穏やかに契約を終えたという。争いも束縛もなく、自分の状況を受け入れると同時に相手の発展を後押ししたと説明した。『マネジメント関係は気持ちよく終われるのか』という議論が起きている。"}, "why": {"zh": "娱乐圈的合约纠纷看多了，“主动放手”反而成了稀缺品。它说明经纪关系除了利益绑定，还可以有一种成年人的体面退出方式。", "en": "After years of contract fights, letting go voluntarily looks rare. It shows a management relationship can end with dignity, not only with a buyout clause.", "es": "Tras tantos pleitos de contratos, soltar voluntariamente parece raro. Demuestra que una relación de representación puede terminar con dignidad, y no solo con una cláusula de rescisión.", "ja": "契約トラブルを見慣れた目には、『自ら手放す』ことは珍しい。マネジメント関係は利益の拘束だけでなく、大人の作法で終われる場合もあると示している。"}}, {"idx": "04", "title": {"zh": "花滑奥运冠军韩聪 11 月 11 日官宣结婚：文案只有“好好吃饭、好好散步”", "en": "Olympic skating champion Han Cong announces marriage with a two-line note about eating and walking", "es": "El campeón olímpico Han Cong anuncia su boda con dos líneas sobre comer y pasear", "ja": "フィギュア五輪王者の韓聰が 11 月 11 日に結婚発表、文章は『よく食べ、よく散歩する』だけ"}, "body": {"zh": "11 月 11 日，花样滑冰奥运冠军韩聪通过社交账号晒出婚纱照官宣结婚。配文没有一句情话：“红衣和白纱都留在了照片里，往后想和爱人一起好好吃饭、好好散步，天气好就临时去远一点的地方。”通篇不煽情，落点全在日常，被网友称为“最朴素的结婚文案”，相关话题登上热搜。韩聪与隋文静搭档，曾获北京冬奥会双人滑冠军。", "en": "Olympic pairs skating champion Han Cong announced his marriage on 11 November with wedding photos on social media, and a caption with no romance-speak at all: the red robe and the white gown stayed in the pictures; from now on he wants to eat properly and walk properly with his partner, and go somewhere further when the weather is good. Its refusal to be sentimental, landing entirely on daily life, earned it the label of the plainest wedding announcement of the year. Han Cong won pairs gold at the Beijing Winter Olympics with Sui Wenjing.", "es": "El campeón olímpico de patinaje artístico por parejas Han Cong anunció su boda el 11 de noviembre con fotos en redes sociales y un texto sin ninguna frase romántica: el traje rojo y el vestido blanco se quedaron en las fotos; de ahora en adelante quiere comer bien y pasear bien con su pareja, y viajar más lejos cuando haga buen tiempo. Su falta de sentimentalismo, centrada en lo cotidiano, le valió el título del anuncio de boda más sobrio del año. Han Cong ganó el oro por parejas en Pekín 2022 junto a Sui Wenjing.", "ja": "フィギュアスケート・ペアの五輪金メダリスト韓聰が 11 月 11 日、SNS にウェディング写真を投稿して結婚を発表した。文章に恋愛の言葉はなく、『赤い衣装も白いドレスも写真の中に残した。これからは愛する人とよく食べ、よく散歩し、天気が良ければ少し遠くへ出かけたい』とだけ。感傷を排し日常に着地した文体が『最も素朴な結婚報告』と呼ばれ、話題となった。韓聰は隋文静とのペアで北京五輪優勝。"}, "why": {"zh": "运动员的公众形象长期由成绩定义，退役后的生活表达反而更容易打动人。这段文案之所以出圈，是因为它把“冠军”还原成了一个“过日子的人”。", "en": "Athletes are defined in public by results, so how they talk about ordinary life afterwards lands harder. This caption worked because it turned a champion back into someone who simply lives.", "es": "A los deportistas los define el resultado, por eso su forma de hablar de la vida cotidiana después conmueve más. Este texto funcionó porque devolvió al campeón a la condición de alguien que simplemente vive.", "ja": "アスリートの公の姿は成績で定義される。だからこそ引退後の日常の語り方が響く。この文章が刺さったのは、『王者』を『暮らす人』に戻したからだ。"}}, {"idx": "05", "title": {"zh": "Lisa 个人纪录片《Always Lalisa》定档 11 月 18 日，附带全新单曲", "en": "Lisa's documentary Always Lalisa lands on 18 November with a new single", "es": "El documental de Lisa Always Lalisa llega el 18 de noviembre con un nuevo single", "ja": "リサのドキュメンタリー『Always Lalisa』が 11 月 18 日、新曲も同時に"}, "body": {"zh": "11 月 11 日，BLACKPINK 成员 Lisa 的个人纪录片《Always Lalisa》正式官宣，将于 11 月 18 日全球独家上线。片中将曝光她台前幕后的成长日常与舞台花絮，同时附带全新单曲《Leave With Me》。这是继团体活动与个人专辑之后，其个人品牌版图的又一次扩张，歌迷关注点集中在纪录片里的训练与创作过程。", "en": "BLACKPINK's Lisa announced on 11 November that her solo documentary Always Lalisa will premiere exclusively worldwide on 18 November, showing her life on and off stage plus rehearsal footage, accompanied by a new single, Leave With Me. It is another expansion of her solo brand after group releases and her own album, with fans most curious about the training and studio process it promises to show.", "es": "Lisa, de BLACKPINK, anunció el 11 de noviembre que su documental en solitario Always Lalisa se estrenará en exclusiva mundial el 18 de noviembre, con su vida en escena y fuera de ella, además de material de ensayos, y un nuevo single, Leave With Me. Es otra ampliación de su marca personal tras los lanzamientos del grupo y su álbum, y los fans se interesan sobre todo por el proceso de entrenamiento y creación.", "ja": "BLACKPINK のリサが 11 月 11 日、ソロドキュメンタリー『Always Lalisa』を 11 月 18 日に世界独占配信すると発表した。舞台裏の日常やリハーサル映像が収められ、新曲『Leave With Me』も発表される。グループ活動とソロアルバムに続く個人ブランドの拡張であり、ファンは練習と制作の過程に注目している。"}, "why": {"zh": "纪录片正在成为顶级艺人的标准配置——它比采访更可控，比综艺更“真实”，是把流量沉淀成长期资产的一种低成本方式。", "en": "Documentaries have become standard equipment for top artists: more controllable than interviews and more “real” than variety shows, a cheap way to turn traffic into a long-term asset.", "es": "Los documentales se han vuelto equipo estándar de los grandes artistas: más controlables que una entrevista y más “reales” que un programa de variedades, una forma barata de convertir el tráfico en activo a largo plazo.", "ja": "ドキュメンタリーはトップ芸能人の標準装備になりつつある。インタビューより制御でき、バラエティより『本物』に見える。流量を長期資産に変える低コストな方法だ。"}}]}], "risk": {"zh": "风险提示：本简报仅作信息汇总，其中涉及的数据不构成任何投资建议。", "en": "Risk notice: this briefing is a summary of information only; the data involved does not constitute investment advice.", "es": "Aviso de riesgo: este boletín es solo un resumen informativo y los datos citados no constituyen asesoramiento de inversión.", "ja": "リスク表示：本ブリーフィングは情報要約のみを目的としており、記載のデータは投資助言を構成するものではありません。"}}/*__END__*/;

    var hl = T(hlObj, lang);
    var inner = esc(title);
    if (hl && title.indexOf(hl) >= 0) {
      var i = title.indexOf(hl);
      inner = esc(title.slice(0, i)) + '<span class="hl">' + esc(hl) + "</span>" + esc(title.slice(i + hl.length));
    }
    return '<a class="lk" href="' + bing(title) + '" target="_blank" rel="noopener">' + inner + "</a>";
  }

  /* ===== 语言检测：localStorage > 浏览器语言 > 系统时区 > 中文 ===== */
  function detectLang() {
    try { var s = localStorage.getItem("timab_lang"); if (s && LANGS.indexOf(s) >= 0) return s; } catch (e) {}
    var nav = (navigator.language || "").toLowerCase();
    if (/^zh/.test(nav)) return "zh";
    if (/^ja/.test(nav)) return "ja";
    if (/^es/.test(nav)) return "es";
    if (/^en/.test(nav)) return "en";
    var tz = "";
    try { tz = Intl.DateTimeFormat().resolvedOptions().timeZone || ""; } catch (e) {}
    if (/^Asia\/Tokyo/.test(tz)) return "ja";
    if (/Europe\/Madrid|America\/(Mexico_City|Bogota|Lima|Santiago|Caracas|Guatemala|La_Paz|San_Jose|Panama|Asuncion|Montevideo|Havana|El_Salvador|Managua|Tegucigalpa|Costa_Rica|San_Salvador)|America\/Argentina\//.test(tz)) return "es";
    if (/^(Europe|America|Australia)\//.test(tz)) return "en";
    return "zh";
  }

  var curLang = "zh";
  var langOpen = false;

  /* ===== 渲染 ===== */
  function renderChrome(lang) {
    var i18n = I18N[lang];
    document.documentElement.lang = LANG_HTML[lang];
    // 报头信息行
    var metaEl = document.getElementById("metaRow");
    if (metaEl) metaEl.textContent = T(BRIEFING.meta, lang);
    // 大日期
    var md = document.getElementById("mastDate");
    if (md) {
      var d = new Date(BRIEFING.date + "T00:00:00");
      md.innerHTML = fmtDate(d, lang) + "<small>" + esc(i18n.dateSub) + "</small>";
    }
    // 文档标题
    var siteName = (lang === "zh") ? "提马早报" : "TIMAB DAILY";
    document.title = siteName + " · " + fmtDate(new Date(BRIEFING.date + "T00:00:00"), lang);
    // 导航签
    var nav = document.getElementById("navChips");
    if (nav) {
      var order = ["pick"].concat(BRIEFING.sections.map(function (s) { return s.key; }));
      nav.innerHTML = "";
      order.forEach(function (key) {
        if (key === "pick") {
          var a = document.createElement("a");
          a.className = "chip-pick"; a.href = "#pick"; a.setAttribute("data-nav", "pick");
          a.textContent = T(BRIEFING.spotlight.badge, lang);
          nav.appendChild(a);
        } else {
          var sec = null;
          BRIEFING.sections.forEach(function (s) { if (s.key === key) sec = s; });
          if (!sec) return;
          var b = document.createElement("a");
          b.href = "#" + key; b.setAttribute("data-nav", key);
          b.style.borderColor = sec.color; b.style.color = sec.deep;
          b.textContent = T(sec.name, lang);
          nav.appendChild(b);
        }
      });
    }
    // 日历文案
    var cb = document.getElementById("calBtnText"); if (cb) cb.textContent = i18n.calBtn;
    var cw = document.getElementById("calWeek");
    if (cw) { cw.innerHTML = ""; i18n.calWeek.forEach(function (w) { var s = document.createElement("span"); s.textContent = w; cw.appendChild(s); }); }
    var cf = document.getElementById("calFoot"); if (cf) cf.textContent = i18n.calFoot;
    // 语言切换器（国旗触发 + 下拉）
    var ls = document.getElementById("langSwitch");
    if (ls) {
      ls.className = "lang-switch" + (langOpen ? " open" : "");
      ls.innerHTML = "";
      var trig = document.createElement("button");
      trig.type = "button"; trig.className = "lang-trigger"; trig.id = "langTrigger";
      trig.setAttribute("aria-haspopup", "true");
      trig.setAttribute("aria-expanded", langOpen ? "true" : "false");
      trig.innerHTML = flag(curLang) + '<span class="caret">▾</span>';
      trig.addEventListener("click", function (e) {
        e.stopPropagation();
        langOpen = !langOpen;
        ls.classList.toggle("open", langOpen);
        trig.setAttribute("aria-expanded", langOpen ? "true" : "false");
      });
      ls.appendChild(trig);
      var menu = document.createElement("div");
      menu.className = "lang-menu"; menu.setAttribute("role", "menu");
      LANGS.forEach(function (l) {
        var item = document.createElement("button");
        item.type = "button"; item.className = "lang-item" + (l === curLang ? " sel" : "");
        item.setAttribute("role", "menuitem"); item.setAttribute("data-lang", l);
        item.innerHTML = flag(l) + '<span class="lbl">' + LANG_LABEL_FULL[l] + "</span>";
        item.addEventListener("click", function (e) {
          e.stopPropagation();
          setLang(l);
        });
        menu.appendChild(item);
      });
      ls.appendChild(menu);
    }
  }

  function renderContent(lang) {
    var i18n = I18N[lang];
    var html = "";
    // 精选
    var sp = BRIEFING.spotlight;
    html += '<section class="spotlight" id="pick">'
      + '<div class="badge"><i></i>' + esc(T(sp.badge, lang)) + "</div>"
      + "<h2>" + titleHtml(sp.title, sp.hl, lang) + "</h2>"
      + '<div class="body">' + esc(T(sp.body, lang)) + "</div>"
      + '<div class="why"><b>' + esc(i18n.why) + "</b>" + esc(T(sp.why, lang)) + "</div>"
      + "</section>";
    // 分类
    html += '<div class="grid">';
    BRIEFING.sections.forEach(function (sec) {
      html += '<section class="card" id="' + sec.key + '" style="--ac:' + sec.color + "; --ac-deep:" + sec.deep + ';">'
        + '<div class="sec-head"><span class="sec-num">' + sec.num + "</span>"
        + "<h3>" + esc(T(sec.name, lang)) + "</h3>"
        + '<span class="en">' + sec.key.toUpperCase() + "</span></div>";
      (sec.items || []).forEach(function (it) {
        html += '<div class="item">';
        html += '<div class="t"><span class="idx">' + it.idx + "</span>";
        if (it.tag) html += '<span class="tag">' + esc(it.tag[lang] != null ? it.tag[lang] : i18n.tag) + "</span>";
        html += titleHtml(it.title, it.hl, lang) + "</div>";
        html += '<div class="d">' + esc(T(it.body, lang)) + "</div>";
        html += '<div class="why"><b>' + esc(i18n.why) + "</b>" + esc(T(it.why, lang)) + "</div>";
        html += "</div>";
      });
      html += "</section>";
    });
    html += "</div>";
    var content = document.getElementById("content");
    if (content) content.innerHTML = html;
    // 页脚
    var risk = document.getElementById("risk");
    if (risk) risk.textContent = T(BRIEFING.risk, lang);
  }

  function setLang(lang) {
    if (LANGS.indexOf(lang) < 0) lang = "zh";
    curLang = lang;
    langOpen = false;
    try { localStorage.setItem("timab_lang", lang); } catch (e) {}
    renderChrome(lang);
    renderContent(lang);
  }

  /* ===== 往期日历（保留原逻辑，文案随语言） ===== */
  function initCalendar() {
    var btn = document.getElementById("calBtn");
    var pop = document.getElementById("calPop");
    var grid = document.getElementById("calGrid");
    var title = document.getElementById("calTitle");
    if (!btn || !pop || !grid || !title) return;

    var parts = BRIEFING.date.split("-");
    var todayKey = parts[0].slice(2) + parts[1] + parts[2];
    var cur = { y: +parts[0], m: +parts[1] };
    var has = {};
    for (var i = 0; i < ARCHIVE_DATES.length; i++) { has[ARCHIVE_DATES[i]] = 1; }
    var HIST_BASE = /\/history\//.test(location.pathname) ? "./" : "history/";

    function ckey(y, m, d) { return String(y).slice(2) + pad(m) + pad(d); }

    function render() {
      var i18n = I18N[curLang];
      title.textContent = i18n.calTitle(cur.y, cur.m);
      grid.innerHTML = "";
      var start = new Date(cur.y, cur.m - 1, 1).getDay();
      var days = new Date(cur.y, cur.m, 0).getDate();
      for (var b = 0; b < start; b++) {
        var blank = document.createElement("span");
        blank.className = "cal-cell is-empty"; grid.appendChild(blank);
      }
      for (var d = 1; d <= days; d++) {
        var k = ckey(cur.y, cur.m, d);
        var cell = document.createElement("span");
        cell.className = "cal-cell" + (has[k] ? " has" : "") + (k === todayKey ? " is-today" : "");
        cell.textContent = d;
        if (has[k]) {
          cell.setAttribute("role", "link"); cell.setAttribute("tabindex", "0");
          cell.title = cur.y + "-" + pad(cur.m) + "-" + pad(d) + " 存档";
          (function (target) {
            var go = function () { window.open(HIST_BASE + target + ".html", "_blank", "noopener"); };
            cell.addEventListener("click", go);
            cell.addEventListener("keydown", function (e) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); go(); } });
          })(k);
        }
        grid.appendChild(cell);
      }
    }
    function toggle(open) {
      pop.hidden = !open;
      btn.setAttribute("aria-expanded", open ? "true" : "false");
      if (open) render();
    }
    btn.addEventListener("click", function (e) { e.stopPropagation(); toggle(pop.hidden); });
    document.getElementById("calPrev").addEventListener("click", function () { cur.m--; if (cur.m < 1) { cur.m = 12; cur.y--; } render(); });
    document.getElementById("calNext").addEventListener("click", function () { cur.m++; if (cur.m > 12) { cur.m = 1; cur.y++; } render(); });
    document.addEventListener("click", function (e) { if (!pop.hidden && !pop.contains(e.target)) toggle(false); });
    document.addEventListener("keydown", function (e) { if (e.key === "Escape" && !pop.hidden) toggle(false); });
  }

  /* ===== 启动 ===== */
  function boot() {
    curLang = detectLang();
    renderChrome(curLang);
    renderContent(curLang);
    initCalendar();
    // 关闭语言下拉：点击外部 / Esc
    document.addEventListener("click", function (e) {
      var ls = document.getElementById("langSwitch");
      if (ls && langOpen && !ls.contains(e.target)) {
        langOpen = false;
        ls.classList.remove("open");
        var t = document.getElementById("langTrigger");
        if (t) t.setAttribute("aria-expanded", "false");
      }
    });
    document.addEventListener("keydown", function (e) {
      if (e.key === "Escape" && langOpen) {
        langOpen = false;
        var ls = document.getElementById("langSwitch");
        if (ls) ls.classList.remove("open");
        var t = document.getElementById("langTrigger");
        if (t) t.setAttribute("aria-expanded", "false");
      }
    });
  }
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", boot);
  } else { boot(); }
})();
</script>
