añadió que nunca reveló información identificable.", "ja": "バラエティー番組の放送後、蘇醒のスタジオでの発言が、他人の発言を遮る、共感に欠けると一部視聴者から批判された。ある利用者が小红书に不満を投稿し、蘇醒は認証アカウントでコメントし、さらに別アカウントでその投稿のスクリーンショットを微博に載せたため、一般人晒しとの指摘を招いた。11月1日夜、本人は明確にしておく、蘇醒が一般人を晒した、そんな事実はない、認めないと投稿し、特定できる情報は一切出していないと述べた。"}, "why": {"zh": "明星和素人的话语权天然不对等，这是这类争议永远吵不完的原因；截图里就算打了码，粉丝也能顺着找到人——所以「我打了码」和「我没有施压」并不是同一件事。", "en": "Celebrity and private-citizen reach are structurally unequal, which is why this argument never ends: even with a blurred name, fans can find the person. I masked it and I applied no pressure are not the same claim.", "es": "El alcance de una celebridad y el de un ciudadano común son estructuralmente desiguales, y por eso esta discusión no termina: aunque se difumine el nombre, los fans encuentran a la persona. Lo tapé y no presioné no son la misma afirmación.", "ja": "有名人と一般人の発信力は構造的に不平等で、この議論が終わらない理由もそこにある。名前をぼかしても、ファンは本人にたどり着ける。ぼかしたと圧力をかけていないは同じ主張ではない。"}}, {"idx": "03", "title": {"zh": "《后会友期》正片紧急重剪，删掉争议台词", "en": "Variety show re-edited to remove disputed lines", "es": "Un programa se remonta para eliminar frases polémicas", "ja": "バラエティーが急遽再編集 物議を醸した台詞を削除"}, "body": {"zh": "综艺《后会友期》因嘉宾文吉儿与王子璇的「闺蜜对质」片段引发大量讨论。有网友发现，舆论发酵后正片被重新剪辑，争议台词与配套镜头被调整删除。这一操作在综艺行业并不常见，反而引来对节目真实性的进一步质疑。节目中许飞与厉娜、张萌与马天宇等几组旧友的和解线仍在推进。", "en": "A segment in which two old friends confronted each other on a variety show drew heavy discussion. Viewers then noticed the episode had been re-cut, with the disputed lines and accompanying shots adjusted or removed. Such re-editing is rare in Chinese variety production and instead deepened doubts about authenticity. Other reunion storylines on the show are still unfolding.", "es": "Un segmento en el que dos viejas amigas se enfrentaban en un programa de variedades generó un intenso debate. Los espectadores notaron después que el episodio había sido remontado, con las frases discutidas y los planos asociados ajustados o eliminados. Ese tipo de remontaje es poco habitual en la producción china de variedades y aumentó las dudas sobre la autenticidad. Otras tramas de reencuentro siguen avanzando.", "ja": "バラエティー番組で旧友同士が対峙する場面が大きな議論を呼んだ。その後、放送済みの本編が再編集され、物議を醸した台詞と関連カットが調整・削除されたことが視聴者に指摘された。中国のバラエティー制作では異例の対応で、むしろ番組の真正性への疑いを深めた。番組内の他の再会の物語は進行中だ。"}, "why": {"zh": "删台词是最糟的公关选择之一——它同时承认了「这段有问题」和「我们不想让你看」，而观众对「被删掉的内容」的兴趣，永远大于对已播内容的兴趣。", "en": "Cutting lines is one of the worst PR choices available: it simultaneously admits the segment was a problem and signals that you do not want it seen. Audiences are always more interested in what was removed than in what aired.", "es": "Cortar frases es una de las peores decisiones de comunicación posibles: admite a la vez que el segmento era un problema y que no quieres que se vea. El público siempre se interesa más por lo eliminado que por lo emitido.", "ja": "台詞の削除は最も拙い広報判断の一つだ。この場面に問題があったと見せたくないを同時に認めることになり、観客は放送された内容より削られた内容に常に関心を持つ。"}}, {"idx": "04", "title": {"zh": "《永夜星河》开播两周年：16.44 亿播放，13 城大屏应援", "en": "Two years on, the drama still draws 1.64 billion plays and 13-city billboards", "es": "Dos años después, la serie sigue sumando 1.644 millones de reproducciones", "ja": "永夜星河が放送2周年 再生16.44億回、13都市で大画面応援"}, "body": {"zh": "11 月 1 日，剧集《永夜星河》迎来开播两周年。腾讯视频发布两周年特辑，制片人此前预告的新物料如约释出；粉丝在 13 座城市投放线下大屏应援。据猫眼专业版数据，该剧累计有效播放超 16.44 亿，最高热度 9879.76，仍是腾讯视频 24 岁以下用户拉新第一的真人剧。", "en": "The costume drama marked two years since its premiere on 1 November. Tencent Video released an anniversary special and the new material the producer had teased, while fans bought outdoor billboards in 13 cities. Maoyan data puts cumulative plays above 1.644 billion with a peak heat index of 9,879.76, and it remains the live-action series that brings Tencent Video the most new users under 24.", "es": "La serie de época cumplió dos años desde su estreno el 1 de noviembre. Tencent Video publicó un especial de aniversario y el material nuevo que el productor había adelantado, mientras los fans compraron pantallas en 13 ciudades. Los datos de Maoyan sitúan las reproducciones acumuladas por encima de 1.644 millones, con un pico de índice de calor de 9.879,76, y sigue siendo la serie de imagen real que más usuarios menores de 24 años atrae a la plataforma.", "ja": "11月1日、時代劇「永夜星河」が放送2周年を迎えた。騰訊視頻は記念特集を公開し、プロデューサーが予告していた新素材も公開された。ファンは13都市で屋外大画面の応援広告を出した。猫眼のデータでは累計再生は16.44億回超、最高熱度は9879.76で、24歳以下の新規ユーザー獲得で依然トップの実写ドラマだという。"}, "why": {"zh": "一部「穿书+系统」设定的古偶能在两年后还被反复回看，靠的不是设定，而是它把「牺牲叙事」调了个方向——凌妙妙的终点不是攻略成功，是成为自己。设定决定一部剧能不能被打开，内核决定它会不会被重看。", "en": "A period romance built on a transmigration-plus-system premise is still being rewatched two years later — not because of the premise but because it flips the sacrifice narrative: the heroine's goal is not to win the male lead but to become herself. Premise gets a show opened; core gets it rewatched.", "es": "Una serie de época construida sobre un viaje a otro mundo con sistema se sigue revisando dos años después, no por la premisa sino porque invierte el relato del sacrificio: el objetivo de la protagonista no es conquistar al galán sino convertirse en ella misma. La premisa hace que la abran; el núcleo hace que la repitan.", "ja": "転生とシステムという設定の時代劇が2年後も見返されるのは、設定の力ではない。犠牲の物語の向きを変えたからだ。主人公の到達点は攻略の成功ではなく、自分自身になること。設定は作品を開かせ、中身が繰り返し見させる。"}}, {"idx": "05", "tag": {"zh": "进展"}, "title": {"zh": "金鸡影展今日 12 时开票，国产电影展 15 部新片", "en": "Golden Rooster screenings open ticket sales at noon, with 15 new mainland films", "es": "El festival de Xiamen abre la venta de entradas con 15 estrenos chinos", "ja": "金鶏映画祭が今日12時にチケット発売 中国映画展は15本"}, "body": {"zh": "第 39 届中国电影金鸡奖影展于 11 月 2 日 12 时正式开票，展映期为 11 月 6 日至 29 日，主展映影城为厦门万象影城。其中国产电影展 11 月 6 日至 10 日展映 15 部新片：开幕片《明天，会更好》（陈可辛执导，周迅、王骁、田壮壮主演）国内首映，闭幕片《无名女孩》（邹静执导）曾入围第 79 届戛纳电影节影评人周长片竞赛。电影节 11 月 6 日至 10 日在厦门举办，11 月 10 日颁奖。", "en": "Tickets for the 39th Golden Rooster film screenings go on sale at 12:00 on 2 November, with screenings running from 6 to 29 November at the Wanda Cinema in Xiamen. The mainland section shows 15 new features from 6 to 10 November: the opener is Peter Chan's The Road Not Taken starring Zhou Xun, Wang Xiao and Tian Zhuangzhuang, making its mainland premiere, and the closing film is Zou Jing's A Girl Unknown, which screened in Critics' Week at the 79th Cannes festival. The festival runs 6-10 November in Xiamen, with the awards on 10 November.", "es": "Las entradas de la 39.ª edición de las proyecciones de los Golden Rooster salen a la venta a las 12:00 del 2 de noviembre, con funciones del 6 al 29 de noviembre en el cine Wanda de Xiamen. La sección continental proyecta 15 nuevos largometrajes del 6 al 10: abre The Road Not Taken, de Peter Chan, con Zhou Xun, Wang Xiao y Tian Zhuangzhuang, en estreno continental, y cierra A Girl Unknown, de Zou Jing, que pasó por la Semana de la Crítica del 79.º Festival de Cannes. El festival se celebra del 6 al 10 de noviembre y los premios se entregan el 10.", "ja": "第39回金鶏映画祭の上映チケットが11月2日12時に発売される。上映は11月6日から29日まで、厦門の万象影城が主会場。中国映画展は11月6日から10日まで新作15本を上映し、開幕作は陳可辛監督の明天，会更好（周迅、王驍、田壮壮出演）の中国本土初上映、閉幕作は鄒静監督の無名女孩で、第79回カンヌ国際映画祭の批評家週間に出品された。映画祭は11月6日から10日まで厦門で開かれ、10日に授賞式が行われる。"}, "why": {"zh": "影展片单往往比颁奖结果更能说明行业风向：15 部里绝大多数是青年导演的长片首作或第二部，「状态的真实」取代了完整叙事，这届金鸡真正想推的是下一批人。", "en": "A festival line-up often says more about where the industry is heading than the prize results do: most of the 15 are first or second features by young directors, with the truth of a state of being replacing tidy plotting. What this edition is really promoting is the next group of filmmakers.", "es": "La programación suele decir más sobre hacia dónde va la industria que los premios: la mayoría de los 15 son primeros o segundos largometrajes de directores jóvenes, con la verdad de un estado en lugar de tramas ordenadas. Lo que esta edición impulsa es la siguiente generación.", "ja": "ラインナップは受賞結果より業界の向かう先を語ることが多い。15本の大半は若手監督の長編1作目か2作目で、整った物語よりも状態のリアルさが前に出ている。今回の金鶏が本当に押し出したいのは次の世代だ。"}}]}], "risk": {"zh": "风险提示：本简报仅作信息汇总，其中涉及的数据不构成任何投资建议。", "en": "Risk notice: this briefing is a summary of information only. The figures it contains do not constitute investment advice.", "es": "Aviso de riesgo: este boletín es solo un resumen informativo. Los datos que contiene no constituyen asesoramiento de inversión.", "ja": "リスク警告：本ブリーフィングは情報の要約であり、記載されたデータは投資助言を構成するものではありません。"}}/*__END__*/;

  /* ===== UI 文案（与内容分离，四语齐全） ===== */
  var I18N = {
    "zh": {
      "dateSub": "每日简报", "calBtn": "往期日历", "calFoot": "带圆点的日期可查看当日存档",
      "tag": "进展", "why": "看点：", "badge": "精 选",
      "calWeek": ["日", "一", "二", "三", "四", "五", "六"],
      "calTitle": function (y, m) { return y + " 年 " + m + " 月"; }
    },
    "en": {
      "dateSub": "DAILY BRIEFING", "calBtn": "Archive", "calFoot": "Dots mark dates with a saved issue",
      "tag": "UPDATE", "why": "Why: ", "badge": "EDITOR'S PICK",
      "calWeek": ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"],
      "calTitle": function (y, m) { return ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][m-1] + " " + y; }
    },
    "es": {
      "dateSub": "BOLETÍN DIARIO", "calBtn": "Archivo", "calFoot": "Los puntos marcan fechas con ejemplar guardado",
      "tag": "ACTUALIZACIÓN", "why": "Por qué: ", "badge": "DESTACADO",
      "calWeek": ["Dom", "Lun", "Mar", "Mié", "Jue", "Vie", "Sáb"],
      "calTitle": function (y, m) { return m + " · " + y; }
    },
    "ja": {
      "dateSub": "デイリーブリーフィング", "calBtn": "バックナンバー", "calFoot": "点のついた日付は保存された号があります",
      "tag": "続報", "why": "見どころ：", "badge": "特集",
      "calWeek": ["日", "月", "火", "水", "木", "金", "土"],
      "calTitle": function (y, m) { return y + "年" + m + "月"; }
    }
  };
  var LANGS = ["zh", "en", "es", "ja"];
  var LANG_LABEL = { "zh": "中文", "en": "EN", "es": "ES", "ja": "日本語" };
  var LANG_LABEL_FULL = { "zh": "中文", "en": "English", "es": "Español", "ja": "日本語" };
  var LANG_HTML = { "zh": "zh-CN", "en": "en", "es": "es", "ja": "ja" };

  // 小国旗（内联 SVG，避免外部图标依赖与 emoji 平台差异）
  function flag(lang) {
    if (lang === "zh") return '<svg class="fl" viewBox="0 0 30 20" aria-hidden="true"><rect width="30" height="20" fill="#de2910"/><g fill="#ffde00"><circle cx="5" cy="4" r="2.2"/><circle cx="9" cy="2.4" r="0.8"/><circle cx="10" cy="4" r="0.8"/><circle cx="9" cy="5.6" r="0.8"/><circle cx="7" cy="6.6" r="0.8"/></g></svg>';
    if (lang === "en") return '<svg class="fl" viewBox="0 0 30 20" aria-hidden="true"><rect width="30" height="20" fill="#012169"/><path d="M0 0L30 20M30 0L0 20" stroke="#fff" stroke-width="4"/><path d="M0 0L30 20M30 0L0 20" stroke="#c8102e" stroke-width="2"/><rect x="13" width="4" height="20" fill="#fff"/><rect y="8" width="30" height="4" fill="#fff"/><rect x="14" width="2" height="20" fill="#c8102e"/><rect y="9" width="30" height="2" fill="#c8102e"/></svg>';
    if (lang === "es") return '<svg class="fl" viewBox="0 0 30 20" aria-hidden="true"><rect width="30" height="20" fill="#aa151b"/><rect y="5" width="30" height="10" fill="#f1bf00"/></svg>';
    return '<svg class="fl" viewBox="0 0 30 20" aria-hidden="true"><rect width="30" height="20" fill="#fff"/><circle cx="15" cy="10" r="5.5" fill="#bc002d"/></svg>';
  }

  /* ===== 工具 ===== */
  function T(obj, lang) {
    if (obj == null) return "";
    if (typeof obj === "string") return obj;
    if (obj[lang] != null) return obj[lang];
    return obj.zh != null ? obj.zh : "";
  }
  function pad(n) { return n < 10 ? "0" + n : "" + n; }
  function bing(q) { return "https://www.bing.com/search?q=" + encodeURIComponent(q); }
  function fmtDate(d, lang) {
    var y = d.getFullYear(), m = d.getMonth() + 1, day = d.getDate();
    if (lang === "zh") return y + "." + pad(m) + "." + pad(day);
    if (lang === "ja") return y + "年" + m + "月" + day + "日";
    if (lang === "es") return day + " " + ["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"][m-1] + " " + y;
    return ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][m-1] + " " + day + ", " + y;
  }
  function esc(s) {
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }
  function titleHtml(titleObj, hlObj, lang) {
    var title = T(titleObj, lang);
    var hl = T(hlObj, lang);
    var inner = esc(title);
    if (hl && title.indexOf(hl) >= 0) {
      var i = title.indexOf(hl);
      inner = esc(title.slice(0, i)) + '<span class="hl">' + esc(hl) + "</span>" + esc(title.slice(i + hl.length));
    }
    return '<a class="lk" href="' + bing(title) + '" target="_blank" rel="noopener">' + inner + "</a>";
  }

  /* ===== 语言检测：localStorage > 浏览器语言 > 系统时区 > 中文 ===== */
  function detectLang() {
    try { var s = localStorage.getItem("timab_lang"); if (s && LANGS.indexOf(s) >= 0) return s; } catch (e) {}
    var nav = (navigator.language || "").toLowerCase();
    if (/^zh/.test(nav)) return "zh";
    if (/^ja/.test(nav)) return "ja";
    if (/^es/.test(nav)) return "es";
    if (/^en/.test(nav)) return "en";
    var tz = "";
    try { tz = Intl.DateTimeFormat().resolvedOptions().timeZone || ""; } catch (e) {}
    if (/^Asia\/Tokyo/.test(tz)) return "ja";
    if (/Europe\/Madrid|America\/(Mexico_City|Bogota|Lima|Santiago|Caracas|Guatemala|La_Paz|San_Jose|Panama|Asuncion|Montevideo|Havana|El_Salvador|Managua|Tegucigalpa|Costa_Rica|San_Salvador)|America\/Argentina\//.test(tz)) return "es";
    if (/^(Europe|America|Australia)\//.test(tz)) return "en";
    return "zh";
  }

  var curLang = "zh";
  var langOpen = false;

  /* ===== 渲染 ===== */
  function renderChrome(lang) {
    var i18n = I18N[lang];
    document.documentElement.lang = LANG_HTML[lang];
    // 报头信息行
    var metaEl = document.getElementById("metaRow");
    if (metaEl) metaEl.textContent = T(BRIEFING.meta, lang);
    // 大日期
    var md = document.getElementById("mastDate");
    if (md) {
      var d = new Date(BRIEFING.date + "T00:00:00");
      md.innerHTML = fmtDate(d, lang) + "<small>" + esc(i18n.dateSub) + "</small>";
    }
    // 文档标题
    var siteName = (lang === "zh") ? "提马早报" : "TIMAB DAILY";
    document.title = siteName + " · " + fmtDate(new Date(BRIEFING.date + "T00:00:00"), lang);
    // 导航签
    var nav = document.getElementById("navChips");
    if (nav) {
      var order = ["pick"].concat(BRIEFING.sections.map(function (s) { return s.key; }));
      nav.innerHTML = "";
      order.forEach(function (key) {
        if (key === "pick") {
          var a = document.createElement("a");
          a.className = "chip-pick"; a.href = "#pick"; a.setAttribute("data-nav", "pick");
          a.textContent = T(BRIEFING.spotlight.badge, lang);
          nav.appendChild(a);
        } else {
          var sec = null;
          BRIEFING.sections.forEach(function (s) { if (s.key === key) sec = s; });
          if (!sec) return;
          var b = document.createElement("a");
          b.href = "#" + key; b.setAttribute("data-nav", key);
          b.style.borderColor = sec.color; b.style.color = sec.deep;
          b.textContent = T(sec.name, lang);
          nav.appendChild(b);
        }
      });
    }
    // 日历文案
    var cb = document.getElementById("calBtnText"); if (cb) cb.textContent = i18n.calBtn;
    var cw = document.getElementById("calWeek");
    if (cw) { cw.innerHTML = ""; i18n.calWeek.forEach(function (w) { var s = document.createElement("span"); s.textContent = w; cw.appendChild(s); }); }
    var cf = document.getElementById("calFoot"); if (cf) cf.textContent = i18n.calFoot;
    // 语言切换器（国旗触发 + 下拉）
    var ls = document.getElementById("langSwitch");
    if (ls) {
      ls.className = "lang-switch" + (langOpen ? " open" : "");
      ls.innerHTML = "";
      var trig = document.createElement("button");
      trig.type = "button"; trig.className = "lang-trigger"; trig.id = "langTrigger";
      trig.setAttribute("aria-haspopup", "true");
      trig.setAttribute("aria-expanded", langOpen ? "true" : "false");
      trig.innerHTML = flag(curLang) + '<span class="caret">▾</span>';
      trig.addEventListener("click", function (e) {
        e.stopPropagation();
        langOpen = !langOpen;
        ls.classList.toggle("open", langOpen);
        trig.setAttribute("aria-expanded", langOpen ? "true" : "false");
      });
      ls.appendChild(trig);
      var menu = document.createElement("div");
      menu.className = "lang-menu"; menu.setAttribute("role", "menu");
      LANGS.forEach(function (l) {
        var item = document.createElement("button");
        item.type = "button"; item.className = "lang-item" + (l === curLang ? " sel" : "");
        item.setAttribute("role", "menuitem"); item.setAttribute("data-lang", l);
        item.innerHTML = flag(l) + '<span class="lbl">' + LANG_LABEL_FULL[l] + "</span>";
        item.addEventListener("click", function (e) {
          e.stopPropagation();
          setLang(l);
        });
        menu.appendChild(item);
      });
      ls.appendChild(menu);
    }
  }

  function renderContent(lang) {
    var i18n = I18N[lang];
    var html = "";
    // 精选
    var sp = BRIEFING.spotlight;
    html += '<section class="spotlight" id="pick">'
      + '<div class="badge"><i></i>' + esc(T(sp.badge, lang)) + "</div>"
      + "<h2>" + titleHtml(sp.title, sp.hl, lang) + "</h2>"
      + '<div class="body">' + esc(T(sp.body, lang)) + "</div>"
      + '<div class="why"><b>' + esc(i18n.why) + "</b>" + esc(T(sp.why, lang)) + "</div>"
      + "</section>";
    // 分类
    html += '<div class="grid">';
    BRIEFING.sections.forEach(function (sec) {
      html += '<section class="card" id="' + sec.key + '" style="--ac:' + sec.color + "; --ac-deep:" + sec.deep + ';">'
        + '<div class="sec-head"><span class="sec-num">' + sec.num + "</span>"
        + "<h3>" + esc(T(sec.name, lang)) + "</h3>"
        + '<span class="en">' + sec.key.toUpperCase() + "</span></div>";
      (sec.items || []).forEach(function (it) {
        html += '<div class="item">';
        html += '<div class="t"><span class="idx">' + it.idx + "</span>";
        if (it.tag) html += '<span class="tag">' + esc(it.tag[lang] != null ? it.tag[lang] : i18n.tag) + "</span>";
        html += titleHtml(it.title, it.hl, lang) + "</div>";
        html += '<div class="d">' + esc(T(it.body, lang)) + "</div>";
        html += '<div class="why"><b>' + esc(i18n.why) + "</b>" + esc(T(it.why, lang)) + "</div>";
        html += "</div>";
      });
      html += "</section>";
    });
    html += "</div>";
    var content = document.getElementById("content");
    if (content) content.innerHTML = html;
    // 页脚
    var risk = document.getElementById("risk");
    if (risk) risk.textContent = T(BRIEFING.risk, lang);
  }

  function setLang(lang) {
    if (LANGS.indexOf(lang) < 0) lang = "zh";
    curLang = lang;
    langOpen = false;
    try { localStorage.setItem("timab_lang", lang); } catch (e) {}
    renderChrome(lang);
    renderContent(lang);
  }

  /* ===== 往期日历（保留原逻辑，文案随语言） ===== */
  function initCalendar() {
    var btn = document.getElementById("calBtn");
    var pop = document.getElementById("calPop");
    var grid = document.getElementById("calGrid");
    var title = document.getElementById("calTitle");
    if (!btn || !pop || !grid || !title) return;

    var parts = BRIEFING.date.split("-");
    var todayKey = parts[0].slice(2) + parts[1] + parts[2];
    var cur = { y: +parts[0], m: +parts[1] };
    var has = {};
    for (var i = 0; i < ARCHIVE_DATES.length; i++) { has[ARCHIVE_DATES[i]] = 1; }
    var HIST_BASE = /\/history\//.test(location.pathname) ? "./" : "history/";

    function ckey(y, m, d) { return String(y).slice(2) + pad(m) + pad(d); }

    function render() {
      var i18n = I18N[curLang];
      title.textContent = i18n.calTitle(cur.y, cur.m);
      grid.innerHTML = "";
      var start = new Date(cur.y, cur.m - 1, 1).getDay();
      var days = new Date(cur.y, cur.m, 0).getDate();
      for (var b = 0; b < start; b++) {
        var blank = document.createElement("span");
        blank.className = "cal-cell is-empty"; grid.appendChild(blank);
      }
      for (var d = 1; d <= days; d++) {
        var k = ckey(cur.y, cur.m, d);
        var cell = document.createElement("span");
        cell.className = "cal-cell" + (has[k] ? " has" : "") + (k === todayKey ? " is-today" : "");
        cell.textContent = d;
        if (has[k]) {
          cell.setAttribute("role", "link"); cell.setAttribute("tabindex", "0");
          cell.title = cur.y + "-" + pad(cur.m) + "-" + pad(d) + " 存档";
          (function (target) {
            var go = function () { window.open(HIST_BASE + target + ".html", "_blank", "noopener"); };
            cell.addEventListener("click", go);
            cell.addEventListener("keydown", function (e) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); go(); } });
          })(k);
        }
        grid.appendChild(cell);
      }
    }
    function toggle(open) {
      pop.hidden = !open;
      btn.setAttribute("aria-expanded", open ? "true" : "false");
      if (open) render();
    }
    btn.addEventListener("click", function (e) { e.stopPropagation(); toggle(pop.hidden); });
    document.getElementById("calPrev").addEventListener("click", function () { cur.m--; if (cur.m < 1) { cur.m = 12; cur.y--; } render(); });
    document.getElementById("calNext").addEventListener("click", function () { cur.m++; if (cur.m > 12) { cur.m = 1; cur.y++; } render(); });
    document.addEventListener("click", function (e) { if (!pop.hidden && !pop.contains(e.target)) toggle(false); });
    document.addEventListener("keydown", function (e) { if (e.key === "Escape" && !pop.hidden) toggle(false); });
  }

  /* ===== 启动 ===== */
  function boot() {
    curLang = detectLang();
    renderChrome(curLang);
    renderContent(curLang);
    initCalendar();
    // 关闭语言下拉：点击外部 / Esc
    document.addEventListener("click", function (e) {
      var ls = document.getElementById("langSwitch");
      if (ls && langOpen && !ls.contains(e.target)) {
        langOpen = false;
        ls.classList.remove("open");
        var t = document.getElementById("langTrigger");
        if (t) t.setAttribute("aria-expanded", "false");
      }
    });
    document.addEventListener("keydown", function (e) {
      if (e.key === "Escape" && langOpen) {
        langOpen = false;
        var ls = document.getElementById("langSwitch");
        if (ls) ls.classList.remove("open");
        var t = document.getElementById("langTrigger");
        if (t) t.setAttribute("aria-expanded", "false");
      }
    });
  }
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", boot);
  } else { boot(); }
})();
</script>
</body>
</html>
