ar por fin ese dinero.", "ja": "改正「住宅積立金管理条例」が9月20日に施行された。提取事由は6から9に増え、自己居住住宅のリフォーム、管理費の支払い、包括条項が加わった。賃貸費用の支払いに所得比率の要件はなくなり、自営業者やフリーランスも任意で積み立てできる。提取の審査は3営業日以内、融資審査は10日以内に短縮された。10月26日に関連話題がトレンド入りし、「家を買わない人でもこの資金を使えるのか」が議論の中心となった。"}, "why": {"zh": "变化的实质是「公积金从买房专用金变成了住房消费账户」——装修、物业费都能提，租房不看收入。对不打算买房的人来说，这笔钱第一次有了日常可用的出口；对公积金中心来说，考验的是 3 日审批能不能真的做到。", "en": "The substance of the change is that the fund moves from a home-buying account to a housing-consumption account: renovation and property fees qualify, and rent no longer faces an income test. For people who never plan to buy, the money finally has an everyday outlet; for the fund centres, the test is whether three-day approval is real.", "es": "El cambio de fondo convierte el fondo de compra en una cuenta de gasto en vivienda: reforma y gastos de comunidad cuentan, y el alquiler ya no mira ingresos. Para quien no piensa comprar, el dinero tiene por fin una salida cotidiana; para los gestores, la prueba es si los tres días de aprobación son reales.", "ja": "実質的な変化は、積立金が「住宅購入専用」から「住居消費の口座」に変わることだ。リフォームや管理費も引き出せ、賃貸は所得を見ない。購入予定のない人にとって、この資金は初めて日常的に使える出口を得た。積立金センターにとっては、3営業日審査を本当に実行できるかが問われる。"}}, {"idx": "02", "title": {"zh": "「23:59:60」将成为历史：2027 年 5 月 20 日起全球停止插入闰秒", "en": "No More 23:59:60: The World Stops Adding Leap Seconds From 20 May 2027", "es": "Se acabó el 23:59:60: el mundo dejará de añadir segundos intercalares desde el 20 de mayo de 2027", "ja": "「23:59:60」が消える 2027年5月20日から世界がうるう秒の挿入を停止"}, "body": {"zh": "第 28 届国际计量大会通过决议，自 2027 年 5 月 20 日起，全球停止插入闰秒。由于地球自转速度与原子钟存在细微差异，过去需要用增加一秒的方式让「原子时」与「天文时」对齐，这就是「23:59:60」的由来。随着卫星导航、金融交易和计算机网络对时间连续性的要求提高，取消闰秒可降低系统复杂度与故障风险。相关话题 10 月 26 日登上热搜。", "en": "The 28th General Conference on Weights and Measures has resolved that the world will stop inserting leap seconds from 20 May 2027. Because Earth's rotation and atomic clocks drift apart slightly, an extra second was periodically added to keep atomic time aligned with astronomical time — hence the time stamp 23:59:60. As satellite navigation, financial trading and computer networks demand continuous time, dropping leap seconds reduces system complexity and failure risk. The topic trended on 26 October.", "es": "La 28.ª Conferencia General de Pesas y Medidas aprobó que el mundo deje de insertar segundos intercalares desde el 20 de mayo de 2027. Como la rotación terrestre y los relojes atómicos se desfasan ligeramente, se añadía un segundo para alinear el tiempo atómico con el astronómico: de ahí el 23:59:60. Con la navegación por satélite, las operaciones financieras y las redes exigiendo continuidad temporal, suprimirlos reduce complejidad y riesgo de fallos. El tema fue tendencia el 26 de octubre.", "ja": "第28回国際度量衡総会は、2027年5月20日から世界がうるう秒の挿入を停止する決議を採択した。地球の自転と原子時計にはわずかなずれがあり、これまでは1秒を加えて原子時と天文時を合わせてきた。これが「23:59:60」の由来だ。衛星測位や金融取引、コンピュータネットワークが時間の連続性を求めるようになり、うるう秒の廃止はシステムの複雑さと障害リスクを下げる。10月26日に関連話題がトレンド入りした。"}, "why": {"zh": "闰秒是互联网时代最典型的「补丁式设计」：为了迁就地球慢了一点，全世界要在同一秒里同时修改时钟，2012 年和 2016 年都曾因此出现大面积服务异常。取消它，意味着人类正式选择「原子时优先」——天文意义上的正午，从此可以和钟表慢慢错开。", "en": "The leap second is the internet age's archetypal patch: to accommodate a slightly slow planet, the whole world had to adjust its clocks in the same second, and both 2012 and 2016 saw widespread outages as a result. Abolishing it means choosing atomic time first — astronomical noon may now drift away from the clock.", "es": "El segundo intercalar es el parche arquetípico de la era de internet: para acomodar un planeta algo lento, el mundo entero ajustaba sus relojes en el mismo segundo, y en 2012 y 2016 hubo fallos masivos. Suprimirlo supone elegir primero el tiempo atómico: el mediodía astronómico podrá irse separando del reloj.", "ja": "うるう秒はインターネット時代を象徴する「パッチ」だ。わずかに遅い地球に合わせるため、世界が同じ一秒で時計を直す必要があり、2012年と2016年には大規模な障害が起きた。廃止は「原子時優先」の選択を意味する。天文上の正午は、これから時計と少しずつずれていく。"}}, {"idx": "03", "tag": {"zh": "进展"}, "title": {"zh": "13 岁女孩卖金项链、金店当场熔化，家长要求原样返还引争议", "en": "A 13-Year-Old Sold Two Gold Necklaces and the Shop Melted Them: A Dispute Over Restoring Them", "es": "Una niña de 13 años vendió dos collares de oro y la joyería los fundió: polémica por la restitución", "ja": "13歳の少女が金のネックレスを売却、店がその場で溶解 原状回復を求める声で議論"}, "body": {"zh": "江西新余一名家长反映，当地一家老凤祥银楼未经其同意，回收了其 13 岁女儿出售的两条金项链并当场熔化。家长称两条项链价值一万多元，女儿读初二，自己绝不会同意出售，要求店家原样返还。涉事金店回应称按正常流程回收，店员当时未核实年龄。目前双方仍在协商，市场监管部门已关注此事。10 月 25 日相关话题登上热搜，讨论集中在「商家有没有义务核实年龄」。", "en": "A parent in Xinyu, Jiangxi, says a local Lao Feng Xiang jewellery store bought two gold necklaces from her 13-year-old daughter and melted them on the spot without her consent. She estimates the necklaces were worth over 10,000 yuan, says her daughter is in the second year of middle school, and that she would never have agreed to the sale, demanding the items be returned in their original form. The store says it followed normal procedures and staff did not verify the girl's age. Negotiations continue and market regulators are aware; the topic trended on 25 October.", "es": "Una madre de Xinyu (Jiangxi) denuncia que una joyería Lao Feng Xiang compró dos collares de oro a su hija de 13 años y los fundió en el acto sin su consentimiento. Calcula que valían más de 10.000 yuanes, que la niña cursa segundo de secundaria y que jamás habría autorizado la venta, y exige su restitución. La tienda afirma que siguió el procedimiento habitual y que el personal no verificó la edad. Sigue la negociación y los reguladores de mercado están al tanto; el tema fue tendencia el 25 de octubre.", "ja": "江西省新余市の保護者が、地元の老鳳祥銀楼が同意なく13歳の娘から買い取った金のネックレス2本をその場で溶かしたと訴えた。ネックレスは1万元以上で、娘は中学2年であり売却に同意するはずがないとして原状回復を求めている。店側は通常の手続きで回収し、担当者は年齢を確認していなかったと説明。現在も協議中で、市場監督部門も把握している。10月25日に関連話題がトレンド入りした。"}, "why": {"zh": "争点不在「孩子能不能卖东西」，而在「商家有没有义务看一眼年龄」。民法典规定 8 周岁以上未成年人处置大额财产需法定代理人同意或追认，交易可撤销；但金饰一旦熔成金料，撤销就变成了赔偿。这类纠纷最后往往是钱的问题，代价却由整个行业的回收流程来承担。", "en": "The question is not whether a child can sell something but whether a shop must check how old the seller is. Under the Civil Code, a minor over eight disposing of significant assets needs a guardian's consent or ratification, and the transaction can be voided — but once gold is melted into bullion, voiding becomes compensation. Such disputes end up being about money, while the cost is borne by the industry's buy-back procedures.", "es": "La cuestión no es si un menor puede vender, sino si la tienda debe comprobar la edad. El Código Civil exige consentimiento o ratificación del tutor para que un menor de más de ocho años disponga de bienes relevantes, y la operación puede anularse; pero si el oro ya está fundido, anular se convierte en indemnizar. Estos pleitos acaban siendo una cuestión de dinero, y el coste lo asume el procedimiento de compra del sector.", "ja": "争点は「子どもが売れるか」ではなく、「店に年齢を確認する義務があるか」だ。民法は8歳以上の未成年者が高額財産を処分するには法定代理人の同意や追認が必要で、取引は取り消せる。ただし金が地金に溶かされれば、取り消しは賠償に変わる。こうした紛争は結局は金の問題になり、そのコストは業界の買い取り手続きが負う。"}}, {"idx": "04", "title": {"zh": "深山「流浪女小秀」被曝摆拍：200 多条视频全是剧本，只为引流带货", "en": "The Mountain «Drifter» Was Staged: 200-Plus Videos Scripted to Drive Sales", "es": "La «vagabunda» de la montaña era un montaje: más de 200 vídeos con guion para vender", "ja": "山中の「浮浪女性」はやらせ 200本超の動画が台本、目的は集客と販売"}, "body": {"zh": "今年 8 月起，有博主发布视频称在深山「意外发现」一名状态异常的流浪女，为其取名「小秀」，带她一起直播、拍短视频带货。面对网友「为什么不送救助站」「是否摆拍」的质疑，博主始终回避。10 月下旬记者调查发现，所谓「流浪女」实为与博主夫妇合作摆拍的当事人，200 多条视频均为剧本，目的是引流后带货。律师指出，虚构身份、编造苦难引流带货涉嫌虚假宣传与消费欺诈，平台应加强治理。", "en": "Since August, a blogger has posted videos claiming to have «discovered» a distressed woman living rough in remote mountains, naming her «Xiaoxiu» and featuring her in livestreams and short videos selling goods. The blogger repeatedly dodged questions about why she was not taken to a shelter and whether the scenes were staged. In late October, reporters found the «drifter» was a collaborator in a staged setup with the couple behind the account, and that all 200-plus videos followed scripts designed to build an audience for sales. Lawyers say fabricating an identity and hardship to drive sales can constitute false advertising and consumer fraud, and that platforms should tighten enforcement.", "es": "Desde agosto, un creador de contenido publicó vídeos asegurando haber «encontrado» a una mujer en situación precaria en la montaña, a la que llamó «Xiaoxiu», y la incluyó en directos y vídeos para vender productos. Ante las preguntas sobre por qué no la llevaba a un centro de acogida o si era un montaje, siempre eludió responder. A finales de octubre, los periodistas comprobaron que la «vagabunda» era una colaboradora del matrimonio que gestiona la cuenta y que los más de 200 vídeos seguían guiones para captar audiencia y vender. Los abogados señalan que inventar una identidad y un sufrimiento con fines comerciales puede constituir publicidad engañosa y fraude al consumidor.", "ja": "今年8月以降、ある配信者が「山中で状態のよくない浮浪女性を偶然見つけた」として「小秀」と名付け、ライブ配信やショート動画で商品を売る内容を投稿してきた。なぜ保護施設に送らないのか、やらせではないのかという疑問には答えなかった。10月下旬の取材で、いわゆる「浮浪女性」は配信者夫妻と組んだ演者で、200本超の動画はすべて集客と販売のための台本だったことが判明した。弁護士は、身元や苦難を捏造して集客・販売する行為は景品表示法や消費者保護の観点で問題になり得るとして、プラットフォームの取り締まり強化を求めた。"}, "why": {"zh": "这类内容的伤害是双重的：既骗了打赏和订单，也消耗了公众对真正需要帮助者的信任——下一次有人在路边遇到困境者，第一反应可能变成「是不是又在拍视频」。比追责更重要的，是让「苦情剧情」在推荐算法里失去收益。", "en": "The damage is double: donations and orders were obtained by deception, and public trust in people who genuinely need help is spent. Next time someone sees a person in distress, the first thought may be «are they filming again?» Beyond punishment, the fix is to make misery scripts unprofitable in recommendation feeds.", "es": "El daño es doble: se obtuvieron donaciones y pedidos con engaño y se gastó la confianza pública en quienes de verdad necesitan ayuda. La próxima vez que alguien vea a una persona en apuros, su primer pensamiento puede ser «¿estarán grabando otra vez?». Más allá del castigo, la solución es que los guiones de sufrimiento dejen de ser rentables en los algoritmos de recomendación.", "ja": "被害は二重だ。投げ銭や注文をだまし取り、本当に助けを必要とする人への信頼を消耗させた。次に道端で困っている人を見たとき、最初に浮かぶのが「また撮影か」かもしれない。責任追及以上に重要なのは、「苦難の脚本」がレコメンドの中で稼げなくすることだ。"}}, {"idx": "05", "title": {"zh": "官方辟谣「地震生命三角区」「聚能环省燃气」：都没有科学依据", "en": "Officials Debunk the «Triangle of Life» and «Gas-Saving Rings»: No Scientific Basis", "es": "Desmentidos oficiales: el «triángulo de la vida» y los aros «ahorradores» de gas no tienen base científica", "ja": "「地震の生命三角地帯」「省ガスリング」は根拠なし 当局が否定"}, "body": {"zh": "针对巴青地震后流传的说法，有关部门与专业机构辟谣称，「地震生命三角区」缺乏科学依据——强震中物体倒塌方向不可预测，躲在所谓三角空间并不比「伏地、遮挡、手抓牢」更安全；网传加装「聚能环」可节省燃气同样没有依据，此类加装件还可能影响燃烧、带来一氧化碳风险。相关话题 10 月 26 日登上热搜。官方同时提醒，震区群众应按指引在安置点避险，不要擅自返回危房。", "en": "Responding to claims circulating after the Baqing earthquake, authorities and specialists said the «triangle of life» has no scientific basis: in a strong quake, the direction in which objects fall cannot be predicted, and sheltering in a supposed triangular void is no safer than drop, cover and hold on. Claims that fitting a «concentrating ring» saves gas are equally unsupported, and such add-ons can disrupt combustion and raise carbon monoxide risk. The topic trended on 26 October, with officials repeating that people in the quake zone should stay in shelters as directed and not return to damaged homes.", "es": "Ante las afirmaciones difundidas tras el terremoto de Baqing, autoridades y especialistas señalaron que el «triángulo de la vida» carece de base científica: en un sismo fuerte no se puede predecir hacia dónde caen los objetos y refugiarse en un supuesto hueco triangular no es más seguro que agacharse, cubrirse y sujetarse. Tampoco hay respaldo para los aros que prometen ahorrar gas; esos añadidos pueden alterar la combustión y elevar el riesgo de monóxido de carbono. El tema fue tendencia el 26 de octubre.", "ja": "バチェン地震後に広まった説について、当局と専門機関は「生命三角地帯」に科学的根拠はないと否定した。強い揺れでは物が倒れる方向は予測できず、三角形の空間に隠れることが「伏せて、覆って、掴まる」より安全とは言えない。「省ガスリング」も根拠がなく、燃焼に影響して一酸化炭素の危険を高める可能性がある。10月26日に関連話題がトレンド入りした。当局は、被災地では指示に従って安置所で避難し、勝手に損壊した住宅へ戻らないよう改めて呼びかけた。"}, "why": {"zh": "灾难之后最容易传播的不是恐慌，而是「看起来很有用的偏方」。这两条谣言的共同点是都提供了低成本的安全感：一个让你以为找对角落就行，一个让你以为加个铁圈就省钱。辟谣的价值不在于纠正一条帖子，而在于把专业判断重新放回这类问题的第一位。", "en": "What spreads fastest after a disaster is not panic but folk remedies that look useful. Both rumours offer cheap reassurance: one says find the right corner, the other says a metal ring saves money. Debunking is not about correcting a single post but about putting expert judgement back in first place on such questions.", "es": "Lo que más se difunde tras un desastre no es el pánico sino los remedios caseros que parecen útiles. Ambos bulos ofrecen seguridad barata: uno dice que basta encontrar el rincón adecuado, el otro que un aro metálico ahorra dinero. Desmentirlos no es corregir una publicación, sino devolver el criterio experto al primer lugar.", "ja": "災害後に最も広がりやすいのはパニックではなく、「役立ちそうに見える民間療法」だ。二つのデマに共通するのは低コストの安心感で、一つは「正しい隅を見つければよい」、もう一つは「鉄の輪を付ければ節約できる」と言う。否定の価値は投稿を一つ正すことではなく、こうした問題で専門的判断を再び第一に置くことにある。"}}]}, {"key": "ent", "num": "06", "color": "#db2777", "deep": "#a81a56", "name": {"zh": "娱乐八卦", "en": "ENTERTAINMENT", "es": "ESPECTÁCULOS", "ja": "エンタメ"}, "items": [{"idx": "01", "tag": {"zh": "进展"}, "title": {"zh": "《小城良方》央八首播 1.7009% 创近三年医疗剧最高开局，四台同播", "en": "«Small Town Remedy» Opens at 1.7009% on CCTV-8, the Best Medical Drama Launch in Three Years", "es": "«Small Town Remedy» debuta con 1,7009% en CCTV-8, el mejor arranque de un drama médico en tres años", "ja": "「小城良方」がCCTV-8で1.7009%の初回視聴率 医療ドラマで3年ぶりの高さ、4局同時放送へ"}, "body": {"zh": "肖战主演的医疗剧《小城良方》在央视八套黄金档开播，首播收视 1.7009%，创近三年医疗剧最高开局。10 月 26 日消息，北京卫视、东方卫视将接续登陆黄金档，央视一套下午档也已安排，形成「四台同播」。剧中肖战饰演从深圳回到小县城的天才医生刘铮亮，为角色减重 15 斤；「被抬棺堵门」等情节引发讨论。此前该剧酷云峰值 3.02%，CVB 收视率 1.418%。", "en": "«Small Town Remedy», a medical drama starring Xiao Zhan, opened in CCTV-8's prime-time slot with a 1.7009% rating, the strongest launch for a medical series in nearly three years. On 26 October it emerged that Beijing TV and Dragon TV will follow in prime time, with CCTV-1's afternoon slot also scheduled, giving the show four simultaneous outlets. Xiao Zhan plays Liu Zhengliang, a gifted doctor who returns from Shenzhen to a small county town, and lost 15 jin for the role; a storyline involving a family blocking the emergency room with a coffin drew wide discussion. Earlier the show peaked at 3.02% on Kuyun and recorded 1.418% on CVB.", "es": "«Small Town Remedy», drama médico protagonizado por Xiao Zhan, debutó en el prime time de CCTV-8 con un 1,7009%, el mejor arranque del género en casi tres años. El 26 de octubre se supo que Beijing TV y Dragon TV lo emitirán también en prime time y que CCTV-1 lo programará por la tarde, con cuatro cadenas en paralelo. Xiao Zhan interpreta a Liu Zhengliang, un médico brillante que vuelve de Shenzhen a un pequeño condado, y perdió 7,5 kilos para el papel; una trama con un ataúd bloqueando urgencias generó debate. En Kuyun llegó a un 3,02% y en CVB registró 1,418%.", "ja": "肖戦主演の医療ドラマ「小城良方」がCCTV-8のゴールデンタイムで初回視聴率1.7009%を記録し、医療ドラマとしては約3年ぶりの高さとなった。10月26日には北京衛視と東方衛視もゴールデンで放送し、CCTV-1の午後枠も決まり、4局同時放送となることが分かった。肖戦は深圳から小さな県城に戻る天才医師・劉錚亮を演じ、役作りのため7.5キロ減量。「棺で救急を塞ぐ」場面などが話題になった。クユンのピークは3.02%、CVBは1.418%。"}, "why": {"zh": "一部剧能在四个频道同时段铺开，说明它已经不只是剧集，而是被当作「适合全家看的医疗剧」在编排。收视和口碑的落差（酷云高、CVB 中）也提醒：电视端的真实观众结构和网络讨论热度，往往是两回事。", "en": "A drama scheduled across four channels at once is no longer just a series but programming positioned as family-friendly medical fare. The gap between buzz and ratings — strong on Kuyun, middling on CVB — is a reminder that the actual television audience and online conversation are often two different things.", "es": "Un drama emitido en cuatro cadenas a la vez deja de ser solo una serie y pasa a ser programación pensada como médico para toda la familia. La brecha entre ruido y audiencia —alto en Kuyun, discreto en CVB— recuerda que el público real de televisión y la conversación online suelen ser dos cosas distintas.", "ja": "4局で同時に放送されるとなれば、もはや単なるドラマではなく「家族で見られる医療もの」として編成された番組だ。クユンは高いがCVBは中位という差は、テレビの実視聴者層とネットの話題性が別物であることを教えてくれる。"}}, {"idx": "02", "title": {"zh": "刘浩存官宣安踏品牌全球代言人，主题「轻赴山河·雪境存真」", "en": "Liu Haocun Named Anta Global Ambassador Under the Theme «Into the Snow, True to the Land»", "es": "Liu Haocun, nueva embajadora global de Anta con el lema «Hacia la nieve, fiel a la tierra»", "ja": "劉浩存がアンタのグローバルアンバサダーに 「軽赴山河・雪境存真」がテーマ"}, "body": {"zh": "10 月 26 日，刘浩存在社交账号宣布成为安踏品牌全球代言人，本季主题为「轻赴山河，雪境存真」。同步公布两个节点：10 月 31 日晚 6 点，安踏官方旗舰店天猫直播间将现场放送；10 月 26 日起到指定门店可领取「山河来信」限定信封、撕拉片照片和 Q 版贴纸。相关话题进入当天微博娱乐榜前二十。她今年有电视剧《主角》与电影《消失的人》两部作品，前者在央视一套播出、后者收下 2.62 亿票房。", "en": "On 26 October, Liu Haocun announced on social media that she has become a global ambassador for Anta, with the season's theme «Into the Snow, True to the Land». Two dates were released alongside: a livestream on Anta's Tmall flagship store at 6 pm on 31 October, and, from 26 October, limited «Letters from the Mountains and Rivers» envelopes, peel-apart photo cards and chibi stickers at selected stores. The topic entered Weibo's entertainment chart top 20 that day. Her 2026 output includes the drama «The Leading Role» on CCTV-1 and the film «The Vanished», which took 262 million yuan.", "es": "El 26 de octubre, Liu Haocun anunció en redes que es la nueva embajadora global de Anta, con el lema de temporada «Hacia la nieve, fiel a la tierra». Se anunciaron dos citas: un directo en la tienda oficial de Anta en Tmall el 31 de octubre a las 18:00 y, desde el 26 de octubre, sobres limitados «Cartas de montañas y ríos», fotos troqueladas y pegatinas en tiendas seleccionadas. El tema entró en el top 20 de entretenimiento de Weibo. Este año estrena la serie «The Leading Role» en CCTV-1 y la película «The Vanished», con 262 millones de yuanes de taquilla.", "ja": "10月26日、劉浩存がSNSでアンタのグローバルアンバサダー就任を発表した。今季のテーマは「軽赴山河・雪境存真」。10月31日18時からアンタ公式旗艦店のTmallライブ配信が行われ、10月26日から指定店舗で限定封筒「山河来信」や剥がせる写真、Q版ステッカーが配布される。関連話題は同日のWeiboエンタメ榜トップ20入り。今年はCCTV-1で放送されたドラマ「主角」と、2億6,200万元の興行収入を上げた映画「消失的人」の2作品がある。"}, "why": {"zh": "国货运动品牌选代言人的逻辑已经变了：不再只看流量峰值，而看「能不能长期讲一个关于户外与生活方式的故事」。刘浩存的舞蹈底子和今年两部作品的成绩，正好卡在这个叙事上——从「谋女郎」到「能演戏的代言人」，这条路她走了六年。", "en": "How domestic sportswear brands pick ambassadors has changed: not peak traffic but whether someone can carry a long-term story about outdoors and lifestyle. Liu's dance training and this year's two releases fit that narrative — from «Zhang Yimou discovery» to «ambassador who can act» has taken her six years.", "es": "La lógica de las marcas deportivas nacionales al elegir embajador ha cambiado: ya no importa el pico de tráfico sino si alguien puede sostener un relato de largo plazo sobre aire libre y estilo de vida. La formación en danza de Liu y sus dos estrenos de este año encajan en esa narrativa: pasar de «descubrimiento de Zhang Yimou» a «embajadora que actúa» le ha llevado seis años.", "ja": "国内スポーツブランドのアンバサダー選びは変わった。流量のピークではなく、「アウトドアとライフスタイルの物語を長く語れるか」を見る。劉浩存のダンスの素地と今年の2作品はこの物語に噛み合う。「謀女郎」から「演技できるアンバサダー」まで、彼女は6年かけた。"}}, {"idx": "03", "title": {"zh": "贾乃亮双 11 首日单场带货 5.7 亿，连播超 12 小时", "en": "Jia Nailiang Sells 570 Million Yuan in One Double 11 Session, Streaming Over 12 Hours", "es": "Jia Nailiang vende 570 millones de yuanes en una sesión del Doble 11 tras más de 12 horas en directo", "ja": "賈乃亮がダブル11初日に5.7億元 12時間超のライブ配信"}, "body": {"zh": "双 11 首日，贾乃亮连续直播超过 12 小时，单日带货销售额达 5.7 亿元，创其近三年个人单场新高。这一成绩也把「明星带货」重新推上热搜。今年双 11 各平台普遍拉长预售周期、加大补贴力度，明星直播间成为平台争夺流量的重要入口；与此同时，监管部门与平台对直播间虚假宣传、价格欺诈的整治也在持续。", "en": "On the first day of Double 11, Jia Nailiang streamed for more than 12 hours straight and sold 570 million yuan of goods, his best single session in three years. The result pushed «celebrity livestream selling» back onto trending lists. This year platforms have lengthened presale windows and increased subsidies, making celebrity livestream rooms a key traffic battleground, while regulators and platforms continue to crack down on false advertising and price deception in livestream commerce.", "es": "El primer día del Doble 11, Jia Nailiang estuvo más de 12 horas seguidas en directo y vendió 570 millones de yuanes, su mejor sesión en tres años. El resultado devolvió el «comercio en directo con famosos» a las listas de tendencias. Este año las plataformas han alargado las preventas y aumentado las subvenciones, y los directos de celebridades se han vuelto un campo clave por el tráfico, mientras los reguladores siguen persiguiendo la publicidad engañosa y el engaño de precios.", "ja": "ダブル11初日、賈乃亮は12時間以上連続で配信し、1日で5.7億元を販売、自身ここ3年で最高の単日成績となった。「有名人のライブコマース」が再びトレンド入りした。今年のダブル11は各プラットフォームが予約期間を延ばし補助金を積み増す中、有名人のライブ配信が集客の主戦場になっている。一方で、当局とプラットフォームは誇大広告や価格表示の不正への取り締まりを続けている。"}, "why": {"zh": "5.7 亿这个数字的意义，不在明星本人，而在它验证了一件事：在流量成本越来越高的当下，平台仍愿意为「有名有脸的直播间」付溢价。但明星带货的天花板也很清楚——它靠的是个人体力和信任，一旦翻车，损失的是全部。", "en": "The 570 million matters less for the celebrity than for what it proves: with traffic costs rising, platforms still pay a premium for a familiar face in a livestream room. The ceiling is equally clear — it runs on personal stamina and trust, and a single misstep costs everything.", "es": "Los 570 millones importan menos por la celebridad que por lo que demuestran: con el tráfico cada vez más caro, las plataformas siguen pagando una prima por una cara conocida en el directo. El techo es igual de claro: depende de resistencia física y confianza, y un solo tropiezo cuesta todo.", "ja": "5.7億元という数字の意味は本人よりも、証明された事実にある。集客コストが上がる中でも、プラットフォームは「顔の知れた配信ルーム」に割増を払う。上限も明快だ。体力と信頼に依存しており、一度の失敗で全てを失う。"}}, {"idx": "04", "title": {"zh": "《大梦归离》开播：缉妖小队题材上线，陈都灵主演", "en": "«Dream of Departure» Premieres: A Demon-Hunting Squad Led by Chen Duling", "es": "«Dream of Departure» se estrena: un escuadrón cazademonios con Chen Duling", "ja": "「大夢帰離」が放送開始 妖怪退治隊もの、陳都霊主演"}, "body": {"zh": "10 月 26 日，缉妖小队题材剧集《大梦归离》开播，陈都灵等主演。开播即带动相关角色名与妆造话题在社交平台发酵，二创跟得很快。同期在播的还有湖南卫视、芒果 TV 的民国剧《玉簟秋》（丞磊、徐若晗主演），以古装爱情线稳住了固定观众；此外，多部古装剧陆续官宣杀青或定档，年末档期竞争已经提前开始。", "en": "«Dream of Departure», a demon-hunting squad drama starring Chen Duling, premiered on 26 October. Character names and costume topics began circulating on social platforms immediately, with fan edits following quickly. It shares the schedule with the Republican-era drama «Jade Mat in Autumn» on Hunan TV and Mango TV, starring Cheng Lei and Xu Ruohan, which holds a steady audience with its period romance line. Several other costume dramas have announced wrap-ups or premiere dates as year-end competition starts early.", "es": "«Dream of Departure», drama de un escuadrón cazademonios protagonizado por Chen Duling, se estrenó el 26 de octubre. Los nombres de los personajes y el vestuario empezaron a circular de inmediato en redes, con ediciones de fans muy rápidas. Compite en parrilla con el drama republicano «Jade Mat in Autumn» en Hunan TV y Mango TV, con Cheng Lei y Xu Ruohan, que mantiene audiencia con su línea romántica de época. Varias ficciones de época han anunciado rodajes terminados o fechas de estreno.", "ja": "10月26日、妖怪退治隊を描くドラマ「大夢帰離」が放送開始した。陳都霊らが主演。開始直後から登場人物名や衣装の話題がSNSで広がり、二次創作も素早く追随した。同じ時期には湖南衛視と芒果TVで民国もの「玉簟秋」（丞磊、徐若晗主演）が放送中で、時代物の恋愛線で固定ファンを保っている。年末に向けてクランクアップや放送開始を発表する時代劇も相次いでいる。"}, "why": {"zh": "「缉妖小队」这个设定，本质是把探案剧的单元结构装进东方奇幻的外壳——它天然适合短视频切片，也天然容易在第三集之后失去悬念。这类剧的成败，通常取决于第二个案件能不能立住。", "en": "The demon-hunting squad format is essentially the case-of-the-week structure wrapped in Eastern fantasy: naturally suited to short-video clips, and naturally prone to losing suspense after episode three. Such shows usually live or die on whether the second case holds up.", "es": "El formato de escuadrón cazademonios es la estructura de casos envuelta en fantasía oriental: encaja de forma natural en los clips cortos y pierde suspense con la misma naturalidad tras el tercer episodio. Estos dramas suelen decidirse por si el segundo caso se sostiene.", "ja": "「妖怪退治隊」という設定は、探偵ものの一話完結構造を東洋ファンタジーの器に入れたものだ。ショート動画の切り抜きに向く一方、3話以降に緊張感を失いやすい。こうした作品の成否は、たいてい第2の事件が成立するかで決まる。"}}, {"idx": "05", "title": {"zh": "环卫工人节，吴克群包下整条夜市请环卫工吃饭", "en": "On Sanitation Workers' Day, Wu Kequn Rented a Whole Night Market to Host Them", "es": "Día del Personal de Limpieza: Wu Kequn alquila todo un mercadillo nocturno para invitarles a comer", "ja": "清掃員の日に呉克群が夜市を丸ごと貸切 清掃作業員をもてなす"}, "body": {"zh": "10 月 26 日是环卫工人节，吴克群在海南东方市包下福民夜市整条街，自费请环卫工人吃饭，总花费约五千元，并安排了红毯环节，现场一起吃海南美食、唱民歌。他发文称「包下一条街，只为留下他们最美的笑容」。此前他曾多次做类似的事：今年 2 月在贵阳街头请环卫工人吃火锅，发现对方手套磨损后自费购买加绒防寒手套并送上红包；同月在重庆邀请保安、棒棒军、环卫工一起吃年夜饭。", "en": "On 26 October, Sanitation Workers' Day, singer Wu Kequn rented the entire Fumin night market in Dongfang, Hainan, and paid out of his own pocket — about 5,000 yuan — to host local sanitation workers, complete with a red carpet, Hainan food and folk songs. He wrote online that he «rented a whole street just to keep their brightest smiles». He has done similar things before: in February he treated workers to hotpot in Guiyang and, noticing worn gloves, bought fleece-lined winter gloves and red envelopes; the same month he hosted security guards, porters and cleaners at a New Year dinner in Chongqing.", "es": "El 26 de octubre, Día del Personal de Limpieza, el cantante Wu Kequn alquiló todo el mercadillo nocturno Fumin de Dongfang (Hainan) y pagó de su bolsillo —unos 5.000 yuanes— para invitar a los trabajadores de limpieza, con alfombra roja, comida local y canciones. Escribió que «alquiló una calle entera solo para conservar sus mejores sonrisas». Ya lo había hecho antes: en febrero invitó a un hotpot en Guiyang y, al ver los guantes gastados, compró guantes térmicos y sobres rojos; ese mismo mes organizó una cena de Año Nuevo en Chongqing con vigilantes, porteadores y limpiadores.", "ja": "10月26日は清掃作業員の日。歌手の呉克群が海南省東方市の福民夜市を丸ごと貸し切り、自費約5,000元で清掃作業員をもてなした。レッドカーペットも用意し、海南料理を一緒に食べ、民謡も歌った。本人は「一条の街を借り切ったのは、彼らの最高の笑顔を残すため」と投稿。今年2月にも貴陽で鍋をごちそうし、手袋の傷みを見て裏起毛の防寒手袋とお年玉を贈り、同月には重慶で警備員や運搬作業者、清掃員と新年の食事会を開いている。"}, "why": {"zh": "这条新闻之所以被转，不是因为五千块钱，而是因为它具体：请的是哪一群人、在哪个夜市、手套磨破了要换加绒的。公益在传播上最怕「宏大」，最有效的是让人看见一个可复制的动作——包一条街不需要顶流，一个普通店主也能做。", "en": "What made this travel is not the 5,000 yuan but the specificity: which group, which night market, and that worn gloves need fleece-lined replacements. Charity messaging works worst when it is grand and best when it shows a repeatable act — renting a street does not require a top star; an ordinary shop owner could do it.", "es": "Lo que hizo viral la noticia no son los 5.000 yuanes sino la concreción: qué colectivo, qué mercadillo y que los guantes gastados necesitan forro. La caridad funciona peor cuando es grandilocuente y mejor cuando muestra un gesto replicable: alquilar una calle no exige un gran famoso, podría hacerlo cualquier tendero.", "ja": "このニュースが共有されたのは5,000元のためではなく、具体性のためだ。誰を、どの夜市で、手袋が傷んだら裏起毛に替える、というディテールがある。善意は「宏大」だと伝わらず、真似できる行動が見えたときに最も強い。通りを一つ借りるのにトップスターは要らず、商店の店主にもできる。"}}]}], "risk": {"zh": "风险提示：本简报仅作信息汇总，其中涉及的数据不构成任何投资建议。", "en": "Disclaimer: This briefing is a news digest only. Data mentioned does not constitute any investment advice.", "es": "Aviso: este resumen es solo una recopilación informativa; los datos citados no constituyen asesoramiento de inversión.", "ja": "リスク表示：本ダイジェストは情報まとめであり、記載データは投資助言を構成しません。"}}/*__END__*/;

  /* ===== UI 文案（与内容分离，四语齐全） ===== */
  var I18N = {

  var LANGS = ["zh", "en", "es", "ja"];

  // 小国旗（内联 SVG，避免外部图标依赖与 emoji 平台差异）
  function flag(lang) {
    if (lang === "zh") return '<svg class="fl" viewBox="0 0 30 20" aria-hidden="true"><rect width="30" height="20" fill="#de2910"/><g fill="#ffde00"><circle cx="5" cy="4" r="2.2"/><circle cx="9" cy="2.4" r="0.8"/><circle cx="10" cy="4" r="0.8"/><circle cx="9" cy="5.6" r="0.8"/><circle cx="7" cy="6.6" r="0.8"/></g></svg>';
    if (lang === "en") return '<svg class="fl" viewBox="0 0 30 20" aria-hidden="true"><rect width="30" height="20" fill="#012169"/><path d="M0 0L30 20M30 0L0 20" stroke="#fff" stroke-width="4"/><path d="M0 0L30 20M30 0L0 20" stroke="#c8102e" stroke-width="2"/><rect x="13" width="4" height="20" fill="#fff"/><rect y="8" width="30" height="4" fill="#fff"/><rect x="14" width="2" height="20" fill="#c8102e"/><rect y="9" width="30" height="2" fill="#c8102e"/></svg>';
    if (lang === "es") return '<svg class="fl" viewBox="0 0 30 20" aria-hidden="true"><rect width="30" height="20" fill="#aa151b"/><rect y="5" width="30" height="10" fill="#f1bf00"/></svg>';
    return '<svg class="fl" viewBox="0 0 30 20" aria-hidden="true"><rect width="30" height="20" fill="#fff"/><circle cx="15" cy="10" r="5.5" fill="#bc002d"/></svg>';
  }

  /* ===== 工具 ===== */
  function T(obj, lang) {
    if (obj == null) return "";
    if (typeof obj === "string") return obj;
    if (obj[lang] != null) return obj[lang];
    return obj.zh != null ? obj.zh : "";
  }
  function pad(n) { return n < 10 ? "0" + n : "" + n; }
  function bing(q) { return "https://www.bing.com/search?q=" + encodeURIComponent(q); }
  function fmtDate(d, lang) {
    var y = d.getFullYear(), m = d.getMonth() + 1, day = d.getDate();
    if (lang === "zh") return y + "." + pad(m) + "." + pad(day);
    if (lang === "ja") return y + "年" + m + "月" + day + "日";
    if (lang === "es") return day + " " + ["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"][m-1] + " " + y;
    return ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][m-1] + " " + day + ", " + y;
  }
  function esc(s) {
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }
  function titleHtml(titleObj, hlObj, lang) {
    var title = T(titleObj, lang);

    var inner = esc(title);
    if (hl && title.indexOf(hl) >= 0) {
      var i = title.indexOf(hl);
      inner = esc(title.slice(0, i)) + '<span class="hl">' + esc(hl) + "</span>" + esc(title.slice(i + hl.length));

    return '<a class="lk" href="' + bing(title) + '" target="_blank" rel="noopener">' + inner + "</a>";
  }

  /* ===== 语言检测：localStorage > 浏览器语言 > 系统时区 > 中文 ===== */
  function detectLang() {
    try { var s = localStorage.getItem("timab_lang"); if (s && LANGS.indexOf(s) >= 0) return s; } catch (e) {}
    var nav = (navigator.language || "").toLowerCase();
    if (/^zh/.test(nav)) return "zh";
    if (/^ja/.test(nav)) return "ja";
    if (/^es/.test(nav)) return "es";
    if (/^en/.test(nav)) return "en";
    var tz = "";
    try { tz = Intl.DateTimeFormat().resolvedOptions().timeZone || ""; } catch (e) {}
    if (/^Asia\/Tokyo/.test(tz)) return "ja";
    if (/Europe\/Madrid|America\/(Mexico_City|Bogota|Lima|Santiago|Caracas|Guatemala|La_Paz|San_Jose|Panama|Asuncion|Montevideo|Havana|El_Salvador|Managua|Tegucigalpa|Costa_Rica|San_Salvador)|America\/Argentina\//.test(tz)) return "es";
    if (/^(Europe|America|Australia)\//.test(tz)) return "en";
    return "zh";
  }

  var curLang = "zh";
  var langOpen = false;

  /* ===== 渲染 ===== */
  function renderChrome(lang) {
    var i18n = I18N[lang];

    // 报头信息行

    if (metaEl) metaEl.textContent = T(BRIEFING.meta, lang);
    // 大日期
    var md = document.getElementById("mastDate");
    if (md) {

    }
    // 文档标题
    var siteName = (lang === "zh") ? "提马早报" : "TIMAB DAILY";
    document.title = siteName + " · " + fmtDate(new Date(BRIEFING.date + "T00:00:00"), lang);
    // 导航签
    var nav = document.getElementById("navChips");
    if (nav) {

    var cf = document.getElementById("calFoot"); if (cf) cf.textContent = i18n.calFoot;
    // 语言切换器（国旗触发 + 下拉）

      ls.className = "lang-switch" + (langOpen ? " open" : "");

        langOpen = !langOpen;
        ls.classList.toggle("open", langOpen);

      });
      ls.appendChild(trig);
      var menu = document.createElement("div");

      LANGS.forEach(function (l) {

        item.innerHTML = flag(l) + '<span class="lbl">' + LANG_LABEL_FULL[l] + "</span>";
        item.addEventListener("click", function (e) {

      });
      ls.appendChild(menu);

  }

  function renderContent(lang) {
    var i18n = I18N[lang];

    html += '<section class="spotlight" id="pick">'
      + '<div class="badge"><i></i>' + esc(T(sp.badge, lang)) + "</div>"
      + "<h2>" + titleHtml(sp.title, sp.hl, lang) + "</h2>"
      + '<div class="body">' + esc(T(sp.body, lang)) + "</div>"
      + '<div class="why"><b>' + esc(i18n.why) + "</b>" + esc(T(sp.why, lang)) + "</div>"
      + "</section>";
    // 分类
    html += '<div class="grid">';
    BRIEFING.sections.forEach(function (sec) {
      html += '<section class="card" id="' + sec.key + '" style="--ac:' + sec.color + "; --ac-deep:" + sec.deep + ';">'
        + '<div class="sec-head"><span class="sec-num">' + sec.num + "</span>"
        + "<h3>" + esc(T(sec.name, lang)) + "</h3>"
        + '<span class="en">' + sec.key.toUpperCase() + "</span></div>";
      (sec.items || []).forEach(function (it) {
        html += '<div class="item">';
        html += '<div class="t"><span class="idx">' + it.idx + "</span>";
        if (it.tag) html += '<span class="tag">' + esc(it.tag[lang] != null ? it.tag[lang] : i18n.tag) + "</span>";
        html += titleHtml(it.title, it.hl, lang) + "</div>";
        html += '<div class="d">' + esc(T(it.body, lang)) + "</div>";

        html += "</div>";
      });
      html += "</section>";
    });
    html += "</div>";
    var content = document.getElementById("content");
    if (content) content.innerHTML = html;
    // 页脚

  }

  function setLang(lang) {
    if (LANGS.indexOf(lang) < 0) lang = "zh";

    try { localStorage.setItem("timab_lang", lang); } catch (e) {}

      grid.innerHTML = "";
      var start = new Date(cur.y, cur.m - 1, 1).getDay();
      var days = new Date(cur.y, cur.m, 0).getDate();
      for (var b = 0; b < start; b++) {
        var blank = document.createElement("span");
        blank.className = "cal-cell is-empty"; grid.appendChild(blank);
      }
      for (var d = 1; d <= days; d++) {
        var k = ckey(cur.y, cur.m, d);
        var cell = document.createElement("span");
        cell.className = "cal-cell" + (has[k] ? " has" : "") + (k === todayKey ? " is-today" : "");
        cell.textContent = d;
        if (has[k]) {
          cell.setAttribute("role", "link"); cell.setAttribute("tabindex", "0");
          cell.title = cur.y + "-" + pad(cur.m) + "-" + pad(d) + " 存档";
          (function (target) {
            var go = function () { window.open(HIST_BASE + target + ".html", "_blank", "noopener"); };
            cell.addEventListener("click", go);
            cell.addEventListener("keydown", function (e) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); go(); } });
          })(k);
        }
        grid.appendChild(cell);
      }
    }
    function toggle(open) {
      pop.hidden = !open;
      btn.setAttribute("aria-expanded", open ? "true" : "false");
      if (open) render();
    }
    btn.addEventListener("click", function (e) { e.stopPropagation(); toggle(pop.hidden); });
    document.getElementById("calPrev").addEventListener("click", function () { cur.m--; if (cur.m < 1) { cur.m = 12; cur.y--; } render(); });
    document.getElementById("calNext").addEventListener("click", function () { cur.m++; if (cur.m > 12) { cur.m = 1; cur.y++; } render(); });
    document.addEventListener("click", function (e) { if (!pop.hidden && !pop.contains(e.target)) toggle(false); });
    document.addEventListener("keydown", function (e) { if (e.key === "Escape" && !pop.hidden) toggle(false); });
  }

  /* ===== 启动 ===== */
  function boot() {
    curLang = detectLang();
    renderChrome(curLang);
    renderContent(curLang);
    initCalendar();
    // 关闭语言下拉：点击外部 / Esc
    document.addEventListener("click", function (e) {
      var ls = document.getElementById("langSwitch");
      if (ls && langOpen && !ls.contains(e.target)) {
        langOpen = false;
        ls.classList.remove("open");
        var t = document.getElementById("langTrigger");
        if (t) t.setAttribute("aria-expanded", "false");
      }
    });
    document.addEventListener("keydown", function (e) {
      if (e.key === "Escape" && langOpen) {
        langOpen = false;
        var ls = document.getElementById("langSwitch");
        if (ls) ls.classList.remove("open");
        var t = document.getElementById("langTrigger");
        if (t) t.setAttribute("aria-expanded", "false");
      }
    });
  }
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", boot);
  } else { boot(); }
})();
</script>
</body>
</html>
