ja": "西の上位4は12勝4敗が線になり、1試合で3つ順位が動く。ウォリアーズの問題は手感ではない。3ポイント29本中5本は、正しい位置にボールを運べる人がいない結果だ。カリー不在で攻撃は最初の1分から止まる。"}}, {"idx": "04", "tag": {"zh": "进展"}, "title": {"zh": "ATP 年终总决赛四强出炉，阿尔卡拉斯将战谢尔顿", "en": "ATP Finals last four set: Alcaraz faces Shelton", "es": "Definidas las semifinales de las ATP Finals: Alcaraz se mide a Shelton", "ja": "ATPファイナルズ4強決定、アルカラスはシェルトンと対戦"}, "body": {"zh": "当地时间 11 月 20 日，ATP 年终总决赛在都灵结束小组赛阶段，四强对阵确定：阿尔卡拉斯以 6:4、6:1 击败意大利选手科博利，半决赛对阵谢尔顿；兹维列夫对阵梅德韦杰夫。阿尔卡拉斯在两盘的首个发球局均完成破发，据赛后消息，其身体多处伤患未构成明显影响。", "en": "Group play at the ATP Finals in Turin ended on 20 November with the semi-finals set: Alcaraz beat Italy's Flavio Cobolli 6-4, 6-1 and will face Ben Shelton, while Zverev meets Medvedev. Alcaraz broke in the first service game of both sets, and reports after the match suggested his various physical complaints were not significantly affecting him.", "es": "La fase de grupos de las ATP Finals en Turín terminó el 20 de noviembre con las semifinales definidas: Alcaraz venció 6-4, 6-1 al italiano Flavio Cobolli y se medirá a Ben Shelton, mientras Zverev se enfrenta a Medvedev. Alcaraz rompió el saque en el primer juego de servicio de ambos sets y las informaciones posteriores indicaban que sus molestias físicas no le afectaban de forma significativa.", "ja": "11月20日、トリノでのATPファイナルズはグループ戦を終え、準決勝のカードが決まった。アルカラスはイタリアのコボッリを6-4、6-1で下しシェルトンと対戦。ズベレフはメドベージェフと当たる。アルカラスは両セットとも最初のサービスゲームでブレークし、試合後の情報では複数の故障は目立った影響を与えていないという。"}, "why": {"zh": "带伤仍能两盘解决对手，说明阿尔卡拉斯的发球局质量足以掩盖移动端的折扣。真正的考验是半决赛对谢尔顿的发球——那是本届赛事最难破的一环，也是他本届唯一没有答案的题型。", "en": "Winning in straight sets while carrying injuries shows Alcaraz's service games are strong enough to mask a discounted movement game. The real test is Shelton's serve in the semi-final — the hardest thing to break in this tournament, and the one question he has not yet answered here.", "es": "Ganar en dos sets con molestias demuestra que sus juegos al saque bastan para tapar un desplazamiento mermado. La prueba real es el saque de Shelton en semifinales: lo más difícil de romper del torneo y la única pregunta que aún no ha respondido.", "ja": "故障を抱えながら2セットで片付けたのは、サーブゲームの質がフットワークの目減りを隠せる証拠だ。本当の試練は準決勝のシェルトンのサーブ。今大会で最もブレークしにくい武器であり、まだ答えを出せていない唯一の設問である。"}}, {"idx": "05", "title": {"zh": "短道速滑世巡赛首尔站：中国男队 5000 米接力晋级半决赛", "en": "Short track World Tour Seoul: China's men reach the 5,000m relay semis", "es": "Circuito Mundial de pista corta en Seúl: los hombres de China pasan a semifinales del relevo de 5.000 m", "ja": "ショートトラック世界ツアー首爾大会、中国男子5000mリレーが準決勝へ"}, "body": {"zh": "11 月 20 日，2026-2027 赛季国际滑联短道速滑世界巡回赛首尔站首日，由孙龙、张柏浩、张子夏、李坤组成的中国队在男子 5000 米接力四分之一决赛中以小组第二完赛，直接获得半决赛资格。男子 1000 米预赛中，孙龙以 1 分 28 秒 277 小组第二晋级，张子夏、李坤同样直接晋级，宋柯睿进入复活赛。本赛季世巡赛共七站，第四、第五站将分别在上海和北京举行。", "en": "On the first day of the Seoul stop of the 2026-27 ISU Short Track World Tour on 20 November, the Chinese quartet of Sun Long, Zhang Baihao, Zhang Zixia and Li Kun finished second in their 5,000m relay quarter-final heat to qualify directly for the semi-finals. In the 1,000m preliminaries Sun Long advanced second in his heat in 1:28.277, with Zhang Zixia and Li Kun also qualifying directly and Song Kerui heading to the repechage. The tour has seven stops this season, with the fourth and fifth in Shanghai and Beijing.", "es": "En la primera jornada de la parada de Seúl del Circuito Mundial de pista corta 2026-27, el cuarteto chino formado por Sun Long, Zhang Baihao, Zhang Zixia y Li Kun terminó segundo en su serie de cuartos del relevo de 5.000 m y se clasificó directamente para semifinales. En las preliminares de 1.000 m, Sun Long pasó segundo de su serie con 1:28.277, Zhang Zixia y Li Kun también se clasificaron directamente y Song Kerui irá a la repesca. El circuito tiene siete paradas; la cuarta y la quinta serán en Shanghái y Pekín.", "ja": "11月20日、2026-27年国際スケート連盟ショートトラック世界ツアー首爾大会の初日、孫龍、張柏浩、張子夏、李坤の中国男子は5000mリレー準々決勝で組2着となり、準決勝進出を決めた。1000m予選では孫龍が1分28秒277で組2着通過、張子夏と李坤も直接通過し、宋柯睿は敗者復活へ。今季のツアーは全7戦で、第4戦と第5戦は上海と北京で開催される。"}, "why": {"zh": "接力是短道最看配合的项目，小组第二晋级意味着半决赛道次不会太好，卡位策略会比绝对速度更关键。孙龙一人兼项 1000 米与接力，多线作战下的体能分配，是这支队伍当下最大的变量。", "en": "Relay is short track's most coordination-dependent event, and a second-place heat means an unfavourable lane in the semi-final, where positioning matters more than raw speed. Sun Long is doubling up in the 1,000m and the relay, and managing that load is the team's biggest variable right now.", "es": "El relevo es la prueba más dependiente de la coordinación en pista corta, y un segundo puesto en la serie implica un carril desfavorable en semifinales, donde colocarse importa más que la velocidad pura. Sun Long dobla en 1.000 m y relevo, y gestionar esa carga es hoy la mayor variable del equipo.", "ja": "リレーはショートトラックで最も連係が問われる種目だ。組2着通過は準決勝のレーンが不利になることを意味し、絶対的な速さ以上に位置取りが重要になる。孫龍は1000mとリレーの二刀流で、その負荷配分が今のチーム最大の変数だ。"}}]}, {"key": "hot", "num": "05", "color": "#6d28d9", "deep": "#55209f", "name": {"zh": "网络热点", "en": "Trending", "es": "Tendencias", "ja": "トレンド"}, "items": [{"idx": "01", "title": {"zh": "「human」当选《剑桥词典》2026 年度词", "en": "Cambridge Dictionary names human its word of the year", "es": "«Human» es la palabra del año del Cambridge Dictionary", "ja": "「human」がケンブリッジ辞典の2026年今年の言葉に"}, "body": {"zh": "随着人工智能技术在全球掀起「何为人类」的讨论，形容词「human」（人的、人类的）日前当选英国《剑桥词典》2026 年度词。《剑桥词典》方面表示，这一选择反映了过去一年人们在谈论 AI 时反复使用这个词的方式——用来区分「由人完成的」与「由机器生成的」。", "en": "As artificial intelligence prompts a global debate about what it means to be human, the adjective human has been named Cambridge Dictionary's word of the year for 2026. The dictionary said the choice reflects how often the word came up in discussions of AI over the past year, used to separate what is done by people from what is generated by machines.", "es": "Mientras la inteligencia artificial aviva un debate global sobre qué significa ser humano, el adjetivo human ha sido elegida palabra del año 2026 por el Cambridge Dictionary. La institución señaló que la elección refleja la frecuencia con que la palabra apareció al hablar de IA durante el último año, para distinguir lo hecho por personas de lo generado por máquinas.", "ja": "AIが「人間とは何か」という議論を世界で呼び起こすなか、形容詞「human」がケンブリッジ辞典の2026年「今年の言葉」に選ばれた。同辞典は、この1年AIを語る際にこの語が繰り返し使われ、「人が行ったこと」と「機械が生成したこと」を区別する役割を担ったと説明している。"}, "why": {"zh": "年度词选的往往不是最热的新词，而是被重新使用的旧词。「human」从一个中性形容词变成一种资质声明，说明 AI 已经进入日常判断的语法层面，而不只是工具箱里多了一件工具。", "en": "Words of the year are often not the newest coinages but old words put to new work. Human moving from neutral adjective to a claim of credentials suggests AI has entered the grammar of everyday judgement, not just the toolbox.", "es": "Las palabras del año no suelen ser las más nuevas, sino viejas palabras con nuevo uso. Que human pase de adjetivo neutro a una declaración de credenciales indica que la IA ha entrado en la gramática del juicio cotidiano, no solo en la caja de herramientas.", "ja": "今年の言葉は新しい造語よりも、使い直された古い語であることが多い。humanが中立的な形容詞から「資格の表明」に変わったのは、AIが道具箱に一つ増えたのではなく、日常的な判断の文法に入り込んだということを示す。"}}, {"idx": "02", "title": {"zh": "李勒优公开录音：大号已收回，十二年「资助」旧账被翻出", "en": "Li Leyou releases recording: her main account is back, and a 12-year sponsorship is re-examined", "es": "Li Leyou publica un audio: recupera su cuenta principal y se revisa un patrocinio de doce años", "ja": "李勒優さんが録音を公開、主要アカウントを取り戻す 12年の「支援」の内実が焦点に"}, "body": {"zh": "11 月 20 日，一段录音让李勒优重回热搜。她在录音中称，云南老家的房子是爷爷奶奶一砖一瓦盖起来的，大连方面当时只帮着买了些沙子和水泥；同时表示自己已经拿回那个两百多万粉丝的账号。此前 9 月的一场直播中，双方因作息、面馆帮忙与零花钱产生争执；10 月她搬出原住处、另开账号；11 月的工商变更显示，她已卸任相关生鲜公司的财务负责人。据公开数据，原账号一个月掉粉五万余，她新开的账号粉丝涨过一百五十万。", "en": "A recording published on 20 November put Li Leyou back on the trending list. In it she says the family home in Yunnan was built brick by brick by her grandparents, and that the household in Dalian only helped buy sand and cement; she also says she has taken back the account with more than two million followers. A livestream in September had aired a dispute over her hours, helping at a noodle shop and an allowance; in October she moved out and started a new account; business registration changes in November showed she had stepped down as finance officer of a related fresh-food company. Public data show the old account lost more than 50,000 followers in a month while the new one passed 1.5 million.", "es": "Un audio difundido el 20 de noviembre devolvió a Li Leyou a las tendencias. En él afirma que la casa familiar en Yunnan la construyeron sus abuelos ladrillo a ladrillo y que en Dalian solo ayudaron a comprar arena y cemento; también dice haber recuperado la cuenta con más de dos millones de seguidores. Una retransmisión de septiembre había aireado una disputa por sus horarios, la ayuda en un restaurante de fideos y la paga; en octubre se mudó y abrió otra cuenta; en noviembre los cambios registrales mostraron que dejó de ser responsable financiera de una empresa de alimentos frescos. Los datos públicos indican que la cuenta antigua perdió más de 50.000 seguidores en un mes y la nueva superó 1,5 millones.", "ja": "11月20日に公開された録音で、李勒優さんが再びトレンド入りした。録音で彼女は、雲南の実家は祖父母がレンガを一つずつ積んで建てたもので、大連側は砂とセメントを買っただけだと述べ、200万人超のフォロワーを持つアカウントを取り戻したことも明かした。9月のライブ配信では生活リズムや麺店の手伝い、小遣いをめぐる争いが公開され、10月に転居して別アカウントを開設。11月の登記変更で関連する生鮮企業の財務責任者を退任したことが示された。公開データでは旧アカウントは1か月で5万人超減り、新アカウントは150万人を超えた。"}, "why": {"zh": "这件事的核心不是「谁对谁错」，而是一段以善意开始、以流量结算的关系如何收场。当「资助」与「内容」绑在一起，情感账本迟早要按商业账本重算——这也是所有被镜头记录过的私人关系共同面对的问题。", "en": "The core issue is not who is right but how a relationship that began as goodwill and ended up settled in traffic winds down. Once sponsorship and content are bound together, the emotional ledger eventually gets recalculated on commercial terms — a problem shared by every private relationship that has been filmed.", "es": "El fondo no es quién tiene razón, sino cómo termina una relación que empezó como buena voluntad y acabó liquidándose en tráfico. Cuando patrocinio y contenido se atan, el libro emocional acaba recalculándose en términos comerciales: un problema común a toda relación privada que ha sido filmada.", "ja": "核心は「どちらが正しいか」ではなく、善意で始まり再生数で清算される関係がどう終わるかにある。支援とコンテンツが結びつけば、感情の台帳はいずれ商業の台帳で計算し直される。撮影された私的な関係が共通して抱える問題だ。"}}, {"idx": "03", "title": {"zh": "乐山情侣「偷咬糖葫芦」引全网争论", "en": "A stolen bite of candied hawthorn sparks a nationwide argument", "es": "Un mordisco a escondidas a un dulce de espino desata un debate nacional", "ja": "楽山のカップル「サンザシ飴をかじった」騒動が全国で議論に"}, "body": {"zh": "11 月 18 日晚，四川乐山一对年轻情侣逛街时，男生趁女生不备咬了一口她手里的糖葫芦。女生发现后把手中的快餐摔在地上、躺到路面哭闹，鞋子甩出很远，男生蹲在旁边哄了很久。现场视频 11 月 20 日被发到微博后迅速登上热议榜，至 11 月 21 日热度仍在上升。评论区围绕「这是小任性还是没有边界感」分成两派。", "en": "On the evening of 18 November a young couple in Leshan, Sichuan, were walking when the man took a bite of the candied hawthorn skewer she was holding. When she noticed, she threw her takeaway food to the ground, lay down in the street and cried, kicking off a shoe, while he crouched beside her trying to calm her for a long while. Video of the scene posted to Weibo on 20 November climbed the trending list and was still rising on 21 November, with commenters split between calling it a small tantrum and a failure of boundaries.", "es": "La noche del 18 de noviembre, una joven pareja de Leshan (Sichuan) paseaba cuando el chico mordió a escondidas el pincho de espino caramelizado que ella llevaba. Al descubrirlo, ella tiró al suelo la comida para llevar, se tumbó en la calle y se puso a llorar, lanzando un zapato lejos, mientras él se agachaba a su lado intentando calmarla. El vídeo se publicó en Weibo el 20 de noviembre, escaló en la lista de temas candentes y seguía subiendo el 21, con los comentarios divididos entre la rabieta menor y la falta de límites.", "ja": "11月18日夜、四川省楽山市で若いカップルが歩いていた際、男性が女性の持つサンザシ飴をこっそりかじった。気づいた女性は買ったファストフードを地面に投げ、道路に寝転んで泣きわめき、靴を遠くへ飛ばした。男性はしばらく横でなだめていた。現場の動画は11月20日に微博に投稿されて話題となり、21日も熱が続いた。コメント欄は「小さなわがまま」と「境界感の欠如」で二分されている。"}, "why": {"zh": "一件成本不到三十元的小事能吵两天，是因为它精准踩中了公共场合的情绪表达边界。围观者真正反感的不是糖葫芦，而是把私人情绪摊在马路上的那种「默认别人必须配合」——这比事件本身更值得讨论。", "en": "A quarrel costing under thirty yuan has run for two days because it lands exactly on the boundary of emotional expression in public. What bothers onlookers is not the snack but the assumption that strangers must accommodate a private mood laid out in the street — that is the more discussable part.", "es": "Una disputa de menos de treinta yuanes dura dos días porque toca exactamente el límite de la expresión emocional en público. Lo que molesta no es el dulce, sino la suposición de que los desconocidos deben acomodar un estado de ánimo privado expuesto en la calle: esa es la parte discutible.", "ja": "30元にも満たない出来事が2日も議論されるのは、公共の場での感情表出の境界を正確に突いたからだ。人が反応するのは飴そのものではなく、私的な感情を路上に広げ、「周りが合わせるのが当然」とする感覚のほうだ。そちらこそ議論に値する。"}}, {"idx": "04", "title": {"zh": "JDG 就选手遭网暴发律师函，称将实时取证追责", "en": "JDG sends legal notice over abuse of its players, vowing real-time evidence collection", "es": "JDG envía un requerimiento legal por el acoso a sus jugadores y recopilará pruebas en tiempo real", "ja": "JDGが選手への誹謗中傷で法的措置、リアルタイムでの証拠保全を表明"}, "body": {"zh": "11 月 20 日，北京 JDG 电子竞技俱乐部发布声明称，2026 年以来多名微博用户持续对旗下选手杨涛（ID：无畏）、黄垚钦（ID：清融）发布侮辱、诽谤性言论，包括辱骂、贬低与诅咒，相关内容已被大量传播，两名选手因此陷入精神困扰与舆论漩涡。俱乐部表示，将持续监控各平台侵权行为、实时取证，并保留依法追究信息发布者与传播者责任的权利。", "en": "Beijing JDG Esports said in a statement on 20 November that since the start of 2026 multiple Weibo users have repeatedly posted insulting and defamatory content about its players Yang Tao (ID: NoFear) and Huang Yaoqin (ID: Qingrong), including abuse, belittlement and curses. The material spread widely and the two players were left distressed and caught in a public opinion storm. The club said it will keep monitoring infringement across platforms, collect evidence in real time, and reserves the right to pursue publishers and spreaders of the content under law.", "es": "El club de esports Beijing JDG afirmó en un comunicado del 20 de noviembre que desde comienzos de 2026 varios usuarios de Weibo han publicado de forma reiterada contenidos insultantes y difamatorios sobre sus jugadores Yang Tao (ID: NoFear) y Huang Yaoqin (ID: Qingrong), con vejaciones, descalificaciones y maldiciones. El material se difundió ampliamente y ambos quedaron afectados y envueltos en una tormenta de opinión. El club dijo que seguirá monitoreando las infracciones en las plataformas, recopilará pruebas en tiempo real y se reserva el derecho de perseguir legalmente a quienes publican y difunden esos contenidos.", "ja": "北京 JDG 電子競技倶楽部は11月20日、2026年以降、複数の微博ユーザーが所属選手の楊涛（ID：無畏）と黄垚欽（ID：清融）について侮辱・誹謗する投稿を繰り返し、罵倒や侮蔑、呪いの言葉を含む内容が広く拡散して両選手が精神的苦痛と世論の渦に陥ったとする声明を出した。クラブは各プラットフォームの権利侵害を監視し、リアルタイムで証拠を保全したうえ、投稿者と拡散者の法的責任を追及する権利を留保するとした。"}, "why": {"zh": "电竞饭圈的治理正在从「平台封号」走向「俱乐部法务」——取证主体变了，威慑力也就变了。这类案件的难点从来不在声明，而在举证与执行：侮辱性言论的传播链条有多长，追责就能走多远。", "en": "Governance of esports fandom is shifting from platform bans to club legal teams: change the party collecting evidence and the deterrent changes with it. The hard part is never the statement but proof and enforcement — how far the chain of spread can be traced is how far liability can reach.", "es": "La gobernanza del fandom de esports pasa del bloqueo en plataformas a los departamentos legales de los clubes: cambia quién recopila pruebas y cambia el efecto disuasorio. La dificultad nunca está en el comunicado, sino en la prueba y la ejecución: hasta dónde llegue la cadena de difusión, hasta dónde llegará la responsabilidad.", "ja": "eスポーツのファンダム対策は「プラットフォームによるアカウント停止」から「クラブの法務」へ移りつつある。証拠を集める主体が変われば抑止力も変わる。難しいのは声明ではなく立証と執行だ。拡散の連鎖がどこまで辿れるかが、責任の及ぶ範囲を決める。"}}, {"idx": "05", "title": {"zh": "韩国高考查出 49 名偷带手机考生", "en": "South Korea's college entrance exam catches 49 students with smuggled phones", "es": "El examen de acceso surcoreano detecta a 49 alumnos con móviles ocultos", "ja": "韓国の大学修学能力試験、携帯持ち込みの受験生49人を摘発"}, "body": {"zh": "韩国在高考当天向全国手机发送三次灾难警报，警报无法拒收，处于开机状态的手机将以最大音量发出 10.5 秒警报声。据此查出 49 名偷带手机的考生。韩国官方如此严阵以待，与近期接连曝出的 AI 作弊风波直接相关——此前一名税务师资格考试最高分考生公开承认利用 AI 作弊。", "en": "South Korea sent three disaster alerts to phones nationwide on exam day. The alerts cannot be declined, and any phone that is switched on emits a 10.5-second siren at maximum volume, which is how 49 students were caught carrying phones in. The severity reflects a run of AI cheating cases: a top scorer in the tax accountant exam recently admitted using AI to cheat.", "es": "Corea del Sur envió tres alertas de desastre a todos los móviles del país el día del examen. Las alertas no se pueden rechazar y cualquier teléfono encendido emite una sirena de 10,5 segundos al volumen máximo, lo que permitió detectar a 49 alumnos que habían introducido móviles. La dureza responde a una serie de casos de fraude con IA: un aspirante con la mejor nota en el examen de asesor fiscal admitió haber usado IA.", "ja": "韓国は受験当日、全国の携帯電話に3回の災害警報を送った。警報は拒否できず、電源が入った端末は最大音量で10.5秒の警報音を鳴らす。これにより携帯を持ち込んだ受験生49人が判明した。ここまでの厳戒態勢は、相次ぐAI不正の直後だからだ。税理士試験で最高得点だった受験者がAI利用を認めている。"}, "why": {"zh": "用「不可拒收的警报」来防作弊，本质是用物理手段弥补信任缺口。但当 AI 能在几秒内给出答案时，考场规则的对手已经不是手机，而是模型——这条防线迟早要重画。", "en": "Using an alert nobody can decline is a physical patch on a trust gap. But once a model can produce an answer in seconds, the exam rulebook is no longer fighting phones; it is fighting models. That line will have to be redrawn.", "es": "Usar una alerta que nadie puede rechazar es un parche físico a una brecha de confianza. Pero cuando un modelo da una respuesta en segundos, el reglamento ya no combate teléfonos, sino modelos. Esa línea habrá que redibujarla.", "ja": "拒否できない警報で不正を防ぐのは、信頼の隙間を物理的手段で埋める発想だ。だがモデルが数秒で答えを出す時代には、試験規則の相手は携帯ではなくモデルになる。この防衛線はいずれ引き直さざるを得ない。"}}]}, {"key": "ent", "num": "06", "color": "#db2777", "deep": "#b01d5f", "name": {"zh": "娱乐八卦", "en": "Entertainment", "es": "Entretenimiento", "ja": "エンタメ"}, "items": [{"idx": "01", "title": {"zh": "沈腾凭《欢迎来龙餐馆》获亚洲国际电影节最佳男主角", "en": "Shen Teng wins best actor at the Asian World Film Festival for Welcome to Long Restaurant", "es": "Shen Teng gana el premio a mejor actor en el Festival de Cine Asiático por Welcome to Long Restaurant", "ja": "沈騰、「欢迎来龙餐馆」でアジア国際映画祭の最優秀主演男優賞"}, "body": {"zh": "11 月 20 日，电影《欢迎来龙餐馆》官博宣布，该片在第 12 届亚洲国际电影节获最佳影片、最佳男主角两项荣誉，沈腾凭厨师徐福一角获「雪豹奖」最佳男主角，这是他出道二十余年来首个影帝头衔。影片以 2003 年伊拉克战争为背景，讲述中国厨师远赴巴格达接手一家中餐馆、在战火中收留孤儿的故事；8 月 11 日上映，第 8 天票房破 10 亿，最终收在 24 亿元以上，位列 2026 年度内地票房榜第二。该片已代表中国内地角逐第 99 届奥斯卡最佳国际影片。", "en": "The official account of Welcome to Long Restaurant announced on 20 November that the film won best picture and best actor at the 12th Asian World Film Festival, with Shen Teng taking the Snow Leopard award for his role as the cook Xu Fu — his first best-actor title in more than twenty years on screen. Set during the 2003 Iraq War, the film follows a Chinese chef who takes over a restaurant in Baghdad and shelters orphans amid the fighting. Released on 11 August, it passed one billion yuan in eight days and finished above 2.4 billion yuan, second on the 2026 mainland chart. It is China's entry for best international feature at the 99th Academy Awards.", "es": "La cuenta oficial de Welcome to Long Restaurant anunció el 20 de noviembre que la película ganó mejor película y mejor actor en el 12.º Festival de Cine Asiático, con Shen Teng recibiendo el premio Leopardo de las Nieves por su papel del cocinero Xu Fu, su primer título de mejor actor en más de veinte años de carrera. Ambientada en la guerra de Irak de 2003, sigue a un cocinero chino que se hace cargo de un restaurante en Bagdad y acoge a huérfanos en pleno conflicto. Estrenada el 11 de agosto, superó los 1.000 millones de yuanes en ocho días y terminó por encima de 2.400 millones, segunda en la taquilla continental de 2026. Es la candidata de China continental al Óscar a mejor película internacional.", "ja": "映画「欢迎来龙餐馆」の公式アカウントは11月20日、第12回アジア国際映画祭で作品賞と主演男優賞を受賞したと発表した。沈騰が料理人・徐福役で「スノーレパード賞」主演男優賞を受賞し、芸歴20年余りで初の主演男優賞となった。2003年のイラク戦争を背景に、中国の料理人がバグダッドで食堂を引き継ぎ、戦火の中で孤児を引き取る物語。8月11日公開で8日目に興行収入10億元を突破し、最終的に24億元超で2026年の中国本土興収2位。第99回アカデミー賞国際長編映画賞の中国本土代表作品でもある。"}, "why": {"zh": "400 亿票房与「零主流影帝」的错位，一直是沈腾身上最容易被讨论的标签。这次获奖的意义不止于补齐奖杯，更在于「喜剧演员转正剧」这条路径被国际影展确认了一次——而这部片子还挂着奥斯卡代表作的担子。", "en": "Forty billion yuan at the box office with no mainstream best-actor trophy has long been Shen Teng's most discussed paradox. This win is not just a missing item on the shelf: it validates the comedy-to-drama path at an international festival, on a film that also carries China's Oscar submission.", "es": "Cuarenta mil millones de yuanes de taquilla sin un premio interpretativo mainstream ha sido el gran paradoxo de Shen Teng. Este galardón no solo llena un hueco: valida en un festival internacional el paso de la comedia al drama, en una película que además es la candidata al Óscar.", "ja": "興収400億元と「主流の主演男優賞ゼロ」というねじれは、沈騰につきまとう最大の論点だった。今回の受賞は棚の空欄を埋めるだけでなく、「コメディアンから本格派へ」という道を国際映画祭が一度認めたことを意味する。しかも本作はアカデミー代表作という荷も負う。"}}, {"idx": "02", "title": {"zh": "《两京十五日》央八开播，林更新演市井捕快", "en": "Two Capitals, Fifteen Days opens on CCTV-8 with Lin Gengxin as a street-level constable", "es": "Two Capitals, Fifteen Days se estrena en CCTV-8 con Lin Gengxin como alguacil callejero", "ja": "「両京十五日」がCCTV-8で開始、林更新が市井の捕快役"}, "body": {"zh": "11 月 20 日晚，古装历史悬疑剧《两京十五日》在央视八套黄金时段开播，爱奇艺同步独播。该剧改编自马伯庸同名小说、张黎执导，成毅与林更新领衔主演，讲述明洪熙元年太子朱瞻基必须在十五天内沿京杭大运河北上两千二百余里赶回北京继位的故事。林更新饰演南京捕快吴定缘，第二集预告中他押着「嫌犯」进衙门、身份揭穿后自己反成阶下囚。开播当晚，「林更新你怎么什么都敢演」「林更新新剧把成毅气笑了」等话题登上微博文娱榜，热度一度达 59.3 万。", "en": "The historical mystery drama Two Capitals, Fifteen Days premiered in CCTV-8's prime slot on the evening of 20 November, streaming exclusively on iQiyi. Adapted from Ma Boyong's novel and directed by Zhang Li, it stars Cheng Yi and Lin Gengxin and follows Crown Prince Zhu Zhanji, who must travel more than 2,200 li north along the Grand Canal within fifteen days to reach Beijing and take the throne in the first year of Hongxi. Lin plays Wu Dingyuan, a Nanjing constable who arrests the prince as a suspect and ends up in prison himself once the identity is revealed. Topics around Lin's range and the pair's on-screen friction climbed Weibo's entertainment chart, peaking near 593,000 in heat.", "es": "El drama histórico de misterio Two Capitals, Fifteen Days se estrenó en el horario estelar de CCTV-8 la noche del 20 de noviembre, con emisión exclusiva en iQiyi. Adaptación de la novela de Ma Boyong dirigida por Zhang Li, protagonizada por Cheng Yi y Lin Gengxin, sigue al príncipe heredero Zhu Zhanji, que debe recorrer más de 2.200 li al norte por el Gran Canal en quince días para llegar a Pekín y asumir el trono. Lin interpreta a Wu Dingyuan, un alguacil de Nankín que detiene al príncipe como sospechoso y acaba él mismo en prisión cuando se revela la identidad. Los temas sobre su registro actoral y la química con Cheng Yi escalaron en la lista de Weibo hasta cerca de 593.000 de popularidad.", "ja": "時代劇ミステリー「両京十五日」が11月20日夜、CCTV-8のゴールデンタイムに始まり、iQiyiでも独占配信された。馬伯庸の小説を原作に張黎が監督、成毅と林更新が主演。洪熙元年、皇太子・朱瞻基が15日以内に大運河を2200里余り北上して北京に戻り即位しなければならない物語だ。林更新は南京の捕快・呉定縁を演じ、第二話の予告では「容疑者」を捕らえて連行した末、正体が判明して自分が囚人になる。初回当晚、林更新の演技の幅や成毅との絡みをめぐる話題が微博のエンタメ榜に入り、熱度は一時59.3万に達した。"}, "why": {"zh": "马伯庸的「时限+地理」结构最考验改编节奏，张黎的镜头语言又偏慢，两者的张力决定了这部剧是「历史正剧」还是「公路悬疑」。首播当晚热搜集中在演员反差上，说明观众先被人物吸引——接下来考验的是十五天能不能撑住四十集。", "en": "Ma Boyong's deadline-plus-geography structure demands a tight adaptation, while Zhang Li's camera work tends to be slow; the tension decides whether this is a historical drama or a road mystery. Opening-night chatter focused on the actors'反差, meaning viewers were hooked by character first. The real test is whether fifteen days can carry forty episodes.", "es": "La estructura de plazo más geografía de Ma Boyong exige una adaptación ágil, mientras la cámara de Zhang Li tiende a la lentitud; esa tensión decide si estamos ante un drama histórico o un misterio de carretera. El primer día los temas se centraron en el contraste actoral, señal de que el público entró por los personajes. La prueba es si quince días sostienen cuarenta episodios.", "ja": "馬伯庸の「期限＋地理」という構造は改変のテンポを厳しく問い、張黎の映像はどちらかといえば遅い。その緊張が「歴史ドラマ」か「ロードミステリー」かを決める。初回は役柄のギャップが話題を占め、視聴者が人物から入ったことを示す。問われるのは15日で40話を支えられるかだ。"}}, {"idx": "03", "title": {"zh": "《声生不息·天涯共此时》首播，「收视第一」说法待核", "en": "Endless Melodies premieres, but the ratings-first claim lacks a source", "es": "Endless Melodies se estrena, pero la cifra de audiencia líder no tiene fuente", "ja": "「声生不息・天涯共此時」が初回放送、「視聴率1位」の根拠は不明"}, "body": {"zh": "11 月 20 日 12 时，《声生不息·天涯共此时》在芒果 TV 上线、19 时 30 分在湖南卫视播出，先导片已于 11 月 19 日上线。首期由任贤齐、陈楚生、毛不易、张信哲、欧阳娜娜等演绎《狂流》《伤心太平洋》《千年泪》《爱就一个字》《光阴的故事》等金曲，按年代梳理两岸交流的音乐记忆。节目播出后多个账号称「收视第一」，但新浪娱乐核实发现，部分流传的收视截图标注日期为 2025 年 11 月 21 日、与本节目的首播时间不符，目前公开渠道尚未见收视统计机构的正式报告。", "en": "Endless Melodies: A Shared Moon premiered at noon on 20 November on Mango TV and at 19:30 on Hunan Satellite TV, after a teaser on 19 November. The first episode featured Richie Jen, Chen Chusheng, Mao Buyi, Jeff Chang and Nana Ouyang performing hits such as Wild Current, Sad Pacific, Thousand-Year Tears, Love Is the Only Word and The Story of Time, tracing cross-strait exchange decade by decade. Several accounts claimed the show topped the ratings, but a Sina Entertainment check found some circulating screenshots dated 21 November 2025, which does not match this season's premiere; no official ratings report has been publicly available.", "es": "Endless Melodies: A Shared Moon se estrenó a las 12:00 del 20 de noviembre en Mango TV y a las 19:30 en Hunan Satellite TV, tras un avance el 19. El primer programa contó con Richie Jen, Chen Chusheng, Mao Buyi, Jeff Chang y Nana Ouyang interpretando éxitos como Wild Current, Sad Pacific, Thousand-Year Tears, Love Is the Only Word y The Story of Time, recorriendo el intercambio entre ambas orillas por décadas. Varias cuentas afirmaron que lideró la audiencia, pero una verificación de Sina Entertainment halló capturas fechadas el 21 de noviembre de 2025, incompatible con el estreno de esta temporada; no hay informe oficial de audiencias disponible.", "ja": "「声生不息・天涯共此時」は11月20日12時にMango TV、19時30分に湖南衛視で始まった（予告編は19日）。初回は任賢斉、陳楚生、毛不易、張信哲、欧陽娜娜らが「狂流」「伤心太平洋」「千年泪」「爱就一个字」「光陰的故事」などを披露し、両岸交流の音楽的记忆を年代順にたどった。放送後、複数のアカウントが「視聴率1位」と主張したが、新浪娯楽の検証では、出回っているスクリーンショットの日付が2025年11月21日で今季の初回と合わず、正式な視聴率報告も公開されていない。"}, "why": {"zh": "这一季把音乐节目做成了「共同记忆的编年史」，情感浓度是够的。但「收视第一」的说法在数据口径上站不稳——综艺战报和财报一样，先看统计口径，再看结论；这也提醒观众，热搜上的数字往往比节目本身更需要核实。", "en": "This season turns a music show into a chronicle of shared memory, and the emotional pitch is there. But the ratings-first claim does not hold up on methodology — variety-show scorecards, like earnings reports, need the accounting basis before the conclusion. It is also a reminder that numbers on the trending list often need more verification than the show itself.", "es": "Esta temporada convierte un programa musical en una crónica de la memoria compartida, y la intensidad emocional está. Pero la afirmación de liderar la audiencia no se sostiene metodológicamente: los partes de variedades, como los resultados financieros, exigen conocer la base contable antes de la conclusión. También recuerda que las cifras en tendencias suelen necesitar más verificación que el propio programa.", "ja": "今季は音楽番組を「共有された記憶の年代記」に仕立てており、情感の密度は十分だ。しかし「視聴率1位」はデータの口径で立たない。バラエティの戦果は決算と同じで、結論より先に集計基準を見る必要がある。トレンド上の数字は番組本体より検証が要る、という提醒でもある。"}}, {"idx": "04", "title": {"zh": "欧阳娜娜复刻「浪子踢球」把鞋踢飞", "en": "Nana Ouyang's recreates a viral kick and loses her shoe instead", "es": "Nana Ouyang recrea una patada viral y pierde el zapato", "ja": "欧陽娜娜が「浪子踢球」を再現、ボールではなく靴が飛ぶ"}, "body": {"zh": "欧阳娜娜在《声生不息》节目中复刻网络热梗「浪子踢球」，抬脚发力时球没碰到、鞋子先飞了出去，现场嘉宾与工作人员笑成一片。她本人也跟着大笑，没有回避。相关片段在 11 月 20 日前后集中于微博话题「欧阳娜娜浪子踢球还是踢鞋啊」下传播，多个娱乐账号发布了不同角度的剪辑。", "en": "On Endless Melodies, Nana Ouyang tried to recreate the viral kick from the long-running joke known as prodigal son kicks the ball. She swung, missed the ball entirely and sent her shoe flying instead, to laughter from the guests and crew. She laughed along without embarrassment, and clips spread around 20 November under a Weibo topic asking whether she was kicking the ball or the shoe, with multiple entertainment accounts posting different angles.", "es": "En Endless Melodies, Nana Ouyang intentó recrear la patada viral del conocido como el hijo pródigo patea el balón. Golpeó, falló el balón y lanzó su zapato por los aires, entre risas del público y del equipo. Ella se rió también sin incomodidad, y los clips circularon alrededor del 20 de noviembre bajo un tema de Weibo que preguntaba si pateaba el balón o el zapato, con varias cuentas publicando distintos ángulos.", "ja": "「声生不息」で欧陽娜娜がネットで流行った「浪子踢球」を再現したが、蹴ったのはボールではなく靴だった。靴が飛んでいき、出演者とスタッフが大笑い。本人も気まずがらずに笑った。11月20日前後に微博の話題「欧陽娜娜浪子踢球还是踢鞋啊」で映像が広がり、複数のエンタメアカウントが別アングルのクリップを投稿した。"}, "why": {"zh": "这个片段能出圈，靠的不是设计好的笑点，而是「预期落空 + 本人不尴尬」的组合。在综艺普遍精修的语境里，一次真实的翻车反而成了最有效的路人缘——观众对「完美」已经免疫，对「没端住」还有反应。", "en": "What made it spread was not a scripted gag but the combination of a missed expectation and a subject who did not get embarrassed. In an era of heavily polished variety shows, an honest mishap is the most effective way to win over casual viewers: audiences are immune to perfection and still react to composure slipping.", "es": "Lo que lo hizo viral no fue un gag guionizado, sino la combinación de expectativa fallida y ausencia de vergüenza. En una era de programas muy pulidos, un tropiezo honesto es la forma más eficaz de ganarse al público: la audiencia es inmune a la perfección y todavía reacciona cuando la compostura se resbala.", "ja": "広がったのは台本の笑いではなく、「期待の裏切り＋本人が気まずがらない」という組み合わせだ。演出が精密なバラエティが主流の今、正直な失敗のほうが好感度を取る。観客は「完璧」には免疫だが、「崩れた瞬間」には反応する。"}}, {"idx": "05", "title": {"zh": "罗晋《无声的回响》优酷独播，聚焦听障群体", "en": "Luo Jin's Silent Echo streams on Youku, centred on deaf and hard-of-hearing victims", "es": "Silent Echo, de Luo Jin, se estrena en Youku centrada en víctimas con discapacidad auditiva", "ja": "羅晋主演「無声的回響」が優酷で独占配信、聴覚障害者を描く"}, "body": {"zh": "11 月 20 日 12 时，14 集现实主义刑侦悬疑剧《无声的回响》在优酷全网独播，罗晋领衔主演，牛超执导、叶蘅编剧，张国强、杨童舒、陈雨锶等参演。剧集从九菇湖一具女尸展开，案件牵出听障群体——受害者在受侵害时难以呼救、事后也难以正常指证。央视网文娱转发了定档消息。", "en": "The 14-part realistic crime drama Silent Echo began streaming exclusively on Youku at noon on 20 November. Luo Jin leads, with Niu Chao directing from Ye Heng's script and Zhang Guoqiang, Yang Tongshu and Chen Yusi in support. The story opens with a woman's body at Jiugu Lake and leads into the deaf and hard-of-hearing community, where victims struggle to call for help during an attack and to testify afterwards. CCTV's entertainment account shared the release news.", "es": "El drama policial realista de 14 episodios Silent Echo se estrenó en exclusiva en Youku al mediodía del 20 de noviembre. Luo Jin encabeza el reparto, con Niu Chao en la dirección, guion de Ye Heng y Zhang Guoqiang, Yang Tongshu y Chen Yusi en papeles secundarios. La trama arranca con el cadáver de una mujer en el lago Jiugu y lleva a la comunidad sorda, donde las víctimas apenas pueden pedir ayuda durante una agresión ni testificar después. La cuenta de entretenimiento de CCTV difundió el estreno.", "ja": "全14話のリアリズム刑事ドラマ「無声的回響」が11月20日正午、優酷で独占配信を開始した。羅晋が主演し、牛超監督、葉蘅脚本、張国強、楊童舒、陳雨錕らが共演。九菇湖の女性の遺体から始まり、事件は聴覚障害者のコミュニティに及ぶ。被害者は襲われても助けを呼べず、後から証言することも難しい。CCTV 網のエンタメアカウントも配信開始を伝えた。"}, "why": {"zh": "把「说不出」本身作为悬疑的核心机制，是这类题材少见的切口——不是找出谁说谎，而是先解决「谁能作证」。14 集的体量意味着没有空间注水，成败几乎全压在前三集能不能把那种压抑感立住。", "en": "Making the inability to speak the engine of the mystery is an unusual angle: the question is not who is lying but who is able to testify at all. At 14 episodes there is no room to pad, so the outcome rests almost entirely on whether the first three episodes establish that sense of compression.", "es": "Convertir la incapacidad de hablar en el motor del misterio es un ángulo poco habitual: la pregunta no es quién miente, sino quién puede testificar. Con 14 episodios no hay espacio para relleno, así que el resultado depende de si los tres primeros instalan esa sensación de opresión.", "ja": "「話せない」こと自体をミステリーの駆動装置にするのは珍しい切り口だ。誰が嘘をついたかではなく、誰が証言できるのかが問いになる。全14話では水増しの余地がなく、成否は最初の3話でこの息苦しさを立てられるかにほぼ懸かる。"}}]}], "risk": {"zh": "风险提示：本简报仅作信息汇总，其中涉及的数据不构成任何投资建议。", "en": "Risk notice: this briefing only summarises information; the data cited does not constitute investment advice.", "es": "Aviso de riesgo: este boletín solo resume información; los datos citados no constituyen asesoramiento de inversión.", "ja": "リスク表示：本ブリーフィングは情報の要約であり、記載のデータは投資助言を構成するものではありません。"}}/*__END__*/;

    var nav = (navigator.language || "").toLowerCase();
    if (/^zh/.test(nav)) return "zh";
    if (/^ja/.test(nav)) return "ja";
    if (/^es/.test(nav)) return "es";
    if (/^en/.test(nav)) return "en";
    var tz = "";
    try { tz = Intl.DateTimeFormat().resolvedOptions().timeZone || ""; } catch (e) {}
    if (/^Asia\/Tokyo/.test(tz)) return "ja";
    if (/Europe\/Madrid|America\/(Mexico_City|Bogota|Lima|Santiago|Caracas|Guatemala|La_Paz|San_Jose|Panama|Asuncion|Montevideo|Havana|El_Salvador|Managua|Tegucigalpa|Costa_Rica|San_Salvador)|America\/Argentina\//.test(tz)) return "es";
    if (/^(Europe|America|Australia)\//.test(tz)) return "en";
    return "zh";
  }

  var curLang = "zh";
  var langOpen = false;

  /* ===== 渲染 ===== */
  function renderChrome(lang) {
    var i18n = I18N[lang];
    document.documentElement.lang = LANG_HTML[lang];
    // 报头信息行
    var metaEl = document.getElementById("metaRow");
    if (metaEl) metaEl.textContent = T(BRIEFING.meta, lang);
    // 大日期
    var md = document.getElementById("mastDate");
    if (md) {
      var d = new Date(BRIEFING.date + "T00:00:00");
      md.innerHTML = fmtDate(d, lang) + "<small>" + esc(i18n.dateSub) + "</small>";
    }
    // 文档标题
    var siteName = (lang === "zh") ? "提马早报" : "TIMAB DAILY";
    document.title = siteName + " · " + fmtDate(new Date(BRIEFING.date + "T00:00:00"), lang);
    // 导航签
    var nav = document.getElementById("navChips");
    if (nav) {
      var order = ["pick"].concat(BRIEFING.sections.map(function (s) { return s.key; }));
      nav.innerHTML = "";
      order.forEach(function (key) {
        if (key === "pick") {
          var a = document.createElement("a");
          a.className = "chip-pick"; a.href = "#pick"; a.setAttribute("data-nav", "pick");
          a.textContent = T(BRIEFING.spotlight.badge, lang);
          nav.appendChild(a);
        } else {
          var sec = null;
          BRIEFING.sections.forEach(function (s) { if (s.key === key) sec = s; });
          if (!sec) return;
          var b = document.createElement("a");
          b.href = "#" + key; b.setAttribute("data-nav", key);
          b.style.borderColor = sec.color; b.style.color = sec.deep;
          b.textContent = T(sec.name, lang);
          nav.appendChild(b);
        }
      });
    }
    // 日历文案
    var cb = document.getElementById("calBtnText"); if (cb) cb.textContent = i18n.calBtn;
    var cw = document.getElementById("calWeek");
    if (cw) { cw.innerHTML = ""; i18n.calWeek.forEach(function (w) { var s = document.createElement("span"); s.textContent = w; cw.appendChild(s); }); }
    var cf = document.getElementById("calFoot"); if (cf) cf.textContent = i18n.calFoot;
    // 语言切换器（国旗触发 + 下拉）
    var ls = document.getElementById("langSwitch");
    if (ls) {
      ls.className = "lang-switch" + (langOpen ? " open" : "");
      ls.innerHTML = "";
      var trig = document.createElement("button");
      trig.type = "button"; trig.className = "lang-trigger"; trig.id = "langTrigger";
      trig.setAttribute("aria-haspopup", "true");
      trig.setAttribute("aria-expanded", langOpen ? "true" : "false");
      trig.innerHTML = flag(curLang) + '<span class="caret">▾</span>';
      trig.addEventListener("click", function (e) {
        e.stopPropagation();
        langOpen = !langOpen;
        ls.classList.toggle("open", langOpen);
        trig.setAttribute("aria-expanded", langOpen ? "true" : "false");
      });
      ls.appendChild(trig);
      var menu = document.createElement("div");
      menu.className = "lang-menu"; menu.setAttribute("role", "menu");
      LANGS.forEach(function (l) {
        var item = document.createElement("button");
        item.type = "button"; item.className = "lang-item" + (l === curLang ? " sel" : "");
        item.setAttribute("role", "menuitem"); item.setAttribute("data-lang", l);
        item.innerHTML = flag(l) + '<span class="lbl">' + LANG_LABEL_FULL[l] + "</span>";
        item.addEventListener("click", function (e) {
          e.stopPropagation();
          setLang(l);
        });
        menu.appendChild(item);
      });
      ls.appendChild(menu);
    }
  }

  function renderContent(lang) {
    var i18n = I18N[lang];
    var html = "";
    // 精选
    var sp = BRIEFING.spotlight;
    html += '<section class="spotlight" id="pick">'
      + '<div class="badge"><i></i>' + esc(T(sp.badge, lang)) + "</div>"
      + "<h2>" + titleHtml(sp.title, sp.hl, lang) + "</h2>"
      + '<div class="body">' + esc(T(sp.body, lang)) + "</div>"
      + '<div class="why"><b>' + esc(i18n.why) + "</b>" + esc(T(sp.why, lang)) + "</div>"
      + "</section>";
    // 分类
    html += '<div class="grid">';
    BRIEFING.sections.forEach(function (sec) {
      html += '<section class="card" id="' + sec.key + '" style="--ac:' + sec.color + "; --ac-deep:" + sec.deep + ';">'
        + '<div class="sec-head"><span class="sec-num">' + sec.num + "</span>"
        + "<h3>" + esc(T(sec.name, lang)) + "</h3>"
        + '<span class="en">' + sec.key.toUpperCase() + "</span></div>";
      (sec.items || []).forEach(function (it) {
        html += '<div class="item">';
        html += '<div class="t"><span class="idx">' + it.idx + "</span>";
        if (it.tag) html += '<span class="tag">' + esc(it.tag[lang] != null ? it.tag[lang] : i18n.tag) + "</span>";
        html += titleHtml(it.title, it.hl, lang) + "</div>";
        html += '<div class="d">' + esc(T(it.body, lang)) + "</div>";
        html += '<div class="why"><b>' + esc(i18n.why) + "</b>" + esc(T(it.why, lang)) + "</div>";
        html += "</div>";
      });
      html += "</section>";
    });
    html += "</div>";
    var content = document.getElementById("content");
    if (content) content.innerHTML = html;
    // 页脚
    var risk = document.getElementById("risk");
    if (risk) risk.textContent = T(BRIEFING.risk, lang);
  }

  function setLang(lang) {
    if (LANGS.indexOf(lang) < 0) lang = "zh";
    curLang = lang;
    langOpen = false;
    try { localStorage.setItem("timab_lang", lang); } catch (e) {}
    renderChrome(lang);
    renderContent(lang);
  }

  /* ===== 往期日历（保留原逻辑，文案随语言） ===== */
  function initCalendar() {
    var btn = document.getElementById("calBtn");
    var pop = document.getElementById("calPop");
    var grid = document.getElementById("calGrid");
    var title = document.getElementById("calTitle");
    if (!btn || !pop || !grid || !title) return;

    var parts = BRIEFING.date.split("-");
    var todayKey = parts[0].slice(2) + parts[1] + parts[2];
    var cur = { y: +parts[0], m: +parts[1] };
    var has = {};
    for (var i = 0; i < ARCHIVE_DATES.length; i++) { has[ARCHIVE_DATES[i]] = 1; }
    var HIST_BASE = /\/history\//.test(location.pathname) ? "./" : "history/";

    function ckey(y, m, d) { return String(y).slice(2) + pad(m) + pad(d); }

    function render() {
      var i18n = I18N[curLang];
      title.textContent = i18n.calTitle(cur.y, cur.m);
      grid.innerHTML = "";
      var start = new Date(cur.y, cur.m - 1, 1).getDay();
      var days = new Date(cur.y, cur.m, 0).getDate();
      for (var b = 0; b < start; b++) {
        var blank = document.createElement("span");
        blank.className = "cal-cell is-empty"; grid.appendChild(blank);
      }
      for (var d = 1; d <= days; d++) {
        var k = ckey(cur.y, cur.m, d);
        var cell = document.createElement("span");
        cell.className = "cal-cell" + (has[k] ? " has" : "") + (k === todayKey ? " is-today" : "");
        cell.textContent = d;
        if (has[k]) {
          cell.setAttribute("role", "link"); cell.setAttribute("tabindex", "0");
          cell.title = cur.y + "-" + pad(cur.m) + "-" + pad(d) + " 存档";
          (function (target) {
            var go = function () { window.open(HIST_BASE + target + ".html", "_blank", "noopener"); };
            cell.addEventListener("click", go);
            cell.addEventListener("keydown", function (e) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); go(); } });
          })(k);
        }
        grid.appendChild(cell);
      }
    }
    function toggle(open) {
      pop.hidden = !open;
      btn.setAttribute("aria-expanded", open ? "true" : "false");
      if (open) render();
    }
    btn.addEventListener("click", function (e) { e.stopPropagation(); toggle(pop.hidden); });
    document.getElementById("calPrev").addEventListener("click", function () { cur.m--; if (cur.m < 1) { cur.m = 12; cur.y--; } render(); });
    document.getElementById("calNext").addEventListener("click", function () { cur.m++; if (cur.m > 12) { cur.m = 1; cur.y++; } render(); });
    document.addEventListener("click", function (e) { if (!pop.hidden && !pop.contains(e.target)) toggle(false); });
    document.addEventListener("keydown", function (e) { if (e.key === "Escape" && !pop.hidden) toggle(false); });
  }

  /* ===== 启动 ===== */
  function boot() {
    curLang = detectLang();
    renderChrome(curLang);
    renderContent(curLang);
    initCalendar();
    // 关闭语言下拉：点击外部 / Esc
    document.addEventListener("click", function (e) {
      var ls = document.getElementById("langSwitch");
      if (ls && langOpen && !ls.contains(e.target)) {
        langOpen = false;
        ls.classList.remove("open");
        var t = document.getElementById("langTrigger");
        if (t) t.setAttribute("aria-expanded", "false");
      }
    });
    document.addEventListener("keydown", function (e) {
      if (e.key === "Escape" && langOpen) {
        langOpen = false;
        var ls = document.getElementById("langSwitch");
        if (ls) ls.classList.remove("open");
        var t = document.getElementById("langTrigger");
        if (t) t.setAttribute("aria-expanded", "false");
      }
    });
  }
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", boot);
  } else { boot(); }
})();
</script>
</body>
</html>
