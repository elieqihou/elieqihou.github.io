s en la financiación neta con bonos públicos es la prueba contable más directa de una política fiscal adelantada: con los ingresos tributarios creciendo un 6% y los no tributarios en negativo, la intensidad del gasto se sostiene con emisión. Para el mercado implica una oferta elevada de bonos en el cuarto trimestre, y explica por qué el rendimiento a 10 años cayó 10 puntos básicos el mismo día del desplome bursátil: demanda de refugio y expansión de oferta coincidieron en la misma semana.", "ja": "政府債券の純調達が前年同月比で約7000億元増えたことは、「財政の前倒し」を示す最も直接的な記録だ。税収が6％増、非税収入がマイナスに転じる組み合わせの下で、支出の強度を債券調達が支えている。市場にとっては第4四半期の金利債供給圧力が小さくないことを意味し、株が急落した同じ日に10年債利回りが10ベーシスポイント低下した理由でもある。逃避需要と供給増が同じ週に出会ったのだ。"}}]}, {"key": "spo", "num": "04", "color": "#15803d", "deep": "#0f5f2e", "name": {"zh": "体育竞技", "en": "Sport", "es": "Deportes", "ja": "スポーツ"}, "items": [{"idx": "01", "tag": {"zh": "进展"}, "title": {"zh": "中国香港羽毛球公开赛收官日：王祉怡争卫冕，混双提前包揽冠亚军", "en": "Hong Kong badminton Open final day: Wang Zhiyi defends, mixed doubles already a Chinese one-two", "es": "Último día del Abierto de Hong Kong: Wang Zhiyi defiende título y el dobles mixto chino ya tiene final asegurada", "ja": "香港オープン最終日、王祉怡が連覇へ 混合複は中国勢で決勝を独占"}, "body": {"zh": "11 月 21 日，世界羽联超级 500 级别的 2026 年中国香港羽毛球公开赛结束半决赛，中国队当日出战的三组选手全部获胜。女单头号种子王祉怡以 21 比 15、21 比 15 横扫日本新星宫崎友花，整场仅耗时 49 分钟，连续两周在该轮次击败同一对手，本赛季第 7 次闯入单打决赛。混双头号种子冯彦哲/黄东萍以 21 比 17、21 比 18 战胜马来西亚组合吴埙阀/赖洁敏，2 号种子蒋振邦/魏雅欣以 21 比 13、21 比 13 轻取印尼组合德扬/费利莎，两对中国组合会师决赛，国羽提前锁定该项目冠亚军——这是国羽混双本赛季第 8 次在超级 500 及以上级别赛事中会师。11 月 22 日 14 时起，五个单项决赛依次开打：王祉怡对阵泰国选手李美妙（交手 6 比 1 领先），混双为国羽内战（「凤凰」组合 15 胜 5 负占优，但「丫邦」组合近两次交手连胜），男单由丹麦安东森对阵泰国昆拉武特（交手 9 比 4），男双与女双均无中国组合。", "en": "Semi-finals at the BWF Super 500 Hong Kong Open finished on 21 November with all three Chinese entries winning. Top seed Wang Zhiyi swept Japan's Miyazaki Tomoka 21-15, 21-15 in 49 minutes, beating the same opponent at the same stage two weeks running and reaching her seventh singles final of the season. In mixed doubles, top seeds Feng Yanzhe and Huang Dongping beat Malaysia's Goh Soon Huat and Lai Shevon Jemie 21-17, 21-18, while second seeds Jiang Zhenbang and Wei Yaxin dismissed Indonesia's Dejan Ferdinansyah and Felisha Alberta 21-13, 21-13, giving China both finalists and the title — the eighth time this season Chinese mixed pairs have met in a final at Super 500 level or above. From 14:00 on 22 November the five finals follow in order: Wang against Thailand's Pornpawee Chochuwong (leading 6-1 head to head), an all-Chinese mixed doubles final (Feng and Huang lead 15-5, but Jiang and Wei won the last two meetings), and Anders Antonsen against Kunlavut Vitidsarn (9-4) in the men's singles. No Chinese pair reached the men's or women's doubles finals.", "es": "Las semifinales del Abierto de Hong Kong, de categoría Super 500, terminaron el 21 de noviembre con victoria de las tres representaciones chinas. La cabeza de serie número uno, Wang Zhiyi, barrió a la japonesa Miyazaki Tomoka por 21-15 y 21-15 en 49 minutos, venciendo a la misma rival en la misma ronda dos semanas seguidas y alcanzando su séptima final individual de la temporada. En dobles mixto, los primeros favoritos Feng Yanzhe y Huang Dongping superaron a los malasios Goh Soon Huat y Lai Shevon Jemie por 21-17 y 21-18, mientras los segundos favoritos Jiang Zhenbang y Wei Yaxin se deshicieron de los indonesios Dejan Ferdinansyah y Felisha Alberta por 21-13 y 21-13, de modo que China tendrá a los dos finalistas y el título asegurado: la octava vez esta temporada que parejas mixtas chinas se citan en una final de Super 500 o superior. Desde las 14:00 del 22 de noviembre se disputan las cinco finales: Wang contra la tailandesa Pornpawee Chochuwong (6-1 en el historial), una final china de mixtos (Feng y Huang lideran 15-5, pero Jiang y Wei ganaron los dos últimos duelos) y Anders Antonsen frente a Kunlavut Vitidsarn (9-4) en individual masculino. Ninguna pareja china llegó a las finales de dobles masculino ni femenino.", "ja": "バドミントンの SUPER 500、香港オープンは11月21日に準決勝を終え、中国勢が出場した3組すべてが勝利した。女子シングルス第1シードの王祉怡は宮崎友花を21-15、21-15で退け、49分で決着。同じ相手に2週連続で同じ段階で勝ち、今季7度目のシングルス決勝進出となった。混合複は第1シードの馮彦哲・黄東萍がマレーシアのゴー・スン・フアット、ライ・シェボン・ジェミー組を21-17、21-18で下し、第2シードの蒋振邦・魏雅欣はインドネシアのデジャン・フェルディナンシャー、フェリシャ・アルベルタ組を21-13、21-13で退けた。中国ペア同士の決勝となり優勝を確定。SUPER 500 以上で中国の混合複が決勝で顔を合わせるのは今季8度目だ。11月22日14時から5種目の決勝が順に行われる。王はタイのポーンパウィー・チョーチュウォンと対戦（対戦成績6勝1敗）、混合複は中国対決（馮・黄組が15勝5敗でリードするが、蒋・魏組が直近2連勝）、男子シングルスはアンダース・アントンセンとクンラウット・ウィティッサーン（9勝4敗）。男子複と女子複に中国ペアは残っていない。"}, "why": {"zh": "王祉怡这场决赛的分量不在对手强弱，而在「8 个月冠军荒」这个背景：本赛季她 7 进决赛只拿到全英一冠，其余五次都是亚军，守擂的心理成本比冲击更高。混双会师则把国羽的厚度摆上了台面——第 8 次在超级 500 及以上级别包揽决赛席位，这个数字比任何一块金牌更能说明项目储备。", "en": "The weight of Wang's final is not the opponent but the eight-month title drought behind it: seven finals this season, one title at the All England, five runner-up finishes, and defending carries a higher psychological cost than chasing. The mixed doubles one-two puts China's depth on the table — an eighth final between Chinese pairs at Super 500 level or above says more about the pipeline than any single gold.", "es": "El peso de esta final para Wang no está en la rival, sino en los ocho meses sin título: siete finales esta temporada, un trofeo en el All England y cinco subcampeonatos; defender cuesta psicológicamente más que perseguir. El duelo chino de mixtos exhibe la profundidad del equipo: ocho finales entre parejas chinas en Super 500 o superior dicen más de la cantera que cualquier medalla.", "ja": "王祉怡にとってこの決勝の重みは相手の強さではなく「8か月の優勝なし」という背景にある。今季7度の決勝でタイトルは全英のみ、残る5度は準優勝。守る側の心理的コストは挑む側より高い。混合複の決勝独占は中国の層の厚さを可視化した。SUPER 500 以上で中国ペア同士の決勝は今季8度目であり、この数字はどの金メダルよりも選手層を雄弁に語る。"}}, {"idx": "02", "tag": {"zh": "进展"}, "title": {"zh": "ATP 总决赛：阿尔卡拉斯逆转谢尔顿，将与兹维列夫争冠", "en": "ATP Finals: Alcaraz comes back past Shelton and will face Zverev for the title", "es": "ATP Finals: Alcaraz remonta ante Shelton y disputará el título con Zverev", "ja": "ATP ファイナルズ、アルカラスがシェルトンを逆転 決勝でズベレフと対戦"}, "body": {"zh": "当地时间 11 月 21 日，在意大利都灵进行的 ATP 年终总决赛结束两场半决赛。阿尔卡拉斯以 3 比 6、6 比 3、7 比 6（1）逆转美国选手谢尔顿，比赛耗时 2 小时 1 分钟；他在第二盘第八局完成全场首次破发，决胜盘抢七连拿 7 分，一发得分率 80%、轰出 33 记制胜分。这是阿尔卡拉斯连续第二年闯入年终总决赛决赛，室内硬地本赛季 14 战全胜，并将在决赛中争取个人首座年终总决赛冠军——去年他在都灵决赛负于辛纳。另一场半决赛，兹维列夫直落两盘击败梅德韦杰夫，时隔五年再次打进年终总决赛决赛。决赛于 11 月 22 日进行，两人此前交手 13 次，兹维列夫 6 胜 7 负。", "en": "Both semi-finals at the ATP Finals in Turin were decided on 21 November. Carlos Alcaraz came from a set down to beat Ben Shelton 3-6, 6-3, 7-6(1) in two hours and one minute, breaking for the first time in the eighth game of the second set and taking seven straight points in the deciding tie-break; he won 80% of points behind his first serve and struck 33 winners. It is his second consecutive final at the year-end event, he is 14-0 indoors this season, and he is chasing his first ATP Finals title after losing last year's final in Turin to Jannik Sinner. In the other semi-final Alexander Zverev beat Daniil Medvedev in straight sets to reach the final for the first time in five years. They meet on 22 November with Zverev trailing 6-7 in their 13 previous matches.", "es": "Las dos semifinales de las ATP Finals de Turín se resolvieron el 21 de noviembre. Carlos Alcaraz remontó ante Ben Shelton para ganar por 3-6, 6-3 y 7-6(1) en dos horas y un minuto, con el primer quiebre en el octavo juego del segundo set y siete puntos seguidos en el desempate final; ganó el 80% de los puntos con primer saque y firmó 33 golpes ganadores. Es su segunda final consecutiva en el torneo de maestros, está 14-0 en pista cubierta esta temporada y busca su primer título tras perder la final del año pasado en Turín ante Jannik Sinner. En la otra semifinal, Alexander Zverev superó a Daniil Medvedev en dos sets y vuelve a la final cinco años después. Se enfrentan el 22 de noviembre con un historial de 6-7 para el alemán en 13 partidos.", "ja": "イタリア・トリノで開かれている ATP ファイナルズは11月21日に準決勝2試合を行った。カルロス・アルカラスはベン・シェルトンに3-6、6-3、7-6（1）で逆転勝ち。試合時間は2時間1分で、第2セット第8ゲームで初ブレーク、最終セットのタイブレークでは7ポイント連取した。ファーストサーブからの得点率は80％、ウィナーは33本。2年連続の決勝進出で、今季室内ハードは14戦全勝。昨年トリノの決勝でシナーに敗れており、初の年間王者を狙う。もう一つの準決勝ではズベレフがメドベージェフをストレートで下し、5年ぶりの決勝進出。決勝は11月22日、過去13回の対戦はズベレフの6勝7敗。"}, "why": {"zh": "阿尔卡拉斯带着左腿绷带打完三盘，抢七却连拿 7 分——这场球的看点不是比分，而是他在身体受限时把比赛压缩成关键分的能力。决赛对上兹维列夫，交手 6 比 7 落后，而德国人半决赛两盘速胜、体能储备更足；都灵的场地偏快，发球权重的抬升对兹维列夫是结构性利好。", "en": "Alcaraz played three sets with strapping on his left leg and then took seven straight points in the tie-break; the story is not the score but his ability to compress a match into the few points that decide it while physically limited. Against Zverev he trails 6-7 head to head, and the German arrives off a straight-sets semi-final with more in the tank; Turin's quick court raises the value of the serve, which structurally favours Zverev.", "es": "Alcaraz jugó tres sets con vendaje en la pierna izquierda y luego ganó siete puntos seguidos en el desempate; lo relevante no es el marcador, sino su capacidad de comprimir el partido en los pocos puntos que lo deciden cuando el cuerpo no responde. Ante Zverev está 6-7 en el historial, y el alemán llega de una semifinal en dos sets con más reserva; la pista rápida de Turín eleva el peso del saque, lo que favorece estructuralmente al alemán.", "ja": "アルカラスは左足にテーピングを施したまま3セットを戦い、タイブレークでは7ポイントを連取した。焦点はスコアではなく、身体が万全でないときに試合を「決定的な数ポイント」に圧縮する力だ。決勝の相手ズベレフとは6勝7敗。ドイツ人は準決勝をストレートで勝ち上がり体力の余裕がある。トリノのコートは速く、サーブの比重が上がることはズベレフに構造的な追い風となる。"}}, {"idx": "03", "title": {"zh": "NBA 杯：湖人 106 比 104 险胜国王升西部第一，亚历山大 40 分助雷霆过关", "en": "NBA Cup: Lakers edge Kings 106-104 to top the West; Alexander's 40 lifts Thunder", "es": "NBA Cup: los Lakers vencen 106-104 a los Kings y lideran el Oeste; Alexander anota 40 en el triunfo del Thunder", "ja": "NBA カップ、レイカーズがキングスに106-104 西地区首位に サンダーはアレクサンダー40得点"}, "body": {"zh": "北京时间 11 月 21 日，NBA 杯小组赛第二个比赛日结束 9 场较量。湖人主场 106 比 104 两分险胜国王：终场前 1 分钟双方战平，格兰姆斯投中关键三分，拉文两罚一中、凯斯勒两罚不中，国王最后一攻拉文三分不中。东契奇 25 分 4 篮板 8 助攻，国王亨特 30 分、小萨博尼斯 19 分 16 篮板、拉文 19 分。湖人战绩来到 14 胜 3 负，反超马刺升至西部第一；国王遭遇 8 连败，1 胜 14 负垫底。掘金主场 133 比 124 击败火箭，末节一波 10 比 0 完成反超；雷霆 126 比 120 胜鹈鹕，亚历山大 24 投 14 中砍下 40 分 8 助攻，球队末节单节净胜 12 分；猛龙 105 比 102 客胜活塞，巴恩斯 29 分 5 篮板 5 助攻；奇才 98 比 94 客胜公牛，公牛第三节仅得 9 分。", "en": "Nine NBA Cup group games were completed on 21 November Beijing time. The Lakers beat Sacramento 106-104 at home: the sides were level with a minute left, Grimes hit a key three, LaVine made one of two free throws and Kessler missed both, and LaVine's final three missed. Doncic had 25 points, four rebounds and eight assists; Hunter scored 30 for Sacramento with Sabonis adding 19 points and 16 rebounds and LaVine 19. The Lakers improved to 14-3 and moved ahead of San Antonio for first in the West, while the Kings fell to 1-14 with an eighth straight loss. Denver beat Houston 133-124 after a 10-0 run in the fourth; Oklahoma City beat New Orleans 126-120 as Shai Gilgeous-Alexander scored 40 on 14-of-24 shooting with eight assists and the Thunder won the fourth quarter by 12; Toronto won 105-102 in Detroit behind Scottie Barnes's 29 points, five rebounds and five assists; Washington won 98-94 in Chicago, where the Bulls scored just nine points in the third quarter.", "es": "El 21 de noviembre (hora de Pekín) se completaron nueve partidos de la fase de grupos de la NBA Cup. Los Lakers vencieron 106-104 a Sacramento en casa: con un minuto por jugar el marcador estaba igualado, Grimes anotó un triple clave, LaVine metió uno de dos libres y Kessler falló ambos, y el último triple de LaVine no entró. Doncic sumó 25 puntos, cuatro rebotes y ocho asistencias; Hunter anotó 30 por los Kings, con Sabonis en 19 puntos y 16 rebotes y LaVine en 19. Los Lakers suben a 14-3 y superan a San Antonio en el liderato del Oeste, mientras los Kings caen a 1-14 con su octava derrota consecutiva. Denver ganó 133-124 a Houston tras un parcial de 10-0 en el último cuarto; Oklahoma City venció 126-120 a Nueva Orleans con 40 puntos de Shai Gilgeous-Alexander (14 de 24 en tiros) y ocho asistencias, ganando el último cuarto por 12; Toronto se impuso 105-102 en Detroit con 29 puntos, cinco rebotes y cinco asistencias de Scottie Barnes; Washington ganó 98-94 en Chicago, donde los Bulls solo anotaron nueve puntos en el tercer cuarto.", "ja": "北京時間11月21日、NBA カップのグループステージ2日目で9試合が行われた。レイカーズは本拠地でキングスを106-104で破った。残り1分で同点となり、グライムスが重要な3ポイントを決め、ラビーンはフリースロー2本中1本、ケスラーは2本とも外し、最後のラビーンの3ポイントも外れた。ドンチッチは25得点4リバウンド8アシスト、キングスはハンター30得点、サボニス19得点16リバウンド、ラビーン19得点。レイカーズは14勝3敗でスパーズを抜いて西地区首位、キングスは8連敗で1勝14敗となった。ナゲッツは第4クォーターの10-0でヒューストンを133-124、サンダーはアレクサンダーが24本中14本成功で40得点8アシストを記録しペリカンズを126-120、第4クォーターで12点差をつけた。ラプターズはバーンズの29得点5リバウンド5アシストでデトロイトに105-102、ウィザーズはシカゴに98-94で勝利し、ブルズは第3クォーターでわずか9得点だった。"}, "why": {"zh": "湖人的 14 胜 3 负不是靠某一场爆发，而是靠「最后 5 秒还有人能投进」这种细节攒出来的；国王 8 连败、1 胜 14 负，同一个夜晚把两种建队结果摆在一起。亚历山大 40 分那场更值得看：雷霆在第四节净胜 12 分，说明他们的赢球方式已经从「天赋压制」转向「末节执行」。", "en": "The Lakers' 14-3 is not built on one outburst but on details like having someone who can make a shot in the final five seconds; the Kings at 1-14 with eight straight losses put the two outcomes of team-building side by side on the same night. Alexander's 40-point game is the more instructive one: Oklahoma City won the fourth quarter by 12, which says their way of winning has shifted from talent overwhelm to late-game execution.", "es": "El 14-3 de los Lakers no nace de una explosión puntual, sino de detalles como tener a alguien que anote en los últimos cinco segundos; los Kings con 1-14 y ocho derrotas seguidas ponen los dos resultados posibles de un proyecto en la misma noche. El partido de 40 puntos de Alexander es más ilustrativo: Oklahoma City ganó el último cuarto por 12, señal de que su forma de ganar ha pasado del desborde de talento a la ejecución final.", "ja": "レイカーズの14勝3敗は一度の爆発ではなく、「残り5秒で決められる選手がいる」という細部の積み重ねだ。キングスの1勝14敗・8連敗と並べると、同じ夜にチーム作りの二つの結果が並ぶ。より示唆的なのはアレクサンダーの40得点だ。サンダーは第4クォーターで12点差をつけており、勝ち方が「才能の圧倒」から「終盤の執行」へ移ったことを示す。"}}, {"idx": "04", "title": {"zh": "短道速滑世界巡回赛首尔站：中国队夺女子 3000 米接力金牌", "en": "Short track World Tour in Seoul: China wins the women's 3,000m relay", "es": "Circuito Mundial de pista corta en Seúl: China gana el relevo femenino de 3.000 metros", "ja": "ショートトラック世界ツアー・ソウル大会、中国が女子3000mリレーで優勝"}, "body": {"zh": "据央视新闻，2026/2027 赛季国际滑联短道速滑世界巡回赛首尔站女子 3000 米接力决赛，中国队夺得金牌，这是中国短道速滑队新赛季夺得的首个世巡赛冠军。同一站比赛中，中国男队在男子 5000 米接力小组赛中位列第二，晋级半决赛；孙龙在男子 1000 米以 1 分 28 秒 277 的成绩晋级。本赛季世界巡回赛为米兰冬奥会后的首个完整赛季，各队普遍处于新老交替阶段。", "en": "CCTV reported that China won the women's 3,000m relay final at the Seoul stop of the 2026/2027 ISU Short Track World Tour, the team's first World Tour title of the new season. At the same event the Chinese men's team finished second in their 5,000m relay heat to reach the semi-finals, and Sun Long advanced in the 1,000m with a time of 1:28.277. This season is the first full campaign since the Milan Winter Olympics, with most teams in transition between generations.", "es": "La televisión estatal china informó de que China ganó la final del relevo femenino de 3.000 metros en la prueba de Seúl del Circuito Mundial de pista corta 2026/2027, el primer título del equipo en el circuito esta temporada. En la misma cita, el equipo masculino chino quedó segundo en su serie del relevo de 5.000 metros y pasó a semifinales, y Sun Long avanzó en los 1.000 metros con 1:28,277. Esta temporada es la primera completa tras los Juegos de Invierno de Milán, con la mayoría de los equipos en relevo generacional.", "ja": "中国中央電視台によると、2026/2027シーズンの ISU ショートトラック世界ツアー、ソウル大会の女子3000メートルリレー決勝で中国が優勝し、新シーズン初の世界ツアータイトルを手にした。同じ大会で中国男子は5000メートルリレーの予選を2位で通過して準決勝へ進み、孫龍は1000メートルで1分28秒277を記録して勝ち上がった。今季はミラノ冬季五輪後初のフルシーズンで、各国とも世代交代の途上にある。"}, "why": {"zh": "接力金牌比个人项目更能说明队伍状态：它要四个人在交接区把速度接住，容错率极低。新赛季首个世巡赛冠军落在接力而非单项，说明中国短道的厚度还在，但尖刀的绝对速度仍需在后续分站验证——米兰周期之后的第一年，本来就是「先看体系、再看个人」的年份。", "en": "A relay gold says more about a team's condition than an individual title: four skaters have to carry speed through the exchanges with almost no margin for error. That the first World Tour win of the season came in a relay rather than an individual event suggests China's depth is intact while the top-end speed still needs confirming at later stops — the first year after a Milan cycle is, by nature, a year to read the system before the individuals.", "es": "Un oro de relevos dice más del estado de un equipo que un título individual: cuatro patinadores deben sostener la velocidad en los cambios con un margen de error mínimo. Que el primer triunfo de la temporada llegara en relevos y no en pruebas individuales sugiere que la profundidad china se mantiene, mientras la velocidad punta aún debe confirmarse en las siguientes paradas: el primer año tras un ciclo olímpico es, por definición, un año para leer el sistema antes que a los individuos.", "ja": "リレーの金メダルは個人種目よりチームの状態を語る。4人が交代区間で速度をつなぐ必要があり、許容誤差は極めて小さい。今季初の世界ツアー優勝が個人種目ではなくリレーだったことは、中国の層の厚さが健在である一方、トップスピードは今後の大会で確認が必要だということを示す。ミラノ周期後の1年目は、まず体系を見て、次に個人を見る年である。"}}, {"idx": "05", "title": {"zh": "速滑世界杯：宁忠岩 1500 米夺冠并打破场地纪录", "en": "Speed skating World Cup: Ning Zhongyan wins the 1,500m with a track record", "es": "Copa del Mundo de patinaje de velocidad: Ning Zhongyan gana los 1.500 m con récord de pista", "ja": "スピードスケート W 杯、寧忠岩が1500m優勝とリンク記録"}, "body": {"zh": "据央视新闻，2026/2027 赛季国际滑联速度滑冰世界杯男子 1500 米比赛中，米兰冬奥会冠军、中国选手宁忠岩以 1 分 43 秒 587 的成绩夺得冠军，并打破场地纪录。这是宁忠岩本赛季连续第二站世界杯在该项目登上最高领奖台。此前一站比赛中，他同样在 1500 米项目夺冠。", "en": "CCTV reported that China's Ning Zhongyan, the Milan Winter Olympics champion, won the men's 1,500m at the 2026/2027 ISU Speed Skating World Cup in 1:43.587, breaking the track record. It was his second consecutive World Cup win in the event this season, having also taken the 1,500m at the previous stop.", "es": "La televisión estatal china informó de que el campeón olímpico de Milán, el chino Ning Zhongyan, ganó los 1.500 metros de la Copa del Mundo de patinaje de velocidad 2026/2027 con 1:43,587, batiendo el récord de la pista. Es su segunda victoria consecutiva en la distancia esta temporada, tras imponerse también en la parada anterior.", "ja": "中国中央電視台によると、2026/2027シーズンの ISU スピードスケート W 杯男子1500メートルで、ミラノ冬季五輪王者の寧忠岩が1分43秒587で優勝し、リンク記録を更新した。今季この種目で2大会連続の勝利となり、前戦でも1500メートルを制している。"}, "why": {"zh": "1500 米是速滑里最考验「配速判断」的项目——既不能像 500 米那样一把梭，也没有 5000 米的容错空间。连续两站夺冠且破场地纪录，说明宁忠岩现在的状态不是单场爆发，而是把冬奥后的训练周期接上了；接下来的观察点是长距离与团体追逐能否同步跟上。", "en": "The 1,500m is where pacing judgment matters most in speed skating: you cannot go all-out as in the 500m, and there is none of the 5,000m's margin for error. Two straight wins with a track record suggest Ning's form is not a one-off peak but a training cycle that has carried over from the Olympics; the next thing to watch is whether the longer distances and team pursuit keep pace.", "es": "Los 1.500 metros son la prueba donde más importa la gestión del ritmo: no se puede salir a todo como en los 500 y no existe el margen de error de los 5.000. Dos victorias seguidas con récord de pista sugieren que la forma de Ning no es un pico aislado, sino un ciclo de entrenamiento que ha continuado tras los Juegos; queda por ver si las distancias largas y la persecución por equipos acompañan.", "ja": "1500メートルはペース配分の判断が最も問われる種目だ。500メートルのように突っ込むわけにもいかず、5000メートルのような余裕もない。2大会連続優勝とリンク記録は、寧忠岩の状態が単発のピークではなく、五輪後のトレーニング周期がつながっていることを示す。次に見るべきは長距離とチームパシュートが同時に伸びるかどうかだ。"}}]}, {"key": "hot", "num": "05", "color": "#6d28d9", "deep": "#54209f", "name": {"zh": "网络热点", "en": "Trending", "es": "Tendencias", "ja": "ネット話題"}, "items": [{"idx": "01", "title": {"zh": "问界 M9 车主开辅助驾驶后熟睡，客服与交警先后回应", "en": "AITO M9 driver filmed asleep at 110 km/h on assisted driving; brand and police respond", "es": "Un conductor de AITO M9 grabado dormido con la conducción asistida; marca y policía responden", "ja": "AITO M9 の運転手が運転支援中に居眠り、メーカーと交警が相次いで応答"}, "body": {"zh": "11 月 21 日，话题「问界 M9 车主开辅助驾驶熟睡」冲上微博热搜。网友发布的视频显示，一名疑似问界 M9 车主在高速路段开启辅助驾驶后，于主驾位置躺倒熟睡，车辆仍在高速行驶；该车主在发布文案中称「出差回程太累了，倒头就睡，华为问界 M9 全程智驾开回武汉」。记者搜索发现，该账号在多个平台已无法检索。问界用户关怀中心接线客服表示，已记录并转交专项对接核实，并强调问界 ADS 仅为辅助驾驶而设计，并非自动驾驶或无人驾驶，不能取代驾驶员的专注驾驶与准确判断，驾驶员应始终手握方向盘、关注路况并在必要时人工干预。就车辆是否配备脱手检测与疲劳监测及能否关闭，客服称配有脱手检测提示、暂未核实到可以关闭，疲劳监测可在中控屏「驾驶—场景辅助」中手动开关。交警部门表示正在核查。", "en": "On 21 November the topic 「AITO M9 owner fell asleep on assisted driving」 trended on Weibo. Video posted online showed a driver who appeared to be at the wheel of an AITO M9 lying back asleep while the car continued at speed on a motorway; the caption said: 「Too tired on the way back from a business trip, fell asleep immediately, the Huawei AITO M9 drove the whole way back to Wuhan.」 The account could no longer be found on several platforms. A customer-service agent at AITO's owner care centre said the case had been logged and passed to a dedicated team for verification, and stressed that AITO ADS is driver assistance, not autonomous or driverless driving, cannot replace the driver's attention and judgment, and that drivers must keep their hands on the wheel and intervene when needed. Asked whether hand-off detection and fatigue monitoring can be switched off, the agent said hand-off warnings are fitted and could not be confirmed as disableable, while fatigue monitoring can be toggled in the centre screen. Traffic police said they were investigating.", "es": "El 21 de noviembre el tema «un propietario de AITO M9 se durmió con la conducción asistida» se hizo viral en Weibo. Un vídeo publicado en redes mostraba a un conductor que parecía ir al volante de un AITO M9 tumbado y dormido mientras el coche seguía circulando a velocidad de autopista; el texto decía: «Volviendo de un viaje de trabajo, demasiado cansado, me quedé dormido; el Huawei AITO M9 me trajo solo hasta Wuhan». La cuenta ya no podía encontrarse en varias plataformas. Un agente del centro de atención al propietario de AITO dijo que el caso se había registrado y derivado a un equipo específico para su verificación, y subrayó que el sistema ADS es asistencia a la conducción, no conducción autónoma ni sin conductor, que no sustituye la atención ni el juicio del conductor y que este debe mantener las manos en el volante e intervenir cuando sea necesario. Preguntado por si la detección de manos fuera del volante y el control de fatiga pueden desactivarse, el agente dijo que hay avisos de manos fuera del volante y no pudo confirmar que se puedan anular, mientras el control de fatiga se activa o desactiva en la pantalla central. La policía de tráfico indicó que está investigando.", "ja": "11月21日、「AITO M9 のオーナーが運転支援中に眠った」という話題が微博のトレンド入りした。ネットに投稿された動画では、AITO M9 とみられる車の運転席で男性が倒れ込むように眠っており、車は高速道路を走り続けていた。投稿文には「出張の帰りで疲れ切って寝てしまった。Huawei AITO M9 が全行程自動で武漢まで帰してくれた」とあった。このアカウントは複数のプラットフォームで検索できなくなっている。AITO のオーナー相談センターの担当者は、状況を記録し専門チームに引き継いで確認中と述べ、ADS は運転支援であり自動運転でも無人運転でもなく、運転者の集中と判断に代わるものではないと強調した。運転者がハンドルを握り、状況を注視し必要なら介入すべきだという。手放し検知と疲労モニタリングを切れるかとの問いには、手放し検知の警告は搭載しているが解除可能かは確認できていない、疲労モニタリングは中央画面の設定で切り替えられると答えた。交警は調査中としている。"}, "why": {"zh": "这件事的价值不在「谁的智驾更强」，而在它把 L2 的真实边界拍成了画面：系统能维持车道与车距，但它不承担「驾驶员睡着了」这个后果。客服那句「ADS 不是自动驾驶」是标准答案，真正需要追问的是产品设计——脱手检测若能被骗过、疲劳监测若能被关掉，那么营销话术里的「全程智驾」就会变成一种危险的暗示。", "en": "The value of this story is not whose assistance system is better but that it puts L2's real boundary on camera: the system can hold a lane and a gap, but it does not absorb the consequence of a sleeping driver. Customer service saying 「ADS is not autonomous driving」 is the standard answer; the question worth pressing is product design — if hand-off detection can be fooled and fatigue monitoring switched off, then marketing language about 「driving the whole way」 becomes a dangerous suggestion.", "es": "El valor de esta historia no está en qué sistema de asistencia es mejor, sino en que pone en imágenes el límite real del nivel 2: el sistema puede mantener el carril y la distancia, pero no asume la consecuencia de un conductor dormido. Que atención al cliente diga que «ADS no es conducción autónoma» es la respuesta estándar; la pregunta que hay que insistir es la del diseño del producto: si la detección de manos fuera del volante se puede engañar y el control de fatiga desactivar, el lenguaje comercial sobre «conducir todo el trayecto» se convierte en una sugerencia peligrosa.", "ja": "この件の価値は「どの運転支援が優れているか」ではなく、レベル2の実際の境界を映像にしたことにある。システムは車線と車間を保てるが、「運転者が眠った」という結果を引き受けるわけではない。「ADS は自動運転ではない」という客服の答えは標準回答であり、本当に問うべきは製品設計だ。手放し検知が欺け、疲労モニタリングが切れるなら、「全行程を自動で」という宣伝文句は危険な暗示になる。"}}, {"idx": "02", "title": {"zh": "「看看人家深圳，再看看我们自己」：特朗普这番话在中文互联网刷屏", "en": "「Look at Shenzhen, then look at us」: Trump's remark goes viral on Chinese social media", "es": "«Mira Shenzhen y luego míranos»: el comentario de Trump se viraliza en las redes chinas", "ja": "「深圳を見て、我々を見ろ」トランプ氏の発言が中国ネットで拡散"}, "body": {"zh": "11 月 21 日，话题「特朗普说看看深圳再看看我们」登上微博热搜。据公开报道，当地时间 11 月 20 日，特朗普在白宫一场新闻发布会上谈到深圳，称「当你在那里的时候，你可以看到这个城市拥有惊人的能量，而且干净无瑕」，随后批评美国部分城市治理：「当我看着我们肮脏的城市，我必须得说大部分是蓝州，路都是脏的，到处都是坑坑洼洼，栏杆正在脱落，到处都锈迹斑斑。」11 月 18 日，特朗普抵达深圳出席亚太经合组织第三十三次领导人非正式会议，成为首位到访深圳的在任美国总统。同期，境外社交平台上「想要一个深圳」的相关内容持续发酵，深圳华强北在会议周期间迎来大量外国客商。", "en": "On 21 November the topic 「Trump said look at Shenzhen, then look at us」 trended on Weibo. According to public reports, at a White House press conference on 20 November Trump said of Shenzhen: 「When you're there, you can see this city has incredible energy, and it's spotless」, before criticising governance in some US cities: 「When I look at our filthy cities, I have to say most of them are blue states — the roads are dirty, full of potholes, the railings are falling off, everything is rusted.」 Trump arrived in Shenzhen on 18 November for the 33rd APEC Economic Leaders' Meeting, the first sitting US president to visit the city. Meanwhile content about 「wanting a Shenzhen」 kept circulating on overseas platforms, and Huaqiangbei drew large numbers of foreign buyers during the summit week.", "es": "El 21 de noviembre el tema «Trump dijo: mira Shenzhen y luego míranos» se hizo tendencia en Weibo. Según reportes públicos, en una rueda de prensa en la Casa Blanca el 20 de noviembre Trump dijo de Shenzhen: «Cuando estás allí ves que esta ciudad tiene una energía increíble y está impecable», y luego criticó la gestión de algunas ciudades estadounidenses: «Cuando miro nuestras ciudades sucias, tengo que decir que la mayoría son estados azules: las calles están sucias, llenas de baches, las barandillas se caen, todo está oxidado». Trump llegó a Shenzhen el 18 de noviembre para la 33.ª reunión de líderes del APEC, el primer presidente estadounidense en ejercicio en visitar la ciudad. Mientras tanto, el contenido sobre «querer un Shenzhen» siguió circulando en plataformas extranjeras y Huaqiangbei recibió a numerosos compradores extranjeros durante la semana de la cumbre.", "ja": "11月21日、「トランプ氏が深圳を見て、我々を見ろと語った」という話題が微博のトレンド入りした。公開報道によると、トランプ氏は11月20日のホワイトハウスでの記者会見で深圳について「あの街に行けば、驚くべきエネルギーがあり、隅々まで清潔だと分かる」と述べ、続けて米国の一部都市の統治を批判した。「我々の汚い都市を見れば、大半はブルーステートだと言わざるを得ない。道路は汚れ、穴だらけで、手すりは外れ、どこも錆びている」。トランプ氏は11月18日に APEC 第33回非公式首脳会議のため深圳に到着し、現職の米大統領として初めて同市を訪れた。同時期、海外の SNS では「深圳が欲しい」という投稿が広がり、会議週には華強北に多くの外国人バイヤーが集まった。"}, "why": {"zh": "这段话在中文互联网能刷屏，是因为它罕见地让「城市治理」这件事脱离了宏大叙事：坑洼的路面、脱落的栏杆、锈迹，都是居民每天都会碰到的东西。更有意思的是传播路径——先由美国总统说出来，再由中文网友转述，最后落回「我们的城市哪里还需要改」。这种借外人之口完成的自我确认，比对骂更有信息量。", "en": "The remark travelled because it pulled urban governance out of grand narrative: potholes, falling railings and rust are things residents meet every day. The more interesting part is the path — said by a US president, relayed by Chinese netizens, and ending in a discussion of what still needs fixing at home. That kind of self-confirmation borrowed from an outsider's mouth carries more information than mutual abuse.", "es": "El comentario se difundió porque sacó la gobernanza urbana de la gran narrativa: baches, barandillas caídas y óxido son cosas con las que los vecinos conviven a diario. Lo más interesante es el recorrido: lo dice un presidente estadounidense, lo replican internautas chinos y termina en una discusión sobre qué falta por arreglar en casa. Esa autoconfirmación prestada de una boca ajena aporta más información que el insulto cruzado.", "ja": "この発言が拡散したのは、都市統治を宏大な物語から引き離したからだ。穴ぼこだらけの道路、外れた手すり、錆は、住民が毎日接するものだ。面白いのは伝播の経路である。米大統領が口にし、中国のネット利用者が伝え、最後は「自分の街のどこを直すべきか」に着地した。他人の口を借りた自己確認は、罵り合いよりはるかに情報量が多い。"}}, {"idx": "03", "title": {"zh": "周杰一句「别替别人做决定」冲上文娱榜第一", "en": "Zhou Jie tops the entertainment chart with 「don't decide for others」", "es": "Zhou Jie lidera la lista de entretenimiento con «no decidas por los demás»", "ja": "周杰の「他人の代わりに決めないで」が文芸ランキング1位に"}, "body": {"zh": "11 月 22 日凌晨，话题「周杰高情商回答穷人该不该生孩子」冲上微博文娱榜第一，热度 120.2 万。流传的视频是一段课堂式对谈：学生抛出「穷人该不该生孩子」，周杰回应称，生不生孩子是个人选择，不该由别人替当事人做决定，也不该把经济条件当作唯一标尺。视频后半段他谈起已故的父亲，讲从住院到火化、亲手抱起骨灰盒的过程，语气平静。评论区高赞留言认为，他没有站队、没有说教，把容易吵翻的问题放回了「个人选择」四个字。", "en": "In the early hours of 22 November the topic 「Zhou Jie's high-EQ answer on whether poor people should have children」 reached first place on Weibo's entertainment chart with 1.202 million in heat. The circulating video is a classroom-style conversation in which a student asks whether poor people should have children; Zhou replies that having a child is a personal choice, that no one else should decide for the people concerned, and that income should not be the only yardstick. In the second half he talks about his late father, describing the hospital stay, the cremation and carrying the urn himself, in a level voice. The top comment argues that he refused to pick a side or preach, returning a volatile question to the words 「personal choice」.", "es": "En la madrugada del 22 de noviembre el tema «la respuesta de alta inteligencia emocional de Zhou Jie sobre si los pobres deberían tener hijos» alcanzó el primer puesto de la lista de entretenimiento de Weibo con 1,202 millones de puntos. El vídeo que circula es una conversación de aula en la que un estudiante pregunta si las personas pobres deberían tener hijos; Zhou responde que tener un hijo es una elección personal, que nadie debe decidir por los afectados y que el nivel de ingresos no debe ser el único criterio. En la segunda parte habla de su padre fallecido y describe la hospitalización, la incineración y el momento de llevar él mismo la urna, con voz serena. El comentario más votado sostiene que no tomó partido ni dio sermones, y devolvió una pregunta inflamable a las palabras «elección personal».", "ja": "11月22日未明、「周杰が『貧しい人は子どもを持つべきか』に高情商で答えた」という話題が微博の文芸ランキング1位となり、熱量は120.2万。拡散した動画は教室風の対話で、学生が「貧しい人は子どもを持つべきか」と問い、周杰は子どもを持つかどうかは個人の選択であり、他人が当事者の代わりに決めるべきではない、経済力だけを唯一の基準にすべきでもないと答えた。後半では亡くなった父親について、入院から火葬、自ら骨壺を抱えた過程を静かな口調で語っている。最多いいねのコメントは、どちらかの側に立たず説教もしなかったとして、論争になりやすい問いを「個人の選択」という四文字に戻したと評価した。"}, "why": {"zh": "这个问题之所以每次都能吵起来，是因为它背后堆着房价、收入、教育与养老——谁接谁得罪一半人。周杰的处理方式提供了一个可复用的模板：不评判选项，只守住「谁有权选」。而视频后半段关于父亲的叙述，恰好解释了这种克制从哪来——见过生死的人，通常不太愿意替别人安排人生。", "en": "The question explodes every time because housing, income, education and elder care are stacked behind it: whoever answers offends half the room. Zhou's approach offers a reusable template — do not judge the options, only defend who has the right to choose. And the passage about his father explains where that restraint comes from: people who have sat with death tend not to arrange other people's lives.", "es": "La pregunta estalla cada vez porque detrás hay vivienda, ingresos, educación y cuidado de mayores: quien responde ofende a la mitad. El enfoque de Zhou ofrece una plantilla reutilizable: no juzgar las opciones, solo defender quién tiene derecho a elegir. Y el pasaje sobre su padre explica de dónde viene esa contención: quien ha estado cerca de la muerte suele evitar organizar la vida ajena.", "ja": "この問いが毎回燃えるのは、背後に住宅、収入、教育、介護が積み重なっているからだ。答える側は半分を敵に回す。周杰のやり方は再利用可能な型を示した。選択肢を評価せず、「誰に選ぶ権利があるか」だけを守る。後半の父親の話は、その抑制がどこから来るかを説明している。死を見てきた人は、他人の人生を段取りしたがらないものだ。"}}, {"idx": "04", "title": {"zh": "顺丰速运、八马茶业等被暂停参加全军采购活动", "en": "SF Express, Bama Tea and others suspended from military procurement", "es": "SF Express, Bama Tea y otras empresas suspendidas de las compras militares", "ja": "SF 急便や八馬茶業など、軍の調達活動への参加を一時停止"}, "body": {"zh": "11 月 21 日，军队采购网相关公告引发关注并登上热搜：顺丰速运有限公司在参加采购活动中涉嫌存在违规问题，根据军队供应商管理相关规定，被暂停参加全军物资工程服务采购活动，告知单位为军委后勤保障部采购服务中心。同期被公布的同批企业还包括八马茶业股份有限公司、三亚凤凰国际机场有限责任公司、紫光软件系统有限公司、中国交通建设集团等。公告所列项目编号均为「无」，未披露涉嫌违规的具体事项及暂停期限，处理自 11 月 19 日起生效、范围为全军。据南方都市报梳理，暂停参与全军物资工程服务采购属调查阶段的临时管控措施，并非最终处罚：查实违规可作出禁止参与军队采购的处罚，核查后不构成违规则解除暂停、恢复资格。顺丰速运为顺丰控股间接全资子公司，2026 年上半年营业收入 115.27 亿元、净利润 53.81 亿元。", "en": "Notices on the military procurement website drew attention and trended on 21 November: SF Express was found to be suspected of irregularities in procurement activities and, under the rules governing military suppliers, suspended from participating in military-wide goods, works and services procurement, with the notice issued by the procurement service centre of the Central Military Commission's logistics support department. Others named in the same batch included Bama Tea, Sanya Phoenix International Airport, Unisplendour Software Systems and China Communications Construction Group. The notices listed no project numbers, did not disclose the specific allegations or the length of suspension, and took effect on 19 November across the entire military. Southern Metropolis Daily noted that such a suspension is an interim control measure during investigation rather than a final penalty: if irregularities are confirmed a ban may follow, and if not, the suspension is lifted and eligibility restored. SF Express is an indirect wholly owned subsidiary of SF Holding, with first-half 2026 revenue of 11.527 billion yuan and net profit of 5.381 billion yuan.", "es": "Los avisos del portal de compras militares atrajeron la atención y se hicieron virales el 21 de noviembre: SF Express figura sospechosa de irregularidades en actividades de contratación y, conforme a las normas sobre proveedores militares, fue suspendida de participar en la contratación de bienes, obras y servicios de todo el ejército, con notificación del centro de servicios de contratación del departamento de apoyo logístico de la Comisión Militar Central. En el mismo lote aparecen Bama Tea, el aeropuerto internacional de Sanya Phoenix, Unisplendour Software Systems y China Communications Construction Group. Los avisos no indican números de proyecto, no detallan los hechos ni la duración de la suspensión, y esta rige desde el 19 de noviembre en todo el ámbito militar. El diario Southern Metropolis Daily señala que se trata de una medida cautelar durante la investigación y no de una sanción definitiva: si se confirman las irregularidades puede dictarse una prohibición, y si no, se levanta la suspensión y se restablece la elegibilidad. SF Express es filial indirecta al 100% de SF Holding, con ingresos de 11.527 millones de yuanes y beneficio neto de 5.381 millones en el primer semestre de 2026.", "ja": "11月21日、軍の調達ポータルの公告が注目を集めトレンド入りした。SF 急便は調達活動で違反の疑いがあるとされ、軍需サプライヤー管理の規定に基づき、全軍の物資・工事・サービス調達への参加を一時停止された。公告は中央軍事委員会後勤保障部調達サービスセンター名義。同じ批次には八馬茶業、三亜鳳凰国際機場、紫光軟件系統、中国交通建設集団なども含まれる。公告には案件番号が「無」とされ、違反の具体的内容や停止期間は開示されておらず、11月19日から全軍範囲で効力を持つ。南方都市報によれば、この停止は調査段階の暫定的な管理措置であり最終処分ではない。違反が確認されれば参加禁止処分となり、問題なしと判断されれば停止が解除され資格が回復する。SF 急便は SF 控股の間接完全子会社で、2026年上半期の売上高は115.27億元、純利益は53.81億元。"}, "why": {"zh": "值得注意的不是「哪家公司上了名单」，而是公告的克制：项目编号一律「无」、违规事项不披露、期限不写，只给「暂停」这个动作。这套处理方式的逻辑是「先控风险、后定性质」，对供应商而言，真正的成本不在暂停期本身，而在后续投标资格与关联企业的连带限制——公告明确，暂停期内法定代表人、控股股东及相关人员控股或管理的其他企业同样受限。", "en": "What matters is not which companies were named but how restrained the notice is: no project numbers, no description of the alleged conduct, no stated duration, only the act of suspension. The logic is control the risk first, characterise it later. For a supplier the real cost is not the suspension itself but the knock-on limits on future bids and affiliated firms — the notice states that during the suspension, other companies controlled or managed by the legal representative, controlling shareholders and related persons are equally restricted.", "es": "Lo relevante no es qué empresas aparecen, sino la contención del aviso: sin números de proyecto, sin descripción de la conducta imputada, sin plazo, solo el acto de suspender. La lógica es controlar el riesgo primero y calificar después. Para un proveedor el coste real no es la suspensión en sí, sino las limitaciones derivadas sobre futuras licitaciones y sociedades vinculadas: el aviso establece que durante la suspensión también quedan restringidas otras empresas controladas o gestionadas por el representante legal, los accionistas de control y las personas relacionadas.", "ja": "重要なのは「どの企業が載ったか」ではなく、公告の抑制的な書き方だ。案件番号は「無」、違反内容は非開示、期間も記載せず、「停止」という行為だけを示す。リスクを先に抑え、性質は後で決めるという論理である。サプライヤーにとって本当のコストは停止期間そのものではなく、その後の入札資格と関連企業への連鎖的制限にある。公告は、停止期間中は法定代表者、支配株主、関連人物が支配・管理する他の企業も同様に制限されると明記している。"}}, {"idx": "05", "title": {"zh": "把竖屏短剧印成卡纸：「一页一个反转」的纸质短剧火了", "en": "Short dramas printed on card: the paper version with one twist per page goes viral", "es": "Series cortas impresas en cartulina: el formato en papel con un giro por página se viraliza", "ja": "縦型ショートドラマをカード化、「1ページ1転換」の紙版が話題に"}, "body": {"zh": "近日，一种把竖屏短剧印在卡纸或折成长条的「纸质短剧」在社交平台走红：翻一页算一集，一页一个反转，单份售价三五元，多在景区、书店与校园周边的小店出售。有买家把它形容为「童年小人书的回归」，也有人认为这是短剧在手机之外找到的新载体——不插电、不占流量，翻页的节奏反而放大了「下一秒就反转」的爽感。部分出版与文创从业者表示，这类产品目前多为小批量印制，内容授权与版权归属仍待厘清。", "en": "A 「paper short drama」 that prints vertical-format mini-series onto card or long folded strips has gone viral on Chinese social platforms: one page counts as one episode, each page carries a twist, and a copy sells for three to five yuan, mostly in shops near tourist sites, bookstores and campuses. Buyers describe it as the return of childhood comic books; others see it as the short drama finding a carrier beyond the phone — no power, no data, and the rhythm of turning pages amplifies the pleasure of a twist on the next page. Publishers and cultural-product sellers say such items are mostly printed in small batches, and content licensing and copyright ownership remain to be clarified.", "es": "Un «drama corto en papel» que imprime miniseries verticales en cartulina o en tiras largas plegadas se ha viralizado en las redes chinas: una página equivale a un episodio, cada página trae un giro y un ejemplar cuesta entre tres y cinco yuanes, sobre todo en tiendas cercanas a lugares turísticos, librerías y campus. Los compradores lo describen como el regreso del cómic de la infancia; otros lo ven como el drama corto encontrando un soporte más allá del teléfono: sin batería, sin datos, y el ritmo de pasar páginas amplifica el placer del giro siguiente. Editores y vendedores de productos culturales señalan que se imprimen en tiradas pequeñas y que la licencia de contenidos y la titularidad de derechos aún deben aclararse.", "ja": "縦型ショートドラマをカードや細長い折りたたみ紙に印刷した「紙のショートドラマ」が中国の SNS で話題になっている。1ページが1話、1ページに1つの転換があり、1部3〜5元。観光地や書店、学校周辺の店で売られている。買った人は「子ども時代の絵本が戻ってきた」と表現し、別の人はスマホ以外の媒体を見つけた例だとみる。電源も通信も不要で、ページをめくるリズムが「次のページで反転する」快感を強めるという。出版・文化商品の関係者は、現状は小部数の印刷が多く、コンテンツの許諾と著作権の帰属は整理が必要だと指摘する。"}, "why": {"zh": "这个生意的聪明之处在于把「免费」变成了「可售卖」：短剧在手机上最难收钱，印成卡纸之后，三五元买的是一个可以拿在手里的物，而不是一段可被无限复制的流。但它也踩在版权的灰区上——剧本、角色、甚至封面图都来自平台内容，小批量印制时没人追究，一旦规模化，授权就是第一道坎。", "en": "The clever part is converting free into sellable: short dramas are hard to charge for on a phone, but printed on card, three to five yuan buys an object you can hold rather than a stream that can be copied endlessly. It also sits on copyright grey ground — scripts, characters and even cover art come from platform content, which nobody pursues at small scale but which becomes the first hurdle once it scales.", "es": "Lo ingenioso es convertir lo gratuito en vendible: cobrar por un drama corto en el teléfono es difícil, pero impreso en cartulina, tres o cinco yuanes compran un objeto que se puede sostener y no un flujo que se copia sin fin. También pisa terreno gris en derechos de autor: guiones, personajes e incluso portadas provienen de contenidos de plataforma, algo que nadie persigue a pequeña escala pero que se convierte en el primer obstáculo al crecer.", "ja": "巧みなのは「無料」を「売り物」に変えた点だ。スマホ上のショートドラマは課金しにくいが、カードに印刷すれば3〜5元で「手に持てる物」を買うことになる。無限に複製できる流れではない。ただし著作権の灰色地帯に踏み込んでいる。脚本もキャラクターも表紙絵もプラットフォームのコンテンツ由来で、小部数なら追及されないが、規模が拡大すれば許諾が最初の関門になる。"}}]}, {"key": "ent", "num": "06", "color": "#db2777", "deep": "#ad1a5c", "name": {"zh": "娱乐八卦", "en": "Culture", "es": "Cultura", "ja": "エンタメ"}, "items": [{"idx": "01", "title": {"zh": "孙芮发长文官宣结婚并怀孕：节奏会放慢，但不会停", "en": "Sun Rui announces marriage and pregnancy: slower pace, but not a stop", "es": "Sun Rui anuncia boda y embarazo: bajará el ritmo, pero no se detendrá", "ja": "孫芮が結婚と妊娠を発表 「ペースは落とすが止まらない」"}, "body": {"zh": "11 月 21 日，艺人孙芮在社交平台发布长文，宣布自己结婚并怀孕。她写道，遇到了人生伴侣、组建了小家，还收到了「一个小生命的突然到来」，并表示接下来节奏会放慢，但不会停下来。消息发布后迅速登上微博热搜，评论区以祝福为主。孙芮此前以女团成员身份出道，近年转向影视与综艺。", "en": "On 21 November singer and actress Sun Rui published a long post announcing that she has married and is pregnant. She wrote that she had met a life partner, started a small family and received 「the sudden arrival of a little life」, adding that the pace would slow from here but would not stop. The news quickly trended on Weibo, with the comment section largely congratulations. Sun Rui debuted as a girl-group member and has shifted towards acting and variety shows in recent years.", "es": "El 21 de noviembre la cantante y actriz Sun Rui publicó un texto largo en el que anunció su boda y su embarazo. Escribió que había encontrado a un compañero de vida, formado un pequeño hogar y recibido «la llegada repentina de una pequeña vida», y añadió que bajará el ritmo pero no se detendrá. La noticia se hizo viral en Weibo y los comentarios fueron en su mayoría felicitaciones. Sun Rui debutó como miembro de un grupo femenino y en los últimos años se ha orientado a la actuación y los programas de variedades.", "ja": "11月21日、歌手で女優の孫芮が SNS に長文を投稿し、結婚と妊娠を発表した。人生の伴侶に出会い小さな家庭を築いたこと、「小さな命の突然の訪れ」があったことを記し、今後はペースを落とすが止まりはしないと述べた。投稿後すぐに微博のトレンド入りし、コメント欄は祝福が中心だった。孫芮はガールズグループのメンバーとしてデビューし、近年は演技やバラエティに軸足を移している。"}, "why": {"zh": "偶像工业里，「官宣」从来不只是私事：它意味着粉丝关系的一次重新定价。孙芮这条长文的措辞很讲究——先讲「人生伴侣」，再讲「小生命」，最后主动交代「节奏会放慢」，把可能引发的猜测提前接住。评论区以祝福为主，说明这条路对转型期的艺人已经不再走不通。", "en": "In the idol industry an announcement is never purely private: it reprices the relationship with fans. Sun Rui's wording is careful — partner first, then the child, then a pre-emptive note that the pace will slow, catching the speculation before it starts. The comment section was mostly congratulatory, which suggests this path is no longer closed to artists in transition.", "es": "En la industria de los ídolos un anuncio nunca es solo privado: recalcula la relación con los fans. La redacción de Sun Rui es cuidadosa: primero la pareja, luego el hijo, y después el aviso de que el ritmo bajará, atajando la especulación antes de que empiece. Los comentarios fueron mayoritariamente felicitaciones, señal de que ese camino ya no está cerrado para artistas en transición.", "ja": "アイドル産業において「発表」は私事では終わらない。ファンとの関係が値付けし直されることを意味する。孫芮の文章は丁寧だ。まず人生の伴侶、次に小さな命、最後に「ペースを落とす」と自ら示して、憶測を先に受け止めた。コメントが祝福中心だったことは、転換期の芸能人にとってこの道が閉ざされていないことを示す。"}}, {"idx": "02", "title": {"zh": "王菲、窦靖童、李嫣母女仨首次正式合唱《爱笑的天使》20 周年版", "en": "Faye Wong, Leah Dou and Li Yan record their first official trio on the 20th anniversary of 「Smiling Angel」", "es": "Faye Wong, Leah Dou y Li Yan graban por primera vez juntas el 20.º aniversario de «Smiling Angel»", "ja": "王菲・竇靖童・李嫣、初の3人正式合唱「愛笑的天使」20周年版"}, "body": {"zh": "嫣然天使基金官宣，王菲、窦靖童、李嫣将合唱主题曲《爱笑的天使》20 周年版，这是母女三人首次正式录音合作。官方公布的署名排序为李嫣在前、窦靖童居中、王菲最后。消息发布后，「李嫣声音比窦靖童更像王菲」「爱笑的天使末尾是王菲抱着李嫣」等话题先后登上热搜。", "en": "The Smile Angel Foundation announced that Faye Wong, Leah Dou and Li Yan will sing a 20th-anniversary version of its theme song 「Smiling Angel」, the first official recording by the mother and her two daughters together. The credit order released by the foundation puts Li Yan first, Leah Dou in the middle and Faye Wong last. The news set off trending topics about whose voice resembles Faye Wong's more and about the closing line of the song.", "es": "La Fundación Smile Angel anunció que Faye Wong, Leah Dou y Li Yan grabarán una versión del 20.º aniversario de su canción temática «Smiling Angel», la primera grabación oficial de la madre con sus dos hijas. El orden de créditos difundido sitúa a Li Yan primero, Leah Dou en el centro y Faye Wong al final. La noticia generó temas virales sobre a quién se parece más la voz y sobre el cierre de la canción.", "ja": "嫣然天使基金は、王菲、竇靖童、李嫣の3人がテーマ曲「愛笑的天使」の20周年版を合唱すると発表した。母娘3人による初の正式なレコーディングとなる。発表されたクレジット順は李嫣が最初、竇靖童が中央、王菲が最後。発表後、「李嫣の声は竇靖童より王菲に似ている」「曲の最後は王菲が李嫣を抱く」などの話題が相次いでトレンド入りした。"}, "why": {"zh": "署名顺序比任何宣传语都更能说明这个项目的性质：李嫣在前，王菲在最后，把「公益主体」放在了「明星母亲」之前。对听众而言，真正的好奇点是三把声音放在同一段旋律里会是什么样——王菲的空灵、窦靖童的松弛、李嫣的未经训练，这种不齐整本身就是二十年时间的声音样本。", "en": "The credit order says more about the project than any promotional line: Li Yan first and Faye Wong last puts the charitable subject ahead of the celebrity mother. For listeners the real curiosity is what three voices sound like on one melody — Faye Wong's ethereality, Leah Dou's ease, Li Yan's untrained delivery — and that unevenness is itself a twenty-year sound sample.", "es": "El orden de créditos dice más del proyecto que cualquier eslogan: Li Yan primero y Faye Wong al final sitúan el sujeto benéfico por delante de la madre famosa. Para el oyente la curiosidad real es cómo suenan tres voces en una misma melodía: la etérea de Faye Wong, la soltura de Leah Dou y la voz sin entrenar de Li Yan; esa desigualdad es en sí misma una muestra sonora de veinte años.", "ja": "クレジット順は宣伝文句以上にこの企画の性格を語る。李嫣が最初で王菲が最後という配置は、「著名な母」より「公益の主体」を前に置いている。聴き手の本当の関心は、3つの声が同じ旋律に乗ったときどう響くかだ。王菲の浮遊感、竇靖童の肩の力の抜け方、李嫣の訓練されていない声。その不揃いさ自体が20年という時間の音の標本になっている。"}}, {"idx": "03", "title": {"zh": "沈腾综艺里差点摔倒，四个人同时伸手：这一跤摔出了「下意识」", "en": "Shen Teng nearly falls on a variety show and four hands reach out at once", "es": "Shen Teng casi se cae en un programa y cuatro manos se extienden a la vez", "ja": "沈騰がバラエティで転びかけ、4人が同時に手を伸ばす"}, "body": {"zh": "11 月 21 日播出的《现在就出发 4》中，沈腾荡秋千时脚下一滑、身体明显歪向一侧，白敬亭、黄景瑜、范丞丞、胡先煦几乎在同一秒伸手扶住。沈腾稳住后立刻嘴硬「没摔，差点」，被范丞丞贴脸开问「这一跤没事吧」，胡先煦在旁边补了一句「可要脸了这老头」。相关片段随后在社交平台大量传播，有网友把它与沈腾春晚小品《扶不扶》对照，认为从舞台上讨论「该不该扶」到现实里被一群人同时扶住，是一个巧合的呼应。", "en": "In the 21 November episode of the travel variety show 「Let's Go Now 4」, Shen Teng slipped while on a swing and tipped visibly to one side; Bai Jingting, Huang Jingyu, Fan Chengcheng and Hu Xianxu reached out almost in the same second. Once steady, Shen Teng insisted 「I didn't fall, almost」, was asked point-blank by Fan Chengcheng whether he was all right, and got a jab from Hu Xianxu about saving face. The clip spread widely, with viewers comparing it to Shen Teng's Spring Festival Gala sketch about whether to help someone who has fallen — a coincidental echo from debating 「should you help」 on stage to being caught by four people in real life.", "es": "En el episodio del 21 de noviembre del programa de viajes «Let's Go Now 4», Shen Teng resbaló en un columpio y se inclinó visiblemente hacia un lado; Bai Jingting, Huang Jingyu, Fan Chengcheng y Hu Xianxu extendieron la mano casi en el mismo segundo. Ya estable, Shen Teng insistió en que «no me caí, casi», Fan Chengcheng le preguntó de frente si estaba bien y Hu Xianxu le lanzó un comentario sobre salvar las apariencias. El clip se difundió mucho y los espectadores lo compararon con el sketch de Shen Teng en la Gala de Año Nuevo chino sobre si hay que ayudar a quien se ha caído: un eco casual entre debatir «¿hay que ayudar?» en el escenario y ser sujetado por cuatro personas en la vida real.", "ja": "11月21日放送の旅バラエティ「現在就出発4」で、沈騰はブランコで足を滑らせて大きく体勢を崩し、白敬亭、黄景瑜、范丞丞、胡先煦がほぼ同時に手を伸ばした。体勢を戻した沈騰は「転んでない、危なかっただけ」と言い張り、范丞丞に「本当に大丈夫か」と詰め寄られ、胡先煦が「面目を気にしろよ、このおじさん」と重ねた。映像は SNS で広く拡散し、春晩のスケッチ「扶不扶（助けるべきか）」と重ねる声もあった。舞台で「助けるべきか」を論じた人が、現実では4人に同時に支えられたという偶然の呼応である。"}, "why": {"zh": "观众爱看这类片段，不是因为摔得好看，而是因为它无法排练：四个人在同一秒伸手，是本能而不是剧本。综艺最稀缺的不是包袱，是「失控的那两秒」——沈腾试图假装什么都没发生的表情管理，和被拆穿后的自嘲，恰好把中年喜剧人在节目里的处境讲完了。", "en": "Viewers love this kind of clip not because the fall is funny but because it cannot be rehearsed: four people reaching out in the same second is instinct, not script. What variety shows lack most is not gags but those two seconds of lost control — Shen Teng trying to act as if nothing happened, then laughing at himself, which sums up the position of a middle-aged comedian on camera.", "es": "Al público le gustan estos clips no porque la caída sea graciosa, sino porque no se puede ensayar: cuatro personas extendiendo la mano en el mismo segundo es instinto, no guion. Lo que más escasea en los programas no son los chistes, sino esos dos segundos de pérdida de control: Shen Teng fingiendo que no pasó nada y luego riéndose de sí mismo resume la posición de un cómico de mediana edad en cámara.", "ja": "こうした映像が好まれるのは、転び方が面白いからではなく、リハーサルできないからだ。4人が同じ秒に手を伸ばすのは本能であり台本ではない。バラエティに最も足りないのはギャグではなく、「制御を失った2秒」である。何事もなかったふりをしようとする沈騰の表情管理と、見破られた後の自嘲が、中年コメディアンの置かれた立場を語り切っている。"}}, {"idx": "04", "title": {"zh": "《你好，星期六》婚礼彩排环节：杨超越一句「跪下」，董思成秒跪", "en": "On 「Hello Saturday」, Yang Chaoyue says 「kneel」 and Dong Sicheng drops instantly", "es": "En «Hello Saturday», Yang Chaoyue dice «arrodíllate» y Dong Sicheng obedece al instante", "ja": "「你好、土曜日」の結婚式リハで、楊超越の「ひざまずいて」に董思成が即座に反応"}, "body": {"zh": "11 月 21 日播出的《你好，星期六》设置「婚礼彩排」主题环节，杨超越与董思成身着婚服完整走完求婚流程。杨超越以「婚礼导演」姿态指导，一句「你戴，你跪下」话音刚落，董思成毫无迟疑单膝跪地，被观众形容为「条件反射级配合」。节目还安排了董思成放话「一定会去抢婚」、给杨超越戴头纱、互戴戒指等桥段。两人此次合体是为合作剧《今天是太阳雨》宣传，该剧 11 月 6 日在芒果 TV 开播、已于本月收官，剧中两人分别饰演郑雨与陈砚周。相关片段播出后，「杨超越说跪下董思成秒跪」等话题登上热搜，也有观众提醒这属于正常的剧宣营业，不宜等同于演员私人关系。", "en": "The 21 November episode of 「Hello Saturday」 built a wedding-rehearsal segment in which Yang Chaoyue and Dong Sicheng, in wedding attire, walked through a full proposal. Yang directed proceedings as the 「wedding director」; the moment she said 「you put it on, you kneel」, Dong dropped to one knee without hesitation, which viewers described as reflex-level cooperation. The segment also had him vow to 「crash the wedding」, place a veil on her and exchange rings. The pairing was promotion for their drama 「Today Is Sunrain」, which began on Mango TV on 6 November and finished this month, with the two playing Zheng Yu and Chen Yanzhou. Clips trended quickly, and some viewers noted that this is standard promotional work rather than a statement about the actors' private lives.", "es": "El episodio del 21 de noviembre de «Hello Saturday» incluyó un segmento de ensayo de boda en el que Yang Chaoyue y Dong Sicheng, vestidos de boda, recorrieron una petición de mano completa. Yang dirigió la escena como «directora de boda»; en el momento en que dijo «póntelo, arrodíllate», Dong se arrodilló sin dudar, lo que el público describió como cooperación refleja. El segmento incluyó también su promesa de «irrumpir en la boda», la colocación del velo y el intercambio de anillos. La pareja promocionaba su serie «Today Is Sunrain», estrenada en Mango TV el 6 de noviembre y terminada este mes, en la que interpretan a Zheng Yu y Chen Yanzhou. Los clips se hicieron virales y algunos espectadores recordaron que se trata de promoción habitual y no de una declaración sobre la vida privada de los actores.", "ja": "11月21日放送の「你好、土曜日」は「結婚式リハーサル」を題材にし、楊超越と董思成が結婚衣装で求婚の流れを最後まで演じた。楊超越が「結婚式の監督」として進行し、「つけて、ひざまずいて」と言った瞬間、董思成は迷わず片膝をついた。視聴者は「条件反射級の連携」と評した。番組はほかに「必ず結婚式を奪いに行く」という宣言、ベールをかける場面、指輪の交換なども用意。2人の共演はドラマ「今天是太陽雨」の宣伝で、同作は11月6日に Mango TV で始まり今月完結、2人は鄭雨と陳硯周を演じた。映像はすぐトレンド入りし、通常の作品宣伝であり俳優の私生活とは別だと注意する声もあった。"}, "why": {"zh": "这段之所以出圈，靠的不是「甜」，而是「快」——一句指令、一个动作，中间没有表演的停顿，观众才愿意相信那是默契而不是设计。但也要分清：婚服、头纱、戒指都是剧集收官期的宣发物料，把它当成恋情证据是误读；真正可看的是综艺与剧集互相导流的这套工业化流程，已经熟练到能在一次彩排里完成。", "en": "What made the clip travel is not sweetness but speed: one instruction, one movement, no theatrical pause in between, which is why viewers read it as rapport rather than staging. But the line should be drawn: the attire, veil and rings are promotional materials for a drama's closing run, and treating them as proof of a relationship is a misreading. What is genuinely interesting is how industrialised the variety-drama traffic exchange has become — polished enough to be completed inside a single rehearsal.", "es": "Lo que hizo viral el clip no es la dulzura sino la velocidad: una orden, un movimiento, sin pausa teatral en medio, y por eso el público lo lee como complicidad y no como puesta en escena. Pero conviene trazar la línea: el vestuario, el velo y los anillos son material promocional del cierre de una serie, y tomarlos como prueba de una relación es un error. Lo realmente interesante es el grado de industrialización del intercambio de audiencias entre variedades y series, lo bastante pulido para completarse en un solo ensayo.", "ja": "この映像が広がったのは「甘さ」ではなく「速さ」だ。一つの指示、一つの動作、間に芝居がかった間がない。だからこそ視聴者は演技ではなく呼吸だと読む。ただし線引きは必要だ。結婚衣装もベールも指輪もドラマ完結期の宣伝素材であり、交際の証拠と受け取るのは誤読である。本当に見るべきは、バラエティとドラマが互いに送客する産業的な流れが、リハーサル1回で完結するほど熟していることだ。"}}, {"idx": "05", "title": {"zh": "TVB 59 周年台庆：许志安压轴、马国明开场，罗嘉良 23 年后再扮李奇", "en": "TVB's 59th anniversary gala: Andy Hui closes, Kenneth Ma opens, Gallen Lo returns after 23 years", "es": "Gala del 59.º aniversario de TVB: Andy Hui cierra, Kenneth Ma abre y Gallen Lo vuelve tras 23 años", "ja": "TVB 59周年記念、許志安がトリ、馬国明が開幕、羅嘉良は23年ぶりに李奇役"}, "body": {"zh": "11 月 21 日，TVB 59 周年台庆举行。许志安压轴演唱，马国明担任开场；两人七年后同场，马国明被问及是否尴尬时回应「所有事情都过去了」。63 岁的罗嘉良时隔 23 年再扮《创世纪》中的李奇。陈炜在 53 岁生日当天带 26 位女演员表演致敬梅艳芳的《烈焰红唇》，30 人排练十天，下台后与后辈拥抱落泪。台庆周还排入《全民皆「乒」》等体育综艺。", "en": "TVB held its 59th anniversary gala on 21 November. Andy Hui performed the closing number and Kenneth Ma opened the show; appearing together for the first time in seven years, Ma brushed off questions about awkwardness with 「everything is in the past」. Gallen Lo, 63, returned to his role as Lee Kei in 「At the Threshold of an Era」 after 23 years. Alice Chan, on her 53rd birthday, led 26 actresses in a tribute to Anita Mui with 「Flame of Love」, rehearsed over ten days by 30 performers, and was in tears embracing younger colleagues afterwards. The anniversary week also scheduled sports variety shows including an all-star table tennis competition.", "es": "TVB celebró su 59.º aniversario el 21 de noviembre. Andy Hui cerró el espectáculo y Kenneth Ma lo abrió; juntos por primera vez en siete años, Ma respondió a las preguntas sobre incomodidad con un «todo ha quedado atrás». Gallen Lo, de 63 años, volvió a su papel de Lee Kei en «At the Threshold of an Era» tras 23 años. Alice Chan, el día de su 53 cumpleaños, encabezó a 26 actrices en un homenaje a Anita Mui con «Flame of Love», ensayado durante diez días por 30 intérpretes, y se emocionó abrazando a sus compañeras al bajar del escenario. La semana de aniversario incluyó también programas deportivos como un torneo de tenis de mesa entre famosos.", "ja": "11月21日、TVB の59周年記念式典が行われた。許志安がトリを務め、馬国明が開幕を担当。7年ぶりの同席となった馬国明は気まずさを問われ「すべて過去のことだ」と答えた。63歳の羅嘉良は23年ぶりに「創世紀」の李奇役を再演。陳煒は53歳の誕生日に26人の女優を率いて梅艶芳へのトリビュート「烈焰紅唇」を披露し、30人で10日間練習、舞台を降りて後輩と抱き合い涙ぐんだ。記念週には卓球のスター対抗戦などスポーツバラエティも組まれた。"}, "why": {"zh": "TVB 台庆这几年最稳定的看点，其实是「重逢」：许志安与马国明同台、罗嘉良 23 年后再扮李奇、陈炜带 26 位女演员跳梅艳芳——它把电视台四十年的人情账本翻出来给观众看。这种「旧人重逢」的收视逻辑，也解释了为什么港剧的怀旧牌打了这么多年还没打完：观众要看的不只是角色，是自己当年坐在电视机前的那段时间。", "en": "The most reliable draw at TVB galas in recent years has been reunion: Andy Hui and Kenneth Ma on one stage, Gallen Lo back in character after 23 years, Alice Chan leading 26 actresses in an Anita Mui tribute — the station opening forty years of personal ledger for the audience. That logic also explains why Hong Kong television's nostalgia play has not exhausted itself: viewers are not only watching characters, they are watching the years they spent in front of the set.", "es": "Lo más fiable de las galas de TVB en los últimos años son los reencuentros: Andy Hui y Kenneth Ma en el mismo escenario, Gallen Lo recuperando su personaje 23 años después, Alice Chan con 26 actrices en un homenaje a Anita Mui. La cadena abre cuarenta años de cuentas personales ante el público. Esa lógica explica por qué la nostalgia televisiva hongkonesa no se agota: el espectador no solo mira personajes, mira los años que pasó frente al televisor.", "ja": "近年の TVB 記念式典で最も安定した見どころは「再会」だ。許志安と馬国明が同じ舞台に立ち、羅嘉良が23年ぶりに役に戻り、陳煒が26人の女優を率いて梅艶芳に捧げる。局が40年分の人情の台帳を観客に開いてみせる。この懐かしさの論理は、香港ドラマのノスタルジーが尽きない理由でもある。観客は役柄だけでなく、自分がテレビの前に座っていた時間を見ているのだ。"}}]}], "risk": {"zh": "风险提示：本简报仅作信息汇总，其中涉及的数据不构成任何投资建议。", "en": "Risk notice: this briefing is a summary of information only; the data cited does not constitute investment advice.", "es": "Aviso de riesgo: este boletín es solo un resumen informativo; los datos citados no constituyen asesoramiento de inversión.", "ja": "リスク表示：本ブリーフィングは情報の要約であり、記載のデータは投資助言を構成するものではありません。"}}/*__END__*/;

    var title = T(titleObj, lang);
    var hl = T(hlObj, lang);
    var inner = esc(title);
    if (hl && title.indexOf(hl) >= 0) {
      var i = title.indexOf(hl);
      inner = esc(title.slice(0, i)) + '<span class="hl">' + esc(hl) + "</span>" + esc(title.slice(i + hl.length));
    }
    return '<a class="lk" href="' + bing(title) + '" target="_blank" rel="noopener">' + inner + "</a>";
  }

  /* ===== 语言检测：localStorage > 浏览器语言 > 系统时区 > 中文 ===== */
  function detectLang() {
    try { var s = localStorage.getItem("timab_lang"); if (s && LANGS.indexOf(s) >= 0) return s; } catch (e) {}
    var nav = (navigator.language || "").toLowerCase();
    if (/^zh/.test(nav)) return "zh";
    if (/^ja/.test(nav)) return "ja";
    if (/^es/.test(nav)) return "es";
    if (/^en/.test(nav)) return "en";
    var tz = "";
    try { tz = Intl.DateTimeFormat().resolvedOptions().timeZone || ""; } catch (e) {}
    if (/^Asia\/Tokyo/.test(tz)) return "ja";
    if (/Europe\/Madrid|America\/(Mexico_City|Bogota|Lima|Santiago|Caracas|Guatemala|La_Paz|San_Jose|Panama|Asuncion|Montevideo|Havana|El_Salvador|Managua|Tegucigalpa|Costa_Rica|San_Salvador)|America\/Argentina\//.test(tz)) return "es";
    if (/^(Europe|America|Australia)\//.test(tz)) return "en";
    return "zh";
  }

  var curLang = "zh";
  var langOpen = false;

  /* ===== 渲染 ===== */
  function renderChrome(lang) {
    var i18n = I18N[lang];
    document.documentElement.lang = LANG_HTML[lang];
    // 报头信息行
    var metaEl = document.getElementById("metaRow");
    if (metaEl) metaEl.textContent = T(BRIEFING.meta, lang);
    // 大日期
    var md = document.getElementById("mastDate");
    if (md) {
      var d = new Date(BRIEFING.date + "T00:00:00");
      md.innerHTML = fmtDate(d, lang) + "<small>" + esc(i18n.dateSub) + "</small>";
    }
    // 文档标题
    var siteName = (lang === "zh") ? "提马早报" : "TIMAB DAILY";
    document.title = siteName + " · " + fmtDate(new Date(BRIEFING.date + "T00:00:00"), lang);
    // 导航签
    var nav = document.getElementById("navChips");
    if (nav) {
      var order = ["pick"].concat(BRIEFING.sections.map(function (s) { return s.key; }));
      nav.innerHTML = "";
      order.forEach(function (key) {
        if (key === "pick") {
          var a = document.createElement("a");
          a.className = "chip-pick"; a.href = "#pick"; a.setAttribute("data-nav", "pick");
          a.textContent = T(BRIEFING.spotlight.badge, lang);
          nav.appendChild(a);
        } else {
          var sec = null;
          BRIEFING.sections.forEach(function (s) { if (s.key === key) sec = s; });
          if (!sec) return;
          var b = document.createElement("a");
          b.href = "#" + key; b.setAttribute("data-nav", key);
          b.style.borderColor = sec.color; b.style.color = sec.deep;
          b.textContent = T(sec.name, lang);
          nav.appendChild(b);
        }
      });
    }
    // 日历文案
    var cb = document.getElementById("calBtnText"); if (cb) cb.textContent = i18n.calBtn;
    var cw = document.getElementById("calWeek");
    if (cw) { cw.innerHTML = ""; i18n.calWeek.forEach(function (w) { var s = document.createElement("span"); s.textContent = w; cw.appendChild(s); }); }
    var cf = document.getElementById("calFoot"); if (cf) cf.textContent = i18n.calFoot;
    // 语言切换器（国旗触发 + 下拉）
    var ls = document.getElementById("langSwitch");
    if (ls) {
      ls.className = "lang-switch" + (langOpen ? " open" : "");
      ls.innerHTML = "";
      var trig = document.createElement("button");
      trig.type = "button"; trig.className = "lang-trigger"; trig.id = "langTrigger";
      trig.setAttribute("aria-haspopup", "true");
      trig.setAttribute("aria-expanded", langOpen ? "true" : "false");
      trig.innerHTML = flag(curLang) + '<span class="caret">▾</span>';
      trig.addEventListener("click", function (e) {
        e.stopPropagation();
        langOpen = !langOpen;
        ls.classList.toggle("open", langOpen);
        trig.setAttribute("aria-expanded", langOpen ? "true" : "false");
      });
      ls.appendChild(trig);
      var menu = document.createElement("div");
      menu.className = "lang-menu"; menu.setAttribute("role", "menu");
      LANGS.forEach(function (l) {
        var item = document.createElement("button");
        item.type = "button"; item.className = "lang-item" + (l === curLang ? " sel" : "");
        item.setAttribute("role", "menuitem"); item.setAttribute("data-lang", l);
        item.innerHTML = flag(l) + '<span class="lbl">' + LANG_LABEL_FULL[l] + "</span>";
        item.addEventListener("click", function (e) {
          e.stopPropagation();
          setLang(l);
        });
        menu.appendChild(item);
      });
      ls.appendChild(menu);
    }
  }

  function renderContent(lang) {
    var i18n = I18N[lang];
    var html = "";
    // 精选
    var sp = BRIEFING.spotlight;
    html += '<section class="spotlight" id="pick">'
      + '<div class="badge"><i></i>' + esc(T(sp.badge, lang)) + "</div>"
      + "<h2>" + titleHtml(sp.title, sp.hl, lang) + "</h2>"
      + '<div class="body">' + esc(T(sp.body, lang)) + "</div>"
      + '<div class="why"><b>' + esc(i18n.why) + "</b>" + esc(T(sp.why, lang)) + "</div>"
      + "</section>";
    // 分类
    html += '<div class="grid">';
    BRIEFING.sections.forEach(function (sec) {
      html += '<section class="card" id="' + sec.key + '" style="--ac:' + sec.color + "; --ac-deep:" + sec.deep + ';">'
        + '<div class="sec-head"><span class="sec-num">' + sec.num + "</span>"
        + "<h3>" + esc(T(sec.name, lang)) + "</h3>"
        + '<span class="en">' + sec.key.toUpperCase() + "</span></div>";
      (sec.items || []).forEach(function (it) {
        html += '<div class="item">';
        html += '<div class="t"><span class="idx">' + it.idx + "</span>";
        if (it.tag) html += '<span class="tag">' + esc(it.tag[lang] != null ? it.tag[lang] : i18n.tag) + "</span>";
        html += titleHtml(it.title, it.hl, lang) + "</div>";
        html += '<div class="d">' + esc(T(it.body, lang)) + "</div>";
        html += '<div class="why"><b>' + esc(i18n.why) + "</b>" + esc(T(it.why, lang)) + "</div>";
        html += "</div>";
      });
      html += "</section>";
    });
    html += "</div>";
    var content = document.getElementById("content");
    if (content) content.innerHTML = html;
    // 页脚
    var risk = document.getElementById("risk");
    if (risk) risk.textContent = T(BRIEFING.risk, lang);
  }

  function setLang(lang) {
    if (LANGS.indexOf(lang) < 0) lang = "zh";
    curLang = lang;
    langOpen = false;
    try { localStorage.setItem("timab_lang", lang); } catch (e) {}
    renderChrome(lang);
    renderContent(lang);
  }

  /* ===== 往期日历（保留原逻辑，文案随语言） ===== */
  function initCalendar() {
    var btn = document.getElementById("calBtn");
    var pop = document.getElementById("calPop");
    var grid = document.getElementById("calGrid");
    var title = document.getElementById("calTitle");
    if (!btn || !pop || !grid || !title) return;

    var parts = BRIEFING.date.split("-");
    var todayKey = parts[0].slice(2) + parts[1] + parts[2];
    var cur = { y: +parts[0], m: +parts[1] };
    var has = {};
    for (var i = 0; i < ARCHIVE_DATES.length; i++) { has[ARCHIVE_DATES[i]] = 1; }
    var HIST_BASE = /\/history\//.test(location.pathname) ? "./" : "history/";

    function ckey(y, m, d) { return String(y).slice(2) + pad(m) + pad(d); }

    function render() {
      var i18n = I18N[curLang];
      title.textContent = i18n.calTitle(cur.y, cur.m);
      grid.innerHTML = "";
      var start = new Date(cur.y, cur.m - 1, 1).getDay();
      var days = new Date(cur.y, cur.m, 0).getDate();
      for (var b = 0; b < start; b++) {
        var blank = document.createElement("span");
        blank.className = "cal-cell is-empty"; grid.appendChild(blank);
      }
      for (var d = 1; d <= days; d++) {
        var k = ckey(cur.y, cur.m, d);
        var cell = document.createElement("span");
        cell.className = "cal-cell" + (has[k] ? " has" : "") + (k === todayKey ? " is-today" : "");
        cell.textContent = d;
        if (has[k]) {
          cell.setAttribute("role", "link"); cell.setAttribute("tabindex", "0");
          cell.title = cur.y + "-" + pad(cur.m) + "-" + pad(d) + " 存档";
          (function (target) {
            var go = function () { window.open(HIST_BASE + target + ".html", "_blank", "noopener"); };
            cell.addEventListener("click", go);
            cell.addEventListener("keydown", function (e) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); go(); } });
          })(k);
        }
        grid.appendChild(cell);
      }
    }
    function toggle(open) {
      pop.hidden = !open;
      btn.setAttribute("aria-expanded", open ? "true" : "false");
      if (open) render();
    }
    btn.addEventListener("click", function (e) { e.stopPropagation(); toggle(pop.hidden); });
    document.getElementById("calPrev").addEventListener("click", function () { cur.m--; if (cur.m < 1) { cur.m = 12; cur.y--; } render(); });
    document.getElementById("calNext").addEventListener("click", function () { cur.m++; if (cur.m > 12) { cur.m = 1; cur.y++; } render(); });
    document.addEventListener("click", function (e) { if (!pop.hidden && !pop.contains(e.target)) toggle(false); });
    document.addEventListener("keydown", function (e) { if (e.key === "Escape" && !pop.hidden) toggle(false); });
  }

  /* ===== 启动 ===== */
  function boot() {
    curLang = detectLang();
    renderChrome(curLang);
    renderContent(curLang);
    initCalendar();
    // 关闭语言下拉：点击外部 / Esc
    document.addEventListener("click", function (e) {
      var ls = document.getElementById("langSwitch");
      if (ls && langOpen && !ls.contains(e.target)) {
        langOpen = false;
        ls.classList.remove("open");
        var t = document.getElementById("langTrigger");
        if (t) t.setAttribute("aria-expanded", "false");
      }
    });
    document.addEventListener("keydown", function (e) {
      if (e.key === "Escape" && langOpen) {
        langOpen = false;
        var ls = document.getElementById("langSwitch");
        if (ls) ls.classList.remove("open");
        var t = document.getElementById("langTrigger");
        if (t) t.setAttribute("aria-expanded", "false");
      }
    });
  }
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", boot);
  } else { boot(); }
})();
</script>
