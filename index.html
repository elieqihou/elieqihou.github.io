5、Outlook、Teams、Copilot などのサービスが 10 時間以上にわたり障害となった。障害追跡サイトの Downdetector は、発生後 1 時間で 74 の国と地域から約 13 万件の報告があったとしている。マイクロソフトは 13 日に謝罪し、原因は以前の「ネットワーク容量増強」が直近のネットワーク変更を機に表面化したもので、サイバー攻撃や AI とは無関係と説明。「広範な復旧」を報告する一方、断続的な接続障害やメール遅延が残りうるとした。英マンチェスターでは裁判がメール遅延で陪審を解散、英国警察はオンライン通報を受け付けられず、ニュージーランド移民局はビザ処理を停止、日本の経産相は「重大な影響」と述べた。"}, "why": {"zh": "一次网络变更，让 74 个国家的邮箱同时沉默十几个小时。这件事真正的提醒不是“微软也会出错”，而是当邮件、审批、报案、签证都长在同一根管子上时，宕机就不再是技术事件，而是行政事件。", "en": "One network change silenced mailboxes in 74 countries for the better part of a day. The lesson is not that Microsoft can fail, but that when email, approvals, crime reports and visas all hang off the same pipe, an outage stops being a technical event and becomes an administrative one.", "es": "Un solo cambio de red silenció los buzones de 74 países durante casi un día. La lección no es que Microsoft pueda fallar, sino que cuando el correo, las aprobaciones, las denuncias y los visados cuelgan del mismo tubo, una caída deja de ser un incidente técnico y pasa a ser administrativo.", "ja": "一度のネットワーク変更が 74 か国のメールを半日沈黙させた。教訓は「マイクロソフトも壊れる」ことではなく、メールも承認も通報もビザも同じ一本の管にぶら下がっている以上、障害は技術事案ではなく行政事案になるという点だ。"}}, {"idx": "02", "title": {"zh": "“和平饭店 51 万天价小票”查明为 AI 篡改造谣，15 人被抓获", "en": "Shanghai's “510,000-yuan bill” was AI-forged; 15 people detained", "es": "La “cuenta de 510.000 yuanes” de Shanghái era falsificada con IA; 15 detenidos", "ja": "「平和飯店 51 万元の天价伝票」は AI 改ざんの虚偽、15 人を検挙"}, "body": {"zh": "11 月 13 日，上海黄浦警方通报：黄浦区某知名饭店所谓“天价酒水账单”引发网上热议后，经查，外省市一互联网酒类销售公司负责人赵某某为博取关注、提升销量，组织王某某、董某、董某某等人利用 AI 软件篡改该饭店账单金额，将饭店用酒改为自己公司的销售酒类，并制作虚假视频，通过控制账号、雇佣代发等方式大量传播。警方已抓获 15 名涉案人员，其中 4 人被依法采取刑事强制措施，其余 11 人被行政处罚。此前 11 月 8 日，网传小票显示 6 人用餐 9 道菜、3 样酒水，总额 51.7 万余元，其中一款标称“1997 年”的酒水单价 23 万元。", "en": "Shanghai's Huangpu police said on 13 November that the widely shared “extortionate drinks bill” from a well-known restaurant had been fabricated. Investigators found that Zhao, head of an online liquor sales company in another province, organised Wang, Dong and others to use AI software to alter the bill's total, swap the restaurant's wine for his own products and produce fake videos, then spread them through controlled accounts and paid reposts to gain attention and lift sales. Fifteen people were detained, four under criminal coercive measures and eleven administratively punished. The original receipt, circulated on 8 November, showed six diners, nine dishes and three drinks totalling more than 517,000 yuan, including a bottle labelled “1997” at 230,000 yuan.", "es": "La policía de Huangpu (Shanghái) informó el 13 de noviembre de que la factura “desorbitada” de un restaurante conocido había sido falsificada. La investigación halló que Zhao, responsable de una empresa de venta de licores en línea de otra provincia, organizó a Wang, Dong y otros para usar software de IA, alterar el importe, sustituir los vinos del restaurante por los suyos y producir vídeos falsos, difundidos con cuentas controladas y publicaciones pagadas para captar atención y elevar ventas. Quince personas fueron detenidas: cuatro con medidas coercitivas penales y once sancionadas administrativamente. El tique original, difundido el 8 de noviembre, mostraba seis comensales, nueve platos y tres bebidas por más de 517.000 yuanes, con una botella etiquetada “1997” a 230.000.", "ja": "上海・黄浦公安は 11 月 13 日、著名ホテルの「法外な酒代の伝票」が捏造だったと発表した。調べによると、他省のネット酒販売会社責任者趙某が注目と売上を狙い、王某、董某らを組織して AI ソフトで伝票の金額を改ざんし、ホテルの酒を自社製品に置き換えた偽動画を作成、アカウント操作や代理投稿で大量に拡散させた。15 人が検挙され、うち 4 人が刑事強制措置、11 人が行政処分となった。11 月 8 日に拡散した伝票は 6 人で 9 品・酒 3 種、総額 51 万 7 千元余りで、「1997 年」表示の酒が 1 本 23 万元とされていた。"}, "why": {"zh": "这张小票之所以能刷屏，是因为它精准踩中了“贵得离谱”的公共情绪。AI 只是把伪造成本降到了几乎为零——真正被利用的，是人们对“天价”的默认相信。警方的通报把因果倒过来了：不是饭店宰客，是卖酒的想借饭店卖酒。", "en": "The receipt went viral because it landed exactly on public suspicion of the absurdly expensive. AI merely pushed the cost of forgery near zero; what was exploited was the reflex to believe in “outrageous prices”. The police account reverses the causality: not a restaurant fleecing diners, but a liquor seller borrowing a restaurant's name to sell its own bottles.", "es": "El tique se viralizó porque dio justo en la sospecha colectiva hacia lo absurdamente caro. La IA solo llevó el costo de la falsificación casi a cero; lo explotado fue el reflejo de creer en los “precios desorbitados”. La investigación invierte la causalidad: no fue un restaurante desplumando clientes, sino un vendedor de licores usando el nombre del restaurante para colocar sus botellas.", "ja": "この伝票が拡散したのは、「法外に高い」という公共の感情に正確に触れたからだ。AI は偽造コストをほぼゼロにしたにすぎず、利用されたのは「天价」を信じる反射である。公安の発表は因果を逆転させる。ぼったくりではなく、酒販売会社がホテルの名前で自社製品を売ろうとしたのだ。"}}, {"idx": "03", "title": {"zh": "2027 年研考 12 月 19 日至 20 日举行，报名人数 347 万", "en": "China's 2027 postgraduate exam set for 19-20 December, with 3.47 million registered", "es": "El examen de posgrado chino de 2027 será el 19 y 20 de diciembre, con 3,47 millones de inscritos", "ja": "2027 年の大学院入試は 12 月 19〜20 日、出願者は 347 万人"}, "body": {"zh": "教育部 11 月 13 日公布，2027 年全国硕士研究生招生考试将于 2026 年 12 月 19 日至 20 日举行，报名人数为 347 万。教育部已联合相关部门部署考务保障，要求严把命题质量与安全关口，严厉打击考试舞弊。此前 2026 年研考报名人数为 388 万，本次较上一年减少约 41 万。", "en": "The Ministry of Education announced on 13 November that the 2027 national postgraduate entrance examination will be held on 19-20 December 2026, with 3.47 million candidates registered. The ministry has coordinated with relevant departments on exam security, requiring strict control of question quality and safety and a crackdown on cheating. The 2026 exam drew 3.88 million registrations, so this year's figure is down by about 410,000.", "es": "El Ministerio de Educación anunció el 13 de noviembre que el examen nacional de acceso a posgrado de 2027 se celebrará el 19 y 20 de diciembre de 2026, con 3,47 millones de inscritos. El ministerio ha coordinado con otros departamentos la seguridad del examen, exigiendo rigor en la calidad y confidencialidad de las preguntas y mano dura contra el fraude. El examen de 2026 registró 3,88 millones, por lo que la cifra baja en unos 410.000.", "ja": "教育部は 11 月 13 日、2027 年全国修士課程入学試験を 2026 年 12 月 19〜20 日に実施すると発表した。出願者は 347 万人。教育部は関係部門と連携して試験運営の保障を整え、出題の質と安全管理の徹底、不正の厳罰を求めた。2026 年は 388 万人だったため、約 41 万人の減少となる。"}, "why": {"zh": "连续两年下降，累计少了近 80 万人。但 347 万仍然是一个相当于中型国家人口的数字——考研没有“降温”，只是从“人人都考”回到“想清楚再考”。", "en": "Two consecutive declines add up to nearly 800,000 fewer candidates. Yet 3.47 million is still a number the size of a mid-sized country's population: the exam has not cooled so much as shifted from “everyone sits it” back to “think first, then sit it”.", "es": "Dos descensos consecutivos suman casi 800.000 candidatos menos. Pero 3,47 millones sigue siendo una cifra del tamaño de la población de un país mediano: el examen no se ha enfriado, ha pasado de “todos se presentan” a “pensarlo antes de presentarse”.", "ja": "2 年連続の減少で累計 80 万人近く減った。それでも 347 万人は中規模国家の人口に匹敵する。受験熱が冷めたというより、「誰もが受ける」から「納得してから受ける」に戻ったのだ。"}}, {"idx": "04", "title": {"zh": "千万粉博主“深夜徐老师”宣布怀孕，热搜第一", "en": "Beauty blogger Xu Laoshi, with over 20 million followers, announces pregnancy", "es": "La bloguera Xu Laoshi, con más de 20 millones de seguidores, anuncia su embarazo", "ja": "フォロワー 2000 万人超のブロガー「深夜徐老師」が妊娠を発表"}, "body": {"zh": "11 月 13 日，“深夜徐老师怀孕”冲上热搜第一。本名徐妍的她发布视频宣布怀孕，分享第一次在 B 超中看到宝宝的感受，以及孕早期的困倦、乏力与恶心等反应，并提到后续胃口与体力逐步恢复。丈夫“深情航仔”连发两条微博报喜，透露已怀孕约四五个月。两人 2021 年七夕公开恋情，2024 年 7 月在巴黎求婚，2025 年 5 月 15 日在上海举办婚礼。徐妍 1991 年出生，2015 年创立妍媸文化，曾两度入选福布斯相关榜单。", "en": "“Xu Laoshi is pregnant” topped Weibo's trending list on 13 November. Xu Yan, the beauty blogger behind the account, posted a video announcing the pregnancy, describing seeing the baby on an ultrasound for the first time and the fatigue, low energy and nausea of early pregnancy, followed by a gradual return of appetite and strength. Her husband, the comedian Yang Hang, posted twice to share the news and said she is about four to five months along. The couple went public on Qixi in 2021, he proposed in Paris in July 2024 and they married in Shanghai on 15 May 2025. Born in 1991, Xu founded Yancie Culture in 2015 and has twice appeared on Forbes lists.", "es": "“Xu Laoshi está embarazada” encabezó las tendencias de Weibo el 13 de noviembre. Xu Yan, la bloguera de belleza, publicó un vídeo anunciando el embarazo y describió la primera ecografía y el cansancio, la falta de energía y las náuseas del primer trimestre, seguidos de una recuperación paulatina del apetito. Su marido, el creador de humor Yang Hang, lo anunció en dos publicaciones y precisó que está de cuatro a cinco meses. La pareja hizo pública su relación en el Qixi de 2021, él pidió matrimonio en París en julio de 2024 y se casaron en Shanghái el 15 de mayo de 2025. Nacida en 1991, Xu fundó Yancie Culture en 2015 y ha aparecido dos veces en listas de Forbes.", "ja": "11 月 13 日、「深夜徐老師が妊娠」が微博のトレンド 1 位となった。本名・徐妍の美容ブロガーが動画で妊娠を発表し、初めてエコーで赤ちゃんを見た感想や、つわりによる眠気・だるさ・吐き気、その後の食欲と体力の回復について語った。夫の「深情航仔」も 2 度投稿して報告し、妊娠 4〜5 か月ほどだと明かした。2 人は 2021 年の七夕に交際を公表、2024 年 7 月にパリでプロポーズ、2025 年 5 月 15 日に上海で結婚式を挙げた。1991 年生まれの徐妍は 2015 年に妍媸文化を設立し、フォーブスの関連リストに 2 度選ばれている。"}, "why": {"zh": "初代网红、千万粉丝、美妆博主，三个标签叠加，让这条私人消息变成了公共话题。热搜第一背后其实是同一批观众在确认：那个陪自己度过大学宿舍夜晚的人，也进入了人生的下一段。", "en": "First-generation internet celebrity, twenty million followers, beauty blogger — three labels turn private news into public conversation. Behind the top trend is the same audience confirming something: the person who kept them company in dorm rooms has moved into the next stage of life too.", "es": "Celebridad de la primera generación de internet, veinte millones de seguidores, bloguera de belleza: tres etiquetas convierten una noticia privada en conversación pública. Detrás de la tendencia está el mismo público confirmando algo: quien les acompañó en las noches de residencia también pasó a la siguiente etapa.", "ja": "初代ネット有名人、2000 万フォロワー、美容ブロガーという三つの看板が、私的な知らせを公共の話題に変えた。トレンド 1 位の背景にあるのは、かつて寮の夜を共にした人が次の段階へ進んだことの確認である。"}}, {"idx": "05", "title": {"zh": "王晶新片上映 8 天票房 5145 元，本人回应“没有宣发费”", "en": "Wong Jing's new film takes 5,145 yuan in eight days; director cites zero marketing budget", "es": "La nueva película de Wong Jing recauda 5.145 yuanes en ocho días; el director alega falta de presupuesto", "ja": "王晶監督の新作、公開 8 日で興収 5145 元　本人は「宣伝費ゼロ」と説明"}, "body": {"zh": "由王晶与叶念琛联合执导的喜剧《麻将女王》11 月 6 日在内地上映。据猫眼专业版数据，截至 11 月 13 日 22 时许，该片总票房 5145 元，13 日排片 12 场，场均人次 1.7 人，豆瓣评分 4.8。影片由高海宁、马国明领衔主演，已故演员许绍雄在片中饰演父亲龙卷峰。王晶 13 日发文回应：这是一部香港贺岁小品，致敬 1993 年的《追男仔》，内地临时安排上映，没有宣发费、排片也不多；他还提到“这是许绍雄先生留给我们最后的银幕印记”。该片 2025 年在香港上映时票房 380 多万港元。", "en": "The comedy “Queen of Mahjong”, co-directed by Wong Jing and Patrick Kong, opened on the mainland on 6 November. Maoyan data showed takings of 5,145 yuan as of about 22:00 on 13 November, with 12 screenings that day and an average audience of 1.7 per show; Douban rates it 4.8. It stars Katy Kung and Kenneth Ma, with the late Hui Shiu-hung as the father. Wong responded on the 13th: it is a Hong Kong Chinese New Year comedy paying tribute to his 1993 film, released on the mainland at short notice without a marketing budget or many screenings; he added that it is “the last screen imprint Mr Hui Shiu-hung left us”. The film took more than HK$3.8 million in Hong Kong in 2025.", "es": "La comedia “Queen of Mahjong”, codirigida por Wong Jing y Patrick Kong, se estrenó en la China continental el 6 de noviembre. Según Maoyan, hasta las 22:00 del 13 de noviembre había recaudado 5.145 yuanes, con 12 pases ese día y una media de 1,7 espectadores por función; Douban le da un 4,8. Protagonizan Katy Kung y Kenneth Ma, con el fallecido Hui Shiu-hung como padre. Wong respondió el día 13: es una comedia de Año Nuevo hongkonesa que homenajea su película de 1993, estrenada en el continente con poco aviso, sin presupuesto de promoción y con pocas sesiones; añadió que es “la última huella en pantalla que nos dejó el señor Hui Shiu-hung”. En Hong Kong recaudó más de 3,8 millones de dólares de Hong Kong en 2025.", "ja": "王晶と葉念琛の共同監督によるコメディー『麻雀女王』が 11 月 6 日に中国本土で公開された。猫眼のデータによると、11 月 13 日 22 時時点の興収は 5145 元、同日の上映は 12 回、1 回あたり平均 1.7 人、ドゥバンの評価は 4.8。高海寧と馬国明が主演し、故・許紹雄が父役を演じた。王晶は 13 日に「香港の旧正月向け小品で、1993 年の自作へのオマージュ。本土では急きょ公開が決まり、宣伝費も上映回数も乏しい」と説明し、「許紹雄さんが残した最後の銀幕の記録だ」と記した。2025 年の香港公開時の興収は 380 万香港ドル余りだった。"}, "why": {"zh": "5145 元、126 人、场均 1.7 人——这组数字之所以被反复转发，因为它把“港式喜剧失灵”这件事量化了。王晶的回应也没有辩解，只说没有宣发费。一个时代的类型片退场，往往就是从这种数字开始的。", "en": "5,145 yuan, 126 admissions, 1.7 people a screening: the numbers circulate because they quantify the decline of Hong Kong-style comedy. Wong's reply did not argue the point, only noting there was no marketing budget. The exit of a generational genre usually starts with numbers like these.", "es": "5.145 yuanes, 126 espectadores, 1,7 por función: las cifras se comparten porque cuantifican el declive de la comedia hongkonesa. La respuesta de Wong no discutió el fondo, solo señaló que no había presupuesto. La retirada de un género generacional suele empezar con números así.", "ja": "5145 元、動員 126 人、1 回平均 1.7 人。この数字が繰り返し共有されるのは、香港式コメディの失速を数値化しているからだ。王晶の返答も反論ではなく「宣伝費がない」という説明だった。一世代のジャンルの退場は、こうした数字から始まる。"}}]}, {"key": "ent", "num": "06", "color": "#db2777", "deep": "#a81a5a", "name": {"zh": "娱乐八卦", "en": "Showbiz", "es": "Espectáculos", "ja": "エンタメ"}, "items": [{"idx": "01", "title": {"zh": "周深《失语症》舞台刷屏：站上桌子唱歌，全场替他告白", "en": "Zhou Shen's “Aphasia” performance goes viral, with the audience finishing the confession", "es": "La actuación de Zhou Shen en “Aphasia” se vuelve viral y el público termina la confesión", "ja": "周深「失語症」のステージが拡散、机の上で歌い観客が告白を代弁"}, "body": {"zh": "11 月 13 日播出的《音乐缘计划 3》中，周深带来的《失语症》舞台以歌舞剧、歌剧形式重新编排，从急促念白到情绪爆发层层推进，声线在气声、戏腔与强音之间轮转。为贴合密集歌词与递进节奏，他直接站上桌子开唱；舞台结尾设计了全场大合唱倒数环节，由观众一起替角色说出“我喜欢你”。播出后相关话题冲上热搜，新华社、工人日报等媒体点评其为创意改编。", "en": "In the 13 November episode of “Music Resonance Plan 3”, Zhou Shen's performance of “Aphasia” was rearranged as a mini music-theatre piece, building from rapid spoken lines to full emotional release, his voice moving between breathy tone, operatic colour and belted notes. To match the dense lyrics and accelerating rhythm he climbed onto the table to sing, and the staging ended with a countdown singalong in which the audience said “I like you” on the character's behalf. The performance trended widely, with outlets including Xinhua and Workers' Daily praising the arrangement.", "es": "En el episodio del 13 de noviembre de “Music Resonance Plan 3”, la actuación de Zhou Shen de “Aphasia” se reorganizó como una pequeña pieza de teatro musical, del recitado rápido a la explosión emocional, con la voz alternando entre aire, color operístico y agudos plenos. Para seguir la letra densa y el ritmo creciente subió a la mesa para cantar, y el montaje terminó con una cuenta atrás cantada en la que el público decía “me gustas” por el personaje. El vídeo se viralizó y medios como Xinhua y Workers' Daily elogiaron el arreglo.", "ja": "11 月 13 日放送の「音楽縁計画 3」で、周深の「失語症」はミュージカル・オペラ風に再構成され、早口の台詞から感情の解放へと積み上げ、声は息混じりの歌唱、戯曲調、張りのある高音へと移った。密度の高い歌詞と加速するリズムに合わせて机の上に上がって歌い、終盤は観客全員のカウントダウン合唱で、役柄に代わって「好きだ」と言う演出だった。放送後は各話題がトレンド入りし、新華社や工人日報などが斬新な編曲だと評した。"}, "why": {"zh": "这个舞台的聪明之处在于把“说不出话”变成了可听的编排：前半段用念白制造窒息，后半段让全场替他开口。观众不是在听一首歌，是在参与一次情绪的解决。", "en": "The intelligence of the staging is that it makes speechlessness audible: the first half uses spoken lines to create pressure, the second lets the whole room speak for him. The audience is not listening to a song so much as taking part in resolving an emotion.", "es": "La inteligencia del montaje es hacer audible la incapacidad de hablar: la primera mitad usa el recitado para crear presión y la segunda deja que la sala hable por él. El público no escucha una canción, participa en la resolución de una emoción.", "ja": "この演出の賢さは「言葉が出ない」状態を聴かせる点にある。前半は台詞で息苦しさを作り、後半は会場全体が代弁する。観客は歌を聴いているのではなく、感情の解決に参加している。"}}, {"idx": "02", "title": {"zh": "金晨凌晨秒删“大傻子”文，同日回归综艺路透曝光", "en": "Jin Chen deletes a late-night post within minutes as set photos from her variety return surface", "es": "Jin Chen borra un mensaje nocturno en minutos mientras aparecen fotos de su regreso a la televisión", "ja": "金晨、深夜の投稿を即削除　同日にバラエティ復帰の現場写真"}, "body": {"zh": "11 月 13 日 00:17，金晨在云南发布微博“再一次作为一名大傻子…”，随后很快删除，截图已广泛传播并登上热搜。同一时间，她以飞行嘉宾身份参与《现在就出发 4》昆明收官站录制的路透曝光。节目中她与沈腾、白敬亭、黄景瑜等老成员逐一击掌，并与本季女常驻王楚然并肩热聊。此前 10 月直播中，她曾夸赞王楚然“很美、也很搞笑、很撒得开”，呼吁观众不要拉踩对比。本人及工作室未对秒删作出解释。", "en": "At 00:17 on 13 November Jin Chen posted on Weibo from Yunnan — “once again as a big fool…” — and deleted it shortly after; screenshots spread and the post trended. At the same time, photos surfaced from her guest appearance on the Kunming finale of “Let's Go Now 4”, where she exchanged handshakes with regulars Shen Teng, Bai Jingting and Huang Jingyu and chatted with this season's female regular Wang Churan. In an October livestream she had praised Wang as “beautiful, funny and very uninhibited”, asking audiences not to set them against each other. Neither she nor her studio explained the deletion.", "es": "A las 00:17 del 13 de noviembre Jin Chen publicó en Weibo desde Yunnan —“una vez más como una gran tonta…”— y lo borró poco después; las capturas se difundieron y el tema se hizo tendencia. Al mismo tiempo aparecieron fotos de su participación como invitada en el final de “Let's Go Now 4” en Kunming, donde chocó las manos con los habituales Shen Teng, Bai Jingting y Huang Jingyu y conversó con Wang Churan, la titular femenina de esta temporada. En un directo de octubre había elogiado a Wang por ser “guapa, divertida y muy suelta”, pidiendo al público no compararlas. Ni ella ni su estudio explicaron el borrado.", "ja": "11 月 13 日 0 時 17 分、金晨は雲南から微博に「もう一度、大バカとして…」と投稿し、まもなく削除した。スクリーンショットが広がりトレンド入りした。同じころ、「現在就出発 4」昆明収録のゲスト出演現場の写真が出回り、沈騰、白敬亭、黄景瑜ら既存メンバーとハイタッチし、今季の女性レギュラー王楚然とも談笑していた。10 月のライブ配信では王楚然を「美しくて面白い、とても自由」と褒め、比較して非難しないよう呼びかけていた。本人も事務所も削除の理由は説明していない。"}, "why": {"zh": "一句模糊的自嘲，被两种解读同时填满：综艺游戏输了，或者对新旧女常驻的舆论有情绪。秒删反而是最有效的放大器——不发，没人讨论；发了又删，所有人都在猜。", "en": "One vague self-deprecating line got filled in by two readings at once: losing a variety game, or reacting to the discourse around the change of female regular. Deleting it was the most effective amplifier available — not posting would invite nothing, posting and deleting invites everyone to guess.", "es": "Una frase autodespectiva y ambigua quedó llenada por dos lecturas a la vez: perder un juego del programa o reaccionar al debate sobre el cambio de titular femenina. Borrarla fue el amplificador más eficaz: no publicar no genera nada, publicar y borrar invita a todos a adivinar.", "ja": "曖昧な自嘲の一言に、二つの解釈が同時に流し込まれた。バラエティのゲームに負けたのか、女性レギュラー交代をめぐる論調への反応か。即削除こそ最も効果的な増幅装置だった。投稿しなければ話題にならず、投稿して消せば全員が推測する。"}}, {"idx": "03", "tag": {"zh": "进展"}, "title": {"zh": "刘欢墓地在怀柔长城脚下曝光，墓碑仅八个字", "en": "Liu Huan's grave revealed near the Great Wall: eight characters on the stone", "es": "Se conoce la tumba de Liu Huan junto a la Gran Muralla: ocho caracteres en la lápida", "ja": "劉歓さんの墓所が明らかに、長城の麓で墓碑には八字だけ"}, "body": {"zh": "11 月 13 日，一张粉丝拍摄的照片在网上传开：北京怀柔长城脚下，一方朴素石碑藏在花海之中，遗像里是刘欢熟悉的面容。整块墓碑最核心的内容只有八个字——“君来有声，君去无语”，碑侧摆放一对小白兔摆件。此前 11 月 12 日（离世后七七之日），水均益受刘欢妻子卢璐委托发布纪念短片《他是这样的人》，并公开一封长信，外界由此得知骨灰已安葬于怀柔长城脚下。刘欢生前留下遗愿：丧事一切从简，不设治丧委员会，不举办追悼会与遗体告别仪式。", "en": "Photos taken by a fan circulated on 13 November showing a plain stone amid flowers at the foot of the Great Wall in Huairou, Beijing, with Liu Huan's familiar portrait. The inscription consists of just eight characters — “In life you came with sound, in leaving you go in silence” — with a pair of small white rabbits beside it. On 12 November, the 49th day after his death, Shui Junyi released a memorial short film, “He Was This Kind of Person”, at the request of Liu's wife Lu Lu, along with a long letter, which revealed that the ashes had been interred there. Liu had asked for a simple funeral, with no committee, memorial service or farewell ceremony.", "es": "El 13 de noviembre circularon fotos de un seguidor que muestran una lápida sencilla entre flores al pie de la Gran Muralla en Huairou (Pekín), con el rostro conocido de Liu Huan. La inscripción tiene solo ocho caracteres —“en vida llegaste con sonido, al partir te vas en silencio”— y junto a ella hay un par de conejos blancos. El 12 de noviembre, cuadragésimo noveno día tras su muerte, Shui Junyi difundió por encargo de la esposa de Liu, Lu Lu, el cortometraje “Así era él” y una larga carta, que revelaron que las cenizas fueron enterradas allí. Liu había pedido un funeral sencillo, sin comité, velatorio ni ceremonia de despedida.", "ja": "11 月 13 日、ファンが撮影した写真が拡散した。北京・懐柔の長城の麓、花に囲まれた質素な石碑に劉歓さんの穏やかな遺影がある。碑の中心は「君来有声、君去无语」の八字のみで、脇に小白兔の置物が一対。11 月 12 日（死去後 49 日目）、水均益氏が妻の盧璐氏の依頼で追悼短編「他是这样的人」と長い手紙を公開し、遺骨が懐柔の長城の麓に埋葬されたことが明らかになった。劉歓さんは生前、葬儀を簡素に行い、葬儀委員会も告別式も設けないよう遺言していた。"}, "why": {"zh": "“君来有声，君去无语”八个字，把一个以声音立命的人概括完了。没有职务、没有奖项、没有作品列表——这块碑的选择本身，就是他生前对“排场”的态度。", "en": "Eight characters sum up a man whose life was made of sound: he came with sound, he leaves in silence. No titles, no awards, no list of works — the choice of inscription is itself his stated attitude toward ceremony.", "es": "Ocho caracteres resumen a un hombre cuya vida fue sonido: llegó con sonido, se va en silencio. Sin cargos, sin premios, sin lista de obras: la elección de la inscripción es en sí su postura ante el boato.", "ja": "「君来有声、君去无语」の八字が、声で生きた人を言い尽くしている。肩書きも受賞歴も作品一覧もない。この碑文の選択そのものが、生前の「派手さ」に対する姿勢を示している。"}}, {"idx": "04", "title": {"zh": "曹云金称巡演与直播接连被举报，将走法律途径追查", "en": "Cao Yunjin says his tour and livestreams are being reported, plans legal action", "es": "Cao Yunjin denuncia reportes contra su gira y sus directos y recurrirá a la vía legal", "ja": "曹雲金、巡演とライブ配信への通報相次ぐと述べ法的手段へ"}, "body": {"zh": "11 月 11 日，郭德纲在天津西河门收徒仪式上，马志明临时提出收其为义子，郭德纲与王惠随即上台行礼，辈分话题冲上热搜。随后曹云金与何沄伟发布一段对口型短视频，被不少网友解读为隔空嘲讽。11 月 13 日，曹云金发视频称，听云轩多场巡演近一个月接连被举报，部分举报在演出前几天就出现，举报人既未购票也未入场，针对的是演出结束后读取观众留言的互动环节；其直播也曾遭集中举报中断，经申诉后恢复。他表示将整理材料，通过法律途径追查举报者。", "en": "On 11 November at a ceremony in Tianjin, Ma Zhiming proposed taking Guo Degang as his godson, with Guo and his wife Wang Hui performing the rites on stage, and the generational-ranking question trended. Cao Yunjin and He Yunwei then posted a lip-sync video widely read as a jab. On 13 November Cao said in a video that several Tingyunxuan tour dates had been reported to authorities over the past month, some days before the shows, by people who neither bought tickets nor attended, targeting the post-show segment where audience comments are read out; a livestream was also mass-reported and cut off before being restored on appeal. He said he will compile materials and pursue the complainants legally.", "es": "El 11 de noviembre, en una ceremonia en Tianjin, Ma Zhiming propuso adoptar como ahijado a Guo Degang, quien con su esposa Wang Hui cumplió el rito en el escenario, y el asunto del escalafón se hizo tendencia. Cao Yunjin y He Yunwei publicaron después un vídeo de playback que muchos leyeron como una pulla. El 13 de noviembre Cao afirmó en un vídeo que varias fechas de su gira por salas han sido denunciadas en el último mes, algunas días antes de la función, por personas que no compraron entrada ni asistieron, apuntando al segmento posterior al espectáculo en el que se leen comentarios del público; un directo también fue denunciado en masa y cortado antes de restablecerse. Dijo que reunirá pruebas y perseguirá a los denunciantes por vía legal.", "ja": "11 月 11 日、天津の儀式で馬志明氏が郭徳綱氏を養子にすると申し出て、郭氏と妻の王惠氏が舞台で礼を行い、序列をめぐる話題がトレンド入りした。その後、曹雲金と何沄偉が口パクの短編動画を投稿し、当てつけと読む向きが多かった。11 月 13 日、曹雲金は動画で、聴雲軒の巡演がこの 1 か月で相次いで通報され、一部は公演の数日前に、チケットも買わず来場もしていない人物から、終演後に客の留言を読む交流コーナーを狙って行われたと述べた。配信も集中的な通報で中断し、異議申し立てで復旧したという。資料を整理し法的手段で通報者を追及するとした。"}, "why": {"zh": "举报不买票、不进场的“场外环节”，说明争议已经从台上转到流程上。这类纠纷最难的地方在于：它不违反规则的字面，却能让每一站都多出一层不确定性。", "en": "Reports aimed at an off-stage segment, filed by people who neither bought tickets nor attended, show the dispute has moved from the performance to the procedure. What makes such conflicts hard is that they break no rule on paper while adding a layer of uncertainty to every stop.", "es": "Denunciar un segmento fuera del escenario, por parte de quien no compró entrada ni asistió, muestra que la disputa pasó de la función al procedimiento. Lo difícil de estos conflictos es que no violan la letra de la norma pero añaden incertidumbre a cada plaza.", "ja": "チケットも買わず来場もしない人物が「舞台外のコーナー」を通報している点は、争点が舞台から手続きへ移ったことを示す。こうした紛争が厄介なのは、規則の文言には反していないのに、各公演に不確実性を上乗せするからだ。"}}, {"idx": "05", "title": {"zh": "《海上钢琴师》4K 修复版重映，2026 年度总票房破 319 亿", "en": "“The Legend of 1900” returns in 4K as 2026 box office passes 31.9 billion yuan", "es": "“La leyenda de 1900” vuelve en 4K y la taquilla china de 2026 supera los 31.900 millones", "ja": "「海の上のピアニスト」4K 修復版が再上映、2026 年の興収は 319 億元超"}, "body": {"zh": "11 月 13 日，朱塞佩·托纳托雷执导的《海上钢琴师》以 4K 修复版再次登陆内地院线，此前该片曾于 2024 年 11 月 15 日在内地重映。同周上映的还有犯罪喜剧《我没错！》，由宗海英执导、张冀担任剧本监制，佟丽娅、王皓、王智、刘敏涛、朱时茂等出演，聚焦社区矫正群体。据院线数据，2026 年度总票房（含预售）已突破 319 亿元，本周全国院线累计票房突破 8900 万元，《神探之痕迹》《无可替代的你》《生化危机：爆发夜》位列周票房前三。", "en": "On 13 November Giuseppe Tornatore's “The Legend of 1900” returned to mainland cinemas in a 4K restoration, having previously been re-released there on 15 November 2024. Also opening this week is the crime comedy “I'm Not Wrong!”, directed by Zong Haiying with Zhang Ji as script supervisor and a cast including Tong Liya, Wang Hao, Wang Zhi, Liu Mintao and Zhu Shimao, centred on people under community correction. Industry data show 2026's total box office including presales has passed 31.9 billion yuan, with 89 million yuan taken nationwide this week and “Traces of the Detective”, “Irreplaceable You” and “Resident Evil: Night of Outbreak” topping the weekly chart.", "es": "El 13 de noviembre “La leyenda de 1900”, de Giuseppe Tornatore, volvió a las salas de la China continental en versión restaurada en 4K, tras reestrenarse allí el 15 de noviembre de 2024. Esta semana también llega la comedia criminal “¡No me equivoco!”, dirigida por Zong Haiying con Zhang Ji como supervisor de guion y un reparto con Tong Liya, Wang Hao, Wang Zhi, Liu Mintao y Zhu Shimao, centrada en personas en régimen de libertad condicional. Los datos del sector sitúan la taquilla total de 2026, con preventa, por encima de 31.900 millones de yuanes, con 89 millones esta semana y “Traces of the Detective”, “Irreplaceable You” y “Resident Evil: Night of Outbreak” al frente.", "ja": "11 月 13 日、ジュゼッペ・トルナトーレ監督の「海の上のピアニスト」が 4K 修復版で中国本土の劇場に再登場した。2024 年 11 月 15 日にも再上映されている。今週は宗海英監督、張冀脚本監修の犯罪コメディー「我没错！」も公開され、佟麗婭、王皓、王智、劉敏濤、朱時茂らが出演、社區矯正の対象者を描く。興行データによると 2026 年の累計興収（前売り含む）は 319 億元を突破し、今週の全国興収は 8900 万元超、「神探之痕迹」「无可替代的你」「生化危机：爆发夜」が週間上位に入った。"}, "why": {"zh": "一部 1998 年的电影，两次重映都还有人买票；同期新片靠阵容也难进前三。年度 319 亿的成绩单里，经典重映与中小成本片各自占了一小块——市场不是没有观众，是观众在挑。", "en": "A 1998 film can still sell tickets on its second re-release, while new titles with big casts struggle to reach the top three. Within the 31.9 billion yuan year, restorations and mid-budget films each hold a small share: the audience has not disappeared, it has become selective.", "es": "Una película de 1998 sigue vendiendo entradas en su segundo reestreno, mientras títulos nuevos con reparto potente no llegan al top tres. En los 31.900 millones del año, los reestrenos y las producciones medianas ocupan una porción pequeña: el público no ha desaparecido, se ha vuelto selectivo.", "ja": "1998 年の作品が 2 度目の再上映でもチケットが売れ、同じ週の新作は豪華キャストでも上位 3 本に入れない。年間 319 億元の中で、クラシック再上映と中小規模作品がそれぞれ小さな取り分を持つ。観客がいなくなったのではなく、選ぶようになったのだ。"}}]}], "risk": {"zh": "风险提示：本简报仅作信息汇总，其中涉及的数据不构成任何投资建议。", "en": "Disclaimer: this briefing is a summary of information only; the figures cited do not constitute investment advice.", "es": "Aviso: este boletín es solo un resumen informativo; los datos citados no constituyen asesoramiento de inversión.", "ja": "ご注意：本ブリーフィングは情報の要約であり、記載の数値は投資助言を構成するものではありません。"}}/*__END__*/;

    if (lang === "zh") return '<svg class="fl" viewBox="0 0 30 20" aria-hidden="true"><rect width="30" height="20" fill="#de2910"/><g fill="#ffde00"><circle cx="5" cy="4" r="2.2"/><circle cx="9" cy="2.4" r="0.8"/><circle cx="10" cy="4" r="0.8"/><circle cx="9" cy="5.6" r="0.8"/><circle cx="7" cy="6.6" r="0.8"/></g></svg>';
    if (lang === "en") return '<svg class="fl" viewBox="0 0 30 20" aria-hidden="true"><rect width="30" height="20" fill="#012169"/><path d="M0 0L30 20M30 0L0 20" stroke="#fff" stroke-width="4"/><path d="M0 0L30 20M30 0L0 20" stroke="#c8102e" stroke-width="2"/><rect x="13" width="4" height="20" fill="#fff"/><rect y="8" width="30" height="4" fill="#fff"/><rect x="14" width="2" height="20" fill="#c8102e"/><rect y="9" width="30" height="2" fill="#c8102e"/></svg>';
    if (lang === "es") return '<svg class="fl" viewBox="0 0 30 20" aria-hidden="true"><rect width="30" height="20" fill="#aa151b"/><rect y="5" width="30" height="10" fill="#f1bf00"/></svg>';
    return '<svg class="fl" viewBox="0 0 30 20" aria-hidden="true"><rect width="30" height="20" fill="#fff"/><circle cx="15" cy="10" r="5.5" fill="#bc002d"/></svg>';
  }

  /* ===== 工具 ===== */
  function T(obj, lang) {
    if (obj == null) return "";
    if (typeof obj === "string") return obj;
    if (obj[lang] != null) return obj[lang];
    return obj.zh != null ? obj.zh : "";
  }
  function pad(n) { return n < 10 ? "0" + n : "" + n; }
  function bing(q) { return "https://www.bing.com/search?q=" + encodeURIComponent(q); }
  function fmtDate(d, lang) {
    var y = d.getFullYear(), m = d.getMonth() + 1, day = d.getDate();
    if (lang === "zh") return y + "." + pad(m) + "." + pad(day);
    if (lang === "ja") return y + "年" + m + "月" + day + "日";
    if (lang === "es") return day + " " + ["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"][m-1] + " " + y;
    return ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][m-1] + " " + day + ", " + y;
  }
  function esc(s) {
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }
  function titleHtml(titleObj, hlObj, lang) {
    var title = T(titleObj, lang);
    var hl = T(hlObj, lang);
    var inner = esc(title);
    if (hl && title.indexOf(hl) >= 0) {
      var i = title.indexOf(hl);
      inner = esc(title.slice(0, i)) + '<span class="hl">' + esc(hl) + "</span>" + esc(title.slice(i + hl.length));
    }
    return '<a class="lk" href="' + bing(title) + '" target="_blank" rel="noopener">' + inner + "</a>";
  }

  /* ===== 语言检测：localStorage > 浏览器语言 > 系统时区 > 中文 ===== */
  function detectLang() {
    try { var s = localStorage.getItem("timab_lang"); if (s && LANGS.indexOf(s) >= 0) return s; } catch (e) {}
    var nav = (navigator.language || "").toLowerCase();
    if (/^zh/.test(nav)) return "zh";
    if (/^ja/.test(nav)) return "ja";
    if (/^es/.test(nav)) return "es";
    if (/^en/.test(nav)) return "en";
    var tz = "";
    try { tz = Intl.DateTimeFormat().resolvedOptions().timeZone || ""; } catch (e) {}
    if (/^Asia\/Tokyo/.test(tz)) return "ja";
    if (/Europe\/Madrid|America\/(Mexico_City|Bogota|Lima|Santiago|Caracas|Guatemala|La_Paz|San_Jose|Panama|Asuncion|Montevideo|Havana|El_Salvador|Managua|Tegucigalpa|Costa_Rica|San_Salvador)|America\/Argentina\//.test(tz)) return "es";
    if (/^(Europe|America|Australia)\//.test(tz)) return "en";
    return "zh";
  }

  var curLang = "zh";
  var langOpen = false;

  /* ===== 渲染 ===== */
  function renderChrome(lang) {
    var i18n = I18N[lang];
    document.documentElement.lang = LANG_HTML[lang];
    // 报头信息行
    var metaEl = document.getElementById("metaRow");
    if (metaEl) metaEl.textContent = T(BRIEFING.meta, lang);
    // 大日期
    var md = document.getElementById("mastDate");
    if (md) {
      var d = new Date(BRIEFING.date + "T00:00:00");
      md.innerHTML = fmtDate(d, lang) + "<small>" + esc(i18n.dateSub) + "</small>";
    }
    // 文档标题
    var siteName = (lang === "zh") ? "提马早报" : "TIMAB DAILY";
    document.title = siteName + " · " + fmtDate(new Date(BRIEFING.date + "T00:00:00"), lang);
    // 导航签
    var nav = document.getElementById("navChips");
    if (nav) {
      var order = ["pick"].concat(BRIEFING.sections.map(function (s) { return s.key; }));
      nav.innerHTML = "";
      order.forEach(function (key) {
        if (key === "pick") {
          var a = document.createElement("a");
          a.className = "chip-pick"; a.href = "#pick"; a.setAttribute("data-nav", "pick");
          a.textContent = T(BRIEFING.spotlight.badge, lang);
          nav.appendChild(a);
        } else {
          var sec = null;
          BRIEFING.sections.forEach(function (s) { if (s.key === key) sec = s; });
          if (!sec) return;
          var b = document.createElement("a");
          b.href = "#" + key; b.setAttribute("data-nav", key);
          b.style.borderColor = sec.color; b.style.color = sec.deep;
          b.textContent = T(sec.name, lang);
          nav.appendChild(b);
        }
      });
    }
    // 日历文案
    var cb = document.getElementById("calBtnText"); if (cb) cb.textContent = i18n.calBtn;
    var cw = document.getElementById("calWeek");
    if (cw) { cw.innerHTML = ""; i18n.calWeek.forEach(function (w) { var s = document.createElement("span"); s.textContent = w; cw.appendChild(s); }); }
    var cf = document.getElementById("calFoot"); if (cf) cf.textContent = i18n.calFoot;
    // 语言切换器（国旗触发 + 下拉）
    var ls = document.getElementById("langSwitch");
    if (ls) {
      ls.className = "lang-switch" + (langOpen ? " open" : "");
      ls.innerHTML = "";
      var trig = document.createElement("button");
      trig.type = "button"; trig.className = "lang-trigger"; trig.id = "langTrigger";
      trig.setAttribute("aria-haspopup", "true");
      trig.setAttribute("aria-expanded", langOpen ? "true" : "false");
      trig.innerHTML = flag(curLang) + '<span class="caret">▾</span>';
      trig.addEventListener("click", function (e) {
        e.stopPropagation();
        langOpen = !langOpen;
        ls.classList.toggle("open", langOpen);
        trig.setAttribute("aria-expanded", langOpen ? "true" : "false");
      });
      ls.appendChild(trig);
      var menu = document.createElement("div");
      menu.className = "lang-menu"; menu.setAttribute("role", "menu");
      LANGS.forEach(function (l) {
        var item = document.createElement("button");
        item.type = "button"; item.className = "lang-item" + (l === curLang ? " sel" : "");
        item.setAttribute("role", "menuitem"); item.setAttribute("data-lang", l);
        item.innerHTML = flag(l) + '<span class="lbl">' + LANG_LABEL_FULL[l] + "</span>";
        item.addEventListener("click", function (e) {
          e.stopPropagation();
          setLang(l);
        });
        menu.appendChild(item);
      });
      ls.appendChild(menu);
    }
  }

  function renderContent(lang) {
    var i18n = I18N[lang];
    var html = "";
    // 精选
    var sp = BRIEFING.spotlight;
    html += '<section class="spotlight" id="pick">'
      + '<div class="badge"><i></i>' + esc(T(sp.badge, lang)) + "</div>"
      + "<h2>" + titleHtml(sp.title, sp.hl, lang) + "</h2>"
      + '<div class="body">' + esc(T(sp.body, lang)) + "</div>"
      + '<div class="why"><b>' + esc(i18n.why) + "</b>" + esc(T(sp.why, lang)) + "</div>"
      + "</section>";
    // 分类
    html += '<div class="grid">';
    BRIEFING.sections.forEach(function (sec) {
      html += '<section class="card" id="' + sec.key + '" style="--ac:' + sec.color + "; --ac-deep:" + sec.deep + ';">'
        + '<div class="sec-head"><span class="sec-num">' + sec.num + "</span>"
        + "<h3>" + esc(T(sec.name, lang)) + "</h3>"
        + '<span class="en">' + sec.key.toUpperCase() + "</span></div>";
      (sec.items || []).forEach(function (it) {
        html += '<div class="item">';
        html += '<div class="t"><span class="idx">' + it.idx + "</span>";
        if (it.tag) html += '<span class="tag">' + esc(it.tag[lang] != null ? it.tag[lang] : i18n.tag) + "</span>";
        html += titleHtml(it.title, it.hl, lang) + "</div>";
        html += '<div class="d">' + esc(T(it.body, lang)) + "</div>";
        html += '<div class="why"><b>' + esc(i18n.why) + "</b>" + esc(T(it.why, lang)) + "</div>";
        html += "</div>";
      });
      html += "</section>";
    });
    html += "</div>";
    var content = document.getElementById("content");
    if (content) content.innerHTML = html;
    // 页脚
    var risk = document.getElementById("risk");
    if (risk) risk.textContent = T(BRIEFING.risk, lang);
  }

  function setLang(lang) {
    if (LANGS.indexOf(lang) < 0) lang = "zh";
    curLang = lang;
    langOpen = false;
    try { localStorage.setItem("timab_lang", lang); } catch (e) {}
    renderChrome(lang);
    renderContent(lang);
  }

  /* ===== 往期日历（保留原逻辑，文案随语言） ===== */
  function initCalendar() {
    var btn = document.getElementById("calBtn");
    var pop = document.getElementById("calPop");
    var grid = document.getElementById("calGrid");
    var title = document.getElementById("calTitle");
    if (!btn || !pop || !grid || !title) return;

    var parts = BRIEFING.date.split("-");
    var todayKey = parts[0].slice(2) + parts[1] + parts[2];
    var cur = { y: +parts[0], m: +parts[1] };
    var has = {};
    for (var i = 0; i < ARCHIVE_DATES.length; i++) { has[ARCHIVE_DATES[i]] = 1; }
    var HIST_BASE = /\/history\//.test(location.pathname) ? "./" : "history/";

    function ckey(y, m, d) { return String(y).slice(2) + pad(m) + pad(d); }

    function render() {
      var i18n = I18N[curLang];
      title.textContent = i18n.calTitle(cur.y, cur.m);
      grid.innerHTML = "";
      var start = new Date(cur.y, cur.m - 1, 1).getDay();
      var days = new Date(cur.y, cur.m, 0).getDate();
      for (var b = 0; b < start; b++) {
        var blank = document.createElement("span");
        blank.className = "cal-cell is-empty"; grid.appendChild(blank);
      }
      for (var d = 1; d <= days; d++) {
        var k = ckey(cur.y, cur.m, d);
        var cell = document.createElement("span");
        cell.className = "cal-cell" + (has[k] ? " has" : "") + (k === todayKey ? " is-today" : "");
        cell.textContent = d;
        if (has[k]) {
          cell.setAttribute("role", "link"); cell.setAttribute("tabindex", "0");
          cell.title = cur.y + "-" + pad(cur.m) + "-" + pad(d) + " 存档";
          (function (target) {
            var go = function () { window.open(HIST_BASE + target + ".html", "_blank", "noopener"); };
            cell.addEventListener("click", go);
            cell.addEventListener("keydown", function (e) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); go(); } });
          })(k);
        }
        grid.appendChild(cell);
      }
    }
    function toggle(open) {
      pop.hidden = !open;
      btn.setAttribute("aria-expanded", open ? "true" : "false");
      if (open) render();
    }
    btn.addEventListener("click", function (e) { e.stopPropagation(); toggle(pop.hidden); });
    document.getElementById("calPrev").addEventListener("click", function () { cur.m--; if (cur.m < 1) { cur.m = 12; cur.y--; } render(); });
    document.getElementById("calNext").addEventListener("click", function () { cur.m++; if (cur.m > 12) { cur.m = 1; cur.y++; } render(); });
    document.addEventListener("click", function (e) { if (!pop.hidden && !pop.contains(e.target)) toggle(false); });
    document.addEventListener("keydown", function (e) { if (e.key === "Escape" && !pop.hidden) toggle(false); });
  }

  /* ===== 启动 ===== */
  function boot() {
    curLang = detectLang();
    renderChrome(curLang);
    renderContent(curLang);
    initCalendar();
    // 关闭语言下拉：点击外部 / Esc
    document.addEventListener("click", function (e) {
      var ls = document.getElementById("langSwitch");
      if (ls && langOpen && !ls.contains(e.target)) {
        langOpen = false;
        ls.classList.remove("open");
        var t = document.getElementById("langTrigger");
        if (t) t.setAttribute("aria-expanded", "false");
      }
    });
    document.addEventListener("keydown", function (e) {
      if (e.key === "Escape" && langOpen) {
        langOpen = false;
        var ls = document.getElementById("langSwitch");
        if (ls) ls.classList.remove("open");
        var t = document.getElementById("langTrigger");
        if (t) t.setAttribute("aria-expanded", "false");
      }
    });
  }
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", boot);
  } else { boot(); }
})();
</script>
