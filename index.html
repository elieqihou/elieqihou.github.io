as cabezas de serie en su primer partido con nueva compañera es suerte y también realidad: en dobles, el resultado nunca depende solo del individuo.", "ja": "「男子ダブルス全勝、女子ダブルス全敗」という極端な分布は、7勝4敗という総括より雄弁だ。男子は厚みを増し、女子は再編期で安定した組み合わせをまだ見つけていない。賈一凡が新パートナーとの初戦で第1シードと当たったのは運でもあり現実でもある。ダブルスの結果は個人の力だけでは決まらない。"}}, {"idx": "05", "title": {"zh": "18 岁杨茸秒两站青年世界杯揽 7 金", "en": "Eighteen-year-old Yang Rongmiao takes seven golds in two junior World Cup stops", "es": "Yang Rongmiao, de 18 años, suma siete oros en dos paradas de la Copa del Mundo júnior", "ja": "18歳の楊茸秒、ジュニアW杯2戦で7個の金メダル"}, "body": {"zh": "据腾讯体育 11 月 17 日报道，2026-2027 赛季短道速滑青年世界杯前两站比赛中，18 岁的中国选手杨茸秒在报名的四个单人项目上全部夺金，胜率 100%——其中两个 500 米、两个 1500 米，短距离爆发力与长距离耐力兼备；她还作为主力帮助中国队拿下两站女子 3000 米接力和第二站男女混合 3000 米接力冠军，两站共揽 7 金。杨茸秒 2008 年出生，来自内蒙古鄂尔多斯，2025 赛季起加入上海短道速滑队。韩国媒体与短道迷论坛对此讨论热烈，有评论称她让人想起刚出道时的崔敏静。米兰冬奥会上，中国短道女队无人登上领奖台。", "en": "Chinese skater Yang Rongmiao, 18, won all four individual events she entered across the first two stops of the 2026-27 short track junior World Cup — two 500m and two 1500m titles — for a 100% strike rate, and helped China win both women's 3000m relays and the mixed 3000m relay at the second stop, taking seven golds in total. Born in 2008 in Ordos, Inner Mongolia, she joined Shanghai's short track team in the 2025 season and had barely raced for the national team before. Korean media and fan forums have taken notice, with some comparing her to a young Choi Min-jeong. At the Milan Winter Olympics no Chinese woman reached a short track podium.", "es": "La patinadora china Yang Rongmiao, de 18 años, ganó las cuatro pruebas individuales que disputó en las dos primeras paradas de la Copa del Mundo júnior de pista corta 2026-27 —dos de 500 m y dos de 1.500 m—, un 100% de acierto, y ayudó a China a ganar los dos relevos femeninos de 3.000 m y el mixto en la segunda cita, con siete oros en total. Nacida en 2008 en Ordos, Mongolia Interior, se unió al equipo de Shanghái en la temporada 2025 y apenas había competido con la selección. Medios y foros surcoreanos la comparan con una joven Choi Min-jeong. En los Juegos de Milán ninguna china subió al podio en pista corta.", "ja": "18歳の楊茸秒が、2026-27シーズンのショートトラック・ジュニアワールドカップ第1・第2戦で出場した個人4種目をすべて制した。500メートル2回、1500メートル2回で勝率100%。さらに女子3000メートルリレー2戦と第2戦の混合3000メートルリレーでも主力として優勝に貢献し、2戦で7個の金メダルを獲得した。2008年生まれ、内蒙古自治区オルドス出身で、2025年シーズンから上海のショートトラックチームに加わった。韓国メディアやファンの間でも話題になり、デビュー当時の崔敏静を思い起こさせるという声もある。ミラノ冬季五輪では中国女子ショートトラックは表彰台に届かなかった。"}, "why": {"zh": "7 金的说服力在于「横跨距离」：500 米和 1500 米同时拿冠军，说明她不是靠单一优势吃饭。更值得注意的是她的出现方式——此前几乎没有代表国家队出战的经历，属于突然冒出来的一代。中国短道女队在上一个冬奥周期的最短板正是「除了 500 米没人进 A 组决赛」，这条线索比金牌数更有意义。", "en": "The seven golds matter because they span distances: winning both 500m and 1500m means she is not living off one strength. More striking is how she appeared — with almost no prior national-team exposure, out of nowhere. China's women's short track weakness last cycle was precisely that nobody but the 500m skaters reached an A final; that thread means more than the medal count.", "es": "Los siete oros importan porque abarcan distancias: ganar 500 y 1.500 significa que no vive de una sola virtud. Más llamativo es cómo apareció, casi sin experiencia previa en la selección. La debilidad china del ciclo pasado era justamente que, fuera de los 500 m, nadie llegaba a una final A; ese hilo vale más que el recuento de medallas.", "ja": "7個の金の説得力は距離をまたぐ点にある。500メートルと1500メートルを同時に制するのは、単一の強みに頼っていない証拠だ。さらに注目すべきは登場の仕方で、これまで代表経験がほとんどなく、突然現れた世代である。前回の五輪周期の中国女子の最大の弱点は「500メートル以外でA決勝に残れない」ことだった。この線の方がメダル数より意味を持つ。"}}]}, {"key": "hot", "num": "05", "color": "#6d28d9", "deep": "#5b21b6", "name": {"zh": "网络热点", "en": "Trending", "es": "Tendencias", "ja": "ネット"}, "items": [{"idx": "01", "title": {"zh": "雷军 APEC 现场挨个发名片，热搜第一", "en": "Lei Jun hands out business cards at APEC, and tops the trending list", "es": "Lei Jun reparte tarjetas en APEC y encabeza las tendencias", "ja": "雷軍がAPECで名刺を配り、熱搜1位に"}, "body": {"zh": "11 月 17 日，小米集团创始人、董事长兼首席执行官雷军出席 2026 年亚太经合组织（APEC）工商领导人峰会并发言，会后在社交平台晒出 APEC 发言照片，配文「APEC CEO Summit 2026」，并在评论区写道「给台下朋友们拍了一张合影」。现场视频显示他在台下从怀里掏出名片挨个分发，网友调侃「不管身价多少亿，该发名片还得发」；有网友称其发言「略微有点社恐」，小米服务账号在评论区回应「这么大的国际场合，紧张太正常啦」。「雷军 APEC 现场挨个发名片」登上微博热搜第一。他在发言中表示，AI 走向物理世界并与终端深度结合将带来巨大机会，小米布局机器人研发六年，其具身智能机器人已在工厂实习、能连续工作 8 小时并自主充电两次；小米 AIoT 生态平台接入设备已达 11.6 亿台。", "en": "Lei Jun, founder and chairman of Xiaomi, spoke at the 2026 APEC CEO Summit on 17 November and afterwards posted photos on social media with the caption APEC CEO Summit 2026, adding in comments that he had taken a group photo of the audience. Video showed him pulling business cards from his jacket and handing them out one by one, prompting jokes that no fortune exempts anyone from card-swapping. When a user said his speech looked a bit socially anxious, Xiaomi's service account replied that nervousness at such an international occasion is normal. The card moment topped Weibo's trending list. In his speech Lei said AI moving into the physical world and deep integration with devices would create huge opportunities; Xiaomi has worked on robotics for six years and its embodied robots are already interning in factories, working eight hours and recharging twice autonomously. Its AIoT platform now connects 1.16 billion devices.", "es": "Lei Jun, fundador y presidente de Xiaomi, intervino el 17 de noviembre en la cumbre empresarial de APEC y después publicó fotos en redes con el texto APEC CEO Summit 2026, añadiendo en comentarios que había hecho una foto del público. Un vídeo lo mostró sacando tarjetas de la chaqueta y repartiéndolas una a una, lo que provocó bromas sobre que ninguna fortuna exime de dar tarjetas. Cuando un usuario dijo que su intervención parecía un poco tímida, la cuenta de servicio de Xiaomi respondió que es normal ponerse nervioso en un foro internacional. El momento encabezó las tendencias de Weibo. En su discurso, Lei afirmó que la IA que pasa al mundo físico y se integra con los dispositivos creará grandes oportunidades; Xiaomi lleva seis años en robótica y sus robots encarnados ya trabajan en fábricas ocho horas con dos recargas autónomas. Su plataforma AIoT conecta 1.160 millones de dispositivos.", "ja": "小米グループの雷軍会長は11月17日、APEC 工商リーダーサミットで講演し、終了後にSNSへ登壇写真を投稿、「APEC CEO Summit 2026」と記し、コメント欄に「会場の皆さんの集合写真を撮った」と添えた。会場映像では懐から名刺を取り出して一人ずつ配る姿が映り、「どんな資産家でも名刺は配る」と話題に。講演が「少し人見知りに見える」との指摘に、小米のサービスアカウントは「これほど大きな国際の場では緊張して当然です」と返した。「雷軍がAPECで名刺を配る」が微博の熱搜1位となった。講演で同氏は、AIが物理世界に進み端末と深く結びつくことで大きな機会が生まれると述べ、小米は6年前からロボットを研究し、具現化知能ロボットは工場で8時間連続稼働し自律充電を2回行っていると説明。AIoT 生態系の接続端末は11.6億台に達した。"}, "why": {"zh": "热搜第一不是因为名片，而是因为「亿万富翁也要递名片」这个反差——它把一场规格很高的国际会议，拉回到了人情世故的尺度。更有信息量的是他讲的数字：11.6 亿台设备、机器人连续工作 8 小时，这些是可以被验证的进度条，比任何「AI 愿景」都具体。", "en": "The top trend is not about cards but about the contrast — even billionaires hand out cards — which pulls a high-level international meeting back to the scale of human manners. More informative are his numbers: 1.16 billion connected devices and robots working eight-hour shifts are verifiable progress bars, more concrete than any AI vision statement.", "es": "Lo primero en tendencias no son las tarjetas sino el contraste —hasta los multimillonarios reparten tarjetas—, que devuelve una cumbre internacional a la escala de los modales. Más informativos son sus números: 1.160 millones de dispositivos y robots con turnos de ocho horas son barras de progreso verificables, más concretas que cualquier visión sobre la IA.", "ja": "熱搜1位の理由は名刺そのものではなく、「億万長者でも名刺を配る」という落差にある。高い格式の国際会議を、人情の尺度に引き戻した。より情報量が多いのは数字の方だ。11.6億台の端末、8時間稼働のロボットは検証可能な進捗指標であり、どの「AIビジョン」より具体的である。"}}, {"idx": "02", "title": {"zh": "两人 58 元买一杯咖啡被拒入座，「一客一消」吵翻", "en": "One 58-yuan coffee for two, no table: the “one guest, one order” rule divides opinion", "es": "Un café de 58 yuanes para dos y sin mesa: la norma «un cliente, un pedido» divide", "ja": "2人で58元のコーヒー1杯、着席拒否で「1人1席1消費」が物議"}, "body": {"zh": "11 月 16 日，一篇题为《我们 2 人 58 元买一杯咖啡被拒绝入座》的帖子冲上微博热搜第一。发帖人李先生称，他与妻子在青岛西海岸新区鱼鸣嘴一家海边咖啡店各选了餐品、合计 58 元，准备付款时被以「一人一座一消费」的规则拒绝入座，两人最终未消费；离店后在门口二三十米外的长凳小坐，店员又前来请离，称该处属于消费区。店方回应称，事发正值客流高峰，提示贴在门口、前台与桌号牌上；目前已撤下该规则，后续将优化。律师认为「一人一座一消费」涉嫌变相设置最低消费、属不公平不合理条款；青岛西海岸新区市场监管局表示此类规则不能一刀切，消费者可提交线索，将上门核实。", "en": "A post titled We bought one 58-yuan coffee for two and were refused a seat topped Weibo's trending list on 16 November. The author, Li, said he and his wife picked items totalling 58 yuan at a seaside café in Yumingzui, Qingdao West Coast New Area, and were refused seating under a one-seat-one-order rule when they went to pay; they left without buying anything, and a staff member later asked them to move from a bench about 20-30 metres away, saying it was a consumption area. The café said the rule was posted at the entrance, counter and table signs during a peak period, and that it has now been withdrawn and will be revised. Lawyers say the rule looks like a disguised minimum charge and an unfair term; the local market regulator said such rules cannot be judged across the board and will investigate if consumers submit evidence.", "es": "Una publicación titulada Compramos un café de 58 yuanes para dos y nos negaron la mesa encabezó las tendencias de Weibo el 16 de noviembre. Su autor, Li, contó que él y su mujer eligieron productos por 58 yuanes en una cafetería frente al mar en Yumingzui, distrito de la costa oeste de Qingdao, y que al ir a pagar les negaron la mesa por la norma «una persona, un asiento, un consumo»; se fueron sin consumir y después un empleado les pidió abandonar un banco a 20-30 metros, alegando que era zona de consumo. El local dijo que el aviso estaba en la entrada, la caja y los carteles de mesa en hora punta, y que ya lo ha retirado y lo revisará. Los abogados ven una cuota mínima encubierta y una cláusula abusiva; el regulador local dijo que estas normas no se pueden juzgar en bloque y que investigará si hay denuncias.", "ja": "「2人で58元のコーヒー1杯では着席お断り」という投稿が11月16日、微博の熱搜1位になった。投稿者によれば、青島西海岸新区・魚鳴嘴の海辺のカフェで2人が計58元分を選び、支払おうとしたところ「1人1席1消費」の規則を理由に着席を断られた。結局消費せず、店から20〜30メートル離れたベンチに座ると、店員が「消費エリアだ」として退去を求めたという。店側は、混雑時間帯で入口・レジ・卓上に掲示していたと説明し、現在は規則を撤去して見直すとしている。弁護士は変則的な最低消費の疑いがあり不当な条項だと指摘。地元市場監管局は一律には判断できず、消費者が情報を提供すれば立ち入り調査するとした。"}, "why": {"zh": "争的不是 58 元，是「规则什么时候出现」。商家有权定规则，但规则必须显著、提前、可预期——付款那一刻才亮出来的规矩，本质上不是规则而是埋伏。这条热搜真正戳中人的地方在于：几乎每个人都遇到过「不点够就不能坐」的场面，只是大多数人选择沉默走开。", "en": "The fight is not over 58 yuan but over when a rule appears. Businesses may set rules, but they must be prominent, prior and predictable — a rule revealed at the moment of payment is not a rule but an ambush. What really lands is that almost everyone has met an order-enough-or-don't-sit sign, and most simply walked away in silence.", "es": "La disputa no es por 58 yuanes sino por cuándo aparece la norma. El comercio puede fijar reglas, pero deben ser visibles, previas y previsibles: una regla que surge al pagar no es una regla, es una emboscada. Lo que de verdad conecta es que casi todos se han topado con un «si no pides suficiente, no te sientas», y la mayoría se fue en silencio.", "ja": "争点は58元ではなく「規則がいつ現れるか」だ。店に規則を作る権利はあるが、目立つ場所に、事前に、予測可能な形で示す必要がある。支払の瞬間に出てくる規則は規則ではなく待ち伏せだ。この話題が刺さるのは、ほとんどの人が「注文が足りなければ座れない」場面に出会い、多くは黙って立ち去ってきたからだ。"}}, {"idx": "03", "title": {"zh": "深圳人「全妆出街」迎 APEC，人字拖换皮鞋", "en": "Shenzhen dresses up for APEC: flip-flops give way to leather shoes", "es": "Shenzhen se arregla para APEC: las chanclas dejan paso a los zapatos de cuero", "ja": "深圳市民が「フル装い」でAPECを迎える、ビーチサンダルが革靴に"}, "body": {"zh": "随着亚太经合组织（APEC）第三十三次领导人非正式会议在深圳举行，「深圳人全妆出街迎 APEC」「深圳人收起人字拖换皮鞋小白鞋」「深圳市民为了 APEC 不穿拖鞋了」等话题接连登上微博、百度热搜。网友晒出的照片里，地铁里、写字楼下的通勤装明显「升级」：有人换上西装皮鞋，有人把凉拖换成了小白鞋，还有人贴出「衣柜里最正式那件」的穿搭。同期多个与城市相关的话题同步升温：「与亚太共赴深圳之约」「三次东道主，这次有什么不一样」「APEC 经贸活力藏在深圳陆海空通道里」，抖音「APEC 是什么」热度达 1113 万。", "en": "As Shenzhen hosts the 33rd APEC Economic Leaders' Meeting, topics such as Shenzhen people dressing up for APEC and flip-flops swapped for leather shoes and white sneakers climbed Weibo and Baidu trending lists. Photos showed commutes looking noticeably more formal: suits and leather shoes, sandals replaced by clean sneakers, people posting their most formal piece. Related city topics rose together: A date with Asia-Pacific in Shenzhen, Third time as host, what is different, and APEC's trade vitality runs through Shenzhen's sea, land and air corridors, while the Douyin topic What is APEC reached 11.13 million.", "es": "Con la 33.ª cumbre de líderes de APEC en Shenzhen, temas como «los shenzhenses se arreglan para APEC» o «chanclas cambiadas por zapatos de cuero y zapatillas blancas» escalaron en las tendencias de Weibo y Baidu. Las fotos mostraban trayectos al trabajo mucho más formales: trajes y zapatos de cuero, sandalias sustituidas por zapatillas limpias, gente publicando su prenda más formal. Temas municipales subieron a la vez: «Una cita con Asia-Pacífico en Shenzhen», «Tercera vez como anfitrión, qué es diferente» y «La vitalidad comercial de APEC en los corredores marítimos, terrestres y aéreos», mientras «Qué es APEC» llegaba a 11,13 millones en Douyin.", "ja": "APEC 第33回非公式首脳会議の開催に合わせ、「深圳市民がフルメイクで出勤」「ビーチサンダルを革靴や白スニーカーに」「APECのためにサンダルをやめた」といった話題が微博や百度の熱搜に相次いだ。写真には、通勤服が明らかに「格上げ」された様子が並ぶ。スーツと革靴、サンダルから白スニーカーへ、中には「一番フォーマルな一着」を披露する人も。関連して「アジア太平洋との約束」「3度目の議長、今回は何が違う」「APECの貿易活力は深圳の海陸空の通路に」も浮上し、抖音の「APECとは何か」は1113万に達した。"}, "why": {"zh": "一场国际会议最生动的落地方式，是市民开始在意自己的穿着。这种「集体精致」看似好笑，其实是城市对外部目光的自觉反应——它既是待客之道，也是一种身份确认。和「APEC 是什么」一起冲上热搜，恰好说明多数人是在会议开始后才真正开始理解它。", "en": "The liveliest way a summit lands is when residents start caring how they dress. This collective polish looks funny but is a city reacting knowingly to outside attention — hospitality and a form of self-definition at once. That What is APEC trended alongside it suggests most people only began to understand the meeting after it started.", "es": "La forma más viva en que una cumbre aterriza es que los vecinos empiecen a preocuparse por cómo visten. Ese esmero colectivo parece gracioso pero es una ciudad reaccionando a la mirada externa: hospitalidad y, a la vez, afirmación de identidad. Que «Qué es APEC» subiera al mismo tiempo sugiere que la mayoría empezó a entender la cita cuando ya había comenzado.", "ja": "国際会議が最も生々しく日常に降りるのは、市民が身だしなみを気にし始めるときだ。この「集団的なおしゃれ」は滑稽に見えて、外部の視線への自覚的な反応であり、もてなしであると同時に自己確認でもある。「APECとは何か」が同時に上がったことは、多くの人が会議が始まってから初めて理解し始めたことを物語る。"}}, {"idx": "04", "title": {"zh": "医生：干发帽包头超 5 分钟易脱发", "en": "Doctors: leaving a hair towel on for more than five minutes can cost you hair", "es": "Médicos: llevar la toalla en el pelo más de cinco minutos favorece la caída", "ja": "医師「ドライタオルを5分以上巻くと抜け毛しやすい」"}, "body": {"zh": "一条「医生提醒：干发帽包头超过 5 分钟易脱发」的话题登上百度热搜，热度 724 万。医生解释，洗完头后用干发帽长时间包裹，头皮处于潮湿、闷热、不透气的环境，容易滋生细菌与马拉色菌，引发头皮瘙痒、头屑增多甚至毛囊炎；同时湿发时毛鳞片张开、发丝强度下降，长期摩擦与牵拉会增加断发与脱发风险。建议用干发帽吸水 3 至 5 分钟后取下，及时用吹风机低温吹干头皮，不要把湿发长时间包住或湿着睡觉。", "en": "A topic urging that hair-drying towels should not stay wrapped for more than five minutes reached Baidu's trending list with 7.24 million. Doctors explain that leaving a towel wrapped after washing keeps the scalp damp, warm and poorly ventilated, encouraging bacteria and Malassezia, which can cause itching, dandruff and folliculitis; wet hair also has open cuticles and lower tensile strength, so prolonged rubbing and tugging raises breakage and shedding. The advice is to absorb water for three to five minutes, then dry the scalp with a low-heat dryer rather than leaving hair wrapped or sleeping on it wet.", "es": "Un tema que advierte que la toalla secadora no debe llevarse más de cinco minutos llegó a las tendencias de Baidu con 7,24 millones. Los médicos explican que mantener la toalla puesta tras el lavado deja el cuero cabelludo húmedo, cálido y mal ventilado, lo que favorece bacterias y Malassezia y puede causar picor, caspa y foliculitis; el pelo mojado tiene la cutícula abierta y menor resistencia, por lo que el roce y el tirón prolongados aumentan la rotura y la caída. La recomendación es absorber de tres a cinco minutos y secar el cuero cabelludo con secador a baja temperatura, sin dormir con el pelo mojado.", "ja": "「ドライタオルを5分以上頭に巻くと抜け毛しやすい」という医師の注意が百度の熱搜に入り、724万の热度を記録した。医師によると、洗髪後にタオルで長時間包むと頭皮が湿って蒸れ、細菌やマラセチアが増えやすくなり、かゆみやふけ、毛包炎の原因になる。濡れた髪はキューティクルが開いて強度が落ちるため、摩擦や引っ張りで切れ毛・抜け毛のリスクが上がる。3〜5分吸水したら外し、低温のドライヤーで頭皮を乾かすこと、濡れたまま包んだり寝たりしないことが勧められる。"}, "why": {"zh": "这类提醒的价值在于它把「护发」从产品叙事拉回到物理条件：潮湿、温度、摩擦、时间。干发帽不是坏东西，坏的是「包上就忘了」。它和「湿着睡觉」「头发没干就扎起来」是同一个问题的不同版本——真正伤发的往往不是工具，而是使用时长。", "en": "The value of such advice is that it pulls hair care back from product narratives to physical conditions: moisture, temperature, friction, time. The towel is not the villain; forgetting it is. It is the same problem as sleeping with wet hair or tying it up damp — what damages hair is usually duration, not the tool.", "es": "El valor de estos avisos es devolver el cuidado del cabello de los relatos de producto a las condiciones físicas: humedad, temperatura, fricción, tiempo. La toalla no es el problema; olvidarla sí. Es el mismo asunto que dormir con el pelo mojado: lo que daña suele ser la duración, no la herramienta.", "ja": "こうした注意の価値は、ヘアケアを製品の物語から物理条件へ引き戻す点にある。湿気、温度、摩擦、時間だ。タオルが悪いのではなく、巻いたまま忘れることが悪い。濡れたまま寝る、濡れたまま結ぶのと同じ問題で、髪を傷めるのは道具より時間であることが多い。"}}, {"idx": "05", "title": {"zh": "近半米高的「超长奶茶」走红", "en": "The half-metre milk tea goes viral", "es": "El té con leche de medio metro se hace viral", "ja": "高さ50センチ近い「ロングミルクティー」が話題"}, "body": {"zh": "百度热搜显示，「近半米高的超长奶茶火了」热度 742 万。视频里，一杯高度接近 50 厘米的奶茶被两只手竖着抱起来，杯身分多层，插着吸管，店员需要两个人配合才能封口。网友的讨论集中在三点：一杯到底有多少毫升、怎么喝才不会洒、以及「买它是为了喝还是为了拍照」。同期走红的还有「东营观鸟浪全攻略」「暖冬来碗能熬出油的敖汉小米」等地域美食与风物话题。", "en": "Baidu trends showed the nearly half-metre milk tea going viral at 7.42 million. In the videos a cup close to 50 centimetres tall is held upright with both hands, layered and fitted with a straw, with two staff needed to seal it. Discussion centres on three things: how many millilitres it holds, how to drink it without spilling, and whether it is bought to drink or to photograph. Other local food topics rose alongside, from bird-watching guides in Dongying to millet from Aohan that yields oil when cooked.", "es": "Las tendencias de Baidu mostraron «el té con leche de casi medio metro se hace viral» con 7,42 millones. En los vídeos, un vaso de casi 50 centímetros se sostiene en vertical con las dos manos, por capas y con pajita, y hacen falta dos empleados para sellarlo. El debate se centra en tres cosas: cuántos mililitros tiene, cómo beberlo sin derramar y si se compra para beber o para fotografiar. Otros temas gastronómicos subieron a la vez, desde guías de aves en Dongying hasta mijo de Aohan que suelta aceite al cocerse.", "ja": "百度の熱搜では「高さ50センチ近いロングミルクティーが話題」が742万の热度となった。動画では高さ50センチ近いカップを両手で抱え、層状でストローが刺さり、封をするのに店員2人がかりの様子が映る。議論は3点に集中する。何ミリリットル入るのか、こぼさずにどう飲むのか、飲むためか撮影のためか。同時に「東営の鳥の群れ観察ガイド」「冬に油が浮く敖漢小米」など地域の食と風物の話題も上がった。"}, "why": {"zh": "这类「尺寸型网红」每隔一阵就会冒出来一次：从 45 厘米肉夹馍到半米奶茶，逻辑完全一样——用一个可以量化的夸张，换取一次传播。真正值得留意的是它背后的生意：一杯的分量远超一个人能喝完的量，卖的是拍摄时长和社交货币，而不是饮料本身。", "en": "Size-driven viral products surface every so often — a 45-centimetre roujiamo, a half-metre milk tea — with identical logic: one quantifiable exaggeration traded for one round of sharing. What is worth noting is the business behind it: the portion far exceeds what one person can drink, so what is sold is filming time and social currency, not the beverage.", "es": "Los productos virales por tamaño aparecen cada cierto tiempo —un roujiamo de 45 centímetros, un té de medio metro— con la misma lógica: un exceso cuantificable a cambio de una ronda de difusión. Lo interesante es el negocio detrás: la ración supera lo que una persona puede beber, así que se vende tiempo de grabación y moneda social, no la bebida.", "ja": "こうした「サイズ系の流行」は定期的に現れる。45センチの肉夾饃から半メートルのミルクティーまで論理は同じで、数値化できる誇張を一度の拡散に交換している。注目すべきはその商売の中身だ。1杯の量は1人が飲み切れる量をはるかに超えており、売っているのは撮影時間とソーシャル・カレンシーであって飲み物そのものではない。"}}]}, {"key": "ent", "num": "06", "color": "#db2777", "deep": "#be185d", "name": {"zh": "娱乐八卦", "en": "Entertainment", "es": "Entretenimiento", "ja": "芸能"}, "items": [{"idx": "01", "title": {"zh": "新邦德定了：罗伯特·帕丁森接棒，维伦纽瓦执导", "en": "The new Bond is Robert Pattinson, directed by Denis Villeneuve", "es": "El nuevo Bond es Robert Pattinson, con Denis Villeneuve al mando", "ja": "新ボンドはロバート・パティンソン、監督はヴィルヌーヴ"}, "body": {"zh": "北京时间 11 月 17 日晚，《007》官方通过社交平台公布新任邦德人选：40 岁的英国演员罗伯特·帕丁森将接替丹尼尔·克雷格，成为这一系列的新主演；亚马逊米高梅影业同日发布正式声明确认选角。新片由《沙丘》导演丹尼斯·维伦纽瓦执导，《蜘蛛侠》系列制片人艾米·帕斯卡尔与《哈利·波特》系列制片人大卫·海曼担任制片人，《浴血黑帮》主创斯蒂文·奈特负责剧本。截至公告，亚马逊未公布正式片名、开拍日期与档期，据媒体报道第 26 部邦德电影预计 2027 年开拍、2028 年上映。帕丁森因《暮光之城》系列获得全球知名度，2022 年出演《新蝙蝠侠》主角。", "en": "On the evening of 17 November Beijing time, the official 007 channels named the next Bond: 40-year-old British actor Robert Pattinson will succeed Daniel Craig, with Amazon MGM Studios confirming the casting the same day. Denis Villeneuve, director of Dune, will helm the film; Amy Pascal (Spider-Man) and David Heyman (Harry Potter) will produce, with Peaky Blinders creator Steven Knight writing. No title, start date or release window was announced; media reports suggest the 26th Bond film will shoot in 2027 for a 2028 release. Pattinson became globally known through Twilight and played the lead in 2022's The Batman.", "es": "La noche del 17 de noviembre (hora de Pekín), los canales oficiales de 007 anunciaron al nuevo Bond: el actor británico Robert Pattinson, de 40 años, sucederá a Daniel Craig, y Amazon MGM Studios confirmó el fichaje ese mismo día. Denis Villeneuve (Dune) dirigirá; Amy Pascal (Spider-Man) y David Heyman (Harry Potter) producirán, con guion de Steven Knight (Peaky Blinders). No se anunciaron título, inicio de rodaje ni estreno; la prensa apunta a un rodaje en 2027 y estreno en 2028. Pattinson se hizo mundialmente conocido con Crepúsculo y protagonizó The Batman en 2022.", "ja": "北京時間11月17日夜、007の公式アカウントが次代ジェームズ・ボンドを発表した。40歳の英俳優ロバート・パティンソンがダニエル・クレイグの後任となる。アマゾンMGMスタジオも同日、配役を正式に認めた。監督は「デューン」のドゥニ・ヴィルヌーヴ、製作は「スパイダーマン」のエイミー・パスカルと「ハリー・ポッター」のデヴィッド・ハイマン、脚本は「ピーキー・ブラインダーズ」のスティーヴン・ナイト。題名・撮影開始・公開時期は未発表で、現地報道では26作目を2027年撮影、2028年公開と見る。パティンソンは「トワイライト」で世界的に知られ、2022年「ザ・バットマン」で主演した。"}, "why": {"zh": "选一个「已经家喻户晓」的明星，等于放弃 007 过去「业内知名但还不是超级明星」的选角传统——这是一次明确的风险偏好调整：用现成的公众认知，换更短的预热周期。真正的看点不在演员，而在维伦纽瓦加奈特这套组合能不能拍出一部「不像旧邦德」的邦德片。", "en": "Casting an already famous star abandons the franchise's tradition of picking someone well known in the industry but not yet a superstar — a deliberate shift in risk appetite, trading built-in recognition for a shorter runway. The real question is not the actor but whether Villeneuve and Knight can make a Bond film that does not feel like the old one.", "es": "Elegir a una estrella ya famosa abandona la tradición de fichar a alguien conocido en la industria pero no superstar: un cambio deliberado de apetito de riesgo, que cambia reconocimiento inmediato por un periodo de calentamiento más corto. La pregunta real no es el actor, sino si Villeneuve y Knight pueden hacer un Bond que no se parezca al anterior.", "ja": "すでに広く知られた俳優を選ぶことは、「業界内で有名だが超スターではない」という伝統を捨てる決断であり、リスク選好の明確な調整だ。既存の認知度と引き換えに助走期間を短くする。本当の焦点は俳優ではなく、ヴィルヌーヴとナイトの組み合わせが「昔のボンドらしくないボンド」を作れるかにある。"}}, {"idx": "02", "title": {"zh": "刘德华自曝快一年没进组：「毕竟还要生活」", "en": "Andy Lau says he has not shot a film in nearly a year: “one still has to live”", "es": "Andy Lau lleva casi un año sin rodar: «al fin y al cabo hay que vivir»", "ja": "アンディ・ラウ、1年近く新作撮影なし「所詮は生活がある」"}, "body": {"zh": "刘德华在近期受访时自曝，自《流浪地球 3》杀青后已快一年没有进组拍戏，主演电影要等到 2028 年巡演结束后再考虑，一句「毕竟还要生活」被广泛转发。同期他仍在进行巡回演唱会。这一表态与近期行业数据形成呼应：据不完全统计，11 月开机剧组数量较去年同期明显下降，而 11 月 18 日一天就有《宝珠》《裙下之臣》《恶意拼图》三部新剧上线，11 月 19 日《繁华落尽 2》接档，库存剧集集中释放。截至 11 月 15 日，2026 年度电影总票房突破 320 亿元，观影人次 8.18 亿，年度票房榜前五均为国产片。", "en": "Andy Lau said in a recent interview that he has not started a new shoot for nearly a year since finishing The Wandering Earth 3, and will consider a lead film role only after his 2028 tour ends; his line about still having to make a living circulated widely. He is still touring. The remark echoes industry data: shootings started in November are down noticeably year on year, while three new dramas — The Pearl, Under the Skirt and Malicious Puzzle — launched on 18 November alone, with Blooming 2 following on 19 November, as finished stock is released in bulk. By 15 November, 2026 box office takings passed 32 billion yuan with 818 million admissions, and the top five films of the year are all domestic.", "es": "Andy Lau contó en una entrevista reciente que lleva casi un año sin rodar desde que terminó The Wandering Earth 3, y que considerará un papel protagonista en cine solo después de su gira de 2028; su frase sobre que al fin y al cabo hay que vivir se difundió ampliamente. Sigue de gira. El comentario coincide con los datos del sector: los rodajes iniciados en noviembre caen notablemente interanual, mientras solo el 18 de noviembre se estrenan tres series —The Pearl, Under the Skirt y Malicious Puzzle— y el 19 llega Blooming 2, con estreno masivo de títulos ya terminados. Hasta el 15 de noviembre la taquilla de 2026 supera los 32.000 millones de yuanes con 818 millones de espectadores.", "ja": "アンディ・ラウは最近のインタビューで、「流浪地球3」の撮影終了から1年近く新作の撮影に入っておらず、主演映画は2028年のツアー終了後に考えると語った。「所詮は生活があるから」という一言が広く共有された。現在もツアーを続けている。この発言は業界データとも重なる。11月にクランクインした組数は前年同期より明らかに減る一方、11月18日だけで「宝珠」「裙下之臣」「悪意拼図」の3作が配信開始、19日には「繁華落尽2」が続くなど、完成済みの在庫が集中放出されている。11月15日時点で2026年の映画興行収入は320億元を超え、観客動員は8.18億人、年間上位5本はすべて国産だ。"}, "why": {"zh": "「毕竟还要生活」这句话之所以被反复引用，是因为它把一个行业问题说得很体面：不是没戏可拍，而是拍了也未必值得。开机率与上线量的背离，说明行业正在消化库存而不是在生产新内容——这对演员意味着空窗期，对观众意味着「可选的很多、想看的很少」。", "en": "The line gets repeated because it states an industry problem gracefully: it is not that there is nothing to shoot, but that shooting may not be worth it. The divergence between starts and releases shows the industry digesting inventory rather than producing — a gap for actors, and for audiences plenty to choose from, little worth watching.", "es": "La frase se repite porque enuncia con elegancia un problema del sector: no es que no haya nada que rodar, sino que rodarlo quizá no valga la pena. La divergencia entre rodajes y estrenos muestra una industria que digiere inventario en vez de producir: un hueco para los actores y, para el público, mucho donde elegir, poco que ver.", "ja": "この言葉が引用され続けるのは、業界の問題を品よく言い当てているからだ。撮るものがないのではなく、撮っても割に合わないかもしれない。クランクイン数と配信本数の乖離は、産業が生産ではなく在庫処理をしていることを示す。俳優には空白期間、観客には「選択肢は多いが観たいものが少ない」という状況をもたらす。"}}, {"idx": "03", "title": {"zh": "《走马上任》开播热度破 22000，评分从 9.5 回落", "en": "New drama hits 22,000 on its opening night, then its 9.5 rating slips", "es": "El nuevo drama supera 22.000 en su estreno y su nota de 9,5 retrocede", "ja": "「走馬上任」初日热度22000超え、評価9.5から下落"}, "body": {"zh": "由赵本山担任总监制、王小利一人分饰两角的剧集《走马上任》开播，腾讯站内热度开播当晚突破 22000，评分一度冲至 9.5，随后回落，被部分观众吐槽「东北二人转披了层县衙壳子」。同期，微短剧仍在密集上线：11 月 17 日《霓裳尽欢》（24 集）在爱奇艺、《凤起微月》（32 集）在腾讯开播，11 月 18 日《宝珠》《裙下之臣》《恶意拼图》接档，11 月 19 日《繁华落尽 2》上线，成毅、林更新的《两京十五日》有望 11 月 20 日开播。电影方面，《琴弓师》11 月 17 日上映，是国内首部讲述苏州琴弓匠人的院线片；何苦用 1300 元启动、两三万元拍完的纪录式电影《最后的棒棒》同日公映。", "en": "Zhao Benshan-produced drama Walking into Office, with Wang Xiaoli playing two roles, passed 22,000 on Tencent's heat index on its opening night and briefly hit a 9.5 rating before slipping, with some viewers calling it a northeastern song-and-dance show in a county magistrate's costume. Short dramas keep arriving: The Pearl, Under the Skirt and Malicious Puzzle launch on 18 November, Blooming 2 on 19 November, and Cheng Yi and Lin Gengxin's Fifteen Days in Two Capitals may start on 20 November. In cinemas, The Bowmaker opened on 17 November, the first feature about Suzhou bow craftsmen, while The Last Pole, made for a few tens of thousands of yuan, opened the same day.", "es": "El drama Walking into Office, producido por Zhao Benshan y con Wang Xiaoli en dos papeles, superó los 22.000 puntos de audiencia en Tencent la noche del estreno y llegó brevemente a 9,5 antes de bajar, con espectadores que lo describen como un espectáculo del noreste disfrazado de yamen. Los microdramas siguen llegando: The Pearl, Under the Skirt y Malicious Puzzle el 18 de noviembre, Blooming 2 el 19, y Fifteen Days in Two Capitals de Cheng Yi y Lin Gengxin podría estrenarse el 20. En cines, The Bowmaker llegó el 17 de noviembre, primer largo sobre los artesanos de arcos de Suzhou, y The Last Pole, rodada con unas decenas de miles de yuanes, se estrenó el mismo día.", "ja": "趙本山が総監修、王小利が一人二役を演じる「走馬上任」が配信開始となり、初日のTencentの热度は22000を突破、評価は一時9.5まで上がった後に下がり、「東北の二人転を県衙の殻で包んだだけ」との指摘も出た。短編ドラマは依然として集中投下が続く。11月17日に「霓裳尽歓」（24話）が愛奇芸、「鳳起微月」（32話）がTencentで開始、18日には「宝珠」「裙下之臣」「悪意拼図」、19日「繁華落尽2」、成毅と林更新の「両京十五日」は20日開始の見込み。映画では、蘇州の弓職人を描く初の劇場映画「琴弓師」が17日公開、1300元で立ち上げ数万元で撮った記録映画「最後的棒棒」も同日公開された。"}, "why": {"zh": "「开播 9.5、随后回落」几乎成了这两年国产剧的标准曲线：热度靠阵容与话题拉起来，口碑要靠前十集之后才见分晓。《走马上任》的争议点其实很典型——观众不排斥地方戏的表演方式，排斥的是把它直接搬到县衙场景里还不做转化。同一天上映的《琴弓师》与《最后的棒棒》则提供了另一种对照：一个拍「手艺」，一个用极低成本拍「人」，都不靠流量。", "en": "Opening at 9.5 and then sliding has become the standard curve for domestic drama: heat built by cast and topic, judgement only after the first ten episodes. The controversy is typical — audiences do not reject regional performance styles, they reject moving them into a courthouse without translation. The Bowmaker and The Last Pole offer a contrast: one films a craft, the other films people on a tiny budget, and neither relies on traffic.", "es": "Abrir con 9,5 y luego caer se ha vuelto la curva estándar del drama nacional: el calor lo pone el reparto y el tema, el juicio llega después de diez episodios. La polémica es típica: el público no rechaza el estilo regional, rechaza trasladarlo a un juzgado sin traducirlo. The Bowmaker y The Last Pole ofrecen el contraste: uno filma un oficio, el otro filma personas con muy poco dinero, y ninguno depende del tráfico.", "ja": "「初日9.5、その後に下落」はこの数年、国産ドラマの標準曲線になった。熱は配役と話題で作り、評価は10話以降で決まる。「走馬上任」の争点は典型的で、観客は地方演劇の演技そのものを拒むのではなく、それを県衙の場面に移して翻訳しないことを拒む。同日公開の「琴弓師」と「最後的棒棒」は対照的だ。一方は「手仕事」を、他方は低予算で「人」を撮り、どちらも流量に頼らない。"}}, {"idx": "04", "title": {"zh": "张家辉首夺亚洲视帝，阔别电视剧 22 年", "en": "Nick Cheung wins his first Asian TV best actor award after 22 years away", "es": "Nick Cheung gana su primer premio asiático de televisión tras 22 años", "ja": "張家輝、22年ぶりの連続ドラマでアジア主演男優賞を初受賞"}, "body": {"zh": "11 月 14 日晚，第 31 届亚洲电视大奖在越南胡志明市揭晓，张家辉凭《绝命法官》中的法官秦誉一角获得最佳男主角，击败张嘉益、白宇、章宇、山崎贤人等对手，这是他首次拿下亚洲视帝。该剧改编自以色列剧集《Kvodo》，此前已被美国、韩国、法国、西班牙等多国翻拍；他上一次拍电视剧还是 2004 年的《天涯侠医》，中间隔了 22 年。提名公布时他曾直言「最佳男主角这次拿定了，大家不要大惊小怪」，获奖后全程以英语致谢。他表示自己不会决绝地说不再拍剧，「太喜欢演戏」。", "en": "The 31st Asian Television Awards were announced in Ho Chi Minh City on the evening of 14 November, with Nick Cheung winning Best Actor for his role as judge Qin Yu in The Last Judgment, beating Zhang Jiayi, Bai Yu, Zhang Yu and Kento Yamazaki for his first Asian TV best actor award. Adapted from the Israeli series Kvodo, previously remade in the U.S., South Korea, France and Spain, the show marked his return to television after 22 years, since 2004's The Last Breakthrough. At nomination he had said he would definitely win Best Actor and told people not to be surprised; he thanked the audience in English. He said he would not rule out more television: he simply loves acting.", "es": "Los 31.º Asian Television Awards se anunciaron en Ciudad Ho Chi Minh la noche del 14 de noviembre: Nick Cheung ganó el premio a mejor actor por su papel del juez Qin Yu en The Last Judgment, imponiéndose a Zhang Jiayi, Bai Yu, Zhang Yu y Kento Yamazaki. Adaptación de la serie israelí Kvodo, ya versionada en EE. UU., Corea, Francia y España, marcó su regreso a la televisión tras 22 años, desde The Last Breakthrough (2004). Al conocerse la nominación dijo que esta vez el premio era suyo y pidió que nadie se sorprendiera; agradeció en inglés. Aseguró que no descarta más televisión: simplemente le encanta actuar.", "ja": "第31回アジア・テレビジョン・アワードが11月14日夜、ベトナム・ホーチミン市で発表され、張家輝が「絶命法官」の法官・秦誉役で最優秀主演男優賞を受賞した。張嘉益、白宇、章宇、山崎賢人らを抑えての初受賞となる。同作はイスラエルドラマ「Kvodo」の翻案で、米国・韓国・フランス・スペインなどでもリメイクされている。同氏が連続ドラマに出演するのは2004年「天涯侠医」以来22年ぶり。ノミネート時に「主演男優賞は今回取る。驚かないでほしい」と宣言し、受賞後は英語で謝辞を述べた。今後もドラマを断らないとし、「演技が好きすぎる」と語った。"}, "why": {"zh": "这个奖的看点不在「影帝下凡拍剧」，而在他处理角色的方式：法庭对白一字不能改，人物要从铁面无私一路滑到知法犯法，靠的是把二十集剧本反复做笔记、像备课一样准备。把话说满再原样兑现，在娱乐圈是稀缺品——这比奖杯本身更有说服力。", "en": "The interesting part is not a film star descending to TV but how he worked: court dialogue that cannot be altered word by word, a character sliding from strict judge to lawbreaker, prepared by annotating twenty episodes like a professor prepping a class. Saying it out loud and then delivering is rare in this business — more persuasive than the trophy.", "es": "Lo interesante no es que una estrella de cine baje a la televisión, sino cómo trabajó: diálogos judiciales que no admiten cambios, un personaje que pasa de juez estricto a delincuente, preparado anotando veinte episodios como un profesor prepara clase. Decirlo en voz alta y cumplirlo es raro en este oficio, y más convincente que el trofeo.", "ja": "焦点は「映画スターがドラマへ」ではなく、役への向き合い方にある。法廷の台詞は一字も変えられず、人物は厳格な法官から法を犯す者へと滑り落ちる。20話の台本に何度も書き込み、講義の準備のように役を作った。言い切ってその通りにしてみせるのはこの業界では希少で、トロフィーより説得力がある。"}}, {"idx": "05", "title": {"zh": "《琴弓师》上映：全球近八成琴弓产自苏州一个街道", "en": "The Bowmaker opens: nearly 80% of the world's violin bows come from one Suzhou town", "es": "Se estrena The Bowmaker: casi el 80% de los arcos del mundo sale de un pueblo de Suzhou", "ja": "「琴弓師」公開、世界の弓の8割は蘇州の一つの町から"}, "body": {"zh": "11 月 17 日，电影《琴弓师》内地上映，这是国内首部讲述苏州琴弓匠人的院线片，吴刚特别出演。片子的现实底稿是：全球近八成的提琴琴弓产自苏州相城区渭塘镇，这个以淡水珍珠闻名的江南小镇，同时是全球提琴琴弓的主要产地，一批工匠以家庭作坊的方式制作琴弓，产品出口到欧洲、北美与日本。同日公映的还有纪录式电影《最后的棒棒》，导演何苦用 1300 元启动、两三万元拍完，他表态没有票房压力：「好不好看，让市场来回答。」", "en": "The Bowmaker opened in mainland cinemas on 17 November, the first feature about Suzhou's bow craftsmen, with Wu Gang in a supporting role. Its real-world script: nearly 80% of the world's violin bows come from Weitang, a town in Xiangcheng district, Suzhou — a Jiangnan town known for freshwater pearls that is also the main global source of bows, made in family workshops and exported to Europe, North America and Japan. The Last Pole also opened the same day; director He Ku started with 1,300 yuan and finished on twenty to thirty thousand, saying he feels no box-office pressure: let the market answer whether it is good.", "es": "The Bowmaker se estrenó en cines de China continental el 17 de noviembre, el primer largo sobre los artesanos de arcos de Suzhou, con Wu Gang en un papel secundario. Su guion real: casi el 80% de los arcos de violín del mundo sale de Weitang, un pueblo del distrito de Xiangcheng, Suzhou, conocido por las perlas de agua dulce y también principal fuente global de arcos, fabricados en talleres familiares y exportados a Europa, Norteamérica y Japón. El mismo día se estrenó el documental The Last Pole, que su director He Ku levantó con 1.300 yuanes y terminó con veinte o treinta mil, sin presión por la taquilla.", "ja": "映画「琴弓師」が11月17日に中国本土で公開された。蘇州の弓職人を描く初の劇場映画で、呉剛が特別出演する。現実の下敷きはこうだ。世界のバイオリン弓のおよそ8割は蘇州市相城区渭塘鎮で作られている。淡水真珠で知られる江南の小さな町が、同時に世界の弓の主要産地であり、職人たちが家庭工房で作り、欧州・北米・日本へ輸出している。同日公開の記録映画「最後的棒棒」は、監督の何苦が1300元で立ち上げ、2〜3万元で撮り上げた。「面白いかどうかは市場に聞いてほしい」と語る。"}, "why": {"zh": "一部讲琴弓匠人的电影，和一组「八成产量来自一个镇」的数据放在一起，才构成完整的信息：中国制造里最不容易被替代的部分，往往藏在这种极小众、极讲究手感的品类里。它不会成为票房爆款，但它记录的是产业链上最难复制的一段——人的手感。", "en": "A film about bow makers and the datum that 80% of output comes from one town together make the point: the least replaceable parts of Chinese manufacturing hide in tiny, highly tactile categories. It will not be a blockbuster, but it records the hardest link in the chain to copy — human hands.", "es": "Una película sobre artesanos y el dato de que el 80% de la producción sale de un solo pueblo forman el mensaje: lo menos sustituible de la manufactura china se esconde en categorías minúsculas y muy táctiles. No será un éxito de taquilla, pero registra el eslabón más difícil de copiar: las manos.", "ja": "弓職人の映画と「8割が一つの町から」というデータが並んで初めて伝わるものがある。中国製造業で最も置き換えにくい部分は、こうした極小で手触りの重視される分野に隠れている。大ヒットにはならないだろうが、記録しているのはサプライチェーンで最も複製しにくい部分、人の手である。"}}]}], "risk": {"zh": "风险提示：本简报仅作信息汇总，其中涉及的数据不构成任何投资建议。", "en": "Disclaimer: this briefing is an information summary only; the data cited does not constitute investment advice.", "es": "Aviso: este boletín es solo un resumen informativo; los datos citados no constituyen asesoramiento de inversión.", "ja": "免責事項：本ブリーフィングは情報の要約であり、記載のデータは投資助言を構成するものではありません。"}}/*__END__*/;

        } else {
          var sec = null;
          BRIEFING.sections.forEach(function (s) { if (s.key === key) sec = s; });
          if (!sec) return;
          var b = document.createElement("a");
          b.href = "#" + key; b.setAttribute("data-nav", key);
          b.style.borderColor = sec.color; b.style.color = sec.deep;
          b.textContent = T(sec.name, lang);
          nav.appendChild(b);
        }
      });
    }
    // 日历文案
    var cb = document.getElementById("calBtnText"); if (cb) cb.textContent = i18n.calBtn;
    var cw = document.getElementById("calWeek");
    if (cw) { cw.innerHTML = ""; i18n.calWeek.forEach(function (w) { var s = document.createElement("span"); s.textContent = w; cw.appendChild(s); }); }
    var cf = document.getElementById("calFoot"); if (cf) cf.textContent = i18n.calFoot;
    // 语言切换器（国旗触发 + 下拉）
    var ls = document.getElementById("langSwitch");
    if (ls) {
      ls.className = "lang-switch" + (langOpen ? " open" : "");
      ls.innerHTML = "";
      var trig = document.createElement("button");
      trig.type = "button"; trig.className = "lang-trigger"; trig.id = "langTrigger";
      trig.setAttribute("aria-haspopup", "true");
      trig.setAttribute("aria-expanded", langOpen ? "true" : "false");
      trig.innerHTML = flag(curLang) + '<span class="caret">▾</span>';
      trig.addEventListener("click", function (e) {
        e.stopPropagation();
        langOpen = !langOpen;
        ls.classList.toggle("open", langOpen);
        trig.setAttribute("aria-expanded", langOpen ? "true" : "false");
      });
      ls.appendChild(trig);
      var menu = document.createElement("div");
      menu.className = "lang-menu"; menu.setAttribute("role", "menu");
      LANGS.forEach(function (l) {
        var item = document.createElement("button");
        item.type = "button"; item.className = "lang-item" + (l === curLang ? " sel" : "");
        item.setAttribute("role", "menuitem"); item.setAttribute("data-lang", l);
        item.innerHTML = flag(l) + '<span class="lbl">' + LANG_LABEL_FULL[l] + "</span>";
        item.addEventListener("click", function (e) {
          e.stopPropagation();
          setLang(l);
        });
        menu.appendChild(item);
      });
      ls.appendChild(menu);
    }
  }

  function renderContent(lang) {
    var i18n = I18N[lang];
    var html = "";
    // 精选
    var sp = BRIEFING.spotlight;
    html += '<section class="spotlight" id="pick">'
      + '<div class="badge"><i></i>' + esc(T(sp.badge, lang)) + "</div>"
      + "<h2>" + titleHtml(sp.title, sp.hl, lang) + "</h2>"
      + '<div class="body">' + esc(T(sp.body, lang)) + "</div>"
      + '<div class="why"><b>' + esc(i18n.why) + "</b>" + esc(T(sp.why, lang)) + "</div>"
      + "</section>";
    // 分类
    html += '<div class="grid">';
    BRIEFING.sections.forEach(function (sec) {
      html += '<section class="card" id="' + sec.key + '" style="--ac:' + sec.color + "; --ac-deep:" + sec.deep + ';">'
        + '<div class="sec-head"><span class="sec-num">' + sec.num + "</span>"
        + "<h3>" + esc(T(sec.name, lang)) + "</h3>"
        + '<span class="en">' + sec.key.toUpperCase() + "</span></div>";
      (sec.items || []).forEach(function (it) {
        html += '<div class="item">';
        html += '<div class="t"><span class="idx">' + it.idx + "</span>";
        if (it.tag) html += '<span class="tag">' + esc(it.tag[lang] != null ? it.tag[lang] : i18n.tag) + "</span>";
        html += titleHtml(it.title, it.hl, lang) + "</div>";
        html += '<div class="d">' + esc(T(it.body, lang)) + "</div>";
        html += '<div class="why"><b>' + esc(i18n.why) + "</b>" + esc(T(it.why, lang)) + "</div>";
        html += "</div>";
      });
      html += "</section>";
    });
    html += "</div>";
    var content = document.getElementById("content");
    if (content) content.innerHTML = html;
    // 页脚
    var risk = document.getElementById("risk");
    if (risk) risk.textContent = T(BRIEFING.risk, lang);
  }

  function setLang(lang) {
    if (LANGS.indexOf(lang) < 0) lang = "zh";
    curLang = lang;
    langOpen = false;
    try { localStorage.setItem("timab_lang", lang); } catch (e) {}
    renderChrome(lang);
    renderContent(lang);
  }

  /* ===== 往期日历（保留原逻辑，文案随语言） ===== */
  function initCalendar() {
    var btn = document.getElementById("calBtn");
    var pop = document.getElementById("calPop");
    var grid = document.getElementById("calGrid");
    var title = document.getElementById("calTitle");
    if (!btn || !pop || !grid || !title) return;

    var parts = BRIEFING.date.split("-");
    var todayKey = parts[0].slice(2) + parts[1] + parts[2];
    var cur = { y: +parts[0], m: +parts[1] };
    var has = {};
    for (var i = 0; i < ARCHIVE_DATES.length; i++) { has[ARCHIVE_DATES[i]] = 1; }
    var HIST_BASE = /\/history\//.test(location.pathname) ? "./" : "history/";

    function ckey(y, m, d) { return String(y).slice(2) + pad(m) + pad(d); }

    function render() {
      var i18n = I18N[curLang];
      title.textContent = i18n.calTitle(cur.y, cur.m);
      grid.innerHTML = "";
      var start = new Date(cur.y, cur.m - 1, 1).getDay();
      var days = new Date(cur.y, cur.m, 0).getDate();
      for (var b = 0; b < start; b++) {
        var blank = document.createElement("span");
        blank.className = "cal-cell is-empty"; grid.appendChild(blank);
      }
      for (var d = 1; d <= days; d++) {
        var k = ckey(cur.y, cur.m, d);
        var cell = document.createElement("span");
        cell.className = "cal-cell" + (has[k] ? " has" : "") + (k === todayKey ? " is-today" : "");
        cell.textContent = d;
        if (has[k]) {
          cell.setAttribute("role", "link"); cell.setAttribute("tabindex", "0");
          cell.title = cur.y + "-" + pad(cur.m) + "-" + pad(d) + " 存档";
          (function (target) {
            var go = function () { window.open(HIST_BASE + target + ".html", "_blank", "noopener"); };
            cell.addEventListener("click", go);
            cell.addEventListener("keydown", function (e) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); go(); } });
          })(k);
        }
        grid.appendChild(cell);
      }
    }
    function toggle(open) {
      pop.hidden = !open;
      btn.setAttribute("aria-expanded", open ? "true" : "false");
      if (open) render();
    }
    btn.addEventListener("click", function (e) { e.stopPropagation(); toggle(pop.hidden); });
    document.getElementById("calPrev").addEventListener("click", function () { cur.m--; if (cur.m < 1) { cur.m = 12; cur.y--; } render(); });
    document.getElementById("calNext").addEventListener("click", function () { cur.m++; if (cur.m > 12) { cur.m = 1; cur.y++; } render(); });
    document.addEventListener("click", function (e) { if (!pop.hidden && !pop.contains(e.target)) toggle(false); });
    document.addEventListener("keydown", function (e) { if (e.key === "Escape" && !pop.hidden) toggle(false); });
  }

  /* ===== 启动 ===== */
  function boot() {
    curLang = detectLang();
    renderChrome(curLang);
    renderContent(curLang);
    initCalendar();
    // 关闭语言下拉：点击外部 / Esc
    document.addEventListener("click", function (e) {
      var ls = document.getElementById("langSwitch");
      if (ls && langOpen && !ls.contains(e.target)) {
        langOpen = false;
        ls.classList.remove("open");
        var t = document.getElementById("langTrigger");
        if (t) t.setAttribute("aria-expanded", "false");
      }
    });
    document.addEventListener("keydown", function (e) {
      if (e.key === "Escape" && langOpen) {
        langOpen = false;
        var ls = document.getElementById("langSwitch");
        if (ls) ls.classList.remove("open");
        var t = document.getElementById("langTrigger");
        if (t) t.setAttribute("aria-expanded", "false");
      }
    });
  }
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", boot);
  } else { boot(); }
})();
</script>
</body>
</html>
