程已经足够便利；登记量继续下行，指向的是婚育成本与人口结构这些流程之外的因素。政策能改的是手续，改不了的是预期。", "en": "Cross-region registration removed the question of where to marry, which means the paperwork is no longer the obstacle. The continued decline points to costs and demographics outside the process. Policy can change procedures; it cannot change expectations.", "es": "El registro sin límites territoriales eliminó la pregunta de dónde casarse, así que el trámite ya no es el obstáculo. La caída sostenida apunta a costos y demografía ajenos al procedimiento. La política puede cambiar trámites; no cambia expectativas.", "ja": "全国どこでも届け出られる制度は「どこで結婚するか」という障害を取り除いた。手続きはもう壁ではない。減少が続くのは、手続きの外にある婚育コストと人口構造の問題だ。政策が変えられるのは手続きで、期待値ではない。"}}, {"idx": "05", "title": {"zh": "董宇辉自有品牌「禾与春时」一天涨粉超 60 万", "en": "Dong Yuhui's Own Brand Gains 600,000 Followers in a Day", "es": "La marca propia de Dong Yuhui gana más de 600.000 seguidores en un día", "ja": "董宇輝の自主ブランド、1日で60万フォロワー増"}, "body": {"zh": "11 月 5 日，董宇辉官宣的自有品牌「禾与春时」抖音账号粉丝量突破 63 万，一天涨粉超 60 万；店铺预告首款千层蛋糕于 5 日 20 时首发上线。", "en": "On 5 November the Douyin account of Dong Yuhui's own brand, He Yu Chun Shi, passed 630,000 followers, gaining more than 600,000 in a single day. The shop announced its first product, a layer cake, would launch at 20:00 that evening.", "es": "El 5 de noviembre la cuenta en Douyin de la marca propia de Dong Yuhui, He Yu Chun Shi, superó los 630.000 seguidores, con más de 600.000 en un solo día. La tienda anunció el lanzamiento de su primer producto, una tarta de capas, a las 20:00 de esa jornada.", "ja": "11月5日、董宇輝が立ち上げた自主ブランド「禾与春时」のDouyinアカウントはフォロワー63万人を突破し、1日で60万人以上増えた。店舗は第1弾商品のミルクレープを同日20時に発売すると予告した。"}, "why": {"zh": "从「带货主播」到「品牌主理人」，变的是分成结构——过去赚佣金，现在赚品牌溢价和复购。真正的考题在首发之后：一款蛋糕能不能撑住 60 万粉丝的期待，退货率和复购率会给出答案。", "en": "Moving from livestream seller to brand owner changes the revenue model: commissions give way to brand premium and repeat purchase. The real test comes after launch — whether one cake can carry 600,000 followers' expectations, and the return and repurchase rates will answer.", "es": "Pasar de vendedor en directo a dueño de marca cambia el modelo de ingresos: las comisiones dejan paso al margen de marca y a la recompra. La prueba real llega tras el lanzamiento: si una tarta sostiene la expectativa de 600.000 seguidores lo dirán las tasas de devolución y recompra.", "ja": "ライブコマースの売り手からブランドの主宰者へ移ると、収益構造が変わる。手数料からブランドの上乗せとリピートへ。本当の試練は発売後だ。1つのケーキが60万人の期待に応えられるかは、返品率とリピート率が答える。"}}]}, {"key": "ent", "num": "06", "color": "#db2777", "deep": "#be185d", "name": {"zh": "娱乐八卦", "en": "CULTURE", "es": "CULTURA", "ja": "エンタメ"}, "items": [{"idx": "01", "title": {"zh": "第 39 届金鸡奖今晚厦门开幕：209 部报名，46 部获提名", "en": "39th Golden Rooster Awards Open in Xiamen: 209 Entries, 46 Nominations", "es": "La 39.ª edición de los Golden Rooster abre en Xiamen: 209 películas inscritas y 46 nominadas", "ja": "第39回金鶏賞が厦門で開幕――209本応募、46本がノミネート"}, "body": {"zh": "第 39 届中国电影金鸡奖 11 月 6 日 19 时 30 分在厦门闽南大戏院开幕，陈都灵以厦门推介人身份亮相，吴磊参演开幕短片《完美婚礼》，檀健次凭《震耳欲聋》提名最佳男主角。本届共收到 209 部报名影片，46 部获提名，设 20 个常规奖项和 1 个荣誉奖项；「最佳导演处女作」更名为「最佳新晋导演」，「最佳美术片」更名为「最佳动画片」。《南京照相馆》《镖人：风起大漠》各获 7 项提名领跑，《给阿嬷的情书》以 6 项紧随。提名者表彰 11 月 9 日举行，颁奖典礼暨闭幕式 11 月 10 日。", "en": "The 39th Golden Rooster Awards open at 19:30 on 6 November at the Minnan Grand Theatre in Xiamen, with Chen Duling appearing as the city's promoter, Wu Lei in the opening short film Perfect Wedding and Tan Jianci nominated for best actor for Deafening. A total of 209 films were entered and 46 nominated across 20 regular awards and one honorary prize; best debut director has been renamed best new director, and best art film has become best animated film. Nanjing Photo Studio and Blade of the Wind each lead with seven nominations, followed by A Letter to Grandma with six. The nominees' ceremony is on 9 November and the awards gala on 10 November.", "es": "La 39.ª edición de los Golden Rooster se inaugura el 6 de noviembre a las 19:30 en el Gran Teatro Minnan de Xiamen, con Chen Duling como embajadora de la ciudad, Wu Lei en el corto inaugural Perfect Wedding y Tan Jianci nominado a mejor actor por Deafening. Se inscribieron 209 películas y 46 fueron nominadas en 20 premios regulares y uno honorífico; mejor ópera prima pasa a llamarse mejor director novel y mejor película artística, mejor película de animación. Nanjing Photo Studio y Blade of the Wind lideran con siete nominaciones, seguidas de A Letter to Grandma con seis. La gala de nominados es el 9 de noviembre y la entrega el 10.", "ja": "第39回中国映画金鶏賞は11月6日19時30分、厦門の閩南大戯院で開幕する。陳都霊が厦門の広報大使として登場し、呉磊が開幕短編映画『完美婚礼』に出演、檀健次が『震耳欲聾』で最優秀主演男優賞にノミネートされた。応募は209本、ノミネートは46本で、通常賞20部門と栄誉賞1部門。最優秀新人監督賞は「監督デビュー作」から改称され、最優秀美術映画賞は最優秀アニメーション映画賞となった。『南京照相館』と『镖人：風起大漠』が各7部門で首位、『給阿嬤的情書』が6部門で続く。ノミネート者表彰は11月9日、授賞式は11月10日。"}, "why": {"zh": "两个奖项改名比提名名单更值得看：「新晋导演」不再限定处女作，等于承认第二部、第三部才算真正的考场；「动画片」去掉「美术」二字，是把动画从「美术门类」拉回「电影门类」。", "en": "Two renamings matter more than the nomination list: best new director no longer requires a debut, in effect admitting that the second and third films are the real test; and dropping the words art film from the animation prize pulls animation back from a craft category into cinema proper.", "es": "Dos cambios de nombre importan más que la lista: mejor director novel ya no exige una ópera prima, lo que admite que la segunda y la tercera película son la verdadera prueba; y quitar la palabra artística al premio de animación devuelve la animación de la categoría de oficio al cine.", "ja": "ノミネート一覧より二つの改名が重要だ。「新人監督賞」はデビュー作に限らなくなり、2作目・3作目こそが本当の審査だという現実を認めたことになる。アニメ賞から「美術」を外したことは、アニメを工芸の分類から映画の分類へ戻す動きだ。"}}, {"idx": "02", "title": {"zh": "金鸡影展今日开票展映：84 部中外影片，29 场主创见面会", "en": "Golden Rooster Film Week Screens 84 Films with 29 Q&A Sessions", "es": "La muestra del Golden Rooster proyecta 84 películas con 29 encuentros con los equipos", "ja": "金鶏映画週間が開幕――中外84本、舞台挨拶29回"}, "body": {"zh": "2026 年金鸡影展 11 月 6 日至 29 日在厦门六区 20 余家影院放映 84 部中外影片，期间举办 29 场主创见面会。国产电影展展映 15 部新片，开幕影片《明天，会更好》国内首映，闭幕影片《无名女孩》曾入围戛纳电影节影评人周；华语影展整合 44 部，国际影片 40 部、涵盖 34 个国家。「功夫·功夫」经典单元致敬华语动作片，动画「流光」单元跨度超 80 年，从 1941 年的《铁扇公主》到新片《浓情卡门》。", "en": "The 2026 Golden Rooster Film Week runs from 6 to 29 November across more than 20 cinemas in six Xiamen districts, screening 84 Chinese and foreign films with 29 Q&A sessions. The domestic showcase features 15 new titles, opening with the mainland premiere of Tomorrow Will Be Better and closing with The Nameless Girl, which screened in Cannes Critics' Week. The Chinese-language section has 44 films and the international section 40 from 34 countries. A classic programme titled Kung Fu, Kung Fu pays tribute to Chinese action cinema, while the animation strand spans more than 80 years, from Princess Iron Fan in 1941 to the new Carmen.", "es": "La Muestra del Golden Rooster 2026 se celebra del 6 al 29 de noviembre en más de 20 cines de seis distritos de Xiamen, con 84 películas chinas y extranjeras y 29 encuentros con los equipos. La sección nacional presenta 15 estrenos, abre con la premiere china de Tomorrow Will Be Better y cierra con The Nameless Girl, proyectada en la Semana de la Crítica de Cannes. La sección en chino reúne 44 películas y la internacional 40 de 34 países. El ciclo clásico Kung Fu, Kung Fu homenajea el cine de acción chino, y el de animación abarca más de 80 años, desde Princess Iron Fan (1941) hasta la nueva Carmen.", "ja": "2026年金鶏映画週間は11月6日から29日まで、厦門市6区の20以上の映画館で中外84本を上映し、舞台挨拶を29回行う。中国映画展では新作15本を上映し、開幕作は『明天，会更好』の中国プレミア、閉幕作はカンヌ批評家週間に出品された『無名女孩』。華語映画は44本、国際映画は34か国から40本。「功夫・功夫」クラシック部門は中国アクション映画に敬意を表し、アニメ「流光」部門は1941年の『鉄扇公主』から新作『濃情卡門』まで80年以上の幅を持つ。"}, "why": {"zh": "84 部里最值得抢的往往不是新片，而是「功夫·功夫」这类修复展——它把「我们曾经怎么拍动作片」变成可对照的文本。开票一小时总票房近百万、《银翼杀手》《盗梦空间》迅速售罄，说明影展正在从「业内场」变成「城市消费」。", "en": "Among 84 titles, the hottest tickets are often not new films but retrospectives like Kung Fu, Kung Fu, which turn how we once shot action into a text you can compare against. Nearly a million yuan in sales in the first hour and quick sell-outs for Blade Runner and Inception show the festival is turning from an industry event into city consumption.", "es": "Entre 84 títulos, las entradas más buscadas no suelen ser los estrenos sino retrospectivas como Kung Fu, Kung Fu, que convierten el modo en que se rodaba la acción en un texto comparable. Casi un millón de yuanes en la primera hora y el rápido agotamiento de Blade Runner e Inception muestran que el festival pasa de evento sectorial a consumo urbano.", "ja": "84本のなかで最も争奪戦になるのは新作よりも「功夫・功夫」のような特集上映だ。かつてアクションをどう撮ったかが比較できるテクストになる。発売1時間で興行収入が約100万元、『ブレードランナー』『インセプション』が即完売したことは、映画祭が業界の場から都市の消費へ移っていることを示す。"}}, {"idx": "03", "title": {"zh": "《后会友期》新一期「文盲吵架」登顶热搜，芒果 TV 被挤崩", "en": "A Viral Argument Tops Weibo and Crashes Mango TV's Servers", "es": "Una discusión viral lidera Weibo y tumba los servidores de Mango TV", "ja": "『后会友期』の口論が検索1位、Mango TVがダウン"}, "body": {"zh": "11 月 5 日 12 时，芒果 TV《后会友期》更新，电竞搭档白小纯与青稚在「悬崖小屋」环节正面对线，半小时内相关话题登顶微博热搜，被网友称为「文盲吵架」——白小纯把「包容」说成「包庇」、又造出「话外题」，青稚把「归咎」说成「归功」。调解员张泉灵称「我很少插不上话，这里是真插不上」。大批观众同时涌入，芒果 TV 出现页面打不开、会员账号无法登录，客服显示话务高峰，平台随后表示已恢复。", "en": "At noon on 5 November Mango TV released a new episode of its friendship reality show, in which esports partners Bai Xiaochun and Qingzhi clashed head-on during a cliffside cabin segment. The topic topped Weibo within half an hour, with viewers dubbing it the illiterate quarrel: Bai mixed up two similar Chinese words for tolerance and cover-up and invented a phrase, while Qingzhi confused blame with credit. Mediator Zhang Quanling said she rarely fails to get a word in, but here she truly could not. So many viewers arrived at once that Mango TV's pages failed to load and members could not log in; the platform said service had been restored.", "es": "El 5 de noviembre al mediodía Mango TV estrenó un nuevo episodio de su reality de amistad, en el que los compañeros de esports Bai Xiaochun y Qingzhi se enfrentaron en una sección en una cabaña junto al acantilado. El tema lideró Weibo en media hora y los usuarios lo llamaron «la discusión de los iletrados»: Bai confundió dos palabras chinas parecidas y se inventó un término, y Qingzhi confundió culpar con atribuir. La mediadora Zhang Quanling dijo que casi nunca se queda sin poder intervenir, pero aquí sí. La avalancha de espectadores hizo que las páginas de Mango TV no cargaran y los socios no pudieran iniciar sesión; la plataforma informó de que el servicio se restableció.", "ja": "11月5日正午、Mango TVの『后会友期』新エピソードが配信され、eスポーツの元パートナー白小純と青稚が「崖の小屋」の場面で正面衝突。関連話題は30分で微博の検索1位となり、ネット上では「無教養な口論」と呼ばれた。白小純は「包容」を「包庇」と言い間違えて造語まで作り、青稚は「帰咎」を「帰功」と言い違えた。調停役の張泉玲は「ここでは本当に口を挟めない」と語った。視聴者が一斉に押し寄せ、Mango TVはページが開かず会員ログインもできない状態となり、運営は復旧したと発表した。"}, "why": {"zh": "这档节目真正的内容不是「吵架」，而是它证明了慢综艺在短视频时代仍有传播力——一句「我画地为牢啊，厉娜」能衍生出全民造句，靠的是可被切片复用的情绪，而不是剧本。", "en": "The real content here is not the argument but the proof that slow variety still travels in the short-video era: one line about drawing a prison around oneself spawned a nationwide word game because the emotion can be clipped and reused, not because of a script.", "es": "El contenido real no es la discusión, sino la prueba de que el formato pausado aún circula en la era del vídeo corto: una frase sobre encerrarse uno mismo generó un juego de palabras nacional porque la emoción se puede cortar y reutilizar, no por el guion.", "ja": "本当の中身は口論ではなく、スローバラエティがショート動画の時代でも伝わるという証明だ。「自分で囲いを作っている」という一言が全国的な言葉遊びを生んだのは、切り取って再利用できる感情があったからで、脚本の力ではない。"}}, {"idx": "04", "tag": {"zh": "进展"}, "title": {"zh": "《谷雨》开播：首部年代涉税罪案剧，井柏然演稽查干部", "en": "Tax-Crime Drama Guyu Debuts with Jing Boran as an Inspector", "es": "Se estrena Guyu, el primer drama de época sobre delitos fiscales, con Jing Boran de inspector", "ja": "『谷雨』が放送開始――年代物の脱税犯罪劇、井柏然が調査官役"}, "body": {"zh": "11 月 5 日，电视剧《谷雨》登陆 CCTV-8 黄金档与优酷。该剧被称为首部年代涉税罪案剧，井柏然饰税务稽查干部，张颂文饰误入歧途的印刷技工，孙艺洲饰刑警。", "en": "On 5 November the drama Guyu premiered on CCTV-8's prime-time slot and on Youku. Billed as the first period drama about tax crimes, it stars Jing Boran as a tax inspector, Zhang Songwen as a printing technician who goes astray and Sun Yizhou as a detective.", "es": "El 5 de noviembre el drama Guyu se estrenó en el horario estelar de CCTV-8 y en Youku. Presentado como el primer drama de época sobre delitos fiscales, cuenta con Jing Boran como inspector de Hacienda, Zhang Songwen como un técnico de imprenta que se descarría y Sun Yizhou como detective.", "ja": "11月5日、ドラマ『谷雨』がCCTV-8のゴールデンタイムと優酷で始まった。年代物の脱税犯罪劇としては初とされ、井柏然が税務調査官、張頌文が道を誤る印刷工、孫芸洲が刑事を演じる。"}, "why": {"zh": "涉税题材过去多在当代背景里拍，放进年代戏意味着要把「税」还原成当时的生产关系——发票、账本、私营经济的灰色地带。能不能拍出制度的质感，比案件本身更考验编剧。", "en": "Tax stories have usually been set in the present; moving them into a period setting means restoring tax to the production relations of the time: invoices, ledgers and the grey zones of private business. Whether the show can give the system a texture is a bigger test for its writers than the case itself.", "es": "Las tramas fiscales suelen situarse en el presente; llevarlas a una época anterior obliga a devolver el impuesto a las relaciones productivas de entonces: facturas, libros contables y las zonas grises de la iniciativa privada. Dar textura al sistema exige más del guion que el caso en sí.", "ja": "脱税ものを現在の舞台で描くことは多いが、時代物に移すと「税」を当時の生産関係に戻す必要が出てくる。請求書、帳簿、民間経済の灰色地带。制度の質感を描けるかどうかは、事件そのもの以上に脚本の力を試す。"}}, {"idx": "05", "tag": {"zh": "进展"}, "title": {"zh": "《折月亮》开播：卢昱晓、林一主演，刘宇宁唱片头曲", "en": "She Went Down to the Moon Debuts with Lu Yuxiao and Lin Yi", "es": "Se estrena She Went Down to the Moon con Lu Yuxiao y Lin Yi", "ja": "『折月亮』が放送開始――盧昱暁と林一が主演"}, "body": {"zh": "11 月 5 日，剧集《折月亮》在爱奇艺与江苏卫视开播，卢昱晓、林一领衔主演，刘宇宁演唱的主题曲已于 11 月 2 日上线。该剧改编自同名小说。", "en": "On 5 November the series She Went Down to the Moon began airing on iQIYI and Jiangsu Satellite TV, starring Lu Yuxiao and Lin Yi. Its theme song, performed by Liu Yuning, was released on 2 November. The drama adapts a novel of the same name.", "es": "El 5 de noviembre la serie She Went Down to the Moon empezó a emitirse en iQIYI y en la televisión satelital de Jiangsu, protagonizada por Lu Yuxiao y Lin Yi. La canción principal, interpretada por Liu Yuning, se estrenó el 2 de noviembre. La serie adapta una novela homónima.", "ja": "11月5日、ドラマ『折月亮』がiQIYIと江蘇衛星テレビで始まった。盧昱暁と林一が主演し、劉宇寧が歌う主題歌は11月2日に配信された。同名小説のドラマ化作品。"}, "why": {"zh": "双平台联播加上主题曲先行，是当下都市剧的标准打法：先用音乐和短视频切片把情绪铺满，再用首播口碑决定能不能破圈。真正的分水岭在第三天。", "en": "A dual-platform launch with the theme song released first is now the standard playbook for urban dramas: flood the feed with music and short clips, then let opening-night word of mouth decide whether it breaks out. The real fork comes on day three.", "es": "Un estreno en dos plataformas con la canción principal lanzada antes es el manual habitual del drama urbano: inundar el feed con música y clips y dejar que el boca a boca del estreno decida si rompe el círculo. La verdadera bifurcación llega al tercer día.", "ja": "2プラットフォーム同時配信に主題歌の先行リリースというのは、いまの都市ドラマの定石だ。音楽とショート動画で感情を先に満たし、初回の評判で「界隈を超えるか」が決まる。本当の分岐点は3日目にある。"}}]}], "risk": {"zh": "风险提示：本简报仅作信息汇总，其中涉及的数据不构成任何投资建议。", "en": "Risk notice: this briefing is a summary of information only; the data it contains does not constitute investment advice.", "es": "Aviso de riesgo: este boletín es solo un resumen informativo; los datos que contiene no constituyen asesoramiento de inversión.", "ja": "リスク提示：本ブリーフィングは情報の要約であり、記載のデータは投資助言を構成するものではありません。"}}/*__END__*/;

      "calWeek": ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"],
      "calTitle": function (y, m) { return ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][m-1] + " " + y; }
    },
    "es": {
      "dateSub": "BOLETÍN DIARIO", "calBtn": "Archivo", "calFoot": "Los puntos marcan fechas con ejemplar guardado",
      "tag": "ACTUALIZACIÓN", "why": "Por qué: ", "badge": "DESTACADO",
      "calWeek": ["Dom", "Lun", "Mar", "Mié", "Jue", "Vie", "Sáb"],
      "calTitle": function (y, m) { return m + " · " + y; }
    },
    "ja": {
      "dateSub": "デイリーブリーフィング", "calBtn": "バックナンバー", "calFoot": "点のついた日付は保存された号があります",
      "tag": "続報", "why": "見どころ：", "badge": "特集",
      "calWeek": ["日", "月", "火", "水", "木", "金", "土"],
      "calTitle": function (y, m) { return y + "年" + m + "月"; }
    }
  };
  var LANGS = ["zh", "en", "es", "ja"];
  var LANG_LABEL = { "zh": "中文", "en": "EN", "es": "ES", "ja": "日本語" };
  var LANG_LABEL_FULL = { "zh": "中文", "en": "English", "es": "Español", "ja": "日本語" };
  var LANG_HTML = { "zh": "zh-CN", "en": "en", "es": "es", "ja": "ja" };

  // 小国旗（内联 SVG，避免外部图标依赖与 emoji 平台差异）
  function flag(lang) {
    if (lang === "zh") return '<svg class="fl" viewBox="0 0 30 20" aria-hidden="true"><rect width="30" height="20" fill="#de2910"/><g fill="#ffde00"><circle cx="5" cy="4" r="2.2"/><circle cx="9" cy="2.4" r="0.8"/><circle cx="10" cy="4" r="0.8"/><circle cx="9" cy="5.6" r="0.8"/><circle cx="7" cy="6.6" r="0.8"/></g></svg>';
    if (lang === "en") return '<svg class="fl" viewBox="0 0 30 20" aria-hidden="true"><rect width="30" height="20" fill="#012169"/><path d="M0 0L30 20M30 0L0 20" stroke="#fff" stroke-width="4"/><path d="M0 0L30 20M30 0L0 20" stroke="#c8102e" stroke-width="2"/><rect x="13" width="4" height="20" fill="#fff"/><rect y="8" width="30" height="4" fill="#fff"/><rect x="14" width="2" height="20" fill="#c8102e"/><rect y="9" width="30" height="2" fill="#c8102e"/></svg>';
    if (lang === "es") return '<svg class="fl" viewBox="0 0 30 20" aria-hidden="true"><rect width="30" height="20" fill="#aa151b"/><rect y="5" width="30" height="10" fill="#f1bf00"/></svg>';
    return '<svg class="fl" viewBox="0 0 30 20" aria-hidden="true"><rect width="30" height="20" fill="#fff"/><circle cx="15" cy="10" r="5.5" fill="#bc002d"/></svg>';
  }

  /* ===== 工具 ===== */
  function T(obj, lang) {
    if (obj == null) return "";
    if (typeof obj === "string") return obj;
    if (obj[lang] != null) return obj[lang];
    return obj.zh != null ? obj.zh : "";
  }
  function pad(n) { return n < 10 ? "0" + n : "" + n; }
  function bing(q) { return "https://www.bing.com/search?q=" + encodeURIComponent(q); }
  function fmtDate(d, lang) {
    var y = d.getFullYear(), m = d.getMonth() + 1, day = d.getDate();
    if (lang === "zh") return y + "." + pad(m) + "." + pad(day);
    if (lang === "ja") return y + "年" + m + "月" + day + "日";
    if (lang === "es") return day + " " + ["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"][m-1] + " " + y;
    return ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][m-1] + " " + day + ", " + y;
  }
  function esc(s) {
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }
  function titleHtml(titleObj, hlObj, lang) {
    var title = T(titleObj, lang);
    var hl = T(hlObj, lang);
    var inner = esc(title);
    if (hl && title.indexOf(hl) >= 0) {
      var i = title.indexOf(hl);
      inner = esc(title.slice(0, i)) + '<span class="hl">' + esc(hl) + "</span>" + esc(title.slice(i + hl.length));
    }
    return '<a class="lk" href="' + bing(title) + '" target="_blank" rel="noopener">' + inner + "</a>";
  }

  /* ===== 语言检测：localStorage > 浏览器语言 > 系统时区 > 中文 ===== */
  function detectLang() {
    try { var s = localStorage.getItem("timab_lang"); if (s && LANGS.indexOf(s) >= 0) return s; } catch (e) {}
    var nav = (navigator.language || "").toLowerCase();
    if (/^zh/.test(nav)) return "zh";
    if (/^ja/.test(nav)) return "ja";
    if (/^es/.test(nav)) return "es";
    if (/^en/.test(nav)) return "en";
    var tz = "";
    try { tz = Intl.DateTimeFormat().resolvedOptions().timeZone || ""; } catch (e) {}
    if (/^Asia\/Tokyo/.test(tz)) return "ja";
    if (/Europe\/Madrid|America\/(Mexico_City|Bogota|Lima|Santiago|Caracas|Guatemala|La_Paz|San_Jose|Panama|Asuncion|Montevideo|Havana|El_Salvador|Managua|Tegucigalpa|Costa_Rica|San_Salvador)|America\/Argentina\//.test(tz)) return "es";
    if (/^(Europe|America|Australia)\//.test(tz)) return "en";
    return "zh";
  }

  var curLang = "zh";
  var langOpen = false;

  /* ===== 渲染 ===== */
  function renderChrome(lang) {
    var i18n = I18N[lang];
    document.documentElement.lang = LANG_HTML[lang];
    // 报头信息行
    var metaEl = document.getElementById("metaRow");
    if (metaEl) metaEl.textContent = T(BRIEFING.meta, lang);
    // 大日期
    var md = document.getElementById("mastDate");
    if (md) {
      var d = new Date(BRIEFING.date + "T00:00:00");
      md.innerHTML = fmtDate(d, lang) + "<small>" + esc(i18n.dateSub) + "</small>";
    }
    // 文档标题
    var siteName = (lang === "zh") ? "提马早报" : "TIMAB DAILY";
    document.title = siteName + " · " + fmtDate(new Date(BRIEFING.date + "T00:00:00"), lang);
    // 导航签
    var nav = document.getElementById("navChips");
    if (nav) {
      var order = ["pick"].concat(BRIEFING.sections.map(function (s) { return s.key; }));
      nav.innerHTML = "";
      order.forEach(function (key) {
        if (key === "pick") {
          var a = document.createElement("a");
          a.className = "chip-pick"; a.href = "#pick"; a.setAttribute("data-nav", "pick");
          a.textContent = T(BRIEFING.spotlight.badge, lang);
          nav.appendChild(a);
        } else {
          var sec = null;
          BRIEFING.sections.forEach(function (s) { if (s.key === key) sec = s; });
          if (!sec) return;
          var b = document.createElement("a");
          b.href = "#" + key; b.setAttribute("data-nav", key);
          b.style.borderColor = sec.color; b.style.color = sec.deep;
          b.textContent = T(sec.name, lang);
          nav.appendChild(b);
        }
      });
    }
    // 日历文案
    var cb = document.getElementById("calBtnText"); if (cb) cb.textContent = i18n.calBtn;
    var cw = document.getElementById("calWeek");
    if (cw) { cw.innerHTML = ""; i18n.calWeek.forEach(function (w) { var s = document.createElement("span"); s.textContent = w; cw.appendChild(s); }); }
    var cf = document.getElementById("calFoot"); if (cf) cf.textContent = i18n.calFoot;
    // 语言切换器（国旗触发 + 下拉）
    var ls = document.getElementById("langSwitch");
    if (ls) {
      ls.className = "lang-switch" + (langOpen ? " open" : "");
      ls.innerHTML = "";
      var trig = document.createElement("button");
      trig.type = "button"; trig.className = "lang-trigger"; trig.id = "langTrigger";
      trig.setAttribute("aria-haspopup", "true");
      trig.setAttribute("aria-expanded", langOpen ? "true" : "false");
      trig.innerHTML = flag(curLang) + '<span class="caret">▾</span>';
      trig.addEventListener("click", function (e) {
        e.stopPropagation();
        langOpen = !langOpen;
        ls.classList.toggle("open", langOpen);
        trig.setAttribute("aria-expanded", langOpen ? "true" : "false");
      });
      ls.appendChild(trig);
      var menu = document.createElement("div");
      menu.className = "lang-menu"; menu.setAttribute("role", "menu");
      LANGS.forEach(function (l) {
        var item = document.createElement("button");
        item.type = "button"; item.className = "lang-item" + (l === curLang ? " sel" : "");
        item.setAttribute("role", "menuitem"); item.setAttribute("data-lang", l);
        item.innerHTML = flag(l) + '<span class="lbl">' + LANG_LABEL_FULL[l] + "</span>";
        item.addEventListener("click", function (e) {
          e.stopPropagation();
          setLang(l);
        });
        menu.appendChild(item);
      });
      ls.appendChild(menu);
    }
  }

  function renderContent(lang) {
    var i18n = I18N[lang];
    var html = "";
    // 精选
    var sp = BRIEFING.spotlight;
    html += '<section class="spotlight" id="pick">'
      + '<div class="badge"><i></i>' + esc(T(sp.badge, lang)) + "</div>"
      + "<h2>" + titleHtml(sp.title, sp.hl, lang) + "</h2>"
      + '<div class="body">' + esc(T(sp.body, lang)) + "</div>"
      + '<div class="why"><b>' + esc(i18n.why) + "</b>" + esc(T(sp.why, lang)) + "</div>"
      + "</section>";
    // 分类
    html += '<div class="grid">';
    BRIEFING.sections.forEach(function (sec) {
      html += '<section class="card" id="' + sec.key + '" style="--ac:' + sec.color + "; --ac-deep:" + sec.deep + ';">'
        + '<div class="sec-head"><span class="sec-num">' + sec.num + "</span>"
        + "<h3>" + esc(T(sec.name, lang)) + "</h3>"
        + '<span class="en">' + sec.key.toUpperCase() + "</span></div>";
      (sec.items || []).forEach(function (it) {
        html += '<div class="item">';
        html += '<div class="t"><span class="idx">' + it.idx + "</span>";
        if (it.tag) html += '<span class="tag">' + esc(it.tag[lang] != null ? it.tag[lang] : i18n.tag) + "</span>";
        html += titleHtml(it.title, it.hl, lang) + "</div>";
        html += '<div class="d">' + esc(T(it.body, lang)) + "</div>";
        html += '<div class="why"><b>' + esc(i18n.why) + "</b>" + esc(T(it.why, lang)) + "</div>";
        html += "</div>";
      });
      html += "</section>";
    });
    html += "</div>";
    var content = document.getElementById("content");
    if (content) content.innerHTML = html;
    // 页脚
    var risk = document.getElementById("risk");
    if (risk) risk.textContent = T(BRIEFING.risk, lang);
  }

  function setLang(lang) {
    if (LANGS.indexOf(lang) < 0) lang = "zh";
    curLang = lang;
    langOpen = false;
    try { localStorage.setItem("timab_lang", lang); } catch (e) {}
    renderChrome(lang);
    renderContent(lang);
  }

  /* ===== 往期日历（保留原逻辑，文案随语言） ===== */
  function initCalendar() {
    var btn = document.getElementById("calBtn");
    var pop = document.getElementById("calPop");
    var grid = document.getElementById("calGrid");
    var title = document.getElementById("calTitle");
    if (!btn || !pop || !grid || !title) return;

    var parts = BRIEFING.date.split("-");
    var todayKey = parts[0].slice(2) + parts[1] + parts[2];
    var cur = { y: +parts[0], m: +parts[1] };
    var has = {};
    for (var i = 0; i < ARCHIVE_DATES.length; i++) { has[ARCHIVE_DATES[i]] = 1; }
    var HIST_BASE = /\/history\//.test(location.pathname) ? "./" : "history/";

    function ckey(y, m, d) { return String(y).slice(2) + pad(m) + pad(d); }

    function render() {
      var i18n = I18N[curLang];
      title.textContent = i18n.calTitle(cur.y, cur.m);
      grid.innerHTML = "";
      var start = new Date(cur.y, cur.m - 1, 1).getDay();
      var days = new Date(cur.y, cur.m, 0).getDate();
      for (var b = 0; b < start; b++) {
        var blank = document.createElement("span");
        blank.className = "cal-cell is-empty"; grid.appendChild(blank);
      }
      for (var d = 1; d <= days; d++) {
        var k = ckey(cur.y, cur.m, d);
        var cell = document.createElement("span");
        cell.className = "cal-cell" + (has[k] ? " has" : "") + (k === todayKey ? " is-today" : "");
        cell.textContent = d;
        if (has[k]) {
          cell.setAttribute("role", "link"); cell.setAttribute("tabindex", "0");
          cell.title = cur.y + "-" + pad(cur.m) + "-" + pad(d) + " 存档";
          (function (target) {
            var go = function () { window.open(HIST_BASE + target + ".html", "_blank", "noopener"); };
            cell.addEventListener("click", go);
            cell.addEventListener("keydown", function (e) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); go(); } });
          })(k);
        }
        grid.appendChild(cell);
      }
    }
    function toggle(open) {
      pop.hidden = !open;
      btn.setAttribute("aria-expanded", open ? "true" : "false");
      if (open) render();
    }
    btn.addEventListener("click", function (e) { e.stopPropagation(); toggle(pop.hidden); });
    document.getElementById("calPrev").addEventListener("click", function () { cur.m--; if (cur.m < 1) { cur.m = 12; cur.y--; } render(); });
    document.getElementById("calNext").addEventListener("click", function () { cur.m++; if (cur.m > 12) { cur.m = 1; cur.y++; } render(); });
    document.addEventListener("click", function (e) { if (!pop.hidden && !pop.contains(e.target)) toggle(false); });
    document.addEventListener("keydown", function (e) { if (e.key === "Escape" && !pop.hidden) toggle(false); });
  }

  /* ===== 启动 ===== */
  function boot() {
    curLang = detectLang();
    renderChrome(curLang);
    renderContent(curLang);
    initCalendar();
    // 关闭语言下拉：点击外部 / Esc
    document.addEventListener("click", function (e) {
      var ls = document.getElementById("langSwitch");
      if (ls && langOpen && !ls.contains(e.target)) {
        langOpen = false;
        ls.classList.remove("open");
        var t = document.getElementById("langTrigger");
        if (t) t.setAttribute("aria-expanded", "false");
      }
    });
    document.addEventListener("keydown", function (e) {
      if (e.key === "Escape" && langOpen) {
        langOpen = false;
        var ls = document.getElementById("langSwitch");
        if (ls) ls.classList.remove("open");
        var t = document.getElementById("langTrigger");
        if (t) t.setAttribute("aria-expanded", "false");
      }
    });
  }
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", boot);
  } else { boot(); }
})();
</script>
</body>
</html>
