ar-end weeks are not a wrap-up but the only chance all year.", "es": "Que una jugadora número 102 gane su primer título al final de la temporada demuestra que el circuito es más profundo de lo que sugieren los rankings. Para muchas, estas semanas de cierre no son un epílogo, sino la única oportunidad del año.", "ja": "世界 102 位の選手がシーズン終盤に初優勝したことは、ツアーの層がランキング以上に厚いことを示す。多くの選手にとって年末の数週間は締めくくりではなく、一年で唯一の機会だ。"}}]}, {"key": "hot", "num": "05", "color": "#6d28d9", "deep": "#55209f", "name": {"zh": "网络热点", "en": "TRENDING", "es": "TENDENCIAS", "ja": "ネット話題"}, "items": [{"idx": "01", "title": {"zh": "「顺其自然」第 28 年再捐 111 万，累计 1907 万，仍无人知其姓名", "en": "«Let It Be» Donor Gives Again: 28 Years, 19.07 Million Yuan, Still Nameless", "es": "El donante «Que sea natural» da otra vez: 28 años y 19,07 millones sin nombre", "ja": "「順其自然」28 年目の寄付 111 万元、累計 1907 万元で今も匿名"}, "body": {"zh": "11 月 9 日上午，浙江宁波市慈善总会收到一笔 111 万元捐款，落款「其自」。这是神秘捐赠人「顺其自然」连续第 28 年捐款，累计金额达 1907 万元。1999 年 12 月第一次捐款时，5 张一万元汇款收据的信封上署名「顺其自然」，地址写着并不存在的「江东路 1 号」，并附纸条：「坏事不做，好事不说，顺其自然」。28 年来，落款在「顺顺」「顺其」「其其」「其自」之间随机组合；因单张汇款单不超过 1 万元，早期捐款常由数百张汇票拼成。善款全部投向助学教育并逐笔公示。2018 年浙江省档案馆「大写浙江人」展览中，124 位浙江名人里唯一的非真实姓名展位属于「顺其自然」，配图是一群人的剪影。", "en": "On the morning of 9 November, the Ningbo Charity Federation in Zhejiang received a donation of 1.11 million yuan signed «Qi Zi». It is the 28th consecutive year of giving by the anonymous donor known as «Shun Qi Zi Ran» (let it be), bringing the total to 19.07 million yuan. The first donation in December 1999 arrived as five 10,000-yuan remittance receipts in an envelope signed with that phrase and an address that does not exist — «No. 1 Jiangdong Road» — with a note: «Do no wrong, speak of no good deeds, let nature take its course.» Over 28 years the signature has rotated among variants; because a single remittance slip cannot exceed 10,000 yuan, early donations were assembled from hundreds of slips. All the money has gone to education and is disclosed item by item. In a 2018 Zhejiang Provincial Archives exhibition of notable Zhejiang figures, the only display without a real name belonged to this donor — illustrated with the silhouettes of a crowd.", "es": "En la mañana del 9 de noviembre, la Federación de Caridad de Ningbo (Zhejiang) recibió una donación de 1,11 millones de yuanes firmada «Qi Zi». Es el año 28 consecutivo de donaciones del donante anónimo conocido como «Shun Qi Zi Ran» (que sea natural), con un total acumulado de 19,07 millones de yuanes. La primera, en diciembre de 1999, llegó como cinco resguardos de 10.000 yuanes en un sobre firmado con esa frase y una dirección inexistente —«Jiangdong Road, n.º 1»— junto a una nota: «No hacer el mal, no contar el bien, dejar que sea natural». En 28 años la firma ha rotado entre variantes; como cada resguardo no puede superar los 10.000 yuanes, las primeras donaciones se armaban con cientos de ellos. Todo el dinero se destinó a educación y se publica partida por partida. En una exposición de 2018 del Archivo Provincial de Zhejiang, el único panel sin nombre real entre 124 figuras destacadas era el de este donante, ilustrado con las siluetas de un grupo de personas.", "ja": "11 月 9 日午前、浙江省寧波市慈善総会に 111 万元の寄付が届いた。差出人は「其自」。匿名の寄付者「順其自然」による 28 年連続の寄付で、累計は 1907 万元に達した。1999 年 12 月の初回は、1 万元の為替証書 5 枚を封筒に入れ、「順其自然」と署名し、実在しない「江東路 1 号」という住所と「悪いことはしない、良いことは言わない、自然のままに」と書いた紙を添えていた。28 年間、署名は「順順」「順其」「其其」「其自」と入れ替わってきた。1 枚 1 万元の上限があるため、初期の寄付は数百枚の証書を合わせたものだった。寄付金はすべて奨学・教育に充てられ、一件ずつ公開されている。2018 年の浙江省档案館の展示では、124 人の著名人の中で唯一実名でない展示がこの寄付者のもので、写真は大勢の人のシルエットだった。"}, "why": {"zh": "一个人做了 28 年同一件事而不肯留名，最动人的不是金额，是「坏事不做，好事不说」这八个字被认真执行了 28 年。它也顺手证明了一件事：匿名不等于不被信任。", "en": "One person doing the same thing for 28 years without leaving a name: the moving part is not the sum but eight words — do no wrong, speak of no good — carried out for 28 years. It also proves something by the way: anonymity is not the same as being untrusted.", "es": "Una persona haciendo lo mismo durante 28 años sin dejar su nombre: lo conmovedor no es la cifra, sino ocho palabras —no hacer el mal, no contar el bien— sostenidas 28 años. Y de paso demuestra algo: el anonimato no equivale a falta de confianza.", "ja": "同じことを 28 年続けて名前を残さない。心を打つのは金額ではなく、「悪いことはしない、良いことは言わない」という言葉が 28 年間実行されたことだ。そしてもう一つ证明している。匿名であることは信頼されていないことではない。"}}, {"idx": "02", "title": {"zh": "疑似秦始皇之子头骨面容复原：右颞骨嵌着青铜箭头", "en": "Facial Reconstruction of a Possible Son of Qin Shi Huang: Arrowhead Still in the Skull", "es": "Reconstruyen el rostro de un posible hijo del primer emperador: una punta de flecha en el cráneo", "ja": "始皇帝の子とみられる頭骨を復顔、右側頭骨に青銅の矢じり"}, "body": {"zh": "西北大学科研团队利用颅面复原技术，还原了秦陵东侧上焦村陪葬墓中一名约 30 岁男性的面容。该头骨右颞骨嵌有一枚青铜箭头，头与四肢被肢解后置于棺内。专家推测，这名男子大概率是秦始皇的儿子，死于秦二世胡亥的清洗；复原出的面部特征为橄榄形眼睛、高挺鼻梁，与《史记》中形容秦始皇「蜂准、长目」的记载存在相似之处。相关成果近日公布后引发关注，也有学者提醒，个体身份的确认仍需更多墓葬信息与 DNA 等科学证据支撑。", "en": "A research team at Northwest University has used craniofacial reconstruction to recreate the face of a man of about 30 buried in a satellite tomb at Shangjiao village, east of the Qin Shi Huang mausoleum. A bronze arrowhead is embedded in his right temporal bone, and his head and limbs were dismembered before being placed in the coffin. Experts believe he was most likely a son of Qin Shi Huang who died in the purge ordered by Qin Er Shi, Hu Hai. The reconstructed features — olive-shaped eyes and a high nose bridge — resemble the Shiji's description of the emperor as having «a wasp-like nose and long eyes». The findings have drawn wide attention, though some scholars caution that confirming the individual's identity still requires more tomb information and scientific evidence such as DNA.", "es": "Un equipo de la Universidad del Noroeste ha reconstruido con técnicas craneofaciales el rostro de un hombre de unos 30 años enterrado en una tumba satélite de Shangjiao, al este del mausoleo del primer emperador Qin. Tiene una punta de flecha de bronce incrustada en el hueso temporal derecho, y su cabeza y extremidades fueron descuartizadas antes de colocarlas en el ataúd. Los expertos creen que era muy probablemente un hijo del emperador, muerto en la purga ordenada por Qin Er Shi, Hu Hai. Los rasgos reconstruidos —ojos aceitunados y nariz alta— se parecen a la descripción del Shiji: «nariz de avispa, ojos largos». Los resultados han llamado la atención, aunque algunos académicos advierten de que confirmar la identidad exige más información de la tumba y pruebas científicas como el ADN.", "ja": "西北大学の研究チームが頭蓋顔面復元技術を用い、秦始皇帝陵の東側、上焦村の陪葬墓に葬られた約 30 歳の男性の顔を復元した。頭骨の右側頭部には青銅の矢じりが刺さり、頭部と四肢は切断されたうえで棺に納められていた。専門家はこの男性が始皇帝の子である可能性が高く、二世皇帝・胡亥の粛清で死亡したと推測する。復元された橄榄形の目と高い鼻筋は、『史記』が始皇帝を「蜂準、長目」と記した描写と似ている。成果が公表され関心を集める一方、個人の特定には墓の情報や DNA などの科学的証拠がなお必要だとの指摘もある。"}, "why": {"zh": "考古最迷人的地方不是「像不像」，而是它让一句两千年前的文字突然有了骨骼。但把「疑似」讲成「就是」，恰恰是对这份证据的不尊重。", "en": "The most captivating thing about archaeology is not resemblance but the way it gives bones to a sentence written two thousand years ago. Calling a «possible» a «certain» would be the surest way to disrespect that evidence.", "es": "Lo más fascinante de la arqueología no es el parecido, sino que da huesos a una frase escrita hace dos mil años. Convertir un «posible» en un «es» sería justamente faltar al respeto a esa evidencia.", "ja": "考古学の魅力は「似ているか」ではなく、二千年前の一行に骨を与えることにある。「可能性」を「断定」に変えることは、その証拠への不敬にほかならない。"}}, {"idx": "03", "title": {"zh": "火流星过后，石家庄农田里挖出近百公斤陨石", "en": "After a Fireball, Nearly 100 kg of Meteorite Dug Up in Shijiazhuang", "es": "Tras el bólido, casi 100 kilos de meteorito en un campo de Shijiazhuang", "ja": "火球のあと、石家荘の農地から約 100 キロの隕石"}, "body": {"zh": "11 月 6 日 18 时 30 分许，一颗拖着绿色尾迹的火流星掠过华北上空，北京、河北、山西、内蒙古多地有人目击。石家庄市鹿泉区大河镇北故城村村民在麦地发现宽约七八十厘米、深及膝盖的陨石坑，坑内石块可被磁铁吸附；另有一块碎片砸穿附近厂房屋顶。11 月 8 日，陨石猎人在农户家中找到一块约 20 公斤的陨石。11 月 9 日，中国收藏家协会陨石专业委员会副主任委员马荣尉从海南赶到现场，从农田主人处购买数十公斤陨石，并称现场已发现最大两块分别约 30 公斤和 14 公斤、总重近百公斤，部分样品已送中国科学院化验。律师表示，现行法律未对陨石归属作出明确规定。", "en": "At around 18:30 on 6 November, a fireball with a green trail crossed the sky over northern China and was seen from Beijing, Hebei, Shanxi and Inner Mongolia. Villagers in Beigucheng, Dahe township, Luquan district of Shijiazhuang found a crater about 70-80 cm wide and knee-deep in a wheat field, with fragments inside that a magnet could lift; another piece punched through the roof of a nearby factory. On 8 November a meteorite hunter found a roughly 20 kg stone at a farmer's home. On 9 November Ma Rongwei, deputy head of the meteorite committee of the China Collectors Association, travelled from Hainan and bought several dozen kilograms from the field's owner, saying the two largest pieces found so far weigh about 30 kg and 14 kg, with a total near 100 kg; some samples have gone to the Chinese Academy of Sciences for testing. Lawyers note that current law does not clearly define ownership of meteorites.", "es": "Hacia las 18:30 del 6 de noviembre, un bólido con estela verde cruzó el cielo del norte de China y fue visto desde Pekín, Hebei, Shanxi y Mongolia Interior. Vecinos de Beigucheng, en el distrito de Luquan de Shijiazhuang, encontraron en un trigal un cráter de 70-80 cm de ancho y profundidad hasta la rodilla, con fragmentos que un imán atraía; otro trozo perforó el techo de una fábrica cercana. El 8 de noviembre un buscador de meteoritos halló una piedra de unos 20 kg en casa de un agricultor. El 9 de noviembre, Ma Rongwei, vicepresidente del comité de meteoritos de la Asociación de Coleccionistas de China, llegó desde Hainan y compró varias decenas de kilos al dueño del terreno; según él, las dos piezas mayores pesan unos 30 y 14 kg y el total ronda los 100 kg, y algunas muestras se enviaron a la Academia China de Ciencias. Los abogados señalan que la ley no define con claridad la propiedad de los meteoritos.", "ja": "11 月 6 日 18 時 30 分ごろ、緑の尾を引く火球が華北上空を横切り、北京、河北、山西、内モンゴルで目撃された。石家荘市鹿泉区大河鎮北故城村の住民が麦畑で幅 70〜80 センチ、膝ほどの深さのクレーターを見つけ、中の石は磁石に反応した。別の破片は近くの工場の屋根を突き破った。11 月 8 日、隕石ハンターが農家で約 20 キロの石を発見。11 月 9 日には中国収蔵家協会隕石専門委員会副主任委員の馬栄尉氏が海南から現地入りし、農地の持ち主から数十キロを購入した。これまでに見つかった最大の 2 個は約 30 キロと 14 キロ、総重量は 100 キロ近くに達し、一部は中国科学院に鑑定に出されたという。弁護士は、現行法が隕石の帰属を明確に定めていないと指摘する。"}, "why": {"zh": "一块石头在农民眼里是天上掉下来的怪事，在收藏者眼里是价钱，在科学家眼里是样本——三种价钱同时出现，恰恰说明规则缺席。真正要回答的不是「归谁」，是「谁来定它的科研价值」。", "en": "The same stone is an oddity from the sky to a farmer, a price to a collector and a sample to a scientist. Three valuations appearing at once is exactly what a missing rule looks like. The question is not who owns it but who decides its scientific value.", "es": "La misma piedra es una rareza caída del cielo para un agricultor, un precio para un coleccionista y una muestra para un científico. Que aparezcan tres valoraciones a la vez revela la ausencia de reglas. La pregunta no es de quién es, sino quién decide su valor científico.", "ja": "同じ石が、農家には空から落ちてきた珍事、収蔵家には値段、科学者には試料になる。三つの値付けが同時に現れること自体が、ルールの不在を示している。問われるのは「誰のものか」ではなく「誰が学術的価値を決めるのか」だ。"}}, {"idx": "04", "title": {"zh": "网传上海和平饭店 51.7 万元小票，店方称系虚构，警方已介入", "en": "Fake 517,000-Yuan Receipt From Peace Hotel? Store Says Fabricated, Police Involved", "es": "Un tique falso de 517.000 yuanes en el Peace Hotel: el hotel lo niega y la policía interviene", "ja": "上海ピースホテルの 51.7 万元レシート、店側は捏造と否定　警察が動く"}, "body": {"zh": "11 月 8 日，有网友在社交平台晒出一张消费小票，显示用餐时间 11 月 3 日、6 人用餐、9 道菜 3 样酒水，总消费 51.7 万余元，其中一款标称「1997 年」的酒水单价 23 万元、合计 46 万元，另有服务费 4.7 万余元。小票迅速引发「明码标价是否等于合理」的争论。11 月 8 日与 9 日，上海和平饭店工作人员两次回应媒体，明确网络流传的天价小票均不真实、系网友虚构，将由公关部门处置；11 月 9 日上午，上海市公安局 110 报警服务台表示将指派相关警种介入。截至发稿，警方尚无处置结果通报，发布者未回应媒体询问。", "en": "On 8 November a social media user posted a receipt showing a meal on 3 November for six people, nine dishes and three drinks, with a total of more than 517,000 yuan. One drink labelled «1997» was priced at 230,000 yuan a unit for a total of 460,000 yuan, plus more than 47,000 yuan in service charge. The receipt quickly set off a debate over whether transparent pricing equals reasonable pricing. On 8 and 9 November, staff at Shanghai's Peace Hotel twice told media that the receipt circulating online is not genuine and was fabricated by a user, and that the public relations department would handle it; on the morning of 9 November, the Shanghai 110 emergency line said relevant police units would be assigned to look into it. As of publication, police had issued no findings and the poster had not responded to media enquiries.", "es": "El 8 de noviembre, un usuario publicó en redes un tique de una comida del 3 de noviembre para seis personas, nueve platos y tres bebidas, con un total superior a 517.000 yuanes. Una bebida etiquetada «1997» costaba 230.000 yuanes por unidad, 460.000 en total, más 47.000 de servicio. El tique desató un debate sobre si un precio visible equivale a un precio razonable. Los días 8 y 9, el personal del Peace Hotel de Shanghái declaró dos veces a los medios que el tique difundido no es auténtico y fue inventado por un usuario, y que lo gestionaría el departamento de comunicación; en la mañana del 9, el servicio de emergencias 110 de Shanghái indicó que se asignarían unidades policiales. Hasta el cierre, no había conclusiones oficiales ni respuesta del autor de la publicación.", "ja": "11 月 8 日、ある利用者が SNS にレシートを投稿した。11 月 3 日、6 人、料理 9 品、飲み物 3 種で合計 51.7 万元超。「1997 年」と記された飲み物は 1 本 23 万元、合計 46 万元で、サービス料 4.7 万元余り。投稿は「明瞭な価格表示は妥当と言えるのか」という議論を呼んだ。上海ピースホテルは 8 日と 9 日、メディアに対してネットで流れる高額レシートは事実ではなく利用者の創作だと 2 度説明し、広報部門が対応するとした。9 日午前、上海市公安局の 110 番は関連する警察部門を動かすと述べた。締め切り時点で警察の発表はなく、投稿者も取材に応じていない。"}, "why": {"zh": "一张小票能吵两天，是因为它同时踩中了「天价」和「真假」两个按钮。如果它是假的，问题在造谣；如果它是真的，问题在定价。现在最该等的，是两个部门里先出结论的那一个。", "en": "One receipt fuelled two days of argument because it pressed two buttons at once: outrageous price and authenticity. If it is fake, the problem is fabrication; if real, the problem is pricing. The thing to wait for is whichever authority reports first.", "es": "Un tique dio para dos días de discusión porque pulsó dos botones a la vez: precio escandaloso y autenticidad. Si es falso, el problema es la fabulación; si es real, el problema es el precio. Lo que toca esperar es a que una de las dos instancias concluya primero.", "ja": "1 枚のレシートが 2 日も議論を呼んだのは、「高額」と「真偽」という二つのボタンを同時に押したからだ。偽物なら問題は捏造、本物なら問題は価格設定。今は二つの当局のうち、先に結論を出す方を待つべきだ。"}}, {"idx": "05", "title": {"zh": "无锡一场所女厕设 3 个站立式小便厕位，配一次性导流器", "en": "Wuxi Venue Adds Standing Urinals to Women's Restroom", "es": "Un local de Wuxi instala tres urinarios de pie en el baño de mujeres", "ja": "無錫の施設、女性トイレに立ち式小便器 3 基を設置"}, "body": {"zh": "11 月 9 日，有网友发帖称，无锡南长街附近一处场所的女厕内设置了 3 个粉白色站立式小便厕位，配备一次性纸质导流器，原有蹲厕全部保留、并非替代。场所方表示，这一设计初衷是缓解演出散场时女厕排队压力，也为不方便下蹲的人群提供一种选择。相关话题当天登上热搜，讨论集中在实用性与接受度两端：有人认为提高周转效率是好事，也有人担心卫生与使用门槛。此前广东曾就公共厕所男女厕位比例公开征求意见，拟规定男女厕位按 1 比 2 配置。", "en": "On 9 November a user posted that a venue near Nanchang Street in Wuxi had installed three pink-white standing urinals in its women's restroom, each with a disposable paper funnel, while all existing squat toilets were kept rather than replaced. The venue said the aim was to ease queues after performances let out and to offer an option for people who find squatting difficult. The topic trended that day, with debate split between practicality and acceptance: some saw faster turnover as a plus, others worried about hygiene and the barrier to use. Guangdong previously sought public comment on restroom ratios, proposing two women's stalls for every men's.", "es": "El 9 de noviembre, un usuario publicó que un local cerca de la calle Nanchang de Wuxi había instalado tres urinarios de pie, blancos y rosas, en el baño de mujeres, con embudos de papel desechables, manteniendo intactos todos los inodoros de cuclillas. El local explicó que buscaba aliviar las colas al terminar los espectáculos y ofrecer una opción a quien no puede agacharse. El tema fue tendencia ese día, con el debate dividido entre utilidad y aceptación: algunos valoraron la mayor rotación, otros dudaron por la higiene y la dificultad de uso. Antes, Guangdong abrió una consulta pública sobre la proporción de aseos, proponiendo dos plazas femeninas por cada una masculina.", "ja": "11 月 9 日、ある利用者が、無錫の南長街近くの施設の女性トイレにピンクと白の立ち式小便器が 3 基設置され、使い捨ての紙製導流器が備えられ、既存の和式便器はすべて残されていると投稿した。施設側は、公演終了後の女性トイレの混雑緩和と、しゃがむのが難しい人への選択肢が目的だと説明した。話題はその日の検索上位に入り、実用性と受容性で議論が分かれた。回転率の向上を評価する声がある一方、衛生面や利用のハードルを懸念する声も出た。広東省は以前、公共トイレの男女便器の比率について意見募集を行い、女性 2 対男性 1 とする案を示している。"}, "why": {"zh": "公共设施的进步，往往不是从「更豪华」开始，而是从「承认不同人的不同麻烦」开始。至于好不好用，得让排过队的人说了算。", "en": "Public facilities rarely improve by getting fancier; they improve by admitting that different people have different troubles. Whether it works should be decided by the people who have stood in that queue.", "es": "Las instalaciones públicas no mejoran por ser más lujosas, sino por reconocer que personas distintas tienen problemas distintos. Si funciona o no, deben decidirlo quienes han hecho esa cola.", "ja": "公共施設の進歩は「より豪華に」からではなく、「人によって困り方が違うと認める」ことから始まる。使い勝手は、実際に列に並んだ人が決めるべきだ。"}}]}, {"key": "ent", "num": "06", "color": "#db2777", "deep": "#ad1a5e", "name": {"zh": "娱乐八卦", "en": "ENTERTAINMENT", "es": "ESPECTÁCULOS", "ja": "エンタメ"}, "items": [{"idx": "01", "tag": {"zh": "进展"}, "title": {"zh": "金鸡奖今晚揭晓：蓝羽、刘昊然、关晓彤、杜江主持，吴磊首提影帝", "en": "Golden Rooster Awards Tonight: Wu Lei's First Best Actor Nod", "es": "Los Golden Rooster se entregan esta noche: primera nominación de Wu Lei", "ja": "金鶏賞は今夜発表、呉磊が初の主演男優賞候補に"}, "body": {"zh": "第 39 届中国电影金鸡奖颁奖典礼暨 2026 年中国金鸡百花电影节闭幕式，将于 11 月 10 日晚在厦门海峡大剧院举行，电影频道主持人蓝羽与刘昊然、关晓彤、杜江联袂主持。本届共揭晓最佳男女主角、最佳故事片、最佳导演等 20 个奖项。11 月 9 日，提名者表彰仪式在厦门举行，五位最佳男主角提名者吴磊、梁家辉、蒋龙、蒋奇明、檀健次到场领取提名荣誉；吴磊凭《群星闪耀时》首次提名金鸡影帝，发言结尾恰逢母亲生日，他把「一切看见皆有回响」送给母亲，并问「你看见了吗」。最佳女主角提名者包括宋佳、张子枫、高叶、李思潼等。", "en": "The 39th Golden Rooster Awards ceremony, closing the 2026 Golden Rooster and Hundred Flowers Film Festival, takes place on the evening of 10 November at the Xiamen Strait Grand Theatre, hosted by film channel presenter Lan Yu together with actors Liu Haoran, Guan Xiaotong and Du Jiang. Twenty awards will be presented, including best actor, best actress, best feature and best director. On 9 November Xiamen hosted the nominees' commendation ceremony, where all five best actor nominees — Wu Lei, Tony Leung Ka-fai, Jiang Long, Jiang Qiming and Tan Jianci — collected their citations. Wu Lei, nominated for the first time for «Stars Shining», closed his speech on his mother's birthday by dedicating «everything seen echoes» to her and asking, «did you see it?» Best actress nominees include Song Jia, Zhang Zifeng, Gao Ye and Li Sitong.", "es": "La 39.ª ceremonia de los Premios Golden Rooster, que cierra el Festival de Cine Golden Rooster y Hundred Flowers 2026, se celebra el 10 de noviembre por la noche en el Gran Teatro del Estrecho de Xiamen, presentada por Lan Yu junto a Liu Haoran, Guan Xiaotong y Du Jiang. Se entregarán 20 premios, entre ellos mejor actor, actriz, película y dirección. El 9 de noviembre se celebró en Xiamen el acto de reconocimiento a los nominados, al que acudieron los cinco candidatos a mejor actor —Wu Lei, Tony Leung Ka-fai, Jiang Long, Jiang Qiming y Tan Jianci—. Wu Lei, nominado por primera vez por «Stars Shining», cerró su discurso el día del cumpleaños de su madre dedicándole «todo lo visto resuena» y preguntando: «¿lo has visto?». Entre las candidatas a mejor actriz figuran Song Jia, Zhang Zifeng, Gao Ye y Li Sitong.", "ja": "第 39 回中国映画金鶏賞授賞式暨 2026 年中国金鶏百花映画祭クロージングは 11 月 10 日夜、アモイ海峡大劇院で開かれ、映画チャンネルの藍羽アナウンサーと俳優の劉昊然、関暁彤、杜江が進行を務める。最優秀主演男優・女優賞、最優秀作品賞、最優秀監督賞など 20 部門が発表される。11 月 9 日にはアモイでノミネート表彰式が行われ、主演男優賞候補の呉磊、梁家輝、蒋龍、蒋奇明、檀健次がそろって出席した。呉磊は『群星閃耀時』で金鶏賞主演男優賞に初ノミネートされ、スピーチの最後が母の誕生日と重なり、「見られたことはすべて響く」という言葉を母に贈り、「見ていてくれた？」と問いかけた。主演女優賞候補には宋佳、張子楓、高葉、李思潼らが名を連ねる。"}, "why": {"zh": "提名表彰不发奖，却常常比颁奖礼更好看——没有输赢，只有「我终于被看见」。今晚开盅，悬念是影帝，看点是这场颁奖礼能不能给冷了一整年的电影市场一点热度。", "en": "A nominees' ceremony hands out no prizes yet often outshines the main event: no winners, only «I was finally seen». Tonight's suspense is best actor; the real question is whether the show can warm a film market that has been cold all year.", "es": "El acto de nominados no entrega premios pero suele superar a la gala: sin ganadores, solo «por fin me vieron». Esta noche el suspense es el mejor actor; la pregunta real es si la gala puede calentar un mercado cinematográfico frío todo el año.", "ja": "ノミネート表彰は賞を出さないのに、本番より見応えがあることが多い。勝ち負けはなく、「ようやく見てもらえた」だけがある。今夜の焦点は主演男優賞だが、本題はこの授賞式が一年中冷え込んだ映画市場に少しの熱を戻せるかだ。"}}, {"idx": "02", "title": {"zh": "W 盛典上海站红毯：郑钦文首秀，杨幂两套古董高定，倪妮穿了件 1930 年代的旗袍", "en": "W Gala in Shanghai: Zheng Qinwen's Red-Carpet Debut and a 1930s Qipao", "es": "Gala W en Shanghái: el debut de Zheng Qinwen y un qipao de los años treinta", "ja": "W ガラ上海、鄭欽文がレッドカーペット初登場　1930 年代のチャイナドレスも"}, "body": {"zh": "11 月 9 日晚，《W 中文版》年度盛典上海站举行，主题为「黄金时代」，继 11 月 1 日澳门站后以「双城记」形式落地。郑钦文完成个人时尚红毯首秀，一晚连换两套高定；杨幂解锁两套祖海·穆拉德古董典藏高定，分别出自 2015 春夏与 2014 秋冬；刘诗诗以鎏金褶皱鱼尾礼服配手推波纹发型，被称「复古名伶」；倪妮穿一件上世纪 30 年代的藕色烧花丝绒旗袍，收藏者为歌手张信哲；唐嫣的橄榄绿钉珠抹胸为品牌亚洲首秀。刘诗诗、杨幂、倪妮、刘浩存同框登上热搜。", "en": "On the evening of 9 November, W China's annual gala opened in Shanghai under the theme «Golden Age», the second stop of a two-city format after Macao on 1 November. Zheng Qinwen made her fashion red-carpet debut, changing into two couture looks in one night; Yang Mi wore two archival Zuhair Murad couture pieces, from spring/summer 2015 and autumn/winter 2014; Liu Shishi paired a gilded pleated fishtail gown with finger-wave hair and was dubbed a «retro diva»; Ni Ni wore a 1930s lotus-coloured devoré velvet qipao from singer Jeff Chang's collection; Tang Yan's olive beaded bustier was an Asian debut for the label. A photo of Liu Shishi, Yang Mi, Ni Ni and Liu Haocun together trended online.", "es": "La noche del 9 de noviembre se celebró en Shanghái la gala anual de W China bajo el tema «Edad de Oro», segunda parada del formato de dos ciudades tras Macao el 1 de noviembre. Zheng Qinwen hizo su debut en una alfombra roja de moda con dos looks de alta costura en una noche; Yang Mi lució dos piezas de archivo de Zuhair Murad (primavera-verano 2015 y otoño-invierno 2014); Liu Shishi combinó un vestido de cola plisado dorado con peinado de ondas y fue calificada de «diva retro»; Ni Ni llevó un qipao de terciopelo devoré color loto de los años treinta, de la colección del cantante Jeff Chang; el bustier verde oliva de Tang Yan fue un estreno asiático de la firma. Una imagen de Liu Shishi, Yang Mi, Ni Ni y Liu Haocun juntas se volvió tendencia.", "ja": "11 月 9 日夜、『W 中国版』の年間ガラが上海で開かれ、テーマは「黄金時代」。11 月 1 日のマカオに続く「二都市」形式の第 2 弾だ。鄭欽文はファッションのレッドカーペットに初登場し、一夜で 2 着のオートクチュールをまとった。楊冪はズハイル・ムラドのアーカイブから 2015 年春夏と 2014 年秋冬の 2 着を着用。劉詩詩は金色のプリーツ入りフィッシュテールドレスに手押しウェーブの髪で「レトロな名伶」と評された。倪妮は 1930 年代の蓮色デヴォレ・ベルベットのチャイナドレスをまとい、所蔵者は歌手の張信哲氏。唐嫣のオリーブグリーンのビーズ刺繍ビスチェはブランドのアジア初披露だった。劉詩詩、楊冪、倪妮、劉浩存の共演ショットが検索上位に入った。"}, "why": {"zh": "这一晚比的不是谁更新，而是谁的衣服更有来历——品牌档案库、私人收藏、亚洲首秀。红毯的竞争维度从「贵」转向「故事」，其实是观众审美成熟的一个信号。", "en": "The competition that night was not over who wore the newest thing but over whose dress had a provenance: a brand archive, a private collection, an Asian debut. Moving from «expensive» to «story» is a sign that the audience has grown up.", "es": "Esa noche no competían por lo más nuevo, sino por el origen del vestido: archivo de la firma, colección privada, estreno asiático. Pasar de «caro» a «historia» es señal de que el público ha madurado.", "ja": "その夜の競争は「新しさ」ではなく「来歴」だった。ブランドのアーカイブ、個人のコレクション、アジア初披露。基準が「高価」から「物語」へ移ったことは、観客の審美眼が成熟した証拠だ。"}}, {"idx": "03", "title": {"zh": "《哥斯拉-0.0》北美开画 3160 万美元，打破《英雄》守了 24 年的纪录", "en": "«Godzilla-0.0» Opens to $31.6 Million, Breaking a 24-Year-Old Record", "es": "«Godzilla-0.0» debuta con 31,6 millones y rompe un récord de 24 años", "ja": "『ゴジラ-0.0』北米で 3160 万ドルの初登場、24 年ぶりに記録更新"}, "body": {"zh": "北美上周末（11 月 6 日至 8 日）票房由一部日本怪兽片改写：《哥斯拉-0.0》开画三天收 3160 万美元登顶，打破张艺谋《英雄》2004 年创下的 1780 万美元纪录，成为北美影史首周末票房最高的真人外语片。该片是首部以 IMAX 规格拍摄的日本电影，IMAX 厅贡献 1270 万美元、占比约 40%，特效厅合计占比 74%；烂番茄新鲜度 90%，CinemaScore 观众评分 A，全球开画合计约 6300 万美元。同周，华纳成本 9200 万美元的动画《戴帽子的猫》北美开画仅 2000 万美元，在中国内地同步上映三天收 430 万元。北美周末大盘 1.14 亿美元，同比大涨 86%。", "en": "North America's weekend box office (6-8 November) was rewritten by a Japanese monster film: «Godzilla-0.0» opened to $31.6 million and took the top spot, beating the $17.8 million set by Zhang Yimou's «Hero» in 2004 to become the highest-grossing opening weekend for a live-action foreign-language film in North America. It is the first Japanese film shot in IMAX format, with IMAX screens contributing $12.7 million, about 40%, and premium formats 74% combined. Rotten Tomatoes stands at 90% and CinemaScore at A, with a global opening of about $63 million. Warner's $92 million animated «The Cat in the Hat» opened to just $20 million in North America and took 4.3 million yuan in three days in mainland China. The overall North American weekend was $114 million, up 86% year on year.", "es": "La taquilla norteamericana del fin de semana (6-8 de noviembre) la reescribió un filme japonés de monstruos: «Godzilla-0.0» debutó con 31,6 millones de dólares y lideró la cartelera, superando los 17,8 millones de «Hero» de Zhang Yimou en 2004 y convirtiéndose en el mejor estreno de una película de imagen real en lengua extranjera en Norteamérica. Es la primera película japonesa rodada en formato IMAX, cuyas salas aportaron 12,7 millones (cerca del 40 %), y los formatos premium el 74 % del total. Tiene 90 % en Rotten Tomatoes y una A de CinemaScore, con un estreno global de unos 63 millones. La animación de Warner «The Cat in the Hat», de 92 millones de coste, se estrenó con solo 20 millones en Norteamérica y recaudó 4,3 millones de yuanes en tres días en China continental. El fin de semana sumó 114 millones, un 86 % más interanual.", "ja": "北米の週末興行（11 月 6〜8 日）は日本の怪獣映画が塗り替えた。『ゴジラ-0.0』が 3 日間で 3160 万ドルを上げて首位となり、張芸謀『HERO』が 2004 年に記録した 1780 万ドルを抜いて、北米史上実写外国語映画の最高初週末成績となった。IMAX で撮影された初の日本映画で、IMAX 館が 1270 万ドル（約 40％）、プレミアム形式全体で 74％ を占めた。Rotten Tomatoes は 90％、CinemaScore は A、全世界の初週は約 6300 万ドル。同週、ワーナーの製作費 9200 万ドルのアニメ『The Cat in the Hat』は北米で 2000 万ドルにとどまり、中国本土でも 3 日間で 430 万元だった。北米全体の週末興行は 1 億 1400 万ドルで前年比 86％ 増。"}, "why": {"zh": "一部外语片能在北美破纪录，靠的不是排片，是「必须在大银幕看」的理由。IMAX 在这里不是加价项，是创作工具——这正是很多片子还没学会的那一课。", "en": "A foreign-language film breaking a North American record does not come from screen count but from a reason to be seen on a big screen. Here IMAX is not a surcharge but a creative tool — the lesson many films have yet to learn.", "es": "Que una película en lengua extranjera rompa un récord en Norteamérica no depende del número de salas, sino de una razón para verla en pantalla grande. Aquí el IMAX no es un recargo, es una herramienta creativa: la lección que muchas películas aún no han aprendido.", "ja": "外国語映画が北米で記録を破ったのは上映館数の力ではなく、「大画面で観る理由」があったからだ。ここでの IMAX は追加料金ではなく創作の道具である。多くの作品がまだ学んでいない教訓だ。"}}, {"idx": "04", "title": {"zh": "《后会友期》市占率 81.2%，连续 14 天霸榜，芒果超媒市值重回 613 亿", "en": "«After We Part» Takes 81.2% of Streaming, Mango Valuation Back to 61.3 Billion", "es": "«After We Part» acapara el 81,2 % del streaming y Mango recupera 61.300 millones", "ja": "『後会友期』シェア 81.2％、14 日連続首位で芒果超媒の時価総額 613 億元に"}, "body": {"zh": "云合数据显示，《后会友期》正片有效播放市占率已达 81.2%，连续 14 天霸榜热播新综，是 2024 年以来首部市占率突破 80% 的新综艺。11 月 5 日第四期更新时，芒果 TV 服务器一度被挤崩；芒果超媒当日股价上涨 9.23%，市值重回 613 亿元。与此同时，微短剧的沉迷争议被摆上台面：广州日报 11 月 9 日发文追问「AI 短剧勾住你了吗」，并点名广电总局要求各平台「凡播必审、全量人审」，坚决纠治诱导沉迷的机制设计；红果已上线「休息提醒」「睡眠提醒」，并从 11 月起关停新用户金币功能。", "en": "Data from Yunhe shows «After We Part» has reached 81.2% of effective playback share and topped the new-variety chart for 14 consecutive days, the first new variety show since 2024 to pass 80%. When episode four dropped on 5 November, Mango TV's servers briefly buckled; Mango Excellent Media rose 9.23% that day and its market value returned to 61.3 billion yuan. At the same time, the addiction debate around micro-dramas has moved to the foreground: Guangzhou Daily asked on 9 November whether «AI short dramas have hooked you», noting that the National Radio and Television Administration requires platforms to review everything broadcast with full human review and to correct designs that induce addiction; Hongguo has added rest and sleep reminders and, from November, stopped its coin feature for new users.", "es": "Los datos de Yunhe muestran que «After We Part» alcanzó el 81,2 % de cuota de reproducción efectiva y lideró el ranking de nuevos formatos durante 14 días consecutivos, el primer programa nuevo desde 2024 en superar el 80 %. Cuando se estrenó el cuarto episodio el 5 de noviembre, los servidores de Mango TV se saturaron; Mango Excellent Media subió un 9,23 % ese día y su capitalización volvió a 61.300 millones de yuanes. Al mismo tiempo, el debate sobre la adicción a los microdramas ha pasado a primer plano: Guangzhou Daily se preguntó el 9 de noviembre si «los microdramas de IA te han atrapado», y recordó que la Administración Nacional de Radio y Televisión exige revisar todo lo emitido con revisión humana completa y corregir los diseños que inducen adicción; Hongguo ya ofrece avisos de descanso y de sueño y dejó de dar monedas a nuevos usuarios desde noviembre.", "ja": "雲合データによると、『後会友期』の本編有効再生シェアは 81.2％ に達し、14 日連続で新作バラエティ首位。2024 年以来、シェア 80％ を超えた初の新番組となった。11 月 5 日に第 4 回が更新された際、芒果 TV のサーバーが一時的に落ち、芒果超媒の株価は同日 9.23％ 上昇、時価総額は 613 億元に戻した。一方、マイクロドラマへの依存をめぐる議論も表面化している。広州日報は 11 月 9 日「AI ショートドラマに惹きつけられていないか」と問い、放送総局が全作品の事前審査と人的審査を求めたうえで、依存を誘導する仕組みの是正を指示したことに触れた。紅果は「休憩リマインド」「睡眠リマインド」を導入し、11 月から新規利用者へのコイン付与を停止した。"}, "why": {"zh": "一个综艺能占八成播放，说明注意力正在极度集中；而另一边，监管开始给「让人停不下来」这件事划线。两件事同时发生，内容行业接下来要比的不是谁更抓人，而是谁更敢让人走。", "en": "One show taking 80% of viewing shows how concentrated attention has become; meanwhile regulators are drawing a line around «keeping people from stopping». With both happening at once, the next contest is not who grips harder but who dares to let people leave.", "es": "Que un programa acapare el 80 % de las reproducciones muestra una concentración extrema de la atención; al mismo tiempo, el regulador empieza a poner límites a «no dejar parar». Con ambas cosas a la vez, la próxima competencia no es quién atrapa más, sino quién se atreve a dejar ir.", "ja": "1 本の番組が再生の 8 割を占めるということは、注意力が極端に集中しているということ。同時に規制当局は「やめられなくさせる」ことに対し線を引き始めた。二つが同時に起きている今、次の競争は「より惹きつける」ことではなく「手放せる勇気」になる。"}}, {"idx": "05", "title": {"zh": "《影之刃零》72 小时卖出 400 万份，媒体均分 88 超过《黑神话：悟空》", "en": "«Phantom Blade Zero» Sells 4 Million in 72 Hours, Scoring 88 on Metacritic", "es": "«Phantom Blade Zero» vende 4 millones en 72 horas y logra un 88 en Metacritic", "ja": "『影之刃零』72 時間で 400 万本、Metacritic 平均 88 で『黒神話』超え"}, "body": {"zh": "国产 3A 游戏《影之刃零》上线 72 小时全平台销量突破 400 万份，按 268 元最低定价计算，收入已超过 10 亿元；Steam 最高同时在线 83 万人，Metacritic 媒体均分 88 分，高于《黑神话：悟空》的 81 分。游戏官方原声 82 首曲目同步上线网易云音乐与 QQ 音乐。11 月还有 20 多款新游扎堆上线，其中包括腾讯《饥困荒野》11 月 24 日公测、蛮啾《蓝色星原：旅谣》11 月 26 日公测，后者全平台预约已突破 2500 万。", "en": "Chinese AAA title «Phantom Blade Zero» sold more than 4 million copies across platforms within 72 hours of launch, generating over 1 billion yuan at its lowest price of 268 yuan; peak concurrent players on Steam reached 830,000, and its Metacritic average of 88 is above «Black Myth: Wukong» at 81. The game's 82-track soundtrack also went live on NetEase Cloud Music and QQ Music. More than 20 new titles arrive in November, including Tencent's «Hunger Wilds» in open beta on 24 November and Manjuu's «Azur Promilia» on 26 November, the latter with over 25 million pre-registrations.", "es": "El título AAA chino «Phantom Blade Zero» vendió más de 4 millones de copias en todas las plataformas en 72 horas, con ingresos superiores a 1.000 millones de yuanes a su precio mínimo de 268; el pico de jugadores simultáneos en Steam llegó a 830.000 y su media de 88 en Metacritic supera el 81 de «Black Myth: Wukong». La banda sonora de 82 pistas se publicó en NetEase Cloud Music y QQ Music. En noviembre llegan más de 20 lanzamientos, entre ellos «Hunger Wilds» de Tencent en beta abierta el 24 y «Azur Promilia» de Manjuu el 26, este último con más de 25 millones de prerregistros.", "ja": "中国産 AAA タイトル『影之刃零』は発売後 72 時間で全プラットフォーム合計 400 万本を突破。最低価格 268 元で計算すると売上は 10 億元を超える。Steam の同時接続ピークは 83 万人、Metacritic の平均スコアは 88 で『黒神話：悟空』の 81 を上回った。サウンドトラック 82 曲も NetEase Cloud Music と QQ 音楽で同時配信された。11 月には 20 本以上の新作が控え、テンセントの『飢困荒野』が 11 月 24 日、蛮啾の『青色星原：旅謡』が 11 月 26 日にオープンベータを迎える。後者は全プラットフォームの事前登録が 2500 万を超えた。"}, "why": {"zh": "「第二棒」比第一棒更难——第一棒证明能做出来，第二棒要证明能持续做出来，还要在口碑上不被上一棒压住。88 分是个漂亮的回答，但真正的问题是下一款什么时候来。", "en": "The second baton is harder than the first: the first proves it can be done, the second must prove it can be done repeatedly — and not be crushed by the first in reputation. 88 is a fine answer; the real question is when the next one arrives.", "es": "El segundo relevo es más difícil que el primero: el primero demuestra que se puede hacer, el segundo debe demostrar que se puede repetir sin quedar aplastado en reputación por el anterior. Un 88 es una buena respuesta; la pregunta real es cuándo llega el siguiente.", "ja": "第 2 走者のほうが難しい。第 1 走者は「作れる」ことを証明し、第 2 走者は「作り続けられる」ことを、しかも前作の評価に潰されずに証明しなければならない。88 点は見事な答えだが、本当の問いは次がいつ出るかだ。"}}]}], "risk": {"zh": "风险提示：本简报仅作信息汇总，其中涉及的数据不构成任何投资建议。", "en": "Risk notice: this briefing is a summary of information only; the data involved does not constitute investment advice.", "es": "Aviso de riesgo: este boletín es solo un resumen informativo y los datos citados no constituyen asesoramiento de inversión.", "ja": "リスク提示：このブリーフィングは情報の要約のみを目的としており、記載のデータは投資助言を構成するものではありません。"}}/*__END__*/;

    if (lang === "en") return '<svg class="fl" viewBox="0 0 30 20" aria-hidden="true"><rect width="30" height="20" fill="#012169"/><path d="M0 0L30 20M30 0L0 20" stroke="#fff" stroke-width="4"/><path d="M0 0L30 20M30 0L0 20" stroke="#c8102e" stroke-width="2"/><rect x="13" width="4" height="20" fill="#fff"/><rect y="8" width="30" height="4" fill="#fff"/><rect x="14" width="2" height="20" fill="#c8102e"/><rect y="9" width="30" height="2" fill="#c8102e"/></svg>';
    if (lang === "es") return '<svg class="fl" viewBox="0 0 30 20" aria-hidden="true"><rect width="30" height="20" fill="#aa151b"/><rect y="5" width="30" height="10" fill="#f1bf00"/></svg>';
    return '<svg class="fl" viewBox="0 0 30 20" aria-hidden="true"><rect width="30" height="20" fill="#fff"/><circle cx="15" cy="10" r="5.5" fill="#bc002d"/></svg>';
  }

  /* ===== 工具 ===== */
  function T(obj, lang) {
    if (obj == null) return "";
    if (typeof obj === "string") return obj;
    if (obj[lang] != null) return obj[lang];
    return obj.zh != null ? obj.zh : "";
  }
  function pad(n) { return n < 10 ? "0" + n : "" + n; }
  function bing(q) { return "https://www.bing.com/search?q=" + encodeURIComponent(q); }
  function fmtDate(d, lang) {
    var y = d.getFullYear(), m = d.getMonth() + 1, day = d.getDate();
    if (lang === "zh") return y + "." + pad(m) + "." + pad(day);
    if (lang === "ja") return y + "年" + m + "月" + day + "日";
    if (lang === "es") return day + " " + ["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"][m-1] + " " + y;
    return ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][m-1] + " " + day + ", " + y;
  }
  function esc(s) {
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }
  function titleHtml(titleObj, hlObj, lang) {
    var title = T(titleObj, lang);
    var hl = T(hlObj, lang);
    var inner = esc(title);
    if (hl && title.indexOf(hl) >= 0) {
      var i = title.indexOf(hl);
      inner = esc(title.slice(0, i)) + '<span class="hl">' + esc(hl) + "</span>" + esc(title.slice(i + hl.length));
    }
    return '<a class="lk" href="' + bing(title) + '" target="_blank" rel="noopener">' + inner + "</a>";
  }

  /* ===== 语言检测：localStorage > 浏览器语言 > 系统时区 > 中文 ===== */
  function detectLang() {
    try { var s = localStorage.getItem("timab_lang"); if (s && LANGS.indexOf(s) >= 0) return s; } catch (e) {}
    var nav = (navigator.language || "").toLowerCase();
    if (/^zh/.test(nav)) return "zh";
    if (/^ja/.test(nav)) return "ja";
    if (/^es/.test(nav)) return "es";
    if (/^en/.test(nav)) return "en";
    var tz = "";
    try { tz = Intl.DateTimeFormat().resolvedOptions().timeZone || ""; } catch (e) {}
    if (/^Asia\/Tokyo/.test(tz)) return "ja";
    if (/Europe\/Madrid|America\/(Mexico_City|Bogota|Lima|Santiago|Caracas|Guatemala|La_Paz|San_Jose|Panama|Asuncion|Montevideo|Havana|El_Salvador|Managua|Tegucigalpa|Costa_Rica|San_Salvador)|America\/Argentina\//.test(tz)) return "es";
    if (/^(Europe|America|Australia)\//.test(tz)) return "en";
    return "zh";
  }

  var curLang = "zh";
  var langOpen = false;

  /* ===== 渲染 ===== */
  function renderChrome(lang) {
    var i18n = I18N[lang];
    document.documentElement.lang = LANG_HTML[lang];
    // 报头信息行
    var metaEl = document.getElementById("metaRow");
    if (metaEl) metaEl.textContent = T(BRIEFING.meta, lang);
    // 大日期
    var md = document.getElementById("mastDate");
    if (md) {
      var d = new Date(BRIEFING.date + "T00:00:00");
      md.innerHTML = fmtDate(d, lang) + "<small>" + esc(i18n.dateSub) + "</small>";
    }
    // 文档标题
    var siteName = (lang === "zh") ? "提马早报" : "TIMAB DAILY";
    document.title = siteName + " · " + fmtDate(new Date(BRIEFING.date + "T00:00:00"), lang);
    // 导航签
    var nav = document.getElementById("navChips");
    if (nav) {
      var order = ["pick"].concat(BRIEFING.sections.map(function (s) { return s.key; }));
      nav.innerHTML = "";
      order.forEach(function (key) {
        if (key === "pick") {
          var a = document.createElement("a");
          a.className = "chip-pick"; a.href = "#pick"; a.setAttribute("data-nav", "pick");
          a.textContent = T(BRIEFING.spotlight.badge, lang);
          nav.appendChild(a);
        } else {
          var sec = null;
          BRIEFING.sections.forEach(function (s) { if (s.key === key) sec = s; });
          if (!sec) return;
          var b = document.createElement("a");
          b.href = "#" + key; b.setAttribute("data-nav", key);
          b.style.borderColor = sec.color; b.style.color = sec.deep;
          b.textContent = T(sec.name, lang);
          nav.appendChild(b);
        }
      });
    }
    // 日历文案
    var cb = document.getElementById("calBtnText"); if (cb) cb.textContent = i18n.calBtn;
    var cw = document.getElementById("calWeek");
    if (cw) { cw.innerHTML = ""; i18n.calWeek.forEach(function (w) { var s = document.createElement("span"); s.textContent = w; cw.appendChild(s); }); }
    var cf = document.getElementById("calFoot"); if (cf) cf.textContent = i18n.calFoot;
    // 语言切换器（国旗触发 + 下拉）
    var ls = document.getElementById("langSwitch");
    if (ls) {
      ls.className = "lang-switch" + (langOpen ? " open" : "");
      ls.innerHTML = "";
      var trig = document.createElement("button");
      trig.type = "button"; trig.className = "lang-trigger"; trig.id = "langTrigger";
      trig.setAttribute("aria-haspopup", "true");
      trig.setAttribute("aria-expanded", langOpen ? "true" : "false");
      trig.innerHTML = flag(curLang) + '<span class="caret">▾</span>';
      trig.addEventListener("click", function (e) {
        e.stopPropagation();
        langOpen = !langOpen;
        ls.classList.toggle("open", langOpen);
        trig.setAttribute("aria-expanded", langOpen ? "true" : "false");
      });
      ls.appendChild(trig);
      var menu = document.createElement("div");
      menu.className = "lang-menu"; menu.setAttribute("role", "menu");
      LANGS.forEach(function (l) {
        var item = document.createElement("button");
        item.type = "button"; item.className = "lang-item" + (l === curLang ? " sel" : "");
        item.setAttribute("role", "menuitem"); item.setAttribute("data-lang", l);
        item.innerHTML = flag(l) + '<span class="lbl">' + LANG_LABEL_FULL[l] + "</span>";
        item.addEventListener("click", function (e) {
          e.stopPropagation();
          setLang(l);
        });
        menu.appendChild(item);
      });
      ls.appendChild(menu);
    }
  }

  function renderContent(lang) {
    var i18n = I18N[lang];
    var html = "";
    // 精选
    var sp = BRIEFING.spotlight;
    html += '<section class="spotlight" id="pick">'
      + '<div class="badge"><i></i>' + esc(T(sp.badge, lang)) + "</div>"
      + "<h2>" + titleHtml(sp.title, sp.hl, lang) + "</h2>"
      + '<div class="body">' + esc(T(sp.body, lang)) + "</div>"
      + '<div class="why"><b>' + esc(i18n.why) + "</b>" + esc(T(sp.why, lang)) + "</div>"
      + "</section>";
    // 分类
    html += '<div class="grid">';
    BRIEFING.sections.forEach(function (sec) {
      html += '<section class="card" id="' + sec.key + '" style="--ac:' + sec.color + "; --ac-deep:" + sec.deep + ';">'
        + '<div class="sec-head"><span class="sec-num">' + sec.num + "</span>"
        + "<h3>" + esc(T(sec.name, lang)) + "</h3>"
        + '<span class="en">' + sec.key.toUpperCase() + "</span></div>";
      (sec.items || []).forEach(function (it) {
        html += '<div class="item">';
        html += '<div class="t"><span class="idx">' + it.idx + "</span>";
        if (it.tag) html += '<span class="tag">' + esc(it.tag[lang] != null ? it.tag[lang] : i18n.tag) + "</span>";
        html += titleHtml(it.title, it.hl, lang) + "</div>";
        html += '<div class="d">' + esc(T(it.body, lang)) + "</div>";
        html += '<div class="why"><b>' + esc(i18n.why) + "</b>" + esc(T(it.why, lang)) + "</div>";
        html += "</div>";
      });
      html += "</section>";
    });
    html += "</div>";
    var content = document.getElementById("content");
    if (content) content.innerHTML = html;
    // 页脚
    var risk = document.getElementById("risk");
    if (risk) risk.textContent = T(BRIEFING.risk, lang);
  }

  function setLang(lang) {
    if (LANGS.indexOf(lang) < 0) lang = "zh";
    curLang = lang;
    langOpen = false;
    try { localStorage.setItem("timab_lang", lang); } catch (e) {}
    renderChrome(lang);
    renderContent(lang);
  }

  /* ===== 往期日历（保留原逻辑，文案随语言） ===== */
  function initCalendar() {
    var btn = document.getElementById("calBtn");
    var pop = document.getElementById("calPop");
    var grid = document.getElementById("calGrid");
    var title = document.getElementById("calTitle");
    if (!btn || !pop || !grid || !title) return;

    var parts = BRIEFING.date.split("-");
    var todayKey = parts[0].slice(2) + parts[1] + parts[2];
    var cur = { y: +parts[0], m: +parts[1] };
    var has = {};
    for (var i = 0; i < ARCHIVE_DATES.length; i++) { has[ARCHIVE_DATES[i]] = 1; }
    var HIST_BASE = /\/history\//.test(location.pathname) ? "./" : "history/";

    function ckey(y, m, d) { return String(y).slice(2) + pad(m) + pad(d); }

    function render() {
      var i18n = I18N[curLang];
      title.textContent = i18n.calTitle(cur.y, cur.m);
      grid.innerHTML = "";
      var start = new Date(cur.y, cur.m - 1, 1).getDay();
      var days = new Date(cur.y, cur.m, 0).getDate();
      for (var b = 0; b < start; b++) {
        var blank = document.createElement("span");
        blank.className = "cal-cell is-empty"; grid.appendChild(blank);
      }
      for (var d = 1; d <= days; d++) {
        var k = ckey(cur.y, cur.m, d);
        var cell = document.createElement("span");
        cell.className = "cal-cell" + (has[k] ? " has" : "") + (k === todayKey ? " is-today" : "");
        cell.textContent = d;
        if (has[k]) {
          cell.setAttribute("role", "link"); cell.setAttribute("tabindex", "0");
          cell.title = cur.y + "-" + pad(cur.m) + "-" + pad(d) + " 存档";
          (function (target) {
            var go = function () { window.open(HIST_BASE + target + ".html", "_blank", "noopener"); };
            cell.addEventListener("click", go);
            cell.addEventListener("keydown", function (e) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); go(); } });
          })(k);
        }
        grid.appendChild(cell);
      }
    }
    function toggle(open) {
      pop.hidden = !open;
      btn.setAttribute("aria-expanded", open ? "true" : "false");
      if (open) render();
    }
    btn.addEventListener("click", function (e) { e.stopPropagation(); toggle(pop.hidden); });
    document.getElementById("calPrev").addEventListener("click", function () { cur.m--; if (cur.m < 1) { cur.m = 12; cur.y--; } render(); });
    document.getElementById("calNext").addEventListener("click", function () { cur.m++; if (cur.m > 12) { cur.m = 1; cur.y++; } render(); });
    document.addEventListener("click", function (e) { if (!pop.hidden && !pop.contains(e.target)) toggle(false); });
    document.addEventListener("keydown", function (e) { if (e.key === "Escape" && !pop.hidden) toggle(false); });
  }

  /* ===== 启动 ===== */
  function boot() {
    curLang = detectLang();
    renderChrome(curLang);
    renderContent(curLang);
    initCalendar();
    // 关闭语言下拉：点击外部 / Esc
    document.addEventListener("click", function (e) {
      var ls = document.getElementById("langSwitch");
      if (ls && langOpen && !ls.contains(e.target)) {
        langOpen = false;
        ls.classList.remove("open");
        var t = document.getElementById("langTrigger");
        if (t) t.setAttribute("aria-expanded", "false");
      }
    });
    document.addEventListener("keydown", function (e) {
      if (e.key === "Escape" && langOpen) {
        langOpen = false;
        var ls = document.getElementById("langSwitch");
        if (ls) ls.classList.remove("open");
        var t = document.getElementById("langTrigger");
        if (t) t.setAttribute("aria-expanded", "false");
      }
    });
  }
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", boot);
  } else { boot(); }
})();
</script>
