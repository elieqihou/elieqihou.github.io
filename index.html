一天止步首轮。中国 16 岁小将孙心然以 6 比 3、6 比 4 直落两盘击败世界排名第 80 位的泰国选手萨王凯，取得职业生涯第二场对阵世界前 100 选手的胜利，并豪取 6 连胜。", "en": "In the first round of the 2026 Guangzhou Open on 27 October, 46-year-old Venus Williams lost 2-6, 2-6 to 18-year-old Austrian Lilli Tagger, a 28-year age gap, the largest on the WTA tour this season, extending her losing streak to 16 matches. 2020 Australian Open champion Sofia Kenin also went out in three sets the same day, so two Grand Slam winners fell in the first round. China's 16-year-old Sun Xinran beat Thailand's Sawangkaew, ranked 80th, 6-3, 6-4 for her second career win over a top-100 player and a sixth straight victory.", "es": "En la primera ronda del Abierto de Cantón 2026, el 27 de octubre, Venus Williams, de 46 años, perdió 2-6 y 2-6 ante la austriaca Lilli Tagger, de 18, una diferencia de 28 años, la mayor del circuito WTA esta temporada, y suma 16 derrotas consecutivas. La campeona del Abierto de Australia 2020, Sofia Kenin, también cayó en tres sets ese día: dos ganadoras de Grand Slam eliminadas en primera ronda. La china Sun Xinran, de 16 años, batió a la tailandesa Sawangkaew, número 80 del mundo, por 6-3 y 6-4, su segunda victoria ante una top-100 y la sexta consecutiva.", "ja": "10月27日の広州オープン女子シングルス1回戦で、46歳のビーナス・ウィリアムズが18歳のオーストリア勢リリ・タガーに2-6、2-6で敗れ、今季 WTA 最大となる28歳差の対戦で16連敗となった。2020年全豪覇者のソフィア・ケニンも同日フルセットの末に敗退し、グランドスラム優勝経験者2人が初戦で消えた。中国16歳の孫心然は世界80位のタイ選手サワンケオを6-3、6-4で破り、トップ100相手の通算2勝目、6連勝とした。"}, "why": {"zh": "同一个球场里，46 岁的老将还在为一场胜利挣扎，16 岁的小将已经在赢世界前 80——这是职业网球最残酷也最动人的地方：签表不认资历。孙心然这场的意义不在比分，而在于她开始能稳定赢下「该赢的球」。", "en": "On the same courts a 46-year-old is still fighting for a single win while a 16-year-old is already beating the world No.80 — the cruellest and most moving thing about professional tennis: the draw does not recognise seniority. The point of Sun Xinran's result is not the scoreline but that she is starting to win the matches she is supposed to win.", "es": "En las mismas pistas, una veterana de 46 años sigue peleando por una victoria mientras una joven de 16 ya vence a la número 80: lo más cruel y lo más conmovedor del tenis profesional, porque el cuadro no reconoce la veteranía. Lo importante del resultado de Sun Xinran no es el marcador, sino que empieza a ganar los partidos que debe ganar.", "ja": "同じコートで、46歳は1勝のために苦しみ、16歳はすでに世界80位を破っている。これがプロテニスの最も残酷で最も胸を打つところだ。ドローは経歴を考慮しない。孫心然の価値はスコアではなく、「勝つべき試合」を着実に勝てるようになったことにある。"}}, {"idx": "05", "title": {"zh": "39 岁德约科维奇持外卡出战巴塞尔，全力冲击都灵年终总决赛席位", "en": "39-Year-Old Djokovic Takes Basel Wildcard in Push for Turin Finals Spot", "es": "Djokovic, de 39 años, juega Basilea con invitación para pelear por las Finales de Turín", "ja": "39歳ジョコビッチがバーゼルにワイルドカード出場 トリノ・ファイナルズ進出を狙う"}, "body": {"zh": "10 月 27 日，39 岁的德约科维奇抵达瑞士巴塞尔，参加这站室内硬地赛事。这是他 15 年来首次回到巴塞尔参赛，此前他以接受组委会外卡的方式确认出战。德约表示，目标是拿到更多积分、进入在都灵举行的 ATP 年终总决赛。本赛季末，瓦林卡、戈芬、孟菲尔斯等名将已经或即将告别赛场；德约科维奇则仍在为一站年终总决赛的席位而战。", "en": "Novak Djokovic, 39, arrived in Basel on 27 October to play the indoor hard-court event, his first appearance there in 15 years after accepting a wildcard from the organisers. Djokovic said his goal is to collect enough points to qualify for the ATP Finals in Turin. With Stan Wawrinka, David Goffin and Gael Monfils having retired or about to, Djokovic is still fighting for a place at the season finale.", "es": "Novak Djokovic, de 39 años, llegó el 27 de octubre a Basilea para disputar el torneo indoor sobre pista dura, su primera participación allí en 15 años tras aceptar una invitación de la organización. Djokovic dijo que su objetivo es sumar puntos suficientes para clasificarse para las Finales ATP de Turín. Mientras Stan Wawrinka, David Goffin y Gael Monfils se han retirado o están a punto de hacerlo, Djokovic sigue peleando por un puesto en el torneo de maestros.", "ja": "39歳のノバク・ジョコビッチが10月27日、スイス・バーゼルに到着し、屋内ハードコートの大会に出場する。15年ぶりのバーゼル復帰で、主催者からワイルドカードを受けて参戦が決まった。目標はポイントを積み上げ、トリノでの ATP ファイナルズ出場権を得ることだと語った。今季限りでワウリンカ、ゴファン、モンフィスらが引退または引退間近となる中、ジョコビッチはなお年間最終戦の席を争っている。"}, "why": {"zh": "24 座大满贯得主在 39 岁为一个年终总决赛席位打常规赛，这件事本身比任何告别仪式都更能说明职业体育的秩序：积分面前没有资历。也正因如此，他重返 15 年没去过的巴塞尔，才显得格外务实。", "en": "A 24-time Grand Slam champion playing a regular tour event at 39 for a place at the finals says more about the order of professional sport than any farewell ceremony: in front of ranking points, seniority counts for nothing. Which is exactly why returning to a tournament he had skipped for 15 years looks so pragmatic.", "es": "Que un campeón de 24 Grand Slams juegue a los 39 un torneo ordinario por un puesto en las Finales dice más del orden del deporte profesional que cualquier homenaje: ante los puntos, la veteranía no cuenta. Por eso mismo, volver a un torneo que había evitado 15 años resulta tan pragmático.", "ja": "四大大会24勝の選手が39歳で、年間最終戦の席位のために通常のツアー大会に出る。この事実はどんな引退セレモニーよりもプロスポーツの秩序を語っている。ポイントの前では経歴は通用しない。だからこそ、15年足を運ばなかったバーゼルに戻る姿が妙に現実的に映る。"}}]}, {"key": "hot", "num": "05", "color": "#6d28d9", "deep": "#4c1d95", "name": {"zh": "网络热点", "en": "TRENDING", "es": "TENDENCIAS", "ja": "ネット話題"}, "items": [{"idx": "01", "title": {"zh": "热搜第一：多家中国企业终止与姆巴佩合作，西甲联盟发表致歉声明", "en": "Top Trend: Chinese Firms End Mbappe Deals as La Liga Issues Apology", "es": "Tendencia principal: varias empresas chinas rompen con Mbappé y LaLiga se disculpa", "ja": "トレンド首位 中国企業がエムバペとの契約を終了、ラ・リーガが謝罪声明"}, "body": {"zh": "近日，效力于皇家马德里的法国球员姆巴佩在一段采访中的不当言论引发中国球迷强烈不满。10 月 27 日，蒙牛乳业、东鹏饮料、妙可蓝多先后发布声明，宣布即日起终止与姆巴佩的全部合作，并表示对任何伤害中国人民感情的言行坚决反对、零容忍。同日，西班牙足球甲级联赛官方微博发表声明，称对相关言论给中国球迷带来的冒犯与伤害深感遗憾，强调球员个人表达绝不代表联盟立场，并向中国球迷致歉，表示正与中国的合作伙伴及相关机构共同妥善处理。据报道，央视已暂停涉及西甲与姆巴佩的赛事播出，相关广告与视频下架；小红书表示正审查并下架带有其形象的宣传物料。姆巴佩本人随后发表道歉声明，称自己的言论欠妥，对中国人民及其历史怀有敬意。", "en": "Recent inappropriate remarks by Real Madrid and France forward Kylian Mbappe in an interview drew strong anger from Chinese fans. On 27 October, Mengniu Dairy, Dongpeng Beverage and Milkground each announced the immediate termination of all cooperation with Mbappe, saying they firmly oppose and have zero tolerance for anything that hurts the feelings of the Chinese people. The same day La Liga's official Weibo account issued a statement expressing deep regret for the offence and hurt caused to Chinese fans, stressing that a player's personal expression does not represent the league, apologising and saying it is working with Chinese partners and relevant institutions to handle the matter properly. Reports said CCTV had suspended broadcasts involving La Liga and Mbappe and pulled related advertising and videos, while Xiaohongshu said it was reviewing and removing promotional material featuring him. Mbappe later issued an apology, saying his remarks were inappropriate and that he holds deep respect for the Chinese people and their history.", "es": "Unas declaraciones inapropiadas del delantero francés del Real Madrid Kylian Mbappé en una entrevista provocaron un fuerte malestar entre los aficionados chinos. El 27 de octubre, Mengniu, Dongpeng y Milkground anunciaron la rescisión inmediata de toda colaboración con Mbappé y afirmaron que rechazan con tolerancia cero cualquier cosa que hiera los sentimientos del pueblo chino. Ese mismo día, la cuenta oficial de LaLiga en Weibo lamentó profundamente la ofensa y el daño causados a los aficionados chinos, subrayó que la expresión personal de un jugador no representa a la liga, pidió disculpas y dijo que trabaja con socios e instituciones chinas para resolverlo. Según los reportes, CCTV suspendió las emisiones con LaLiga y Mbappé y retiró publicidad y vídeos relacionados, y Xiaohongshu revisa y retira material promocional con su imagen. Mbappé emitió después una disculpa: sus palabras fueron inapropiadas y respeta profundamente al pueblo chino y su historia.", "ja": "レアル・マドリードとフランス代表のFWエムバペがインタビューでした不適切な発言が、中国のファンの強い反発を招いた。10月27日、蒙牛乳業、東鵬飲料、妙可藍多が相次いで、同日付でエムバペとのすべての協力を終了すると発表し、中国人民の感情を傷つける言動に断固反対し、一切容認しないとした。同日、スペイン・ラ・リーガの公式 Weibo は、中国のファンに与えた不快感と傷について深く遺憾に思い、選手個人の表現はリーグの立場を代表しないと強調し、謝罪するとともに、中国のパートナーや関係機関と適切に対処していると表明した。報道によれば、CCTV はラ・リーガとエムバペ関連の放送を停止し、広告や映像も取り下げた。小紅書（RED）も画像を使った宣伝素材を審査・削除しているとした。エムバペ本人も後に謝罪声明を出し、自分の発言は不適切で、中国人民とその歴史に深い敬意を抱いていると述べた。"}, "why": {"zh": "这件事的关键不在「某句话」，而在商业合约里的那条款外条款——代言买的是公众情感的使用权，一旦越界，解约速度会比签约速度快得多。对跨国品牌与运动员而言，中国市场的准入从来不只是销量问题。", "en": "The point is not any single sentence but the unwritten clause in every endorsement deal: what is bought is the right to use public affection, and once that line is crossed terminations move far faster than signings. For multinational brands and athletes alike, access to the Chinese market has never been only about sales.", "es": "La clave no es una frase concreta, sino la cláusula no escrita de todo contrato de patrocinio: se compra el derecho a usar el afecto público, y cuando se cruza la línea, las rescisones van mucho más rápido que las firmas. Para las marcas globales y los deportistas, el acceso al mercado chino nunca fue solo una cuestión de ventas.", "ja": "要点は個々の文言ではなく、代言契約に暗黙のうちに含まれる条項にある。買っているのは公衆の感情を使う権利であり、一線を越えれば契約解除の速さは締結の速さをはるかに上回る。グローバル企業にとっても選手にとっても、中国市場への参入は決して販売量だけの問題ではない。"}}, {"idx": "02", "title": {"zh": "新规明确：交互式网络电视不得播放开机广告，11 月 27 日起施行", "en": "New Rule Bans Start-Up Ads on IPTV Services From 27 November", "es": "Nueva norma: prohibidos los anuncios de arranque en la televisión IPTV desde el 27 de noviembre", "ja": "新規制 インタラクティブ TV の起動時広告を禁止、11月27日施行"}, "body": {"zh": "国家广播电视总局近日公布《交互式网络电视运营服务管理暂行规定》，要求交互式网络电视集成播控服务提供者坚持直播优先原则，实现开机看全屏直播功能，设置频道回看入口，不得播放开机广告等。《规定》自 2026 年 11 月 27 日起施行。", "en": "The National Radio and Television Administration has published interim rules on interactive network television operations, requiring integrated broadcast-control service providers to put live channels first, make the full-screen live channel available at start-up, provide a channel catch-up entry point and refrain from showing start-up advertisements. The rules take effect on 27 November 2026.", "es": "La Administración Nacional de Radio y Televisión publicó normas provisionales sobre la operación de la televisión interactiva, que obligan a los proveedores de control integrado de emisión a priorizar la emisión en directo, ofrecer el canal en directo a pantalla completa al encender, habilitar un acceso a la recuperación de programas y no mostrar anuncios de arranque. Las normas entran en vigor el 27 de noviembre de 2026.", "ja": "国家広播電視総局はこのほど、インタラクティブ型ネットワークテレビの運営に関する暫定規定を公表した。統合放送制御サービスの提供者に対し、生放送優先の原則を守り、起動時に全画面の生放送を表示し、チャンネルの見逃し再生の入口を設け、起動時広告などを流さないよう求める。規定は2026年11月27日から施行される。"}, "why": {"zh": "一条「不许放开机广告」的规定，实质是把电视开机第一屏的主权还给直播——过去十年，开机广告是硬件厂商与牌照方最稳的一块现金流，也是最常被投诉的一处。规定落地后，真正要观察的是硬件厂商怎么补这个口子。", "en": "A rule banning start-up ads effectively returns sovereignty over the first screen to live broadcasting. For a decade, start-up ads were the most reliable cash flow for hardware makers and licence holders, and also the most complained-about feature. What to watch now is how hardware makers plug the revenue hole.", "es": "Una norma que prohíbe los anuncios de arranque devuelve en la práctica la soberanía de la primera pantalla a la emisión en directo. Durante una década esos anuncios fueron el flujo de caja más estable para fabricantes y licenciatarios, y también lo más denunciado. Ahora hay que ver cómo los fabricantes tapan ese agujero de ingresos.", "ja": "起動時広告を禁じる規定は、実質的にテレビの最初の画面の主権を生放送に返すものだ。この10年、起動時広告は端末メーカーとライセンス事業者にとって最も安定したキャッシュフローであり、同時に最も苦情の多い機能でもあった。今後注目されるのは、メーカーがこの収入の穴をどう埋めるかだ。"}}, {"idx": "03", "title": {"zh": "大熊猫「萌兰」出现干呕、嘴角白沫，北京动物园连夜通报：未发现明显异常", "en": "Panda Meng Lan Seen Retching With Foam at Mouth; Beijing Zoo Says No Clear Abnormality", "es": "El panda Meng Lan fue visto con arcadas y espuma en la boca; el zoo de Pekín no halla anomalías claras", "ja": "パンダ「萌蘭」に嘔吐様の動きと口元の泡 北京動物園は「明らかな異常なし」と発表"}, "body": {"zh": "10 月 27 日晚，北京动物园官方微博回应大熊猫「萌兰」身体状况：27 日下午，「萌兰」在室外运动场持续休息，饲养与兽医人员密切关注并多次呼唤，动物未响应，约 19 时被收回内舍；随后工作人员对其采食、活动、精神、休息、排泄等情况全面观察，兽医同步采集粪便样本进行检测，经诊断评估未发现明显异常，目前状态平稳。园方已安排饲养、兽医人员专人值守，持续观察夜间情况，28 日早晨视情况外放展出。此前有网友发文称，「萌兰」下午加餐后出现精神萎靡、长时间趴卧，并伴有干呕、嘴角带白沫，呼吁园方尽快安排兽医检查并公开情况。", "en": "Beijing Zoo responded on its official Weibo account on the evening of 27 October to concerns about giant panda Meng Lan. That afternoon the panda rested continuously in the outdoor enclosure and did not respond when keepers and vets called; it was moved inside at about 19:00. Staff then observed its feeding, activity, alertness, rest and excretion, and vets collected faecal samples for testing. No clear abnormality was found and the panda is currently stable. Keepers and vets are on dedicated watch overnight, with outdoor display on the morning of the 28th subject to its condition. Earlier, social media users said Meng Lan had seemed listless after an afternoon feed, lying down for long periods with retching and foam at the mouth, and urged the zoo to arrange a veterinary check and disclose the findings.", "es": "El zoo de Pekín respondió en su cuenta oficial de Weibo la noche del 27 de octubre a las preocupaciones por el panda gigante Meng Lan. Esa tarde el animal descansó de forma continua en el recinto exterior y no respondió a las llamadas de cuidadores y veterinarios, por lo que fue trasladado al interior hacia las 19.00. Después se observaron su alimentación, actividad, estado de alerta, descanso y excreción, y los veterinarios tomaron muestras de heces. No se hallaron anomalías claras y el panda está estable. Hay personal dedicado vigilando durante la noche y la salida al exterior del día 28 se decidirá según su estado. Antes, usuarios de redes habían señalado que tras la comida de la tarde se mostró apático, echado mucho tiempo, con arcadas y espuma en la boca, y pidieron una revisión veterinaria y transparencia.", "ja": "北京動物園は10月27日夜、公式 Weibo でジャイアントパンダ「萌蘭」の体調について説明した。27日午後、萌蘭は屋外運動場で休み続け、飼育員と獣医が何度呼びかけても反応せず、19時頃に屋内へ収容した。その後、採食、活動、元気、休息、排せつの状況を全面的に観察し、獣医が同時に糞便サンプルを採取して検査。診断評価では明らかな異常は認められず、現在は状態が安定しているという。夜間は飼育員と獣医が専任で見守り、28日朝の屋外展示は状況を見て判断する。これに先立ち、SNS 利用者が、午後のおやつ後に元気がなく長時間伏せ、嘔吐様の動きや口元の泡が見られたと投稿し、獣医による検査と情報公開を求めていた。"}, "why": {"zh": "这次回应之所以被认可，是因为它给了具体动作和时间点：几点收回、采了什么样本、谁在值守。公众对动物园的信任，从来不是靠「一切正常」四个字，而是靠「我们做了什么、你可以自己看」。", "en": "The response worked because it gave concrete actions and times: when the panda was moved inside, what samples were taken, who is on watch. Public trust in a zoo never rests on the words everything is fine, but on what we did and you can see for yourself.", "es": "La respuesta funcionó porque dio acciones y horas concretas: cuándo se trasladó al animal, qué muestras se tomaron, quién vigila. La confianza del público en un zoo nunca se apoya en la frase todo está bien, sino en esto hicimos y puedes comprobarlo.", "ja": "この対応が評価されたのは、具体的な行動と時刻を示したからだ。何時に収容したか、どんな検体を採ったか、誰が見守っているか。動物園への信頼は「異常なし」という言葉ではなく、「何をしたか、自分で確認できる」という点に支えられる。"}}, {"idx": "04", "title": {"zh": "八旬老人小卖部遭恶意「仅退款」后续：店铺已闭店七八天", "en": "Elderly Shopkeeper Hit by Refund-Only Claims Has Kept Shop Shut for a Week", "es": "La anciana víctima de reembolsos sin devolución mantiene la tienda cerrada desde hace una semana", "ja": "80代店主が「返品なし返金」被害 店は1週間以上閉まったまま"}, "body": {"zh": "近日，陕西西安 80 多岁的「文花姥姥」经营怀旧零食小卖部，接连遇到买家签收商品后直接申请仅退款、留下零食并要求全额退款。10 月 27 日，看看新闻记者在现场看到，小店卷帘门已关闭七八天。周边商户称，事件在网上发酵后老人承受多方压力，上周选择闭店。老人 10 月 17 日曾发视频发问「啥是仅退款」，10 月 22 日接受采访时表示，引发争议的两单货品均由她与家人亲手打包，不存在过期、包装破损问题。「文花姥姥」账号 27 日更新称，又遭遇一次仅退款、赔了 16.8 元，对方已读不回。", "en": "An octogenarian shopkeeper in Xi'an, Shaanxi, known online as Grandma Wenhua, runs a nostalgic snack shop and has repeatedly faced buyers who, after receiving goods, file refund-only claims, keep the snacks and demand a full refund. On 27 October reporters from Kankan News found the shop's shutter down for seven or eight days. Nearby traders said the elderly owner closed last week under pressure after the case went viral. She had posted a video on 17 October asking what refund-only means, and said in a 22 October interview that both disputed orders were packed by her and her family and that the goods were neither expired nor damaged. Her account said on the 27th that she had suffered another refund-only claim, losing 16.8 yuan, with the buyer leaving her messages unread.", "es": "Una comerciante octogenaria de Xi'an, conocida en redes como la abuela Wenhua, regenta una tienda de aperitivos nostálgicos y se ha topado repetidamente con compradores que, tras recibir la mercancía, solicitan solo el reembolso, se quedan con los productos y exigen la devolución total. El 27 de octubre, periodistas de Kankan News comprobaron que la persiana llevaba siete u ocho días bajada. Comerciantes vecinos dijeron que la anciana cerró la semana pasada por la presión tras la viralización. El 17 de octubre había preguntado en un vídeo qué significa solo reembolso y el 22 declaró que los dos pedidos en disputa los empaquetó ella con su familia y que no estaban caducados ni dañados. Su cuenta informó el día 27 de otro caso, con 16,8 yuanes de pérdida y el comprador sin responder.", "ja": "陕西省西安で80代の「文花おばあちゃん」が営む駄菓子店が、商品を受け取った後に返品せず全額返金だけを求める手続きに相次いで見舞われた。10月27日、看看新聞の記者が現地で確認したところ、シャッターは7〜8日間閉まったままだった。周辺の店主によると、ネットで話題になった後、高齢の店主が各方面からの圧力を受け、先週閉店を選んだという。店主は10月17日に「返金だけとは何か」と動画で問いかけ、22日の取材では、物議を醸した2件はいずれも本人と家族が自ら梱包し、期限切れや破損はなかったと説明した。27日には再び同様の事例で16.8元の損失が出たと投稿し、相手は既読のまま返信がないという。"}, "why": {"zh": "「仅退款」本是保护消费者的规则，被滥用时却把成本压到了最不会维权的人身上。这件事真正该讨论的不是某笔 16.8 元，而是平台规则里的举证责任该由谁承担——当卖家是一位八旬老人，规则的中立性就开始显形。", "en": "Refund-only was designed to protect consumers, but when abused it pushes the cost onto those least able to defend themselves. The question worth debating is not one 16.8-yuan order but who carries the burden of proof under platform rules — when the seller is an 80-year-old, the supposed neutrality of the rules becomes visible.", "es": "El reembolso sin devolución se ideó para proteger al consumidor, pero su abuso traslada el coste a quien menos puede defenderse. El debate no es un pedido de 16,8 yuanes, sino quién asume la carga de la prueba en las reglas de la plataforma: cuando la vendedora tiene más de 80 años, la supuesta neutralidad se hace visible.", "ja": "「返品なし返金」は消費者を守るための仕組みだが、乱用されると最も抗弁できない人にコストが押し付けられる。議論すべきは16.8元の一件ではなく、プラットフォーム規則における立証責任を誰が負うかだ。売り手が80代の高齢者だと分かったとき、規則の「中立性」が姿を現す。"}}, {"idx": "05", "title": {"zh": "云南小伙结婚邀网友「撑场面」，两天接待近 200 人", "en": "Yunnan Groom Who Invited Strangers to His Wedding Hosts Nearly 200 in Two Days", "es": "El novio de Yunnan que invitó a desconocidos a su boda recibe a casi 200 personas en dos días", "ja": "雲南の新郎がネットで結婚式に招待 2日で約200人が来訪"}, "body": {"zh": "云南昭通小伙小徐称自己将在 10 月 31 日结婚，因家中亲戚少、全部凑起来只有两三桌，怕婚礼太冷清，便发视频邀请网友来喝喜酒「撑场面」。他 3 岁时父亲去世、5 岁母亲改嫁，由奶奶带大，奶奶也已去世。10 月 27 日他接受采访时表示，这两天已接待近 200 人，有人开着好车来、有人送来冰箱和烤火炉、有人带了整头猪，还有人帮忙请了厨师；此事已向当地村委会报备。彝良县文旅局表示，领导已带人员前往云丰村考察；洛旺乡政府称正在跟进对接；村委会表示，村里的道路能否承接外地来客仍需进一步考察。", "en": "A young man surnamed Xu in Zhaotong, Yunnan, plans to marry on 31 October. With few relatives — only two or three tables' worth — and worried the wedding would feel empty, he posted a video inviting strangers to come and fill the room. His father died when he was three, his mother remarried when he was five, and he was raised by his grandmother, who has also died. In an interview on 27 October he said he had hosted nearly 200 people in two days: some arrived in good cars, some brought refrigerators and space heaters, one brought a whole pig, and others helped hire a cook. He had reported the plan to the village committee. The Yiliang county culture and tourism bureau said officials had visited Yunfeng village to assess the situation; Luowang township government said it is following up; the village committee said it still needs to assess whether local roads can handle visitors from across the country.", "es": "Un joven de apellido Xu, de Zhaotong (Yunnan), se casa el 31 de octubre. Con pocos parientes —solo dos o tres mesas— y temiendo una boda vacía, publicó un vídeo invitando a desconocidos a llenar el lugar. Su padre murió cuando tenía tres años, su madre se volvió a casar cuando tenía cinco y lo crió su abuela, que también ha fallecido. En una entrevista el 27 de octubre dijo que había recibido a casi 200 personas en dos días: algunos llegaron en buenos coches, otros trajeron neveras y estufas, uno un cerdo entero y otros ayudaron a contratar a un cocinero. Había informado al comité de la aldea. La oficina de cultura y turismo del condado de Yiliang indicó que funcionarios visitaron la aldea de Yunfeng para evaluar la situación; el gobierno del municipio de Luowang sigue el caso; el comité aldeano dijo que aún debe evaluar si las carreteras pueden absorber a visitantes de todo el país.", "ja": "雲南省昭通の徐さん（仮名）は10月31日に結婚する。親戚が少なく集めても2〜3卓にしかならないため、式が寂しくなるのを心配し、ネットで見知らぬ人に披露宴への参加を呼びかける動画を投稿した。3歳で父を亡くし、5歳で母が再婚、祖母に育てられたがその祖母も他界している。10月27日の取材で、この2日間で約200人をもてなしたと説明。高級車で来る人、冷蔵庫や暖房器具を届ける人、豚を一頭持参する人、料理人を手配する人もいた。地元の村民委員会には事前に届け出ていた。彝良県文化観光局は幹部が雲豊村へ状況確認に赴いたとし、洛旺郷政府も対応を進めていると述べた。村民委員会は、全国から来る来客を村の道路が受け入れられるか、さらに検討が必要だとしている。"}, "why": {"zh": "一个「怕婚礼太冷清」的邀请，变成了一次陌生人的集体到场——这类故事之所以刷屏，是因为它回应了一种很普遍的孤独感：亲戚越来越少，仪式越来越轻。热度之后真正的考题交给地方：200 人的善意，需要有秩序来接住。", "en": "An invitation born of fear that the wedding would be too quiet turned into a collective arrival of strangers. Stories like this spread because they answer a common loneliness: fewer relatives, lighter rituals. After the attention, the real test passes to local government — 200 people's goodwill needs some order to hold it.", "es": "Una invitación nacida del miedo a una boda demasiado silenciosa se convirtió en una llegada colectiva de desconocidos. Estas historias se viralizan porque responden a una soledad común: menos parientes, rituales más livianos. Tras la atención, la prueba real pasa a las autoridades locales: la buena voluntad de 200 personas necesita orden para sostenerse.", "ja": "「式が寂しすぎるのでは」という不安から出た招待が、見知らぬ人々の集団来訪になった。こうした物語が拡散するのは、親戚が減り儀式が軽くなるという共通の孤独に応えているからだ。注目が集まった後の本当の課題は地元にある。200人の善意を受け止める秩序が必要だ。"}}]}, {"key": "ent", "num": "06", "color": "#db2777", "deep": "#a81a56", "name": {"zh": "娱乐八卦", "en": "ENTERTAINMENT", "es": "ESPECTÁCULOS", "ja": "エンタメ"}, "items": [{"idx": "01", "tag": {"zh": "进展"}, "title": {"zh": "《小城良方》爱奇艺热度破 9606 创医疗剧纪录，追剧团 17 斤伴手礼再上热搜", "en": "Small Town Remedy Hits 9,606 on iQIYI, a Medical-Drama Record, as 8.5 kg Gift Bags Trend", "es": "Small Town Remedy llega a 9.606 en iQIYI, récord del drama médico, y los obsequios de 8,5 kilos se vuelven tendencia", "ja": "「小城良方」iQIYI 熱度9606で医療ドラマ記録、8.5キロの記念品も話題に"}, "body": {"zh": "截至 10 月 27 日晚，肖战主演的《小城良方》爱奇艺站内实时热度达到 9606，刷新开播以来峰值，创下医疗题材剧集热度新纪录，位列电视剧热播榜第一、年度榜第三；CCTV-8 黄金档第一集实时收视率在 20 时 06 分破 2%，市占率超 10%。该剧 10 月 21 日起在 CCTV-8 每晚两集连播、爱奇艺同步上线，首集曾创 2026 年央八黄金档首集收视纪录（峰值 3.02%）。同日追剧团活动上，肖战以卷毛造型亮相、用东北话安利新剧，现场伴手礼重达 17 斤，「肖战伴手礼17斤」登上热搜。不过剧集口碑分化，爱奇艺站内评分 6.4。", "en": "By the evening of 27 October, Small Town Remedy, starring Xiao Zhan, had reached a real-time heat score of 9,606 on iQIYI, a record for a medical drama and the platform's top drama of the year to date, ranking first on the drama chart and third on the annual chart. The first episode in CCTV-8's prime-time slot passed a 2% real-time rating at 20:06 with more than 10% audience share. The series has aired two episodes a night on CCTV-8 since 21 October, streaming simultaneously on iQIYI; its premiere set a 2026 record for a CCTV-8 prime-time first episode with a peak of 3.02%. At a fan event the same day Xiao Zhan appeared with curly hair and promoted the show in a northeastern dialect, and gift bags weighing 17 jin (8.5 kg) became a trending topic. Reviews are mixed, with an iQIYI score of 6.4.", "es": "Hacia la noche del 27 de octubre, Small Town Remedy, protagonizada por Xiao Zhan, alcanzó un índice de popularidad en tiempo real de 9.606 en iQIYI, récord para un drama médico y el más visto de la plataforma en lo que va de año, primero en la lista de series y tercero en la anual. El primer episodio en el horario estelar de CCTV-8 superó el 2% de audiencia en tiempo real a las 20.06, con más del 10% de cuota. La serie emite dos capítulos por noche en CCTV-8 desde el 21 de octubre y en paralelo en iQIYI; su estreno marcó un récord de 2026 para un primer episodio de CCTV-8, con un pico del 3,02%. En un evento con fans ese día, Xiao Zhan apareció con el pelo rizado y promocionó la serie en dialecto del noreste, y las bolsas de regalo de 17 jin (8,5 kg) se volvieron tendencia. La crítica está dividida: 6,4 en iQIYI.", "ja": "10月27日夜の時点で、肖戦主演の「小城良方」は iQIYI のリアルタイム熱度が9606に達し、医療ドラマの記録を更新。ドラマランキング1位、年間ランキング3位となった。CCTV-8のゴールデンタイム第1話は20時06分にリアルタイム視聴率2％を超え、シェアは10％超。10月21日からCCTV-8で毎晩2話連続、iQIYIでも同時配信され、初回は2026年のCCTV-8ゴールデン初回視聴率記録（ピーク3.02％）を樹立した。同日のファンイベントでは、肖戦が巻き毛のスタイルで登場し東北弁で作品をPR。記念品が17斤（8.5キロ）あったことがトレンド入りした。評価は分かれ、iQIYI のスコアは6.4。"}, "why": {"zh": "收视破纪录与站内评分 6.4 同时成立，说明这部剧赢在「题材共情」而不是「完成度」：天才医生回小城重来，是很多打工人的自我投射。热度能否转成口碑，取决于后面十几集敢不敢把基层医疗的难处讲透，而不是停在烟火气的滤镜里。", "en": "A record rating and a 6.4 score can be true at once: the show wins on thematic empathy rather than execution. A gifted doctor starting over in a small town is a projection many workers make for themselves. Whether heat becomes reputation depends on whether the remaining episodes dare to explain what is actually hard about grassroots healthcare, instead of staying inside a warm filter.", "es": "Un récord de audiencia y un 6,4 pueden coexistir: la serie gana por empatía temática, no por ejecución. Un médico brillante que empieza de cero en un pueblo es la proyección de muchos trabajadores. Que el calor se convierta en reputación depende de si los episodios restantes se atreven a explicar qué es realmente difícil en la sanidad de base, en lugar de quedarse en un filtro cálido.", "ja": "視聴率記録と6.4というスコアは同時に成立する。この作品が勝っているのは完成度ではなく「題材への共感」だ。天才医師が小さな町でやり直す姿は、多くの働く人の自己投影になる。熱が評価に変わるかは、残りの回が地域医療の難しさをどこまで描けるかにかかっている。生活感のフィルターのまま終われば、熱は長続きしない。"}}, {"idx": "02", "title": {"zh": "《四渡》票房突破 3 亿元，创同类题材电影票房新纪录", "en": "Red Army Epic Sidu Passes 300 Million Yuan, a Record for Its Genre", "es": "La epopeya Sidu supera los 300 millones de yuanes, récord para su género", "ja": "映画「四渡」興収3億元突破 同種題材の記録を更新"}, "body": {"zh": "截至 10 月 27 日上午，红军长征题材电影《四渡》中国内地院线票房超过 3 亿元，观影人次超 922 万，创同类题材电影票房新纪录。影片 6 月 26 日登陆全国院线，以四渡赤水战役为叙事核心，依托贵州全域实景拍摄，上映 12 天票房突破 2 亿元，连续多日位居单日票房冠军。贵州全省累计票房约 3900 万元、约 137 万人次观影；广东、江苏、上海、四川、浙江、北京、山东、湖北 8 省市票房均突破 1000 万元，其中广东超 3500 万元。片方在影片未下线时即开放二级市场，通过送影进学校、进军营、进社区、进工厂矿区等方式扩大覆盖。截至 10 月 26 日，2026 年中国电影票房已突破 315 亿元，放映场次超 1.22 亿场，观影人次超 8 亿。", "en": "By the morning of 27 October, the Red Army Long March film Sidu had taken more than 300 million yuan at mainland Chinese cinemas with over 9.22 million admissions, a record for films of its genre. Released nationwide on 26 June and centred on the Four Crossings of the Chishui River, it was shot on location across Guizhou, passed 200 million yuan within 12 days and led the daily box office for many days. Guizhou accounted for about 39 million yuan and 1.37 million admissions, while Guangdong, Jiangsu, Shanghai, Sichuan, Zhejiang, Beijing, Shandong and Hubei each exceeded 10 million yuan, with Guangdong above 35 million. The producers opened a secondary market before the theatrical run ended, screening the film in schools, barracks, communities and factory districts. By 26 October, China's 2026 box office had passed 31.5 billion yuan with more than 122 million screenings and over 800 million admissions.", "es": "Hasta la mañana del 27 de octubre, la película sobre la Larga Marcha Sidu había recaudado más de 300 millones de yuanes en cines de China continental, con más de 9,22 millones de espectadores, récord para su género. Estrenada el 26 de junio y centrada en el cruce del río Chishui, se rodó en localizaciones de Guizhou, superó los 200 millones en 12 días y lideró la taquilla diaria durante varios días. Guizhou aportó unos 39 millones de yuanes y 1,37 millones de espectadores; Cantón, Jiangsu, Shanghái, Sichuan, Zhejiang, Pekín, Shandong y Hubei superaron cada uno los 10 millones, con Cantón por encima de 35. La productora abrió un mercado secundario antes del final de la exhibición, con pases en escuelas, cuarteles, comunidades y zonas industriales. Hasta el 26 de octubre, la taquilla china de 2026 superaba los 3.150 millones de yuanes, con más de 122 millones de proyecciones y 800 millones de espectadores.", "ja": "10月27日午前の時点で、紅軍の長征を描いた映画「四渡」の中国本土での興行収入は3億元を超え、観客動員は922万人超で、同種題材の記録を更新した。6月26日に全国公開され、四渡赤水の戦いを軸に貴州全土で実景撮影。公開12日で2億元を突破し、連日デイリー興収1位となった。貴州省だけで約3900万元、約137万人。広東、江蘇、上海、四川、浙江、北京、山東、湖北の8省市がそれぞれ1000万元を超え、広東は3500万元超。配給側は上映終了前に二次市場を開放し、学校や軍営、社区、工場鉱区への上映を進めた。10月26日時点で2026年の中国映画興収は315億元を超え、上映回数は1億2200万回超、観客動員は8億人超。"}, "why": {"zh": "3 亿元对商业片不算高，对红色题材却是天花板被顶开了一次。它的方法并不神秘：把战役拍成「决策过程」而不是「结论展示」，再靠二级市场把影院之外的观众接进来——这套组合，可能比票房数字更值得行业记。", "en": "Three hundred million is modest for a commercial film but a ceiling broken for a revolutionary-history film. The method is not mysterious: shoot the battle as a process of decision-making rather than a display of conclusions, then use a secondary market to reach audiences outside cinemas. That combination may be more worth remembering than the number.", "es": "Trescientos millones es poco para una película comercial, pero supone romper un techo para el cine histórico revolucionario. El método no es misterioso: filmar la batalla como un proceso de decisión y no como una exhibición de conclusiones, y usar un mercado secundario para llegar a públicos fuera de las salas. Esa combinación quizá valga más que la cifra.", "ja": "3億元は商業映画としては大きくないが、革命歴史題材としては天井を押し上げた一撃だ。方法は神秘でもない。戦いを「結論の提示」ではなく「意思決定の過程」として描き、二次市場で映画館の外の観客に届ける。この組み合わせのほうが、数字よりも業界にとって記憶に値する。"}}, {"idx": "03", "title": {"zh": "薛之谦「万兽之王」巡演无锡站 10 月 27 日开预售，规划覆盖四大洲 10 国 62 城", "en": "Joker Xue Opens Wuxi Presale for His Tour, Planned for 62 Cities in 10 Countries", "es": "Joker Xue abre la venta anticipada de Wuxi en una gira prevista por 62 ciudades de 10 países", "ja": "薛之謙のツアー無錫公演が10月27日先行販売 4大陸10カ国62都市を計画"}, "body": {"zh": "10 月 27 日 17 时 17 分，薛之谦「万兽之王」巡回演唱会无锡站开启预售，演出定于 11 月 13 日至 15 日、11 月 20 日至 22 日在无锡连开六场，后三场于 10 月 28 日 17 时 17 分开售。此前贵阳站 10 月 17、18、24、25 日四场连开，售票超 27.3 万张；贵阳站点歌环节一位男歌迷代女友上台合唱《我好像在哪见过你》，视频在短视频平台获近 300 万点赞。厦门站定于 10 月 31 日至 11 月 8 日。巡演版图已延伸至美国、加拿大、英国、新加坡、马来西亚、澳大利亚、法国、新西兰、泰国等地，标注为四大洲 10 国 62 城 145 场。", "en": "Presale for the Wuxi leg of Joker Xue's Beast King tour opened at 17:17 on 27 October, with six shows on 13-15 and 20-22 November; the later three go on sale at 17:17 on 28 October. The four Guiyang shows on 17, 18, 24 and 25 October sold more than 273,000 tickets, and a moment when a male fan sang in place of his girlfriend during the request segment drew nearly three million likes on short video. Xiamen runs from 31 October to 8 November. The tour now extends to the United States, Canada, Britain, Singapore, Malaysia, Australia, France, New Zealand and Thailand, billed as 145 shows in 62 cities across 10 countries on four continents.", "es": "La venta anticipada de la etapa de Wuxi de la gira Beast King de Joker Xue se abrió a las 17.17 del 27 de octubre, con seis conciertos los días 13-15 y 20-22 de noviembre; los tres últimos salen a la venta a las 17.17 del 28 de octubre. Los cuatro conciertos de Guiyang (17, 18, 24 y 25 de octubre) vendieron más de 273.000 entradas, y un momento en que un fan cantó en lugar de su novia durante la sección de peticiones superó los tres millones de me gusta en vídeo corto. Xiamen va del 31 de octubre al 8 de noviembre. La gira se extiende a Estados Unidos, Canadá, Reino Unido, Singapur, Malasia, Australia, Francia, Nueva Zelanda y Tailandia, con 145 conciertos en 62 ciudades de 10 países en cuatro continentes.", "ja": "薛之謙のツアー「万獣之王」の無錫公演の先行販売が10月27日17時17分に始まった。11月13〜15日と20〜22日の6公演で、後の3公演は10月28日17時17分に販売開始。貴陽公演は10月17、18、24、25日の4公演で27万3000枚以上を販売。リクエストコーナーで男性ファンが彼女の代わりに歌った映像はショート動画で300万近い「いいね」を集めた。アモイ公演は10月31日から11月8日。ツアーはアメリカ、カナダ、イギリス、シンガポール、マレーシア、オーストラリア、フランス、ニュージーランド、タイにも広がり、4大陸10カ国62都市145公演と銘打たれている。"}, "why": {"zh": "巡演从一线城市体育馆打到六线七线城市体育场，是这两年演出市场最明显的变化：票根经济正在下沉，而歌手的体力成了最稀缺的资源。贵阳站那句「不知道下次再来是什么年纪」，说的其实是这个行业的结构性难题。", "en": "Tours moving from arenas in first-tier cities to stadiums in sixth- and seventh-tier ones is the clearest change in the live market these two years: the ticket economy is sinking downward, and a singer's stamina has become the scarcest resource. That line in Guiyang — not knowing what age he will be next time — is really about a structural problem in the industry.", "es": "Que las giras pasen de pabellones de ciudades de primera a estadios de ciudades de sexta y séptima categoría es el cambio más claro del mercado en directo en dos años: la economía de las entradas se descentraliza y la resistencia física del artista se vuelve el recurso más escaso. La frase en Guiyang —no saber qué edad tendrá la próxima vez— habla de un problema estructural del sector.", "ja": "ツアーが一線都市のアリーナから六線・七線都市のスタジアムへ広がるのは、この2年のライブ市場で最も明確な変化だ。チケット経済が下へ浸透し、歌手の体力が最も希少な資源になった。貴陽での「次に来るのが何歳か分からない」という言葉は、この業界の構造的な難題を語っている。"}}, {"idx": "04", "title": {"zh": "悬疑短剧《谜林》10 月 27 日爱奇艺开播，VIP 首更 8 集", "en": "Mystery Short Drama Lost Forest Debuts on iQIYI With Eight Episodes for VIPs", "es": "El drama corto de misterio Lost Forest se estrena en iQIYI con ocho episodios para suscriptores", "ja": "ミステリー短編ドラマ「謎林」が10月27日 iQIYI で配信開始、VIP は初回8話"}, "body": {"zh": "10 月 27 日 12 时，网剧《谜林》在爱奇艺、奇异果 TV 全网独播，VIP 会员首更 8 集，10 月 28 日 12 时更新第 9 至 12 集，10 月 30 日起每日 12 时更新 2 集。该剧由郭金也担任编剧兼导演，吴佳怡、晏紫东领衔主演，刘润南特别出演，以林场为背景，围绕横跨十六年的旧案与复仇迷局展开，全程在牡丹江林海雪原实景拍摄。剧集以横屏短剧形态推出，制作团队有长剧经验。", "en": "The online drama Lost Forest launched exclusively on iQIYI and Qiyiguo TV at noon on 27 October, with eight episodes for VIP members on day one, episodes nine to twelve at noon on 28 October and two episodes daily from 12:00 on 30 October. Written and directed by Guo Jinye and starring Wu Jiayi and Yan Zidong with a special appearance by Liu Runnan, it is set in a forestry station and built around a sixteen-year-old case and a revenge puzzle, shot entirely on location in the forests and snow of Mudanjiang. It is presented as a horizontal-format short drama made by a team with experience in full-length series.", "es": "El drama en línea Lost Forest se estrenó en exclusiva en iQIYI y Qiyiguo TV al mediodía del 27 de octubre, con ocho episodios para suscriptores VIP el primer día, los episodios nueve a doce al mediodía del 28 y dos episodios diarios desde las 12.00 del 30 de octubre. Escrito y dirigido por Guo Jinye, protagonizado por Wu Jiayi y Yan Zidong con la participación especial de Liu Runnan, se ambienta en un centro forestal y gira en torno a un caso de hace dieciséis años y un enigma de venganza, rodado íntegramente en los bosques y la nieve de Mudanjiang. Se presenta como drama corto en formato horizontal, realizado por un equipo con experiencia en series largas.", "ja": "配信ドラマ「謎林」が10月27日正午、iQIYI と奇异果TV で独占配信を開始した。VIP 会員は初日に8話、10月28日正午に第9〜12話、10月30日からは毎日12時に2話ずつ更新される。脚本・監督は郭金也、主演は呉佳怡と晏紫東、劉潤南が特別出演。林業作業所を舞台に、16年にわたる旧事件と復讐の謎を描き、牡丹江の林海雪原で全編実景撮影された。長編ドラマの経験を持つ制作陣による横型ショートドラマとして打ち出されている。"}, "why": {"zh": "值得注意的不是又一部悬疑剧，而是「长剧班底 + 横屏短剧」这个组合：当短剧开始用电影级的实景和编导合一的配置，它抢的就不只是碎片时间，而是长剧的中间档预算。悬疑是最适合这个形态的类型——十六年的案子，两集就能翻一次。", "en": "The interesting part is not another mystery drama but the pairing of a long-form production team with a horizontal short drama. Once short dramas use film-grade locations and a single writer-director, they are competing not just for fragmented time but for the mid-budget tier of long series. Mystery suits the format best: a sixteen-year-old case can be overturned every two episodes.", "es": "Lo interesante no es otro drama de misterio, sino la combinación de un equipo de series largas con un drama corto horizontal. Cuando el formato corto usa localizaciones de nivel cinematográfico y un único guionista-director, compite no solo por el tiempo fragmentado, sino por el presupuesto medio de las series largas. El misterio es el género que mejor se adapta: un caso de dieciséis años puede girar cada dos episodios.", "ja": "注目すべきは、またミステリーかということではなく、「長編ドラマの制作陣＋横型ショートドラマ」という組み合わせだ。映画並みの実景と脚本・監督兼任の体制を短編が取ると、奪うのは断片時間だけでなく、長編の中間予算になる。ミステリーはこの形式に最も向いている。16年の事件なら2話ごとにひっくり返せる。"}}, {"idx": "05", "title": {"zh": "陈赫张子萱瑞士度假路透登上热搜，「这次没打码」成焦点", "en": "Chen He and Zhang Zixuan Holiday Footage Trends as the Blurring Finally Stops", "es": "Un vídeo de Chen He y Zhang Zixuan de vacaciones se vuelve tendencia: ya no difuminan sus rostros", "ja": "陳赫と張子萱の休暇映像がトレンド 「今回は顔を隠さない」に注目"}, "body": {"zh": "近日，陈赫与张子萱 2026 年初在瑞士家庭度假的路透画面在网络流传并登上热搜。画面中张子萱见到陈赫后小跑扑进他怀里，陈赫一手提着购物袋一手接住，随后还背着她逛超市，两人互称「老张」「小陈」。此前近十年，两人在 vlog 中互相打码、回避同框，因此这次全程无遮挡被视为心态放开的标志。截至 10 月 28 日，双方本人及团队均未就此轮热搜作出正式回应。舆论呈两极：一部分网友认为日常细节装不出来、应尊重当下的家庭生活，另一部分则重提 2015 年前后的感情时间线争议。", "en": "Footage from a family holiday in Switzerland in early 2026 featuring Chen He and Zhang Zixuan has circulated online and trended. In the clip Zhang runs and throws herself into his arms as he carries shopping bags, and he later gives her a piggyback in a supermarket; the two call each other Lao Zhang and Xiao Chen. For nearly a decade the couple had blurred each other out in vlogs and avoided appearing together, so the unblurred footage is seen as a sign of letting go. As of 28 October neither they nor their teams had responded officially. Reaction is split: some say daily details cannot be faked and the family's present life should be respected, while others revisit the controversy over the timeline of their relationship around 2015.", "es": "Un vídeo de unas vacaciones familiares en Suiza a comienzos de 2026 con Chen He y Zhang Zixuan circuló en redes y se volvió tendencia. En las imágenes ella corre y se lanza a sus brazos mientras él lleva bolsas de la compra, y después la lleva a cuestas por un supermercado; se llaman Lao Zhang y Xiao Chen. Durante casi una década la pareja se difuminaba el rostro en sus vlogs y evitaba aparecer junta, por lo que la ausencia de difuminado se interpreta como un cambio de actitud. Hasta el 28 de octubre ni ellos ni sus equipos habían respondido oficialmente. La reacción está dividida: algunos sostienen que los detalles cotidianos no se fingen y que debe respetarse su vida familiar actual, mientras otros revisitan la polémica sobre la cronología de su relación en torno a 2015.", "ja": "2026年初のスイスでの家族旅行を捉えた陳赫と張子萱の映像がネットで拡散し、トレンド入りした。映像では張子萱が走って陳赫の胸に飛び込み、陳赫は買い物袋を片手に受け止める。その後スーパーでおんぶする姿もあり、二人は「老張」「小陳」と呼び合っている。この10年近く、二人は vlog で互いの顔を隠し、同じ画面に映るのを避けてきたため、今回は無加工であることが心境の変化と受け止められた。10月28日時点で本人と所属チームは公式にコメントしていない。反応は二分され、日常の細部は演技できないとして今の家庭生活を尊重する声がある一方、2015年前後の交際の時系列をめぐる議論を再び持ち出す声もある。"}, "why": {"zh": "一条没有当事人回应的路透能挂上热搜，说明公众关注的早已不是这段婚姻本身，而是「打码」与「不打码」之间的那个心理转折——从躲避目光到接受目光。互联网的记忆确实很长，但生活的前进往往不以此为刻度。", "en": "That footage with no comment from either party can trend shows the public is no longer watching the marriage but the psychological turn between blurring and not blurring — from avoiding stares to accepting them. The internet's memory is indeed long, but life rarely advances on that clock.", "es": "Que un vídeo sin respuesta de los protagonistas sea tendencia muestra que el público ya no mira el matrimonio sino el giro psicológico entre difuminar y no difuminar: de evitar miradas a aceptarlas. La memoria de internet es larga, pero la vida no avanza según ese reloj.", "ja": "当事者のコメントがない映像がトレンド入りするのは、世間が見ているのが結婚そのものではなく、「顔を隠す」と「隠さない」の間の心理的な転換――視線を避けることから受け入れることへ――だからだ。ネットの記憶は確かに長いが、暮らしはその時計では進まない。"}}]}], "risk": {"zh": "风险提示：本简报仅作信息汇总，其中涉及的数据不构成任何投资建议。", "en": "Disclaimer: This briefing is a news digest only. Data mentioned does not constitute any investment advice.", "es": "Aviso: este resumen es solo una recopilación informativa; los datos citados no constituyen asesoramiento de inversión.", "ja": "リスク表示：本ダイジェストは情報まとめであり、記載データは投資助言を構成しません。"}}/*__END__*/;

  /* ===== 工具 ===== */
  function T(obj, lang) {
    if (obj == null) return "";
    if (typeof obj === "string") return obj;

  function fmtDate(d, lang) {
    var y = d.getFullYear(), m = d.getMonth() + 1, day = d.getDate();

  /* ===== 语言检测：localStorage > 浏览器语言 > 系统时区 > 中文 ===== */

      + "<h2>" + titleHtml(sp.title, sp.hl, lang) + "</h2>"
      + '<div class="body">' + esc(T(sp.body, lang)) + "</div>"
      + '<div class="why"><b>' + esc(i18n.why) + "</b>" + esc(T(sp.why, lang)) + "</div>"
      + "</section>";
    // 分类
    html += '<div class="grid">';
    BRIEFING.sections.forEach(function (sec) {
      html += '<section class="card" id="' + sec.key + '" style="--ac:' + sec.color + "; --ac-deep:" + sec.deep + ';">'
        + '<div class="sec-head"><span class="sec-num">' + sec.num + "</span>"
        + "<h3>" + esc(T(sec.name, lang)) + "</h3>"
        + '<span class="en">' + sec.key.toUpperCase() + "</span></div>";
      (sec.items || []).forEach(function (it) {
        html += '<div class="item">';
        html += '<div class="t"><span class="idx">' + it.idx + "</span>";
        if (it.tag) html += '<span class="tag">' + esc(it.tag[lang] != null ? it.tag[lang] : i18n.tag) + "</span>";
        html += titleHtml(it.title, it.hl, lang) + "</div>";
        html += '<div class="d">' + esc(T(it.body, lang)) + "</div>";
        html += '<div class="why"><b>' + esc(i18n.why) + "</b>" + esc(T(it.why, lang)) + "</div>";
        html += "</div>";
      });
      html += "</section>";
    });
    html += "</div>";
    var content = document.getElementById("content");
    if (content) content.innerHTML = html;
    // 页脚
    var risk = document.getElementById("risk");
    if (risk) risk.textContent = T(BRIEFING.risk, lang);
  }

  function setLang(lang) {
    if (LANGS.indexOf(lang) < 0) lang = "zh";
    curLang = lang;
    langOpen = false;
    try { localStorage.setItem("timab_lang", lang); } catch (e) {}
    renderChrome(lang);
    renderContent(lang);
  }

  /* ===== 往期日历（保留原逻辑，文案随语言） ===== */
  function initCalendar() {
    var btn = document.getElementById("calBtn");
    var pop = document.getElementById("calPop");
    var grid = document.getElementById("calGrid");
    var title = document.getElementById("calTitle");
    if (!btn || !pop || !grid || !title) return;

    var parts = BRIEFING.date.split("-");
    var todayKey = parts[0].slice(2) + parts[1] + parts[2];
    var cur = { y: +parts[0], m: +parts[1] };
    var has = {};
    for (var i = 0; i < ARCHIVE_DATES.length; i++) { has[ARCHIVE_DATES[i]] = 1; }
    var HIST_BASE = /\/history\//.test(location.pathname) ? "./" : "history/";

    function ckey(y, m, d) { return String(y).slice(2) + pad(m) + pad(d); }

    function render() {
      var i18n = I18N[curLang];
      title.textContent = i18n.calTitle(cur.y, cur.m);
      grid.innerHTML = "";
      var start = new Date(cur.y, cur.m - 1, 1).getDay();
      var days = new Date(cur.y, cur.m, 0).getDate();
      for (var b = 0; b < start; b++) {
        var blank = document.createElement("span");
        blank.className = "cal-cell is-empty"; grid.appendChild(blank);
      }
      for (var d = 1; d <= days; d++) {
        var k = ckey(cur.y, cur.m, d);
        var cell = document.createElement("span");
        cell.className = "cal-cell" + (has[k] ? " has" : "") + (k === todayKey ? " is-today" : "");
        cell.textContent = d;
        if (has[k]) {
          cell.setAttribute("role", "link"); cell.setAttribute("tabindex", "0");
          cell.title = cur.y + "-" + pad(cur.m) + "-" + pad(d) + " 存档";
          (function (target) {
            var go = function () { window.open(HIST_BASE + target + ".html", "_blank", "noopener"); };
            cell.addEventListener("click", go);
            cell.addEventListener("keydown", function (e) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); go(); } });
          })(k);
        }
        grid.appendChild(cell);
      }
    }
    function toggle(open) {
      pop.hidden = !open;
      btn.setAttribute("aria-expanded", open ? "true" : "false");
      if (open) render();
    }
    btn.addEventListener("click", function (e) { e.stopPropagation(); toggle(pop.hidden); });
    document.getElementById("calPrev").addEventListener("click", function () { cur.m--; if (cur.m < 1) { cur.m = 12; cur.y--; } render(); });
    document.getElementById("calNext").addEventListener("click", function () { cur.m++; if (cur.m > 12) { cur.m = 1; cur.y++; } render(); });
    document.addEventListener("click", function (e) { if (!pop.hidden && !pop.contains(e.target)) toggle(false); });
    document.addEventListener("keydown", function (e) { if (e.key === "Escape" && !pop.hidden) toggle(false); });
  }

  /* ===== 启动 ===== */
  function boot() {
    curLang = detectLang();
    renderChrome(curLang);
    renderContent(curLang);
    initCalendar();
    // 关闭语言下拉：点击外部 / Esc
    document.addEventListener("click", function (e) {
      var ls = document.getElementById("langSwitch");
      if (ls && langOpen && !ls.contains(e.target)) {
        langOpen = false;
        ls.classList.remove("open");
        var t = document.getElementById("langTrigger");
        if (t) t.setAttribute("aria-expanded", "false");
      }
    });
    document.addEventListener("keydown", function (e) {
      if (e.key === "Escape" && langOpen) {
        langOpen = false;
        var ls = document.getElementById("langSwitch");
        if (ls) ls.classList.remove("open");
        var t = document.getElementById("langTrigger");
        if (t) t.setAttribute("aria-expanded", "false");
      }
    });
  }
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", boot);
  } else { boot(); }
})();
</script>
</body>
</html>
