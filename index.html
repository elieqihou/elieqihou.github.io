ng teams are often separated by exactly this choice — who gets to decide the final five seconds.", "es": "Una sola jugada retrata ambos proyectos: San Antonio confía el último ataque a un Wembanyama de 2,24 metros y Houston responde con su alero más atlético. A los equipos jóvenes los separa a menudo esa elección: quién decide los últimos cinco segundos.", "ja": "その一つのプレーに両チームの再建策が重なる。サンアントニオは最後の攻撃を2メートル24のウェンバンヤマに託し、ヒューストンは最も身体能力の高いウィングで応じた。若いチームの明暗は、最後の5秒を誰に委ねるかで分かれることが多い。"}}]}, {"key": "hot", "num": "05", "color": "#6d28d9", "deep": "#4c1d95", "name": {"zh": "网络热点", "en": "TRENDING", "es": "TENDENCIAS", "ja": "ネット話題"}, "items": [{"idx": "01", "tag": {"zh": "进展"}, "title": {"zh": "皇马致函央视道歉，外交部回应“重视当事人作出的道歉”", "en": "Real Madrid Apologises to CCTV; Foreign Ministry Says It Values the Apology", "es": "El Real Madrid se disculpa ante CCTV y Exteriores dice valorar la disculpa", "ja": "レアル・マドリードがCCTVに謝罪 外交部「当事者の謝罪を重視する」"}, "body": {"zh": "北京时间 10 月 28 日，西班牙皇家马德里俱乐部通过西甲联盟致函中央广播电视总台，就其球员姆巴佩的负面言论向中国人民道歉。央视回应称，该言论触犯底线，不接受“个人主张”的解释，在道歉未到位前“一切免谈”；此前多家中国品牌已终止与姆巴佩的合作，央视全面叫停西甲赛事播出并下架相关广告。外交部发言人回应相关提问时表示，我们重视当事人作出的道歉。同日，海信回应与皇马的合作称，赞助区域仅限西班牙地区；西班牙媒体则开始估算该事件对球员商业价值的影响。", "en": "On 28 October Beijing time, Real Madrid wrote to China Media Group through La Liga to apologise to the Chinese people for remarks by its player Kylian Mbappé. CCTV responded that the remarks crossed a red line, that it would not accept an explanation framing them as personal opinion, and that nothing would be discussed until the apology was adequate; several Chinese brands had already ended deals with Mbappé and CCTV suspended La Liga broadcasts and pulled related advertising. A foreign ministry spokesperson said China values the apology made by the person concerned. Hisense said its Real Madrid sponsorship covers Spain only, while Spanish media began estimating the commercial damage.", "es": "El 28 de octubre, hora de Pekín, el Real Madrid escribió a China Media Group a través de LaLiga para disculparse ante el pueblo chino por las declaraciones de su jugador Kylian Mbappé. CCTV respondió que las palabras cruzaron una línea roja, que no aceptaría explicarlas como opinión personal y que no habría conversaciones hasta que la disculpa fuera adecuada; varias marcas chinas habían roto ya sus acuerdos y CCTV suspendió las retransmisiones y retiró publicidad. Un portavoz de Exteriores dijo que China valora la disculpa del interesado. Hisense aclaró que su patrocinio se limita a España.", "ja": "北京時間10月28日、スペインのレアル・マドリードはラ・リーガを通じて中国中央広播電視総台（CCTV）に書簡を送り、選手ムバッペの発言について中国人民に謝罪した。CCTVは、発言は一線を越えており「個人の主張」との説明は受け入れられないとし、謝罪が不十分なうちは協議しないと応じた。複数の中国ブランドが契約を終了し、CCTVはラ・リーガ中継を停止し関連広告も撤去した。外交部報道官は「当事者の謝罪を重視する」と述べた。ハイセンスはスポンサー範囲はスペイン国内に限られると説明している。"}, "why": {"zh": "这条线的关键不在道歉本身，而在“个人言论”与“雇主责任”的边界——俱乐部想把它框成球员个人行为，平台与赞助商用停播、解约给出了另一种定价。海信那句“赞助区域仅限西班牙”是典型的切割表述，也是跨国赞助合同里最实用的一条免责设计。", "en": "The issue is not the apology but the boundary between personal speech and employer liability: the club frames it as individual conduct, while broadcasters and sponsors priced it differently with suspensions and terminations. Hisense’s “Spain only” line is textbook ring-fencing — and the most practical disclaimer in a cross-border sponsorship.", "es": "La clave no es la disculpa sino el límite entre opinión personal y responsabilidad del empleador: el club lo encuadra como conducta individual, mientras cadenas y patrocinadores lo valoraron de otro modo con suspensiones y rupturas. El «solo España» de Hisense es un cerco típico y la cláusula más práctica de un patrocinio transfronterizo.", "ja": "焦点は謝罪そのものではなく、「個人の発言」と「雇用者の責任」の境界にある。クラブは個人の行為として枠づけようとし、放送局やスポンサーは放送停止や契約解除で別の値段をつけた。ハイセンスの「スペイン国内に限る」は典型的な切り分けであり、越境スポンサー契約で最も実用的な免責設計である。"}}, {"idx": "02", "title": {"zh": "女子欠款 1700 元被限制高消费并公开照片，执行尺度引讨论", "en": "Woman Owing 1,700 Yuan Has Photo Published Under Spending Ban, Sparking Debate", "es": "Publican la foto de una mujer que debía 1.700 yuanes: debate sobre la proporcionalidad", "ja": "1700元の債務で写真公開と高額消費制限 執行の妥当性めぐり議論"}, "body": {"zh": "10 月 28 日至 29 日，“女子欠 1700 元被限高公开照片”登上微博热搜第一。事情起于一份限制高消费令与随之公开的被执行人照片：欠款金额仅 1700 元，却触发了公开曝光的执行措施。讨论集中在两点：一是 1700 元的债务是否与公开曝光相称，公开曝光的比例原则、必要性与期限如何把握；二是限制高消费与公开曝光本就是两套不同措施，适用条件并不相同，公众对二者的混淆也放大了争议。", "en": "On 28–29 October, the case of a woman who owed 1,700 yuan and had her photograph published alongside a spending-restriction order topped Weibo’s trending list. The discussion centres on two points: whether public exposure is proportionate to a 1,700 yuan debt, and how necessity and duration should be judged; and the fact that spending restrictions and public exposure are two separate measures with different conditions, a confusion that has amplified the argument.", "es": "Entre el 28 y el 29 de octubre encabezó las tendencias de Weibo el caso de una mujer que debía 1.700 yuanes y cuya fotografía se publicó junto a una orden de restricción de gasto. El debate se centra en dos puntos: si la exposición pública es proporcional a una deuda de 1.700 yuanes y cómo se juzgan necesidad y duración; y en que la restricción de gasto y la exposición pública son medidas distintas con condiciones distintas, confusión que amplifica la polémica.", "ja": "10月28日から29日にかけ、「1700元の債務で高額消費制限と写真公開」がWeiboのトレンド首位となった。議論は二点に集まる。1700元の債務に対して公開という措置が比例的かどうか、必要性と期間をどう判断するのか。もう一点は、高額消費の制限と写真の公開がもともと別の措置であり適用条件が異なるという点で、混同が議論を大きくしている。"}, "why": {"zh": "这类争议的实质是“执行效率”与“比例原则”的碰撞。公开曝光对小额债务的威慑力很强，但成本由一个人的社会评价承担；当金额小到与后果不相称时，公众的不适感就会盖过对债权人的同情。", "en": "The substance is a collision between enforcement efficiency and proportionality. Public exposure deters strongly even for small debts, but the cost is carried by one person’s reputation; when the sum is small enough to look disproportionate, public discomfort outweighs sympathy for the creditor.", "es": "El fondo es el choque entre eficacia del cumplimiento y proporcionalidad. La exposición pública disuade con fuerza incluso en deudas pequeñas, pero el coste lo asume la reputación de una persona; cuando la suma resulta desproporcionada, la incomodidad pública supera la simpatía por el acreedor.", "ja": "実質は「執行の効率」と「比例原則」の衝突である。少額債務でも公開には強い抑止力があるが、そのコストは一人の社会的評価が負う。金額が結果に見合わないほど小さいとき、世間の違和感は債権者への同情を上回る。"}}, {"idx": "03", "title": {"zh": "女子被蜱虫咬伤后住 ICU 28 天、四肢瘫痪，医生回应", "en": "Woman Spends 28 Days in ICU and Loses Limb Movement After Tick Bite", "es": "Una mujer pasa 28 días en la UCI y pierde movilidad en las extremidades tras una picadura de garrapata", "ja": "マダニ咬傷でICUに28日、四肢まひ 医師が注意喚起"}, "body": {"zh": "近日，“女子被蜱虫咬伤住 ICU 28 天四肢瘫痪”登上热搜，三甲医院医生就病情作出回应。蜱虫是多种严重传染病的媒介，叮咬后可能引发发热、乏力、血小板减少等症状，重症可累及神经系统。医生提醒，秋季户外活动仍较频繁，进入草地、林地应穿长袖长裤、扎紧裤口，离开后及时检查身体与衣物；一旦发现蜱虫附着，不可硬拔或拍打，应尽快就医由专业人员处理。", "en": "A case in which a woman spent 28 days in intensive care and lost movement in her limbs after a tick bite has trended online, with doctors at a top-tier hospital responding. Ticks carry several serious diseases; bites can cause fever, fatigue and low platelets, and severe cases can affect the nervous system. Doctors advise long sleeves and trousers with cuffs tightened when entering grass or woodland in autumn, checking body and clothing afterwards, and never pulling or crushing an attached tick — seek professional removal promptly.", "es": "El caso de una mujer que pasó 28 días en cuidados intensivos y perdió la movilidad de las extremidades tras una picadura de garrapata se ha vuelto tendencia, con la respuesta de médicos de un hospital de primer nivel. Las garrapatas transmiten varias enfermedades graves; la picadura puede causar fiebre, fatiga y plaquetas bajas, y los casos graves afectan al sistema nervioso. Los médicos recomiendan manga larga y pantalón con puños ajustados en el campo, revisar cuerpo y ropa al salir y no arrancar ni aplastar la garrapata adherida.", "ja": "マダニに咬まれてICUに28日入り、四肢まひとなった事例がトレンドとなり、大学病院の医師が説明した。マダニは複数の重篤な感染症の媒介者で、咬傷後は発熱や倦怠感、血小板減少などを起こし、重症化すると神経系に及ぶことがある。医師は、秋でも屋外活動が多いため、草地や林に入る際は長袖長ズボンで裾を締め、戻ったら体と衣服を確認すること、吸血中のマダニを無理に引っ張ったり叩いたりせず、速やかに医療機関で処置を受けるよう呼びかけている。"}, "why": {"zh": "蜱虫的危险不在叮咬本身，而在“没感觉”——它的唾液含麻醉成分，附着后往往数小时不被察觉。这条新闻真正有用的部分是那句“不可硬拔”：硬拔会把口器留在皮肤里，反而增加感染风险。", "en": "The danger is not the bite but the absence of sensation — tick saliva contains an anaesthetic, so attachment often goes unnoticed for hours. The genuinely useful part of the story is “don’t pull”: yanking leaves mouthparts in the skin and raises infection risk.", "es": "El peligro no es la picadura sino la ausencia de sensación: la saliva contiene anestésicos y la garrapata pasa horas inadvertida. Lo realmente útil es el «no arrancar»: tirar deja el aparato bucal en la piel y aumenta el riesgo de infección.", "ja": "危険は咬傷そのものではなく「無感覚」にある。唾液に麻酔成分が含まれ、付着してから数時間気づかないことが多い。本当に役立つのは「無理に引っ張らない」という点だ。引き抜くと口器が皮膚に残り、感染リスクが高まる。"}}, {"idx": "04", "tag": {"zh": "进展"}, "title": {"zh": "人民日报评“高校教学严禁全程 PPT”：课堂不该沦为读屏", "en": "People’s Daily on the PPT Ban: A Classroom Should Not Become a Screen-Reading Session", "es": "People’s Daily sobre el veto al PPT: el aula no debe ser una lectura de pantalla", "ja": "人民日報「PPTだけの授業は禁止」に論評 教室を画面読みに堕すべきでない"}, "body": {"zh": "针对部分高校教师过度依赖 PPT 授课的现象，人民日报发文指出，教学不应沦为“读屏”，高等教育的核心在于思想碰撞与深度讲授，教学工具的便利性不应替代教师对课堂内容的重新组织。此前，多所高校已发文严禁教师全程依赖 PPT“念课件”，要求板书与讲授相结合。这一轮讨论的焦点，已从“该不该用 PPT”转向“用 PPT 讲什么”。", "en": "Responding to the tendency of some university teachers to rely heavily on slides, People’s Daily argued that teaching should not become screen-reading: the core of higher education is the clash of ideas and substantive lecturing, and convenience of tools should not replace a teacher’s reorganisation of the material. Several universities had already banned reading slides throughout a class and required a mix of board work and explanation. The debate has shifted from whether to use slides to what they are used to say.", "es": "Ante la dependencia excesiva de las diapositivas en algunas aulas universitarias, People’s Daily sostuvo que la enseñanza no debe convertirse en lectura de pantalla: el núcleo de la educación superior es el choque de ideas y la explicación profunda, y la comodidad de las herramientas no debe sustituir la reelaboración del contenido. Varias universidades ya prohibieron leer el PPT toda la clase y exigen combinar pizarra y explicación. El debate pasó de «usar o no PPT» a «qué se dice con él».", "ja": "一部の大学教員が PPT に過度に依存する傾向について、人民日報は、授業が「画面読み」に堕すべきではないと論じた。高等教育の中核は思想のぶつかり合いと深い講義にあり、道具の便利さが教員による内容の再構成を代替してはならない。複数の大学はすでに、全編 PPT を読み上げる授業を禁じ、板書と講義の併用を求めている。議論の焦点は「使うかどうか」から「何を語るか」へ移った。"}, "why": {"zh": "这条讨论之所以反复上热搜，是因为它触到了大学课堂的真实痛点：PPT 把备课成本降下来了，也把“临场组织一段完整论述”的能力降下来了。禁令容易写，评价体系不改，课件还是会被念。", "en": "It keeps trending because it hits a real sore point: slides lowered the cost of preparation and also lowered the ability to construct an argument live. Bans are easy to write; unless the evaluation system changes, the slides will still be read aloud.", "es": "Vuelve a ser tendencia porque toca un punto real: las diapositivas bajaron el coste de preparar clase y también la capacidad de construir un argumento en vivo. Prohibir es fácil; si no cambia la evaluación, el PPT se seguirá leyendo.", "ja": "繰り返し話題になるのは、大学の教室の実際の痛点に触れているからだ。PPTは準備のコストを下げ、同時に「その場で一つの論を組み立てる力」も下げた。禁止は簡単だが、評価制度が変わらなければ、スライドは読み上げられ続ける。"}}, {"idx": "05", "title": {"zh": "已故演员高秀敏形象被印上祭祀用品，网友谴责", "en": "Late Actress Gao Xiumin’s Image Found on Funeral Goods, Drawing Condemnation", "es": "La imagen de la fallecida actriz Gao Xiumin aparece en artículos funerarios y provoca rechazo", "ja": "故人女優の肖像が祭祀用品に ネットで非難"}, "body": {"zh": "近日，有商家将已故演员高秀敏的形象印在祭祀用品上售卖，引发网友谴责，相关话题登上微博热搜。高秀敏是观众熟悉的春晚小品演员，已去世多年。舆论与法律界的共识是：未经家属同意，将逝者肖像用于商业牟利，涉嫌侵犯肖像权，也违背公序良俗；逝者的肖像利益由其近亲属依法维护。类似案例此前也出现在其他已故艺人身上，平台与商家均被要求下架处理。", "en": "Merchants have been selling funeral goods printed with the image of the late actress Gao Xiumin, prompting condemnation online and a spot on Weibo’s trending list. Gao, a Spring Festival Gala sketch performer familiar to audiences, died years ago. The consensus in law and public opinion is that using a deceased person’s likeness for commercial gain without family consent infringes personality rights and offends public order; relatives may uphold those interests. Similar cases involving other late performers have led to takedowns.", "es": "Comerciantes venden artículos funerarios con la imagen de la fallecida actriz Gao Xiumin, lo que ha provocado rechazo en redes y presencia en las tendencias de Weibo. Gao, conocida por sus sketches de la Gala del Año Nuevo, murió hace años. El consenso jurídico y social es que usar la imagen de un fallecido con fines comerciales sin consentimiento familiar vulnera los derechos de la personalidad y el orden público; los parientes pueden defenderlos. Casos similares han acabado en retiradas.", "ja": "故人女優・高秀敏氏の肖像を印刷した祭祀用品が販売され、ネット上で非難が起き、Weiboのトレンドにも入った。高氏は春節ガラで親しまれたコント俳優で、死去から年数が経つ。法的にも社会的にも、遺族の同意なく故人の肖像を商業利用することは肖像権の侵害であり公序良俗に反するとの認識が共有されている。同様の事例では販売停止の措置が取られている。"}, "why": {"zh": "祭祀用品是个特殊品类——它天然带着“纪念”的外观，因而更容易绕过商业伦理的警觉。但纪念不等于授权：把逝者印在纸上卖钱，和把逝者印在广告上卖货，在法律上是同一件事。", "en": "Funeral goods are a peculiar category: they wear the appearance of commemoration and so slip past commercial ethics more easily. But commemoration is not authorisation — printing the dead on paper for money and printing them on ads for money are the same act in law.", "es": "Los artículos funerarios son una categoría peculiar: llevan apariencia de conmemoración y por eso esquivan más fácilmente la ética comercial. Pero conmemorar no es autorizar: imprimir al difunto en papel para vender y en un anuncio para vender es, en derecho, lo mismo.", "ja": "祭祀用品は特殊なカテゴリーだ。「追悼」の外観をまとうため、商業倫理の警戒をすり抜けやすい。しかし追悼は許諾ではない。故人を紙に刷って売るのも、広告に刷って売るのも、法の上では同じ行為である。"}}]}, {"key": "ent", "num": "06", "color": "#db2777", "deep": "#a81a56", "name": {"zh": "娱乐八卦", "en": "ENTERTAINMENT", "es": "ESPECTÁCULOS", "ja": "エンタメ"}, "items": [{"idx": "01", "title": {"zh": "金鸡影帝戈治均逝世，享年 90 岁", "en": "Golden Rooster Winner Ge Zhijun Dies at 90", "es": "Fallece Ge Zhijun, premio Golden Rooster, a los 90 años", "ja": "金鶏賞男優の戈治均氏が死去 90歳"}, "body": {"zh": "10 月 28 日，陕西人民艺术剧院发布讣告：人民表演艺术家、一级演员、第二十一届中国电影金鸡奖最佳男主角戈治均，因病医治无效，于 2026 年 10 月 26 日在北京逝世，享年 90 岁。告别仪式定于 10 月 29 日上午 9 时在北京大兴殡仪馆举行。戈治均 1936 年生于山西运城，1956 年考入西安交通大学水利系，1960 年进入西安电影制片厂演员剧团，1964 年调入陕西人民艺术剧院，在话剧舞台打磨 28 年。1992 年在《秋菊打官司》中饰演“李公安”为观众熟知，2001 年 65 岁凭《押解的故事》获金鸡奖最佳男主角，2017 年在电视剧《白鹿原》中饰演鹿泰恒，称该剧“应该是我的封箱之作”。", "en": "Shaanxi People’s Art Theatre announced on 28 October that Ge Zhijun, a people’s performing artist, first-class actor and best actor winner at the 21st Golden Rooster Awards, died of illness in Beijing on 26 October 2026, aged 90. A farewell ceremony is set for 9 am on 29 October at Daxing funeral home. Born in Yuncheng, Shanxi, in 1936, Ge studied hydraulic engineering at Xi’an Jiaotong University from 1956, joined Xi’an Film Studio’s acting troupe in 1960 and moved to the Shaanxi theatre in 1964, spending 28 years on stage. He became familiar to audiences as Officer Li in The Story of Qiu Ju (1992), won the Golden Rooster at 65 for The Escort (2001), and played Lu Taiheng in the 2017 TV series White Deer Plain, which he called his final role.", "es": "El Teatro Popular de Arte de Shaanxi anunció el 28 de octubre el fallecimiento del actor Ge Zhijun, artista popular, actor de primera categoría y ganador del premio al mejor actor en la 21.ª edición de los Golden Rooster, ocurrido por enfermedad en Pekín el 26 de octubre de 2026 a los 90 años. El funeral se celebrará el 29 de octubre a las 9:00 en el tanatorio de Daxing. Nacido en Yuncheng (Shanxi) en 1936, estudió ingeniería hidráulica en la Universidad Jiaotong de Xi’an, entró en la compañía de los Estudios de Cine de Xi’an en 1960 y pasó al teatro en 1964, con 28 años de escenario. Se hizo conocido como el agente Li en El caso Qiu Ju (1992) y ganó el Golden Rooster a los 65 por The Escort (2001).", "ja": "陝西人民芸術劇院は10月28日、人民芸術家で一級俳優、第21回金鶏賞主演男優賞の戈治均氏が、病気のため2026年10月26日に北京で死去したと発表した。90歳。告別式は10月29日午前9時、北京の大興葬儀場で行われる。1936年に山西運城に生まれ、1956年に西安交通大学水利学科へ、1960年に西安映画製作所俳優団へ、1964年に陝西人民芸術劇院へ移り、舞台で28年を過ごした。1992年『秋菊の物語』の「李警官」で知られ、2001年に65歳で『護送』により金鶏賞主演男優賞を受賞。2017年のドラマ『白鹿原』で鹿泰恒を演じ、これが最後の重要な役となった。"}, "why": {"zh": "他演了四十多年配角，65 岁才拿到影帝——那届金鸡奖剧组起初甚至没给他报名，是表演本身把名字推了上去。讣告里“崇德尚艺，淡泊名利”八个字，在他身上不是套话：一辈子不接商演、不上综艺、不晒家事。", "en": "He played supporting roles for over four decades and won best actor at 65 — his own film had not even entered him at first; the performance put his name forward. The obituary’s “uphold virtue, prize craft, keep fame and gain at a distance” was not boilerplate for him: no commercial gigs, no variety shows, no family publicity.", "es": "Hizo papeles secundarios durante más de cuarenta años y ganó el premio a los 65: su propia película no lo había inscrito al principio; fue la actuación la que puso su nombre. El «cultivar la virtud, amar el oficio, mantener lejos la fama» del obituario no era fórmula vacía en su caso: sin bolos comerciales, sin programas de variedades.", "ja": "40年以上にわたり脇役を演じ、65歳で主演男優賞に至った。その作品は当初、彼を賞に推薦すらしていなかった。推薦したのは演技そのものだった。訃報の「徳を尊び芸を重んじ、名利に淡泊」という言葉は、彼にとって定型句ではなかった。営業公演もバラエティも家族の話題もなかった。"}}, {"idx": "02", "title": {"zh": "白宇帆被拍到携家人出游，“隐婚生子”传闻本人未回应", "en": "Bai Yufan Photographed on a Family Outing; Neither He nor His Studio Responds", "es": "Fotografían a Bai Yufan de excursión familiar; ni él ni su estudio responden", "ja": "白宇帆が家族と外出する姿を撮影される 本人と事務所は無言"}, "body": {"zh": "10 月 28 日，有媒体放出实拍视频：演员白宇帆打完球后折叠婴儿车放入后备箱，接上一名女子与一名小男孩，一行人前往公园游玩。他在孩子玩蹦床、攀岩时一直伸手护在下方，之后一同到卤味店买吃食回家。截至发稿，白宇帆本人及工作室均未回应，被拍到女子的身份也无实锤。白宇帆曾出演《山海情》《繁城之下》《我在他乡挺好的》《城中之城》，待播作品包括改编自贾平凹原著的《高兴》、与胡歌合作的《人间有味》等。", "en": "On 28 October a media outlet published footage of actor Bai Yufan after a game of basketball: he folded a stroller into the boot, picked up a woman and a small boy, and drove them to a park, where he kept a hand under the child on the trampoline and climbing wall before they bought snacks and headed home. Neither Bai nor his studio has responded, and the woman’s identity is unconfirmed. Bai has appeared in Minning Town, Under the Prosperous City, Remembrance of Things Past and City of Dreams, with upcoming works including Happy, adapted from Jia Pingwa’s novel, and a collaboration with Hu Ge.", "es": "El 28 de octubre un medio publicó imágenes del actor Bai Yufan tras jugar al baloncesto: plegó un cochecito en el maletero, recogió a una mujer y a un niño y los llevó a un parque, donde mantuvo la mano bajo el pequeño en la cama elástica y el rocódromo antes de comprar algo y volver a casa. Ni él ni su estudio han respondido y la identidad de la mujer no está confirmada. Bai ha aparecido en Minning Town, Under the Prosperous City o City of Dreams.", "ja": "10月28日、俳優の白宇帆がバスケットボールの後にベビーカーをトランクに畳み、女性と男児を乗せて公園へ向かう様子をメディアが撮影した。トランポリンやクライミングでは子どもの下に手を添え、その後買い物をして帰宅した。本人も事務所も現時点で回答せず、女性の身元も未確認である。白宇帆は『山海情』『繁城之下』『我在他郷挺好的』『城中之城』などに出演している。"}, "why": {"zh": "舆论这次意外地平静——因为他从未立过“单身人设”。观众反感的从来不是婚育本身，而是被经营出来的假象；没有假象，就没有塌房。", "en": "The reaction was unexpectedly calm — because he never marketed a single image. Audiences do not object to marriage or children; they object to a manufactured illusion. No illusion, no collapse.", "es": "La reacción fue inesperadamente serena porque nunca construyó una imagen de soltero. Al público no le molesta el matrimonio ni los hijos, sino la ficción fabricada. Sin ficción, no hay derrumbe.", "ja": "反応は意外に穏やかだった。彼が「独身」を売りにしてこなかったからだ。観客が嫌うのは結婚や子どもではなく、作り上げられた虚像である。虚像がなければ、崩れるものもない。"}}, {"idx": "03", "title": {"zh": "腾讯视频招商大会剧集热度：《铁证》破万，《将门独后》《来战》《剑来》紧随", "en": "Tencent Video Showcase Heat Rankings: Iron Proof Tops 10,000", "es": "Ranking de series en la presentación de Tencent Video: Iron Proof supera los 10.000", "ja": "テンセントビデオ発表会のヒートランキング 『鉄証』が1万超え"}, "body": {"zh": "10 月 28 日，腾讯视频招商大会按小时释出预告、海报与 MV。截至当日 19 时，站内热度榜前五为《将门独后》7411（王鹤棣、孟子义）、《铁证》7358（刘宇宁、孙红雷）、《来战》7238（鞠婧祎、张云龙）、《剑来》6995（吴磊、夏梦）、《归鸾》6978（张凌赫、林允）。追踪至 29 日凌晨，《铁证》站内最高热度达 10201，《剑来》8865，前五顺序被改写。若按“抖音点赞+转发+站内热度”的综合口径，《来战》登顶第一。", "en": "Tencent Video released trailers, posters and music videos hourly during its 28 October showcase. As of 19:00 that day the top five by in-app heat were The Heir Behind the Gate (7,411, starring Wang Hedi and Meng Ziyi), Iron Proof (7,358, Liu Yuning and Sun Honglei), Come Fight (7,238, Ju Jingyi and Zhang Yunlong), Sword Come (6,995, Wu Lei and Xia Meng) and Return of the Luan (6,978, Zhang Linghe and Lin Yun). By the early hours of the 29th, Iron Proof had peaked at 10,201 and Sword Come at 8,865, reordering the table; on a combined Douyin-plus-heat measure, Come Fight led.", "es": "Tencent Video publicó tráilers, carteles y vídeos musicales cada hora durante su presentación del 28 de octubre. A las 19:00, el top cinco por popularidad interna era The Heir Behind the Gate (7.411, con Wang Hedi y Meng Ziyi), Iron Proof (7.358, Liu Yuning y Sun Honglei), Come Fight (7.238, Ju Jingyi y Zhang Yunlong), Sword Come (6.995, Wu Lei y Xia Meng) y Return of the Luan (6.978, Zhang Linghe y Lin Yun). De madrugada, Iron Proof alcanzó 10.201 y Sword Come 8.865, alterando el orden.", "ja": "テンセントビデオは10月28日の発表会で、予告編やポスター、MVを1時間ごとに公開した。同日19時時点のアプリ内ヒート上位5作は『将門独後』7411（王鶴棣、孟子義）、『鉄証』7358（劉宇寧、孫紅雷）、『来戦』7238（鞠婧禕、張雲龍）、『剣来』6995（呉磊、夏夢）、『帰鸞』6978（張凌赫、林允）。29日未明には『鉄証』が最高1万201、『剣来』が8865に達し順位が入れ替わった。"}, "why": {"zh": "招商大会的榜单是“物料热度”，不是播出热度——预告片剪得好不好，直接决定这一天的数字。真正的信号是平台把哪些项目放在上午 9 点起的黄金时段释出：那是它愿意压资源的顺位。", "en": "Showcase rankings measure trailer heat, not viewing: how well a preview is cut decides the day’s numbers. The real signal is which projects the platform released in the prime slots from 9 am — that is its order of commitment.", "es": "El ranking mide el calor de los materiales, no la audiencia: cómo esté montado el tráiler decide la cifra del día. La señal real es qué proyectos salieron en las franjas prime desde las 9:00: ese es el orden de apuesta de la plataforma.", "ja": "発表会のランキングは「素材の熱」であり視聴の熱ではない。予告編の出来がその日の数字を決める。本当のシグナルは、プラットフォームが午前9時以降の黄金時間にどの作品を出したか——それが資源配分の順位である。"}}, {"idx": "04", "title": {"zh": "王者荣耀共创之夜：微博 211 个热搜，直播峰值 4698 万人看过", "en": "Honor of Kings Anniversary Gala Draws 47 Million Viewers and 211 Weibo Trends", "es": "Gala de Honor of Kings: 211 tendencias en Weibo y 47 millones de espectadores", "ja": "『王者栄耀』共創の夜 微博211件のトレンド、同時視聴4698万人"}, "body": {"zh": "王者荣耀十周年共创之夜近日举行，晚会以玩家自创的梗为主要内容：黄子弘凡演唱改编自玩家调侃的《我爱玩王者荣耀》，林俊杰唱《裹着心的光》时把话筒递给选手一诺，周深与林俊杰合唱《曹操》，刘宇宁演唱《行歌》时背景屏出现敦煌与居延烽燧出土的汉简家书。官方数据显示，林俊杰出场前直播间已有 4146.4 万人看过，关播时为 4698.4 万人。相关话题在微博登上 211 个热搜，抖音相关热搜超过 160 个。", "en": "Honor of Kings held its tenth-anniversary co-creation gala, built largely from memes invented by players: Huang Zihongfan sang an adaptation of the fan joke “I love playing Honor of Kings”, JJ Lin handed the mic to pro player Yinuo during a song, Zhou Shen and Lin duetted on Cao Cao, and Liu Yuning’s performance was staged in front of Han-dynasty wooden-slip letters unearthed at Dunhuang and Juyan. Official figures show 41.46 million viewers before Lin’s set and 46.98 million at sign-off, with 211 related Weibo trends and more than 160 on Douyin.", "es": "Honor of Kings celebró su gala del décimo aniversario, construida en gran parte con memes creados por jugadores: Huang Zihongfan cantó una adaptación del chiste «me encanta jugar a Honor of Kings», JJ Lin entregó el micrófono al profesional Yinuo, Zhou Shen y Lin hicieron un dueto de Cao Cao, y la actuación de Liu Yuning se montó ante cartas en tablillas de la dinastía Han halladas en Dunhuang y Juyan. Las cifras oficiales hablan de 41,46 millones de espectadores antes de la actuación de Lin y 46,98 millones al cierre.", "ja": "『王者栄耀』の10周年共創の夜が開催され、プレイヤーが作ったネタが主要内容となった。黄子弘凡がファンの冗談を改编した曲を歌い、林俊傑は歌唱中に選手の一諾にマイクを渡し、周深と林俊傑が『曹操』をデュエット、劉宇寧の歌唱では敦煌と居延烽燧出土の漢簡の家書が背景に映された。公式によれば林俊傑登場前で4146.4万人、配信終了時で4698.4万人が視聴。関連話題は微博で211件、抖音で160件以上のトレンド入りとなった。"}, "why": {"zh": "这场晚会最特别的地方是“官方隐身”——台上没有品牌自夸，全是玩家自己造的梗。当一台晚会的内容由受众提供，它就从营销变成了“共同记忆的年检”。", "en": "What stands out is the brand’s self-effacement: no corporate self-praise, only memes the players made. When the audience supplies the content, a gala stops being marketing and becomes an annual audit of shared memory.", "es": "Lo llamativo es la discreción de la marca: nada de autobombo, solo memes creados por los jugadores. Cuando el público aporta el contenido, una gala deja de ser marketing y pasa a ser una revisión anual de la memoria compartida.", "ja": "際立つのは企業が前面に出ないことだ。自画自賛はなく、プレイヤーが作ったネタだけが並ぶ。観客が内容を提供するとき、晚会はマーケティングではなく「共有された記憶の年次点検」になる。"}}, {"idx": "05", "title": {"zh": "演了 83 部戏的老戏骨房子斌，被《小城良方》带火", "en": "Veteran Character Actor Fang Zibin, 83 Credits In, Breaks Through With a Medical Drama", "es": "El veterano Fang Zibin, con 83 trabajos, se hace conocido gracias a un drama médico", "ja": "83作品のベテラン俳優・房子斌 『小城良方』で脚光"}, "body": {"zh": "随着《小城良方》热播，51 岁的演员房子斌因剧中角色受到关注。房子斌 1974 年出生，中央戏剧学院表演系毕业后进入中国国家话剧院，演过《生死场》《荒原与人》《霸王歌行》等话剧，曾获文华表演奖、中国戏剧文化奖金狮奖。2026 年他有《当家的男人》《原地逃离》《小城良方》三部作品与观众见面，题材横跨农村现实、都市悬疑与医疗。妻子杨雨婷同为演员，曾在《琅琊榜》中饰演越贵妃。", "en": "As the medical drama A Small Town Prescription gains viewers, 51-year-old actor Fang Zibin is drawing attention for his role. Born in 1974 and trained at the Central Academy of Drama, he joined the National Theatre Company of China and appeared in stage works including The Field of Life and Death and King Xiang Yu, winning the Wenhua Performance Award and the Golden Lion of the China Drama Culture Awards. Three of his works reach audiences in 2026, spanning rural realism, urban suspense and medical drama. His wife, Yang Yuting, is also an actor, known for the TV drama Nirvana in Fire.", "es": "Con el éxito del drama médico A Small Town Prescription, el actor Fang Zibin, de 51 años, atrae la atención por su papel. Nacido en 1974 y formado en la Academia Central de Drama, se incorporó al Teatro Nacional de China y actuó en obras como The Field of Life and Death, con premios Wenhua y el León de Oro de los premios de cultura dramática. En 2026 llegan tres de sus trabajos, entre el realismo rural, el suspense urbano y la temática médica. Su esposa, Yang Yuting, también actriz, apareció en Nirvana in Fire.", "ja": "医療ドラマ『小城良方』のヒットで、51歳の俳優・房子斌が注目されている。1974年生まれ、中央戯劇学院表演系を経て中国国家話劇院へ。『生死場』『荒原与人』などの舞台に立ち、文華表演賞や中国戯劇文化賞金獅賞を受賞した。2026年は農村現実、都市サスペンス、医療と幅広い3作品が公開される。妻の楊雨婷も俳優で、『琅琊榜』の越貴妃役で知られる。"}, "why": {"zh": "“被流量带红”是误读——他真正的资本是二十多年话剧舞台攒下的台词与节奏。这也解释了为什么同样是配角，有人只被记住脸，有人一开口就把场子稳住。", "en": "“Made famous by traffic” misreads it: his real capital is two decades of stage-earned voice and rhythm. Which is why, among supporting actors, some are only remembered by their faces while others steady a scene the moment they speak.", "es": "Decir que lo hizo famoso el tráfico es un error: su capital real son dos décadas de voz y ritmo ganados en el escenario. Por eso, entre los secundarios, a unos se les recuerda por la cara y otros sostienen la escena en cuanto hablan.", "ja": "「人気に乗って有名になった」は誤解だ。彼の本当の資本は、20年余りの舞台で培った台詞と間である。だから同じ脇役でも、顔だけ覚えられる者と、口を開いた瞬間に場を支える者がいる。"}}]}], "risk": {"zh": "风险提示：本简报仅作信息汇总，其中涉及的数据不构成任何投资建议。", "en": "Disclaimer: This briefing is a news digest only. Data mentioned does not constitute any investment advice.", "es": "Aviso: este resumen es solo una recopilación informativa; los datos citados no constituyen asesoramiento de inversión.", "ja": "リスク表示：本ダイジェストは情報まとめであり、記載データは投資助言を構成しません。"}}/*__END__*/;

  /* ===== 工具 ===== */

    for (var i = 0; i < ARCHIVE_DATES.length; i++) { has[ARCHIVE_DATES[i]] = 1; }
    var HIST_BASE = /\/history\//.test(location.pathname) ? "./" : "history/";

    function ckey(y, m, d) { return String(y).slice(2) + pad(m) + pad(d); }

    function render() {
      var i18n = I18N[curLang];
      title.textContent = i18n.calTitle(cur.y, cur.m);
      grid.innerHTML = "";
      var start = new Date(cur.y, cur.m - 1, 1).getDay();
      var days = new Date(cur.y, cur.m, 0).getDate();
      for (var b = 0; b < start; b++) {
        var blank = document.createElement("span");
        blank.className = "cal-cell is-empty"; grid.appendChild(blank);
      }
      for (var d = 1; d <= days; d++) {
        var k = ckey(cur.y, cur.m, d);
        var cell = document.createElement("span");
        cell.className = "cal-cell" + (has[k] ? " has" : "") + (k === todayKey ? " is-today" : "");
        cell.textContent = d;
        if (has[k]) {
          cell.setAttribute("role", "link"); cell.setAttribute("tabindex", "0");
          cell.title = cur.y + "-" + pad(cur.m) + "-" + pad(d) + " 存档";
          (function (target) {
            var go = function () { window.open(HIST_BASE + target + ".html", "_blank", "noopener"); };
            cell.addEventListener("click", go);
            cell.addEventListener("keydown", function (e) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); go(); } });
          })(k);
        }
        grid.appendChild(cell);
      }
    }
    function toggle(open) {
      pop.hidden = !open;
      btn.setAttribute("aria-expanded", open ? "true" : "false");
      if (open) render();
    }
    btn.addEventListener("click", function (e) { e.stopPropagation(); toggle(pop.hidden); });
    document.getElementById("calPrev").addEventListener("click", function () { cur.m--; if (cur.m < 1) { cur.m = 12; cur.y--; } render(); });
    document.getElementById("calNext").addEventListener("click", function () { cur.m++; if (cur.m > 12) { cur.m = 1; cur.y++; } render(); });
    document.addEventListener("click", function (e) { if (!pop.hidden && !pop.contains(e.target)) toggle(false); });
    document.addEventListener("keydown", function (e) { if (e.key === "Escape" && !pop.hidden) toggle(false); });
  }

  /* ===== 启动 ===== */
  function boot() {
    curLang = detectLang();
    renderChrome(curLang);
    renderContent(curLang);
    initCalendar();
    // 关闭语言下拉：点击外部 / Esc
    document.addEventListener("click", function (e) {
      var ls = document.getElementById("langSwitch");
      if (ls && langOpen && !ls.contains(e.target)) {
        langOpen = false;
        ls.classList.remove("open");
        var t = document.getElementById("langTrigger");
        if (t) t.setAttribute("aria-expanded", "false");
      }
    });
    document.addEventListener("keydown", function (e) {
      if (e.key === "Escape" && langOpen) {
        langOpen = false;
        var ls = document.getElementById("langSwitch");
        if (ls) ls.classList.remove("open");
        var t = document.getElementById("langTrigger");
        if (t) t.setAttribute("aria-expanded", "false");
      }
    });
  }
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", boot);
  } else { boot(); }
})();
</script>
</body>
</html>
