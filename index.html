echanism.", "es": "El objeto no es la tecnología de IA, sino la línea de reelaborar obras clásicas y figuras heroicas. Cuando la tecnología abarata la fabricación, la restricción más barata suele ser la revisión previa por parte de las plataformas; de ahí el énfasis en un mecanismo permanente.", "ja": "対象はAI技術そのものではなく、「古典作品や英雄像を二次加工する」という一線だ。技術が「無から有」を安くした後、最も低コストの規制はプラットフォーム側の事前審査しかない。発表が「常態化した仕組み」を強調する理由もそこにある。"}}, {"idx": "03", "title": {"zh": "绝味鸭舌全国断货，官方一句玩梗道歉冲上热搜", "en": "Duck-tongue shortage: a joke apology that became the story", "es": "Escasez de lenguas de pato y una disculpa en broma viral", "ja": "絶味の鴨舌が全国で品切れ 公式の自虐的な謝罪が話題に"}, "body": {"zh": "综艺《后会友期》中，许飞回忆与厉娜在超女时期常一起啃鸭舌，网友扒出同款为绝味鸭舌，经厉娜确认后全网跟风抢购，多地门店售罄。绝味顺势上线「厉娜同款」套餐并官宣其为品牌鲜推官，但热度爆发太快、供应链跟不上，出现全国大范围断货。11 月 3 日，官方在小红书玩梗回应：「很抱歉断货了，厉娜。」该回应登上热搜。鸭舌原料本身稀缺，一只鸭子仅产出一根，短期难以放量。", "en": "On the variety show Reunion, singer Xu Fei recalled eating duck tongues with Li Na during their Super Girl days; fans identified the brand as Juewei, Li Na confirmed it, and shoppers cleared shelves nationwide. Juewei launched a Li Na set meal and named her a brand ambassador, but demand outran supply and stores ran dry across the country. On 3 November the company responded on Xiaohongshu with a joke: sorry, we are out of stock, Li Na. The reply trended. Duck tongues are inherently scarce — one per bird — so output cannot be scaled up quickly.", "es": "En el programa Reunion, la cantante Xu Fei recordó que comía lenguas de pato con Li Na en la época de Super Girl; los seguidores identificaron la marca como Juewei, Li Na lo confirmó y las tiendas se vaciaron en todo el país. Juewei lanzó un menú Li Na y la nombró embajadora, pero la demanda superó la oferta. El 3 de noviembre la empresa respondió en Xiaohongshu con una broma: lo sentimos, se acabó, Li Na. La respuesta se volvió tendencia. Las lenguas de pato son escasas por naturaleza —una por ave— y no se pueden multiplicar rápido.", "ja": "バラエティ番組「后会友期」で、許飛がスーパーガール時代に厲娜とよく鴨舌を食べたと語り、ネットユーザーが同じ銘柄を絶味と特定。厲娜本人が認めると全国で買い漁りが起き、各地の店舗で売り切れが続出した。絶味は「厲娜同款」セットを売り出し、彼女をブランド推奨人に起用したが、需要が供給を上回り全国的に品切れとなった。11月3日、公式は小紅書で「品切れでごめんなさい、厲娜」と自虐的に返答し、これがトレンド入りした。鴨舌は1羽から1本しか取れず、短期に増産できない。"}, "why": {"zh": "断货本来是危机，一句自嘲把它变成了第二次传播。但热度是综艺给的，供应链是自己的——能不能在流量退潮前把「尝鲜客」变成「复购客」，才是这波营销真正的考题。", "en": "A shortage is normally a crisis; a self-deprecating line turned it into a second round of publicity. But the heat came from a TV show while the supply chain is the company's own. Whether novelty buyers become repeat buyers before the wave recedes is the real test.", "es": "Una rotura de stock suele ser una crisis; un comentario autocrítico la convirtió en una segunda ola de difusión. Pero el tirón lo dio la televisión y la cadena de suministro es propia: convertir al comprador curioso en cliente recurrente antes de que baje la marea es el verdadero examen.", "ja": "品切れは通常は危機だが、自虐的な一言が第二の拡散に変えた。ただし話題は番組がくれたもので、供給網は自社のものだ。熱が引く前に「物見遊山の客」を「リピーター」に変えられるかが、この施策の本当の試験になる。"}}, {"idx": "04", "title": {"zh": "陈伟霆新疆暴雪封路，vlog 里「艰难保住第七块腹肌」", "en": "Snowbound in Xinjiang, William Chan fights to keep his abs", "es": "Atrapado por la nieve en Xinjiang, William Chan defiende sus abdominales", "ja": "新疆で大雪に足止め 陳偉霆が「7つ目の腹筋」を死守"}, "body": {"zh": "11 月 3 日，陈伟霆发布在新疆可可托海拍摄的 vlog 登上热搜。视频中他与团队因暴雪封路被困在一间小卖部，正值生日会与演唱会严格减脂期，面对泡面、冰淇淋等零食反复挣扎，自嘲「好险，第七块腹肌差点就没了」。", "en": "A vlog shot in Koktokay, Xinjiang, trended on 3 November after William Chan posted it. He and his team were stranded in a small shop when blizzards closed the roads; in the middle of a strict cut for a birthday event and a concert, he agonised over instant noodles and ice cream and joked that his seventh abdominal muscle nearly disappeared.", "es": "Un vlog grabado en Koktokay, Xinjiang, se volvió tendencia el 3 de noviembre. William Chan y su equipo quedaron atrapados en una pequeña tienda por el cierre de carreteras a causa de las nevadas; en plena definición estricta para un cumpleaños y un concierto, dudó ante los fideos instantáneos y el helado y bromeó con que su séptimo abdominal casi desaparece.", "ja": "11月3日、陳偉霆が新疆コケト海で撮ったvlogがトレンド入りした。大雪による通行止めで、彼とスタッフは小さな売店に足止めされた。誕生日イベントとコンサートに向けた厳しい減量中で、カップ麺やアイスクリームを前に葛藤し、「危うく7つ目の腹筋が消えるところだった」と自嘲した。"}, "why": {"zh": "明星内容里最稀缺的不是精致，是失控。一场暴雪把「人设」还原成「饿着肚子看别人吃泡面的人」，这种真实的窘迫比任何精修图都更容易被转发。", "en": "What is scarcest in celebrity content is not polish but loss of control. A blizzard reduces a persona to a hungry person watching others eat instant noodles, and that kind of genuine awkwardness travels further than any retouched photo.", "es": "Lo más escaso en el contenido de famosos no es el refinamiento, sino la pérdida de control. Una nevada reduce al personaje a alguien con hambre mirando cómo otros comen fideos instantáneos, y esa incomodidad real circula más que cualquier foto retocada.", "ja": "有名人のコンテンツで最も貴重なのは洗練ではなく、制御不能さだ。大雪が「人設」を「腹を空かせて他人がカップ麺を食べるのを見る人」に戻す。その本物の気まずさは、どんなレタッチ写真よりも共有されやすい。"}}, {"idx": "05", "title": {"zh": "「China Haul」在海外社交平台持续发酵", "en": "China Haul keeps building on overseas social platforms", "es": "El fenómeno China Haul sigue creciendo en redes extranjeras", "ja": "「China Haul」が海外 SNS で拡大続く"}, "body": {"zh": "央视财经报道，近期海外社交平台上「China Haul」（中国扫货）热潮持续发酵，越来越多海外消费者拖着空行李箱来中国、满载而归，带着衣服、小家电、潮玩与美妆产品回国。中国供应链的快速交付能力让不少游客印象深刻，部分游客由此萌生跨境经销的想法。", "en": "CCTV Finance reported that the China Haul trend keeps building on overseas social platforms: more foreign shoppers arrive with empty suitcases and leave loaded with clothing, small appliances, collectible toys and cosmetics. The speed of Chinese supply chains has impressed many visitors, and some are now considering cross-border reselling.", "es": "Según CCTV Finance, la tendencia China Haul sigue creciendo en las redes sociales extranjeras: cada vez más compradores llegan con maletas vacías y se van cargados de ropa, pequeños electrodomésticos, juguetes de colección y cosméticos. La rapidez de las cadenas de suministro chinas impresiona a muchos visitantes, y algunos ya consideran la reventa transfronteriza.", "ja": "中国中央電視台財経によると、海外 SNS で「China Haul」（中国でまとめ買い）の流行が続いている。空のスーツケースで中国に来て、服や小型家電、コレクタブル玩具、化粧品を満載して帰る海外消費者が増えている。中国のサプライチェーンの速さに驚く観光客も多く、越境転売を考える人も出てきた。"}, "why": {"zh": "从「中国制造出海」到「外国人入境采购」，链条的方向反过来了。免签与离境退税把物流成本变成了旅行体验——这类「人肉带货」往往是大额贸易的前置试探，热闹背后是订单在找路径。", "en": "From Chinese goods going out to foreigners coming in to buy: the direction of the chain has reversed. Visa-free entry and departure-tax refunds turn logistics cost into a travel experience. This kind of suitcase trade is usually a probe that precedes bigger orders — behind the fun, deals are looking for a route.", "es": "De «los productos chinos salen» a «los extranjeros entran a comprar»: la dirección de la cadena se ha invertido. La entrada sin visado y la devolución del IVA al salir convierten el coste logístico en experiencia de viaje. Ese comercio en maleta suele ser un tanteo previo a pedidos mayores: tras la diversión, hay operaciones buscando ruta.", "ja": "「中国製品が出ていく」から「外国人が入って買う」へ、鎖の向きが反転した。ビザ免除と出国時の免税還付が、物流コストを旅の体験に変えた。こうした「スーツケース貿易」は大口受注の前哨戦であることが多く、賑わいの裏で商談がルートを探している。"}}]}, {"key": "ent", "num": "06", "color": "#db2777", "deep": "#be185d", "name": {"zh": "娱乐八卦", "en": "CULTURE", "es": "CULTURA", "ja": "エンタメ"}, "items": [{"idx": "01", "title": {"zh": "田曦薇《嫁金钗》收官，双角色热度破亿", "en": "Tian Xiwei closes The Golden Hairpin with two billion-heat roles", "es": "Tian Xiwei cierra The Golden Hairpin con dos papeles récord", "ja": "田曦薇「嫁金釵」が完結 二つの役で熱度1億突破"}, "body": {"zh": "11 月 3 日，优酷剧集《嫁金钗》收官。主演田曦薇发文告别角色魏娆，饰演韩辽的演员代高政在评论区接梗「我画地为牢魏娆」，田曦薇回复「你真是时髦韩辽」，互动登上热搜。收官当日，其饰演的「君黛」角色热度破亿，加上此前的魏娆，成为全平台首位双角色热度破亿的演员。该剧开播 48 小时站内热度破万，刷新 2026 年优酷最快破万纪录；开播当天 15 个品牌包场、总价值超 1065 万元，首播前招商 33 个品牌。她今年已有《逐玉》《低智商犯罪》《嫁金钗》等多部主演剧集热度破万，新剧《大唐辟珠记》将搭档宋威龙。", "en": "Youku drama The Golden Hairpin concluded on 3 November. Lead actress Tian Xiwei posted a farewell to her character Wei Rao; co-star Dai Gaozheng, who plays Han Liao, replied with an in-character meme, and her comeback line trended. On the final day the heat index for her character Jun Dai passed 100 million; together with Wei Rao she becomes the first actress on any platform with two roles above that mark. The show crossed the platform's 10,000 heat threshold within 48 hours of launch, a 2026 record for Youku, drew 15 brands buying out screenings on day one worth more than 10.65 million yuan, and had 33 brand sponsors before launch. She has now had several lead roles pass 10,000 this year, and her next drama pairs her with Song Weilong.", "es": "La serie de Youku The Golden Hairpin terminó el 3 de noviembre. La protagonista Tian Xiwei se despidió de su personaje Wei Rao; su compañero Dai Gaozheng, que interpreta a Han Liao, respondió con un meme en personaje y su réplica se volvió tendencia. El día del final el índice de popularidad de su personaje Jun Dai superó los 100 millones; junto a Wei Rao se convierte en la primera actriz de cualquier plataforma con dos papeles por encima de esa marca. La serie pasó el umbral de 10.000 de la plataforma en 48 horas, récord de Youku en 2026, atrajo 15 marcas que compraron pases el primer día por más de 10,65 millones de yuanes y tuvo 33 patrocinadores antes del estreno. Varios de sus papeles protagónicos han superado los 10.000 este año; su próximo drama la empareja con Song Weilong.", "ja": "11月3日、優酷のドラマ「嫁金釵」が完結した。主演の田曦薇が役の魏嬈に別れの投稿をし、韓遼役の代高政が役柄に合わせて「私は画地为牢、魏嬈」とコメント。田曦薇が「あなたって本当に时髦な韓遼ね」と返して話題になった。最終日、彼女の演じる「君黛」の熱度指数が1億を突破。魏嬈と合わせ、全プラットフォームで初めて二役が1億を超えた俳優となった。配信開始から48時間でプラットフォームの熱度1万を突破し、2026年の優酷最速記録。初日は15ブランドが計1,065万元以上で上映枠を買い切り、放映前の広告枠は33ブランド。今年はすでに主演作が複数1万を超え、次作では宋威龍と共演する。"}, "why": {"zh": "「角色热度破亿」是平台自家的度量衡，但 15 个品牌包场、33 个招商位是真金白银。演员的商业定价权，正在从粉丝数转向「能不能在开播 48 小时内把人留住」——这是可被检验的能力，也是可被替代的。", "en": "A billion-point character index is the platform's own yardstick, but 15 brand buy-outs and 33 sponsorships are real money. An actor's commercial pricing power is shifting from follower counts to whether she can hold an audience in the first 48 hours — a testable skill, and therefore a replaceable one.", "es": "Que un personaje supere los 100 millones es una métrica propia de la plataforma, pero 15 marcas comprando pases y 33 patrocinios son dinero real. El poder de fijación de precios de una actriz se desplaza del número de seguidores a si puede retener al público en las primeras 48 horas: una habilidad medible y, por tanto, sustituible.", "ja": "「熱度1億」はプラットフォーム独自の基準だが、15ブランドの買い切りと33の広告枠は本物の金だ。俳優の商業的価格決定力は、フォロワー数から「配信後48時間で人を引き留められるか」へ移りつつある。検証可能な能力であり、同時に代替可能でもある。"}}, {"idx": "02", "title": {"zh": "青龙奖手印仪式，玄彬一句话被封「男德班班长」", "en": "At the Blue Dragon handprint ceremony, Hyun Bin's one-liner steals it", "es": "En la ceremonia del Dragón Azul, una frase de Hyun Bin se lleva todo", "ja": "青龍映画賞の手形式 ヒョンビンの一言が話題に"}, "body": {"zh": "11 月 3 日，第 47 届青龙电影奖手印仪式举行，上届影帝影后玄彬、孙艺珍婚后罕见正式合体出席。被问及能否与其他演员拍爱情戏，孙艺珍笑称「这我就要考虑一下啦」，玄彬随即接话「如果她不让我演的话，那结果基本就已经整理好啦」，把接戏决定权交给妻子。话题在热搜榜最高第 14 位、文娱榜第 6 位，在榜近 8 小时。", "en": "The 47th Blue Dragon Film Awards handprint ceremony took place on 3 November, with last year's best actor and actress Hyun Bin and Son Ye-jin appearing together publicly for the first time since their marriage. Asked whether they could take romantic roles opposite other actors, Son said she would have to think about it; Hyun Bin replied that if she did not allow it, the matter would already be settled. The exchange trended for nearly eight hours, peaking at 14th overall and 6th in entertainment.", "es": "El 3 de noviembre se celebró la ceremonia de huellas de la 47.ª edición de los Premios Blue Dragon, con Hyun Bin y Son Ye-jin, mejores actor y actriz del año anterior, apareciendo juntos en público por primera vez desde su boda. Preguntados por si rodarían escenas románticas con otras personas, ella dijo que tendría que pensarlo y él respondió que si ella no se lo permitía, el asunto ya estaría resuelto. El intercambio fue tendencia casi ocho horas, con un pico de 14.º puesto general y 6.º en entretenimiento.", "ja": "11月3日、第47回青龍映画賞の手形式が行われ、前回の主演男優賞・女優賞のヒョンビンとソン・イェジンが結婚後初めて公式の場にそろって出席した。他の俳優と恋愛劇を演じるかと問われ、彼女は「それは考えないと」と笑い、彼は「彼女が許さないなら、結論はもう出ている」と返した。このやり取りは約8時間トレンド入りし、総合14位、エンタメ6位まで上がった。"}, "why": {"zh": "一句现场即兴的回答，比任何夫妻综艺都有效——因为它发生在「要不要和别的演员演爱情戏」这种真实的职业选择上。观众磕的不是甜，是分寸：把决定权交出去，也把职业边界讲清楚了。", "en": "An improvised answer beat any couples reality show, because it landed on a real professional choice: whether to play romance opposite someone else. What audiences responded to was not sweetness but boundaries — handing over the decision also drew a clear line around the job.", "es": "Una respuesta improvisada superó a cualquier reality de parejas porque tocaba una decisión profesional real: rodar romance con otra persona. Al público no le atrajo la dulzura sino el límite: ceder la decisión también dibuja una frontera clara para el oficio.", "ja": "即興の一言が夫婦バラエティより効いたのは、「他の俳優と恋愛劇をやるか」という実際の職業判断に触れたからだ。視聴者が反応したのは甘さではなく、けじめだ。決定権を渡すことは、仕事の境界線を引くことでもある。"}}, {"idx": "03", "title": {"zh": "金鸡 VR 电影季官宣汪苏泷，推介人与入围者是同一个人", "en": "Golden Rooster VR season names Silence Wang — promoter and nominee", "es": "La temporada VR del Gallo de Oro ficha a Silence Wang, promotor y nominado", "ja": "金鶏VR映画季 汪蘇瀧が推介人と出品者の二役に"}, "body": {"zh": "11 月 3 日，第 39 届中国电影金鸡奖金鸡虚拟现实电影季官宣，音乐唱作人汪苏泷担任本届星光推介人；其参与打造的《罗曼城唤醒计划》XR 互动电影同时入围推荐作品名单。该片片长 20 分钟，由远东、周也清执导，以「罗曼城」世界观为底座，观众以「罗曼特工」身份进入剧情。本届共征集虚拟现实影片 185 部，经初筛与推优遴选出 19 部入围。推荐团由鲍德熹召集，雷楚雄、刘毅、吴樾、徐娇等任委员。虚拟现实电影季 11 月 7 日在厦门启幕，11 月 10 日推介仪式公布年度推荐作品、年度艺术表现、年度叙事、年度创新、年度空间互动表现、年度文化传播六类名单。2026 年中国金鸡百花电影节 11 月 6 日至 10 日在厦门举办。", "en": "On 3 November the 39th Golden Rooster Awards announced that singer-songwriter Silence Wang will be the star promoter of its virtual reality film season, while his XR interactive film Romance City Awakening is also on the recommended list. The 20-minute film, directed by Yuan Dong and Zhou Yeqing, is built on the Romance City universe, with viewers entering the story as agents. A total of 185 VR works were submitted and 19 shortlisted. The selection committee is led by Peter Pau, with members including Yee Chung-man, Liu Yi, Wu Yue and Xu Jiao. The VR season opens in Xiamen on 7 November, and the 10 November ceremony will announce winners across six categories. The 2026 Golden Rooster and Hundred Flowers Film Festival runs in Xiamen from 6 to 10 November.", "es": "El 3 de noviembre la 39.ª edición de los Premios Gallo de Oro anunció que el cantautor Silence Wang será promotor estrella de su temporada de cine de realidad virtual, mientras su película interactiva XR Romance City Awakening figura en la lista de recomendadas. El filme de 20 minutos, dirigido por Yuan Dong y Zhou Yeqing, se apoya en el universo Romance City, con el público entrando en la historia como agentes. Se presentaron 185 obras de realidad virtual y 19 fueron preseleccionadas. El comité lo preside Peter Pau, con Yee Chung-man, Liu Yi, Wu Yue y Xu Jiao entre sus miembros. La temporada abre en Xiamen el 7 de noviembre y la gala del 10 anunciará seis categorías. El Festival de Cine Gallo de Oro y Cien Flores se celebra en Xiamen del 6 al 10 de noviembre.", "ja": "11月3日、第39回中国映画金鶏賞の金鶏バーチャルリアリティ映画季が、シンガーソングライターの汪蘇瀧を星光推介人（PR役）に起用すると発表した。彼が制作に関わったXRインタラクティブ映画「羅曼城覚醒計画」も推薦作品に選ばれている。20分の作品で監督は遠東と周也清、羅曼城の世界観を土台に、観客は「羅曼エージェント」として物語に入る。今回の募集にはVR映像作品185本が寄せられ、一次選考と推薦を経て19本が入選。推薦委員会は鮑徳熹が召集し、雷楚雄、劉毅、呉樾、徐嬌らが委員を務める。VR映画季は11月7日に厦門で開幕し、10日の推介式で6部門の年間推薦作が発表される。金鶏百花映画祭は11月6〜10日に厦門で開催。"}, "why": {"zh": "185 进 19，入围本身就是一次专业筛选；而「推介人+入围者」双重身份，说明 VR 电影目前还处在创作者与布道者高度重叠的阶段——这既是热情，也是产业尚未分工的标志。", "en": "Nineteen out of 185 means the shortlist itself is a professional filter. That one person is both promoter and nominee shows VR film is still at a stage where creators and evangelists overlap heavily — a sign of enthusiasm, and of an industry that has not yet divided its labour.", "es": "Diecinueve de 185 significa que la preselección ya es un filtro profesional. Que una misma persona sea promotor y nominado muestra que el cine VR sigue en una fase en que creadores y evangelizadores se solapan: señal de entusiasmo y de una industria que aún no ha dividido su trabajo.", "ja": "185本から19本へ。入選自体が専門的なふるいだ。推介人と入選者が同一人物というのは、VR映画がまだ作り手と伝道師が大きく重なる段階にあることを示す。熱意の表れであり、産業として分業が進んでいない証拠でもある。"}}, {"idx": "04", "title": {"zh": "陈奕迅一家取关黄泽林登热搜第一，当事人否认出轨", "en": "Eason Chan family unfollows tennis star; he denies cheating", "es": "La familia de Eason Chan deja de seguir al tenista, que lo niega", "ja": "陳奕迅一家がフォロー解除で話題 本人は不倫を否定"}, "body": {"zh": "11 月 3 日，「曝陈奕迅疑女儿被绿与黄泽林绝交」登上热搜第一。有网友发现陈奕迅、徐濠萦与女儿陈康堤均已取关网球运动员黄泽林。黄泽林 11 月 2 日晚在网络节目中回应，称与陈康堤已于 9 月分手、「是她提出的，原因完全无关第三者」，并称与新女友是 10 月认识后确定关系，交往时双方均为单身。此前 10 月 14 日他在直播中已承认恋情结束。黄泽林 10 月 3 日在名古屋亚运会网球男单决赛击败吴易昺，为中国香港队夺得历史首枚亚运网球金牌。", "en": "A trending topic on 3 November claimed Eason Chan's family had cut ties with tennis player Coleman Wong over an alleged betrayal. Users noticed that Chan, his wife Hilary Tsui and daughter Chen Hong-tai had all unfollowed Wong. In an online show on 2 November, Wong said he and Chen had broken up in September, that she initiated it and no third party was involved, and that he began his new relationship in October while both were single. He had confirmed the split in a livestream on 14 October. On 3 October he beat Wu Yibing in the Asian Games men's singles final in Nagoya, winning Hong Kong, China's first-ever Asian Games tennis gold.", "es": "Un tema viral del 3 de noviembre afirmaba que la familia de Eason Chan había roto lazos con el tenista Coleman Wong por una supuesta infidelidad. Los usuarios notaron que Chan, su esposa Hilary Tsui y su hija Chen Hong-tai habían dejado de seguirlo. En un programa en línea del 2 de noviembre, Wong dijo que la ruptura con Chen fue en septiembre, que la inició ella y que no hubo terceros, y que empezó su nueva relación en octubre, estando ambos solteros. Ya había confirmado el fin en un directo el 14 de octubre. El 3 de octubre venció a Wu Yibing en la final masculina de los Juegos Asiáticos de Nagoya y dio a Hong Kong, China, su primer oro asiático en tenis.", "ja": "11月3日、「陳奕迅の娘が裏切られたのでは」として一家がテニス選手の黄澤林をフォロー解除したという話題がトレンド1位になった。陳奕迅、徐濠縈、娘の陳康堤がそろって解除したことをネットユーザーが発見した。黄澤林は11月2日夜のネット番組で、陳康堤とは9月に別れており「彼女から切り出した。第三者は全く関係ない」と説明。新しい交際相手とは10月に知り合って交際を始め、双方とも独身だったと述べた。10月14日の配信でも破局を認めていた。10月3日には名古屋アジア大会テニス男子シングルス決勝で呉易昺を破り、中国香港に史上初のアジア大会テニス金メダルをもたらしている。"}, "why": {"zh": "取关是事实，出轨是推测，中间隔着一条需要证据的线。热搜第一的位置由「截图+时间线」撑起来，而当事人的回应只解决了一半——另一半只能等时间。这也是当下娱乐新闻最典型的形状。", "en": "Unfollowing is a fact, cheating is an inference, and between them lies a line that needs evidence. A No.1 trending slot was built from screenshots and timelines, while the response settles only half of it; the rest waits on time. That is the typical shape of entertainment news now.", "es": "Dejar de seguir es un hecho, la infidelidad una inferencia, y entre ambas hay una línea que exige pruebas. Un primer puesto de tendencias se sostuvo con capturas y cronologías, mientras la respuesta solo aclara la mitad; el resto lo dirá el tiempo. Es la forma típica de la actualidad de celebridades.", "ja": "フォロー解除は事実、不倫は推測。その間には証拠が必要な一線がある。トレンド1位はスクショと時系列で作られ、本人の説明は半分しか解決していない。残りは時間に委ねるしかない。これが今の芸能ニュースの典型的な形だ。"}}, {"idx": "05", "title": {"zh": "高圆圆成都红毛衣生图刷屏，「法拉利老了还是法拉利」", "en": "Gao Yuanyuan's unretouched Chengdu photos flood the feeds", "es": "Las fotos sin retocar de Gao Yuanyuan en Chengdu se viralizan", "ja": "高円円の成都スナップが拡散 「フェラーリは年を取ってもフェラーリ」"}, "body": {"zh": "11 月 2 日至 3 日，高圆圆在成都拍摄广告时被路人拍到，一件红毛衣配白裤子的原相机照片在网络刷屏，网友以「法拉利老了，还是法拉利」形容其状态。照片中眼尾纹、法令纹清晰可见，评论区主流声音认为这种不修图的松弛感反而更有说服力。她近年出演《风林火山》《绝密较量》《走走停停》《森中有林》等作品，主动转向更复杂的角色。", "en": "Gao Yuanyuan was photographed by passers-by while shooting a commercial in Chengdu on 2 and 3 November; unretouched images of her in a red sweater and white trousers spread widely, with commenters saying a Ferrari is still a Ferrari even when it ages. Fine lines around the eyes and nasolabial folds are plainly visible, and the prevailing response was that the unedited ease is more persuasive. In recent years she has taken on more complex roles in films including Sons of the Neon Night, The Secret Competitor, Stop Over and The Forest Within.", "es": "Gao Yuanyuan fue fotografiada por transeúntes mientras rodaba un anuncio en Chengdu los días 2 y 3 de noviembre; las imágenes sin retocar, con jersey rojo y pantalón blanco, se difundieron masivamente y los comentarios decían que un Ferrari sigue siendo un Ferrari aunque envejezca. Se le ven con claridad las arrugas de los ojos y las líneas nasogenianas, y la respuesta dominante fue que esa naturalidad sin editar convence más. En los últimos años ha asumido papeles más complejos en películas como Sons of the Neon Night, The Secret Competitor, Stop Over y The Forest Within.", "ja": "11月2〜3日、高円円が成都でCM撮影中に通行人に撮影され、赤いセーターに白パンツの未補正写真が拡散した。ネットでは「フェラーリは年を取ってもフェラーリ」と評された。目尻のしわやほうれい線もはっきり写っており、加工しない自然さの方が説得力があるという声が主流だった。近年は「風林火山」「絶密較量」「走走停停」「森中有林」などで、より複雑な役柄に自ら挑んでいる。"}, "why": {"zh": "这波讨论表面在夸脸，实际在夸「不解释」——不发文澄清状态、不挂同款链接、不接「状态管理」人设。46 岁还能靠一张生图占据热搜，靠的是把「被观看」的主动权拿回来了。", "en": "The discussion looks like praise for a face but is really praise for not explaining: no post clarifying her condition, no shopping links, no wellness-guru persona. That a 46-year-old can top the trending list with one unretouched photo comes from having taken back control of being looked at.", "es": "El debate parece elogiar un rostro, pero en realidad elogia no explicar nada: sin publicación aclaratoria, sin enlaces de compra, sin personaje de gurú del cuidado. Que a los 46 años encabece tendencias con una foto sin retocar viene de haber recuperado el control de ser mirada.", "ja": "この議論は顔を褒めているようで、実際には「説明しないこと」を褒めている。状態を弁明する投稿も、同款のリンクも、「状態管理」のキャラも出さない。46歳で未補正の写真一枚でトレンドを取れるのは、見られることの主導権を取り戻したからだ。"}}]}], "risk": {"zh": "风险提示：本简报仅作信息汇总，其中涉及的数据不构成任何投资建议。", "en": "Risk notice: this briefing is a summary of information only; the data it contains does not constitute investment advice.", "es": "Aviso de riesgo: este boletín es solo un resumen informativo; los datos que contiene no constituyen asesoramiento de inversión.", "ja": "リスク提示：本ブリーフィングは情報の要約であり、記載のデータは投資助言を構成するものではありません。"}}/*__END__*/;

  function flag(lang) {
    if (lang === "zh") return '<svg class="fl" viewBox="0 0 30 20" aria-hidden="true"><rect width="30" height="20" fill="#de2910"/><g fill="#ffde00"><circle cx="5" cy="4" r="2.2"/><circle cx="9" cy="2.4" r="0.8"/><circle cx="10" cy="4" r="0.8"/><circle cx="9" cy="5.6" r="0.8"/><circle cx="7" cy="6.6" r="0.8"/></g></svg>';
    if (lang === "en") return '<svg class="fl" viewBox="0 0 30 20" aria-hidden="true"><rect width="30" height="20" fill="#012169"/><path d="M0 0L30 20M30 0L0 20" stroke="#fff" stroke-width="4"/><path d="M0 0L30 20M30 0L0 20" stroke="#c8102e" stroke-width="2"/><rect x="13" width="4" height="20" fill="#fff"/><rect y="8" width="30" height="4" fill="#fff"/><rect x="14" width="2" height="20" fill="#c8102e"/><rect y="9" width="30" height="2" fill="#c8102e"/></svg>';
    if (lang === "es") return '<svg class="fl" viewBox="0 0 30 20" aria-hidden="true"><rect width="30" height="20" fill="#aa151b"/><rect y="5" width="30" height="10" fill="#f1bf00"/></svg>';
    return '<svg class="fl" viewBox="0 0 30 20" aria-hidden="true"><rect width="30" height="20" fill="#fff"/><circle cx="15" cy="10" r="5.5" fill="#bc002d"/></svg>';
  }

  /* ===== 工具 ===== */
  function T(obj, lang) {
    if (obj == null) return "";
    if (typeof obj === "string") return obj;
    if (obj[lang] != null) return obj[lang];
    return obj.zh != null ? obj.zh : "";
  }
  function pad(n) { return n < 10 ? "0" + n : "" + n; }
  function bing(q) { return "https://www.bing.com/search?q=" + encodeURIComponent(q); }
  function fmtDate(d, lang) {
    var y = d.getFullYear(), m = d.getMonth() + 1, day = d.getDate();
    if (lang === "zh") return y + "." + pad(m) + "." + pad(day);
    if (lang === "ja") return y + "年" + m + "月" + day + "日";
    if (lang === "es") return day + " " + ["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"][m-1] + " " + y;
    return ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][m-1] + " " + day + ", " + y;
  }
  function esc(s) {
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }
  function titleHtml(titleObj, hlObj, lang) {
    var title = T(titleObj, lang);
    var hl = T(hlObj, lang);
    var inner = esc(title);
    if (hl && title.indexOf(hl) >= 0) {
      var i = title.indexOf(hl);
      inner = esc(title.slice(0, i)) + '<span class="hl">' + esc(hl) + "</span>" + esc(title.slice(i + hl.length));
    }
    return '<a class="lk" href="' + bing(title) + '" target="_blank" rel="noopener">' + inner + "</a>";
  }

  /* ===== 语言检测：localStorage > 浏览器语言 > 系统时区 > 中文 ===== */
  function detectLang() {
    try { var s = localStorage.getItem("timab_lang"); if (s && LANGS.indexOf(s) >= 0) return s; } catch (e) {}
    var nav = (navigator.language || "").toLowerCase();
    if (/^zh/.test(nav)) return "zh";
    if (/^ja/.test(nav)) return "ja";
    if (/^es/.test(nav)) return "es";
    if (/^en/.test(nav)) return "en";
    var tz = "";
    try { tz = Intl.DateTimeFormat().resolvedOptions().timeZone || ""; } catch (e) {}
    if (/^Asia\/Tokyo/.test(tz)) return "ja";
    if (/Europe\/Madrid|America\/(Mexico_City|Bogota|Lima|Santiago|Caracas|Guatemala|La_Paz|San_Jose|Panama|Asuncion|Montevideo|Havana|El_Salvador|Managua|Tegucigalpa|Costa_Rica|San_Salvador)|America\/Argentina\//.test(tz)) return "es";
    if (/^(Europe|America|Australia)\//.test(tz)) return "en";
    return "zh";
  }

  var curLang = "zh";
  var langOpen = false;

  /* ===== 渲染 ===== */
  function renderChrome(lang) {
    var i18n = I18N[lang];
    document.documentElement.lang = LANG_HTML[lang];
    // 报头信息行
    var metaEl = document.getElementById("metaRow");
    if (metaEl) metaEl.textContent = T(BRIEFING.meta, lang);
    // 大日期
    var md = document.getElementById("mastDate");
    if (md) {
      var d = new Date(BRIEFING.date + "T00:00:00");
      md.innerHTML = fmtDate(d, lang) + "<small>" + esc(i18n.dateSub) + "</small>";
    }
    // 文档标题
    var siteName = (lang === "zh") ? "提马早报" : "TIMAB DAILY";
    document.title = siteName + " · " + fmtDate(new Date(BRIEFING.date + "T00:00:00"), lang);
    // 导航签
    var nav = document.getElementById("navChips");
    if (nav) {
      var order = ["pick"].concat(BRIEFING.sections.map(function (s) { return s.key; }));
      nav.innerHTML = "";
      order.forEach(function (key) {
        if (key === "pick") {
          var a = document.createElement("a");
          a.className = "chip-pick"; a.href = "#pick"; a.setAttribute("data-nav", "pick");
          a.textContent = T(BRIEFING.spotlight.badge, lang);
          nav.appendChild(a);
        } else {
          var sec = null;
          BRIEFING.sections.forEach(function (s) { if (s.key === key) sec = s; });
          if (!sec) return;
          var b = document.createElement("a");
          b.href = "#" + key; b.setAttribute("data-nav", key);
          b.style.borderColor = sec.color; b.style.color = sec.deep;
          b.textContent = T(sec.name, lang);
          nav.appendChild(b);
        }
      });
    }
    // 日历文案
    var cb = document.getElementById("calBtnText"); if (cb) cb.textContent = i18n.calBtn;
    var cw = document.getElementById("calWeek");
    if (cw) { cw.innerHTML = ""; i18n.calWeek.forEach(function (w) { var s = document.createElement("span"); s.textContent = w; cw.appendChild(s); }); }
    var cf = document.getElementById("calFoot"); if (cf) cf.textContent = i18n.calFoot;
    // 语言切换器（国旗触发 + 下拉）
    var ls = document.getElementById("langSwitch");
    if (ls) {
      ls.className = "lang-switch" + (langOpen ? " open" : "");
      ls.innerHTML = "";
      var trig = document.createElement("button");
      trig.type = "button"; trig.className = "lang-trigger"; trig.id = "langTrigger";
      trig.setAttribute("aria-haspopup", "true");
      trig.setAttribute("aria-expanded", langOpen ? "true" : "false");
      trig.innerHTML = flag(curLang) + '<span class="caret">▾</span>';
      trig.addEventListener("click", function (e) {
        e.stopPropagation();
        langOpen = !langOpen;
        ls.classList.toggle("open", langOpen);
        trig.setAttribute("aria-expanded", langOpen ? "true" : "false");
      });
      ls.appendChild(trig);
      var menu = document.createElement("div");
      menu.className = "lang-menu"; menu.setAttribute("role", "menu");
      LANGS.forEach(function (l) {
        var item = document.createElement("button");
        item.type = "button"; item.className = "lang-item" + (l === curLang ? " sel" : "");
        item.setAttribute("role", "menuitem"); item.setAttribute("data-lang", l);
        item.innerHTML = flag(l) + '<span class="lbl">' + LANG_LABEL_FULL[l] + "</span>";
        item.addEventListener("click", function (e) {
          e.stopPropagation();
          setLang(l);
        });
        menu.appendChild(item);
      });
      ls.appendChild(menu);
    }
  }

  function renderContent(lang) {
    var i18n = I18N[lang];
    var html = "";
    // 精选
    var sp = BRIEFING.spotlight;
    html += '<section class="spotlight" id="pick">'
      + '<div class="badge"><i></i>' + esc(T(sp.badge, lang)) + "</div>"
      + "<h2>" + titleHtml(sp.title, sp.hl, lang) + "</h2>"
      + '<div class="body">' + esc(T(sp.body, lang)) + "</div>"
      + '<div class="why"><b>' + esc(i18n.why) + "</b>" + esc(T(sp.why, lang)) + "</div>"
      + "</section>";
    // 分类
    html += '<div class="grid">';
    BRIEFING.sections.forEach(function (sec) {
      html += '<section class="card" id="' + sec.key + '" style="--ac:' + sec.color + "; --ac-deep:" + sec.deep + ';">'
        + '<div class="sec-head"><span class="sec-num">' + sec.num + "</span>"
        + "<h3>" + esc(T(sec.name, lang)) + "</h3>"
        + '<span class="en">' + sec.key.toUpperCase() + "</span></div>";
      (sec.items || []).forEach(function (it) {
        html += '<div class="item">';
        html += '<div class="t"><span class="idx">' + it.idx + "</span>";
        if (it.tag) html += '<span class="tag">' + esc(it.tag[lang] != null ? it.tag[lang] : i18n.tag) + "</span>";
        html += titleHtml(it.title, it.hl, lang) + "</div>";
        html += '<div class="d">' + esc(T(it.body, lang)) + "</div>";
        html += '<div class="why"><b>' + esc(i18n.why) + "</b>" + esc(T(it.why, lang)) + "</div>";
        html += "</div>";
      });
      html += "</section>";
    });
    html += "</div>";
    var content = document.getElementById("content");
    if (content) content.innerHTML = html;
    // 页脚
    var risk = document.getElementById("risk");
    if (risk) risk.textContent = T(BRIEFING.risk, lang);
  }

  function setLang(lang) {
    if (LANGS.indexOf(lang) < 0) lang = "zh";
    curLang = lang;
    langOpen = false;
    try { localStorage.setItem("timab_lang", lang); } catch (e) {}
    renderChrome(lang);
    renderContent(lang);
  }

  /* ===== 往期日历（保留原逻辑，文案随语言） ===== */
  function initCalendar() {
    var btn = document.getElementById("calBtn");
    var pop = document.getElementById("calPop");
    var grid = document.getElementById("calGrid");
    var title = document.getElementById("calTitle");
    if (!btn || !pop || !grid || !title) return;

    var parts = BRIEFING.date.split("-");
    var todayKey = parts[0].slice(2) + parts[1] + parts[2];
    var cur = { y: +parts[0], m: +parts[1] };
    var has = {};
    for (var i = 0; i < ARCHIVE_DATES.length; i++) { has[ARCHIVE_DATES[i]] = 1; }
    var HIST_BASE = /\/history\//.test(location.pathname) ? "./" : "history/";

    function ckey(y, m, d) { return String(y).slice(2) + pad(m) + pad(d); }

    function render() {
      var i18n = I18N[curLang];
      title.textContent = i18n.calTitle(cur.y, cur.m);
      grid.innerHTML = "";
      var start = new Date(cur.y, cur.m - 1, 1).getDay();
      var days = new Date(cur.y, cur.m, 0).getDate();
      for (var b = 0; b < start; b++) {
        var blank = document.createElement("span");
        blank.className = "cal-cell is-empty"; grid.appendChild(blank);
      }
      for (var d = 1; d <= days; d++) {
        var k = ckey(cur.y, cur.m, d);
        var cell = document.createElement("span");
        cell.className = "cal-cell" + (has[k] ? " has" : "") + (k === todayKey ? " is-today" : "");
        cell.textContent = d;
        if (has[k]) {
          cell.setAttribute("role", "link"); cell.setAttribute("tabindex", "0");
          cell.title = cur.y + "-" + pad(cur.m) + "-" + pad(d) + " 存档";
          (function (target) {
            var go = function () { window.open(HIST_BASE + target + ".html", "_blank", "noopener"); };
            cell.addEventListener("click", go);
            cell.addEventListener("keydown", function (e) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); go(); } });
          })(k);
        }
        grid.appendChild(cell);
      }
    }
    function toggle(open) {
      pop.hidden = !open;
      btn.setAttribute("aria-expanded", open ? "true" : "false");
      if (open) render();
    }
    btn.addEventListener("click", function (e) { e.stopPropagation(); toggle(pop.hidden); });
    document.getElementById("calPrev").addEventListener("click", function () { cur.m--; if (cur.m < 1) { cur.m = 12; cur.y--; } render(); });
    document.getElementById("calNext").addEventListener("click", function () { cur.m++; if (cur.m > 12) { cur.m = 1; cur.y++; } render(); });
    document.addEventListener("click", function (e) { if (!pop.hidden && !pop.contains(e.target)) toggle(false); });
    document.addEventListener("keydown", function (e) { if (e.key === "Escape" && !pop.hidden) toggle(false); });
  }

  /* ===== 启动 ===== */
  function boot() {
    curLang = detectLang();
    renderChrome(curLang);
    renderContent(curLang);
    initCalendar();
    // 关闭语言下拉：点击外部 / Esc
    document.addEventListener("click", function (e) {
      var ls = document.getElementById("langSwitch");
      if (ls && langOpen && !ls.contains(e.target)) {
        langOpen = false;
        ls.classList.remove("open");
        var t = document.getElementById("langTrigger");
        if (t) t.setAttribute("aria-expanded", "false");
      }
    });
    document.addEventListener("keydown", function (e) {
      if (e.key === "Escape" && langOpen) {
        langOpen = false;
        var ls = document.getElementById("langSwitch");
        if (ls) ls.classList.remove("open");
        var t = document.getElementById("langTrigger");
        if (t) t.setAttribute("aria-expanded", "false");
      }
    });
  }
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", boot);
  } else { boot(); }
})();
</script>
