nd veteran consistency is scarcer than young momentum right now.", "es": "Los 500 m se deciden en las tres primeras zancadas y en la última curva, donde una décima supone dos puestos. Pasar del bronce al oro en un día es la clase de ajuste que incomoda más al rival que el propio resultado. Es la primera temporada completa tras los Juegos, y la regularidad de los veteranos escasea más que el empuje de los jóvenes.", "ja": "500 メートルは最初の 3 歩と最終コーナーで決まる。0.1 秒が順位 2 つ分だ。銅から金へ 1 日で切り替える調整力は、結果そのものより相手にとって厄介である。五輪後の最初のフルシーズンであり、今は若手の勢いよりもベテランの安定が貴重だ。"}}, {"idx": "04", "tag": {"zh": "进展"}, "title": {"zh": "国足 17 日 20 时肇庆再战巴林，一场关系世预赛分档的年度收官战", "en": "China host Bahrain in Zhaoqing on 17 November, a year-ender that decides World Cup qualifying seeding", "es": "China recibe a Baréin en Zhaoqing el 17 de noviembre, cierre de año que decide el bombo del Mundial", "ja": "中国代表、17 日 20 時に肇慶でバーレーン戦、W 杯予選のポットを左右する年内最終戦"}, "body": {"zh": "11 月 14 日 2:0 击败马来西亚后，中国男足将于 11 月 17 日 20 时在肇庆新区体育中心迎战巴林，CCTV5 直播，这是国足 2026 年的最后一场比赛。国际足联实时排名显示，国足凭这场胜利获得 3.69 个技术积分，以 1245.59 分升至世界第 95、亚洲第 15 位，反超巴林（亚洲第 16，落后 1.89 分）。据记者马德兴测算，17 日取胜可再得 4.98 分，总分 1250.57；若输球将被扣 5.02 分并被巴林反超。由于越南、塔吉克斯坦同日最多只有一队能超越，国足已锁定 12 月 15 日世预赛分组抽签的第二档席位。两队历史交手 9 次，国足 5 胜 4 平保持不败，最近两次世预赛交锋均为 1:0。", "en": "After beating Malaysia 2-0 on 14 November, China play Bahrain at 20:00 on 17 November at the Zhaoqing New Area Sports Centre, live on CCTV5 — their last match of 2026. FIFA's live ranking gives China 3.69 technical points for the win, lifting them to 1,245.59 points, 95th in the world and 15th in Asia, ahead of Bahrain, who are 16th and 1.89 points behind. Journalist Ma Dexing calculates a win on 17 November would add 4.98 points for 1,250.57, while a defeat would cost 5.02 and let Bahrain pass. Because only one of Vietnam or Tajikistan can overtake on the same day, China have secured a second-pot place at the 15 December qualifying draw. The sides have met nine times: five Chinese wins, four draws, with the last two qualifiers both 1-0.", "es": "Tras ganar 2-0 a Malasia el 14 de noviembre, China se enfrenta a Baréin el 17 de noviembre a las 20:00 en el Centro Deportivo de Zhaoqing, con emisión en CCTV5: su último partido de 2026. El ranking en vivo de la FIFA otorga 3,69 puntos técnicos por esa victoria, hasta 1.245,59, 95.º del mundo y 15.º de Asia, por delante de Baréin, 16.º y a 1,89 puntos. El periodista Ma Dexing calcula que ganar el 17 sumaría 4,98 puntos hasta 1.250,57, mientras una derrota restaría 5,02 y dejaría pasar a Baréin. Como solo uno de Vietnam o Tayikistán puede superar a China ese día, el segundo bombo del sorteo del 15 de diciembre está asegurado. Se han enfrentado nueve veces: cinco victorias chinas y cuatro empates, con los dos últimos partidos de clasificación 1-0.", "ja": "11 月 14 日にマレーシアを 2 対 0 で破った中国代表は、11 月 17 日 20 時から肇慶新区体育センターでバーレーンと対戦する。CCTV5 が生中継し、2026 年の最終戦となる。FIFA のライブランキングではこの勝利で技術ポイント 3.69 を獲得し、1245.59 で世界 95 位、アジア 15 位に浮上してバーレーン（アジア 16 位、1.89 ポイント差）を逆転した。記者の馬徳興氏の試算では、17 日に勝てば 4.98 ポイントを加えて 1250.57、敗れれば 5.02 を失ってバーレーンに抜かれる。同日にベトナムとタジキスタンのうち 1 チームしか中国を超えられないため、12 月 15 日の予選組み合わせ抽選で第 2 ポットは確定した。過去の対戦は 9 回で 5 勝 4 分け、直近 2 回の予選はいずれも 1 対 0 だった。"}, "why": {"zh": "这一场的意义不在赢不赢，而在「档位」——第二档意味着 36 强赛不会同组撞上两支强队，这是能算出来的实惠。真正要看的还是老问题：2:0 之后下半场被马来西亚压着打、控球率只有 43%，巴林不会给那么多空间。", "en": "The point of this match is not the result but the pot: second-pot status means not drawing two strong sides in the same group in the 36-team stage, a concrete, calculable gain. The real question is the old one: after going 2-0 up China were pinned back by Malaysia in the second half with only 43 percent possession, and Bahrain will not offer that much space.", "es": "Lo importante de este partido no es ganar sino el bombo: estar en el segundo evita dos rivales fuertes en el mismo grupo de la fase de 36, una ventaja concreta y calculable. La duda real es la de siempre: tras el 2-0, Malasia dominó en la segunda parte y China tuvo solo un 43 % de posesión; Baréin no dará ese espacio.", "ja": "この一戦の意味は勝敗ではなく「ポット」にある。第 2 ポットなら 36 チーム制の一次リーグで強豪 2 チームと同じ組にならず、計算できる利得がある。問われるのはいつもの課題だ。2 対 0 のあと後半はマレーシアに押し込まれ、ボール支配率は 43 % しかなかった。バーレーンはそこまでの余裕を与えない。"}}, {"idx": "05", "tag": {}, "title": {"zh": "NBA 西部两队 11 胜 2 负并列，东契奇场均 38.6 分领跑得分榜", "en": "Two Western teams tied at 11-2 as Doncic leads scoring at 38.6 a game", "es": "Dos equipos del Oeste empatados con 11-2 y Doncic lidera con 38,6 puntos por partido", "ja": "NBA 西は 2 チームが 11 勝 2 敗で並ぶ、ドンチッチは平均 38.6 得点で首位"}, "body": {"zh": "11 月 15 日 NBA 常规赛，灰熊 129:110 篮网、公牛 117:106 森林狼、热火 137:117 活塞、骑士 127:117 独行侠、掘金 116:108 鹈鹕、76 人 131:124 步行者。最新排名显示，马刺与湖人同为 11 胜 2 负并列西部第一，火箭 10 胜 3 负第三，开拓者 9 胜 3 负第四；东部凯尔特人 10 胜 2 负居首，76 人 11 胜 3 负紧随。个人数据方面，东契奇场均 38.6 分领跑得分榜，文班亚马场均 4.2 次盖帽居首，并贡献 28.8 分、11.7 个篮板。", "en": "In NBA regular-season play on 15 November, Memphis beat Brooklyn 129-110, Chicago beat Minnesota 117-106, Miami beat Detroit 137-117, Cleveland beat Dallas 127-117, Denver beat New Orleans 116-108 and Philadelphia beat Indiana 131-124. The latest standings have San Antonio and the Lakers tied atop the West at 11-2, with Houston third at 10-3 and Portland fourth at 9-3; Boston leads the East at 10-2 with Philadelphia close at 11-3. Individually, Luka Doncic leads scoring at 38.6 points a game, while Victor Wembanyama tops blocks at 4.2 while averaging 28.8 points and 11.7 rebounds.", "es": "En la jornada del 15 de noviembre, Memphis ganó 129-110 a Brooklyn, Chicago 117-106 a Minnesota, Miami 137-117 a Detroit, Cleveland 127-117 a Dallas, Denver 116-108 a Nueva Orleans y Philadelphia 131-124 a Indiana. En la clasificación, San Antonio y los Lakers comparten el liderato del Oeste con 11-2, Houston es tercero con 10-3 y Portland cuarto con 9-3; Boston manda en el Este con 10-2 y Philadelphia le sigue con 11-3. En lo individual, Luka Doncic lidera la anotación con 38,6 puntos por partido y Victor Wembanyama los tapones con 4,2, además de 28,8 puntos y 11,7 rebotes.", "ja": "11 月 15 日の NBA はメンフィスがブルックリンに 129 対 110、シカゴがミネソタに 117 対 106、マイアミがデトロイトに 137 対 117、クリーブランドがダラスに 127 対 117、デンバーがニューオーリンズに 116 対 108、フィラデルフィアがインディアナに 131 対 124 で勝利。順位表ではサンアントニオとレイカーズがともに 11 勝 2 敗で西首位に並び、ヒューストンが 10 勝 3 敗で 3 位、ポートランドが 9 勝 3 敗で 4 位。東はボストンが 10 勝 2 敗で首位、フィラデルフィアが 11 勝 3 敗で続く。個人ではドンチッチが平均 38.6 得点で得点王、ウェンバンヤマが平均 4.2 ブロックで首位、28.8 得点 11.7 リバウンドを記録している。"}, "why": {"zh": "马刺和湖人同时 11 胜 2 负，是近十年少见的开局。马刺靠文班的护框（场均 4.2 帽），湖人靠东契奇的得分（38.6 分）——两种完全不同的赢球方式摆在同一起跑线上，西决的剧本等于提前写了一半。", "en": "San Antonio and Los Angeles both at 11-2 is an opening the West has not seen for a decade. The Spurs win with Wembanyama's rim protection at 4.2 blocks a game; the Lakers win with Doncic's 38.6 points. Two completely different ways of winning, level on the same start line — half the conference finals script is already written.", "es": "San Antonio y los Lakers con 11-2 es un arranque que el Oeste no veía en una década. Los Spurs ganan con la protección del aro de Wembanyama (4,2 tapones); los Lakers, con los 38,6 puntos de Doncic. Dos formas totalmente distintas de ganar en la misma línea de salida: medio guion de la final del Oeste ya está escrito.", "ja": "サンアントニオとレイカーズが同時に 11 勝 2 敗というのは、西ではこの 10 年で見なかったスタートだ。スパーズはウェンバンヤマのリングプロテクト（平均 4.2 ブロック）、レイカーズはドンチッチの得点（38.6）で勝つ。まったく違う勝ち方が同じスタートラインに並んでおり、カンファレンス決勝の筋書きは半分できたようなものだ。"}}]}, {"key": "hot", "num": "05", "color": "#6d28d9", "deep": "#5b21b6", "name": {"zh": "网络热点", "en": "Trending", "es": "Tendencias", "ja": "ネット"}, "items": [{"idx": "01", "tag": {}, "title": {"zh": "「中国砒霜治疗成国际方案」冲上热搜：白血病五年生存率超 90%", "en": "Arsenic-based Chinese leukaemia therapy trends as it becomes the global standard", "es": "La terapia china con arsénico para la leucemia se vuelve tendencia al ser el estándar mundial", "ja": "「中国の砒素療法が国際標準に」がトレンド、白血病 5 年生存率 90 % 超"}, "body": {"zh": "11 月 15 日，「中国砒霜治疗成国际方案」话题冲上热搜。我国科研团队开创「全反式维甲酸＋三氧化二砷（砒霜）」的「上海方案」，将急性早幼粒细胞白血病五年生存率提升至 90% 以上，成为全球标准治疗方案。该疗法创始人中国科学院院士陈竺与法国医学家安妮·德尚、戴宇阁日前共同获得 2026 年度邵逸夫生命科学与医学奖。陈竺表示，本次获奖奖金将全部捐赠用于中国慢病防控事业。", "en": "On 15 November the topic Chinese arsenic therapy becomes an international protocol trended on Chinese social media. A domestic research team's Shanghai protocol, combining all-trans retinoic acid with arsenic trioxide, raised five-year survival in acute promyelocytic leukaemia above 90 percent and became the global standard of care. Its originator, Chinese Academy of Sciences academician Chen Zhu, shared the 2026 Shaw Prize in Life Science and Medicine with French physicians Anne Dejean and Hugues de Thé. Chen Zhu said the entire prize money will be donated to chronic disease prevention in China.", "es": "El 15 de noviembre el tema La terapia china con arsénico se convierte en protocolo internacional fue tendencia en las redes chinas. El protocolo de Shanghái, que combina ácido retinoico todo trans con trióxido de arsénico, elevó la supervivencia a cinco años de la leucemia promielocítica aguda por encima del 90 % y se convirtió en el estándar mundial. Su creador, el académico Chen Zhu, compartió el Premio Shaw 2026 de Ciencias de la Vida y Medicina con los médicos franceses Anne Dejean y Hugues de Thé. Chen Zhu anunció que donará todo el premio a la prevención de enfermedades crónicas en China.", "ja": "11 月 15 日、「中国の砒素療法が国際標準に」がトレンド入りした。国内の研究チームが開発した「上海プラン」は、全トランス型レチノイン酸と三酸化ヒ素（砒素）を組み合わせ、急性前骨髄球性白血病の 5 年生存率を 90 % 超に高め、世界標準の治療となった。開発者である中国科学院院士の陳竺氏は、フランスのアンヌ・デジャン氏、ユーグ・ド・テ氏とともに 2026 年度シャオ・プライズ生命科学・医学賞を共同受賞。賞金はすべて中国の慢性疾患対策に寄付すると述べた。"}, "why": {"zh": "砒霜治白血病，这个故事最动人的地方是它把「毒」变成了「药」，而且是中国方案写进了全球指南。从民间偏方到国际标准，这条路走了近半个世纪。陈竺把奖金全捐给慢病防控，也解释了为什么这条热搜让人愿意转。", "en": "Arsenic curing leukaemia is compelling because it turns a poison into a medicine — and because a Chinese protocol ended up written into global guidelines. The road from folk remedy to international standard took nearly half a century. Chen Zhu donating the whole prize to chronic disease work explains why people were willing to share this one.", "es": "Que el arsénico cure una leucemia conmueve porque convierte un veneno en medicamento, y porque un protocolo chino acabó escrito en las guías mundiales. Del remedio popular al estándar internacional pasaron casi cincuenta años. Que Chen Zhu done todo el premio a la prevención de enfermedades crónicas explica por qué la gente quiso compartir esta noticia.", "ja": "砒素で白血病を治す——この話が心を打つのは、「毒」を「薬」に変えたからであり、中国の治療法が世界のガイドラインに書き込まれたからだ。民間療法から国際標準まで、ほぼ半世紀かかった。陳竺氏が賞金を全額慢性疾患対策に寄付したことが、この話題が共有された理由でもある。"}}, {"idx": "02", "tag": {}, "title": {"zh": "「方博复出首冠」热搜第一：34 岁代表哈萨克斯坦，13 年后再夺国际赛男单冠军", "en": "Ex-national team player Fang Bo tops trending after a first title in 13 years at 34", "es": "Fang Bo, exjugador del equipo nacional, lidera tendencias con su primer título en 13 años a los 34", "ja": "「方博、復帰後初優勝」がトレンド首位、34 歳で 13 年ぶり国際大会制覇"}, "body": {"zh": "11 月 15 日，WTT 伊斯坦布尔站男单决赛，34 岁的前国乒主力方博以 4:1 击败姜东硕夺冠，比分 11:9、8:11、11:8、11:6、11:9。这是他 2013 年巡回赛奥地利站夺冠后，时隔 13 年再夺国际赛事男单冠军，也是 6 月初复出以来的首个冠军。方博 2021 年 10 月宣布退出中国国家乒乓球队，2026 年 4 月以哈萨克斯坦运动员身份注册参加 WTT 赛事。相关话题冲上微博热搜第一，他赛后发文称「我不是人中龙凤，但绝非等闲之辈」。本站国乒以二线年轻阵容出战，五个项目全部无缘决赛；方博晋级路上曾 3:0 战胜国乒选手陈俊菘。", "en": "On 15 November, 34-year-old former Chinese national team player Fang Bo won the WTT Istanbul men's singles, beating Kang Dongsoo 4-1 at 11-9, 8-11, 11-8, 11-6, 11-9. It is his first international singles title in 13 years, since the 2013 Austrian Open, and his first since returning in early June. Fang left the national team in October 2021 and registered as a Kazakhstan athlete for WTT events in April 2026. The topic topped Weibo's trending list; he wrote afterwards that he is no prodigy but no ordinary player either. China's second-string young squad failed to reach any of the five finals in Istanbul, and Fang beat Chinese player Chen Junsong 3-0 on the way.", "es": "El 15 de noviembre, el exjugador del equipo nacional chino Fang Bo, de 34 años, ganó el individual masculino del WTT de Estambul al vencer 4-1 a Kang Dongsoo (11-9, 8-11, 11-8, 11-6, 11-9). Es su primer título internacional individual en 13 años, desde el Abierto de Austria de 2013, y el primero desde su regreso a principios de junio. Fang dejó el equipo nacional en octubre de 2021 y se registró como deportista de Kazajistán para torneos WTT en abril de 2026. El tema lideró las tendencias de Weibo; tras el partido escribió que no es un prodigio pero tampoco un jugador cualquiera. La selección china de segunda línea no alcanzó ninguna de las cinco finales en Estambul y Fang superó 3-0 al chino Chen Junsong.", "ja": "11 月 15 日、WTT イスタンブール大会の男子シングルス決勝で、元中国代表の 34 歳・方博が姜東碩を 4 対 1（11 対 9、8 対 11、11 対 8、11 対 6、11 対 9）で破って優勝した。2013 年のオーストリア・オープン以来 13 年ぶりの国際大会シングルス優勝であり、6 月初旬の復帰後初のタイトル。方博は 2021 年 10 月に中国代表からの引退を表明し、2026 年 4 月にカザフスタン選手として WTT に登録した。関連話題は微博のトレンド首位となり、本人は「人中の竜鳳ではないが、並の者でもない」と投稿した。中国は二線級の若手で出場し 5 種目すべて決勝に進めず、方博は道中で中国の陳俊菘を 3 対 0 で破っている。"}, "why": {"zh": "热搜第一不是因为冠军有多大，而是因为这四年太具体：退出国家队、没有比赛、换协会重新注册、从底层打起。34 岁还能赢，靠的不是天赋回春，是没放下。国乒二线五个项目零决赛，则是这条新闻的另一面。", "en": "It topped the list not because the title is big but because the four years are so concrete: leaving the national team, having no matches, re-registering under another association, starting from the bottom. Winning at 34 is not a talent revival, it is not letting go. That China's second string reached no final in five events is the other half of the story.", "es": "Lideró las tendencias no por la magnitud del título, sino porque los cuatro años son muy concretos: dejar el equipo nacional, quedarse sin competir, registrarse con otra federación, empezar desde abajo. Ganar a los 34 no es un renacer del talento, es no haberlo soltado. Que la segunda línea china no llegara a ninguna final en cinco pruebas es la otra cara.", "ja": "トレンド首位の理由はタイトルの大きさではなく、この 4 年があまりに具体的だからだ。代表を離れ、試合がなくなり、協会を変えて再登録し、下から這い上がる。34 歳で勝てたのは才能が戻ったからではなく、手放さなかったからだ。中国の二線級が 5 種目で決勝に進めなかったことが、このニュースのもう一面である。"}}, {"idx": "03", "tag": {}, "title": {"zh": "总台曝光「低价旅游团」带老人买高价海景房，无锡、乳山多部门现场核查", "en": "State broadcaster exposes budget tours steering elderly buyers into overpriced seaside flats", "es": "La televisión estatal revela tours baratos que llevan a mayores a comprar pisos costeros sobrevalorados", "ja": "国営放送が「格安ツアー」の高値マンション販売を報道、無錫・乳山で立入調査"}, "body": {"zh": "日前，中央广播电视总台曝光「低价旅游团」通过低价引流、利用信息差等手段，让中老年人购买远高于市场价格的房子。节目播出后，江苏无锡、山东乳山多部门开展联合行动，进行现场核查。报道显示，此类团以极低团费吸引老年人参团，途中安排「看房」环节，销售人员以「养老」「投资」为名推动签约，部分房源价格明显高于同区域市场价。", "en": "China Media Group has reported that budget tour groups use low prices to draw in older travellers and, exploiting information gaps, push them to buy homes well above market value. After the broadcast, authorities in Wuxi in Jiangsu and Rushan in Shandong launched joint on-site inspections. The report described tours with very low fees that include a viewing segment where sales staff invoke elderly care and investment to close deals, with some units priced well above comparable local listings.", "es": "El grupo estatal de medios de China informó de que los tours baratos captan a personas mayores con precios bajos y, aprovechando la falta de información, las empujan a comprar viviendas muy por encima del valor de mercado. Tras la emisión, autoridades de Wuxi (Jiangsu) y Rushan (Shandong) iniciaron inspecciones conjuntas. El reportaje describe viajes con tarifas muy bajas que incluyen una visita a una promoción donde los vendedores invocan el cuidado de mayores y la inversión para cerrar contratos, con precios muy superiores a los de la zona.", "ja": "中国中央広播電視総台が、格安ツアーが安価な料金で高齢者を集め、情報格差を利用して市場価格を大きく上回る住宅を購入させていると報道した。放送後、江蘇省無錫市と山東省乳山市の複数部門が合同で現地調査に入った。報道によれば、こうしたツアーは極端に安い参加費で高齢者を募り、途中で「物件見学」を組み込み、営業担当が「老後の住まい」「投資」を口実に契約を迫る。一部物件の価格は同一地域の相場を大きく上回っていた。"}, "why": {"zh": "低价团的成本从来不在团费里，而在购物和看房的返点上。这次被点破的是最贵的一环——一套房的首付，够买几百次旅游。监管到场核查只是第一步，真正难的是让老人相信「便宜」本身就是成本。", "en": "The cost of a budget tour was never in the fee; it is in the commissions from shopping stops and property viewings. What got exposed this time is the most expensive link in the chain: a down payment is worth hundreds of tours. On-site inspections are only step one; the hard part is convincing older buyers that cheap is itself a cost.", "es": "El coste de un tour barato nunca estuvo en la tarifa, sino en las comisiones de las paradas comerciales y las visitas a promociones. Lo que se destapó ahora es el eslabón más caro: la entrada de un piso equivale a cientos de viajes. La inspección es solo el primer paso; lo difícil es convencer a los mayores de que lo barato ya es un coste.", "ja": "格安ツアーのコストは参加費ではなく、買い物と物件見学の手数料にある。今回暴かれたのは最も高価な部分だ。住宅の頭金は、ツアー数百回分に相当する。立入調査は第一歩にすぎず、本当に難しいのは「安いこと自体がコストだ」と高齢者に理解してもらうことである。"}}, {"idx": "04", "tag": {}, "title": {"zh": "塔克拉玛干腹地发现千年胡杨：高 16 米、胸围 8.95 米", "en": "A thousand-year poplar found deep in the Taklamakan: 16 metres tall, 8.95 metres around", "es": "Hallan un álamo milenario en el Taklamakán: 16 metros de alto y 8,95 de perímetro", "ja": "タクラマカン砂漠奥地で千年ポプラ発見、高さ 16 メートル・幹周 8.95 メートル"}, "body": {"zh": "科考队在塔克拉玛干沙漠腹地发现一棵巨型千年胡杨，高 16 米、胸围 8.95 米，七八个成年人才能合抱。科考队推断，它依靠不定期的极端洪水以及渗入沙层的地下水顽强生存。胡杨被称为「沙漠英雄树」，耐旱、耐盐碱，是塔里木盆地绿洲与荒漠之间的关键树种。", "en": "An expedition has found a giant thousand-year-old Euphrates poplar deep in the Taklamakan desert, 16 metres tall with a trunk circumference of 8.95 metres — seven or eight adults with arms outstretched to encircle it. The team believes it survives on irregular extreme floods and groundwater seeping into the sand layer. Known as the hero tree of the desert for its tolerance of drought and salinity, the species is a key link between oasis and wasteland in the Tarim Basin.", "es": "Una expedición científica halló un álamo de Eufrates milenario de gran tamaño en el corazón del desierto de Taklamakán: 16 metros de altura y 8,95 de perímetro, para abarcarlo hacen falta siete u ocho adultos. El equipo cree que sobrevive gracias a inundaciones extremas irregulares y al agua subterránea que se filtra en la capa de arena. Conocido como el árbol héroe del desierto por su tolerancia a la sequía y la salinidad, es una especie clave entre oasis y desierto en la cuenca del Tarim.", "ja": "調査隊がタクラマカン砂漠の奥地で巨大な千年ポプラ（胡楊）を発見した。高さ 16 メートル、幹周 8.95 メートルで、7、8 人の大人が手を回してようやく届く。隊は、不定期の極端な洪水と砂層に浸み込む地下水によって生き延びてきたと推測する。乾燥と塩害に強く「砂漠の英雄樹」と呼ばれ、タリム盆地のオアシスと荒野をつなぐ重要な樹種である。"}, "why": {"zh": "在年降水量不足 50 毫米的地方长到 16 米，靠的不是运气，是把根扎到了别人够不到的地方。这棵树的年轮里，很可能记着塔里木河每一次改道——比起「奇观」，它更像一份活着的水文档案。", "en": "Growing 16 metres tall where annual rainfall is under 50 millimetres is not luck; it is putting roots where others cannot reach. This tree's rings very likely record every time the Tarim River changed course. More than a spectacle, it is a living hydrological archive.", "es": "Crecer 16 metros donde llueve menos de 50 milímetros al año no es suerte: es hundir las raíces donde otros no llegan. Los anillos de este árbol probablemente registran cada cambio de cauce del río Tarim. Más que una curiosidad, es un archivo hidrológico vivo.", "ja": "年降水量 50 ミリ未満の土地で 16 メートルまで育つのは運ではない。他の届かない深さに根を張ったからだ。この木の年輪には、タリム河が流路を変えた記録が刻まれている可能性が高い。「珍景」というより、生きた水文アーカイブである。"}}, {"idx": "05", "tag": {}, "title": {"zh": "30 岁白领退掉出租房住进 SUV：上班睡车里，周末回 70 公里外的家", "en": "A 30-year-old gives up his flat for an SUV: sleeping in the car on office days", "es": "Un joven de 30 años deja el alquiler y vive en su SUV: duerme en el coche los días de oficina", "ja": "30 歳会社員が賃貸を解約し SUV 生活、出社日は車中泊・週末は 70 キロ先の実家へ"}, "body": {"zh": "据成都当地媒体报道，30 岁的王先生在成都一家外企工作，他退掉出租房，把自己的 SUV 改成「床车」：需要到办公室时在车上过夜，居家办公时则驱车回到 70 公里外的老家。报道称，这样每月可省下一笔房租，同时保留随时回老家的自由。类似「床车生活」的分享近两年在社交平台上持续增多，参与者多为需要在大城市工作、又不愿长期承担房租的年轻人。", "en": "Local media in Chengdu report that 30-year-old Wang, who works for a foreign company there, gave up his rented flat and converted his SUV into a camper: he sleeps in the car when he has to be in the office and drives to his family home 70 kilometres away when he can work remotely. The arrangement saves rent each month while keeping the freedom to go home at will. Similar car-living accounts have multiplied on Chinese social platforms over the past two years, mostly from young people who need to work in big cities but do not want to carry rent long term.", "es": "Medios locales de Chengdu informan de que Wang, de 30 años y empleado de una empresa extranjera, dejó su piso de alquiler y convirtió su SUV en una minicamper: duerme en el coche cuando debe ir a la oficina y conduce hasta su casa familiar, a 70 kilómetros, cuando trabaja en remoto. Así ahorra el alquiler cada mes y conserva la libertad de volver cuando quiera. Los relatos de vida en el coche se han multiplicado en las redes chinas en los dos últimos años, sobre todo entre jóvenes que necesitan trabajar en grandes ciudades sin asumir un alquiler permanente.", "ja": "成都の地元メディアによると、外資系企業に勤める 30 歳の王さんは賃貸を解約し、SUV を「車中泊仕様」に改造した。出社が必要な日は車で眠り、在宅勤務の日は 70 キロ離れた実家へ車で帰る。毎月の家賃を浮かせながら、いつでも実家に帰れる自由を保てるという。こうした「車上生活」の投稿はこの 2 年、中国の SNS で増え続けており、大都市で働きながら長期の家賃負担を避けたい若者が中心だ。"}, "why": {"zh": "这条新闻被讨论的不是「省钱」，而是「体面」——一个有正式工作的人，为什么愿意睡在车里？当房租占到收入三分之一以上，「住哪儿」就从生活方式问题变成了算术问题。它不值得美化，也不该被嘲笑，它只是一个价格信号。", "en": "What gets debated is not the saving but the dignity: why would someone with a proper job choose to sleep in a car? Once rent exceeds a third of income, where to live stops being a lifestyle question and becomes arithmetic. It does not need romanticising or mocking; it is a price signal.", "es": "Lo que se debate no es el ahorro sino la dignidad: por qué alguien con un empleo formal acepta dormir en el coche. Cuando el alquiler supera un tercio de los ingresos, dónde vivir deja de ser una cuestión de estilo de vida y pasa a ser aritmética. No hay que idealizarlo ni burlarse: es una señal de precio.", "ja": "議論されているのは「節約」ではなく「体面」だ。正規の仕事を持つ人が、なぜ車で眠ることを選ぶのか。家賃が収入の 3 分の 1 を超えると、「どこに住むか」は生き方の問題ではなく算数の問題になる。美化するものでも嘲笑するものでもなく、これは価格のシグナルである。"}}]}, {"key": "ent", "num": "06", "color": "#db2777", "deep": "#be185d", "name": {"zh": "娱乐八卦", "en": "Showbiz", "es": "Espectáculos", "ja": "エンタメ"}, "items": [{"idx": "01", "tag": {}, "title": {"zh": "尖叫之夜首轮 82 组阵容按本名拼音排序，票价最高 2480 元还捆绑年卡", "en": "iQIYI Scream Night lists 82 acts alphabetically by real name, with tickets up to 2,480 yuan plus a bundled membership", "es": "El Scream Night de iQIYI anuncia 82 artistas por orden alfabético y entradas de hasta 2.480 yuanes con membresía obligatoria", "ja": "尖叫之夜が 82 組を本名のピンイン順で発表、最高 2480 元で年会費もセット"}, "body": {"zh": "11 月 15 日，2026 爱奇艺尖叫之夜首轮 82 组嘉宾官宣，活动将于 12 月 5 日在中国澳门银河综艺馆举行。名单包括胡歌、沈腾、于和伟、马伊琍、杨紫、白鹿、张凌赫、田曦薇、侯明昊等，官方按艺人本名拼音首字母从 A 到 Z 排序，以回避传统「番位」争议。票价方面，三层看台由去年 680 元涨至 980 元，二层由 1080 元涨至 1480 元，内场达 2480 元；且门票不再单独发售，改为与会员年卡捆绑的「尖叫礼盒」。", "en": "On 15 November iQIYI announced the first 82 acts for its 2026 Scream Night, to be held at Galaxy Arena in Macao, China on 5 December. The list includes Hu Ge, Shen Teng, Yu Hewei, Ma Yili, Yang Zi, Bai Lu, Zhang Linghe, Tian Xiwei and Hou Minghao, ordered alphabetically by the pinyin of each performer's real name rather than by billing. Ticket prices rose from 680 to 980 yuan for the third tier, 1,080 to 1,480 for the second and up to 2,480 for floor seats, and tickets are no longer sold separately but bundled with an annual membership in a Scream Gift Box.", "es": "El 15 de noviembre iQIYI anunció los primeros 82 artistas de su Scream Night 2026, que se celebrará el 5 de diciembre en el Galaxy Arena de Macao, China. La lista incluye a Hu Ge, Shen Teng, Yu Hewei, Ma Yili, Yang Zi, Bai Lu, Zhang Linghe, Tian Xiwei y Hou Minghao, ordenados alfabéticamente por el pinyin del nombre real y no por cartel. Las entradas suben de 680 a 980 yuanes en el tercer anillo, de 1.080 a 1.480 en el segundo y hasta 2.480 en pista, y ya no se venden por separado sino en un paquete con membresía anual.", "ja": "11 月 15 日、iQIYI の「2026 尖叫之夜」第 1 弾 82 組が発表された。12 月 5 日に中国マカオのギャラクシー・アリーナで開催される。胡歌、沈騰、于和偉、馬伊琍、楊紫、白鹿、張凌赫、田曦薇、侯明昊らが名を連ね、公式は本名のピンイン頭文字で A から Z まで配列し、従来の「番位」論争を避けた。料金は 3 階が昨年の 680 元から 980 元、2 階が 1080 元から 1480 元、アリーナは 2480 元。チケットは単独販売をやめ、年会費とセットの「尖叫ギフトボックス」となった。"}, "why": {"zh": "按拼音排序这一手很聪明——把番位难题交给字母表，谁也不得罪。但票价涨三到五百、还强制搭年卡，说明盛典这门生意的成本已经从「请谁」转移到「卖给谁」。观众愿意为见一面付钱，前提是那一面值得。", "en": "Alphabetical order is clever: hand the billing problem to the letter A and offend nobody. But raising prices by 300 to 500 yuan and bundling a membership shows where the cost of these galas has moved — from booking talent to monetising the audience. People will pay to see someone once, provided the once is worth it.", "es": "El orden alfabético es ingenioso: se entrega el problema del cartel al abecedario y nadie queda ofendido. Pero subir 300 o 500 yuanes y atar una membresía muestra dónde se ha movido el coste de estas galas: de contratar talento a monetizar al público. La gente paga por ver a alguien una vez, siempre que esa vez valga la pena.", "ja": "ピンイン順というのは賢い。順位の問題をアルファベットに委ね、誰も傷つけない。だが 300〜500 元の値上げと年会費のセットは、この手のガラのコストが「誰を呼ぶか」から「誰に売るか」へ移ったことを示す。観客は一度会うためにお金を払うが、その一度に値打ちがあることが前提だ。"}}, {"idx": "02", "tag": {}, "title": {"zh": "侯明昊工作室谴责品牌违规卖座位，雪中飞致歉：最高 4999 元", "en": "Hou Minghao's studio condemns a brand for selling seats to his event; Xuezhongfei apologises", "es": "El estudio de Hou Minghao denuncia la venta de asientos por una marca; Xuezhongfei se disculpa", "ja": "侯明昊のスタジオがブランドの座席販売を非難、雪中飛が謝罪"}, "body": {"zh": "11 月 15 日晚，「侯明昊工作室谴责品牌违规售票」登上热搜。工作室声明称，与羽绒服品牌雪中飞就 11 月 21 日线下活动的合同中明确禁止品牌以任何有偿方式发放入场门票，但品牌未事先取得同意即公开售卖活动座位；要求立即停止售票、撤下相关物料、完成全部退款并提交书面说明。雪中飞随后致歉，称在未获艺人团队事先同意的情况下发布了错误的活动机制，将重新设置活动机制并在近日公布。网友晒出的选座图显示，座位价格最低 1599 元、最高 4999 元。", "en": "On the evening of 15 November the topic of Hou Minghao's studio condemning a brand over ticket sales trended. The studio said its contract with down-jacket brand Xuezhongfei for a 21 November offline event expressly forbids the brand from distributing admission tickets in any paid form, yet the brand publicly sold seats without prior consent; it demanded an immediate stop, removal of promotional material, full refunds and a written explanation. Xuezhongfei apologised, saying it had released a wrong event mechanism without the artist team's prior consent and would set new rules shortly. Seat maps posted online showed prices from 1,599 to 4,999 yuan.", "es": "La noche del 15 de noviembre fue tendencia la condena del estudio de Hou Minghao a una marca por vender entradas. El estudio afirmó que su contrato con la marca de plumíferos Xuezhongfei para un evento del 21 de noviembre prohíbe expresamente distribuir entradas de forma remunerada, pero la marca vendió asientos sin consentimiento previo; exigió el cese inmediato, la retirada del material, la devolución íntegra y una explicación por escrito. Xuezhongfei se disculpó y dijo que publicó un mecanismo erróneo sin la conformidad del equipo del artista. Los mapas de asientos difundidos mostraban precios de 1.599 a 4.999 yuanes.", "ja": "11 月 15 日夜、「侯明昊のスタジオがブランドのチケット販売を非難」がトレンド入りした。スタジオは、11 月 21 日のオフラインイベントについてダウンジャケットブランド雪中飛との契約で有償での入場券配布を明確に禁じているにもかかわらず、ブランドが事前同意なく座席を販売したと声明。即時の販売停止、関連素材の撤去、全額返金、書面での説明を求めた。雪中飛は、アーティスト側の事前同意なく誤った参加方法を公表したとして謝罪し、近く新たな仕組みを発表するとした。ネットに流出した座席図では 1599 元から 4999 元の価格が示されていた。"}, "why": {"zh": "品牌请代言人是为了卖货，结果先卖起了「见代言人的资格」。这类操作伤的是三方：艺人的合约、粉丝的钱包、品牌自己的信誉。工作室这次把合同条款直接摆到台面上，算是给行业立了个参照。", "en": "Brands sign ambassadors to sell product, and this one started by selling the right to meet him. Everyone loses: the artist's contract, the fans' wallets, the brand's own credibility. By putting the contract clause on the table, the studio has set a reference point for the industry.", "es": "Las marcas fichan embajadores para vender producto, y esta empezó vendiendo el derecho a verlo. Pierden todos: el contrato del artista, el bolsillo de los fans y la credibilidad de la marca. Al poner la cláusula contractual sobre la mesa, el estudio marca una referencia para el sector.", "ja": "ブランドが代理人を起用するのは物を売るためだが、今回は先に「会える権利」を売った。芸能人の契約、ファンの財布、ブランド自身の信用、三者すべてが傷つく。契約条項をそのまま示したことで、スタジオは業界に一つの基準を示した。"}}, {"idx": "03", "tag": {}, "title": {"zh": "黄子韬工作室否认与綦美合旧恋情传闻：均为不实，已取证", "en": "Huang Zitao's studio denies old romance rumours, says evidence has been collected", "es": "El estudio de Huang Zitao niega rumores de una antigua relación y anuncia que ha reunido pruebas", "ja": "黄子韜のスタジオが過去の交際報道を否定、「証拠保全済み」"}, "body": {"zh": "11 月 15 日，网传黄子韬曾与綦美合约会，相关话题引发热议。黄子韬工作室当日发布声明回应：「网传黄子韬先生『与綦美合约会』、『与綦美合旧恋情』的相关恋情消息均为不实传闻。」工作室表示已对造谣、带节奏内容取证，保留法律追责权利，并呼吁网友理性甄别、不要传播未经证实的信息。该传闻源于网友重新翻出多年前的旧料。", "en": "On 15 November rumours circulated that Huang Zitao had once dated Qi Meihe, drawing wide discussion. His studio issued a statement the same day saying the claims about a meeting and an old relationship are untrue, that it had collected evidence on false and inflammatory content, reserves the right to pursue legal action and asked users to verify information before sharing. The rumours stemmed from old material resurfacing online.", "es": "El 15 de noviembre circularon rumores de que Huang Zitao había tenido una relación con Qi Meihe, lo que generó amplio debate. Su estudio emitió ese mismo día un comunicado en el que califica de falsas las afirmaciones sobre un encuentro y una antigua relación, afirma haber reunido pruebas sobre contenidos difamatorios, se reserva acciones legales y pide al público verificar antes de compartir. Los rumores provienen de material antiguo rescatado en redes.", "ja": "11 月 15 日、黄子韜が綦美合と交際していたとの噂が広がり、話題となった。スタジオは同日声明を発表し、「会っていた」「過去に交際していた」との情報はいずれも事実無根だと否定。デマや扇動的な内容について証拠を保全し、法的責任を追及する権利を留保するとし、未確認情報を拡散しないよう呼びかけた。噂は数年前の古い情報の掘り起こしが発端である。"}, "why": {"zh": "旧料重炒是这两年营销号的常规操作：成本为零，收益是热搜。工作室这次没有只发一句「假的」，而是明确「已取证」，把话说到法律层面——这类声明的实际作用，是给下一次造谣定价。", "en": "Recycling old material is standard practice for engagement accounts: zero cost, a trending slot as the return. This statement did not stop at calling it false; it said evidence has been collected, moving the matter to legal ground. The practical effect of such statements is to put a price on the next rumour.", "es": "Reciclar material antiguo es rutina para las cuentas de engagement: coste cero y un puesto en tendencias como retorno. El comunicado no se limitó a decir que era falso: afirmó haber reunido pruebas y llevó el asunto al terreno legal. El efecto práctico de estas declaraciones es poner precio al próximo rumor.", "ja": "古いネタの再燃はこの 2 年、エンゲージメント稼ぎの定番だ。コストはゼロ、見返りはトレンド入り。今回の声明は「デマだ」で終わらせず、「証拠を保全した」と明示して法的な土俵に移した。こうした声明の実際の効果は、次のデマに値段を付けることにある。"}}, {"idx": "04", "tag": {}, "title": {"zh": "谢霆锋、王嘉尔杭州同城开唱，场馆隔一条街、开场前互送花篮", "en": "Nicholas Tse and Jackson Wang play Hangzhou the same night, swapping flower baskets across the street", "es": "Nicholas Tse y Jackson Wang actúan en Hangzhou la misma noche e intercambian cestas de flores", "ja": "謝霆鋒とジャクソン・ワンが杭州で同日公演、会場は目と鼻の先で花籠を交換"}, "body": {"zh": "11 月 15 日，谢霆锋与王嘉尔分别在杭州奥体中心「大莲花」与「小莲花」举办演唱会，两个场馆仅隔一条街。双方团队在开场前互送花篮祝福，被网友称为「体面同行」的名场面。由于两场演出时间完全重合，不少同时喜欢两位歌手的观众只能在两者之间二选一。", "en": "On 15 November Nicholas Tse and Jackson Wang held concerts at the Big Lotus and Little Lotus venues of the Hangzhou Olympic Sports Centre, separated by a single street. Their teams exchanged flower baskets before the shows, a gesture widely described online as a gracious example of competitors behaving as peers. With the two concerts running at identical times, fans of both had to choose one.", "es": "El 15 de noviembre Nicholas Tse y Jackson Wang ofrecieron conciertos en los recintos Big Lotus y Little Lotus del Centro Olímpico de Hangzhou, separados por una calle. Sus equipos intercambiaron cestas de flores antes de empezar, gesto celebrado en redes como ejemplo de competencia cordial. Al coincidir en horario, los fans de ambos tuvieron que elegir.", "ja": "11 月 15 日、謝霆鋒とジャクソン・ワンが杭州オリンピック・スポーツセンターの「大蓮花」と「小蓮花」でそれぞれ公演を行い、会場は通り一つ隔てただけだった。両チームは開演前に花籠を贈り合い、ネットで「大人の同行」と評された。公演時間が完全に重なったため、両方を好きな観客はどちらかを選ぶしかなかった。"}, "why": {"zh": "同城同晚开唱，最容易演变成粉丝互撕，结果变成了互送花篮。这个细节之所以被夸，是因为它把「竞争」处理成了「同行」——演出市场足够大的时候，对手也可以是邻居。", "en": "Two shows in one city on one night usually ends in fan wars; this ended in flower baskets. The detail is praised because it treats competition as colleagueship: when the live market is big enough, a rival can also be a neighbour.", "es": "Dos conciertos en la misma ciudad y noche suelen acabar en guerra de fans; este acabó en cestas de flores. El detalle se elogia porque trata la competencia como colegaje: cuando el mercado en directo es grande, el rival también puede ser vecino.", "ja": "同じ街で同じ夜に公演となればファン同士の争いになりがちだが、今回は花籠の交換になった。この細部が称賛されるのは、「競争」を「同業」として扱ったからだ。ライブ市場が十分に大きければ、競合は隣人にもなり得る。"}}, {"idx": "05", "tag": {}, "title": {"zh": "2026 年度电影总票房突破 320 亿元，前五名全是国产片", "en": "China's 2026 box office passes 32 billion yuan, with an all-domestic top five", "es": "La taquilla china de 2026 supera los 32.000 millones de yuanes, con un top cinco íntegramente nacional", "ja": "2026 年の中国映画興行収入が 320 億元を突破、上位 5 本はすべて国産"}, "body": {"zh": "截至 11 月 15 日，2026 年度电影总票房（含预售）突破 320 亿元，据测算今年以来电影全产业链产值近 5000 亿元。暂列年度票房榜前五位的均为国产片：《飞驰人生 3》《欢迎来龙餐馆》《功夫女足》《八仙！》《给阿嬷的情书》。", "en": "As of 15 November China's 2026 box office, including presales, has passed 32 billion yuan, with the wider film industry chain valued at close to 500 billion yuan this year. The top five films of the year so far are all domestic: Pegasus 3, Welcome to Long Restaurant, Kung Fu Women's Football, The Eight Immortals and A Letter to Grandma.", "es": "Hasta el 15 de noviembre la taquilla china de 2026, con preventa incluida, supera los 32.000 millones de yuanes, y la cadena de valor del sector se estima en cerca de 500.000 millones este año. Las cinco películas más taquilleras del año son todas nacionales: Pegasus 3, Bienvenidos al restaurante Long, Fútbol femenino kung fu, Los Ocho Inmortales y Una carta para la abuela.", "ja": "11 月 15 日時点で、2026 年の中国映画興行収入（前売り含む）は 320 億元を突破し、映画産業全体の生産額は今年 5000 億元近くに達する見込み。年間興行収入の上位 5 本はすべて国産で、「飛馳人生 3」「ようこそ龍レストランへ」「カンフー女子サッカー」「八仙！」「おばあちゃんへの手紙」が並ぶ。"}, "why": {"zh": "320 亿放在全年看并不惊人，但前五全是国产片这件事值得记一笔——它意味着档期红利终于转成了内容竞争力。真正的考验在 12 月：跨年档还有多少余量，决定这一年的成绩是「稳住了」还是「往上走了一格」。", "en": "Thirty-two billion is not startling for a full year, but an all-domestic top five is worth noting: it means holiday-slot advantage has finally turned into content competitiveness. December is the real test — how much room the year-end slate has determines whether this year held steady or moved up a notch.", "es": "32.000 millones no sorprende para un año entero, pero un top cinco íntegramente nacional merece mención: significa que la ventaja de los puentes y vacaciones se ha convertido por fin en competitividad de contenido. Diciembre es la prueba real: el margen del tramo de fin de año dirá si el ejercicio se mantuvo o subió un escalón.", "ja": "320 億元は通年で見れば驚く数字ではないが、上位 5 本がすべて国産という点は記録に値する。休暇シーズンの利得が、ようやく内容の競争力に変わったという意味だからだ。本当の試練は 12 月で、年末商戦の余地が「持ちこたえた年」か「一段上がった年」かを決める。"}}]}], "risk": {"zh": "风险提示：本简报仅作信息汇总，其中涉及的数据不构成任何投资建议。", "en": "Risk notice: this briefing is an information summary only; the data mentioned does not constitute investment advice.", "es": "Aviso de riesgo: este boletín solo resume información; los datos mencionados no constituyen asesoramiento financiero.", "ja": "リスク表示：本ブリーフィングは情報の要約であり、記載のデータは投資助言ではありません。"}}/*__END__*/;

      + '<div class="body">' + esc(T(sp.body, lang)) + "</div>"
      + '<div class="why"><b>' + esc(i18n.why) + "</b>" + esc(T(sp.why, lang)) + "</div>"
      + "</section>";
    // 分类
    html += '<div class="grid">';
    BRIEFING.sections.forEach(function (sec) {
      html += '<section class="card" id="' + sec.key + '" style="--ac:' + sec.color + "; --ac-deep:" + sec.deep + ';">'
        + '<div class="sec-head"><span class="sec-num">' + sec.num + "</span>"
        + "<h3>" + esc(T(sec.name, lang)) + "</h3>"
        + '<span class="en">' + sec.key.toUpperCase() + "</span></div>";
      (sec.items || []).forEach(function (it) {
        html += '<div class="item">';
        html += '<div class="t"><span class="idx">' + it.idx + "</span>";
        if (it.tag) html += '<span class="tag">' + esc(it.tag[lang] != null ? it.tag[lang] : i18n.tag) + "</span>";
        html += titleHtml(it.title, it.hl, lang) + "</div>";
        html += '<div class="d">' + esc(T(it.body, lang)) + "</div>";
        html += '<div class="why"><b>' + esc(i18n.why) + "</b>" + esc(T(it.why, lang)) + "</div>";
        html += "</div>";
      });
      html += "</section>";
    });
    html += "</div>";
    var content = document.getElementById("content");
    if (content) content.innerHTML = html;
    // 页脚
    var risk = document.getElementById("risk");
    if (risk) risk.textContent = T(BRIEFING.risk, lang);
  }

  function setLang(lang) {
    if (LANGS.indexOf(lang) < 0) lang = "zh";
    curLang = lang;
    langOpen = false;
    try { localStorage.setItem("timab_lang", lang); } catch (e) {}
    renderChrome(lang);
    renderContent(lang);
  }

  /* ===== 往期日历（保留原逻辑，文案随语言） ===== */
  function initCalendar() {
    var btn = document.getElementById("calBtn");
    var pop = document.getElementById("calPop");
    var grid = document.getElementById("calGrid");
    var title = document.getElementById("calTitle");
    if (!btn || !pop || !grid || !title) return;

    var parts = BRIEFING.date.split("-");
    var todayKey = parts[0].slice(2) + parts[1] + parts[2];
    var cur = { y: +parts[0], m: +parts[1] };
    var has = {};
    for (var i = 0; i < ARCHIVE_DATES.length; i++) { has[ARCHIVE_DATES[i]] = 1; }
    var HIST_BASE = /\/history\//.test(location.pathname) ? "./" : "history/";

    function ckey(y, m, d) { return String(y).slice(2) + pad(m) + pad(d); }

    function render() {
      var i18n = I18N[curLang];
      title.textContent = i18n.calTitle(cur.y, cur.m);
      grid.innerHTML = "";
      var start = new Date(cur.y, cur.m - 1, 1).getDay();
      var days = new Date(cur.y, cur.m, 0).getDate();
      for (var b = 0; b < start; b++) {
        var blank = document.createElement("span");
        blank.className = "cal-cell is-empty"; grid.appendChild(blank);
      }
      for (var d = 1; d <= days; d++) {
        var k = ckey(cur.y, cur.m, d);
        var cell = document.createElement("span");
        cell.className = "cal-cell" + (has[k] ? " has" : "") + (k === todayKey ? " is-today" : "");
        cell.textContent = d;
        if (has[k]) {
          cell.setAttribute("role", "link"); cell.setAttribute("tabindex", "0");
          cell.title = cur.y + "-" + pad(cur.m) + "-" + pad(d) + " 存档";
          (function (target) {
            var go = function () { window.open(HIST_BASE + target + ".html", "_blank", "noopener"); };
            cell.addEventListener("click", go);
            cell.addEventListener("keydown", function (e) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); go(); } });
          })(k);
        }
        grid.appendChild(cell);
      }
    }
    function toggle(open) {
      pop.hidden = !open;
      btn.setAttribute("aria-expanded", open ? "true" : "false");
      if (open) render();
    }
    btn.addEventListener("click", function (e) { e.stopPropagation(); toggle(pop.hidden); });
    document.getElementById("calPrev").addEventListener("click", function () { cur.m--; if (cur.m < 1) { cur.m = 12; cur.y--; } render(); });
    document.getElementById("calNext").addEventListener("click", function () { cur.m++; if (cur.m > 12) { cur.m = 1; cur.y++; } render(); });
    document.addEventListener("click", function (e) { if (!pop.hidden && !pop.contains(e.target)) toggle(false); });
    document.addEventListener("keydown", function (e) { if (e.key === "Escape" && !pop.hidden) toggle(false); });
  }

  /* ===== 启动 ===== */
  function boot() {
    curLang = detectLang();
    renderChrome(curLang);
    renderContent(curLang);
    initCalendar();
    // 关闭语言下拉：点击外部 / Esc
    document.addEventListener("click", function (e) {
      var ls = document.getElementById("langSwitch");
      if (ls && langOpen && !ls.contains(e.target)) {
        langOpen = false;
        ls.classList.remove("open");
        var t = document.getElementById("langTrigger");
        if (t) t.setAttribute("aria-expanded", "false");
      }
    });
    document.addEventListener("keydown", function (e) {
      if (e.key === "Escape" && langOpen) {
        langOpen = false;
        var ls = document.getElementById("langSwitch");
        if (ls) ls.classList.remove("open");
        var t = document.getElementById("langTrigger");
        if (t) t.setAttribute("aria-expanded", "false");
      }
    });
  }
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", boot);
  } else { boot(); }
})();
</script>
</body>
</html>
