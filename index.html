  .lang-switch button:hover { color: var(--accent); }
  .lang-switch button.active { background: var(--accent); color: var(--paper); }

    display: inline-flex; align-items: center; gap: 7px; cursor: pointer;
    font-family: inherit; font-size: 13px; font-weight: 700; letter-spacing: .1em;

  .cal-title { font-size: 14px; font-weight: 700; letter-spacing: .08em; color: var(--ink); }

  .cal-week span {

  .cal-cell {
    position: relative; height: 32px; display: flex; align-items: center; justify-content: center;

  .cal-cell.is-empty { visibility: hidden; }
  .cal-cell.has { color: var(--ink); font-weight: 700; cursor: pointer; }

    content: ""; position: absolute; bottom: 3px; left: 50%; transform: translateX(-50%);
    width: 4px; height: 4px; border-radius: 50%; background: var(--accent);
  }
  .cal-cell.has:hover, .cal-cell.has:focus-visible {
    background: color-mix(in srgb, var(--accent) 16%, transparent);

  .cal-cell.is-today { box-shadow: inset 0 0 0 1.5px var(--line); color: var(--ink-soft); }
  .cal-foot {

  .nav-chips { display: flex; flex-wrap: wrap; gap: 10px; padding: 0 0 18px; }
  .nav-chips a {

  .spotlight {

    background: linear-gradient(120deg, #0f766e 0%, #115e59 46%, #134e4a 100%);

    box-shadow: 0 18px 44px -18px rgba(15, 118, 110, .55);

  .spotlight::after {
    content: ""; position: absolute; right: -60px; top: -60px; width: 240px; height: 240px;
    border-radius: 50%; background: radial-gradient(circle, rgba(255,255,255,.14), transparent 68%);

  .spotlight .badge {
    display: inline-flex; align-items: center; gap: 8px;
    font-size: 12.5px; font-weight: 700; letter-spacing: .3em;
    border: 1.5px solid rgba(242, 251, 250, .55); border-radius: 999px;
    padding: 5px 18px 5px 20px; margin-bottom: 18px;

  .spotlight .badge i {
    width: 8px; height: 8px; border-radius: 50%; background: #5eead4; display: inline-block;

  @keyframes pulse { 0%,100% { opacity: 1; transform: scale(1);} 50% { opacity: .45; transform: scale(.78);} }
  .spotlight h2 {
    font-family: "Noto Serif SC", "Noto Serif JP", serif; font-weight: 900;
    font-size: clamp(24px, 3.4vw, 34px); line-height: 1.35; margin-bottom: 14px;

  .spotlight .body { font-size: 15px; color: #d3efec; max-width: 62em; }
  .spotlight .why {

  .spotlight .why b { color: #99f6e4; font-weight: 700; }

  /* ===== 分类卡片 ===== */
  .grid { margin-top: 30px; display: grid; grid-template-columns: repeat(2, 1fr); gap: 24px; }

  var BRIEFING = /*__BRIEFING_DATA__*/{"date": "2026-10-09", "meta": {"zh": "星期五 · 农历八月廿九 · timab.cn", "en": "Friday · 29th day of the 8th lunar month · timab.cn", "es": "Viernes · 29.º día del 8.º mes lunar · timab.cn", "ja": "金曜日 · 旧暦8月29日 · timab.cn"}, "spotlight": {"badge": {"zh": "精 选", "en": "EDITOR'S PICK", "es": "DESTACADO", "ja": "特集"}, "title": {"zh": "A 股节后首日没等来“开门红”：沪指跌 0.79%，红利与 AI 硬件冰火两重天", "en": "No “opening rally” for A-shares after the holiday: Shanghai Composite falls 0.79% as dividend plays and AI hardware go their separate ways", "es": "Las A-shares no ven el “rally de apertura” tras el festivo: el Shanghai Composite cae un 0,79% mientras dividendos y hardware de IA van por caminos opuestos", "ja": "休場明けのA株、初日は「門出高」ならず：上海総合0.79%安、配当株とAIハードウェアが真逆の動き"}, "hl": {"zh": "A 股节后首日没等来“开门红”", "en": "No “opening rally” for A-shares after the holiday", "es": "no ven el “rally de apertura” tras el festivo", "ja": "休場明けのA株、初日は「門出高」ならず"}, "body": {"zh": "10 月 8 日 A 股迎来节后首个交易日，早盘冲高后震荡走弱：沪指收报 3811.90 点跌 0.79%，深成指跌 2.07%，创业板指大跌 3.15%，科创 50 跌 4.82%；成交 1.69 万亿元，较节前放量 2442 亿元。石油石化、公用事业、银行等红利方向逆势走强，杭州银行、中国银行盘中创历史新高；光模块、半导体等 AI 硬件链集中回调，天孚通信跌近 10%、东山精密跌停。", "en": "On October 8, A-shares opened their first session after the holiday, surging early before weakening through the day: the Shanghai Composite closed at 3,811.90, down 0.79%; the Shenzhen Component fell 2.07%, the ChiNext dropped 3.15%, and the STAR 50 lost 4.82%. Turnover was 1.69 trillion yuan, 244.2 billion more than before the break. Dividend-oriented sectors such as oil and petrochemicals, utilities and banks rose against the trend—Bank of Hangzhou and Bank of China hit record highs intraday—while the AI-hardware chain, including optical modules and semiconductors, pulled back sharply, with T&S Communications down nearly 10% and Dongshan Precision hitting the limit-down.", "es": "El 8 de octubre, las A-shares abrieron su primera sesión tras el festivo: subieron al inicio y luego se debilitaron a lo largo del día. El Shanghai Composite cerró en 3.811,90, bajando un 0,79%; el Shenzhen Component cayó un 2,07%, el ChiNext un 3,15% y el STAR 50 un 4,82%. El volumen negociado fue de 1,69 billones de yuanes, 244.200 millones más que antes del parón. Los sectores de dividendo —petróleo y petroquímica, servicios públicos y banca— subieron a contracorriente: el Bank of Hangzhou y el Bank of China marcaron máximos históricos intradía. La cadena de hardware de IA, incluidos módulos ópticos y semiconductores, retrocedió con fuerza: T&S Communications cayó casi un 10% y Dongshan Precision tocó el límite de caída.", "ja": "10月8日、A株は休場明け初の取引日を迎え、寄り後は上昇から弱含みに転じた。上海総合は3811.90ptで引け、0.79%安。深セン成分は2.07%安、創業板（ChiNext）は3.15%安、科創50は4.82%安。売買代金は1.69兆元と休場前から2442億元増。石油・石化、公益、銀行など配当志向セクターが逆行高し、杭州銀行と中国銀行は場中に史上最高値を更新。一方、光通信モジュールや半導体などのAIハードウェア関連は集中調整し、天孚通信はほぼ10%安、東山精密はストップ安となった。"}, "why": {"zh": "假期“外围利好打包”并未兑现成开门红，美债收益率高企与油价冲击压制成长股估值；但成交放量、银行创新高说明资金是在场内换仓而非离场——“科技杀估值、红利接棒”的风格切换能否延续，是四季度行情的分水岭。", "en": "The “packaged overseas good news” of the holiday failed to deliver an opening rally; elevated U.S. Treasury yields and the oil shock weighed on growth-stock valuations. Yet the heavier volume and record bank highs show funds were rotating within the market rather than leaving it—whether the “tech de-rating, dividend handover” rotation continues is the watershed for the fourth-quarter market.", "es": "El “paquete de buenas noticias externas” del festivo no se tradujo en un rally de apertura; los altos rendimientos de los bonos del Tesoro de EE. UU. y el shock del petróleo pesaron sobre la valoración de las acciones de crecimiento. Pero el mayor volumen y los máximos bancarios indican que los fondos rotaron dentro del mercado, no salieron de él: si continúa el cambio de “desvalorización tecnológica y relevo de dividendos” es la clave del cuarto trimestre.", "ja": "休場中の「海外好材料」は門出高にはつながらず、米国債利回りの高止まりと原油ショックが成長株の評価を圧迫した。ただ、売買代金の増加と銀行の最高値更新は、資金が市場外へ逃げたのではなく内外で回転したことを示す。「ハイテクの評価下げ・配当へのバトンタッチ」が続くかが、第4四半期の分水れ目だ。"}}, "sections": [{"key": "intl", "num": "01", "color": "#1d4ed8", "deep": "#1e3fa8", "name": {"zh": "国际时事", "en": "World", "es": "Internacional", "ja": "国際"}, "items": [{"idx": "01", "tag": {"zh": "进展"}, "title": {"zh": "美国防部指示中央司令部：数日内完成对伊重启大规模军事行动准备", "en": "Pentagon tells CENTCOM to prepare large-scale military action against Iran within days", "es": "El Pentágono ordena a CENTCOM preparar en días una gran acción militar contra Irán", "ja": "米国防総省、中央軍へ「数日内にイランへの大規模軍事行動再開の準備を」"}, "body": {"zh": "据报道，美国国防部日前已指示美军中央司令部，在数日内完成对伊朗重启大规模军事行动的准备工作。此前特朗普称对伊军事行动“必须收尾了”，表示将以柔和或强硬两种方式之一收场；卡塔尔斡旋的美伊间接磋商仍在继续。", "en": "According to reports, the U.S. Defense Department has instructed CENTCOM to complete preparations for a renewed large-scale military operation against Iran within days. Earlier, Trump said the action against Iran “must be wrapped up,” to end either softly or forcefully; Qatari-mediated indirect U.S.–Iran talks continue.", "es": "Según informes, el Departamento de Defensa de EE. UU. ha ordenado a CENTCOM completar en unos días los preparativos para una gran operación militar renovada contra Irán. Antes, Trump dijo que la acción “debe cerrarse”, por la vía blanda o la dura; siguen las conversaciones indirectas mediadas por Catar.", "ja": "報道によると、米国防総省は中央軍（CENTCOM）に対し、数日以内にイランへの大規模軍事行動再開の準備を完了するよう指示した。トランプ氏はイランへの行動は「決着をつけねばならず」、軟硬いずれかの手段で終わらせると述べていた。カタールが仲介する米イラン間接協議は続いている。"}, "why": {"zh": "从“收尾”表态到作战准备落地，美伊博弈进入倒计时；任何一次擦枪走火，都可能把油价与全球风险资产再次推向高点。", "en": "From “wrapping up” rhetoric to operational preparations, the U.S.–Iran standoff enters a countdown; any spark could push oil prices and global risk assets higher again.", "es": "De la retórica de “cierre” a los preparativos operativos, la tensión EE. UU.–Irán entra en cuenta atrás; cualquier chispa podría volver a disparar el petróleo y los activos de riesgo.", "ja": "「決着」発言から作戦準備の具体化へ、米イラン対立は秒読み段階に。ちょっとした火花が原油価格と世界的なリスク資産を再び押し上げかねない。"}}, {"idx": "02", "tag": {"zh": "进展"}, "title": {"zh": "油价一度暴涨超 5%：布油冲上 105 美元，霍尔木兹通行量创两个月新低", "en": "Oil spikes over 5% intraday: Brent above $105 as Hormuz traffic hits two-month low", "es": "El petróleo sube más de un 5% intradía: el Brent supera los 105 dólares y el tráfico en Ormuz marca mínimo de dos meses", "ja": "原油が一時5%超急騰：ブレント105ドル台、ホルムズ通過量は2ヵ月ぶり低水準"}, "body": {"zh": "受中东局势再度紧张刺激，8 日国际油价盘中大涨——WTI 一度升至 92.84 美元/桶（+5.17%），布伦特一度升至 105.48 美元/桶（+5.27%）。此前一艘油轮在卡塔尔附近海域被多枚发射物击中；克普勒数据显示 6 日霍尔木兹海峡仅 7 艘油轮通过，为 7 月 23 日以来最低，9 月 28 日至 10 月 4 日已有 10 艘油轮遇袭。", "en": "Spurred by renewed Middle East tension, international oil prices jumped on the 8th—WTI rose to $92.84/bbl (+5.17%) and Brent to $105.48/bbl (+5.27%) intraday. Earlier, a tanker was hit by multiple projectiles near Qatar; Kpler data shows only 7 tankers passed through Hormuz on the 6th, the lowest since July 23, with 10 tankers attacked between Sept 28 and Oct 4.", "es": "Por la renovada tensión en Oriente Medio, el petróleo subió el día 8: el WTI llegó a 92,84 dólares/barril (+5,17%) y el Brent a 105,48 dólares/barril (+5,27%) intradía. Antes, un petrolero fue alcanzado por varios proyectiles cerca de Catar; datos de Kpler muestran solo 7 petroleros por Ormuz el día 6, el mínimo desde el 23 de julio, con 10 atacados entre el 28 de septiembre y el 4 de octubre.", "ja": "中東情勢の再緊張を受け、8日の国際原油価格は急伸。WTIは一時92.84ドル/バレル（+5.17%）、ブレントは105.48ドル/バレル（+5.27%）まで上昇。先にカタール沖でタンカーが複数の飛翔体に撃たれ、Kplerデータでは6日のホルムズ通過タンカーはわずか7隻と7月23日以来の低水準。9月28日〜10月4日には10隻が攻撃された。"}, "why": {"zh": "海峡通行量逼近“冰封”是油价的直接催化剂，能源成本正沿航运、化工、航空全链条传导，全球通胀预期面临重新定价。", "en": "Traffic near “frozen” at Hormuz is the direct catalyst for prices; energy costs are rippling through shipping, chemicals and aviation, forcing a repricing of global inflation expectations.", "es": "El tráfico casi “congelado” en Ormuz es el catalizador directo del precio; el coste energético se propaga por transporte, química y aviación y fuerza revalorar la inflación global.", "ja": "ホルムズの通過量が「氷結」寸前なのが価格の直接的な触媒。エネルギーコストは海運・化学・航空へと連鎖し、世界のインフレ予想の再評価を迫っている。"}}, {"idx": "03", "tag": {"zh": "进展"}, "title": {"zh": "胡塞再袭利雅得国际机场，沙特空袭荷台达还以颜色", "en": "Houthis strike Riyadh airport again; Saudi airstrikes hit Hodeidah in response", "es": "Los houthis atacan de nuevo el aeropuerto de Riad; Arabia Saudí bombardea Hodeida en represalia", "ja": "フーシ派が再びリヤド空港を攻撃、サウジはホデイダを空襲して報復"}, "body": {"zh": "也门胡塞武装 8 日称再次打击沙特首都利雅得的哈立德国王国际机场，并对曼德海峡附近的也门政府军发动袭击；沙特战机当日对胡塞控制区发动新一轮空袭，目标包括荷台达国际机场及通信设施。此前 24 小时内胡塞曾向沙特发射 11 枚导弹。", "en": "Yemen's Houthi movement said on the 8th it again struck King Khalid International Airport in Riyadh and attacked Yemeni government forces near the Bab el-Mandeb; Saudi jets launched a new round of airstrikes on Houthi-held areas the same day, targeting Hodeidah airport and communications facilities. In the prior 24 hours the Houthis had fired 11 missiles at Saudi Arabia.", "es": "El movimiento houthi de Yemen dijo el día 8 que volvió a golpear el aeropuerto internacional Rey Khalid, en Riad, y atacó a fuerzas yemeníes cerca de Bab el-Mandeb; los aviones saudíes lanzaron una nueva ronda de ataques contra zonas houthis ese día, apuntando al aeropuerto de Hodeida y a instalaciones de comunicaciones. En las 24 horas previas, los houthis dispararon 11 misiles contra Arabia Saudí.", "ja": "イエメンのフーシ派は8日、サウジ首都リヤドのハーリド国際空港を再び攻撃し、バブ・エル・マンデブ沖のイエメン政府軍も攻撃したと発表。サウジ機は同日、フーシ派支配地域へ新たな空襲を敢行、ホデイダ空港と通信施設を標的にした。直前24時間でフーシ派はサウジへ11発のミサイルを発射していた。"}, "why": {"zh": "沙特本土核心机场连续遇袭，标志冲突烈度再上台阶；红海—曼德海峡的航运保险费率与全球供应链成本都将随之承压。", "en": "Repeated strikes on a core Saudi airport mark an escalation; Red Sea–Bab el-Mandeb shipping insurance rates and global supply-chain costs will come under pressure.", "es": "Los repetidos ataques a un aeropuerto saudí clave marcan una escalada; las primas de seguro marítimo en el Mar Rojo–Bab el-Mandeb y los costes de la cadena global subirán.", "ja": "サウジ本土の要衝空港への連続攻撃は炎のエスカレーションを示す。紅海―バブ・エル・マンデブの海上保険料と世界サプライチェーンのコストに重圧がかかる。"}}, {"idx": "04", "title": {"zh": "韩国首次试射高超音速滑翔弹，朝鲜半岛紧张升级", "en": "South Korea's first hypersonic glide vehicle test raises Peninsula tensions", "es": "El primer ensayo surcoreano de planeador hipersónico eleva la tensión en la Península", "ja": "韓国が初の極超音速グライダー試射、朝鮮半島の緊張が高まる"}, "body": {"zh": "韩军 8 日成功进行首次高超音速滑翔飞行器试射，李在明总统现场观摩；同日韩军在西海岸发现被冲上岸的疑似朝鲜地雷并实施爆破处理，联合参谋本部称其属“挑衅”并将检讨应对措施，朝韩边境摩擦持续。", "en": "The South Korean military successfully tested a hypersonic glide vehicle for the first time on the 8th, observed on site by President Lee Jae-myung; the same day it found a suspected North Korean mine washed ashore on the west coast and detonated it. The JCS called it “provocative” and will review responses, as inter-Korean border friction continues.", "es": "El Ejército surcoreano ensayó con éxito por primera vez un planeador hipersónico el día 8, presenciado por el presidente Lee Jae-myung; ese día halló en la costa oeste una supuesta mina norcoreana arrastrada por el mar y la detonó. El Estado Mayor lo calificó de “provocación” y revisará respuestas, en medio de roces fronterizos.", "ja": "韓国軍は8日、極超音速グライダー機の試射に初めて成功、李在明大統領が視察した。同じ日、西海岸に漂着した北朝鮮と思われる機雷を発見し処理。合同参謀本部はこれを「挑発」と呼び対応を検討、南北国境の摩擦が続いている。"}, "why": {"zh": "高超音速武器是东北亚军备竞赛的新变量，半岛“以武对武”的螺旋为东亚安全再添不确定性，也牵动美日韩安全合作走向。", "en": "Hypersonic weapons are a new variable in the Northeast Asian arms race; the peninsula's “arms-for-arms” spiral adds uncertainty to East Asian security and affects U.S.–Japan–ROK cooperation.", "es": "Las armas hipersónicas son una nueva variable en la carrera de Asia Nororiental; la espiral “arma por arma” añade incertidumbre a la seguridad regional y afecta a la cooperación EE. UU.–Japón–Corea del Sur.", "ja": "極超音速兵器は北東アジアの軍備競争における新たな変数。半島の「武力対武力」の悪循環は東アジア安保に不確実性を加え、米日韓協力の行方にも影響する。"}}, {"idx": "05", "title": {"zh": "欧盟将对俄制裁延长一年，至 2027 年 10 月", "en": "EU extends Russia sanctions by one year, to October 2027", "es": "La UE prorroga un año las sanciones a Rusia, hasta octubre de 2027", "ja": "EU、対ロシア制裁を1年延長―2027年10月まで"}, "body": {"zh": "欧盟理事会发布公告，将针对部分俄罗斯相关个人和实体的制裁措施延长一年，至 2027 年 10 月 9 日。此前乌克兰方面表示愿参加美俄乌三方 10 月会谈，并研究“五种停火机制”。", "en": "The European Council announced it has extended sanctions targeting certain Russian individuals and entities by one year, to October 9, 2027. Earlier, Ukraine said it is willing to join U.S.–Russia–Ukraine trilateral talks in October and is studying “five ceasefire mechanisms.”", "es": "El Consejo Europeo anunció la prórroga por un año de las sanciones a ciertas personas y entidades rusas, hasta el 9 de octubre de 2027. Antes, Ucrania dijo que está dispuesta a unirse a las conversaciones tripartitas EE. UU.–Rusia–Ucrania en octubre y estudia “cinco mecanismos de alto el fuego”.", "ja": "欧州理事会は、特定のロシア個人・実体への制裁を1年延長し、2027年10月9日までとすることを発表した。在此之前、ウクライナは10月の米露ウクライナ三者協議に参加する用意があり、「5つの停戦メカニズム」を検討していると述べていた。"}, "why": {"zh": "对俄制裁常态化之下，俄乌和谈窗口与能源市场走向仍是四季度国际格局的最大变量，制裁与谈判的“双轨并行”还将继续。", "en": "With sanctions normalized, the Russia–Ukraine talks window and energy-market direction remain the biggest variables in the fourth-quarter global picture; the “twin track” of sanctions and negotiation will continue.", "es": "Con las sanciones normalizadas, la ventana de negociación y la dirección del mercado energético siguen siendo las mayores variables; continuará la “doble vía” de sanciones y diálogo.", "ja": "制裁が常態化するなか、露ウクライナ和平の窓とエネルギー市場の方向は第4四半期の最大の変数。制裁と交渉の「二正面」は続く。"}}]}, {"key": "dom", "num": "02", "color": "#cf2f1e", "deep": "#a02315", "name": {"zh": "国内要闻", "en": "China", "es": "China", "ja": "国内"}, "items": [{"idx": "01", "title": {"zh": "我国首次以规章形式保障新就业形态劳动者权益", "en": "China's first regulation to protect platform workers' rights", "es": "China ampara por primera vez por reglamento a los trabajadores de nuevas formas de empleo", "ja": "新形態雇用の労働者権益を初の規則で保障"}, "body": {"zh": "人社部发布《新就业形态劳动者权益保障办法（征求意见稿）》，即日起至 11 月 8 日向社会公开征求意见，首次以规章形式将企业实施劳动管理、不完全符合确立劳动关系情形的新就业形态劳动者纳入劳动法律制度保障。", "en": "The Ministry of Human Resources has released a draft “Measures for Protecting the Rights of Workers in New Forms of Employment” for public comment until Nov 8—the first time, by regulation, workers under platform labor management or in ambiguous employment relationships are brought under the labor legal system.", "es": "El Ministerio de Recursos Humanos publicó un borrador de “Medidas para proteger los derechos de los trabajadores de nuevas formas de empleo” en consulta pública hasta el 8 de noviembre; por primera vez, por reglamento, se integra al sistema laboral a quienes están bajo gestión de plataformas o en relaciones laborales ambiguas.", "ja": "人力資源・社会保障部は「新形態雇用労働者の権益保障弁法（意見募集稿）」を公表、11月8日まで意見を募る。企業の労務管理下にあり、雇用関係が明確でない新形態労働者を、初めて規則として労働法制の保障対象に組み込む。"}, "why": {"zh": "外卖骑手、网约车司机、主播等数千万灵活就业群体的“劳动身份”问题迈出制度化第一步，平台用工规则与算法管理都将面临重塑。", "en": "Delivery riders, ride-hail drivers and streamers—tens of millions in flexible work—take an institutional first step on “worker status”; platform rules and algorithm management will be reshaped.", "es": "Repartidores, conductores y streamers—decenas de millones en empleo flexible—dan un primer paso institucional en su “estatus laboral”; las reglas de plataforma y la gestión algorítmica se rediseñarán.", "ja": "配達員、配車ドライバー、配信者など数千万人のフレキシブル労働者の「労働者性」問題が制度化の第一歩を踏む。プラットフォームの雇用ルールとアルゴリズム管理は見直しを迫られる。"}}, {"idx": "02", "tag": {"zh": "进展"}, "title": {"zh": "国庆数据收官：跨区域流动 21.42 亿人次，服务消费日均增长 19.5%", "en": "National Day wrap: 2.142 billion trips, service consumption up 19.5% daily", "es": "Balance del Día Nacional: 2.142 millones de viajes y consumo de servicios +19,5% diario", "ja": "国慶節まとめ：移動21.42億人件、サービス消費は日平均19.5%増"}, "body": {"zh": "交通运输部数据显示，国庆假期全社会跨区域人员流动量 21.42 亿人次，日均较 2025 年中秋国庆假期增长 0.6%；增值税发票数据显示，假期全国服务消费相关行业日均销售收入同比增长 19.5%。应急管理部通报，假期全国安全形势总体平稳，未发生重大以上灾害事故。", "en": "Transport data show 2.142 billion cross-region trips during the holiday, up 0.6% daily versus the 2025 Mid-Autumn–National Day break; VAT invoice data show daily service-consumption revenue rose 19.5% yoy. The emergency ministry said the safety situation was generally stable with no major disasters.", "es": "Los datos de transporte muestran 2.142 millones de viajes interregionales en el festivo, un 0,6% diario más que en 2025; las facturas de IVA indican que los ingresos diarios por consumo de servicios subieron un 19,5% interanual. El ministerio de emergencias reportó estabilidad sin desastres mayores.", "ja": "交通データによると、休暇中の全国の跨区間移動は214.2億人件と、2025年の中秋・国慶連休に比べ日平均0.6%増。インボイスデータでは休暇中のサービス消費関連業種の売上高が前年同期比日平均19.5%増。応急管理部は大規模災害のない総じて安定した状況を報告。"}, "why": {"zh": "人流创高的同时消费成色更足，“服务消费强于商品消费”的结构性特征，是观察内需修复节奏的最新样本。", "en": "Record crowds came with stronger spending; the “services outpacing goods” pattern is the freshest sample of domestic-demand recovery.", "es": "Récord de desplazamientos con mayor gasto; el patrón “servicios por encima de bienes” es la muestra más reciente de la recuperación de la demanda interna.", "ja": "人流の最高に消費の質も伴い、「サービス消費が商品消費を上回る」構造は内需回復の最新の標本だ。"}}, {"idx": "03", "title": {"zh": "我国科学家率先研制出核光钟并实现稳定运行", "en": "Chinese scientists build the world's first operating nuclear optical clock", "es": "Científicos chinos crean el primer reloj óptico nuclear estable del mundo", "ja": "中国の科学者が世界初の核光学時計を開発・安定稼働"}, "body": {"zh": "我国科学家在国际上率先研制出核光钟并实现其稳定运行，将量子精密测量由电子跃迁拓展至原子核跃迁。核光钟对环境干扰更不敏感，有望应用于深空导航、基础物理检验等前沿领域。", "en": "Chinese scientists have developed and stably operated the world's first nuclear optical clock, extending quantum precision measurement from electron to nuclear transitions. Less sensitive to environmental disturbance, it could aid deep-space navigation and fundamental physics.", "es": "Científicos chinos han desarrollado y operado con estabilidad el primer reloj óptico nuclear del mundo, extendiendo la medición cuántica de transiciones electrónicas a nucleares. Menos sensible a perturbaciones, podría servir en navegación espacial y física fundamental.", "ja": "中国の科学者が世界に先駆けて核光学時計を開発し安定稼働に成功、量子精密測定を電子遷移から原子核遷移へと広げた。環境擾乱への耐性が高く、深宇宙航法や基礎物理の検証などの先端分野への応用が期待される。"}, "why": {"zh": "“全球首次”再添一项——精密计时是导航、通信与基础物理的底层基础设施，谁先站稳核跃迁计时，谁就握住下一代精密测量的入场券。", "en": "Another “world first”—precision timing underpins navigation, communications and fundamental physics; who leads nuclear-transition timing holds the ticket to next-gen metrology.", "es": "Otra “primicia mundial”: la cronometría de precisión sustenta navegación, comunicaciones y física; quien lidere el tiempo nuclear tendrá la entrada a la metrología de próxima generación.", "ja": "「世界初」がまた一つ。精密計時は航法・通信・基礎物理の基盤インフラ。核遷移計時を制する者が次世代精密測定の入場券を握る。"}}, {"idx": "04", "title": {"zh": "具身智能产业化加速：全国已建成 70 多家训练场", "en": "Embodied-AI industry accelerates: 70+ training grounds built nationwide", "es": "Se acelera la industria de la IA encarnada: más de 70 campos de entrenamiento", "ja": "具体化AI（エンボディド）産業化が加速：全国で70か所以上の訓練場が稼働"}, "body": {"zh": "目前全国已建成启用 70 多家具身智能训练场，形成长三角、京津冀、珠三角三大核心集群；工信部数据显示，今年前 8 个月我国软件业务收入超过 10 万亿元，同比增长 8.8%。", "en": "Over 70 embodied-intelligence training grounds are now operating nationwide, forming three core clusters around the Yangtze Delta, Beijing-Tianjin-Hebei and Pearl River Delta; MIIT data show software revenue exceeded 10 trillion yuan in the first 8 months, up 8.8% yoy.", "es": "Ya operan más de 70 campos de entrenamiento de IA encarnada en todo el país, en tres núcleos (delta del Yangtsé, Jing-Jin-Ji y delta del Perla); datos del MIIT indican ingresos de software superiores a 10 billones de yuanes en 8 meses, +8,8% interanual.", "ja": "現在、全国で70か所以上のエンボディドAI訓練場が稼働し、長江デルタ・京津冀・珠江デルタの3大クラスターを形成。工業情報化部データでは、年初8か月のソフトウェア収入は10兆元を超え前年同期比8.8%増。"}, "why": {"zh": "训练场是具身智能从“实验室演示”走向“规模化数据”的关键基建，叠加软件业稳健增长，机器人产业链景气度获得双数据验证。", "en": "Training grounds are key infrastructure taking embodied AI from “lab demos” to “scaled data”; with steady software growth, the robotics chain gets dual confirmation.", "es": "Los campos son la infraestructura clave que lleva la IA encarnada de la “demo de laboratorio” a “datos a escala”; con el software firme, la cadena robótica tiene doble confirmación.", "ja": "訓練場は、エンボディドAIを「実験室デモ」から「スケールデータ」へ導く重要インフラ。ソフトウェアの堅調増収と合わせ、ロボット関連の好況が二重に裏付けられる。"}}, {"idx": "05", "title": {"zh": "民生政策密集落地：银龄讲学招 6000 人，康复护理扩容工程启动", "en": "Livelihood policies land: 6,000 silver-age teaching posts, rehab-care expansion launched", "es": "Aterrizan políticas de bienestar: 6.000 plazas de enseñanza sénior y ampliación de rehabilitación", "ja": "民生政策が相次ぎ実施：シルバー世代の講師6000人募集、リハビリ看護拡充事業が始動"}, "body": {"zh": "教育部、财政部部署实施 2026 年银龄讲学计划，招募义务教育阶段银龄讲学教师 6000 名；国家卫健委、发改委印发《医疗康复护理扩容提升工程实施方案》，提出到 2030 年每万人口康复治疗师达 1.6 人，人口较多地市至少设 1 所公立康复医院。", "en": "The education and finance ministries launched the 2026 Silver-Age Teaching Program, recruiting 6,000 retired teachers for compulsory education; the health and development commissions issued a rehab-nursing capacity plan targeting 1.6 therapists per 10,000 people by 2030, with at least one public rehab hospital per large city.", "es": "Los ministerios de educación y finanzas lanzaron el Programa de Enseñanza de Plata 2026, con 6.000 docentes jubilados para educación obligatoria; las comisiones de salud y desarrollo publicaron un plan de rehabilitación que busca 1,6 terapeutas por 10.000 habitantes para 2030, con al menos un hospital público de rehabilitación por gran ciudad.", "ja": "教育・財政両省は2026年「シルバー世代講学計画」を展開し、義務教育向けに退職教員6000人を募集。国家衛生健康委・発展改革委は「医療リハビリ看護拡充向上工程実施方案」を公表、2030年までに人口1万人当たりリハビリ療法士1.6人、人口の多い都市には公立リハビリ病院を少なくとも1か所とする。"}, "why": {"zh": "退休教师“再上岗”与康复医疗“补短板”同步推进，人口结构变化正倒逼公共服务供给侧改革，银发经济与教育就业都有新看点。", "en": "Retired teachers “back to work” and rehab-care “filling gaps” advance together; demographic change is forcing supply-side reform of public services, with new angles in the silver economy and education employment.", "es": "Jubilados “de vuelta” y rehabilitación “rellenando huecos” avanzan juntas; el cambio demográfico obliga a reformar la oferta pública, con novedades en economía plateada y empleo educativo.", "ja": "退職教員の「再登板」とリハビリ医療の「補完」が同時進行。人口構造の変化が公的サービスの供給側改革を迫り、シルバー経済と教育雇用に新たな芽が出る。"}}]}, {"key": "fin", "num": "03", "color": "#b45309", "deep": "#8a3f06", "name": {"zh": "金融要闻", "en": "Finance", "es": "Finanzas", "ja": "金融"}, "items": [{"idx": "01", "tag": {"zh": "进展"}, "title": {"zh": "美联储 9 月纪要放鹰：今年或再一次加息", "en": "Fed September minutes turn hawkish: another hike possible this year", "es": "Las minutas de septiembre de la Fed son halcones: otro alza este año es posible", "ja": "FRB9月議事要旨がタカ派に：今年あと1回の利上げの可能性"}, "body": {"zh": "美联储公布的 9 月货币政策会议纪要显示，多数官员认为通胀压力仍偏高，今年或将再一次加息。此前市场对 10 月加息的押注一度从 70% 降至 19.4%，纪要公布后预期重新升温，10 年期美债收益率维持 5.3% 上方的多年高位。", "en": "The Fed's released September minutes show most officials see inflation still too high and a further hike possible this year. Bets on an October hike had fallen from 70% to 19.4% but rose again after the minutes; the 10-year Treasury yield holds above 5.3%, a multi-year high.", "es": "Las minutas de septiembre de la Reserva Federal muestran que la mayoría ve la inflación aún alta y un nuevo alza posible este año. Las apuestas a un alza en octubre cayeron del 70% al 19,4% pero subieron tras las minutas; el bono a 10 años se mantiene sobre el 5,3%, máximo de años.", "ja": "FRBが公表した9月の金融政策議事要旨によると、大半の当局者はインフレ圧力が依然として高く、今年中にさらなる利上げの可能性があると見ている。10月利上げへの市場の確率は一時70%から19.4%に低下したが、要旨公表後に再び上昇。10年債利回りは5.3%台の数年ぶり高水準を維持。"}, "why": {"zh": "加息预期反复是当前全球资产定价的最大扰动源，美股科技股与新兴市场流动性都直接受制于美债利率走向，今晚起的通胀数据将给出下一步答案。", "en": "Whipsawing hike expectations are the biggest disruptor of global asset pricing; U.S. tech and emerging-market liquidity hinge on Treasury rates, with inflation data due to give the next answer.", "es": "Las expectativas de alza, cambiantes, son el mayor perturbador de la valoración global; la tecnología estadounidense y la liquidez emergente dependen del bono; los datos de inflación darán la próxima respuesta.", "ja": "利上げ期待の振れが現在の世界資産価格の最大の攪乱要因。米国株ハイテクと新興国の流動性は国債金利の行方に直結し、今夜以降のインフレ指標が次の答えを出す。"}}, {"idx": "02", "tag": {"zh": "进展"}, "title": {"zh": "1500 亿注资特别国债发行落地，央行 1.2 万亿买断式逆回购护航", "en": "150 billion yuan recapitalization bond issued; PBOC injects 1.2 trillion via reverse repo", "es": "Se emiten bonos especiales de recapitalización por 150.000 millones; el banco central inyecta 1,2 billones", "ja": "1.5兆元の資本注入特別国債が発行、人民銀は12兆元の買い戻しオペで下支え"}, "body": {"zh": "财政部 10 月 8 日发行 2026 年中央金融机构注资特别国债（一期），5 年期、竞争性招标面值总额 1500 亿元；同日央行开展 12000 亿元 3 个月期买断式逆回购操作，保持节后银行体系流动性合理充裕。", "en": "On Oct 8 the Ministry of Finance issued the first tranche of 2026 central financial-institution recapitalization special bonds—5-year, 150 billion yuan competitive; the same day the PBOC ran a 1.2 trillion yuan 3-month outright reverse repo to keep post-holiday banking liquidity ample.", "es": "El 8 de octubre el Ministerio de Hacienda emitió el primer tramo de bonos especiales de recapitalización de 2026 para instituciones financieras centrales: a 5 años, 150.000 millones de yuanes; ese día el banco central hizo un reverse repo a 3 meses de 1,2 billones para mantener la liquidez bancaria posfestivo.", "ja": "財政部は10月8日、2026年中央金融機関資本注入特別国債（第1期）を発行。5年物で競争入札枠1500億元。同じ日、人民銀は3カ月物買戻し型オペを1.2兆元実施し、休場後の銀行システムの流動性を適切に潤沢に保った。"}, "why": {"zh": "特别国债注资国有大行与天量逆回购同日落地，“补血+补水”组合既夯实银行资本充足率，也传递出货币政策对流动性的呵护态度。", "en": "Recapitalizing big state banks and a massive reverse repo on the same day—the “capital plus liquidity” combo bolsters capital adequacy and signals an accommodative monetary stance.", "es": "La recapitalización de los grandes bancos estatales y un enorme reverse repo el mismo día: la combinación “capital y liquidez” afianza la solvencia y señala una política monetaria complaciente.", "ja": "国有大行への特別国債による資本注入と巨大なreverse repoが同日実現。「血の補給＋水の補給」のセットは自己資本比率を裏付けつつ、流動性への配慮という金融姿勢を伝える。"}}, {"idx": "03", "tag": {"zh": "进展"}, "title": {"zh": "美股结束连涨集体收跌，光通信半导体领跌", "en": "U.S. stocks end winning streak, optical-comms and chips lead losses", "es": "Las bolsas de EE. UU. rompen la racha: óptica y chips lideran las caídas", "ja": "米株、連騰止めてそろって反落―光通信・半導体が主導"}, "body": {"zh": "美东时间周四（8 日）美股三大指数集体下跌：纳指跌 0.62% 报 27366.74 点，标普 500 跌 0.41%，道指跌 0.42%；光通信、半导体、存储芯片板块跌幅居前，加密货币概念股普跌。此前标普、纳指曾连创新高。", "en": "On Thursday (the 8th) all three major U.S. indexes fell: the Nasdaq dropped 0.62% to 27,366.74, the S&P 500 lost 0.41% and the Dow 0.42%; optical communications, semiconductors and memory chips led declines, with crypto-linked stocks broadly lower. The S&P and Nasdaq had just set records.", "es": "El jueves (día 8) los tres índices principales de EE. UU. cayeron: el Nasdaq bajó un 0,62% a 27.366,74, el S&P 500 un 0,41% y el Dow un 0,42%; óptica, semiconductores y memoria lideraron, y las cripto cayeron. El S&P y el Nasdaq acababan de marcar máximos.", "ja": "米東部時間8日（木）、主要3指数はそろって下落。ナスダックは0.62%安の27366.74、S&P500は0.41%安、ダウは0.42%安。光通信、半導体、メモリチップが下落を主導し、暗号資産関連も広く安い。直前までS&Pとナスダックは史上最高値を更新していた。"}, "why": {"zh": "美债利率高企与油价飙升正挤压高估值科技股，“AI 叙事”与“加息现实”的拉锯决定短期美股方向，也直接牵动 A 股科技板块情绪。", "en": "High Treasury yields and surging oil are squeezing richly valued tech; the tug-of-war between the “AI narrative” and “hike reality” sets the near-term U.S. direction and directly moves A-share tech sentiment.", "es": "Los altos rendimientos y el petróleo oprimen la tecnología cara; la lid “narrativa IA” contra “realidad de alza” marca el rumbo corto de EE. UU. y mueve la tecnología de las A-shares.", "ja": "米国債金利の高止まりと原油高が高評価のハイテクを締め付ける。「AI物語」対「利上げの現実」の綱引きが米株短期の方向を決め、A株ハイテクの心理にも直結する。"}}, {"idx": "04", "title": {"zh": "钠电、固态、钙钛矿免征消费税，新型电池政策礼包落地", "en": "Sodium, solid-state and perovskite batteries exempted from consumption tax", "es": "Exenciones de impuesto al consumo para baterías de sodio, estado sólido y perovskita", "ja": "ナトリウム電池・全固体・ペロブスカイトを消費税免除に"}, "body": {"zh": "财政部、海关总署、税务总局联合发布公告，自 2026 年 9 月 1 日至 2028 年 12 月 31 日，对钠离子电池、固态电池、燃料电池及光伏电池中的钙钛矿电池、叠层电池、砷化镓电池免征消费税，分步调整部分电池产品消费税政策。", "en": "The finance, customs and tax authorities announced that from Sept 1, 2026 to Dec 31, 2028, consumption tax will be waived on sodium-ion, solid-state and fuel cells, and on perovskite, tandem and gallium-arsenide photovoltaic cells, with phased adjustments to battery tax policy.", "es": "Hacienda, Aduanas y Tributos anunciaron que del 1 de septiembre de 2026 al 31 de diciembre de 2028 se exime del impuesto al consumo a las de sodio, estado sólido y combustible, y a las fotovoltaicas de perovskita, tándem y arseniuro de galio, con ajustes por fases.", "ja": "財政部・税関・税务总局は、2026年9月1日から2028年12月31日まで、ナトリウムイオン電池・全固体電池・燃料電池、およびペロブスカイト・タンデム・ヒ化ガリウムの太陽電池の消費税を免除し、電池製品の消費税政策を段階的に見直すと発表した。"}, "why": {"zh": "税收杠杆精准导向下一代电池技术路线，固态电池与钙钛矿产业链的资本开支热情有望进一步升温，锂电板块近期已提前异动。", "en": "The tax lever precisely targets next-generation battery routes; capex enthusiasm for solid-state and perovskite chains could heat up further, and the lithium sector has already moved early.", "es": "La palanca fiscal apunta con precisión a las rutas de batería de próxima generación; el entusiasmo de capex por estado sólido y perovskita puede subir, y el litio ya se adelantó.", "ja": "税制というてこが次世代電池のルートを的確に指向。全固体とペロブスカイト関連の設備投資意欲がさらに高まる公算で、リチウム関連はすでに先回りしている。"}}, {"idx": "05", "title": {"zh": "“华为赛力斯复合”冲上热搜第一：五年长约落定", "en": "“Huawei–Seres reunion” tops hot search as five-year deal signed", "es": "La “reconciliación Huawei–Seres” lidera la tendencia: acuerdo de cinco años", "ja": "「ファーウェイ×セリス復縁」が熱検索1位―5年契約が決着"}, "body": {"zh": "华为与赛力斯赶在十一假期前签署新一轮五年战略合作协议，“复合”话题 8 日冲上热搜第一。问界的营销与售后将全面回归赛力斯自主经营，华为退居技术供应商角色，继续提供乾崑智驾、鸿蒙座舱等核心智能化方案。", "en": "Huawei and Seres signed a new five-year strategic cooperation agreement before the holiday; the “reunion” topic hit No.1 on hot search on the 8th. AITO's marketing and service return fully to Seres, with Huawei stepping back to a tech-supplier role while still providing Qiankun intelligent driving and HarmonyOS cockpit.", "es": "Huawei y Seres firmaron antes del festivo un nuevo acuerdo estratégico de cinco años; el tema de la “reconciliación” fue el 1 del día 8. El marketing y servicio de AITO vuelven a Seres, y Huawei queda como proveedor tecnológico, pero sigue dando Qiankun y HarmonyOS.", "ja": "ファーウェイとセリスは休暇前に新たな5年戦略提携を締結。「復縁」話題は8日に熱検索1位に。AITOのマーケとアフターはセリスの自主運営に全面的に戻り、ファーウェイは技術供給側に退きつつ、乾崑（Qiankun）知能運転や鴻蒙（HarmonyOS）コックピットなどの中核知能化方案を提供し続ける。"}, "why": {"zh": "“分手传闻”以五年长约收场，鸿蒙智行最早、体量最大的合作项目进入新阶段——车企要渠道、华为要规模的商业模式再平衡，值得全行业参照。", "en": "A “breakup rumor” ends with a five-year deal; Harmony Intelligent Mobility's earliest and largest project enters a new phase—the rebalancing of “OEMs want channels, Huawei wants scale” is a model for the industry.", "es": "El “rumor de ruptura” acaba en un pacto de cinco años; el proyecto más antiguo y grande de Harmony entra en nueva fase: el reequilibrio “la OEM quiere canales, Huawei quiere escala” es modelo para el sector.", "ja": "「破局説」は5年契約で決着。鴻蒙智行（Harmony Intelligent Mobility）の最古かつ最大の協力プロジェクトが新段階へ。自動車メーカーはチャネルを、ファーウェイは規模を望むというビジネスモデルの再均衡は業界の参考になる。"}}]}, {"key": "spo", "num": "04", "color": "#15803d", "deep": "#105c2c", "name": {"zh": "体育竞技", "en": "Sports", "es": "Deportes", "ja": "スポーツ"}, "items": [{"idx": "01", "tag": {"zh": "进展"}, "title": {"zh": "郑钦文 24 岁生日许愿“继续打硬仗”：今晚冲击中网四强", "en": "Zheng Qinwen turns 24: aims for China Open semifinal tonight", "es": "Zheng Qinwen cumple 24 años y busca semis del Abierto de China", "ja": "鄭欽文、24歳の誕生日に「強敵と戦い続ける」―今夜は中国オープン4強へ"}, "body": {"zh": "郑钦文 8 日迎来 24 岁生日。生日前一天她 6-1/2-6/6-4 力克黑马查拉耶娃，第二次闯入中网八强，即时世界排名回升至第 41 位。今晚 1/4 决赛她将迎战 6 号种子斯维托丽娜——两人此前从未交手，若取胜将追平 2024 年创造的个人中网最佳战绩（四强）。", "en": "Zheng Qinwen turned 24 on the 8th. The day before, she beat upset-maker Charaeva 6-1, 2-6, 6-4 to reach the China Open quarterfinals for the second time, with her live ranking back to No.41. Tonight's quarterfinal is against No.6 seed Svitolina—they've never met; a win would equal her 2024 best (semifinal).", "es": "Zheng Qinwen cumplió 24 el día 8. La víspera venció a la sorpresa Charaeva por 6-1, 2-6, 6-4 y volvió a cuartos del Abierto de China; su ránking en vivo volvió al 41. Esta noche se mide a la 6.ª cabeza Svitolina, a la que nunca enfrentó; ganar igualaría su mejor (semis 2024).", "ja": "鄭欽文は8日に24歳の誕生日を迎えた。前日は新星チャラエワを6-1,2-6,6-4で下し、中国オープン8強（自身2度目）に進出、生ランキングを41位に回復。今夜の準々決勝は第6シードのスビトリナと初対戦。勝てば2024年的最好（4強）に並ぶ。"}, "why": {"zh": "从肘伤手术、排名跌出百名开外，到美网八强、中网八强，“Queen Wen”的回升曲线自带热血剧本，今晚能否把生日祝福变成四强门票，全网都在等答案。", "en": "From elbow surgery and a ranking outside the top 100 to the US Open and China Open quarters, “Queen Wen's” comeback writes its own script; the whole web awaits whether her birthday wish becomes a semifinal ticket.", "es": "De la cirugía de codo y salir del top 100 a cuartos de US Open y China Open, el regreso de “Queen Wen” esguiona guion propio; la red espera si su deseo cumple años se vuelve semifinal.", "ja": "肘の手術で100位圏外に落ちながら、全米8強・中国8強へ復活した「Queen Wen」の上昇曲線は熱いドラマそのもの。誕生日の願いが4強の切符になるか、ネット中が答えを待つ。"}}, {"idx": "02", "title": {"zh": "周启豪 3-0 零封张本智和，王曼昱双线晋级今晚战申裕斌", "en": "Zhou Qihao blanks Harimoto 3-0; Wang Manyu advances on two fronts", "es": "Zhou Qihao barre a Harimoto 3-0; Wang Manyu avanza en dos frentes", "ja": "周啓豪、張本智和を3-0で完封―王曼昱は2種目で勝ち上がり今夜は申裕斌戦"}, "body": {"zh": "WTT 中国大满贯男单 1/8 决赛，周启豪 11-9/11-8/11-9 横扫世界第三张本智和——此前他对张本两连败；王曼昱 3-2 险胜石洵瑶、又与蒯曼携手闯入女双四强。今晚周启豪 1/4 决赛对阵韩国张禹珍，王曼昱 18:00 迎战申裕斌。", "en": "In the WTT China Grand Smash men's round of 16, Zhou Qihao swept world No.3 Harimoto 11-9, 11-8, 11-9—after two straight losses to him; Wang Manyu edged Shi Xunyao 3-2 and reached the women's doubles semis with Kuai Man. Tonight Zhou meets Korea's Jang Woo-jin in the quarters; Wang faces Shin Yu-bin at 18:00.", "es": "En el China Grand Smash de la WTT, octavos masculinos, Zhou Qihao arrasó al 3 del mundo Harimoto por 11-9, 11-8, 11-9, tras dos derrotas seguidas; Wang Manyu venció 3-2 a Shi Xunyao y fue a semis de dobles con Kuai Man. Esta noche Zhou se mide a Jang Woo-jin; Wang a Shin Yu-bin a las 18:00.", "ja": "WTT中国グランドスラム男子16強、周啓豪は世界3位の張本智和を11-9,11-8,11-9でスウィープ（対戦2連敗後）。王曼昱は石洵瑶に3-2で競り勝ち、蒯曼とともに女子ダブルス4強へ。今夜は周が張禹珍と準々決勝、王が18時に申裕斌と対戦。"}, "why": {"zh": "在女线爆冷出局后的关键一天，周启豪用一场含金量十足的零封稳住男单阵脚；今晚两场中日韩对决，直接决定国乒冲冠版图。", "en": "On a key day after women's upsets, Zhou's statement blanking steadied the men's side; tonight's two China–Japan/Korea clashes directly shape the title race.", "es": "En un día clave tras las sorpresas femeninas, el 3-0 de Zhou estabilizó al equipo; los dos choques de esta noche definen el cuadro de títulos.", "ja": "女子の波乱の後に迎えた正念場、周の価値ある完封で男子陣が踏み止まった。今夜の2つの日韓・中韓戦が優勝争いの枠を直接決める。"}}, {"idx": "03", "title": {"zh": "冷门迭爆：朱思冰掀翻蒯曼，女单八强国乒占四席", "en": "Upsets galore: Zhu Sibing stuns Kuai Man; China takes 4 of 8 in women's draw", "es": "Sorpresas: Zhu Sibing vence a Kuai Man; China suma 4 de 8", "ja": "波乱続出：朱思氷が蒯曼を破る、女子8強は中国が4席"}, "body": {"zh": "国乒女单“德比日”冷门频出——削球手朱思冰决胜局 11-7 逆转蒯曼（此前从未赢过这位队友），何卓佳 0-3 不敌日本张本美和；王艺迪 3-1 淘汰陈熠、陈幸同 3-0 轻取大藤沙月。女单八强国乒占四席，今晚朱思冰对阵日本佐藤瞳、王艺迪对决张本美和。", "en": "On the women's “derby day,” underdog chopper Zhu Sibing rallied 11-7 in the decider to beat Kuai Man—her first ever win over the teammate; He Zhuojia fell 0-3 to Japan's Miwa Harimoto; Wang Yidi beat Chen Yi 3-1 and Chen Xingtong beat Satsuki Odo 3-0. China holds 4 of 8 quarterfinal spots; tonight Zhu meets Japan's Hiroki Sato and Wang faces Miwa Harimoto.", "es": "En el “día de derbis” femenino, la cortadora Zhu Sibing remontó 11-7 en el decisivo ante Kuai Man, su primer triunfo ante la compañera; He Zhuojia cayó 0-3 ante Miwa Harimoto; Wang Yidi venció 3-1 a Chen Yi y Chen Xingtong 3-0 a Satsuki Odo. China tiene 4 de 8; esta noche Zhu se mide a Hiroki Sato y Wang a Miwa Harimoto.", "ja": "女子の「直接対決の日」は波乱が続出。カットマン朱思氷が第5ゲームを11-7で逆転し蒯曼を下した（これまでチームメイトに未勝利）。何卓佳は張本美和に0-3、王芸迪は陳熠を3-1、陳幸同は大藤沙月を3-0で破った。女子8強は中国が4席。今夜は朱が佐藤瞳、王が張本美和と対戦。"}, "why": {"zh": "“第一次赢蒯曼”的朱思冰连爆大冷，国乒内卷深度再次展示；但张本美和连克国乒的势头，为女单决赛埋下最大悬念。", "en": "Zhu, winning Kuai for the first time, keeps producing shocks, showing China's depth; but Miwa Harimoto's streak against China sets up the biggest final suspense.", "es": "Zhu, que gana a Kuai por primera vez, encadena sorpresas y muestra la profundidad china; pero la racha de Miwa Harimoto contra China es la mayor incógnita de la final.", "ja": "蒯曼に初勝利した朱思氷が大波乱を連発、中国の底力を見せつける。一方で張本美和の中国破りの勢いが女子決勝の最大のサスペンスだ。"}}, {"idx": "04", "title": {"zh": "国足世界排名跌至第 96 位，创近十年新低", "en": "China men's national team drops to 96th, a decade low", "es": "La selección china cae al puesto 96, mínimo de una década", "ja": "男子代表、世界ランク96位に転落―約10年ぶりの低水準"}, "body": {"zh": "国际足联最新排名显示，中国男足世界排名下降至第 96 位，创近十年最低；此前国足刚在热身赛中 0-1 不敌塔吉克斯坦，遭遇热身赛三连败。", "en": "The latest FIFA rankings show China's men's team has fallen to 96th, its lowest in nearly a decade; this follows a 0-1 friendly loss to Tajikistan and a third straight friendly defeat.", "es": "El último ránking de la FIFA sitúa a China en el 96, su peor puesto en casi diez años, tras perder 0-1 un amistoso con Tayikistán y encadenar tres derrotas amistosas.", "ja": "FIFA最新ランキングで中国男子代表は96位に下落、ほぼ10年ぶりの低水準。此前、タジキスタンに0-1で敗れ、親善試合3連敗を喫していた。"}, "why": {"zh": "亚运止步、热身连败、排名探底——男足的“系统性低迷”再次成为全民情绪话题，从青训到联赛的重建讨论将再度升温。", "en": "Out of the Asian Games, friendly loses piling up, ranking at rock bottom—the men's “systemic slump” is again a national talking point, and rebuilding from youth to league will be debated anew.", "es": "Fuera de los Juegos, derrotas amistosas y ránking en el suelo: el “bache sistémico” masculino vuelve a ser tema nacional y se reabre el debate de reconstrucción.", "ja": "アジア大会敗退、親善連敗、ランク最低――男子の「構造的な低迷」が再び国民的話題に。育成からリーグまでの再建論が再燃する。"}}, {"idx": "05", "tag": {"zh": "进展"}, "title": {"zh": "国乒首次无缘中国大满贯混双冠军，今晚外协组合争金", "en": "China misses mixed doubles final for first time at its Grand Slam", "es": "China se queda fuera de dobles mixto en su Gran Slam por primera vez", "ja": "卓球中国、混合ダブルス優勝を初逃す―今夜は外国勢が金を争う"}, "body": {"zh": "随着黄友政/陈熠在 1/4 决赛五局惜败日本的松岛辉空/张本美和，国乒混双组合本届全军覆没，中国大满贯创办以来首次错失混双金牌。今晚 20:15 混双决赛：中国台北林昀儒/郑怡静对阵韩国林钟勋/申裕斌。", "en": "After Huang Youzheng/Chen Yi lost a five-game quarterfinal to Japan's Matsushima/Miwa Harimoto, China's mixed doubles teams were wiped out—the first time the China Grand Slam has missed the mixed doubles gold. Tonight at 20:15 the final pits Taiwan's Lin Yun-ju/Cheng I-ching against Korea's Lim Jong-hoon/Shin Yu-bin.", "es": "Tras perder Huang Youzheng/Chen Yi en cuartos, en cinco juegos, ante los japoneses Matsushima/Miwa Harimoto, los dobles mixtos chinos fueron eliminados: primera vez que el Gran Slam de China no tiene oro de mixtos. Esta noche a las 20:15, final entre Lin Yun-ju/Cheng I-ching (Taiwán) y Lim Jong-hoon/Shin Yu-bin (Corea).", "ja": "黄友政／陳熠が準々決勝で日本の松島輝空／張本美和にフルゲームの末敗れたため、中国の混合ダブルスは全滅。中国グランドスラム創設以来初の混合金メダル逃し。今夜20:15の決勝は、チャイニーズタイペイの林昀儒／鄭怡静と韓国の林鐘勲／申裕斌。"}, "why": {"zh": "国乒最稳的“包揽项”之一意外失守，是双打梯队建设的一次现实提醒；外协组合登顶也给大满贯增加了久违的悬念。", "en": "One of China's safest “sweep events” fell unexpectedly—a real reminder for doubles development; a foreign pair atop the podium also adds long-missing suspense.", "es": "Uno de los “eventos de barrida” más seguros de China cayó; recordatorio real para el dobles; un par extranjero arriba suma la suspensión que faltaba.", "ja": "中国の最も堅い「総取り種目」の一つがまさかの陥落。ダブルス育成への現実的な警鐘。外国勢の頂上で久々のサスペンスも生まれた。"}}]}, {"key": "hot", "num": "05", "color": "#6d28d9", "deep": "#551dab", "name": {"zh": "网络热点", "en": "Trending", "es": "Tendencias", "ja": "話題"}, "items": [{"idx": "01", "title": {"zh": "2027 考研预报名今日启动，报名窗口仅 4 天", "en": "2027 postgraduate pre-registration opens, window just 4 days", "es": "Abren las preinscripciones 2027 de posgrado, solo 4 días", "ja": "2027年大学院入試の予備登録が開始、窓口はわずか4日間"}, "body": {"zh": "2027 年全国硕士研究生招生考试预报名 10 月 9 日至 12 日进行，每日 9:00-22:00；正式报名 10 月 15 日至 24 日，初试定于 12 月 19 日至 20 日举行。", "en": "Pre-registration for the 2027 national postgraduate entrance exam runs Oct 9–12, 9:00–22:00 daily; formal registration is Oct 15–24, with the written test on Dec 19–20.", "es": "La preinscripción al examen nacional de posgrado 2027 es del 9 al 12 de octubre, de 9:00 a 22:00; la inscripción formal es del 15 al 24 de octubre y el escrito, del 19 al 20 de diciembre.", "ja": "2027年全国大学院入学試験の予備登録は10月9〜12日、毎日9:00〜22:00。本登録は10月15〜24日、筆記試験は12月19〜20日。"}, "why": {"zh": "考研报名人数连续两年回落后，“考研还是就业”的选择题进入新一季；预报名首日的系统承载力与热门院校竞争比，是每年的固定观察点。", "en": "After two years of falling applicants, the “grad school or work” choice returns; day-one system load and program competition ratios are the annual watch points.", "es": "Tras dos años de menos inscritos, vuelve el dilema “posgrado o empleo”; la carga del primer día y la competencia son la cita anual.", "ja": "志願者数が2年連続で減少した後、「院か就職か」の選択が新たな季節へ。初日のシステム負荷と人気校の競争倍率が毎年の観測点だ。"}}, {"idx": "02", "title": {"zh": "景区押金“退款成功”却凭空消失，投诉超千条", "en": "Scenic-spot deposits “refunded” but vanish; 1,000+ complaints", "es": "Fianzas de sitios turísticos “devueltas” que desaparecen; más de 1.000 quejas", "ja": "観光地のデポジット「返金完了」なのに消滅、苦情1000件超"}, "body": {"zh": "陕西、四川等地游客反映在景区租用设备后，押金显示“退款成功”却未原路退回，而是转入平台余额或凭空蒸发，投诉平台相关投诉已超千条。专家指出，商家擅自更改退款路径沉淀资金涉嫌违规及虚假宣传，消费者可拨打 12315 维权。", "en": "Visitors in Shaanxi, Sichuan and elsewhere say equipment-rental deposits at scenic spots showed “refund success” but never returned to their accounts—diverted to platform balances or simply vanishing; related complaints exceed 1,000. Experts say altering refund paths to pool funds may violate rules and constitute false advertising; consumers can call 12315.", "es": "Visitantes en Shaanxi, Sichuan y otros lugares dicen que las fianzas de alquiler mostraban “devolución exitosa” pero no volvieron a su cuenta—desviadas a saldos de plataforma o evaporadas; hay más de 1.000 quejas. Expertos dicen que cambiar la ruta de reembolso para retener fondos puede violar normas y ser publicidad falsa; pueden llamar al 12315.", "ja": "陝西・四川などの観光地で機器レンタルのデポジットが「返金完了」と表示されたのに口座に戻らず、プラットフォーム残高に振り替わるか消滅したと報告が相次ぎ、関連苦情は1000件超。専門家は返金経路の勝手な変更・資金プールは違規や虚偽広告の疑いありと指摘。消費者は12315で通報を。"}, "why": {"zh": "假期出游高峰刚过、押金纠纷集中爆发，“扫码租借”背后的小微资金池乱象到了该整治的时候——也提醒大家留存好退款凭证。", "en": "Right after the holiday travel peak, deposit disputes erupted; the micro-fund-pool chaos behind “scan-to-rent” needs cleaning up—and everyone should keep refund proof.", "es": "Tras el pico vacacional, estallan las disputas de fianzas; el caos de “alquiler por código” necesita limpieza, y conviene guardar el comprobante.", "ja": "休暇の旅行ピーク直後、デポジット紛争が噴出。「スキャン借り」の裏の小規模資金プールの乱れは是正の時期。返金証明の保管も呼びかけ。"}}, {"idx": "03", "title": {"zh": "重庆李子坝地下 33 米金库藏一亿现钞，成网红打卡点", "en": "Chongqing vault 33m underground holds 100 million cash, now a viral spot", "es": "Una bóveda a 33 m bajo tierra en Chongqing guarda 100 millones y es fenómeno", "ja": "重慶・李子バー、地下33mの金庫に1億元、今や撮影スポットに"}, "body": {"zh": "重庆李子坝一处下沉至嘉陵江边地下 33 米的抗战时期金库对外开放参观，库内存放一亿现钞，游客可直观感受“一亿”的视觉震撼并了解抗战金融历史文化，体验感拉满。", "en": "A wartime vault sunk 33 meters below ground by the Jialing River in Chongqing's Liziba district has opened to visitors, displaying 100 million yuan in cash so tourists can grasp the visual scale of “one hundred million” and learn wartime financial history.", "es": "Una bóveda de guerra hundida 33 m junto al río Jialing, en Liziba (Chongqing), abrió al público con 100 millones de yuanes en efectivo, para que los turistas sientan la escala de “cien millones” y conozcan la historia financiera bélica.", "ja": "重慶・李子バー地区で嘉陵江べりの地下33mに沈む戦時の金庫が公開され、庫内には1億元の現金が保管され、観光客は「1億」の視覚的スケールと戦時の金融史を体感できる。"}, "why": {"zh": "“一亿现金长什么样”自带传播势能，金融历史+沉浸式打卡的组合，是老建筑活化利用的又一高分样本。", "en": "“What does 100 million cash look like” is inherently shareable; finance history plus immersive check-in is another strong case of adaptive reuse.", "es": "“Cómo es 100 millones en efectivo” es viral por naturaleza; historia financiera y visita inmersiva son otro buen caso de reuso.", "ja": "「1億元の現金ってどう見える」は元々拡散力を持つ。金融史×没入型撮影は古建築活用の好例だ。"}}, {"idx": "04", "tag": {"zh": "进展"}, "title": {"zh": "燃油附加费明起上调：今晚 24 时前出票仍按旧价，机票大跳水", "en": "Fuel surcharge rises tomorrow; tickets booked before midnight keep old rate as fares plunge", "es": "La sobretasa de combustible sube mañana; los billetes hasta medianoche mantienen precio", "ja": "燃油サーチャージは明日値上げ、今夜24時までの発券は旧料金・運賃は大暴落"}, "body": {"zh": "自 10 月 10 日起国内航线燃油附加费上调：800 公里以上航段由 70 元涨至 90 元（+20 元），800 公里以下由 40 元涨至 50 元（+10 元），以出票日期为准、改期不退不补——今天 24 时前出票仍按旧标准。另一边节后机票“大跳水”：10 月 9 日至 31 日机票均价较国庆假期低 30% 以上，北京飞乌鲁木齐低至 300 元。", "en": "From Oct 10 domestic fuel surcharges rise: over-800km segments from 70 to 90 yuan (+20), under-800km from 40 to 50 yuan (+10), based on ticket date with no refund on change—tickets issued before midnight tonight keep the old rate. Meanwhile post-holiday fares “plunge”: Oct 9–31 average is 30%+ below the holiday, with Beijing–Urumqi as low as 300 yuan.", "es": "Desde el 10 de octubre sube la sobretasa doméstica: tramos de más de 800 km de 70 a 90 yuanes (+20) y de menos, de 40 a 50 (+10), según fecha de billete sin reembolso; los emitidos hasta medianoche conservan la tarifa. Mientras, tras el festivo los precios “se hunden”: del 9 al 31 de octubre un 30% por debajo, con Pekín–Ürümqi en 300 yuanes.", "ja": "10月10日から国内線の燃油サーチャージが値上げ。800km超は70→90元（+20）、800km以下は40→50元（+10）。適用は発券日基準で変更時の返金なし。今夜24時までの発券は旧料金のまま。一方、休場後の運賃は「大暴落」し、10月9〜31日の平均は国慶節より30%以上安く、北京―ウルムチは300元まで。"}, "why": {"zh": "附加费上涨与裸票跳水同时发生，“低价窗口最后一天”成为出行群的刷屏话题——错峰出行这波红利，会算账的人已经下手了。", "en": "Rising surcharge alongside plunging base fares makes “last day of the cheap window” a trending topic; the off-peak dividend is already grabbed by the savvy.", "es": "Sobretasa al alza y tarifa base a la baja hacen tendencia “último día barato”; los listos ya aprovechan el dividendo de temporada baja.", "ja": "サーチャージ上昇と正規運賃暴落が同時発生。「安値窓口最終日」が旅グループでトレンドに。混雑回避の恩恵を計算する人はもう動いた。"}}, {"idx": "05", "title": {"zh": "明天周六补班：今年最后一个调休补班日", "en": "Saturday is a makeup workday—the last adjusted holiday swap this year", "es": "El sábado es día de recuperación, el último intercambio del año", "ja": "明日の土曜は代休出勤―今年最後の振替出勤日"}, "body": {"zh": "10 月 10 日（周六）为国庆中秋调休补班日，打工人需连上 6 天班、周日休一天；这也是今年剩余时间里的最后一个调休补班日，此后到元旦将再无法定节假日。", "en": "Oct 10 (Saturday) is a makeup workday for the National Day–Mid-Autumn shift; workers put in 6 straight days before a one-day Sunday rest. It is also the last such swap this year; no statutory holidays remain until New Year.", "es": "El 10 de octubre (sábado) es día de recuperación por el Día Nacional–Medio Otoño; se trabajan 6 días seguidos antes de un domingo libre. Es el último intercambio del año; no hay festivos hasta Año Nuevo.", "ja": "10月10日（土）は国慶・中秋の振替による代休出勤日。勤め人は6日連続で働き、日曜に1日休む。これが今年残りの最後の振替出勤で、元旦まであらためて法定休日はない。"}, "why": {"zh": "调休话题年年必上热搜，“补班日+低价机票+燃油附加费上调”三事叠加，这个周末的出行与心情都值得提前规划。", "en": "The holiday-swap topic trends every year; “makeup day + cheap fares + higher surcharge” combined, this weekend's travel and mood deserve advance planning.", "es": "El tema del puente trendea cada año; “recuperación + vuelos baratos + sobretasa” hacen que este fin de semana merezca planearse.", "ja": "振替休暇の話題は毎年トレンドに。「代休日＋安値運賃＋サーチャージ値上げ」が重なり、今週末の移動と気分は事前計画が肝要。"}}]}, {"key": "ent", "num": "06", "color": "#db2777", "deep": "#ab1d5d", "name": {"zh": "娱乐八卦", "en": "Entertainment", "es": "Espectáculos", "ja": "エンタメ"}, "items": [{"idx": "01", "tag": {"zh": "进展"}, "title": {"zh": "飞天奖今晚烟台颁奖：40 年首次出京，奖杯“宝瓶换牡丹”", "en": "Feitian Awards in Yantai tonight: first time outside Beijing in 40 years, new trophy", "es": "Los Feitian en Yantai esta noche: primera vez fuera de Pekín en 40 años", "ja": "飛天賞、今夜は煙台で授賞―40年ぶりの北京離れ、トロフィーは「牡丹」に"}, "body": {"zh": "第 35 届电视剧飞天奖、第 29 届星光奖颁奖典礼今晚在山东烟台举行，这是飞天奖创办四十余年来首次离开北京。沿用 40 多年的“飞天女神捧宝瓶”奖杯更新为“手捧牡丹花”，红毯将搬来孔子博物馆复原版鲁邍钟演奏先秦雅乐，山东卫视等 13 家卫视 20:00 同步直播，于和伟、宋佳、闫妮、张若昀等近百位嘉宾出席。", "en": "The 35th Feitian Awards and 29th Starlight Awards are held tonight in Yantai, Shandong—the first time the Feitian has left Beijing in its 40+ years. The four-decade “goddess with vase” trophy is updated to “holding peonies,” the red carpet features replica Lu-style bells from the Confucius Museum playing ancient music, and 13 networks air it at 20:00 with nearly 100 guests including Yu Hewei, Song Jia, Yan Ni and Zhang Ruoyun.", "es": "La 35.ª gala Feitian y la 29.ª Starlight se celebran esta noche en Yantai (Shandong), la primera vez que los Feitian salen de Pekín en 40 años. El trofeo de “diosa con vasija” de 40 años pasa a “con peonías”; la alfombra roja trae campanas de Lu del Museo Confucio y 13 cadenas emiten a las 20:00 con casi 100 invitados como Yu Hewei, Song Jia, Yan Ni y Zhang Ruoyun.", "ja": "第35回テレビ飛天賞・第29回星光賞が今夜、山東・煙台で開催。飛天賞が北京を離れるのは創設40余年で初めて。「飛天女神が宝瓶を持つ」トロフィーは「牡丹を捧げる」に更新され、レッドカーペットでは孔子博物館の魯の鐘のレプリカによる先秦の雅楽が演奏される。山東衛視ほか13局が20時から同時生中継、于和偉・宋佳・閻妮・張若昀らほぼ100名が出席。"}, "why": {"zh": "奖杯焕新+首次出京，把电视剧行业最高奖办出了“文化出圈”的新意；宋佳能否凭《山花烂漫时》集齐“大满贯”，是今晚最大悬念。", "en": "A refreshed trophy and first out-of-capital edition give TV's top honor a cultural crossover twist; whether Song Jia completes the “grand slam” with “She and Her Girls” is the night's biggest suspense.", "es": "Trofeo nuevo y primera salida dan a la máxima distinción televisiva un toque cultural; si Song Jia completa el “grand slam” con “She and Her Girls” es la mayor incógnita.", "ja": "トロフィー刷新と初の地方開催が、テレビ最高賞に「文化の枠超え」の新味を。宋佳が『山花爛漫時』で「グランドスラム」を達成するかが今夜最大のサスペンス。"}}, {"idx": "02", "title": {"zh": "“本届有 90 后演员获奖”爆料发酵，杨紫于适欧豪成焦点", "en": "Rumor “a post-90s actor will win” swirls; Yang Zi, Yu Shi, Ou Hao in focus", "es": "Cunde el rumor “un actor post-90 ganará”; Yang Zi, Yu Shi y Ou Hao, foco", "ja": "「今回は90後（1990年代生まれ）の受賞あり」報道が拡大、楊紫・于適・欧豪が焦点"}, "body": {"zh": "颁奖前夜多个认证账号爆料称“为了行业发展，本届飞天奖有 90 后演员获奖”，并称此举将为金鹰、白玉兰等后续奖项“做出表率”，杨紫、于适、欧豪等成为网友热议的人选；总导演评价于适“非常优秀、很真诚，会给大家带来惊喜”，但未透露奖项信息。", "en": "On the eve of the ceremony, multiple verified accounts claimed “for the industry's development, this Feitian will have a post-90s actor win,” setting an example for later awards; Yang Zi, Yu Shi and Ou Hao became fan favorites. The chief director called Yu Shi “excellent and sincere, with a surprise,” but revealed nothing.", "es": "En la víspera, varias cuentas verificadas dijeron “para el sector, este Feitian tendrá un actor post-90”, dando ejemplo a otros premios; Yang Zi, Yu Shi y Ou Hao son favoritos. El director llamó a Yu Shi “excelente y sincero, con sorpresa”, sin revelar nada.", "ja": "授賞前夜、複数の認証アカウントが「業界の発展のため、今回の飛天賞で90後俳優が受賞する」とリークし、金鷹賞や白玉蘭賞などの「手本になる」と主張。楊紫・于適・欧豪らがネットで議論の的になった。総監督は于適を「非常に優秀で誠実、驚きをもたらす」と評したが、賞の詳細は明かさなかった。"}, "why": {"zh": "飞天奖四十年来首次“剧透式预热”，若 90 后首夺飞天重量级奖项，将是内娱代际更替的标志性一晚，今晚热搜已被预定。", "en": "The Feitian's first “spoiler-style” warm-up—if a post-90s actor takes a major Feitian, it's a landmark night for generational change, and tonight's hot search is pre-booked.", "es": "El primer “anticipo” de los Feitian: si un post-90 gana uno mayor, es una noche histórica para el relevo generacional; el trending de esta noche está reservado.", "ja": "飛天賞40年で初の「ネタバレ式」事前加熱。もし90後が飛天の大賞を初制覇すれば、内娯楽の世代交代を象徴する夜に。今夜の熱検索は既に約束されたようなもの。"}}, {"idx": "03", "title": {"zh": "周迅新片釜山首映口碑爆棚：唯一入围主竞赛的华语长片", "en": "Xun Zhou's new film wows Busan: only Chinese-language entry in main competition", "es": "El nuevo filme de Xun Zhou arrasa en Busan: única cinta en competencia", "ja": "周迅主演作が釜山で絶賛―コンペ唯一の中国語長編"}, "body": {"zh": "10 月 7 日，周迅、奚美娟、王圣迪主演的《初次尝到寂寞》在第 31 届釜山国际电影节完成世界首映，作为本届唯一入围主竞赛单元的华语长片，以三代女性的生命故事与诗意影像收获首映口碑，周迅的表演被外媒评价为“克制而内敛”。", "en": "On Oct 7, “The First Taste of Loneliness,” starring Xun Zhou, Meijuan Xi and Shengdi Wang, world-premiered at the 31st Busan International Film Festival—the only Chinese-language film in main competition—earning strong word of mouth with a three-generation women's story and poetic imagery; foreign press called Zhou's performance “restrained and inward.”", "es": "El 7 de octubre, “El primer sabor de la soledad”, con Xun Zhou, Meijuan Xi y Shengdi Wang, se estrenó en el 31.º Festival de Busan, la única cinta en chino en competencia, con buena acogida por su historia de tres generaciones y su poética; la prensa llamó a Zhou “contenida y interior”.", "ja": "10月7日、周迅・奚美娟・王聖迪主演『初めての孤独の味』が第31回釜山国際映画祭で世界初上映された。今回のコンペ唯一の中国語長編で、3世代の女性の物語と詩的な映像が好評を博し、周迅の演技は外媒から「抑制的で内省的な」と評された。"}, "why": {"zh": "釜山升格 A 类后主竞赛含金量陡增，周迅继多个影后再冲国际 A 类电影节，华语艺术片出海的成色几何，看这一部。", "en": "After Busan's upgrade to a Category A festival, the main competition carries real weight; as Zhou chases another international A-list honor, this is the Chinese arthouse film to watch.", "es": "Tras el ascenso de Busan a festival A, la competencia pesa; mientras Zhou busca otro galardón A, esta es la cinta china que ver.", "ja": "釜山がA類に格上げされコンペの価値が急増。周迅が再び国際A類映画祭を狙うなか、中国語芸術映画の真価を見る一本だ。"}}, {"idx": "04", "tag": {"zh": "进展"}, "title": {"zh": "《变形计》李勒优与“晋妈”闹僵传闻刷屏，崔晋称将发声明", "en": "“Transformation” star Li Leyou's rift with “city mom” trends; Cui Jin to issue statement", "es": "La pelea de Li Leyou con su “mamá urbana” trendea; Cui Jin emitirá nota", "ja": "『変形計』李勒優と「晋ママ」の確執説がトレンド、崔晋は声明へ"}, "body": {"zh": "《变形计》女主角李勒优被传与城市妈妈“晋妈”闹僵，“晋妈”被指直播中表达不满并停掉零花钱，相关话题冲上多个热搜。李勒优 10 月 5 日回应“关系挺好的，其他不便多谈”；其子崔晋表示有人刻意放大炒作、已影响日常生活，后续将发布声明回应。", "en": "Li Leyou, the lead of “Transformation,” is rumored to have fallen out with her “city mom” Jin Ma, who was said to voice displeasure on livestream and cut off allowance; the topic hit multiple hot searches. On Oct 5 Li said “we're fine, nothing more to say”; her son Cui Jin said some are amplifying the hype and affecting daily life, and will later issue a statement.", "es": "Li Leyou, protagonista de “Transformación”, se rumorea distanciada de su “mamá urbana” Jin Ma, que habría mostrado su malestar en vivo y cortado la mesada; el tema fue tendencia. El 5 de octubre Li dijo “estamos bien, no diré más”; su hijo Cui Jin dijo que algunos exageran y afectan su vida, y emitirá una nota.", "ja": "『変形計』の主人公・李勒優が都市の母「晋ママ」と確執にあると報じられ、晋ママが配信で不満を口にし小遣いを止めたとされ、関連話題が複数の熱検索に。李は10月5日「関係は良い、それ以上は控える」と回答。息子の崔晋は意図的に過熱・日常生活に影響とし、後日声明を出すとした。"}, "why": {"zh": "从“变形计最暖家庭”到疑似决裂，国民综艺的家庭后续最能撩动大众情绪；声明发布前的罗生门阶段，正是热搜发酵的黄金期。", "en": "From “warmest family” to apparent fallout, the reality-show family sequel moves the public most; the Rashomon phase before any statement is prime hot-search fuel.", "es": "De “la familia más cálida” a la aparente ruptura, la secuela del reality conmueve; la fase de “Rashomon” antes de la nota es combustible de tendencias.", "ja": "「変形計で最も温かい家族」からの決裂説。国民的リアリティの家族後日談が大衆の感情を揺さぶる。声明前の羅生門段階が熱検索の好機だ。"}}, {"idx": "05", "tag": {"zh": "进展"}, "title": {"zh": "卡戴珊家族第八季开播：上海取景、全家学中文", "en": "Kardashians season 8 premieres: filmed in   /* ===== UI 文案（与内容分离，四语齐全） ===== */
  var I18N = {
    "zh": {
      "dateSub": "每日简报", "calBtn": "往期日历", "calFoot": "带圆点的日期可查看当日存档",
      "tag": "进展", "why": "看点：", "badge": "精 选",
      "calWeek": ["日", "一", "二", "三", "四", "五", "六"],
      "calTitle": function (y, m) { return y + " 年 " + m + " 月"; }
    },
    "en": {
      "dateSub": "DAILY BRIEFING", "calBtn": "Archive", "calFoot": "Dots mark dates with a saved issue",
      "tag": "UPDATE", "why": "Why: ", "badge": "EDITOR'S PICK",
      "calWeek": ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"],
      "calTitle": function (y, m) { return ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][m-1] + " " + y; }
    },
    "es": {
      "dateSub": "BOLETÍN DIARIO", "calBtn": "Archivo", "calFoot": "Los puntos marcan fechas con ejemplar guardado",
      "tag": "ACTUALIZACIÓN", "why": "Por qué: ", "badge": "DESTACADO",
      "calWeek": ["Dom", "Lun", "Mar", "Mié", "Jue", "Vie", "Sáb"],
      "calTitle": function (y, m) { return m + " · " + y; }
    },
    "ja": {
      "dateSub": "デイリーブリーフィング", "calBtn": "バックナンバー", "calFoot": "点のついた日付は保存された号があります",
      "tag": "続報", "why": "見どころ：", "badge": "特集",
      "calWeek": ["日", "月", "火", "水", "木", "金", "土"],
      "calTitle": function (y, m) { return y + "年" + m + "月"; }
    }
  };
  var LANGS = ["zh", "en", "es", "ja"];
  var LANG_LABEL = { "zh": "中文", "en": "EN", "es": "ES", "ja": "日本語" };
  var LANG_HTML = { "zh": "zh-CN", "en": "en", "es": "es", "ja": "ja" };

  /* ===== 工具 ===== */
  function T(obj, lang) {
    if (obj == null) return "";
    if (typeof obj === "string") return obj;
    if (obj[lang] != null) return obj[lang];
    return obj.zh != null ? obj.zh : "";
  }
  function pad(n) { return n < 10 ? "0" + n : "" + n; }
  function bing(q) { return "https://www.bing.com/search?q=" + encodeURIComponent(q); }
  function fmtDate(d, lang) {
    var y = d.getFullYear(), m = d.getMonth() + 1, day = d.getDate();
    if (lang === "zh") return y + "." + pad(m) + "." + pad(day);
    if (lang === "ja") return y + "年" + m + "月" + day + "日";
    if (lang === "es") return day + " " + ["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"][m-1] + " " + y;
    return ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][m-1] + " " + day + ", " + y;
  }
  function esc(s) {
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }
  function titleHtml(titleObj, hlObj, lang) {
    var title = T(titleObj, lang);
    var hl = T(hlObj, lang);
    var inner = esc(title);
    if (hl && title.indexOf(hl) >= 0) {
      var i = title.indexOf(hl);
      inner = esc(title.slice(0, i)) + '<span class="hl">' + esc(hl) + "</span>" + esc(title.slice(i + hl.length));
    }
    return '<a class="lk" href="' + bing(title) + '" target="_blank" rel="noopener">' + inner + "</a>";
  }

  /* ===== 语言检测：localStorage > 浏览器语言 > 系统时区 > 中文 ===== */
  function detectLang() {
    try { var s = localStorage.getItem("timab_lang"); if (s && LANGS.indexOf(s) >= 0) return s; } catch (e) {}
    var nav = (navigator.language || "").toLowerCase();
    if (/^zh/.test(nav)) return "zh";
    if (/^ja/.test(nav)) return "ja";
    if (/^es/.test(nav)) return "es";
    if (/^en/.test(nav)) return "en";
    var tz = "";
    try { tz = Intl.DateTimeFormat().resolvedOptions().timeZone || ""; } catch (e) {}
    if (/^Asia\/Tokyo/.test(tz)) return "ja";
    if (/Europe\/Madrid|America\/(Mexico_City|Bogota|Lima|Santiago|Caracas|Guatemala|La_Paz|San_Jose|Panama|Asuncion|Montevideo|Havana|El_Salvador|Managua|Tegucigalpa|Costa_Rica|San_Salvador)|America\/Argentina\//.test(tz)) return "es";
    if (/^(Europe|America|Australia)\//.test(tz)) return "en";
    return "zh";
  }

  var curLang = "zh";

  /* ===== 渲染 ===== */
  function renderChrome(lang) {
    var i18n = I18N[lang];
    document.documentElement.lang = LANG_HTML[lang];
    // 报头信息行
    var metaEl = document.getElementById("metaRow");
    if (metaEl) metaEl.textContent = T(BRIEFING.meta, lang);
    // 大日期
    var md = document.getElementById("mastDate");
    if (md) {
      var d = new Date(BRIEFING.date + "T00:00:00");
      md.innerHTML = fmtDate(d, lang) + "<small>" + esc(i18n.dateSub) + "</small>";
    }
    // 文档标题
    var siteName = (lang === "zh") ? "提马早报" : "TIMAB DAILY";
    document.title = siteName + " · " + fmtDate(new Date(BRIEFING.date + "T00:00:00"), lang);
    // 导航签
    var nav = document.getElementById("navChips");
    if (nav) {
      var order = ["pick"].concat(BRIEFING.sections.map(function (s) { return s.key; }));
      nav.innerHTML = "";
      order.forEach(function (key) {
        if (key === "pick") {
          var a = document.createElement("a");
          a.className = "chip-pick"; a.href = "#pick"; a.setAttribute("data-nav", "pick");
          a.textContent = T(BRIEFING.spotlight.badge, lang);
          nav.appendChild(a);
        } else {
          var sec = null;
          BRIEFING.sections.forEach(function (s) { if (s.key === key) sec = s; });
          if (!sec) return;
          var b = document.createElement("a");
          b.href = "#" + key; b.setAttribute("data-nav", key);
          b.style.borderColor = sec.color; b.style.color = sec.deep;
          b.textContent = T(sec.name, lang);
          nav.appendChild(b);
        }
      });
    }
    // 日历文案
    var cb = document.getElementById("calBtnText"); if (cb) cb.textContent = i18n.calBtn;
    var cw = document.getElementById("calWeek");
    if (cw) { cw.innerHTML = ""; i18n.calWeek.forEach(function (w) { var s = document.createElement("span"); s.textContent = w; cw.appendChild(s); }); }
    var cf = document.getElementById("calFoot"); if (cf) cf.textContent = i18n.calFoot;
    // 语言切换器
    var ls = document.getElementById("langSwitch");
    if (ls) {
      ls.innerHTML = "";
      LANGS.forEach(function (l) {
        var btn = document.createElement("button");
        btn.type = "button"; btn.textContent = LANG_LABEL[l]; btn.setAttribute("data-lang", l);
        if (l === curLang) btn.className = "active";
        btn.addEventListener("click", function () { setLang(l); });
        ls.appendChild(btn);
      });
    }
  }

  function renderContent(lang) {
    var i18n = I18N[lang];
    var html = "";
    // 精选
    var sp = BRIEFING.spotlight;
    html += '<section class="spotlight" id="pick">'
      + '<div class="badge"><i></i>' + esc(T(sp.badge, lang)) + "</div>"
      + "<h2>" + titleHtml(sp.title, sp.hl, lang) + "</h2>"
      + '<div class="body">' + esc(T(sp.body, lang)) + "</div>"
      + '<div class="why"><b>' + esc(i18n.why) + "</b>" + esc(T(sp.why, lang)) + "</div>"
      + "</section>";
    // 分类
    html += '<div class="grid">';
    BRIEFING.sections.forEach(function (sec) {
      html += '<section class="card" id="' + sec.key + '" style="--ac:' + sec.color + "; --ac-deep:" + sec.deep + ';">'
        + '<div class="sec-head"><span class="sec-num">' + sec.num + "</span>"
        + "<h3>" + esc(T(sec.name, lang)) + "</h3>"
        + '<span class="en">' + sec.key.toUpperCase() + "</span></div>";
      (sec.items || []).forEach(function (it) {
        html += '<div class="item">';
        html += '<div class="t"><span class="idx">' + it.idx + "</span>";
        if (it.tag) html += '<span class="tag">' + esc(it.tag[lang] != null ? it.tag[lang] : i18n.tag) + "</span>";
        html += titleHtml(it.title, it.hl, lang) + "</div>";
        html += '<div class="d">' + esc(T(it.body, lang)) + "</div>";
        html += '<div class="why"><b>' + esc(i18n.why) + "</b>" + esc(T(it.why, lang)) + "</div>";
        html += "</div>";
      });
      html += "</section>";
    });
    html += "</div>";
    var content = document.getElementById("content");
    if (content) content.innerHTML = html;
    // 页脚
    var risk = document.getElementById("risk");
    if (risk) risk.textContent = T(BRIEFING.risk, lang);
  }

  function setLang(lang) {
    if (LANGS.indexOf(lang) < 0) lang = "zh";
    curLang = lang;
    try { localStorage.setItem("timab_lang", lang); } catch (e) {}
    renderChrome(lang);
    renderContent(lang);
  }

  /* ===== 往期日历（保留原逻辑，文案随语言） ===== */
  function initCalendar() {
    var btn = document.getElementById("calBtn");
    var pop = document.getElementById("calPop");
    var grid = document.getElementById("calGrid");
    var title = document.getElementById("calTitle");
    if (!btn || !pop || !grid || !title) return;

    var parts = BRIEFING.date.split("-");
    var todayKey = parts[0].slice(2) + parts[1] + parts[2];
    var cur = { y: +parts[0], m: +parts[1] };
    var has = {};
    for (var i = 0; i < ARCHIVE_DATES.length; i++) { has[ARCHIVE_DATES[i]] = 1; }
    var HIST_BASE = /\/history\//.test(location.pathname) ? "./" : "history/";

    function ckey(y, m, d) { return String(y).slice(2) + pad(m) + pad(d); }

    function render() {
      var i18n = I18N[curLang];
      title.textContent = i18n.calTitle(cur.y, cur.m);
      grid.innerHTML = "";
      var start = new Date(cur.y, cur.m - 1, 1).getDay();
      var days = new Date(cur.y, cur.m, 0).getDate();
      for (var b = 0; b < start; b++) {
        var blank = document.createElement("span");
        blank.className = "cal-cell is-empty"; grid.appendChild(blank);
      }
      for (var d = 1; d <= days; d++) {
        var k = ckey(cur.y, cur.m, d);
        var cell = document.createElement("span");
        cell.className = "cal-cell" + (has[k] ? " has" : "") + (k === todayKey ? " is-today" : "");
        cell.textContent = d;
        if (has[k]) {
          cell.setAttribute("role", "link"); cell.setAttribute("tabindex", "0");
          cell.title = cur.y + "-" + pad(cur.m) + "-" + pad(d) + " 存档";
          (function (target) {
            var go = function () { window.open(HIST_BASE + target + ".html", "_blank", "noopener"); };
            cell.addEventListener("click", go);
            cell.addEventListener("keydown", function (e) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); go(); } });
          })(k);
        }
        grid.appendChild(cell);
      }
    }
    function toggle(open) {
      pop.hidden = !open;
      btn.setAttribute("aria-expanded", open ? "true" : "false");
      if (open) render();
    }
    btn.addEventListener("click", function (e) { e.stopPropagation(); toggle(pop.hidden); });
    document.getElementById("calPrev").addEventListener("click", function () { cur.m--; if (cur.m < 1) { cur.m = 12; cur.y--; } render(); });
    document.getElementById("calNext").addEventListener("click", function () { cur.m++; if (cur.m > 12) { cur.m = 1; cur.y++; } render(); });
    document.addEventListener("click", function (e) { if (!pop.hidden && !pop.contains(e.target)) toggle(false); });
    document.addEventListener("keydown", function (e) { if (e.key === "Escape" && !pop.hidden) toggle(false); });
  }

  /* ===== 启动 ===== */
  function boot() {
    curLang = detectLang();
    renderChrome(curLang);
    renderContent(curLang);
    initCalendar();
  }
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", boot);
  } else { boot(); }
})();
