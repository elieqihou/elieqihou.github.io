  var ARCHIVE_DATES = [/*__ARCHIVE_DATES__*/"260923", "260924", "260925", "260926", "260927", "260928", "260929", "260930", "261001", "261002", "261003", "261004", "261005", "261006", "261007", "261008", "261009"/*__END__*/];
  var BRIEFING = /*__BRIEFING_DATA__*/{"date": "2026-10-10", "meta": {"zh": "星期六 · 农历九月初一 · timab.cn", "en": "Saturday · Lunar September 1 · timab.cn", "es": "Sábado · 1.er día del noveno mes lunar · timab.cn", "ja": "土曜日 · 農暦九月一日 · timab.cn"}, "spotlight": {"badge": {"zh": "精 选", "en": "SPOTLIGHT", "es": "DESTACADO", "ja": "注 目"}, "title": {"zh": "中选前“不打伊朗”？特朗普松口当天 美军已在排兵3艘航母", "en": "“No strike on Iran” before midterms? The same day Trump softened his stance, the US Navy was already positioning 3 carriers", "es": "¿“No atacar Irán” antes de las legislativas? El mismo día que Trump suavizó su discurso, EE. UU. ya desplegaba 3 portaaviones", "ja": "中間選挙前は「イラン攻撃せず」？トランプ発言の当日、米軍は空母3隻を配置済み"}, "hl": {"zh": "不打伊朗", "en": "no strike on Iran", "es": "no atacar Irán", "ja": "攻撃せず"}, "body": {"zh": "特朗普8日称11月3日中期选举前不会攻击伊朗，称与伊方“富有成效的讨论”；但《纽约时报》披露五角大楼已奉命制定对伊大规模作战方案，3艘航空母舰将集结中东。与此同时，普京与伊朗总统佩泽希齐扬会晤，称中东冲突“错不在伊朗”、俄愿加强能源与贸易合作；伊朗革命卫队则称打击“违规船只”范围不再限于霍尔木兹海峡，并已击中一艘液化石油气运输船。航运机构Kpler数据显示，海峡目前仍开放但日均通行船只较战前腰斩。", "en": "On the 8th, Trump said the US would not attack Iran before the November 3 midterm elections, citing “productive discussions” with Tehran; yet The New York Times revealed the Pentagon has been ordered to draft a large-scale war plan against Iran, with 3 aircraft carriers to mass in the Middle East. Meanwhile, Putin met Iranian President Pezeshkian, saying the Middle East conflict is “not Iran’s fault” and that Russia is willing to deepen energy and trade cooperation; Iran’s Revolutionary Guard declared that strikes on “violating vessels” are no longer limited to the Strait of Hormuz, and has already hit an LPG tanker. Shipping tracker Kpler says the strait remains open, but daily transits have halved from pre-war levels.", "es": "El día 8, Trump dijo que EE. UU. no atacará Irán antes de las legislativas del 3 de noviembre, citando “conversaciones fructíferas” con Teherán; sin embargo, The New York Times reveló que el Pentágono recibió la orden de elaborar un plan de guerra a gran escala contra Irán, con 3 portaaviones que se concentrarán en Oriente Medio. Paralelamente, Putin se reunió con el presidente iraní Pezeshkian, afirmó que el conflicto en Oriente Medio “no es culpa de Irán” y que Rusia está dispuesta a reforzar la cooperación energética y comercial; la Guardia Revolucionaria iraní declaró que sus ataques a “buques infractores” ya no se limitan al estrecho de Ormuz, y ya alcanzó un buque de gas licuado. Según la agencia marítima Kpler, el estrecho sigue abierto, pero los tránsitos diarios se han reducido a la mitad respecto a los niveles previos a la guerra.", "ja": "トランプ氏は8日、11月3日の中間選挙まではイランを攻撃しないと述べ、イラン側との「実りある協議」に言及。しかしニューヨーク・タイムズは、ペンタゴンがイランへの大規模作戦計画の策定を命じられ、空母3隻が中東に集結すると報じた。一方、プーチン氏はイランのペゼシキアン大統領と会談し、中東紛争について「イランに落ち度はない」と述べ、エネルギーと貿易の協力強化に前向きな姿勢を示した。イラン革命防衛隊は「違反船舶」への打撃がホルムズ海峡に限定されないと声明し、すでにLPG運搬船1隻に命中させた。海運分析会社Kplerによると、海峡は現在も開放されているが、1日あたりの通行船舶数は開戦前の半分に減っている。"}, "why": {"zh": "战争与选举的拉扯，直接牵动霍尔木兹通航与全球油价——布伦特仍在每桶104美元高位，中期选举前的不确定性成为最大变量。", "en": "The tug-of-war between war and elections directly affects Hormuz shipping and global oil prices — Brent remains near $104 a barrel, and pre-midterm uncertainty is now the biggest variable.", "es": "El tira y afloja entre guerra y elecciones afecta directamente la navegación por Ormuz y los precios globales del petróleo — el Brent sigue cerca de 104 dólares por barril, y la incertidumbre preelectoral es ya la mayor variable.", "ja": "戦争と選挙の綱引きが、ホルムズ海峡の航行と世界の原油価格を直撃する——ブレント原油は1バール104ドルの高水準にあり、中間選挙前の不確実性が最大の変数となっている。"}}, "sections": [{"key": "intl", "num": "01", "color": "#1d4ed8", "deep": "#1e3fa8", "name": {"zh": "国际时事", "en": "World", "es": "Internacional", "ja": "国際"}, "items": [{"idx": "01", "tag": {"zh": "进展"}, "title": {"zh": "特朗普称中选前不攻伊朗 美军却密拟3航母对伊作战方案", "en": "Trump says no strike on Iran before midterms — yet the Pentagon is secretly drafting a 3-carrier war plan", "es": "Trump dice que no atacará Irán antes de las legislativas, pero el Pentágono trama en secreto un plan con 3 portaaviones", "ja": "トランプ氏「中間選挙前は攻撃せず」 米軍は極秘に空母3隻の対イラン作戦案を策定"}, "body": {"zh": "特朗普8日突然宣称11月3日国会中期选举前不会攻击伊朗，称与伊“富有成效的讨论”；但多家美媒引述军方高官称，白宫已要求五角大楼制定对伊大规模打击方案，3艘航母将同时部署中东，打击目标含无人机基地、导弹库与指挥所。分析认为这是“两手准备”：既向选民展示止战降油价，又避免显得软弱。", "en": "On the 8th Trump abruptly declared that the US would not attack Iran before the November 3 midterms, citing “productive discussions”; yet multiple US media outlets, citing senior military officials, report the White House has ordered the Pentagon to draft a large-scale strike plan — 3 carriers to deploy simultaneously in the Middle East, with targets including drone bases, missile depots and command posts. Analysts call it a two-track play: showing voters a de-escalation that lowers oil prices while avoiding the look of weakness.", "es": "El día 8 Trump declaró de improviso que EE. UU. no atacará Irán antes de las legislativas del 3 de noviembre, citando “conversaciones fructíferas”; pero varios medios estadounidenses, citando altos mandos militares, informan que la Casa Blanca ordenó al Pentágono elaborar un plan de ataques a gran escala: 3 portaaviones se desplegarán a la vez en Oriente Medio, con objetivos que incluyen bases de drones, depósitos de misiles y puestos de mando. Los analistas lo ven como una jugada a dos bandas: mostrar a los votantes una desescalada que abarate el crudo sin aparentar debilidad.", "ja": "トランプ氏は8日、11月3日の中間選挙前はイランを攻撃しないと突如表明し、「実りある協議」に言及。しかし米メディア複数が軍高官の話として、ホワイトハウスがペンタゴンに大規模攻撃計画の策定を指示し、空母3隻を中東へ同時展開、標的には無人機基地、ミサイル庫、指揮所が含まれると報じた。分析では「二段構え」——有権者には戦争停止と油価低下を演出しつつ、軟弱に見えることは避ける——と見られる。"}, "why": {"zh": "将国家安全与国内选举绑定在美国政治中极罕见，油价与中期选情被一并押上牌桌。", "en": "Binding national security to domestic elections is rare in US politics — oil prices and the midterm race are now wagered on the same table.", "es": "Vincular la seguridad nacional a las elecciones internas es rarísimo en la política de EE. UU. — el precio del crudo y la contienda legislativa quedan apostados en la misma mesa.", "ja": "国家安全保障を国内選挙に結びつけるのは米政治でも極めて異例。原油価格と中間選挙の行方が、ひとつの賭けにまとめて乗せられた。"}}, {"idx": "02", "tag": {"zh": "进展"}, "title": {"zh": "普京会晤伊朗总统：中东冲突错不在伊朗 俄愿加强合作", "en": "Putin meets Iran’s president: the Middle East conflict is not Iran’s fault, Russia willing to deepen cooperation", "es": "Putin se reúne con el presidente iraní: el conflicto de Oriente Medio no es culpa de Irán, Rusia dispuesta a reforzar la cooperación", "ja": "プーチン氏がイラン大統領と会談 中東紛争は「イランに落ち度なし」 協力強化へ前向き"}, "body": {"zh": "普京8日在土库曼斯坦会见伊朗总统佩泽希齐扬，称中东爆发冲突并非伊朗过错，俄愿协助通过外交渠道解决危机；双方同意加强能源、农业、交通与贸易合作。伊朗方面重申“不会离开谈判桌”，并称已对美方提案作出修改，意在结束冲突、维护自身权利。", "en": "Putin met Iranian President Pezeshkian in Turkmenistan on the 8th, saying the outbreak of the Middle East conflict was not Iran’s fault and that Russia is ready to help resolve the crisis through diplomatic channels; the two sides agreed to strengthen cooperation in energy, agriculture, transport and trade. Iran reiterated it “will not leave the negotiating table” and said it has revised the US proposal, aiming to end the conflict and defend its rights.", "es": "Putin se reunió el día 8 con el presidente iraní Pezeshkian en Turkmenistán, afirmó que el estallido del conflicto en Oriente Medio no fue culpa de Irán y que Rusia está lista para ayudar a resolver la crisis por vías diplomáticas; ambas partes acordaron reforzar la cooperación en energía, agricultura, transporte y comercio. Irán reiteró que “no abandonará la mesa de negociaciones” y dijo haber introducido modificaciones en la propuesta estadounidense, con la intención de poner fin al conflicto y defender sus derechos.", "ja": "プーチン氏は8日、トルクメニスタンでイランのペゼシキアン大統領と会談し、中東紛争の勃発はイランの落ち度ではないと述べ、外交ルートでの危機解決に協力する用意があると表明。双方はエネルギー、農業、交通、貿易の協力強化で合意した。イラン側は「交渉の席を去らない」と改めて強調し、紛争終結と自国の権利擁護を目指して米国案に修正を加えたと説明した。"}, "why": {"zh": "俄伊走近为美伊谈判增添新变量，能源与地缘格局或被重新搅动。", "en": "A closer Russia–Iran axis adds a new variable to US–Iran talks and may reshuffle the energy and geopolitical landscape.", "es": "Un acercamiento Rusia–Irán añade una nueva variable a las conversaciones EE. UU.–Irán y podría reconfigurar el tablero energético y geopolítico.", "ja": "露伊の接近は米伊交渉に新たな変数を加え、エネルギーと地政学の構図が塗り替えられる可能性がある。"}}, {"idx": "03", "tag": {"zh": "进展"}, "title": {"zh": "霍尔木兹仍开放但风险极高 伊朗扩打击范围击中LPG船", "en": "Strait of Hormuz still open but high-risk; Iran widens strike range and hits an LPG tanker", "es": "El estrecho de Ormuz sigue abierto pero con riesgo extremo; Irán amplía su radio de ataque y alcanza un buque de GLP", "ja": "ホルムズ海峡は開放も極めて危険 イランが攻撃範囲を拡大しLPG船に命中"}, "body": {"zh": "航运数据机构Kpler称，霍尔木兹海峡目前日均至少有10艘商业油轮与干散货船通过，较此前十天日均超20艘明显腰斩，状态为“仍开放但极高风险通航”。伊朗革命卫队声明，打击“违规船只”的范围不再限于霍尔木兹，已击中一艘名为“阳光号”的液化石油气运输船。", "en": "Shipping-data firm Kpler says the Strait of Hormuz is now seeing at least 10 commercial tankers and dry-bulk carriers a day, sharply down from over 20 a day in the previous ten days — a status of “still open but extremely high-risk transit.” Iran’s Revolutionary Guard declared that strikes on “violating vessels” are no longer limited to Hormuz and that it has hit an LPG tanker named Sunshine.", "es": "La empresa de datos marítimos Kpler señala que por el estrecho de Ormuz pasan ahora al menos 10 petroleros comerciales y graneleros al día, menos de la mitad que los más de 20 diarios de los diez días previos — un estado de “aún abierto pero con tránsito de riesgo extremo”. La Guardia Revolucionaria iraní declaró que sus ataques a “buques infractores” ya no se limitan a Ormuz y que ha alcanzado un buque de GLP llamado Sunshine.", "ja": "海運データ会社Kplerによると、ホルムズ海峡では現在、商用タンカー・ばら積み船あわせて1日最低10隻が通行しており、直近10日の平均20隻超から大幅に減少。「開放は続くが極めて危険な通航」という状況だ。イラン革命防衛隊は「違反船舶」への打撃範囲がホルムズに限られないと声明し、Sunshine号と呼ばれるLPG運搬船1隻に命中させたと明らかにした。"}, "why": {"zh": "全球约五分之一海运原油经此而过，通航量腰斩直接支撑高油价。", "en": "About a fifth of the world’s seaborne crude passes through here; halved traffic directly props up high oil prices.", "es": "Cerca de un quinto del crudo marítimo mundial pasa por aquí; el tránsito reducido a la mitad sostiene directamente los precios altos.", "ja": "世界の海運原油の約5分の1がここを通る。通行量の半減が原油高を直接下支えしている。"}}, {"idx": "04", "tag": {"zh": "进展"}, "title": {"zh": "沙特联军摧毁胡塞136处目标 萨那再遭空袭 机场遇袭3死", "en": "Saudi-led coalition destroys 136 Houthi targets; Sanaa hit again, airport attack kills 3", "es": "La coalición liderada por Arabia Saudita destruye 136 objetivos hutíes; Sanaá vuelve a ser atacada y el aeropuerto registra 3 muertos", "ja": "サウジ主導の連合軍がフーシ派136カ所を破壊 サナア再び空襲 空港襲撃で3人死亡"}, "body": {"zh": "沙特主导的多国联军9日晚称，已摧毁也门胡塞武装控制区内136处军事目标，并全天候为也门政府军提供空中支援；同日胡塞控制的萨那再度传出爆炸声。沙特民航总局称，利雅得哈立德国王国际机场8日两度遭袭，造成3名沙特公民死亡。面对持续袭击，沙特正寻求土耳其、叙利亚等国防务支持，美国则只承诺情报与定位支持。", "en": "The Saudi-led coalition said on the evening of the 9th it has destroyed 136 military targets in Houthi-controlled Yemen and is providing round-the-clock air support to Yemeni government forces; explosions rang out again the same day in Houthi-held Sanaa. Saudi aviation authorities said Riyadh’s King Khalid International Airport was attacked twice on the 8th, killing 3 Saudi citizens. Facing sustained attacks, Riyadh is seeking defense support from Turkey, Syria and others, while Washington has only pledged intelligence and targeting support.", "es": "La coalición multinacional liderada por Arabia Saudita informó la noche del día 9 que ha destruido 136 objetivos militares en zonas hutíes de Yemen y brinda apoyo aéreo ininterrumpido a las fuerzas gubernamentales yemeníes; ese mismo día se oyeron de nuevo explosiones en Saná, en manos hutíes. La aviación civil saudí indicó que el aeropuerto internacional Rey Jalid de Riad fue atacado dos veces el día 8, con 3 ciudadanos saudíes muertos. Ante los ataques sostenidos, Riad busca apoyo defensivo de Turquía, Siria y otros, mientras EE. UU. solo promete inteligencia y designación de objetivos.", "ja": "サウジアラビア主導の多国籍連合軍は9日夜、イエメンのフーシ派支配地域の軍事目標136カ所を破壊し、イエメン政府軍へ24時間体制で航空支援を提供すると発表した。同日、フーシ派支配下のサナアでも再び爆発音が響いた。サウジ民間航空当局によると、リヤドのキング・ハーリド国際空港が8日に2回襲撃され、サウジ国籍の3人が死亡した。継続する襲撃に対し、サウジはトルコやシリアなどに防衛支援を求めており、米国は情報・目標特定支援のみを約束している。"}, "why": {"zh": "“麦加共同防务联盟”迎来首次真正检验，也门战线有外溢为地区多国冲突的风险。", "en": "The “Mecca joint defense alliance” faces its first real test, and the Yemeni front risks spilling over into a multi-country regional conflict.", "es": "La “alianza conjunta de defensa de La Meca” enfrenta su primera prueba real, y el frente yemení corre riesgo de desbordarse hacia un conflicto multilateral en la región.", "ja": "「メッカ共同防衛連合」が初の本格的な試練を迎え、イエメン戦線が地域多国間紛争へ波及するリスクがある。"}}, {"idx": "05", "title": {"zh": "巴拿马发生7.6级强震 多次余震 国际机场关闭 美发海啸预警", "en": "Magnitude-7.6 quake strikes Panama; repeated aftershocks, international airport closed, US issues tsunami alert", "es": "Terremoto de magnitud 7,6 sacude Panamá; réplicas múltiples, aeropuerto internacional cerrado y alerta de tsunami de EE. UU.", "ja": "パナマでマグニチュード7.6の強い地震 余震多数 国際空港閉鎖 米国が津波警報"}, "body": {"zh": "北京时间10日1时56分，巴拿马发生7.6级地震，震源深度10千米，随后发生多次5级以上余震，最大国际机场临时关闭，美国发布海啸预警。截至目前，驻巴中资机构及当地华侨华人无人员伤亡报告。", "en": "At 1:56 a.m. Beijing time on the 10th, a magnitude-7.6 earthquake struck Panama at a depth of 10 km, followed by multiple aftershocks above magnitude 5; the largest international airport was temporarily closed and the US issued a tsunami warning. So far, Chinese institutions and overseas Chinese in Panama have reported no casualties.", "es": "A la 1:56 de la madrugada del día 10, hora de Pekín, un terremoto de magnitud 7,6 sacudió Panamá a 10 km de profundidad, seguido de múltiples réplicas de magnitud superior a 5; el principal aeropuerto internacional cerró temporalmente y EE. UU. emitió una alerta de tsunami. Hasta ahora, las instituciones chinas y la comunidad china en Panamá no han reportado víctimas.", "ja": "北京時間10日午前1時56分、パナマでマグニチュード7.6の地震が発生（震源の深さ10キロ）。その後マグニチュード5超の余震が相次ぎ、最大の国際空港が臨時閉鎖され、米国は津波警報を発表した。これまでのところ、現地の中国系機関や華僑・華人に人的被害の報告はない。"}, "why": {"zh": "中美洲关键航运与运河枢纽突发强震，后续余震与海啸风险牵动区域物流。", "en": "A sudden strong quake at a key Central American shipping and canal hub; aftershocks and tsunami risk weigh on regional logistics.", "es": "Un fuerte sismo repentino en un nodo clave de navegación y canal de Centroamérica; réplicas y riesgo de tsunami preocupan a la logística regional.", "ja": "中米の主要海運・運河ハブで突発の強い地震。今後の余震と津波リスクが地域の物流を左右する。"}}]}, {"key": "dom", "num": "02", "color": "#cf2f1e", "deep": "#a02315", "name": {"zh": "国内要闻", "en": "China", "es": "Nacional", "ja": "国内"}, "items": [{"idx": "01", "title": {"zh": "《关于发展新质生产力的意见》印发 五方面19项举措划定红线", "en": "China issues “Opinions on Developing New Quality Productive Forces” — 19 measures in 5 areas draw red lines", "es": "China emite las “Opiniones sobre el desarrollo de las nuevas fuerzas productivas de calidad” — 19 medidas en 5 ámbitos trazan líneas rojas", "ja": "「新質生産力発展に関する意見」を公布 5分野19項目でレッドライン設定"}, "body": {"zh": "中共中央、国务院9日印发《关于发展新质生产力的意见》，围绕科技创新、产业创新、发展方式创新、体制机制创新、人才工作机制创新五方面提出19项重点举措，明确全面实施“人工智能+”行动、积极推进能源革命，并首次强调“严禁借发展新质生产力之名搞恶性招商引资、盲目跟风上项目、乱烧钱”，避免“内卷式”竞争。", "en": "The CPC Central Committee and the State Council issued the “Opinions on Developing New Quality Productive Forces” on the 9th, proposing 19 key measures across technological innovation, industrial innovation, new development models, institutional reform and talent mechanisms; they call for fully implementing the “AI+” initiative and advancing the energy revolution, and for the first time stress “strictly forbidding vicious investment-bidding competition, blind copycat projects and reckless spending in the name of new quality productive forces,” to curb “involution-style” competition.", "es": "El Comité Central del PCCh y el Consejo de Estado emitieron el día 9 las “Opiniones sobre el desarrollo de las nuevas fuerzas productivas de calidad”, con 19 medidas clave en cinco ámbitos — innovación tecnológica, innovación industrial, renovación del modelo de desarrollo, innovación institucional y de mecanismos, y renovación de los mecanismos de talento —; ordenan aplicar plenamente la iniciativa “IA+” e impulsar la revolución energética, y subrayan por primera vez “prohibir terminantemente, bajo el nombre de las nuevas fuerzas productivas, la competencia despiadada por inversiones, los proyectos seguidistas a ciegas y el gasto indiscriminado”, para evitar la competencia de “involución”.", "ja": "中国共産党中央委員会と国務院は9日、「新質生産力の発展に関する意見」を公布し、科学技術イノベーション、産業イノベーション、発展方式の革新、体制・メカニズムの革新、人材仕事メカニズムの革新の5分野で19の重点措置を提示。「人工知能＋」行動の全面的実施とエネルギー革命の推進を明確にするとともに、「新質生産力の名を借りた悪質な投資誘致合戦、場当たり的なプロジェクト乱立、無駄遣いの厳禁」を初めて強調し、内巻き競争の回避を図るとしている。"}, "why": {"zh": "顶层设计为新兴产业与未来产业划定边界，纠偏“一哄而上”与产业空心化隐患。", "en": "Top-level design sets boundaries for emerging and future industries, correcting both herd-style rushes and hollowing-out risks.", "es": "El diseño de máximo nivel fija límites a las industrias emergentes y futuras, corrigiendo tanto los arranques de manada como el riesgo de vaciamiento industrial.", "ja": "トップレベルデザインが新興・未来産業の境界線を引き、一斉に飛びつく動きや産業空洞化のリスクを是正する。"}}, {"idx": "02", "title": {"zh": "财政部安排5500亿地方政府债务结存限额 保基层扩投资", "en": "Finance Ministry allocates 550 billion yuan of unused local debt quota to shore up grassroots and investment", "es": "El Ministerio de Finanzas asigna 550.000 millones de yuanes del límite remanente de deuda local para sostener las bases y ampliar la inversión", "ja": "財政部、地方債務の未使用枠5500億元を手配 基層の財政と投資拡大を支援"}, "body": {"zh": "财政部近日安排使用地方政府债务结存限额5500亿元，其中3000亿元一般债务结存限额全部分配县区，用于提高基层一般公共预算保障能力；2500亿元专项债务结存限额分配给有实际项目资金需求地区，并向经济大省倾斜，支持扩大有效投资。", "en": "The Ministry of Finance recently allocated 550 billion yuan of unused local government debt quota: 300 billion yuan of general-debt quota goes entirely to counties and districts to strengthen grassroots budget capacity, while 250 billion yuan of special-debt quota goes to regions with real project funding needs, tilting toward major economic provinces to support effective investment.", "es": "El Ministerio de Finanzas asignó recientemente 550.000 millones de yuanes del límite de deuda local sin usar: 300.000 millones de cuota de deuda general se destinan íntegramente a condados y distritos para reforzar la capacidad presupuestaria de base, y 250.000 millones de cuota de deuda especial van a regiones con necesidades reales de financiación de proyectos, con sesgo hacia las grandes provincias económicas, para apoyar la inversión efectiva.", "ja": "財政部はこのほど、地方政府債務の未使用枠5500億元の使用を手配した。うち一般債務枠3000億元はすべて県・区に配分して基層の一般公共予算の保障能力を高め、特別債務枠2500億元は実際にプロジェクト資金需要のある地域に配分し、経済大省へ傾斜させて有効投資の拡大を支える。"}, "why": {"zh": "年内第五次盘活结存限额，为四季度GDP与基层财政平稳运行加注底气。", "en": "The fifth activation of unused quota this year, underpinning Q4 GDP and stable grassroots finances.", "es": "La quinta activación del límite remanente en el año, dando respaldo al PIB del cuarto trimestre y a unas finanzas de base estables.", "ja": "年内5回目の未使用枠の活用であり、第4四半期のGDPと基層財政の安定運営に弾みをつける。"}}, {"idx": "03", "title": {"zh": "我国成功发射卫星互联网低轨27组卫星 长征十二号一箭升空", "en": "China launches 27 groups of low-orbit satellite internet satellites aboard a Long March 12", "es": "China lanza con éxito 27 grupos de satélites de internet en órbita baja a bordo de un Larga Marcha 12", "ja": "中国、衛星インターネット低軌道27群の衛星を打ち上げ成功 長征十二号で打ち上げ"}, "body": {"zh": "10月10日3时27分，我国在海南商业航天发射场使用长征十二号运载火箭，成功将卫星互联网低轨27组卫星发射升空，卫星顺利进入预定轨道，发射任务获得圆满成功。", "en": "At 3:27 a.m. on October 10, China launched 27 groups of low-orbit satellite internet satellites from the Hainan commercial spaceport using a Long March 12 rocket; all satellites entered their planned orbits and the mission was a complete success.", "es": "A las 3:27 del 10 de octubre, China lanzó desde el puerto espacial comercial de Hainan, con un cohete Larga Marcha 12, 27 grupos de satélites de internet en órbita baja; los satélites entraron con éxito en sus órbitas previstas y la misión fue un éxito completo.", "ja": "10月10日午前3時27分、中国は海南商業航天発射場から長征十二号ロケットを使用し、衛星インターネット低軌道27群の衛星を打ち上げた。衛星は予定軌道に順調に入り、打ち上げ任務は完全な成功を収めた。"}, "why": {"zh": "低轨星座组网再下一城，商业航天发射能力持续兑现。", "en": "Another gain for low-orbit constellation networking as commercial launch capability keeps delivering.", "es": "Otro paso para la constelación de órbita baja; la capacidad comercial de lanzamiento sigue cumpliendo.", "ja": "低軌道コンステレーションの構築がまた一歩前進し、商業打ち上げ能力が継続的に実を結んでいる。"}}, {"idx": "04", "tag": {"zh": "进展"}, "title": {"zh": "国庆7天国内出游8.26亿人次 总花费7383.75亿元", "en": "826 million domestic trips and 738.4 billion yuan spent in the 7-day National Day holiday", "es": "826 millones de viajes internos y 738.375 millones de yuanes de gasto en los 7 días del Día Nacional", "ja": "国慶節7日間で国内旅行延べ8.26億人 総支出7383.75億元"}, "body": {"zh": "经文化和旅游部数据中心测算，国庆节假期7天全国国内出游8.26亿人次，国内出游总花费7383.75亿元，按可比口径日均同比2025年分别增长6.3%和4.3%；9月23日至10月8日16天中秋国庆假期，全国铁路累计发送旅客3.02亿人次。", "en": "According to the Ministry of Culture and Tourism’s data center, 826 million domestic trips were made and 738.375 billion yuan spent during the 7-day National Day holiday, up 6.3% and 4.3% year-on-year on a comparable basis; over the 16-day Mid-Autumn and National Day span from Sept 23 to Oct 8, railways carried a cumulative 302 million passengers.", "es": "Según el centro de datos del Ministerio de Cultura y Turismo, durante los 7 días del feriado del Día Nacional se realizaron 826 millones de viajes internos con un gasto total de 738.375 millones de yuanes, con aumentos interanuales del 6,3% y 4,3% en términos comparables; del 23 de septiembre al 8 de octubre, en los 16 días del doble festivo de Medio Otoño y Día Nacional, los ferrocarriles transportaron un acumulado de 302 millones de pasajeros.", "ja": "文化・観光部データセンターの測算によると、国慶節休暇7日間の国内旅行は延べ8.26億人、総支出は7383.75億元で、比較可能なベースで前年同期比それぞれ6.3%増、4.3%増。9月23日から10月8日までの中秋・国慶節16日間で、全国の鉄道は累計3.02億人の旅客を輸送した。"}, "why": {"zh": "出行与消费韧性尽显，服务消费成为假期经济主引擎。", "en": "Travel and consumption resilience on full display, with services consumption as the holiday economy’s main engine.", "es": "Resiliencia plena en viajes y consumo; el consumo de servicios es el principal motor de la economía festiva.", "ja": "移動と消費の靭性が全面に示され、サービス消費が祝日経済の主エンジンとなっている。"}}, {"idx": "05", "title": {"zh": "超强厄尔尼诺事件正式形成 新一股冷空气将影响我国", "en": "A super-strong El Niño officially forms; a new cold wave will sweep China", "es": "Se forma oficialmente un El Niño súper fuerte; una nueva masa de aire frío afectará a China", "ja": "超強力エルニーニョ現象が正式に成立 新たな寒気団が中国へ影響"}, "body": {"zh": "国家气候中心确认，今年9月关键区海温增暖持续，已正式形成一次超强厄尔尼诺事件；中央气象台预报，新一股冷空气将影响我国，带来大风降温。此前多家机构曾预警本轮厄尔尼诺或达历史最强。", "en": "The National Climate Center confirmed that warming sea temperatures in the key region persisted through September, officially forming a super-strong El Niño event; the Central Meteorological Observatory forecasts a new cold air mass will bring gales and falling temperatures. Several institutions had earlier warned this El Niño could be the strongest on record.", "es": "El Centro Nacional de Clima confirmó que el calentamiento de la temperatura del mar en la región clave continuó en septiembre, formando oficialmente un episodio de El Niño súper fuerte; el Observatorio Meteorológico Central prevé que una nueva masa de aire frío traerá vientos fuertes y descensos de temperatura. Varios organismos habían advertido antes de que este El Niño podría ser el más fuerte de la historia.", "ja": "国家気候センターが確認したところ、9月に主要海域の海面水温上昇が持続し、超強力エルニーニョ現象が正式に成立した。中央気象台は新たな寒気団が中国に影響を与え、強風と低温をもたらすと予報。複数の機関は以前から、今回のエルニーニョは史上最強になる可能性があると警告していた。"}, "why": {"zh": "极端气候背景叠加冷空气，秋冬能源、农业与防灾预案需提前绸缪。", "en": "Extreme climate backdrop plus incoming cold air: energy, agriculture and disaster plans for autumn–winter need early preparation.", "es": "Contexto climático extremo más aire frío entrante: energía, agricultura y planes de prevención otoño-invierno requieren preparación anticipada.", "ja": "極端な気候を背景に寒気も重なり、秋冬のエネルギー・農業・防災の備えを前もって整える必要がある。"}}]}, {"key": "fin", "num": "03", "color": "#b45309", "deep": "#8a3f06", "name": {"zh": "金融要闻", "en": "Finance", "es": "Finanzas", "ja": "金融"}, "items": [{"idx": "01", "tag": {"zh": "进展"}, "title": {"zh": "A股节后首日深V翻红 沪指3813.79涨0.05% 成交1.92万亿", "en": "A-shares stage deep-V rebound after the holiday: Shanghai at 3813.79, up 0.05%, turnover 1.92 trillion yuan", "es": "Las acciones A repuntan en “V profunda” tras el festivo: Shanghái en 3813,79, +0,05%, con 1,92 billones de yuanes negociados", "ja": "A株は連休明けに深いV字回復 上海総合3813.79・+0.05% 出来高1.92兆元"}, "body": {"zh": "10月9日A股走出“深V”反弹：早盘低开下挫，创业板指盘中创年内新低2932.80点，午后资金回流全线翻红。截至收盘，上证指数报3813.79点涨0.05%，深证成指涨0.17%，创业板指涨0.22%，沪深京三市成交额增至1.92万亿元；节后两个交易日沪指累计仍跌0.74%。盘面上AI语料、传媒爆发，PCB与电子元件领跌。", "en": "On October 9 A-shares staged a deep-V rebound: a weak open slid lower with ChiNext hitting a year-low of 2932.80 intraday before funds flowed back and everything turned green. At the close, the Shanghai Composite was at 3813.79, up 0.05%, Shenzhen up 0.17%, ChiNext up 0.22%, with turnover across the Shanghai, Shenzhen and Beijing markets rising to 1.92 trillion yuan; over the two post-holiday sessions the Shanghai index is still down 0.74%. AI data-corpus and media stocks surged while PCBs and electronic components led declines.", "es": "El 9 de octubre las acciones A trazaron una “V profunda”: apertura a la baja con el ChiNext marcando un mínimo anual de 2932,80 intradía, antes de que el capital regresara y todo se pintara de verde. Al cierre, el índice compuesto de Shanghái cerró en 3813,79 (+0,05%), Shenzhen +0,17%, ChiNext +0,22%, y la facturación en Shanghái, Shenzhen y Pekín subió a 1,92 billones de yuanes; en las dos sesiones posteriores al festivo el índice de Shanghái acumula aún −0,74%. Los datos para IA y los medios se dispararon, mientras PCB y componentes electrónicos lideraron las caídas.", "ja": "10月9日、A株は「深いV字」反発を演じた。寄り付き後に下落し、創業板指数は引けにかけて年初来安値の2932.80を付けたが、午後に入ると資金が戻り全体で反発して引けた。終値で上海総合は3813.79（+0.05%）、深圳成分は+0.17%、創業板は+0.22%。滬深京3市場の出来高は1.92兆元に拡大。連休明け2営業日の累計では上海指数はまだ0.74%安。業種別ではAIコーパス・メディアが急騰し、PCBと電子部品が下落をけん引した。"}, "why": {"zh": "恐慌释放后阶段触底信号初现，但量能与科技线企稳仍待确认。", "en": "Early bottoming signals after panic selling, though volume and tech-line stabilization remain unconfirmed.", "es": "Primeras señales de suelo tras el pánico, aunque el volumen y la estabilización de la línea tecnológica aún deben confirmarse.", "ja": "パニック売り後の一段底打ちシグナルが初現したが、出来高とテクノロジー株の持ち直しは依然確認待ち。"}}, {"idx": "02", "tag": {"zh": "进展"}, "title": {"zh": "美股周五齐涨 标普7811.54涨0.59% 中概金龙指数涨2.69%", "en": "US stocks rise in tandem Friday: S&P 500 at 7811.54 (+0.59%), China Golden Dragon index +2.69%", "es": "Wall Street cierra al alza el viernes: S&P 500 en 7811,54 (+0,59%) y el índice Dragón Dorado de China +2,69%", "ja": "米国株は金曜にそろって上昇 S&P500は7811.54（+0.59%） 中国金龍指数+2.69%"}, "body": {"zh": "美股周五集体收涨，标普500涨0.59%报7811.54点，纳指涨0.64%报27366.17点，道指涨0.83%报51654.95点；热门中概股普涨，纳斯达克中国金龙指数涨2.69%，金山云、理想、阿里、蔚来等涨超5%。此前一交易日美股曾因AI叙事松动收跌。", "en": "US stocks closed higher across the board Friday: S&P 500 +0.59% at 7811.54, Nasdaq +0.64% at 27366.17, Dow +0.83% at 51654.95; popular Chinese ADRs broadly rose, with the Nasdaq China Golden Dragon index up 2.69% and Kingsoft Cloud, Li Auto, Alibaba and NIO up more than 5%. US stocks had closed lower the previous session as the AI narrative wobbled.", "es": "Wall Street cerró al alza el viernes: S&P 500 +0,59% a 7811,54, Nasdaq +0,64% a 27366,17, Dow +0,83% a 51654,95; los valores chinos más seguidos subieron de forma generalizada, con el índice Dragón Dorado del Nasdaq +2,69% y Kingsoft Cloud, Li Auto, Alibaba y NIO con alzas superiores al 5%. La sesión anterior la bolsa estadounidense había cerrado a la baja por el tambaleo de la narrativa de IA.", "ja": "米国市場は金曜にそろって続伸し、S&P500は+0.59%の7811.54、ナスダックは+0.64%の27366.17、ダウは+0.83%の51654.95で引けた。人気中国株は総じて上昇し、ナスダック中国金龍指数は+2.69%、金山クラウド、理想汽車、アリババ、NIOなどは5%超の上げ。前日はAI人気の揺らぎで下げていた。"}, "why": {"zh": "外围回暖提振风险偏好，中国资产成为资金回流首选方向之一。", "en": "External rebound lifts risk appetite, with Chinese assets a top destination for returning capital.", "es": "La recuperación externa reaviva el apetito por el riesgo; los activos chinos son uno de los destinos preferidos del capital que regresa.", "ja": "海外市場の回復がリスク選好を高め、中国資産が資金還流の有力な行き先の一つとなっている。"}}, {"idx": "03", "tag": {"zh": "进展"}, "title": {"zh": "油价回落企稳 特朗普称俄将供数百万/吨柴油压低油价", "en": "Oil steadies after pullback; Trump says Russia will supply millions of tons of diesel to push prices down", "es": "El crudo se estabiliza tras retroceder; Trump dice que Rusia suministrará millones de toneladas de diésel para abaratarlo", "ja": "原油価格は下落後に持ち直し トランプ氏「ロシアが数百万トンの軽油を供給し価格を抑える」"}, "body": {"zh": "国际油价自高位回落企稳：布伦特12月期货收报104.43至104.72美元/桶，WTI报91.66美元/桶。特朗普称俄罗斯将立即向美国及全球市场供应超30万吨柴油，11月增至50万吨、12月达100万吨，并视炼厂情况短期再供300万吨，意在压低柴油价格；沙特阿美亦宣布11月恢复对欧洲客户足额供油。", "en": "Oil steadied after falling from highs: Brent December futures closed at $104.43–104.72 a barrel and WTI at $91.66. Trump said Russia will immediately supply over 300,000 tons of diesel to the US and global markets, rising to 500,000 tons in November and 1 million tons in December, plus a further 3 million tons short-term depending on refinery capacity — an effort to push diesel prices down; Saudi Aramco also announced full-volume supply to European customers resumes in November.", "es": "El crudo se estabilizó tras caer desde máximos: el Brent de diciembre cerró entre 104,43 y 104,72 dólares por barril y el WTI en 91,66. Trump afirmó que Rusia suministrará de inmediato más de 300.000 toneladas de diésel a EE. UU. y los mercados globales, con 500.000 en noviembre y 1 millón en diciembre, además de 3 millones más a corto plazo según la capacidad de refino — con el objetivo de abaratar el diésel; Saudi Aramco también anunció que en noviembre restablecerá el suministro completo a sus clientes europeos.", "ja": "国際原油は高値から下落後、もみ合い。ブレント12月限は1バール104.43～104.72ドル、WTIは91.66ドルで引けた。トランプ氏は、ロシアが直ちに30万トン超の軽油を米国と世界市場へ供給し、11月に50万トン、12月に100万トンへ増やし、製油所事情を見て短期的にさらに300万トンを供給する——軽油価格を下げる狙い——と述べた。サウジアラムコも11月から欧州顧客への満額供給を再開すると発表した。"}, "why": {"zh": "俄柴油“救火”叠加沙特复产，高油价叙事出现松动窗口。", "en": "Russian diesel “firefighting” plus Saudi output restart open a window for the high-oil-price narrative to loosen.", "es": "El “apagafuegos” del diésel ruso más la reanudación saudí abren una ventana para que se afloje la narrativa del crudo caro.", "ja": "ロシア産軽油による「消火活動」とサウジの生産再開が重なり、原油高の物語に揺らぎの窓が開いた。"}}, {"idx": "04", "title": {"zh": "黄金反弹创月内最大日涨幅 人民币走强在岸创2022年来新高", "en": "Gold bounces with biggest daily gain in a month; onshore yuan hits strongest since 2022", "es": "El oro rebota con la mayor subida diaria del mes; el yuan en el mercado local marca su mejor nivel desde 2022", "ja": "金が1か月最大の上昇率で反発 人民元は対ドルで2022年来の高水準"}, "body": {"zh": "COMEX黄金期货涨1.52%报4220.30美元/盎司，创一个月最大单日涨幅；现货黄金涨1.46%报4194美元/盎司。外汇方面，在岸人民币对美元16:30收盘报6.6921，较上一交易日上涨93个基点，创2022年6月以来新高；中间价报6.7330亦创逾三年新高。", "en": "COMEX gold futures rose 1.52% to $4220.30 an ounce, the biggest daily gain in a month; spot gold rose 1.46% to $4194. In FX, the onshore yuan closed at 6.6921 per dollar at 16:30, up 93 pips, its strongest since June 2022; the fixing at 6.7330 was also a three-year high.", "es": "Los futuros del oro del COMEX subieron un 1,52% hasta 4220,30 dólares por onza, la mayor ganancia diaria en un mes; el oro al contado subió un 1,46% hasta 4194. En divisas, el yuan en el mercado local cerró a 6,6921 por dólar a las 16:30, con 93 puntos de subida, su mejor nivel desde junio de 2022; el tipo central de 6,7330 también marcó un máximo de más de tres años.", "ja": "COMEX金先物は+1.52%の1オンス4220.30ドルと、1か月で最大の一日上昇率。現物金も+1.46%の4194ドル。外国為替では、人民元（在岸）が16時30分の終値で1ドル=6.6921元と前日比93ポイント高、2022年6月以来の高水準。中間値も6.7330と3年ぶりの高さ。"}, "why": {"zh": "避险与通胀对冲需求共振，叠加美元走弱，贵金属与人民币同步走强。", "en": "Hedging and inflation-hedge demand resonate; a softer dollar lifts precious metals and the yuan in tandem.", "es": "La demanda de refugio y de cobertura frente a la inflación resuenan; un dólar más débil impulsa a la vez a los metales preciosos y al yuan.", "ja": "リスク回避とインフレヘッジ需要が共鳴し、ドル安も相まって貴金属と人民元がそろって強含み。"}}, {"idx": "05", "title": {"zh": "公募运作管理办法大修 权益类基金门槛拟降至5000万元", "en": "Overhaul of public fund rules: equity fund launch threshold set to drop to 50 million yuan", "es": "Gran reforma de las normas de fondos públicos: el umbral de los fondos de renta variable bajaría a 50 millones de yuanes", "ja": "公募運用管理弁法を大改正 株式型ファンドの設定基準を5000万元へ引き下げへ"}, "body": {"zh": "证监会9日就《公开募集证券投资基金运作管理办法》及配套规则公开征求意见，拟将股票、混合、公募FOF成立门槛由2亿元降至5000万元，对指数基金举牌、短线交易等予以适度豁免，并严管“高位发行”“风格漂移”“赌押赛道”。同日，中欧贸易投资磋商机制第二次例会达成联合声明，就混动汽车贸易达成谅解、愿为稀土永磁体出口审批提供便利。", "en": "The CSRC on the 9th published for consultation a major revision of the Measures for the Administration of the Operation of Publicly Offered Securities Investment Funds, proposing to cut the launch threshold for equity, hybrid and public FOF funds from 200 million to 50 million yuan, moderately exempting index funds from stake-disclosure and short-swing trading rules, and strictly policing “high-price issuance,” “style drift” and “sector betting.” The same day, the second session of the China–EU trade and investment consultation mechanism issued a joint statement, reaching an understanding on hybrid-vehicle trade and willingness to facilitate export approvals for rare-earth permanent magnets.", "es": "La CSRC publicó el día 9 para consulta pública una gran revisión de las Medidas de Administración de la Operación de los Fondos de Inversión de Oferta Pública, proponiendo bajar de 200 a 50 millones de yuanes el umbral de constitución de fondos de renta variable, híbridos y FOF públicos, eximir con moderación a los fondos indexados de las reglas de notificación de participaciones y de operaciones a corto plazo, y vigilar con rigor la “emisión en cotas altas”, la “deriva de estilo” y las “apuestas sectoriales”. Ese mismo día, la segunda sesión del mecanismo de consultas comerciales y de inversión China–UE alcanzó una declaración conjunta, con un entendimiento sobre el comercio de vehículos híbridos y la disposición a agilizar las aprobaciones de exportación de imanes permanentes de tierras raras.", "ja": "中国証券監督管理委員会は9日、「公開募集証券投資ファンド運用管理弁法」および関連規則の改正案をパブリックコメントに付し、株式型・混合型・公募FOFの設定基準を2億元から5000万元へ引き下げ、インデックスファンドの大量保有報告や短期売買には一定の免除を認めつつ、「高値での設定」「スタイル逸脱」「セクター賭け」を厳格に監督する方針を示した。同日、中欧貿易投資協議メカニズムの第2回会合は共同声明に達し、ハイブリッド車貿易で了解を形成し、レアアース永久磁石の輸出審査の円滑化に前向きな姿勢を示した。"}, "why": {"zh": "基金供给侧改革直击“迷你基”与发行乱象，中欧经贸共识则为产业链减压。", "en": "Fund supply-side reform targets “mini funds” and issuance chaos, while the China–EU consensus eases pressure along the supply chain.", "es": "La reforma de la oferta de fondos apunta a los “minifondos” y al caos de emisión, mientras el consenso China–UE alivia la cadena de suministro.", "ja": "ファンド供給側改革が「ミニファンド」と設定の混乱を直撃し、中欧の経済的合意はサプライチェーンの圧力を緩める。"}}]}, {"key": "spo", "num": "04", "color": "#15803d", "deep": "#105c2c", "name": {"zh": "体育竞技", "en": "Sports", "es": "Deportes", "ja": "スポーツ"}, "items": [{"idx": "01", "tag": {"zh": "进展"}, "title": {"zh": "郑钦文2-0斯维托丽娜重返中网四强 今晚半决赛战梅尔滕斯", "en": "Zheng Qinwen beats Svitolina 2-0 to return to China Open semis; faces Mertens tonight", "es": "Zheng Qinwen vence 2-0 a Svitolina y regresa a semifinales del Abierto de China; hoy se mide a Mertens", "ja": "鄭欽文がスビトリナに2-0勝利し中網ベスト4復帰 今夜の準決勝はメルテンス戦"}, "body": {"zh": "10月9日中网女单1/4决赛，郑钦文以6-3、7-6(6)直落两盘击败6号种子斯维托丽娜，时隔两年重返中网女单四强，追平个人赛会最佳；即时世界排名升至第33位。梅尔滕斯以7-6(0)、6-3爆冷淘汰前世界第一斯瓦泰克，两人将于10月10日19:00在钻石球场争夺决赛席位，郑钦文去年曾三盘击败对手。", "en": "In the China Open women’s quarterfinals on October 9, Zheng Qinwen beat 6th seed Elina Svitolina 6-3, 7-6(6) to reach the semifinals for the first time in two years, matching her best result at the event; her live ranking rose to No. 33. Elise Mertens upset former world No. 1 Iga Swiatek 7-6(0), 6-3; the two meet at 19:00 on October 10 at the Diamond Court for a final berth — Zheng beat Mertens in three sets last year.", "es": "En los cuartos de final femeninos del Abierto de China del 9 de octubre, Zheng Qinwen derrotó a la 6.ª cabeza de serie Elina Svitolina por 6-3 y 7-6(6) y regresó a semifinales tras dos años, igualando su mejor resultado en el torneo; su ranking en vivo subió al n.º 33. Elise Mertens sorprendió a la ex n.º 1 del mundo Iga Swiatek por 7-6(0) y 6-3; ambas se juegan la final el 10 de octubre a las 19:00 en la Pista Diamante — Zheng ya venció a Mertens en tres sets el año pasado.", "ja": "10月9日の中網（中国オープン）女子シングルス準々決勝で、鄭欽文が第6シードのスビトリナを6-3、7-6(6)のストレートで下し、2年ぶりにベスト4へ。自身の大会最高成績に並び、世界ランキングは33位まで浮上した。メルテンスは7-6(0)、6-3で元世界1位のシフィオンテクを波乱の末に破った。両者は10月10日19時からダイヤモンドコートで決勝進出を懸けて対戦する。鄭は昨年、相手を3セットで下している。"}, "why": {"zh": "主场作战的“中国一姐”冲击决赛，一夜双赛的梅尔滕斯体能成关键变数。", "en": "Home favorite “China’s No. 1” charges for the final, while Mertens’ two-matches-in-one-night fitness is the key variable.", "es": "La “número 1 de China” local va a por la final; la condición física de Mertens, con dos partidos en una noche, es la variable clave.", "ja": "地元の「中国エース」が決勝へ突き進む。一夜で2試合のメルテンスの体力が最大の変数。"}}, {"idx": "02", "tag": {"zh": "进展"}, "title": {"zh": "WTT中国大满贯混双首冠 林钟勋/申裕斌3-2惊天逆转", "en": "First WTT China Smash mixed-doubles crown: Lim Jong-hoon/Shin Yu-bin complete a stunning 3-2 comeback", "es": "Primer título de dobles mixtos del WTT China Smash: Lim Jong-hoon/Shin Yu-bin completan una remontada épica 3-2", "ja": "WTT中国スマッシュ混合ダブルス初優勝 林鍾勲/申裕斌が3-2の奇跡的逆転"}, "body": {"zh": "WTT中国大满贯混双决赛，韩国组合林钟勋/申裕斌在第四局3-10落后、对手手握8个冠军点的绝境下连追逆转，决胜局1-5落后再连得8分，最终3-2击败林昀儒/郑怡静夺冠；国乒因主力退赛混双仅一对进八强且无缘四强。", "en": "In the WTT China Smash mixed-doubles final, Korea’s Lim Jong-hoon/Shin Yu-bin, down 3-10 in game four facing eight championship points against, rallied back, then scored eight straight points after trailing 1-5 in the decider to beat Lin Yun-ju/Cheng I-ching 3-2 for the title; with top Chinese players withdrawing, only one Chinese pair reached the mixed quarterfinals and none made the semis.", "es": "En la final de dobles mixtos del WTT China Smash, la pareja surcoreana Lim Jong-hoon/Shin Yu-bin, abajo 3-10 en el cuarto set con ocho puntos de campeonato en contra, se levantó, y en el set decisivo encadenó ocho puntos seguidos tras ir 1-5 abajo para vencer 3-2 a Lin Yun-ju/Cheng I-ching y alzarse con el título; por las bajas de las figuras chinas, solo una pareja china llegó a cuartos y ninguna a semifinales.", "ja": "WTT中国スマッシュ混合ダブルス決勝で、韓国ペアの林鍾勲/申裕斌が第4ゲームに3-10とされ、相手に8個のチャンピオンシップポイントを握られる絶体絶命から追いつき、決定ゲームでも1-5から8連続得点。最終的に林昀儒/鄭怡静を3-2で破り優勝した。中国勢は主力の欠場もあり、混合ダブルスでベスト8進出は1ペアのみ、ベスト4には届かなかった。"}, "why": {"zh": "年度级逆转登上热搜，国乒混双主场“开门黑”引发热议。", "en": "A comeback-of-the-year trended nationwide, while Team China’s home mixed-doubles shutout stirs heated debate.", "es": "Una remontada del año se hizo viral, mientras el fiasco local del mixed chino enciende el debate.", "ja": "年間ベスト級の大逆転が検索ランキングを駆け上がり、中国卓球の混合ダブルス地元での「白星なし」が大いに話題に。"}}, {"idx": "03", "tag": {"zh": "进展"}, "title": {"zh": "国乒男双温瑞博/袁励岑1-3勒布伦兄弟 主场提前失两冠", "en": "China’s Wen Ruibo/Yuan Licen fall 1-3 to the Lebrun brothers as two home titles slip away early", "es": "Wen Ruibo/Yuan Licen caen 1-3 ante los hermanos Lebrun y China pierde dos títulos locales de antemano", "ja": "中国男子ダブルスの温瑞博/袁励岑が1-3でルブラン兄弟に敗れ 地元で2冠が早々に消滅"}, "body": {"zh": "WTT中国大满贯男双半决赛，国乒唯一组合温瑞博/袁励岑以1-3遭法国勒布伦兄弟逆转无缘决赛。结合此前混双全员无缘四强，国乒在本土大满贯已提前无缘混双与男双两项冠军。", "en": "In the WTT China Smash men’s doubles semifinal, China’s only remaining pair Wen Ruibo/Yuan Licen were overturned 1-3 by France’s Lebrun brothers and missed the final. With all Chinese mixed pairs already out of the semis, the host nation is now assured of missing both mixed and men’s doubles titles at its home Smash.", "es": "En la semifinal de dobles masculinos del WTT China Smash, la única pareja china, Wen Ruibo/Yuan Licen, fue remontada 1-3 por los hermanos Lebrun de Francia y quedó fuera de la final. Con todas las parejas chinas ya fuera de las semifinales de mixtos, el país anfitrión se queda sin opciones de título tanto en mixtos como en dobles masculino en su Smash local.", "ja": "WTT中国スマッシュ男子ダブルス準決勝で、中国勢唯一のペア温瑞博/袁励岑が1-3でフランスのルブラン兄弟に逆転を許し決勝進出を逃した。すでに混合ダブルスで中国勢全ペアがベスト4を逃していたため、地元開催のスマッシュで混合と男子ダブルスの2冠はこの時点で消滅した。"}, "why": {"zh": "外协冲击加剧，主场“双线失守”折射乒坛格局生变。", "en": "Rising foreign challengers and a home “double collapse” signal a shifting table-tennis landscape.", "es": "El empuje de los rivales foráneos y un “doble fracaso” local reflejan un cambio en el mapa del tenis de mesa.", "ja": "外国勢の攻勢が強まり、地元での「二冠同時脱落」は卓球界の構図変化を映し出す。"}}, {"idx": "04", "title": {"zh": "成都蓉城今晚中超争冠战 平天津即夺队史首冠", "en": "Chengdu Rongcheng can seal its first CSL title tonight with a draw vs Tianjin", "es": "Chengdu Rongcheng puede sellar hoy su primer título de la Superliga con solo empatar ante Tianjin", "ja": "成都蓉城、今夜にCSL優勝を懸けて 天津戦で引き分けなら球団史上初タイトル"}, "body": {"zh": "10月10日，成都蓉城将在凤凰山专业足球场迎战天津津门虎；球队只需拿到1分，即可提前3轮锁定本赛季中超联赛冠军，成就成都乃至四川在中国足球顶级职业联赛的历史首冠，全城关注。", "en": "On October 10 Chengdu Rongcheng host Tianjin Jinmen Tiger at Phoenix Mountain Football Park; a single point will mathematically clinch the Chinese Super League title three rounds early — the first top-flight crown ever for Chengdu and Sichuan, with the whole city watching.", "es": "El 10 de octubre Chengdu Rongcheng recibe al Tianjin Jinmen Tiger en el estadio de fútbol de la Montaña Fénix; con solo sumar un punto sellaría matemáticamente el título de la Superliga china tres jornadas antes — el primer campeonato de máxima categoría en la historia de Chengdu y de Sichuan, con toda la ciudad pendiente.", "ja": "10月10日、成都蓉城は鳳凰山サッカー場で天津津門虎と対戦。勝ち点1で今季スーパーリーグ優勝が3節早く確定し、成都ひいては四川省にとって中国サッカー最上位リーグ史上初のタイトルとなる。全市が注目する一戦だ。"}, "why": {"zh": "“金牌球市”迎来历史性时刻，一座城的冠军悬念今夜揭晓。", "en": "China’s hottest football city meets a historic moment — tonight the suspense of a city’s first crown is resolved.", "es": "La ciudad con el mejor ambiente futbolístico vive un momento histórico — esta noche se despeja la incógnita del primer título de toda una ciudad.", "ja": "「ゴールドスタジアム」の街が歴史的瞬間を迎え、一都市の優勝の行方が今夜明ける。"}}, {"idx": "05", "tag": {"zh": "进展"}, "title": {"zh": "张帅/西尼亚科娃晋级中网女双四强 组合12连胜", "en": "Zhang Shuai/Siniakova reach China Open doubles semis with a 12th straight win as a pair", "es": "Zhang Shuai/Siniakova llegan a semifinales de dobles del Abierto de China con 12 victorias seguidas como pareja", "ja": "張帥/シニャコワが中網女子ダブルスベスト4進出 ペア12連勝"}, "body": {"zh": "中网女双1/4决赛，张帅/西尼亚科娃以两个6-2完胜亨特/梅拉德诺维奇，首次打入中网女双四强，两人组合连胜刷新至12场；另一场卢特利芙/苏加迪也晋级四强。", "en": "In the China Open women’s doubles quarterfinals, Zhang Shuai/Katerina Siniakova beat Hunter/Mladenovic 6-2, 6-2 to reach the event’s doubles semifinals for the first time, extending their pairing streak to 12 straight wins; in the other quarterfinal, Lutef/Sugadi also advanced.", "es": "En los cuartos de dobles femeninos del Abierto de China, Zhang Shuai/Katerina Siniakova vencieron 6-2 y 6-2 a Hunter/Mladenovic y alcanzaron por primera vez las semifinales de dobles del torneo, extendiendo su racha como pareja a 12 triunfos seguidos; en el otro cruce, Lutef/Sugadi también avanzaron.", "ja": "中網女子ダブルス準々決勝で、張帥/カテリナ・シニャコワ組が6-2、6-2でハンター/メラドノビッチ組を完勝し、大会初のベスト4進出。ペアとしての連勝を12に伸ばした。もう一つの試合ではルテフ/スガディ組もベスト4に進んだ。"}, "why": {"zh": "老将张帅双线飘红，中国金花在女双赛场延续强势。", "en": "Veteran Zhang Shuai is flying on two fronts as China’s players keep blooming in women’s doubles.", "es": "La veterana Zhang Shuai brilla en dos frentes, y las jugadoras chinas siguen fuertes en dobles femeninos.", "ja": "ベテランの張帥が両面で好調を維持し、中国勢が女子ダブルスで強さを保っている。"}}]}, {"key": "hot", "num": "05", "color": "#6d28d9", "deep": "#551dab", "name": {"zh": "网络热点", "en": "Trending", "es": "Tendencias", "ja": "ネット話題"}, "items": [{"idx": "01", "tag": {"zh": "进展"}, "title": {"zh": "燃油附加费今起上调落地 节后机票“跳水”可捡漏", "en": "Fuel surcharge hike takes effect today; post-holiday airfares “dive” for bargain hunters", "es": "El recargo por combustible sube desde hoy; los billetes pos-festivo “se desploman” para los cazadores de gangas", "ja": "燃油サーチャージ本日から値上げ 連休明けの航空券は「急落」でお得に"}, "body": {"zh": "自10月10日（含）起销售的国内航线客票，燃油附加费正式上调：800公里以上航段每位旅客90元、800公里及以下50元，分别上涨20元和10元。与此同时，假期后机票价格明显回落，10月9日至31日国内机票平均支付价格较“十一”低超三成，北京飞乌鲁木齐最低300元、上海飞丽江低至200元，赶在9日前出票仍可省一笔。", "en": "For domestic tickets sold from October 10 onward, the fuel surcharge officially rises: 90 yuan per passenger on sectors above 800 km and 50 yuan on 800 km or less, up 20 and 10 yuan respectively. Meanwhile, post-holiday fares have clearly dropped — average paid prices for domestic flights Oct 9–31 are more than 30% below Golden Week levels, with Beijing–Urumqi from as low as 300 yuan and Shanghai–Lijiang from 200 yuan; ticketing before the 9th still saves a bundle.", "es": "Para los billetes nacionales vendidos desde el 10 de octubre, el recargo por combustible sube oficialmente: 90 yuanes por pasajero en tramos de más de 800 km y 50 en tramos de 800 km o menos, +20 y +10 respectivamente. En paralelo, las tarifas pos-festivo han caído con claridad: el precio medio pagado en vuelos domésticos del 9 al 31 de octubre queda más de un 30% por debajo del de la Semana Dorada, con Pekín–Urumqi desde 300 yuanes y Shanghái–Lijiang desde 200; emitir antes del día 9 aún permite ahorrar.", "ja": "10月10日以降に発券される国内線航空券から燃油サーチャージが正式に値上げされ、800km超の区間は1人90元、800km以下は50元と、それぞれ20元・10元の引き上げ。一方、連休明けの運賃は明確に下落し、10月9日から31日の国内線平均支払価格は国慶節期間より3割超安く、北京発ウルムチは最低300元、上海発麗江は200元まで。9日までに発券すれば一筆節約できる。"}, "why": {"zh": "涨价与降价同框，错峰出行的“捡漏窗口”悄然打开。", "en": "A hike and a dive in the same frame: the bargain window for off-peak travel quietly opens.", "es": "Subida y desplome en el mismo encuadre: se abre en silencio la ventana de gangas para viajar fuera de temporada.", "ja": "値上げと値下げが同時に動く。ピークずらし旅行の「お得な窓」が静かに開きつつある。"}}, {"idx": "02", "title": {"zh": "央视曝光锂电池代加工骗局 “在家月入过万”收押金后拒付", "en": "CCTV exposes lithium-battery outsourcing scam: “earn 10k a month at home” — deposits taken, no payment", "es": "La CCTV destapa la estafa del ensamblaje de baterías de litio: “gana más de 10.000 al mes en casa” — cobran el depósito y no pagan", "ja": "CCTVがリチウム電池委託加工の詐欺を告発 「在宅で月収1万元超」と押金を取り支払わず"}, "body": {"zh": "央视曝光一类锂电池代加工骗局：相关项目在短视频平台宣称“在家代加工月入过万”，吸引受害者缴纳押金领料回家生产，之后以产品不合格为由拒付加工费，已有多人上当。警方与监管部门提醒警惕“零门槛高回报”类兼职。", "en": "CCTV exposed a lithium-battery outsourcing scam: projects advertised on short-video platforms claim you can “earn over 10,000 yuan a month working from home,” luring victims to pay deposits and take materials home to assemble, then refuse to pay processing fees citing “defective products.” Many have fallen for it. Police and regulators warn against “zero-threshold, high-return” side gigs.", "es": "La CCTV destapó una estafa de ensamblaje de baterías de litio: proyectos promocionados en plataformas de vídeo corto prometen “ganar más de 10.000 yuanes al mes trabajando en casa”, atraen a las víctimas para que paguen un depósito y se lleven los materiales a ensamblar, y luego se niegan a pagar el trabajo alegando “productos defectuosos”. Ya hay múltiples afectados. La policía y los reguladores advierten contra los trabajos secundarios de “cero requisitos y alta rentabilidad”.", "ja": "CCTV（中国中央テレビ）がリチウム電池の委託加工をめぐる詐欺を告発した。短編動画プラットフォームで「在宅作業で月収1万元以上」と宣伝し、被害者に押金を支払わせて資材を持ち帰らせて加工させ、その後「製品不良」を口実に加工賃の支払いを拒む手口で、すでに多数の被害者が出ている。警察と規制当局は「参入障壁ゼロ・高リターン」型の副業に警戒を呼びかけている。"}, "why": {"zh": "“副业焦虑”被不法分子利用，低门槛兼职的合规边界亟待厘清。", "en": "Side-gig anxiety is being weaponized; the compliance boundary for low-threshold part-time work needs urgent clarity.", "es": "La ansiedad por los ingresos extra está siendo explotada; urge delimitar la legalidad de los trabajos a tiempo parcial de baja barrera.", "ja": "副業への焦りが悪事に利用されており、ハードルの低い副業の法的境界線の整理が急務だ。"}}, {"idx": "03", "title": {"zh": "山姆拟更新会员章程 限制亲友卡转卖套利", "en": "Sam’s Club plans membership rule update to curb resale arbitrage of family cards", "es": "Sam’s Club planea actualizar su reglamento de socios para frenar la reventa especulativa de las tarjetas de familia", "ja": "サムズクラブが会員規約の改定を検討 家族カードの転売・サヤ取りを制限"}, "body": {"zh": "山姆会员商店宣布拟更新会员章程并公开征求意见，新规限制每365天内实名信息仅能激活两名主卡的亲友卡。专家解读此举旨在收窄“亲友卡”泛用转卖套利行为、筛选核心付费用户，但在执行端易引发新的消费矛盾。", "en": "Sam’s Club announced a draft update to its membership charter for public comment: under the new rules, a member’s ID can only activate family cards for two primary-card holders within any 365-day window. Experts read it as an attempt to curb card-resale arbitrage and filter for core paying users, though enforcement could spark new consumer friction.", "es": "Sam’s Club anunció un borrador de actualización de su carta de socios para consulta pública: bajo la nueva norma, la identidad real de una persona solo puede activar tarjetas de familia de dos titulares principales dentro de cualquier ventana de 365 días. Los expertos lo leen como un intento de estrechar la reventa especulativa de tarjetas y filtrar usuarios pagantes núcleo, aunque su aplicación puede provocar nuevas fricciones con los consumidores.", "ja": "サムズクラブは会員規約の改定案を公開コメントに付した。新規則では、365日以内に同一実名情報でアクティベートできる家族カードは主会員2名分までに制限される。専門家は「家族カード」の転売・サヤ取りを狭め、中核となる有料会員をふるいにかける狙いと読むが、運用面で新たな消費者との摩擦を生みやすい。"}, "why": {"zh": "会员制零售的“卡贩”灰色产业链，正被平台规则收紧。", "en": "The grey “card reseller” chain in membership retail is being squeezed by platform rules.", "es": "La cadena gris de “revendedores de tarjetas” en el comercio por suscripción está siendo estrechada por las reglas de la plataforma.", "ja": "会員制小売を支える「カード転売屋」の灰色の産業連鎖が、プラットフォーム規則によって締め上げられている。"}}, {"idx": "04", "title": {"zh": "野猪组团逛县城 驴友获救后自担9万余元救援费", "en": "Wild boars stroll downtown in packs; rescued hikers to foot 90k-yuan rescue bill", "es": "Jabalíes pasean en manada por el centro; los senderistas rescatados pagarán más de 90.000 yuanes del rescate", "ja": "イノシシの群れが市街地を闊歩 遭難した登山者は9万元以上の救助費を自己負担"}, "body": {"zh": "四川南部县官方确认，网传野猪成群穿行县城街道视频属实、非AI合成，当地已动用无人机热成像搜寻消除隐患；另两名驴友擅闯哈巴雪山核心保护区滑坠被困，经25小时营救脱险，因破坏管理秩序被罚0.8万元，9万余元救援费由其自行承担。", "en": "Officials in Nanbu County, Sichuan confirmed that footage of wild boars crossing county streets in a pack is genuine, not AI-generated; drones with thermal imaging were deployed to clear the hazard. Separately, two hikers who trespassed into the core protected zone of Haba Snow Mountain slipped and got trapped; after a 25-hour rescue they were fined 8,000 yuan for disrupting management order and must bear over 90,000 yuan of rescue costs themselves.", "es": "Las autoridades del distrito de Nanbu (Sichuan) confirmaron que el vídeo de jabalíes cruzando las calles en manada es auténtico y no generado por IA; ya se han desplegado drones con imagen térmica para eliminar el riesgo. Por otra parte, dos senderistas que irrumpieron en la zona núcleo protegida de la montaña nevada Haba resbalaron y quedaron atrapados; tras un rescate de 25 horas fueron multados con 8.000 yuanes por alterar el orden de gestión y deberán asumir más de 90.000 yuanes del coste del rescate.", "ja": "四川省南部県の当局は、市街地を群れで横切るイノシシの映像が本物でAI合成ではないことを確認し、ドローンの熱画像捜索で危険の除去を進めている。また、ハバ雪山の核心保護区に無断で入り滑落・閉じ込められた登山者2人は、25時間の救出作戦の末に救助されたが、管理秩序を乱したとして8000元の罰金を科され、9万元超の救助費は自己負担となった。"}, "why": {"zh": "野生动物进城与“野游”遇险频发，公共安全与任性出游的边界再引讨论。", "en": "Wildlife in town and risky “wild trekking” keep making headlines, renewing debate over public safety vs. free-range travel.", "es": "Fauna salvaje en la ciudad y accidentes de “turismo salvaje” se repiten; se reabre el debate sobre seguridad pública y caprichos viajeros.", "ja": "野生動物の市街地進入と無謀な「野遊び」の遭難が相次ぎ、公共の安全と気まぐれな旅の境界線が改めて問われている。"}}, {"idx": "05", "title": {"zh": "网红“超长蛋挞”走红不足两月快速降温", "en": "Viral “extra-long egg tart” cools off in under two months", "es": "El “pastel de huevo extralargo” viral se enfría en menos de dos meses", "ja": "話題の「超ロングエッグタルト」2か月足らずで急速にブーム終息"}, "body": {"zh": "凭借短视频走红的“超长蛋挞”热度不足两个月便快速降温。该单品源于门店偶然试水，依托预制烘焙供应链迅速全国铺货，入局门槛低、同质化竞争激烈，主打视觉噱头却口感不佳、复购弱，成为网红小吃“昙花一现”的缩影。", "en": "The “extra-long egg tart,” which went viral on short videos, cooled in under two months. Born from a store’s chance experiment, it spread nationwide fast via premade-baking supply chains; with low entry barriers and fierce homogenized competition, it leaned on visual gimmicks but poor taste and weak repeat purchases — a microcosm of the flash-in-the-pan viral snack.", "es": "El “pastel de huevo extralargo”, viralizado en vídeos cortos, se enfrió en menos de dos meses. Nacido de un experimento casual de una tienda, se expandió rápido por todo el país gracias a la cadena de repostería prefabricada; con barreras de entrada bajas y una competencia homogénea feroz, apostó por el golpe visual con mal sabor y baja recompra — un epítome del snack viral efímero.", "ja": "短編動画で話題となった「超ロングエッグタルト」は、2か月足らずで急速に熱が冷めた。店舗の偶然の試みから始まり、中間加工ベーカリーのサプライチェーンに乗って全国へ急速展開。参入障壁が低く同質化競争が激しく、見た目の演出頼みで味は今ひとつ、リピートも弱く、ネット話題の軽食が「一瞬の輝き」で終わる典型となった。"}, "why": {"zh": "流量炒作难抵产品力，网红食品的周期正在被极度压缩。", "en": "Hype can’t beat product substance; the lifecycle of viral foods is being compressed to the extreme.", "es": "El hype no puede contra la calidad del producto; el ciclo de los alimentos virales se comprime al extremo.", "ja": "話題性だけでは商品力に勝てず、話題の食品のサイクルは極端に圧縮されつつある。"}}]}, {"key": "ent", "num": "06", "color": "#db2777", "deep": "#ab1d5d", "name": {"zh": "娱乐八卦", "en": "Entertainment", "es": "Espectáculos", "ja": "エンタメ"}, "items": [{"idx": "01", "tag": {"zh": "进展"}, "title": {"zh": "宋佳凭《山花烂漫时》获飞天视后 成首位单角色“大满贯”女演员", "en": "Song Jia wins Flying Apsaras best actress for “Blossoms on the Mountain,” first actress to sweep all three awards for one role", "es": "Song Jia gana la mejor actriz de los Flying Apsaras por “Blossoms on the Mountain”, primera actriz que logra el “grand slam” de tres premios con un mismo papel", "ja": "宋佳が「山花爛漫時」で飛天賞最優秀女優賞 単一役での三冠達成は史上初の女優に"}, "body": {"zh": "第35届飞天奖9日晚在山东烟台揭晓：宋佳凭借《山花烂漫时》中张桂梅一角获优秀女演员奖，成为内娱首位凭同一角色集齐飞天、白玉兰、金鹰三大电视剧奖项的女演员；王仁君凭《浴血荣光》获优秀男演员奖，刘家成凭《生万物》《海天雄鹰》获优秀导演奖，《沉默的荣耀》获优秀编剧奖，16部作品获优秀电视剧奖。", "en": "The 35th Flying Apsaras Awards were announced in Yantai, Shandong, on the evening of the 9th: Song Jia won Outstanding Actress for playing Zhang Guimei in “Blossoms on the Mountain,” becoming the first Chinese actress to collect the Flying Apsaras, Magnolia and Golden Eagle TV awards for one and the same role; Wang Renjun won Outstanding Actor for “Bathed in Blood, Glorious Light,” Liu Jiacheng Outstanding Director for “Sheng Wanwu” and “Sea-Sky Eagles,” “The Silent Honor” won Outstanding Screenplay, and 16 dramas were named outstanding series.", "es": "La 35.ª edición de los premios Flying Apsaras se anunció la noche del día 9 en Yantai, Shandong: Song Jia ganó el premio a Actriz Destacada por encarnar a Zhang Guimei en “Blossoms on the Mountain”, convirtiéndose en la primera actriz china en reunir los tres grandes premios televisivos — Flying Apsaras, Magnolia y Golden Eagle — con un mismo papel; Wang Renjun logró el de Actor Destacado por “Bathed in Blood, Glorious Light”, Liu Jiacheng el de Director Destacado por “Sheng Wanwu” y “Sea-Sky Eagles”, “The Silent Honor” el de Guion Destacado, y 16 producciones fueron reconocidas como series sobresalientes.", "ja": "第35回飛天賞が9日夜、山東省煙台で発表された。宋佳は「山花爛漫時」の張桂梅役で最優秀女優賞を受賞し、同一役で飛天・白玉蘭・金鷹の三大テレビドラマ賞を集めた初の女優となった。王仁君は「浴血栄光」で最優秀男優賞、劉家成は「生万物」「海天雄鷹」で最優秀監督賞、「沈黙の栄誉」が最優秀脚本賞を受け、16作品が優秀テレビドラマ賞に選ばれた。"}, "why": {"zh": "一座角色“穿三”史无前例，实力派演员的Long-term价值被重新看见。", "en": "One role sweeping all three trophies is unprecedented; the long-term value of actors with real craft is being seen anew.", "es": "Que un solo papel arrase con los tres galardones es algo sin precedente; el valor a largo plazo de los actores de oficio se vuelve a ver.", "ja": "一つの役で三冠は前例がなく、実力派俳優の長期的な価値が改めて見直されている。"}}, {"idx": "02", "title": {"zh": "飞天奖红毯名场面 胡军李乃文“架着”欧豪走红毯", "en": "Red-carpet moment at the Flying Apsaras: Hu Jun and Li Naiwen “march” Ou Hao down the carpet", "es": "Momento estelar de la alfombra roja de los Flying Apsaras: Hu Jun y Li Naiwen “escoltan” a Ou Hao por la alfombra", "ja": "飛天賞レッドカーペットの名場面 胡軍と李乃文が歐豪を「挟んで」歩く"}, "body": {"zh": "飞天奖红毯上，胡军、李乃文一左一右“架”着欧豪走完全程，李乃文还顺势接过签名笔，把综艺《大哥小助理》的“熟人局”搬进颁奖礼，画面被网友戏称为“像被绑架”，话题冲上热搜。三人因《北上》结缘、综艺里“乃助”上线，真实熟络感引发集体玩梗。", "en": "On the Flying Apsaras red carpet, Hu Jun and Li Naiwen “flanked” Ou Hao from both sides the whole way, with Li Naiwen even grabbing the signing pen — bringing the “old-buddies” vibe of their variety show “Big Bro’s Little Assistant” into the awards. Netizens joked it looked “like a kidnapping” as the clip trended. The trio bonded filming “Northward,” and the “Nai-assistant” bit from the variety show gave the moment its authentic, meme-ready chemistry.", "es": "En la alfombra roja de los Flying Apsaras, Hu Jun y Li Naiwen “escoltaron” a Ou Hao a ambos lados todo el trayecto, y Li Naiwen hasta tomó el bolígrafo de firmas — llevando el ambiente de compinches del programa “El Gran Hermano y Su Asistente” a la gala. Los internautas bromeaban con que parecía “un secuestro” y el clip se volvió tendencia. Los tres se conocieron rodando “Northward”, y el gag del “asistente Nai” del programa dio a la escena esa química auténtica lista para el meme.", "ja": "飛天賞のレッドカーペットで、胡軍と李乃文が左右から歐豪を「挟んで」最後まで歩き、李乃文はその流れでサイン用ペンも受け取る——バラエティ番組『大兄弟・小アシスタント』の「顔なじみ局」を授賞式に持ち込んだ形で、ネットユーザーは「誘拐みたい」と笑い、話題は検索ランキングへ。「北上」での共演で結ばれた3人の本物の仲の良さが、集団ネタ化を引き起こした。"}, "why": {"zh": "严肃颁奖礼变“熟人局爆笑现场”，明星真实互动成最佳综艺素材。", "en": "A solemn awards show turned into a buddies’ laugh riot — authentic star interactions are the best variety material.", "es": "Una gala solemne se convirtió en una comedia entre compinches — las interacciones auténticas de las estrellas son el mejor material de variedades.", "ja": "厳粛な授賞式が「顔なじみ大爆笑の現場」に変わり、スターの本物のやり取りが最高のバラエティ素材となる。"}}, {"idx": "03", "title": {"zh": "周深飞天奖颁奖礼脱口而出“怎么都没找我唱歌”", "en": "Zhou Shen blurts out at the Flying Apsaras: “How come none of you ever asked me to sing?”", "es": "Zhou Shen se le escapa en los Flying Apsaras: “¿Cómo que nunca me han pedido cantar?”", "ja": "周深が飛天賞の授賞式で思わず「どうして誰も私に歌わせてくれないの」"}, "body": {"zh": "周深以开奖嘉宾身份登台，念完获奖名单前忽然冒出一句“怎么都没找我唱歌”，随即大方补上“恭喜恭喜，找我唱歌”，引发全场笑声，被网友趣称“颁奖现场求职”；获奖代表也幽默回应“很想找您唱歌”。", "en": "Onstage as a presenter, Zhou Shen suddenly quipped before finishing the winners’ list, “How come none of you ever asked me to sing?” — then gracefully added, “Congratulations, and do ask me to sing,” sending the hall into laughter. Netizens dubbed it “job-hunting at an awards show,” and winners replied in kind, “We’d love to.”", "es": "Sobre el escenario como presentador, Zhou Shen soltó de improviso antes de terminar la lista de ganadores: “¿Cómo que nunca me han pedido cantar?” — y añadió con gracia, “Enhorabuena, y pídame cantar”, arrancando la carcajada del recinto. Los internautas lo bautizaron como “búsqueda de empleo en una gala”, y los premiados respondieron con humor: “Nos encantaría”.", "ja": "プレゼンターとして登壇した周深は、受賞者名を読み上げる途中で思わず「どうして誰も私に歌わせてくれないの」とこぼし、すぐに「おめでとうございます。ぜひ歌わせてください」と笑顔で続けて会場を笑わせた。ネットでは「授賞式での求職」と囃し立てられ、受賞者側も「ぜひ歌っていただきたい」とユーモラスに応えた。"}, "why": {"zh": "松弛感拉满的意外名场面，歌手“求活”比剧本更讨喜。", "en": "A perfectly relaxed, unplanned moment — a singer “looking for gigs” beats any script.", "es": "Un momento inesperado y completamente relajado — un cantante “buscando encargos” resulta más simpático que cualquier guion.", "ja": "緊張感ゼロの意外な名場面。歌手が仕事を「おねだり」する姿は脚本より愛される。"}}, {"idx": "04", "tag": {"zh": "进展"}, "title": {"zh": "国庆档票房超11.65亿元 “电影+”带火文旅新消费", "en": "National Day box office tops 1.165 billion yuan as “Movie+” sparks new cultural-tourism spending", "es": "La taquilla del Día Nacional supera los 1.165 millones de yuanes; el “cine+” aviva el nuevo consumo cultural-turístico", "ja": "国慶節映画興行収入が11.65億元超 「映画＋」が文化観光の新消費を加熱"}, "body": {"zh": "2026年国庆档电影总票房超11.65亿元，总放映场次超329万场。今年“电影+”被玩出新形态：河南周口凭票根可在30余家商户享折扣、带动商户客流涨约40%；宁夏石嘴山《欢迎来龙餐馆》取景地石炭井影视小镇保留场景成打卡点，近60部影视作品曾在此取景。", "en": "The 2026 National Day box office topped 1.165 billion yuan across more than 3.29 million screenings. This year’s “Movie+” took new forms: in Zhoukou, Henan, ticket stubs unlock discounts at 30-plus shops and lifted foot traffic about 40%; in Shizuishan, Ningxia, the Shitanjing film town — where “Welcome to the Dragon Restaurant” was shot — kept sets as photo spots, and nearly 60 productions have filmed there.", "es": "La taquilla del Día Nacional de 2026 superó los 1.165 millones de yuanes en más de 3,29 millones de proyecciones. El “cine+” adoptó formas nuevas: en Zhoukou (Henan), las entradas dan descuentos en más de 30 comercios y elevaron su afluencia cerca de un 40%; en Shizuishan (Ningxia), el pueblo cinematográfico de Shitanjing, donde se rodó “Bienvenidos al Restaurante Dragón”, conservó los decorados como puntos de foto, y unas 60 producciones han rodado allí.", "ja": "2026年国慶節映画興行収入は11.65億元を超え、上映回数は329万回を数えた。今年の「映画＋」は新しい形を生み出している。河南省周口では、チケットの半券で30店超の割引が受けられ、来店客数が約40%増。寧夏の石嘴山では、「歓迎、龍飯店へ」の撮影地となった石炭井フィルムタウンがセットを残してフォトスポット化し、これまで約60作品が当地で撮影した。"}, "why": {"zh": "从“看一场”到“玩一天”，光影流量正转化为县域消费增量。", "en": "From “watching a film” to “playing all day” — screen traffic is turning into county-level spending growth.", "es": "De “ver una película” a “jugar todo el día” — el caudal de la pantalla se convierte en consumo extra de los condados.", "ja": "「一本観る」から「一日遊ぶ」へ。映像の集客が県域消費の伸びしろに変わっている。"}}, {"idx": "05", "title": {"zh": "《心动的信号9》连续16天登顶 网综指数71.86居首", "en": "“Heart Signal 9” tops charts 16 days straight with a 71.86 web-variety index", "es": "“Heart Signal 9” lidera el ranking 16 días seguidos con un índice de variedades web de 71,86", "ja": "「心動的信号9」が16日連続首位 ネットバラエティ指数71.86でトップ"}, "body": {"zh": "恋爱观察综艺《心动的信号第九季》10月上线后连续16天登顶，正片播放市占率10.5%、网络综艺播放指数71.86稳坐网综榜首。分析认为，节目呈现暧昧期真实状态而非剧本化冲突，让年轻观众在他人拉扯里照见自己的渴望与犹豫，引发集体共鸣。", "en": "The romance-observation show “Heart Signal Season 9” has topped charts 16 days straight since its October debut, with a 10.5% share of full-episode plays and a 71.86 web-variety index holding the No. 1 spot. Analysts credit its depiction of the real ambivalence phase rather than scripted conflict, letting young viewers see their own longings and hesitations in others’ push-and-pull — a collective resonance.", "es": "El programa de observación amorosa “Heart Signal, temporada 9” lidera los rankings 16 días seguidos desde su estreno en octubre, con un 10,5% de cuota de reproducción de episodios completos y un índice de variedades web de 71,86 que afianza el n.º 1. Los analistas destacan su retrato de la fase de ambigüedad real, no del conflicto guionizado, que permite a los jóvenes espectadores verse reflejados en el tira y afloja ajeno — una resonancia colectiva.", "ja": "恋愛観察バラエティ「心動的信号シーズン9」は10月の配信開始以来16日連続で首位を独走中。本編再生の市場占有率は10.5%、ネットバラエティ再生指数は71.86でトップを堅持する。分析では、シナリオ化した対立ではなく曖昧な時期の生々しい姿を描いたことで、若い視聴者が他人の綱引きの中に自分の憧れとためらいを映し、共感が集まっているとされる。"}, "why": {"zh": "不恋爱却嗑CP爆火，折射年轻人“想爱又不敢爱”的情感镜像。", "en": "Viewers ship couples without dating themselves — a mirror of young people wanting love yet fearing it.", "es": "Los espectadores hacen “shipping” sin salir con nadie — un espejo de los jóvenes que quieren amar pero apenas se atreven.", "ja": "自分は恋しないのにカップリングに熱中する若者たち。「恋をしたい、でも一歩が踏み出せない」時代の鏡だ。"}}]}], "risk": {"zh": "风险提示：本简报仅作信息汇总，其中涉及的数据不构成任何投资建议。", "en": "Disclaimer: This briefing is a news digest only; data cited does not constitute investment advice.", "es": "Aviso: Este resumen es solo una compilación informativa; los datos citados no constituyen asesoramiento de inversión.", "ja": "注意：本紙は情報のまとめであり、記載データは投資助言を構成するものではありません。"}}/*__END__*/;

  /* ===== 工具 ===== */
  function T(obj, lang) {

  function pad(n) { return n < 10 ? "0" + n : "" + n; }

    var y = d.getFullYear(), m = d.getMonth() + 1, day = d.getDate();

      + "<h2>" + titleHtml(sp.title, sp.hl, lang) + "</h2>"
      + '<div class="body">' + esc(T(sp.body, lang)) + "</div>"
      + '<div class="why"><b>' + esc(i18n.why) + "</b>" + esc(T(sp.why, lang)) + "</div>"
      + "</section>";
    // 分类
    html += '<div class="grid">';
    BRIEFING.sections.forEach(function (sec) {
      html += '<section class="card" id="' + sec.key + '" style="--ac:' + sec.color + "; --ac-deep:" + sec.deep + ';">'
        + '<div class="sec-head"><span class="sec-num">' + sec.num + "</span>"
        + "<h3>" + esc(T(sec.name, lang)) + "</h3>"
        + '<span class="en">' + sec.key.toUpperCase() + "</span></div>";
      (sec.items || []).forEach(function (it) {
        html += '<div class="item">';
        html += '<div class="t"><span class="idx">' + it.idx + "</span>";
        if (it.tag) html += '<span class="tag">' + esc(it.tag[lang] != null ? it.tag[lang] : i18n.tag) + "</span>";
        html += titleHtml(it.title, it.hl, lang) + "</div>";
        html += '<div class="d">' + esc(T(it.body, lang)) + "</div>";
        html += '<div class="why"><b>' + esc(i18n.why) + "</b>" + esc(T(it.why, lang)) + "</div>";
        html += "</div>";
      });
      html += "</section>";
    });
    html += "</div>";
    var content = document.getElementById("content");
    if (content) content.innerHTML = html;
    // 页脚
    var risk = document.getElementById("risk");
    if (risk) risk.textContent = T(BRIEFING.risk, lang);
  }

  function setLang(lang) {
    if (LANGS.indexOf(lang) < 0) lang = "zh";
    curLang = lang;
    langOpen = false;
    try { localStorage.setItem("timab_lang", lang); } catch (e) {}
    renderChrome(lang);
    renderContent(lang);
  }

  /* ===== 往期日历（保留原逻辑，文案随语言） ===== */
  function initCalendar() {
    var btn = document.getElementById("calBtn");
    var pop = document.getElementById("calPop");
    var grid = document.getElementById("calGrid");
    var title = document.getElementById("calTitle");
    if (!btn || !pop || !grid || !title) return;

    var parts = BRIEFING.date.split("-");
    var todayKey = parts[0].slice(2) + parts[1] + parts[2];
    var cur = { y: +parts[0], m: +parts[1] };
    var has = {};
    for (var i = 0; i < ARCHIVE_DATES.length; i++) { has[ARCHIVE_DATES[i]] = 1; }
    var HIST_BASE = /\/history\//.test(location.pathname) ? "./" : "history/";

    function ckey(y, m, d) { return String(y).slice(2) + pad(m) + pad(d); }

    function render() {
      var i18n = I18N[curLang];
      title.textContent = i18n.calTitle(cur.y, cur.m);
      grid.innerHTML = "";
      var start = new Date(cur.y, cur.m - 1, 1).getDay();
      var days = new Date(cur.y, cur.m, 0).getDate();
      for (var b = 0; b < start; b++) {
        var blank = document.createElement("span");
        blank.className = "cal-cell is-empty"; grid.appendChild(blank);
      }
      for (var d = 1; d <= days; d++) {
        var k = ckey(cur.y, cur.m, d);
        var cell = document.createElement("span");
        cell.className = "cal-cell" + (has[k] ? " has" : "") + (k === todayKey ? " is-today" : "");
        cell.textContent = d;
        if (has[k]) {
          cell.setAttribute("role", "link"); cell.setAttribute("tabindex", "0");
          cell.title = cur.y + "-" + pad(cur.m) + "-" + pad(d) + " 存档";
          (function (target) {
            var go = function () { window.open(HIST_BASE + target + ".html", "_blank", "noopener"); };
            cell.addEventListener("click", go);
            cell.addEventListener("keydown", function (e) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); go(); } });
          })(k);
        }
        grid.appendChild(cell);
      }
    }
    function toggle(open) {
      pop.hidden = !open;
      btn.setAttribute("aria-expanded", open ? "true" : "false");
      if (open) render();
    }
    btn.addEventListener("click", function (e) { e.stopPropagation(); toggle(pop.hidden); });
    document.getElementById("calPrev").addEventListener("click", function () { cur.m--; if (cur.m < 1) { cur.m = 12; cur.y--; } render(); });
    document.getElementById("calNext").addEventListener("click", function () { cur.m++; if (cur.m > 12) { cur.m = 1; cur.y++; } render(); });
    document.addEventListener("click", function (e) { if (!pop.hidden && !pop.contains(e.target)) toggle(false); });
    document.addEventListener("keydown", function (e) { if (e.key === "Escape" && !pop.hidden) toggle(false); });
  }

  /* ===== 启动 ===== */
  function boot() {
    curLang = detectLang();
    renderChrome(curLang);
    renderContent(curLang);
    initCalendar();
    // 关闭语言下拉：点击外部 / Esc
    document.addEventListener("click", function (e) {
      var ls = document.getElementById("langSwitch");
      if (ls && langOpen && !ls.contains(e.target)) {
        langOpen = false;
        ls.classList.remove("open");
        var t = document.getElementById("langTrigger");
        if (t) t.setAttribute("aria-expanded", "false");
      }
    });
    document.addEventListener("keydown", function (e) {
      if (e.key === "Escape" && langOpen) {
        langOpen = false;
        var ls = document.getElementById("langSwitch");
        if (ls) ls.classList.remove("open");
        var t = document.getElementById("langTrigger");
        if (t) t.setAttribute("aria-expanded", "false");
      }
    });
  }
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", boot);
  } else { boot(); }
})();
</script>
</body>
</html>
