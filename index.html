an by 0.234 for a First Gold", "es": "Juveniles de Dakar: la gimnasia china supera a Japón por 0,234 y logra el primer oro", "ja": "ダカール・ユース五輪、体操女子団体で中国が 0.234 点差で日本を破り初の金"}, "body": {"zh": "在 2026 年达喀尔青奥会体操女子团体决赛中，中国队以 0.234 分的微弱优势战胜日本队，夺得该项目青奥会历史上的首枚金牌。同日的田径赛场，中国队收获 2 银 1 铜。", "en": "In the women's gymnastics team final at the 2026 Dakar Youth Olympic Games, China beat Japan by 0.234 points to win the first gold medal ever awarded in the event at a Youth Olympics. On the same day China's athletics team took two silvers and a bronze.", "es": "En la final por equipos de gimnasia femenina de los Juegos Olímpicos de la Juventud de Dakar 2026, China superó a Japón por 0,234 puntos y logró el primer oro de la historia en esa prueba. En atletismo, China sumó dos platas y un bronce.", "ja": "2026 年ダカール・ユースオリンピックの体操女子団体決勝で、中国が日本を 0.234 点差で破り、この種目でユース五輪史上初の金メダルを手にした。同日の陸上では中国が銀 2、銅 1 を獲得した。"}, "why": {"zh": "0.234 分在体操里大约等于落地时多迈的一小步。青奥会不算大赛，但它是这批 15 到 18 岁选手第一次穿着国家队队服算总分——首金的重量，往往要等她们进成年组才看得出来。", "en": "In gymnastics 0.234 points is roughly one extra step on a landing. The Youth Olympics is not a major event, but it is the first time these 15-to-18-year-olds have worn national colours and had their scores added up — the weight of a first gold usually only becomes clear once they reach the senior ranks.", "es": "En gimnasia, 0,234 puntos equivalen más o menos a un paso de más en la caída. Los Juegos de la Juventud no son una gran cita, pero es la primera vez que estas chicas de 15 a 18 años compiten con la camiseta nacional y suman puntuaciones: el peso de un primer oro suele entenderse cuando llegan a la categoría absoluta.", "ja": "体操における 0.234 点は、着地で一歩余計に踏み出した程度に近い。ユース五輪は大きな大会ではないが、この 15〜18 歳の選手たちが初めて国の代表として得点を積み上げた舞台だ。初の金の重みは、シニアに上がってから分かることが多い。"}}]}, {"key": "hot", "num": "05", "color": "#6d28d9", "deep": "#55209f", "name": {"zh": "网络热点", "en": "TRENDING", "es": "TENDENCIAS", "ja": "ネット話題"}, "items": [{"idx": "01", "title": {"zh": "藏尸楼顶花坛 28 年：一审死刑，凶手曾改名整容潜逃", "en": "Twenty-Eight Years in a Rooftop Planter: Death Sentence for Killers Who Fled", "es": "Veintiocho años en una jardinera: condena de muerte para los asesinos que huyeron", "ja": "屋上のプランターに 28 年、被告に死刑判決　改名・整形して逃亡"}, "body": {"zh": "11 月 10 日，四川泸州“花坛白骨案”一审宣判。1997 年，因不想偿还 4 万元借款，陈某芬、杨某根将吴某萍杀害并掩埋于楼顶花坛。二人潜逃 28 年，期间改名、整容隐匿行踪；2008 年至 2025 年，陈某芬使用虚假身份证件办理护照、港澳台通行证等，多次用于民航订票乘机、铁路订票乘车、住宿、通讯、购房，并多次偷越国（边）境。法院判决：陈某芬犯故意杀人罪、伪造身份证件罪、使用虚假身份证件罪、偷越国（边）境罪，数罪并罚，决定执行死刑，剥夺政治权利终身，并处罚金 2.7 万元；杨某根犯故意杀人罪，判处死刑，缓期二年执行，剥夺政治权利终身。", "en": "A court in Luzhou, Sichuan, delivered a first-instance verdict on 10 November in the case of a skeleton found in a rooftop planter. In 1997, Chen Moufen and Yang Mougen killed Wu Mouping and buried the body in a planter on the roof to avoid repaying a 40,000-yuan loan. The two fled for 28 years, changing their names and undergoing plastic surgery. Between 2008 and 2025 Chen used forged identity documents to obtain passports and travel permits and to book flights and trains, stay in hotels, register phone numbers and buy property, and crossed the border illegally several times. The court sentenced Chen to death with lifetime deprivation of political rights and a 27,000-yuan fine on combined convictions of intentional homicide, forging identity documents, using forged identity documents and illegal border crossing, and gave Yang a two-year reprieve on a death sentence for intentional homicide, with lifetime deprivation of political rights.", "es": "Un tribunal de Luzhou (Sichuan) dictó el 10 de noviembre la sentencia de primera instancia del caso del esqueleto hallado en una jardinera de azotea. En 1997, Chen Moufen y Yang Mougen mataron a Wu Mouping y enterraron el cuerpo en una jardinera del tejado para no devolver un préstamo de 40.000 yuanes. Ambos huyeron durante 28 años, cambiando de nombre y sometiéndose a cirugía estética. Entre 2008 y 2025, Chen usó documentos de identidad falsos para obtener pasaportes y permisos de viaje, reservar vuelos y trenes, alojarse en hoteles, contratar teléfonos y comprar vivienda, y cruzó la frontera ilegalmente varias veces. El tribunal condenó a Chen a muerte con privación perpetua de derechos políticos y multa de 27.000 yuanes por homicidio intencional, falsificación y uso de documentos falsos y cruce ilegal de fronteras; Yang recibió pena de muerte con suspensión de dos años por homicidio intencional.", "ja": "11 月 10 日、四川省瀘州の中庭プランター白骨事件で一審判決が言い渡された。1997 年、4 万元の借金を返したくないという理由で、陳某芬と楊某根が呉某萍を殺害し、建物屋上のプランターに埋めた。2 人は 28 年間逃亡し、その間に改名や整形で身元を隠した。2008 年から 2025 年にかけ、陳某芬は偽造した身分証でパスポートや港澳台通行証を取得し、航空券・鉄道券の購入、宿泊、通信契約、不動産購入に使ったほか、度々国境を不正に越えた。裁判所は、陳某芬に殺人罪、身分証偽造罪、偽造身分証使用罪、国境不正越境罪の併合で死刑・政治権利終身剥奪・罰金 2 万 7000 元を、楊某根に殺人罪で死刑・執行猶予 2 年・政治権利終身剥奪を言い渡した。"}, "why": {"zh": "28 年、改名、整容、假证件一路办到护照和房产——这不是一桩“陈年旧案”，而是一条持续运转的造假链条。判决之外，更值得追问的是：假的身份证件为什么能一路通关。", "en": "Twenty-eight years, new names, surgery, and forged papers that carried them all the way to passports and property — this is not a cold case but a forgery pipeline that kept running. Beyond the verdict, the question is why false identities kept clearing every checkpoint.", "es": "Veintiocho años, nombres nuevos, cirugía y documentos falsos que llegaron hasta pasaportes y viviendas: no es un caso antiguo, sino una cadena de falsificación que siguió funcionando. Más allá de la sentencia, la pregunta es por qué las identidades falsas seguían pasando todos los controles.", "ja": "28 年、改名、整形、そして偽造書類でパスポートや不動産まで到達した。これは「昔の事件」ではなく、動き続けていた偽造の連鎖だ。判決以上に問われるべきは、なぜ偽の身分証が幾つもの関門を通れたのかである。"}}, {"idx": "02", "title": {"zh": "2026 年将成有记录以来最暖的 4 个年份之一", "en": "2026 Will Be Among the Four Warmest Years on Record", "es": "2026 será uno de los cuatro años más cálidos registrados", "ja": "2026 年は観測史上最も暖かい 4 年の一つに"}, "body": {"zh": "世界气象组织近日发布报告指出，厄尔尼诺事件预计将在 12 月达到有记录以来最强水平。报告显示，今年以来海平面与海洋热含量均创历史新高，2026 年将成为有记录以来最暖的 4 个年份之一。", "en": "A report released by the World Meteorological Organization says the El Niño event is expected to reach its strongest level on record in December. It notes that sea level and ocean heat content have both hit record highs this year, and that 2026 will be among the four warmest years ever recorded.", "es": "Un informe de la Organización Meteorológica Mundial señala que el episodio de El Niño alcanzará en diciembre su nivel más fuerte registrado. El documento indica que el nivel del mar y el contenido calorífico del océano han marcado máximos históricos este año, y que 2026 será uno de los cuatro años más cálidos jamás registrados.", "ja": "世界気象機関がこのほど公表した報告書は、エルニーニョ現象が 12 月に観測史上最強の水準に達する見込みだと指摘した。今年は海面水位と海洋熱含量がいずれも過去最高を更新し、2026 年は観測史上最も暖かい 4 年の一つになるという。"}, "why": {"zh": "“最暖的四个年份之一”听起来很温和，实际含义是：过去四年包揽了观测史上的前四名。厄尔尼诺在 12 月见顶，意味着明年的极端天气账单，今年只付了首付。", "en": "Among the four warmest sounds mild; what it means is that the past four years have taken the top four places in the record. With El Niño peaking in December, this year has only paid the down payment on next year's extreme-weather bill.", "es": "«Uno de los cuatro más cálidos» suena suave; en realidad significa que los últimos cuatro años ocupan los cuatro primeros puestos del registro. Con El Niño en su máximo en diciembre, este año solo ha pagado el anticipo de la factura de fenómenos extremos del próximo.", "ja": "「最も暖かい 4 年の一つ」は穏やかに聞こえるが、意味するところは過去 4 年が観測史上の上位 4 位を独占したということだ。エルニーニョが 12 月にピークを迎えるなら、来年の異常気象の請求書に対して、今年は手付金を払ったにすぎない。"}}, {"idx": "03", "title": {"zh": "“取消外卖”短视频批量摆拍：举横幅的商家，私下照常接单", "en": "The “Cancel Delivery Apps” Videos Were Staged: The Banner Holders Still Take Orders", "es": "Los vídeos de «cancelar el reparto» estaban montados: quien sostiene la pancarta sigue aceptando pedidos", "ja": "「出前をやめろ」動画は量産のやらせ、横断幕の店は今も注文を受けている"}, "body": {"zh": "近期，“取消外卖”“下架外卖”等话题在短视频平台持续传播。这些视频呈现明显的模板化特征：几乎一模一样的红色横幅、高度雷同的口播文案、不同城市的商家账号在短期内集体出镜。调查发现，其中不少是 MCN 机构设计的“暴力起号”套路——商家一边举横幅拍视频，一边私下照常接外卖订单，有的账号根本没有开通外卖业务，后续则推出代运营服务与创业培训课程。北京青年报发表评论《警惕流量闹剧挑动社会对立》，呼吁平台对高度雷同、模板化批量发布、刻意制造对立的内容建立识别机制，并对反复炒作的账号与关联机构限流、封禁、公示。", "en": "Topics such as cancel food delivery and delist delivery apps have been spreading on short-video platforms. The clips are visibly templated: nearly identical red banners, near-identical spoken scripts, and merchant accounts in different cities appearing together within a short window. Investigations found many are “brute-force account farming” run by MCN agencies — the merchants hold banners on camera while quietly continuing to accept delivery orders, some accounts never offered delivery at all, and the operations later sell agency services and entrepreneurship courses. Beijing Youth Daily ran a commentary warning that such traffic stunts stir social division, urging platforms to build detection for near-identical, mass-produced, deliberately divisive content and to throttle, ban and publicly name accounts and agencies that repeatedly run such campaigns.", "es": "Temas como «cancelar el reparto» o «retirar las apps de entrega» se han difundido en plataformas de vídeo corto. Los clips son visiblemente plantillas: pancartas rojas casi idénticas, guiones hablados casi iguales y cuentas de comercios de distintas ciudades apareciendo a la vez en pocos días. Las pesquisas hallaron que muchos son «granjas de cuentas» de agencias MCN: los comercios sostienen la pancarta ante la cámara mientras siguen aceptando pedidos, algunas cuentas nunca ofrecieron reparto, y después se venden servicios de gestión y cursos de emprendimiento. El diario Beijing Youth Daily publicó un comentario que alerta de que estas funciones de tráfico azuzan la división social y pide a las plataformas detectar contenidos casi idénticos, producidos en masa y deliberadamente divisivos, y limitar, cerrar y señalar públicamente las cuentas y agencias reincidentes.", "ja": "最近、「出前を廃止しろ」「出前アプリを外せ」といった話題がショート動画で拡散している。映像は明らかにテンプレート化されており、ほぼ同じ赤い横断幕、酷似した読み上げ原稿、異なる都市の店舗アカウントが短期間に一斉に登場する。調べによると、多くは MCN 業者が仕組んだ「荒稼ぎのアカウント育成」で、店はカメラの前で横断幕を掲げる一方、裏では普通に注文を受け、中には出前を一度も始めていないアカウントもあり、その後は代行運営サービスや起業講座を売り込んでいる。北京青年報は「流量の茶番が社会的分断を煽ることに警戒を」と題する評論を掲載し、酷似した大量投稿や対立を意図的に煽る内容の識別機制をつくり、繰り返すアカウントと関連業者を制限・凍結・公表するようプラットフォームに求めた。"}, "why": {"zh": "这类内容成本几乎为零，收益却是完整的商业闭环：情绪换流量、流量换代运营订单。真正被消耗的是公共讨论的空间——当“取消外卖”被反复炒热，骑手社保、商家佣金这些真问题反而没人问了。", "en": "These clips cost almost nothing and monetise in a complete loop: emotion buys traffic, traffic buys agency contracts. What gets spent is public attention — with cancel-delivery reheated every week, the real questions about rider benefits and merchant commissions go unasked.", "es": "Estos vídeos cuestan casi nada y se monetizan en un circuito completo: la emoción compra tráfico y el tráfico compra contratos de gestión. Lo que se gasta es el espacio de debate público: con el tema recalentado cada semana, las preguntas reales sobre cotizaciones de repartidores y comisiones de comercios quedan sin formular.", "ja": "こうした動画はほぼ無コストで、収益は完全な循環になる。感情が流量を呼び、流量が代行運営の契約を呼ぶ。消耗しているのは公共的議論の余白だ。「出前廃止」が繰り返し加熱されると、配達員の社会保険や店舗の手数料といった本題は誰も問わなくなる。"}}, {"idx": "04", "title": {"zh": "村里会计用 AI 手搓村务系统，上了热搜", "en": "A Village Bookkeeper Built His Own Admin System With AI", "es": "Un contable de aldea creó su propio sistema de gestión con IA", "ja": "村の会計係が AI で村務システムを自作、話題に"}, "body": {"zh": "近日，山东省泰安市宁阳县蒋集镇马庄村会计李奇利用 AI 自建村务管理系统的消息登上平台热搜，李奇也因此成了村里的“网红”。", "en": "News that Li Qi, bookkeeper of Mazhuang village in Jiangji township, Ningyang county, Tai'an, Shandong, built his own village administration system using AI has trended on social platforms, making him something of a local celebrity.", "es": "La noticia de que Li Qi, contable de la aldea de Mazhuang, en el municipio de Jiangji, condado de Ningyang (Tai'an, Shandong), creó su propio sistema de gestión administrativa con IA se ha vuelto tendencia en redes, y él se ha convertido en una celebridad local.", "ja": "山東省泰安市寧陽県蒋集鎮馬荘村の会計係、李奇氏が AI を使って村務管理システムを自作したことが SNS で話題になり、村の「有名人」になった。"}, "why": {"zh": "这件事的分量不在技术，而在“谁在用”：当一个村的会计能把表格、台账、通知这些琐事交给 AI 拼成一套系统，县域数字化的门槛就被重新标定了一次——不必等采购，先看看手边有什么。", "en": "The weight of this is not the technology but who is using it: when a village bookkeeper can turn forms, ledgers and notices into a working system with AI, the threshold for county-level digitalisation is reset — no need to wait for procurement, look at what is already to hand.", "es": "Lo importante no es la tecnología sino quién la usa: cuando un contable de aldea puede convertir formularios, registros y avisos en un sistema con IA, el umbral de la digitalización comarcal se recalibra: no hay que esperar una licitación, basta ver qué hay a mano.", "ja": "重要なのは技術ではなく「誰が使っているか」だ。村の会計係が帳票や台帳、通知といった雑務を AI で一つの仕組みにまとめられるなら、県レベルのデジタル化の敷居は引き直される。調達を待つ必要はなく、手元にあるものを見ればいい。"}}, {"idx": "05", "title": {"zh": "双 11 快递不再爆仓：从单日洪峰变成一个月的平稳波段", "en": "No More Double 11 Gridlock: From a One-Day Flood to a Month-Long Plateau", "es": "Se acabaron los colapsos del Doble 11: de una avalancha diaria a un mes estable", "ja": "ダブルイレブンの物流、単日の爆発から 1 か月の平準化へ"}, "body": {"zh": "随着电商大促战线拉长、商家分批发货，多地快递网点今年告别单日爆仓。以兰州为例，各大分拨中心每日进港快件被均匀摊开，分拣流水线全天负荷平稳，不再出现集中到货、车辆拥堵；主城区半日达、当日达覆盖面持续扩大，驿站、智能快递柜、社区代收点协同分流上门派送压力。铁路方面，今年双 11 网购高峰期快运服务为期 20 天，已于 11 月 1 日启动：每日安排约 1900 列设快运柜且有富余空间的高铁载客动车组、78 列设专门车厢或空间的动车组、43 列高铁确认列车和 3 列整列高铁快运列车，高铁快运能力预计同比增长 10%；“高铁急送”已覆盖 196 个主要城市，最快 4 小时门到门送达。", "en": "With the campaign stretched out and merchants shipping in batches, courier networks in many cities avoided their usual single-day pile-up this year. In Lanzhou, for example, daily inbound parcels at sorting centres are spread evenly, lines run at a steady load all day, and there are no longer spikes of concentrated arrivals or truck queues; same-day and half-day delivery keeps expanding in the main urban area, while pickup points, smart lockers and community collection desks absorb door-to-door pressure. On rail, this year's 20-day Double 11 express service began on 1 November: about 1,900 high-speed passenger trains with express cabinets and spare space, 78 trains with dedicated cars or space, 43 confirmation trains and three full express trains run daily, lifting high-speed express capacity by an estimated 10% year on year, while four-hour door-to-door service now covers 196 major cities.", "es": "Con la campaña alargada y los comercios enviando por tandas, las redes de mensajería de muchas ciudades evitaron este año el colapso de un solo día. En Lanzhou, por ejemplo, los paquetes que llegan a diario a los centros de clasificación se reparten de forma uniforme, las líneas trabajan con carga estable todo el día y ya no hay picos de llegadas concentradas ni colas de camiones; la entrega en medio día y en el día sigue ampliándose en la zona urbana, mientras los puntos de recogida, taquillas inteligentes y locales comunitarios absorben la presión del reparto a domicilio. En ferrocarril, el servicio exprés de 20 días para el Doble 11 arrancó el 1 de noviembre: unos 1.900 trenes de alta velocidad con armarios exprés y espacio libre, 78 trenes con vagones o espacios dedicados, 43 trenes de confirmación y tres trenes exclusivos de carga, con una capacidad un 10% superior interanual; la entrega puerta a puerta en cuatro horas cubre ya 196 ciudades.", "ja": "セール期間の長期化と店舗の分割発送により、多くの都市の宅配網は今年、単日に集中する物流崩壊を避けた。蘭州では、仕分けセンターへの日々の入荷が平準化され、仕分けラインは終日安定した負荷で稼働し、荷物の集中到着やトラックの渋滞は見られなくなった。市街地では半日・当日配送の範囲が広がり、宅配ロッカーや地域の受取拠点が戸別配送の負担を分散している。鉄道では、今年のダブルイレブン向け速達輸送が 11 月 1 日から 20 日間の予定で始まった。速達用ロッカーと余裕のある高速列車を 1 日約 1900 本、専用車両・スペースを持つ列車を 78 本、確認列車を 43 本、専用の高速貨物列車を 3 本運行し、高速輸送力は前年比 10% 増の見込み。「4 時間で戸口まで」のサービスは 196 の主要都市をカバーする。"}, "why": {"zh": "爆仓消失不是需求变少了，而是节奏被拉平了——背后是预售周期、分批发货和末端网络三件事同时成熟。对消费者意味着不用再盯着物流信息刷两天；对快递员，意味着不必再连熬两个通宵。", "en": "The gridlock did not disappear because demand fell but because the rhythm was flattened, as pre-sale cycles, batch shipping and last-mile networks matured together. For shoppers it means no more two days of refreshing tracking pages; for couriers, no more back-to-back all-nighters.", "es": "El colapso no desapareció porque cayera la demanda, sino porque el ritmo se aplanó, al madurar a la vez los ciclos de preventa, el envío por tandas y la red de última milla. Para el comprador significa no pasar dos días mirando el seguimiento; para el repartidor, no encadenar dos noches en vela.", "ja": "物流崩壊が消えたのは需要が減ったからではなく、リズムが平準化されたからだ。予約販売の周期、分割発送、末端網の三つが同時に成熟した結果である。利用者は追跡画面を 2 日眺め続けなくてよく、配達員は徹夜を 2 晩続けなくてよくなった。"}}]}, {"key": "ent", "num": "06", "color": "#db2777", "deep": "#ad1a5e", "name": {"zh": "娱乐八卦", "en": "ENTERTAINMENT", "es": "ESPECTÁCULOS", "ja": "エンタメ"}, "items": [{"idx": "01", "title": {"zh": "金鸡奖揭晓：梁家辉、高叶封帝后，《南京照相馆》拿最佳故事片", "en": "Golden Rooster Winners: Leung Ka-fai and Gao Ye Take Top Acting Honours", "es": "Premios Gallo de Oro: Leung Ka-fai y Gao Ye se llevan la interpretación", "ja": "金鶏賞発表、主演男優は梁家輝、主演女優は高葉、「南京照相館」が最優秀作品賞"}, "body": {"zh": "11 月 10 日晚，第 39 届中国电影金鸡奖颁奖典礼暨 2026 年中国金鸡百花电影节闭幕式在厦门海峡大剧院举行，20 个奖项揭晓。最佳故事片为《南京照相馆》，评委会特别奖授予《给阿嬷的情书》，该片编剧蓝鸿春、郑萱轩、杨冷、朱丽云获最佳编剧。梁家辉凭《捕风追影》中傅隆生一角获最佳男主角，高叶凭《南京照相馆》中林毓秀获最佳女主角。郑大圣凭《密档》获最佳导演，万力凭《震耳欲聋》获最佳新晋导演；吾守尔·赛来（《万桐书》）、兰西雅（《震耳欲聋》）分获最佳男、女配角。《浪浪山小妖怪》获最佳动画片，《菜肉馄饨》获最佳中小成本故事片。本届共 209 部影片报名，颁奖典礼由蓝羽、刘昊然、关晓彤、杜江主持。", "en": "The 39th Golden Rooster Awards, closing the 2026 China Golden Rooster and Hundred Flowers Film Festival, were presented at the Xiamen Straits Grand Theatre on the evening of 10 November, with 20 prizes handed out. Best Feature went to Nanjing Photo Studio and the jury special award to A Love Letter to Grandma, whose writers Lan Hongchun, Zheng Xuanxuan, Yang Leng and Zhu Liyun took best screenplay. Leung Ka-fai won best actor for his role as Fu Longsheng in The Shadow's Edge, and Gao Ye won best actress as Lin Yuxiu in Nanjing Photo Studio. Zheng Dasheng took best director for Classified Files and Wan Li was named best new director for Deafening; Wushur Sailai (Wan Tong Shu) and Lan Xiya (Deafening) won the supporting acting prizes. Langlangshan Little Monster took best animation and Chaos Huntun best low-budget feature. A total of 209 films entered, and the ceremony was hosted by Lan Yu, Liu Haoran, Guan Xiaotong and Du Jiang.", "es": "La 39.ª edición de los premios Gallo de Oro, que cerró el Festival de Cine Gallo de Oro y Cien Flores de China 2026, se entregó en el Gran Teatro del Estrecho de Xiamen la noche del 10 de noviembre, con 20 premios. La mejor película fue Nanjing Photo Studio y el premio especial del jurado, A Love Letter to Grandma, cuyos guionistas Lan Hongchun, Zheng Xuanxuan, Yang Leng y Zhu Liyun se llevaron el de guion. Leung Ka-fai ganó el de actor por su papel de Fu Longsheng en The Shadow's Edge, y Gao Ye el de actriz por Lin Yuxiu en Nanjing Photo Studio. Zheng Dasheng fue mejor director por Classified Files y Wan Li mejor director novel por Deafening; Wushur Sailai (Wan Tong Shu) y Lan Xiya (Deafening) ganaron los premios de reparto. Langlangshan Little Monster fue mejor animación y Chaos Huntun mejor película de bajo presupuesto. Se inscribieron 209 filmes y la gala fue presentada por Lan Yu, Liu Haoran, Guan Xiaotong y Du Jiang.", "ja": "11 月 10 日夜、第 39 回中国映画金鶏賞の授賞式兼 2026 年中国金鶏百花映画祭の閉幕式がアモイ海峡大劇場で行われ、20 の賞が発表された。最優秀作品賞は「南京照相館」、審査員特別賞は「給阿嬤的情書」で、同作の藍鴻春、鄭萱軒、楊冷、朱麗雲が最優秀脚本賞を受賞。主演男優賞は「捕風追影」の傅隆生役で梁家輝、主演女優賞は「南京照相館」の林毓秀役で高葉。監督賞は「密檔」の鄭大聖、新人監督賞は「震耳欲聾」の万力、助演男優賞は吾守爾・賽来（「万桐書」）、助演女優賞は蘭西雅（「震耳欲聾」）。アニメ映画賞は「浪浪山小妖怪」、低予算作品賞は「菜肉餛飩」。今期は 209 本が応募し、式典の司会は藍羽、劉昊然、関暁彤、杜江が務めた。"}, "why": {"zh": "五个影帝提名全是第一次入围，最后把奖给了梁家辉——评委会的选择很明确：新鲜面孔可以提名，但“演得住”仍是硬标准。《南京照相馆》同时拿下最佳故事片与影后，说明历史题材这一轮赢在“怎么讲”，不只是“讲什么”。", "en": "All five best-actor nominees were first-timers, and the prize went to Leung Ka-fai — the jury's message is clear: new faces can be nominated, but holding a role is still the bar. Nanjing Photo Studio taking both best feature and best actress shows that this round of historical filmmaking won on how the story is told, not just which story.", "es": "Los cinco nominados a mejor actor debutaban y el premio fue para Leung Ka-fai: el mensaje del jurado es claro, las caras nuevas pueden nominarse, pero sostener un papel sigue siendo el listón. Que Nanjing Photo Studio ganara película y actriz indica que este cine histórico ganó por cómo se cuenta, no solo por qué se cuenta.", "ja": "主演男優賞の候補 5 人は全員が初ノミネートで、賞は梁家輝に。審査員のメッセージは明確だ。新しい顔はノミネートされ得るが、「役を保つ力」が基準であることに変わりはない。「南京照相館」が作品賞と主演女優賞を同時に取ったことは、歴史題材が「何を語るか」だけでなく「どう語るか」で勝ったことを示す。"}}, {"idx": "02", "tag": {"zh": "进展"}, "title": {"zh": "《后会友期》市占率 92.5%，“厉娜体”把芒果超媒抬了近 200 亿", "en": "After We Meet Hits 92.5% Share as Mango Super Media Gains Nearly 20 Billion Yuan", "es": "After We Meet alcanza el 92,5% de cuota y Mango Super Media gana casi 20.000 millones", "ja": "「後会友期」シェア 92.5%、芒果超媒の時価総額が約 200 億元増"}, "body": {"zh": "云合数据显示，《后会友期》11 月 5 日正片有效播放市占率达到 92.5%，刷新 2024 年以来最高纪录，豆瓣评分 8.7。节目 10 月 22 日上线首日市占率仅 34.9%，10 月 29 日升至 74.3%，11 月 5 日冲到 92.5%；当天芒果 TV 因服务器过载一度无法正常登录，24 小时内相关热搜 157 个。许飞与厉娜在悬崖小屋对谈时说出的“我画地为牢啊，厉娜”迅速变成“厉娜体”，被网友和平台当作句尾使用。受此带动，芒果超媒本周股价涨幅达 46.9%，市值增长近 196 亿元。", "en": "Yunhe data show After We Meet reached a 92.5% share of effective plays among new variety shows on 5 November, the highest since 2024, with a Douban score of 8.7. It opened at 34.9% on 22 October, rose to 74.3% on 29 October and hit 92.5% on 5 November, the day Mango TV's servers overloaded and users briefly could not log in; it generated 157 trending topics within 24 hours. The line “I drew a circle and stood in it, Lina”, spoken by Xu Fei and Li Na in a cliffside cabin, became a suffix people append to sentences online and in the platform's own copy. Mango Super Media rose 46.9% on the week, adding nearly 19.6 billion yuan in market value.", "es": "Los datos de Yunhe muestran que After We Meet alcanzó el 5 de noviembre una cuota del 92,5% de reproducciones efectivas entre los programas nuevos, la más alta desde 2024, con un 8,7 en Douban. Arrancó con un 34,9% el 22 de octubre, subió al 74,3% el 29 y llegó al 92,5% el 5 de noviembre, día en que los servidores de Mango TV se saturaron y los usuarios no pudieron entrar; generó 157 temas trending en 24 horas. La frase «me dibujé un círculo, Lina», dicha por Xu Fei y Li Na en una cabaña junto al acantilado, se convirtió en un sufijo que la gente añade a las frases. Mango Super Media subió un 46,9% en la semana y sumó casi 19.600 millones de yuanes de capitalización.", "ja": "雲合データによると、「後会友期」は 11 月 5 日の本編有効再生シェアが 92.5% に達し、2024 年以来の最高記録を更新、豆瓣の評価は 8.7。10 月 22 日の初日は 34.9% だったが、10 月 29 日に 74.3%、11 月 5 日には 92.5% へ。同日は芒果 TV のサーバー過負荷で一時ログインできなくなり、24 時間で関連のトレンドが 157 件に上った。崖の小屋での許飛と厲娜の対話から生まれた「私は自分で線を引いて囲った、厲娜」という言葉は「厲娜構文」として文末に付けられるようになった。これを受け、芒果超媒の株価は週間で 46.9% 上昇し、時価総額は約 196 億元増えた。"}, "why": {"zh": "一档“全员糊咖”的综艺把同期长剧、短剧的注意力一起吸走，说明观众不缺内容，缺的是没有剧本的对话。这句话之所以能变成句尾，是因为每个人心里都有一句没说完的旧账。", "en": "A show with no stars drained attention from long dramas and short dramas alike, which suggests audiences are not short of content but of unscripted conversation. The line works as a suffix because everyone is carrying an old account they never finished settling.", "es": "Un programa sin estrellas absorbió la atención de series largas y cortas por igual, lo que sugiere que al público no le falta contenido sino conversación sin guion. La frase funciona como coletilla porque todos cargan con una cuenta antigua que nunca cerraron.", "ja": "「全員無名」の番組が同期的な長編ドラマやショートドラマの注目を吸い上げたのは、視聴者がコンテンツではなく「台本のない会話」に飢えている証拠だ。この言葉が文末に使われるのは、誰の胸にも言い終えていない昔の貸しがあるからだ。"}}, {"idx": "03", "title": {"zh": "何九华被拍雨天撑伞搂肩同行，女方身份未公开", "en": "He Jiuhua Filmed Sharing an Umbrella; Companion Unidentified", "es": "Graban a He Jiuhua compartiendo paraguas; la identidad de ella no se revela", "ja": "何九華、雨の中を相合傘で並ぶ姿を撮られる　相手の身元は非公開"}, "body": {"zh": "11 月 10 日，有摄影师发布视频称拍到何九华雨天开车载一名女生返回住处，下车后主动撑伞、全程搂肩同行，两人一同进入小区。女方身份未曝光。截至当日，何九华及工作室均未回应。相关话题阅读量突破 2000 万，登上文娱热搜；网友态度两极，一方认为双方均处单身、开启新感情合理，另一方则翻出他与王鸥的旧绯闻追问时间线。", "en": "On 10 November a photographer released video said to show He Jiuhua driving a woman home in the rain, then holding an umbrella for her and walking with an arm around her shoulder into a residential compound. The woman has not been identified. He and his studio had not responded by the end of the day. The topic passed 20 million views and trended in entertainment, dividing commenters between those who note both appear to be single and those revisiting his earlier rumoured relationship with Wang Ou and asking about the timeline.", "es": "El 10 de noviembre un fotógrafo publicó un vídeo que, según él, muestra a He Jiuhua llevando a una mujer a casa bajo la lluvia, sujetando el paraguas y caminando con el brazo sobre su hombro hasta entrar en una urbanización. La identidad de ella no se ha revelado. Ni él ni su estudio habían respondido al cierre de la jornada. El tema superó los 20 millones de lecturas y entró en tendencias de entretenimiento, con opiniones divididas: unos señalan que ambos parecen solteros y otros recuerdan su antiguo rumor con Wang Ou y preguntan por la cronología.", "ja": "11 月 10 日、あるカメラマンが、何九華が雨の中を女性を車で送り、降車後に自ら傘を差し、肩を抱いて一緒に団地へ入る様子を捉えたとする動画を公開した。女性の身元は明らかになっていない。同日時点で本人と事務所はコメントしていない。関連話題は閲覧数 2000 万を超えて芸能トレンド入りし、双方が独身なら新しい交際は自然だという声と、王鴎との過去の噂を持ち出して時系列を問う声で意見が割れている。"}, "why": {"zh": "画面是事实，关系是推测——这两件事在网络讨论里经常被合并成一件。当事人不回应时，舆论场会自动用旧料补空白，这也是娱乐新闻最容易失真的地方。", "en": "The footage is a fact, the relationship is an inference — and online these two are routinely merged. When nobody responds, the discussion fills the gap with old material, which is exactly where entertainment reporting goes wrong most often.", "es": "Las imágenes son un hecho y la relación una deducción, pero en internet ambas se funden. Cuando nadie responde, la conversación rellena el hueco con material antiguo, y ahí es donde la información de espectáculos se distorsiona más.", "ja": "映像は事実、関係は推測。この二つはネット上でしばしば一つにまとめられる。当事者が黙っていると、議論は古い材料で空白を埋める。芸能報道が最も歪みやすいのはまさにそこだ。"}}, {"idx": "04", "title": {"zh": "金晨凌晨发文怼 AI 造谣：没澄清、不住海边、没有妹妹", "en": "Jin Chen Takes On AI Rumours: No Clarification, No Seaside Villa, No Sister", "es": "Jin Chen desmonta los rumores creados con IA: ni aclaración, ni villa, ni hermana", "ja": "金晨、AI によるでっち上げに反論「澄清も海辺の家も妹もない」"}, "body": {"zh": "11 月 10 日 0 时 49 分，金晨发微博写道：“没澄清，不住海边，没有妹妹，我在哪澄清的啊”。起因是她 11 月 8 日发布了一条三亚搬家 vlog，随后一批通稿为她“编”出完整澄清长文、海边别墅，甚至凭空多出一个妹妹。粉丝追查发现，多个账号锚定真实素材，其余内容靠 AI 补全。", "en": "At 00:49 on 10 November, actress Jin Chen posted: “No clarification, I don't live by the sea, I have no sister — where exactly did I clarify?” It followed a Sanya moving vlog she posted on 8 November, after which a batch of syndicated articles produced a full clarification statement, a seaside villa and even an invented sister. Fans found that several accounts anchored real material and used AI to fill in the rest.", "es": "A las 00.49 del 10 de noviembre, la actriz Jin Chen publicó: «No he aclarado nada, no vivo junto al mar, no tengo hermana, ¿dónde supuestamente aclaré?». Todo partió de un vlog de mudanza en Sanya que subió el 8 de noviembre, tras el cual una tanda de notas fabricó un comunicado completo, una villa frente al mar e incluso una hermana inexistente. Los seguidores comprobaron que varias cuentas anclaban material real y completaban el resto con IA.", "ja": "11 月 10 日 0 時 49 分、女優の金晨が「澄清なんてしていない、海辺にも住んでいない、妹もいない。どこで澄清したというの」と投稿した。発端は 11 月 8 日に投稿した三亜への引っ越し vlog で、その後に配信された記事群が「完全な澄清文」や海辺の別荘、さらには存在しない妹まで作り上げた。ファンの追跡で、複数のアカウントが本物の素材に AI で補完した内容を組み合わせていたことが分かった。"}, "why": {"zh": "这条辟谣最有价值的地方，是它示范了一种新的识别方法：真素材加 AI 补全，比全盘捏造更难分辨。看见“某某亲口回应”，先去主页翻原博——这大概是今年最实用的一条媒介素养。", "en": "The useful part of this rebuttal is the detection method it demonstrates: real material plus AI padding is harder to spot than pure fabrication. When you see “so-and-so responded personally”, check their own feed first — probably the most practical media-literacy lesson of the year.", "es": "Lo valioso de este desmentido es el método de detección que muestra: material real más relleno de IA es más difícil de detectar que una invención completa. Si ves «fulano lo dijo personalmente», busca primero su cuenta: la lección de alfabetización mediática más útil del año.", "ja": "この反論の価値は、新しい見分け方を示した点にある。本物の素材に AI で補完する手口は、完全な捏造よりも見抜きにくい。「本人がこう言った」を見たら、まず本人のアカウントで元投稿を確認する。今年もっとも実用的なメディアリテラシーの一課だろう。"}}, {"idx": "05", "title": {"zh": "《等风热吻你》开机：杨洋、陈都灵时隔 11 年再合作", "en": "Waiting for the Wind Begins Shooting: Yang Yang and Chen Duling Reunite After 11 Years", "es": "Waiting for the Wind arranca: Yang Yang y Chen Duling vuelven a coincidir 11 años después", "ja": "「等風熱吻你」がクランクイン、楊洋と陳都霊が 11 年ぶり共演"}, "body": {"zh": "11 月 10 日，改编自唧唧的猫同名小说的剧集《等风热吻你》官宣全阵容并同步开机。杨洋、陈都灵领衔主演，分饰法医许星纯与演员付雪梨，两人继 2015 年电影《左耳》后时隔 11 年再度合作。王菊、左小青、乔振宇、严屹宽、程潇等加盟，李青蓉、瞿友宁联合执导，腾讯视频出品，共 24 集，在无锡、上海两地开机。", "en": "On 10 November the drama Waiting for the Wind, adapted from Ji Ji's Mao's novel of the same name, announced its full cast and began shooting. Yang Yang and Chen Duling lead as the forensic pathologist Xu Xingchun and the actress Fu Xueli, their first collaboration since the 2015 film The Left Ear. Wang Ju, Zuo Xiaoqing, Qiao Zhenyu, Yan Yikuan and Cheng Xiao also star, with Li Qingrong and Qu Youning co-directing for Tencent Video; the 24-episode series shoots in Wuxi and Shanghai.", "es": "El 10 de noviembre la serie Waiting for the Wind, adaptada de la novela homónima de Ji Ji's Mao, anunció su reparto completo y comenzó a rodar. Yang Yang y Chen Duling encabezan como el forense Xu Xingchun y la actriz Fu Xueli, su primer reencuentro desde la película The Left Ear de 2015. También participan Wang Ju, Zuo Xiaoqing, Qiao Zhenyu, Yan Yikuan y Cheng Xiao, con dirección conjunta de Li Qingrong y Qu Youning para Tencent Video; son 24 episodios y se rueda en Wuxi y Shanghái.", "ja": "11 月 10 日、唧唧的猫の同名小説を原作とするドラマ「等風熱吻你」が全キャストを発表し、同時にクランクインした。楊洋と陳都霊が主演し、法医学者・許星純と女優・付雪梨を演じる。2015 年の映画「左耳」以来 11 年ぶりの共演となる。王菊、左小青、喬振宇、厳屹寛、程瀟らも出演し、李青蓉と瞿友寧が共同監督、騰訊視頻製作、全 24 話。無錫と上海で撮影が行われる。"}, "why": {"zh": "“《左耳》之后 11 年”是这部剧最省力的宣传点，也是最难兑现的承诺——观众买的是回忆，验的却是两个人这 11 年的演技增量。改编剧真正的胜负手，还在原著粉认不认这两个人。", "en": "“Eleven years after The Left Ear” is the easiest selling point and the hardest promise to keep: audiences buy the memory but will judge the acting gained in those years. For an adaptation, the decisive vote still belongs to readers of the original.", "es": "«Once años después de The Left Ear» es el gancho más fácil y la promesa más difícil: el público compra el recuerdo pero juzga lo que han crecido como actores. En una adaptación, el voto decisivo sigue siendo el de los lectores de la novela.", "ja": "「『左耳』から 11 年」は最も楽な宣伝文句であり、最も果たしにくい約束でもある。観客が買うのは記憶だが、試されるのはこの 11 年で積んだ演技力だ。原作ものの勝敗を決めるのは、結局のところ原作ファンがこの 2 人を認めるかどうかである。"}}]}], "risk": {"zh": "风险提示：本简报仅作信息汇总，其中涉及的数据不构成任何投资建议。", "en": "Risk notice: this briefing is a summary of information only; the data involved does not constitute investment advice.", "es": "Aviso de riesgo: este boletín es solo un resumen informativo y los datos citados no constituyen asesoramiento de inversión.", "ja": "リスク提示：このブリーフィングは情報の要約のみを目的としており、記載のデータは投資助言を構成するものではありません。"}}/*__END__*/;

    html += '<section class="spotlight" id="pick">'
      + '<div class="badge"><i></i>' + esc(T(sp.badge, lang)) + "</div>"
      + "<h2>" + titleHtml(sp.title, sp.hl, lang) + "</h2>"
      + '<div class="body">' + esc(T(sp.body, lang)) + "</div>"
      + '<div class="why"><b>' + esc(i18n.why) + "</b>" + esc(T(sp.why, lang)) + "</div>"
      + "</section>";
    // 分类
    html += '<div class="grid">';
    BRIEFING.sections.forEach(function (sec) {
      html += '<section class="card" id="' + sec.key + '" style="--ac:' + sec.color + "; --ac-deep:" + sec.deep + ';">'
        + '<div class="sec-head"><span class="sec-num">' + sec.num + "</span>"
        + "<h3>" + esc(T(sec.name, lang)) + "</h3>"
        + '<span class="en">' + sec.key.toUpperCase() + "</span></div>";
      (sec.items || []).forEach(function (it) {
        html += '<div class="item">';
        html += '<div class="t"><span class="idx">' + it.idx + "</span>";
        if (it.tag) html += '<span class="tag">' + esc(it.tag[lang] != null ? it.tag[lang] : i18n.tag) + "</span>";
        html += titleHtml(it.title, it.hl, lang) + "</div>";
        html += '<div class="d">' + esc(T(it.body, lang)) + "</div>";
        html += '<div class="why"><b>' + esc(i18n.why) + "</b>" + esc(T(it.why, lang)) + "</div>";
        html += "</div>";
      });
      html += "</section>";
    });
    html += "</div>";
    var content = document.getElementById("content");
    if (content) content.innerHTML = html;
    // 页脚
    var risk = document.getElementById("risk");
    if (risk) risk.textContent = T(BRIEFING.risk, lang);
  }

  function setLang(lang) {
    if (LANGS.indexOf(lang) < 0) lang = "zh";
    curLang = lang;
    langOpen = false;
    try { localStorage.setItem("timab_lang", lang); } catch (e) {}
    renderChrome(lang);
    renderContent(lang);
  }

  /* ===== 往期日历（保留原逻辑，文案随语言） ===== */
  function initCalendar() {
    var btn = document.getElementById("calBtn");
    var pop = document.getElementById("calPop");
    var grid = document.getElementById("calGrid");
    var title = document.getElementById("calTitle");
    if (!btn || !pop || !grid || !title) return;

    var parts = BRIEFING.date.split("-");
    var todayKey = parts[0].slice(2) + parts[1] + parts[2];
    var cur = { y: +parts[0], m: +parts[1] };
    var has = {};
    for (var i = 0; i < ARCHIVE_DATES.length; i++) { has[ARCHIVE_DATES[i]] = 1; }
    var HIST_BASE = /\/history\//.test(location.pathname) ? "./" : "history/";

    function ckey(y, m, d) { return String(y).slice(2) + pad(m) + pad(d); }

    function render() {
      var i18n = I18N[curLang];
      title.textContent = i18n.calTitle(cur.y, cur.m);
      grid.innerHTML = "";
      var start = new Date(cur.y, cur.m - 1, 1).getDay();
      var days = new Date(cur.y, cur.m, 0).getDate();
      for (var b = 0; b < start; b++) {
        var blank = document.createElement("span");
        blank.className = "cal-cell is-empty"; grid.appendChild(blank);
      }
      for (var d = 1; d <= days; d++) {
        var k = ckey(cur.y, cur.m, d);
        var cell = document.createElement("span");
        cell.className = "cal-cell" + (has[k] ? " has" : "") + (k === todayKey ? " is-today" : "");
        cell.textContent = d;
        if (has[k]) {
          cell.setAttribute("role", "link"); cell.setAttribute("tabindex", "0");
          cell.title = cur.y + "-" + pad(cur.m) + "-" + pad(d) + " 存档";
          (function (target) {
            var go = function () { window.open(HIST_BASE + target + ".html", "_blank", "noopener"); };
            cell.addEventListener("click", go);
            cell.addEventListener("keydown", function (e) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); go(); } });
          })(k);
        }
        grid.appendChild(cell);
      }
    }
    function toggle(open) {
      pop.hidden = !open;
      btn.setAttribute("aria-expanded", open ? "true" : "false");
      if (open) render();
    }
    btn.addEventListener("click", function (e) { e.stopPropagation(); toggle(pop.hidden); });
    document.getElementById("calPrev").addEventListener("click", function () { cur.m--; if (cur.m < 1) { cur.m = 12; cur.y--; } render(); });
    document.getElementById("calNext").addEventListener("click", function () { cur.m++; if (cur.m > 12) { cur.m = 1; cur.y++; } render(); });
    document.addEventListener("click", function (e) { if (!pop.hidden && !pop.contains(e.target)) toggle(false); });
    document.addEventListener("keydown", function (e) { if (e.key === "Escape" && !pop.hidden) toggle(false); });
  }

  /* ===== 启动 ===== */
  function boot() {
    curLang = detectLang();
    renderChrome(curLang);
    renderContent(curLang);
    initCalendar();
    // 关闭语言下拉：点击外部 / Esc
    document.addEventListener("click", function (e) {
      var ls = document.getElementById("langSwitch");
      if (ls && langOpen && !ls.contains(e.target)) {
        langOpen = false;
        ls.classList.remove("open");
        var t = document.getElementById("langTrigger");
        if (t) t.setAttribute("aria-expanded", "false");
      }
    });
    document.addEventListener("keydown", function (e) {
      if (e.key === "Escape" && langOpen) {
        langOpen = false;
        var ls = document.getElementById("langSwitch");
        if (ls) ls.classList.remove("open");
        var t = document.getElementById("langTrigger");
        if (t) t.setAttribute("aria-expanded", "false");
      }
    });
  }
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", boot);
  } else { boot(); }
})();
</script>
