む余地はない』とし、ベテランの招集基準はより厳しく年功では選ばないと説明。アジアカップが約 1 年延期され、W 杯予選が優先課題になったとも述べた。"}, "why": {"zh": "三连败之后的第一场，对手又是残阵——「赢了不算本事、输了没法交代」，这是教练最难站的位置。", "en": "The first game after three straight defeats, against a depleted opponent: winning proves little, losing is indefensible. The hardest place for a coach to stand.", "es": "El primer partido tras tres derrotas y ante un rival diezmado: ganar demuestra poco, perder no se explica. El lugar más incómodo para un entrenador.", "ja": "3 連敗後の初戦で、相手は主力不在。勝っても評価されず、負ければ言い訳が立たない。監督にとって最も難しい立ち位置だ。"}}, {"idx": "05", "title": {"zh": "曼联官宣解雇主帅卡里克：开局令人失望，但「永远是曼联传奇」", "en": "Manchester United sack Michael Carrick: a disappointing start, but forever a legend", "es": "El Manchester United destituye a Michael Carrick: inicio decepcionante, leyenda para siempre", "ja": "マンチェスター・ユナイテッドがカリック監督を解任『失望の開幕』も『永遠のレジェンド』"}, "body": {"zh": "11 月 12 日，曼联俱乐部发布公告，宣布迈克尔·卡里克不再担任一线队主教练。声明称：「由于球队本赛季开局表现令人失望，俱乐部经过慎重考虑，最终作出这一艰难决定，认为有必要进行调整，以实现俱乐部的既定目标。」公告同时强调，卡里克「现在是、今后也永远会是曼联传奇」，并称他球员时代即以最高标准展现敬业精神与职业态度，上赛季的领导力和成就将被珍视和铭记。曼联尚未公布新任主教练人选。", "en": "Manchester United announced on 12 November that Michael Carrick would no longer manage the first team. A club statement said that with the season's start disappointing, and after careful consideration, the board had taken the difficult decision that a change was needed to meet its objectives. It stressed that Carrick is and always will be a United legend, that he showed the highest standards of professionalism as a player, and that his leadership and achievements last season would be treasured. No successor has been named.", "es": "El Manchester United anunció el 12 de noviembre que Michael Carrick deja de ser entrenador del primer equipo. El comunicado señala que, ante un arranque de temporada decepcionante y tras una reflexión cuidadosa, el club tomó la difícil decisión de que era necesario un cambio para cumplir sus objetivos. Subraya que Carrick es y será siempre una leyenda del United, que como jugador mostró el máximo nivel de profesionalidad y que su liderazgo y logros de la temporada pasada serán valorados y recordados. No se ha anunciado sustituto.", "ja": "マンチェスター・ユナイテッドは 11 月 12 日、マイケル・カリック氏がトップチームの監督を退任すると発表した。声明は『今季の開幕戦績が失望させるものだったため、クラブは慎重に検討した末、目標達成のために変化が必要だとの難しい判断を下した』と説明。カリック氏は『現在も、今後も永遠にユナイテッドのレジェンド』であり、選手時代から最高水準のプロ意識を示し、昨季のリーダーシップと成果は記憶されると強調した。後任は未発表。"}, "why": {"zh": "换帅不是战术调整，是给一段「过渡期」划句号；但真正的考题——阵容结构与引援逻辑——换个人也还在。", "en": "This is less a tactical reset than a full stop on an interim chapter. The real exam, squad structure and recruitment logic, survives the change of manager.", "es": "Más que un ajuste táctico, es el punto final a un capítulo interino. El examen real, la estructura de la plantilla y la lógica de fichajes, sobrevive al cambio.", "ja": "これは戦術の調整ではなく、『移行期』に終止符を打つ人事だ。本当の課題である陣容構成と補強の論理は、監督が変わっても残る。"}}]}, {"key": "hot", "num": "05", "color": "#6d28d9", "deep": "#55209f", "name": {"zh": "网络热点", "en": "TRENDING", "es": "TENDENCIAS", "ja": "ネット話題"}, "items": [{"idx": "01", "title": {"zh": "双 11 全网卖了 17764 亿元，同比增 4.8%", "en": "Double 11 tops 1.78 trillion yuan in sales, up 4.8% year on year", "es": "El Doble 11 supera 1,78 billones de yuanes en ventas, un 4,8% más", "ja": "ダブル 11 の販売総額 1 兆 7764 億元、前年比 4.8% 増"}, "body": {"zh": "星图数据 11 月 12 日发布的数据显示，今年双 11 全网电商销售总额达到 17764 亿元，同比增长 4.8%。这一年的双 11 延续了此前的长周期特征，但在消费行为和消费趋势上呈现新变化：平台不只卖商品，消费者发现核算更轻松，规则简化成为共同的调整方向。同期，微信「看一看」页面新增「短剧」入口，目前处于小范围灰度测试阶段，用户可通过该入口查看最近看过的短剧；接近腾讯的知情人士称，此举是为让用户更方便找到喜欢的短剧内容、让创作者的好内容被更多人看见。", "en": "Data released by Syntun on 12 November put total online retail sales across platforms during this year's Double 11 shopping festival at 1.7764 trillion yuan, up 4.8% year on year. The event kept its long-window format but showed new shifts in behaviour: platforms are selling more than goods, shoppers found the discount maths easier, and simplifying the rules became a shared direction. In the same period, WeChat's Top Stories page added a short-drama entry, now in limited grey-scale testing, letting users find dramas they recently watched; a person close to Tencent said the aim is to help users find content they like and give creators more visibility.", "es": "Los datos publicados por Syntun el 12 de noviembre sitúan las ventas minoristas online totales del Doble 11 de este año en 1,7764 billones de yuanes, un 4,8% más interanual. La cita mantuvo su formato de ventana larga pero mostró cambios de comportamiento: las plataformas venden más que productos, a los compradores les resultó más fácil el cálculo de descuentos y simplificar las reglas se convirtió en una dirección común. En el mismo periodo, la página de WeChat donde se ven contenidos añadió una entrada de microdramas, en pruebas limitadas, que permite ver los que se han visto recientemente; una fuente cercana a Tencent dijo que el objetivo es facilitar el descubrimiento de contenido y dar visibilidad a los creadores.", "ja": "星図データが 11 月 12 日に発表したところによると、今年のダブル 11 のネット通販売上総額は 1 兆 7764 億元で前年比 4.8% 増。長期型の開催は続いたが、消費行動には変化が見られた。プラットフォームは商品だけでなく体験も売り、消費者は割引計算がしやすくなり、ルール簡素化が共通の方向になった。同じ時期、WeChat の『看一看』にショートドラマの入口が追加され、小規模なグレースケールテスト中。最近見た作品を確認できる。テンセントに近い関係者によれば、ユーザーが好みの作品を見つけやすくし、創作者の内容をより多くの人に見せる狙いがあるという。"}, "why": {"zh": "增速回到个位数，说明大促的「脉冲」正在变成「日常」；平台开始比谁更省心，而不是谁更热闹。", "en": "Growth back in single digits means the festival's pulse is becoming everyday routine. Platforms now compete on being less tiring, not louder.", "es": "Que el crecimiento vuelva a un dígito muestra que el pulso de la gran promoción se está volviendo rutina. Las plataformas compiten por cansar menos, no por hacer más ruido.", "ja": "伸びが 1 桁に戻ったのは、大型セールの『脈拍』が日常になったということ。プラットフォームは賑やかさより、手間の少なさを競い始めた。"}}, {"idx": "02", "title": {"zh": "大一新生被电诈 180 万元：骗子让他搬出宿舍、切断与外界联系", "en": "A freshman lost 1.8 million yuan to scammers who isolated him from everyone", "es": "Un estudiante de primero pierde 1,8 millones de yuanes tras ser aislado por los estafadores", "ja": "大学 1 年生が 180 万元の詐欺被害、犯人は寮を出て連絡を絶つよう指示"}, "body": {"zh": "据首都医科大学通报及媒体报道，一名大一新生遭遇冒充公检法类电信诈骗，损失 180 万元。骗子要求其搬出宿舍、切断与他人沟通，先后让其取现 20 万元现金及 450 克黄金，又骗其购买 37 万元虚拟货币、转账 71 万元。该学生在回顾经历时表示，骗子利用其顾虑、信息差以及对未知后果的恐惧，一步步瓦解了判断力。学校在通报中公开这段经历，希望帮助师生识别冒充公检法诈骗，避免再次受骗。", "en": "A first-year student at Capital Medical University lost 1.8 million yuan to a scam in which callers impersonated police and prosecutors, according to a university notice and media reports. The scammers told him to move out of his dormitory and cut contact with others, then had him withdraw 200,000 yuan in cash and 450 grams of gold, buy 370,000 yuan of virtual currency and transfer 710,000 yuan. Recalling the episode, the student said the fraudsters used his anxieties, information gaps and fear of unknown consequences to dismantle his judgement step by step. The university published the account to help staff and students recognise impersonation scams.", "es": "Un estudiante de primero de la Universidad Médica Capital perdió 1,8 millones de yuanes en una estafa en la que los autores se hicieron pasar por policías y fiscales, según un aviso de la universidad y medios locales. Los estafadores le pidieron mudarse del dormitorio y cortar el contacto con los demás, y luego le hicieron retirar 200.000 yuanes en efectivo y 450 gramos de oro, comprar 370.000 yuanes en moneda virtual y transferir 710.000 yuanes. Al recordar lo ocurrido, el estudiante dijo que los delincuentes usaron sus preocupaciones, la falta de información y el miedo a consecuencias desconocidas para desmontar su criterio paso a paso. La universidad difundió el caso para ayudar a reconocer este tipo de fraude.", "ja": "首都医科大学の通報と報道によると、1 年生が警察・検察を名乗る詐欺に遭い 180 万元を失った。犯人は寮を出て他人との連絡を断つよう指示し、現金 20 万元と金 450 グラムを引き出させ、さらに 37 万元分の仮想通貨を購入させ、71 万元を送金させた。学生は、犯人が不安、情報格差、未知の結果への恐れを利用して判断力を少しずつ崩したと振り返った。大学は同じ被害を防ぐため、この体験を公表した。"}, "why": {"zh": "180 万不是「贪心」的代价，是「恐惧 + 隔离」的产物——所有反诈宣传里最难防的一步，是让人相信不能告诉任何人。", "en": "The 1.8 million was not the price of greed but of fear plus isolation. The hardest step in any anti-fraud campaign is the instruction that you must tell no one.", "es": "Los 1,8 millones no son el precio de la codicia sino del miedo más el aislamiento. El paso más difícil de contrarrestar es la orden de no contárselo a nadie.", "ja": "180 万元は『欲』の代償ではなく、『恐怖＋孤立』の産物だ。防詐広告で最も防ぎにくい一手は、『誰にも言うな』と言わせることにある。"}}, {"idx": "03", "title": {"zh": "「饭店老板给母女塞钱」系摆拍，重庆梁平已立案调查", "en": "Viral restaurant kindness video was staged, Chongqing district opens investigation", "es": "El vídeo viral de la generosidad de un restaurante era un montaje; Liangping abre investigación", "ja": "『食堂店主が母子に現金』はやらせ、重慶梁平が立件調査"}, "body": {"zh": "11 月 12 日，重庆市梁平区联合调查组发布情况通报：近期，「一饭店老板悄悄为连吃 7 碗米饭母女放钱」视频引发关注，经网信、公安、民政、市场监管等部门组成的联合调查组核查，李某（女，57 岁，餐馆运营人）为博取关注、吸引流量，编造虚假情节、组织人员摆拍、制作视频发布，相关内容误导公众认知，造成不良影响，扰乱正常网络公共秩序。目前相关部门已对其立案调查，对涉嫌违法行为将依法处理。此前视频称，一对母女进店只点了一份 6 元炒豆芽，母亲给女儿夹菜后自己就着菜吃了 7 碗米饭，结账时老板打包又加炒两个菜，还悄悄在袋里塞了钱。", "en": "The joint investigation team of Liangping district in Chongqing said on 12 November that a viral video in which a restaurant owner secretly slipped money to a mother and daughter who ate seven bowls of rice had been staged. The team, drawn from cyberspace, police, civil affairs and market regulation departments, found that Li, a 57-year-old restaurant operator, fabricated the story, organised the filming and posted it to attract attention and traffic, misleading the public and disrupting online order. A case has been opened. The original video claimed the pair ordered only a six-yuan plate of bean sprouts, that the mother ate seven bowls of rice with the dish, and that the owner added two dishes and hid cash in the takeaway bag.", "es": "El equipo de investigación del distrito de Liangping, en Chongqing, informó el 12 de noviembre de que un vídeo viral en el que una dueña de restaurante daba dinero a escondidas a una madre y su hija que comieron siete cuencos de arroz era un montaje. El equipo, formado por autoridades de internet, policía, asuntos civiles y regulación de mercado, concluyó que Li, de 57 años y responsable del local, inventó la historia, organizó la grabación y la publicó para captar atención y tráfico, desinformando al público y alterando el orden en línea. Se ha abierto una investigación. El vídeo original afirmaba que solo pidieron un plato de brotes de soja de seis yuanes y que la dueña añadió dos platos y escondió dinero en la bolsa.", "ja": "重慶市梁平区の合同調査班は 11 月 12 日、『食堂の店主が 7 杯のご飯を食べた母子にそっと現金を渡した』という動画はやらせだったと通報した。ネット情報、公安、民政、市場監督の各部門による調査で、57 歳の飲食店経営者 Li 氏が注目と流入を狙って虚偽の筋書きを作り、撮影を手配して公開したと認定。世論を誤導しネットの秩序を乱したとして立件した。元の動画は、母子が 6 元の炒めもやしだけを注文し、店主が追加で 2 品を作って袋に現金を入れたとしていた。"}, "why": {"zh": "善意是最容易被租用的情绪；这类摆拍消耗的不是流量，是下一次真事发生时公众的相信。", "en": "Goodwill is the easiest emotion to rent. Staged kindness does not just burn traffic; it spends the public's willingness to believe the next true story.", "es": "La bondad es la emoción más fácil de alquilar. Estos montajes no gastan tráfico, gastan la credibilidad que hará falta la próxima vez que algo sea cierto.", "ja": "善意は最も『レンタル』しやすい感情だ。こうしたやらせが消費するのは再生数ではなく、次に本当のことが起きたときの信頼である。"}}, {"idx": "04", "title": {"zh": "「曝熊大被写死了」冲上热搜第一，片方澄清：失踪不等于死亡", "en": "Rumour that Briar Bear dies tops Chinese trending charts; studio says missing is not dead", "es": "El rumor de que el oso Briar muere lidera las tendencias; el estudio lo desmiente", "ja": "『熊大が死んだ』がトレンド 1 位、制作側は『失踪は死ではない』と否定"}, "body": {"zh": "近日，国民动画 IP《熊出没》因新作预告引发热议：有观众称预告中光头强表示熊大已离世十年，熊二是臆想出来的幻象，「曝熊大被写死了」话题 11 月 12 日冲上热搜第一。11 月 11 日，「熊二动漫」配合华强方特（深圳）动漫有限公司发布澄清声明，称网传「熊大死了」系不实谣言，传言源头为线下粉丝交流活动观众的个人主观转述，部分自媒体将「熊大失踪」断章取义改写为「熊大死亡」以引流；对照国家电影局备案梗概，《熊出没·我们》仅写到熊二找不到熊大、熊大失踪，全文未提及熊大死亡或牺牲，「失踪不等于死亡」。导演回应称熊大只是「暂时离开」，「虽然这个预告看起来有点……但肯定是个温情向的故事」。", "en": "The long-running animation franchise Boonie Bears set off a storm with a new trailer: viewers said it showed Logger Vick telling Baloo that Briar had been dead for ten years and existed only in his imagination, and the claim that Briar had been written out topped Chinese trending topics on 12 November. On 11 November a fan channel, working with Fantawild Animation, issued a statement calling the death rumour false: the story originated in an audience member's subjective retelling at an offline fan event, and some self-media outlets turned Briar being missing into Briar being dead to farm clicks. The film's filing synopsis with the China Film Administration says only that Baloo cannot find Briar and that Briar is missing, with no mention of death or sacrifice. The director said Briar has merely left for now and that the film is definitely a warm story.", "es": "La longeva franquicia animada Boonie Bears desató una tormenta con un nuevo avance: parte del público dijo que en él el leñador Víctor contaba que Briar llevaba diez años muerto y solo existía en la imaginación de Baloo, y la afirmación de que el personaje había sido eliminado lideró las tendencias chinas el 12 de noviembre. El 11 de noviembre un canal de fans, junto con Fantawild Animation, emitió un comunicado que calificó el rumor de falso: el relato nació de la interpretación subjetiva de un asistente a un evento, y algunos medios convirtieron la desaparición en muerte para atraer clics. La sinopsis registrada ante la administración cinematográfica solo indica que Baloo no encuentra a Briar y que este ha desaparecido, sin mencionar muerte ni sacrificio. El director dijo que Briar solo se ha ido por un tiempo y que la película es sin duda una historia cálida.", "ja": "国民的アニメ『熊出没』が新作予告で話題沸騰。予告でログ・ヴィックが『熊大は 10 年前に死に、熊二の想像上の存在だ』と語ったとの指摘が広がり、『熊大が殺された』という話題が 11 月 12 日にトレンド 1 位となった。11 月 11 日、ファンチャンネルがファンタウィルドとともに声明を発表し、死亡説は事実無根だと否定。発端はオフラインイベントでの観客の主観的な伝聞で、一部の自媒体が『失踪』を『死亡』に書き換えて集客したという。国家映画局に届け出た梗概には熊二が熊大を見つけられず、熊大が失踪したとだけ書かれ、死亡や犠牲には触れていない。監督は『熊大は一時的に離れただけ』『この予告は少しアレだが、間違いなく温かい物語だ』と述べた。"}, "why": {"zh": "一个 IP 经营十四年，主角的「生死」已经不完全属于创作方——它属于一代人的童年记忆，所以一点提示就能引爆。", "en": "After fourteen years, whether the lead lives or dies no longer belongs entirely to the studio: it belongs to a generation's childhood, which is why a hint is enough to detonate.", "es": "Tras catorce años, la vida o muerte del protagonista ya no pertenece del todo al estudio: pertenece a la infancia de una generación, y por eso una pista basta para detonar.", "ja": "14 年続いた IP では、主人公の生死はもはや制作側だけのものではない。ある世代の幼少期の記憶に属しており、ほんの示唆で爆発する。"}}, {"idx": "05", "title": {"zh": "山姆布丁橙吃出活体树蛙，商家按食品安全法赔付 1000 元", "en": "Live tree frog found in a Sam's Club orange box; 1,000-yuan statutory payout", "es": "Una rana viva en una caja de naranjas de Sam's Club; indemnización legal de 1.000 yuanes", "ja": "サムズクラブのオレンジ箱に生きたカエル、食品安全法に基づき 1000 元賠償"}, "body": {"zh": "11 月 10 日，北京一女子称在山姆会员商店（北京房山店）购买一箱布丁橙，拆开吃了一个后，当晚发现包装箱内有一只活体树蛙，随即扔掉箱子并联系商家。11 月 12 日，该女子表示，商家已按食品安全法给予惩罚性赔偿 1000 元，并将剩余橙子送检。该门店工作人员称暂不方便透露具体情况，将记录并反馈给相关部门。", "en": "A woman in Beijing said she bought a box of pudding oranges at the Sam's Club store in Fangshan on 10 November, ate one, and that night found a live tree frog inside the packaging. She discarded the box and contacted the store. On 12 November she said the retailer had paid 1,000 yuan in punitive compensation under the Food Safety Law and sent the remaining oranges for testing. Store staff said they could not disclose details and would pass the matter to the relevant departments.", "es": "Una mujer de Pekín dijo haber comprado el 10 de noviembre una caja de naranjas en la tienda de Sam's Club de Fangshan, comió una y esa noche encontró una rana arbórea viva dentro del envase. Tiró la caja y contactó con el establecimiento. El 12 de noviembre señaló que la empresa le había pagado 1.000 yuanes de indemnización punitiva conforme a la Ley de Seguridad Alimentaria y había enviado el resto de naranjas a analizar. El personal de la tienda dijo que no podía dar detalles y que trasladaría el asunto a los departamentos correspondientes.", "ja": "北京の女性が 11 月 10 日、サムズクラブ北京房山店でオレンジを 1 箱購入し、1 個食べたところ、その夜に箱の中に生きたアカガエルを見つけたと投稿。箱を捨てて店に連絡した。11 月 12 日、食品安全法に基づく懲罰的賠償 1000 元を受け取り、残りのオレンジは検査に出したと説明。店側は詳細は控えるとし、関係部署に報告するとした。"}, "why": {"zh": "1000 元是法定最低赔偿线，它解决的是「赔」，不解决「怎么进来的」——后者才是供应链该回答的问题。", "en": "The 1,000 yuan is the statutory floor. It settles compensation; it does not answer how the frog got in, which is the supply chain's question to answer.", "es": "Los 1.000 yuanes son el mínimo legal. Resuelven la compensación, no explican cómo entró la rana, que es la pregunta que debe responder la cadena de suministro.", "ja": "1000 元は法定の最低ライン。賠償は解決するが、『どう入ったか』は解決しない。それはサプライチェーンが答えるべき問いだ。"}}]}, {"key": "ent", "num": "06", "color": "#db2777", "deep": "#ad1a5e", "name": {"zh": "娱乐八卦", "en": "CULTURE", "es": "CULTURA", "ja": "芸能"}, "items": [{"idx": "01", "tag": {"zh": "进展"}, "title": {"zh": "刘欢 11 月 12 日安葬北京，妻子卢璐公开信披露十四年病情", "en": "Liu Huan buried in Beijing as his wife's letter reveals a fourteen-year illness", "es": "Liu Huan es enterrado en Pekín mientras la carta de su esposa revela catorce años de enfermedad", "ja": "劉歓氏が北京で埋葬、妻の公開書簡が 14 年間の病を明かす"}, "body": {"zh": "11 月 12 日，央视前主持人水均益受刘欢妻子卢璐委托发布公开信《他是这样的人》，同日刘欢安葬于北京，水均益、毛阿敏等人给予协助。信中披露：2012 年 9 月录制《中国好声音》期间，刘欢确诊膀胱原位癌早期，本人不愿声张、家人一同守密十四年，婉拒各类邀约以保障复查与治疗；治疗一度有效，五年后复发，医生曾建议切除膀胱，他表示「宁死不背尿袋」。离世前半年多他在上海接受治疗，试用新药后病灶曾出现缩小，9 月初突发严重腹泻入院，感染持续加重，最终抢救无效去世。死亡医学证明书载明死因为感染性休克。刘欢于 9 月 25 日在上海病逝，享年 63 岁；遵其生前遗愿，不举行遗体告别仪式和追悼会。", "en": "On 12 November former CCTV host Shui Junyi published an open letter titled He Is This Kind of Person on behalf of Liu Huan's wife Lu Lu, the same day the singer was buried in Beijing with help from Shui, Mao Amin and others. The letter disclosed that Liu was diagnosed with early-stage carcinoma in situ of the bladder in September 2012 while recording The Voice of China, that he did not want it known and the family kept the secret for fourteen years, declining engagements to protect his check-ups and treatment. Treatment worked for a time before a recurrence five years later; doctors suggested removing his bladder and he refused, saying he would rather die than carry a bag. He spent his last half year in treatment in Shanghai, where a new drug briefly shrank the lesions, before severe diarrhoea in early September led to an infection that worsened until resuscitation failed. The medical certificate lists septic shock as the cause. Liu died in Shanghai on 25 September aged 63; per his wishes there was no farewell ceremony or memorial.", "es": "El 12 de noviembre el ex presentador de CCTV Shui Junyi publicó, en nombre de la esposa de Liu Huan, Lu Lu, una carta abierta titulada Así es él, el mismo día en que el cantante fue enterrado en Pekín con ayuda de Shui, Mao Amin y otros. La carta reveló que Liu fue diagnosticado en septiembre de 2012, durante la grabación de The Voice of China, de un carcinoma in situ de vejiga en fase inicial; no quiso que se supiera y la familia guardó el secreto catorce años, rechazando compromisos para proteger revisiones y tratamiento. El tratamiento funcionó un tiempo antes de una recaída cinco años después; los médicos propusieron extirpar la vejiga y él se negó, diciendo que prefería morir antes que llevar una bolsa. Pasó su último medio año en tratamiento en Shanghái, donde un fármaco nuevo redujo brevemente las lesiones, hasta que una diarrea grave a principios de septiembre derivó en una infección que empeoró hasta que la reanimación falló. El certificado médico consigna shock séptico. Liu murió en Shanghái el 25 de septiembre a los 63 años; por su voluntad no hubo ceremonia de despedida ni funeral.", "ja": "11 月 12 日、元 CCTV 司会者の水均益氏が劉歓氏の妻・盧璐氏の依頼で公開書簡『彼はこういう人だった』を発表した。同日、劉歓氏は北京で埋葬され、水氏や毛阿敏氏らが協力した。書簡によれば、2012 年 9 月に『中国好声音』収録中に膀胱の上皮内がん（早期）と診断され、本人は公表を望まず家族が 14 年間秘密を守り、検査と治療のため各種の依頼を断ってきた。治療は一時奏功したが 5 年後に再発。医師は膀胱の摘出を勧めたが『尿袋をつけてまで生きるのは嫌だ』と拒んだ。最後の半年余りは上海で治療を受け、新薬で病巣が一時縮小したものの、9 月初旬に重い下痢で入院し感染が悪化、救命できなかった。死亡証明書の死因は感染性ショック。劉歓氏は 9 月 25 日に上海で死去、63 歳。遺志により告別式や追悼会は行われていない。"}, "why": {"zh": "十四年的隐瞒不是「人设」，是一个人对舞台和家人的双重体面；这封公开信，也让此前两个月的各种版本有了答案。", "en": "Fourteen years of silence was not image management but a double dignity, toward the stage and toward his family. The letter finally answers the versions that circulated for two months.", "es": "Catorce años de silencio no fueron imagen, sino una doble dignidad: ante el escenario y ante la familia. La carta responde por fin a las versiones que circularon dos meses.", "ja": "14 年の沈黙は『人設』ではなく、舞台と家族に対する二重の品位だった。この書簡が、2 か月流れた様々な版にようやく答えを与えた。"}}, {"idx": "02", "title": {"zh": "斯泰西·基奇去世：《越狱》里的典狱长，和一座牙签搭的泰姬陵", "en": "Stacy Keach dies: the Prison Break warden and a Taj Mahal built from toothpicks", "es": "Muere Stacy Keach: el alcaide de Prison Break y un Taj Mahal de palillos", "ja": "ステイシー・キーチ氏死去『プリズン・ブレイク』の所長と爪楊枝のタージ・マハル"}, "body": {"zh": "据其妻子玛尔戈西亚发布的讣告，美国知名演员斯泰西·基奇 11 月 10 日在波兰家中辞世，此前他与严重心脏病和心力衰竭长期斗争，「战斗了很久，展现了非凡的勇气、决心和力量」。基奇以「硬汉专业户」著称，荧屏上多扮演硬汉侦探；对中国观众而言，最难忘的是他在 2005 年开播的美剧《越狱》中塑造的温柔典狱长亨利·波普，以及那座用牙签和木条一点点搭起来的「泰姬陵」。该剧首播创下福克斯七年来最高周一收视纪录，此后推出四季，成为美剧史上至今讨论不衰的经典。", "en": "American actor Stacy Keach died at his home in Poland on 10 November after a long struggle with severe heart disease and heart failure, according to a notice from his wife, Malgosia. She said he fought for a long time with extraordinary courage, determination and strength. Keach was known for playing hard-boiled detectives, but for Chinese audiences the defining role was the gentle warden Henry Pope in Prison Break, which debuted in 2005, along with the Taj Mahal he built toothpick by toothpick. The show's premiere set Fox's best Monday ratings in seven years and ran four seasons, becoming a durable classic.", "es": "El actor estadounidense Stacy Keach falleció el 10 de noviembre en su casa de Polonia tras una larga lucha contra una grave enfermedad cardíaca e insuficiencia cardíaca, según un comunicado de su esposa, Malgosia, quien dijo que peleó mucho tiempo con valor, determinación y fuerza extraordinarios. Keach era conocido por interpretar detectives duros, pero para el público chino el papel decisivo fue el amable alcaide Henry Pope en Prison Break, estrenada en 2005, junto al Taj Mahal que construyó palillo a palillo. El estreno marcó el mejor lunes de Fox en siete años y la serie tuvo cuatro temporadas, convirtiéndose en un clásico duradero.", "ja": "米国の俳優ステイシー・キーチ氏が 11 月 10 日、ポーランドの自宅で死去した。妻マルゴシア氏の発表によれば、重い心疾患と心不全と長く闘い、『並外れた勇気と決意、力を見せた』という。キーチ氏は硬派な刑事役で知られたが、中国の観客にとって忘れられないのは 2005 年開始の『プリズン・ブレイク』で演じた穏やかな所長ヘンリー・ポープと、爪楊枝と木片で少しずつ組み上げた『タージ・マハル』だ。初回は FOX の月曜として 7 年ぶりの高視聴率を記録し、全 4 シーズンが作られ、今も語られる古典となっている。"}, "why": {"zh": "他演的是监狱里最温和的那个人——在一个关于越狱的故事里，他代表「还愿意讲道理」的那部分。", "en": "He played the gentlest man in the prison. In a story about escape, he stood for the part that still wanted to reason.", "es": "Interpretó al hombre más amable de la prisión. En una historia sobre fugas, representaba la parte que todavía quería razonar.", "ja": "彼は刑務所で最も穏やかな人物を演じた。脱獄の物語の中で、『まだ話が通じる部分』を体現していた。"}}, {"idx": "03", "title": {"zh": "赵丽颖起诉红果短剧侵犯肖像权，案件已开庭", "en": "Zhao Liying sues short-drama app Hongguo over portrait rights", "es": "Zhao Liying demanda a la app de microdramas Hongguo por derechos de imagen", "ja": "趙麗穎氏がショートドラマアプリ『紅果』を肖像権侵害で提訴、すでに開廷"}, "body": {"zh": "11 月 12 日消息，红果短剧的运营主体北京笔墨留香科技有限公司新增开庭公告，案由涉及肖像权纠纷，原告方为演员赵丽颖，被告方为北京抖音信息服务有限公司、北京笔墨留香科技有限公司及史某伦；开庭法院为北京市门头沟区人民法院云法庭，开庭时间为 2026 年 11 月 10 日。北京笔墨留香科技有限公司成立于 2021 年 7 月，注册资本 100 万元，经营范围包含广播电视节目制作、电视剧制作、互联网信息服务、电影发行等，由北京抖音信息服务有限公司全资持股，旗下产品为红果短剧 App。网传多家报道提及索赔 81 万元，但该金额存在口径分歧，有媒体指出可能对应另一起侵权案，本次开庭公告未披露具体索赔信息。", "en": "A court hearing notice dated 12 November shows a portrait-rights case brought by actress Zhao Liying against Beijing Bimo Liuxiang Technology, which operates the Hongguo short-drama app, along with Beijing Douyin Information Service and an individual named Shi. The hearing was held at the Yuntribunal of the Mentougou District People's Court in Beijing on 10 November 2026. Bimo Liuxiang was founded in July 2021 with 1 million yuan of registered capital, produces broadcast and TV programmes and film distribution, and is wholly owned by Beijing Douyin Information Service. Several reports mentioned a claim of 810,000 yuan, but accounts differ and some media suggested the figure belongs to a separate case; the hearing notice does not disclose the amount sought.", "es": "Un aviso de vista judicial del 12 de noviembre muestra una demanda por derechos de imagen de la actriz Zhao Liying contra Beijing Bimo Liuxiang Technology, operadora de la app de microdramas Hongguo, junto con Beijing Douyin Information Service y una persona identificada como Shi. La vista se celebró en el juzgado telemático del Tribunal Popular del Distrito de Mentougou (Pekín) el 10 de noviembre de 2026. Bimo Liuxiang se fundó en julio de 2021 con un millón de yuanes de capital registrado, produce programas audiovisuales y distribuye cine, y es propiedad íntegra de Beijing Douyin Information Service. Varios medios citaron una reclamación de 810.000 yuanes, pero las cifras discrepan y algunos señalan que correspondería a otro caso; el aviso no revela el importe.", "ja": "11 月 12 日、ショートドラマアプリ『紅果』を運営する北京筆墨留香科技などに対する肖像権侵害訴訟の開廷公告が出た。原告は女優の趙麗穎氏、被告は北京抖音信息服務、北京筆墨留香科技、および史某。開廷は 2026 年 11 月 10 日、北京市門頭溝区人民法院のオンライン法廷。筆墨留香は 2021 年 7 月設立、登録資本 100 万元で、放送番組制作や映画配給などを手がけ、北京抖音信息服務が全額出資している。81 万元の賠償請求と報じる例もあるが金額の扱いには幅があり、別件を指す可能性も指摘される。今回の公告に請求額の記載はない。"}, "why": {"zh": "短剧拿真人脸当「引流素材」已成行业默认操作；一个演员起诉，等于给这条灰色流水线标了价。", "en": "Using real faces as clickbait material has become standard practice in short drama. One actress suing effectively puts a price tag on that grey pipeline.", "es": "Usar rostros reales como cebo ya es práctica habitual en el microdrama. Que una actriz demande pone precio a esa cadena gris.", "ja": "実在の顔を『集客素材』にするのは短劇業界の既定動作になっている。一人の女優の提訴は、その灰色の流れに値段を付けたことになる。"}}, {"idx": "04", "title": {"zh": "金晨深夜发文又秒删，「回应回归《现在就出发 4》」上热搜", "en": "Jin Chen posts and deletes at 3 a.m., and a variety-show return tops the charts", "es": "Jin Chen publica y borra de madrugada y su regreso a un programa lidera las tendencias", "ja": "金晨氏が深夜の投稿を即削除、『就現在出発 4』復帰がトレンドに"}, "body": {"zh": "11 月 13 日凌晨，人在云南的演员金晨更新动态，写下「再一次作为一名大傻子」，没过多久便迅速删除。短短一句话配上深夜时间点，很快被外界与《现在就出发 4》的回归联系到一起，话题「金晨回应回归现在就出发 4」登上热搜。11 月 12 日，金晨以飞行嘉宾身份参与了《现在就出发 4》昆明收官站的录制，路透画面显示她上岸后与沈腾、白敬亭、黄景瑜、范丞丞等老成员挨个击掌，还与常驻嘉宾王楚然首次同框热聊。据悉，她此次是作为飞行嘉宾返场收官录制，并非重新拿回常驻席位。金晨本人未对发文原因作进一步解释，粉丝多认为这是在调侃自己在节目游戏中的表现，呼吁不必过度解读。", "en": "In the early hours of 13 November, actress Jin Chen, then in Yunnan, posted that she was once again playing the fool, then deleted it minutes later. The short line, posted late at night, was quickly tied to her return to the variety show Let's Go Now 4, and the topic trended. On 12 November she took part as a guest in the Kunming finale recording, footage showing her high-fiving Shen Teng, Bai Jingting, Huang Jingyu and Fan Chengcheng and chatting with regular Wang Churan. She appeared as a guest for the finale rather than regaining a regular slot. Jin has not explained the post; fans read it as self-deprecation about a game on the show and urged people not to over-interpret.", "es": "En la madrugada del 13 de noviembre, la actriz Jin Chen, entonces en Yunnan, publicó que volvía a hacer el tonto y borró el mensaje minutos después. La frase, publicada de noche, se vinculó pronto con su regreso al programa Let's Go Now 4 y el tema se volvió tendencia. El 12 de noviembre participó como invitada en la grabación final en Kunming; las imágenes la muestran chocando manos con Shen Teng, Bai Jingting, Huang Jingyu y Fan Chengcheng y charlando con la habitual Wang Churan. Fue una aparición como invitada para el final, no la recuperación de un puesto fijo. Jin no ha explicado el mensaje; los fans lo leen como autocrítica por un juego y piden no sobreinterpretar.", "ja": "11 月 13 日未明、雲南にいた女優の金晨氏が『もう一度大ばか者として』と投稿し、ほどなく削除した。深夜の一言はすぐに『就現在出発 4』への復帰と結びつけられ、話題がトレンド入り。11 月 12 日、彼女はゲストとして昆明の最終収録に参加し、岸に上がって沈騰、白敬亭、黄景瑜、范丞丞らとハイタッチし、レギュラーの王楚然とも初共演した。今回は最終回のゲスト出演で、レギュラー復帰ではない。本人は投稿の理由を説明しておらず、ファンは番組内のゲームでの自分を揶揄したものとして深読みを戒めている。"}, "why": {"zh": "一条秒删的微博能顶一条官宣——现在的综艺营销，最贵的往往是「没说完的话」。", "en": "A deleted post outperformed an official announcement. In variety marketing today, the most expensive thing is often the sentence left unfinished.", "es": "Un mensaje borrado rindió más que un anuncio oficial. En el marketing televisivo actual, lo más caro suele ser la frase que no se termina.", "ja": "削除された投稿が公式発表を上回った。今のバラエティ宣伝で最も高いのは、『言い切らない言葉』である。"}}, {"idx": "05", "title": {"zh": "肖战上海开唱、杨紫拿「金天使」：一场没有同框的热搜", "en": "Xiao Zhan sells out Shanghai, Yang Zi wins a Golden Angel: a trending story with no shared frame", "es": "Xiao Zhan llena Shanghái y Yang Zi gana el Ángel Dorado: tendencia sin foto conjunta", "ja": "肖戦が上海公演、楊紫が『金天使賞』 同じ夜に並んだ二つの話題"}, "body": {"zh": "11 月 12 日，热搜被两个名字占满。肖战「出口·我们」巡演上海站在梅赛德斯连开两场，两万张票有 418 万人标记「想看」，抢票比例约 200:1；唱到《轻轻》时台下数千人接唱整段，他摘下耳返两度哽咽，说「真的没想到你们都会」。这部剧的片尾曲来自《小城良方》，该剧 11 月 4 日在央八收官，爱奇艺热度破 10096、豆瓣 8.0，是平台首部破万的医疗剧；倪大红、王彦霖、姜妍等到场，王彦霖送来两束各 999 朵红玫瑰。同一天，杨紫凭《生命树》中白菊一角获第 22 届中美电视节年度最佳女主角，领奖词是「人生没有白走的路，每一步都算数」；她上半年刚获白玉兰奖。两人自 2019 年后七年未同框，11 月 6 日又恰好是杨紫生日与肖战巡演上海首场，日期巧合让讨论多了一层。", "en": "Two names filled China's trending charts on 12 November. Xiao Zhan played two nights at Mercedes-Benz Arena in Shanghai on his tour, with 4.18 million people marking 20,000 tickets as wanted — roughly 200 buyers per seat. When he reached the ballad Qing Qing, thousands sang the whole verse; he took out his in-ear monitor and choked up twice, saying he had not expected it. The song is the ending theme of a medical drama that finished on CCTV-8 on 4 November with iQiyi heat above 10,096 and a Douban score of 8.0, the platform's first medical series past 10,000; cast members including Ni Dahong and Wang Yancheng attended, the latter bringing two bouquets of 999 red roses. The same day, Yang Zi won best actress at the 22nd China-US TV Festival for her role in The Tree of Life, saying no step in life is wasted; she had won a Magnolia award earlier in the year. The two have not appeared together since 2019, and 6 November happened to be both her birthday and his Shanghai opener.", "es": "Dos nombres coparon las tendencias chinas el 12 de noviembre. Xiao Zhan dio dos conciertos en el Mercedes-Benz Arena de Shanghái dentro de su gira: 4,18 millones de personas marcaron como deseadas 20.000 entradas, unos 200 compradores por asiento. Al llegar a la balada Qing Qing, miles cantaron el verso completo; se quitó el monitor de oído y se emocionó dos veces, diciendo que no lo esperaba. La canción es el tema final de una serie médica que terminó en CCTV-8 el 4 de noviembre con una temperatura en iQiyi superior a 10.096 y un 8,0 en Douban, la primera del género en superar los 10.000 en la plataforma; acudieron intérpretes como Ni Dahong y Wang Yancheng, este último con dos ramos de 999 rosas rojas. Ese mismo día, Yang Zi ganó el premio a mejor actriz del 22.º Festival de Televisión China-EE. UU. por The Tree of Life y dijo que ningún paso se desperdicia; antes había logrado un premio Magnolia. No coinciden públicamente desde 2019, y el 6 de noviembre era a la vez su cumpleaños y el estreno de la gira.", "ja": "11 月 12 日、中国のトレンドは二つの名前で埋まった。肖戦は上海メルセデス・ベンツアリーナでツアー公演を 2 日間開催し、2 万枚のチケットに 418 万人が『見たい』を付け、倍率は約 200 倍。バラード『輕輕』では数千人が一節を歌い切り、彼はイヤモニを外して二度声を詰まらせ『本当に皆が歌えるとは思わなかった』と話した。この曲は 11 月 4 日に CCTV-8 で最終回を迎えた医療ドラマの主題歌で、iQiyi の热度は 10096 超、Douban 8.0、同平台初の 1 万超え医療ドラマ。倪大紅や王彦霖らが会場に駆けつけ、王彦霖は 999 本の赤いバラを 2 束贈った。同日、楊紫は『生命樹』の白菊役で第 22 回中米テレビ祭の最優秀主演女優賞を受賞し『無駄な道はない』と語った。今年上半期には白玉蘭賞も受賞している。二人は 2019 年以降同枠がなく、11 月 6 日が彼女の誕生日と上海公演初日が重なったことも話題を重ねた。"}, "why": {"zh": "观众消费的早已不只是作品，而是「平行发生」的巧合感；平台没安排同框，热搜自己完成了叙事。", "en": "Audiences now consume coincidence as much as content. No one staged a shared frame; the trending list wrote the story itself.", "es": "El público consume tanto la coincidencia como la obra. Nadie organizó una foto juntos; la lista de tendencias escribió el relato sola.", "ja": "観客が消費しているのは作品だけではなく『並行して起きる偶然』だ。共演を仕込んだわけではないのに、トレンドが自ら物語を作った。"}}]}], "risk": {"zh": "风险提示：本简报仅作信息汇总，其中涉及的数据不构成任何投资建议。", "en": "Disclaimer: this briefing is a summary of information only; the data involved does not constitute investment advice.", "es": "Aviso: este boletín es solo un resumen informativo; los datos citados no constituyen asesoramiento de inversión.", "ja": "免責事項：本ブリーフィングは情報の要約であり、記載のデータは投資助言を構成するものではありません。"}}/*__END__*/;

  };
  var LANGS = ["zh", "en", "es", "ja"];
  var LANG_LABEL = { "zh": "中文", "en": "EN", "es": "ES", "ja": "日本語" };

  // 小国旗（内联 SVG，避免外部图标依赖与 emoji 平台差异）
  function flag(lang) {
    if (lang === "zh") return '<svg class="fl" viewBox="0 0 30 20" aria-hidden="true"><rect width="30" height="20" fill="#de2910"/><g fill="#ffde00"><circle cx="5" cy="4" r="2.2"/><circle cx="9" cy="2.4" r="0.8"/><circle cx="10" cy="4" r="0.8"/><circle cx="9" cy="5.6" r="0.8"/><circle cx="7" cy="6.6" r="0.8"/></g></svg>';
    if (lang === "en") return '<svg class="fl" viewBox="0 0 30 20" aria-hidden="true"><rect width="30" height="20" fill="#012169"/><path d="M0 0L30 20M30 0L0 20" stroke="#fff" stroke-width="4"/><path d="M0 0L30 20M30 0L0 20" stroke="#c8102e" stroke-width="2"/><rect x="13" width="4" height="20" fill="#fff"/><rect y="8" width="30" height="4" fill="#fff"/><rect x="14" width="2" height="20" fill="#c8102e"/><rect y="9" width="30" height="2" fill="#c8102e"/></svg>';
    if (lang === "es") return '<svg class="fl" viewBox="0 0 30 20" aria-hidden="true"><rect width="30" height="20" fill="#aa151b"/><rect y="5" width="30" height="10" fill="#f1bf00"/></svg>';
    return '<svg class="fl" viewBox="0 0 30 20" aria-hidden="true"><rect width="30" height="20" fill="#fff"/><circle cx="15" cy="10" r="5.5" fill="#bc002d"/></svg>';
  }

  /* ===== 工具 ===== */
  function T(obj, lang) {
    if (obj == null) return "";
    if (typeof obj === "string") return obj;
    if (obj[lang] != null) return obj[lang];
    return obj.zh != null ? obj.zh : "";
  }
  function pad(n) { return n < 10 ? "0" + n : "" + n; }
  function bing(q) { return "https://www.bing.com/search?q=" + encodeURIComponent(q); }
  function fmtDate(d, lang) {
    var y = d.getFullYear(), m = d.getMonth() + 1, day = d.getDate();
    if (lang === "zh") return y + "." + pad(m) + "." + pad(day);
    if (lang === "ja") return y + "年" + m + "月" + day + "日";
    if (lang === "es") return day + " " + ["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"][m-1] + " " + y;

  }
  function esc(s) {

      var i = title.indexOf(hl);
      inner = esc(title.slice(0, i)) + '<span class="hl">' + esc(hl) + "</span>" + esc(title.slice(i + hl.length));

  }

  /* ===== 语言检测：localStorage > 浏览器语言 > 系统时区 > 中文 ===== */
  function detectLang() {
    try { var s = localStorage.getItem("timab_lang"); if (s && LANGS.indexOf(s) >= 0) return s; } catch (e) {}

    if (/^es/.test(nav)) return "es";
    if (/^en/.test(nav)) return "en";

    try { tz = Intl.DateTimeFormat().resolvedOptions().timeZone || ""; } catch (e) {}
    if (/^Asia\/Tokyo/.test(tz)) return "ja";
    if (/Europe\/Madrid|America\/(Mexico_City|Bogota|Lima|Santiago|Caracas|Guatemala|La_Paz|San_Jose|Panama|Asuncion|Montevideo|Havana|El_Salvador|Managua|Tegucigalpa|Costa_Rica|San_Salvador)|America\/Argentina\//.test(tz)) return "es";

  }

  var curLang = "zh";

  /* ===== 渲染 ===== */
  function renderChrome(lang) {
    var i18n = I18N[lang];
    document.documentElement.lang = LANG_HTML[lang];

    var siteName = (lang === "zh") ? "提马早报" : "TIMAB DAILY";

  function renderContent(lang) {

      + "<h2>" + titleHtml(sp.title, sp.hl, lang) + "</h2>"
      + '<div class="body">' + esc(T(sp.body, lang)) + "</div>"

    // 分类

        + "<h3>" + esc(T(sec.name, lang)) + "</h3>"
        + '<span class="en">' + sec.key.toUpperCase() + "</span></div>";
      (sec.items || []).forEach(function (it) {
        html += '<div class="item">';
        html += '<div class="t"><span class="idx">' + it.idx + "</span>";
        if (it.tag) html += '<span class="tag">' + esc(it.tag[lang] != null ? it.tag[lang] : i18n.tag) + "</span>";
        html += titleHtml(it.title, it.hl, lang) + "</div>";
        html += '<div class="d">' + esc(T(it.body, lang)) + "</div>";
        html += '<div class="why"><b>' + esc(i18n.why) + "</b>" + esc(T(it.why, lang)) + "</div>";
        html += "</div>";
      });
      html += "</section>";
    });
    html += "</div>";
    var content = document.getElementById("content");
    if (content) content.innerHTML = html;
    // 页脚
    var risk = document.getElementById("risk");
    if (risk) risk.textContent = T(BRIEFING.risk, lang);
  }

  function setLang(lang) {
    if (LANGS.indexOf(lang) < 0) lang = "zh";
    curLang = lang;
    langOpen = false;
    try { localStorage.setItem("timab_lang", lang); } catch (e) {}
    renderChrome(lang);
    renderContent(lang);
  }

  /* ===== 往期日历（保留原逻辑，文案随语言） ===== */
  function initCalendar() {
    var btn = document.getElementById("calBtn");
    var pop = document.getElementById("calPop");
    var grid = document.getElementById("calGrid");
    var title = document.getElementById("calTitle");
    if (!btn || !pop || !grid || !title) return;

    var parts = BRIEFING.date.split("-");
    var todayKey = parts[0].slice(2) + parts[1] + parts[2];
    var cur = { y: +parts[0], m: +parts[1] };
    var has = {};
    for (var i = 0; i < ARCHIVE_DATES.length; i++) { has[ARCHIVE_DATES[i]] = 1; }
    var HIST_BASE = /\/history\//.test(location.pathname) ? "./" : "history/";

    function ckey(y, m, d) { return String(y).slice(2) + pad(m) + pad(d); }

    function render() {
      var i18n = I18N[curLang];
      title.textContent = i18n.calTitle(cur.y, cur.m);
      grid.innerHTML = "";
      var start = new Date(cur.y, cur.m - 1, 1).getDay();
      var days = new Date(cur.y, cur.m, 0).getDate();
      for (var b = 0; b < start; b++) {
        var blank = document.createElement("span");
        blank.className = "cal-cell is-empty"; grid.appendChild(blank);
      }
      for (var d = 1; d <= days; d++) {
        var k = ckey(cur.y, cur.m, d);
        var cell = document.createElement("span");
        cell.className = "cal-cell" + (has[k] ? " has" : "") + (k === todayKey ? " is-today" : "");
        cell.textContent = d;
        if (has[k]) {
          cell.setAttribute("role", "link"); cell.setAttribute("tabindex", "0");
          cell.title = cur.y + "-" + pad(cur.m) + "-" + pad(d) + " 存档";
          (function (target) {
            var go = function () { window.open(HIST_BASE + target + ".html", "_blank", "noopener"); };
            cell.addEventListener("click", go);
            cell.addEventListener("keydown", function (e) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); go(); } });
          })(k);
        }
        grid.appendChild(cell);
      }
    }
    function toggle(open) {
      pop.hidden = !open;
      btn.setAttribute("aria-expanded", open ? "true" : "false");
      if (open) render();
    }
    btn.addEventListener("click", function (e) { e.stopPropagation(); toggle(pop.hidden); });
    document.getElementById("calPrev").addEventListener("click", function () { cur.m--; if (cur.m < 1) { cur.m = 12; cur.y--; } render(); });
    document.getElementById("calNext").addEventListener("click", function () { cur.m++; if (cur.m > 12) { cur.m = 1; cur.y++; } render(); });
    document.addEventListener("click", function (e) { if (!pop.hidden && !pop.contains(e.target)) toggle(false); });
    document.addEventListener("keydown", function (e) { if (e.key === "Escape" && !pop.hidden) toggle(false); });
  }

  /* ===== 启动 ===== */
  function boot() {
    curLang = detectLang();
    renderChrome(curLang);
    renderContent(curLang);
    initCalendar();
    // 关闭语言下拉：点击外部 / Esc
    document.addEventListener("click", function (e) {
      var ls = document.getElementById("langSwitch");
      if (ls && langOpen && !ls.contains(e.target)) {
        langOpen = false;
        ls.classList.remove("open");
        var t = document.getElementById("langTrigger");
        if (t) t.setAttribute("aria-expanded", "false");
      }
    });
    document.addEventListener("keydown", function (e) {
      if (e.key === "Escape" && langOpen) {
        langOpen = false;
        var ls = document.getElementById("langSwitch");
        if (ls) ls.classList.remove("open");
        var t = document.getElementById("langTrigger");
        if (t) t.setAttribute("aria-expanded", "false");
      }
    });
  }
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", boot);
  } else { boot(); }
})();
</script>
