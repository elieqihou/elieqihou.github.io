jornada de la CBA, el 29 de octubre por la noche, los Beijing Royal Fighters ganaron 115-64 a Sichuan en el Centro Olímpico, infligiendo a los visitantes su cuarta derrota consecutiva. Sichuan rotó en profundidad: Jing Hanyi, Huang Rongqi y los extranjeros Crawford y Adams no jugaron, y Jordan Howard fue el único foráneo, con 31 puntos, máximo del partido. Sichuan anotó 14 puntos en el primer cuarto y perdía por 33 al descanso, con una diferencia que llegó a superar los 50. Luo Jinzhou, un joven de 19 años de Liangshan, jugó 22 minutos desde el banquillo, anotó su primer punto en la CBA desde el tiro libre y terminó con seis puntos y dos rebotes. Los Beijing Ducks siguen siendo el único equipo invicto. Quedan tres jornadas antes de la ventana de noviembre para las eliminatorias del Mundial.", "ja": "10月29日夜のCBA第6節、北京控股はオリンピックスポーツセンターで四川に115-64で大勝し、四川は4連敗となった。四川は大幅に選手を入れ替え、景菡一、黄栄奇、外国人選手のクロフォードとアダムスが出場せず、外国人がジョーダン・ハワード1人だけとなり、彼が試合最多の31得点を挙げた。四川は第1クォーターで14点しか取れず、ハーフで33点差、一時は50点差を超えた。19歳の涼山出身の若手、駱金州はベンチから22分に出場し、フリースローでCBA初得点を記録、6得点2リバウンドだった。北京首鋼は現在リーグ唯一の無敗チーム。11月のワールドカップ予選ウィンドウ前までにCBAレギュラーシーズンは残り3節となる。"}, "why": {"zh": "51 分是结果，值得记的是过程里的两个细节：一支球队在窗口期前选择“保存实力”，以及一个刚从青年队上来的孩子在垃圾时间拿到了生涯第一分。联赛的真实生态，常常藏在这种不起眼的场次里。", "en": "Fifty-one points is the result; the two details worth keeping are inside the process — a team choosing to save legs before the international window, and a kid just up from the youth side scoring his first professional point in garbage time. A league's real ecology hides in games like this.", "es": "Los 51 puntos son el resultado; los detalles que merecen recordarse están en el proceso: un equipo que decide reservar fuerzas antes de la ventana internacional y un chico recién llegado del equipo juvenil que anota su primer punto profesional en la basura del partido. La ecología real de una liga se esconde en partidos así.", "ja": "51点差は結果であり、記録すべきは過程の二つの細部だ。国際ウィンドウを前に力を温存する選択をしたチームと、ユース上がりの少年がゴミタイムにプロ初得点を挙げたこと。リーグの実際の生態は、こうした目立たない試合に隠れている。"}}, {"idx": "05", "title": {"zh": "世界举重锦标赛进入决赛日：今天有女子 57 公斤级和男子 70 公斤级", "en": "World Weightlifting Championships: Women's 57 kg and Men's 70 kg Finals Today", "es": "Mundial de halterofilia: hoy finales de 57 kg femenino y 70 kg masculino", "ja": "世界重量挙げ選手権は決勝の日 今日は女子57キロ級と男子70キロ級"}, "body": {"zh": "2026 年世界举重锦标赛 10 月 30 日进入女子 57 公斤级与男子 70 公斤级决赛日，中央广播电视总台体育赛事频道与奥林匹克频道将分别直播。本届世锦赛处在洛杉矶奥运周期的前段，各级别成绩将计入奥运资格积分体系，参赛队伍普遍以新老结合的阵容出战。同日，世界摔跤锦标赛也在进行，多个级别进入淘汰赛阶段。", "en": "The 2026 World Weightlifting Championships reaches the women's 57 kg and men's 70 kg finals on 30 October, with live coverage on CCTV-5+ and CCTV-16 respectively. The championships sit in the early part of the Los Angeles Olympic cycle, and results at each weight count toward qualification points, so teams have generally brought a mix of experienced and young lifters. The World Wrestling Championships are also under way, with several categories entering the knockout stage.", "es": "El Mundial de halterofilia de 2026 llega el 30 de octubre a las finales de 57 kg femenino y 70 kg masculino, con retransmisión en CCTV-5+ y CCTV-16 respectivamente. El campeonato se sitúa en la primera parte del ciclo olímpico de Los Ángeles y los resultados de cada categoría cuentan para la clasificación, por lo que las selecciones han traído plantillas que combinan veteranía y juventud. El Mundial de lucha también está en marcha, con varias categorías ya en fase eliminatoria.", "ja": "2026年世界重量挙げ選手権は10月30日、女子57キロ級と男子70キロ級の決勝を迎える。中央広播電視総台のスポーツイベントチャンネルとオリンピックチャンネルがそれぞれ生中継する。今大会はロサンゼルス・オリンピック周期の前半に位置し、各階級の成績は五輪出場枠のポイントに算入されるため、各国はベテランと若手を組み合わせた陣容で臨んでいる。同日、世界レスリング選手権も行われ、複数階級が決勝トーナメントに入っている。"}, "why": {"zh": "举重是那种平时没人讨论、奥运年突然被全民计算的项目。世锦赛的每一公斤，最后都会变成资格赛里的小数点——这类比赛的价值，要等到两年后才看得见。", "en": "Weightlifting is the kind of sport nobody discusses until an Olympic year, when everyone starts doing the arithmetic. Every kilogram at these championships becomes a decimal in the qualification table; the value of such events only shows up two years later.", "es": "La halterofilia es de esos deportes de los que nadie habla hasta el año olímpico, cuando de pronto todos hacen cálculos. Cada kilo en este Mundial acabará siendo un decimal en la clasificación; el valor de estas citas solo se ve dos años después.", "ja": "重量挙げは普段誰も語らないが、五輪の年になると突然みんなが計算を始める競技だ。この大会の1キロが、最後には予選表の小数になる。こうした大会の価値は、2年後にしか見えてこない。"}}]}, {"key": "hot", "num": "05", "color": "#6d28d9", "deep": "#4c1d95", "name": {"zh": "网络热点", "en": "TRENDING", "es": "TENDENCIAS", "ja": "ネット話題"}, "items": [{"idx": "01", "title": {"zh": "Hello Kitty 的母公司道歉了两次：一次在微博，一次在东京", "en": "Hello Kitty's Owner Apologised Twice: Once on Weibo, Once in Tokyo", "es": "La dueña de Hello Kitty se disculpó dos veces: una en Weibo y otra en Tokio", "ja": "ハローキティの親会社は二度謝罪した 一度は微博で、もう一度は東京で"}, "body": {"zh": "因与日本 TBS 电视剧《VIVANT》（《别班》）推出联名产品引发争议，三丽鸥 10 月 28 日深夜通过中国官方微博发布声明，称联名内容包含与集团企业理念不符的表达，决定停止本次联名及所有后续项目与宣传活动，并就此事致歉。由于日本总部当时未同步发布声明，有网友质疑这是“中国特供道歉”；10 月 29 日下午，三丽鸥日本总部官网发布内容一致的日文公告，并下架了 2023 年与该剧第一季合作的相关产品。三丽鸥在回应媒体问询时表示，本次合作仅针对第一季登场角色与形象开展策划审定，未参与剧集制作，事前并不知晓剧情内容，今后将强化审核机制。", "en": "After controversy over merchandise tied to the Japanese TBS drama VIVANT, Sanrio issued a statement late on 28 October through its official Weibo account in China, saying the collaboration contained expressions inconsistent with the group's corporate philosophy, and that it was halting the tie-in and all related projects and promotions while apologising for the concern caused. Because the Japanese headquarters had not published a matching statement at the time, some users questioned whether the apology was meant only for the Chinese market. On the afternoon of 29 October, Sanrio's Japan headquarters posted a Japanese notice with identical content and withdrew products from its 2023 collaboration with the show's first season. Responding to media enquiries, Sanrio said the project covered only characters and designs from season one, that it did not take part in producing the series and did not know the plot in advance, and that it will strengthen review procedures.", "es": "Tras la polémica por los productos de colaboración con la serie japonesa VIVANT de TBS, Sanrio emitió un comunicado la noche del 28 de octubre en su cuenta oficial de Weibo en China, en el que afirmaba que la colaboración incluía expresiones incompatibles con la filosofía corporativa del grupo y que detenía la operación y todos los proyectos y promociones asociados, además de disculparse por la inquietud causada. Como la sede japonesa no había publicado entonces un comunicado equivalente, algunos usuarios cuestionaron que la disculpa fuera solo para el mercado chino. El 29 de octubre por la tarde, la sede en Japón publicó un aviso en japonés con idéntico contenido y retiró los productos de su colaboración de 2023 con la primera temporada. En respuesta a consultas de medios, Sanrio dijo que el proyecto abarcaba solo personajes y diseños de la primera temporada, que no participó en la producción de la serie y que no conocía la trama de antemano, y que reforzará sus procedimientos de revisión.", "ja": "日本のTBSドラマ「VIVANT」とのコラボ商品をめぐる批判を受け、サンリオは10月28日深夜、中国の公式Weiboアカウントで声明を発表した。コラボ内容にグループの企業理念と相容れない表現が含まれるとして、今回のコラボおよび関連するすべての企画・告知を停止し、懸念を招いたことを謝罪した。当時、日本本社が同内容の声明を出していなかったため、中国市場向けだけの謝罪ではないかとの指摘も出た。10月29日午後、サンリオの日本本社は同一内容の日本語公告を公式サイトに掲載し、2023年に同ドラマ第1シーズンと展開した関連商品も販売終了とした。メディアの取材に対しサンリオは、今回の企画は第1シーズンに登場するキャラクターとイメージに関する企画・審査のみで、ドラマ制作には関与せず、事前に内容を把握していなかったと説明し、今後は審査体制を強化するとした。"}, "why": {"zh": "争议的核心不是“该不该联名”，而是审核这道关在哪一步失守：企划、设计、生产都能过，说明跨国公司的内容风控里，“历史情感”这一项还没有成为硬性检查点。两份声明的时间差还说明另一件事——危机公关的速度，本身就是一种表态。", "en": "The issue is not whether the tie-in should exist but where the review chain failed: planning, design and production all cleared, which suggests that in multinational content risk control, historical sensitivity is still not a mandatory checkpoint. The gap between the two statements says something else — the speed of crisis communication is itself a statement.", "es": "El fondo no es si la colaboración debía existir, sino en qué eslabón falló la revisión: planificación, diseño y producción pasaron, lo que sugiere que en el control de riesgos de contenido de las multinacionales la sensibilidad histórica aún no es un punto de control obligatorio. La diferencia temporal entre los dos comunicados dice algo más: la velocidad de la comunicación de crisis es en sí misma una postura.", "ja": "争点は「コラボすべきか」ではなく、審査のどこで止められなかったかにある。企画もデザインも生産も通過したということは、多国籍企業のコンテンツ管理において「歴史的な感情」がまだ必須のチェック項目になっていないということを意味する。二つの声明の時間差はもう一つのことを示す。危機広報の速さ自体が姿勢なのだ。"}}, {"idx": "02", "title": {"zh": "封禁之后换个马甲又开播：平台“跨账号追踪”这道缝被摆上了热搜", "en": "Banned, Then Back Under a New Name: Cross-Account Tracking Becomes the Story", "es": "Prohibido y de vuelta con otra cuenta: el rastreo entre cuentas llega a lo más comentado", "ja": "アカウント停止後に別名義で復帰 プラットフォームの「横断的な追跡」が話題に"}, "body": {"zh": "近日，“劣迹网红被封禁后换号复出”成为微博热议话题。多个此前因违规被平台封禁的账号被曝通过新账号重启直播带货，粉丝量与带货数据在短时间内快速回升。讨论集中在两个问题上：一是实名信息已在平台留存，为何跨账号识别仍然失效；二是封禁期限届满后的复出，应当遵循什么标准。舆论普遍认为，封禁不能“一封了之”，需要平台与监管部门建立跨账号的联防机制，避免“换个账号重新开始”成为规避处罚的常规路径。", "en": "The return of banned influencers under new accounts has become a hot topic on Weibo. Several accounts previously suspended for violations were reported to have restarted livestream selling through new profiles, with follower counts and sales rebounding quickly. Discussion has centred on two questions: why cross-account identification still fails when real-name information is already held by the platforms, and what standards should govern a comeback once a ban expires. The prevailing view is that a ban cannot end at the ban itself, and that platforms and regulators need a joint mechanism across accounts so that starting over with a new profile does not become the standard way around penalties.", "es": "El regreso de influencers sancionados con nuevas cuentas se ha convertido en tema destacado en Weibo. Varias cuentas suspendidas por infracciones habrían reiniciado la venta en directo con perfiles nuevos, con seguidores y ventas recuperándose con rapidez. El debate se centra en dos preguntas: por qué sigue fallando la identificación entre cuentas si las plataformas ya tienen los datos de identidad, y qué criterios deben regir un regreso cuando expira la sanción. La opinión dominante es que la prohibición no puede quedarse en el cierre de la cuenta y que plataformas y reguladores necesitan un mecanismo conjunto entre cuentas para que empezar de cero con otro perfil no se convierta en la vía habitual para eludir castigos.", "ja": "問題を起こしてアカウント停止となったインフルエンサーが別名義で復帰していることが、Weiboで話題になっている。過去に規約違反で停止された複数のアカウントが、新しいアカウントでライブコマースを再開し、フォロワー数や販売額が短時間で戻ったと報じられた。議論は二点に集中する。実名情報はすでにプラットフォーム側にあるのに、なぜアカウントをまたぐ識別が機能しないのか。そして停止期間が明けた後の復帰には、どのような基準が必要か。一般的な見方は、停止は停止だけで終わらせられないというものだ。プラットフォームと規制当局がアカウントをまたぐ連携の仕組みをつくり、新しいIDでやり直すことが処分回避の常套手段にならないようにする必要がある。"}, "why": {"zh": "这不是技术难题，是成本问题：跨账号比对要投入算力和人工复核，而“封一个号”几乎不花钱。当违规成本低于识别成本，规则就会被当成可以绕过去的障碍物。", "en": "This is not a technical problem but a cost problem: cross-account matching needs compute and human review, while closing one account costs almost nothing. When the cost of violating is lower than the cost of detecting, rules become obstacles people expect to route around.", "es": "No es un problema técnico sino de costes: comparar cuentas exige capacidad de cálculo y revisión humana, mientras cerrar una cuenta casi no cuesta nada. Cuando infringir sale más barato que detectar, las reglas se convierten en obstáculos que se espera poder rodear.", "ja": "これは技術の難しさではなくコストの問題だ。アカウント間の照合には計算資源と人手の確認が要るが、一つのアカウントを止めるのはほとんど費用がかからない。違反のコストが検知のコストより低ければ、ルールは迂回される前提の障害物になる。"}}, {"idx": "03", "title": {"zh": "王腾创业首秀：智能戒指、温控系统，和一张小米的 PPT", "en": "Wang Teng's Startup Debut: A Smart Ring, a Cooling System and a Xiaomi Slide", "es": "El debut de Wang Teng: un anillo inteligente, un sistema térmico y una diapositiva de Xiaomi", "ja": "王騰氏の起業初発表 スマートリングと温調システム、そして小米のスライド"}, "body": {"zh": "10 月 29 日，小米前中国区市场部总经理王腾创办的“今日宜休”举行首场发布会，推出 ISHO Ring 智能戒指与 ISHO iFlow 智能温控系统，聚焦睡眠健康。发布会最后，王腾以小米公司为背景向小米和雷军致谢，相关话题登上微博热搜。对“蹭流量”的质疑，他回应称自己是真心感激过往经历。介绍 iFlow 时，他将产品散热能力与 REDMI K100 Pro Max 对比，并补充“这主要是为了让大家直观了解”。王腾 2025 年 9 月因违反公司制度被小米辞退。", "en": "On 29 October, JINRI YIXIU, the startup founded by former Xiaomi China marketing head Wang Teng, held its first launch event, unveiling the ISHO Ring smart ring and the ISHO iFlow smart temperature-control system, both aimed at sleep health. At the end, Wang thanked Xiaomi and Lei Jun with a Xiaomi slide behind him, and the moment trended on Weibo. Asked whether he was trading on his former employer's fame, he said his gratitude for the experience was genuine. Presenting iFlow, he compared its heat dissipation with that of the Redmi K100 Pro Max, adding that the comparison was meant to make things intuitive. Wang was dismissed by Xiaomi in September 2025 for violating company rules.", "es": "El 29 de octubre, JINRI YIXIU, la empresa fundada por el exdirector de marketing de Xiaomi China Wang Teng, celebró su primera presentación y dio a conocer el anillo inteligente ISHO Ring y el sistema de control térmico ISHO iFlow, centrados en la salud del sueño. Al final, Wang agradeció a Xiaomi y a Lei Jun con una diapositiva de Xiaomi de fondo, un gesto que se volvió tendencia en Weibo. Preguntado sobre si se aprovechaba de la fama de su antiguo empleador, dijo que su gratitud por esa etapa era sincera. Al presentar iFlow comparó su disipación de calor con la del Redmi K100 Pro Max y añadió que la comparación buscaba hacerlo intuitivo. Wang fue despedido por Xiaomi en septiembre de 2025 por infringir las normas de la compañía.", "ja": "10月29日、小米の元中国市場部総経理である王騰氏が立ち上げた「今日宜休」が初の発表会を開き、睡眠健康に焦点を当てたスマートリング「ISHO Ring」とスマート温調システム「ISHO iFlow」を発表した。最後に王氏は小米のスライドを背景に小米と雷軍氏へ感謝を述べ、この場面がWeiboで話題になった。元職場の知名度に乗っているのではとの問いに対し、過去の経験には心から感謝していると答えた。iFlowの説明では放熱性能をRedmi K100 Pro Maxと比較し、「分かりやすくするためだ」と補足した。王氏は2025年9月、社内規則違反により小米を解雇されている。"}, "why": {"zh": "一场发布会同时完成了三件事：发产品、借势、以及给自己的创业叙事找一个起点。观众其实不反感“感谢前东家”，反感的是感谢之后拿不出与之匹配的东西——所以接下来要看的不是热搜，是三个月后这批戒指还在不在用户手上。", "en": "One event did three things at once: launch products, borrow momentum, and give the startup story an origin. Audiences do not mind thanking a former employer; they mind when nothing matching follows. So the thing to watch is not the trending topic but whether those rings are still on users' fingers in three months.", "es": "Un solo acto hizo tres cosas: lanzar productos, tomar impulso y dar un origen al relato de la startup. Al público no le molesta agradecer al antiguo empleador; le molesta que después no haya nada a la altura. Por eso lo que hay que mirar no es la tendencia, sino si esos anillos siguen en el dedo de los usuarios en tres meses.", "ja": "一つの発表会が同時に三つのことを済ませた。製品発表、流れに乗ること、そして自らの起業物語に起点を与えることだ。観客は「前職への感謝」に反発しているのではない。その後に釣り合うものが出てこないことに反発するのだ。だから見るべきはトレンドではなく、3か月後もその指輪がユーザーの指にあるかどうかである。"}}, {"idx": "04", "title": {"zh": "六封“劝离婚长信”刷屏，他回了八个字", "en": "Six Long Letters Urging a Divorce Went Viral; He Replied in Eight Characters", "es": "Seis largas cartas pidiendo el divorcio se hicieron virales; él respondió con ocho caracteres", "ja": "「離婚を勧める長文6通」が拡散、本人の返答は8文字"}, "body": {"zh": "近日，有网友连续撰写六封长信，从性格测试、星座配对到采访中的语气停顿，论证演员尹子维与徐冬冬“不合适”，劝两人离婚，相关话题阅读量突破 4.2 亿。尹子维没有发声明、没有晒证据，只把六篇原文原样转发，配文八个字：“好不容易追回我老婆。”随后平台以“建议不适宜公开传播”为由对相关长文作出限流处理。两人 2019 年公开恋情、同年分手，2023 年复合，2024 年低调领证。", "en": "A user recently wrote six long letters arguing that actors Yin Ziwei and Xu Dongdong are mismatched — citing personality tests, star signs and even the pauses in an interview — and urging them to divorce; the topic drew more than 420 million views. Yin issued no statement and produced no evidence. He simply reposted all six letters unedited with eight characters: “It wasn't easy winning my wife back.” The platform later limited the reach of the letters, citing advice that they were unsuitable for public circulation. The couple went public in 2019, split the same year, reconciled in 2023 and registered their marriage quietly in 2024.", "es": "Un usuario escribió recientemente seis largas cartas argumentando que los actores Yin Ziwei y Xu Dongdong no encajan —con tests de personalidad, signos del zodiaco e incluso las pausas de una entrevista— y pidiéndoles que se divorciaran; el tema superó los 420 millones de lecturas. Yin no emitió comunicado ni aportó pruebas: se limitó a republicar las seis cartas sin cambios con ocho caracteres: «No fue fácil recuperar a mi mujer». Después, la plataforma limitó la difusión de las cartas alegando que no eran aptas para circulación pública. La pareja hizo pública su relación en 2019, se separó ese mismo año, se reconcilió en 2023 y se casó discretamente en 2024.", "ja": "ある利用者が最近、性格診断や星座の相性、インタビューでの話し方の間まで根拠に、俳優の尹子維氏と徐冬冬氏は「合わない」と六通の長文で主張し、離婚を勧めた。関連する話題の閲覧数は4億2000万を超えた。尹氏は声明も出さず、証拠も示さず、六つの文章をそのまま転載し、8文字を添えた。「やっと妻を取り戻せたのに」。その後、プラットフォームはこれらの長文について「公開での拡散は不適切との判断」として拡散を制限した。二人は2019年に交際を公表し同年に別れ、2023年に復縁、2024年に静かに結婚した。"}, "why": {"zh": "这件事的公共价值不在明星婚姻，而在“以关心为名的越界”：当“为你好”变成持续的文字轰炸，它和网暴之间只隔着一层措辞。八个字的回应之所以有效，是因为它拒绝进入对方设定的论证框架。", "en": "The public value here is not a celebrity marriage but boundary-crossing dressed as care: when “for your own good” becomes sustained textual bombardment, only wording separates it from harassment. The eight-character reply works because it refuses to enter the argument on the writer's terms.", "es": "El valor público no está en el matrimonio de unos famosos, sino en la intromisión disfrazada de preocupación: cuando el «por tu bien» se convierte en un bombardeo de texto sostenido, solo la redacción lo separa del acoso. La respuesta de ocho caracteres funciona porque se niega a entrar en el marco argumental del otro.", "ja": "ここでの公共的な意味は有名人の結婚ではなく、「気遣いの名を借りた越境」にある。「あなたのため」が持続的な文章の爆撃になるとき、それは言葉遣い一枚を隔てて嫌がらせと隣り合う。8文字の返答が効いたのは、相手が設定した論証の枠組みに入ることを拒んだからだ。"}}, {"idx": "05", "title": {"zh": "机器人行业开始算“工时”了：从比台数，到比干了多少活", "en": "The Robot Industry Starts Counting Hours: From Units Shipped to Work Actually Done", "es": "La robótica empieza a contar horas: de las unidades vendidas al trabajo realmente hecho", "ja": "ロボット業界が「工数」を測り始めた 台数から、実際にこなした仕事へ"}, "body": {"zh": "10 月 29 日，智元机器人在上海举行“智元创新日”，发布“有效智能工时”概念，用于衡量机器人的实际产出，同步推出新一代具身基座模型与重载具身机器人。按官方说明，该指标由活跃机器人数量、自主工作时长与产出效能比相乘得出。此前，具身智能行业的对外叙事主要围绕下线台数、参数与动作演示展开。业内认为，采购方真正关心的是机器人在真实岗位上完成的有效工作量，这套度量方式若被更多厂商采用，行业评价体系将从“比数量”转向“比产出”。", "en": "On 29 October, AgiBot held its Innovation Day in Shanghai, introducing the concept of “effective intelligent work hours” to measure what robots actually produce, alongside a new embodied foundation model and a heavy-duty embodied robot. Per the company, the metric multiplies the number of active robots, autonomous working hours and an output-efficiency ratio. Until now the embodied AI industry has mostly talked in terms of units rolled off the line, parameters and motion demos. Industry observers note that buyers care about effective work completed in real posts, and that if more vendors adopt such a measure the sector's benchmark will shift from counting units to counting output.", "es": "El 29 de octubre, AgiBot celebró su Día de la Innovación en Shanghái y presentó el concepto de «horas de trabajo inteligente efectivas» para medir la producción real de los robots, junto con un nuevo modelo fundacional encarnado y un robot encarnado de carga pesada. Según la empresa, el indicador multiplica el número de robots activos, las horas de trabajo autónomo y una ratio de eficiencia de producción. Hasta ahora el sector hablaba sobre todo de unidades fabricadas, parámetros y demostraciones de movimiento. Los analistas señalan que el comprador se interesa por el trabajo efectivo realizado en puestos reales y que, si más fabricantes adoptan esta medida, el baremo del sector pasará de contar unidades a contar producción.", "ja": "10月29日、智元機器人は上海で「智元イノベーションデー」を開き、ロボットの実際の産出を測る「有効知能工数」という概念を発表した。新しい具身基盤モデルと重載具身ロボットも同時に公開した。同社によれば、この指標は稼働中のロボット数と自律稼働時間、産出効率比を掛け合わせて算出する。これまで具身知能業界の対外説明は、生産台数やパラメータ、動作デモが中心だった。業界関係者は、購入者が本当に知りたいのは実際の現場でこなした有効な作業量であり、この尺度が多くのメーカーに採用されれば、評価軸は「数比べ」から「産出比べ」へ移ると指摘する。"}, "why": {"zh": "一个行业什么时候开始统一度量衡，通常意味着“讲故事”阶段接近尾声：采购方的问题从“这台机器人会不会跳舞”变成“它上岗后替我完成了多少件活”。这套标准目前由企业自己定义，能否成为共识还要看，但方向已经很清楚——按工时结算，就要按工时被替代。", "en": "When an industry starts standardising its units of measure, the storytelling phase is usually ending: the buyer's question shifts from “can this robot dance” to “how many jobs did it finish for me”. The standard is currently self-defined, and whether it becomes consensus is open — but the direction is clear: settle by the hour, and you will be replaced by the hour.", "es": "Cuando un sector empieza a normalizar sus unidades de medida, la fase de relato suele estar terminando: la pregunta del comprador pasa de «¿sabe bailar este robot?» a «¿cuántas tareas me resolvió?». El estándar lo define hoy la propia empresa y está por ver si se vuelve consenso, pero la dirección es clara: si se liquida por horas, se será reemplazado por horas.", "ja": "業界が測定単位を標準化し始めるとき、「物語」の段階は終わりに近づいていることが多い。購入者の問いは「このロボットは踊れるか」から「現場で何件こなしてくれたか」へ変わる。この基準は今のところ企業の自主定義で、コンセンサスになるかは未知数だが、方向は明確だ。工数で精算するなら、工数で置き換えられる。"}}]}, {"key": "ent", "num": "06", "color": "#db2777", "deep": "#a81a56", "name": {"zh": "娱乐八卦", "en": "CULTURE", "es": "CULTURA", "ja": "芸能"}, "items": [{"idx": "01", "title": {"zh": "第 39 届金鸡奖提名公布：《密档》五项领跑，吴磊与梁家辉争影帝", "en": "Golden Rooster Nominations: The Archivist Leads With Five, Wu Lei and Tony Leung Vie for Best Actor", "es": "Nominaciones al Gallo de Oro: The Archivist lidera con cinco y Wu Lei y Tony Leung compiten por el premio actor", "ja": "第39回金鶏賞ノミネート発表 「密档」が5部門で先行、主演男優は呉磊と梁家輝が争う"}, "body": {"zh": "第 39 届中国电影金鸡奖提名名单近日揭晓。由郑大圣执导、上影出品的《密档》获五项提名，包括最佳故事片、最佳导演、最佳编剧、最佳男配角（邵峰）与最佳女配角（谢承颖）。影片取材于“中央文库”真实历史，讲述 1942 年上海沦陷时期，袁弘、李妍锡饰演的夫妇以普通市民身份守护两万余件建党早期档案的故事。表演类奖项方面，吴磊与梁家辉入围最佳男主角争夺。本届金鸡百花电影节将于 11 月 6 日至 10 日在厦门举办，颁奖典礼于 11 月 10 日举行。", "en": "Nominations for the 39th Golden Rooster Awards were announced. The Archivist, directed by Zheng Dasheng and produced by Shanghai Film Group, leads with five nods: best feature, best director, best screenplay, best supporting actor (Shao Feng) and best supporting actress (Xie Chengying). Based on the true history of the Party's Central Archives, the film follows a couple played by Yuan Hong and Li Yanxi who, posing as ordinary residents of occupied Shanghai in 1942, safeguard more than 20,000 early Party documents. In the acting categories, Wu Lei and Tony Leung Ka-fai both compete for best actor. The Golden Rooster and Hundred Flowers Film Festival runs in Xiamen from 6 to 10 November, with the awards ceremony on 10 November.", "es": "Se anunciaron las nominaciones a la 39.ª edición de los premios Gallo de Oro. The Archivist, dirigida por Zheng Dasheng y producida por Shanghai Film Group, lidera con cinco candidaturas: mejor película, dirección, guion, actor de reparto (Shao Feng) y actriz de reparto (Xie Chengying). Basada en la historia real del Archivo Central del Partido, la película sigue a un matrimonio interpretado por Yuan Hong y Li Yanxi que, haciéndose pasar por vecinos corrientes en el Shanghái ocupado de 1942, protege más de 20.000 documentos tempranos del Partido. En interpretación, Wu Lei y Tony Leung Ka-fai compiten por el premio al mejor actor. El festival se celebra en Xiamen del 6 al 10 de noviembre, con la gala de entrega el día 10.", "ja": "第39回中国映画金鶏賞のノミネートが発表された。鄭大聖監督、上海電影集団製作の「密档」が作品賞、監督賞、脚本賞、助演男優賞（邵峰）、助演女優賞（謝承穎）の5部門でノミネートされ、最多タイとなった。同作は党史の「中央文庫」の実話に基づき、1942年の上海占領下、袁弘と李妍錫演じる夫妻が一般市民を装って党初期の貴重な資料2万点余りを守る姿を描く。演技部門では呉磊と梁家輝が主演男優賞を争う。今年の金鶏百花映画祭は11月6日から10日まで厦門で開かれ、授賞式は11月10日に行われる。"}, "why": {"zh": "提名名单透露的行业信号比奖项本身更有意思：一部没有强反转、没有枪战、靠“日常里的紧绷”推进的红色题材拿到五项提名，说明评委这两年确实在往“克制”这一侧偏。", "en": "The nominations say more about the industry than the trophies will: a red-themed film with no big twists, no gunfights and tension carried by daily life taking five nods suggests the jury has been leaning toward restraint these past two years.", "es": "Las nominaciones dicen más del sector que los premios: que una película de temática histórica sin grandes giros ni tiroteos, con la tensión sostenida en lo cotidiano, logre cinco candidaturas indica que el jurado se ha inclinado hacia la contención en los últimos dos años.", "ja": "ノミネートは賞そのものより業界のシグナルを語る。大きなどんでん返しも銃撃戦もなく、「日常の中の張り詰め」で進む赤い題材の作品が5部門に残ったことは、ここ2年、審査員が「抑制」の側に傾いていることを示す。"}}, {"idx": "02", "title": {"zh": "金鸡国产电影展片单：15 部新片，开幕影片《明天，会更好》", "en": "Golden Rooster Domestic Film Showcase: 15 New Titles, Opening With Tomorrow Will Be Better", "es": "Muestra de cine chino del Gallo de Oro: 15 estrenos y apertura con Tomorrow Will Be Better", "ja": "金鶏国産映画展のラインナップ 新作15本、オープニングは「明天，会更好」"}, "body": {"zh": "2026 年金鸡国产电影展将于 11 月 6 日至 29 日在厦门举办，本届影展以“返璞归真”为主题，集中展映 15 部国产新片。开幕影片为陈可辛执导的《明天，会更好》，由周迅、王骁、田壮壮、林晓杰、文淇等出演；闭幕影片为邹静执导的《无名女孩》，由李庚希、沈佳妮、祖峰主演，该片曾入围第 79 届戛纳国际电影节影评人周长片竞赛单元。片单中青年导演占多数，钟凯峰执导的《大西洋》让声音承担叙事主责。影展售票通道将于 11 月 2 日 12 时开启。", "en": "The 2026 Golden Rooster Chinese Film Showcase runs in Xiamen from 6 to 29 November under the theme “return to the essence”, screening 15 new domestic features. It opens with Peter Chan's Tomorrow Will Be Better, starring Zhou Xun, Wang Xiao, Tian Zhuangzhuang, Lin Xiaojie and Wen Qi, and closes with Zou Jing's The Nameless Girl, starring Li Gengxi, Shen Jiani and Zu Feng, which was selected for the Critics' Week feature competition at the 79th Cannes Film Festival. Young directors dominate the line-up; Zhong Kaifeng's The Atlantic gives sound the main narrative role. Ticketing opens at noon on 2 November.", "es": "La Muestra de Cine Chino del Gallo de Oro 2026 se celebra en Xiamen del 6 al 29 de noviembre bajo el lema «volver a lo esencial», con 15 estrenos nacionales. Abre con Tomorrow Will Be Better, de Peter Chan, con Zhou Xun, Wang Xiao, Tian Zhuangzhuang, Lin Xiaojie y Wen Qi, y cierra con The Nameless Girl, de Zou Jing, con Li Gengxi, Shen Jiani y Zu Feng, seleccionada en la competición de largometrajes de la Semana de la Crítica del 79.º Festival de Cannes. Los jóvenes directores dominan la programación; The Atlantic, de Zhong Kaifeng, confía la narración principal al sonido. Las entradas salen a la venta el 2 de noviembre a mediodía.", "ja": "2026年金鶏国産映画展は11月6日から29日まで厦門で開かれ、「原点回帰」をテーマに国産新作15本を上映する。オープニングは陳可辛監督の「明天，会更好」で、周迅、王驍、田壮壮、林暁傑、文淇らが出演。クロージングは鄒静監督の「无名女孩」で、李庚希、沈佳妮、祖峰が主演し、第79回カンヌ国際映画祭批評家週間の長編コンペ部門に選ばれた。ラインナップは若手監督が中心で、鐘凱峰監督の「大西洋」は音が物語の主役を担う。チケット販売は11月2日12時に始まる。"}, "why": {"zh": "15 部片子里没有一部是商业大片，这本身就是选片的态度：影展在用排片告诉市场，除了档期和票房，还有一条叫“作者表达”的线需要有人守着。", "en": "Not one of the 15 is a commercial blockbuster, and that is itself a curatorial stance: through its schedule the showcase is telling the market that beyond release windows and box office there is a line called authorial voice that someone has to hold.", "es": "Ninguna de las 15 es un gran éxito comercial, y eso ya es una postura curatorial: con su programación, la muestra dice al mercado que más allá de las fechas de estreno y la taquilla hay una línea llamada voz de autor que alguien debe sostener.", "ja": "15本のうち商業大作は一本もない。それ自体が選定の姿勢だ。上映枠を通じて、公開時期や興行収入のほかに「作者の表現」という線があり、誰かが守らなければならないと市場に伝えている。"}}, {"idx": "03", "title": {"zh": "首部登陆内地的沙特商业大片今天上映", "en": "The First Saudi Commercial Blockbuster Opens in Mainland China Today", "es": "El primer gran estreno comercial saudí llega hoy a China continental", "ja": "サウジの商業大作が今日、中国本土で公開 初のケース"}, "body": {"zh": "沙特动作电影《七犬特攻·沙漠惊天》10 月 30 日在中国内地上映，成为首部登陆内地院线的沙特头部商业大片。影片由沙特方面制作，集结莫妮卡·贝鲁奇、吉安卡洛·埃斯珀西多以及印度演员萨尔曼·汗、桑杰·达特等跨国阵容。今年是中沙全面战略合作伙伴关系十周年，影片选在这一档期上映，被视为中沙影视文化交流的一项成果。该片在阿拉伯地区上映后反响热烈，被当地视为本国电影工业的里程碑式制作。", "en": "The Saudi action film Desert Storm opens in mainland Chinese cinemas on 30 October, the first top-tier Saudi commercial feature to reach the mainland. Produced in Saudi Arabia, it assembles an international cast including Monica Bellucci, Giancarlo Esposito and Indian stars Salman Khan and Sanjay Dutt. This year marks the tenth anniversary of the China-Saudi comprehensive strategic partnership, and the release date was chosen accordingly, framed as an outcome of cultural exchange. The film drew a strong response across the Arab world, where it is seen as a milestone for the local industry.", "es": "El filme de acción saudí Desert Storm llega el 30 de octubre a las salas de China continental, el primer gran título comercial saudí que se estrena allí. Producido en Arabia Saudí, reúne un reparto internacional con Monica Bellucci, Giancarlo Esposito y las estrellas indias Salman Khan y Sanjay Dutt. Este año se cumple el décimo aniversario de la asociación estratégica integral entre China y Arabia Saudí, y la fecha se eligió en ese marco, presentada como un resultado del intercambio cultural. La película tuvo una gran acogida en el mundo árabe, donde se considera un hito para su industria.", "ja": "サウジアラビアのアクション映画「七犬特攻・沙漠惊天」が10月30日、中国本土で公開される。サウジの一流商業大作が本土の劇場にかかるのは初めてだ。サウジ側が製作し、モニカ・ベルッチ、ジャンカルロ・エスポジート、インドのサルマン・ハーン、サンジャイ・ダットら国際的な顔ぶれが出演する。今年は中沙の包括的戦略パートナーシップ10周年にあたり、この時期の公開は両国の映画文化交流の成果と位置づけられている。アラブ地域では大きな反響を呼び、自国の映画産業の節目となる作品と見なされている。"}, "why": {"zh": "引进一部沙特商业片，意义不在票房数字，而在片源结构：过去内地的“外语片”几乎等于好莱坞，现在这条通路开始出现别的产地。观众能不能接受另一种叙事节奏，这周末就会有答案。", "en": "Importing a Saudi blockbuster matters less for its box office than for the shape of supply: foreign film in mainland China has long meant Hollywood, and other origins are now appearing on that route. Whether audiences take to a different narrative rhythm will be answered this weekend.", "es": "Importar un éxito saudí importa menos por su taquilla que por la estructura de la oferta: el cine extranjero en China continental ha sido sinónimo de Hollywood, y ahora aparecen otros orígenes en esa vía. Si el público acepta otro ritmo narrativo se sabrá este fin de semana.", "ja": "サウジの大作を輸入することの意味は興行収入より供給構造にある。中国本土での「外国映画」はほぼハリウッドを指してきたが、そのルートに別の産地が現れ始めた。観客が異なる語りのリズムを受け入れられるかは、今週末に分かる。"}}, {"idx": "04", "tag": {"zh": "进展"}, "title": {"zh": "《小城良方》收视 3.756% 断层领跑，争议也跟着来了", "en": "Small Town Prescription Leads With 3.756% — and the Arguments Arrive With It", "es": "Small Town Prescription lidera con un 3,756 % y las críticas llegan con el éxito", "ja": "「小城良方」視聴率3.756%で独走、議論も同時に"}, "body": {"zh": "截至 10 月 29 日，正在央视八套与爱奇艺播出的《小城良方》收视率 3.756%，领先第二名 1.7 个百分点；爱奇艺站内热度突破 9600，云合市占率超过 16%，猫眼剧集有效播放榜与热度榜均居首位。该剧由肖战、倪大红、姜妍主演，讲述一名神经外科医生因故回到东北小城医院的故事。伴随高热度而来的是争议：医疗专业性的讨论在社交平台两极分化，剧情在中段转向喜剧化处理后，也被部分观众认为消解了现实题材的严肃性。", "en": "As of 29 October, Small Town Prescription, airing on CCTV-8 and iQIYI, had a rating of 3.756%, 1.7 percentage points ahead of second place. Its iQIYI heat index passed 9,600, its Yunhe market share exceeded 16%, and it topped both the Maoyan effective-play and heat rankings. Starring Xiao Zhan, Ni Dahong and Jiang Yan, the drama follows a neurosurgeon who returns to a small hospital in northeast China. The success has brought argument: discussion of medical accuracy has split on social media, and the shift toward comedy in the middle stretch has led some viewers to say it dilutes the seriousness of the subject.", "es": "A 29 de octubre, Small Town Prescription, emitida en CCTV-8 e iQIYI, registraba un 3,756 % de audiencia, 1,7 puntos por delante del segundo puesto. Su índice de calor en iQIYI superó 9.600, su cuota de mercado en Yunhe rebasó el 16 % y encabeza las listas de reproducción efectiva y de popularidad de Maoyan. Protagonizada por Xiao Zhan, Ni Dahong y Jiang Yan, sigue a un neurocirujano que regresa a un pequeño hospital del noreste de China. El éxito trajo polémica: el debate sobre la precisión médica está dividido en redes y el giro hacia la comedia en su tramo medio ha llevado a algunos espectadores a considerar que diluye la seriedad del tema.", "ja": "10月29日時点で、CCTV-8とiQIYIで放送中の「小城良方」の視聴率は3.756%と2位に1.7ポイント差をつけ、iQIYIの熱度指数は9600を突破、雲合の市場シェアは16%超、猫眼の有効再生ランキングと熱度ランキングで首位となった。肖戦、倪大紅、姜妍が主演し、神経外科医が故あって東北の小さな町の病院に戻る物語だ。高い熱量とともに議論も起きている。医療描写の正確さをめぐる議論はSNSで二分され、中盤でコメディ色を強めたことが現実題材の真剣さを損なうとの指摘もある。"}, "why": {"zh": "它证明了一件行业一直不敢确认的事：观众并不排斥医疗剧，排斥的是“只有大城市三甲医院才配讲故事”的默认设定。至于喜剧化是不是解药，收视率和口碑这次给出了两个不同的答案。", "en": "It confirms something the industry has been reluctant to accept: audiences do not reject medical drama, they reject the default assumption that only a top-tier hospital in a major city deserves a story. Whether comedy is the cure is another matter — ratings and word of mouth have given two different answers.", "es": "Confirma algo que el sector no se atrevía a dar por cierto: el público no rechaza el drama médico, rechaza la premisa de que solo un gran hospital de una gran ciudad merece una historia. Que la comedia sea o no el remedio es otra cosa: audiencia y boca a boca han dado dos respuestas distintas.", "ja": "業界が認めにくくしていたことを証明した。観客は医療ドラマを拒んでいるのではなく、「大都市の大病院でなければ物語にする価値がない」という前提を拒んでいるのだ。コメディ化が解薬かは別問題で、視聴率と口コミは二つの異なる答えを出した。"}}, {"idx": "05", "title": {"zh": "张韶涵的乌鸦装上了热搜：一套造型，一次寓言", "en": "Angela Chang's Raven Look Trends: One Costume, One Fable", "es": "El look de cuervo de Angela Chang se vuelve tendencia: un vestuario, una fábula", "ja": "張韶涵のカラス衣装がトレンドに 一つの造型、一つの寓話"}, "body": {"zh": "10 月 26 日，张韶涵在南京举行“寓言世界”巡回演唱会第二场。她以暗黑系造型登场：头上佩戴水滴状装饰，深色唇妆，肩部与裙摆缀满黑色羽毛，搭配落地披风，呼应演唱会“乌鸦喝水”的寓言主题。相关造型随后登上微博热搜，讨论集中在造型设计与状态保持两个方向。张韶涵今年发行专辑《引路的风筝》，随后启动本轮巡演。", "en": "On 26 October, Angela Chang played the second show of her Fable World tour in Nanjing in a dark look: water-drop ornaments in her hair, deep-toned lipstick, black feathers across the shoulders and skirt, and a floor-length cape, all echoing the tour's fable theme of the thirsty crow. The outfit trended on Weibo, with discussion splitting between the design and her condition on stage. Chang released the album The Guiding Kite earlier this year and then launched the tour.", "es": "El 26 de octubre, Angela Chang ofreció en Nankín el segundo concierto de su gira Fable World con un look oscuro: adornos en forma de gota en el cabello, labios de tono profundo, plumas negras en hombros y falda y una capa hasta el suelo, en línea con la fábula del cuervo sediento que da tema a la gira. El vestuario se volvió tendencia en Weibo, con el debate repartido entre el diseño y su estado en el escenario. Chang publicó este año el álbum The Guiding Kite y luego inició la gira.", "ja": "10月26日、張韶涵が南京で「寓言世界」ツアーの2公演目を行い、ダークな造型で登場した。頭に水滴状の飾り、深い色のリップ、肩とスカートに黒い羽根をあしらい、床まで届くマントを合わせ、ツアーの「渇いたカラス」の寓話を思わせる。この衣装がWeiboでトレンドになり、造型そのものとコンディションの両面で話題になった。張韶涵は今年アルバム「引路的风筝」を発表し、その後ツアーを始めた。"}, "why": {"zh": "演唱会造型上热搜，通常说明它完成了“视觉即内容”这件事：观众不需要听懂歌词，就能记住这个画面。对一个以嗓音立身的歌手来说，这是另一种延长职业寿命的方式。", "en": "A tour look trending usually means it achieved the thing where image becomes content: viewers do not need to follow the lyrics to remember the frame. For a singer known above all for her voice, that is another way of extending a career.", "es": "Que un vestuario de gira sea tendencia suele indicar que logró eso de que la imagen sea contenido: el público no necesita seguir la letra para recordar la imagen. Para una cantante conocida sobre todo por su voz, es otra forma de alargar una carrera.", "ja": "ツアーの衣装がトレンドになるのは、視覚そのものが内容になったという証拠が多い。歌詞を追わなくても、その画面は記憶に残る。声で知られる歌手にとって、それはキャリアを延ばすもう一つの方法だ。"}}]}], "risk": {"zh": "风险提示：本简报仅作信息汇总，其中涉及的数据不构成任何投资建议。", "en": "Disclaimer: This briefing is a news digest only. Data mentioned does not constitute any investment advice.", "es": "Aviso: este resumen es solo una recopilación informativa; los datos citados no constituyen asesoramiento de inversión.", "ja": "リスク表示：本ダイジェストは情報まとめであり、記載データは投資助言を構成しません。"}}/*__END__*/;

  /* ===== 渲染 ===== */
  function renderChrome(lang) {
    var i18n = I18N[lang];
    document.documentElement.lang = LANG_HTML[lang];
    // 报头信息行
    var metaEl = document.getElementById("metaRow");
    if (metaEl) metaEl.textContent = T(BRIEFING.meta, lang);
    // 大日期
    var md = document.getElementById("mastDate");
    if (md) {
      var d = new Date(BRIEFING.date + "T00:00:00");
      md.innerHTML = fmtDate(d, lang) + "<small>" + esc(i18n.dateSub) + "</small>";
    }
    // 文档标题
    var siteName = (lang === "zh") ? "提马早报" : "TIMAB DAILY";
    document.title = siteName + " · " + fmtDate(new Date(BRIEFING.date + "T00:00:00"), lang);
    // 导航签
    var nav = document.getElementById("navChips");
    if (nav) {
      var order = ["pick"].concat(BRIEFING.sections.map(function (s) { return s.key; }));
      nav.innerHTML = "";
      order.forEach(function (key) {
        if (key === "pick") {
          var a = document.createElement("a");
          a.className = "chip-pick"; a.href = "#pick"; a.setAttribute("data-nav", "pick");
          a.textContent = T(BRIEFING.spotlight.badge, lang);
          nav.appendChild(a);
        } else {
          var sec = null;
          BRIEFING.sections.forEach(function (s) { if (s.key === key) sec = s; });
          if (!sec) return;
          var b = document.createElement("a");
          b.href = "#" + key; b.setAttribute("data-nav", key);
          b.style.borderColor = sec.color; b.style.color = sec.deep;
          b.textContent = T(sec.name, lang);
          nav.appendChild(b);
        }
      });
    }
    // 日历文案
    var cb = document.getElementById("calBtnText"); if (cb) cb.textContent = i18n.calBtn;
    var cw = document.getElementById("calWeek");
    if (cw) { cw.innerHTML = ""; i18n.calWeek.forEach(function (w) { var s = document.createElement("span"); s.textContent = w; cw.appendChild(s); }); }
    var cf = document.getElementById("calFoot"); if (cf) cf.textContent = i18n.calFoot;
    // 语言切换器（国旗触发 + 下拉）
    var ls = document.getElementById("langSwitch");
    if (ls) {
      ls.className = "lang-switch" + (langOpen ? " open" : "");
      ls.innerHTML = "";
      var trig = document.createElement("button");
      trig.type = "button"; trig.className = "lang-trigger"; trig.id = "langTrigger";
      trig.setAttribute("aria-haspopup", "true");
      trig.setAttribute("aria-expanded", langOpen ? "true" : "false");
      trig.innerHTML = flag(curLang) + '<span class="caret">▾</span>';
      trig.addEventListener("click", function (e) {
        e.stopPropagation();
        langOpen = !langOpen;
        ls.classList.toggle("open", langOpen);
        trig.setAttribute("aria-expanded", langOpen ? "true" : "false");
      });
      ls.appendChild(trig);
      var menu = document.createElement("div");
      menu.className = "lang-menu"; menu.setAttribute("role", "menu");
      LANGS.forEach(function (l) {
        var item = document.createElement("button");
        item.type = "button"; item.className = "lang-item" + (l === curLang ? " sel" : "");
        item.setAttribute("role", "menuitem"); item.setAttribute("data-lang", l);
        item.innerHTML = flag(l) + '<span class="lbl">' + LANG_LABEL_FULL[l] + "</span>";
        item.addEventListener("click", function (e) {
          e.stopPropagation();
          setLang(l);
        });
        menu.appendChild(item);
      });
      ls.appendChild(menu);
    }
  }

  function renderContent(lang) {
    var i18n = I18N[lang];
    var html = "";
    // 精选
    var sp = BRIEFING.spotlight;
    html += '<section class="spotlight" id="pick">'
      + '<div class="badge"><i></i>' + esc(T(sp.badge, lang)) + "</div>"
      + "<h2>" + titleHtml(sp.title, sp.hl, lang) + "</h2>"
      + '<div class="body">' + esc(T(sp.body, lang)) + "</div>"
      + '<div class="why"><b>' + esc(i18n.why) + "</b>" + esc(T(sp.why, lang)) + "</div>"
      + "</section>";
    // 分类
    html += '<div class="grid">';
    BRIEFING.sections.forEach(function (sec) {
      html += '<section class="card" id="' + sec.key + '" style="--ac:' + sec.color + "; --ac-deep:" + sec.deep + ';">'
        + '<div class="sec-head"><span class="sec-num">' + sec.num + "</span>"
        + "<h3>" + esc(T(sec.name, lang)) + "</h3>"
        + '<span class="en">' + sec.key.toUpperCase() + "</span></div>";
      (sec.items || []).forEach(function (it) {
        html += '<div class="item">';
        html += '<div class="t"><span class="idx">' + it.idx + "</span>";
        if (it.tag) html += '<span class="tag">' + esc(it.tag[lang] != null ? it.tag[lang] : i18n.tag) + "</span>";
        html += titleHtml(it.title, it.hl, lang) + "</div>";
        html += '<div class="d">' + esc(T(it.body, lang)) + "</div>";
        html += '<div class="why"><b>' + esc(i18n.why) + "</b>" + esc(T(it.why, lang)) + "</div>";
        html += "</div>";
      });
      html += "</section>";
    });
    html += "</div>";
    var content = document.getElementById("content");
    if (content) content.innerHTML = html;
    // 页脚
    var risk = document.getElementById("risk");
    if (risk) risk.textContent = T(BRIEFING.risk, lang);
  }

  function setLang(lang) {
    if (LANGS.indexOf(lang) < 0) lang = "zh";
    curLang = lang;
    langOpen = false;
    try { localStorage.setItem("timab_lang", lang); } catch (e) {}
    renderChrome(lang);
    renderContent(lang);
  }

  /* ===== 往期日历（保留原逻辑，文案随语言） ===== */
  function initCalendar() {
    var btn = document.getElementById("calBtn");
    var pop = document.getElementById("calPop");
    var grid = document.getElementById("calGrid");
    var title = document.getElementById("calTitle");
    if (!btn || !pop || !grid || !title) return;

    var parts = BRIEFING.date.split("-");
    var todayKey = parts[0].slice(2) + parts[1] + parts[2];
    var cur = { y: +parts[0], m: +parts[1] };
    var has = {};
    for (var i = 0; i < ARCHIVE_DATES.length; i++) { has[ARCHIVE_DATES[i]] = 1; }
    var HIST_BASE = /\/history\//.test(location.pathname) ? "./" : "history/";

    function ckey(y, m, d) { return String(y).slice(2) + pad(m) + pad(d); }

    function render() {
      var i18n = I18N[curLang];
      title.textContent = i18n.calTitle(cur.y, cur.m);
      grid.innerHTML = "";
      var start = new Date(cur.y, cur.m - 1, 1).getDay();
      var days = new Date(cur.y, cur.m, 0).getDate();
      for (var b = 0; b < start; b++) {
        var blank = document.createElement("span");
        blank.className = "cal-cell is-empty"; grid.appendChild(blank);
      }
      for (var d = 1; d <= days; d++) {
        var k = ckey(cur.y, cur.m, d);
        var cell = document.createElement("span");
        cell.className = "cal-cell" + (has[k] ? " has" : "") + (k === todayKey ? " is-today" : "");
        cell.textContent = d;
        if (has[k]) {
          cell.setAttribute("role", "link"); cell.setAttribute("tabindex", "0");
          cell.title = cur.y + "-" + pad(cur.m) + "-" + pad(d) + " 存档";
          (function (target) {
            var go = function () { window.open(HIST_BASE + target + ".html", "_blank", "noopener"); };
            cell.addEventListener("click", go);
            cell.addEventListener("keydown", function (e) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); go(); } });
          })(k);
        }
        grid.appendChild(cell);
      }
    }
    function toggle(open) {
      pop.hidden = !open;
      btn.setAttribute("aria-expanded", open ? "true" : "false");
      if (open) render();
    }
    btn.addEventListener("click", function (e) { e.stopPropagation(); toggle(pop.hidden); });
    document.getElementById("calPrev").addEventListener("click", function () { cur.m--; if (cur.m < 1) { cur.m = 12; cur.y--; } render(); });
    document.getElementById("calNext").addEventListener("click", function () { cur.m++; if (cur.m > 12) { cur.m = 1; cur.y++; } render(); });
    document.addEventListener("click", function (e) { if (!pop.hidden && !pop.contains(e.target)) toggle(false); });
    document.addEventListener("keydown", function (e) { if (e.key === "Escape" && !pop.hidden) toggle(false); });
  }

  /* ===== 启动 ===== */
  function boot() {
    curLang = detectLang();
    renderChrome(curLang);
    renderContent(curLang);
    initCalendar();
    // 关闭语言下拉：点击外部 / Esc
    document.addEventListener("click", function (e) {
      var ls = document.getElementById("langSwitch");
      if (ls && langOpen && !ls.contains(e.target)) {
        langOpen = false;
        ls.classList.remove("open");
        var t = document.getElementById("langTrigger");
        if (t) t.setAttribute("aria-expanded", "false");
      }
    });
    document.addEventListener("keydown", function (e) {
      if (e.key === "Escape" && langOpen) {
        langOpen = false;
        var ls = document.getElementById("langSwitch");
        if (ls) ls.classList.remove("open");
        var t = document.getElementById("langTrigger");
        if (t) t.setAttribute("aria-expanded", "false");
      }
    });
  }
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", boot);
  } else { boot(); }
})();
</script>
</body>
</html>
