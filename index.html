<style>
  :root {

    --seal: #9e2b25;
    --c-intl: #1d4ed8; --c-intl-deep: #1e3fa8;
    --c-dom: #cf2f1e; --c-dom-deep: #a02315;
    --c-fin: #b45309; --c-fin-deep: #8a3f06;
    --c-spo: #15803d; --c-spo-deep: #105c2c;
    --c-hot: #6d28d9; --c-hot-deep: #551dab;

  .wrap { max-width: 1120px; margin: 0 auto; position: relative; z-index: 1; }

  .mast-meta .kicker { font-weight: 700; color: var(--ink-soft); }
  .mast-meta .kicker small { font-weight: 400; letter-spacing: .3em; margin-left: 8px; color: var(--ink-faint); }
  .mast-title-row {
    display: flex; align-items: flex-end; justify-content: space-between;
    gap: 24px; padding: 26px 0 22px;
  }
  .mast-brand { display: flex; align-items: flex-end; gap: 20px; }
  .mast-seal { width: clamp(54px, 7.5vw, 82px); height: auto; flex: none; }
  .mast-title {
    font-family: "Noto Serif SC", "Noto Serif JP", serif; font-weight: 900;

  }
  .mast-title em { font-style: normal; color: var(--c-dom); }
  .mast-side { display: flex; flex-direction: column; align-items: flex-end; gap: 12px; }
  .mast-date {

  }
  .mast-date small {
    display: block; font-family: "Noto Sans SC", sans-serif; font-style: normal;
    font-size: 12px; letter-spacing: .3em; color: var(--accent); margin-top: 8px; text-align: right;
  }

  /* ===== 语言切换（国旗触发 + 下拉） ===== */
  .lang-switch { position: relative; display: inline-block; }
  .lang-trigger {
    display: inline-flex; align-items: center; gap: 5px; cursor: pointer;
    background: var(--card); border: 1.5px solid var(--line); border-radius: 999px;
    padding: 3px 9px 3px 4px; font-family: inherit; color: var(--ink-soft);
    transition: border-color .18s ease, color .18s ease;
  }
  .lang-trigger:hover { border-color: var(--accent); color: var(--accent); }
  .lang-switch.open .lang-trigger { border-color: var(--accent); }
  .lang-trigger .caret { font-size: 9px; line-height: 1; opacity: .7; }
  .fl {
    display: block; width: 22px; height: 15px; border-radius: 2px; flex: none;
    box-shadow: 0 0 0 1px rgba(28, 27, 23, .14);
  }
  .lang-menu {
    position: absolute; top: calc(100% + 8px); right: 0; z-index: 70;
    min-width: 150px; padding: 6px; background: var(--card);
    border: 1px solid var(--line); border-radius: 12px;
    box-shadow: 0 18px 44px -18px rgba(28, 27, 23, .45), 0 2px 8px rgba(28, 27, 23, .06);
    display: none; animation: langIn .16s ease both;
  }
  .lang-switch.open .lang-menu { display: block; }
  @keyframes langIn { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }
  .lang-item {
    display: flex; align-items: center; gap: 10px; width: 100%; cursor: pointer;
    background: transparent; border: none; border-radius: 8px; padding: 7px 9px;
    font-family: inherit; font-size: 13px; font-weight: 600; color: var(--ink-soft);
    text-align: left; transition: background .16s ease, color .16s ease;
  }
  .lang-item:hover { background: color-mix(in srgb, var(--accent) 10%, transparent); color: var(--accent); }
  .lang-item.sel { color: var(--accent); background: color-mix(in srgb, var(--accent) 8%, transparent); }
  .lang-item .lbl { letter-spacing: .02em; }

  /* ===== 往期日历 ===== */
  .cal-anchor { position: relative; }
  .cal-link {
    display: inline-flex; align-items: center; gap: 7px; cursor: pointer;
    font-family: inherit; font-size: 13px; font-weight: 700; letter-spacing: .1em;
    color: var(--ink-soft); background: var(--card);
    border: 1.5px solid var(--line); border-radius: 999px; padding: 5px 15px 5px 12px;
    transition: all .2s ease;
  }
  .cal-link:hover { border-color: var(--accent); color: var(--accent); }
  .cal-link svg { width: 14px; height: 14px; display: block; }
  .cal-pop {
    position: absolute; top: calc(100% + 10px); right: 0; z-index: 60;
    width: 274px; padding: 14px 14px 10px;
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    box-shadow: 0 18px 44px -18px rgba(28, 27, 23, .45), 0 2px 8px rgba(28, 27, 23, .06);
    animation: calIn .18s ease both;
  }
  .cal-pop[hidden] { display: none; }
  @keyframes calIn { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }
  .cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .cal-title { font-size: 14px; font-weight: 700; letter-spacing: .08em; color: var(--ink); }
  .cal-nav {
    width: 26px; height: 26px; line-height: 1; cursor: pointer;
    font-family: inherit; font-size: 17px; color: var(--ink-soft);
    background: transparent; border: 1px solid var(--line); border-radius: 8px;
    transition: all .18s ease;
  }
  .cal-nav:hover { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  .cal-week, .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
  .cal-week span {
    text-align: center; font-size: 11px; letter-spacing: .06em;
    color: var(--ink-faint); padding-bottom: 6px;
  }
  .cal-cell {
    position: relative; height: 32px; display: flex; align-items: center; justify-content: center;
    font-size: 13px; color: var(--ink-faint); border-radius: 8px;
    transition: background .18s ease, color .18s ease;
  }
  .cal-cell.is-empty { visibility: hidden; }
  .cal-cell.has { color: var(--ink); font-weight: 700; cursor: pointer; }
  .cal-cell.has::after {
    content: ""; position: absolute; bottom: 3px; left: 50%; transform: translateX(-50%);
    width: 4px; height: 4px; border-radius: 50%; background: var(--accent);
  }
  .cal-cell.has:hover, .cal-cell.has:focus-visible {
    background: color-mix(in srgb, var(--accent) 16%, transparent);
    color: var(--accent); outline: none;
  }
  .cal-cell.is-today { box-shadow: inset 0 0 0 1.5px var(--line); color: var(--ink-soft); }
  .cal-foot {
    margin-top: 9px; padding-top: 8px; border-top: 1px dashed var(--line);
    font-size: 11.5px; color: var(--ink-faint); letter-spacing: .04em;
  }

  /* ===== 导航 ===== */
  .nav-chips { display: flex; flex-wrap: wrap; gap: 10px; padding: 0 0 18px; }
  .nav-chips a {
    text-decoration: none; font-size: 13.5px; font-weight: 700; letter-spacing: .08em;
    color: var(--ink-soft); border: 1.5px solid var(--line);
    border-radius: 999px; padding: 5px 16px; transition: all .2s ease;
  }
  .nav-chips a:hover { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  .nav-chips a.chip-pick { border-color: #0f766e; color: #0b5a54; }
  .nav-chips a.chip-pick:hover { background: #0f766e; color: #fff; }

  /* ===== 精选 ===== */
  .spotlight {
    margin-top: 30px; border-radius: 18px; overflow: hidden;
    background: linear-gradient(120deg, #0f766e 0%, #115e59 46%, #134e4a 100%);
    color: #f2fbfa; padding: 34px 38px 30px; position: relative;
    box-shadow: 0 18px 44px -18px rgba(15, 118, 110, .55);
  }
  .spotlight::after {
    content: ""; position: absolute; right: -60px; top: -60px; width: 240px; height: 240px;
    border-radius: 50%; background: radial-gradient(circle, rgba(255,255,255,.14), transparent 68%);
  }
  .spotlight .badge {
    display: inline-flex; align-items: center; gap: 8px;
    font-size: 12.5px; font-weight: 700; letter-spacing: .3em;
    border: 1.5px solid rgba(242, 251, 250, .55); border-radius: 999px;
    padding: 5px 18px 5px 20px; margin-bottom: 18px;
  }
  .spotlight .badge i {
    width: 8px; height: 8px; border-radius: 50%; background: #5eead4; display: inline-block;
    animation: pulse 2.2s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100% { opacity: 1; transform: scale(1);} 50% { opacity: .45; transform: scale(.78);} }
  .spotlight h2 {
    font-family: "Noto Serif SC", "Noto Serif JP", serif; font-weight: 900;
    font-size: clamp(24px, 3.4vw, 34px); line-height: 1.35; margin-bottom: 14px;
  }
  .spotlight h2 .hl { color: #99f6e4; border-bottom: 3px solid rgba(153, 246, 228, .5); padding-bottom: 2px; }
  .spotlight .body { font-size: 15px; color: #d3efec; max-width: 62em; }
  .spotlight .why {
    margin-top: 18px; padding: 14px 18px; border-left: 3px solid #5eead4;
    background: rgba(255,255,255,.07); border-radius: 0 10px 10px 0;
    font-size: 14px; color: #e8fbf9; max-width: 62em;
  }
  .spotlight .why b { color: #99f6e4; font-weight: 700; }

  /* ===== 分类卡片 ===== */
  .grid { margin-top: 30px; display: grid; grid-template-columns: repeat(2, 1fr); gap: 24px; }
  @media (max-width: 880px) { .grid { grid-template-columns: 1fr; } .spotlight { padding: 26px 22px; } }
  .card {
    background: var(--card); border-radius: 4px 4px 14px 14px;
    box-shadow: 0 1px 3px rgba(28, 27, 23, .07), 0 12px 30px -22px rgba(28,27,23,.35);
    padding: 24px 26px 12px; position: relative; border-top: 6px solid var(--ac);
    animation: rise .6s ease both;
  }
  .card:nth-child(1) { animation-delay: .05s; } .card:nth-child(2) { animation-delay: .12s; }
  .card:nth-child(3) { animation-delay: .19s; } .card:nth-child(4) { animation-delay: .26s; }
  .card:nth-child(5) { animation-delay: .33s; } .card:nth-child(6) { animation-delay: .40s; }
  @keyframes rise { from { opacity: 0; transform: translateY(16px);} to { opacity: 1; transform: none;} }
  .card:hover { transform: translateY(-3px); transition: transform .25s ease; }
  .sec-head {
    display: flex; align-items: center; gap: 12px; margin-bottom: 6px;
    padding-bottom: 12px; border-bottom: 1px solid var(--line);
  }
  .sec-num { font-family: "Playfair Display", serif; font-style: italic; font-weight: 700; font-size: 26px; color: var(--ac); line-height: 1; }
  .sec-head h3 { font-family: "Noto Serif SC", "Noto Serif JP", serif; font-weight: 900; font-size: 21px; letter-spacing: .1em; color: var(--ink); }

  .item .t { font-size: 15.5px; font-weight: 700; color: var(--ink); line-height: 1.5; }
  .item .t .tag {
    display: inline-block; font-size: 11px; font-weight: 700; color: #fff;

  .item .d { margin-top: 6px; font-size: 14px; color: var(--ink-soft); }

  .risk { margin-top: 40px; text-align: center; font-size: 12.5px; color: var(--ink-faint); letter-spacing: .08em; }

  .item .t a.lk, .spotlight h2 a.lk {
    color: inherit; text-decoration: underline;
    text-decoration-thickness: 1px; text-underline-offset: 4px;
    text-decoration-color: color-mix(in srgb, currentColor 32%, transparent);
    transition: text-decoration-color .18s ease, color .18s ease;
  }
  .item .t a.lk:hover { color: var(--ac-deep); text-decoration-color: currentColor; }
  .spotlight h2 a.lk { text-decoration-color: rgba(242, 251, 250, .35); }

  .noscript-note { padding: 40px 0; text-align: center; color: var(--ink-faint); }

  @media (max-width: 640px) {
    .mast-title-row { flex-wrap: wrap; }
    .mast-side { align-items: flex-start; }
    .cal-pop { right: auto; left: 0; }
  }
</style>

  var BRIEFING = /*__BRIEFING_DATA__*/{"date": "2026-11-18", "meta": {"zh": "星期三 · 农历十月初十 · timab.cn", "en": "Wednesday · 10th day of the 10th lunar month · timab.cn", "es": "Miércoles · 10.º día del 10.º mes lunar · timab.cn", "ja": "水曜日 · 旧暦十月十日 · timab.cn"}, "spotlight": {"badge": {"zh": "精选", "en": "SPOTLIGHT", "es": "DESTACADO", "ja": "注目"}, "title": {"zh": "中国第三次做东，21 个经济体今天在深圳谈「共同体」", "en": "China hosts for the third time, and 21 economies talk “community” in Shenzhen today", "es": "China es anfitrión por tercera vez y 21 economías hablan de «comunidad» en Shenzhen", "ja": "中国が3度目の議長、きょう深圳で21の経済体が「共同体」を語る"}, "hl": {"zh": "亚太经合组织（APEC）第三十三次领导人非正式会议 11 月 18 日至 19 日在深圳举行，主题为「建设亚太共同体，促进共同繁荣」。这是继 2001 年上海、2014 年北京之后，中国第三次担任 APEC 东道主。", "en": "The 33rd APEC Economic Leaders' Meeting opens in Shenzhen on 18-19 November under the theme “Building an Asia-Pacific Community to Prosper Together” — China's third turn as host after Shanghai in 2001 and Beijing in 2014.", "es": "La 33.ª Reunión de Líderes Económicos de APEC se celebra en Shenzhen los días 18 y 19 de noviembre bajo el lema «Construir una comunidad de Asia-Pacífico para prosperar juntos», la tercera vez que China ejerce de anfitriona tras Shanghái 2001 y Pekín 2014.", "ja": "APEC（アジア太平洋経済協力）第33回非公式首脳会議が11月18〜19日に深圳で開幕する。テーマは「アジア太平洋共同体の構築、共通の繁栄の促進」で、2001年上海、2014年北京に続く中国の3度目の議長となる。"}, "body": {"zh": "今年 APEC「中国年」共举办 300 多场会议活动，经贸领域形成近 50 项务实成果；工商领导人峰会 11 月 17 日至 18 日在深圳前海举行，2000 余位政商界代表到场，参会世界 500 强达 115 家，覆盖全部 21 个 APEC 经济体，另有英国、法国、德国等 13 个域外经济体企业参与。峰会预计发布 30 年历史上首份《APEC 工商领导人深圳倡议》。深圳与 APEC 经济体贸易额从 1996 年的 2675 亿元增至 2025 年的 3.13 万亿元。外交部 11 月 16 日宣布，中俄美元首会晤将于 11 月 19 日在深圳举行，为三国元首史上首次面对面会晤。", "en": "This year's APEC “China Year” has staged more than 300 meetings and events and produced nearly 50 practical outcomes on trade and investment. The CEO Summit, held at Shenzhen's Qianhai on 17-18 November, drew more than 2,000 political and business leaders, including 115 Fortune Global 500 companies and representatives from all 21 member economies plus 13 non-APEC economies such as the UK, France and Germany. It is expected to issue the first “APEC CEO Summit Shenzhen Initiative” in its 30-year history. Shenzhen's trade with APEC economies rose from 267.5 billion yuan in 1996 to 3.13 trillion yuan in 2025. On 16 November the foreign ministry announced that the leaders of China, Russia and the United States will meet in Shenzhen on 19 November, the first face-to-face meeting of the three.", "es": "El «Año China» de APEC ha celebrado más de 300 reuniones y actividades y ha logrado cerca de 50 resultados prácticos en comercio e inversión. La cumbre empresarial, celebrada en Qianhai (Shenzhen) los días 17 y 18, reunió a más de 2.000 líderes políticos y empresariales, entre ellos 115 empresas del Fortune Global 500, con representación de las 21 economías miembros y de 13 economías externas como Reino Unido, Francia y Alemania. Está previsto que emita la primera «Iniciativa de Shenzhen» de sus 30 años de historia. El comercio de Shenzhen con las economías de APEC pasó de 267.500 millones de yuanes en 1996 a 3,13 billones en 2025. El 16 de noviembre, el Ministerio de Asuntos Exteriores anunció que los líderes de China, Rusia y Estados Unidos se reunirán en Shenzhen el 19 de noviembre.", "ja": "今年のAPEC「中国年」では300回を超える会合やイベントが開かれ、貿易・投資分野で50件近い実務的成果が積み上げられた。17〜18日に深圳前海で開かれた工商リーダーサミットには2000人超の政財界代表が参加し、世界500強企業は115社、21の経済体すべてをカバーし、英国・フランス・ドイツなど域外13経済体の企業も加わった。サミットは30年の歴史で初となる「深圳イニシアティブ」を採択する見通しだ。深圳とAPEC 経済体との貿易額は1996年の2675億元から2025年には3.13兆元に増えた。外交部は11月16日、中露米の首脳会談を11月19日に深圳で行うと発表した。"}, "why": {"zh": "领导人会议不产生硬约束，真正的看点在文件里：数字贸易框架、跨境数据核验、人工智能创新生态、互联互通新文本——这些才是会落到企业关税、签证和合规成本上的东西。今年还有两个可对照的坐标：亚太自贸区愿景 20 周年、APEC 互联互通蓝图终期评估。会场之外的信号同样明确：115 家世界 500 强自费飞来深圳，比任何公报都直白。", "en": "Leaders' meetings bind no one; the substance sits in the annexes — frameworks for digital trade, cross-border data verification, an open AI innovation ecosystem, a new connectivity document. Those are what eventually reach tariffs, visas and compliance costs. Two benchmarks make this year comparable: the 20th anniversary of the FTAAP vision and the final review of the APEC Connectivity Blueprint. The signal outside the hall is just as clear: 115 Fortune Global 500 firms flew to Shenzhen at their own expense.", "es": "Las cumbres no obligan a nadie; la sustancia está en los anexos: marcos de comercio digital, verificación transfronteriza de datos, un ecosistema abierto de innovación en IA y un nuevo documento de conectividad. Eso es lo que acaba en aranceles, visados y costes de cumplimiento. Dos referencias permiten comparar: el 20.º aniversario de la visión del Área de Libre Comercio de Asia-Pacífico y la evaluación final del Plan de Conectividad. La señal fuera del recinto es igual de clara: 115 empresas del Fortune Global 500 viajaron a Shenzhen por su cuenta.", "ja": "首脳会議に拘束力はない。中身は付属文書にある。デジタル貿易の枠組み、越境データの検証、開かれたAIイノベーション生態系、コネクティビティの新文書——これらがやがて関税やビザ、コンプライアンス費用に効いてくる。比較軸も二つある。アジア太平洋自由貿易圏構想20周年と、コネクティビティ青写真の最終評価だ。会場の外の信号も明快で、世界500強115社が自費で深圳に集まった。"}}, "sections": [{"key": "intl", "num": "01", "color": "#1d4ed8", "deep": "#1e3fa8", "name": {"zh": "国际时事", "en": "World", "es": "Internacional", "ja": "国際"}, "items": [{"idx": "01", "tag": {"zh": "进展"}, "title": {"zh": "霍尔木兹以东又一艘油轮触雷，伊朗提出「两日开放」方案", "en": "Another tanker hits a mine east of Hormuz as Iran floats a “two-day opening”", "es": "Otro petrolero choca con una mina al este de Ormuz mientras Irán plantea una «apertura de dos días»", "ja": "ホルムズ海峡以東でまたタンカーが機雷に接触、イランは「2日間開放」を提案"}, "body": {"zh": "伊朗海军 17 日通报，一艘油轮当天在霍尔木兹海峡以东的限制水域航行时，因关闭导航系统违反规定，随后触雷起火并严重损毁。伊朗革命卫队此前称，周末至周一另有六艘油轮在类似事件中起火。伊朗外长在巴基斯坦举行的一场会议上介绍霍尔木兹「两日开放计划」，称已获多国支持。国际能源署数据显示，第三季度经霍尔木兹外运的原油及油品环比增加 7% 至日均 910 万桶，仍远低于去年同期的 2140 万桶。", "en": "Iran's navy said on 17 November that an oil tanker sailing in a restricted zone east of the Strait of Hormuz with its navigation system switched off — a violation of the rules — struck a mine, caught fire and was severely damaged. The Revolutionary Guard had earlier said six other tankers caught fire in similar incidents between the weekend and Monday. Iran's foreign minister presented a “two-day opening plan” for the strait at a conference in Pakistan, saying several countries had backed it. IEA data show crude and product shipments through Hormuz rose 7% quarter-on-quarter to 9.1 million barrels a day in the third quarter, still far below 21.4 million a year earlier.", "es": "La Armada iraní informó el 17 de noviembre de que un petrolero que navegaba en una zona restringida al este del estrecho de Ormuz con el sistema de navegación apagado —lo que infringe las normas— chocó con una mina, se incendió y sufrió graves daños. La Guardia Revolucionaria había señalado antes que otros seis petroleros se incendiaron en incidentes similares entre el fin de semana y el lunes. El ministro de Asuntos Exteriores iraní presentó en una conferencia en Pakistán un «plan de apertura de dos días» para el estrecho y afirmó que varios países lo respaldan. Según la AIE, los envíos de crudo y productos por Ormuz subieron un 7% intertrimestral hasta 9,1 millones de barriles diarios en el tercer trimestre, muy por debajo de los 21,4 millones de un año antes.", "ja": "イラン海軍は17日、ホルムズ海峡以東の制限水域を航行していたタンカーが、航法装置を切って規定に違反したため機雷に触れ、火災で大きく損傷したと発表した。革命防衛隊は先に、週末から月曜にかけて別の6隻が同様の事故で炎上したと述べていた。イランの外相はパキスタンでの会合でホルムズの「2日間開放計画」を説明し、複数国の支持を得たとしている。IEAによると、第3四半期にホルムズ経由で外運された原油・石油製品は前四半期比7%増の日量910万バレルで、前年同期の2140万バレルを大きく下回る。"}, "why": {"zh": "「关闭导航系统」成了这一轮事故的共同注脚——船在暗处走，水雷在明处等。所谓「两日开放」是通行秩序的临时补丁，不是解决方案；真正决定运价的是保险公司的费率表，而不是外交辞令。", "en": "“Navigation off” is the common footnote to this round of incidents: ships moving in the dark, mines waiting in plain sight. A “two-day opening” is a patch on traffic order, not a solution. What really sets freight rates is the insurers' rate card, not diplomatic language.", "es": "«Navegación apagada» es la nota común de esta ronda: barcos a oscuras, minas a la vista. Una «apertura de dos días» es un parche al orden del tráfico, no una solución. Lo que fija el flete es la tarifa de las aseguradoras, no la retórica diplomática.", "ja": "「航法装置を切る」が今回の事故に共通する注釈だ。船は暗がりを進み、機雷は明るみで待つ。「2日間開放」は通行秩序の応急処置であって解決策ではない。運賃を決めるのは保険会社の料率表であり、外交の言葉ではない。"}}, {"idx": "02", "tag": {"zh": "进展"}, "title": {"zh": "伊朗称击中美军巴林基地雷达，美军第三艘航母到位", "en": "Iran says it hit a radar at a U.S. base in Bahrain as a third U.S. carrier arrives", "es": "Irán dice haber alcanzado un radar en una base de EE. UU. en Baréin y llega un tercer portaaviones", "ja": "イランがバーレーンの米軍基地レーダーを攻撃と主張、米空母3隻目が到着"}, "body": {"zh": "伊朗伊斯兰革命卫队 17 日发表声明，称使用无人机打击了美军位于巴林的谢赫伊萨空军基地内一套雷达系统。同日，美军中央司令部确认「罗斯福」号航母打击群进入中东责任区，与「布什」号、「华盛顿」号汇合，中东区域集结三艘航母及十余艘驱逐舰、巡洋舰。伊朗方面同时警告，若美国或以色列打击伊朗境内民用基础设施周边目标，伊方将报复美以军事基地附近的民用设施。", "en": "Iran's Islamic Revolutionary Guard Corps said on 17 November that it had used drones to strike a radar system at the Sheikh Isa air base in Bahrain used by U.S. forces. The same day, U.S. Central Command confirmed that the USS Roosevelt carrier strike group had entered its area of responsibility, joining the USS Bush and USS Washington — three carriers plus more than ten destroyers and cruisers in the region. Iran warned that if the United States or Israel hit targets near civilian infrastructure on Iranian soil, it would retaliate against civilian facilities near U.S. and Israeli bases.", "es": "La Guardia Revolucionaria iraní afirmó el 17 de noviembre haber usado drones para atacar un sistema de radar en la base aérea de Sheikh Isa, en Baréin, utilizada por fuerzas estadounidenses. Ese mismo día, el Mando Central de EE. UU. confirmó que el grupo de ataque del portaaviones Roosevelt entró en su área de responsabilidad y se sumó al Bush y al Washington: tres portaaviones y más de diez destructores y cruceros en la región. Irán advirtió de que, si EE. UU. o Israel golpean objetivos cercanos a infraestructura civil en su territorio, responderá contra instalaciones civiles próximas a bases estadounidenses e israelíes.", "ja": "イラン革命防衛隊は17日、バーレーンのシェイク・イサ空軍基地内の米軍レーダーシステムを無人機で攻撃したと発表した。同日、米中央軍は空母「ルーズベルト」打撃群が中東の担当海域に入り、「ブッシュ」「ワシントン」と合流したと確認した。中東には空母3隻と駆逐艦・巡洋艦10数隻が集まる。イランは、米国かイスラエルがイラン国内の民用インフラ周辺を攻撃すれば、米・イスラエル基地周辺の民用施設に報復すると警告した。"}, "why": {"zh": "一边是无人机换雷达的「低成本对账」，一边是三艘航母的「高成本存在」。双方都在把筹码摆上桌，却都避免正面决战——这种结构最容易出事：一次误判就足以让「可控对峙」变成不可控。", "en": "On one side, drones traded for radars — a low-cost ledger. On the other, three carriers — a high-cost presence. Both are putting chips on the table while avoiding a head-on fight, and that structure is the most accident-prone: one miscalculation turns “managed confrontation” into something nobody manages.", "es": "A un lado, drones por radares: una contabilidad de bajo coste. Al otro, tres portaaviones: una presencia de alto coste. Ambos ponen fichas sobre la mesa y evitan el choque frontal, y esa estructura es la más propensa al accidente: un error de cálculo convierte la «confrontación gestionada» en algo que nadie gestiona.", "ja": "一方は無人機とレーダーの「低コストの突き合わせ」、他方は空母3隻という「高コストの存在」。双方が駒を並べながら正面衝突は避ける。この構造が最も事故を招きやすい。誤算ひとつで「管理された対峙」は管理不能になる。"}}, {"idx": "03", "tag": {"zh": "进展"}, "title": {"zh": "也门：联军 24 小时空袭致 17 死 39 伤，胡塞推进至亚丁 70 公里", "en": "Yemen: coalition strikes kill 17 in 24 hours as Houthis close to within 70 km of Aden", "es": "Yemen: los ataques de la coalición dejan 17 muertos en 24 horas y los hutíes llegan a 70 km de Adén", "ja": "イエメン：連合軍の24時間空爆で17人死亡39人負傷、フーシ派はアデン70キロまで接近"}, "body": {"zh": "也门胡塞武装 17 日晚称，过去 24 小时内沙特主导的多国联军对萨那、荷台达和萨达发动空袭等军事行动，共造成 17 人死亡、39 人受伤。此前沙特国王发布命令更换也门多国联军指挥官，由武装部队总参谋长兼任，原指挥官改任军事顾问。也门政府军已放弃曼德海峡前线阵地回防亚丁，胡塞武装推进至距亚丁约 70 公里处，塔伊兹周边成为最激烈交战区。", "en": "Yemen's Houthi movement said late on 17 November that Saudi-led coalition air strikes and other operations on Sanaa, Hodeidah and Saada over the previous 24 hours killed 17 people and wounded 39. Earlier, Saudi Arabia's king ordered a change of commander for the coalition, with the armed forces chief of general staff taking over and the previous commander becoming a military adviser. Government forces have abandoned front-line positions at the Bab al-Mandab strait and pulled back to Aden, while the Houthis have advanced to about 70 km from the city, with Taiz the most contested area.", "es": "El movimiento hutí yemení afirmó la noche del 17 de noviembre que los ataques aéreos y otras operaciones de la coalición liderada por Arabia Saudí sobre Saná, Hodeida y Saada en las 24 horas anteriores causaron 17 muertos y 39 heridos. Antes, el rey saudí ordenó cambiar al comandante de la coalición: el jefe del Estado Mayor asume el mando y el anterior pasa a asesor militar. Las fuerzas gubernamentales abandonaron posiciones en el estrecho de Bab al-Mandab y se replegaron a Adén, mientras los hutíes avanzaron hasta unos 70 km de la ciudad, con Taiz como zona más disputada.", "ja": "イエメンのフーシ派は17日夜、過去24時間にサウジ主導の多国籍軍がサヌア、ホデイダ、サアダに空爆などの軍事行動を行い、17人が死亡、39人が負傷したと発表した。これに先立ちサウジ国王は多国籍軍の司令官交代を命じ、参謀総長が兼務し、前司令官は軍事顧問に転じた。政府軍はバベルマンデブ海峡の前線陣地を放棄してアデンへ後退し、フーシ派はアデンまで約70キロまで迫った。タイズ周辺が最も激しい交戦地域となっている。"}, "why": {"zh": "换帅通常意味着战场评估出了问题。曼德海峡是红海航运的南门，政府军从那里后撤，比任何战报都更能说明态势——如果亚丁真的被围，红海—亚丁湾这条线的保险费还要再涨一轮。", "en": "A change of command usually means the battlefield assessment was wrong. Bab al-Mandab is the southern gate of Red Sea shipping; the army pulling back from there says more than any communiqué. If Aden is genuinely encircled, insurance costs along the Red Sea–Gulf of Aden route go up another notch.", "es": "Un cambio de mando suele significar que la evaluación del campo de batalla falló. Bab al-Mandab es la puerta sur del tráfico del mar Rojo; que el ejército se retire de allí dice más que cualquier comunicado. Si Adén queda realmente cercada, los seguros de la ruta mar Rojo–golfo de Adén subirán otro escalón.", "ja": "司令官交代は通常、戦況評価に問題があったことを意味する。バベルマンデブ海峡は紅海航運の南の門であり、そこから政府軍が退いた事実はどの戦報よりも雄弁だ。アデンが本当に包囲されれば、紅海―アデン湾航路の保険料はもう一段上がる。"}}, {"idx": "04", "tag": {"zh": "进展"}, "title": {"zh": "克里米亚大桥铁路恢复单线通行", "en": "Rail traffic resumes on a single track of the Crimean Bridge", "es": "El ferrocarril del puente de Crimea vuelve a circular por una sola vía", "ja": "クリミア橋の鉄道が単線で通行再開"}, "body": {"zh": "俄罗斯交通部 17 日表示，克里米亚大桥铁路已恢复单线通行，另一条线路的修复工作仍在进行，当天从刻赤开往俄罗斯大陆地区的列车预计按原定时刻表发车。此前俄方称大桥遭袭，多地遭遇大规模无人机袭击。乌克兰方面则称，本月已出动无人机袭击 13 座俄罗斯炼油厂；据路斯塔德能源数据，11 月上旬俄罗斯炼油厂开工量为日均 420 万桶，低于 10 月末的 500 万桶。", "en": "Russia's transport ministry said on 17 November that rail traffic on the Crimean Bridge had resumed on a single track, with repairs to the other line continuing, and that trains from Kerch to the Russian mainland were expected to run to schedule. Moscow had earlier said the bridge was attacked and that multiple regions came under large-scale drone attacks. Ukraine says it has struck 13 Russian refineries with drones this month; Rystad Energy data put Russian refinery runs at 4.2 million barrels a day in early November, down from 5.0 million in late October.", "es": "El Ministerio de Transporte ruso informó el 17 de noviembre de que el tráfico ferroviario en el puente de Crimea se reanudó por una sola vía, mientras continúan las reparaciones de la otra, y que los trenes de Kerch al continente ruso circularían según horario. Moscú había denunciado un ataque contra el puente y ataques masivos con drones en varias regiones. Ucrania afirma haber golpeado este mes 13 refinerías rusas; según Rystad Energy, el procesamiento ruso era de 4,2 millones de barriles diarios a principios de noviembre, frente a 5,0 millones a finales de octubre.", "ja": "ロシア交通省は17日、クリミア橋の鉄道が単線で通行を再開し、もう一方の線の復旧作業は続いていると発表した。ケルチからロシア本土方面の列車は定刻どおり運行する見通しだという。ロシアは先に、橋が攻撃を受け、複数地域で大規模な無人機攻撃があったと述べていた。ウクライナ側は今月、無人機でロシアの製油所13か所を攻撃したと主張する。Rystad Energyによると、11月上旬のロシアの製油所稼働量は日量420万バレルで、10月末の500万バレルを下回る。"}, "why": {"zh": "一座桥的「单线恢复」是修复能力的展示，也是脆弱性的公示——它同时是补给线和平民通道。炼油厂开工率从 500 万桶掉到 420 万桶，这才是这轮互袭真正的账本：打的是设施，掉的是产能。", "en": "Restoring one track is a demonstration of repair capacity and a public statement of fragility — the bridge is both a supply line and a civilian route. Refinery runs falling from 5.0 to 4.2 million barrels is the real ledger of this exchange: the targets are facilities, the loss is throughput.", "es": "Reabrir una vía demuestra capacidad de reparación y anuncia fragilidad: el puente es a la vez línea de suministro y ruta civil. Que el procesamiento caiga de 5,0 a 4,2 millones de barriles es la contabilidad real de este intercambio: se atacan instalaciones y se pierde capacidad.", "ja": "片線での再開は復旧力の提示であると同時に脆さの公表でもある。橋は補給線であり民用の通り道でもある。製油所稼働が500万から420万バレルに落ちたことが、この応酬の本当の帳簿だ。狙われるのは施設、失われるのは生産能力である。"}}, {"idx": "05", "title": {"zh": "英国制裁 8 家参与约旦河西岸定居点建设的公司", "en": "Britain sanctions eight firms building Israeli settlements in the West Bank", "es": "Reino Unido sanciona a ocho empresas que construyen asentamientos en Cisjordania", "ja": "英国、ヨルダン川西岸の入植地建設に関与した8社を制裁"}, "body": {"zh": "当地时间 17 日，英国外交部宣布制裁 8 家参与扩建约旦河西岸以色列定居点的建筑和房地产开发公司，以及一个阻止援助物资进入加沙的活动组织。英方称，被制裁公司参与了定居点住房及公共基础设施的规划、建设和营销；被制裁组织曾封锁过境点、港口和道路，阻碍人道主义援助车队前往加沙。此前，澳大利亚、加拿大、英国、意大利四国已联合敦促以色列立即允许人道援助进入加沙。", "en": "Britain's Foreign Office announced sanctions on 17 November against eight construction and real-estate firms involved in expanding Israeli settlements in the occupied West Bank, plus an activist group that has blocked aid from entering Gaza. It said the companies took part in planning, building and marketing settlement housing and public infrastructure, and that the group had blockaded crossings, ports and roads to stop humanitarian convoys reaching Gaza. Australia, Canada, Britain and Italy had earlier jointly urged Israel to allow aid into Gaza immediately.", "es": "La Oficina de Asuntos Exteriores británica anunció el 17 de noviembre sanciones contra ocho empresas de construcción e inmobiliarias implicadas en ampliar los asentamientos israelíes en Cisjordania ocupada, y contra un grupo activista que impide la entrada de ayuda en Gaza. Londres señaló que las empresas participaron en la planificación, construcción y comercialización de vivienda e infraestructura de los asentamientos, y que el grupo bloqueó cruces, puertos y carreteras para frenar convoyes humanitarios. Australia, Canadá, Reino Unido e Italia habían instado conjuntamente a Israel a permitir la ayuda de inmediato.", "ja": "英外務省は17日、ヨルダン川西岸のイスラエル入植地拡大に関与した建設・不動産開発会社8社と、ガザへの支援物資搬入を妨げる活動団体1つを制裁対象に指定したと発表した。企業は入植地の住宅や公共インフラの計画・建設・販売に関与し、団体は検問所や港、道路を封鎖して人道支援車列を妨げたという。これに先立ち豪・加・英・伊の4か国は、イスラエルに人道支援の即時搬入を求める共同声明を出していた。"}, "why": {"zh": "制裁名单第一次把「开发商」写进去，等于把定居点当作工程项目而非政治口号来处理——这是可执行的切口，也让西方内部对以政策的分歧变得具体。对读者而言，这类名单的意义在于它可被核查：谁在投标、谁在融资、谁在卖房。", "en": "Putting developers on the list treats settlements as engineering projects rather than political slogans — an enforceable entry point, and a concrete measure of Western disagreement over Israel policy. The value of such lists is that they can be checked: who bids, who finances, who sells.", "es": "Incluir a promotoras en la lista trata los asentamientos como proyectos de ingeniería y no como eslóganes políticos: un punto de entrada exigible y una medida concreta de la discrepancia occidental sobre Israel. El valor de estas listas es que se pueden verificar: quién licita, quién financia, quién vende.", "ja": "開発業者をリストに入れることは、入植地を政治スローガンではなく工事案件として扱うことを意味する。実行可能な切り口であり、イスラエル政策をめぐる西側内部の相違を具体化する。こうしたリストの意味は検証できることにある。誰が入札し、誰が融資し、誰が売るのか。"}}]}, {"key": "dom", "num": "02", "color": "#cf2f1e", "deep": "#b02615", "name": {"zh": "国内要闻", "en": "China", "es": "China", "ja": "国内"}, "items": [{"idx": "01", "title": {"zh": "习近平对人民法院工作作出重要指示", "en": "Xi issues instructions on the work of people's courts", "es": "Xi emite instrucciones sobre el trabajo de los tribunales populares", "ja": "習近平総書記、人民法院の活動に重要指示"}, "body": {"zh": "新华社 11 月 17 日报道，习近平总书记近日对人民法院工作作出重要指示，强调加快建设公正高效权威的社会主义司法制度，以高质量司法更好保障高质量发展和高水平安全。指示要求坚持党的领导、坚持以人民为中心、坚持走中国特色社会主义法治道路、坚持依法独立公正行使审判权，深化司法体制改革，规范司法权力运行，锻造忠诚干净担当的过硬队伍。第二十三次全国法院工作会议 16 日至 17 日在京召开，会上传达了这一重要指示，中央政法委书记陈文清出席讲话，最高人民法院院长张军主持。", "en": "Xinhua reported on 17 November that Xi Jinping has issued important instructions on the work of people's courts, calling for faster progress in building a fair, efficient and authoritative socialist judicial system and for high-quality justice that better safeguards high-quality development and high-level security. The instructions stress Party leadership, a people-centred approach, the socialist rule-of-law path and the independent and impartial exercise of judicial power, along with deeper judicial reform, regulated judicial authority and a loyal, clean and responsible workforce. The 23rd national court work conference was held in Beijing on 16-17 November, where the instructions were conveyed; Chen Wenqing, secretary of the Central Political and Legal Affairs Commission, addressed the meeting, which was chaired by Chief Justice Zhang Jun.", "es": "La agencia Xinhua informó el 17 de noviembre de que Xi Jinping ha emitido instrucciones sobre el trabajo de los tribunales populares, en las que pide acelerar la construcción de un sistema judicial socialista justo, eficiente y autoritativo, y una justicia de calidad que proteja mejor el desarrollo de alta calidad y la seguridad de alto nivel. Las instrucciones subrayan el liderazgo del Partido, el enfoque en las personas, la vía socialista del Estado de derecho y el ejercicio independiente e imparcial de la potestad judicial, junto con la reforma judicial, la regulación del poder judicial y un cuerpo leal, íntegro y responsable. La XXIII conferencia nacional de trabajo de los tribunales se celebró en Pekín los días 16 y 17; Chen Wenqing, secretario de la Comisión Central de Asuntos Políticos y Jurídicos, intervino y el presidente del Tribunal Supremo, Zhang Jun, presidió.", "ja": "新華社は11月17日、習近平総書記が人民法院の活動について重要指示を出したと報じた。公正・効率・権威を備えた社会主義司法制度の構築を加速し、高品質の司法で高品質の発展と高水準の安全をよりよく保障するよう求めた。指示は党の指導、人民中心、社会主義法治の道、審判権の依法独立公正な行使を堅持し、司法体制改革を深化させ、司法権の運行を規範化し、忠誠・清廉・担当の隊伍を鍛えることを強調した。第23回全国法院工作会議が16〜17日に北京で開かれ、指示が伝達された。中央政法委の陳文清書記が出席して講話し、最高人民法院の張軍院長が議事を主持した。"}, "why": {"zh": "「高质量司法」被放在「高质量发展和高水平安全」之间，是这次指示的重心：司法不只是纠纷的终点，也被当作营商环境与安全治理的组成部分。对企业和个人来说，产权与知识产权保护、涉企案件办理效率，是可以具体感知的落点。", "en": "Placing “high-quality justice” between “high-quality development” and “high-level security” is the core of the instruction: courts are not just where disputes end but part of the business environment and security governance. For firms and individuals, property and IP protection and the handling speed of company-related cases are the points that can actually be felt.", "es": "Situar la «justicia de calidad» entre el «desarrollo de alta calidad» y la «seguridad de alto nivel» es el núcleo: los tribunales no son solo el final de los litigios, sino parte del entorno de negocios y de la gobernanza de la seguridad. Para empresas y ciudadanos, la protección de la propiedad y la propiedad intelectual y la agilidad en casos empresariales son los puntos tangibles.", "ja": "「高品質の司法」を「高品質の発展」と「高水準の安全」の間に置いた点が重心だ。司法は紛争の終点ではなく、ビジネス環境と安全ガバナンスの一部でもある。企業や個人にとっては、財産権・知的財産権の保護と企業関連案件の処理速度が実感できる接点になる。"}}, {"idx": "02", "title": {"zh": "九部门发文：16 条举措，专治废旧家具「扔比买难」", "en": "Nine departments target the “harder to throw away than to buy” problem", "es": "Nueve departamentos atacan el problema de «más difícil de tirar que de comprar»", "ja": "9部門が16項目の措置、「買うより捨てる方が難しい」に取り組む"}, "body": {"zh": "商务部、国家发展改革委、工业和信息化部等 9 部门印发的《关于深入推进再生资源回收体系建设 促进回收行业高质量发展的意见》11 月 17 日对外发布，围绕推广典型回收模式、抓好「新三样」固废回收拆解、促进回收行业提质升级等提出 16 项重点任务，明确到 2030 年初步建立回收网络健全完善、居民交投便捷顺畅的回收体系。针对大件废旧家具，意见提出包干清运、市场化上门清运、公益回收清运三种模式；对动力电池、光伏组件、风机叶片，要求推动新能源汽车「车电一体报废」回收拆解，健全退役光电设备回收体系。2025 年全国主要品种回收总量 4.17 亿吨、回收总额 1.39 万亿元。", "en": "Nine departments including the Ministry of Commerce, the National Development and Reform Commission and the Ministry of Industry and Information Technology released guidelines on 17 November on building a better recycling system, with 16 tasks covering typical collection models, dismantling of “new three” waste — power batteries, PV modules and wind turbine blades — and upgrading the industry. The goal is a well-connected network with convenient drop-off for residents by 2030. For bulky furniture the guidelines offer three models: contracted clearing, market-based door-to-door collection and free public-interest collection. For batteries they require “vehicle and battery scrapped together” dismantling. In 2025 China collected 417 million tonnes of major recyclables worth 1.39 trillion yuan.", "es": "Nueve departamentos —entre ellos Comercio, la Comisión Nacional de Desarrollo y Reforma y el Ministerio de Industria— publicaron el 17 de noviembre unas directrices con 16 tareas para mejorar el sistema de reciclaje: modelos típicos de recogida, desmontaje de los residuos de las «tres nuevas» (baterías, módulos fotovoltaicos y palas de aerogenerador) y modernización del sector, con el objetivo de una red completa y cómoda para el ciudadano en 2030. Para muebles voluminosos se plantean tres modelos: retirada contratada, recogida a domicilio de mercado y recogida gratuita de interés público. Para las baterías se exige el desguace conjunto vehículo-batería. En 2025 se recogieron 417 millones de toneladas de materiales reciclables por 1,39 billones de yuanes.", "ja": "商務省、国家発展改革委、工業情報化省など9部門が11月17日、再生資源回収体系の整備に関する意見を公表した。典型モデルの普及、「新三様」廃棄物（動力電池、太陽光パネル、風車ブレード）の回収・解体、業界の高度化など16の重点任務を掲げ、2030年までに住民が便利に持ち込める回収網を概ね構築するとした。大型家具については請負回収、市場型の戸別回収、公益回収の3モデルを提示。動力電池は「車と電池の一体廃棄」による解体を求めた。2025年の主要品目回収量は4.17億トン、回収額1.39兆元。"}, "why": {"zh": "「扔比买难」是个极小的问题，但它决定了以旧换新的最后一公里能不能闭环。政策的关键不是口号而是责任分配：谁负责搬下楼、谁付运费、谁保证拆解不污染。这一条如果落地，家里的旧沙发和退役电池才算真正有了去处。", "en": "“Harder to throw away than to buy” looks trivial, but it decides whether trade-in programmes can close the loop. What matters is not the slogan but who does what: who carries it downstairs, who pays the freight, who guarantees the dismantling is clean. If this lands, the old sofa and the retired battery finally have a destination.", "es": "«Más difícil de tirar que de comprar» parece menor, pero decide si los programas de sustitución cierran el círculo. Lo importante no es el eslogan sino quién hace qué: quién lo baja, quién paga el porte, quién garantiza un desmontaje limpio. Si esto funciona, el sofá viejo y la batería retirada tendrán por fin destino.", "ja": "「買うより捨てる方が難しい」は小さな問題に見えるが、買い替え促進が最後の一歩で閉じるかどうかを決める。鍵は掛け声ではなく責任分担だ。誰が階下まで運び、誰が運賃を払い、誰が分解の環境安全を保証するのか。これが動けば、古いソファも引退した電池も行き先を持つ。"}}, {"idx": "03", "title": {"zh": "8 省市入选 6G 部省协同试点，北斗终端已近 4200 万台", "en": "Eight regions join 6G pilot programme as BeiDou terminals near 42 million", "es": "Ocho regiones entran en el plan piloto de 6G y los terminales BeiDou rozan los 42 millones", "ja": "8省市が6G部省連携試行に、北斗端末は4200万台近くに"}, "body": {"zh": "工业和信息化部近日复函同意北京市、河北省、上海市、江苏省、浙江省、安徽省、湖北省、广东省 8 个省市开展 6G 创新发展部省协同试点，统筹推进 6G 技术创新、产业发展和应用培育。同期，工信部批准《半导体设备与零部件质量管理体系》行业标准，系统规范全生命周期质量管理。截至 2026 年上半年，我国各类北斗终端设备（不含消费类电子）应用数量接近 4200 万台/套，较去年同期增加近 900 万台/套，同比增长约 27%，北斗综合应用渗透率超过 90%。", "en": "The Ministry of Industry and Information Technology has approved 6G innovation pilots in eight provincial-level regions — Beijing, Hebei, Shanghai, Jiangsu, Zhejiang, Anhui, Hubei and Guangdong — to coordinate technology, industry and applications. It also approved an industry standard on quality management systems for semiconductor equipment and components. By mid-2026, China had nearly 42 million BeiDou terminals in use excluding consumer electronics, up nearly nine million year on year, or about 27%, with penetration above 90%.", "es": "El Ministerio de Industria aprobó programas piloto de innovación en 6G en ocho regiones —Pekín, Hebei, Shanghái, Jiangsu, Zhejiang, Anhui, Hubei y Guangdong— para coordinar tecnología, industria y aplicaciones. También aprobó una norma sectorial de gestión de calidad para equipos y componentes semiconductores. A mediados de 2026 China tenía casi 42 millones de terminales BeiDou en uso, sin electrónica de consumo, casi nueve millones más interanual (27%), con una penetración superior al 90%.", "ja": "工業情報化省はこのほど、北京市、河北省、上海市、江蘇省、浙江省、安徽省、湖北省、広東省の8省市で6G革新発展の部省連携試行を認め、技術革新・産業発展・応用育成を一体的に進めるとした。半導体設備・部品の品質管理体系に関する業界標準も承認した。2026年上半期時点で、消費電子を除く各種北斗端末の利用数は約4200万台/セットに達し、前年同期比約27%増、総合応用の普及率は90%を超えた。"}, "why": {"zh": "6G 还在标准前夜，试点先落地，说明资源开始按「能不能形成产业」而非「论文多少」来分配。北斗那组数字更能说明问题：增速 27%、渗透率超 90%，意味着它已经从「新基建概念」变成水电一样的基础条件——真正的新故事在应用侧，而不在天上。", "en": "6G is still pre-standard, and pilots coming first means resources are being allocated by whether an industry can form, not by paper counts. The BeiDou numbers say more: 27% growth and over 90% penetration mean it has moved from “new infrastructure concept” to a utility like water and power. The new story is in applications, not in orbit.", "es": "La 6G aún está antes del estándar, y que los pilotos lleguen primero indica que los recursos se asignan por si puede formarse una industria, no por número de artículos. Los datos de BeiDou dicen más: 27% de crecimiento y más del 90% de penetración implican que pasó de «concepto de nueva infraestructura» a servicio básico. La novedad está en las aplicaciones, no en la órbita.", "ja": "6Gはまだ標準化の前夜で、試行が先行するのは「論文の数」ではなく「産業になるか」で資源を配分し始めた証拠だ。北斗の数字はもっと雄弁で、27%増・普及率90%超は「新インフラの概念」から水道・電気のような基礎条件へ移ったことを意味する。新しい物語は応用側にある。"}}, {"idx": "04", "title": {"zh": "药监抽检：17 家药企 27 批次药品不符合规定", "en": "Drug regulator: 27 batches from 17 manufacturers fail inspection", "es": "El regulador farmacéutico: 27 lotes de 17 fabricantes no cumplen", "ja": "薬監の抽検で17社27ロットが規定不適合"}, "body": {"zh": "国家药监局最新药品抽检通告显示，经天津市药品检验研究院等 7 家检验机构检验，标示为北京同仁堂股份有限公司同仁堂制药厂等 17 家药企生产的 27 批次药品不符合规定，问题包括含水量不达标、存在可见异物、活性药物溶出速度与程度不符合要求等。同期，国家疾控局等三部门发布《关于全面推行疫苗处方工作的指导意见》，提出「十五五」期间逐步实现疫苗处方在二级及以上医疗机构等全覆盖；各省份医保钱包 2.0 版已全部升级上线运行。", "en": "The National Medical Products Administration's latest sampling notice says 27 batches from 17 manufacturers — including the Tongrentang pharmaceutical plant of Beijing Tongrentang — failed inspection by seven testing institutes, with problems ranging from moisture content and visible particles to the dissolution rate of active ingredients. Separately, three departments including the National Disease Control and Prevention Administration issued guidance on vaccine prescriptions, aiming for full coverage at tier-two and higher hospitals during the 15th Five-Year Plan, and the 2.0 version of the medical insurance wallet is now live in all provinces.", "es": "El último aviso de muestreo de la Administración Nacional de Productos Médicos indica que 27 lotes de 17 fabricantes —entre ellos la planta Tongrentang de Pekín— no cumplieron tras el análisis de siete institutos, con problemas de humedad, partículas visibles y velocidad de disolución del principio activo. Además, tres departamentos, entre ellos la Administración Nacional de Control de Enfermedades, publicaron una guía sobre recetas de vacunas para generalizarlas en hospitales de segundo nivel y superiores durante el XV Plan Quinquenal, y la versión 2.0 de la cartera sanitaria ya está activa en todas las provincias.", "ja": "国家薬監局の最新の抽検通告によると、天津市薬品検査研究院など7機関の検査で、北京同仁堂の製薬工場など17社が生産した27ロットが規定に適合しなかった。水分量、異物の混入、有効成分の溶出速度などが問題とされた。また国家疾病予防控制局など3部門はワクチン処方の全面導入に関する指針を公表し、第15次五カ年計画期間中に2級以上医療機関での全面カバーを目指すとした。医療保険ウォレット2.0版も全土で稼働している。"}, "why": {"zh": "27 批次里出现老字号，说明抽检的价值不在「抓典型」，而在把质量波动变成公开数据。对普通人更有用的是后半段：疫苗处方与医保钱包，是把「打什么、报多少」从经验判断变成可查询流程的两小步。", "en": "A heritage brand appearing among 27 failed batches shows the point of sampling is not to catch a villain but to turn quality variance into public data. More useful to ordinary people is the second half: vaccine prescriptions and the insurance wallet are two small steps that turn “what to get and what is reimbursed” from experience into a queryable process.", "es": "Que una marca centenaria aparezca entre 27 lotes fallidos muestra que el muestreo no busca un culpable sino convertir la variación de calidad en datos públicos. Más útil para la gente es la segunda parte: receta de vacunas y cartera digital convierten «qué ponerse y qué se reembolsa» en un procedimiento consultable.", "ja": "27ロットに老舗ブランドが含まれたことは、抽検の価値が「見せしめ」ではなく品質のばらつきを公開データに変えることにあると示す。住民にとってより有用なのは後半だ。ワクチン処方と保険ウォレットは、「何を打ち、いくら戻るか」を経験則から照会できる手続きに変える小さな一歩である。"}}, {"idx": "05", "title": {"zh": "寒潮、大风双预警：中东部大范围雨雪，局地降温超 12℃", "en": "Cold wave and gale alerts: widespread rain and snow, local drops above 12°C", "es": "Alertas por ola de frío y viento: lluvia y nieve extensas y caídas locales de más de 12 °C", "ja": "寒波と強風の警報、広範囲の雨雪と局地的に12℃超の降温"}, "body": {"zh": "中央气象台 11 月 17 日发布寒潮蓝色预警和大风蓝色预警：11 月 17 日至 19 日，受强冷空气影响，西北地区东部、内蒙古、华北、东北、黄淮、江淮、江汉、江南、华南等地大部先后降温 6℃ 至 8℃，黑龙江东南部和西北部、吉林东部、辽宁东北部、山东中西部、河南东部、湖北东部、安徽、江苏、上海、浙江、福建中北部、江西、湖南东部等地部分地区降温 8℃ 至 10℃，局地可达 12℃ 以上；11 月 20 日早晨最低气温 0℃ 线将南压至陕西南部到华北南部、黄淮东南部一带。同期内蒙古中东部、山西中北部、河北北部、吉林东部、黑龙江东部等地有中到大雪或雨夹雪，局地暴雪；渤海、黄海、东海北部等海域有 7 级、阵风 8 至 9 级大风。", "en": "The National Meteorological Center issued blue alerts for a cold wave and gales on 17 November. From 17 to 19 November, a strong cold front will bring 6-8°C drops across most of northwest China, Inner Mongolia, north and northeast China, the Yellow and Huai river regions, the Yangtze basin and south China, with 8-10°C and locally over 12°C in parts of Heilongjiang, Jilin, Liaoning, Shandong, Henan, Hubei, Anhui, Jiangsu, Shanghai, Zhejiang, Fujian, Jiangxi and Hunan. The 0°C line will push south to southern Shaanxi and the southern North China Plain by the morning of 20 November. Moderate to heavy snow is forecast in parts of Inner Mongolia, Shanxi, Hebei, Jilin and Heilongjiang, with force 7 winds and gusts of 8-9 in the Bohai, Yellow Sea and northern East China Sea.", "es": "El Centro Meteorológico Nacional emitió el 17 de noviembre alertas azules por ola de frío y vientos fuertes. Del 17 al 19, un frente frío intenso provocará descensos de 6-8 °C en el noroeste, Mongolia Interior, norte y noreste, y las cuencas del Amarillo, el Huai y el Yangtsé, con 8-10 °C y más de 12 °C puntuales en Heilongjiang, Jilin, Liaoning, Shandong, Henan, Hubei, Anhui, Jiangsu, Shanghái, Zhejiang, Fujian, Jiangxi y Hunan. La isoterma de 0 °C bajará hasta el sur de Shaanxi y el sur de la llanura del norte el 20 por la mañana. Se prevén nevadas moderadas a fuertes en Mongolia Interior, Shanxi, Hebei, Jilin y Heilongjiang, y vientos de fuerza 7 con rachas de 8-9 en el Bohai, el Amarillo y el norte del Mar de China Oriental.", "ja": "中央気象台は11月17日、寒波と強風の藍色警報を発表した。17〜19日、強い寒気の影響で西北地区東部、内蒙古、華北、東北、黄淮、江淮、江漢、江南、華南の大部分で6〜8℃低下し、黒竜江省南東部・西北部、吉林省東部、遼寧省東北部、山東省中西部、河南省東部、湖北省東部、安徽、江蘇、上海、浙江、福建省中北部、江西、湖南省東部の一部で8〜10℃、局地的に12℃以上の低下となる。20日朝には最低気温0℃線が陝西南部から華北南部、黄淮東南部まで南下する。内蒙古中東部、山西中北部、河北北部、吉林東部、黒竜江東部では中到大雪や雨雪、局地的に暴雪。渤海、黄海、東海北部などでは風力7、突風8〜9と予報された。"}, "why": {"zh": "这轮冷空气的特点是「降温快、风大、雨雪范围广」三者叠加：体感温度会比气温数字更低，设施农业与海上作业的风险高于城市。0℃ 线一夜南压到华北南部，意味着北方多地正式进入「供暖期外的第一个真冬天」——也是呼吸道疾病与用电负荷同时抬头的窗口。", "en": "This cold wave combines fast cooling, strong wind and a wide band of rain and snow: the felt temperature will be lower than the numbers, and greenhouses and offshore work face more risk than cities do. The 0°C line jumping south overnight means much of the north enters its first real winter outside the heating season — a window when respiratory illness and power demand rise together.", "es": "Esta ola combina enfriamiento rápido, viento fuerte y un amplio frente de lluvia y nieve: la sensación térmica será menor que las cifras, y los invernaderos y el trabajo en alta mar corren más riesgo que las ciudades. Que la isoterma de 0 °C baje de golpe significa que buena parte del norte entra en su primer invierno real fuera de la temporada de calefacción, cuando suben a la vez las enfermedades respiratorias y la demanda eléctrica.", "ja": "今回の寒気は「急速な降温・強風・広い雨雪域」の三重奏だ。体感温度は数字より低く、施設園芸や海上作業のリスクは都市より高い。0℃線が一夜で華北南部まで南下するのは、北方の多くが暖房期の外にある「最初の本当の冬」に入ることを意味し、呼吸器疾患と電力需要が同時に増える時期でもある。"}}]}, {"key": "fin", "num": "03", "color": "#b45309", "deep": "#92400e", "name": {"zh": "金融要闻", "en": "Markets", "es": "Mercados", "ja": "金融"}, "items": [{"idx": "01", "tag": {"zh": "进展"}, "title": {"zh": "英伟达单季营收首破千亿美元，第四季指引 1300 亿", "en": "Nvidia tops $100 billion in a quarter for the first time, guides to $130 billion", "es": "Nvidia supera por primera vez los 100.000 millones en un trimestre y guía a 130.000", "ja": "エヌビディア、単四半期で初の1000億ドル超え、次期は1300億ドルを見込む"}, "body": {"zh": "英伟达（NVIDIA）11 月 17 日美股盘后公布 2027 财年第三财季业绩：截至 10 月 25 日的季度营收 1158 亿美元，同比增长 103%、环比增长 20%，为公司史上首次单季营收突破 1000 亿美元，较分析师预期高约 5.9%，也高于公司自身 1080 亿美元的指引中值；非美国通用会计准则（non-GAAP）净利润 648.7 亿美元，同比增长 109%；调整后每股收益 2.68 美元，同比增长 111%。数据中心业务营收 1076 亿美元，同比增长 110%，约占总营收九成。公司预计第四财季营收 1261 亿至 1339 亿美元，并假定来自中国的数据中心计算收入为零。这是创始人黄仁勋辞任首席执行官后的首份季报，临时首席执行官、首席财务官科莱特·克雷斯称「Vera Rubin 开局强劲」。", "en": "Nvidia reported fiscal 2027 third-quarter results after the U.S. close on 17 November: revenue of $115.8 billion for the quarter ended 25 October, up 103% year on year and 20% sequentially — the first quarter above $100 billion in its history, about 5.9% above analyst estimates and above the midpoint of its own $108 billion guidance. Non-GAAP net income was $64.87 billion, up 109%, with adjusted earnings per share of $2.68, up 111%. Data centre revenue reached $107.6 billion, up 110% and about 90% of the total. The company guided fourth-quarter revenue to $126.1-133.9 billion and assumes no data centre compute revenue from China. It was the first quarterly report since founder Jensen Huang stepped down as CEO; interim CEO and CFO Colette Kress said Vera Rubin was off to an explosive start.", "es": "Nvidia presentó el 17 de noviembre, tras el cierre de Wall Street, sus resultados del tercer trimestre del ejercicio 2027: ingresos de 115.800 millones de dólares en el trimestre cerrado el 25 de octubre, un 103% más interanual y un 20% más trimestral, la primera vez que supera los 100.000 millones, un 5,9% por encima de las estimaciones y del punto medio de su propia guía de 108.000 millones. El beneficio neto no-GAAP fue de 64.870 millones (+109%) y el beneficio por acción ajustado de 2,68 dólares (+111%). Los centros de datos aportaron 107.600 millones (+110%), cerca del 90% del total. La guía para el cuarto trimestre es de 126.100 a 133.900 millones y no asume ingresos de centros de datos en China. Es el primer informe tras la salida del fundador Jensen Huang como consejero delegado; la consejera delegada interina y directora financiera, Colette Kress, dijo que Vera Rubin tuvo un arranque explosivo.", "ja": "エヌビディアは11月17日の米国市場終了後、2027年度第3四半期決算を発表した。10月25日締めの四半期売上高は1158億ドルで前年同期比103%増、前四半期比20%増。単四半期として初めて1000億ドルを超え、市場予想を約5.9%上回り、自社見通しの中央値1080億ドルも超えた。米国会計基準（GAAP）以外の純利益は648.7億ドル（109%増）、調整後1株利益は2.68ドル（111%増）。データセンター事業は1076億ドル（110%増）で全体の約9割。第4四半期は1261億〜1339億ドルを見込み、中国のデータセンター計算需要はゼロと仮定した。創業者ジェンスン・フアン氏のCEO辞任後、初の決算で、暫定CEOで最高財務責任者（CFO）のコレット・クレス氏は「Vera Rubinは爆発的な滑り出し」と述べた。"}, "why": {"zh": "这是「史上第一家单季千亿美元半导体公司」的刻度，也是在 CEO 缺位状态下交出的成绩单——它证明这家公司的运转已经不完全依赖某一个人。真正的观察点在两处：毛利率指引从 74.8% 降到 71%-72%，说明新一代平台爬坡要付出代价；把中国数据中心收入假设为零，则等于把最大的不确定性直接从账上划掉。", "en": "The milestone is the first semiconductor company ever to post a $100 billion quarter — and it did so with no permanent CEO, evidence the machine no longer depends on one person. The real tells are elsewhere: gross margin guidance slips from 74.8% to 71-72%, the price of ramping a new platform, and assuming zero China data centre revenue removes the biggest uncertainty from the ledger entirely.", "es": "El hito es ser la primera empresa de semiconductores con un trimestre de 100.000 millones, y lograrlo sin un consejero delegado permanente demuestra que la máquina ya no depende de una persona. Las señales reales están en otro lugar: el margen bruto previsto cae del 74,8% al 71-72%, el precio de arrancar una plataforma nueva, y asumir cero ingresos de centros de datos en China elimina del balance la mayor incertidumbre.", "ja": "半導体企業として史上初の単四半期1000億ドルという目盛りであり、CEO不在のまま出した成績でもある。会社の稼働がもはや一人に依存しないことの証明だ。本当の観測点は別にある。粗利益率の見通しが74.8%から71〜72%に下がるのは新プラットフォーム立ち上げの代価であり、中国のデータセンター収入をゼロと仮定するのは最大の不確実性を帳簿から外すことでもある。"}}, {"idx": "02", "tag": {"zh": "进展"}, "title": {"zh": "黄仁勋首度发声「愿意回归」，公司称不打算让其复职", "en": "Huang says he is willing to return as CEO; Nvidia says it has no plan to bring him back", "es": "Huang dice que está dispuesto a volver; Nvidia afirma que no tiene previsto reinstaurarlo", "ja": "フアン氏「復帰する用意がある」、会社側は「復帰させる予定なし」"}, "body": {"zh": "黄仁勋在辞任后首次公开表态，称「我愿意重新担任英伟达首席执行官」。英伟达方面回应称，公司不打算让黄仁勋复职，临时首席执行官科莱特·克雷斯继续履职，遴选程序照常推进。此前，马斯克等科技界人士公开联署支持其回归，请愿人数已超十万；特朗普表态不反对其回归，美国财政部长贝森特则主张外聘新任首席执行官。11 月 17 日英伟达股价收跌 0.44%，盘中一度跌超 3.7%，财报公布后盘后一度反弹约 3%。", "en": "Jensen Huang said publicly for the first time since stepping down that he is willing to serve again as Nvidia's chief executive. Nvidia responded that it does not plan to bring him back, with interim CEO Colette Kress continuing in the role and the search proceeding as planned. Elon Musk and other tech figures have publicly backed his return, with a petition passing 100,000 signatures; President Trump said he would not object, while Treasury Secretary Bessent argues for an outside hire. Nvidia shares closed down 0.44% on 17 November after falling more than 3.7% intraday, then rebounded about 3% after hours on the results.", "es": "Jensen Huang afirmó públicamente por primera vez desde su salida que está dispuesto a volver a ejercer como consejero delegado de Nvidia. La empresa respondió que no tiene previsto reinstaurarlo; la consejera delegada interina, Colette Kress, sigue en el cargo y el proceso de selección continúa. Elon Musk y otras figuras tecnológicas han respaldado su vuelta, con una petición que supera las 100.000 firmas; el presidente Trump dijo que no se opondría, mientras el secretario del Tesoro, Bessent, aboga por contratar fuera. Las acciones cayeron un 0,44% el 17 de noviembre tras bajar más del 3,7% intradía, y rebotaron cerca de un 3% tras el cierre con los resultados.", "ja": "フアン氏はCEO辞任後、初めて公に「再びエヌビディアのCEOを務める用意がある」と述べた。同社は復帰を予定していないと応じ、暫定CEOのコレット・クレス氏が続投し、選考手続きは予定通り進むとした。マスク氏ら技術界の人物が復帰支持を公表し、請願は10万筆を超えた。トランプ大統領は反対しないと述べ、ベッセント財務長官は外部招聘を主張している。17日の株価は0.44%安で引け、取引中に一時3.7%超下落、決算発表後の時間外で約3%反発した。"}, "why": {"zh": "一家市值数万亿美元的公司，CEO 去留成了公开的拉锯：创始人愿意回、董事会不打算请、政界各有偏好。这种「悬空治理」短期靠业绩兜底，长期却是估值折价的来源。财报越好，这个问题越尖锐——因为它证明「没有他也能跑」，也证明「跑得好不好要看他回不回来」。", "en": "At a multi-trillion-dollar company, the CEO question has become a public tug of war: the founder wants back, the board does not plan to invite him, and politicians have preferences. Suspended governance is covered by results in the short run and becomes a valuation discount in the long run. The better the earnings, the sharper the question — they prove the machine runs without him, and that how well it runs is now a referendum on his return.", "es": "En una empresa de billones de dólares, la cuestión del consejero delegado se ha vuelto un pulso público: el fundador quiere volver, el consejo no piensa invitarlo y la política tiene preferencias. La gobernanza en suspenso se cubre con resultados a corto plazo y se convierte en descuento de valoración a largo. Cuanto mejores son las cuentas, más afilada es la pregunta: prueban que la máquina funciona sin él y que su retorno es ahora el referéndum.", "ja": "数兆ドル企業のCEOの去就が公開の綱引きになった。創業者は戻りたいと言い、取締役会は招く気がなく、政界もそれぞれの好みを持つ。宙に浮いた統治は短期なら業績が支えるが、長期では評価の割引要因になる。決算が良いほど問いは鋭くなる。彼がいなくても回ることを示し、同時に「戻るかどうか」が評価の試金石になったからだ。"}}, {"idx": "03", "title": {"zh": "A 股冲高回落，光刻机逆势拉起，成交创近一月新低", "en": "Chinese stocks fade from early gains as lithography names rally and turnover hits a one-month low", "es": "La bolsa china cede tras subir y la litografía rebota mientras el volumen marca mínimos de un mes", "ja": "中国株は上げてから反落、リソグラフィが逆行高、売買代金は約1か月ぶり低水準"}, "body": {"zh": "11 月 17 日，A 股三大指数冲高回落、尾盘小幅回升。上证指数收 3584.58 点、跌 0.50%，深证成指 10638.52 点、跌 0.49%，创业板指 2292.20 点、跌 1.20%，科创综指 1414.24 点、跌 1.41%，北证 50 涨 0.59%。沪深两市合计成交 14577 亿元，较前一交易日缩量 268 亿元，为近一个月新低。全市场 1326 只股票上涨、37 只涨停，4119 只下跌、77 只跌停。申万一级行业中仅家用电器（涨 0.82%）、银行（涨 0.31%）、食品饮料（涨 0.30%）、非银金融（涨 0.03%）上涨，传媒（跌 4.72%）、通信（跌 2.27%）、机械设备（跌 2.04%）跌幅居前。光刻机（胶）指数涨 3.06%，国林科技、联合化学 20% 涨停，北方华创涨 4.09%；工商银行、建设银行、南京银行等多只银行股创历史新高。截至 11 月 16 日，年内近 1300 家上市公司实施回购，合计金额超 1500 亿元。", "en": "Chinese equities rose early on 17 November and faded into the close. The Shanghai Composite ended at 3,584.58, down 0.50%; the Shenzhen Component at 10,638.52, down 0.49%; ChiNext at 2,292.20, down 1.20%; the STAR composite at 1,414.24, down 1.41%; the Beijing Stock Exchange 50 gained 0.59%. Combined turnover was 1.4577 trillion yuan, 26.8 billion less than the previous day, the lowest in about a month. 1,326 stocks rose with 37 limit-ups; 4,119 fell with 77 limit-downs. Only home appliances (+0.82%), banks (+0.31%), food and beverage (+0.30%) and non-bank financials (+0.03%) gained among Shenwan sectors; media (-4.72%), telecoms (-2.27%) and machinery (-2.04%) led declines. The lithography index rose 3.06%, with Guolin and Lianhe Chemical up 20% and NAURA up 4.09%; ICBC, CCB and Bank of Nanjing hit record highs. Nearly 1,300 listed companies have bought back more than 150 billion yuan of shares this year.", "es": "Las bolsas chinas subieron por la mañana y cedieron al cierre el 17 de noviembre. El Shanghai Composite terminó en 3.584,58 (-0,50%), el Shenzhen Component en 10.638,52 (-0,49%), el ChiNext en 2.292,20 (-1,20%), el compuesto STAR en 1.414,24 (-1,41%) y el BSE 50 subió 0,59%. El volumen combinado fue de 1,4577 billones de yuanes, 26.800 millones menos que el día anterior, mínimo en un mes. Subieron 1.326 valores (37 con límite al alza) y cayeron 4.119 (77 con límite a la baja). Solo electrodomésticos (+0,82%), banca (+0,31%), alimentación y bebida (+0,30%) y financieras no bancarias (+0,03%) avanzaron; medios (-4,72%), telecomunicaciones (-2,27%) y maquinaria (-2,04%) lideraron las caídas. El índice de litografía subió 3,06%, con Guolin y Lianhe Chemical +20% y NAURA +4,09%; ICBC, CCB y Bank of Nanjing marcaron máximos históricos. Casi 1.300 cotizadas han recomprado más de 150.000 millones de yuanes este año.", "ja": "11月17日の中国株式市場は上げてから崩れ、大引けにかけて小幅に戻した。上海総合指数は3584.58（0.50%安）、深セン成分指数は10638.52（0.49%安）、創業板指数は2292.20（1.20%安）、科創総合指数は1414.24（1.41%安）、北証50は0.59%高。売買代金は1兆4577億元で前日比268億元減、約1か月ぶりの低水準。上昇1326銘柄・ストップ高37、下落4119銘柄・ストップ安77。業種別では家電（+0.82%）、銀行（+0.31%）、食品飲料（+0.30%）、非銀行金融（+0.03%）のみ上昇し、メディア（-4.72%）、通信（-2.27%）、機械（-2.04%）が下落率上位。リソグラフィ指数は3.06%高で、国林科技と聯合化学が20%高、北方華創が4.09%高。工商銀行、建設銀行、南京銀行などが史上最高値を更新した。年初来で約1300社が1500億元超の自社株買いを実施している。"}, "why": {"zh": "指数跌得不多，结构却很清楚：钱在从「讲故事」的地方撤向「有现金流」的地方——银行创新高、传媒重挫，是同一枚硬币的两面。成交缩到 1.46 万亿是情绪指标，比点位更值得看；光刻机逆势拉起则说明，国产设备这条线仍在被当作确定性来买。回购超 1500 亿元也是同一逻辑：公司在用真金白银给自己的估值投票。", "en": "The index barely moved but the structure is clear: money is leaving the storytelling trades for cash-flow ones — record-high banks and a collapsing media sector are two sides of one coin. Turnover at 1.46 trillion is the sentiment gauge and matters more than the level; the lithography rally says domestic equipment is still bought as certainty. The 150 billion yuan of buybacks is the same logic: companies voting on their own valuation with real money.", "es": "El índice apenas se movió pero la estructura es clara: el dinero sale de los relatos hacia el flujo de caja; bancos en máximos y medios derrumbados son dos caras de la misma moneda. Un volumen de 1,46 billones es el termómetro de sentimiento y pesa más que el nivel; el rebote de litografía indica que el equipo nacional se compra como certeza. Las recompras por 150.000 millones son la misma lógica: las empresas votan su propia valoración con dinero real.", "ja": "指数はあまり下げていないが構造は明快だ。資金は「物語」から「キャッシュフロー」へ移っている。銀行の最高値とメディアの急落は同じコインの裏表だ。売買代金1.46兆元はセンチメントの指標で、水準より重視すべきだ。リソグラフィの逆行高は、国産装置が「確実性」として買われていることを示す。1500億元の自社株買いも同じ論理で、企業が実際の資金で自社の評価に投票している。"}}, {"idx": "04", "tag": {"zh": "进展"}, "title": {"zh": "金价触 3832 美元创 13 个月新低，交易员押注连续加息", "en": "Gold touches $3,832, a 13-month low, as traders bet on back-to-back hikes", "es": "El oro toca 3.832 dólares, mínimo de 13 meses, mientras el mercado apuesta por subidas seguidas", "ja": "金相場が3832ドルまで下落し13か月ぶり安値、市場は連続利上げを織り込む"}, "body": {"zh": "现货黄金 11 月 16 日一度跌至 3832.36 美元/盎司，创 13 个月新低，收于 3856.24 美元；17 日美盘时段在 3850 美元附近获得支撑、交投于 3877 美元附近。国内黄金实时价格约 832 元/克，品牌金饰克价回落至 1163 元至 1169 元区间。上周现货黄金累跌 4.9%，为 3 月底以来最大单周跌幅；现货白银一度失守 47 美元，日内跌逾 3.5%。美国 10 月零售销售环比涨 0.2%、剔除汽车后涨 0.6%。圣路易斯联储主席穆萨勒姆称明年春季前可能需要「数次」加息，克利夫兰联储主席哈马克称通胀优先级高于就业。芝商所美联储观察工具显示，交易员已完全消化 12 月加息，认为明年 1 月再加息概率接近 70%。美元指数交投于 103.50 附近，逼近 19 个月新高。", "en": "Spot gold fell as low as $3,832.36 an ounce on 16 November, a 13-month low, before closing at $3,856.24; on 17 November it found support near $3,850 and traded around $3,877. Domestic gold traded near 832 yuan a gram, with brand jewellery down to 1,163-1,169 yuan a gram. Spot gold lost 4.9% last week, its worst week since late March, and spot silver briefly broke below $47, down more than 3.5% on the day. U.S. October retail sales rose 0.2% month on month and 0.6% excluding autos. St. Louis Fed President Musalem said several hikes may be needed before spring, and Cleveland's Hammack said inflation outranks employment. CME FedWatch shows traders fully pricing a December hike and about 70% odds of another in January, with the dollar index near 103.50, close to a 19-month high.", "es": "El oro al contado cayó el 16 de noviembre hasta 3.832,36 dólares la onza, mínimo de 13 meses, y cerró en 3.856,24; el 17 encontró soporte cerca de 3.850 y operó alrededor de 3.877. En China el oro rondaba los 832 yuanes por gramo y la joyería de marca bajó a 1.163-1.169 yuanes. La semana pasada el metal perdió un 4,9%, su peor semana desde finales de marzo, y la plata al contado rompió brevemente los 47 dólares con caídas superiores al 3,5%. Las ventas minoristas de EE. UU. subieron un 0,2% en octubre y un 0,6% sin autos. El presidente de la Fed de San Luis, Musalem, dijo que podrían hacer falta varias subidas antes de primavera, y la de Cleveland, Hammack, que la inflación pesa más que el empleo. FedWatch descuenta plenamente una subida en diciembre y cerca del 70% otra en enero; el índice del dólar ronda 103,50, cerca de máximos de 19 meses.", "ja": "現物金は11月16日に一時1オンス3832.36ドルまで下落し、13か月ぶりの安値をつけ、3856.24ドルで引けた。17日の米国時間は3850ドル付近で下げ止まり、3877ドル前後で推移した。中国国内の実勢価格は1グラム約832元、ブランド宝飾品は1163〜1169元に下がった。先週の現物金は4.9%下落し、3月末以来最大の週間下落率。現物銀は一時47ドルを割れ、日中3.5%超下落した。米10月小売売上高は前月比0.2%増、自動車を除くと0.6%増。セントルイス連銀のムサレム総裁は来春までに「数回」の利上げが必要になり得ると述べ、クリーブランド連銀のハマック総裁はインフレを雇用より優先すべきだと語った。CMEのFedWatchでは12月利上げが完全に織り込まれ、1月の追加利上げ確率は約70%。ドル指数は103.50付近で19か月ぶり高値に接近している。"}, "why": {"zh": "这轮下跌不是避险情绪退潮，而是「持有黄金的机会成本」重新被定价：实际利率上行、美元走强、美债收益率居高，三件事同时压着金价。值得注意的细节是白银跌得比黄金更狠——说明撤出的是整个贵金属仓位，而非单纯的黄金多头。接下来两个变量最关键：美联储会议纪要与通胀路径。", "en": "This is not risk appetite returning but the opportunity cost of holding gold being repriced: higher real rates, a stronger dollar and elevated yields all press at once. The telling detail is silver falling harder than gold — the whole precious-metals position is being cut, not just longs in gold. Two variables matter next: the Fed minutes and the inflation path.", "es": "No es una retirada del apetito de riesgo, sino una revaloración del coste de oportunidad de tener oro: tipos reales más altos, dólar fuerte y rendimientos elevados presionan a la vez. El detalle revelador es que la plata cae más que el oro: se recorta toda la posición en metales preciosos. Las dos variables clave son las actas de la Fed y la senda de la inflación.", "ja": "今回の下落はリスク回避の後退ではなく、金を保有する機会費用の再評価だ。実質金利の上昇、ドル高、高い債券利回りが同時に押す。注目すべきは銀が金より大きく下げた点で、金のロングだけでなく貴金属ポジション全体が縮小されている。次の二つの変数が鍵になる。FRB議事録とインフレ経路だ。"}}, {"idx": "05", "title": {"zh": "网上「反催收」「征信修复」账号被集中处置", "en": "Regulators shut accounts selling “anti-collection” and “credit repair” services", "es": "Los reguladores cierran cuentas que venden «anticobro» y «reparación de crédito»", "ja": "「取り立て妨害」「信用情報修復」を売るアカウントが一括処分"}, "body": {"zh": "国家网信办会同金融监管总局近期集中处置一批发布、传播「恶意逃废债」「不正当反催收」「代理理赔」「征信修复」等金融「黑灰产」信息的账号。通报列举三类：抖音账号「正校长」「校长破局圈」、小红书账号「只是个凡人」虚构专家人设兜售「反催收」教程；闲鱼「退保吴老师」、快手「李大伟老师」「晓磊法务咨询」以「全额退保」「退保新规」为噱头诱导投保人虚构保险公司违规事实；微博「自强进哥老向」、抖音「阿佩唠实话」、微信公众号「民兴微学院」虚构征信申诉成功案例。相关账号已被依法依约关闭。两部门提醒，警惕「债务协商」「全额退保」「征信洗白」等不实信息与「代理维权」骗局。", "en": "China's cyberspace administration and the financial regulator have closed a batch of accounts spreading black-and-grey financial content — malicious debt evasion, improper anti-collection services, claims agencies and credit repair. Three groups were named: Douyin and Xiaohongshu accounts selling anti-collection courses under fake expert personas; Xianyu and Kuaishou accounts luring policyholders into fabricating insurer violations for full refunds; and Weibo, Douyin and WeChat accounts inventing successful credit-repair cases. The regulators warned against debt negotiation, full surrender and credit whitening offers and agency rights protection scams.", "es": "La administración del ciberespacio y el regulador financiero de China cerraron una tanda de cuentas que difundían contenidos financieros grises: evasión maliciosa de deudas, servicios impropios contra el cobro, agencias de reclamaciones y reparación de historial crediticio. Se señalaron tres grupos: cuentas de Douyin y Xiaohongshu que venden cursos anticobro con falsos expertos; cuentas de Xianyu y Kuaishou que inducen a asegurados a inventar infracciones para devoluciones totales; y cuentas de Weibo, Douyin y WeChat que inventan casos exitosos de reparación de crédito. Los reguladores advirtieron sobre negociación de deuda, devolución total y blanqueo de crédito.", "ja": "国家インターネット情報弁公室と金融監督管理総局はこのほど、「悪意のある債務逃れ」「不正な取り立て妨害」「代理保険請求」「信用情報修復」などの金融グレーゾーン情報を流すアカウントを一括処分した。通報は三類型を挙げた。抖音と小紅書のアカウントが偽の専門家人設で取り立て妨害講座を販売、閑魚や快手のアカウントが「全額返金」「返金新ルール」をうたい保険契約者に保険会社の違反を捏造させた、微博・抖音・微信のアカウントが信用情報異議申し立ての成功事例を捏造した。関連アカウントは法と規約に基づき閉鎖された。両部門は「債務交渉」「全額返金」「信用情報の洗浄」などの不実情報と、代理による権利主張を装う詐欺に警戒するよう呼びかけた。"}, "why": {"zh": "这类账号的商业模式高度一致：先贩卖焦虑，再收服务费，最后把风险留给客户——征信记录不会因为付费而消失，退保损失却是真实的。通报的价值在于把「代理维权」的常见话术公开点名，让「先交钱再洗白」这句话本身成为识别信号。", "en": "The business model is uniform: sell anxiety, charge a fee, leave the risk with the customer. A credit record does not disappear because you paid someone, but the surrender loss is real. Naming the scripts publicly makes “pay first, we clean it up” a recognisable warning sign in itself.", "es": "El modelo es uniforme: vender ansiedad, cobrar honorarios y dejar el riesgo al cliente. El historial no desaparece porque alguien cobre, pero la pérdida por cancelar el seguro es real. Nombrar los guiones convierte «paga primero y lo limpiamos» en una señal de alarma por sí misma.", "ja": "こうしたアカウントのビジネスモデルは同じだ。不安を売り、手数料を取り、リスクを顧客に残す。信用情報は金を払っても消えないが、解約の損失は現実だ。「先に払えばきれいになる」という言い方自体を、識別の合図として共有する価値がある。"}}]}, {"key": "spo", "num": "04", "color": "#15803d", "deep": "#12663a", "name": {"zh": "体育竞技", "en": "Sports", "es": "Deportes", "ja": "スポーツ"}, "items": [{"idx": "01", "title": {"zh": "国足让二追二 2:2 平巴林，2026 年收官", "en": "Two goals down, two back: China draw 2-2 with Bahrain to end 2026", "es": "De 0-2 a 2-2: China empata con Baréin y cierra 2026", "ja": "0-2から追いつき中国はバーレーンと2-2、2026年を終える"}, "body": {"zh": "11 月 17 日晚，2026 中国之队·肇庆国际足球邀请赛在肇庆新区体育中心体育场结束，中国男足在开场 0:2 落后的局面下连扳两球，2:2 战平巴林队，以一胜一平结束本次赛事，也延续了对巴林队的不败纪录。第 2 分钟，巴林右路传中，阿卜杜勒卡尤姆头球破门；第 20 分钟，布加马尔利用角球战术配合勾射入网。第 37 分钟，王钰栋左路传中，拜合拉木鱼跃头球扳回一球；第 72 分钟，王钰栋突入禁区被放倒，主裁判经视频回看判罚点球，替补登场的张玉宁主罚命中扳平。补时阶段布尼亚明头球攻门高出，无缘绝杀。至此国足 2026 年比赛全部结束，邵佳一执教 10 场国际 A 级比赛战绩 4 胜 2 平 4 负。", "en": "China drew 2-2 with Bahrain on the evening of 17 November in the Zhaoqing international friendly, coming back from 0-2 down to finish the tournament with a win and a draw and preserve their unbeaten record against Bahrain. Abdulqayoom headed in a second-minute cross and Bugammar hooked in from a corner routine on 20 minutes. Wang Yudong crossed for Baihelamu's diving header on 37 minutes, and after Wang was brought down in the box on 72 minutes, substitute Zhang Yuning converted the VAR-confirmed penalty. Buniyamin headed over in stoppage time. It was China's final match of 2026; under Shao Jiayi they have played 10 internationals with four wins, two draws and four defeats.", "es": "China empató 2-2 con Baréin el 17 de noviembre en el amistoso de Zhaoqing, remontando un 0-2 para cerrar el torneo con una victoria y un empate y mantener su invicto ante los bahreiníes. Abdulqayoom marcó de cabeza en el minuto 2 y Bugammar definió de chilena tras un córner en el 20. Wang Yudong centró para el cabezazo en plancha de Baihelamu en el 37, y tras una falta sobre Wang en el área en el 72, el suplente Zhang Yuning convirtió el penalti confirmado por el VAR. Buniyamin cabeceó por encima en el descuento. Fue el último partido de China en 2026: con Shao Jiayi suman 10 internacionales con cuatro victorias, dos empates y cuatro derrotas.", "ja": "中国代表は11月17日夜、肇慶国際親善試合でバーレーンと2-2で引き分けた。0-2から追いつき、1勝1分けで大会を終え、バーレーン戦の無敗記録を守った。2分に右からのクロスをアブドゥルカユームが頭で決め、20分にはコーナーの戦術からブガンマルが決めた。37分に王鈺棟の左クロスをバイヘラムが飛び込んで頭で返し、72分に王がエリア内で倒されてPK、ビデオ判定の末に途中出場の張玉寧が決めて同点とした。終了間際にブニヤミンが頭で外し、逆転はならなかった。中国の2026年はこれで終了。邵佳一監督のもと国際Aマッチ10試合で4勝2分け4敗。"}, "why": {"zh": "两场热身赛一胜一平，结果不难看，过程却把问题摊开了：开场 20 分钟丢两球，防守盯人和防空再次成为短板。反过来看也有收获——王钰栋两次直接制造进球，拜合拉木的冲击力、张玉宁的点球稳定性都在。真正的考题不是这两场，而是明年面对亚洲二流球队时，能不能从第一分钟就绷紧。", "en": "One win and one draw looks acceptable, but the process exposes the problem: two goals conceded inside 20 minutes, with marking and aerial defence again the weak points. There were gains too — Wang Yudong directly created both goals, Baihelamu's running caused problems and Zhang Yuning was reliable from the spot. The real test is whether they can be switched on from the first minute against second-tier Asian sides next year.", "es": "Una victoria y un empate no se ven mal, pero el proceso expone el problema: dos goles encajados en 20 minutos y otra vez fallos de marcaje y juego aéreo. También hubo avances: Wang Yudong generó las dos acciones de gol, Baihelamu incomodó y Zhang Yuning estuvo seguro desde el punto. La prueba real es si podrán estar concentrados desde el primer minuto ante rivales asiáticos de segundo nivel.", "ja": "1勝1分けは悪くないが、内容は課題をさらけ出した。開始20分で2失点し、マークと高空球への守備が再び弱点となった。一方で収穫もある。王鈺棟が2得点に直接絡み、バイヘラムの迫力、張玉寧のPKの安定感も示した。本当の試験は、来年アジア2流相手に最初の1分から集中できるかだ。"}}, {"idx": "02", "title": {"zh": "U19 国足 2:1 韩国，时隔八年再夺熊猫杯", "en": "China U19 beat South Korea 2-1 to win the Panda Cup after eight years", "es": "La sub-19 de China vence 2-1 a Corea del Sur y gana la Panda Cup ocho años después", "ja": "U19中国が韓国を2-1で破り、8年ぶりにパンダカップ制覇"}, "body": {"zh": "11 月 17 日，2026 中国之队·「熊猫杯」国际足球邀请赛在成都双流体育中心收官，中国 U19 男足在最后一轮 2:1 力克韩国 U19，以三战两胜一平积 7 分时隔八年再夺冠军。第 5 分钟，张家鸣直传，苗润东边路扣过防守低射破门；几分钟后苗润东强突禁区被放倒，杨铭锐主罚点球命中，中国队 2:0 领先。第 73 分钟，韩国队金智赫小角度劲射扳回一球。中国队主帅久尔杰维奇赛后表示，对手一直是亚洲强队，此次交手对明年备战 U20 亚洲杯很有意义，接下来将确定 21 人名单。本届赛事中国队首战 3:1 胜越南、次战 1:1 平塔吉克斯坦。", "en": "China's U19 side beat South Korea 2-1 on 17 November to win the Panda Cup in Chengdu, finishing with two wins and a draw on seven points — their first title in eight years. On five minutes Zhang Jiaming played through and Miao Rundong cut inside to score; minutes later Miao was brought down in the box and Yang Mingrui converted the penalty for 2-0. Kim Ji-hyuk pulled one back on 73 minutes. Coach Gjurovski said the match was valuable preparation for next year's U20 Asian Cup on home soil and that he will now settle on a 21-man squad. China beat Vietnam 3-1 and drew 1-1 with Tajikistan earlier in the tournament.", "es": "La selección sub-19 de China venció 2-1 a Corea del Sur el 17 de noviembre y ganó la Panda Cup en Chengdu, con dos victorias y un empate (7 puntos), su primer título en ocho años. Al minuto 5 Zhang Jiaming habilitó a Miao Rundong, que recortó y marcó; poco después Miao fue derribado en el área y Yang Mingrui convirtió el penalti para el 2-0. Kim Ji-hyuk recortó en el 73. El técnico Gjurovski dijo que el partido es una preparación valiosa para el Mundial sub-20 asiático de 2027 en casa y que definirá una lista de 21. Antes, China ganó 3-1 a Vietnam y empató 1-1 con Tayikistán.", "ja": "中国U19代表は11月17日、成都で韓国U19を2-1で破り、パンダカップで2勝1分けの勝ち点7として8年ぶりの優勝を果たした。5分に張家鳴のスルーパスから苗潤東が切り返して先制。直後に苗がエリア内で倒され、楊銘鋭がPKを決めて2-0。73分に金智赫が角度のないところから決めて1点差に迫られた。試合後、ジュロフスキ監督は「韓国は常にアジアの強豪で、来年のU20アジアカップへの準備として意義深い」と述べ、21人のメンバーを確定するとした。中国は初戦ベトナムに3-1、第2戦タジキスタンと1-1だった。"}, "why": {"zh": "熊猫杯的分量不在奖杯，而在它是 2027 年本土 U20 亚洲杯前的少数几次「真对抗」。三场球里，中国队既有边路突破与快速转移的成型套路，也暴露了下半场被压迫后的应对不足——第 73 分钟那个失球，正是压上后回追不及的典型。青年队的价值，就是把这些细节留在录像里。", "en": "The trophy matters less than the fact that this is one of the few real tests before the 2027 U20 Asian Cup at home. Across three games China showed a working pattern of wide breaks and quick switches, but also a weakness when pressed after the break — the 73rd-minute goal came from exactly that. For youth teams, the value is leaving those details on tape.", "es": "El trofeo importa menos que el hecho de ser una de las pocas pruebas reales antes del sub-20 asiático de 2027 en casa. En tres partidos China mostró un patrón de desborde por banda y cambio rápido de orientación, pero también debilidad cuando la presionan tras el descanso: el gol del 73 nació justo de eso. En categorías juveniles, el valor está en dejar esos detalles en vídeo.", "ja": "トロフィーより、2027年の自国開催U20アジアカップ前の数少ない「真の対抗戦」であることに意味がある。3試合で、中国はサイド突破と素早い展開という型を示す一方、後半に押し込まれた際の対応不足も露呈した。73分の失点はまさに前がかりの後の戻り遅れだった。ユース年代の価値は、そうした細部を映像に残すことにある。"}}, {"idx": "03", "title": {"zh": "NBA：76 人升至东部第一，湖人八连胜，杨瀚森 7 分半 3 助攻", "en": "NBA: 76ers take the East, Lakers win an eighth straight, Yang Hansen posts three assists", "es": "NBA: los 76ers lideran el Este, los Lakers suman ocho seguidas y Yang Hansen da tres asistencias", "ja": "NBA：シクサーズが東部首位、レイカーズ8連勝、楊瀚森は7分半で3アシスト"}, "body": {"zh": "北京时间 11 月 17 日，NBA 常规赛多场战罢：76 人背靠背 135-123 击败篮网取得三连胜，战绩 12 胜 3 负，因凯尔特人 105-115 不敌魔术而升至东部第一；魔术末节打出 40-28，客场终结凯尔特人六连胜，贝恩 24 分 8 篮板 5 助攻、小瓦格纳 21 分 8 篮板 9 助攻；湖人客场 131-123 力克太阳，豪取八连胜；热火 128-110 轻取火箭，终结对手四连胜，阿德托昆博 20 分 13 篮板 6 助攻；森林狼 106-98 客胜开拓者，中国球员杨瀚森最后 7 分 28 秒登场，贡献 1 个篮板、3 次助攻、1 次抢断，正负值 +11 追平个人纪录。NBA 官网最新实力榜：马刺居首、火箭升至第二、凯尔特人第三、湖人第四、76 人第五。", "en": "In NBA action on 17 November, Philadelphia beat Brooklyn 135-123 on the second night of a back-to-back for a third straight win, improving to 12-3 and moving top of the East after Boston lost 105-115 to Orlando. The Magic outscored Boston 40-28 in the fourth to end a six-game Celtics run, with Bane scoring 24 and Wagner Jr. adding 21 points, eight rebounds and nine assists. The Lakers won 131-123 in Phoenix for an eighth straight victory. Miami beat Houston 128-110 as Antetokounmpo had 20 points, 13 rebounds and six assists. Minnesota won 106-98 in Portland, where China's Yang Hansen played the final 7:28 with one rebound, three assists and a steal at plus-11, matching his career best. The NBA's latest power rankings have San Antonio first, Houston second, Boston third, the Lakers fourth and Philadelphia fifth.", "es": "En la NBA del 17 de noviembre, Filadelfia venció 135-123 a Brooklyn en la segunda noche de un back-to-back y sumó su tercera victoria consecutiva para colocarse 12-3 y liderar el Este tras la derrota de Boston 105-115 ante Orlando. Los Magic anotaron 40-28 en el último cuarto para cortar la racha de seis triunfos de los Celtics, con 24 de Bane y 21+8+9 de Wagner Jr. Los Lakers ganaron 131-123 en Phoenix, su octava victoria seguida. Miami superó 128-110 a Houston con 20 puntos, 13 rebotes y 6 asistencias de Antetokounmpo. Minnesota ganó 106-98 en Portland, donde el chino Yang Hansen jugó los últimos 7:28 con 1 rebote, 3 asistencias y un robo, +11, su mejor registro. El ranking de fuerza sitúa a San Antonio primero, Houston segundo, Boston tercero, Lakers cuarto y Filadelfia quinto.", "ja": "11月17日のNBAは、フィラデルフィアがブルックリンに135-123で勝ち、連戦の2戦目で3連勝。12勝3敗として、ボストンがオーランドに105-115で敗れたことで東部首位に立った。マジックは第4Qに40-28とし、セルティックスの6連勝を止めた。ベイン24点、ワグナー・ジュニアは21点8リバウンド9アシスト。レイカーズはフェニックスで131-123と勝ち、8連勝。ヒートは128-110でロケッツを下し、アデトクンボは20点13リバウンド6アシスト。ウルブズはポートランドで106-98、中国の楊瀚森は最後の7分28秒に出場し、1リバウンド3アシスト1スティール、プラス11で自己記録に並んだ。NBA公式の最新パワーランキングはサンアントニオ1位、ヒューストン2位、ボストン3位、レイカーズ4位、フィラデルフィア5位。"}, "why": {"zh": "这一夜的共同点是「位置在换」：76 人靠背靠背的硬度挤上东部第一，魔术用一节 40 分掀翻六连胜的凯尔特人，湖人把连胜拉到八场。对国内球迷，更实际的信号是杨瀚森——7 分半 3 次助攻、+11，说明他的策应能力在 NBA 节奏里仍然成立；但犯规 5 次也提醒，对抗尺度才是他真正的门槛。", "en": "The common thread is position changing hands: Philadelphia muscled to the top of the East on a back-to-back, Orlando took a 40-point quarter to topple Boston, and the Lakers ran their streak to eight. For Chinese fans the practical signal is Yang Hansen — three assists and plus-11 in seven and a half minutes show his passing still works at NBA pace, but five fouls show the real threshold is physicality.", "es": "El hilo común es que las posiciones cambian de manos: Filadelfia escaló al liderato del Este con piernas de back-to-back, Orlando necesitó un cuarto de 40 puntos para tumbar a Boston y los Lakers alargaron su racha a ocho. Para los aficionados chinos la señal práctica es Yang Hansen: tres asistencias y +11 en siete minutos y medio muestran que su visión funciona al ritmo de la NBA, pero cinco faltas revelan que el umbral real es el contacto físico.", "ja": "共通点は「順位が入れ替わる」ことだ。フィラデルフィアは連戦の粘りで東部首位に上がり、オーランドは1クォーター40点でボストンを倒し、レイカーズは連勝を8に伸ばした。中国のファンにとって現実的な信号は楊瀚森だ。7分半で3アシスト、プラス11はパス能力がNBAのテンポでも通用することを示す。一方で5ファウルは、本当の壁がフィジカルにあることを教える。"}}, {"idx": "04", "title": {"zh": "香港羽毛球公开赛首日：男双 4 对全胜，女双 3 对全败", "en": "Hong Kong Open day one: four men's doubles wins, three women's doubles losses", "es": "Abierto de Hong Kong, día uno: cuatro victorias en dobles masculino y tres derrotas en femenino", "ja": "香港オープン初日、男子ダブルス4組全勝・女子ダブルス3組全敗"}, "body": {"zh": "11 月 17 日，2026 年香港羽毛球公开赛在启德体艺馆开赛，这是国羽 11 月连续参加的第三站世界巡回赛超级 500 级别赛事。首日国羽 7 胜 4 负：男双 4 对组合全部晋级，卫冕冠军梁伟铿/王昶 14:21、21:16、21:18 逆转日本组合冈村洋辉/山下恭平，决胜局曾 12:17 落后连追 8 分；何济霆/任翔宇、胡珂源/林祥毅均苦战三局取胜，陈柏阳/刘毅直落两局过关。女双 3 对组合全部止步首轮，贾一凡与新搭档张弛 1:2 不敌头号种子、日本组合福岛由纪/松本麻佑，赛后两人红了眼眶。18 日陈雨菲、王祉怡将出战女单，混双头号种子冯彦哲/黄东萍亮相。", "en": "The 2026 Hong Kong Open opened at Kai Tak Arena on 17 November, China's third consecutive Super 500 event this month. The Chinese team went 7-4 on day one: all four men's doubles pairs advanced, with defending champions Liang Weikeng and Wang Chang recovering from 14-21 to win 21-16, 21-18 against Japan's Okamura and Yamashita after trailing 12-17 in the decider. He Jiting/Ren Xiangyu and Hu Keyuan/Lin Xiangyi also won in three games, and Chen Boyang/Liu Yi advanced in straight games. All three women's doubles pairs lost in the first round, including Jia Yifan and new partner Zhang Chi, beaten 1-2 by top seeds Fukushima and Matsumoto; both were in tears afterwards. Chen Yufei and Wang Zhiyi play on 18 November, along with top mixed doubles seeds Feng Yanzhe and Huang Dongping.", "es": "El Abierto de Hong Kong 2026 arrancó el 17 de noviembre en el pabellón Kai Tak, tercer Super 500 consecutivo del mes para China. El equipo chino firmó un 7-4 en la primera jornada: las cuatro parejas de dobles masculino avanzaron, con los campeones defensores Liang Weikeng y Wang Chang remontando un 14-21 para ganar 21-16 y 21-18 a Okamura y Yamashita tras ir 12-17 en el tercer set. He Jiting/Ren Xiangyu y Hu Keyuan/Lin Xiangyi también ganaron en tres sets, y Chen Boyang/Liu Yi en dos. Las tres parejas de dobles femenino cayeron en primera ronda, incluida Jia Yifan con su nueva compañera Zhang Chi ante las cabezas de serie Fukushima y Matsumoto; ambas terminaron llorando. El 18 juegan Chen Yufei y Wang Zhiyi.", "ja": "2026年香港オープンが11月17日、啓徳体育館で開幕した。中国勢にとって今月3大会連続のスーパー500大会となる。初日は7勝4敗。男子ダブルスは4組すべてが勝ち上がり、連覇を狙う梁偉鏗/王昶は14-21から21-16、21-18と逆転し、岡村洋輝/山下恭平を破った。第3ゲームでは12-17から8連続ポイントを奪った。何済霆/任翔宇、胡珂源/林祥毅もフルセットで勝利し、陳柏陽/劉毅はストレート勝ち。女子ダブルスは3組すべて初戦敗退。賈一凡は新パートナーの張馳と組んで第1シードの福島由紀/松本麻佑に1-2で敗れ、試合後に2人とも目を赤くした。18日は陳雨菲、王祉怡が女子シングルスに出場する。"}, "why": {"zh": "「男双全胜、女双全败」这种极端分布，比 7 胜 4 负的总账更值得看：男双的厚度在增加，女双在重组期还没找到稳定配对。贾一凡换搭档首轮就撞上头号种子，是运气也是现实——双打项目的成绩，从来不只取决于个人能力。", "en": "A split as extreme as four men's doubles wins and three women's doubles losses says more than the 7-4 total: men's doubles is gaining depth while women's doubles is still searching for stable pairings in a rebuild. Jia drawing the top seeds in her first match with a new partner is partly luck, partly reality — doubles results never depend on individual ability alone.", "es": "Un reparto tan extremo —cuatro victorias en dobles masculino y tres derrotas en femenino— dice más que el 7-4 global: el dobles masculino gana profundidad mientras el femenino busca parejas estables en plena reconstrucción. Que Jia se cruce con las primer
