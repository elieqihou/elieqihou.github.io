dx": "03", "tag": {}, "title": {"zh": "白宇帆承认已有孩子，三个字的回应换来一片「恭喜」", "en": "Bai Yufan Confirms He Has a Child, and the Replies Are Congratulations", "es": "Bai Yufan confirma que tiene un hijo y recibe felicitaciones", "ja": "白宇帆が子どもの存在を認め、祝福の声が広がる"}, "body": {"zh": "近日有视频拍到演员白宇帆与家人出行，隐婚生子的讨论冲上热搜。11 月 1 日，白宇帆发微博承认已婚并有孩子，未披露配偶身份与孩子年龄，发布内容中家人面部做了处理。评论区以祝福为主，也有讨论回到他的作品与演技。此前他凭《山海情》《开端》《繁城之下》《城中之城》等作品被观众熟悉，2026 年 2 月获第 4 届中国电视剧年度盛典年度突破男演员。", "en": "Video of actor Bai Yufan out with his family recently started a debate about a secret marriage and a child. On 1 November he confirmed on Weibo that he is married and has a child, without naming his spouse or the child's age, and with family faces obscured in what he posted. The comment section was largely congratulatory, with discussion also turning to his work. He is known for roles in Minning Town, Reset, Under the Skin and City of Dreams, and won breakthrough actor at the fourth China TV Drama Awards in February 2026.", "es": "Un vídeo del actor Bai Yufan con su familia reavivó la discusión sobre un matrimonio y un hijo ocultos. El 1 de noviembre confirmó en Weibo que está casado y tiene un hijo, sin revelar la identidad de su pareja ni la edad del niño, y con los rostros difuminados en lo que publicó. Los comentarios fueron en su mayoría felicitaciones, aunque también se habló de su trabajo. Es conocido por Minning Town, Reset, Under the Skin y City of Dreams, y en febrero de 2026 ganó el premio al actor revelación en los cuartos premios de la televisión china.", "ja": "最近、俳優の白宇帆が家族と外出する動画が拡散し、結婚と子どもの存在をめぐる議論が起きた。11月1日、白宇帆はWeiboで既婚で子どもがいると認めた。配偶者の身元や子どもの年齢は明かさず、投稿した画像では家族の顔を処理している。コメントは祝福が中心で、作品や演技に話が戻る場面もあった。『山海情』『開端』『繁城之下』『城中之城』などで知られ、2026年2月には第4回中国テレビドラマ年度盛典で突破男優賞を受賞している。"}, "why": {"zh": "观众反感的从来不是明星结婚生子，而是明明有家庭还硬撑单身、把喜欢当成流量筹码。这次舆论的反转说明一件事：坦白本身不消耗信任，隐瞒才消耗。", "en": "What audiences mind is never that a star marries or has children, but pretending to be single while having a family and treating affection as traffic. The reversal here says one thing: honesty does not spend trust, concealment does.", "es": "Lo que molesta al público nunca es que una estrella se case o tenga hijos, sino fingir soltería teniendo familia y convertir el cariño en tráfico. El giro de esta vez dice una cosa: la sinceridad no gasta la confianza, el ocultamiento sí.", "ja": "観客が嫌うのは、タレントが結婚したり子どもを持ったりすることではなく、家庭がありながら独身を装い、好意を集客の材料にすることだ。今回の反応の変化は一つのことを示す。正直さは信頼を減らさず、隠すことが減らす。"}}, {"idx": "04", "tag": {}, "title": {"zh": "包丢在服务区一分不少，明道送锦旗：「只有在我们中国能做到」", "en": "A Bag Lost at a Rest Stop Came Back Intact, and Ming Dao Sent a Banner", "es": "Perdió su bolso en un área de servicio y lo recuperó intacto", "ja": "サービスエリアで落としたかばんが無傷で戻り、明道が感謝の横断幕"}, "body": {"zh": "10 月 30 日，演员明道发布视频，讲述给上海松江交管支队 G60 沪昆高速公安检查站送锦旗的缘由：10 月 14 日他与团队从上海前往杭州，途中在枫泾服务站休息，同事接到交警电话才发现包丢失，包内现金、他的证件和一些资料一样不少。明道在视频中说，这在全世界范围内几乎不可能发生，只有在中国才做得到。", "en": "On 30 October actor Ming Dao posted a video explaining why he sent a thank-you banner to a police checkpoint on the G60 expressway in Songjiang, Shanghai. On 14 October, travelling from Shanghai to Hangzhou with his team, they stopped at Fengjing service area; a colleague only realised a bag was missing when police called. The cash, his documents and papers inside were all there. In the video he said this would be almost impossible anywhere else and only happens in China.", "es": "El 30 de octubre el actor Ming Dao publicó un vídeo explicando por qué envió un reconocimiento a un control policial de la autopista G60 en Songjiang, Shanghái. El 14 de octubre, de camino a Hangzhou con su equipo, pararon en el área de servicio de Fengjing; un compañero supo que faltaba un bolso cuando llamó la policía. El efectivo, sus documentos y papeles estaban intactos. En el vídeo dijo que algo así es casi imposible en el resto del mundo y solo ocurre en China.", "ja": "10月30日、俳優の明道が、上海松江のG60高速道路の警察検問所に感謝の横断幕を贈った理由を動画で説明した。10月14日、上海から杭州へ向かう途中で楓涇サービスエリアに立ち寄った際、警察からの電話でかばんを落としたことに気づいた。現金も身分証も資料もすべて無事だった。動画で同氏は、世界のどこでもほぼ起こりえないことで、中国でこそ起きると語った。"}, "why": {"zh": "一件小事之所以刷屏，是因为它对应的是一种很具体的公共体验：丢了东西，有人替你收着，还有人主动打电话找你。这种「可预期」比任何宣传都更有说服力。", "en": "A small incident travelled because it matches a very concrete public experience: you lose something, someone keeps it safe, and someone calls you first. That kind of predictability persuades better than any campaign.", "es": "Un detalle pequeño se viralizó porque corresponde a una experiencia pública muy concreta: pierdes algo, alguien lo guarda y además te llama. Esa previsibilidad convence más que cualquier campaña.", "ja": "小さな出来事が広まったのは、ごく具体的な公共体験に対応しているからだ。落とした物を誰かが保管し、しかも先に電話をかけてくれる。この予測可能性は、どんな広報よりも説得力を持つ。"}}, {"idx": "05", "tag": {}, "title": {"zh": "冷空气接力：中东部降温 4 至 8℃，湖南局地猛降 12℃", "en": "Cold Fronts in Sequence: Eastern China Down 4-8C, Hunan Drops 12C", "es": "Frentes fríos en cadena: el este de China baja 4-8 °C y Hunan hasta 12 °C", "ja": "寒気が連続襲来 中国中東部で4〜8度低下、湖南省の一部は12度下げ"}, "body": {"zh": "中央气象台 10 月 31 日 18 时继续发布大风蓝色预警。10 月 31 日夜间至 11 月 1 日，冷空气继续影响我国大部，南岭以北先后降温 4 至 8℃，江南局地降幅超过 10℃；重庆、湖北、湖南、安徽等地部分地区有大雨或暴雨；内蒙古东北部、吉林、辽宁、黑龙江等地有小到中雪或雨夹雪，局地大雪。湖南省气象台预计省内最高气温普遍下降 8 至 10℃、局地 10 至 12℃；辽宁预计 11 月 3 日早晨迎来阶段性气温谷底，阜新最低气温将跌至零下 10℃。", "en": "The National Meteorological Centre kept a blue wind warning in force at 18:00 on 31 October. From the night of 31 October into 1 November, cold air continues to affect most of the country, with temperatures falling 4 to 8 degrees Celsius north of the Nanling range and more than 10 degrees in parts of Jiangnan. Heavy rain or rainstorms are expected in parts of Chongqing, Hubei, Hunan and Anhui, while northeastern Inner Mongolia, Jilin, Liaoning and Heilongjiang see moderate to heavy snow. Hunan's meteorological service expects maximum temperatures to drop 8 to 10 degrees, locally 12. Liaoning expects its coldest morning on 3 November, with Fuxin reaching minus 10.", "es": "El Centro Meteorológico Nacional mantuvo el 31 de octubre a las 18:00 la alerta azul por viento. Desde la noche del 31 de octubre y durante el 1 de noviembre, el aire frío sigue afectando a buena parte del país: las temperaturas bajan 4 a 8 grados al norte de la cordillera de Nanling y más de 10 en partes de Jiangnan. Se esperan lluvias fuertes en zonas de Chongqing, Hubei, Hunan y Anhui, y nieve moderada a fuerte en el noreste de Mongolia Interior, Jilin, Liaoning y Heilongjiang. Hunan prevé descensos de 8 a 10 grados en las máximas, localmente 12; Liaoning espera su mañana más fría el 3 de noviembre, con Fuxin en menos 10.", "ja": "中央気象台は10月31日18時、強風ブルー警報を継続した。10月31日夜から11月1日にかけて寒気が中国の大部分に影響し、南嶺以北では4〜8度、江南の一部では10度以上気温が下がる。重慶、湖北、湖南、安徽の一部では大雨か豪雨、内モンゴル東北部、吉林、遼寧、黒竜江省では中程度の雪か雨混じりの雪、一部で大雪となる。湖南省の気象台は最高気温が8〜10度、局地的に10〜12度下がると予想。遼寧省は11月3日朝が気温の底となり、阜新は氷点下10度まで下がる見込みだ。"}, "why": {"zh": "这轮降温的特点是「风先到、雨雪跟上、再冷透」，体感会比气温数字更狠。对普通人最有用的两条信息是：江南的雨和东北的雪同时出现，出行要按最坏情况准备；而昼夜温差拉大之后，感冒和心脑血管风险的上升往往比降温本身更值得防。", "en": "The pattern is wind first, then rain and snow, then the deep chill, so it will feel harsher than the numbers suggest. Two practical points: rain in Jiangnan and snow in the northeast arriving together means travel plans should assume the worst, and as the day-night gap widens, the rise in colds and cardiovascular risk deserves more attention than the temperature drop itself.", "es": "El patrón es viento primero, luego lluvia y nieve, y después el frío profundo, así que se sentirá más duro que las cifras. Dos ideas prácticas: que coincidan lluvia en Jiangnan y nieve en el noreste obliga a planificar los viajes con el peor escenario, y al ampliarse la oscilación térmica, el aumento de resfriados y de riesgo cardiovascular importa más que el descenso en sí.", "ja": "風が先に来て、雨雪が続き、その後に冷え込む。体感は数字より厳しい。実用的なのは二点だ。江南の雨と東北の雪が同時に来るため、移動は最悪の想定で準備すること。そして寒暖差が広がると、気温の低下そのものより、風邪や心血管系のリスク上昇に注意が必要だ。"}}]}, {"key": "ent", "num": "06", "color": "#db2777", "deep": "#b01d5f", "name": {"zh": "娱乐八卦", "en": "ENTERTAINMENT", "es": "ESPECTÁCULOS", "ja": "エンタメ"}, "items": [{"idx": "01", "tag": {}, "title": {"zh": "微博视界大会颁出年度荣誉：刘诗诗、张若昀获年度影响力演员", "en": "Weibo Vision Gala: Liu Shishi and Zhang Ruoyun Take Top Acting Honours", "es": "Gala Weibo Vision: Liu Shishi y Zhang Ruoyun, mejores actores del año", "ja": "微博視界大会 劉詩詩と張若昀が年間影響力俳優賞"}, "body": {"zh": "10 月 31 日，2026 微博视界大会在横店举行，主题为「创见·新生」。年度影响力演员由刘诗诗、张若昀获得，两人代表待播谍战剧《千里江山图》压轴走红毯；谭松韵、王凯获年度实力演员，王传君、孟子义获年度表现力演员，罗云熙获年度全能艺人。年度影响力作品包括《兰香如故》《生命树》《太平年》《早春晴朗》与《奔跑吧》《乘风 2026》《现在就出发》。红毯上刘诗诗全程牵着穿长裙的关晓彤上下台，下台阶时把捧花递给张若昀腾出双手搀扶；三人姓氏凑成「刘关张」，被网友称为「内娱刘关张」，张若昀领奖时主动接梗：「这怎么不算一种影响力呢」。", "en": "The 2026 Weibo Vision Gala was held in Hengdian on 31 October under the theme of new creations. Liu Shishi and Zhang Ruoyun took the top acting honour, walking the red carpet last for the forthcoming spy drama A Thousand Li of Rivers and Mountains; Tan Songyun and Wang Kai were named strength actors, Wang Chuanjun and Meng Ziyi won for expressiveness, and Luo Yunxi was named all-round artist. Top works included The Orchid Aroma, Tree of Life, The Peaceful Years and Early Spring Sunshine alongside variety shows Keep Running, Ride the Wind 2026 and Let's Go Now. On the carpet Liu Shishi held Guan Xiaotong's hand throughout because of her long gown, handing her bouquet to Zhang Ruoyun so both hands were free to help her down the steps. Their surnames form the trio Liu-Guan-Zhang of the Three Kingdoms, which the internet seized on; Zhang Ruoyun embraced it on stage: is that not a kind of influence too.", "es": "La Gala Weibo Vision 2026 se celebró el 31 de octubre en Hengdian bajo el lema de la creación. Liu Shishi y Zhang Ruoyun se llevaron el máximo honor interpretativo, desfilando al final por la alfombra por la serie de espionaje A Thousand Li of Rivers and Mountains; Tan Songyun y Wang Kai fueron reconocidos como actores de fuerza, Wang Chuanjun y Meng Ziyi por su expresividad, y Luo Yunxi como artista integral. Entre las obras destacadas figuraron The Orchid Aroma, Tree of Life, The Peaceful Years y Early Spring Sunshine, junto a los programas Keep Running, Ride the Wind 2026 y Let's Go Now. En la alfombra, Liu Shishi llevó de la mano a Guan Xiaotong por su largo vestido y entregó su ramo a Zhang Ruoyun para ayudarla a bajar las escaleras. Sus apellidos forman el trío Liu-Guan-Zhang de los Tres Reinos, y Zhang Ruoyun lo asumió en el escenario: acaso no es también una forma de influencia.", "ja": "2026微博視界大会が10月31日、横店で開催された。テーマは「創見・新生」。年間影響力俳優賞は劉詩詩と張若昀が受賞し、放送前のスパイ劇『千里江山図』を代表してレッドカーペットの最後に登場した。タン・ソンユンと王凱が実力派俳優賞、王伝君と孟子義が表現力俳優賞、羅雲熙が全能芸能人賞を受賞。影響力作品には『蘭香如故』『生命樹』『太平年』『早春晴朗』と『奔跑吧』『乗風2026』『現在就出発』が選ばれた。カーペットでは、劉詩詩がロングドレス姿の関暁彤を終始手を引いて支え、階段を下りる際には花束を張若昀に預けて両手で支えた。三人の姓が「劉関張」になることからネットで話題になり、張若昀は壇上で「これも一種の影響力では」と自ら受けてみせた。"}, "why": {"zh": "一场颁奖礼最容易被记住的往往不是奖杯，而是几秒钟的下意识动作。这次出圈的是搀扶和接梗——它们之所以好看，是因为没有设计感。而对《千里江山图》来说，这种松弛的「熟人局」气质，比任何预告片都更能拉高期待。", "en": "What people remember from an awards show is rarely the trophy but a few seconds of instinct. This time it was the steadying hand and the self-aware joke, and they landed because they looked unplanned. For A Thousand Li of Rivers and Mountains, that relaxed, we-already-know-each-other quality raises expectations better than any trailer.", "es": "De una gala se recuerda menos el trofeo que unos segundos de instinto. Esta vez fueron la mano que sostiene y el chiste asumido, y funcionaron porque parecían no planificados. Para A Thousand Li of Rivers and Mountains, ese aire relajado de grupo que ya se conoce eleva la expectación más que cualquier tráiler.", "ja": "授賞式で記憶に残るのはトロフィーよりも、数秒のとっさの行動だったりする。今回は手を貸す仕草と自らネタを受ける一言で、台本のない感じが効いた。『千里江山図』にとっては、この気心の知れた緩さが、どんな予告編より期待を高める。"}}, {"idx": "02", "tag": {}, "title": {"zh": "赵露思、彭冠英《恋人》优酷首播，跨八年的破镜重圆", "en": "Zhao Lusi and Peng Guanying Open Lovers on Youku, Eight Years Apart", "es": "Zhao Lusi y Peng Guanying estrenan Lovers en Youku", "ja": "趙露思と彭冠英の『恋人』が優酷で初回配信、8年越しの再会"}, "body": {"zh": "11 月 1 日，赵露思、彭冠英主演的都市情感剧《恋人》在优酷首播。赵露思饰演在读研究生阮妤，课余做家教补贴生活；彭冠英饰演表面家境优渥、实则长期被家族安排的滕翊。两人因家教相识，因家庭变故分开，数年后重逢时一个留校工作、一个回国创业，故事前后跨越八年。", "en": "Lovers, a contemporary romance starring Zhao Lusi and Peng Guanying, premiered on Youku on 1 November. Zhao plays Ruan Yu, a graduate student who tutors to cover her costs; Peng plays Teng Yi, who looks like the heir to a comfortable family but has long been steered by it. They meet through tutoring, are separated by a family crisis, and meet again years later — one staying on at the university, the other back from abroad to start a business. The story spans eight years.", "es": "Lovers, drama romántico protagonizado por Zhao Lusi y Peng Guanying, se estrenó en Youku el 1 de noviembre. Zhao interpreta a Ruan Yu, una estudiante de posgrado que da clases particulares para costearse los gastos; Peng es Teng Yi, aparentemente de familia acomodada pero condicionado por ella desde hace años. Se conocen dando clases, los separa un problema familiar y se reencuentran años después: ella se queda en la universidad, él vuelve del extranjero para emprender. La historia abarca ocho años.", "ja": "11月1日、趙露思と彭冠英が主演する現代恋愛ドラマ『恋人』が優酷で配信を開始した。趙露思は大学院生の阮妤を演じ、家庭教師の副業で生活費を稼ぐ。彭冠英は、外見は裕福だが長く家族に人生を決められてきた滕翊を演じる。二人は家庭教師を通じて出会い、家庭の事情で別れ、数年後に再会する。一人は大学に残って働き、もう一人は帰国して起業しており、物語は8年にわたる。"}, "why": {"zh": "这个组合的看点不在「甜」，而在两个人设的反向拉力：一个拼命想扎根，一个拼命想逃离。破镜重圆题材最怕悬浮，能不能成立，取决于重逢之后那些试探和克制写不写得住。", "en": "The appeal is not sweetness but the opposing pull of two characters: one desperate to put down roots, the other desperate to escape. Reunion stories fail when they float above real life; whether this one works depends on how well the hesitation and restraint after the reunion are written.", "es": "El atractivo no es la dulzura, sino la tensión opuesta de dos personajes: uno desesperado por echar raíces, otro por escapar. Las historias de reencuentro fracasan cuando flotan fuera de la realidad; que esta funcione depende de cómo se escriban el tanteo y la contención posteriores.", "ja": "魅力は「甘さ」ではなく、二人の人物の逆向きの力にある。一人は必死に根を下ろそうとし、もう一人は必死に逃げ出そうとする。復縁ものを失敗させるのは現実離れだ。成立するかどうかは、再会後の探り合いと自制を描き切れるかにかかっている。"}}, {"idx": "03", "tag": {}, "title": {"zh": "郭德纲挂帅总导演，德云社集体入局 10 集网剧《绝顶富贵》", "en": "Guo Degang Directs 10-Part Comedy With the Deyunshe Cast", "es": "Guo Degang dirige una comedia de diez capítulos con el elenco de Deyunshe", "ja": "郭徳綱が総監督、徳雲社総出演の10話ドラマ『絶頂富貴』"}, "body": {"zh": "由郭德纲担任总导演，岳云鹏、王九龙、阎鹤祥、秦霄贤等主演的 10 集无厘头武侠喜剧《绝顶富贵》已过审拿证，将在优酷上线。剧集改编自漫画《绝顶》，核心设定是一群武林高手不为武功秘籍发愁，而是满世界找生发秘方。", "en": "The ten-episode martial-arts comedy The Pinnacle of Wealth, with Guo Degang as chief director and Yue Yunpeng, Wang Jiulong, Yan Hexiang and Qin Xiaoxian in the cast, has passed review and will stream on Youku. Adapted from the comic The Pinnacle, its premise is a group of martial arts masters who are not chasing secret manuals but scouring the world for a hair-restoring formula.", "es": "La comedia de artes marciales de diez capítulos The Pinnacle of Wealth, con Guo Degang como director principal y Yue Yunpeng, Wang Jiulong, Yan Hexiang y Qin Xiaoxian en el reparto, ha superado la censura y se estrenará en Youku. Adaptada del cómic The Pinnacle, su premisa son unos maestros de artes marciales que no buscan manuales secretos sino una fórmula para el cabello en todo el mundo.", "ja": "郭徳綱が総監督を務め、岳雲鵬、王九竜、閻鶴祥、秦霄賢らが出演する10話の武侠コメディ『絶頂富貴』が審査を通過し、優酷で配信される。原作は漫画『絶頂』で、武林の達人たちが秘伝書ではなく育毛の処方を世界中探し回るという設定だ。"}, "why": {"zh": "相声演员拍戏，观众的第一反应通常是打问号：舞台上的现挂和镜头前的调度是两套本事。10 集的体量既是诚意也是压力——短剧时代没有灌水的空间，节奏一旦松，观众几分钟就划走了。", "en": "When crosstalk performers act, audiences usually raise an eyebrow: live improvisation and camera blocking are two different crafts. Ten episodes is both a promise and a pressure — in the short-video era there is no room to pad, and if the pace slackens viewers leave within minutes.", "es": "Cuando actores de crosstalk ruedan, el público suele desconfiar: improvisar en directo y trabajar ante la cámara son dos oficios distintos. Diez capítulos son a la vez promesa y presión: en la era del vídeo corto no hay espacio para relleno y, si el ritmo afloja, el espectador se va en minutos.", "ja": "漫才師がドラマに出ると、観客はまず疑問符を浮かべる。舞台の即興とカメラ前の段取りは別の技術だ。10話という分量は誠意であり同時に圧力でもある。ショート動画の時代に水増しの余地はなく、テンポが緩めば数分で離脱される。"}}, {"idx": "04", "tag": {}, "title": {"zh": "万圣节突袭：HBO Max 无预告上线《小丑回魂》新集", "en": "Halloween Surprise: HBO Max Drops a New It Episode Unannounced", "es": "Sorpresa de Halloween: HBO Max estrena sin aviso un nuevo episodio de It", "ja": "ハロウィンの不意打ち HBO Maxが『IT』新エピソードを無予告配信"}, "body": {"zh": "万圣节当天，HBO Max 无预告上线《小丑回魂：欢迎来到德里》的新一集《A Story of Derry》，用户可直接点开观看。这是该剧连续第二年在万圣节档期给观众惊喜，去年是把第一季第 2 集提前两天放出。该剧与安迪·穆斯切蒂执导的同名电影处同一世界观，第一季故事发生在电影事件的 27 年前，第二季将改编原著中设定在 1935 年的章节。", "en": "On Halloween, HBO Max released a new episode of It: Welcome to Derry, titled A Story of Derry, without any announcement; subscribers could simply press play. It is the second year running that the show has surprised viewers at Halloween — last year the second episode of season one arrived two days early. The series shares a universe with Andy Muschietti's films, with season one set 27 years before the movies, and season two adapting the 1935 section of the novel.", "es": "El día de Halloween, HBO Max estrenó sin anuncio un nuevo episodio de It: Welcome to Derry titulado A Story of Derry, disponible para ver directamente. Es el segundo año consecutivo en que la serie sorprende en Halloween; el año pasado el segundo capítulo de la primera temporada llegó dos días antes. Comparte universo con las películas de Andy Muschietti: la primera temporada se sitúa 27 años antes de los films y la segunda adapta la parte de la novela ambientada en 1935.", "ja": "ハロウィン当日、HBO Maxは『IT／イット 恐怖の原点』の新エピソード『A Story of Derry』を予告なしに配信した。契約者はそのまま再生できる。ハロウィンに視聴者を驚かせるのは2年連続で、昨年はシーズン1の第2話を2日前に公開した。アンディ・ムスキエティ監督の映画と同じ世界観で、シーズン1は映画の27年前、シーズン2は原作の1935年を舞台とする章を映像化する。"}, "why": {"zh": "在预告片、定档、倒计时被工业化之后，「不预告直接上线」反而成了最贵的一种营销——它把惊喜本身当成内容。这种做法只对一种剧有效：观众对它有足够的情感存量。", "en": "Now that trailers, release dates and countdowns are industrialised, dropping an episode unannounced has become the most expensive kind of marketing: the surprise itself becomes the content. It only works for a show with enough emotional credit in the bank.", "es": "Con los tráilers, las fechas y las cuentas atrás industrializados, estrenar sin aviso se ha convertido en el marketing más caro: la sorpresa misma es el contenido. Solo funciona con una serie que tenga suficiente crédito emocional acumulado.", "ja": "予告編も公開日もカウントダウンも工業化された今、「予告なしの配信」は最も費用のかかる宣伝になった。驚きそのものがコンテンツになるからだ。これが効くのは、視聴者に十分な感情の蓄積がある作品だけである。"}}, {"idx": "05", "tag": {"zh": "进展"}, "title": {"zh": "肖战回应《小城良方》争议：靠近角色的过程里又哭又笑", "en": "Xiao Zhan on the Debate Around His New Drama: I Laughed and Cried Getting There", "es": "Xiao Zhan responde a las críticas por su nueva serie", "ja": "肖戦が『小城良方』の議論に言及「役に近づく過程で泣いて笑った」"}, "body": {"zh": "《人民日报》近日刊出对肖战的专访，他谈到为《小城良方》中神经外科医生刘铮亮一角做准备的过程，称自己曾又哭又笑。该剧开播初期口碑分化，被指医疗线与轻喜剧边界模糊、病例切换过快，播出中段后站内热度回升至 9800，多条人物线被观众讨论。导演张晓波对肖战提出的要求是「不要演，越自然越好」。", "en": "People's Daily recently published an interview with Xiao Zhan, in which he described preparing to play the neurosurgeon Liu Zhengliang in the drama A Good Prescription, saying he laughed and cried on the way into the role. The show divided opinion early on, criticised for blurring the line between medical drama and light comedy and for cutting between cases too quickly; by mid-run its platform heat had climbed back to 9800 and several character arcs were being discussed. Director Zhang Xiaobo's instruction to him was simple: do not act, the more natural the better.", "es": "El diario People's Daily publicó una entrevista con Xiao Zhan en la que describió su preparación para el neurocirujano Liu Zhengliang en la serie A Good Prescription, y aseguró que lloró y rió acercándose al personaje. La serie dividió al principio, criticada por difuminar la frontera entre drama médico y comedia ligera y por cortar los casos con demasiada rapidez; a mitad de emisión su popularidad en la plataforma volvió a 9800 y varias tramas se comentaban. La indicación del director Zhang Xiaobo fue sencilla: no actúes, cuanto más natural mejor.", "ja": "『人民日報』が最近、肖戦のインタビューを掲載した。脳外科医の劉錚亮を演じる準備について語り、役に近づく過程で泣いたり笑ったりしたと明かした。『小城良方』は開始当初評価が分かれ、医療ドラマと軽喜剧の境界が曖昧で症例の切り替えが速いと指摘されたが、中盤にはプラットフォーム内の熱度が9800まで戻り、複数の人物描写が話題になった。張暁波監督の指示は「演じるな、自然であればあるほどいい」というものだった。"}, "why": {"zh": "这次采访被讨论，是因为它给出了一个很具体的答案：演员如何回应「会不会演」的质疑——不是辩解，而是讲清楚自己怎么进入角色。对一部开播即被架在火上烤的剧来说，演员的表述方式有时比剧本身更能改变舆论走向。", "en": "The interview travelled because it answered a specific question: how an actor responds to doubts about whether he can act. Not by arguing, but by explaining how he got inside the role. For a show that was on the grill from day one, how the lead talks about it can sometimes shift opinion more than the show itself.", "es": "La entrevista se difundió porque responde a una pregunta concreta: cómo reacciona un actor a las dudas sobre si sabe actuar. No discutiendo, sino explicando cómo entró en el personaje. Para una serie cuestionada desde el primer día, a veces la forma en que el protagonista habla de ella cambia la opinión más que la serie misma.", "ja": "このインタビューが話題になったのは、具体的な答えを示したからだ。「演じられるのか」という疑問に、反論ではなく、どう役に入ったかを語ることで応じた。初回から叩かれた作品では、主演の語り方が作品そのものより世論を動かすことがある。"}}]}], "risk": {"zh": "风险提示：本简报仅作信息汇总，其中涉及的数据不构成任何投资建议。", "en": "Risk notice: this briefing is a summary of information only. The figures it contains do not constitute investment advice.", "es": "Aviso de riesgo: este boletín es solo un resumen informativo. Los datos que contiene no constituyen asesoramiento de inversión.", "ja": "リスク警告：本ブリーフィングは情報の要約であり、記載されたデータは投資助言を構成するものではありません。"}}/*__END__*/;

    if (/^Asia\/Tokyo/.test(tz)) return "ja";
    if (/Europe\/Madrid|America\/(Mexico_City|Bogota|Lima|Santiago|Caracas|Guatemala|La_Paz|San_Jose|Panama|Asuncion|Montevideo|Havana|El_Salvador|Managua|Tegucigalpa|Costa_Rica|San_Salvador)|America\/Argentina\//.test(tz)) return "es";
    if (/^(Europe|America|Australia)\//.test(tz)) return "en";
    return "zh";
  }

  var curLang = "zh";
  var langOpen = false;

  /* ===== 渲染 ===== */
  function renderChrome(lang) {
    var i18n = I18N[lang];
    document.documentElement.lang = LANG_HTML[lang];
    // 报头信息行
    var metaEl = document.getElementById("metaRow");
    if (metaEl) metaEl.textContent = T(BRIEFING.meta, lang);
    // 大日期
    var md = document.getElementById("mastDate");
    if (md) {
      var d = new Date(BRIEFING.date + "T00:00:00");
      md.innerHTML = fmtDate(d, lang) + "<small>" + esc(i18n.dateSub) + "</small>";
    }
    // 文档标题
    var siteName = (lang === "zh") ? "提马早报" : "TIMAB DAILY";
    document.title = siteName + " · " + fmtDate(new Date(BRIEFING.date + "T00:00:00"), lang);
    // 导航签
    var nav = document.getElementById("navChips");
    if (nav) {
      var order = ["pick"].concat(BRIEFING.sections.map(function (s) { return s.key; }));
      nav.innerHTML = "";
      order.forEach(function (key) {
        if (key === "pick") {
          var a = document.createElement("a");
          a.className = "chip-pick"; a.href = "#pick"; a.setAttribute("data-nav", "pick");
          a.textContent = T(BRIEFING.spotlight.badge, lang);
          nav.appendChild(a);
        } else {
          var sec = null;
          BRIEFING.sections.forEach(function (s) { if (s.key === key) sec = s; });
          if (!sec) return;
          var b = document.createElement("a");
          b.href = "#" + key; b.setAttribute("data-nav", key);
          b.style.borderColor = sec.color; b.style.color = sec.deep;
          b.textContent = T(sec.name, lang);
          nav.appendChild(b);
        }
      });
    }
    // 日历文案
    var cb = document.getElementById("calBtnText"); if (cb) cb.textContent = i18n.calBtn;
    var cw = document.getElementById("calWeek");
    if (cw) { cw.innerHTML = ""; i18n.calWeek.forEach(function (w) { var s = document.createElement("span"); s.textContent = w; cw.appendChild(s); }); }
    var cf = document.getElementById("calFoot"); if (cf) cf.textContent = i18n.calFoot;
    // 语言切换器（国旗触发 + 下拉）
    var ls = document.getElementById("langSwitch");
    if (ls) {
      ls.className = "lang-switch" + (langOpen ? " open" : "");
      ls.innerHTML = "";
      var trig = document.createElement("button");
      trig.type = "button"; trig.className = "lang-trigger"; trig.id = "langTrigger";
      trig.setAttribute("aria-haspopup", "true");
      trig.setAttribute("aria-expanded", langOpen ? "true" : "false");
      trig.innerHTML = flag(curLang) + '<span class="caret">▾</span>';
      trig.addEventListener("click", function (e) {
        e.stopPropagation();
        langOpen = !langOpen;
        ls.classList.toggle("open", langOpen);
        trig.setAttribute("aria-expanded", langOpen ? "true" : "false");
      });
      ls.appendChild(trig);
      var menu = document.createElement("div");
      menu.className = "lang-menu"; menu.setAttribute("role", "menu");
      LANGS.forEach(function (l) {
        var item = document.createElement("button");
        item.type = "button"; item.className = "lang-item" + (l === curLang ? " sel" : "");
        item.setAttribute("role", "menuitem"); item.setAttribute("data-lang", l);
        item.innerHTML = flag(l) + '<span class="lbl">' + LANG_LABEL_FULL[l] + "</span>";
        item.addEventListener("click", function (e) {
          e.stopPropagation();
          setLang(l);
        });
        menu.appendChild(item);
      });
      ls.appendChild(menu);
    }
  }

  function renderContent(lang) {
    var i18n = I18N[lang];
    var html = "";
    // 精选
    var sp = BRIEFING.spotlight;
    html += '<section class="spotlight" id="pick">'
      + '<div class="badge"><i></i>' + esc(T(sp.badge, lang)) + "</div>"
      + "<h2>" + titleHtml(sp.title, sp.hl, lang) + "</h2>"
      + '<div class="body">' + esc(T(sp.body, lang)) + "</div>"
      + '<div class="why"><b>' + esc(i18n.why) + "</b>" + esc(T(sp.why, lang)) + "</div>"
      + "</section>";
    // 分类
    html += '<div class="grid">';
    BRIEFING.sections.forEach(function (sec) {
      html += '<section class="card" id="' + sec.key + '" style="--ac:' + sec.color + "; --ac-deep:" + sec.deep + ';">'
        + '<div class="sec-head"><span class="sec-num">' + sec.num + "</span>"
        + "<h3>" + esc(T(sec.name, lang)) + "</h3>"
        + '<span class="en">' + sec.key.toUpperCase() + "</span></div>";
      (sec.items || []).forEach(function (it) {
        html += '<div class="item">';
        html += '<div class="t"><span class="idx">' + it.idx + "</span>";
        if (it.tag) html += '<span class="tag">' + esc(it.tag[lang] != null ? it.tag[lang] : i18n.tag) + "</span>";
        html += titleHtml(it.title, it.hl, lang) + "</div>";
        html += '<div class="d">' + esc(T(it.body, lang)) + "</div>";
        html += '<div class="why"><b>' + esc(i18n.why) + "</b>" + esc(T(it.why, lang)) + "</div>";
        html += "</div>";
      });
      html += "</section>";
    });
    html += "</div>";
    var content = document.getElementById("content");
    if (content) content.innerHTML = html;
    // 页脚
    var risk = document.getElementById("risk");
    if (risk) risk.textContent = T(BRIEFING.risk, lang);
  }

  function setLang(lang) {
    if (LANGS.indexOf(lang) < 0) lang = "zh";
    curLang = lang;
    langOpen = false;
    try { localStorage.setItem("timab_lang", lang); } catch (e) {}
    renderChrome(lang);
    renderContent(lang);
  }

  /* ===== 往期日历（保留原逻辑，文案随语言） ===== */
  function initCalendar() {
    var btn = document.getElementById("calBtn");
    var pop = document.getElementById("calPop");
    var grid = document.getElementById("calGrid");
    var title = document.getElementById("calTitle");
    if (!btn || !pop || !grid || !title) return;

    var parts = BRIEFING.date.split("-");
    var todayKey = parts[0].slice(2) + parts[1] + parts[2];
    var cur = { y: +parts[0], m: +parts[1] };
    var has = {};
    for (var i = 0; i < ARCHIVE_DATES.length; i++) { has[ARCHIVE_DATES[i]] = 1; }
    var HIST_BASE = /\/history\//.test(location.pathname) ? "./" : "history/";

    function ckey(y, m, d) { return String(y).slice(2) + pad(m) + pad(d); }

    function render() {
      var i18n = I18N[curLang];
      title.textContent = i18n.calTitle(cur.y, cur.m);
      grid.innerHTML = "";
      var start = new Date(cur.y, cur.m - 1, 1).getDay();
      var days = new Date(cur.y, cur.m, 0).getDate();
      for (var b = 0; b < start; b++) {
        var blank = document.createElement("span");
        blank.className = "cal-cell is-empty"; grid.appendChild(blank);
      }
      for (var d = 1; d <= days; d++) {
        var k = ckey(cur.y, cur.m, d);
        var cell = document.createElement("span");
        cell.className = "cal-cell" + (has[k] ? " has" : "") + (k === todayKey ? " is-today" : "");
        cell.textContent = d;
        if (has[k]) {
          cell.setAttribute("role", "link"); cell.setAttribute("tabindex", "0");
          cell.title = cur.y + "-" + pad(cur.m) + "-" + pad(d) + " 存档";
          (function (target) {
            var go = function () { window.open(HIST_BASE + target + ".html", "_blank", "noopener"); };
            cell.addEventListener("click", go);
            cell.addEventListener("keydown", function (e) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); go(); } });
          })(k);
        }
        grid.appendChild(cell);
      }
    }
    function toggle(open) {
      pop.hidden = !open;
      btn.setAttribute("aria-expanded", open ? "true" : "false");
      if (open) render();
    }
    btn.addEventListener("click", function (e) { e.stopPropagation(); toggle(pop.hidden); });
    document.getElementById("calPrev").addEventListener("click", function () { cur.m--; if (cur.m < 1) { cur.m = 12; cur.y--; } render(); });
    document.getElementById("calNext").addEventListener("click", function () { cur.m++; if (cur.m > 12) { cur.m = 1; cur.y++; } render(); });
    document.addEventListener("click", function (e) { if (!pop.hidden && !pop.contains(e.target)) toggle(false); });
    document.addEventListener("keydown", function (e) { if (e.key === "Escape" && !pop.hidden) toggle(false); });
  }

  /* ===== 启动 ===== */
  function boot() {
    curLang = detectLang();
    renderChrome(curLang);
    renderContent(curLang);
    initCalendar();
    // 关闭语言下拉：点击外部 / Esc
    document.addEventListener("click", function (e) {
      var ls = document.getElementById("langSwitch");
      if (ls && langOpen && !ls.contains(e.target)) {
        langOpen = false;
        ls.classList.remove("open");
        var t = document.getElementById("langTrigger");
        if (t) t.setAttribute("aria-expanded", "false");
      }
    });
    document.addEventListener("keydown", function (e) {
      if (e.key === "Escape" && langOpen) {
        langOpen = false;
        var ls = document.getElementById("langSwitch");
        if (ls) ls.classList.remove("open");
        var t = document.getElementById("langTrigger");
        if (t) t.setAttribute("aria-expanded", "false");
      }
    });
  }
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", boot);
  } else { boot(); }
})();
</script>
</body>
</html>
