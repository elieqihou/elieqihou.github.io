<style>

  .lang-switch { position: relative; display: inline-block; }
  .lang-trigger {

  .lang-menu {
    position: absolute; top: calc(100% + 8px); right: 0; z-index: 70;
    min-width: 150px; padding: 6px; background: var(--card);
    border: 1px solid var(--line); border-radius: 12px;

  @keyframes langIn { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }
  .lang-item {

    font-family: inherit; font-size: 13px; font-weight: 600; color: var(--ink-soft);
    text-align: left; transition: background .16s ease, color .16s ease;

  .lang-item.sel { color: var(--accent); background: color-mix(in srgb, var(--accent) 8%, transparent); }
  .lang-item .lbl { letter-spacing: .02em; }

  /* ===== 往期日历 ===== */
  .cal-anchor { position: relative; }
  .cal-link {
    display: inline-flex; align-items: center; gap: 7px; cursor: pointer;
    font-family: inherit; font-size: 13px; font-weight: 700; letter-spacing: .1em;
    color: var(--ink-soft); background: var(--card);
    border: 1.5px solid var(--line); border-radius: 999px; padding: 5px 15px 5px 12px;
    transition: all .2s ease;
  }
  .cal-link:hover { border-color: var(--accent); color: var(--accent); }
  .cal-link svg { width: 14px; height: 14px; display: block; }
  .cal-pop {
    position: absolute; top: calc(100% + 10px); right: 0; z-index: 60;
    width: 274px; padding: 14px 14px 10px;
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    box-shadow: 0 18px 44px -18px rgba(28, 27, 23, .45), 0 2px 8px rgba(28, 27, 23, .06);
    animation: calIn .18s ease both;
  }
  .cal-pop[hidden] { display: none; }
  @keyframes calIn { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }
  .cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .cal-title { font-size: 14px; font-weight: 700; letter-spacing: .08em; color: var(--ink); }
  .cal-nav {

    font-family: inherit; font-size: 17px; color: var(--ink-soft);
    background: transparent; border: 1px solid var(--line); border-radius: 8px;
    transition: all .18s ease;

  .cal-nav:hover { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  .cal-week, .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
  .cal-week span {
    text-align: center; font-size: 11px; letter-spacing: .06em;
    color: var(--ink-faint); padding-bottom: 6px;

  .cal-cell {
    position: relative; height: 32px; display: flex; align-items: center; justify-content: center;
    font-size: 13px; color: var(--ink-faint); border-radius: 8px;
    transition: background .18s ease, color .18s ease;
  }
  .cal-cell.is-empty { visibility: hidden; }
  .cal-cell.has { color: var(--ink); font-weight: 700; cursor: pointer; }
  .cal-cell.has::after {
    content: ""; position: absolute; bottom: 3px; left: 50%; transform: translateX(-50%);
    width: 4px; height: 4px; border-radius: 50%; background: var(--accent);
  }
  .cal-cell.has:hover, .cal-cell.has:focus-visible {
    background: color-mix(in srgb, var(--accent) 16%, transparent);
    color: var(--accent); outline: none;
  }
  .cal-cell.is-today { box-shadow: inset 0 0 0 1.5px var(--line); color: var(--ink-soft); }
  .cal-foot {
    margin-top: 9px; padding-top: 8px; border-top: 1px dashed var(--line);
    font-size: 11.5px; color: var(--ink-faint); letter-spacing: .04em;

  /* ===== 导航 ===== */
  .nav-chips { display: flex; flex-wrap: wrap; gap: 10px; padding: 0 0 18px; }
  .nav-chips a {
    text-decoration: none; font-size: 13.5px; font-weight: 700; letter-spacing: .08em;
    color: var(--ink-soft); border: 1.5px solid var(--line);
    border-radius: 999px; padding: 5px 16px; transition: all .2s ease;
  }
  .nav-chips a:hover { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  .nav-chips a.chip-pick { border-color: #0f766e; color: #0b5a54; }
  .nav-chips a.chip-pick:hover { background: #0f766e; color: #fff; }

  /* ===== 精选 ===== */
  .spotlight {
    margin-top: 30px; border-radius: 18px; overflow: hidden;
    background: linear-gradient(120deg, #0f766e 0%, #115e59 46%, #134e4a 100%);
    color: #f2fbfa; padding: 34px 38px 30px; position: relative;
    box-shadow: 0 18px 44px -18px rgba(15, 118, 110, .55);
  }
  .spotlight::after {
    content: ""; position: absolute; right: -60px; top: -60px; width: 240px; height: 240px;
    border-radius: 50%; background: radial-gradient(circle, rgba(255,255,255,.14), transparent 68%);
  }
  .spotlight .badge {
    display: inline-flex; align-items: center; gap: 8px;
    font-size: 12.5px; font-weight: 700; letter-spacing: .3em;
    border: 1.5px solid rgba(242, 251, 250, .55); border-radius: 999px;

    width: 8px; height: 8px; border-radius: 50%; background: #5eead4; display: inline-block;

  }
  @keyframes pulse { 0%,100% { opacity: 1; transform: scale(1);} 50% { opacity: .45; transform: scale(.78);} }
  .spotlight h2 {
    font-family: "Noto Serif SC", "Noto Serif JP", serif; font-weight: 900;
    font-size: clamp(24px, 3.4vw, 34px); line-height: 1.35; margin-bottom: 14px;

  .spotlight h2 .hl { color: #99f6e4; border-bottom: 3px solid rgba(153, 246, 228, .5); padding-bottom: 2px; }
  .spotlight .body { font-size: 15px; color: #d3efec; max-width: 62em; }
  .spotlight .why {
    margin-top: 18px; padding: 14px 18px; border-left: 3px solid #5eead4;
    background: rgba(255,255,255,.07); border-radius: 0 10px 10px 0;
    font-size: 14px; color: #e8fbf9; max-width: 62em;
  }
  .spotlight .why b { color: #99f6e4; font-weight: 700; }

  /* ===== 分类卡片 ===== */
  .grid { margin-top: 30px; display: grid; grid-template-columns: repeat(2, 1fr); gap: 24px; }
  @media (max-width: 880px) { .grid { grid-template-columns: 1fr; } .spotlight { padding: 26px 22px; } }
  .card {
    background: var(--card); border-radius: 4px 4px 14px 14px;
    box-shadow: 0 1px 3px rgba(28, 27, 23, .07), 0 12px 30px -22px rgba(28,27,23,.35);
    padding: 24px 26px 12px; position: relative; border-top: 6px solid var(--ac);
    animation: rise .6s ease both;
  }
  .card:nth-child(1) { animation-delay: .05s; } .card:nth-child(2) { animation-delay: .12s; }
  .card:nth-child(3) { animation-delay: .19s; } .card:nth-child(4) { animation-delay: .26s; }
  .card:nth-child(5) { animation-delay: .33s; } .card:nth-child(6) { animation-delay: .40s; }
  @keyframes rise { from { opacity: 0; transform: translateY(16px);} to { opacity: 1; transform: none;} }
  .card:hover { transform: translateY(-3px); transition: transform .25s ease; }
  .sec-head {
    display: flex; align-items: center; gap: 12px; margin-bottom: 6px;
    padding-bottom: 12px; border-bottom: 1px solid var(--line);
  }
  .sec-num { font-family: "Playfair Display", serif; font-style: italic; font-weight: 700; font-size: 26px; color: var(--ac); line-height: 1; }
  .sec-head h3 { font-family: "Noto Serif SC", "Noto Serif JP", serif; font-weight: 900; font-size: 21px; letter-spacing: .1em; color: var(--ink); }

  var BRIEFING = /*__BRIEFING_DATA__*/{"date": "2026-11-28", "meta": {"zh": "星期六 · 农历十月二十 · timab.cn", "en": "Saturday · 20th day of the 10th lunar month · timab.cn", "es": "Sábado · 20.º día del 10.º mes lunar · timab.cn", "ja": "土曜日 · 旧暦十月二十 · timab.cn"}, "spotlight": {"badge": {"zh": "精选", "en": "SPOTLIGHT", "es": "DESTACADO", "ja": "注目"}, "title": {"zh": "一天涨回两万亿：创业板 +11.61%，超 400 只个股涨停", "en": "Two trillion yuan back in a single day as ChiNext leaps 11.61%", "es": "Dos billones de yuanes en un día: el ChiNext se dispara un 11,61%", "ja": "一日で 2 兆元が戻る――創業板は 11.61％高、400 銘柄超がストップ高"}, "hl": {"zh": "沪指 +3.73%、深成指 +7.24%、创业板 +11.61%、科创综指 +14.21%，两市成交重回 2 万亿元；半导体设备、CPO、存储、PCB 全线走强，银行是唯一收跌的板块。", "en": "Shanghai +3.73%, Shenzhen +7.24%, ChiNext +11.61%, the STAR composite +14.21%, with turnover back above 2 trillion yuan. Chip equipment, CPO, memory and PCB names ran; banks were the only sector to fall.", "es": "Shanghái +3,73%, Shenzhen +7,24%, ChiNext +11,61% y el índice compuesto STAR +14,21%, con un volumen que vuelve a superar los 2 billones de yuanes. Subieron equipos de chips, CPO, memorias y PCB; la banca fue el único sector en caída.", "ja": "上海総合は 3.73％高、深セン成分は 7.24％高、創業板は 11.61％高、科創綜指は 14.21％高となり、売買代金は 2 兆元台に回復した。半導体装置、CPO、メモリー、PCB が軒並み上昇し、下落したのは銀行だけだった。"}, "body": {"zh": "11 月 27 日，A 股三大指数早盘集体高开，午后出现脉冲式拉升。至收盘，上证指数报 3606.49 点，涨 3.73%；深证成指报 10814.02 点，涨 7.24%；创业板指报 2443.96 点，涨 11.61%；科创综指报 1489.77 点，涨 14.21%；北证 50 报 851.79 点，涨 13.20%。沪市成交 9297.77 亿元、深市成交 10700.17 亿元，两市合计重回 2 万亿元，超过 400 只个股涨停。半导体设备、CPO 概念、算力租赁、PCB 概念早盘即显著上涨，存储芯片、光刻机、先进封装、人形机器人、科创板次新午后跟随上扬；银行是唯一收跌的板块。同日国务院常务会议研究持续深化资本市场投融资综合改革，提出推动上市公司加大分红回购力度、加力发挥「国家队」稳市作用、进一步优化中央汇金公司类「平准基金」功能、提供充足流动性保障。当日「A 股迎史诗级暴涨」居知乎热榜首位，「国家队抄底力度已超 924」居头条热榜前列。", "en": "Chinese equities opened sharply higher on 27 November and surged again in afternoon bursts. At the close the Shanghai Composite stood at 3,606.49, up 3.73%; the Shenzhen Component at 10,814.02, up 7.24%; ChiNext at 2,443.96, up 11.61%; the STAR composite at 1,489.77, up 14.21%; and the Beijing Stock Exchange 50 at 851.79, up 13.20%. Shanghai turnover reached 929.8 billion yuan and Shenzhen 1.07 trillion, putting the two markets back above 2 trillion yuan combined, with more than 400 stocks closing limit-up. Chip equipment, CPO, computing-power leasing and PCB names rose sharply from the open, followed in the afternoon by memory chips, lithography, advanced packaging, humanoid robots and recent STAR listings; banks were the only sector to fall. The same day, a State Council executive meeting studied deepening reform of the capital market's investment and financing system, calling for more dividends and buybacks from listed companies, a stronger «national team» stabilising role, a better quasi-stabilisation-fund function for Central Huijin and ample liquidity. «A-shares stage an epic rally» topped Zhihu's hot list, while «the national team is buying harder than in 924» ranked high on Toutiao.", "es": "La bolsa china abrió con fuertes alzas el 27 de noviembre y volvió a dispararse por impulsos durante la tarde. Al cierre, el índice compuesto de Shanghái quedó en 3.606,49 puntos (+3,73%), el componente de Shenzhen en 10.814,02 (+7,24%), el ChiNext en 2.443,96 (+11,61%), el compuesto STAR en 1.489,77 (+14,21%) y el índice 50 de la Bolsa de Pekín en 851,79 (+13,20%). El volumen de Shanghái llegó a 929.800 millones de yuanes y el de Shenzhen a 1,07 billones, de modo que ambos mercados sumaron más de 2 billones, con más de 400 valores cerrando en el límite de subida. Equipos de chips, CPO, alquiler de capacidad de cálculo y PCB subieron con fuerza desde la apertura, y por la tarde les siguieron memorias, litografía, encapsulado avanzado, robots humanoides y recientes debutantes del STAR; la banca fue el único sector en negativo. Ese mismo día, una reunión ejecutiva del Consejo de Estado estudió profundizar la reforma del sistema de inversión y financiación del mercado de capitales: más dividendos y recompras de las cotizadas, un papel estabilizador más fuerte del «equipo nacional», una mejor función de cuasi fondo de estabilización para Central Huijin y liquidez abundante. «La bolsa china protagoniza una subida épica» encabezó la lista de tendencias de Zhihu.", "ja": "11 月 27 日、中国株は寄り付きから軒並み高く始まり、午後に断続的な急騰を見せた。終値は上海総合が 3606.49（3.73％高）、深セン成分が 10814.02（7.24％高）、創業板が 2443.96（11.61％高）、科創綜指が 1489.77（14.21％高）、北証 50 が 851.79（13.20％高）。上海の売買代金は 9297.77 億元、深センは 1 兆 700 億元で、両市場合計は再び 2 兆元台に乗せ、400 銘柄超がストップ高となった。半導体装置、CPO、計算力リース、PCB が朝から大きく上げ、午後はメモリー、露光装置、先端パッケージ、ヒューマノイド、科創板の新規上場銘柄が追随した。下落したのは銀行だけ。同日、国務院常務会議は資本市場の投融資制度改革の深化を検討し、上場企業の増配・自社株買いの拡大、「国家隊」の市場安定機能の強化、中央匯金の準「平準基金」機能の最適化、十分な流動性の確保を打ち出した。「A 株が歴史的な暴騰」は知乎のトレンド首位となった。"}, "why": {"zh": "两万亿元成交、四百多只涨停、创业板两位数涨幅——市场记忆里最接近的参照物，是 2024 年 9 月底那波「924 行情」。但这次的推力不一样：不是降准降息的宽货币，而是分红回购、汇金类平准基金、增量政策预告的组合拳。政策给的是底部预期，不是顶部信号；真正值得盯的是成交能否连续守在万亿以上、杠杆资金是否回流——一天的暴涨可以来自情绪，一轮行情要靠资金结构。", "en": "Two trillion in turnover, 400-plus limit-ups, a double-digit gain on ChiNext: the closest reference point in market memory is the «924 rally» of late September 2024. The driver this time is different, though. Not broad money easing through rate and reserve cuts, but a combination of dividends and buybacks, a quasi-stabilisation fund at Central Huijin, and a promise of incremental policy. What policy supplies is a floor for expectations, not a signal that the top has arrived. The things worth watching are whether turnover can hold above one trillion and whether leveraged money returns: a one-day surge can come from mood, but a trend needs a funding structure.", "es": "Dos billones de volumen, más de 400 valores en el límite de subida y un alza de dos dígitos en el ChiNext: la referencia más cercana en la memoria del mercado es el «rally del 924» de finales de septiembre de 2024. El motor, sin embargo, es distinto. No es la liquidez amplia de recortes de tipos y reservas, sino una combinación de dividendos y recompras, un cuasi fondo de estabilización en Central Huijin y el anuncio de políticas adicionales. Lo que ofrece la política es un suelo para las expectativas, no una señal de techo. Lo que conviene vigilar es si el volumen se mantiene por encima del billón y si vuelve el dinero apalancado: un día de euforia puede nacer del ánimo, pero una tendencia necesita estructura de financiación.", "ja": "2 兆元の売買代金、400 銘柄超のストップ高、創業板の 2 桁上昇――市場の記憶で最も近い参照点は、2024 年 9 月末の「924 相場」だ。ただし今回は推進力が違う。利下げ・預金準備率下げによる緩和ではなく、増配・自社株買い、匯金の準平準基金、追加政策の予告という組み合わせである。政策が与えるのは底値の期待であって、天井のシグナルではない。見るべきは、売買代金が 1 兆元を超えて続くか、レバレッジ資金が戻るかだ。一日の急騰は気分から生まれるが、相場は資金構造でしか続かない。"}}, "sections": [{"key": "intl", "num": "01", "color": "#1d4ed8", "deep": "#1e3fa8", "name": {"zh": "国际时事", "en": "World", "es": "Internacional", "ja": "国際情勢"}, "items": [{"idx": "01", "title": {"zh": "欧盟特别峰会未就七年预算谈拢，第二日议程直接取消", "en": "EU summit fails to agree a seven-year budget; day two is cancelled", "es": "La cumbre de la UE no acuerda el presupuesto septenal y cancela el segundo día", "ja": "EU 特別首脳会議、7 年予算で合意できず 2 日目を中止"}, "body": {"zh": "欧盟特别峰会 27 日未能就下一个七年期长期预算达成一致。各方在农业补贴、凝聚基金与援乌额度上各守红线，主席国取消了原定次日的议程，谈判推迟到 12 月。峰会同样未能就向乌克兰提供贷款形成协议，原定讨论的援乌融资方案一并搁置。", "en": "An extraordinary EU summit on 27 November failed to agree the next seven-year long-term budget. Member states held their red lines on farm subsidies, cohesion funds and the size of aid to Ukraine, so the presidency cancelled the second day's agenda and pushed talks into December. The summit also failed to agree a loan package for Ukraine, leaving the financing plan that had been scheduled for discussion on hold.", "es": "Una cumbre extraordinaria de la UE no logró el 27 de noviembre acordar el próximo presupuesto plurianual de siete años. Los Estados miembros mantuvieron sus líneas rojas en subvenciones agrícolas, fondos de cohesión y volumen de la ayuda a Ucrania, de modo que la presidencia canceló la agenda del segundo día y trasladó las negociaciones a diciembre. La cumbre tampoco cerró un paquete de préstamos para Ucrania, y el plan de financiación previsto quedó en suspenso.", "ja": "EU の臨時首脳会議は 11 月 27 日、次の 7 年間の長期予算で合意できなかった。農業補助金、結束基金、ウクライナ支援の規模で各国が一線を譲らず、議長国は 2 日目の議事を中止し、協議を 12 月に先送りした。ウクライナ向け融資でも合意に至らず、討議予定だった支援資金案も据え置かれた。"}, "why": {"zh": "预算谈不拢，推迟的是两件很具体的事：对乌贷款的财源，和各国从明年起要认领的摊款份额。议程被砍掉一整天，说明分歧不在算法，而在「谁多掏钱」的政治意愿。12 月复会若仍无解，欧盟对乌援助的节奏会在冬季最吃紧的时候出现空档。", "en": "A failed budget postpones two very concrete things: the money behind the Ukraine loan, and the share each country must claim from next year. Losing a full day of agenda shows the disagreement is not about arithmetic but about the political will to pay more. If December brings no deal, the pace of EU aid to Ukraine will hit a gap exactly when winter bites hardest.", "es": "Un presupuesto fallido aplaza dos cosas muy concretas: el dinero que respalda el préstamo a Ucrania y la cuota que cada país deberá asumir desde el próximo año. Perder un día entero de agenda demuestra que la discrepancia no es aritmética, sino de voluntad política para pagar más. Si diciembre no trae acuerdo, el ritmo de la ayuda europea a Ucrania tendrá un hueco justo cuando el invierno aprieta.", "ja": "予算の不成立が先送りするのは、きわめて具体的な二点だ。ウクライナ融資の財源と、来年から各国が引き受ける分担額である。議事が丸一日消えたのは、対立が計算式ではなく「誰が多く払うか」という政治的意志の問題だからだ。12 月の再協議でも決まらなければ、EU の対ウクライナ支援は冬の最も厳しい時期に空白を迎える。"}}, {"idx": "02", "tag": {"zh": "进展"}, "title": {"zh": "伊朗称夺回两艘被美军劫持油轮，霍尔木兹继续关闭", "en": "Iran says it retook two tankers seized by US forces; Hormuz stays shut", "es": "Irán dice haber recuperado dos petroleros retenidos por EE. UU.; Ormuz sigue cerrado", "ja": "イラン、米軍が拿捕したタンカー2隻を奪還と発表 ホルムズは閉鎖継続"}, "body": {"zh": "伊朗海军司令伊拉尼 27 日说，伊朗海军突击队夺回两艘此前被美军劫持的油轮；霍尔木兹海峡将继续保持关闭，伊方将在「适当时机」应对任何带有特定目的的行动。同日伊朗伊斯兰革命卫队海军称，一艘油轮在霍尔木兹海峡盖奈姆岛北部海域触雷爆炸，与其同行的另一艘被迫返航，两船试图经未经伊方授权的航线秘密通行；革命卫队称过去几天走未授权航线的油轮数量大幅下降。革命卫队航空航天部队同日称，一架美军 F-16 战机从亨加姆岛东南方向接近伊朗领空，遭防空系统警告性射击后改变航向。", "en": "Iran's navy chief Shahram Irani said on 27 November that Iranian naval commandos had retaken two tankers previously seized by US forces, that the Strait of Hormuz would remain closed, and that Tehran would respond «at the appropriate time» to any action with a specific purpose. The same day the Revolutionary Guard navy said a tanker struck a mine and exploded north of Qanaim island in the strait, that a second tanker travelling with it was forced to turn back, and that both had tried to slip through on a route not authorised by Iran; it said the number of tankers using unauthorised routes had fallen sharply in recent days. The Guard's aerospace force said a US F-16 approaching Iranian airspace from the southeast of Hengam island changed course after warning shots from air defences.", "es": "El jefe de la Armada iraní, Shahram Irani, dijo el 27 de noviembre que comandos navales iraníes habían recuperado dos petroleros retenidos antes por fuerzas estadounidenses, que el estrecho de Ormuz seguirá cerrado y que Teherán responderá «en el momento adecuado» a cualquier acción con un propósito concreto. Ese mismo día, la marina de la Guardia Revolucionaria informó de que un petrolero chocó con una mina y explotó al norte de la isla de Qanaim, que otro que lo acompañaba tuvo que regresar y que ambos intentaban cruzar por una ruta no autorizada por Irán; añadió que el número de buques que usan rutas no autorizadas ha caído con fuerza en los últimos días. La fuerza aeroespacial de la Guardia dijo que un F-16 estadounidense que se acercaba al espacio aéreo iraní desde el sureste de la isla de Hengam cambió de rumbo tras disparos de advertencia.", "ja": "イラン海軍のイラニ司令官は 11 月 27 日、海軍の突撃隊が米軍に拿捕されていたタンカー2隻を奪還したと述べ、ホルムズ海峡の閉鎖を続けるとした上で、特定の目的を持つ行動には「適切な時機」に対応すると表明した。同日、革命防衛隊海軍は、海峡のガナイム島北部海域でタンカー1隻が機雷に触れて爆発し、同行していたもう1隻が引き返したと発表。2隻はイランが認めていない航路を秘密裏に通ろうとしていたとし、ここ数日、無許可航路を使うタンカーは大幅に減ったとした。革命防衛隊航空宇宙軍は、ヘンガム島南東からイラン領空に接近した米軍 F-16 が防空システムの警告射撃を受けて針路を変えたと発表した。"}, "why": {"zh": "把三件事放在一起看，脉络很清楚：海峡关闭不是临时管制，而是与七项条件绑定的谈判筹码；「夺回油轮」把争夺从航道管控推到船只归属；警告性射击则是在给护航划红线。只要「绝对控制权」的说法还在，战争险保费和绕行成本就不会回落，运价的波动会比油价本身更剧烈。", "en": "Put the three together and the logic is clear: the closure is not temporary traffic control but a bargaining chip tied to seven conditions; retaking tankers pushes the contest from route management to ownership of ships; warning shots draw a red line under escort operations. As long as «absolute control» remains the language, war-risk premiums and detour costs will not come down, and freight rates will swing harder than crude prices themselves.", "es": "Puestas las tres cosas juntas, la lógica es clara: el cierre no es un control temporal de tráfico sino una carta de negociación atada a siete condiciones; recuperar petroleros traslada la disputa de la gestión de rutas a la propiedad de los buques; los disparos de advertencia trazan una línea roja bajo las escoltas. Mientras siga hablándose de «control absoluto», las primas de riesgo de guerra y los costes de desvío no bajarán, y los fletes oscilarán más que el propio precio del crudo.", "ja": "三つを並べると筋は明快だ。海峡の閉鎖は一時的な交通管制ではなく、七つの条件と結びついた交渉材料であり、「タンカー奪還」は争点を航路管理から船の帰属へ押し上げ、警告射撃は護衛に一線を引くものだ。「絶対的な支配」という表現が続く限り、戦争保険料と迂回コストは下がらず、運賃の変動は原油価格そのものより激しくなる。"}}, {"idx": "03", "tag": {"zh": "进展"}, "title": {"zh": "乌方袭击扩至波罗的海与地中海，俄方指北约提供技术支持", "en": "Ukrainian strikes spread to the Baltic and Mediterranean; Moscow points at NATO", "es": "Los ataques ucranianos llegan al Báltico y al Mediterráneo; Moscú señala a la OTAN", "ja": "ウクライナの攻撃がバルト海・地中海へ拡大、ロシアは NATO の技術支援を指摘"}, "body": {"zh": "俄外交部发言人扎哈罗娃称，乌方「公然谋求升级冲突并将冲突蔓延至乌克兰以外海域」，试图挑起俄罗斯与北约的冲突、破坏和平谈判。此前英国广播公司援引乌克兰和芬兰官方消息报道，一艘俄罗斯军舰 11 日在芬兰湾遭乌方无人机袭击，据信这是乌方无人机首次在对民用航运开放的波罗的海海域袭击俄方军舰。俄常驻欧安组织代表波利扬斯基 26 日警告，俄方将反制北约和欧盟国家支持乌方袭击俄船只的行为，称乌方无法独自在波罗的海和地中海实施此类袭击。意大利《共和国报》25 日报道，意政府怀疑英国为乌方在班加西袭击俄舰船提供了情报；挪威国防大臣桑维克、芬兰总理奥尔波分别就周边地区稳定表态。海上安保企业安布里称，乌方对俄海上袭击已不限于黑海。ACLED 数据显示，今年以来乌方对距离乌克兰海岸或前线超过 200 公里的黑海目标发动约 30 次袭击，是去年的 5 至 6 倍。", "en": "Russian foreign ministry spokeswoman Maria Zakharova accused Kyiv of «openly seeking to escalate the conflict and spread it to seas beyond Ukraine», trying to provoke a clash between Russia and NATO and to wreck peace talks. The BBC had reported, citing Ukrainian and Finnish officials, that a Russian warship was attacked by Ukrainian drones in the Gulf of Finland on 11 November — believed to be the first such strike on a Russian warship in Baltic waters open to civilian shipping. Russia's permanent representative to the OSCE, Dmitry Polyansky, warned on 26 November that Moscow would retaliate against NATO and EU states for supporting Ukrainian attacks on Russian vessels, arguing Kyiv could not carry them out in the Baltic and Mediterranean alone. Italy's La Repubblica reported on 25 November that Rome suspects Britain supplied intelligence for the Benghazi attack on Russian ships; Norway's defence minister Tore Sandvik and Finnish premier Petteri Orpo each spoke about stability in their neighbourhood. Maritime security firm Ambrey says Ukrainian attacks on Russian shipping are no longer confined to the Black Sea. ACLED data show about 30 Ukrainian strikes this year on Black Sea targets more than 200 km from the coast or front line, five to six times last year's figure.", "es": "La portavoz de Exteriores rusa, María Zajárova, acusó a Kiev de «buscar abiertamente escalar el conflicto y extenderlo a mares fuera de Ucrania», de intentar provocar un choque entre Rusia y la OTAN y de dinamitar las negociaciones de paz. La BBC había informado, citando fuentes oficiales ucranianas y finlandesas, de que un buque de guerra ruso fue atacado con drones ucranianos en el golfo de Finlandia el 11 de noviembre, lo que se cree que es el primer ataque de este tipo contra un buque ruso en aguas bálticas abiertas al tráfico civil. El representante permanente ruso ante la OSCE, Dmitri Polianski, advirtió el 26 de noviembre de que Moscú responderá contra los Estados de la OTAN y la UE por apoyar esos ataques, y sostuvo que Kiev no podría ejecutarlos solo en el Báltico y el Mediterráneo. El diario La Repubblica informó el 25 de noviembre de que Roma sospecha que Londres aportó inteligencia para el ataque de Bengasi; el ministro de Defensa noruego, Tore Sandvik, y el primer ministro finlandés, Petteri Orpo, se pronunciaron sobre la estabilidad de su entorno. La firma de seguridad marítima Ambrey afirma que los ataques ucranianos ya no se limitan al mar Negro. Datos de ACLED registran unas 30 acciones este año contra objetivos en el mar Negro a más de 200 km de la costa o el frente, entre cinco y seis veces más que el año pasado.", "ja": "ロシア外務省のザハロワ報道官は、ウクライナが「紛争の激化とウクライナ以外の海域への拡大を公然と狙い」、ロシアと NATO の衝突を挑発し和平交渉を壊そうとしていると非難した。BBC は先に、ウクライナとフィンランドの当局者の話として、11 日にロシア軍艦がフィンランド湾でウクライナのドローン攻撃を受けたと報道。民間航运に開放されたバルト海でロシア軍艦が攻撃されるのは初めてとみられる。OSCE 常駐代表のポリャンスキー氏は 11 月 26 日、ロシア船舶への攻撃を支援する NATO・EU 諸国に報復すると警告し、ウクライナ単独ではバルト海や地中海でこうした攻撃はできないと主張した。イタリア紙ラ・レプブリカは 25 日、ベンガジでのロシア艦船攻撃に英情報機関が関与した疑いがあると報じた。ノルウェーのサンヴィーク国防相とフィンランドのオルポ首相がそれぞれ地域の安定について言及した。海事警備会社アンブリーは、ウクライナの攻撃は黒海にとどまらないと指摘。ACLED のデータでは、今年ウクライナは海岸線や前線から 200 キロ以上離れた黒海の目標に約 30 回の攻撃を行い、昨年の 5〜6 倍に上る。"}, "why": {"zh": "战场的坐标系变了：从黑海一个水面，变成黑海、波罗的海、地中海三个水面，而每次外溢都要经过一个北约成员国的家门口。俄方把「技术支持」的指控摆上台面，等于预先分配升级责任；意大利怀疑英国、挪威要求稳定，说明联盟内部对「帮到什么程度」并无共识。这类裂痕平时不上头条，却决定冲突会不会真的跨出黑海。", "en": "The battlefield's coordinate system has changed: from one body of water, the Black Sea, to three — Black, Baltic and Mediterranean — and every spillover passes a NATO member's front door. By putting «technical support» on the table, Moscow is pre-assigning blame for escalation. Italy suspecting Britain and Norway asking for stability show there is no allied consensus on how far help should go. Such cracks rarely make headlines, yet they decide whether the war actually leaves the Black Sea.", "es": "El sistema de coordenadas del campo de batalla ha cambiado: de una masa de agua, el mar Negro, a tres —Negro, Báltico y Mediterráneo—, y cada desbordamiento pasa por la puerta de un miembro de la OTAN. Al poner sobre la mesa el «apoyo técnico», Moscú reparte de antemano la culpa de una escalada. Que Italia sospeche de Londres y Noruega pida estabilidad demuestra que no hay consenso aliado sobre hasta dónde llega la ayuda. Esas grietas rara vez son titulares, pero deciden si la guerra sale de verdad del mar Negro.", "ja": "戦場の座標系が変わった。黒海という一つの水域から、黒海・バルト海・地中海の三つへ。しかも流出のたびに NATO 加盟国の玄関先を通る。ロシアが「技術支援」を議題に載せたのは、エスカレーションの責任を前もって配分する行為だ。イタリアが英国を疑い、ノルウェーが安定を求めるのは、支援の線引きについて同盟内に合意がない証拠である。こうした亀裂は普段見出しにならないが、戦火が黒海の外に出るかどうかを決める。"}}, {"idx": "04", "title": {"zh": "荷兰反对美国会审议的半导体设备出口管制法案", "en": "Netherlands opposes US chip-tool export bill under review in Congress", "es": "Países Bajos se opone al proyecto de EE. UU. sobre exportación de equipos de chips", "ja": "オランダ、米議会審議中の半導体装置輸出規制法案に反対"}, "body": {"zh": "荷兰官员对美国国会正在审议的半导体制造设备出口管制法案表示反对，称该法案损害荷兰主权和国家利益。法案拟进一步收紧相关设备的出口许可。荷兰是阿斯麦总部所在地，该公司是全球主要的光刻机供应商，也是此类设备出口许可的直接当事方。", "en": "Dutch officials have come out against a bill before the US Congress that would tighten export controls on semiconductor manufacturing equipment, saying it harms Dutch sovereignty and national interests. The bill would further restrict export licensing for such equipment. The Netherlands is home to ASML, the main global supplier of lithography machines and a direct party to those licences.", "es": "Responsables neerlandeses se han pronunciado contra un proyecto de ley en el Congreso de EE. UU. que endurecería los controles de exportación de equipos de fabricación de semiconductores, por considerarlo lesivo para la soberanía y los intereses nacionales de Países Bajos. El texto restringiría aún más las licencias de exportación de esos equipos. Países Bajos alberga a ASML, principal proveedor mundial de máquinas de litografía y parte directa en esas licencias.", "ja": "オランダ当局者は、米議会で審議中の半導体製造装置の輸出管理法案に反対を表明し、オランダの主権と国益を損なうと述べた。法案は関連装置の輸出許可をさらに厳しくする内容とされる。オランダには世界有数の露光装置メーカー、ASML があり、輸出許可の直接の当事者となる。"}, "why": {"zh": "这类法案的实质，是把出口管制的决定权从海牙搬到华盛顿：设备在哪里造，规则就该由谁定——这才是荷兰反对的真实理由，而不是某一笔订单。对产业链来说，短期是许可的不确定性，中期是一个更麻烦的问题：「一国立法、多国执行」的模式会不会被复制到其他环节。", "en": "The substance of such a bill is to move the power to decide export controls from The Hague to Washington: whoever builds the machines should write the rules. That, rather than any single order, is why the Netherlands objects. For the supply chain the short-term cost is licensing uncertainty; the harder question is whether the «one country legislates, many countries enforce» model gets copied into other links.", "es": "El fondo de un proyecto así es trasladar la potestad de decidir los controles de exportación de La Haya a Washington: quien fabrica las máquinas debería escribir las reglas. Esa, y no un pedido concreto, es la razón real del rechazo neerlandés. Para la cadena de suministro, el coste inmediato es la incertidumbre en las licencias; la pregunta de fondo es si el modelo de «un país legisla, muchos ejecutan» se copiará en otros eslabones.", "ja": "こうした法案の本質は、輸出管理の決定権をハーグからワシントンへ移すことにある。装置を作る国がルールを書くべきだ、というのがオランダの反対の本当の理由であり、個別の受注の話ではない。サプライチェーンにとって短期的なコストは許可の不確実性、中期的な難題は「一国が立法し、多国が執行する」型が他の工程にも波及するかどうかである。"}}, {"idx": "05", "title": {"zh": "新西兰大选正式结果出炉，朝野两大阵营均未过半", "en": "New Zealand's official election result leaves both blocs short of a majority", "es": "El resultado oficial en Nueva Zelanda deja a ambos bloques sin mayoría", "ja": "ニュージーランド総選挙の正式結果、与野党どちらも過半数に届かず"}, "body": {"zh": "新西兰选举委员会公布议会选举正式结果，现执政联盟与反对党阵营均未获得议会多数席位。组阁谈判将围绕中间党派展开，新政府组成取决于其最终站队。", "en": "New Zealand's Electoral Commission published the official result of the parliamentary election, with neither the governing coalition nor the opposition bloc winning a majority of seats. Coalition talks will centre on the centrist parties, and the shape of the next government depends on which way they go.", "es": "La Comisión Electoral de Nueva Zelanda publicó el resultado oficial de las elecciones parlamentarias: ni la coalición de Gobierno ni el bloque opositor obtuvieron mayoría de escaños. Las negociaciones para formar Gobierno girarán en torno a los partidos de centro, y la forma del próximo Ejecutivo dependerá de su decisión.", "ja": "ニュージーランド選挙管理委員会は議会選挙の正式結果を公表した。与党連合も野党陣営も過半数の議席を獲得できなかった。組閣交渉は中道政党を軸に進み、次期政権の形はその選択にかかる。"}, "why": {"zh": "两个阵营都不过半，小党就从配角变成定价者，政策议程会被压到最小公约数。对新西兰这样的小型开放经济体，组阁拖得越久，财政安排与外资决策的观望期越长——利率和汇率往往比组阁结果更早作出反应。", "en": "When neither bloc clears half the seats, the smaller parties stop being supporting acts and start setting prices, and the policy agenda shrinks to the lowest common denominator. For a small open economy like New Zealand, the longer formation takes, the longer fiscal plans and foreign investment decisions wait — and interest rates and the currency usually react before the government does.", "es": "Cuando ningún bloque supera la mitad de los escaños, los partidos pequeños dejan de ser comparsa y empiezan a poner precio, y la agenda política se reduce al mínimo común denominador. Para una economía pequeña y abierta como la neozelandesa, cuanto más tarda la formación de Gobierno, más esperan los planes fiscales y las decisiones de inversión extranjera; los tipos y el tipo de cambio suelen reaccionar antes que el Ejecutivo.", "ja": "どちらの陣営も過半数に届かなければ、小党は脇役から値付け役に変わり、政策課題は最小公約数に縮む。ニュージーランドのような小さな開放経済では、組閣が長引くほど財政の見通しも外資の判断も先送りになる。金利と為替は政権よりも先に反応するのが常だ。"}}]}, {"key": "dom", "num": "02", "color": "#cf2f1e", "deep": "#a02315", "name": {"zh": "国内要闻", "en": "China", "es": "China", "ja": "中国"}, "items": [{"idx": "01", "tag": {"zh": "进展"}, "title": {"zh": "国常会研究深化资本市场投融资综合改革，提出汇金类「平准基金」", "en": "State Council studies deeper capital-market reform, backs a Huijin «stabilisation fund»", "es": "El Consejo de Estado estudia reformar el mercado de capitales y respalda un «fondo de estabilización»", "ja": "国務院常務会議、資本市場改革の深化を検討 匯金の「準平準基金」を打ち出す"}, "body": {"zh": "国务院总理李强 11 月 27 日主持召开国务院常务会议，听取推动高质量发展综合督查情况汇报，研究持续深化资本市场投融资综合改革工作，听取国家标准体系建设情况汇报，审议通过《生产安全事故隐患排查治理条例（草案）》。会议指出，资本市场事关经济发展大局，要推动上市公司加大分红回购力度，加力发挥「国家队」稳市作用，进一步优化中央汇金公司的类「平准基金」功能，提供充足流动性保障。市场解读认为，会议释放了「谋划出台增量政策」「让中长期资金真正稳得下来」「加强输入性风险防范应对」等信号。", "en": "Premier Li Qiang chaired a State Council executive meeting on 27 November that heard reports on a comprehensive inspection of high-quality development, studied deepening reform of the capital market's investment and financing system, heard a report on the national standards system, and approved in principle a draft regulation on identifying and fixing hidden safety hazards in production. The meeting said the capital market bears on the overall economy, and called for listed companies to raise dividend payouts and buybacks, for a stronger «national team» stabilising role, for a better quasi-stabilisation-fund function at Central Huijin, and for ample liquidity. Market participants read the session as signalling incremental policies, a genuine stabilisation of medium- and long-term funds, and stronger defences against imported risks.", "es": "El primer ministro Li Qiang presidió el 27 de noviembre una reunión ejecutiva del Consejo de Estado que escuchó informes sobre una inspección integral del desarrollo de alta calidad, estudió profundizar la reforma del sistema de inversión y financiación del mercado de capitales, recibió un informe sobre el sistema nacional de normas y aprobó un proyecto de reglamento sobre la detección de riesgos ocultos en la seguridad laboral. La reunión señaló que el mercado de capitales incide en la economía en su conjunto y pidió a las cotizadas elevar dividendos y recompras, reforzar el papel estabilizador del «equipo nacional», mejorar la función de cuasi fondo de estabilización de Central Huijin y garantizar liquidez suficiente. El mercado leyó la cita como una señal de políticas adicionales, de estabilización real de los fondos a medio y largo plazo y de mayor defensa frente a riesgos importados.", "ja": "李強首相は 11 月 27 日、国務院常務会議を主宰し、高品質発展に関する総合検査の報告を聴取するとともに、資本市場の投融資制度改革の継続的な深化を検討し、国家標準体系に関する報告を聴き、生産安全事故の隐患調査・処理に関する条例草案を審議・可決した。会議は、資本市場が経済全体に関わるとした上で、上場企業の増配・自社株買いの拡大、「国家隊」の市場安定機能の強化、中央匯金の準「平準基金」機能の最適化、十分な流動性の確保を求めた。市場では、追加政策の準備、中長期資金の定着、輸入型リスクへの備えといったシグナルと受け止められた。"}, "why": {"zh": "这段话里最实的是三个动作：分红回购（让上市公司自己买）、国家队加力（让汇金当准平准基金）、充足流动性（让钱不缺）。合起来是把「稳市」从临时救火改成常备工具。对普通投资者，值得留意的是它出现在指数大涨的同一天——政策给的是底部预期，不是顶部信号。", "en": "Three verbs carry the weight here: dividends and buybacks, so listed companies buy their own stock; a stronger national team, so Huijin acts as a quasi-stabilisation fund; and ample liquidity, so money is not scarce. Together they turn market support from emergency firefighting into a standing tool. For ordinary investors, the telling detail is the timing: the same day as the index surge. Policy is supplying a floor for expectations, not a signal of a top.", "es": "Tres verbos sostienen el mensaje: dividendos y recompras, para que las cotizadas compren sus propias acciones; un equipo nacional reforzado, para que Huijin actúe como cuasi fondo de estabilización; y liquidez suficiente, para que el dinero no escasee. Juntos convierten el apoyo al mercado en una herramienta permanente y no en un apagafuegos. Para el inversor común, el detalle revelador es la fecha: el mismo día del gran rebote. La política ofrece un suelo de expectativas, no una señal de techo.", "ja": "ここで効いているのは三つの動詞だ。増配・自社株買いで上場企業自身に買わせ、国家隊の強化で匯金を準平準基金として動かし、十分な流動性で資金不足を防ぐ。合わせて「市場安定」を緊急消火から常備の道具に変えるものだ。個人投資家にとって見逃せないのは、それが指数急騰と同じ日だったという点である。政策が与えるのは底値の期待であり、天井のシグナルではない。"}}, {"idx": "02", "title": {"zh": "央行发布人民币存贷款利率管理规定与大额存单管理办法", "en": "PBOC issues new rules on RMB deposit and loan rates and large-denomination CDs", "es": "El PBOC publica nuevas normas sobre tipos de depósito y préstamo en yuanes y certificados de depósito", "ja": "中国人民銀行、人民元預貸金利と大口定期預金の管理規則を公表"}, "body": {"zh": "中国人民银行发布《人民币存贷款利率管理规定》和《大额存单管理办法》。两份文件已经 2026 年 10 月 30 日人民银行第 10 次行务会审议通过，自 2027 年 3 月 21 日起施行。新规对存贷款利率的定价机制、传导路径与自律管理作出系统规定，并明确了大额存单的发行、转让与计息规则。此前市场关注的「10 万元起存大额存单」话题同步升温。", "en": "The People's Bank of China has issued rules on RMB deposit and loan interest rates and measures for managing large-denomination certificates of deposit. Both were approved at the central bank's 10th administrative meeting on 30 October 2026 and take effect on 21 March 2027. The rules set out how deposit and loan rates are priced, how they transmit through the system and how self-discipline works, and clarify issuance, transfer and interest calculation for large-denomination CDs. Discussion of a «100,000-yuan minimum» for such CDs has picked up alongside the announcement.", "es": "El Banco Popular de China publicó una normativa sobre tipos de interés de depósitos y préstamos en yuanes y unas medidas de gestión de certificados de depósito de gran denominación. Ambos textos fueron aprobados en la décima reunión administrativa del banco central el 30 de octubre de 2026 y entran en vigor el 21 de marzo de 2027. Las normas fijan cómo se forman los tipos, cómo se transmiten y cómo funciona la autodisciplina, y aclaran la emisión, transmisión y cálculo de intereses de esos certificados. La discusión sobre un «mínimo de 100.000 yuanes» ha cobrado fuerza con el anuncio.", "ja": "中国人民銀行は「人民元預貸金利管理規定」と「大口定期預金管理弁法」を公表した。いずれも 2026 年 10 月 30 日の第 10 回行務会で承認され、2027 年 3 月 21 日から施行される。預貸金利の価格形成、伝達経路、自主規律について体系的に定め、大口定期預金の発行・譲渡・利息計算の規則を明確にした。あわせて「10 万元からの大口定期預金」という論点も関心を集めている。"}, "why": {"zh": "存款利率的市场化不是「放开就完事」，而是把定价行为装进规则里：谁能定、按什么定、偏离了怎么纠。对储户最直接的变化在大额存单——发行与转让规则统一之后，「抢额度」的窗口会变窄，利率差更多体现在期限而不是渠道。", "en": "Market-based deposit rates are not simply a matter of letting go; they mean putting pricing behaviour inside rules: who may set rates, on what basis, and how deviations are corrected. The most visible change for savers is in large-denomination CDs: once issuance and transfer rules are unified, the window for «grabbing a quota» narrows, and rate differences show up more in tenor than in channel.", "es": "Unos tipos de depósito de mercado no consisten en soltar el control, sino en meter la fijación de precios dentro de reglas: quién puede fijarlos, con qué base y cómo se corrigen las desviaciones. El cambio más visible para el ahorrador está en los certificados de gran denominación: al unificar emisión y transmisión, la ventana para «cazar cupo» se estrecha y las diferencias de tipo se reflejan más en el plazo que en el canal.", "ja": "預金金利の市場化は「自由化して終わり」ではない。誰が、何を基準に決め、逸脱した場合にどう正すかという形で、価格形成をルールの中に収めることだ。預金者にとって最も見えやすい変化は大口定期預金にある。発行と譲渡の規則が統一されれば「枠を奪う」余地は狭まり、金利差は販路よりも期間に表れるようになる。"}}, {"idx": "03", "title": {"zh": "前 10 月规上工业企业利润 67373.6 亿元，同比增长 16.0%", "en": "Industrial profits up 16.0% in first ten months to 6.74 trillion yuan", "es": "Los beneficios industriales suben un 16,0% hasta 6,74 billones de yuanes", "ja": "1〜10 月の工業企業利益は 6 兆 7373.6 億元、16.0％増"}, "body": {"zh": "国家统计局 27 日发布数据，1 至 10 月全国规模以上工业企业实现利润总额 67373.6 亿元，同比增长 16.0%，继续保持两位数增长；其中 10 月单月利润同比增长 20.1%。统计局称，新动能快速成长带动工业企业利润增长。", "en": "The National Bureau of Statistics said on 27 November that industrial enterprises above designated size earned combined profits of 6.74 trillion yuan in January-October, up 16.0% year on year and still growing at a double-digit pace; in October alone profits rose 20.1%. The bureau attributed the gain to the rapid growth of new drivers.", "es": "La Oficina Nacional de Estadísticas informó el 27 de noviembre de que las empresas industriales de gran tamaño obtuvieron entre enero y octubre unos beneficios conjuntos de 6,74 billones de yuanes, un 16,0% más interanual, todavía a ritmo de dos dígitos; solo en octubre los beneficios crecieron un 20,1%. El organismo atribuyó la mejora al rápido crecimiento de los nuevos motores económicos.", "ja": "国家統計局は 11 月 27 日、1〜10 月の一定規模以上工業企業の利益総額が 6 兆 7373.6 億元、前年同期比 16.0％増と 2 桁成長を維持したと発表した。10 月単月では 20.1％増。新たな成長エンジンの急速な伸びが利益を押し上げたとしている。"}, "why": {"zh": "16% 的累计增速，放在工业品价格长期偏弱、需求偏软的背景里并不寻常，说明利润改善主要来自成本端和结构端——高附加值行业占比上升、单位成本下降，而不是靠涨价。10 月单月 20.1% 的斜率更陡，与半导体链条的景气相互印证；这也是资本市场愿意在同一天给成长板块高估值的产业基础。", "en": "A 16% cumulative gain is unusual against persistently soft industrial prices and weak demand, which points to costs and mix rather than pricing power: a larger share of high-value-added industries and lower unit costs. October's steeper 20.1% slope echoes the strength in the semiconductor chain — the industrial base beneath the growth-stock valuations the market handed out the same day.", "es": "Un 16% acumulado es poco habitual con precios industriales persistentemente débiles y demanda floja, lo que apunta a costes y a composición más que a poder de fijación de precios: más peso de industrias de alto valor añadido y menores costes unitarios. El 20,1% de octubre, más inclinado, coincide con la fortaleza de la cadena de semiconductores: la base industrial que sostiene las valoraciones de crecimiento que el mercado concedió ese mismo día.", "ja": "16％という累計の伸びは、工業品価格が長く弱く需要も軟調な状況では異例だ。利益改善が値上げではなく、コストと構成、すなわち高付加価値産業の比率上昇と単位コストの低下から来ていることを示す。10 月単月の 20.1％という急勾配は半導体チェーンの好調と符合する。市場が同じ日に成長株へ高い評価を与えた産業的な土台もここにある。"}}, {"idx": "04", "title": {"zh": "侵华日军第七三一部队罪证陈列馆公布 3 件化学战新罪证", "en": "Unit 731 museum releases three new pieces of evidence on chemical warfare", "es": "El museo de la Unidad 731 presenta tres nuevas pruebas sobre la guerra química", "ja": "731 部隊罪証陳列館、化学戦の新たな証拠 3 点を公開"}, "body": {"zh": "11 月 27 日，侵华日军第七三一部队罪证陈列馆发布 3 件化学战新罪证，再次表明侵华日军化学战是自上而下、成体系的国家犯罪。其中一项最新研究发现，1945 年 8 月败退前夕，侵华日军第五一六部队曾组建一支约 70 人的「整理残务班」，专门负责遗留化学武器的转运、掩埋和遗弃。研究人员表示，这一线索或为发现日遗化武埋藏地点提供重要信息。", "en": "The Unit 731 Evidence Museum released three new pieces of evidence on chemical warfare on 27 November, again showing that Japan's chemical warfare in China was a top-down, systematic state crime. One new finding: in August 1945, as it retreated, the Japanese army's Unit 516 formed a «residual affairs clean-up squad» of about 70 people tasked with moving, burying and abandoning leftover chemical weapons. Researchers say the lead may help locate buried Japanese-abandoned chemical munitions.", "es": "El museo de pruebas de la Unidad 731 presentó el 27 de noviembre tres nuevas evidencias sobre la guerra química, que vuelven a mostrar que la guerra química japonesa en China fue un crimen de Estado sistemático y dirigido desde arriba. Una de las investigaciones halla que en agosto de 1945, al retirarse, la Unidad 516 del ejército japonés creó un «equipo de liquidación de asuntos residuales» de unas 70 personas encargado de trasladar, enterrar y abandonar armas químicas. Los investigadores creen que la pista puede ayudar a localizar enterramientos de munición química abandonada por Japón.", "ja": "731 部隊罪証陳列館は 11 月 27 日、化学戦に関する新たな証拠 3 点を公開し、日本の中国における化学戦が上からの指示による体系的な国家犯罪であったことを改めて示した。研究の一つは、1945 年 8 月の敗退直前、日本軍第 516 部隊が約 70 人からなる「残務整理班」を編成し、遺棄化学兵器の移送・埋設・投棄を担わせていたことを明らかにした。研究者は、この手がかりが日本軍遺棄化学兵器の埋設地点の発見につながる可能性があるとしている。"}, "why": {"zh": "新罪证的价值不在情绪，而在坐标：一支 70 人的「整理残务班」意味着遗弃化武是有组织、有档案的行动，那些埋藏点因此可以被推算、被核查。对至今仍在承受日遗化武毒害的中国受害者，这类档案是追责与索赔的实证基础。", "en": "The value of new evidence lies not in emotion but in coordinates: a 70-person clean-up squad means the abandonment of chemical weapons was organised and documented, which makes burial sites calculable and verifiable. For Chinese victims still suffering from abandoned Japanese chemical munitions, such archives are the factual basis for accountability and claims.", "es": "El valor de una prueba nueva no está en la emoción sino en las coordenadas: un equipo de limpieza de 70 personas implica que el abandono de armas químicas fue una operación organizada y documentada, lo que hace calculables y verificables los enterramientos. Para las víctimas chinas que aún sufren las secuelas de ese armamento, esos archivos son la base fáctica para exigir responsabilidades.", "ja": "新しい証拠の価値は感情ではなく座標にある。70 人規模の残務整理班は、化学兵器の遺棄が組織的かつ記録を伴う行為だったことを意味し、埋設地点を推定し検証できるようにする。今なお遺棄化学兵器の被害に苦しむ中国の被害者にとって、こうした記録は責任追及と賠償請求の実証的な土台となる。"}}, {"idx": "05", "title": {"zh": "安徽三条时速 350 公里高铁同步开通，五个县告别不通高铁", "en": "Three 350 km/h lines open in Anhui, bringing five counties onto the rail map", "es": "Tres líneas de 350 km/h abren en Anhui y conectan cinco condados al tren de alta velocidad", "ja": "安徽省で時速 350 キロの高速鉄道 3 路線が同時開業、5 県が初めて高速鉄道と接続"}, "body": {"zh": "11 月 27 日，安徽巢湖至马鞍山、淮北至蚌埠、淮北至阜阳三条时速 350 公里高铁同步开通运营。和县、濉溪、固镇、蒙城、利辛等 5 个县随之告别不通高铁的历史。三条线路均在安徽省内，把皖北多座城市纳入合肥、南京的快速通勤半径。", "en": "Three high-speed lines rated at 350 km/h opened together in Anhui on 27 November: Chaohu-Ma'anshan, Huaibei-Bengbu and Huaibei-Fuyang. Five counties — He, Suixi, Guzhen, Mengcheng and Lixin — thus ended their history of having no high-speed rail. All three lines run within the province and pull several northern Anhui cities into fast commuting range of Hefei and Nanjing.", "es": "El 27 de noviembre abrieron simultáneamente en Anhui tres líneas de alta velocidad de 350 km/h: Chaohu-Ma'anshan, Huaibei-Bengbu y Huaibei-Fuyang. Cinco condados —He, Suixi, Guzhen, Mengcheng y Lixin— pusieron así fin a su falta de tren de alta velocidad. Las tres líneas discurren dentro de la provincia y acercan varias ciudades del norte de Anhui al radio de desplazamiento rápido de Hefei y Nankín.", "ja": "11 月 27 日、安徽省で時速 350 キロの高速鉄道 3 路線（巢湖―馬鞍山、淮北―蚌埠、淮北―阜陽）が同時に開業した。和県、濉渓、固鎮、蒙城、利辛の 5 県が高速鉄道のない時代に終止符を打った。3 路線はいずれも省内を通り、皖北の複数の都市を合肥・南京への高速通勤圏に組み込む。"}, "why": {"zh": "三条线都在省内，却把皖北与合肥、南京两个都市圈的时空距离压到一小时级——县域经济最缺的往往不是政策，而是「当天能回来」的通勤半径。五个县同时结束无高铁历史，这类基建的回报不在票价，而在人口回流与产业转移的第一步。", "en": "All three lines stay inside the province, yet they compress the distance between northern Anhui and the Hefei and Nanjing metro areas to about an hour. What county economies lack is often not policy but a commuting radius that lets people come back the same day. Five counties ending their rail isolation at once: the return on such infrastructure is not in ticket revenue but in the first step of people returning and industry relocating.", "es": "Las tres líneas discurren dentro de la provincia, pero comprimen a cerca de una hora la distancia entre el norte de Anhui y las áreas metropolitanas de Hefei y Nankín. A las economías de condado suele faltarles no la política sino un radio de desplazamiento que permita volver el mismo día. Cinco condados dejando a la vez su aislamiento ferroviario: el retorno de esa infraestructura no está en el billete, sino en el primer paso del regreso de población y la reubicación industrial.", "ja": "3 路線はいずれも省内だが、皖北と合肥・南京の都市圏との時間距離を 1 時間級に縮める。県域経済に欠けているのは政策ではなく、「その日のうちに戻れる」通勤圏であることが多い。5 県が同時に高速鉄道空白地帯を脱する。こうしたインフラの見返りは運賃ではなく、人口の還流と産業移転の第一歩にある。"}}]}, {"key": "fin", "num": "03", "color": "#b45309", "deep": "#8a3f06", "name": {"zh": "金融要闻", "en": "Markets", "es": "Mercados", "ja": "金融"}, "items": [{"idx": "01", "tag": {"zh": "进展"}, "title": {"zh": "美股三大指数周线大涨，存储与光通信领涨", "en": "US stocks post big weekly gains as memory and optical names lead", "es": "Wall Street cierra una gran semana con memorias y fibra óptica al frente", "ja": "米国株は週間で大きく上昇、メモリーと光通信が主導"}, "body": {"zh": "27 日纽约股市三大股指显著上涨：道指涨 591.99 点，收于 50774.94 点，涨幅 1.18%；标普 500 涨 114.71 点，收于 7297.49 点，涨幅 1.60%；纳指涨 543.70 点，收于 24129.50 点，涨幅 2.31%。本周道指累涨 5.46%，标普 500 累涨 5.6%，纳指累涨 6.68%。标普十一大板块全线上涨，非必需消费品涨 2.72%、科技涨 2.23% 领涨。费城半导体指数涨 4.69%，闪迪涨近 16% 为 7 月以来最大单日涨幅，美光科技、SK 海力士、希捷科技、西部数据涨超 7%；特斯拉涨超 5%，亚马逊涨近 4%，英伟达涨 0.8%。纳斯达克中国金龙指数涨 3.02%。", "en": "US stocks rose sharply on 27 November: the Dow gained 591.99 points to 50,774.94 (+1.18%), the S&P 500 added 114.71 points to 7,297.49 (+1.60%) and the Nasdaq climbed 543.70 points to 24,129.50 (+2.31%). For the week the Dow rose 5.46%, the S&P 500 5.6% and the Nasdaq 6.68%. All eleven S&P sectors advanced, led by consumer discretionary at 2.72% and tech at 2.23%. The Philadelphia semiconductor index gained 4.69%; SanDisk jumped nearly 16%, its biggest one-day move since July, while Micron, SK Hynix, Seagate and Western Digital each rose more than 7%. Tesla added over 5%, Amazon nearly 4% and Nvidia 0.8%. The Nasdaq Golden Dragon China index rose 3.02%.", "es": "La bolsa estadounidense subió con fuerza el 27 de noviembre: el Dow ganó 591,99 puntos hasta 50.774,94 (+1,18%), el S&P 500 sumó 114,71 hasta 7.297,49 (+1,60%) y el Nasdaq avanzó 543,70 hasta 24.129,50 (+2,31%). En la semana, el Dow subió un 5,46%, el S&P 500 un 5,6% y el Nasdaq un 6,68%. Los once sectores del S&P avanzaron, liderados por consumo discrecional (+2,72%) y tecnología (+2,23%). El índice de semiconductores de Filadelfia ganó un 4,69%; SanDisk saltó casi un 16%, su mayor alza diaria desde julio, y Micron, SK Hynix, Seagate y Western Digital subieron más del 7%. Tesla sumó más del 5%, Amazon casi el 4% y Nvidia el 0,8%. El índice Golden Dragon de valores chinos ganó un 3,02%.", "ja": "11 月 27 日の米国株は大幅高。ダウは 591.99 ドル高の 5 万 774.94 ドル（1.18％高）、S&P 500 は 114.71 高の 7297.49（1.60％高）、ナスダックは 543.70 高の 2 万 4129.50（2.31％高）。週間ではダウ 5.46％高、S&P 500 5.6％高、ナスダック 6.68％高となった。S&P の 11 セクターはすべて上昇し、一般消費財（2.72％高）とテクノロジー（2.23％高）が主導。フィラデルフィア半導体指数は 4.69％高、サンディスクは約 16％高で 7 月以来の大幅上昇、マイクロン、SK ハイニックス、シーゲイト、ウエスタンデジタルは 7％超上昇した。テスラは 5％超、アマゾンは 4％近く、エヌビディアは 0.8％高。ナスダック中国金龍指数は 3.02％高。"}, "why": {"zh": "这一周的修复不是「AI 叙事复活」那么简单：领涨的是存储和光通信——最上游、最先感受到订单的环节，闪迪 16% 的单日涨幅说明市场在给「涨价周期」定价，而不是给概念定价。英伟达只涨 0.8%，也说明资金正从「算力总龙头」向「卡脖子环节」扩散。周线 5% 以上的反弹之后，真正的问题是 12 月议息前的估值还能不能撑住。", "en": "This week's recovery is more than an AI narrative coming back to life: the leaders were memory and optical interconnect — the most upstream links, the first to feel orders. SanDisk's 16% day says the market is pricing a price-increase cycle, not a concept. Nvidia rising only 0.8% says money is spreading from the computing champion to the bottlenecks. After a 5%-plus weekly rebound, the real question is whether valuations hold until the December rate meeting.", "es": "La recuperación de la semana es más que el renacer del relato de la IA: lideraron memorias e interconexión óptica, los eslabones más altos de la cadena y los primeros en notar los pedidos. El 16% de SanDisk indica que el mercado pone precio a un ciclo de subidas, no a un concepto. Que Nvidia subiera solo un 0,8% muestra que el dinero se desplaza del campeón del cálculo a los cuellos de botella. Tras un rebote semanal superior al 5%, la pregunta real es si las valoraciones aguantan hasta la reunión de tipos de diciembre.", "ja": "今週の回復は「AI 相場の復活」だけでは説明できない。主導したのはメモリーと光接続、つまり最も上流で受注を最初に感じる工程だ。サンディスクの 16％高は、市場が概念ではなく値上げサイクルに値段を付けていることを示す。エヌビディアが 0.8％高にとどまったのも、資金が「計算力の総本山」から「ボトルネック工程」へ広がっている証拠だ。週間 5％超の反発の後、本当の論点は 12 月の金融政策会合までバリュエーションが持つかどうかである。"}}, {"idx": "02", "tag": {"zh": "进展"}, "title": {"zh": "贵金属大涨：金价重回 3680 美元，白银单日涨逾 5%", "en": "Precious metals surge: gold back above $3,680, silver up more than 5%", "es": "Los metales preciosos se disparan: el oro supera los 3.680 dólares y la plata sube más del 5%", "ja": "貴金属が急騰、金は 3680 ドル台に回復し銀は 5％超高"}, "body": {"zh": "27 日国际贵金属大涨，COMEX 黄金期货涨 2.44%，报 3681.1 美元/盎司；现货黄金涨 2.45%，报 3653.5 美元/盎司。COMEX 白银期货涨 5.35%，报 43.985 美元/盎司；现货白银涨 5.24%，报 43.72 美元/盎司。同日美元指数涨 0.26%，收于 104.033。国际油价微跌，纽约商品交易所 1 月交货的轻质原油期货跌 0.72%，收于每桶 83.08 美元；1 月交货的布伦特原油跌 1.17%，收于每桶 95.44 美元。欧洲三大股指全线上涨，德国 DAX 涨 0.90%、法国 CAC40 涨 0.58%、英国富时 100 涨 0.84%。", "en": "Precious metals jumped on 27 November: COMEX gold futures rose 2.44% to $3,681.1 an ounce and spot gold 2.45% to $3,653.5. COMEX silver futures gained 5.35% to $43.985 an ounce and spot silver 5.24% to $43.72. The dollar index rose 0.26% to 104.033. Oil slipped: January light crude on the New York exchange fell 0.72% to $83.08 a barrel and January Brent fell 1.17% to $95.44. Europe's three main indices all rose, with Germany's DAX up 0.90%, France's CAC 40 up 0.58% and Britain's FTSE 100 up 0.84%.", "es": "Los metales preciosos subieron con fuerza el 27 de noviembre: el oro en futuros COMEX ganó un 2,44% hasta 3.681,1 dólares la onza y el oro al contado un 2,45% hasta 3.653,5. La plata en futuros COMEX avanzó un 5,35% hasta 43,985 dólares la onza y la plata al contado un 5,24% hasta 43,72. El índice del dólar subió un 0,26% hasta 104,033. El petróleo cedió: el crudo ligero de enero en Nueva York cayó un 0,72% a 83,08 dólares el barril y el Brent de enero un 1,17% a 95,44. Los tres índices europeos subieron: DAX alemán +0,90%, CAC 40 francés +0,58% y FTSE 100 británico +0,84%.", "ja": "11 月 27 日、貴金属が急騰した。COMEX 金先物は 2.44％高の 1 オンス 3681.1 ドル、現物金は 2.45％高の 3653.5 ドル。COMEX 銀先物は 5.35％高の 43.985 ドル、現物銀は 5.24％高の 43.72 ドル。ドル指数は 0.26％高の 104.033。原油は小幅安で、ニューヨークの 1 月限の軽質原油は 0.72％安の 1 バレル 83.08 ドル、ブレント 1 月限は 1.17％安の 95.44 ドル。欧州株は全面高で、独 DAX 0.90％高、仏 CAC40 0.58％高、英 FTSE100 0.84％高となった。"}, "why": {"zh": "美元涨、黄金也涨，这种同向组合通常意味着买盘不是冲着汇率，而是冲着不确定性——同一周里欧盟预算谈崩、霍尔木兹继续封锁、主要股指又都在高位。白银 5% 的单日涨幅比黄金更值得看：它一半是贵金属、一半是工业金属，涨幅更大说明资金在同时押注避险与制造业补库。", "en": "The dollar up and gold up together usually means buyers are not chasing the currency but uncertainty: in the same week the EU budget collapsed, Hormuz stayed shut and major indices sat near highs. Silver's 5% day matters more than gold's: it is half precious metal, half industrial input, and the bigger move says money is betting on safe-haven demand and restocking at the same time.", "es": "Que el dólar y el oro suban a la vez suele indicar que las compras no buscan la divisa sino la incertidumbre: en la misma semana fracasó el presupuesto europeo, Ormuz siguió cerrado y los índices estaban cerca de máximos. El 5% de la plata importa más que el oro: es mitad metal precioso y mitad insumo industrial, y su mayor alza indica que el dinero apuesta a la vez por el refugio y por la reposición de inventarios.", "ja": "ドル高と金高が同時に起きるのは、買いが為替ではなく不確実性に向かっている合図だ。同じ週に EU 予算は決裂し、ホルムズは閉鎖が続き、主要株価指数は高値圏にあった。銀の 5％高は金以上に読む価値がある。銀は貴金属であり工業原料でもあり、上げ幅が大きいのは資金が回避と在庫補充の両方に賭けているという意味だ。"}}, {"idx": "03", "title": {"zh": "港交所公开谴责中国恒大及七名董事，许家印被认定不适合任董事", "en": "HKEX censures Evergrande and seven directors; Hui declared unfit to serve", "es": "La bolsa de Hong Kong censura a Evergrande y a siete consejeros; Hui, declarado no apto", "ja": "香港取引所、恒大と取締役 7 人を公開非難 許家印氏は取締役不適格と認定"}, "body": {"zh": "11 月 26 日，香港联合交易所发布纪律行动公告，谴责中国恒大集团（清盘中，已除牌）、恒大物业集团及七名董事。联交所向许家印、夏海钧、潘大荣等六人作出董事不适合性声明及谴责，向恒大物业前执行董事胡亮作出损害投资者权益声明及谴责。公告显示，2020 年 12 月至 2021 年 8 月，恒大物业及其附属公司以净额 134 亿元人民币的定期存款作质押，为多名第三方取得银行承兑汇票及贷款提供担保，贷款所得款项最终转回中国恒大，其中 100 亿元于 2021 年 2 月用于提前赎回中国恒大的债券。质押涉及恒大物业首次公开招股所得款项约 31.2 亿元，占其募资净额约 54%，违反招股章程所述用途。联交所认定，时任财务总监潘大荣策划将恒大物业资金经第三方中介转移至中国恒大，以规避关联交易规则；许家印曾指示腾出恒大物业可动用现金供中国恒大使用。", "en": "On 26 November the Stock Exchange of Hong Kong published a disciplinary notice censuring China Evergrande Group (in liquidation, delisted), Evergrande Property Services Group and seven directors. It issued declarations of unsuitability and censures against six people including Hui Ka-yan, Xia Haijun and Pan Darong, and a statement prejudicial to investors' interests against former Evergrande Property executive director Hu Liang. According to the notice, between December 2020 and August 2021 Evergrande Property and its units pledged RMB 13.4 billion in net time deposits to secure bank acceptance bills and loans for third parties; the proceeds were ultimately routed back to China Evergrande, with RMB 10 billion used in February 2021 to redeem Evergrande bonds early. The pledge involved about RMB 3.12 billion of IPO proceeds, some 54% of net proceeds, contrary to the stated use of funds. The exchange found that then-CFO Pan Darong engineered the transfer through third-party intermediaries to skirt connected-transaction rules, and that Hui instructed staff to free up Evergrande Property's available cash for the parent.", "es": "El 26 de noviembre la Bolsa de Hong Kong publicó una nota disciplinaria que censura a China Evergrande Group (en liquidación y ya excluida), Evergrande Property Services Group y siete consejeros. Emitió declaraciones de no idoneidad y censuras contra seis personas, entre ellas Hui Ka-yan, Xia Haijun y Pan Darong, y una declaración de perjuicio a los inversores contra el exconsejero de Evergrande Property Hu Liang. Según la nota, entre diciembre de 2020 y agosto de 2021 Evergrande Property y sus filiales pignoraron 13.400 millones de yuanes netos en depósitos a plazo para garantizar letras aceptadas y préstamos de terceros; los fondos volvieron finalmente a China Evergrande y 10.000 millones se usaron en febrero de 2021 para amortizar anticipadamente bonos. La pignoración afectó a unos 3.120 millones de yuanes de la salida a bolsa, el 54% del neto, contra el uso declarado. La bolsa concluyó que el entonces director financiero Pan Darong diseñó la transferencia vía intermediarios para eludir las reglas de operaciones vinculadas, y que Hui ordenó liberar el efectivo disponible de Evergrande Property para la matriz.", "ja": "11 月 26 日、香港連合取引所は規律行動の公告を公表し、中国恒大グループ（清算中、上場廃止済み）、恒大物業グループ、取締役 7 人を非難した。許家印氏、夏海鈞氏、潘大栄氏ら 6 人に取締役不適格の宣言と非難を、恒大物業の元執行取締役・胡亮氏に投資者利益を損なう行為の宣言と非難を行った。公告によれば、2020 年 12 月から 2021 年 8 月にかけ、恒大物業と子会社は純額 134 億元の定期預金を担保に、第三者への銀行引受手形や融資を保証。融資資金は最終的に中国恒大に戻り、うち 100 億元は 2021 年 2 月に恒大の社債を繰上償還するために使われた。担保には新規上場で調達した約 31.2 億元（純調達額の約 54％）が充てられ、目論見書の使途に反していた。取引所は、当時の財務責任者・潘大栄氏が第三者を介して資金を移し関連当事者取引の規則を回避したこと、許家印氏が恒大物業の現金を親会社のために解放するよう指示したことを認定した。"}, "why": {"zh": "134 亿元质押、31.2 亿元 IPO 募资被挪用、54% 的比例——这些数字让「关联交易」从术语变成了一笔可以算清的账。更值得记的是制裁的形式：「董事不适合性声明」不是罚款，而是把当事人从上市公司治理岗位上排除出去。对仍在清盘的恒大系而言，这条纪律行动更像一份迟到的责任清单。", "en": "RMB 13.4 billion pledged, RMB 3.12 billion of IPO proceeds diverted, 54% of the total: these numbers turn «connected transaction» from jargon into a ledger anyone can audit. More telling is the form of the sanction: a declaration of unsuitability is not a fine but an exclusion from listed-company governance. For a group still in liquidation, the notice reads like a late-arriving list of responsibilities.", "es": "13.400 millones pignorados, 3.120 millones de la salida a bolsa desviados, un 54% del total: las cifras convierten la «operación vinculada» en un libro que cualquiera puede auditar. Más revelador es el tipo de sanción: una declaración de no idoneidad no es una multa, sino la exclusión de la gobernanza de una cotizada. Para un grupo aún en liquidación, la nota se lee como una lista de responsabilidades que llega tarde.", "ja": "134 億元の担保、新規上場資金のうち 31.2 億元の流用、その比率 54％。この数字が「関連当事者取引」を専門用語から検算できる帳簿に変える。さらに注目すべきは制裁の形式だ。「取締役不適格宣言」は過料ではなく、上場企業の統治から人を排除するものだ。いまも清算中の恒大グループにとって、この公告は遅れて届いた責任の一覧のように読める。"}}, {"idx": "04", "title": {"zh": "恒大汽车被上市委员会决定取消上市地位", "en": "Evergrande Auto's listing cancelled by the exchange's listing committee", "es": "El comité de cotización decide cancelar la cotización de Evergrande Auto", "ja": "恒大汽車、上場委員会が上場廃止を決定"}, "body": {"zh": "11 月 27 日，中国恒大新能源汽车集团（股份代号 708）公告，上市委员会已决定取消其上市地位，公司有权申请复核，股份继续暂停买卖。此前该公司股份自 2024 年起长期停牌。", "en": "China Evergrande New Energy Vehicle Group (stock code 708) announced on 27 November that the listing committee had decided to cancel its listing. The company has the right to seek a review, and trading in its shares remains suspended; the stock has been halted for an extended period since 2024.", "es": "China Evergrande New Energy Vehicle Group (código 708) anunció el 27 de noviembre que el comité de cotización ha decidido cancelar su cotización. La empresa puede solicitar una revisión y sus acciones siguen suspendidas, como lo están desde hace un periodo prolongado desde 2024.", "ja": "中国恒大新能源汽車グループ（証券コード 708）は 11 月 27 日、上場委員会が上場廃止を決定したと発表した。会社には再審査を申請する権利があり、株式の売買は引き続き停止されている。同社株は 2024 年以降、長期にわたり売買停止が続いていた。"}, "why": {"zh": "取消上市不是破产，但它是资本市场的终局判决：从此不能再向公众融资，只剩资产处置和债务清偿。对恒大系来说，地产平台已经除牌、物业平台被纪律谴责、汽车平台走到退市，三条腿各自落地，重组进入「剩下多少、分给谁」的阶段。", "en": "Cancellation is not bankruptcy, but it is a final verdict from the capital market: no more public fundraising, only asset disposal and debt repayment. Within the Evergrande group the property platform is delisted, the services platform has been censured and the auto platform is now heading off the board. With all three legs down, restructuring moves to the question of what is left and who gets it.", "es": "La cancelación no es quiebra, pero sí un veredicto final del mercado: no habrá más financiación pública, solo venta de activos y pago de deudas. En el grupo Evergrande la plataforma inmobiliaria ya está excluida, la de servicios fue censurada y la de automoción sale del parqué. Con las tres patas en el suelo, la reestructuración pasa a la pregunta de cuánto queda y para quién.", "ja": "上場廃止は破産ではないが、資本市場からの最終判決だ。公募による資金調達はできなくなり、残るのは資産処分と債務返済だけになる。恒大グループは不動産が上場廃止、物業が規律非難、自動車が上場廃止へと三本の脚がそれぞれ着地し、再建は「何が残り、誰に配分するか」という段階に入った。"}}, {"idx": "05", "title": {"zh": "欧洲央行新行长人选落定，德科斯明年 2 月接替拉加德", "en": "De Cos to succeed Lagarde as ECB president in February", "es": "De Cos sustituirá a Lagarde al frente del BCE en febrero", "ja": "ECB 総裁にデ・コス氏、来年 2 月にラガルド氏を引き継ぎ"}, "body": {"zh": "欧元区领导人选定西班牙央行前行长巴勃罗·德科斯出任欧洲央行行长，他将于明年 2 月接替拉加德。德科斯此前在西班牙央行任行长，并在欧洲央行理事会担任理事。", "en": "Euro-area leaders chose Pablo Hernández de Cos, former governor of the Bank of Spain, as the next president of the European Central Bank. He will succeed Christine Lagarde in February and previously sat on the ECB's governing council as Spain's central bank governor.", "es": "Los líderes de la eurozona eligieron a Pablo Hernández de Cos, exgobernador del Banco de España, como próximo presidente del Banco Central Europeo. Sustituirá a Christine Lagarde en febrero y antes formó parte del consejo de gobierno del BCE como gobernador del banco central español.", "ja": "ユーロ圏の首脳は、スペイン銀行の前総裁パブロ・エルナンデス・デ・コス氏を欧州中央銀行（ECB）の次期総裁に選んだ。来年 2 月にラガルド氏の後を継ぐ。同氏はスペイン中銀総裁として ECB 理事会のメンバーも務めた。"}, "why": {"zh": "换帅的时间点很微妙：通胀已经回落，但增长乏力、各国赤字普遍超标，下一任行长要回答的是「降息能降到哪一步、财政纪律怎么守」。德科斯在西班牙央行任内以务实、数据导向著称，市场初步反应平淡，恰恰说明预期是「政策连续性大于转向」。", "en": "The timing is delicate: inflation has come down, but growth is weak and deficits broadly overshoot, so the next president must answer how far cuts can go and how fiscal discipline will be kept. De Cos built a reputation at the Bank of Spain for pragmatism and data, and the muted market reaction suggests the expectation is continuity rather than a turn.", "es": "El momento es delicado: la inflación ha bajado, pero el crecimiento es débil y los déficits superan en general los límites, así que el próximo presidente deberá responder hasta dónde pueden bajar los tipos y cómo se mantiene la disciplina fiscal. De Cos se labró en el Banco de España una reputación de pragmatismo y apego a los datos, y la reacción tibia del mercado sugiere que se espera continuidad más que un giro.", "ja": "交代のタイミングは微妙だ。インフレは鈍化したが成長は弱く、各国の財政赤字は概ね上限を超えている。次期総裁は「どこまで利下げできるか、財政規律をどう保つか」に答える必要がある。デ・コス氏はスペイン中銀で実務的・データ重視の姿勢で知られ、市場の反応が落ち着いていたのは「転換よりも連続性」が予想されている証拠だ。"}}]}, {"key": "spo", "num": "04", "color": "#15803d", "deep": "#105c2c", "name": {"zh": "体育竞技", "en": "Sport", "es": "Deportes", "ja": "スポーツ"}, "items": [{"idx": "01", "title": {"zh": "八冠王在巅峰告别：马奎斯宣布本赛季末退役", "en": "Eight-time champion bows out on top as Marquez announces retirement", "es": "El octacampeón se retira en la cima: Márquez anuncia su adiós", "ja": "八冠王が絶頂で引退へ マルケスが今季限りで現役引退を表明"}, "body": {"zh": "北京时间 11 月 27 日，MotoGP 收官战瓦伦西亚大奖赛第一次自由练习赛开始前，刚刚加冕 2026 赛季世界冠军的马克·马奎斯在杜卡迪车队车房宣布退役，本周末的瓦伦西亚大奖赛成为他职业生涯最后一场比赛。33 岁的西班牙车手五天前在葡萄牙波尔蒂芒站锁定第八座 MotoGP 组别世界冠军，也是生涯第十个世界冠军头衔；本赛季他一度在积分榜落后榜首 102 分，凭后半程强势逆转完成翻盘，这是 MotoGP 历史上最大的积分逆转。他与杜卡迪的合同原本签至 2028 年。马奎斯 2013 年登陆顶级组别，2013 至 2019 年七度登顶，职业生涯共 106 场大奖赛胜利。", "en": "Before the first free practice of the Valencia season finale on 27 November, Marc Marquez — barely days after sealing the 2026 title — announced in the Ducati garage that he would retire, making Valencia the last race of his career. The 33-year-old Spaniard clinched his eighth premier-class crown, and tenth world title overall, at Portimao five days earlier, having once trailed the standings by 102 points and completing the biggest comeback in MotoGP history. His Ducati contract had been due to run to 2028. Marquez arrived in the top class in 2013, won seven titles between 2013 and 2019, and took 106 Grand Prix victories across his career.", "es": "Antes de los primeros entrenamientos libres del Gran Premio de Valencia, el 27 de noviembre, Marc Márquez —apenas unos días después de proclamarse campeón de 2026— anunció en el garaje de Ducati que se retira, de modo que Valencia será la última carrera de su carrera deportiva. El español, de 33 años, logró su octavo título de la categoría reina y décimo mundial en Portimao cinco días antes, tras llegar a estar 102 puntos por detrás y firmar la mayor remontada de la historia de MotoGP. Su contrato con Ducati se extendía hasta 2028. Llegó a la categoría reina en 2013, ganó siete títulos entre 2013 y 2019 y suma 106 victorias en Grandes Premios.", "ja": "11 月 27 日、MotoGP 最終戦バレンシア GP の最初のフリー走行を前に、2026 年王者となったばかりのマルク・マルケスがドゥカティのガレージで引退を表明し、今週末のバレンシアが現役最後のレースとなった。33 歳のスペイン人は 5 日前のポルティマオで MotoGP クラス 8 度目、通算 10 度目の世界王者を確定。今季は一時ポイント首位と 102 点差をつけられながら後半に逆転し、MotoGP 史上最大の逆転優勝を果たした。ドゥカティとの契約は 2028 年までだった。2013 年に最高峰へ参戦し、2013〜2019 年に 7 度の戴冠、通算 106 勝を挙げている。"}, "why": {"zh": "退役声明只有几句话，但它解释了本赛季一个不寻常的细节：他在后半程摔得比前半程少得多。马奎斯自己说，肩部手术之后开始「感到恐惧」，印尼站和法国站又出现短暂的复视，所以他主动控制风险。一个用冒险定义风格的车手，最后靠「少冒险」拿下第八冠——这大概是这份告别最体面的写法。", "en": "The statement was only a few sentences, but it explains an odd detail of this season: he crashed far less in the second half than in the first. Marquez said he began to «feel the fear» after shoulder surgery, and brief spells of double vision in Indonesia and France made him manage risk deliberately. A rider whose style was defined by risk took his eighth title by taking fewer of them — a fitting way to write this farewell.", "es": "El comunicado fueron unas pocas frases, pero explica un detalle raro de esta temporada: se cayó mucho menos en la segunda mitad que en la primera. Márquez dijo que empezó a «sentir miedo» tras la operación de hombro, y episodios breves de visión doble en Indonesia y Francia le llevaron a gestionar el riesgo a propósito. Un piloto cuyo estilo se definía por el riesgo ganó su octavo título arriesgando menos: una manera digna de escribir esta despedida.", "ja": "声明はわずか数文だが、今季の奇妙な細部を説明している。後半は前半よりはるかに転倒が少なかったのだ。マルケス自身、肩の手術後に「恐怖を感じる」ようになり、インドネシアとフランスで一時的な複視も出たため、意識的にリスクを抑えたと語った。リスクでスタイルを定義してきたライダーが、リスクを減らして 8 度目の戴冠を手にした。これ以上ない別れの書き方だろう。"}}, {"idx": "02", "title": {"zh": "33 年首负沙特：男篮 80 比 82 多哈惜败，周琦被夺权", "en": "China loses to Saudi Arabia for first time in 33 years, 80-82", "es": "China pierde con Arabia Saudí por primera vez en 33 años (80-82)", "ja": "中国男子バスケ、33 年ぶりにサウジに敗れる 80 対 82"}, "body": {"zh": "北京时间 11 月 26 日晚，2027 年男篮世界杯亚洲区预选赛第五窗口期，中国男篮在中立场地卡塔尔多哈以 80 比 82 不敌沙特阿拉伯队，这是自 1993 年雅加达亚锦赛后 33 年来首次在正式比赛输给对手。中国队首节 29 比 25 领先，半场被反超为 43 比 48；第三节周琦进攻中挥肘击中对方面部，被判夺权犯规驱逐出场，离场前出战 11 分钟、6 投 5 中得 10 分。全场中国队三分 30 投 5 中，命中率 16.7%，却抢下 21 个前场篮板、二次进攻得到 30 分。此役过后中国队 5 胜 4 负，因对阵韩国 0 胜 2 负位列小组第四。主教练郭士强称球队「输掉了一场重要的比赛」，出线形势严峻；中国篮球之队表示将全力备战当地时间 11 月 29 日、北京时间 11 月 30 日凌晨客场对黎巴嫩的关键之战。", "en": "China lost 80-82 to Saudi Arabia in Doha on the evening of 26 November in the fifth window of Asian qualifiers for the 2027 World Cup — their first defeat by Saudi Arabia in an official game in 33 years, since the 1993 Asian Championship in Jakarta. China led 29-25 after the first quarter but trailed 43-48 at halftime. Early in the third, Zhou Qi was ejected for elbowing an opponent in the face; he had 10 points on 5-of-6 shooting in 11 minutes. China shot 5 of 30 from three (16.7%) yet grabbed 21 offensive rebounds and scored 30 second-chance points. The result leaves China at 5-4 and fourth in the group after an 0-2 record against South Korea. Coach Guo Shiqiang called it «a big game to lose» and admitted the qualifying path is now difficult; the team said it would prepare fully for the critical away game against Lebanon on 29 November local time, the early hours of 30 November in Beijing.", "es": "China perdió 80-82 ante Arabia Saudí en Doha la noche del 26 de noviembre, en la quinta ventana de las clasificatorias asiáticas para el Mundial de 2027: primera derrota ante ese rival en un partido oficial en 33 años, desde el Campeonato Asiático de Yakarta de 1993. China ganaba 29-25 al final del primer cuarto, pero al descanso perdía 43-48. Al inicio del tercero, Zhou Qi fue expulsado por codazo en la cara a un rival; llevaba 10 puntos con 5 de 6 en 11 minutos. China anotó 5 de 30 en triples (16,7%), pero capturó 21 rebotes ofensivos y sumó 30 puntos de segunda oportunidad. El resultado deja a China con 5-4 y cuarta del grupo tras un 0-2 ante Corea del Sur. El seleccionador Guo Shiqiang habló de «un partido importante perdido» y admitió que la clasificación se complica.", "ja": "11 月 26 日夜（北京時間）、2027 年ワールドカップ・アジア予選第 5 ウィンドウで、中国男子代表は中立地ドーハでサウジアラビアに 80 対 82 で敗れた。1993 年ジャカルタのアジア選手権以来 33 年ぶりに公式戦で敗れる。第 1 クオーターを 29 対 25 とリードしたが、ハーフタイムには 43 対 48 と逆転を許した。第 3 クオーター、周琦が相手の顔面への肘打ちで退場処分。退場まで 11 分間で 6 本中 5 本成功の 10 得点だった。3 ポイントは 30 本投じて 5 本成功（16.7％）ながら、オフェンスリバウンド 21 本、セカンドチャンス 30 点を記録。通算 5 勝 4 敗、韓国に 0 勝 2 敗でグループ 4 位となった。郭士強監督は「重要な試合を落とした」と語り、予選突破は厳しくなった。"}, "why": {"zh": "33 年不败的纪录断在世界排名第 64 位、本组实力最弱的对手手上。真正的分水岭不是周琦那次夺权，而是三分 30 投 5 中——内线拼出 21 个前场篮板、30 分二次进攻，却始终换不回投篮。当内线优势无法转化成外线空间，篮板越多只是把同一场败仗打得更久。下一场对黎巴嫩，赢不赢先看外线敢不敢投。", "en": "A 33-year unbeaten record ended against the lowest-ranked team in the group, 64th in the world. The real turning point was not Zhou Qi's ejection but 5-of-30 from three: 21 offensive rebounds and 30 second-chance points never converted into shooting. When an inside advantage cannot buy outside space, more rebounds only stretch the same defeat longer. Against Lebanon, the first question is whether the perimeter dares to shoot.", "es": "Un invicto de 33 años terminó ante el rival más débil del grupo, 64.º del ranking mundial. El punto de inflexión no fue la expulsión de Zhou Qi, sino el 5 de 30 en triples: 21 rebotes ofensivos y 30 puntos de segunda oportunidad nunca se convirtieron en tiro exterior. Cuando la ventaja interior no compra espacio exterior, más rebotes solo alargan la misma derrota. Ante Líbano, la primera pregunta es si el perímetro se atreve a tirar.", "ja": "33 年の不敗記録は、世界ランク 64 位でグループ最弱の相手に途切れた。分岐点は周琦の退場ではなく、3 ポイント 30 本中 5 本成功だ。オフェンスリバウンド 21 本、セカンドチャンス 30 点を稼いでも、シュートに結びつかない。インサイドの優位が外のスペースに変換できなければ、リバウンドが増えるほど同じ敗戦が長引くだけだ。レバノン戦は、外が打てるかどうかが先決になる。"}}, {"idx": "03", "title": {"zh": "国乒包揽世青赛混双 U15、U19 冠亚军，本届已夺五冠", "en": "China sweeps youth worlds mixed doubles in both U15 and U19", "es": "China domina el dobles mixto juvenil en U15 y U19", "ja": "卓球世界ユース、中国が混合ダブルス U15・U19 の 1・2 位を独占"}, "body": {"zh": "2026 年世界青少年乒乓球锦标赛混双决赛结束，刘子航/祝启慧夺得 U15 组冠军，温瑞博/姜依依夺得 U19 组冠军，国乒包揽两个项目的金银牌。本届世青赛国乒已收获 5 项冠军，单打项目 8 人全部进入八强。", "en": "China swept the mixed doubles at the 2026 World Youth Table Tennis Championships: Liu Zihang and Zhu Qihui won the U15 title and Wen Ruibo and Jiang Yiyi the U19 title, giving China gold and silver in both events. The team now has five titles at this edition, with all eight singles players through to the quarter-finals.", "es": "China dominó el dobles mixto del Mundial Juvenil de Tenis de Mesa 2026: Liu Zihang y Zhu Qihui ganaron el título U15, y Wen Ruibo y Jiang Yiyi el U19, con oro y plata para China en ambas categorías. El equipo suma ya cinco títulos en esta edición, con los ocho jugadores de individuales en cuartos de final.", "ja": "2026 年世界ユース卓球選手権の混合ダブルス決勝が終了し、劉子航／祝啓慧組が U15、温瑞博／姜依依組が U19 で優勝。中国が両種目で金銀を独占した。今大会の中国はすでに 5 種目で優勝し、シングルスは 8 人全員がベスト 8 に進んでいる。"}, "why": {"zh": "包揽金银听上去是常规操作，但混双是奥运项目，青年层面的配对质量直接决定一个周期之后的双打储备。两个组别同时会师决赛，说明配对不是临时拼凑，而是有成体系的训练与轮换；单打 8 人全部进八强，则说明厚度不只集中在个别尖子。", "en": "Sweeping gold and silver sounds routine, but mixed doubles is an Olympic event, and the quality of youth pairings determines the doubles pool a cycle later. Both categories reaching an all-China final suggests the pairings are built through systematic training and rotation rather than improvised; all eight singles players in the last eight suggests depth beyond a few stars.", "es": "Firmar oro y plata suena rutinario, pero el dobles mixto es disciplina olímpica y la calidad de las parejas juveniles determina la reserva de dobles un ciclo después. Que ambas categorías lleguen a una final totalmente china indica que las parejas se construyen con entrenamiento y rotación sistemáticos, no sobre la marcha; los ocho individualistas en cuartos indican profundidad más allá de unas figuras.", "ja": "金銀独占は日常的に聞こえるが、混合ダブルスは五輪種目であり、ユース世代のペアの質が一周期後のダブルス戦力を決める。両カテゴリーで中国勢が決勝に揃ったのは、ペアが場当たりではなく体系的な練習とローテーションで作られている証拠だ。シングルス 8 人全員のベスト 8 は、厚みが一部のエースに偏っていないことを示す。"}}, {"idx": "04", "title": {"zh": "英锦赛正赛开打：中国九人出战，首轮两场德比", "en": "UK Championship begins with nine Chinese players and two derbies", "es": "El Campeonato del Reino Unido arranca con nueve chinos y dos derbis", "ja": "UK 選手権開幕、中国 9 人が出場し初戦に 2 つの中国人対決"}, "body": {"zh": "2026 年斯诺克英锦赛正赛 11 月 28 日在英国约克开打，首轮 32 进 16 采用 11 局 6 胜制。中国军团共 9 人跻身正赛：赵心童、吴宜泽、肖国栋、常冰玉以种子身份直通，丁俊晖、袁思俊、周跃龙、张安达、范争一从资格赛突围。首轮将出现两场中国德比：肖国栋对张安达，常冰玉对周跃龙。丁俊晖 11 月 30 日对阿里·卡特，吴宜泽对霍尔特，赵心童 12 月 1 日对埃莫里，袁思俊挑战马克·艾伦。丁俊晖已连续 22 年出战英锦赛正赛，曾于 2005 年、2009 年、2019 年三度夺冠。", "en": "The 2026 UK Championship starts in York on 28 November, with the first round (32 to 16) played over best-of-11 frames. Nine Chinese players are in the draw: Zhao Xintong, Wu Yize, Xiao Guodong and Chang Bingyu as seeds, and Ding Junhui, Yuan Sijun, Zhou Yuelong, Zhang Anda and Fan Zhengyi from qualifying. The first round brings two all-Chinese ties: Xiao Guodong against Zhang Anda, and Chang Bingyu against Zhou Yuelong. Ding faces Ali Carter on 30 November, Wu Yize meets Michael Holt, Zhao Xintong plays Dylan Emery on 1 December and Yuan Sijun takes on Mark Allen. Ding has now appeared in the main draw 22 years in a row, having won the title in 2005, 2009 and 2019.", "es": "El Campeonato del Reino Unido 2026 comienza el 28 de noviembre en York, con la primera ronda (de 32 a 16) al mejor de 11 frames. Hay nueve chinos en el cuadro: Zhao Xintong, Wu Yize, Xiao Guodong y Chang Bingyu como cabezas de serie, y Ding Junhui, Yuan Sijun, Zhou Yuelong, Zhang Anda y Fan Zhengyi desde la fase previa. La primera ronda trae dos duelos totalmente chinos: Xiao Guodong-Zhang Anda y Chang Bingyu-Zhou Yuelong. Ding se enfrenta a Ali Carter el 30 de noviembre, Wu Yize a Michael Holt, Zhao Xintong a Dylan Emery el 1 de diciembre y Yuan Sijun a Mark Allen. Ding suma 22 años consecutivos en el cuadro principal, con títulos en 2005, 2009 y 2019.", "ja": "2026 年スヌーカー UK 選手権が 11 月 28 日、ヨークで開幕する。初戦の 32 強は 11 フレーム先取。中国勢は 9 人が出場し、趙心童、呉宜沢、肖国棟、常氷玉がシード、丁俊暉、袁思俊、周躍龍、張安達、范争一が予選通過。初戦では肖国棟対張安達、常氷玉対周躍龍という中国勢同士の 2 試合が組まれた。丁俊暉は 11 月 30 日にアリ・カーターと、呉宜沢はホルトと、趙心童は 12 月 1 日にエメリーと、袁思俊はマーク・アレンと対戦する。丁俊暉は 22 年連続で本戦に出場し、2005 年、2009 年、2019 年に優勝している。"}, "why": {"zh": "9 人进正赛说明厚度，但两场德比意味着正赛刚开始就要自己淘汰两个人——签表的厚度与晋级的深度，从来不是同一件事。丁俊晖连续 22 年站在约克，这次是从资格赛一关一关打回来的；首轮对手卡特擅长的，恰恰是把节奏拖慢。", "en": "Nine players in the main draw shows depth, but two derbies mean China eliminates two of its own before the tournament has barely started: a thick draw and a deep run are never the same thing. Ding has stood in York 22 years running, this time after grinding through qualifying; his first-round opponent Carter specialises in slowing the game down.", "es": "Nueve jugadores en el cuadro principal demuestra profundidad, pero dos derbis significan que China elimina a dos de los suyos casi antes de empezar: un cuadro amplio y una gran actuación nunca son lo mismo. Ding lleva 22 años seguidos en York, esta vez tras pelear la fase previa; su rival Carter se especializa precisamente en ralentizar el juego.", "ja": "本戦に 9 人というのは厚みの証明だが、2 つの中国人対決は開幕早々に自ら 2 人を落とすことを意味する。層の厚いドローと勝ち上がりの深さは決して同じものではない。丁俊暉は 22 年連続でヨークに立つが、今回は予選を一戦ずつ勝ち上がってきた。初戦の相手カーターは、まさに試合のテンポを落とすのが得意な選手だ。"}}, {"idx": "05", "title": {"zh": "女排欧冠：科内先赢两局被逆转，朱婷 16 分遭遇赛季首败", "en": "Champions League: Conegliano blow two-set lead as Zhu Ting scores 16", "es": "Champions: Conegliano pierde tras ir 2-0 y Zhu Ting anota 16 puntos", "ja": "女子バレー欧州 CL、コネリアーノが 2 セット先行から逆転負け 朱婷は 16 得点"}, "body": {"zh": "11 月 27 日凌晨，2026 至 2027 赛季女排欧冠小组赛 B 组首轮，朱婷、姚迪效力的科内利亚诺主场先赢两局后被诺瓦拉连扳三局，以 2 比 3 遭逆转，五局比分为 25 比 18、25 比 20、18 比 25、21 比 25、13 比 15，遭遇赛季首败。朱婷 44 扣 16 中拿到 16 分，并承担全队最多的 30 个一传；哈克 57 扣 29 中得 34 分，加比 11 分。诺瓦拉接应托洛克 69 扣 36 中独得 39 分，获评全场最佳。", "en": "In the early hours of 27 November, Conegliano — with Zhu Ting and Yao Di — lost 2-3 at home to Novara in their opening Group B match of the 2026-27 women's Champions League, squandering a two-set lead. The sets went 25-18, 25-20, 18-25, 21-25, 13-15, handing them their first defeat of the season. Zhu Ting scored 16 points on 44 swings and took the team's heaviest passing load with 30 receptions; Isabelle Haak had 34 points on 57 attempts and Gabi 11. Novara's opposite Tolok top-scored with 39 points on 69 attempts and was named MVP.", "es": "En la madrugada del 27 de noviembre, el Conegliano de Zhu Ting y Yao Di perdió 2-3 en casa ante el Novara en la primera jornada del grupo B de la Champions femenina 2026-27, tras ir 2-0. Los parciales fueron 25-18, 25-20, 18-25, 21-25 y 13-15, primera derrota de la temporada. Zhu Ting sumó 16 puntos con 44 remates y asumió la mayor carga de recepción del equipo con 30 balones; Haak hizo 34 puntos con 57 remates y Gabi 11. La opuesta del Novara, Tolok, firmó 39 puntos con 69 remates y fue elegida MVP.", "ja": "11 月 27 日未明、2026〜27 シーズン女子バレー欧州チャンピオンズリーグ B 組初戦で、朱婷と姚迪のコネリアーノは 2 セット先行しながらノヴァーラに 2 対 3 で逆転負けした。セットカウントは 25-18、25-20、18-25、21-25、13-15 で今季初黒星。朱婷は 44 本のスパイクで 16 得点、チーム最多のレセプション 30 本を担った。ハークは 57 本で 34 得点、ガビは 11 得点。ノヴァーラのオポジット、トロクは 69 本で 39 得点を挙げ MVP に選ばれた。"}, "why": {"zh": "数据里最容易被忽略的是「30 个一传」：朱婷 36% 的进攻成功率低于她自己的常态，但她接了全队最多的一传，起跳质量必然被消耗。科内前两局一局未失，第三局一传被冲乱后整条进攻线跟着塌——这不是某个人状态不好，而是一套依赖主攻接发的体系在被针对时的脆弱处。", "en": "The easiest number to miss is the 30 receptions: Zhu Ting's 36% attack efficiency is below her norm, but she carried the team's heaviest passing load, which inevitably drains the quality of her jumps. Conegliano had not dropped a set before this match; once their passing broke in the third set, the whole attack collapsed. That is not one player off form but the fragility of a system that depends on its outside hitters to pass.", "es": "El dato que más se escapa son las 30 recepciones: el 36% de eficacia de Zhu Ting está por debajo de su norma, pero asumió la mayor carga de recepción del equipo, lo que desgasta la calidad del salto. El Conegliano no había cedido un set; cuando la recepción se rompió en el tercero, toda la línea de ataque se hundió. No es una jugadora fuera de forma, sino la fragilidad de un sistema que depende de que sus atacantes recepcionen.", "ja": "最も見落とされやすい数字はレセプション 30 本だ。朱婷のアタック決定率 36％は本人の標準より低いが、チーム最多のレセプションを引き受け、ジャンプの質が削られている。コネリアーノはそれまで 1 セットも落としていなかったが、第 3 セットでレセプションが崩れると攻撃全体が崩れた。個人の不調ではなく、アウトサイドヒッターのレセプションに依存する体系の脆さである。"}}]}, {"key": "hot", "num": "05", "color": "#6d28d9", "deep": "#551dab", "name": {"zh": "网络热点", "en": "Trending", "es": "Tendencias", "ja": "ネット話題"}, "items": [{"idx": "01", "title": {"zh": "一元一册的「纸质短剧」风靡小学，多平台已下架", "en": "One-yuan «paper short dramas» sweep primary schools; platforms pull listings", "es": "Los «cortos en papel» de un yuan arrasan en primarias y las plataformas los retiran", "ja": "1 冊 1 元の「紙のショートドラマ」が小学生に普及、各サイトが販売停止"}, "body": {"zh": "11 月中下旬以来，一种名为「纸质短剧」的折页小册子在多地小学生中流行：把竖屏短剧的画面截图配上台词，按剧情顺序印成风琴式折页，折起巴掌大小、展开可达半米，零售价一元一册，题材多为「重生」「逆袭」「霸总」。11 月 27 日记者调查发现，产品做工粗糙、气味偏大，贴着玩具标签却实质是连续剧情图文读物，包装标注的生产主体查无踪迹，也没有 ISBN 书号；广州经开区文旅部门表示，收到线索后将核实取证，结合样品鉴定依法处置。截至发稿，多个电商平台已搜不到相关商品链接。律师指出，此类产品涉嫌侵权，且属无书号、无编审的非法出版物。", "en": "Since mid-to-late November a folded booklet called a «paper short drama» has spread among primary school pupils in several cities: screenshots from vertical short dramas with dialogue printed in story order on a concertina fold, palm-sized closed and up to half a metre open, sold at one yuan a copy, mostly on «rebirth», «comeback» and «billionaire boss» themes. Reporting on 27 November found the products poorly made and strongly smelling of ink, labelled as toys but in substance continuous illustrated fiction; the manufacturer named on the packaging could not be traced and there is no ISBN. The culture and tourism authority of Guangzhou's development zone said it would verify and take samples before acting. As of publication, listings had disappeared from several e-commerce platforms. Lawyers say such products infringe copyright and are illegal publications without an ISBN or editorial review.", "es": "Desde mediados y finales de noviembre un cuadernillo plegado llamado «corto en papel» se ha extendido entre alumnos de primaria de varias ciudades: capturas de series verticales con diálogos impresos en orden narrativo en un pliego acordeón, del tamaño de una palma cerrado y hasta medio
