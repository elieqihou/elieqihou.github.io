香港公开赛上由王祉怡、冯彦哲/黄东萍拿下女单与混双冠军。", "en": "The Chinese Badminton Association said it has appointed Tian Bingyi as head coach of the national team. As a player, Tian partnered Li Yongbo and was the face of Chinese men's doubles in the 1980s and 1990s, winning a world championship title; after retiring he worked for years in coaching and sports administration. The appointment comes as the Los Angeles Olympic cycle begins, with China winning women's singles and mixed doubles at the Hong Kong Open in November through Wang Zhiyi and Feng Yanzhe/Huang Dongping.", "es": "La Asociación China de Bádminton anunció el nombramiento de Tian Bingyi como seleccionador nacional. Como jugador formó pareja con Li Yongbo y fue referente del doble masculino chino en los años ochenta y noventa, con un título mundial; tras retirarse trabajó durante años como entrenador y gestor deportivo. El nombramiento llega al inicio del ciclo olímpico de Los Ángeles, con China ganando individual y dobles mixto en el Abierto de Hong Kong de noviembre gracias a Wang Zhiyi y Feng Yanzhe/Huang Dongping.", "ja": "中国バドミントン協会は、田秉毅氏をナショナルチームの監督に招聘すると発表した。選手時代は李永波氏とペアを組み、1980～90 年代の中国男子ダブルスの代表的存在で、世界選手権優勝経験を持つ。引退後は長く指導者とスポーツ行政に携わった。就任はロサンゼルス五輪周期の立ち上がりに重なり、11 月の香港オープンでは王祉怡が女子シングルス、馮彦哲／黄東萍が混合ダブルスを制している。"}, "why": {"zh": "国羽换帅不是新闻，换在奥运周期起点才是。上一个周期男单、男双的断层一直没补上，新教练组最先要回答的问题是：青训上来的人，能不能在三年内顶上。", "en": "A coaching change is not news; a coaching change at the start of an Olympic cycle is. The last cycle never closed the gap in men's singles and men's doubles, and the first question for the new staff is whether the players coming through the junior ranks can fill those spots within three years.", "es": "Un cambio de seleccionador no es noticia; hacerlo al inicio de un ciclo olímpico sí. El ciclo anterior nunca cerró la brecha en individual y dobles masculinos, y la primera pregunta para el nuevo equipo es si los jugadores que suben de las categorías inferiores podrán cubrir esos puestos en tres años.", "ja": "監督交代はニュースではないが、五輪周期の起点での交代はニュースだ。前周期は男子シングルスと男子ダブルスの断層を埋められなかった。新しい体制がまず答えるべきは、育成上がりの選手が 3 年以内にその穴を埋められるかである。"}}, {"idx": "05", "title": {"zh": "国际足联确认：2031 年女足世界杯由美墨哥牙四国联办并首次扩军至 48 队", "en": "FIFA confirms 2031 Women's World Cup in US, Mexico, Costa Rica and Jamaica, expanded to 48 teams", "es": "La FIFA confirma el Mundial femenino de 2031 en EE. UU., México, Costa Rica y Jamaica, con 48 selecciones", "ja": "FIFA が 2031 年女子ワールドカップを米国・メキシコ・コスタリカ・ジャマイカ共催、48 チームに拡大"}, "body": {"zh": "国际足联正式确认 2031 年和 2035 年女足世界杯举办方：2031 年由美国、墨西哥、哥斯达黎加和牙买加联合举办，参赛队首次扩军至 48 支；2035 年由英国举办，比赛在英格兰、北爱尔兰、苏格兰、威尔士举行，规模为 32 支。2031 年这届将是女足世界杯首次跨四个国家举办，也是继 2023 年澳大利亚、新西兰之后第二次由多国联办。", "en": "FIFA confirmed the hosts of the 2031 and 2035 Women's World Cups: 2031 will be co-hosted by the United States, Mexico, Costa Rica and Jamaica with the field expanded to 48 teams for the first time; 2035 goes to the United Kingdom, with matches in England, Northern Ireland, Scotland and Wales and a 32-team field. The 2031 edition will be the first Women's World Cup staged across four countries and the second co-hosted tournament after Australia and New Zealand in 2023.", "es": "La FIFA confirmó las sedes de los Mundiales femeninos de 2031 y 2035: el de 2031 lo organizarán Estados Unidos, México, Costa Rica y Jamaica, con 48 selecciones por primera vez; el de 2035 será en el Reino Unido, con partidos en Inglaterra, Irlanda del Norte, Escocia y Gales y 32 equipos. El de 2031 será el primer Mundial femenino repartido entre cuatro países y el segundo organizado conjuntamente tras Australia y Nueva Zelanda en 2023.", "ja": "FIFA は 2031 年と 2035 年の女子ワールドカップ開催地を正式に決定した。2031 年は米国、メキシコ、コスタリカ、ジャマイカの共催で、出場枠は初めて 48 チームに拡大。2035 年は英国で、イングランド、北アイルランド、スコットランド、ウェールズで 32 チームにより行われる。2031 年大会は女子ワールドカップ初の 4 か国共催であり、2023 年の豪州・ニュージーランド以来 2 度目の共同開催となる。"}, "why": {"zh": "48 队意味着小组赛从 8 组变 12 组、总场次从 64 场涨到 104 场——转播时长和商业收入一起放大，这是国际足联这些年所有扩军决定的同一套算法。对女足，机会在于更多国家能进正赛；风险在于强弱悬殊的比分也会更多。", "en": "Forty-eight teams means 12 groups instead of eight and 104 matches instead of 64 — broadcast hours and commercial revenue scale together, the same arithmetic behind every FIFA expansion. For the women's game the opportunity is more countries reaching the finals; the risk is more lopsided scorelines.", "es": "48 selecciones significan 12 grupos en vez de ocho y 104 partidos en lugar de 64: horas de emisión e ingresos comerciales crecen juntos, la misma aritmética de todas las ampliaciones de la FIFA. Para el fútbol femenino la oportunidad es que más países lleguen al torneo; el riesgo es más resultados desparejos.", "ja": "48 チームは 8 組ではなく 12 組、試合数は 64 から 104 へ増える。放送時間と商業収入が同時に膨らむという、FIFA の拡大策に共通する計算式だ。女子サッカーにとっては、より多くの国が本大会に届く機会である一方、大差の試合も増えるというリスクがある。"}}]}, {"key": "hot", "num": "05", "color": "#6d28d9", "deep": "#54209f", "name": {"zh": "网络热点", "en": "Trending", "es": "Tendencias", "ja": "ネット"}, "items": [{"idx": "01", "title": {"zh": "年赚一亿的胖东来老店 12 月闭店，羽绒服价签直接印上进货价", "en": "A Donglai store earning 100m yuan a year to close in December, with cost prices printed on the tags", "es": "Cierra en diciembre un local de Pang Dong Lai que gana 100 millones al año, con el precio de coste en la etiqueta", "ja": "年 1 億元を稼ぐ胖東来の老舗が 12 月閉店、ダウンに仕入れ値を印字"}, "body": {"zh": "河南许昌胖东来生活广场店将于 2026 年 12 月租约到期后闭店，原因是门店硬件老旧、部分租户租金大幅上涨。这家店 2002 年 1 月开业，陪伴许昌市民 24 年，前 8 个月销售额 13.25 亿元，年利润曾超 1 亿元。闭店前的工作日，羽绒服区依旧人挤人；一款坦博尔合作款轻薄羽绒服价签上写着售价 529 元、进货价 476.6 元，绒子含量 90%、充绒量 135 克，毛利率约 9.9%，吊牌还注明进货价含 2% 以内采购费用、不含人事房租等运营费用。胖东来自营羽绒服长期明码标注进货价、售价与毛利率，多数款毛利率在 23% 至 28% 之间。创始人于东来表示，不愿意在不合理的合作条件下妥协，到期后不再续约。", "en": "The Pang Dong Lai Life Plaza store in Xuchang, Henan, will close when its lease expires in December 2026, citing ageing facilities and sharp rent increases demanded by some tenants. Opened in January 2002, it has served the city for 24 years, posting 1.325 billion yuan in sales in the first eight months of this year and more than 100 million yuan of annual profit at its peak. On a weekday before closing it was still packed; a light down jacket made with Tambor carried a tag reading 529 yuan retail and 476.6 yuan cost, 90% down content and 135g fill, a gross margin of about 9.9%, with a note that the cost includes procurement fees of up to 2% but excludes staff, rent and utilities. The chain routinely prints cost, price and margin on its own-brand down jackets, mostly 23% to 28%. Founder Yu Donglai said he would not bow to unreasonable terms and would not renew.", "es": "El local de Pang Dong Lai en la plaza Life de Xuchang (Henan) cerrará al vencer el contrato en diciembre de 2026 por instalaciones anticuadas y fuertes subidas de alquiler exigidas por algunos inquilinos. Abierto en enero de 2002, lleva 24 años sirviendo a la ciudad, con 1.325 millones de yuanes de ventas en los primeros ocho meses y más de 100 millones de beneficio anual en su mejor momento. Un día laborable antes del cierre seguía lleno; una chaqueta de pluma ligera de Tambor lucía una etiqueta con 529 yuanes de venta y 476,6 de coste, 90 % de plumón y 135 g de relleno, un margen bruto del 9,9 %, con la nota de que el coste incluye hasta un 2 % de gastos de compra pero no personal, alquiler ni suministros. La cadena imprime habitualmente coste, precio y margen en sus chaquetas, en su mayoría entre el 23 % y el 28 %. El fundador, Yu Donglai, dijo que no cedería ante condiciones injustas y no renovaría.", "ja": "河南省許昌市の胖東来「生活広場」店が、2026 年 12 月の賃貸契約満了で閉店する。設備の老朽化と、一部テナントの賃料の大幅な値上げが理由だ。2002 年 1 月開業で 24 年間市民に親しまれ、今年最初の 8 か月で売上 13 億 2500 万元、年間利益は一時 1 億元を超えた。閉店前の平日もダウン売り場は混雑し、タンボール社との共同開発の薄手ダウンには販売価格 529 元、仕入れ値 476.6 元、ダウン含有率 90 %、充填量 135 グラム、粗利率約 9.9 % と記され、仕入れ値には 2 % 以内の調達費を含むが人件費・家賃・光熱費は含まないと注記されていた。自社ブランドのダウンは仕入れ値・販売価格・粗利率を常時明記し、多くは 23～28 % の範囲にある。創業者の于東来氏は、不合理な条件に屈せず更新しないと述べた。"}, "why": {"zh": "一家年赚一亿的店，输给的不是对手，是租金——这说明零售的利润再厚，也厚不过商业地产的刚性成本。而把进货价印上价签，本质是主动放弃信息优势去换信任；这套做法能救一家店的复购，救不了整个行业的成本结构。", "en": "A store earning 100 million yuan a year lost not to a competitor but to rent -- proof that retail margins, however fat, are thinner than the fixed cost of commercial property. Printing the cost price is a deliberate trade of information advantage for trust; that can lift one store's repeat business, but it cannot fix an industry's cost structure.", "es": "Un local que gana 100 millones al año no perdió frente a un competidor sino frente al alquiler: prueba de que el margen minorista, por grueso que sea, es más fino que el coste fijo del ladrillo comercial. Imprimir el precio de coste es cambiar a propósito ventaja informativa por confianza; eso puede elevar la recompra de un local, pero no arregla la estructura de costes de un sector.", "ja": "年 1 億元を稼ぐ店を負かしたのは競合ではなく家賃だった。小売りの利益がどれほど厚くても、商業不動産の固定費には及ばないという証明だ。仕入れ値を印字するのは、情報優位を自ら手放して信頼を買う行為である。それは 1 店舗のリピートを支えても、業界のコスト構造は変えられない。"}}, {"idx": "02", "title": {"zh": "旺仔牛奶“更不好卖了”：上半财年收益录得低双位数跌幅", "en": "Wangzai milk gets harder to sell as revenue falls by a low-double-digit percentage", "es": "La leche Wangzai se vende peor: ingresos con caída de dos dígitos bajos", "ja": "旺仔牛奶がさらに売れにくく、上半期収益は 10 % 台前半の減収"}, "body": {"zh": "“旺仔牛奶更不好卖了”11 月 24 日登上微博热搜。中国旺旺 2026 财年上半年业绩显示，整体收益录得低双位数跌幅，其中传统批发渠道退化与产品老化是主要原因；零食量贩等新兴渠道收益虽有增长，但体量尚不足以对冲传统渠道的下滑。市场分析普遍提到两点：一是高糖标签与健康化消费趋势的冲突，二是节庆送礼场景收缩后，这类经典单品缺少新的消费理由。", "en": "Wangzai milk is even harder to sell trended on Weibo on 24 November. Want Want China's results for the first half of its 2026 fiscal year showed group revenue down by a low-double-digit percentage, blamed mainly on the retreat of traditional wholesale channels and product ageing; newer channels such as snack discount chains grew but are not yet big enough to offset the decline. Analysts point to two issues: the clash between a high-sugar label and health-conscious consumption, and the loss of a reason to buy once the festive gifting occasion shrank.", "es": "La leche Wangzai se vende aún peor fue tendencia en Weibo el 24 de noviembre. Los resultados del primer semestre del ejercicio 2026 de Want Want China mostraron una caída de dos dígitos bajos en los ingresos del grupo, atribuida sobre todo al retroceso del canal mayorista tradicional y al envejecimiento del producto; los canales nuevos, como las cadenas de descuento de aperitivos, crecen pero aún no compensan. Los analistas señalan dos problemas: el choque entre la etiqueta de alto contenido en azúcar y el consumo saludable, y la pérdida de motivos de compra cuando se encoge la ocasión de regalo festivo.", "ja": "旺仔牛奶がさらに売れにくくなったが 11 月 24 日に Weibo の熱搜に入った。中国旺旺の 2026 年度上半期決算は、伝統的な卸売チャネルの縮小と商品の陳腐化を主因に、全体の収益が 10 % 台前半の減収となった。スナック量販など新チャネルは伸びているが、伝統チャネルの落ち込みを埋める規模には達していない。市場では、高糖分という印象と健康志向の衝突、祝祭ギフト需要の縮小で定番商品の購買理由が失われた点が指摘されている。"}, "why": {"zh": "一个卖了三十年的单品，输给的往往不是竞品，而是“喝它的那个场景消失了”。送礼少了、家长对糖更敏感了，产品本身没坏，生意却变窄了——这是所有老品牌的共同难题。", "en": "A product sold for thirty years usually loses not to a rival but to the disappearance of the occasion for drinking it. Fewer gift boxes and more sugar-conscious parents leave the product intact while the business narrows: the common predicament of legacy brands.", "es": "Un producto vendido durante treinta años suele perder no frente a un rival, sino frente a la desaparición de la ocasión de consumirlo. Menos cajas de regalo y padres más atentos al azúcar dejan el producto intacto y el negocio más estrecho: el dilema común de las marcas veteranas.", "ja": "30 年売れてきた商品を負かすのは競合ではなく、それを飲む場面が消えることであることが多い。ギフトが減り、親が糖分に敏感になれば、商品は壊れていないのに商売が狭くなる。老舗ブランド共通の難題だ。"}}, {"idx": "03", "title": {"zh": "女子被“情绪疗愈”机构封闭管理 6 年，确诊重度抑郁", "en": "Woman kept inside an emotional healing centre for six years, then diagnosed with severe depression", "es": "Seis años en un centro de sanación emocional y un diagnóstico de depresión grave", "ja": "感情ヒーリング施設に 6 年間囲われ、重度のうつと診断"}, "body": {"zh": "11 月 24 日，“女子被情绪疗愈洗脑 6 年成重度抑郁”登上微博热搜。报道称，当事人被一家以“心理疗愈”为名的机构长期封闭管理，机构不允许家人探视，以“能量”“频率”等说法作出承诺，其间她与外界几乎断联，最终被诊断为重度抑郁。此类机构跨界心理、教育、养生多个领域，服务多在私域完成，效果难以量化，资质审核与过程监督存在明显空白。同期另一条热搜显示，一名女子被以投资为名骗走 1400 万元、囤积 300 余件“低价水晶”。", "en": "The case of a woman said to have spent six years inside an emotional healing institution and then been diagnosed with severe depression trended on Weibo on 24 November. Reports say she was kept under closed management by a centre trading as psychological healing, with family visits barred and promises framed in terms of energy and frequency; she lost contact with the outside world and was eventually diagnosed with severe depression. Such outfits straddle psychology, education and wellness, deliver services in private channels, resist measurement, and sit in a clear gap in licensing and oversight. A separate trending case involved a woman allegedly defrauded of 14 million yuan into hoarding more than 300 pieces of cheap crystal under the guise of investment.", "es": "El caso de una mujer que habría pasado seis años en un centro de sanación emocional y fue diagnosticada de depresión grave fue tendencia en Weibo el 24 de noviembre. Según los reportes, el centro la mantuvo bajo gestión cerrada, prohibió las visitas familiares y formuló promesas en términos de energía y frecuencia; perdió el contacto con el exterior y acabó con diagnóstico de depresión grave. Estas entidades cruzan psicología, educación y bienestar, operan en canales privados, dificultan medir resultados y caen en un vacío claro de habilitación y supervisión. Otro caso: una mujer presuntamente estafada con 14 millones de yuanes para acumular más de 300 piezas de cristal barato bajo apariencia de inversión.", "ja": "感情ヒーリング施設に 6 年間洗脳され重度のうつになったという話題が 11 月 24 日に Weibo の熱搜に入った。報道によれば、女性は心理ヒーリングを名乗る施設で長期にわたり閉鎖的管理下に置かれ、家族の面会を拒否され、エネルギーや周波数などの言葉で約束され、外部とほぼ遮断された末に重度のうつと診断された。こうした施設は心理、教育、健康の分野にまたがり、私的な場でサービスを提供するため効果の測定が難しく、資格審査と過程の監督に明確な空白がある。同日、投資を装って 1400 万元を騙し取られ、格安クリスタル 300 点余りを買わされた女性の話題も上がった。"}, "why": {"zh": "最该被追问的不是当事人“为什么信”，而是这类机构凭什么能以“疗愈”之名长期封闭管理、拒绝探视。当一个行业把服务搬进私域、把效果交给感受，监管的抓手就只剩下事后追责——而事后往往已经太晚。", "en": "The question worth asking is not why the woman believed it, but how such a centre could keep someone under closed management and bar visitors in the name of healing for years. When an industry moves its services into private channels and outsources efficacy to feelings, regulation is left with after-the-fact accountability, which is often too late.", "es": "La pregunta no es por qué ella creyó, sino cómo un centro pudo mantener a una persona bajo gestión cerrada y sin visitas en nombre de la sanación durante años. Cuando un sector traslada el servicio a canales privados y confía la eficacia a las sensaciones, a la regulación solo le queda exigir cuentas a posteriori, que suele llegar tarde.", "ja": "問うべきは、本人がなぜ信じたかではなく、なぜ施設が癒しの名で長期の閉鎖管理と面会拒否を続けられたかだ。業界がサービスを私的な場に移し、効果を体感に委ねれば、規制に残るのは事後追及だけになる。それでは遅すぎることが多い。"}}, {"idx": "04", "title": {"zh": "主播直播展示五指袜被判“猎奇”，平台风控乌龙冲上文娱榜", "en": "Streamer's sock demo flagged as bizarre content as a platform filter misfires", "es": "Un creador muestra calcetines de cinco dedos y el filtro lo marca como contenido extraño", "ja": "配信者が 5 本指ソックスを紹介したら特異行為と判定、誤検知が話題に"}, "body": {"zh": "11 月 25 日凌晨，“白小纯涉及猎奇行为”冲上微博文娱榜前六，热度约 9.8 万。点进去才发现是一场乌龙：这名主播在直播中拿出一双五指袜分享，平台风控系统把这段画面判定为“猎奇行为”并弹出提示。五指袜是分趾设计的运动袜，主打吸汗透气、减少脚趾摩擦，近年在跑步与户外人群中流行。业内人士解释，直播风控多为 AI 先行审核，脚部特写加上五指分开的造型容易被算法判为异常画面，此类误判在行业内并不少见；平台是否人工复核、判定是否撤销，目前没有公开说法。", "en": "In the early hours of 25 November, the tag Bai Xiaochun involved in bizarre behaviour climbed into the top six of Weibo's entertainment chart with about 98,000 points of heat. Clicking through revealed a mix-up: the streamer had held up a pair of five-toe socks, and the platform's risk-control system flagged the footage as bizarre content. Five-toe socks, split-toe sports socks marketed for breathability and reduced friction, have become popular among runners and hikers. Industry figures say live-stream moderation is largely AI-first, and a close-up of feet with five separated toes can read as an anomaly; such false positives are common. Whether the platform reviewed it manually or withdrew the flag is not publicly known.", "es": "En la madrugada del 25 de noviembre, la etiqueta Bai Xiaochun incurre en conducta extraña escaló al top seis del ranking de entretenimiento de Weibo con unos 98.000 puntos. Al entrar se veía un malentendido: el creador mostró unos calcetines de cinco dedos y el sistema de control de riesgos marcó el fragmento como contenido extraño. Los calcetines de dedos separados, vendidos para transpirar mejor y reducir roces, se han popularizado entre corredores y excursionistas. Fuentes del sector explican que la moderación es sobre todo por IA y que un primer plano de pies con cinco dedos separados puede leerse como anomalía; los falsos positivos son frecuentes. No se sabe si hubo revisión manual ni retirada de la marca.", "ja": "11 月 25 日未明、白小純が特異行為に関与というタグが Weibo のエンタメ榜 6 位以内に入り、熱度は約 9 万 8000。開いてみると誤検知だった。配信者が 5 本指ソックスを紹介したところ、プラットフォームの風控システムがその映像を特異行為と判定したのだ。5 本指ソックスは指が分かれたスポーツ用で、蒸れにくく摩擦を減らすとしてランナーや登山者に広がっている。業界関係者によれば、配信の監視はまず AI が行い、足のアップと 5 本に分かれた形が異常映像と判定されやすい。こうした誤検知は珍しくない。人による再審査や判定取り消しの有無は公表されていない。"}, "why": {"zh": "一条袜子热搜看着好笑，背后是同一件事：平台的风控逻辑是“宁可错杀”，成本由内容创作者承担。误判可以当段子传，但当真金白银的收益被一次误判掐断时，申诉通道够不够快，才是真问题。", "en": "A sock trending topic is funny, but the same logic sits underneath: platform risk control is built to over-block, and creators bear the cost. A false positive can circulate as a joke, until real revenue is cut off by one, and then the question is how fast the appeals channel actually is.", "es": "Un tema de calcetines hace gracia, pero debajo está la misma lógica: el control de riesgos está diseñado para bloquear de más y el coste lo asume el creador. Un falso positivo circula como chiste, hasta que corta ingresos reales; entonces la pregunta es cuán rápido funciona el canal de apelación.", "ja": "ソックスの話題は笑い話だが、その下にある論理は同じだ。プラットフォームの風控は誤って止める方がましという設計で、コストは作り手が負う。誤検知はネタとして流れるが、実際の収益が断たれたとき、異議申し立ての通路がどれだけ速いかが本当の問題になる。"}}, {"idx": "05", "title": {"zh": "前 10 个月数据服务用电量 892 亿千瓦时，算力正在改写用电曲线", "en": "Data-service electricity use hits 89.2bn kWh in ten months as compute reshapes the power curve", "es": "El consumo eléctrico de servicios de datos llega a 89.200 millones de kWh en diez meses", "ja": "データサービス用電力が 10 か月で 892 億 kWh、計算需要が電力曲線を変える"}, "body": {"zh": "国家能源局数据显示，前 10 个月全社会用电量累计 89442 亿千瓦时，同比增长 3.7%；其中充换电服务业用电增速 55.9%，互联网数据服务业 40.8%。单独看互联网数据服务，前 10 个月用电量达 892 亿千瓦时。业内测算，电费约占数据中心运营成本的 60% 至 70%，在算力需求快速扩张的背景下，绿色电力配套与节能技术成为新建数据中心的前置条件。", "en": "Data from the National Energy Administration show electricity consumption of 8.9442 trillion kWh in the first ten months, up 3.7% year on year; charging and battery-swap services grew 55.9% and internet data services 40.8%. Internet data services alone used 89.2 billion kWh in the period. Industry estimates put electricity at 60% to 70% of data-centre operating costs, making green power supply and efficiency technology preconditions for new builds as compute demand expands.", "es": "Los datos de la Administración Nacional de Energía muestran un consumo de 8,9442 billones de kWh en los diez primeros meses, un 3,7 % más interanual; los servicios de carga y cambio de baterías crecieron un 55,9 % y los de datos un 40,8 %. Solo los servicios de datos usaron 89.200 millones de kWh. Se estima que la electricidad representa entre el 60 % y el 70 % del coste operativo de un centro de datos, lo que convierte el suministro verde y la eficiencia en condiciones previas para nuevas instalaciones.", "ja": "国家能源局のデータによれば、1～10 月の全社会電力使用量は 8 兆 9442 億 kWh で前年同期比 3.7 % 増。充電・電池交換サービスは 55.9 % 増、インターネットデータサービスは 40.8 % 増だった。データサービスだけで 892 億 kWh に達する。業界推計では電気代はデータセンター運営費の 60～70 % を占め、計算需要の拡大に伴い、グリーン電力の確保と省エネ技術が新設の前提条件になっている。"}, "why": {"zh": "AI 的账，最后有一部分记在电表上。算力越贵、越密集，电价和绿电配额就越像新的“选址条件”——这也是为什么数据中心的选址开始往西走、往水电和风光富集的地方走。", "en": "Part of AI's bill is ultimately metered. The denser and more expensive compute gets, the more power prices and green-energy quotas become the new siting criteria, which is why data centres are moving west, towards hydro, wind and solar.", "es": "Parte de la factura de la IA acaba en el contador. Cuanto más denso y caro es el cómputo, más se convierten el precio de la luz y las cuotas de energía verde en criterios de ubicación: por eso los centros de datos se desplazan al oeste, hacia hidroeléctrica, viento y sol.", "ja": "AI の請求書の一部は最終的に電力メーターに載る。計算が高価で高密度になるほど、電気料金とグリーン電力の割当が新しい立地条件になる。データセンターが西部へ、水力・風力・太陽光の豊富な地域へ移りつつある理由だ。"}}]}, {"key": "ent", "num": "06", "color": "#db2777", "deep": "#ad1a5c", "name": {"zh": "娱乐八卦", "en": "Showbiz", "es": "Espectáculos", "ja": "芸能"}, "items": [{"idx": "01", "title": {"zh": "《暮光之城》全系列确认引进内地，首部加 5 分钟主创圆桌", "en": "All five Twilight films confirmed for mainland China, with a new 5-minute cast reunion", "es": "Toda la saga Crepúsculo llegará a China continental con una mesa redonda inédita de 5 minutos", "ja": "トワイライト全 5 作の中国本土公開が決定、第 1 作に 5 分の座談会を追加"}, "body": {"zh": "11 月 24 日，《暮光之城》全系列确认引进中国内地的消息冲上微博热搜，词条阅读量 4.8 亿、讨论超 32 万。该系列由中国电影集团公司进口、中影股份发行译制、之江影业协助推广，同日发布“暮色重逢”海报。首部定名《暮光之城（20 周年重逢版）》，正片开篇增设 5 分钟独家主创圆桌访谈，原著作者斯蒂芬妮·梅尔与制片人威克·戈弗雷、凯伦·罗森费尔特重聚。系列五部全球总票房突破 34 亿美元；内地此前只上映过 2009 年的《暮色》与 2012 年的《破晓（上）》，《新月》《月食》《破晓（下）》始终未登陆院线。", "en": "News that all five Twilight films are cleared for mainland China release trended on Weibo on 24 November, with 480 million reads and more than 320,000 comments. Imported by China Film Group, distributed and dubbed by China Film, and promoted with Zhijiang Film, the series unveiled a reunion poster the same day. The first film is titled Twilight (20th Anniversary Reunion Edition) and opens with an exclusive five-minute roundtable featuring author Stephenie Meyer with producers Wyck Godfrey and Karen Rosenfelt. The five films have taken more than $3.4 billion worldwide; mainland cinemas previously showed only Twilight in 2009 and Breaking Dawn Part 1 in 2012, leaving New Moon, Eclipse and Breaking Dawn Part 2 unreleased there.", "es": "La noticia de que las cinco películas de Crepúsculo llegarán a China continental fue tendencia en Weibo el 24 de noviembre, con 480 millones de lecturas y más de 320.000 comentarios. Importada por China Film Group, distribuida y doblada por China Film y promovida por Zhijiang Film, la saga presentó ese día un cartel de reencuentro. La primera se titula Crepúsculo (edición reencuentro del 20 aniversario) y abre con una mesa redonda exclusiva de cinco minutos con la autora Stephenie Meyer y los productores Wyck Godfrey y Karen Rosenfelt. Las cinco películas han recaudado más de 3.400 millones de dólares; en China continental solo se estrenaron Crepúsculo en 2009 y Amanecer Parte 1 en 2012.", "ja": "トワイライト全 5 作が中国本土で公開されるとの情報が 11 月 24 日に Weibo の熱搜に入り、閲覧 4 億 8000 万、コメント 32 万件を超えた。中国電影集団が輸入し、中影が配給・吹き替え、之江影業が宣伝協力。同日、再会ポスターも公開された。第 1 作はトワイライト（20 周年再会版）と題され、冒頭に原作者ステファニー・メイヤーとプロデューサーのウィック・ゴッドフリー、カレン・ローゼンフェルトによる 5 分の独占座談会が追加される。シリーズ 5 作の世界興行収入は 34 億ドル超。中国本土では 2009 年の第 1 作と 2012 年のブレイキング・ドーン Part1 のみ公開され、第 2 作、第 3 作、最終作は未公開だった。"}, "why": {"zh": "18 年补一张电影票，卖的不是新片，是“当年在电脑上看完的那批人”现在有钱有闲了。这也解释了为什么进口片最近偏爱“重逢版”：老 IP 的确定性，比新片的口碑风险便宜得多。", "en": "Selling a cinema ticket eighteen years late is not selling a new film; it is selling to the people who finished it on a laptop back then and now have money and time. It also explains why imported titles increasingly favour reunion editions: the certainty of old IP is far cheaper than the reputational risk of a new release.", "es": "Vender una entrada de cine dieciocho años después no es vender una película nueva, sino llegar a quienes la terminaron en un portátil y ahora tienen dinero y tiempo. Explica también por qué las películas importadas prefieren ediciones reencuentro: la certeza del viejo IP sale mucho más barata que el riesgo de reputación de un estreno.", "ja": "18 年遅れで映画のチケットを売るのは新作を売ることではなく、当時パソコンで見終えた層が今は金と時間を持っていることに売っている。輸入作が再会版を好む理由でもある。過去 IP の確実性は、新作の評判リスクよりずっと安い。"}}, {"idx": "02", "title": {"zh": "苏醒发首张纯 R&B 专辑《情歌而已》，深圳站 25 日开预售", "en": "Su Xing releases his first all-R&B album, with Shenzhen tickets on sale 25 November", "es": "Su Xing publica su primer álbum íntegramente R&B y las entradas de Shenzhen salen a la venta el 25", "ja": "蘇醒が初の R&B 限定アルバム、深セン公演のチケットは 25 日先行販売"}, "body": {"zh": "苏醒 11 月 11 日发行全新原创专辑《情歌而已》，这是他出道 19 年来首张纯 R&B 风格专辑，也是唯一一张完全没有说唱的专辑；先行曲《大小姐》已提前释出。11 月 21 日，“情歌而已”巡回演唱会南京站在奥体中心体育馆举行，以演唱加音乐剧形式呈现，全程几乎没有串场说话；他在现场透露新专辑所有曲目都会在巡演中演唱。12 月 26 日深圳站定于深圳湾体育中心“春茧”体育馆，11 月 25 日开启预售。此前他在一档观察类综艺中的发言引发争议，11 月 24 日更新的个人节目第四期中作了集中回应。", "en": "Su Xing released his new album Qing Ge Er Yi on 11 November, his first all-R&B record in 19 years and the only one with no rap at all; the lead single came earlier. The Nanjing stop of his tour played the Olympic Sports Centre on 21 November as a concert-musical hybrid with almost no spoken interludes, and he said every track would be performed on the tour. The Shenzhen date is set for the Spring Cocoon arena on 26 December, with pre-sale opening on 25 November. Remarks he made on the observation panel of a variety show had drawn criticism; he responded at length in the fourth episode of his own show on 24 November.", "es": "Su Xing publicó el 11 de noviembre su nuevo álbum Qing Ge Er Yi, su primer trabajo íntegramente R&B en 19 años y el único sin rap; el single adelanto salió antes. La parada de Nankín de su gira se celebró el 21 de noviembre en el Palacio de Deportes Olímpico como un híbrido de concierto y musical, casi sin intervenciones habladas, y afirmó que tocaría todos los temas en la gira. La fecha de Shenzhen será el 26 de diciembre en el pabellón Spring Cocoon, con preventa el 25 de noviembre. Unos comentarios suyos en el panel de un programa habían generado polémica; respondió con detalle en el cuarto episodio de su propio espacio el 24 de noviembre.", "ja": "蘇醒は 11 月 11 日、新アルバム情歌而已をリリースした。デビュー 19 年で初の R&B のみの作品であり、ラップを一切含まない唯一のアルバムでもある。先行曲は既に公開済み。11 月 21 日には南京・奥体中心体育館でツアー公演を行い、歌唱とミュージカルの形式でほぼ MC なしに進行。全曲をツアーで披露すると語った。12 月 26 日の深セン公演は深圳湾体育中心春繭で、11 月 25 日に先行販売が始まる。先ごろバラエティ番組での発言をめぐる議論については、24 日更新の自身の番組第 4 回でまとめて説明した。"}, "why": {"zh": "出道 19 年第一次做一张“完全没有说唱”的专辑，是一次主动的减法：把技巧收起来，只留旋律。对一个靠表达欲吃饭的歌手，这比加东西更难。", "en": "Nineteen years in, making an album with no rap at all is a deliberate subtraction: put the technique away and leave only melody. For a singer who lives on the urge to say things, that is harder than adding.", "es": "Tras diecinueve años, un álbum sin nada de rap es una resta deliberada: guardar la técnica y dejar solo la melodía. Para un cantante que vive de las ganas de decir cosas, es más difícil que añadir.", "ja": "デビュー 19 年目でラップを一切排したアルバムを作るのは、意図的な引き算だ。技巧をしまい、旋律だけを残す。語りたい衝動で生きてきた歌手にとって、足すより難しい。"}}, {"idx": "03", "title": {"zh": "五部新剧两天内扎堆开播，黄轩金晨《不为人知的故事》定档 26 日", "en": "Five new dramas land within two days, with Huang Xuan and Jin Chen's adaptation due on 26 November", "es": "Cinco series nuevas en dos días, con la de Huang Xuan y Jin Chen el 26 de noviembre", "ja": "2 日間に新ドラマ 5 本が集中、黄軒×金晨の作品は 26 日開始"}, "body": {"zh": "11 月 26 日起，爱奇艺、优酷、腾讯视频、咪咕四家平台在两天内排播五部新剧。26 日，爱奇艺率先上线翻拍剧《天地男儿》，马可、张贺雯、齐晨君主演，讲都市男女的情感与商战；同日优酷推出《不为人知的故事》，黄轩、金晨主演，文物修复师与卧底缉毒警的设定，原著被读者称为“BE 美学天花板”，剧版改动了女主殉情的结局；爱奇艺同日还有《骨鉴卿心》，胡意旋、程相主演，现代女法医魂穿民国破案。27 日，腾讯视频与爱奇艺联手推出《风生水起》，韩东君、傅菁领衔，陈明昊、张晨光、尹铸胜作配，刑警卧底题材；咪咕独播《笑探太平镇》，罗一舟、宣璐主演，民国小镇探案喜剧。", "en": "From 26 November, iQIYI, Youku, Tencent Video and Migu will launch five new dramas within two days. On the 26th iQIYI leads with a remake of Tian Di Nan Er, starring Ma Ke, Zhang Hewen and Qi Chenjun, a story of romance and business warfare; Youku offers The Untold Story with Huang Xuan and Jin Chen as a restorer and an undercover narcotics officer, an adaptation whose ending has been changed from the heroine's death; iQIYI also has Gu Jian Qing Xin, with Hu Yixuan and Cheng Xiang as a forensic pathologist who wakes up in the republican era. On the 27th Tencent Video and iQIYI jointly release Feng Sheng Shui Qi with Han Dongjun and Fu Jing; Migu has the republican-era comedy detective series Xiao Tan Tai Ping Zhen with Luo Yizhou and Xuan Lu.", "es": "Desde el 26 de noviembre, iQIYI, Youku, Tencent Video y Migu estrenarán cinco series en dos días. El 26, iQIYI abre con el remake Tian Di Nan Er, con Ma Ke, Zhang Hewen y Qi Chenjun, entre romance y guerra de negocios; Youku ofrece The Untold Story con Huang Xuan y Jin Chen como restaurador y agente antidroga encubierto, con el final cambiado respecto a la novela; iQIYI suma Gu Jian Qing Xin, con Hu Yixuan y Cheng Xiang como forense que despierta en la era republicana. El 27, Tencent Video e iQIYI lanzan Feng Sheng Shui Qi con Han Dongjun y Fu Jing; Migu emite la comedia detectivesca Xiao Tan Tai Ping Zhen con Luo Yizhou y Xuan Lu.", "ja": "11 月 26 日から 2 日間に、iQIYI、優酷、騰訊視頻、咪咕の 4 プラットフォームが新ドラマ 5 本を集中的に配信する。26 日は iQIYI がリメイク作天地男児を先行配信し、馬可、張賀雯、斉晨君が出演、都市の恋愛と商戦を描く。同日、優酷は黄軒と金晨の不為人知的故事を投入。文化財修復師と潜入捜査官の設定で、原作は読者に BE 美学の頂点と呼ばれ、ドラマ版はヒロインの殉死の結末を変更した。iQIYI は同じ日に骨鑑卿心（胡意旋、程相）も配信。27 日には騰訊視頻と iQIYI が韓東君、傅菁の風生水起を、咪咕が羅一舟、宣璐の民国探偵コメディ笑探太平鎮を出す。"}, "why": {"zh": "五部剧挤在两天，是平台在年底冲会员和广告预算的常规动作；真正决定排播的，是《不为人知的故事》这类“原著有读者、主演有演技”的项目——它们不用靠营销预热带量。至于改编动结局，能不能被接受，26 日晚上就有答案。", "en": "Five dramas in two days is the usual year-end push for subscriptions and ad budgets; what really sets the schedule is a title like The Untold Story, with a readership behind the source novel and leads who can act, which needs no marketing warm-up. Whether audiences accept the changed ending will be clear on the night of the 26th.", "es": "Cinco series en dos días es el empujón habitual de fin de año por suscripciones y publicidad; lo que de verdad marca el calendario es un título como The Untold Story, con novela leída y protagonistas que actúan: no necesita calentamiento de marketing. Si el público acepta el final cambiado se sabrá la noche del 26.", "ja": "2 日で 5 本というのは、年末に会員数と広告予算を取りに行く各社の定番行動だ。実際に編成を決めるのは不為人知的故事のような、原作に読者がいて主演に演技力がある作品で、マーケティングの助走を必要としない。結末変更が受け入れられるかは 26 日夜には分かる。"}}, {"idx": "04", "title": {"zh": "刘德华 12 月红馆连开 20 场，跨圣诞与跨年", "en": "Andy Lau sets 20 Hong Kong Coliseum shows across Christmas and New Year", "es": "Andy Lau dará 20 conciertos en el Coliseo de Hong Kong entre Navidad y Año Nuevo", "ja": "劉徳華が 12 月に香港コロシアムで 20 公演、クリスマスから年末年始へ"}, "body": {"zh": "刘德华 12 月将在中国香港红馆举行 20 场“About Life”演唱会，档期横跨圣诞与跨年，其后还有六城内地巡演排到 2027 年。他在薛家燕的节目上谈及家庭，说本想“随遇而安”，2012 年女儿刘向蕙出生时他 51 岁，第一次抱起孩子时“之前所有的等待都归零”；如今在家还要跟女儿的数学题“死磕”。他提到打算 2028 年巡演结束后再回去拍主角电影，中间有好本子的客串可以考虑。", "en": "Andy Lau will play 20 About Life shows at the Hong Kong Coliseum in December, running across Christmas and New Year, followed by a six-city mainland tour into 2027. On Sit Ka-yin's programme he spoke about family: he had planned to let things take their course, and when his daughter Hanna was born in 2012 he was 51; holding her for the first time, he said, reset all the waiting that came before. These days he still wrestles with her maths homework. He plans to return to lead roles after the tour ends in 2028, with possible cameos if a good script appears.", "es": "Andy Lau ofrecerá 20 conciertos de About Life en el Coliseo de Hong Kong en diciembre, entre Navidad y Año Nuevo, seguidos de una gira por seis ciudades del continente hasta 2027. En el programa de Sit Ka-yin habló de su familia: pensaba dejar que las cosas siguieran su curso y, cuando nació su hija Hanna en 2012, tenía 51 años; sostenerla por primera vez, dijo, puso a cero toda la espera anterior. Hoy sigue peleándose con sus deberes de matemáticas. Piensa volver a los papeles protagonistas cuando acabe la gira en 2028, con posibles cameos si aparece un buen guion.", "ja": "劉徳華は 12 月、香港コロシアムで About Life 公演 20 本を開催し、クリスマスから年末年始にまたがる。その後は 2027 年まで中国本土 6 都市のツアーが続く。薛家燕の番組で家族について語り、本来は成り行きに任せるつもりだったが、2012 年に娘の劉向蕙さんが生まれたとき自分は 51 歳で、初めて抱いた瞬間にそれまでの待ち時間がすべてゼロになったと述べた。今も娘の数学の宿題と格闘しているという。2028 年にツアーが終わったら主演映画に戻る予定で、良い脚本があればカメオ出演もあり得るとした。"}, "why": {"zh": "65 岁连开 20 场、横跨两个节庆档，这已经不是“情怀演出”，而是一套被验证过的商业模型：红馆的场次密度、跨年档的溢价、内地六城的接力。他自己说 2028 年再回去拍电影——把巡演当成最后一段长跑，反而更像清醒的规划。", "en": "Twenty shows at 65 across two holiday windows is no longer nostalgia programming but a proven commercial model: Coliseum density, New Year pricing, a six-city relay on the mainland. His plan to return to film in 2028 suggests he is treating the tour as a final long run, which reads as clear-eyed planning rather than sentiment.", "es": "Veinte conciertos a los 65 y a caballo entre dos festivos ya no es programa nostálgico sino un modelo comercial probado: densidad en el Coliseo, prima de fin de año y relevo en seis ciudades. Su idea de volver al cine en 2028 sugiere que trata la gira como una última carrera larga: planificación lúcida más que sentimentalismo.", "ja": "65 歳で 20 公演、しかも二つの祝日期間にまたがるのは、もはや懐かしさの演出ではなく検証済みのビジネスモデルだ。コロシアムの公演密度、年末年始の価格、本土 6 都市のリレー。2028 年に映画へ戻ると語るのは、ツアーを最後の長距離走と位置づける冷静な計画に見える。"}}, {"idx": "05", "title": {"zh": "《王牌对王牌》第十季阵容网传，王一博被传新增常驻", "en": "Rumoured season ten cast for Ace vs Ace puts Wang Yibo among the regulars", "es": "Se filtra un posible reparto de la décima temporada de Ace vs Ace con Wang Yibo", "ja": "王牌対王牌の第 10 シーズン陣容が噂に、王一博のレギュラー加入も取り沙汰"}, "body": {"zh": "11 月 24 日至 25 日，“王牌对王牌第十季阵容”“曝王牌对王牌 10 新增常驻王一博”先后登上微博热搜前两位，热度均约 14 万。相关说法均来自网络爆料，节目组与平台尚未官宣，常驻名单、录制时间与播出档期均无官方确认。同期，“张艺谋电影肖战杨幂”也进入热搜前六，同样属于未获片方证实的传闻。按往年节奏，综艺与影视项目在正式宣发前，常以阵容传闻试探舆论反应。", "en": "On 24 and 25 November, the tags for Ace vs Ace season ten cast and for Wang Yibo reportedly joining as a regular took the top two spots on Weibo's hot list, each with about 140,000 points of heat. All of it comes from online leaks; the producers and platform have not announced anything, and neither the regular cast, the shooting schedule nor the broadcast slot is confirmed. A rumour about a Zhang Yimou film with Xiao Zhan and Yang Mi also entered the top six, likewise unconfirmed by the filmmakers. In past years, variety shows and film projects have often floated casting rumours to test reaction before official promotion.", "es": "El 24 y 25 de noviembre, las etiquetas sobre el reparto de la décima temporada de Ace vs Ace y sobre Wang Yibo sumándose como fijo ocuparon los dos primeros puestos del ranking de Weibo, con unos 140.000 puntos cada una. Todo proviene de filtraciones; la productora y la plataforma no han anunciado nada y no hay confirmación del elenco fijo, el rodaje ni la emisión. Un rumor sobre una película de Zhang Yimou con Xiao Zhan y Yang Mi también entró en el top seis, igualmente sin confirmar. En años anteriores, programas y películas han lanzado rumores de reparto para medir la reacción antes de la promoción oficial.", "ja": "11 月 24～25 日、王牌対王牌の第 10 シーズン陣容と王一博が新レギュラーにというタグが相次いで Weibo の熱搜 1、2 位に入り、熱度はいずれも約 14 万だった。いずれもネット上のリークによるもので、番組側とプラットフォームは未発表。レギュラー陣、収録時期、放送枠のいずれも公式確認はない。同じく張芸謀作品に肖戦と楊冪という噂も 6 位以内に入ったが、製作側の確認はない。例年、バラエティや映画は本格的な宣伝前にキャストの噂で反応を探ることがある。"}, "why": {"zh": "一条未官宣的阵容能挂两天热搜，说明这档节目真正稀缺的不是明星，而是“还能被讨论”。但传闻热度是借来的，官宣那天要还——名单对不上，反噬也来得快。", "en": "An unannounced cast holding the hot list for two days says the show's scarce resource is not stars but the ability to still be discussed. Rumour heat is borrowed, though, and it comes due on announcement day: a cast that does not match invites a fast backlash.", "es": "Un reparto sin anunciar dos días en el ranking indica que el recurso escaso del programa no son las estrellas sino seguir siendo tema de conversación. El calor del rumor es prestado y se devuelve el día del anuncio: si la lista no coincide, la reacción es rápida.", "ja": "未発表の陣容が 2 日間も熱搜に居座るのは、この番組に足りないのが出演者ではなく話題にできること自体だからだ。噂の熱は借り物で、発表の日に返済が来る。名簿が違えば反動も速い。"}}]}], "risk": {"zh": "风险提示：本简报仅作信息汇总，其中涉及的数据不构成任何投资建议。", "en": "Risk notice: this briefing is a summary of information only; the data cited does not constitute investment advice.", "es": "Aviso de riesgo: este boletín es solo un resumen informativo; los datos citados no constituyen asesoramiento de inversión.", "ja": "リスク表示：本ブリーフィングは情報の要約であり、記載のデータは投資助言を構成するものではありません。"}}/*__END__*/;

    if (/^zh/.test(nav)) return "zh";
    if (/^ja/.test(nav)) return "ja";
    if (/^es/.test(nav)) return "es";
    if (/^en/.test(nav)) return "en";
    var tz = "";
    try { tz = Intl.DateTimeFormat().resolvedOptions().timeZone || ""; } catch (e) {}
    if (/^Asia\/Tokyo/.test(tz)) return "ja";
    if (/Europe\/Madrid|America\/(Mexico_City|Bogota|Lima|Santiago|Caracas|Guatemala|La_Paz|San_Jose|Panama|Asuncion|Montevideo|Havana|El_Salvador|Managua|Tegucigalpa|Costa_Rica|San_Salvador)|America\/Argentina\//.test(tz)) return "es";
    if (/^(Europe|America|Australia)\//.test(tz)) return "en";
    return "zh";
  }

  var curLang = "zh";
  var langOpen = false;

  /* ===== 渲染 ===== */
  function renderChrome(lang) {
    var i18n = I18N[lang];
    document.documentElement.lang = LANG_HTML[lang];
    // 报头信息行
    var metaEl = document.getElementById("metaRow");
    if (metaEl) metaEl.textContent = T(BRIEFING.meta, lang);
    // 大日期
    var md = document.getElementById("mastDate");
    if (md) {
      var d = new Date(BRIEFING.date + "T00:00:00");
      md.innerHTML = fmtDate(d, lang) + "<small>" + esc(i18n.dateSub) + "</small>";
    }
    // 文档标题
    var siteName = (lang === "zh") ? "提马早报" : "TIMAB DAILY";
    document.title = siteName + " · " + fmtDate(new Date(BRIEFING.date + "T00:00:00"), lang);
    // 导航签
    var nav = document.getElementById("navChips");
    if (nav) {
      var order = ["pick"].concat(BRIEFING.sections.map(function (s) { return s.key; }));
      nav.innerHTML = "";
      order.forEach(function (key) {
        if (key === "pick") {
          var a = document.createElement("a");
          a.className = "chip-pick"; a.href = "#pick"; a.setAttribute("data-nav", "pick");
          a.textContent = T(BRIEFING.spotlight.badge, lang);
          nav.appendChild(a);
        } else {
          var sec = null;
          BRIEFING.sections.forEach(function (s) { if (s.key === key) sec = s; });
          if (!sec) return;
          var b = document.createElement("a");
          b.href = "#" + key; b.setAttribute("data-nav", key);
          b.style.borderColor = sec.color; b.style.color = sec.deep;
          b.textContent = T(sec.name, lang);
          nav.appendChild(b);
        }
      });
    }
    // 日历文案
    var cb = document.getElementById("calBtnText"); if (cb) cb.textContent = i18n.calBtn;
    var cw = document.getElementById("calWeek");
    if (cw) { cw.innerHTML = ""; i18n.calWeek.forEach(function (w) { var s = document.createElement("span"); s.textContent = w; cw.appendChild(s); }); }
    var cf = document.getElementById("calFoot"); if (cf) cf.textContent = i18n.calFoot;
    // 语言切换器（国旗触发 + 下拉）
    var ls = document.getElementById("langSwitch");
    if (ls) {
      ls.className = "lang-switch" + (langOpen ? " open" : "");
      ls.innerHTML = "";
      var trig = document.createElement("button");
      trig.type = "button"; trig.className = "lang-trigger"; trig.id = "langTrigger";
      trig.setAttribute("aria-haspopup", "true");
      trig.setAttribute("aria-expanded", langOpen ? "true" : "false");
      trig.innerHTML = flag(curLang) + '<span class="caret">▾</span>';
      trig.addEventListener("click", function (e) {
        e.stopPropagation();
        langOpen = !langOpen;
        ls.classList.toggle("open", langOpen);
        trig.setAttribute("aria-expanded", langOpen ? "true" : "false");
      });
      ls.appendChild(trig);
      var menu = document.createElement("div");
      menu.className = "lang-menu"; menu.setAttribute("role", "menu");
      LANGS.forEach(function (l) {
        var item = document.createElement("button");
        item.type = "button"; item.className = "lang-item" + (l === curLang ? " sel" : "");
        item.setAttribute("role", "menuitem"); item.setAttribute("data-lang", l);
        item.innerHTML = flag(l) + '<span class="lbl">' + LANG_LABEL_FULL[l] + "</span>";
        item.addEventListener("click", function (e) {
          e.stopPropagation();
          setLang(l);
        });
        menu.appendChild(item);
      });
      ls.appendChild(menu);
    }
  }

  function renderContent(lang) {
    var i18n = I18N[lang];
    var html = "";
    // 精选
    var sp = BRIEFING.spotlight;
    html += '<section class="spotlight" id="pick">'
      + '<div class="badge"><i></i>' + esc(T(sp.badge, lang)) + "</div>"
      + "<h2>" + titleHtml(sp.title, sp.hl, lang) + "</h2>"
      + '<div class="body">' + esc(T(sp.body, lang)) + "</div>"
      + '<div class="why"><b>' + esc(i18n.why) + "</b>" + esc(T(sp.why, lang)) + "</div>"
      + "</section>";
    // 分类
    html += '<div class="grid">';
    BRIEFING.sections.forEach(function (sec) {
      html += '<section class="card" id="' + sec.key + '" style="--ac:' + sec.color + "; --ac-deep:" + sec.deep + ';">'
        + '<div class="sec-head"><span class="sec-num">' + sec.num + "</span>"
        + "<h3>" + esc(T(sec.name, lang)) + "</h3>"
        + '<span class="en">' + sec.key.toUpperCase() + "</span></div>";
      (sec.items || []).forEach(function (it) {
        html += '<div class="item">';
        html += '<div class="t"><span class="idx">' + it.idx + "</span>";
        if (it.tag) html += '<span class="tag">' + esc(it.tag[lang] != null ? it.tag[lang] : i18n.tag) + "</span>";
        html += titleHtml(it.title, it.hl, lang) + "</div>";
        html += '<div class="d">' + esc(T(it.body, lang)) + "</div>";
        html += '<div class="why"><b>' + esc(i18n.why) + "</b>" + esc(T(it.why, lang)) + "</div>";
        html += "</div>";
      });
      html += "</section>";
    });
    html += "</div>";
    var content = document.getElementById("content");
    if (content) content.innerHTML = html;
    // 页脚
    var risk = document.getElementById("risk");
    if (risk) risk.textContent = T(BRIEFING.risk, lang);
  }

  function setLang(lang) {
    if (LANGS.indexOf(lang) < 0) lang = "zh";
    curLang = lang;
    langOpen = false;
    try { localStorage.setItem("timab_lang", lang); } catch (e) {}
    renderChrome(lang);
    renderContent(lang);
  }

  /* ===== 往期日历（保留原逻辑，文案随语言） ===== */
  function initCalendar() {
    var btn = document.getElementById("calBtn");
    var pop = document.getElementById("calPop");
    var grid = document.getElementById("calGrid");
    var title = document.getElementById("calTitle");
    if (!btn || !pop || !grid || !title) return;

    var parts = BRIEFING.date.split("-");
    var todayKey = parts[0].slice(2) + parts[1] + parts[2];
    var cur = { y: +parts[0], m: +parts[1] };
    var has = {};
    for (var i = 0; i < ARCHIVE_DATES.length; i++) { has[ARCHIVE_DATES[i]] = 1; }
    var HIST_BASE = /\/history\//.test(location.pathname) ? "./" : "history/";

    function ckey(y, m, d) { return String(y).slice(2) + pad(m) + pad(d); }

    function render() {
      var i18n = I18N[curLang];
      title.textContent = i18n.calTitle(cur.y, cur.m);
      grid.innerHTML = "";
      var start = new Date(cur.y, cur.m - 1, 1).getDay();
      var days = new Date(cur.y, cur.m, 0).getDate();
      for (var b = 0; b < start; b++) {
        var blank = document.createElement("span");
        blank.className = "cal-cell is-empty"; grid.appendChild(blank);
      }
      for (var d = 1; d <= days; d++) {
        var k = ckey(cur.y, cur.m, d);
        var cell = document.createElement("span");
        cell.className = "cal-cell" + (has[k] ? " has" : "") + (k === todayKey ? " is-today" : "");
        cell.textContent = d;
        if (has[k]) {
          cell.setAttribute("role", "link"); cell.setAttribute("tabindex", "0");
          cell.title = cur.y + "-" + pad(cur.m) + "-" + pad(d) + " 存档";
          (function (target) {
            var go = function () { window.open(HIST_BASE + target + ".html", "_blank", "noopener"); };
            cell.addEventListener("click", go);
            cell.addEventListener("keydown", function (e) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); go(); } });
          })(k);
        }
        grid.appendChild(cell);
      }
    }
    function toggle(open) {
      pop.hidden = !open;
      btn.setAttribute("aria-expanded", open ? "true" : "false");
      if (open) render();
    }
    btn.addEventListener("click", function (e) { e.stopPropagation(); toggle(pop.hidden); });
    document.getElementById("calPrev").addEventListener("click", function () { cur.m--; if (cur.m < 1) { cur.m = 12; cur.y--; } render(); });
    document.getElementById("calNext").addEventListener("click", function () { cur.m++; if (cur.m > 12) { cur.m = 1; cur.y++; } render(); });
    document.addEventListener("click", function (e) { if (!pop.hidden && !pop.contains(e.target)) toggle(false); });
    document.addEventListener("keydown", function (e) { if (e.key === "Escape" && !pop.hidden) toggle(false); });
  }

  /* ===== 启动 ===== */
  function boot() {
    curLang = detectLang();
    renderChrome(curLang);
    renderContent(curLang);
    initCalendar();
    // 关闭语言下拉：点击外部 / Esc
    document.addEventListener("click", function (e) {
      var ls = document.getElementById("langSwitch");
      if (ls && langOpen && !ls.contains(e.target)) {
        langOpen = false;
        ls.classList.remove("open");
        var t = document.getElementById("langTrigger");
        if (t) t.setAttribute("aria-expanded", "false");
      }
    });
    document.addEventListener("keydown", function (e) {
      if (e.key === "Escape" && langOpen) {
        langOpen = false;
        var ls = document.getElementById("langSwitch");
        if (ls) ls.classList.remove("open");
        var t = document.getElementById("langTrigger");
        if (t) t.setAttribute("aria-expanded", "false");
      }
    });
  }
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", boot);
  } else { boot(); }
})();
</script>
</body>
</html>
