h Her", "es": "Divorciada desde hace doce años, una mujer de Henan acoge a su exsuegra para cuidarla", "ja": "離婚から12年 河南省の女性が元姑を遠方から引き取り介護"}, "body": {"zh": "河南一名女子在离婚 12 年后，跨千里把前婆婆接到身边照料，近日在网络引发关注。据报道，她与前夫离婚后仍与前婆婆保持往来，看到老人独自生活、无人照应，便决定接来同住。这条消息在 25 日至 26 日间被多家媒体转载，评论区最集中的一句话是「亲情不一定靠婚姻维系」。", "en": "A woman in Henan has brought her former mother-in-law hundreds of kilometres to live with her, twelve years after divorcing her husband. She stayed in touch with the older woman after the split and decided to take her in when she saw she was living alone without anyone to look after her. The story was picked up by several outlets on the 25th and 26th; the most repeated comment was that family ties do not always depend on a marriage.", "es": "Una mujer de Henan ha llevado a su exsuegra cientos de kilómetros para vivir con ella, doce años después de divorciarse. Mantuvieron el contacto tras la separación y decidió acogerla al ver que vivía sola y sin cuidados. Varios medios recogieron la historia los días 25 y 26; el comentario más repetido fue que los lazos familiares no siempre dependen de un matrimonio.", "ja": "河南省の女性が、離婚から12年を経て元姑を数百キロ離れた自宅に引き取り、介護している。離婚後も交流を続け、一人で暮らし面倒を見る人がいない姿を見て同居を決めたという。25日から26日にかけて複数のメディアが伝え、「家族の絆は結婚に依存しない」というコメントが最も多く見られた。"}, "why": {"zh": "这条能上热搜，是因为它撞上了大多数人的经验：离婚通常意味着关系清零。她把「前」字留在了称谓里，却没把人情一起删掉——这种不合常规的选择，恰好补上了很多人心里的一个缺口。", "en": "It trended because it collides with most people's experience: divorce usually means resetting a relationship to zero. She kept the «former» in the title but did not delete the human bond — an unconventional choice that fills a gap many people feel.", "es": "Se volvió tendencia porque choca con la experiencia de la mayoría: el divorcio suele significar poner la relación a cero. Ella mantuvo el «ex» en el título pero no borró el vínculo humano, una elección poco convencional que cubre un hueco que muchos sienten.", "ja": "話題になったのは、多くの人の実感とぶつかるからだ。離婚は関係をゼロに戻すことを意味することが多い。彼女は「元」を肩書きに残したまま、人の情を消さなかった。その型破りな選択が、多くの人が感じている隙間を埋めている。"}}, {"idx": "03", "title": {"zh": "「iPhone Duo 王者荣耀黑边」上热搜：折叠屏新机未适配，游戏最高只跑 60 帧", "en": "«iPhone Duo Black Bars» Trends: New Foldable Unsupported by Top Games, Capped at 60 Frames", "es": "«Barras negras en iPhone Duo» se vuelve tendencia: los juegos punteros no están adaptados y se limitan a 60 fotogramas", "ja": "「iPhone Duo 王者栄耀の黒帯」がトレンド 折りたたみ新機種に未対応、最大60フレーム"}, "body": {"zh": "10 月 25 日，「iPhone Duo 王者荣耀黑边」登上微博热搜。腾讯《王者荣耀》、米哈游《原神》等热门游戏尚未适配苹果新款折叠屏机型，画面出现黑边，且《王者荣耀》尚未开放该机型的 120 帧模式，玩家最高只能以 60 帧运行。业内分析认为，头部产品对新硬件形态的适配滞后，反映的是适配成本与优先级的权衡；折叠屏想在游戏场景普及，仍需内容生态同步跟上。", "en": "On 25 October «iPhone Duo Honor of Kings black bars» trended on Weibo. Major titles including Tencent's Honor of Kings and miHoYo's Genshin Impact have yet to adapt to Apple's new foldable, leaving black bars on screen, and Honor of Kings has not enabled a 120-frame mode on the device, capping players at 60. Analysts say the lag among top titles reflects a trade-off between adaptation cost and priority, and that foldables need the content ecosystem to catch up before gaming on them becomes mainstream.", "es": "El 25 de octubre «barras negras del iPhone Duo en Honor of Kings» se volvió tendencia en Weibo. Títulos como Honor of Kings de Tencent y Genshin Impact de miHoYo aún no se han adaptado al nuevo plegable de Apple y muestran barras negras; Honor of Kings tampoco habilita el modo de 120 fotogramas en el dispositivo, limitando a 60. Los analistas señalan que el retraso refleja una disyuntiva entre coste de adaptación y prioridad, y que los plegables necesitan que el ecosistema de contenidos avance para consolidarse en videojuegos.", "ja": "10月25日、「iPhone Duo 王者栄耀の黒帯」がWeiboのトレンド入りした。テンセントの「王者栄耀」やmiHoYoの「原神」など人気作がアップルの新しい折りたたみ機に未対応で画面に黒帯が出ており、「王者栄耀」は120フレームモードも未開放で最大60フレームにとどまる。業界では、対応コストと優先順位の兼ね合いだと分析され、折りたたみ機がゲームで普及するにはコンテンツ側の追随が必要とされる。"}, "why": {"zh": "硬件厂商发新形态，内容方按用户量排优先级——这是每次形态变化都会重演的时差。对玩家来说，买的是「未来的形态」，用的是「当下的体验」，中间这段空窗期没人赔。", "en": "Hardware ships a new form factor; content owners prioritise by user numbers. That lag repeats at every form-factor change. Buyers pay for a future shape and live with a present experience, and nobody compensates for the gap.", "es": "El fabricante lanza una forma nueva y los creadores priorizan por número de usuarios: un desfase que se repite en cada cambio de formato. El jugador paga por una forma futura y usa una experiencia presente, y nadie compensa ese hueco.", "ja": "ハードが新しい形を出し、コンテンツ側は利用者数で優先順位を決める。形が変わるたびに繰り返される時差だ。利用者は「未来の形」を買い「現在の体験」を使う。その空白を補償する人はいない。"}}, {"idx": "04", "title": {"zh": "新车发布会把消费者叫「老登」：想挣我的钱，又喊我老登", "en": "A Car Launch Calls Its Buyers «Old Fogeys»: The Line That Backfired", "es": "Un lanzamiento de coche llama «viejos» a sus compradores y la frase se vuelve en su contra", "ja": "新車発表会で客を「ジジイ」と呼び炎上 「金は欲しいが呼び方はこれ」"}, "body": {"zh": "一场新车预售发布会上，年轻的产品经理多次把「老登」挂在嘴边，本意是标榜自家设计年轻、够潮，结果踩进舆论深坑。网友的一句话传遍全网：「想挣我的钱，又喊我老登。」主办方随后道歉，热搜慢慢退去。多家媒体在评论中指出，这不是单纯的公关事故，而是产品定位与真实客群之间的错位：买单的人，正是被调侃的那群人。", "en": "At a new car's presale event, a young product manager repeatedly used «lao deng» — roughly «old fogey» — to argue that the design was young and trendy, and walked straight into a backlash. One line went viral: «You want my money, but you call me an old fogey.» The company apologised and the topic faded. Commentators argued it was less a PR accident than a mismatch between positioning and the actual buyer, who is precisely the person being mocked.", "es": "En la presentación de un coche nuevo, un joven jefe de producto repitió la expresión «lao deng» —equivalente a «viejo»— para defender que el diseño era joven y moderno, y provocó un rechazo masivo. Una frase se viralizó: «Quieres mi dinero y me llamas viejo». La empresa se disculpó y el tema se diluyó. Los analistas sostienen que no fue solo un error de comunicación, sino un desajuste entre el posicionamiento y el comprador real, que es justamente quien recibe la burla.", "ja": "新型車の予約発表会で、若いプロダクトマネージャーが「老登（ジジイ）」という言葉を繰り返し、デザインの若さと流行感を強調しようとして炎上した。「金は欲しいのに、こっちをジジイと呼ぶのか」という一言が広く共有された。主催者は謝罪し、話題は収束した。メディアは単なる広報事故ではなく、ポジショニングと実際の購入層のずれだと指摘する。買うのは、まさにからかわれた側だからだ。"}, "why": {"zh": "营销话术最容易犯的错，是把「我想吸引谁」当成「谁在付钱」。这次翻车之所以传播广，是因为每个被冒犯的人都能立刻用一句话复述自己的处境。", "en": "The classic marketing error is mistaking «who I want to attract» for «who is paying». This one spread because everyone offended could restate their own position in a single sentence.", "es": "El error clásico del marketing es confundir «a quién quiero atraer» con «quién paga». Se difundió porque cada persona ofendida podía resumir su situación en una sola frase.", "ja": "マーケティングの典型的な誤りは「誰を惹きたいか」と「誰が払うか」を取り違えることだ。ここまで広がったのは、傷ついた人が自分の立場を一言で言い直せたからだ。"}}, {"idx": "05", "title": {"zh": "张雪驾改装摩托车在水面行驶 40.74 公里，刷新吉尼斯世界纪录", "en": "Zhang Xue Rides a Modified Motorcycle 40.74 km Across Open Water for a Guinness Record", "es": "Zhang Xue recorre 40,74 km sobre el agua en una moto modificada y logra un récord Guinness", "ja": "張雪さん、改造バイクで水上40.74キロ走行しギネス記録を更新"}, "body": {"zh": "10 月 25 日，「张雪机车」创始人张雪在家乡湖南麻阳，驾驶改装摩托车 MX450 完成 40.74 公里的水上行驶距离，成功刷新「改装摩托车在开阔水域行驶最远距离」吉尼斯世界纪录。此前的纪录由他人保持。现场视频显示，车辆依靠特制浮筒与后轮推进在水面保持平衡，全程需要持续控制车身姿态。", "en": "On 25 October Zhang Xue, founder of the motorcycle brand Zhangxue Jiche, rode a modified MX450 for 40.74 km across open water in his hometown of Mayang, Hunan, setting a Guinness World Record for the longest distance travelled by a modified motorcycle on open water. The previous mark belonged to another rider. Footage shows the bike balancing on custom pontoons with the rear wheel providing thrust, requiring constant body control throughout.", "es": "El 25 de octubre Zhang Xue, fundador de la marca de motos Zhangxue Jiche, recorrió 40,74 km sobre agua abierta con una MX450 modificada en su localidad natal de Mayang, Hunan, estableciendo un récord Guinness a la mayor distancia en moto modificada sobre agua abierta. El registro anterior era de otro piloto. Los vídeos muestran la moto equilibrada sobre pontones a medida con la rueda trasera como propulsión, exigiendo control constante.", "ja": "10月25日、バイクブランド「張雪機車」創業者の張雪さんが、故郷の湖南省麻陽で改造車MX450を駆り、開けた水域を40.74キロ走行して「改造バイクによる開けた水域での最長走行距離」のギネス世界記録を更新した。従来の記録は別のライダーが持っていた。映像では、特製のフロートで車体を浮かせ、後輪で推進しながら常に姿勢を制御する様子が確認できる。"}, "why": {"zh": "这种纪录看着像玩票，其实是极硬的工程活：浮力、重心、推力方向任何一项算错，40 公里就会变成 40 米。国产机车品牌愿意花这个成本做一次公开验证，比投广告更能说明问题。", "en": "It looks like a stunt but is hard engineering: get buoyancy, centre of gravity or thrust direction wrong and 40 km becomes 40 metres. For a domestic motorcycle brand, paying for a public test like this says more than an advertisement.", "es": "Parece una broma, pero es ingeniería dura: un error en flotabilidad, centro de gravedad o dirección del empuje convierte 40 km en 40 metros. Para una marca china de motos, costear una prueba pública así dice más que un anuncio.", "ja": "遊びに見えて、実は厳しい工学だ。浮力、重心、推力の向きのどれかを誤れば40キロは40メートルになる。中国のバイクブランドが公開検証にコストをかけることは、広告より雄弁だ。"}}]}, {"key": "ent", "num": "06", "color": "#db2777", "deep": "#a81a56", "name": {"zh": "娱乐八卦", "en": "ENTERTAINMENT", "es": "ESPECTÁCULOS", "ja": "エンタメ"}, "items": [{"idx": "01", "title": {"zh": "于蕾出任 2027 羊年央视春晚总导演，连续第五年执掌", "en": "Yu Lei to Direct the 2027 CCTV Spring Festival Gala, Her Fifth Consecutive Year", "es": "Yu Lei dirigirá la Gala del Año Nuevo Chino 2027 de CCTV por quinto año consecutivo", "ja": "于蕾氏が2027年中央電視台春節聯歓晩会の総監督に 5年連続"}, "body": {"zh": "10 月 25 日，总台通过「CMG 观察」公众号披露：于蕾出任 2027 丁未羊年中央广播电视总台春节联欢晚会总导演。这是她继 2023 兔年至 2026 马年春晚之后，连续第五年担纲。于蕾有二十余年大型文艺节目创作经验，是《国家宝藏》制片人、总导演，也曾担任北京冬奥会开闭幕式文学总撰稿。总台文艺中心党委副书记的身份，让她成为近年春晚最稳定的创作核心。", "en": "CCTV disclosed on 25 October that Yu Lei will direct the 2027 Spring Festival Gala, the Year of the Goat edition — her fifth consecutive year in charge after 2023 through 2026. Yu has more than two decades of experience in large-scale entertainment production, was producer and chief director of the cultural show National Treasure, and served as head writer for the Beijing Winter Olympics opening and closing ceremonies. As deputy Party secretary of CCTV's arts centre, she has become the gala's most stable creative anchor in recent years.", "es": "CCTV anunció el 25 de octubre que Yu Lei dirigirá la Gala del Año Nuevo Chino 2027, edición del Año de la Cabra, su quinto año consecutivo tras 2023-2026. Yu acumula más de dos décadas en producciones de gran formato, fue productora y directora principal del programa cultural National Treasure y guionista jefa de las ceremonias de apertura y clausura de los Juegos de Invierno de Pekín. Como vicesecretaria del centro de artes de CCTV, se ha convertido en el ancla creativa más estable de la gala.", "ja": "中央電視台は10月25日、2027年（丁未・未年）春節聯歓晩会の総監督に于蕾氏を起用すると発表した。2023年から2026年までに続き5年連続となる。于氏は大型文芸番組で20年余りの経験を持ち、文化番組「国家宝蔵」のプロデューサー兼総監督、北京冬季五輪の開会式・閉会式の文学統括も務めた。中央電視台文芸センター党委員会副書記として、近年の春晩で最も安定した創作の中心となっている。"}, "why": {"zh": "春晚总导演连任五年，在历史上并不常见。稳定意味着风格可预期，也意味着创新压力被压到「如何在熟悉的框架里做出新东西」——观众对春晚的批评，往往就集中在这道题上。", "en": "Five consecutive years is unusual in the gala's history. Stability makes the style predictable and pushes the pressure onto a harder question: how to do something new inside a familiar frame. That is precisely where most audience criticism lands.", "es": "Cinco años seguidos es poco habitual en la historia de la gala. La estabilidad hace previsible el estilo y traslada la presión a una pregunta más difícil: cómo innovar dentro de un marco conocido. Ahí suele concentrarse la crítica del público.", "ja": "5年連続は春晩の歴史でも珍しい。安定は様式の予測可能性を高める一方、圧力を「見慣れた枠の中でどう新しさを出すか」に移す。視聴者の批判はまさにそこに集まる。"}}, {"idx": "02", "title": {"zh": "黄子韬直播怒怼索要妻子妊娠纹照片：你让我媳妇晒伤口给你看？", "en": "Huang Zitao Erupts at Viewers Demanding Photos of His Wife's Stretch Marks", "es": "Huang Zitao estalla contra quienes pedían fotos de las estrías de su esposa", "ja": "黄子韜、妻の妊娠線の写真を求める視聴者に激怒"}, "body": {"zh": "10 月 25 日，黄子韬在一场双十一直播中，面对弹幕反复要求妻子徐艺洋展示产后妊娠纹与剖腹产刀口「自证」，当场停下带货回应：「我结婚生子碍你事了吗」「你让我媳妇晒伤口给你看？你是谁啊？」徐艺洋当场落泪，随后上前安抚并把话题拉回产品。法律界人士指出，妊娠纹属女性身体隐私，《民法典》第一千零三十二条明确禁止以刺探、侵扰、泄露、公开等方式侵害他人隐私权。", "en": "During a Double 11 livestream on 25 October, Huang Zitao halted sales to respond to viewers repeatedly demanding that his wife Xu Yiyang display her post-pregnancy stretch marks and C-section scar to «prove» she gave birth. «Does my marriage and child bother you?» he said. «You want my wife to show you her wound? Who are you?» Xu teared up, then stepped in to calm him and steer back to the products. Legal commentators noted that stretch marks are bodily privacy, and Article 1032 of the Civil Code prohibits obtaining, intruding upon, disclosing or publishing private information.", "es": "Durante una emisión de compras del Double 11 el 25 de octubre, Huang Zitao detuvo la venta para responder a los comentarios que exigían repetidamente a su esposa Xu Yiyang mostrar sus estrías y la cicatriz de la cesárea para «probar» que había dado a luz. «¿Te molesta que me case y tenga un hijo?», dijo. «¿Quieres que mi mujer te enseñe su herida? ¿Quién eres?» Xu se echó a llorar y luego intervino para calmarle y volver a los productos. Juristas recordaron que las estrías son intimidad corporal y que el artículo 1032 del Código Civil prohíbe obtener, invadir, divulgar o publicar información privada.", "ja": "10月25日の独身の日（ダブル11）のライブ配信で、黄子韜さんはコメント欄が妻・徐芸洋さんの妊娠線や帝王切開の傷跡を「証拠」として見せるよう繰り返し求めたため、販売を止めて応じた。「結婚して子どもがいるのが何か悪いのか」「妻に傷を見せろというのか。お前は誰だ」と述べた。徐さんは涙を流し、その後なだめて商品の話に戻した。法律関係者は、妊娠線は身体のプライバシーであり、民法第1032条が探り・侵入・漏えい・公開による侵害を禁じていると指摘する。"}, "why": {"zh": "隐私边界这次划得很清楚：索要产后伤口的照片，已经不属于「吃瓜」。但另一笔账也要分开算——反感他的粉丝，多数不满的不是结婚生子，而是此前一次次否认。两件事混在一起吵，谁都吵不明白。", "en": "The privacy line here is clear: demanding photos of a post-surgical wound is not gossip. But a second ledger should be kept separate — most of the fans who turned away were not angry about the marriage or the child, but about repeated earlier denials. Blending the two makes the argument unwinnable for everyone.", "es": "Aquí la frontera de la intimidad está clara: exigir fotos de una herida posoperatoria no es cotilleo. Pero hay otra cuenta que conviene separar: la mayoría de los seguidores que se alejaron no reprochaban el matrimonio ni el hijo, sino las negativas anteriores repetidas. Mezclar ambas cosas hace imposible el debate.", "ja": "ここでのプライバシーの線引きは明快だ。術後の傷の写真を求めるのは、もはやゴシップではない。ただし別の勘定も分けて考えるべきだ。離れたファンの多くが不満だったのは結婚や子どもではなく、それ以前の度重なる否定だった。二つを混ぜると、誰も議論を整理できない。"}}, {"idx": "03", "title": {"zh": "张智霖与许秋怡 33 年后同台唱《片片枫叶情》，袁咏仪台下录像", "en": "Chilam Cheung and Annie Hui Reunite After 33 Years for «Maple Leaf Love»", "es": "Chilam Cheung y Annie Hui se reencuentran 33 años después para cantar «Maple Leaf Love»", "ja": "張智霖と許秋怡が33年ぶりに共演 「片片楓葉情」を合唱"}, "body": {"zh": "近日佛山演唱会现场，张智霖时隔 33 年与昔日搭档许秋怡同台，合唱经典金曲《片片枫叶情》。两人当年是家喻户晓的荧幕金童玉女，此次同框相处坦荡自然，台下袁咏仪淡定录像，许秋怡家人也到场支持。全程没有刻意回避，被网友称为「成年人最体面的重逢」。相关片段在 25 日至 26 日间登上微博热搜。", "en": "At a Foshan concert, Chilam Cheung reunited with former screen partner Annie Hui after 33 years to sing the classic «Maple Leaf Love». The pair were once a celebrated on-screen couple; this time they shared the stage openly and easily, with Cheung's wife Anita Yuen filming calmly from the audience and Hui's family also present. There was no awkwardness, and netizens called it «the most dignified reunion adults can have». Clips trended on Weibo on the 25th and 26th.", "es": "En un concierto en Foshan, Chilam Cheung se reencontró 33 años después con su antigua pareja artística Annie Hui para cantar el clásico «Maple Leaf Love». Fueron una pareja televisiva muy popular; esta vez compartieron escenario con naturalidad, con la esposa de Cheung, Anita Yuen, grabando desde el público y la familia de Hui presente. Sin incomodidad, los internautas lo llamaron «el reencuentro más digno que pueden tener dos adultos». Los vídeos fueron tendencia en Weibo.", "ja": "佛山のコンサートで、張智霖が33年ぶりに往年のパートナー許秋怡と共演し、名曲「片片楓葉情」を歌った。二人はかつてお茶の間で人気の画面カップルだった。今回は自然体で同じ舞台に立ち、客席では妻の袁詠儀が落ち着いて撮影し、許の家族も駆けつけた。気まずさはなく、ネットでは「大人がいちばん品位を保てる再会」と評された。映像は25〜26日にWeiboのトレンド入りした。"}, "why": {"zh": "观众看的其实不是两个中年人，而是自己当年守在电视机前的那段时间。能把旧关系处理得不必回避、不必解释，本身是一种稀缺能力。", "en": "What the audience watched was not two middle-aged singers but the years they themselves spent in front of a television. Being able to handle an old relationship without evasion or explanation is a rare skill.", "es": "El público no miraba a dos cantantes de mediana edad, sino los años que él mismo pasó frente al televisor. Saber gestionar una relación antigua sin evasivas ni explicaciones es una habilidad escasa.", "ja": "観客が見ていたのは中年の二人ではなく、自分がテレビの前にいた時間そのものだ。昔の関係を、避けも説明もせずに扱えることは、それ自体が希少な能力である。"}}, {"idx": "04", "title": {"zh": "首部 AI 院线电影上映三天票房 115 万：证明了「行得通」，没证明「卖得动」", "en": "China's First AI Feature Film Takes 1.15 Million Yuan in Three Days: Proof It Works, Not That It Sells", "es": "El primer largometraje chino hecho con IA recauda 1,15 millones de yuanes en tres días", "ja": "中国初のAI長編映画、公開3日で興収115万元 「成立する」ことは示したが「売れる」ことは示せず"}, "body": {"zh": "国内首部拿到公映许可证的 AI 全流程院线长片《三星堆：未来往事》上映三天，截至 10 月 25 日晚累计票房约 115.2 万元，观影人次近 4 万，当日上座率低至 1.1%、场均 1.1 人。影片排片占比约 2%，制作成本千万级、耗时两年多、团队近百人，并未投入宣发费用。制片人蒋德富在特别放映活动上表示，「我们认真用现在的技术做了，它可能有很多问题，但下一部我们一定做得更好」。下一部 AI 电影《计划外：广寒行动》已开机。", "en": "Sanxingdui: Future Past, the first Chinese feature made entirely with AI to receive a theatrical release licence, has taken about 1.152 million yuan in three days to the evening of 25 October, with nearly 40,000 admissions; its occupancy rate that day was 1.1%, or about 1.1 people per screening. It holds roughly 2% of screens, cost in the tens of millions, took more than two years with a team of nearly 100, and had no marketing budget. Producer Jiang Defu told a special screening that the team used today's technology seriously and would do better next time. A second AI film has already started shooting.", "es": "Sanxingdui: Future Past, el primer largometraje chino íntegramente realizado con IA que obtiene licencia de estreno, lleva unos 1,152 millones de yuanes en tres días hasta la noche del 25, con casi 40.000 espectadores y una ocupación del 1,1% ese día (1,1 personas por sesión). Ocupa cerca del 2% de las salas, costó decenas de millones, requirió más de dos años y casi 100 personas, y no tuvo presupuesto de promoción. El productor Jiang Defu dijo en una proyección especial que usaron la tecnología actual con seriedad y que la próxima saldrá mejor. Un segundo filme de IA ya está en rodaje.", "ja": "中国で初めて上映許可を得たAI全工程の長編『三星堆：未来往事』は、10月25日夜までに3日間で約115.2万元の興収、観客は約4万人。同日の入場率は1.1%、1回あたり1.1人だった。上映館シェアは約2%、制作費は数千万円規模、2年以上と約100人の体制で、宣伝費は投じていない。製作の蒋徳富氏は特別上映で「今の技術で真剣に作った。問題は多いが、次は必ず良くする」と述べた。次のAI映画は既に撮影に入っている。"}, "why": {"zh": "115 万这个数字的意义不在票房，而在它把「AI 电影」从概念拉到了账本上：全流程跑通是真的，观众愿意为「AI 做的」买单是假的。第二部紧接着开机，说明资本赌的不是这一部的票房，是三年后的成本曲线。", "en": "The point of 1.15 million is not the box office but that it drags «AI film» from concept onto a ledger: the pipeline works, but audiences will not pay for the label alone. That a second film started immediately shows capital is betting on the cost curve in three years, not on this film's takings.", "es": "El significado de 1,15 millones no está en la taquilla, sino en que lleva el «cine con IA» del concepto a la contabilidad: el proceso completo funciona, pero el público no paga por la etiqueta. Que la segunda película haya arrancado de inmediato indica que el capital apuesta por la curva de costes a tres años, no por esta recaudación.", "ja": "115万元の意味は興収ではなく、「AI映画」を概念から収支表へ引き下ろしたことにある。全工程は回るが、観客は「AI製」という看板だけでは払わない。すぐ次作が撮影に入ったのは、資本がこの作品の興収ではなく3年後のコスト曲線に賭けているからだ。"}}, {"idx": "05", "tag": {"zh": "进展"}, "title": {"zh": "肖战「出口·我们」南京站收官：裸眼 3D 舞台与那句「记得低谷时的守护」", "en": "Xiao Zhan Closes the Nanjing Run of His Tour With a Naked-Eye 3D Stage", "es": "Xiao Zhan cierra en Nankín su gira con un escenario 3D sin gafas", "ja": "肖战「出口・我们」南京公演が終幕 裸眼3Dの舞台と「低谷期の支え」への言及"}, "body": {"zh": "肖战「出口·我们」巡回演唱会南京站于 10 月 23 日、25 日两场演出后收官。舞台采用裸眼 3D 舞美，视觉层次成为现场讨论焦点；互动环节他回顾了多年前低谷时期粉丝的守候，被现场观众描述为当晚最安静的一分钟。此前该站二开想看人数达 569.5 万，实行强实名、不退不换的购票规则。演出结束后，他回复了同行演员史彭元的留言，相关话题登上热搜。", "en": "Xiao Zhan's «Exit · Us» tour closed its Nanjing stop after shows on 23 and 25 October. The stage used naked-eye 3D design, and its visual layering dominated discussion; during the interaction segment he looked back on fans who stayed with him during a low period years ago, which attendees described as the quietest minute of the night. Demand for the second ticket release reached 5.695 million «want to attend» markers, under strict real-name, no-refund, no-exchange rules. After the show he replied to a message from fellow actor Shi Pengyuan, sending the topic trending.", "es": "La gira «Exit · Us» de Xiao Zhan cerró su etapa de Nankín tras las funciones del 23 y el 25 de octubre. El escenario usó diseño 3D sin gafas y su profundidad visual centró las conversaciones; en el segmento interactivo recordó a los fans que lo acompañaron en una etapa baja años atrás, descrito por el público como el minuto más silencioso de la noche. La segunda venta de entradas alcanzó 5,695 millones de marcadores de interés, con reglas estrictas de nombre real y sin devolución. Tras el concierto respondió a un mensaje del actor Shi Pengyuan y el tema se volvió tendencia.", "ja": "肖戦のツアー「出口・我们」は10月23日と25日の南京公演で幕を閉じた。舞台は裸眼3Dの美術で、その視覚的な奥行きが話題の中心に。交流コーナーでは何年も前の低迷期に寄り添ったファンに触れ、来場者は「その夜で最も静かな1分」と語った。2次販売の「見たい」数は569.5万件に達し、厳格な実名制で返金・交換不可のルールだった。終演後、俳優の史彭元のコメントに返信し、関連話題がトレンド入りした。"}, "why": {"zh": "演唱会市场今年最明显的变化，是「舞美」正在取代「歌单」成为讨论入口：观众先被视觉震住，再去评价唱功。而真正让人记住的，往往还是那句不讲技巧的话。", "en": "The clearest shift in the concert market this year is that stage design has replaced the setlist as the entry point for discussion: audiences are stunned visually first, then judge the singing. What lingers, though, is usually the line delivered without technique.", "es": "El cambio más claro del mercado de conciertos este año es que la escenografía ha sustituido al repertorio como puerta de entrada al debate: el público se impresiona primero y luego juzga el canto. Lo que perdura suele ser la frase dicha sin técnica.", "ja": "今年のコンサート市場で最もはっきりした変化は、舞台美術がセットリストに代わって議論の入口になったことだ。観客はまず視覚で驚き、それから歌唱を評価する。だが記憶に残るのは、技巧を排した一言であることが多い。"}}]}], "risk": {"zh": "风险提示：本简报仅作信息汇总，其中涉及的数据不构成任何投资建议。", "en": "Disclaimer: This briefing is a news digest only. Data mentioned does not constitute any investment advice.", "es": "Aviso: este resumen es solo una recopilación informativa; los datos citados no constituyen asesoramiento de inversión.", "ja": "リスク表示：本ダイジェストは情報まとめであり、記載データは投資助言を構成しません。"}}/*__END__*/;

      inner = esc(title.slice(0, i)) + '<span class="hl">' + esc(hl) + "</span>" + esc(title.slice(i + hl.length));
    }
    return '<a class="lk" href="' + bing(title) + '" target="_blank" rel="noopener">' + inner + "</a>";
  }

  /* ===== 语言检测：localStorage > 浏览器语言 > 系统时区 > 中文 ===== */
  function detectLang() {
    try { var s = localStorage.getItem("timab_lang"); if (s && LANGS.indexOf(s) >= 0) return s; } catch (e) {}
    var nav = (navigator.language || "").toLowerCase();
    if (/^zh/.test(nav)) return "zh";
    if (/^ja/.test(nav)) return "ja";
    if (/^es/.test(nav)) return "es";
    if (/^en/.test(nav)) return "en";
    var tz = "";
    try { tz = Intl.DateTimeFormat().resolvedOptions().timeZone || ""; } catch (e) {}
    if (/^Asia\/Tokyo/.test(tz)) return "ja";
    if (/Europe\/Madrid|America\/(Mexico_City|Bogota|Lima|Santiago|Caracas|Guatemala|La_Paz|San_Jose|Panama|Asuncion|Montevideo|Havana|El_Salvador|Managua|Tegucigalpa|Costa_Rica|San_Salvador)|America\/Argentina\//.test(tz)) return "es";
    if (/^(Europe|America|Australia)\//.test(tz)) return "en";
    return "zh";
  }

  var curLang = "zh";
  var langOpen = false;

  /* ===== 渲染 ===== */
  function renderChrome(lang) {
    var i18n = I18N[lang];
    document.documentElement.lang = LANG_HTML[lang];
    // 报头信息行
    var metaEl = document.getElementById("metaRow");
    if (metaEl) metaEl.textContent = T(BRIEFING.meta, lang);
    // 大日期
    var md = document.getElementById("mastDate");
    if (md) {
      var d = new Date(BRIEFING.date + "T00:00:00");
      md.innerHTML = fmtDate(d, lang) + "<small>" + esc(i18n.dateSub) + "</small>";
    }
    // 文档标题
    var siteName = (lang === "zh") ? "提马早报" : "TIMAB DAILY";
    document.title = siteName + " · " + fmtDate(new Date(BRIEFING.date + "T00:00:00"), lang);
    // 导航签
    var nav = document.getElementById("navChips");
    if (nav) {
      var order = ["pick"].concat(BRIEFING.sections.map(function (s) { return s.key; }));
      nav.innerHTML = "";
      order.forEach(function (key) {
        if (key === "pick") {
          var a = document.createElement("a");
          a.className = "chip-pick"; a.href = "#pick"; a.setAttribute("data-nav", "pick");
          a.textContent = T(BRIEFING.spotlight.badge, lang);
          nav.appendChild(a);
        } else {
          var sec = null;
          BRIEFING.sections.forEach(function (s) { if (s.key === key) sec = s; });
          if (!sec) return;
          var b = document.createElement("a");
          b.href = "#" + key; b.setAttribute("data-nav", key);
          b.style.borderColor = sec.color; b.style.color = sec.deep;
          b.textContent = T(sec.name, lang);
          nav.appendChild(b);
        }
      });
    }
    // 日历文案
    var cb = document.getElementById("calBtnText"); if (cb) cb.textContent = i18n.calBtn;
    var cw = document.getElementById("calWeek");
    if (cw) { cw.innerHTML = ""; i18n.calWeek.forEach(function (w) { var s = document.createElement("span"); s.textContent = w; cw.appendChild(s); }); }
    var cf = document.getElementById("calFoot"); if (cf) cf.textContent = i18n.calFoot;
    // 语言切换器（国旗触发 + 下拉）
    var ls = document.getElementById("langSwitch");
    if (ls) {
      ls.className = "lang-switch" + (langOpen ? " open" : "");
      ls.innerHTML = "";
      var trig = document.createElement("button");
      trig.type = "button"; trig.className = "lang-trigger"; trig.id = "langTrigger";
      trig.setAttribute("aria-haspopup", "true");
      trig.setAttribute("aria-expanded", langOpen ? "true" : "false");
      trig.innerHTML = flag(curLang) + '<span class="caret">▾</span>';
      trig.addEventListener("click", function (e) {
        e.stopPropagation();
        langOpen = !langOpen;
        ls.classList.toggle("open", langOpen);
        trig.setAttribute("aria-expanded", langOpen ? "true" : "false");
      });
      ls.appendChild(trig);
      var menu = document.createElement("div");
      menu.className = "lang-menu"; menu.setAttribute("role", "menu");
      LANGS.forEach(function (l) {
        var item = document.createElement("button");
        item.type = "button"; item.className = "lang-item" + (l === curLang ? " sel" : "");
        item.setAttribute("role", "menuitem"); item.setAttribute("data-lang", l);
        item.innerHTML = flag(l) + '<span class="lbl">' + LANG_LABEL_FULL[l] + "</span>";
        item.addEventListener("click", function (e) {
          e.stopPropagation();
          setLang(l);
        });
        menu.appendChild(item);
      });
      ls.appendChild(menu);
    }
  }

  function renderContent(lang) {
    var i18n = I18N[lang];
    var html = "";
    // 精选
    var sp = BRIEFING.spotlight;
    html += '<section class="spotlight" id="pick">'
      + '<div class="badge"><i></i>' + esc(T(sp.badge, lang)) + "</div>"
      + "<h2>" + titleHtml(sp.title, sp.hl, lang) + "</h2>"
      + '<div class="body">' + esc(T(sp.body, lang)) + "</div>"
      + '<div class="why"><b>' + esc(i18n.why) + "</b>" + esc(T(sp.why, lang)) + "</div>"
      + "</section>";
    // 分类
    html += '<div class="grid">';
    BRIEFING.sections.forEach(function (sec) {
      html += '<section class="card" id="' + sec.key + '" style="--ac:' + sec.color + "; --ac-deep:" + sec.deep + ';">'
        + '<div class="sec-head"><span class="sec-num">' + sec.num + "</span>"
        + "<h3>" + esc(T(sec.name, lang)) + "</h3>"
        + '<span class="en">' + sec.key.toUpperCase() + "</span></div>";
      (sec.items || []).forEach(function (it) {
        html += '<div class="item">';
        html += '<div class="t"><span class="idx">' + it.idx + "</span>";
        if (it.tag) html += '<span class="tag">' + esc(it.tag[lang] != null ? it.tag[lang] : i18n.tag) + "</span>";
        html += titleHtml(it.title, it.hl, lang) + "</div>";
        html += '<div class="d">' + esc(T(it.body, lang)) + "</div>";
        html += '<div class="why"><b>' + esc(i18n.why) + "</b>" + esc(T(it.why, lang)) + "</div>";
        html += "</div>";
      });
      html += "</section>";
    });
    html += "</div>";
    var content = document.getElementById("content");
    if (content) content.innerHTML = html;
    // 页脚
    var risk = document.getElementById("risk");
    if (risk) risk.textContent = T(BRIEFING.risk, lang);
  }

  function setLang(lang) {
    if (LANGS.indexOf(lang) < 0) lang = "zh";
    curLang = lang;
    langOpen = false;
    try { localStorage.setItem("timab_lang", lang); } catch (e) {}
    renderChrome(lang);
    renderContent(lang);
  }

  /* ===== 往期日历（保留原逻辑，文案随语言） ===== */
  function initCalendar() {
    var btn = document.getElementById("calBtn");
    var pop = document.getElementById("calPop");
    var grid = document.getElementById("calGrid");
    var title = document.getElementById("calTitle");
    if (!btn || !pop || !grid || !title) return;

    var parts = BRIEFING.date.split("-");
    var todayKey = parts[0].slice(2) + parts[1] + parts[2];
    var cur = { y: +parts[0], m: +parts[1] };
    var has = {};
    for (var i = 0; i < ARCHIVE_DATES.length; i++) { has[ARCHIVE_DATES[i]] = 1; }
    var HIST_BASE = /\/history\//.test(location.pathname) ? "./" : "history/";

    function ckey(y, m, d) { return String(y).slice(2) + pad(m) + pad(d); }

    function render() {
      var i18n = I18N[curLang];
      title.textContent = i18n.calTitle(cur.y, cur.m);
      grid.innerHTML = "";
      var start = new Date(cur.y, cur.m - 1, 1).getDay();
      var days = new Date(cur.y, cur.m, 0).getDate();
      for (var b = 0; b < start; b++) {
        var blank = document.createElement("span");
        blank.className = "cal-cell is-empty"; grid.appendChild(blank);
      }
      for (var d = 1; d <= days; d++) {
        var k = ckey(cur.y, cur.m, d);
        var cell = document.createElement("span");
        cell.className = "cal-cell" + (has[k] ? " has" : "") + (k === todayKey ? " is-today" : "");
        cell.textContent = d;
        if (has[k]) {
          cell.setAttribute("role", "link"); cell.setAttribute("tabindex", "0");
          cell.title = cur.y + "-" + pad(cur.m) + "-" + pad(d) + " 存档";
          (function (target) {
            var go = function () { window.open(HIST_BASE + target + ".html", "_blank", "noopener"); };
            cell.addEventListener("click", go);
            cell.addEventListener("keydown", function (e) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); go(); } });
          })(k);
        }
        grid.appendChild(cell);
      }
    }
    function toggle(open) {
      pop.hidden = !open;
      btn.setAttribute("aria-expanded", open ? "true" : "false");
      if (open) render();
    }
    btn.addEventListener("click", function (e) { e.stopPropagation(); toggle(pop.hidden); });
    document.getElementById("calPrev").addEventListener("click", function () { cur.m--; if (cur.m < 1) { cur.m = 12; cur.y--; } render(); });
    document.getElementById("calNext").addEventListener("click", function () { cur.m++; if (cur.m > 12) { cur.m = 1; cur.y++; } render(); });
    document.addEventListener("click", function (e) { if (!pop.hidden && !pop.contains(e.target)) toggle(false); });
    document.addEventListener("keydown", function (e) { if (e.key === "Escape" && !pop.hidden) toggle(false); });
  }

  /* ===== 启动 ===== */
  function boot() {
    curLang = detectLang();
    renderChrome(curLang);
    renderContent(curLang);
    initCalendar();
    // 关闭语言下拉：点击外部 / Esc
    document.addEventListener("click", function (e) {
      var ls = document.getElementById("langSwitch");
      if (ls && langOpen && !ls.contains(e.target)) {
        langOpen = false;
        ls.classList.remove("open");
        var t = document.getElementById("langTrigger");
        if (t) t.setAttribute("aria-expanded", "false");
      }
    });
    document.addEventListener("keydown", function (e) {
      if (e.key === "Escape" && langOpen) {
        langOpen = false;
        var ls = document.getElementById("langSwitch");
        if (ls) ls.classList.remove("open");
        var t = document.getElementById("langTrigger");
        if (t) t.setAttribute("aria-expanded", "false");
      }
    });
  }
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", boot);
  } else { boot(); }
})();
</script>
