metro abierto, a un yuan el ejemplar, sobre todo con tramas de «renacer», «venganza» y «jefe multimillonario». La investigación del 27 de noviembre halló productos mal acabados y con fuerte olor a tinta, etiquetados como juguete pero en realidad ficción ilustrada continua; el fabricante indicado en el envase no se pudo localizar y no hay ISBN. La autoridad de cultura y turismo del distrito de desarrollo de Cantón dijo que verificará y tomará muestras antes de actuar. A la fecha, los anuncios han desaparecido de varias plataformas. Los abogados señalan infracción de derechos y publicación ilegal sin ISBN ni revisión editorial.", "ja": "11 月中下旬以降、「紙のショートドラマ」と呼ばれる折りたたみ冊子が各地の小学生に広がっている。縦型ショートドラマの画面と台詞を物語順に印刷したアコーディオン折りで、閉じれば手のひら大、開けば 50 センチにもなり、1 冊 1 元。題材は「転生」「逆襲」「御曹司」が多い。11 月 27 日の取材では、作りは粗くインクの臭いが強く、玩具の表示ながら実質は連続ストーリーの図書で、包装の製造者名は追跡できず、ISBN もない。広州開発区の文化観光当局は、通報を受けて確認・鑑定のうえ法に基づき対応するとした。記事執筆時点で複数の EC サイトから商品リンクは消えている。弁護士は著作権侵害と、ISBN も編集審査もない違法出版物にあたると指摘する。"}, "why": {"zh": "它火起来的原因很具体：中小学生原则上不能带手机进校，于是「不用充电、不用联网、合上能夹进课本」的阅读产品补上了这个空档。真正的问题不是「小人书回潮」，而是内容脱离了平台的风控与分级——网络短剧有未成年模式，印到纸上就什么都没有了。下架商品只是第一步，校园周边的小卖部才是下一道关口。", "en": "The reason it spread is concrete: pupils are in principle barred from bringing phones to school, so a product that needs no charging, no connection and folds into a textbook filled the gap. The real problem is not a revival of comic books but content escaping platform risk controls and age ratings: short dramas have minor mode, print has nothing. Pulling listings is only step one; the tuck shops around schools are the next checkpoint.", "es": "La razón de su éxito es concreta: los alumnos no pueden llevar el móvil al colegio, así que un producto que no necesita batería ni conexión y cabe doblado en el libro de texto llenó ese hueco. El problema real no es el regreso del tebeo, sino que el contenido escapa a los controles y la clasificación por edad de las plataformas: las series tienen modo menor, el papel no tiene nada. Retirar los anuncios es solo el primer paso; las tiendas junto a los colegios son el siguiente control.", "ja": "広がった理由は具体的だ。小中学生は原則として携帯電話を学校に持ち込めない。だから充電も通信も不要で、閉じれば教科書に挟める読物が空白を埋めた。本当の問題は「漫画本の回帰」ではなく、内容がプラットフォームの風控・年齢区分から外れることにある。配信には未成年モードがあるが、紙になった瞬間に何もなくなる。販売停止は第一歩にすぎず、学校周辺の小店が次の関門になる。"}}, {"idx": "02", "tag": {"zh": "进展"}, "title": {"zh": "三只松鼠 12 人间毛坯宿舍曝光，一夜整改反而让人唏嘘", "en": "Dorm exposé forces an overnight fix at Three Squirrels, and that is the problem", "es": "Un dormitorio de 12 literas obliga a Three Squirrels a corregir en una noche", "ja": "三只松鼠、12 人部屋の寮が問題に 一晩で改善したことがかえって議論を呼ぶ"}, "body": {"zh": "11 月 25 日，一名自称安徽芜湖三只松鼠员工的账号发布视频，反映公司宿舍条件差、疑似由闲置厂房改造：一间房摆 12 张上下铺，公共洗漱间是水泥砌成的长条水池，地面接近毛坯，饮水机旁垃圾无人清理，门口两台洗衣机需付费使用、45 分钟 4 元。11 月 26 日晚，三只松鼠发布致歉声明，称涉事宿舍系旺季用工人员周转宿舍、为年货节期间临时启用，确实存在设施配置简陋问题，已立即对相关人员进行妥善转移安置，后续将完善住宿保障机制。11 月 27 日，当事员工称已搬入四人间、带独立卫生间。公司前三季度营收 73.22 亿元、同比下滑 5.63%，归母净利润 2.57 亿元、同比增长 59.71%。", "en": "On 25 November an account identifying itself as a Three Squirrels employee in Wuhu, Anhui, posted video of poor dormitory conditions, apparently converted from disused factory space: 12 bunk beds in one room, a long concrete wash trough, floors close to bare concrete, rubbish piled beside the water dispenser, and two washing machines charging 4 yuan per 45 minutes. On the evening of 26 November the snack maker apologised, saying the rooms were temporary quarters for peak-season workers during New Year stockpiling, that facilities were indeed rudimentary, that staff had been immediately rehoused to standard, and that housing safeguards would be improved. On 27 November the employee said they had moved to a four-person room with a private bathroom. The company's revenue fell 5.63% to 7.32 billion yuan in the first three quarters while net profit rose 59.71% to 257 million.", "es": "El 25 de noviembre una cuenta que se identificó como empleado de Three Squirrels en Wuhu (Anhui) publicó un vídeo sobre las malas condiciones del dormitorio, al parecer reconvertido desde una nave en desuso: 12 literas en una habitación, una pila corrida de hormigón, suelos casi sin acabado, basura junto al dispensador de agua y dos lavadoras que cobran 4 yuanes por 45 minutos. La noche del 26 la empresa se disculpó: las habitaciones eran alojamiento temporal para personal de temporada alta durante el acopio de Año Nuevo, las instalaciones eran efectivamente precarias, el personal fue reubicado de inmediato en condiciones estándar y se mejorarían los mecanismos de alojamiento. El 27 el empleado dijo que ya vivía en una habitación cuádruple con baño privado. En los tres primeros trimestres los ingresos cayeron un 5,63% hasta 7.320 millones de yuanes y el beneficio neto subió un 59,71% hasta 257 millones.", "ja": "11 月 25 日、安徽省蕪湖の三只松鼠の従業員と名乗るアカウントが、寮の劣悪な環境を動画で投稿した。使われなくなった工場を転用したとみられ、1 室に 2 段ベッド 12 台、共用洗面所はコンクリートの長い水槽、床は打ちっぱなしに近く、給水器の横にごみが放置され、入口の洗濯機 2 台は 45 分 4 元の有料。11 月 26 日夜、同社は謝罪声明を出し、該当の寮は繁忙期の作業員向け一時宿舎で年貨節の期間だけ使っていたものの、設備が確かに貧弱だったと認め、直ちに適切な場所へ移した上で宿舎の保障体制を整えるとした。27 日、従業員は 4 人部屋で専用バス付きに移ったと述べた。同社の 1〜9 月の売上高は 73.22 億元で 5.63％減、純利益は 2.57 億元で 59.71％増。"}, "why": {"zh": "整改只用了一个晚上，恰恰说明问题不是「做不到」，而是「没当回事」。三只松鼠把公寓住宿写进「全生命周期关怀体系」，校招社招里叫「松鼠公寓」，而旺季工住的是厂房改造的 12 人间——同一家公司、同一片园区，两套标准。真正消耗信任的不是这次曝光，而是「舆论关注时雷厉风行，没人盯着就得过且过」这种选择性整改。", "en": "That the fix took one night proves the problem was never capability but attention. Three Squirrels writes dormitory housing into its «full-lifecycle care system» and calls it «Squirrel Apartments» in recruitment, while peak-season workers got a converted factory floor at 12 to a room — same company, same campus, two standards. What erodes trust is not the exposé but selective remediation: swift when cameras are on, tolerant when nobody looks.", "es": "Que la corrección llevara una sola noche demuestra que el problema nunca fue de capacidad sino de atención. Three Squirrels incluye el alojamiento en su «sistema de cuidado de ciclo completo» y lo llama «Squirrel Apartments» en sus anuncios, mientras los trabajadores de temporada alta dormían en una nave convertida, 12 por habitación: misma empresa, mismo recinto, dos estándares. Lo que erosiona la confianza no es la denuncia, sino la corrección selectiva: rápida cuando hay cámaras, tolerante cuando nadie mira.", "ja": "改善に一晩しかかからなかったことが、問題が「できない」ことではなく「気にしていない」ことだった証拠だ。同社は寮を「全ライフサイクルのケア体系」に掲げ、採用では「リス・アパート」と呼ぶ。一方で繁忙期の作業員は工場を転用した 12 人部屋だった。同じ会社、同じ敷地に二つの基準。信頼を削るのは今回の暴露ではなく、「注目されれば素早く、見られなければそのまま」という選択的な改善のほうだ。"}}, {"idx": "03", "title": {"zh": "「航天员说要证明地球是平的」系音轨篡改，原采访无此表述", "en": "Viral claim that the Pakistani astronaut would «prove Earth is flat» is a faked audio track", "es": "El vídeo que atribuye al astronauta paquistaní «probar que la Tierra es plana» tiene el audio manipulado", "ja": "「宇宙で地球が平らだと証明」は音声差し替え 元インタビューに発言なし"}, "body": {"zh": "神舟二十四号发射后，海外社交平台流传一段视频，声称巴基斯坦航天员穆罕默德·齐尚·阿里在采访中表示「将前往太空证明地球是平的」。经核查，网传视频画面取自中国国际电视台 11 月 24 日发布的采访原片，从 36 秒处开始，但音频内容与原始采访并不一致，音画明显不同步，属后期替换音轨的拼接造假。原采访中，齐尚·阿里表示这次任务「不是终点，而是一个新的起点」，希望中巴太空合作从一名航天员、一次飞行发展到多次联合飞行，迈向月球、火星以及更深的深空，近期多个采访报道中均无与「地平说」相关的表述。", "en": "After the Shenzhou-24 launch, a video circulated on overseas social platforms claiming Pakistani astronaut Muhammad Zeeshan Ali had said in an interview that he was going to space «to prove the Earth is flat». Verification found the footage was taken from a CGTN interview published on 24 November, starting at 36 seconds, but the audio does not match the original and is plainly out of sync with the lips: the track was replaced afterwards. In the original, Zeeshan Ali says the mission is «not an endpoint but a new starting point», and hopes China-Pakistan cooperation will grow from one astronaut and one flight to repeated joint missions toward the Moon, Mars and deeper space. No recent interview contains any flat-Earth remark.", "es": "Tras el lanzamiento de la Shenzhou-24 circuló en redes sociales extranjeras un vídeo que atribuía al astronauta paquistaní Muhammad Zeeshan Ali la frase de que iba al espacio «a demostrar que la Tierra es plana». La verificación halló que las imágenes proceden de una entrevista de CGTN publicada el 24 de noviembre, desde el segundo 36, pero el audio no coincide con el original y está claramente desincronizado: la pista fue sustituida. En la entrevista original, Zeeshan Ali dice que la misión «no es un final sino un nuevo punto de partida» y confía en que la cooperación sino-paquistaní pase de un astronauta y un vuelo a misiones conjuntas repetidas hacia la Luna, Marte y el espacio profundo. Ninguna entrevista reciente contiene tal afirmación.", "ja": "神舟二十四号の打ち上げ後、海外の SNS で「パキスタン人宇宙飛行士が宇宙で地球が平らだと証明すると語った」とする動画が拡散した。検証の結果、映像は中国国際電視台が 11 月 24 日に公開したインタビューの 36 秒目以降の部分だが、音声は元の内容と一致せず、口の動きとも明らかにずれており、後から音声を差し替えた捏造だった。元のインタビューでムハンマド・ゼーシャン・アリ氏は、今回の任務は「終点ではなく新たな出発点」であり、中国とパキスタンの協力が 1 人の飛行士・1 回の飛行から複数回の共同飛行へ、月や火星、さらに深宇宙へ広がることを望むと述べている。「地球平面説」に関する発言はどのインタビューにもない。"}, "why": {"zh": "这类造假的门槛已经低到只需要一段公开画面加一段配音：真人真场景，只有声音是假的，肉眼几乎无法分辨。它挑的正是热点窗口——神舟二十四号发射、首位外籍航天员进驻天宫。识别方法其实很朴素：看口型对不对得上、回到权威媒体的原始素材、遇到违背常识的劲爆言论先别转发。", "en": "The barrier to this kind of fakery is now just a public clip plus a voice track: real people, real scenes, only the sound is false, and the eye can barely tell. It targets the hottest window — the Shenzhou-24 launch and the first foreign astronaut aboard Tiangong. The checks are simple: do the lips match, go back to the original material from an authoritative outlet, and do not forward explosive claims that defy common sense.", "es": "La barrera para este tipo de falsificación es ya solo un clip público y una pista de voz: personas reales, escenas reales, solo el sonido es falso, y el ojo apenas lo distingue. Apunta a la ventana más caliente: el lanzamiento de la Shenzhou-24 y el primer astronauta extranjero en Tiangong. Las comprobaciones son simples: si los labios coinciden, volver al material original de un medio autorizado y no reenviar afirmaciones estridentes que desafían el sentido común.", "ja": "この種の偽造の敷居は、公開映像と音声があれば済むところまで下がった。人物も場景も本物で、嘘なのは声だけ、目ではほとんど判別できない。狙われたのはまさに話題の窓口、神舟二十四号の打ち上げと初の外国籍飛行士の天宮入りだ。見分け方は素朴でよい。口の動きが合うか、権威ある媒体の元素材に戻る、常識に反する過激な発言はまず転送しない。"}}, {"idx": "04", "title": {"zh": "有记录以来最强厄尔尼诺进入峰值期，12 月初大回暖后迎强冷空气", "en": "Strongest El Niño on record nears peak: a warm spell, then a cold snap", "es": "El Niño más fuerte registrado llega a su pico: calor récord y luego frío", "ja": "観測史上最強のエルニーニョがピーク期に 12 月初めの暖気の後に強い寒気"}, "body": {"zh": "国家气候中心监测显示，2026 年 9 月形成的这次超强厄尔尼诺事件已进入强度峰值期：8 至 10 月关键海区海温距平指数的三个月滑动平均值达 2.96℃，超过 2014 至 2016 年那次事件的峰值 2.8℃，成为 1950 年有监测记录以来最强的一次；预计 10 至 12 月持续处于峰值期，强度约 3.3 至 3.5℃，2027 年 1 月起逐步衰减。首席预报员赵俊虎表示，峰值期不等于影响峰值期，影响会持续到明年春夏季，2027 年夏季我国气候受其影响会比 2026 年更显著。中央气象台预计，11 月 30 日至 12 月 1 日最高气温 20℃ 线北抬到河南北部、山东一带；12 月 3 日至 5 日强冷空气来袭，中东部大部降温 6 至 10℃、华北东北部分地区超过 12℃，12 月 2 日至 5 日中东部还将出现大范围雨雪。", "en": "Monitoring by the National Climate Centre shows the super El Niño that formed in September 2026 has entered its peak: the three-month running mean of sea-surface temperature anomalies in the key region reached 2.96°C for August-October, above the 2.8°C peak of the 2014-2016 event and the strongest since records began in 1950. It is expected to stay near peak from October to December at about 3.3-3.5°C and weaken from January 2027. Chief forecaster Zhao Junhu says the peak of the event is not the peak of its impact, which will last into next spring and summer, with China's climate more affected in summer 2027 than in 2026. The national meteorological centre expects the 20°C maximum-temperature line to shift north to northern Henan and Shandong on 30 November-1 December, then strong cold air on 3-5 December bringing 6-10°C drops across central and eastern China, more than 12°C in parts of north and northeast China, plus widespread rain and snow on 2-5 December.", "es": "El Centro Nacional del Clima indica que el super El Niño formado en septiembre de 2026 ha entrado en su pico: la media móvil de tres meses de las anomalías de temperatura superficial en la región clave llegó a 2,96 °C entre agosto y octubre, por encima del pico de 2,8 °C del evento de 2014-2016 y el más fuerte desde que hay registros en 1950. Se espera que siga cerca del pico de octubre a diciembre, en torno a 3,3-3,5 °C, y que se debilite desde enero de 2027. El pronosticador jefe Zhao Junhu señala que el pico del evento no es el pico de su impacto, que durará hasta la próxima primavera y verano, con un clima chino más afectado en el verano de 2027 que en 2026. El centro meteorológico espera que la línea de 20 °C de máxima suba al norte de Henan y Shandong el 30 de noviembre y el 1 de diciembre, y que una masa de aire frío llegue el 3-5 de diciembre con descensos de 6-10 °C en el centro y este, más de 12 °C en el norte y noreste, y amplias lluvias y nieves el 2-5 de diciembre.", "ja": "国家気候センターの監視によれば、2026 年 9 月に発生した超強力エルニーニョは強度のピーク期に入った。8〜10 月の主要海域の海面水温偏差の 3 か月移動平均は 2.96℃に達し、2014〜2016 年のピーク 2.8℃を上回り、1950 年の観測開始以来最強となった。10〜12 月はピーク期が続き強度は約 3.3〜3.5℃、2027 年 1 月から徐々に減衰する見込み。趙俊虎主席予報官は、事象のピークは影響のピークではなく、影響は来年の春夏季まで続き、2027 年夏の中国の気候は 2026 年より顕著に影響を受けると述べた。中央気象台は、11 月 30 日〜12 月 1 日に最高気温 20℃ の線が河南省北部・山東省一带まで北上し、12 月 3〜5 日に強い寒気が来て中東部の多くで 6〜10℃、華北・東北の一部で 12℃ 以上下がり、12 月 2〜5 日には広範囲の雨雪となると予想している。"}, "why": {"zh": "「最强」这个词容易被读成「今年冬天特别冷」，实际结论相反：今冬总体偏暖，但冷暖起伏大、寒潮频次偏多，12 月和 1 月强升温和强降温会轮流出现。更该提前记住的是时间差——厄尔尼诺的影响有滞后，真正的压力测试在明年主汛期和 2027 年夏季，长江中下游的洪涝风险与南方高温都比这个冬天更值得准备。", "en": "The word «strongest» is easily read as «a very cold winter», but the conclusion is the opposite: this winter is overall mild, with big swings and more frequent cold waves, as sharp warming and sharp cooling take turns in December and January. What is worth remembering is the lag — El Niño's effects arrive late, and the real stress test comes in next year's flood season and the summer of 2027, when flood risk along the middle and lower Yangtze and heat in the south deserve more preparation than this winter.", "es": "La palabra «más fuerte» se lee fácilmente como «un invierno muy frío», pero la conclusión es la contraria: este invierno es en conjunto suave, con grandes oscilaciones y más olas de frío, alternando calentamientos y enfriamientos bruscos en diciembre y enero. Lo que conviene recordar es el desfase: los efectos de El Niño llegan tarde y la verdadera prueba de esfuerzo está en la próxima temporada de lluvias y en el verano de 2027, cuando el riesgo de inundaciones en el curso medio y bajo del Yangtsé y el calor en el sur merecen más preparación que este invierno.", "ja": "「最強」という言葉は「今冬は特に寒い」と読まれやすいが、結論は逆だ。今冬は全体として暖かく、寒暖の振れが大きく寒波の回数も多い。12 月と 1 月には急な昇温と急な降温が交互に来る。覚えておくべきは時間差である。エルニーニョの影響は遅れて現れ、本当の試練は来年の主汛期と 2027 年の夏に来る。長江中下流の洪水リスクと南方の高温は、この冬以上に備える価値がある。"}}, {"idx": "05", "title": {"zh": "「洪荒少女」悄悄上岸：傅园慧说退役后三个月几乎不出门", "en": "From «prehistoric power» to the lectern: Fu Yuanhui on three months indoors", "es": "De «fuerza prehistórica» a la tarima: Fu Yuanhui y sus tres meses encerrada", "ja": "「洪荒の少女」から教壇へ 傅園慧、引退後 3 か月ほとんど外出せず"}, "body": {"zh": "近日播客对谈中，傅园慧自述退役后整整三个月几乎不出门：游泳曾是她生活的全部，赛程骤然清空后陷入漫长迷茫，她伴着凄凉歌曲反复哭到脱敏，冷静后用文字复盘、不向外归咎。她坦言不愿回看自己的采访，觉得镜头前的自己「傻气」，但坚持镜头前不演。2025 年初，她正式入职浙江大学成为一名游泳教师；教了近两年后，她判断自己进步的标准很朴素——教会学生游泳的速度越来越快、动作越来越流畅。她把「洪荒之力」还原为「全力以赴」，称运动员生涯的洪荒之力已经结束，人生还会有新的、更温柔的洪荒之力。", "en": "In a recent podcast conversation, Fu Yuanhui said she barely left home for three months after retiring: swimming had been her whole life, and once the calendar emptied she fell into a long haze. She cried to melancholy songs until the feeling dulled, then reviewed things in writing rather than blaming others. She admitted she cannot bear to watch her old interviews, finding herself «silly» on camera, but insists she never performed for it. In early 2025 she joined Zhejiang University as a swimming teacher; nearly two years on, her yardstick for progress is plain — students learn faster and move better. She reduces «prehistoric power» to «going all out», saying that force belonged to her athletic career and life will bring a gentler version.", "es": "En una conversación reciente en pódcast, Fu Yuanhui contó que apenas salió de casa durante tres meses tras retirarse: la natación era toda su vida y, al vaciarse el calendario, cayó en una larga niebla. Lloró con canciones melancólicas hasta que la sensación se apagó y luego revisó todo por escrito en lugar de culpar a otros. Admite que no soporta ver sus viejas entrevistas, se encuentra «tonta» ante la cámara, pero asegura que nunca actuó para ella. A comienzos de 2025 se incorporó a la Universidad de Zhejiang como profesora de natación; casi dos años después, su medida del progreso es simple: los alumnos aprenden más rápido y se mueven mejor. Reduce la «fuerza prehistórica» a «darlo todo», y dice que esa fuerza perteneció a su carrera deportiva y que la vida traerá una versión más suave.", "ja": "最近のポッドキャスト対談で、傅園慧は引退後 3 か月ほとんど外出しなかったと語った。水泳が生活のすべてで、日程が突然空になると長い迷いの中に落ちた。物悲しい曲をかけ涙が枯れるまで泣き、冷静になってからは文章で振り返り、外に責任を求めなかった。昔のインタビューは見返せず、画面の自分を「間抜け」と感じるが、カメラの前で演じないことは貫いたという。2025 年初めに浙江大学の水泳教師になり、2 年近く教えて、上達の基準はごく素朴だ。学生が泳げるようになる速さ、動きの滑らかさ。彼女は「洪荒の力」を「全力を尽くすこと」に置き換え、競技人生のそれは終わったが、人生にはもっと優しい洪荒の力があると語る。"}, "why": {"zh": "十年前那句「我已经用了洪荒之力」让她成了全民表情包，十年后她讲的却是另一件事：冠军身份清零之后，人怎么重新给自己定位。三个月闭门不出不是脆弱，是主动的心理缓冲。对看客来说，这段自述的价值在于提醒——我们记住的往往是一个人的高光瞬间，而他要独自处理的，是光环褪去之后漫长的日常。", "en": "Ten years ago «I've already used my prehistoric power» turned her into a national meme; ten years on she is talking about something else: how a person repositions themselves once a champion's identity is reset to zero. Three months indoors was not fragility but a deliberate buffer. For onlookers the value of the account is the reminder that we remember a person's brightest instant, while they must handle alone the long ordinary days after the glow fades.", "es": "Hace diez años «ya he usado mi fuerza prehistórica» la convirtió en meme nacional; diez años después habla de otra cosa: cómo se reubica una persona cuando su identidad de campeona vuelve a cero. Tres meses encerrada no fue fragilidad, sino un amortiguador deliberado. Para quien mira, el valor del relato es el recordatorio de que recordamos el instante más brillante de alguien, mientras esa persona debe gestionar sola los largos días corrientes que vienen después del brillo.", "ja": "10 年前の「私はすでに洪荒の力を使い切った」が国民的ミームにした彼女が、10 年後に語るのは別のことだ。王者という身分がゼロに戻った後、人はどう自分を位置づけ直すのか。3 か月の籠居は脆さではなく、意識的な緩衝だった。受け手にとってこの告白の価値は、私たちが記憶するのは人の最も輝いた瞬間であり、輝きが去った後の長い日常は本人が一人で引き受けるのだという提醒にある。"}}]}, {"key": "ent", "num": "06", "color": "#db2777", "deep": "#ab1d5d", "name": {"zh": "娱乐八卦", "en": "Entertainment", "es": "Espectáculos", "ja": "エンタメ"}, "items": [{"idx": "01", "title": {"zh": "贺岁档开画首日遇冷：冠军票房 156.8 万，国产新片普遍未破万", "en": "A cold open for the winter season: top film takes 1.57m yuan", "es": "Arranque frío de la temporada: la más taquillera logra 1,57 millones de yuanes", "ja": "年末商戦が低調な滑り出し 首位でも興行収入 156.8 万元"}, "body": {"zh": "2026 年电影贺岁档 11 月 27 日拉开帷幕，将持续至 12 月 31 日，共 35 天、超过 50 部中外影片定档。开画首日，迪士尼动画《魔法秘境》以 156.8 万元居当日票房榜首，惊悚片《泥面人》以 101.9 万元居次；国产新片普遍惨淡，《二十四味》首日 3.5 万元、《突破腊子口》1.3 万元，《像风一样自由》《佟佟的异想世界》票房未破万，网红导演的科幻片《循环街区》首日仅 7 万元。同日《悲伤逆流成河》《沙丘》重映。行业数据显示，截至 11 月 16 日，内地市场已连续四个完整周票房低于 2 亿元，四周合计约 7.1 亿元。", "en": "The 2026 winter film season opened on 27 November and runs 35 days to 31 December, with more than 50 Chinese and foreign titles scheduled. On day one Disney's animated «Magic Realm» led with 1.568 million yuan and the thriller «Clayface» followed on 1.019 million; domestic releases fared badly, with «Twenty-Four Flavours» taking 35,000 yuan and «Breaking Lazikou» 13,000, while «Free as the Wind» and «Tongtong's Wonderland» failed to reach 10,000 and the influencer-directed sci-fi «Loop Block» managed just 70,000. «Cry Me a Sad River» and «Dune» re-released the same day. Industry data show the mainland market had logged four full consecutive weeks below 200 million yuan as of 16 November, about 710 million in total.", "es": "La temporada cinematográfica de fin de año arrancó el 27 de noviembre y dura 35 días hasta el 31 de diciembre, con más de 50 títulos chinos y extranjeros programados. En el primer día, la animación de Disney «Magic Realm» lideró con 1,568 millones de yuanes y el thriller «Clayface» siguió con 1,019 millones; los estrenos nacionales fueron mal: «Twenty-Four Flavours» recaudó 35.000 yuanes y «Breaking Lazikou» 13.000, mientras «Free as the Wind» y «Tongtong's Wonderland» no llegaron a 10.000 y la ciencia ficción de un influencer «Loop Block» apenas 70.000. Ese mismo día se reestrenaron «Cry Me a Sad River» y «Dune». Los datos del sector muestran que, hasta el 16 de noviembre, el mercado continental acumulaba cuatro semanas completas seguidas por debajo de 200 millones de yuanes, unos 710 millones en total.", "ja": "2026 年の年末映画シーズンが 11 月 27 日に開幕し、12 月 31 日までの 35 日間で 50 本以上が公開される。初日はディズニーアニメ『魔法秘境』が 156.8 万元で首位、スリラー『泥面人』が 101.9 万元で続いた。国産新作は振るわず、『二十四味』は 3.5 万元、『突破腊子口』は 1.3 万元、『像风一样自由』『佟佟的异想世界』は 1 万元に届かず、インフルエンサー監督の SF 作『循环街区』は初日 7 万元にとどまった。同日『悲伤逆流成河』『沙丘』が再上映。業界データでは、11 月 16 日時点で本土市場は 4 週連続で週間興行収入が 2 億元を下回り、4 週合計で約 7.1 億元だった。"}, "why": {"zh": "首日冠军只有 156.8 万元，这个数字比任何一部影片的口碑都更能说明问题：不是某一部片子不行，是观众还没有走进影院。《魔法秘境》号称耗资 2 亿美元的原创动画，在北美首日也只有 760 万美元；《沙丘》重映倒是为 12 月 31 日的《沙丘 3》铺了路。真正的考验在 12 月 16 日《复仇者联盟 5》——整个档期现在几乎都押在这一部身上。", "en": "A day-one champion at 1.568 million yuan says more than any single film's reviews: the problem is not one bad movie but an audience that has not come back. «Magic Realm» reportedly cost $200 million and took only $7.6 million on its North American opening day; the «Dune» re-release, by contrast, lays track for «Dune 3» on 31 December. The real test is «Avengers 5» on 16 December — the whole season now rests on it.", "es": "Un líder del primer día con 1,568 millones dice más que la crítica de cualquier película: el problema no es un mal filme, sino un público que no ha vuelto. «Magic Realm» costó, según se dice, 200 millones de dólares y recaudó solo 7,6 millones en su primer día en Norteamérica; el reestreno de «Dune», en cambio, prepara el terreno para «Dune 3» el 31 de diciembre. La prueba real es «Avengers 5» el 16 de diciembre: toda la temporada descansa ahora sobre ella.", "ja": "初日首位が 156.8 万元という数字は、どの作品の評判よりも雄弁だ。問題は一本の不出来ではなく、客が劇場に戻っていないことにある。『魔法秘境』は製作費 2 億ドルとも言われ、北米の初日も 760 万ドルにとどまった。一方『沙丘』の再上映は 12 月 31 日の『沙丘 3』への布石になる。本当の試練は 12 月 16 日の『アベンジャーズ 5』で、今やシーズン全体がこの一本に懸かっている。"}}, {"idx": "02", "title": {"zh": "《好好生活》定档：王俊凯、瞿颖、许昕在清迈做 21 天还债实验", "en": "«Life is Good» lands: Wang Junkai, Qu Ying and Xu Xin repay a debt in Chiang Mai", "es": "«Life is Good» llega: Wang Junkai, Qu Ying y Xu Xin pagan una deuda en Chiang Mai", "ja": "『好好生活』が 11 月 28 日開始 王俊凱らがチェンマイで 21 日間の借金返済生活"}, "body": {"zh": "11 月 27 日，湖南卫视刘力辉团队打造的生活实验真人秀《好好生活》官宣定档，11 月 28 日起每周六 12:00 芒果 TV 上线、22:00 湖南卫视播出。常驻嘉宾为王俊凯、瞿颖、许昕、齐思钧，四人在泰国清迈一座小院开启为期 21 天的生活实验：先向节目组「预支」一笔生活费支付房租等开销，再靠真实劳动在期限内还清，全程仅有一次求助机会。", "en": "«Life is Good», a life-experiment reality show from Hunan TV's Liu Lihui team, was dated on 27 November: it launches on Mango TV at noon each Saturday from 28 November and airs on Hunan TV at 22:00. The regulars are Wang Junkai, Qu Ying, Xu Xin and Qi Sijun, who spend 21 days in a courtyard in Chiang Mai, Thailand, advancing a living allowance from the producers to cover rent and expenses and then working it off within the deadline, with only one chance to ask for help.", "es": "«Life is Good», un reality de experimento vital del equipo de Liu Lihui en Hunan TV, confirmó su fecha el 27 de noviembre: se estrena en Mango TV a mediodía cada sábado desde el 28 de noviembre y se emite en Hunan TV a las 22:00. Los habituales son Wang Junkai, Qu Ying, Xu Xin y Qi Sijun, que pasan 21 días en un patio de Chiang Mai (Tailandia), reciben un anticipo para cubrir alquiler y gastos y deben devolverlo trabajando antes del plazo, con una sola oportunidad de pedir ayuda.", "ja": "湖南衛視の劉力輝チームが手がける生活実験リアリティ『好好生活』が 11 月 27 日に放送開始を発表した。11 月 28 日から毎週土曜 12 時に Mango TV、22 時に湖南衛視で放送。レギュラーは王俊凱、瞿穎、許昕、斉思鈞の 4 人で、タイ・チェンマイの小院で 21 日間の生活実験に挑む。制作側から生活費を「前借り」して家賃などを払い、期限内に実際の労働で返済する。助けを求められるのは一度だけ。"}, "why": {"zh": "这档节目真正的设定不是「明星去旅行」，而是「必须先欠债再还钱」——一笔必须结清的生活费，把「好好生活」从消费命题改成了收支命题。王俊凯、瞿颖、许昕分别代表年轻世代、成熟女性与运动员三种视角，跨圈层的差异恰好是这类慢综艺唯一还有张力的地方：钱不够时，不同年龄的人先砍掉什么。", "en": "The premise is not «celebrities go travelling» but «borrow first, repay later»: a living allowance that must be settled turns «living well» from a question of consumption into one of income and outlay. Wang Junkai, Qu Ying and Xu Xin stand for a younger generation, a mature woman and an athlete, and that cross-generational gap is the one place such slow television still has tension: when money runs short, what does each age cut first?", "es": "La premisa no es «famosos de viaje» sino «primero endeudarse, luego pagar»: un anticipo que hay que liquidar convierte el «vivir bien» de una cuestión de consumo en una de ingresos y gastos. Wang Junkai, Qu Ying y Xu Xin representan a una generación joven, a una mujer madura y a un deportista, y esa brecha intergeneracional es el único lugar donde este tipo de televisión lenta conserva tensión: cuando falta dinero, ¿qué recorta primero cada edad?", "ja": "設定は「芸能人が旅をする」ではなく「まず借りて、あとで返す」。清算必須の生活費が、「よく生きる」を消費の問いから収支の問いへ変える。王俊凱、瞿穎、許昕はそれぞれ若い世代、成熟した女性、アスリートの視点を代表し、その世代差こそがこの種のスローテレビに残された唯一の緊張感だ。金が足りないとき、年代ごとに何を先に削るのか。"}}, {"idx": "03", "title": {"zh": "张杰武汉连开三场全开麦，「唱成这样随便吧」成反向夸赞", "en": "Zhang Jie's three-night Wuhan run turns «whatever» into praise", "es": "Las tres noches de Zhang Jie en Wuhan convierten un «da igual» en elogio", "ja": "張杰、武漢 3 日連続の生歌 「そんな歌い方でいい」が逆説的な称賛に"}, "body": {"zh": "11 月 27 日晚，张杰「1982 开往未 LIVE」武汉站在武汉体育中心主体育场开唱，连开三场、每场超过三小时，全程真唱。主舞台被设计成巨型行李箱，一列列车造型「开」上舞台开场。相关话题「张杰你唱成这样随便吧」冲上热搜——网友用「随便吧」反向夸赞他现场太稳、高音太轻松，并非质疑唱功。歌迷把他在演出当天发布的「月亮升起了，我们见面了」当作开演暗号，场馆周边出现编发、应援摊位，外地歌迷从黄石、宜昌、荆门、南昌、长沙赶来。", "en": "Zhang Jie opened his «1982 to the Future» run at Wuhan Sports Centre on the evening of 27 November: three consecutive nights, each over three hours, all sung live. The main stage was built as a giant suitcase, with a train rolling on to open the show. The phrase «Zhang Jie, singing like that, whatever» trended — «whatever» being reverse praise for how steady he was and how easily the high notes came, not a question about his ability. Fans treated his show-day post, «the moon is up, we meet», as the cue for the start, and braiding and support stalls appeared around the venue, with fans travelling in from Huangshi, Yichang, Jingmen, Nanchang and Changsha.", "es": "Zhang Jie abrió el 27 de noviembre su gira «1982 to the Future» en el Centro Deportivo de Wuhan: tres noches seguidas, más de tres horas cada una, todo en directo. El escenario principal se construyó como una maleta gigante y un tren entró para abrir el espectáculo. Se volvió tendencia la frase «Zhang Jie, cantando así, da igual», donde «da igual» es elogio inverso por su estabilidad y la facilidad de los agudos, no una duda sobre su técnica. Los fans tomaron su mensaje del día del concierto, «la luna salió, nos vemos», como señal de inicio, y alrededor del recinto aparecieron puestos de trenzas y apoyo, con seguidores llegados de Huangshi, Yichang, Jingmen, Nanchang y Changsha.", "ja": "11 月 27 日夜、張杰のツアー「1982 开往未 LIVE」武漢公演が武漢体育中心で開幕。3 日連続、各公演 3 時間超、すべて生歌。メインステージは巨大なスーツケースの形で、列車のオブジェが登場して開演した。「張杰、そんな歌い方でいい」がトレンドに。この「いい」は、安定感と高音の軽さへの逆説的な称賛で、歌唱力を疑う声ではない。ファンは公演当日の投稿「月が昇った、会いに行く」を開演の合図とし、会場周辺には編み込みや応援の屋台が並んだ。黄石、宜昌、荊門、南昌、長沙からも駆けつけた。"}, "why": {"zh": "「随便吧」能成梗，说明现场演出的评价体系变了：观众不再只比较唱得好不好，而是比较「稳到不像现场」。连开三场全开麦，考验的不是某一首高音，而是三小时的体力分配与嗓音管理。这也是演唱会经济进入存量竞争后的必然——票价上去了，观众对「真唱」的要求就从加分项变成了底线。", "en": "That «whatever» became a meme shows how live performance is now judged: not simply whether someone sings well, but whether they are so steady it stops sounding live. Three consecutive full-voice nights test not one high note but three hours of pacing and vocal management. It is also where the concert economy lands once it competes for a fixed audience: tickets got expensive, so singing live went from a bonus to a baseline.", "es": "Que «da igual» se vuelva meme demuestra cómo se juzga hoy un directo: no solo si se canta bien, sino si se está tan firme que deja de parecer en vivo. Tres noches seguidas a voz abierta no ponen a prueba un agudo, sino tres horas de dosificación y gestión vocal. Es también el punto al que llega la economía de conciertos cuando compite por un público fijo: las entradas subieron, y cantar en directo pasó de plus a mínimo exigible.", "ja": "「いい」がミームになったのは、ライブの評価軸が変わったからだ。うまいかどうかではなく、「生歌に見えないほど安定しているか」を比べる。3 日連続の生歌で試されるのは一つの高音ではなく、3 時間の体力配分と声の管理だ。コンサート経済が既存客の取り合いに入った必然でもある。値段が上がった分、生歌は加点要素から最低ラインに変わった。"}}, {"idx": "04", "title": {"zh": "易烊千玺 26 岁生日：单曲 MV 卡点 11:28 上线，TFBOYS 三人同日各有动作", "en": "Yi Yangqianxi turns 26 as his single's video lands at 11:28", "es": "Yi Yangqianxi cumple 26 años con el vídeo de su single a las 11:28", "ja": "易烊千璽 26 歳の誕生日、シングル MV が 11:28 に公開"}, "body": {"zh": "11 月 28 日是易烊千玺 26 岁生日。他的生日单曲《Namuuhan》已于 11 月 25 日 11:28 上线，由他与万一共同作词、凡宇作曲，歌名取自蒙语，意为「平静的、辽阔的」；上线 6 小时 38 分 QQ 音乐评论破百万，空降多个榜单第一。完整版 MV 定档 11 月 28 日 11:28 上线，预告片中的公路、山川、草原与泳镜造型已引发讨论。同日，王俊凯常驻综艺《好好生活》12:00 开播，王源清远跨年演唱会 18:30、19:30 两场开票。", "en": "Yi Yangqianxi turns 26 on 28 November. His birthday single «Namuuhan» came out at 11:28 on 25 November, co-written by him and Wan Yi with music by Fan Yu; the title is Mongolian for «calm, vast», and QQ Music comments passed a million in six hours 38 minutes, sending it to the top of several charts. The full video is set for 11:28 on 28 November, and the teaser's highways, mountains, grassland and swimming-goggle look have already been discussed. The same day, Wang Junkai's variety show «Life is Good» starts at noon and Wang Yuan's Qingyuan New Year concerts go on sale at 18:30 and 19:30.", "es": "Yi Yangqianxi cumple 26 años el 28 de noviembre. Su single de cumpleaños «Namuuhan» salió el 25 de noviembre a las 11:28, coescrito por él y Wan Yi con música de Fan Yu; el título significa «tranquilo, vasto» en mongol, y los comentarios en QQ Music superaron el millón en seis horas y 38 minutos, llevándolo a lo alto de varias listas. El vídeo completo está previsto para las 11:28 del 28 de noviembre, y el avance con carreteras, montañas, praderas y gafas de natación ya ha generado debate. Ese mismo día, el programa de Wang Junkai «Life is Good» arranca a mediodía y las entradas de los conciertos de Año Nuevo de Wang Yuan en Qingyuan salen a la venta a las 18:30 y 19:30.", "ja": "11 月 28 日は易烊千璽の 26 歳の誕生日。誕生日シングル「Namuuhan」は 11 月 25 日 11:28 に配信され、本人と万一が作詞、凡宇が作曲。題名はモンゴル語で「静かで、広い」。配信から 6 時間 38 分で QQ 音楽のコメントが 100 万件を超え、複数のランキングで 1 位となった。フルバージョンの MV は 11 月 28 日 11:28 公開予定で、予告編の公路、山川、草原、ゴーグル姿が話題になっている。同日、王俊凱のレギュラー番組『好好生活』が 12 時に始まり、王源の清遠カウントダウン公演のチケットが 18:30 と 19:30 に発売される。"}, "why": {"zh": "把生日做成发歌节点，是内娱这几年最成熟的一套运营：歌先上、MV 压到生日当天、时间点还要卡在 11:28。真正值得看的是歌本身——《Namuuhan》走的是 Bossa Nova，蒙古语歌名、爵士器乐、谐音梗歌词，和偶像工业的标准配置并不一样。一个人到了 26 岁，开始用「平静、辽阔」而不是「热烈」来命名自己的作品。", "en": "Turning a birthday into a release moment is the most polished piece of operations in Chinese entertainment: song first, video held for the day itself, the clock stopped at 11:28. What is worth attention is the song. «Namuuhan» is Bossa Nova — a Mongolian title, jazz instrumentation, punning lyrics — which is not the standard idol configuration. At 26, someone starts naming his work «calm, vast» rather than «fierce».", "es": "Convertir un cumpleaños en un momento de lanzamiento es la operación más pulida del entretenimiento chino: primero la canción, el vídeo reservado para el día, el reloj detenido en las 11:28. Lo que merece atención es la canción. «Namuuhan» es bossa nova: título mongol, instrumentación de jazz, letras con juegos de palabras, que no es la configuración estándar del ídolo. A los 26, alguien empieza a nombrar su obra «tranquila, vasta» en lugar de «ferviente».", "ja": "誕生日をリリースの節目にするのは、中国エンタメで最も洗練された運営だ。曲を先に出し、MV は当日まで寝かせ、時刻は 11:28 に合わせる。本当に見るべきは曲そのもの。「Namuuhan」はボサノヴァで、モンゴル語の題名、ジャズの器楽、言葉遊びの歌詞はアイドル産業の標準仕様とは違う。26 歳になると、人は自分の作品を「熱い」ではなく「静かで、広い」と名付け始める。"}}, {"idx": "05", "title": {"zh": "许飞厉娜旧事重提，舆论从「心疼」转向「有指控无实锤」", "en": "An old rift reopens as opinion turns against «accusation without proof»", "es": "Una vieja ruptura reabre el debate sobre «acusar sin pruebas»", "ja": "許飛と厲娜の旧事再燃、「告発に証拠なし」へと世論が転換"}, "body": {"zh": "芒果 TV 综艺《后会友期》让四组疏远多年的旧友用 18 天集体旅行重新面对彼此，其中 2006 年《超级女声》同宿舍的许飞与厉娜最受关注。节目播出后，微博讨论从「心疼厉娜」转向质疑她「有指控无实锤」：许飞连问告密对象、地点与内容，厉娜仅以「不能背叛好心提醒的朋友」回应，未提供可核对的时间、地点和第三人，要求道歉、还许飞清白的声音增多。11 月 27 日至 28 日，节目进行第三次观察室录制，网传飞行嘉宾包括张凯丽与两名电竞选手，节目组与当事人均未官宣。", "en": "Mango TV's «Later, Friends» sends four pairs of long-estranged friends on an 18-day group journey to face each other again; the most watched pair are Xu Fei and Li Na, who shared a dorm at the 2006 «Super Girl» contest. After broadcast, Weibo discussion shifted from sympathy for Li Na to questioning an «accusation without proof»: Xu Fei asked repeatedly who the informant was, where and what was said, while Li Na answered only that she «cannot betray a friend who kindly warned her», offering no checkable time, place or third party. Calls for an apology and for Xu Fei's name to be cleared grew. On 27-28 November the show recorded its third studio session, with unconfirmed reports of guests including Zhang Kaili and two esports players; neither the producers nor those involved have confirmed.", "es": "«Later, Friends», de Mango TV, lleva a cuatro parejas de amigos distanciados a un viaje grupal de 18 días para reencontrarse; la más seguida es la de Xu Fei y Li Na, que compartieron dormitorio en el concurso «Super Girl» de 2006. Tras la emisión, la conversación en Weibo pasó de la empatía con Li Na a cuestionar una «acusación sin pruebas»: Xu Fei preguntó repetidamente quién fue el informante, dónde y qué se dijo, y Li Na solo respondió que «no puede traicionar a una amiga que la avisó con bondad», sin ofrecer hora, lugar ni tercero verificables. Crecieron las voces que piden disculpas y que se limpie el nombre de Xu Fei. El 27 y 28 de noviembre el programa grabó su tercera sesión de estudio, con versiones no confirmadas sobre invitados como Zhang Kaili y dos jugadores de esports.", "ja": "Mango TV の『后会友期』は、長く疎遠だった 4 組の旧友を 18 日間の集団旅行で再会させる番組。最も注目されるのは 2006 年『超級女声』で同部屋だった許飛と厲娜の組だ。放送後、Weibo の論調は「厲娜を気の毒に」から「告発に証拠がない」への疑念に移った。許飛は密告の相手、場所、内容を繰り返し尋ねたが、厲娜は「親切に知らせてくれた友人を裏切れない」と答えるだけで、検証できる日時・場所・第三者を示さなかった。謝罪と許飛の名誉回復を求める声が増えている。11 月 27〜28 日には 3 回目のスタジオ収録が行われ、張凱麗と e スポーツ選手 2 名がゲストとの未確認情報があるが、番組側も本人も公表していない。"}, "why": {"zh": "这场对话之所以持续发酵，是因为它把一个很难的问题摆上了台面：当「有指控、无实证」时，怎么既保护受伤的人，又不让被指控的人永久背锅。舆论从一边倒到反转，本身也是一种提醒——用几期综艺给十五年前的旧事定案，和当年凭一句话断交，是同一种冲动。", "en": "The conversation keeps going because it puts a hard question on the table: when there is an accusation but no proof, how do you protect the person who was hurt without leaving the accused carrying the blame forever? That opinion swung from one side to the other is itself a warning: settling a fifteen-year-old matter in a few episodes of television is the same impulse that ended a friendship over a single sentence.", "es": "La conversación sigue porque pone sobre la mesa una pregunta difícil: cuando hay acusación pero no pruebas, ¿cómo proteger a quien sufrió sin dejar que el acusado cargue la culpa para siempre? Que la opinión haya pasado de un extremo al otro es en sí una advertencia: resolver un asunto de hace quince años en unos programas es el mismo impulso que romper una amistad por una sola frase.", "ja": "この対話が続くのは、難しい問いを可視化したからだ。「告発はあるが証拠はない」とき、傷ついた人を守りながら、告発された人が永遠に負い目を負わないようにするにはどうすればよいのか。世論が一方から他方へ振れたこと自体が警告でもある。15 年前の出来事を数回の番組で決着させるのは、当時ひとつの言葉で関係を断ったのと同じ衝動だ。"}}]}], "risk": {"zh": "风险提示：本简报仅作信息汇总，其中涉及的数据不构成任何投资建议。", "en": "Risk notice: this briefing is an information digest only; the figures it contains do not constitute investment advice.", "es": "Aviso de riesgo: este boletín es solo un resumen informativo; los datos que contiene no constituyen asesoramiento de inversión.", "ja": "リスク提示：本ブリーフィングは情報の要約にすぎず、掲載のデータは投資助言を構成するものではありません。"}}/*__END__*/;

  /* ===== 工具 ===== */
  function T(obj, lang) {
    if (obj == null) return "";

    return obj.zh != null ? obj.zh : "";
  }
  function pad(n) { return n < 10 ? "0" + n : "" + n; }

  function fmtDate(d, lang) {
    var y = d.getFullYear(), m = d.getMonth() + 1, day = d.getDate();
    if (lang === "zh") return y + "." + pad(m) + "." + pad(day);

    if (lang === "es") return day + " " + ["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"][m-1] + " " + y;

  }
  function esc(s) {
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

      var i = title.indexOf(hl);
      inner = esc(title.slice(0, i)) + '<span class="hl">' + esc(hl) + "</span>" + esc(title.slice(i + hl.length));

  /* ===== 语言检测：localStorage > 浏览器语言 > 系统时区 > 中文 ===== */

    var nav = (navigator.language || "").toLowerCase();

    var tz = "";
    try { tz = Intl.DateTimeFormat().resolvedOptions().timeZone || ""; } catch (e) {}
    if (/^Asia\/Tokyo/.test(tz)) return "ja";
    if (/Europe\/Madrid|America\/(Mexico_City|Bogota|Lima|Santiago|Caracas|Guatemala|La_Paz|San_Jose|Panama|Asuncion|Montevideo|Havana|El_Salvador|Managua|Tegucigalpa|Costa_Rica|San_Salvador)|America\/Argentina\//.test(tz)) return "es";

    var siteName = (lang === "zh") ? "提马早报" : "TIMAB DAILY";

    // 语言切换器（国旗触发 + 下拉）
    var ls = document.getElementById("langSwitch");

      trig.addEventListener("click", function (e) {

        langOpen = !langOpen;
        ls.classList.toggle("open", langOpen);
        trig.setAttribute("aria-expanded", langOpen ? "true" : "false");
      });
      ls.appendChild(trig);
      var menu = document.createElement("div");
      menu.className = "lang-menu"; menu.setAttribute("role", "menu");
      LANGS.forEach(function (l) {
        var item = document.createElement("button");
        item.type = "button"; item.className = "lang-item" + (l === curLang ? " sel" : "");
        item.setAttribute("role", "menuitem"); item.setAttribute("data-lang", l);
        item.innerHTML = flag(l) + '<span class="lbl">' + LANG_LABEL_FULL[l] + "</span>";
        item.addEventListener("click", function (e) {
          e.stopPropagation();
          setLang(l);
        });
        menu.appendChild(item);
      });
      ls.appendChild(menu);
    }
  }

  function renderContent(lang) {
    var i18n = I18N[lang];
    var html = "";
    // 精选
    var sp = BRIEFING.spotlight;
    html += '<section class="spotlight" id="pick">'
      + '<div class="badge"><i></i>' + esc(T(sp.badge, lang)) + "</div>"
      + "<h2>" + titleHtml(sp.title, sp.hl, lang) + "</h2>"
      + '<div class="body">' + esc(T(sp.body, lang)) + "</div>"
      + '<div class="why"><b>' + esc(i18n.why) + "</b>" + esc(T(sp.why, lang)) + "</div>"
      + "</section>";
    // 分类
    html += '<div class="grid">';
    BRIEFING.sections.forEach(function (sec) {
      html += '<section class="card" id="' + sec.key + '" style="--ac:' + sec.color + "; --ac-deep:" + sec.deep + ';">'
        + '<div class="sec-head"><span class="sec-num">' + sec.num + "</span>"
        + "<h3>" + esc(T(sec.name, lang)) + "</h3>"
        + '<span class="en">' + sec.key.toUpperCase() + "</span></div>";
      (sec.items || []).forEach(function (it) {
        html += '<div class="item">';
        html += '<div class="t"><span class="idx">' + it.idx + "</span>";
        if (it.tag) html += '<span class="tag">' + esc(it.tag[lang] != null ? it.tag[lang] : i18n.tag) + "</span>";
        html += titleHtml(it.title, it.hl, lang) + "</div>";
        html += '<div class="d">' + esc(T(it.body, lang)) + "</div>";
        html += '<div class="why"><b>' + esc(i18n.why) + "</b>" + esc(T(it.why, lang)) + "</div>";
        html += "</div>";
      });
      html += "</section>";
    });
    html += "</div>";
    var content = document.getElementById("content");
    if (content) content.innerHTML = html;
    // 页脚
    var risk = document.getElementById("risk");
    if (risk) risk.textContent = T(BRIEFING.risk, lang);
  }

  function setLang(lang) {
    if (LANGS.indexOf(lang) < 0) lang = "zh";
    curLang = lang;
    langOpen = false;
    try { localStorage.setItem("timab_lang", lang); } catch (e) {}
    renderChrome(lang);
    renderContent(lang);
  }

  /* ===== 往期日历（保留原逻辑，文案随语言） ===== */
  function initCalendar() {
    var btn = document.getElementById("calBtn");
    var pop = document.getElementById("calPop");
    var grid = document.getElementById("calGrid");
    var title = document.getElementById("calTitle");
    if (!btn || !pop || !grid || !title) return;

    var parts = BRIEFING.date.split("-");
    var todayKey = parts[0].slice(2) + parts[1] + parts[2];
    var cur = { y: +parts[0], m: +parts[1] };
    var has = {};
    for (var i = 0; i < ARCHIVE_DATES.length; i++) { has[ARCHIVE_DATES[i]] = 1; }
    var HIST_BASE = /\/history\//.test(location.pathname) ? "./" : "history/";

    function ckey(y, m, d) { return String(y).slice(2) + pad(m) + pad(d); }

    function render() {
      var i18n = I18N[curLang];
      title.textContent = i18n.calTitle(cur.y, cur.m);
      grid.innerHTML = "";
      var start = new Date(cur.y, cur.m - 1, 1).getDay();
      var days = new Date(cur.y, cur.m, 0).getDate();
      for (var b = 0; b < start; b++) {
        var blank = document.createElement("span");
        blank.className = "cal-cell is-empty"; grid.appendChild(blank);
      }
      for (var d = 1; d <= days; d++) {
        var k = ckey(cur.y, cur.m, d);
        var cell = document.createElement("span");
        cell.className = "cal-cell" + (has[k] ? " has" : "") + (k === todayKey ? " is-today" : "");
        cell.textContent = d;
        if (has[k]) {
          cell.setAttribute("role", "link"); cell.setAttribute("tabindex", "0");
          cell.title = cur.y + "-" + pad(cur.m) + "-" + pad(d) + " 存档";
          (function (target) {
            var go = function () { window.open(HIST_BASE + target + ".html", "_blank", "noopener"); };
            cell.addEventListener("click", go);
            cell.addEventListener("keydown", function (e) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); go(); } });
          })(k);
        }
        grid.appendChild(cell);
      }
    }
    function toggle(open) {
      pop.hidden = !open;
      btn.setAttribute("aria-expanded", open ? "true" : "false");
      if (open) render();
    }
    btn.addEventListener("click", function (e) { e.stopPropagation(); toggle(pop.hidden); });
    document.getElementById("calPrev").addEventListener("click", function () { cur.m--; if (cur.m < 1) { cur.m = 12; cur.y--; } render(); });
    document.getElementById("calNext").addEventListener("click", function () { cur.m++; if (cur.m > 12) { cur.m = 1; cur.y++; } render(); });
    document.addEventListener("click", function (e) { if (!pop.hidden && !pop.contains(e.target)) toggle(false); });
    document.addEventListener("keydown", function (e) { if (e.key === "Escape" && !pop.hidden) toggle(false); });
  }

  /* ===== 启动 ===== */
  function boot() {
    curLang = detectLang();
    renderChrome(curLang);
    renderContent(curLang);
    initCalendar();
    // 关闭语言下拉：点击外部 / Esc
    document.addEventListener("click", function (e) {
      var ls = document.getElementById("langSwitch");
      if (ls && langOpen && !ls.contains(e.target)) {
        langOpen = false;
        ls.classList.remove("open");
        var t = document.getElementById("langTrigger");
        if (t) t.setAttribute("aria-expanded", "false");
      }
    });
    document.addEventListener("keydown", function (e) {
      if (e.key === "Escape" && langOpen) {
        langOpen = false;
        var ls = document.getElementById("langSwitch");
        if (ls) ls.classList.remove("open");
        var t = document.getElementById("langTrigger");
        if (t) t.setAttribute("aria-expanded", "false");
      }
    });
  }
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", boot);
  } else { boot(); }
})();
</script>

</html>
