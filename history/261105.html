  var BRIEFING = /*__BRIEFING_DATA__*/{"date": "2026-11-05", "meta": {"zh": "星期四 · 农历九月廿七 · timab.cn", "en": "Thursday · Lunar September 27 · timab.cn", "es": "Jueves · 27.º día del noveno mes lunar · timab.cn", "ja": "木曜日 · 旧暦九月二十七日 · timab.cn"}, "spotlight": {"badge": {"zh": "精选", "en": "SPOTLIGHT", "es": "DESTACADO", "ja": "特集"}, "title": {"zh": "一天之内，“战争溢价”被退了回去", "en": "In a Single Day, the War Premium Was Handed Back", "es": "En un solo día se devolvió la prima de guerra", "ja": "一日で「戦争プレミアム」が巻き戻された"}, "hl": {"zh": "布油 −8.67%", "en": "Brent −8.67%", "es": "Brent −8,67%", "ja": "ブレント −8.67％"}, "body": {"zh": "11 月 4 日，美国中期选举计票显示民主党同时夺回参议院和众议院控制权。当天全球风险资产同步重定价：纽约 12 月交货轻质原油收报每桶 88.12 美元，跌 8.29%；伦敦布伦特 1 月合约收 94.62 美元，跌 8.67%。COMEX 黄金涨 3.34% 报 4072.2 美元/盎司，白银涨 5.17%；美股道指涨约 1500 点、涨幅逾 3%，纳指涨超 1%；A 股上证指数涨 2.16%，科创综指涨 9.90% 创该指数发布以来最大单日涨幅，两市成交 2.05 万亿元。", "en": "On 4 November, vote counts from the US midterms showed the Democratic Party winning control of both the Senate and the House. Global risk assets repriced the same day. December light crude in New York settled at $88.12 a barrel, down 8.29%, while January Brent closed at $94.62, down 8.67%. COMEX gold rose 3.34% to $4,072.2 an ounce and silver gained 5.17%. The Dow added about 1,500 points, more than 3%, and the Nasdaq rose over 1%. In China the Shanghai Composite gained 2.16% and the STAR Composite jumped 9.90%, its largest one-day rise since launch, on turnover of 2.05 trillion yuan.", "es": "El 4 de noviembre, el escrutinio de las legislativas de EE. UU. mostró que el Partido Demócrata recuperaba el control del Senado y de la Cámara. Ese mismo día se repreciaron los activos de riesgo globales: el crudo ligero de diciembre en Nueva York cerró en 88,12 dólares por barril, con una caída del 8,29%, y el Brent de enero en 94,62 dólares, un 8,67% menos. El oro COMEX subió un 3,34% hasta 4.072,2 dólares la onza y la plata un 5,17%. El Dow Jones sumó unos 1.500 puntos, más del 3%, y el Nasdaq avanzó más del 1%. En China el índice compuesto de Shanghái ganó un 2,16% y el STAR Composite un 9,90%, su mayor alza diaria desde su creación, con un volumen de 2,05 billones de yuanes.", "ja": "11月4日、米中間選挙の開票結果を受けて民主党が上院・下院の両方で主導権を握ることが確実になった。同じ日に世界のリスク資産が一斉に値洗いされた。ニューヨークの12月限軽質原油は1バレル88.12ドルで取引を終え8.29％安、ロンドンの1月限ブレントは94.62ドルで8.67％安。COMEX 金は3.34％高の1オンス4,072.2ドル、銀は5.17％高。米国株はダウ平均が約1,500ポイント（3％超）上昇し、ナスダックは1％超高。中国本土では上海総合指数が2.16％高、STAR 総合指数が9.90％高と算出開始以来最大の上げ幅を記録し、売買代金は2兆500億元に達した。"}, "why": {"zh": "油价一天跌掉 8%，原因不是多了几船油，而是市场把“战争不会结束”这个前提改掉了——民主党领袖已明确要推动结束对伊朗战事、撤销关税。同一夜里，股票在买“降级”，原油在卖“溢价”，两个市场做的其实是同一个动作的两面。也因此，这轮行情最脆弱的地方不在价格，而在假设：一旦谈判反复，回吐得最快的也会是它。", "en": "Oil did not fall 8% because a few more tankers appeared. It fell because the market rewrote its premise that the war would not end: Democratic leaders have said plainly that they will push to end the conflict with Iran and roll back tariffs. In the same night, equities bought de-escalation and crude sold the premium — two sides of one move. That also marks where this rally is most fragile: not in the prices, but in the assumption. If the talks wobble, this is the trade that unwinds fastest.", "es": "El petróleo no cayó un 8% porque aparecieran más buques, sino porque el mercado cambió su premisa de que la guerra no terminaría: los líderes demócratas ya han dicho que impulsarán el fin del conflicto con Irán y la retirada de aranceles. En la misma noche, la renta variable compró desescalada y el crudo vendió prima: dos caras de un mismo movimiento. Ahí está también la fragilidad de este rally: no en los precios, sino en el supuesto. Si las conversaciones se tuercen, es la operación que antes se deshace.", "ja": "原油が1日で8％下落したのは、タンカーが増えたからではない。市場が「戦争は終わらない」という前提を書き換えたからだ。民主党の指導部はイランとの戦闘終結と関税撤回を推進すると明言している。同じ夜、株式は「緊張緩和」を買い、原油は「プレミアム」を売った。同じ動作の裏表である。だからこそ、この相場の最も脆い部分は価格ではなく前提にある。協議が揺らげば、最も早く巻き戻るのもこの取引だ。"}}, "sections": [{"key": "intl", "num": "01", "color": "#1d4ed8", "deep": "#1e3fa8", "name": {"zh": "国际时事", "en": "WORLD", "es": "MUNDO", "ja": "国際時事"}, "items": [{"idx": "01", "tag": {"zh": "进展"}, "title": {"zh": "民主党夺回参众两院，特朗普承认伊朗战事拖累选情", "en": "Democrats Take Both Chambers; Trump Blames the Iran War", "es": "Los demócratas recuperan ambas cámaras y Trump culpa a la guerra con Irán", "ja": "民主党が上下両院を奪還、トランプ氏はイラン戦争が響いたと認める"}, "body": {"zh": "据美国多家媒体与机构测算，民主党在 11 月 3 日中期选举中同时赢下参议院和众议院控制权。美国全国广播公司预测民主党将拿下众议院 258 席，超过 218 席的门槛；美国有线电视新闻网预测其在参议院超过 54 席，从共和党手中赢走得克萨斯、俄亥俄、缅因、艾奥瓦、堪萨斯、北卡罗来纳、南卡罗来纳 7 个席位，其中得克萨斯是 1988 年以来首次、堪萨斯是 1932 年以来首次。特朗普 4 日在白宫表示，选举失利“在很大程度上确实与伊朗冲突有关”，但若重来一次仍会作同样决定。参议院民主党领袖舒默称将推动结束对伊战争，有望出任众议院议长的杰弗里斯表示将淡化弹劾、寻求撤销关税。各州正式认证多在 11 月中下旬至 12 月完成。", "en": "Projections by major US networks and data firms show the Democratic Party winning control of both the Senate and the House in the 3 November midterms. NBC projects 258 House seats for the Democrats, above the 218-seat threshold; CNN projects more than 54 Senate seats, with seven Republican-held seats falling in Texas, Ohio, Maine, Iowa, Kansas, North Carolina and South Carolina. Texas last sent a Democrat to the Senate in 1988, Kansas in 1932. At the White House on 4 November, Trump said the defeat was “very much” connected to the conflict with Iran but that he would make the same decision again. Senate Democratic leader Chuck Schumer said he will push to end the war; House Democratic leader Hakeem Jeffries, in line to be speaker, said he will play down impeachment and seek to roll back tariffs. State certifications mostly run from mid-to-late November into December.", "es": "Las proyecciones de las principales cadenas y firmas de datos de EE. UU. dan al Partido Demócrata el control del Senado y de la Cámara en las legislativas del 3 de noviembre. NBC le atribuye 258 escaños en la Cámara, por encima del umbral de 218; CNN le da más de 54 en el Senado, con siete escaños republicanos caídos en Texas, Ohio, Maine, Iowa, Kansas, Carolina del Norte y Carolina del Sur. Texas no había elegido un senador demócrata desde 1988, ni Kansas desde 1932. El 4 de noviembre, en la Casa Blanca, Trump afirmó que la derrota estaba “en gran medida” ligada al conflicto con Irán, pero que volvería a tomar la misma decisión. El líder demócrata del Senado, Chuck Schumer, dijo que impulsará el fin de la guerra; Hakeem Jeffries, futuro presidente de la Cámara, afirmó que restará peso al impeachment y buscará retirar los aranceles. Las certificaciones estatales se extienden hasta diciembre.", "ja": "米主要メディアとデータ機関の推計によると、11月3日の中間選挙で民主党が上院・下院の主導権を同時に奪還した。NBC は下院で258議席と予測し、過半数ラインの218を上回る。CNN は上院で54議席超とし、テキサス、オハイオ、メイン、アイオワ、カンザス、ノースカロライナ、サウスカロライナの共和党議席7つを奪ったと伝えた。テキサスで民主党の上院議員が選出されるのは1988年以来、カンザスは1932年以来となる。トランプ大統領は4日、ホワイトハウスで「敗因はイランとの衝突に大きく関係している」と述べつつ、同じ判断をやり直しても変えないと語った。上院民主党のシューマー院内総務は戦争終結を推進すると表明。下院議長就任が見込まれるジェフリーズ氏は弾劾を前面に出さず、関税の撤回を目指すとした。各州の正式認証は11月中下旬から12月にかけて行われる。"}, "why": {"zh": "二战后，同一次中期选举中国会两院同时易主只发生过三次：1946、1994、2006，这次是第四次。真正值得看的是“制衡”会落在哪儿——关税与战争属于行政权，国会的抓手是钱袋子和听证会，而不是直接下命令。", "en": "Since the Second World War, both chambers have switched hands in the same midterm only three times — 1946, 1994 and 2006. This is the fourth. The question worth watching is where the checks actually land: tariffs and war sit with the executive, and Congress’s levers are the purse and the hearing room, not direct orders.", "es": "Desde la Segunda Guerra Mundial, ambas cámaras han cambiado de manos en unas mismas legislativas solo tres veces: 1946, 1994 y 2006. Esta es la cuarta. Lo que importa es dónde aterrizan realmente los contrapesos: los aranceles y la guerra son competencia del Ejecutivo, y las palancas del Congreso son el presupuesto y las comparecencias, no las órdenes directas.", "ja": "第二次大戦後、同じ中間選挙で上下両院の多数派が同時に入れ替わったのは1946年、1994年、2006年の3回だけ。今回は4回目にあたる。見るべきは「抑制」がどこに効くかだ。関税と戦争は行政権に属し、議会の道具は財布と公聴会であって、直接の命令ではない。"}}, {"idx": "02", "title": {"zh": "伊朗称 4 艘“违规”油轮在霍尔木兹触雷起火，同日击落第 56 架 MQ-9", "en": "Iran Says Four Tankers Hit Mines in Hormuz, Downing a 56th MQ-9", "es": "Irán dice que cuatro petroleros tocaron minas en Ormuz y derriba su dron MQ-9 número 56", "ja": "イラン、ホルムズでタンカー4隻が機雷に接触と発表　MQ-9 を56機目撃墜"}, "body": {"zh": "伊朗伊斯兰革命卫队海军 11 月 4 日发布声明称，4 艘“违规”油轮在试图穿越霍尔木兹海峡南部禁航区时触发水雷并起火燃烧，另有 2 艘“违规”船只被拦截并被迫停航。革命卫队航空航天部队称当天 4 时 30 分在海峡上空使用防空系统击落一架 MQ-9“死神”无人机，为被击落的第 56 架同型号。同日伊朗最高领袖穆杰塔巴发表声明称，美国中期选举不会改变美方对伊朗的敌意。", "en": "Iran’s Islamic Revolutionary Guard Corps Navy said on 4 November that four “non-compliant” tankers struck mines and caught fire while trying to cross a banned zone in the southern Strait of Hormuz, and that two more vessels were intercepted and ordered to stop. The Guards’ aerospace force said it downed an MQ-9 Reaper over the strait at 4:30 that morning with air-defence systems, the 56th of the type. Supreme Leader Mojtaba said the same day that the US midterms would not change Washington’s hostility toward Iran.", "es": "La Armada de la Guardia Revolucionaria iraní informó el 4 de noviembre de que cuatro petroleros “no autorizados” tocaron minas y se incendiaron al intentar cruzar una zona prohibida en el sur del estrecho de Ormuz, y que otras dos embarcaciones fueron interceptadas y obligadas a detenerse. Su fuerza aeroespacial aseguró haber derribado un dron MQ-9 Reaper sobre el estrecho a las 4:30 de esa mañana con sistemas antiaéreos, el número 56 de ese modelo. El líder supremo Mojtaba declaró ese mismo día que las legislativas estadounidenses no cambiarán la hostilidad de Washington hacia Irán.", "ja": "イラン革命防衛隊海軍は11月4日、ホルムズ海峡南部の航行禁止区域を通過しようとした「違反」タンカー4隻が機雷に接触して炎上し、さらに2隻を阻止して停船させたと発表した。革命防衛隊航空宇宙軍は同日午前4時30分、海峡上空で防空システムにより MQ-9 リーパー無人機1機を撃墜したとし、同型の撃墜は56機目にあたるという。最高指導者モジタバ師は同日、米中間選挙が米国の対イラン敵意を変えることはないとの声明を出した。"}, "why": {"zh": "海峡的通行量已经变成一个政治计量单位：谁“违规”、谁划“禁航区”，直接决定油轮保险费率与运价。有意思的是，同一批消息落地，油价反而跌了 8%——市场押注的是战争结束，而不是战争升级。", "en": "Traffic through the strait has become a political unit of measure: who is “non-compliant” and who draws the “banned zone” directly sets tanker insurance rates and freight. What is telling is that on the same news, crude fell 8% — the market is betting on the war ending, not escalating.", "es": "El tráfico por el estrecho se ha convertido en una unidad política de medida: quién es “no autorizado” y quién traza la “zona prohibida” determina directamente las primas de seguro y los fletes. Lo revelador es que, con esas mismas noticias, el crudo cayó un 8%: el mercado apuesta por el final de la guerra, no por su escalada.", "ja": "海峡の通航量は政治的な計量単位になった。誰が「違反」で、誰が「禁止区域」を引くかが、タンカーの保険料率と運賃を直接左右する。興味深いのは、同じ材料が出た日に原油が8％下落したことだ。市場が賭けているのは戦争の終結であり、拡大ではない。"}}, {"idx": "03", "tag": {"zh": "进展"}, "title": {"zh": "俄美乌 10 日阿布扎比复谈，5 日先在白宫谈局部停火", "en": "Russia, US and Ukraine to Meet in Abu Dhabi on 10 November, After a White House Talks on Local Ceasefire", "es": "Rusia, EE. UU. y Ucrania se verán en Abu Dabi el 10 de noviembre tras hablar de un alto el fuego local en la Casa Blanca", "ja": "米ロウクライナが10日にアブダビで再協議、5日はホワイトハウスで部分的停戦を協議"}, "body": {"zh": "俄罗斯总统新闻秘书佩斯科夫 11 月 3 日证实，俄、美、乌三方会谈将于 11 月 10 日至 11 日在阿联酋阿布扎比举行，俄方首席代表为梅金斯基；佩斯科夫同时表示，欧洲不能参加阿布扎比谈判，形式确定为俄乌参与、美国居中调解。白宫宣布总统夫人梅拉尼娅 5 日在白宫邀请俄乌代表会谈，讨论由她斡旋促成的赫尔松州奥列什基局部停火——该停火使近 800 人得以撤离，6 天期限已于 3 日结束，乌方指责俄军借机加固阵地。3 日凌晨起俄军持续袭击乌克兰能源系统，基辅一度全市停水。", "en": "Kremlin spokesman Dmitry Peskov confirmed on 3 November that trilateral talks between Russia, the United States and Ukraine will be held in Abu Dhabi on 10 and 11 November, with Vladimir Medinsky as Russia’s chief negotiator. Peskov also said Europe cannot take part in the Abu Dhabi talks, which are fixed as a Russia-Ukraine format with the United States mediating. The White House said first lady Melania Trump will host Russian and Ukrainian representatives on 5 November to discuss the local ceasefire in Oleshky, Kherson region, that she brokered — a pause that allowed nearly 800 people to leave and expired on 3 November after six days, with Ukraine accusing Russian forces of using it to reinforce positions. Russian strikes on Ukraine’s energy system continued from early on 3 November, and Kyiv briefly lost running water citywide.", "es": "El portavoz del Kremlin, Dmitri Peskov, confirmó el 3 de noviembre que las conversaciones tripartitas entre Rusia, Estados Unidos y Ucrania se celebrarán en Abu Dabi los días 10 y 11 de noviembre, con Vladimir Medinski como jefe negociador ruso. Peskov añadió que Europa no puede participar en las conversaciones de Abu Dabi, fijadas en formato Rusia-Ucrania con Estados Unidos como mediador. La Casa Blanca anunció que la primera dama, Melania Trump, recibirá el 5 de noviembre a representantes rusos y ucranianos para tratar el alto el fuego local en Oleshky, región de Jersón, que ella medió: una pausa que permitió salir a casi 800 personas y que expiró el 3 de noviembre tras seis días, mientras Ucrania acusa a las fuerzas rusas de aprovecharla para reforzar posiciones. Los ataques rusos contra el sistema energético ucraniano continuaron desde la madrugada del 3 y Kiev llegó a quedarse sin agua corriente.", "ja": "ロシア大統領府のペスコフ報道官は11月3日、米ロウクライナの三者協議が11月10〜11日にアラブ首長国連邦のアブダビで開かれると確認した。ロシア側の首席交渉担当はメジンスキー氏。ペスコフ氏はまた、欧州はアブダビ協議に参加できず、形式はロシアとウクライナが参加し米国が仲介する形で確定していると述べた。ホワイトハウスは、トランプ大統領夫人メラニア氏が5日にロシアとウクライナの代表を招き、自身が仲介したヘルソン州オレシキ周辺の部分的停戦について協議すると発表した。この停戦で約800人が退避できたが、6日間の期限は3日に切れ、ウクライナ側はロシア軍が陣地強化に利用したと非難している。ロシア軍は3日未明からウクライナのエネルギー施設への攻撃を続け、キエフでは一時全世帯が断水した。"}, "why": {"zh": "这次先谈的是能源设施停火、黑海粮食出口、加快换俘三件低敏感事项，领土与安全保障被留在门外。把低敏感议题先落地，等于把谈判从“一次性解决”改成“可分段交付”。", "en": "The agenda opens with three low-sensitivity items: a ceasefire on energy facilities, restoring Black Sea grain exports and speeding up prisoner exchanges. Territory and security guarantees stay outside the room. Delivering the easy items first turns the talks from a single settlement into something that can be handed over in instalments.", "es": "La agenda arranca con tres asuntos de baja sensibilidad: alto el fuego en las infraestructuras energéticas, restablecer las exportaciones de grano del mar Negro y acelerar los intercambios de prisioneros. El territorio y las garantías de seguridad quedan fuera de la sala. Entregar primero lo fácil convierte la negociación en algo que puede pagarse a plazos en lugar de resolverse de una vez.", "ja": "今回まず議題になるのは、エネルギー施設の停戦、黒海の穀物輸出の再開、捕虜交換の加速という感度の低い3項目だ。領土と安全保障は部屋の外に置かれる。易しい項目を先に決めることで、交渉は「一括解決」から「分割払い」に変わる。"}}, {"idx": "04", "title": {"zh": "特朗普称将停止每年约 40 亿美元对以色列军援", "en": "Trump Says He Will End About $4 Billion a Year in Military Aid to Israel", "es": "Trump dice que pondrá fin a unos 4.000 millones de dólares anuales de ayuda militar a Israel", "ja": "トランプ氏、イスラエルへの年約40億ドル軍事支援を停止すると表明"}, "body": {"zh": "特朗普表示，美国将停止向以色列提供每年总额约 40 亿美元的军事援助，并称双方已就此达成谅解。这一表态出现在中期选举失利与伊朗战事双重压力之下，具体执行时间与方式尚未公布。以色列方面暂未公开回应。此前美方已多次以“美国优先”为由重新审视对外军援规模。", "en": "Trump said the United States will stop providing Israel with about $4 billion a year in military aid, saying the two sides had reached an understanding on the move. The remark came under the twin pressure of the midterm defeat and the conflict with Iran; timing and mechanics have not been announced. Israel has not publicly responded. Washington had already been revisiting the scale of its foreign military aid under an “America First” rationale.", "es": "Trump afirmó que Estados Unidos dejará de entregar a Israel unos 4.000 millones de dólares anuales en ayuda militar y que ambas partes han alcanzado un entendimiento al respecto. El anuncio llega bajo la doble presión de la derrota electoral y del conflicto con Irán; no se han detallado plazos ni mecanismos. Israel no ha respondido públicamente. Washington ya venía revisando el volumen de su ayuda militar exterior con el argumento de “Estados Unidos primero”.", "ja": "トランプ大統領は、イスラエルへの年約40億ドルの軍事支援を停止すると述べ、双方がこの点で了解に達したと明らかにした。中間選挙の敗北とイランとの戦闘という二重の圧力下での発言で、実施時期や方法は公表されていない。イスラエル側は今のところ公式に反応していない。米国は以前から「アメリカ第一」を理由に対外軍事支援の規模を見直してきた。"}, "why": {"zh": "40 亿美元大致相当于以色列年度军购中很重要的一块。援助从“年度惯例”变成“可谈判项”，改变的不只是账面数字，还有地区各方对美方承诺可靠性的定价。", "en": "Four billion dollars is a substantial slice of Israel’s annual arms purchases. Turning aid from an annual routine into a negotiable item changes more than the ledger: it changes how every player in the region prices the reliability of American commitments.", "es": "Cuatro mil millones de dólares son una porción relevante de las compras anuales de armamento de Israel. Convertir la ayuda de rutina anual en partida negociable cambia más que el balance: cambia cómo cada actor de la región valora la fiabilidad de los compromisos estadounidenses.", "ja": "40億ドルはイスラエルの年間装備調達の相当部分を占める。支援が「毎年の慣例」から「交渉可能な項目」に変われば、変わるのは会計だけではない。地域の各主体が米国の約束の信頼性をどう値付けするかが変わる。"}}, {"idx": "05", "title": {"zh": "欧元区 10 月通胀升至 4.0%，欧盟储气量却是 2013 年以来最低", "en": "Eurozone Inflation Hits 4.0% as EU Gas Storage Sits at a 2013 Low", "es": "La inflación de la eurozona sube al 4,0% mientras el gas almacenado en la UE marca mínimos desde 2013", "ja": "ユーロ圏の10月物価は4.0％に上昇、EU のガス備蓄は2013年以来の低水準"}, "body": {"zh": "欧盟统计局 11 月 4 日初步估计，欧元区 10 月通胀率为 4.0%，高于 9 月的 3.8%，创三年来新高。国际能源署 3 日发布的报告显示，截至 10 月底，欧盟天然气储存设施储气量约占总容量的 75%，明显低于欧盟设定的 80% 最低目标，处于 2013 年以来的最低水平。两者叠加，冬季天然气价格波动风险上升。", "en": "A preliminary estimate from Eurostat on 4 November put eurozone inflation at 4.0% in October, up from 3.8% in September and the highest in three years. An International Energy Agency report on 3 November said EU gas storage stood at about 75% of capacity at the end of October, clearly below the bloc’s 80% minimum target and the lowest level since 2013. Together the two raise the risk of winter gas price volatility.", "es": "La estimación preliminar de Eurostat del 4 de noviembre situó la inflación de la eurozona en el 4,0% en octubre, frente al 3,8% de septiembre, el nivel más alto en tres años. Un informe de la Agencia Internacional de la Energía del 3 de noviembre indicó que el almacenamiento de gas de la UE estaba a finales de octubre en torno al 75% de su capacidad, muy por debajo del objetivo mínimo del 80% y en el nivel más bajo desde 2013. Ambos factores elevan el riesgo de volatilidad de los precios del gas en invierno.", "ja": "欧州統計局（ユーロスタット）が11月4日に公表した速報値によると、ユーロ圏の10月の消費者物価上昇率は4.0％となり、9月の3.8％から上昇して3年ぶりの高さとなった。国際エネルギー機関（IEA）が3日に公表した報告書では、10月末時点の EU のガス貯蔵量は能力の約75％にとどまり、EU が定める最低目標80％を大きく下回って2013年以来の低水準となった。両者が重なり、冬場のガス価格の変動リスクが高まっている。"}, "why": {"zh": "储气不足会先体现在价格曲线的近月端，再通过电价传导到通胀。欧洲央行 10 月刚维持利率不变，这份通胀数据把“降不降”变成了更难答的问题。", "en": "Thin storage shows up first at the front end of the price curve, then travels through electricity into inflation. The ECB held rates in October; this inflation print makes the question of whether to cut considerably harder to answer.", "es": "La falta de almacenamiento aparece primero en el tramo corto de la curva de precios y luego pasa por la electricidad a la inflación. El BCE mantuvo los tipos en octubre; este dato de inflación vuelve mucho más difícil responder si hay que recortar.", "ja": "備蓄不足はまず価格曲線の限月近くに表れ、電力価格を通じて物価に伝わる。ECB は10月に金利を据え置いたばかりで、今回の物価統計は「利下げするかどうか」を一段と難しい問いに変えた。"}}]}, {"key": "dom", "num": "02", "color": "#cf2f1e", "deep": "#a8231a", "name": {"zh": "国内要闻", "en": "CHINA", "es": "CHINA", "ja": "国内要聞"}, "items": [{"idx": "01", "title": {"zh": "第九届进博会今日开幕：4142 家境外企业、480 余件首发", "en": "Ninth CIIE Opens: 4,142 Foreign Firms and Over 480 Debuts", "es": "Abre la novena CIIE: 4.142 empresas extranjeras y más de 480 estrenos", "ja": "第9回輸入博が開幕　海外企業4,142社、初公開480件超"}, "body": {"zh": "第九届中国国际进口博览会 11 月 5 日至 10 日在国家会展中心（上海）举行。整体展览面积首次突破 44 万平方米，企业展面积首次突破 37 万平方米；来自 148 个国家和地区的 4142 家境外企业参展，数量创历届之最，其中首次参展企业超过 2000 家，美国企业参展面积超过 5 万平方米、连续八届居首。全球首发、亚洲首展、中国首秀的代表性展品超过 480 件。中国馆展出长征十号乙运载火箭海上回收、紧凑型聚变能实验装置、CR450 动车组模拟驾驶舱与分体式飞行汽车等。", "en": "The ninth China International Import Expo runs from 5 to 10 November at the National Exhibition and Convention Center in Shanghai. Total exhibition space exceeds 440,000 square metres for the first time, with corporate exhibition space above 370,000 square metres. Some 4,142 foreign companies from 148 countries and regions are taking part, the most ever, including more than 2,000 first-time exhibitors; US firms occupy over 50,000 square metres, topping the list for an eighth straight edition. More than 480 representative products are making a global, Asian or China debut. The China Pavilion shows the Long March 10B rocket’s sea recovery, a compact fusion test device, a CR450 train simulator cab and a split-configuration flying car.", "es": "La novena Exposición Internacional de Importaciones de China se celebra del 5 al 10 de noviembre en el Centro Nacional de Exposiciones y Convenciones de Shanghái. La superficie total supera por primera vez los 440.000 metros cuadrados y la de la muestra empresarial los 370.000. Participan 4.142 empresas extranjeras de 148 países y regiones, la cifra más alta hasta ahora, con más de 2.000 expositores primerizos; las empresas estadounidenses ocupan más de 50.000 metros cuadrados y encabezan la lista por octava edición consecutiva. Más de 480 productos representativos se presentan por primera vez al mundo, a Asia o a China. El pabellón de China muestra la recuperación marina del cohete Larga Marcha 10B, un dispositivo compacto de fusión, la cabina de simulación del tren CR450 y un coche volador de configuración dividida.", "ja": "第9回中国国際輸入博覧会が11月5〜10日、上海の国家会展中心で開かれる。総展示面積は初めて44万平方メートルを超え、企業展示は37万平方メートル超。148の国・地域から4,142社の海外企業が参加し過去最多となった。初出展は2,000社超。米国企業の出展面積は5万平方メートル超で8回連続の首位。世界初公開・アジア初公開・中国初公開の代表的な展示は480件超。中国館では長征10号乙ロケットの海上回収、小型核融合実験装置、CR450 動車組の模擬運転席、分割型空飛ぶクルマなどが展示される。"}, "why": {"zh": "今年前 9 个月中国进口 16.7 万亿元、同比增长 22.3%，是 2021 年以来最快增速。进博会的“首发数量”本质上是外资对中国市场定价权的一次投票。", "en": "China imported 16.7 trillion yuan in the first nine months of the year, up 22.3% and the fastest pace since 2021. The number of debuts at the expo is, at bottom, foreign investors voting on how much pricing power the Chinese market still holds.", "es": "China importó 16,7 billones de yuanes en los primeros nueve meses del año, un 22,3% más, el ritmo más rápido desde 2021. El número de estrenos de la feria es, en el fondo, un voto de los inversores extranjeros sobre cuánto poder de fijación de precios conserva el mercado chino.", "ja": "中国の今年1〜9月の輸入額は16兆7,000億元、前年同期比22.3％増で2021年以来の高い伸びとなった。輸入博の「初公開件数」は、中国市場がどれだけ価格決定力を持つかに対する外資の投票でもある。"}}, {"idx": "02", "title": {"zh": "五部门发布全面节约战略行动方案，重点行业“一行一策”节能降碳", "en": "Five Ministries Issue a National Thrift Strategy, With Sector-by-Sector Energy Targets", "es": "Cinco ministerios publican una estrategia nacional de ahorro con objetivos energéticos por sector", "ja": "5部門が全面節約戦略の行動方案を公表　重点業種は「業種別」で省エネ・脱炭素"}, "body": {"zh": "11 月 4 日，国家发展改革委等五部门发布《实施全面节约战略行动方案》，提出大力推进重点领域节能、提高集约高效利用水平，对重点行业按“一行一策”开展节能降碳改造。方案同时涉及餐饮消费环节，引导外卖平台和商户推广小份餐品，防止“满减凑单”诱导过量点餐。", "en": "On 4 November the National Development and Reform Commission and four other departments issued an action plan for a national thrift strategy, calling for stronger energy saving in key sectors, more intensive and efficient use of resources, and sector-specific upgrades to cut energy use and carbon emissions. It also covers food service, asking delivery platforms and merchants to promote smaller portions and to prevent discount bundling from pushing customers to over-order.", "es": "El 4 de noviembre, la Comisión Nacional de Desarrollo y Reforma y otros cuatro departamentos publicaron un plan de acción para una estrategia nacional de ahorro: más eficiencia energética en sectores clave, uso más intensivo de recursos y modernizaciones adaptadas a cada industria para recortar energía y emisiones. El plan también abarca la restauración y pide a las plataformas de reparto y a los comercios promover raciones más pequeñas y evitar que los descuentos por acumulación induzcan a pedir de más.", "ja": "国家発展改革委員会など5部門は11月4日、「全面節約戦略の実施に関する行動方案」を公表した。重点分野の省エネを強く推進し、集約的で効率的な利用水準を高め、重点業種では業種ごとの方針で省エネ・脱炭素改修を行う。外食・消費の分野にも触れ、デリバリー平台と店舗に小盛りメニューの普及を促し、割引のまとめ買いが過剰注文を誘うのを防ぐとした。"}, "why": {"zh": "“节约”从号召变成可考核的行业方案，抓手是能耗与物耗强度，而不是简单少用。小份餐品这一条落在平台规则上，改的是激励结构。", "en": "Thrift moves from slogan to a measurable sector plan, anchored in energy and material intensity rather than simply using less. The smaller-portion item lands on platform rules, which means it is changing incentives, not just advice.", "es": "El ahorro pasa de consigna a plan sectorial medible, anclado en la intensidad de energía y materiales más que en usar menos sin más. La medida de las raciones pequeñas actúa sobre las reglas de las plataformas: cambia incentivos, no solo recomendaciones.", "ja": "「節約」は掛け声から測定可能な業種別計画に変わり、根拠はエネルギー・物資の投入強度であって、単に使用量を減らすことではない。小盛りメニューの項目はプラットフォームのルールに落ちており、変わるのは助言ではなくインセンティブだ。"}}, {"idx": "03", "title": {"zh": "秋粮收获过九成、丰收已成定局，四川达到血吸虫病消除状态", "en": "Autumn Grain Harvest Past 90% and Assured; Sichuan Clears Schistosomiasis", "es": "La cosecha de otoño supera el 90% y Sichuan elimina la esquistosomiasis", "ja": "秋穀の収穫が9割超で豊作確定、四川省は住血吸虫症の消除を達成"}, "body": {"zh": "农业农村部 11 月 4 日表示，今年秋粮面积预计稳中略增，目前收获过九成，丰收已成定局，全年粮食产量有望连续 3 年保持在 1.4 万亿斤以上。国家疾控局会同多部门印发通知，确认四川省达到血吸虫病消除状态。四川曾是我国血吸虫病重流行省之一，历史累计病人 127.57 万人。", "en": "The Ministry of Agriculture and Rural Affairs said on 4 November that the autumn grain area edged up this year, more than 90% has been harvested and a good harvest is assured, with full-year output likely to stay above 1.4 trillion jin for a third consecutive year. The National Disease Control and Prevention Administration and other departments confirmed that Sichuan has reached elimination status for schistosomiasis. Sichuan was once one of China’s hardest-hit provinces, with 1.2757 million cumulative cases.", "es": "El Ministerio de Agricultura y Asuntos Rurales informó el 4 de noviembre de que la superficie de grano de otoño creció ligeramente, más del 90% ya está cosechado y la buena cosecha está asegurada, con una producción anual que probablemente supere por tercer año consecutivo 1,4 billones de jin. La Administración Nacional de Control y Prevención de Enfermedades y otros departamentos confirmaron que Sichuan alcanzó el estado de eliminación de la esquistosomiasis. Sichuan fue una de las provincias más afectadas, con 1.2757 millones de casos acumulados.", "ja": "農業農村部は11月4日、今年の秋穀の作付面積はほぼ横ばいから微増で、収穫は9割を超え豊作が確定したと発表した。年間の食糧生産量は3年連続で1兆4,000億斤以上を維持する見通し。国家疾病予防制御局などは、四川省が住血吸虫症の「消除」状態に達したと確認した。四川省はかって国内有数の流行省で、累計患者は127万5,700人に上った。"}, "why": {"zh": "连续三年站上 1.4 万亿斤，说明增产已经从“面积扩张”转到“单产与抗灾”。血吸虫病消除是另一条线：一个历史累计百万病例的省份走到“消除”，靠的是查螺、改水、监测的长期投入。", "en": "Three straight years above 1.4 trillion jin shows that output growth now comes from yields and disaster resilience rather than from expanding area. The schistosomiasis milestone is a different line: a province with a million-plus historical cases reaching elimination rests on decades of snail surveys, water-system changes and surveillance.", "es": "Tres años consecutivos por encima de 1,4 billones de jin muestran que el aumento ya no viene de ampliar superficie, sino de los rendimientos y la resiliencia. El hito de la esquistosomiasis es otra línea: que una provincia con más de un millón de casos históricos llegue a la eliminación se apoya en décadas de muestreos de caracoles, obras de agua y vigilancia.", "ja": "3年連続で1兆4,000億斤を超えたことは、増産の原動力が作付面積の拡大から単収と災害耐性へ移ったことを示す。住血吸虫症の達成は別の線だ。累計100万例超の省が「消除」に到達した背景には、貝の調査、用水の整備、監視への長期的な投資がある。"}}, {"idx": "04", "title": {"zh": "“十五五”将新建约 1.5 万公里铁路，广交会境外采购商创新高", "en": "China to Add 15,000 km of Rail in the 15th Five-Year Plan; Canton Fair Buyers Hit a Record", "es": "China sumará unos 15.000 km de ferrocarril y la Feria de Cantón marca un récord de compradores", "ja": "第15次五カ年計画で鉄道約1万5,000キロ新設、広州交易会の海外バイヤーは過去最多"}, "body": {"zh": "国家发展改革委表示，“十五五”时期我国将新建约 1.5 万公里铁路，推进时速 400 公里高铁商业化运营，并适度超前构建现代化基础设施体系；预计到“十五五”末，社会消费品零售总额达到 60 万亿元左右。第 140 届中国进出口商品交易会 11 月 4 日闭幕，截至 3 日，来自 219 个国家和地区的 35.2 万名境外采购商到会，较上届增长 12.2%，规模再创历史新高。", "en": "The National Development and Reform Commission said China will build about 15,000 km of new railway in the 15th Five-Year Plan period, push commercial operation of 400 km/h high-speed rail, and build modern infrastructure moderately ahead of demand. Retail sales of consumer goods are expected to reach about 60 trillion yuan by the end of the period. The 140th Canton Fair closed on 4 November; as of 3 November it had drawn 352,000 overseas buyers from 219 countries and regions, up 12.2% on the previous session and a record.", "es": "La Comisión Nacional de Desarrollo y Reforma anunció que China construirá unos 15.000 km de ferrocarril en el décimo quinto plan quinquenal, impulsará la explotación comercial de trenes de alta velocidad a 400 km/h y desplegará infraestructura moderna ligeramente por delante de la demanda. Se prevé que el comercio minorista de bienes de consumo llegue a unos 60 billones de yuanes al final del periodo. La 140.ª Feria de Cantón cerró el 4 de noviembre; al 3 de noviembre había recibido 352.000 compradores de 219 países y regiones, un 12,2% más que en la edición anterior y un récord.", "ja": "国家発展改革委員会は、第15次五カ年計画期間に鉄道を約1万5,000キロ新設し、時速400キロの高速鉄道の商業運営を進め、近代的なインフラ体系を需要よりやや先行して整備すると表明した。期間末の社会消費財小売総額は約60兆元を見込む。第140回中国輸出入商品交易会（広州交易会）は11月4日に閉幕し、3日時点で219の国・地域から35万2,000人の海外バイヤーが来場、前回比12.2％増で過去最多を更新した。"}, "why": {"zh": "400 公里商业化意味着高铁的竞争对象从民航短途航线扩展到中长途。广交会的采购商结构比成交额更能说明问题：新兴市场客商正在补位。", "en": "Commercial 400 km/h service pushes high-speed rail from competing with short-haul flights into the medium-haul market. At Canton Fair, the buyer mix says more than the order book: traders from emerging markets are filling the gap.", "es": "Operar a 400 km/h lleva a la alta velocidad de competir con los vuelos de corto radio al mercado de medio radio. En Cantón, la composición de compradores dice más que el volumen de pedidos: los operadores de mercados emergentes están cubriendo el hueco.", "ja": "時速400キロの商業運営は、高速鉄道の競合相手を短距離航空から中距離へ広げる。広州交易会では、成約額よりもバイヤー構成のほうが雄弁だ。新興市場のバイヤーが穴を埋めている。"}}, {"idx": "05", "title": {"zh": "2027 年军队文职人员招考今日 8 时起报名", "en": "Registration Opens for 2027 Civilian Military Posts", "es": "Se abre la inscripción para los puestos civiles militares de 2027", "ja": "2027年軍隊文職の募集が5日午前8時から開始"}, "body": {"zh": "中央军委政治工作部近日部署展开 2027 年军队文职人员公开招考工作，考生可于 11 月 5 日 8 时至 10 日 18 时登录军队人才网进行网上报名。2026 年下半年中小学教师资格考试（笔试）成绩将于 11 月 6 日发布，考生可通过中国教育考试网及其各平台小程序查询。", "en": "The Political Work Department of the Central Military Commission has launched recruitment for 2027 civilian military positions. Candidates can register online at the military talent website from 8:00 on 5 November to 18:00 on 10 November. Results of the written teaching-certificate exam held in the second half of 2026 will be released on 6 November and can be checked through the China Education Examinations website and its mini-programs.", "es": "El Departamento de Trabajo Político de la Comisión Militar Central ha abierto la convocatoria de plazas civiles militares para 2027. Los candidatos pueden inscribirse en línea en el portal de talento militar desde las 8:00 del 5 de noviembre hasta las 18:00 del 10 de noviembre. Las notas del examen escrito de certificación docente del segundo semestre de 2026 se publicarán el 6 de noviembre y podrán consultarse en la web del Centro Nacional de Exámenes Educativos y sus miniaplicaciones.", "ja": "中央軍事委員会政治工作部は2027年の軍隊文職員の公開募集を開始した。受験者は11月5日午前8時から10日午後6時まで、軍隊人材網でオンライン登録できる。2026年下半期の小中学校教育資格試験（筆記）の結果は11月6日に公表され、中国教育考試網と各プラットフォームのミニアプリで確認できる。"}, "why": {"zh": "把报名窗口压到 6 天，是典型的“短窗口高效率”安排：既减少观望，也把资格审查的压力集中在同一时段。", "en": "Compressing registration into six days is a classic short-window, high-throughput design: it cuts down on waiting to see how the field shapes up and concentrates the eligibility checks into one block.", "es": "Comprimir la inscripción en seis días es un diseño clásico de ventana corta y alto rendimiento: reduce la espera para ver cómo se perfila la competencia y concentra la verificación de requisitos en un solo bloque.", "ja": "受付期間を6日に圧縮するのは、短い窓口で効率を上げる典型的な設計だ。様子見を減らし、資格審査の負荷を同じ時期に集中させる。"}}]}, {"key": "fin", "num": "03", "color": "#b45309", "deep": "#8f4207", "name": {"zh": "金融要闻", "en": "MARKETS", "es": "MERCADOS", "ja": "金融要聞"}, "items": [{"idx": "01", "tag": {"zh": "进展"}, "title": {"zh": "A 股放量长阳：科创综指涨 9.90% 创发布以来最大单日，成交重回 2 万亿", "en": "A-Shares Surge: STAR Composite Rises 9.90% in Record One-Day Gain, Turnover Back Above 2 Trillion Yuan", "es": "Fuerte rebote en China: el STAR Composite sube un 9,90%, su mayor alza diaria, y el volumen vuelve a 2 billones de yuanes", "ja": "A株が大幅反発、STAR 総合指数9.90％高で過去最大の上げ幅　売買代金は2兆元台に回復"}, "body": {"zh": "11 月 4 日 A 股午后直线拉升。上证指数收 3686.17 点涨 2.16%，深证成指涨 4.22%，创业板指涨 6.40%，科创综指涨 9.90% 创该指数发布以来最大单日涨幅，科创 50 涨 9.92%。全市场 4667 只个股上涨、123 只涨停，成交额 2.05 万亿元，为 9 月 23 日以来首次重返 2 万亿上方，较前一交易日放量约 3368 亿元。申万半导体指数涨 11.41% 居首，电子行业获逾 314 亿元主力净流入；贵金属、CRO 同步走强，食品饮料、煤炭、银行走低。股票型 ETF 自 9 月 28 日起连续 22 个交易日净流入，累计约 5559 亿元。", "en": "A-shares surged in the afternoon of 4 November. The Shanghai Composite closed at 3,686.17, up 2.16%; the Shenzhen Component rose 4.22%, ChiNext 6.40%, and the STAR Composite 9.90%, its biggest one-day gain since launch, with the STAR 50 up 9.92%. Some 4,667 stocks advanced and 123 hit the daily limit, on turnover of 2.05 trillion yuan — the first time above 2 trillion since 23 September, up about 336.8 billion yuan on the day. The Shenwan semiconductor index led with an 11.41% gain and electronics drew more than 31.4 billion yuan of net main-force inflows; precious metals and CRO names also rose, while food and beverage, coal and banks fell. Equity ETFs have now seen 22 consecutive sessions of net inflows since 28 September, totalling about 555.9 billion yuan.", "es": "La bolsa china subió con fuerza en la tarde del 4 de noviembre. El compuesto de Shanghái cerró en 3.686,17 puntos (+2,16%), el componente de Shenzhen avanzó un 4,22%, ChiNext un 6,40% y el STAR Composite un 9,90%, su mayor alza diaria desde su creación, con el STAR 50 un 9,92%. Subieron 4.667 valores y 123 tocaron el límite diario, con un volumen de 2,05 billones de yuanes, el primero por encima de 2 billones desde el 23 de septiembre y unos 336.800 millones más que el día anterior. El índice de semiconductores de Shenwan lideró con un 11,41% y el sector electrónico atrajo más de 31.400 millones de yuanes de flujo institucional neto; también subieron metales preciosos y CRO, mientras alimentos y bebidas, carbón y banca cayeron. Los ETF de renta variable acumulan 22 sesiones consecutivas de entradas netas desde el 28 de septiembre, por unos 555.900 millones de yuanes.", "ja": "11月4日の中国本土株は午後に急伸した。上海総合指数は3,686.17で2.16％高、深セン成分指数は4.22％高、創業板指数は6.40％高、STAR 総合指数は9.90％高と算出開始以来最大の上げ幅、STAR 50 は9.92％高。4,667銘柄が上昇し123銘柄がストップ高、売買代金は2兆500億元で9月23日以来となる2兆元台を回復し、前日比約3,368億元増。申万半導体指数が11.41％高で首位、電子セクターには主力資金が314億元超流入した。貴金属や CRO も上昇し、食品飲料・石炭・銀行は下落。株式型 ETF は9月28日から22営業日連続で資金流入し、累計約5,559億元となった。"}, "why": {"zh": "这轮上涨的三块基石是：回购增持再贷款利率降到 1%、半导体前期跌幅足够深、海外风险偏好因选举落地而修复。需要留意的是，11 月是三季报后的业绩真空期，领涨能不能从“题材”换到“订单”才是关键。", "en": "Three pillars carried the move: the relending rate for buybacks and stake purchases cut to 1%, a semiconductor sector that had fallen far enough, and an overseas risk appetite repaired by the election outcome. The caveat is that November is an earnings vacuum after the third-quarter reports, so the key question is whether leadership can shift from themes to verifiable orders.", "es": "Tres pilares sostuvieron el movimiento: el tipo del préstamo para recompras rebajado al 1%, un sector de semiconductores que ya había caído lo suficiente y un apetito de riesgo exterior reparado por el resultado electoral. La advertencia es que noviembre es un vacío de resultados tras los informes del tercer trimestre, así que la clave es si el liderazgo pasa de los temas a los pedidos verificables.", "ja": "上昇を支えた柱は3つ。自社株買い・持ち株増強向け再貸出の金利1％への引き下げ、十分に下落していた半導体、そして選挙結果で回復した海外のリスク選好だ。留意点は、11月が3四半期決算後の業績空白期間であること。主導役が「テーマ」から「確認できる受注」へ移れるかが鍵になる。"}}, {"idx": "02", "tag": {"zh": "进展"}, "title": {"zh": "美股道指涨约 1500 点，苹果涨超 5%，中国资产走强", "en": "Dow Jumps About 1,500 Points, Apple Gains Over 5%, Chinese Assets Rally", "es": "El Dow sube unos 1.500 puntos, Apple gana más del 5% y los activos chinos avanzan", "ja": "米ダウ平均が約1,500ポイント高、Apple は5％超高、中国資産も上昇"}, "body": {"zh": "11 月 4 日美股三大指数显著上涨。道指涨约 1500 点、涨幅逾 3%，纳指涨超 1%，标普 500 同步走高；大型科技股多数上涨，苹果涨超 5%，纳斯达克中国金龙指数涨 3.49%。存储与光通信板块逆势下跌，美光跌 7%。欧洲股市同步上行，德国 DAX 指数涨 2.22% 报 26437.67 点。", "en": "All three main US indices rose sharply on 4 November. The Dow added about 1,500 points, more than 3%, the Nasdaq gained over 1% and the S&P 500 also advanced. Most big tech names rose, with Apple up more than 5%, and the Nasdaq Golden Dragon China index climbed 3.49%. Memory and optical-communications shares bucked the trend, with Micron down 7%. European markets rose in step, the German DAX gaining 2.22% to 26,437.67.", "es": "Los tres grandes índices estadounidenses subieron con fuerza el 4 de noviembre. El Dow sumó unos 1.500 puntos, más del 3%; el Nasdaq avanzó más del 1% y el S&P 500 también cerró al alza. La mayoría de las grandes tecnológicas subió, con Apple más del 5%, y el índice Golden Dragon de China en el Nasdaq ganó un 3,49%. Memoria y comunicaciones ópticas cayeron a contracorriente, con Micron un 7% abajo. Europa acompañó: el DAX alemán subió un 2,22% hasta 26.437,67.", "ja": "11月4日の米国株は主要3指数がそろって大きく上昇した。ダウ平均は約1,500ポイント（3％超）高、ナスダックは1％超高、S&P 500 も上昇。大型テクノロジー株はほぼ全面高で Apple は5％超上昇し、ナスダック中国金龍指数は3.49％高。メモリーと光通信は逆行安となり、Micron は7％下落した。欧州株も追随し、ドイツの DAX は2.22％高の26,437.67で引けた。"}, "why": {"zh": "“分裂政府”历来被华尔街视为利好——过去 15 次中期选举后有 14 次一年期收益为正。但这次是民主党横扫，市场买的其实是“战争与关税的尾部风险下降”，而不是政策友好。", "en": "Wall Street has historically liked divided government: in 15 past midterms, one-year returns were positive 14 times. This time the Democrats swept both chambers, so what the market bought was a fall in the tail risk from war and tariffs, not policy friendliness.", "es": "A Wall Street le ha gustado históricamente el gobierno dividido: en 15 legislativas anteriores, el retorno a un año fue positivo 14 veces. Ahora los demócratas arrasaron en ambas cámaras, así que lo que compró el mercado fue una caída del riesgo de cola por guerra y aranceles, no afinidad política.", "ja": "ウォール街は伝統的に「分割政府」を好む。過去15回の中間選挙では、1年後のリターンが14回プラスだった。今回は民主党が両院を制したため、市場が買ったのは政策への好意ではなく、戦争と関税というテールリスクの低下である。"}}, {"idx": "03", "tag": {"zh": "进展"}, "title": {"zh": "油价单日跌逾 8%，黄金重回 4070 美元、白银涨 5%", "en": "Oil Falls More Than 8% in a Day; Gold Back Above $4,070, Silver Up 5%", "es": "El petróleo cae más del 8% en un día; el oro vuelve a 4.070 dólares y la plata sube un 5%", "ja": "原油が1日で8％超下落、金は4,070ドル台に回復し銀は5％高"}, "body": {"zh": "11 月 4 日国际油价大幅下挫。纽约商品交易所 12 月交货轻质原油期货下跌 7.97 美元，收于每桶 88.12 美元，跌幅 8.29%；伦敦布伦特 1 月合约下跌 8.98 美元，收于 94.62 美元，跌幅 8.67%。贵金属同步走强，COMEX 黄金期货涨 3.34% 报 4072.2 美元/盎司，白银涨 5.17% 报 52.33 美元/盎司。美元指数下跌 0.3%，收于 101.566。", "en": "Oil fell sharply on 4 November. December light sweet crude on the New York Mercantile Exchange dropped $7.97 to settle at $88.12 a barrel, a fall of 8.29%; January Brent fell $8.98 to $94.62, down 8.67%. Precious metals rose: COMEX gold gained 3.34% to $4,072.2 an ounce and silver 5.17% to $52.33. The dollar index slipped 0.3% to 101.566.", "es": "El petróleo cayó con fuerza el 4 de noviembre. El crudo ligero de diciembre en Nueva York perdió 7,97 dólares y cerró en 88,12 dólares por barril, un 8,29% menos; el Brent de enero bajó 8,98 dólares hasta 94,62, un 8,67%. Los metales preciosos subieron: el oro COMEX ganó un 3,34% hasta 4.072,2 dólares la onza y la plata un 5,17% hasta 52,33. El índice del dólar cedió un 0,3% hasta 101,566.", "ja": "11月4日の原油は大きく下落した。ニューヨークの12月限軽質原油は7.97ドル安の1バレル88.12ドル（8.29％安）、ロンドンの1月限ブレントは8.98ドル安の94.62ドル（8.67％安）。貴金属は上昇し、COMEX 金は3.34％高の1オンス4,072.2ドル、銀は5.17％高の52.33ドル。ドル指数は0.3％安の101.566だった。"}, "why": {"zh": "油价与黄金同一天反向大涨，说明资金不是在交易“通胀”，而是在交易“风险重估”：原油回吐战争溢价，黄金接住降级带来的降息想象。", "en": "Oil falling while gold jumped the same day says the money is not trading inflation but a repricing of risk: crude gave back the war premium, and gold caught the rate-cut imagination that de-escalation brings.", "es": "Que el petróleo caiga y el oro suba el mismo día indica que el dinero no opera con la inflación sino con una revalorización del riesgo: el crudo devolvió la prima de guerra y el oro recogió la expectativa de recortes que trae la desescalada.", "ja": "同じ日に原油が下がり金が急騰したのは、資金が「インフレ」ではなく「リスクの再評価」を取引している証拠だ。原油は戦争プレミアムを返上し、金は緊張緩和がもたらす利下げ期待を受け止めた。"}}, {"idx": "04", "tag": {"zh": "进展"}, "title": {"zh": "央行下调股票回购增持再贷款利率至 1%，已报额度超 2000 亿元", "en": "PBOC Cuts Relending Rate for Buybacks to 1%; Banks Request Over 200 Billion Yuan", "es": "El banco central chino baja al 1% el tipo para recompras y los bancos piden más de 200.000 millones", "ja": "中国人民銀行が自社株買い向け再貸出金利を1％に引き下げ、申込額は2,000億元超"}, "body": {"zh": "中国人民银行 11 月 4 日公告，为维护资本市场平稳运行，自 11 月 4 日起下调股票回购增持再贷款利率 0.25 个百分点至 1%。支持对象为 21 家全国性银行和 5 家系统重要性城商行，支持比例 100%，期限 1 年。目前各银行已向央行报送额度申请超过 2000 亿元，央行表示后续将提供充足的再贷款额度保障。此前该项工具已转为长期制度性安排。", "en": "The People’s Bank of China said on 4 November that it would cut the relending rate for share buybacks and stake purchases by 0.25 percentage point to 1%, effective the same day, to keep capital markets stable. The facility covers 21 national banks and five systemically important city commercial banks, funds 100% of eligible loans and runs for one year. Banks have already applied for more than 200 billion yuan of quota, and the central bank said it will provide ample relending capacity. The tool had earlier been made a long-term institutional arrangement.", "es": "El Banco Popular de China anunció el 4 de noviembre que recortará 0,25 puntos porcentuales el tipo del préstamo para recompras de acciones y compras de participaciones, hasta el 1%, con efecto ese mismo día, para mantener estables los mercados de capitales. El mecanismo cubre a 21 bancos nacionales y cinco bancos municipales de importancia sistémica, financia el 100% de los préstamos elegibles y tiene un año de plazo. Los bancos ya han solicitado más de 200.000 millones de yuanes de cupo y el banco central dijo que ofrecerá capacidad suficiente. La herramienta ya se había convertido en un arreglo institucional de largo plazo.", "ja": "中国人民銀行は11月4日、資本市場の安定のため、自社株買い・持ち株増強向け再貸出の金利を0.25ポイント引き下げて1％とすると発表した。同日施行。対象は全国性銀行21行とシステム上重要な都市商業銀行5行で、支援比率は100％、期間は1年。各行はすでに2,000億元超の枠を申請しており、中国人民銀行は十分な再貸出枠を確保するとしている。この制度は以前から長期的な制度的取り決めに位置づけられていた。"}, "why": {"zh": "从“阶段性工具”到“制度性安排”，再把资金成本压到 1%，政策意图很清楚：让回购增持变成企业可以按年规划的常规动作，而不是救急手段。", "en": "From a temporary tool to a standing arrangement, and now a funding cost of 1%: the intent is clear — make buybacks and insider purchases something companies can plan annually rather than an emergency measure.", "es": "De instrumento temporal a arreglo permanente y ahora un coste del 1%: la intención es clara. Que las recompras y las compras de directivos sean algo planificable cada año y no una medida de urgencia.", "ja": "一時的な道具から制度的な取り決めへ、さらに資金コストを1％まで下げる。狙いは明確だ。自社株買いと役員の持ち株増強を、緊急措置ではなく毎年計画できる通常業務に変えることにある。"}}, {"idx": "05", "title": {"zh": "前三季度黄金产量同比降 18.71%，消费量微增 0.28%", "en": "China’s Gold Output Falls 18.71% as Consumption Edges Up 0.28%", "es": "La producción china de oro cae un 18,71% y el consumo sube apenas un 0,28%", "ja": "中国の金生産は18.71％減、消費は0.28％増にとどまる"}, "body": {"zh": "中国黄金协会数据显示，今年前三季度我国黄金产量 220.935 吨，同比下降 18.71%；黄金消费量 684.623 吨，同比增长 0.28%。同期国际金价在高位反复，11 月 4 日 COMEX 黄金重回 4070 美元上方。", "en": "Data from the China Gold Association show domestic gold output of 220.935 tonnes in the first three quarters, down 18.71% year on year, while consumption reached 684.623 tonnes, up 0.28%. International prices have churned at high levels, with COMEX gold back above $4,070 on 4 November.", "es": "Los datos de la Asociación del Oro de China muestran una producción nacional de 220,935 toneladas en los tres primeros trimestres, un 18,71% menos interanual, y un consumo de 684,623 toneladas, un 0,28% más. El precio internacional se ha movido en niveles altos y el oro COMEX recuperó los 4.070 dólares el 4 de noviembre.", "ja": "中国金協会のデータによると、今年1〜9月の国内金生産は220.935トンで前年同期比18.71％減、消費量は684.623トンで同0.28％増だった。国際価格は高値圏でもみ合い、11月4日には COMEX 金が4,070ドル台を回復した。"}, "why": {"zh": "产量降近两成、消费几乎零增长，说明高价已开始抑制实物需求，金价的边际定价权更多落在投资与央行购金上。国内金饰零售的“以价换量”会更明显。", "en": "Output down nearly a fifth and consumption flat says high prices are already suppressing physical demand, leaving investment and central-bank buying to set the marginal price. In Chinese jewellery retail, trading price for volume will become more visible.", "es": "Una producción casi un quinto menor y un consumo plano indican que los precios altos ya frenan la demanda física, de modo que la inversión y las compras de bancos centrales fijan el precio marginal. En la joyería china se verá más el intercambio de precio por volumen.", "ja": "生産が2割近く減り消費がほぼ横ばいということは、高値が実物需要をすでに抑えているということだ。限界的な価格形成は投資と中央銀行の購入に移る。中国の宝飾小売では「値下げして量を取る」動きがより鮮明になる。"}}]}, {"key": "spo", "num": "04", "color": "#15803d", "deep": "#0f6a31", "name": {"zh": "体育竞技", "en": "SPORTS", "es": "DEPORTES", "ja": "スポーツ"}, "items": [{"idx": "01", "title": {"zh": "欧冠一夜两场 3 比 2：皇马补时绝杀，利物浦两次领先被翻盘", "en": "Two 3-2 Games in One Night: Real Madrid Win in Stoppage Time, Liverpool Let a Lead Slip Twice", "es": "Dos 3-2 en una noche: el Madrid gana en el descuento y el Liverpool deja escapar dos ventajas", "ja": "欧州 CL は一夜で3-2が2試合　レアルは終了間際に決勝点、リバプールは2度のリードを守れず"}, "body": {"zh": "11 月 5 日凌晨，欧冠联赛阶段第 5 轮，皇马客场 3 比 2 战胜雅典 AEK：科伊塔第 12 分钟先拔头筹，贝林厄姆第 33 分钟脚后跟扳平；皮利奥斯第 75 分钟再度超出，姆巴佩一分钟后追平，巴尔韦德补时第 2 分钟远射绝杀，皇马取得四连胜。同一夜利物浦客场 2 比 3 负于费内巴切：19 岁 127 天的尼奥尼第 25 分钟打进一线队首球，格林伍德任意球折射扳平；伊萨克第 69 分钟头球再度领先，随后阿奇·布朗与穆里奇 6 分钟内连入两球完成反超，利物浦遭遇本赛季欧冠首败。", "en": "In the early hours of 5 November, Real Madrid won 3-2 at AEK Athens in matchday five of the Champions League league phase. Koita opened the scoring on 12 minutes, Bellingham equalised with a backheel on 33; Pilios put AEK ahead again on 75, Mbappé levelled a minute later and Valverde struck a long-range winner in the second minute of stoppage time for a fourth straight win. The same night Liverpool lost 3-2 at Fenerbahçe: 19-year-old Nyoni scored his first senior goal on 25 minutes, Greenwood equalised with a deflected free kick, Isak headed Liverpool back in front on 69, and then Archie Brown and Murić scored within six minutes to complete the comeback — Liverpool’s first Champions League defeat of the season.", "es": "En la madrugada del 5 de noviembre, el Real Madrid ganó 3-2 en casa del AEK de Atenas en la quinta jornada de la fase liga de la Champions. Koita abrió el marcador en el 12, Bellingham empató de tacón en el 33; Pilios volvió a adelantar al AEK en el 75, Mbappé igualó un minuto después y Valverde marcó el gol de la victoria con un disparo lejano en el minuto 92, cuarta victoria consecutiva. Esa misma noche el Liverpool perdió 3-2 en el campo del Fenerbahçe: Nyoni, de 19 años, marcó su primer gol con el primer equipo en el 25, Greenwood empató con un libre directo desviado, Isak volvió a poner por delante al Liverpool en el 69 y en seis minutos Archie Brown y Murić consumaron la remontada, primera derrota europea de la temporada para los ingleses.", "ja": "11月5日未明、欧州チャンピオンズリーグのリーグフェーズ第5節で、レアル・マドリードが敵地で AEK アテネに3-2で勝利した。12分にコイタが先制、33分にベリンガムがヒールで同点。75分にピリオスが勝ち越すと、1分後にエムバペが追いつき、後半追加時間2分にバルベルデがミドルで決勝点を奪い4連勝。同じ夜、リバプールはフェネルバフチェに2-3で敗れた。25分に19歳127日のニオメがトップチーム初得点、グリーンウッドが FK の折射で同点。69分にイサクのヘッドで再びリードしたが、その後6分間にアーチー・ブラウンとムリッチが連続得点し逆転、リバプールは今季 CL 初黒星となった。"}, "why": {"zh": "两场比分一样，内容相反：皇马是在被动里等一个瞬间，利物浦是在主动里丢掉了控制。领先之后怎么把比赛“关掉”，是这两支球队当下最具体的差距。", "en": "Same scoreline, opposite content: Madrid waited for a moment while being outplayed, Liverpool lost control while dominating. Knowing how to close a game out once ahead is the most concrete gap between these two sides right now.", "es": "Mismo marcador, contenido opuesto: el Madrid esperó un instante mientras le dominaban; el Liverpool perdió el control cuando dominaba. Saber cerrar un partido con ventaja es la diferencia más concreta entre ambos ahora mismo.", "ja": "同じスコアでも中身は正反対だ。レアルは押されながら一瞬を待ち、リバプールは押しながら主導権を失った。リード後に試合を「閉じる」力が、今の両者の最も具体的な差である。"}}, {"idx": "02", "title": {"zh": "国锦赛赵心童、丁俊晖双双止步八强，常冰玉四杆破百晋级", "en": "Zhao and Ding Both Out at the Quarters; Chang Bingyu Advances With Four Centuries", "es": "Zhao y Ding caen en cuartos; Chang Bingyu avanza con cuatro centenas", "ja": "国際選手権で趙心童と丁俊暉が準々決勝敗退、常氷玉は4連続センチュリーで4強"}, "body": {"zh": "11 月 4 日，斯诺克国际锦标赛四分之一决赛，24 岁的常冰玉 6 比 3 战胜世界排名第一的赵心童，全场打出 100、102、115、107 四杆破百；这是继 8 月武汉公开赛决赛后再次击败对手。丁俊晖虽打出单杆 99 分和 137 分，仍以 4 比 6 负于凯伦·威尔逊，暂时跌出世界前 16，英锦赛需从资格赛打起。范争一 6 比 3 战胜瓦菲，第二次闯入排名赛四强。半决赛常冰玉对希金斯、范争一对威尔逊。", "en": "At the International Championship on 4 November, 24-year-old Chang Bingyu beat world number one Zhao Xintong 6-3 in the quarter-finals, compiling breaks of 100, 102, 115 and 107 — his second win over Zhao since the Wuhan Open final in August. Ding Junhui made 99 and 137 but still lost 4-6 to Kyren Wilson, dropping out of the world top 16 and into English Championship qualifying. Fan Zhengyi beat Hossein Vafaei 6-3 to reach a second ranking semi-final. Chang faces John Higgins and Fan meets Wilson.", "es": "El 4 de noviembre, en los cuartos del Campeonato Internacional, el joven de 24 años Chang Bingyu venció 6-3 al número uno del mundo, Zhao Xintong, con series de 100, 102, 115 y 107: su segunda victoria sobre Zhao desde la final del Abierto de Wuhan en agosto. Ding Junhui firmó 99 y 137, pero perdió 4-6 ante Kyren Wilson y salió del top 16 mundial, por lo que deberá jugar la clasificación del Campeonato de Inglaterra. Fan Zhengyi batió 6-3 a Hossein Vafaei y alcanzó sus segundas semifinales de un torneo de ranking. Chang se medirá a John Higgins y Fan a Wilson.", "ja": "11月4日、スヌーカーの国際選手権準々決勝で、24歳の常氷玉が世界ランク1位の趙心童を6-3で破った。100、102、115、107と4本のセンチュリーを重ね、8月の武漢オープン決勝に続く勝利となった。丁俊暉は99と137を出したがカイレン・ウィルソンに4-6で敗れ、世界ランク16位から外れて英国選手権は予選からの出場となる。范争一はバファエイを6-3で下し、ランキング大会で2度目の4強入り。準決勝は常氷玉がヒギンズ、范争一がウィルソンと対戦する。"}, "why": {"zh": "常冰玉连续两次在重要比赛里赢下世界第一，说明他的问题从来不是手感而是稳定性。丁俊晖跌出前 16 的代价很直接：三大赛之一要从资格赛开打。", "en": "Beating the world number one twice in important matches shows Chang’s issue was never touch but consistency. The cost of Ding’s slide is concrete: one of the three majors now starts in qualifying.", "es": "Ganar dos veces al número uno en partidos importantes demuestra que el problema de Chang nunca fue el tacto sino la regularidad. El coste de la caída de Ding es concreto: uno de los tres grandes empieza ahora en la fase previa.", "ja": "重要な試合で世界1位に2度勝ったことは、常氷玉の課題がショットの感覚ではなく安定性だったことを示す。丁俊暉の代償は具体的だ。三大大会のひとつを予選から戦うことになる。"}}, {"idx": "03", "title": {"zh": "王楚钦复出首战 3 比 0 过关，王艺迪首轮负 43 岁韩莹", "en": "Wang Chuqin Wins 3-0 on Return; Wang Yidi Falls to 43-Year-Old Han Ying", "es": "Wang Chuqin gana 3-0 en su regreso y Wang Yidi cae ante Han Ying, de 43 años", "ja": "王楚欽が復帰戦を3-0で突破、王芸迪は43歳の韓瑩に初戦敗退"}, "body": {"zh": "11 月 3 日晚，WTT 法兰克福冠军赛男单首轮，王楚钦 3 比 0 战胜丹麦选手林德，三局比分 11 比 7、14 比 12、11 比 9。这是他缺席五站高级别赛事后的首场国际比赛，世界排名已从第一滑落至第四。4 日温瑞博 3 比 0 战胜安宰贤，将在 16 强与王楚钦上演内战；周启豪同样 3 比 0 晋级。女单方面，3 号种子王艺迪 0 比 3 不敌德国削球手韩莹，首轮出局。", "en": "On the evening of 3 November, Wang Chuqin beat Denmark’s Anders Lind 3-0 in the first round of the WTT Champions Frankfurt, 11-7, 14-12, 11-9. It was his first international match after missing five top-tier events, with his world ranking having slipped from first to fourth. On 4 November Wen Ruibo beat An Jae-hyun 3-0 to set up an all-Chinese last-16 tie with Wang, and Zhou Qihao also advanced 3-0. In the women’s draw, third seed Wang Yidi lost 0-3 to Germany’s 43-year-old chopper Han Ying in the first round.", "es": "La noche del 3 de noviembre, Wang Chuqin venció 3-0 al danés Anders Lind en la primera ronda del WTT Champions de Fráncfort (11-7, 14-12, 11-9). Era su primer partido internacional tras perderse cinco torneos de máximo nivel, con su ranking mundial caído del primero al cuarto. El 4 de noviembre Wen Ruibo ganó 3-0 a An Jae-hyun y se medirá a Wang en octavos; Zhou Qihao también avanzó 3-0. En el cuadro femenino, la tercera cabeza de serie Wang Yidi cayó 0-3 ante la alemana Han Ying, de 43 años y estilo defensivo.", "ja": "11月3日夜、WTTチャンピオンズ・フランクフルト男子シングルス1回戦で王楚欽がデンマークのリンドを3-0（11-7、14-12、11-9）で破った。上位5大会を欠場した後の国際試合復帰戦で、世界ランクは1位から4位に下がっている。4日には温瑞博が安宰賢を3-0で下し、16強で王楚欽との中国勢対決が決まった。周啓豪も3-0で勝ち上がった。女子は第3シードの王芸迪が43歳のカットマン、韓瑩に0-3で初戦敗退した。"}, "why": {"zh": "国乒男单今年在 WTT 高级别赛事只拿过一冠，法兰克福的价值不在冠军，而在验证“王楚钦回来以后，队伍有没有一个稳定支点”。", "en": "China’s men have won only one top-tier WTT title this year. Frankfurt matters less for the trophy than for answering whether Wang’s return gives the team a stable anchor again.", "es": "El equipo masculino chino solo ha ganado un título WTT de máximo nivel este año. Fráncfort importa menos por el trofeo que por responder si el regreso de Wang devuelve al equipo un ancla estable.", "ja": "中国男子は今年、WTT の上位大会で優勝が1回だけ。フランクフルトの価値はタイトルよりも、王楚欽の復帰でチームに安定した支点が戻るかどうかの検証にある。"}}, {"idx": "04", "title": {"zh": "上海加时 110 比 109 绝杀吉林，北京 120 比 88 取八连胜", "en": "Shanghai Win 110-109 in Overtime; Beijing Roll to an Eighth Straight Win", "es": "Shanghai gana 110-109 en la prórroga y Pekín suma su octava victoria seguida", "ja": "上海が延長110-109で吉林を撃破、北京は120-88で8連勝"}, "body": {"zh": "11 月 3 日 CBA 常规赛，上海久事主场加时 110 比 109 险胜长白山恩都里，张镇麟最后 0.6 秒补篮绝杀，全场 16 分 7 篮板，王哲林 20 分 11 篮板；吉林外援威尔逊 30 分 21 篮板。北京首钢 120 比 88 大胜宁波，取得八连胜独居榜首，布朗 30 分、周琦 13 分，宁波遭遇开局八连败。辽宁 100 比 93 胜广州，江苏 95 比 93 绝杀同曦，深圳三加时 93 比 90 险胜浙江。", "en": "In CBA action on 3 November, Shanghai beat Changbaishan 110-109 in overtime at home, Zhang Zhenlin tipping in the winner with 0.6 seconds left for 16 points and seven rebounds, while Wang Zhelin had 20 and 11; Jilin’s import Wilson scored 30 with 21 boards. Beijing crushed Ningbo 120-88 for an eighth straight win and sole possession of first place, Brown scoring 30 and Zhou Qi 13, leaving Ningbo 0-8. Liaoning beat Guangzhou 100-93, Jiangsu edged Tongxi 95-93 and Shenzhen won 93-90 at Zhejiang after three overtimes.", "es": "En la CBA del 3 de noviembre, Shanghai ganó 110-109 en la prórroga al Changbaishan en casa, con Zhang Zhenlin anotando la canasta decisiva a 0,6 segundos del final (16 puntos y 7 rebotes) y Wang Zhelin sumando 20 y 11; el extranjero de Jilin, Wilson, hizo 30 con 21 rebotes. Pekín arrolló 120-88 a Ningbo para su octava victoria consecutiva y el liderato en solitario, con 30 de Brown y 13 de Zhou Qi, mientras Ningbo queda 0-8. Liaoning ganó 100-93 a Guangzhou, Jiangsu 95-93 a Tongxi y Shenzhen 93-90 a Zhejiang tras tres prórrogas.", "ja": "11月3日の CBA、上海は本拠地で延長の末に長白山を110-109で破った。張鎮麟が残り0.6秒のティップインで決勝点を挙げ16得点7リバウンド、王哲林は20得点11リバウンド。吉林の外国籍選手ウィルソンは30得点21リバウンドだった。北京は寧波に120-88で快勝し8連勝で単独首位、ブラウン30得点、周琦13得点、寧波は開幕8連敗。遼寧は広州を100-93、江蘇は同曦を95-93で破り、深センは3度の延長の末に浙江を93-90で下した。"}, "why": {"zh": "0.6 秒的补篮把一场“要被记住的失利”改成了“会被反复播放的一球”。北京八连胜更像结构性信号：周琦回到熟悉的支点位置，球队的攻防就有了标尺。", "en": "A 0.6-second tip-in turned a defeat people would remember into a clip they will replay. Beijing’s eight-game run reads more like a structural signal: with Zhou Qi back at his familiar pivot, the team finally has a yardstick at both ends.", "es": "Un palmeo a 0,6 segundos convirtió una derrota que se recordaría en una jugada que se repetirá. La racha de ocho victorias de Pekín parece más bien una señal estructural: con Zhou Qi de vuelta en su posición de referencia, el equipo tiene por fin una medida en ambos lados.", "ja": "残り0.6秒のティップインが、記憶に残る敗戦を繰り返し再生される1球に変えた。北京の8連勝はむしろ構造的な信号だ。周琦が慣れた支点に戻り、攻守に基準ができた。"}}, {"idx": "05", "title": {"zh": "东契奇 42 分 13 助攻，湖人 138 比 117 大胜热火", "en": "Dončić Posts 42 and 13 as the Lakers Beat Miami 138-117", "es": "Dončić suma 42 puntos y 13 asistencias en el 138-117 de los Lakers sobre Miami", "ja": "ドンチッチ42得点13アシスト、レイカーズがヒートに138-117で快勝"}, "body": {"zh": "11 月 3 日 NBA 常规赛，湖人主场 138 比 117 击败热火取得两连胜，东契奇出战 36 分钟拿下 42 分 7 篮板 13 助攻，里夫斯 27 分；热火阿德托昆博 30 分 12 篮板 7 助攻。同日勇士 116 比 113 险胜太阳，开拓者 118 比 110 胜掘金，火箭 109 比 93 胜凯尔特人，马刺 119 比 97 胜爵士。中国球员杨瀚森本场未获出场机会。", "en": "In the NBA on 3 November, the Lakers beat Miami 138-117 at home for a second straight win. Dončić played 36 minutes for 42 points, seven rebounds and 13 assists, with Reaves adding 27; Antetokounmpo had 30 points, 12 rebounds and seven assists for Miami. Also that day Golden State edged Phoenix 116-113, Portland beat Denver 118-110, Houston beat Boston 109-93 and San Antonio beat Utah 119-97. China’s Yang Hansen did not play.", "es": "En la NBA del 3 de noviembre, los Lakers ganaron 138-117 a Miami en casa para su segunda victoria seguida. Dončić jugó 36 minutos con 42 puntos, siete rebotes y 13 asistencias, y Reaves añadió 27; Antetokounmpo sumó 30 puntos, 12 rebotes y siete asistencias por Miami. Ese día Golden State superó 116-113 a Phoenix, Portland 118-110 a Denver, Houston 109-93 a Boston y San Antonio 119-97 a Utah. El chino Yang Hansen no tuvo minutos.", "ja": "11月3日の NBA、レイカーズは本拠地でヒートを138-117で下し2連勝。ドンチッチは36分間で42得点7リバウンド13アシスト、リーブスが27得点を加えた。ヒートはアデトクンボが30得点12リバウンド7アシスト。同日、ウォリアーズがサンズを116-113、ブレイザーズがナゲッツを118-110、ロケッツがセルティックスを109-93、スパーズがジャズを119-97で破った。中国の楊瀚森は出場機会がなかった。"}, "why": {"zh": "东契奇连续两场 40+，而且两场的赢法完全不同：一场是绝境逆转，一场是从头压制。湖人 6 胜 2 负的开局，靠的是他把得分、篮板、助攻三件事同时做到顶级。", "en": "Dončić has back-to-back 40-point games won in completely different ways: one a comeback from the brink, one a wire-to-wire control job. The Lakers’ 6-2 start rests on him being elite at scoring, rebounding and passing at the same time.", "es": "Dončić encadena dos partidos de 40 o más ganados de forma opuesta: uno remontando desde el abismo y otro dominando de principio a fin. El 6-2 inicial de los Lakers se apoya en que es élite anotando, reboteando y asistiendo a la vez.", "ja": "ドンチッチは2試合連続40得点超だが、勝ち方がまったく違う。1試合は窮地からの逆転、もう1試合は最初から最後まで支配。レイカーズの6勝2敗は、得点・リバウンド・アシストを同時に最高水準でこなす彼にかかっている。"}}]}, {"key": "hot", "num": "05", "color": "#6d28d9", "deep": "#5b21b6", "name": {"zh": "网络热点", "en": "TRENDING", "es": "TENDENCIAS", "ja": "ネット注目"}, "items": [{"idx": "01", "title": {"zh": "iG 3 比 1 淘汰 TES 时隔七年重返四强，比赛中途服务器崩溃 90 分钟", "en": "Invictus Gaming Beat Top Esports 3-1 to Reach a First Semi-Final in Seven Years", "es": "iG elimina 3-1 a TES y vuelve a semifinales siete años después", "ja": "iG が TES を3-1で破り7年ぶり4強、試合中にサーバー障害で90分中断"}, "body": {"zh": "11 月 4 日，英雄联盟 S16 全球总决赛八强战，iG 3 比 1 战胜 TES，时隔七年重返半决赛。第三局进行中出现本届首个长暂停，比赛中断近 90 分钟，官方检测后恢复。相关话题占据微博、抖音、百度多个榜单，“TheShy 单杀 369”同步登上热搜。", "en": "On 4 November, Invictus Gaming beat Top Esports 3-1 in the League of Legends World Championship quarter-finals, reaching the semi-finals for the first time in seven years. Game three was halted for nearly 90 minutes by the tournament’s first long pause, resuming after an official check. The match dominated trending lists on Weibo, Douyin and Baidu, with TheShy’s solo kill on 369 also trending.", "es": "El 4 de noviembre, Invictus Gaming venció 3-1 a Top Esports en los cuartos del Mundial de League of Legends y volvió a semifinales siete años después. El tercer mapa se interrumpió casi 90 minutos por la primera pausa larga del torneo y se reanudó tras una revisión oficial. El duelo copó las listas de tendencias de Weibo, Douyin y Baidu, y el uno contra uno de TheShy sobre 369 también se hizo viral.", "ja": "11月4日、League of Legends 世界大会の準々決勝で iG が TES を3-1で破り、7年ぶりに準決勝へ進んだ。第3ゲームでは今大会初の長時間中断が発生し、約90分停止した後に公式確認を経て再開。関連話題は Weibo、Douyin、Baidu の各ランキングを占め、TheShy が369から単独キルを奪った場面も話題になった。"}, "why": {"zh": "一场电竞比赛的“暂停 90 分钟”会被记住，因为它同时考了选手的心态和赛事方的应急能力。七年这个数字也说明，这套阵容的窗口期不会一直开着。", "en": "A 90-minute pause will be remembered because it tested both the players’ composure and the organisers’ contingency planning. The seven-year gap is a reminder that this roster’s window will not stay open indefinitely.", "es": "Una pausa de 90 minutos se recordará porque puso a prueba la cabeza de los jugadores y la capacidad de reacción de la organización. El dato de siete años recuerda que la ventana de esta plantilla no seguirá abierta para siempre.", "ja": "90分の中断が記憶されるのは、選手の精神面と運営側の緊急対応の両方が試されたからだ。7年という数字は、この陣容の好機が永遠には続かないことも示している。"}}, {"idx": "02", "title": {"zh": "苹果天气 App 显示 -32℃，气象部门回应“数据异常”", "en": "Apple Weather Shows -32°C; Forecasters Call It a Data Fault", "es": "La app del tiempo de Apple marca -32 °C y los servicios meteorológicos hablan de un fallo de datos", "ja": "iPhone の天気アプリが-32℃表示、気象当局は「データ異常」と説明"}, "body": {"zh": "11 月 4 日，多地 iPhone 用户发现自带天气应用出现 -32℃ 等极端低温数值，与实际气温明显不符，截图迅速刷屏。气象部门与苹果客服先后回应，指向数据源或定位异常，并非真实天气突变。新华社发文评论称“离大谱”。", "en": "On 4 November, iPhone users in many places found the built-in weather app showing extreme readings such as -32°C, clearly at odds with actual conditions, and screenshots spread quickly. Meteorological authorities and Apple support responded, pointing to a data-source or location fault rather than a real cold snap. Xinhua published a commentary calling it absurd.", "es": "El 4 de noviembre, usuarios de iPhone de varias ciudades vieron en la app del tiempo valores extremos como -32 °C, muy lejos de la temperatura real, y las capturas se viralizaron. Los servicios meteorológicos y el soporte de Apple apuntaron a un fallo en la fuente de datos o en la geolocalización, no a una ola de frío real. Xinhua publicó un comentario calificándolo de despropósito.", "ja": "11月4日、各地の iPhone 利用者が標準の天気アプリで-32℃などの極端な数値を確認し、実際の気温と大きく食い違うとしてスクリーンショットが拡散した。気象当局と Apple のサポートは、実際の寒波ではなくデータ提供元か位置情報の異常だと説明した。新華社は「あまりにも非常識」と評する論評を掲載した。"}, "why": {"zh": "天气是最典型的“低容错”公共信息：一个数值错了，出行、穿衣、航班判断全跟着错。系统级应用出错时，用户要的是解释和纠错速度，而不是“已反馈”。", "en": "Weather is the classic low-tolerance public information: one wrong number and travel, clothing and flight decisions all follow it. When a system-level app fails, users want an explanation and a fast fix, not an acknowledgement.", "es": "El tiempo es la información pública de baja tolerancia por excelencia: un número equivocado arrastra decisiones de viaje, ropa y vuelos. Cuando falla una app de sistema, el usuario quiere explicación y corrección rápida, no un “lo hemos reportado”.", "ja": "天気は典型的な「低許容」の公共情報だ。1つの数値が違えば、移動も服装もフライトの判断も狂う。システム標準アプリの不具合では、利用者が求めるのは説明と迅速な修正であり、「報告済み」ではない。"}}, {"idx": "03", "title": {"zh": "女生刷短视频刷到“另一个自己”，竟是失散 20 年的双胞胎姐妹", "en": "A Woman Scrolling Short Videos Finds Her Double — a Twin Separated for 20 Years", "es": "Una joven encuentra en un video a su doble: una gemela separada durante 20 años", "ja": "ショート動画で「もう一人の自分」を発見、20年離れていた双子の姉妹だった"}, "body": {"zh": "四川一名女生在短视频平台刷到与自己长相、神态几乎一致的陌生人，进一步联系后确认为失散 20 年的双胞胎姐妹。两人身高、籍贯相同，且都在深圳工作，见面那天恰逢 20 岁生日。目前 DNA 鉴定结果尚未公开，认亲仍需权威确认。", "en": "A young woman in Sichuan came across a stranger on a short-video platform who looked and behaved almost exactly like her. After making contact, they confirmed they were twin sisters separated for 20 years. They share the same height and hometown and both work in Shenzhen; they met on what was their 20th birthday. DNA results have not been made public and the relationship still needs authoritative confirmation.", "es": "Una joven de Sichuan encontró en una plataforma de vídeos cortos a una desconocida casi idéntica a ella en aspecto y gestos. Tras contactarla, confirmaron que eran gemelas separadas durante 20 años. Comparten estatura y lugar de origen y ambas trabajan en Shenzhen; se conocieron el día en que cumplían 20 años. Los resultados de ADN no se han hecho públicos y el parentesco aún requiere confirmación oficial.", "ja": "四川省の女性がショート動画アプリで、容姿も雰囲気もほぼ同じ見知らぬ相手を見つけた。連絡を取った結果、20年離れていた双子の姉妹だと確認された。身長も出身地も同じで、二人とも深センで働いており、初対面の日は20歳の誕生日だった。DNA 鑑定の結果は公表されておらず、親族関係にはなお権威ある確認が必要だ。"}, "why": {"zh": "这类故事之所以刷屏，是因为它把“算法”从被吐槽的对象变成了命运的媒介。但在情绪之外，认亲这件事仍应以权威鉴定为准，热闹不能替代程序。", "en": "The story spread because it turns the algorithm from something people complain about into a medium of fate. Beyond the emotion, though, a reunion claim still rests on authoritative testing; excitement cannot substitute for procedure.", "es": "La historia se viralizó porque convierte al algoritmo, normalmente criticado, en un medio del destino. Más allá de la emoción, un reencuentro así sigue dependiendo de una prueba oficial: el entusiasmo no sustituye el procedimiento.", "ja": "この話が拡散したのは、「アルゴリズム」を不満の対象から運命の媒介へと変えたからだ。ただし感情とは別に、再会の主張は権威ある鑑定に依拠すべきで、盛り上がりは手続きの代わりにならない。"}}, {"idx": "04", "title": {"zh": "小伙 200 多万买 14 套老破小，年收租 21 万实收 18 万", "en": "He Bought 14 Tiny Old Flats for 2 Million Yuan: 210,000 in Rent, 180,000 in Hand", "es": "Compró 14 pisos viejos por más de dos millones: 210.000 de alquiler y 180.000 netos", "ja": "200万元超で14戸の築古小型住宅を購入、家賃21万元だが手取りは18万元"}, "body": {"zh": "长沙一名年轻人以 200 多万元总价买入 14 套老旧小户型用于出租，一年租金收入 21 万元，扣除空置、维修、税费等实际到手约 18 万元。他在采访中表示，随着租售比回落，不建议他人跟风复制。", "en": "A young man in Changsha bought 14 small, older flats for just over 2 million yuan and rents them out. Gross rent is 210,000 yuan a year; after vacancies, repairs and taxes he nets about 180,000. In interviews he said that with rental yields falling he would not advise others to copy the strategy.", "es": "Un joven de Changsha compró 14 pisos pequeños y antiguos por poco más de dos millones de yuanes y los alquila. Ingresa 210.000 yuanes al año en bruto; tras vacantes, reparaciones e impuestos le quedan unos 180.000. En entrevistas dijo que, con la rentabilidad por alquiler a la baja, no recomienda copiar la estrategia.", "ja": "長沙の若者が総額200万元あまりで築古の小型住宅14戸を購入して賃貸している。家賃収入は年21万元だが、空室・修繕・税金を差し引くと手取りは約18万元。本人はインタビューで、利回りの低下を踏まえ他人が真似するのは勧めないと語った。"}, "why": {"zh": "这组数字最容易被误读成“买房必赚”。真实的持有成本在空置期、维修和交易流动性里，个案的价格与租金水平也不可复制。", "en": "These numbers are easily misread as proof that property always pays. The real holding costs sit in vacancy periods, repairs and liquidity, and one case’s prices and rents are not reproducible.", "es": "Estas cifras se leen fácilmente como prueba de que comprar vivienda siempre renta. Los costes reales están en las vacantes, las reparaciones y la liquidez, y los precios y alquileres de un caso concreto no son replicables.", "ja": "この数字は「不動産は必ず儲かる」と誤読されやすい。実際の保有コストは空室期間、修繕、換金性にあり、個別事例の価格と家賃は再現できない。"}}, {"idx": "05", "title": {"zh": "南京大学回应“抬头率”与课堂监控争议：相关统计已停用", "en": "Nanjing University Says Its “Head-Up Rate” Tally Has Been Stopped", "es": "La Universidad de Nankín detiene el recuento de “cabezas levantadas” en clase", "ja": "南京大学が「顔上げ率」と教室監視の議論に回答、集計は停止済み"}, "body": {"zh": "针对网络热议的“抬头率”与课堂监控问题，南京大学回应称相关统计已停用，“到课率与平时成绩挂钩”的说法不实，教学期间不采集人脸信息。校方表示课堂仍要靠内容吸引学生。此前有学生用“抬头率”描述课堂氛围，引发对教学评价方式的讨论。", "en": "Responding to an online debate over “head-up rates” and classroom monitoring, Nanjing University said the tally has been discontinued, that claims of attendance being tied to coursework grades are inaccurate, and that no facial data is collected during teaching. The university said classes must still attract students through content. Students had earlier used “head-up rate” to describe the atmosphere in class, prompting debate about how teaching is evaluated.", "es": "Ante el debate en redes sobre la “tasa de cabezas levantadas” y la vigilancia en el aula, la Universidad de Nankín afirmó que ese recuento se ha suspendido, que la afirmación de que la asistencia pondera en la nota no es cierta y que no se recogen datos faciales durante la docencia. El centro sostuvo que las clases deben atraer por su contenido. Antes, algunos estudiantes usaron el término para describir el ambiente en clase, lo que abrió un debate sobre cómo se evalúa la enseñanza.", "ja": "ネットで話題になった「顔上げ率」と教室監視をめぐり、南京大学は当該の集計を停止済みだと回答した。出席率が平常点に連動するという説は事実ではなく、授業中に顔情報は取得していないと説明。授業はやはり内容で学生を引きつけるべきだとしている。以前、学生が「顔上げ率」という言葉で教室の雰囲気を表現し、教育評価のあり方をめぐる議論になっていた。"}, "why": {"zh": "争论的焦点不是“学生该不该抬头”，而是教学评价能不能被简化成一个可统计的动作。把指标撤下来容易，把课堂变得值得抬头要难得多。", "en": "The argument is not about whether students should look up, but whether teaching can be reduced to a countable motion. Removing the metric is easy; making a class worth looking up for is much harder.", "es": "El debate no es si el alumno debe levantar la cabeza, sino si la docencia puede reducirse a un gesto contable. Retirar el indicador es fácil; lograr que una clase merezca que uno levante la vista es mucho más difícil.", "ja": "争点は「学生が顔を上げるべきか」ではなく、教育を数えられる動作に還元できるかだ。指標を下げるのは簡単だが、顔を上げる価値のある授業にするのははるかに難しい。"}}]}, {"key": "ent", "num": "06", "color": "#db2777", "deep": "#be185d", "name": {"zh": "娱乐八卦", "en": "CULTURE", "es": "CULTURA", "ja": "エンタメ"}, "items": [{"idx": "01", "title": {"zh": "广电精品创作大会开幕，“剧美中国”第二批 27 部片单公布", "en": "Broadcasting Summit Opens With a Second Slate of 27 Drama Titles", "es": "Abre la cumbre audiovisual con una segunda lista de 27 series", "ja": "放送精品創作大会が開幕、「劇美中国」第2弾27作品を発表"}, "body": {"zh": "11 月 4 日，2026 中国广播电视精品创作大会在北京会议中心开幕，主题为“创时代经典 攀文艺高峰”，会期至 5 日。开幕式发布“剧美中国”精品创作计划第二批推荐片单，共 27 部剧集入选，包括肖战《十日终焉》《谍报上不封顶》、成毅《两京十五日》、杨紫《玉兰花开君再来》、胡歌《人间有味》等。同日电视剧（网络剧）论坛以“生态兴·国剧强”为主题，并启动爱优腾芒分账专区。", "en": "The 2026 China Radio and Television Quality Production Conference opened at the Beijing Conference Center on 4 November under the theme of creating classics for the era, running through 5 November. The opening released the second recommended slate of the “A Beautiful China on Screen” programme, with 27 drama and web-drama titles, including Xiao Zhan’s two upcoming projects, Cheng Yi’s title, Yang Zi’s and Hu Ge’s new series. A drama forum the same day focused on building a healthier production ecosystem and launched a revenue-sharing zone across the four major streaming platforms.", "es": "La Conferencia de Producción Audiovisual de Calidad de China 2026 se inauguró el 4 de noviembre en el Centro de Convenciones de Pekín con el lema de crear clásicos de la época, y se extiende hasta el 5. En la apertura se presentó la segunda lista recomendada del programa “Una China hermosa en pantalla”, con 27 series, entre ellas las dos próximas de Xiao Zhan, la de Cheng Yi, la de Yang Zi y la de Hu Ge. Ese mismo día un foro sobre series abordó un ecosistema de producción más sano y lanzó una zona de reparto de ingresos entre las cuatro grandes plataformas.", "ja": "2026年中国広播電視精品創作大会が11月4日、北京会議センターで開幕した。テーマは「時代の古典を創り、文芸の高峰を攀じる」で、会期は5日まで。開幕式では「劇美中国」精品創作計画の第2弾推薦リストが発表され、27作品が選ばれた。肖戦の2作、成毅、楊紫、胡歌の新作などが含まれる。同日のドラマ（ネットドラマ）フォーラムは「生態興・国劇強」を掲げ、主要4配信プラットフォームの分帳特区の始動も発表された。"}, "why": {"zh": "片单本身是排播信号：平台与卫视的资源正在向“可长期播出、可反复重播”的题材集中。分账专区则是另一种信号——把收益分配机制摆到台面上。", "en": "The slate is a scheduling signal: platform and broadcaster money is concentrating on titles that can run long and be re-run. The revenue-sharing zone is a different signal — putting the split mechanism on the table.", "es": "La lista es una señal de programación: los recursos de plataformas y cadenas se concentran en títulos que aguantan emisiones largas y repeticiones. La zona de reparto es otra señal: poner el mecanismo de ingresos sobre la mesa.", "ja": "リスト自体が編成の信号だ。プラットフォームと衛視の資源が「長期放送・再放送に耐える」題材へ集中している。分帳特区は別の信号で、収益配分の仕組みを表に出すものだ。"}}, {"idx": "02", "title": {"zh": "“画地为牢”梗外溢到杨幂唐嫣，《后会友期》同时陷举报传闻", "en": "A Variety Catchphrase Spreads to Yang Mi and Tang Yan as the Show Faces a Complaint Rumor", "es": "La frase de un programa llega a Yang Mi y Tang Yan mientras el formato afronta un rumor de denuncia", "ja": "「画地为牢」の流行語が楊冪と唐嫣に波及、番組には通報のうわさも"}, "body": {"zh": "综艺《后会友期》里许飞对厉娜的一句“我画地为牢啊”，在 11 月 4 日继续外溢：杨幂在直播中玩梗“不要画地为牢”，话题“我画地为牢啊唐嫣”冲上热搜，网友喊话两人同框，但据报道双方团队均婉拒。同日网传节目因相关互动被举报“价值观不正”、后期将调整为友情向，芒果 TV 与节目组均未回应，正片照常更新。", "en": "A line from the variety show — “I drew a line around myself” — kept spreading on 4 November. Yang Mi used the phrase in a livestream, a hashtag pairing her with Tang Yan trended, and netizens called for the two to appear together, though reports say both teams declined. The same day, an unverified online claim said the show had been reported for “improper values” and would be recut as purely platonic; Mango TV and the producers have not responded and episodes continue to air as normal.", "es": "La frase del programa —“me encerré en un círculo”— siguió extendiéndose el 4 de noviembre. Yang Mi la usó en directo, una etiqueta que la emparejaba con Tang Yan se volvió tendencia y los usuarios pidieron verlas juntas, aunque según los medios ambos equipos declinaron. Ese mismo día circuló la versión no verificada de que el programa fue denunciado por “valores inadecuados” y se recortaría en clave puramente amistosa; Mango TV y la productora no han respondido y los episodios siguen emitiéndose con normalidad.", "ja": "バラエティ「后会友期」で許飛が厲娜に言った「私は自分の周りに線を引いた」という一言は、11月4日も波及を続けた。楊冪がライブ配信でこの梗を使い、唐嫣との共演を望むタグがトレンド入りしたが、報道によれば双方のチームは断った。同日、番組が「価値観が不適切」として通報され、後半は純粋な友情路線に修正されるという未確認情報も流れた。Mango TV と制作側は回答せず、本編は通常通り更新されている。"}, "why": {"zh": "一个综艺金句能活多久，取决于它能不能被移植到别的关系里。但“举报”“改向”这类说法目前只有截图来源，按待证处理比按结论转述更稳妥。", "en": "How long a catchphrase lives depends on whether it can be transplanted onto other relationships. But the claims about a complaint and a recut currently rest on screenshots alone; treating them as unverified is safer than repeating them as conclusions.", "es": "Cuánto vive una frase depende de si puede trasplantarse a otras relaciones. Pero lo de la denuncia y el recorte solo se apoya en capturas; tratarlo como no verificado es más prudente que repetirlo como conclusión.", "ja": "流行語がどれだけ生き残るかは、他の関係に移植できるかで決まる。ただし通報や修正の話は現時点でスクリーンショットが出所の一つに過ぎず、結論として伝えるより「未確認」として扱うほうが妥当だ。"}}, {"idx": "03", "title": {"zh": "郭宇欣方否认“劈腿”将走法律途径，黄子弘凡工作室辟谣已婚", "en": "Guo Yuxin Denies Cheating Claims; Huang Zihongfan’s Studio Rejects Marriage Rumor", "es": "Guo Yuxin lo niega y recurrirá a la vía legal; el estudio de Huang Zihongfan desmiente su boda", "ja": "郭宇欣側が「二股」を否定し法的手段へ、黄子弘凡の事務所は既婚説を否定"}, "body": {"zh": "11 月 4 日，“叶非夜曝郭宇欣劈腿”登上热搜第一，郭宇欣方面随即回应称纯属造谣，将坚决通过法律途径维护合法权益。同日黄子弘凡工作室发文回应“已婚”传闻，称“无稽之谈、纯属造谣”，并表示已取证、将追诉。", "en": "On 4 November a cheating allegation against Guo Yuxin topped the trending list; her side responded that it was pure fabrication and that they would pursue legal action. The same day Huang Zihongfan’s studio issued a statement calling marriage rumors baseless and fabricated, saying evidence had been collected and claims would be pursued.", "es": "El 4 de noviembre una acusación de infidelidad contra Guo Yuxin encabezó las tendencias; su equipo respondió que es una invención y que acudirá a la vía legal. Ese mismo día el estudio de Huang Zihongfan calificó de infundados los rumores de boda, afirmó haber reunido pruebas y anunció acciones legales.", "ja": "11月4日、郭宇欣への「二股」疑惑がトレンド1位になると、本人側は純粋な作り話だと否定し、法的手段で権利を守ると表明した。同日、黄子弘凡の事務所は「既婚」のうわさを根拠のない捏造だとし、証拠を保全して追訴すると発表した。"}, "why": {"zh": "两起事件的处置方式几乎一样：快速否认、明确取证、指向法律。对艺人团队来说，谣言的成本正在从“发个声明”变成“要不要真的起诉”。", "en": "Both cases were handled the same way: a fast denial, a clear note on evidence, and a legal threat. For talent teams, the cost of a rumor is shifting from issuing a statement to deciding whether to actually sue.", "es": "Ambos casos se gestionaron igual: negación rápida, constancia de pruebas y amenaza legal. Para los equipos de artistas, el coste de un rumor pasa de emitir un comunicado a decidir si de verdad se demanda.", "ja": "どちらも対応はほぼ同じだ。迅速な否定、証拠保全の明示、法的手段への言及。芸能事務所にとって、うわさのコストは「声明を出す」ことから「本当に訴えるか」へ移りつつある。"}}, {"idx": "04", "title": {"zh": "《小城良方》央八收官，井柏然张颂文《谷雨》定档 11 月 5 日", "en": "“Small Town Remedies” Ends on CCTV-8 as “Grain Rain” Sets a 5 November Debut", "es": "“Small Town Remedies” termina en CCTV-8 y “Grain Rain” se estrena el 5 de noviembre", "ja": "「小城良方」が CCTV-8 で最終回、井柏然と張頌文の「谷雨」は11月5日開始"}, "body": {"zh": "11 月 4 日晚，肖战主演的《小城良方》在央视八套黄金档首播收官，收官海报同步释出，爱奇艺加更礼此前已直通大结局。同日，首部年代涉税罪案剧《谷雨》官宣定档 11 月 5 日登陆 CCTV-8 与优酷，井柏然饰税务稽查干部，张颂文饰走上歧途的印刷技工，孙艺洲饰刑警。", "en": "On the evening of 4 November, “Small Town Remedies”, starring Xiao Zhan, finished its first run in CCTV-8’s prime slot, with a finale poster released; iQiyi had already unlocked the ending through a paid add-on. The same day, “Grain Rain”, billed as the first period drama about tax crimes, was set for a 5 November launch on CCTV-8 and Youku, with Jing Boran as a tax inspector, Zhang Songwen as a print worker who goes astray and Sun Yizhou as a detective.", "es": "La noche del 4 de noviembre terminó en el prime time de CCTV-8 “Small Town Remedies”, protagonizada por Xiao Zhan, con póster final incluido; iQiyi ya había desbloqueado el desenlace mediante un pago adicional. Ese mismo día se anunció el estreno para el 5 de noviembre de “Grain Rain”, presentada como la primera serie de época sobre delitos fiscales, en CCTV-8 y Youku, con Jing Boran como inspector de Hacienda, Zhang Songwen como un impresor que se desvía y Sun Yizhou como detective.", "ja": "11月4日夜、肖戦主演の「小城良方」が CCTV-8 のゴールデンタイムで最終回を迎え、記念ポスターも公開された。iQiyi では追加課金で先行して結末まで配信済み。同日、年代物の脱税犯罪劇としては初となる「谷雨」が11月5日から CCTV-8 と優酷で始まると発表された。井柏然が税務調査官、張頌文が道を踏み外す印刷工、孫芸洲が刑事を演じる。"}, "why": {"zh": "一部医疗剧收官、一部涉税罪案剧接档，央视八套的类型配比在变：从“行业+情感”转向“行业+案件”，用专业细节换收视黏性。", "en": "A medical drama ends and a tax-crime drama takes the slot: CCTV-8’s genre mix is shifting from profession-plus-romance to profession-plus-case, trading technical detail for stickiness.", "es": "Termina un drama médico y entra uno de delitos fiscales: la mezcla de géneros de CCTV-8 pasa de “profesión más romance” a “profesión más caso”, cambiando detalle técnico por fidelidad de audiencia.", "ja": "医療ドラマが終わり、脱税犯罪ドラマが後を受ける。CCTV-8 のジャンル構成は「職業＋恋愛」から「職業＋事件」へ移り、専門的な細部で視聴の定着を狙っている。"}}, {"idx": "05", "title": {"zh": "鹿晗 gapday 音乐节佛山站官宣，11 月 28 日至 29 日开唱", "en": "Luhan to Headline the Gapday Festival in Foshan on 28-29 November", "es": "Luhan encabezará el festival Gapday de Foshan los días 28 y 29 de noviembre", "ja": "鹿晗が gapday 音楽フェス佛山公演のヘッドライナーに、11月28〜29日開催"}, "body": {"zh": "11 月 4 日，2026 gapday 音乐节佛山站阵容官宣，11 月 28 日、29 日在佛山大草地音乐秀场举行。鹿晗领衔，杨丞琳、周柏豪、周兴哲、魏如萱、ONER 等参演，涵盖港乐、R&B 与唱跳。同日，香港歌手 JW 王灏儿在叱咤乐坛颁奖礼记者会上证实，自己已于 2025 年 11 月在土耳其秘婚，新歌 MV 将于 11 月 6 日推出。", "en": "The line-up for the 2026 Gapday festival in Foshan was announced on 4 November, with shows on 28 and 29 November at the Foshan Grassland music venue. Luhan headlines alongside Rainie Yang, Pakho Chau, Eric Chou, Waa Wei and ONER, spanning Cantopop, R&B and dance pop. The same day, Hong Kong singer JW Wong confirmed at a chart awards press conference that she married secretly in Turkey in November 2025; her new music video arrives on 6 November.", "es": "El 4 de noviembre se anunció el cartel del festival Gapday 2026 en Foshan, con conciertos el 28 y 29 de noviembre en el recinto de hierba de Foshan. Luhan encabeza junto a Rainie Yang, Pakho Chau, Eric Chou, Waa Wei y ONER, con cantopop, R&B y dance pop. Ese mismo día, la cantante hongkonesa JW Wong confirmó en una rueda de prensa de premios que se casó en secreto en Turquía en noviembre de 2025; su nuevo videoclip llega el 6 de noviembre.", "ja": "11月4日、2026年 gapday 音楽フェスの佛山公演の出演者が発表された。11月28日と29日に佛山の大草地音楽ショー会場で開催され、鹿晗がヘッドライナーを務め、楊丞琳、周柏豪、周興哲、魏如萱、ONER らが出演。カントポップ、R&B、ダンスポップを網羅する。同日、香港の歌手 JW 王灝児は音楽賞の記者会見で、2025年11月にトルコで秘密結婚していたことを認め、新曲の MV は11月6日公開と発表した。"}, "why": {"zh": "音乐节正在变成“歌单型消费”：观众买的不是某一位歌手，而是一整套能合唱的曲目。阵容官宣即上热搜，说明这类产品的营销已经前置到开票之前。", "en": "Festivals are becoming playlist consumption: people are not buying one artist but a set of songs they can sing along to. That a line-up announcement alone trends shows the marketing now happens before tickets go on sale.", "es": "Los festivales se están convirtiendo en consumo de lista de reproducción: no se compra un artista, sino un conjunto de canciones que se pueden cantar. Que el anuncio del cartel sea tendencia muestra que el marketing ocurre antes de la venta de entradas.", "ja": "音楽フェスは「プレイリスト消費」になりつつある。買っているのは一人の歌手ではなく、一緒に歌える曲の一式だ。出演者発表だけでトレンド入りするのは、販売前からマーケティングが始まっている証拠である。"}}]}], "risk": {"zh": "风险提示：本简报仅作信息汇总，其中涉及的数据不构成任何投资建议。", "en": "Risk notice: this briefing is a summary of information only; the data it contains does not constitute investment advice.", "es": "Aviso de riesgo: este boletín es solo un resumen informativo; los datos que contiene no constituyen asesoramiento de inversión.", "ja": "リスク提示：本ブリーフィングは情報の要約であり、記載のデータは投資助言を構成するものではありません。"}}/*__END__*/;
