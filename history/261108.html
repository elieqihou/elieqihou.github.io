 en recuperación tras una operación, ni con Yao Di, ahora en Italia; Cao Yang debuta como primer entrenador y Wang Yizhu es la nueva capitana.", "ja": "11月7日、2026-27シーズンの中国女子バレーボール・スーパーリーグが北京の光彩体育館で開幕し、3200人が観戦した。敵地の天津渤海銀行が北京北氷洋を3対1で下した（25-19、25-21、22-25、28-26）。天津のブラジル人オポジット、ナタリアが両チーム最多23点、クロアチアのファブリスが古巣相手に14点。北京は5人が2桁得点（ブリシオ15、曹燁軒13）ながら、ミスによる失点が36に対し天津は19、レセプション成功率は北京31%対天津47%だった。今季は31シーズン目で28チームが参加、男女A級各8チーム、B級各6チーム、計286試合。天津は手術後の回復中の李盈瑩が登録外、姚迪はイタリアへ、曹陽が初めて単独で監督を務め、王芸竹が初の主将となる。"}, "why": {"zh": "得分点分散是好事，但排球里“少送分”比“多得分”更贵——36 比 19 这一栏，抵得上一整局。", "en": "Spreading the scoring is good, but in volleyball giving fewer points away is worth more than scoring more: the 36-19 column is worth a whole set.", "es": "Repartir el ataque está bien, pero en voleibol regalar menos puntos vale más que anotar más: la columna 36-19 vale un set entero.", "ja": "得点が分散するのは良いことだが、バレーでは「取る」より「与えない」方が高い。36対19の欄は1セット分に相当する。"}}, {"idx": "05", "title": {"zh": "东契奇 53 分，湖人逆转登顶西部；杨瀚森罚球数超巴特尔", "en": "Doncic’s 53 Points Lift the Lakers to the Top of the West; Yang Passes Bateer on Free Throws", "es": "Los 53 de Doncic llevan a los Lakers al liderato del Oeste; Yang supera a Bateer en tiros libres", "ja": "ドンチッチ53得点でレイカーズが西首位、楊瀚森はフリースローでバテール超え"}, "body": {"zh": "北京时间 11 月 7 日，NBA 杯赛西部榜首之争，湖人主场 124 比 118 逆转开拓者，取得四连胜并登顶西部。东契奇砍下赛季新高 53 分、5 篮板 5 助攻，33 投 17 中，含一记半场 62 英尺压哨三分，这是他生涯第 11 次 50+、并列历史第 10，也是连续第四场 40+；里夫斯贡献 25 分。开拓者阿夫迪亚 22 分 9 篮板 11 助攻、利拉德 22 分，三连胜终结。中国球员杨瀚森替补出场约 3 分钟，第二节单打凯斯勒造犯规两罚全中得 2 分，NBA 生涯罚球命中数达到 30 个，超越巴特尔的 29 个，升至亚洲球员第 11 位。同日马刺 124 比 109 胜国王取七连胜，文班亚马 30 分 14 篮板；雷霆 128 比 97 胜灰熊。", "en": "In an NBA Cup game for top spot in the West on 7 November (Beijing time), the Lakers came from behind to beat Portland 124-118 at home, their fourth straight win and first place in the conference. Luka Doncic scored a season-high 53 points with five rebounds and five assists on 17-of-33 shooting, including a 62-foot heave at the halftime buzzer — his 11th career 50-point game, tied for 10th all time, and his fourth consecutive 40-point outing. Austin Reaves added 25. Deni Avdija had 22 points, nine rebounds and 11 assists and Damian Lillard 22 for Portland, whose three-game run ended. China’s Yang Hansen played about three minutes off the bench, drawing a foul on Walker Kessler and hitting both free throws for two points, taking his career free-throw total to 30 and passing Bateer’s 29 for 11th among Asian players. Elsewhere, San Antonio beat Sacramento 124-109 for a seventh straight win behind 30 points and 14 rebounds from Victor Wembanyama, and Oklahoma City routed Memphis 128-97.", "es": "En un partido de la Copa NBA por el liderato del Oeste el 7 de noviembre (hora de Pekín), los Lakers remontaron ante Portland para ganar 124-118 en casa, su cuarta victoria seguida y el primer puesto de la conferencia. Luka Doncic anotó 53 puntos, máximo de la temporada, con cinco rebotes y cinco asistencias y un 17 de 33 en tiros, incluido un triple desde 62 pies al final del segundo cuarto: su undécimo partido de 50 o más, empatado en el décimo puesto histórico, y el cuarto consecutivo de 40+. Austin Reaves sumó 25. Deni Avdija firmó 22 puntos, nueve rebotes y 11 asistencias y Damian Lillard 22 por Portland, que vio cortada su racha de tres triunfos. El chino Yang Hansen jugó unos tres minutos desde el banquillo, forzó falta de Walker Kessler y anotó los dos libres para sumar 30 en su carrera y superar los 29 de Bateer, undécimo entre asiáticos. San Antonio ganó 124-109 a Sacramento con 30 puntos y 14 rebotes de Victor Wembanyama, y Oklahoma City arrolló 128-97 a Memphis.", "ja": "北京時間11月7日、NBAカップの西カンファレンス首位争いで、レイカーズが本拠地で124対118とブレイザーズに逆転勝ちし、4連勝で西首位に立った。ドンチッチは今季最多53得点、5リバウンド5アシスト、33本中17本成功。第2クォーター終了間際に62フィートのブザービーター3ポイントも決め、通算11度目の50得点超で歴代10位タイ、4試合連続40得点となった。リーブスは25得点。ブレイザーズはアヴディアが22得点9リバウンド11アシスト、リラード22得点だったが3連勝で止まった。中国の楊瀚森はベンチから約3分間出場し、第2クォーターにケスラーからファウルを奪って2本とも決め2得点。NBA通算フリースロー成功が30本となり、バテールの29本を抜いてアジア選手11位となった。同日、スパーズはウィンバニャマの30得点14リバウンドでキングスに124対109と勝ち7連勝、サンダーはグリズリーズに128対97で快勝した。"}, "why": {"zh": "53 分是新闻，30 个罚球也是新闻——一个大国球员在联盟里的存在感，常常是从这种“很小的数字”开始累积的。", "en": "Fifty-three points is news; 30 free throws is also news — the presence of a player from a big country in this league often starts accumulating from numbers as small as these.", "es": "53 puntos es noticia; 30 tiros libres también: la presencia de un jugador de un país grande en esta liga suele empezar a acumularse con cifras así de pequeñas.", "ja": "53得点はニュースであり、フリースロー30本もニュースだ。大国の選手がこのリーグで存在感を築くのは、こうした「小さな数字」から始まることが多い。"}}]}, {"key": "hot", "num": "05", "color": "#6d28d9", "deep": "#55209f", "name": {"zh": "网络热点", "en": "TRENDING", "es": "TENDENCIAS", "ja": "ネット話題"}, "items": [{"idx": "01", "title": {"zh": "海外短剧百强榜 82 席是中国厂商，“duanju”进了维基", "en": "Chinese Firms Take 82 of the Top 100 Overseas Micro-Dramas; “Duanju” Enters Wikipedia", "es": "Empresas chinas ocupan 82 del top 100 de microdramas; “duanju” ya está en Wikipedia", "ja": "海外ショートドラマ百強の82席が中国勢、「duanju」はWikipediaにも収録"}, "body": {"zh": "第三方数据显示，2026 年 10 月海外短剧百强榜中，82 部的主投平台是中国厂商，其中 NetShort 占 63 席、DramaBox 占 9 席。海外微短剧 App 下载量与收入榜前三名均来自中国：1 至 9 月 FreeReels 下载超 2.3 亿次、ReelShort 超 1.9 亿次、NetShort 超 1.8 亿次；收入榜前三为 DramaBox 3.02 亿美元、ReelShort 2.65 亿美元、NetShort 2.05 亿美元，三者合计占前 20 名总收入的一半。汉语拼音“duanju”已被维基百科收录为短剧专属词。海外 AI 漫剧活跃用户整体突破 1.5 亿，海外短剧付费应用前十名中中国厂商独占九席。A 股短剧概念股本周走强，昆仑万维、中文在线、掌阅科技分别上涨 16.51%、18.44%、23.92%。", "en": "Third-party data show that 82 of the top 100 overseas micro-dramas in October 2026 were led by Chinese companies, with NetShort accounting for 63 and DramaBox for nine. Chinese apps hold the top three places in both downloads and revenue: from January to September, FreeReels exceeded 230 million downloads, ReelShort 190 million and NetShort 180 million, while revenue leaders were DramaBox at $302 million, ReelShort at $265 million and NetShort at $205 million — together half of the top 20’s total. The pinyin “duanju” has been added to Wikipedia as the term for the format. Active users of AI-generated overseas micro-dramas have passed 150 million, and Chinese firms hold nine of the top ten paid overseas apps. Chinese short-drama stocks rose this week, with Kunlun Tech up 16.51%, Chinese Online 18.44% and IReader 23.92%.", "es": "Datos de terceros indican que 82 de los 100 microdramas internacionales más vistos en octubre de 2026 tenían como plataforma principal a empresas chinas: NetShort con 63 y DramaBox con nueve. Las apps chinas ocupan los tres primeros puestos en descargas e ingresos: de enero a septiembre, FreeReels superó 230 millones de descargas, ReelShort 190 y NetShort 180, mientras los ingresos los lideraron DramaBox con 302 millones de dólares, ReelShort con 265 y NetShort con 205, la mitad del total del top 20. El pinyin “duanju” ya figura en Wikipedia como término del formato. Los usuarios activos de microdramas con IA superan los 150 millones y las empresas chinas ocupan nueve de las diez apps de pago más importantes. Las acciones chinas del sector subieron esta semana: Kunlun Tech un 16,51 %, Chinese Online un 18,44 % e IReader un 23,92 %.", "ja": "第三者データによると、2026年10月の海外ショートドラマ百強のうち82作の主要出資プラットフォームが中国企業で、NetShortが63作、DramaBoxが9作を占めた。海外ミニドラマアプリのダウンロード数と収益の上位3位はすべて中国製だ。1〜9月のダウンロードはFreeReelsが2.3億回超、ReelShortが1.9億回超、NetShortが1.8億回超。収益はDramaBoxが3億200万ドル、ReelShortが2億6500万ドル、NetShortが2億500万ドルで、上位20位の収益の半分を占める。中国語のピンイン「duanju」はすでにウィキペディアにこの形式の名称として収録された。AI製の海外ミニドラマのアクティブユーザーは1.5億人を超え、有料アプリ上位10位のうち9つが中国企業。中国の関連株は今週上昇し、昆侖万維が16.51%、中文在線が18.44%、掌閲科技が23.92%高となった。"}, "why": {"zh": "文化输出最扎实的形态往往不是“大片”，而是能被别人日常追更的东西——一周几十集，比一部电影更能改变习惯。", "en": "The most durable form of cultural export is rarely a blockbuster; it is something people follow episode by episode. Dozens of episodes a week change habits faster than one film.", "es": "La forma más sólida de exportación cultural rara vez es un taquillazo: es algo que la gente sigue capítulo a capítulo. Decenas de episodios por semana cambian hábitos más que una película.", "ja": "文化輸出で最も堅実な形は「大作」ではなく、人が日常的に追いかけるものだ。週に何十話も見ることは、1本の映画より習慣を変える。"}}, {"idx": "02", "title": {"zh": "第 32 号台风“查帕卡”生成：今年的台风编号创了纪录", "en": "Typhoon Cempaka Becomes No. 32: a Record Number of Named Storms This Year", "es": "El tifón Cempaka es el número 32: un récord de tormentas con nombre este año", "ja": "台風32号「チャパカ」発生、今年の台風番号は記録更新"}, "body": {"zh": "11 月 7 日 14 时，今年第 32 号台风“查帕卡”（热带风暴级）在西北太平洋洋面生成，中心位于美国关岛北偏西方向约 720 公里洋面，中心附近最大风力 8 级；8 日 5 时加强为强热带风暴，中心附近最大风力 10 级、中心气压 985 百帕，预计以每小时 20 至 25 公里的速度向西偏北移动、强度逐渐加强，未来对我国海区无影响。今年编号台风已达 32 个，刷新 21 世纪以来最多纪录。同日 18 时，中央气象台发布寒潮蓝色预警与大风蓝色预警：7 日 20 时至 10 日 8 时，中东部多地降温 6 至 10℃、局地 14℃ 以上；8 日 20 时至 9 日 20 时，黄海、东海、台湾海峡、巴士海峡、南海北部和中部等海域有 7 至 8 级、阵风 9 至 10 级大风。", "en": "At 14:00 on 7 November, this year’s 32nd typhoon, Cempaka, formed over the western North Pacific as a tropical storm about 720 km north-northwest of Guam with maximum winds of force 8. By 05:00 on 8 November it had strengthened into a severe tropical storm with force-10 winds and a central pressure of 985 hPa, and is expected to track west-northwest at 20–25 km/h while intensifying, with no impact on Chinese waters. The 32 named storms are the most this century. At 18:00 the National Meteorological Centre issued blue alerts for both a cold wave and high winds: from 20:00 on 7 November to 08:00 on 10 November, central and eastern China will cool by 6–10°C, locally over 14°C, and from 20:00 on 8 November to 20:00 on 9 November the Yellow Sea, East China Sea, Taiwan Strait, Bashi Channel and the northern and central South China Sea will see force 7–8 winds with gusts of 9–10.", "es": "A las 14:00 del 7 de noviembre se formó en el Pacífico noroeste el tifón número 32 del año, Cempaka, como tormenta tropical a unos 720 km al noroeste de Guam, con vientos máximos de fuerza 8. A las 05:00 del 8 se intensificó a tormenta tropical severa, con vientos de fuerza 10 y presión central de 985 hPa; se prevé que avance hacia el oeste-noroeste a 20-25 km/h ganando intensidad, sin afectar aguas chinas. Los 32 sistemas con nombre suponen el récord del siglo. A las 18:00, el Centro Meteorológico Nacional emitió alertas azules por ola de frío y viento: del 7 a las 20:00 al 10 a las 08:00 el centro y este del país perderán 6-10 °C, localmente más de 14, y del 8 a las 20:00 al 9 a las 20:00 el mar Amarillo, el mar de China Oriental, el estrecho de Taiwán, el canal de Bashi y el norte y centro del mar de China Meridional tendrán vientos de fuerza 7-8 con rachas de 9-10.", "ja": "11月7日14時、今年32号の台風「チャパカ」が北西太平洋で熱帯暴風として発生した。中心はグアムの北北西約720キロ、中心付近の最大風速は風力8。8日5時には強い熱帯暴風に発達し、最大風速は風力10、中心気圧985ヘクトパスカル。時速20〜25キロで西北西へ進みながら発達する見込みで、中国の海域への影響はない。今年の台風番号は32に達し、21世紀以降で最多を更新した。同日18時、中央気象台は寒潮警報（青）と強風警報（青）を発表。7日20時から10日8時にかけ中東部で6〜10度、局地で14度以上の降温、8日20時から9日20時にかけ黄海、東シナ海、台湾海峡、バシー海峡、南シナ海北部・中部で風力7〜8、突風9〜10の見込み。"}, "why": {"zh": "台风编号创纪录和寒潮预警出现在同一天，是今年气候的一个注脚：极端不再是“某一次”，而是“常态化的频率”。", "en": "A record storm count and a cold-wave alert on the same day is a footnote to this year’s climate: extremes are no longer “one event” but a normalised frequency.", "es": "Un récord de tormentas y una alerta de ola de frío el mismo día resume el clima de este año: lo extremo ya no es “un episodio” sino una frecuencia normalizada.", "ja": "台風番号の記録更新と寒潮警報が同じ日に出たことは、今年の気候の注釈だ。極端は「一度の出来事」ではなく「常態化した頻度」になった。"}}, {"idx": "03", "title": {"zh": "通报近 5 个月，“鹅腿阿姨”调查仍在进行", "en": "Nearly Five Months On, the “Goose Leg Auntie” Inquiry Is Still Open", "es": "Casi cinco meses después, la investigación sobre la “tía de las patas de ganso” sigue abierta", "ja": "通報から5か月、「ガチョウ脚のおばさん」調査はなお継続"}, "body": {"zh": "今年 6 月，“鹅腿阿姨”被指实际售卖鸭腿而非鹅腿，引发广泛关注。6 月 11 日，北京市海淀区市场监管局发布情况通报称，已组织相关市场监管所开展调查、问询当事人，正对其涉嫌误导消费者等行为进一步核查，下一步将依法依规处置。11 月 6 日，该局工作人员回应记者称，此事仍在调查中，会依法依规进行处置。当事人陈秀凤今年 56 岁，2001 年从江苏连云港到北京，先后卖过水果与烧烤，后以“鹅腿阿姨”被学生叫开；她此前表示曾试图向购买者说明原料情况，如给学生带来困惑愿意致歉。", "en": "In June this year, “Goose Leg Auntie” was accused of selling duck legs rather than goose legs, drawing wide attention. On 11 June the Beijing Haidian district market supervision bureau said it had opened an investigation and questioned the vendor over suspected misleading of consumers, and would handle the matter according to law. On 6 November a staff member told reporters the case is still under investigation. Chen Xiufeng, 56, came to Beijing from Lianyungang in Jiangsu in 2001 and sold fruit and then barbecue before students nicknamed her “Goose Leg Auntie”. She has said she tried to explain the ingredient to buyers and would apologise if students were confused.", "es": "En junio de este año, la “tía de las patas de ganso” fue acusada de vender patas de pato en lugar de ganso, lo que generó amplia atención. El 11 de junio, la oficina de supervisión de mercado del distrito de Haidian de Pekín informó de que había abierto una investigación e interrogado a la vendedora por presunta información engañosa al consumidor y que actuaría conforme a la ley. El 6 de noviembre, un empleado dijo a los periodistas que el caso sigue en investigación. Chen Xiufeng, de 56 años, llegó a Pekín desde Lianyungang (Jiangsu) en 2001 y vendió fruta y luego barbacoa antes de que los estudiantes la apodaran así. Ha dicho que intentó explicar el ingrediente a los compradores y que se disculparía si generó confusión.", "ja": "今年6月、「ガチョウ脚のおばさん」が実際にはガチョウではなくアヒルの脚を売っていたと指摘され、大きな注目を集めた。6月11日、北京市海淀区市場監督管理局は状況を通報し、関連の監督所に調査と聞き取りを行わせ、消費者を誤導した疑いについてさらに確認を進め、法に基づき処理するとした。11月6日、同局の担当者は取材に対し、なお調査中で法に基づき処理すると答えた。当事者の陳秀鳳さんは56歳。2001年に江蘇省連雲港から北京に出て果物と焼き肉を売り、後に学生たちから「ガチョウ脚のおばさん」と呼ばれるようになった。材料について購入者に説明しようとしたことがあり、学生に混乱を与えたなら謝罪したいと述べている。"}, "why": {"zh": "一个 16 元的烤腿，调查了近 5 个月还没有结论——公众要的其实不是“重罚”，而是“这件事有没有人管、管到哪一步”。", "en": "A 16-yuan roast leg has been under investigation for nearly five months without a conclusion. What the public wants is not necessarily a heavy penalty but an answer to “is anyone on this, and how far has it got”.", "es": "Una pata asada de 16 yuanes lleva casi cinco meses en investigación sin conclusión. Lo que pide el público no es tanto un castigo severo como saber si alguien se ocupa y hasta dónde ha llegado.", "ja": "16元の焼き脚の調査が5か月近く結論が出ていない。世論が求めているのは「厳罰」よりも、「誰が管しているのか、どこまで進んだのか」という答えだ。"}}, {"idx": "04", "title": {"zh": "保定清苑一在建项目桥体脱落，4 人受伤", "en": "Bridge Section Collapses at a Hebei Construction Site, Injuring Four", "es": "Se desploma un tramo de puente en una obra de Hebei y deja cuatro heridos", "ja": "河北保定の建設現場で橋体が落下、4人負傷"}, "body": {"zh": "11 月 7 日 10 时 50 分，河北保定清苑区跨沧榆高速（沧州方向 K105+550 处）一在建项目施工现场，钢桁架顶推作业过程中发生桥体脱落。清苑区人民政府当日发布情况通报，事故造成 4 人受伤，相关处置与调查工作正在进行。", "en": "At 10:50 on 7 November, a bridge section fell during steel-truss jacking work at a construction site where a project crosses the Cangzhou-Yulin expressway in Qingyuan district, Baoding, Hebei (Cangzhou-bound, K105+550). The Qingyuan district government said in a statement the same day that four people were injured, and that response and investigation are under way.", "es": "A las 10:50 del 7 de noviembre, un tramo de puente se desplomó durante las labores de empuje de una estructura de acero en una obra donde un proyecto cruza la autopista Cangzhou-Yulin, en el distrito de Qingyuan (Baoding, Hebei), en el punto K105+550 sentido Cangzhou. El gobierno del distrito informó ese mismo día de cuatro heridos y de que la respuesta y la investigación están en marcha.", "ja": "11月7日10時50分、河北省保定市清苑区で滄州—楡林高速道路（滄州方向K105+550）をまたぐ建設プロジェクトの現場において、鋼トラスの押し出し作業中に橋体が落下した。清苑区政府は同日、4人が負傷したとの状況を通報し、対応と調査を進めているとした。"}, "why": {"zh": "顶推作业是桥梁施工里风险最高的工序之一——“在建”两个字，往往意味着防护与监测都还在半成品状态。", "en": "Jacking is one of the riskiest operations in bridge construction; “under construction” usually means protection and monitoring are themselves half-finished.", "es": "El empuje es una de las operaciones de mayor riesgo en la construcción de puentes: “en obras” suele significar que la protección y el monitoreo también están a medio hacer.", "ja": "押し出し工法は橋梁工事で最もリスクの高い工程の一つだ。「建設中」という二文字は、防護も計測も半製品状態であることを意味しがちだ。"}}, {"idx": "05", "title": {"zh": "第 27 个中国记者节：同一天，世界媒体峰会在北京发布共识", "en": "China’s 27th Journalists’ Day: the Same Day, a World Media Summit Consensus in Beijing", "es": "27.º Día del Periodista en China: el mismo día, consenso de la cumbre mundial de medios en Pekín", "ja": "中国記者節27回目、同じ日に世界メディアサミットが北京で共通認識を発表"}, "body": {"zh": "11 月 8 日是第 27 个中国记者节。11 月 7 日，第七届世界媒体峰会在北京举行，开幕式上《第七届世界媒体峰会北京共识》正式发布。共识指出，与会代表看到人工智能正在引领新一轮科技革命和产业变革，深刻改变人类生产生活方式和世界发展格局，愿发挥媒体独特优势、凝聚各方共识、共同推进合作行动落地见效，推动人工智能时代全球媒体转型发展。峰会期间还举办了相关论坛与交流活动。", "en": "8 November is China’s 27th Journalists’ Day. A day earlier, the seventh World Media Summit opened in Beijing, where the Beijing Consensus of the Seventh World Media Summit was released. It noted that delegates recognise artificial intelligence is driving a new round of technological and industrial change and reshaping how people live and work and the global development landscape, and that they are willing to use the media’s distinctive strengths, build consensus and push cooperation into effect to advance the transformation of global media in the AI era. Related forums and exchanges were held alongside the summit.", "es": "El 8 de noviembre es el 27.º Día del Periodista en China. Un día antes se celebró en Pekín la séptima Cumbre Mundial de Medios, donde se presentó el Consenso de Pekín de la Séptima Cumbre. El texto señala que los participantes constatan que la inteligencia artificial impulsa una nueva revolución tecnológica e industrial y transforma la vida, el trabajo y el panorama del desarrollo mundial, y que están dispuestos a aprovechar las fortalezas de los medios, construir consensos y convertir la cooperación en resultados para impulsar la transformación global de los medios en la era de la IA. Junto a la cumbre se celebraron foros e intercambios.", "ja": "11月8日は中国の記者節（27回目）。前日の11月7日、第7回世界メディアサミットが北京で開催され、開幕式で「第7回世界メディアサミット北京共通認識」が発表された。AIが新たな技術・産業革命を主導し、人々の生産と生活、世界の発展構造を深く変えていると認識し、メディアの特性を生かして合意を形成し、協力行動を実効化してAI時代の世界のメディア変革を後押しする意向を示した。期間中には関連フォーラムや交流も行われた。"}, "why": {"zh": "记者节谈 AI 有点微妙：这个行业最先被工具改写，也最需要说清楚“什么还必须是人来做的”。", "en": "Talking about AI on Journalists’ Day is a little delicate: this is the industry rewritten first by the tools, and the one that most needs to say what still has to be done by people.", "es": "Hablar de IA en el Día del Periodista resulta delicado: es el sector que las herramientas reescriben primero y el que más necesita aclarar qué debe seguir haciendo una persona.", "ja": "記者節にAIを語るのは少し微妙だ。この職業は道具によって最初に書き換えられ、同時に「何が人間でなければならないか」を最も説明する必要がある。"}}]}, {"key": "ent", "num": "06", "color": "#db2777", "deep": "#ad1a5e", "name": {"zh": "娱乐八卦", "en": "ENTERTAINMENT", "es": "ESPECTÁCULOS", "ja": "エンタメ"}, "items": [{"idx": "01", "tag": {"zh": "进展"}, "title": {"zh": "《嫁金钗》回门宴：一个“同步伸手”被质疑，一叠纸巾被认作真", "en": "“Marrying the Gold Hairpin” Wrap Event: a Synced Gesture Questioned, a Tissue Believed", "es": "Cierre de “Marrying the Gold Hairpin”: un gesto sincronizado cuestionado y un pañuelo creído", "ja": "「嫁金釵」打ち上げ会――「同時に手を伸ばす」は疑問視、ティッシュは本物と評価"}, "body": {"zh": "11 月 7 日，《嫁金钗》收官回门宴上，田曦薇与闫桉出场时几乎同时向对方伸手的动作被慢放传播，弹幕刷“公费恋爱”“原地结婚”；也有博主指出这更像职业性的走位设计，靠慢放与逐帧解读才成立。真正被观众认作“真糖”的是另外两个细节：田曦薇看回顾短片落泪时，闫桉递上纸巾、待她擦完又自然接过用过的纸巾；闫桉假装跟着哭逗她笑，现场气氛从伤感转成笑声。围绕这场活动的讨论还延伸到营销方式——有观点认为硬糖按头不如体面告别，演员真实情绪反而没被重点传播。", "en": "At the wrap event for “Marrying the Gold Hairpin” on 7 November, Tian Xiwei and Yan An reached out to each other almost simultaneously as they entered, a moment slowed down and shared widely with viewers joking about “company-funded romance”. Some bloggers noted it looked more like professional stage blocking that only works frame by frame. What audiences did treat as genuine were two other details: when Tian wept watching a retrospective clip, Yan handed her tissues and then naturally took back the used ones; and Yan pretended to cry to make her laugh, turning the mood from sorrow to laughter. Discussion also turned to marketing: many argued that forced sweetness lands worse than a dignified farewell, and that the actors’ real emotions were not what got pushed.", "es": "En el cierre de “Marrying the Gold Hairpin” del 7 de noviembre, Tian Xiwei y Yan An se tendieron la mano casi al mismo tiempo al entrar, un momento ralentizado y muy compartido con bromas sobre “noviazgo pagado por la empresa”. Algunos blogueros señalaron que parece más bien una marca escénica profesional que solo funciona fotograma a fotograma. Lo que el público sí consideró genuino fueron otros dos detalles: cuando Tian lloró viendo un vídeo retrospectivo, Yan le tendió pañuelos y luego recogió los usados con naturalidad; y Yan fingió llorar para hacerla reír, cambiando el ambiente de tristeza a risas. El debate derivó al marketing: muchos sostienen que lo forzado funciona peor que una despedida digna y que las emociones reales no fueron lo que se difundió.", "ja": "11月7日、「嫁金釵」の打ち上げ会で、田曦薇と閻桉が登場時にほぼ同時に手を伸ばした場面がスロー再生で拡散され、「会社公認の恋愛」などと話題になった。一方で、これは職業的な立ち位置の設計で、スロー＆コマ送りでこそ成立するものだという指摘も出た。観客が「本物」と評価したのは別の二つの細部だ。田曦薇が振り返り映像で涙を流したとき、閻桉がティッシュを差し出し、拭き終えた使用済みのものを自然に受け取ったこと。そして閻桉が泣くふりをして彼女を笑わせ、場の空気を悲しみから笑いへ変えたこと。議論はマーケティングにも及び、無理に作った糖より潔い別れの方が良い、俳優の実際の感情が伝わっていない、との声も出た。"}, "why": {"zh": "观众对“营业”的识别能力已经很高了，能被相信的只有那些不为了被看见而做的动作。", "en": "Audiences are now highly fluent in spotting performance; what earns belief is the gesture made without the intention of being seen.", "es": "El público detecta el “show” con soltura; solo se cree el gesto que no se hizo para ser visto.", "ja": "観客は「営業」を見抜く力がもう高い。信じられるのは、見られるために行われていない仕草だけだ。"}}, {"idx": "02", "title": {"zh": "正午阳光《重庆号》开机：张若昀、胡先煦领衔，“明侦熟人局”进组", "en": "Daylight Entertainment Starts “Chongqing”: Zhang Ruoyun and Hu Xianxu Lead a Familiar Cast", "es": "Daylight arranca “Chongqing”: Zhang Ruoyun y Hu Xianxu encabezan un reparto ya conocido", "ja": "正午陽光の新ドラマ「重慶号」がクランクイン、張若昀と胡先煦が主演"}, "body": {"zh": "11 月 7 日，正午阳光新剧《重庆号》开机，剧方公布阵容：张若昀、胡先煦领衔，马思纯、黄明昊、尹昉等特别出演。因张若昀、黄明昊、马思纯等人是综艺《明星大侦探》的常客与高能玩家，网友调侃正午阳光把“明侦熟人局”搬进了这部历史正剧，相关话题“正午这次喊来了明侦的兵”当日登上微博热搜。", "en": "Daylight Entertainment’s new series “Chongqing” began shooting on 7 November, with Zhang Ruoyun and Hu Xianxu in the lead and Ma Sichun, Huang Minghao and Yin Fang in special appearances. Because several cast members are regulars and strong players on the variety show “Who’s the Murderer”, netizens joked that the studio had moved that show’s familiar circle into a historical drama, and the hashtag trended on Weibo that day.", "es": "La nueva serie de Daylight Entertainment, “Chongqing”, comenzó a rodarse el 7 de noviembre con Zhang Ruoyun y Hu Xianxu como protagonistas y Ma Sichun, Huang Minghao e Yin Fang en papeles especiales. Como varios integrantes son habituales y jugadores destacados del programa “Who’s the Murderer”, los internautas bromearon con que el estudio trasladó ese círculo a un drama histórico, y la etiqueta fue tendencia en Weibo ese día.", "ja": "11月7日、正午陽光の新作ドラマ「重慶号」がクランクインし、張若昀と胡先煦が主演、馬思純、黄明昊、尹昉らが特別出演すると発表された。張若昀や黄明昊、馬思純らはバラエティ「明星大偵探」の常連で実力者であることから、ネットでは「あの番組の常連を歴史ドラマに連れてきた」と話題になり、関連ワードが同日微博のトレンド入りした。"}, "why": {"zh": "一部历史正剧的选角被讨论成综艺梗，说明演员的“公共形象”已经先于角色抵达观众——这对正剧是双刃剑。", "en": "When casting for a historical drama gets discussed as a variety-show gag, it shows an actor’s public image arrives before the character does — a double-edged sword for serious drama.", "es": "Que el reparto de un drama histórico se discuta como un chiste de variedades muestra que la imagen pública del actor llega antes que el personaje: un arma de doble filo para el drama serio.", "ja": "歴史ドラマの配役がバラエティのネタとして語られるのは、俳優の「公的なイメージ」が役柄より先に観客へ届いている証拠だ。本格ドラマにとっては諸刃の剣である。"}}, {"idx": "03", "title": {"zh": "双 11 晚会定档 11 月 10 日：白鹿首登，孟子义进常驻阵容", "en": "Double 11 Gala Set for 10 November: Bai Lu Debuts, Meng Ziyi Joins the Regular Line-Up", "es": "La gala del Doble 11 será el 10 de noviembre: debuta Bai Lu y Meng Ziyi entra como fija", "ja": "ダブル11のガラは11月10日、白鹿が初出演、孟子義はレギュラー陣に"}, "body": {"zh": "湖南卫视《2026 双 11 疯狂好六夜》定档 11 月 10 日 19 时 30 分，湖南卫视与芒果 TV 同步直播。白鹿首次登上芒果双 11 晚会舞台；孟子义今年的身份由“做客”变为常驻阵容，每位嘉宾携一件私藏小物配一句心愿文案，登场分“营业人格”与“整活人格”两种风格，红毯以创意变装亮相，中间穿插边逛边玩的“六之大集”。白鹿近期《开到荼蘼》已于 11 月初杀青，其杀青花絮与品牌直播亦保持热度。", "en": "Hunan TV’s “2026 Double 11 Crazy Haoliu Night” airs at 19:30 on 10 November, simulcast on Hunan TV and Mango TV. Bai Lu appears on a Mango Double 11 stage for the first time; Meng Ziyi moves from guest to the regular line-up this year. Each guest brings a personal item and a wish line, entering in either a “professional persona” or a “goofball persona”, with a creative costume red carpet and a roaming “Six Market” segment. Bai Lu’s series “Kai Dao Tu Mi” wrapped in early November, and her wrap footage and brand livestreams have kept her in the conversation.", "es": "La “Noche Loca Haoliu del Doble 11 2026” de Hunan TV se emite el 10 de noviembre a las 19:30, en simultáneo por Hunan TV y Mango TV. Bai Lu sube por primera vez a un escenario del Doble 11 de Mango; Meng Ziyi pasa de invitada a plantilla fija. Cada invitado lleva un objeto personal y una frase de deseo, y entra con una “personalidad profesional” o una “personalidad gamberra”, con alfombra roja de disfraces y un segmento itinerante llamado “Seis Mercados”. La serie de Bai Lu “Kai Dao Tu Mi” terminó de rodar a principios de noviembre.", "ja": "湖南衛視の「2026ダブル11狂騒好六ナイト」が11月10日19時30分に放送され、湖南衛視と芒果TVで同時配信される。白鹿は芒果のダブル11に初登場、孟子義は今年「ゲスト」からレギュラー陣に加わる。各ゲストが私物一つと願いの言葉を持ち寄り、「営業人格」と「はじけ人格」の二つのスタイルで登場。レッドカーペットは创意コスチュームで、途中に「六つの市」という巡り企画が入る。白鹿の主演作「開到荼蘼」は11月初旬にクランクアップし、その映像やブランド配信も話題が続いている。"}, "why": {"zh": "购物节的晚会正在从“带货场”变成“人设展示场”——观众记住的是谁的人设好笑，而不是谁卖了多少。", "en": "Shopping-festival galas are turning from sales floors into persona showcases: viewers remember whose character was funny, not who sold the most.", "es": "Las galas de compras pasan de ser escaparates de ventas a vitrinas de personajes: el público recuerda quién fue gracioso, no quién vendió más.", "ja": "ショッピングフェスの番組は「販売の場」から「人設の見せ場」へ変わりつつある。視聴者が覚えているのは誰が面白かったかで、誰が多く売ったかではない。"}}, {"idx": "04", "title": {"zh": "《笑有新生 2026》开播：优秀新人可获春晚语言类共创推荐卡", "en": "“New Laughs 2026” Opens: Standout Newcomers Can Earn a Spring Festival Gala Ticket", "es": "Arranca “New Laughs 2026”: los mejores novatos pueden lograr una recomendación para la Gala del Año Nuevo", "ja": "「笑有新生2026」開始、優秀な新人は春節ガラの推薦枠を獲得"}, "body": {"zh": "11 月 7 日 21 时，央视综艺频道播出《笑有新生 2026》，叶童、于洋、阎鹤祥担任推荐团。节目机制中，表现优异的新人可获得总台春晚语言类节目共创推荐卡。同日，央视综艺频道还推出新的棚内节目，以常态化周播填补周末档。", "en": "CCTV’s variety channel aired “New Laughs 2026” at 21:00 on 7 November, with Michelle Yip, Yu Yang and Yan Hexiang as the recommending panel. Under the format, standout newcomers can receive a co-creation recommendation for a language-based act at the broadcaster’s Spring Festival Gala. The channel also launched a new studio show the same day to fill its weekend slot on a weekly basis.", "es": "El canal de variedades de CCTV emitió “New Laughs 2026” el 7 de noviembre a las 21:00, con Michelle Yip, Yu Yang y Yan Hexiang como jurado recomendador. En el formato, los novatos destacados pueden obtener una recomendación para cocrear un número de humor en la Gala del Año Nuevo chino del grupo. El canal estrenó además ese día un nuevo programa de plató para cubrir la franja del fin de semana.", "ja": "11月7日21時、CCTVのバラエティチャンネルで「笑有新生2026」が放送され、葉童、于洋、閻鶴祥が推薦団を務めた。番組の仕組みでは、優れた新人が総台の春節ガラ向け言語系番組の共同制作推薦カードを得られる。同日、同チャンネルは新たなスタジオ番組も立ち上げ、週替わりの定番枠を埋めた。"}, "why": {"zh": "把“春晚推荐卡”写进赛制，等于给喜剧新人开了一条可预期的通道——比一次性的比赛名次实在得多。", "en": "Putting a Spring Festival Gala recommendation into the rules gives comedy newcomers a predictable path — far more concrete than a one-off competition ranking.", "es": "Incluir una recomendación para la Gala en las reglas da a los cómicos noveles un camino previsible: mucho más concreto que un puesto en un concurso puntual.", "ja": "春節ガラの推薦枠を番組のルールに組み込むことは、お笑いの新人に予見可能な道筋を開くことだ。一度きりの順位よりずっと具体的である。"}}, {"idx": "05", "title": {"zh": "TVB 与腾讯视频合作横屏短剧：一套内容，两种时长", "en": "TVB and Tencent Video Team Up on Landscape Short Drama: One Story, Two Runtimes", "es": "TVB y Tencent Video se alían en microdramas horizontales: una historia, dos duraciones", "ja": "TVBと騰訊視頻が横型ショートドラマで提携――同じ内容を二つの尺で"}, "body": {"zh": "11 月 6 日，TVB 与腾讯视频宣布合作横屏短剧，一套内容按内地 15 分钟、香港一小时分别编排。这意味着同一批素材会以两种节奏面向两个市场：内地走短剧的强冲突快节奏，香港保留长剧的铺陈与人物关系。同日，罗素兄弟执导的超级英雄新片宣布将中国首映礼定在上海。", "en": "On 6 November, TVB and Tencent Video announced a co-production of landscape-format short dramas, with one body of content edited to 15 minutes for the mainland and one hour for Hong Kong. The same material will therefore meet two markets at two tempos: the mainland version leaning on the fast, high-conflict rhythm of short drama, the Hong Kong version keeping the setup and relationships of long-form series. The same day, a superhero film directed by the Russo brothers set its China premiere in Shanghai.", "es": "El 6 de noviembre, TVB y Tencent Video anunciaron la coproducción de microdramas en formato horizontal, con un mismo contenido montado en 15 minutos para la China continental y una hora para Hong Kong. El mismo material llegará a dos mercados con dos ritmos: la versión continental apuesta por el conflicto rápido del microdrama y la de Hong Kong conserva la construcción y las relaciones del formato largo. Ese día, una película de superhéroes de los hermanos Russo fijó su estreno en China en Shanghái.", "ja": "11月6日、TVBと騰訊視頻は横型ショートドラマでの協業を発表した。同じ内容を中国大陸向けに15分、香港向けに1時間へとそれぞれ編集する。同じ素材が二つのテンポで二つの市場に向かうわけだ。大陸版は短編の強い衝突と速いテンポ、香港版は長編の丁寧な人物関係を残す。同日、ルッソ兄弟監督のスーパーヒーロー映画が中国プレミアを上海で行うと発表した。"}, "why": {"zh": "这不是“翻拍”，而是同一条素材带剪出两种叙事节奏——它说明短剧不再是“便宜的长剧”，而是一种独立的内容语法。", "en": "This is not a remake but one set of footage cut into two narrative tempos — evidence that short drama is no longer “cheap long-form” but a grammar of its own.", "es": "No es un remake, sino un mismo material montado en dos ritmos narrativos: prueba de que el microdrama ya no es “formato largo barato” sino una gramática propia.", "ja": "これは「リメイク」ではなく、同じ素材から二つの語りのテンポを生むことだ。ショートドラマが「安上がりな長編」ではなく、独自の文法になったことを示している。"}}]}], "risk": {"zh": "风险提示：本简报仅作信息汇总，其中涉及的数据不构成任何投资建议。", "en": "Risk notice: this briefing is a summary of information only; the data involved does not constitute investment advice.", "es": "Aviso de riesgo: este boletín es solo un resumen informativo y los datos citados no constituyen asesoramiento de inversión.", "ja": "リスク提示：本ブリーフィングは情報の要約のみを目的としており、記載のデータは投資助言を構成するものではありません。"}}/*__END__*/;

          b.href = "#" + key; b.setAttribute("data-nav", key);
          b.style.borderColor = sec.color; b.style.color = sec.deep;
          b.textContent = T(sec.name, lang);
          nav.appendChild(b);
        }
      });
    }
    // 日历文案
    var cb = document.getElementById("calBtnText"); if (cb) cb.textContent = i18n.calBtn;
    var cw = document.getElementById("calWeek");
    if (cw) { cw.innerHTML = ""; i18n.calWeek.forEach(function (w) { var s = document.createElement("span"); s.textContent = w; cw.appendChild(s); }); }
    var cf = document.getElementById("calFoot"); if (cf) cf.textContent = i18n.calFoot;
    // 语言切换器（国旗触发 + 下拉）
    var ls = document.getElementById("langSwitch");
    if (ls) {
      ls.className = "lang-switch" + (langOpen ? " open" : "");
      ls.innerHTML = "";
      var trig = document.createElement("button");
      trig.type = "button"; trig.className = "lang-trigger"; trig.id = "langTrigger";
      trig.setAttribute("aria-haspopup", "true");
      trig.setAttribute("aria-expanded", langOpen ? "true" : "false");
      trig.innerHTML = flag(curLang) + '<span class="caret">▾</span>';
      trig.addEventListener("click", function (e) {
        e.stopPropagation();
        langOpen = !langOpen;
        ls.classList.toggle("open", langOpen);
        trig.setAttribute("aria-expanded", langOpen ? "true" : "false");
      });
      ls.appendChild(trig);
      var menu = document.createElement("div");
      menu.className = "lang-menu"; menu.setAttribute("role", "menu");
      LANGS.forEach(function (l) {
        var item = document.createElement("button");
        item.type = "button"; item.className = "lang-item" + (l === curLang ? " sel" : "");
        item.setAttribute("role", "menuitem"); item.setAttribute("data-lang", l);
        item.innerHTML = flag(l) + '<span class="lbl">' + LANG_LABEL_FULL[l] + "</span>";
        item.addEventListener("click", function (e) {
          e.stopPropagation();
          setLang(l);
        });
        menu.appendChild(item);
      });
      ls.appendChild(menu);
    }
  }

  function renderContent(lang) {
    var i18n = I18N[lang];
    var html = "";
    // 精选
    var sp = BRIEFING.spotlight;
    html += '<section class="spotlight" id="pick">'
      + '<div class="badge"><i></i>' + esc(T(sp.badge, lang)) + "</div>"
      + "<h2>" + titleHtml(sp.title, sp.hl, lang) + "</h2>"
      + '<div class="body">' + esc(T(sp.body, lang)) + "</div>"
      + '<div class="why"><b>' + esc(i18n.why) + "</b>" + esc(T(sp.why, lang)) + "</div>"
      + "</section>";
    // 分类
    html += '<div class="grid">';
    BRIEFING.sections.forEach(function (sec) {
      html += '<section class="card" id="' + sec.key + '" style="--ac:' + sec.color + "; --ac-deep:" + sec.deep + ';">'
        + '<div class="sec-head"><span class="sec-num">' + sec.num + "</span>"
        + "<h3>" + esc(T(sec.name, lang)) + "</h3>"
        + '<span class="en">' + sec.key.toUpperCase() + "</span></div>";
      (sec.items || []).forEach(function (it) {
        html += '<div class="item">';
        html += '<div class="t"><span class="idx">' + it.idx + "</span>";
        if (it.tag) html += '<span class="tag">' + esc(it.tag[lang] != null ? it.tag[lang] : i18n.tag) + "</span>";
        html += titleHtml(it.title, it.hl, lang) + "</div>";
        html += '<div class="d">' + esc(T(it.body, lang)) + "</div>";
        html += '<div class="why"><b>' + esc(i18n.why) + "</b>" + esc(T(it.why, lang)) + "</div>";
        html += "</div>";
      });
      html += "</section>";
    });
    html += "</div>";
    var content = document.getElementById("content");
    if (content) content.innerHTML = html;
    // 页脚
    var risk = document.getElementById("risk");
    if (risk) risk.textContent = T(BRIEFING.risk, lang);
  }

  function setLang(lang) {
    if (LANGS.indexOf(lang) < 0) lang = "zh";
    curLang = lang;
    langOpen = false;
    try { localStorage.setItem("timab_lang", lang); } catch (e) {}
    renderChrome(lang);
    renderContent(lang);
  }

  /* ===== 往期日历（保留原逻辑，文案随语言） ===== */
  function initCalendar() {
    var btn = document.getElementById("calBtn");
    var pop = document.getElementById("calPop");
    var grid = document.getElementById("calGrid");
    var title = document.getElementById("calTitle");
    if (!btn || !pop || !grid || !title) return;

    var parts = BRIEFING.date.split("-");
    var todayKey = parts[0].slice(2) + parts[1] + parts[2];
    var cur = { y: +parts[0], m: +parts[1] };
    var has = {};
    for (var i = 0; i < ARCHIVE_DATES.length; i++) { has[ARCHIVE_DATES[i]] = 1; }
    var HIST_BASE = /\/history\//.test(location.pathname) ? "./" : "history/";

    function ckey(y, m, d) { return String(y).slice(2) + pad(m) + pad(d); }

    function render() {
      var i18n = I18N[curLang];
      title.textContent = i18n.calTitle(cur.y, cur.m);
      grid.innerHTML = "";
      var start = new Date(cur.y, cur.m - 1, 1).getDay();
      var days = new Date(cur.y, cur.m, 0).getDate();
      for (var b = 0; b < start; b++) {
        var blank = document.createElement("span");
        blank.className = "cal-cell is-empty"; grid.appendChild(blank);
      }
      for (var d = 1; d <= days; d++) {
        var k = ckey(cur.y, cur.m, d);
        var cell = document.createElement("span");
        cell.className = "cal-cell" + (has[k] ? " has" : "") + (k === todayKey ? " is-today" : "");
        cell.textContent = d;
        if (has[k]) {
          cell.setAttribute("role", "link"); cell.setAttribute("tabindex", "0");
          cell.title = cur.y + "-" + pad(cur.m) + "-" + pad(d) + " 存档";
          (function (target) {
            var go = function () { window.open(HIST_BASE + target + ".html", "_blank", "noopener"); };
            cell.addEventListener("click", go);
            cell.addEventListener("keydown", function (e) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); go(); } });
          })(k);
        }
        grid.appendChild(cell);
      }
    }
    function toggle(open) {
      pop.hidden = !open;
      btn.setAttribute("aria-expanded", open ? "true" : "false");
      if (open) render();
    }
    btn.addEventListener("click", function (e) { e.stopPropagation(); toggle(pop.hidden); });
    document.getElementById("calPrev").addEventListener("click", function () { cur.m--; if (cur.m < 1) { cur.m = 12; cur.y--; } render(); });
    document.getElementById("calNext").addEventListener("click", function () { cur.m++; if (cur.m > 12) { cur.m = 1; cur.y++; } render(); });
    document.addEventListener("click", function (e) { if (!pop.hidden && !pop.contains(e.target)) toggle(false); });
    document.addEventListener("keydown", function (e) { if (e.key === "Escape" && !pop.hidden) toggle(false); });
  }

  /* ===== 启动 ===== */
  function boot() {
    curLang = detectLang();
    renderChrome(curLang);
    renderContent(curLang);
    initCalendar();
    // 关闭语言下拉：点击外部 / Esc
    document.addEventListener("click", function (e) {
      var ls = document.getElementById("langSwitch");
      if (ls && langOpen && !ls.contains(e.target)) {
        langOpen = false;
        ls.classList.remove("open");
        var t = document.getElementById("langTrigger");
        if (t) t.setAttribute("aria-expanded", "false");
      }
    });
    document.addEventListener("keydown", function (e) {
      if (e.key === "Escape" && langOpen) {
        langOpen = false;
        var ls = document.getElementById("langSwitch");
        if (ls) ls.classList.remove("open");
        var t = document.getElementById("langTrigger");
        if (t) t.setAttribute("aria-expanded", "false");
      }
    });
  }
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", boot);
  } else { boot(); }
})();
</script>
</body>
</html>
