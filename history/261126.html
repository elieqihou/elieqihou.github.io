 Weibo. Según los reportes, los padres fallecieron dejando esa suma; el hermano sostuvo que la herencia debía ser solo suya y negó el parentesco en la disputa. Los juristas recuerdan que, sin testamento válido, los hijos son herederos de primer orden y heredan por partes iguales, con posibilidad de una cuota mayor para quien prestó el cuidado principal. El caso pasó a mediación o litigio.", "ja": "133 万元の遺産を独占しようとした弟が、姉との関係を否認したとして話題に。報道によれば、両親の死後に約 133 万元が残り、弟は自分が単独で相続すべきだと主張して分割を拒み、口論の中で親族関係まで否定した。専門家は、有効な遺言がなければ子は第一順位の相続人で原則均分、主たる扶養を尽くした者は増額があり得ると指摘する。現在は調停か訴訟の段階にある。"}, "why": {"zh": "热搜的分量不在 133 万，而在「翻脸不认」这四个字——它把继承纠纷从算术题变成了亲情题。法律能给出均分方案，却解决不了「谁照顾父母更多」这种没有票据的付出，这才是这类案件最难判的部分。", "en": "What carries the story is not the 1.33 million but the refusal to acknowledge the relationship, which turns an inheritance sum into a question about family. The law can order an equal split; it cannot price care given without receipts, and that is the hardest part of cases like this.", "es": "Lo que pesa no son los 1,33 millones sino la negación del parentesco, que convierte un reparto en un problema de familia. La ley puede ordenar partes iguales, pero no puede poner precio a los cuidados sin factura, y ahí está la dificultad.", "ja": "重いのは 133 万元ではなく「身内ではない」と言い切った点だ。相続の計算問題が、家族の問題に変わる。法律は均分を命じられても、領収書のない介護の値段はつけられない。そこが難しい。"}}, {"idx": "05", "title": {"zh": "小米三季度净利润 38.8 亿元，同比大降 68%", "en": "Xiaomi third-quarter net profit falls 68 percent to 3.88 billion yuan", "es": "El beneficio neto de Xiaomi cae un 68 % hasta 3.880 millones de yuanes", "ja": "小米の 7〜9 月純利益は 38.8 億元、前年同期比 68 % 減"}, "body": {"zh": "小米集团三季度财报显示，营收 1072.4 亿元、同比下降 5.2%，略超市场预期；净利润 38.8 亿元、同比大降 68%，低于预估的 44.9 亿元。智能电动汽车及 AI 等创新业务收入 238.8 亿元、同比下降 18%。管理层称，存储芯片涨价挤压手机毛利，但不会简单提价转嫁成本。公司年内已回购 131 亿港元，超过上年全年。", "en": "Xiaomi's third-quarter results showed revenue of 107.24 billion yuan, down 5.2 percent year on year and slightly above expectations, while net profit fell 68 percent to 3.88 billion yuan, below the 4.49 billion forecast. Revenue from smart EVs and AI innovation businesses dropped 18 percent to 23.88 billion yuan. Management said memory-chip inflation is squeezing handset margins but that it will not simply pass costs on through price rises. The company has bought back 13.1 billion Hong Kong dollars of shares this year, more than in all of last year.", "es": "Los resultados del tercer trimestre de Xiaomi mostraron ingresos de 107.240 millones de yuanes, un 5,2 % menos interanual y algo por encima de lo esperado, mientras el beneficio neto cayó un 68 % hasta 3.880 millones, por debajo de los 4.490 previstos. Los ingresos de vehículos eléctricos e iniciativas de inteligencia artificial bajaron un 18 % hasta 23.880 millones. La dirección señaló que el encarecimiento de la memoria presiona el margen de los móviles, pero que no trasladará los costes con una simple subida de precios. La empresa ha recomprado 13.100 millones de dólares de Hong Kong en el año.", "ja": "小米集団の 7〜9 月期決算は、売上高が 1072.4 億元で前年同期比 5.2 % 減と予想をわずかに上回った一方、純利益は 68 % 減の 38.8 億元で市場予想 44.9 億元を下回った。電気自動車と AI などの新規事業の売上は 18 % 減の 238.8 億元。経営陣は、メモリー価格の上昇がスマホの粗利を圧迫しているとしつつ、単純な値上げでコストを転嫁はしないと述べた。年初来の自社株買いは 131 億香港ドルで前年通年を超えた。"}, "why": {"zh": "营收只降 5.2%，利润却掉 68%，差额几乎全在成本端——存储涨价是今年消费电子最硬的一条成本曲线。管理层选择「不简单提价」，等于用利润换份额；这个选择能不能撑到内存价格回落，是明年最重要的观察点。", "en": "Revenue fell 5.2 percent while profit fell 68, and the gap sits almost entirely on the cost side: memory inflation is the hardest cost curve in consumer electronics this year. Choosing not to simply raise prices means trading margin for share, and whether that can last until memory prices ease is next year's key question.", "es": "Los ingresos cayeron un 5,2 % y el beneficio un 68 %: la diferencia está casi toda en costes, porque el encarecimiento de la memoria es la curva más dura del sector este año. No subir precios equivale a cambiar margen por cuota, y si eso aguanta hasta que la memoria se abarate es la gran pregunta del año próximo.", "ja": "売上は 5.2 % 減にとどまったのに利益は 68 % 減。差額はほぼコスト側にあり、メモリー価格の上昇は今年の家電・電子機器で最も厳しいコスト曲線だ。単純な値上げを避けるのは、利益をシェアに替える選択であり、メモリー安まで持ちこたえられるかが来年の焦点になる。"}}]}, {"key": "ent", "num": "06", "color": "#db2777", "deep": "#ad1a5c", "name": {"zh": "娱乐八卦", "en": "Entertainment", "es": "Espectáculos", "ja": "エンタメ"}, "items": [{"idx": "01", "title": {"zh": "《古乐风华录》定档 11 月 29 日，李一桐陈鑫海主演", "en": "Costume drama The Record of Ancient Music sets a 29 November premiere", "es": "El drama de época El registro de la música antigua se estrena el 29 de noviembre", "ja": "「古楽風華録」11 月 29 日スタート、李一桐と陳鑫海が主演"}, "body": {"zh": "40 集古装奇幻爱情剧《古乐风华录》11 月 25 日官宣定档 11 月 29 日，湖南卫视、腾讯视频、芒果 TV 同步上线，赵一龙执导，李一桐、陈鑫海领衔主演，郭俊辰特别主演、何洛洛特别出演。剧集改编自国风漫画《琴瑟缘》，设定中乐器可化身为「乐灵」，隐姓埋名的乐师越央央与卧底乐灵少熠从敌对到结伴，寻找圣乐灵并卷入多方势力阴谋。", "en": "The 40-episode costume fantasy romance The Record of Ancient Music was dated for 29 November, airing simultaneously on Hunan Satellite TV, Tencent Video and Mango TV. Directed by Zhao Yilong, it stars Li Yitong and Chen Xinhai, with Guo Junchen and He Luoluo in supporting roles. Adapted from the guofeng comic Qinse Yuan, it imagines instruments that take human form as music spirits, following a hidden musician and an undercover spirit who move from rivalry to partnership while hunting a sacred spirit.", "es": "El drama fantástico de época de 40 episodios El registro de la música antigua se estrenará el 29 de noviembre en Hunan TV, Tencent Video y Mango TV. Dirigido por Zhao Yilong, protagonizado por Li Yitong y Chen Xinhai, con Guo Junchen y He Luoluo. Adapta el cómic guofeng Qinse Yuan, donde los instrumentos se transforman en espíritus musicales; una música oculta y un espíritu infiltrado pasan de la rivalidad a la alianza.", "ja": "全 40 話の古装ファンタジー恋愛劇「古楽風華録」が 11 月 29 日開始と発表された。湖南衛視、騰訊視頻、芒果 TV で同時配信。監督は趙一龍、主演は李一桐と陳鑫海、郭俊辰と何洛洛も出演する。国風漫画「琴瑟縁」が原作で、楽器が「楽霊」に姿を変える世界を描く。名を隠した楽師と潜入中の楽霊が敵対から同行へと変わり、聖楽霊を探すうちに多方の陰謀に巻き込まれる。"}, "why": {"zh": "「乐器化灵」是个视觉上很容易出彩、叙事上很容易失控的设定：做得好像《只此青绿》的动感版，做不好就是特效堆砌。真正的胜负手在音乐本身——如果配乐撑不起「乐灵」的世界观，再美的造型也只是壁纸。", "en": "Instruments becoming spirits is a premise that can look spectacular and narrate badly: done well it is a kinetic version of a stage classic, done poorly it is a pile of effects. The decisive factor is the music itself, because if the score cannot carry the world of music spirits, beautiful styling is only wallpaper.", "es": "Que los instrumentos se vuelvan espíritus es una premisa que puede lucir mucho y narrar mal: bien hecha es una versión cinética de un clásico escénico, mal hecha es un montón de efectos. Lo decisivo es la música: si la banda sonora no sostiene ese mundo, el diseño queda en papel pintado.", "ja": "楽器が霊になるという設定は、映像では映えるが物語は破綻しやすい。うまくやれば舞台作品の動態版、失敗すれば効果の寄せ集めになる。勝負を分けるのは音楽そのものだ。スコアが「楽霊」の世界を支えられなければ、美しい造型も壁紙にすぎない。"}}, {"idx": "02", "title": {"zh": "12 月 5 日双片对打：郭富城《请不走的门神》遇上《火拼》", "en": "Two films go head to head on 5 December, led by Aaron Kwok and a Hong Kong crime thriller", "es": "Dos películas se enfrentan el 5 de diciembre, con Aaron Kwok y un thriller de acción hongkonés", "ja": "12 月 5 日に 2 作品が激突、郭富城主演作と香港アクション「火拼」"}, "body": {"zh": "11 月 25 日，郭富城领衔主演的《请不走的门神》官宣定档 12 月 5 日，张忠华编剧、执导，取材陕西临潼真实事件：年关，债主武争良上门讨要赛鸽欠款，欠债人跑路，家里只剩一对姐弟，他在等待中慢慢照顾起两个孩子，直到除夕夜孩子父亲突然回来。同日，英皇电影出品的犯罪动作片《火拼》也定档 12 月 5 日，吴家伟执导，方中信、吕良伟、安志杰、张继聪、陈家乐领衔，讲悍匪兄弟设局复仇、冲锋队追查旧案。另有国内首部长征题材亲子动画《灰耳朵也是勇士》定档 12 月 12 日。", "en": "Aaron Kwok's The Door God Who Won't Leave was dated for 5 December, written and directed by Zhang Zhonghua and based on a true story from Lintong, Shaanxi: a debt collector arrives before New Year over an unpaid pigeon-racing debt, finds only two children at home, and gradually cares for them until their father returns on New Year's Eve. Emperor Motion Pictures' crime thriller Firefight also opens on 5 December, directed by Ng Ka-wai and starring Alex Fong, Ray Lui, Andy On, Louis Cheung and Carlos Chan, following brothers staging a robbery to settle an old score. The animation Grey Ears Is Also a Warrior, billed as China's first Long March-themed family film, opens on 12 December.", "es": "The Door God Who Won't Leave, con Aaron Kwok, se estrenará el 5 de diciembre. Escrita y dirigida por Zhang Zhonghua, parte de un caso real de Lintong (Shaanxi): un cobrador llega antes del Año Nuevo por una deuda de palomas y solo encuentra a dos niños, a los que acaba cuidando hasta que el padre regresa en Nochevieja. Ese mismo día llega el thriller Firefight, de Emperor Motion Pictures, dirigido por Ng Ka-wai con Alex Fong, Ray Lui, Andy On, Louis Cheung y Carlos Chan. El 12 de diciembre se estrena la animación Grey Ears Is Also a Warrior.", "ja": "郭富城主演「請不走的門神」が 12 月 5 日に公開決定。張忠華が脚本・監督を務め、陝西省臨潼の実話が原作。年末に鳩レースの借金を取り立てに来た男が、逃げた債務者の家で姉弟だけが残されているのを見つけ、次第に面倒を見るようになる。同じ 12 月 5 日には英皇電影の犯罪アクション「火拼」も公開。呉家偉監督、方中信、呂良偉、安志傑、張継聡、陳家楽が出演する。12 月 12 日には長征を描く初の親子向けアニメ「灰耳も勇士」が控える。"}, "why": {"zh": "两部片子同日对打，类型却完全相反：一个是小成本、靠表演和情绪的现实题材，一个是枪战追车齐上的港式犯罪片。贺岁档的第一场硬仗，往往决定院线把黄金场次留给谁——排片经理的选择，比影评更早给出答案。", "en": "The two open the same day with opposite propositions: a small-scale character piece built on performance and feeling, and a Hong Kong crime film with shootouts and car chases. The first real fight of the holiday season usually decides who gets the prime slots, and cinema programmers answer earlier than critics do.", "es": "Comparten fecha con propuestas opuestas: un drama pequeño sostenido en la interpretación y la emoción, y un thriller hongkonés con tiroteos y persecuciones. La primera batalla de la temporada navideña decide quién se queda con las mejores salas, y los programadores responden antes que la crítica.", "ja": "同じ日に公開されるが方向は真逆だ。演技と情緒で見せる小規模なリアル志向と、銃撃とカーチェイスの香港犯罪劇。年末商戦の最初の衝突は、ゴールデンタイムの上映枠を誰が取るかを決める。番組編成の判断は、評論より早く答えを出す。"}}, {"idx": "03", "title": {"zh": "易烊千玺、鹿晗同日发歌，时代少年团七周年单曲上线", "en": "Jackson Yee and Luhan release singles on the same day as TNT marks seven years", "es": "Jackson Yee y Luhan publican sencillos el mismo día en que TNT cumple siete años", "ja": "易烊千璽と鹿晗が同日リリース、時代少年団は 7 周年曲を公開"}, "body": {"zh": "11 月 25 日，易烊千玺新单曲《Namuuhan》上线，鹿晗的新歌也选在同一天发布，粉丝称「双厨狂喜」。同日，时代少年团七周年单曲《宿命之外》舞蹈版于中午 12 时放出，成员丁程鑫在直播中透露新歌过几天就能听到。此外，《声生不息》舞台上刘耀文的《Love Love Love》在 QQ 音乐热力值破 1500 万，陈楚生《狂流》破 1000 万。", "en": "Jackson Yee released his single Namuuhan on 25 November, with Luhan putting out a new track the same day. TNT marked its seventh anniversary with a dance version of the single Beyond Fate at noon, and member Ding Chengxin said on a livestream that another song would follow within days. On the music show Sheng Sheng Bu Xi, Liu Yaowen's Love Love Love passed 15 million heat points on QQ Music and Chen Chusheng's Kuang Liu passed 10 million.", "es": "Jackson Yee publicó el 25 de noviembre su sencillo Namuuhan y Luhan lanzó otro tema ese mismo día. TNT celebró su séptimo aniversario con la versión de baile de Beyond Fate al mediodía, y su miembro Ding Chengxin adelantó en directo que habrá otra canción en días. En el programa Sheng Sheng Bu Xi, Love Love Love de Liu Yaowen superó 15 millones de puntos de popularidad en QQ Music y Kuang Liu de Chen Chusheng los 10 millones.", "ja": "11 月 25 日、易烊千璽の新曲「Namuuhan」が配信され、鹿晗も同日に新曲を発表した。時代少年団は 7 周年記念曲「宿命之外」のダンス版を正午に公開し、メンバーの丁程鑫はライブ配信で「数日中に新曲が聴ける」と明かした。音楽番組「声生不息」では劉耀文の「Love Love Love」が QQ 音楽の熱力値 1500 万を突破、陳楚生の「狂流」も 1000 万を超えた。"}, "why": {"zh": "同一天发歌，其实是两种完全不同的路径：一位靠影视与时尚积累的国民度做「安静发布」，一位靠粉丝运营做「节点引爆」。而时代少年团把七周年拆成单曲、舞蹈版、直播三步走，是把纪念日做成了一整周的运营日历。", "en": "Same-day releases reflect two different playbooks: one leans on national recognition built through film and fashion for a quiet drop, the other on fandom operations for a timed detonation. TNT splits its anniversary into a single, a dance version and a livestream, turning one date into a week-long operating calendar.", "es": "Publicar el mismo día revela dos manuales distintos: uno se apoya en el reconocimiento general ganado con cine y moda para un lanzamiento silencioso; el otro, en la operación de fandom para una detonación programada. TNT divide su aniversario en sencillo, versión de baile y directo, convirtiendo una fecha en un calendario de una semana.", "ja": "同じ日のリリースでも手法は正反対だ。一方は映画やファッションで築いた知名度による「静かな投下」、他方はファンダム運営による「タイミング起爆」。時代少年団は 7 周年を楽曲、ダンス版、配信の 3 段階に分け、1 日を 1 週間の運営カレンダーに変えた。"}}, {"idx": "04", "title": {"zh": "王丹妮结婚三周年官宣怀孕：「3+1=4」", "en": "Louise Wong announces pregnancy on her third wedding anniversary", "es": "Louise Wong anuncia su embarazo en su tercer aniversario de boda", "ja": "王丹妮、結婚 3 周年に妊娠を発表「3+1=4」"}, "body": {"zh": "11 月 25 日，中国香港演员王丹妮在社交平台晒出与丈夫罗孝勇同举超声波照片的合影，官宣怀孕，配文「3+1=4」。当天正是两人澳洲婚礼三周年纪念日。王丹妮早年未婚生女、独自抚养，此次是两人婚后的第一个宝宝；罗孝勇同日举行毕业典礼，三件喜事撞在一起。", "en": "Hong Kong, China actress Louise Wong announced her pregnancy on 25 November, posting a photo of herself and husband Sheldon Lo holding an ultrasound scan with the caption 3+1=4. The date was the third anniversary of their Australian wedding. Wong raised a daughter on her own earlier in life; this is the couple's first child together, and Lo's graduation ceremony fell on the same day.", "es": "La actriz de Hong Kong, China, Louise Wong anunció su embarazo el 25 de noviembre con una foto junto a su marido Sheldon Lo sosteniendo una ecografía y el texto 3+1=4. Era el tercer aniversario de su boda en Australia. Wong crió sola a una hija años atrás; este es el primer hijo de la pareja, y la graduación de Lo coincidió el mismo día.", "ja": "中国香港の女優、王丹妮が 11 月 25 日、夫の羅孝勇と超音波写真を掲げた写真を公開し、妊娠を発表した。投稿は「3+1=4」。この日はオーストラリアで挙式して 3 周年の記念日だった。王丹妮は以前に未婚で娘を出産し一人で育てており、今回は夫妻にとって初めての子ども。夫の卒業式も同じ日に重なった。"}, "why": {"zh": "这条没什么争议，却稳稳占住娱乐版面——因为它把三件事叠在一天：结婚纪念日、毕业典礼、怀孕。港娱近年很少有这样「全是好消息」的发布，读者需要的也正是这种不需要判断、只需要祝福的新闻。", "en": "There is no controversy here, yet it holds the entertainment pages because three things stack on one day: a wedding anniversary, a graduation and a pregnancy. Hong Kong entertainment has produced few announcements lately that are simply good news, and readers want stories that require no judgement, only congratulations.", "es": "No hay polémica y aun así ocupa las páginas de entretenimiento, porque tres cosas se acumulan en un día: aniversario de boda, graduación y embarazo. El espectáculo hongkonés ha dado pocas noticias que sean solo buenas, y el lector quiere historias que no pidan juicio, solo felicitaciones.", "ja": "論争はないのに芸能面をしっかり占めるのは、結婚記念日、卒業式、妊娠という三つが同じ日に重なったからだ。香港芸能では近年、ただ良いだけのニュースが少ない。読者が求めているのは、判断を求めず祝福だけを求められる話題である。"}}, {"idx": "05", "title": {"zh": "朱珠演斑秃富太，回应「也就挺秃然的」", "en": "Zhu Zhu plays a wealthy wife with alopecia and jokes it was rather sudden", "es": "Zhu Zhu interpreta a una rica con alopecia y bromea sobre lo repentino", "ja": "朱珠、円形脱毛の富裕層夫人役に「まさに突然」"}, "body": {"zh": "「朱珠演了个斑秃富太」登上热搜。她在电视剧《此刻的生活》中饰演豪门太太赵雅心，因婚姻中的谎言长期处于高压状态，导致斑秃，出门靠假发片遮掩。预告片中假发片滑落的那一帧被观众称为最扎心的镜头。朱珠回应称「也就挺秃然的」，用谐音梗化解了话题的沉重感。", "en": "Zhu Zhu trended for playing a wealthy wife with alopecia in the drama Life at This Moment. Her character Zhao Yaxin develops patchy hair loss after years of high stress from lies in her marriage, and covers it with hairpieces when she goes out. A frame in the trailer where a hairpiece slips has been called the most piercing shot. Zhu responded with a pun meaning it was rather sudden, defusing the weight of the topic.", "es": "Zhu Zhu fue tendencia por interpretar a una esposa adinerada con alopecia en el drama Life at This Moment. Su personaje, Zhao Yaxin, sufre pérdida de cabello tras años de estrés por las mentiras de su matrimonio y lo disimula con postizos. Un fotograma del avance en el que se desliza un postizo ha sido señalado como el más punzante. Zhu respondió con un juego de palabras sobre lo repentino del asunto.", "ja": "「朱珠が円形脱毛の富裕層夫人を演じた」が話題に。ドラマ「此刻的生活」で、結婚の嘘による長年の緊張から円形脱毛症になった趙雅心を演じ、外出時はウィッグで隠している。予告編でウィッグがずれ落ちる一瞬が最も胸を刺すと評された。朱珠は「まさに突然」とかけた言葉で返し、話題の重さを和らげた。"}, "why": {"zh": "国产剧里的「富太」通常是光鲜符号，这次把镜头对准了假发片滑落的一瞬间——外表体面和身体失控同时出现，才有说服力。朱珠用一句谐音梗接住话题，也说明演员对这类角色的处理已经从「演苦」转向「演撑」。", "en": "The wealthy wife in Chinese dramas is usually a glossy symbol; here the camera settles on the second a hairpiece slips, where polished appearance and a body out of control appear at once, and that is what persuades. Zhu's pun catches the topic and signals a shift from performing suffering to performing endurance.", "es": "La esposa rica del drama chino suele ser un símbolo reluciente; aquí la cámara se detiene en el instante en que se cae un postizo, donde la apariencia pulida y un cuerpo fuera de control coinciden, y eso convence. El juego de palabras de Zhu recoge el tema y marca el paso de interpretar el sufrimiento a interpretar la resistencia.", "ja": "中国ドラマの「富裕層の妻」はたいてい華やかな記号だが、今回はウィッグがずれる一瞬にカメラを寄せた。見た目の体裁と体の制御不能が同時に現れるから説得力が出る。朱珠が一言の洒落で受け止めたことは、苦しみを演じる段階から「持ちこたえる」を演じる段階への移行も示している。"}}]}], "risk": {"zh": "风险提示：本简报仅作信息汇总，其中涉及的数据不构成任何投资建议。", "en": "Disclaimer: this briefing is a summary of information only; the data cited does not constitute investment advice.", "es": "Aviso: este boletín es solo un resumen informativo; los datos citados no constituyen asesoramiento de inversión.", "ja": "免責事項：本ブリーフィングは情報の要約であり、記載のデータは投資助言を構成するものではありません。"}}/*__END__*/;

  var LANGS = ["zh", "en", "es", "ja"];

  // 小国旗（内联 SVG，避免外部图标依赖与 emoji 平台差异）
  function flag(lang) {
    if (lang === "zh") return '<svg class="fl" viewBox="0 0 30 20" aria-hidden="true"><rect width="30" height="20" fill="#de2910"/><g fill="#ffde00"><circle cx="5" cy="4" r="2.2"/><circle cx="9" cy="2.4" r="0.8"/><circle cx="10" cy="4" r="0.8"/><circle cx="9" cy="5.6" r="0.8"/><circle cx="7" cy="6.6" r="0.8"/></g></svg>';
    if (lang === "en") return '<svg class="fl" viewBox="0 0 30 20" aria-hidden="true"><rect width="30" height="20" fill="#012169"/><path d="M0 0L30 20M30 0L0 20" stroke="#fff" stroke-width="4"/><path d="M0 0L30 20M30 0L0 20" stroke="#c8102e" stroke-width="2"/><rect x="13" width="4" height="20" fill="#fff"/><rect y="8" width="30" height="4" fill="#fff"/><rect x="14" width="2" height="20" fill="#c8102e"/><rect y="9" width="30" height="2" fill="#c8102e"/></svg>';
    if (lang === "es") return '<svg class="fl" viewBox="0 0 30 20" aria-hidden="true"><rect width="30" height="20" fill="#aa151b"/><rect y="5" width="30" height="10" fill="#f1bf00"/></svg>';

  }

  /* ===== 工具 ===== */
  function T(obj, lang) {
    if (obj == null) return "";
    if (typeof obj === "string") return obj;
    if (obj[lang] != null) return obj[lang];
    return obj.zh != null ? obj.zh : "";
  }
  function pad(n) { return n < 10 ? "0" + n : "" + n; }
  function bing(q) { return "https://www.bing.com/search?q=" + encodeURIComponent(q); }
  function fmtDate(d, lang) {
    var y = d.getFullYear(), m = d.getMonth() + 1, day = d.getDate();
    if (lang === "zh") return y + "." + pad(m) + "." + pad(day);
    if (lang === "ja") return y + "年" + m + "月" + day + "日";
    if (lang === "es") return day + " " + ["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"][m-1] + " " + y;
    return ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][m-1] + " " + day + ", " + y;
  }
  function esc(s) {
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }
  function titleHtml(titleObj, hlObj, lang) {
    var title = T(titleObj, lang);
    var hl = T(hlObj, lang);
    var inner = esc(title);
    if (hl && title.indexOf(hl) >= 0) {
      var i = title.indexOf(hl);
      inner = esc(title.slice(0, i)) + '<span class="hl">' + esc(hl) + "</span>" + esc(title.slice(i + hl.length));
    }
    return '<a class="lk" href="' + bing(title) + '" target="_blank" rel="noopener">' + inner + "</a>";
  }

  /* ===== 语言检测：localStorage > 浏览器语言 > 系统时区 > 中文 ===== */
  function detectLang() {
    try { var s = localStorage.getItem("timab_lang"); if (s && LANGS.indexOf(s) >= 0) return s; } catch (e) {}
    var nav = (navigator.language || "").toLowerCase();
    if (/^zh/.test(nav)) return "zh";
    if (/^ja/.test(nav)) return "ja";
    if (/^es/.test(nav)) return "es";
    if (/^en/.test(nav)) return "en";
    var tz = "";
    try { tz = Intl.DateTimeFormat().resolvedOptions().timeZone || ""; } catch (e) {}
    if (/^Asia\/Tokyo/.test(tz)) return "ja";
    if (/Europe\/Madrid|America\/(Mexico_City|Bogota|Lima|Santiago|Caracas|Guatemala|La_Paz|San_Jose|Panama|Asuncion|Montevideo|Havana|El_Salvador|Managua|Tegucigalpa|Costa_Rica|San_Salvador)|America\/Argentina\//.test(tz)) return "es";
    if (/^(Europe|America|Australia)\//.test(tz)) return "en";
    return "zh";
  }

  var curLang = "zh";

  /* ===== 渲染 ===== */
  function renderChrome(lang) {
    var i18n = I18N[lang];
    document.documentElement.lang = LANG_HTML[lang];
    // 报头信息行

    // 大日期
    var md = document.getElementById("mastDate");
    if (md) {
      var d = new Date(BRIEFING.date + "T00:00:00");
      md.innerHTML = fmtDate(d, lang) + "<small>" + esc(i18n.dateSub) + "</small>";
    }
    // 文档标题
    var siteName = (lang === "zh") ? "提马早报" : "TIMAB DAILY";
    document.title = siteName + " · " + fmtDate(new Date(BRIEFING.date + "T00:00:00"), lang);
    // 导航签

    var cf = document.getElementById("calFoot"); if (cf) cf.textContent = i18n.calFoot;

  }

  function renderContent(lang) {
    var i18n = I18N[lang];
    var html = "";
    // 精选
    var sp = BRIEFING.spotlight;
    html += '<section class="spotlight" id="pick">'
      + '<div class="badge"><i></i>' + esc(T(sp.badge, lang)) + "</div>"
      + "<h2>" + titleHtml(sp.title, sp.hl, lang) + "</h2>"
      + '<div class="body">' + esc(T(sp.body, lang)) + "</div>"
      + '<div class="why"><b>' + esc(i18n.why) + "</b>" + esc(T(sp.why, lang)) + "</div>"
      + "</section>";
    // 分类
    html += '<div class="grid">';
    BRIEFING.sections.forEach(function (sec) {
      html += '<section class="card" id="' + sec.key + '" style="--ac:' + sec.color + "; --ac-deep:" + sec.deep + ';">'
        + '<div class="sec-head"><span class="sec-num">' + sec.num + "</span>"
        + "<h3>" + esc(T(sec.name, lang)) + "</h3>"
        + '<span class="en">' + sec.key.toUpperCase() + "</span></div>";
      (sec.items || []).forEach(function (it) {
        html += '<div class="item">';
        html += '<div class="t"><span class="idx">' + it.idx + "</span>";
        if (it.tag) html += '<span class="tag">' + esc(it.tag[lang] != null ? it.tag[lang] : i18n.tag) + "</span>";
        html += titleHtml(it.title, it.hl, lang) + "</div>";
        html += '<div class="d">' + esc(T(it.body, lang)) + "</div>";
        html += '<div class="why"><b>' + esc(i18n.why) + "</b>" + esc(T(it.why, lang)) + "</div>";
        html += "</div>";
      });
      html += "</section>";
    });
    html += "</div>";
    var content = document.getElementById("content");
    if (content) content.innerHTML = html;
    // 页脚
    var risk = document.getElementById("risk");
    if (risk) risk.textContent = T(BRIEFING.risk, lang);
  }

  function setLang(lang) {
    if (LANGS.indexOf(lang) < 0) lang = "zh";
    curLang = lang;
    langOpen = false;
    try { localStorage.setItem("timab_lang", lang); } catch (e) {}
    renderChrome(lang);
    renderContent(lang);
  }

  /* ===== 往期日历（保留原逻辑，文案随语言） ===== */
  function initCalendar() {
    var btn = document.getElementById("calBtn");
    var pop = document.getElementById("calPop");
    var grid = document.getElementById("calGrid");
    var title = document.getElementById("calTitle");
    if (!btn || !pop || !grid || !title) return;

    var parts = BRIEFING.date.split("-");
    var todayKey = parts[0].slice(2) + parts[1] + parts[2];
    var cur = { y: +parts[0], m: +parts[1] };
    var has = {};
    for (var i = 0; i < ARCHIVE_DATES.length; i++) { has[ARCHIVE_DATES[i]] = 1; }
    var HIST_BASE = /\/history\//.test(location.pathname) ? "./" : "history/";

    function ckey(y, m, d) { return String(y).slice(2) + pad(m) + pad(d); }

    function render() {
      var i18n = I18N[curLang];
      title.textContent = i18n.calTitle(cur.y, cur.m);
      grid.innerHTML = "";
      var start = new Date(cur.y, cur.m - 1, 1).getDay();
      var days = new Date(cur.y, cur.m, 0).getDate();
      for (var b = 0; b < start; b++) {
        var blank = document.createElement("span");
        blank.className = "cal-cell is-empty"; grid.appendChild(blank);
      }
      for (var d = 1; d <= days; d++) {
        var k = ckey(cur.y, cur.m, d);
        var cell = document.createElement("span");
        cell.className = "cal-cell" + (has[k] ? " has" : "") + (k === todayKey ? " is-today" : "");
        cell.textContent = d;
        if (has[k]) {
          cell.setAttribute("role", "link"); cell.setAttribute("tabindex", "0");
          cell.title = cur.y + "-" + pad(cur.m) + "-" + pad(d) + " 存档";
          (function (target) {
            var go = function () { window.open(HIST_BASE + target + ".html", "_blank", "noopener"); };
            cell.addEventListener("click", go);
            cell.addEventListener("keydown", function (e) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); go(); } });
          })(k);
        }
        grid.appendChild(cell);
      }
    }
    function toggle(open) {
      pop.hidden = !open;
      btn.setAttribute("aria-expanded", open ? "true" : "false");
      if (open) render();
    }
    btn.addEventListener("click", function (e) { e.stopPropagation(); toggle(pop.hidden); });
    document.getElementById("calPrev").addEventListener("click", function () { cur.m--; if (cur.m < 1) { cur.m = 12; cur.y--; } render(); });
    document.getElementById("calNext").addEventListener("click", function () { cur.m++; if (cur.m > 12) { cur.m = 1; cur.y++; } render(); });
    document.addEventListener("click", function (e) { if (!pop.hidden && !pop.contains(e.target)) toggle(false); });
    document.addEventListener("keydown", function (e) { if (e.key === "Escape" && !pop.hidden) toggle(false); });
  }

  /* ===== 启动 ===== */
  function boot() {
    curLang = detectLang();
    renderChrome(curLang);
    renderContent(curLang);
    initCalendar();
    // 关闭语言下拉：点击外部 / Esc
    document.addEventListener("click", function (e) {
      var ls = document.getElementById("langSwitch");
      if (ls && langOpen && !ls.contains(e.target)) {
        langOpen = false;
        ls.classList.remove("open");
        var t = document.getElementById("langTrigger");
        if (t) t.setAttribute("aria-expanded", "false");
      }
    });
    document.addEventListener("keydown", function (e) {
      if (e.key === "Escape" && langOpen) {
        langOpen = false;
        var ls = document.getElementById("langSwitch");
        if (ls) ls.classList.remove("open");
        var t = document.getElementById("langTrigger");
        if (t) t.setAttribute("aria-expanded", "false");
      }
    });
  }
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", boot);
  } else { boot(); }
})();
</script>

</html>
