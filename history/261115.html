ャンソウルを取ったものの、オブジェクト周りの三大戦闘をすべて落とし、0 対 3、0 対 4 の交換でバロンも二度奪われて先取された。第 2 試合は 53 分の長期戦。Xun のナフィーリがトップでファーストブラッドを取り、knight のカシオペアが Chovy のオリアナを二度捕まえて同点とした。第 3 試合は Viper のタリヤがボットで先制、中盤に GEN が川の戦いで 1 対 4 とリードしたが、BLG がボットの 1 対 3 とジャングルでの二連続キルで返し、Bin のジャックスがドラゴン戦で背後から仕掛けて 0 対 4、ケミテックソウルにつなげ、最後は中央 0 対 3 で押し切った。BLG が 2 対 1 とし王手をかけた。執筆時点で第 4 試合は進行中。"}, "why": {"zh": "首局的剧本很刺眼：拿龙、拿龙魂、拿远古龙，却三次团战全输——这是「资源换不来胜势」的典型。第二三局的转折都在同一件事上：Bin 与 Xun 把开团时机提前了，把 GEN 最擅长的「等你先失误」变成「我先动手」。如果真的走到最后一步，BLG 会成为 S 赛史上第一支单届连斩四支 LCK 队伍登顶的战队；如果没走到，前三局的教训也已经写清楚了。", "en": "The first game was telling: dragons, soul, elder — and three lost fights. That is the classic pattern of objectives without advantage. Games two and three turned on the same adjustment: Bin and Xun moved their engage timings earlier, converting GEN's favourite wait-for-a-mistake posture into having to react first. If BLG finish the job they become the first team ever to win Worlds by beating four LCK sides in one tournament. If they do not, the first three games have already written the lesson down.", "es": "El primer mapa fue elocuente: dragones, alma, anciano, y tres peleas perdidas. Es el patrón clásico de objetivos sin ventaja. Los mapas dos y tres giraron en el mismo ajuste: Bin y Xun adelantaron los tiempos de iniciación y convirtieron la postura favorita de GEN —esperar el error— en tener que reaccionar primero. Si BLG terminan el trabajo serán el primer equipo de la historia en ganar un Mundial venciendo a cuatro equipos de la LCK en el mismo torneo. Si no, los tres primeros mapas ya dejaron la lección escrita.", "ja": "第 1 試合は象徴的だった。ドラゴンもソウルもエルダーも取りながら、三つの集団戦をすべて落とした。「オブジェクトは勝勢に換算されない」典型例である。第 2、3 試合の転機は同じ調整にあった。Bin と Xun が仕掛けのタイミングを早め、GEN の得意な「相手のミス待ち」を「先に動かされる」状況に変えた。このまま行けば BLG は史上初めて 1 大会で LCK 4 チームを倒して頂点に立つ。届かなければ、最初の 3 試合がすでに教訓を書き残している。"}}, {"idx": "02", "tag": {"zh": "进展"}, "title": {"zh": "国足 2:0 马来西亚：20 分钟解决战斗，三连败到此为止", "en": "China beat Malaysia 2-0 inside 20 minutes to end a three-match losing run", "es": "China gana 2-0 a Malasia en 20 minutos y corta una racha de tres derrotas", "ja": "中国代表、前半 20 分で 2 点を奪いマレーシアに 2 対 0、3 連敗を止める"}, "body": {"zh": "11 月 14 日 20:00，2026CFA 中国之队·肇庆国际足球邀请赛在肇庆新区体育中心开赛，中国男足 2:0 战胜马来西亚队，终结此前热身赛三连败与三场零进球的尴尬。开场第 2 分钟张玉宁禁区内倒地、主裁先判点球，VAR 介入后取消；第 10 分钟林良铭右路传中，王钰栋冲抢头球破门，这是他在成年国家队的首个运动战进球；第 19 分钟王上源中线斜长传，张玉宁反越位单刀外脚背巧射入网。第 65 分钟，37 岁的吴曦替补登场，时隔 1027 天再披国家队战袍并从张玉宁手中接过队长袖标。第 77 分钟马来西亚蒂尔尼破门因犯规在先被 VAR 取消，第 86 分钟门将李昊两连扑，补时阶段蒂尔尼两黄变一红被罚下。全场超 1.5 万名球迷入场。取胜后国足获 3.69 个积分、世界排名升至第 95 位，马来西亚第 133 位。11 月 17 日 20:00，国足将对阵首战 3:1 击败也门的巴林队（世界第 97 位）。", "en": "China beat Malaysia 2-0 at Zhaoqing New Area Sports Centre on the evening of 14 November in the CFA Team China Zhaoqing International Friendly, ending a run of three friendlies without a win or a goal. Zhang Yuning went down in the box after two minutes and was initially awarded a penalty that VAR overturned. On 10 minutes Lin Liangming crossed from the right and Wang Yudong headed in his first open-play goal for the senior side; on 19 minutes Wang Shangyuan's long diagonal released Zhang Yuning, who beat the onrushing keeper with the outside of his boot. Wu Xi, 37, came on in the 65th minute for his first cap in 1,027 days and took the armband. Malaysia had a 77th-minute goal by Tierney ruled out for a foul in the build-up, keeper Li Hao made a double save on 86 minutes and Tierney was sent off for a second booking in stoppage time. More than 15,000 fans attended. The win earned 3.69 ranking points and lifted China to 95th; Malaysia are 133rd. China face Bahrain, 97th and 3-1 winners over Yemen, on 17 November.", "es": "China venció 2-0 a Malasia el 14 de noviembre en el Centro Deportivo de Zhaoqing en el torneo amistoso de la CFA, poniendo fin a tres partidos sin ganar ni marcar. Zhang Yuning cayó en el área a los dos minutos y el árbitro señaló penalti que el VAR anuló. Al minuto 10, centro de Lin Liangming desde la derecha y cabezazo de Wang Yudong, su primer gol en juego abierto con la absoluta; al 19, un pase largo en diagonal de Wang Shangyuan habilitó a Zhang Yuning, que batió al portero con el exterior. Wu Xi, de 37 años, entró al minuto 65 para jugar su primer partido internacional en 1.027 días y tomó el brazalete. Un gol de Tierney al 77 fue anulado por falta previa, el portero Li Hao hizo una doble parada al 86 y Tierney vio la segunda amarilla en el descuento. Más de 15.000 espectadores. La victoria dio 3,69 puntos y colocó a China 95.ª; Malasia es 133.ª. El 17 China juega con Baréin, 97.ª y ganadora 3-1 a Yemen.", "ja": "11 月 14 日 20 時、肇慶新区体育中心で行われた CFA 中国代表・肇慶国際親善試合で、中国はマレーシアに 2 対 0 で勝利し、3 連敗と 3 試合連続無得点を止めた。開始 2 分に張玉寧がエリア内で倒れて PK の判定が出たが、VAR で取り消された。10 分、林良銘の右からのクロスに王鈺棟が飛び込んで先制、自身の A 代表初の流れの中での得点。19 分には王上源の長い斜めのパスから張玉寧が裏抜けし、GK の前に外脚背で流し込んだ。65 分、37 歳の呉曦が 1027 日ぶりに代表に復帰し、張玉寧から腕章を受け取った。77 分のマレーシアの得点は VAR で取り消し、86 分に GK 李昊が連続セーブ、終了間際にティアニーが 2 枚目の警告で退場。観客は 1 万 5000 人超。勝利で 3.69 ポイントを獲得し、中国は 95 位、マレーシアは 133 位。17 日 20 時に対戦するバーレーンは 97 位で、初戦はイエメンに 3 対 1 で勝利している。"}, "why": {"zh": "上半场的高效和下半场的被动是同一支球队。王钰栋与张玉宁解决的是「能不能进球」，下半场被压制暴露的是「能不能打满 90 分钟」——控球与射门次数其实都落后于对手。邵佳一赛后那句「没有任何可以过于乐观的资本」比 2:0 更准确，对手缺了近 20 人。17 日对巴林才是真正的尺子，两队排名只差两位。", "en": "The first half and the second belong to the same team. Wang and Zhang answered whether China can score; the second-half retreat exposed whether they can sustain it for 90 minutes — possession and shot counts both went Malaysia's way. Shao Jiayi's line that there is no reason for optimism is more accurate than the scoreline, given the opponent was missing nearly 20 players. Bahrain on 17 November, two ranking places away, is the real test.", "es": "La primera parte y la segunda son del mismo equipo. Wang y Zhang respondieron si China puede marcar; el repliegue tras el descanso expuso si puede sostenerlo 90 minutos: posesión y remates favorecieron a Malasia. La frase de Shao Jiayi de que no hay motivos para el optimismo es más exacta que el 2-0, con el rival sin casi 20 jugadores. Baréin, a dos puestos de distancia, es la prueba real.", "ja": "前半と後半は同じチームの姿だ。王と張が答えたのは「点が取れるか」であり、後半の押され方は「90 分戦えるか」を露呈した。支配率もシュート数も相手を下回っている。試合後に邵佳一監督が「楽観できる材料はない」と語ったのは 2 対 0 より正確で、相手は 20 人近くを欠いていた。17 日のバーレーン戦（順位差は 2 つ）が本当の物差しになる。"}}, {"idx": "03", "tag": {"zh": "进展"}, "title": {"zh": "宁忠岩北京站双冠：1000 米破场地纪录，1500 米再赢 1.18 秒", "en": "Ning Zhongyan doubles up in Beijing: a 1,000m track record and a 1.18-second win over 1,500m", "es": "Ning Zhongyan logra un doblete en Pekín: récord de pista en 1.000 y victoria por 1,18 segundos en 1.500", "ja": "寧忠岩が北京で 2 冠、1000 m でリンク記録、1500 m は 1.18 秒差"}, "body": {"zh": "2026—2027 赛季国际滑联速度滑冰世界杯北京站在国家速滑馆「冰丝带」进入第二个比赛日，中国队单日入账 2 金 2 铜。男子 1500 米，宁忠岩在第八组内道与挪威选手孔斯海于格同场，全程领先，以 1 分 43 秒 64 夺冠、领先第二名 1.18 秒，距 1 分 43 秒 21 的场地纪录仅差 0.43 秒；赛后他说赛前预期是 1 分 44 秒多，对成绩「很惊喜」，唯一瑕疵是没破场地纪录。前一个比赛日，他已以 1 分 07 秒 43 打破斯托尔茨保持的 1000 米场地纪录夺金。男子 500 米，廉子文以 34 秒 64 夺得个人世界杯首金，荷兰选手韦斯滕布鲁克 34 秒 71 获银，高亭宇 34 秒 80 摘铜、前 100 米分段 9 秒 48，自评「恢复到了 60%」。女子 1500 米，韩梅获铜牌。11 月 15 日为本站最后一个比赛日，将产生男、女 500 米、团体追逐、集体出发共 6 枚金牌。", "en": "The Beijing leg of the 2026-27 ISU Speed Skating World Cup moved into its second day at the Ice Ribbon, with China taking two golds and two bronzes. In the men's 1,500m Ning Zhongyan, drawn inside in the eighth pair against Norway's Peder Kongshaug, led throughout and won in 1:43.64, 1.18 seconds clear, 0.43 off the 1:43.21 track record. He said afterwards he had expected something in the 1:44s and was pleasantly surprised, his only regret missing the record. A day earlier he had won the 1,000m in 1:07.43, breaking Jordan Stolz's track record. In the men's 500m Lian Ziwen took his first World Cup gold in 34.64, with the Netherlands' Westerbrink second in 34.71 and Gao Tingyu third in 34.80, his first 100m split 9.48 and his own assessment being that he is back to about 60 percent. Han Mei took bronze in the women's 1,500m. The final day, 15 November, decides six titles including the men's and women's 500m, team pursuit and mass start.", "es": "La prueba de Pekín de la Copa del Mundo de patinaje de velocidad 2026-27 afrontó su segunda jornada en el Ice Ribbon con dos oros y dos bronces para China. En los 1.500 masculinos Ning Zhongyan, por dentro en la octava pareja ante el noruego Peder Kongshaug, lideró de principio a fin y ganó con 1:43,64, 1,18 segundos de ventaja y a 0,43 del récord de pista de 1:43,21. Dijo que esperaba un 1:44 alto y que el resultado le sorprendió gratamente, con la única espina de no batir el récord. Un día antes había ganado los 1.000 con 1:07,43, batiendo el récord de la pista de Jordan Stolz. En los 500, Lian Ziwen logró su primer oro de Copa del Mundo con 34,64; el neerlandés Westerbrink fue segundo con 34,71 y Gao Tingyu tercero con 34,80, con 9,48 en los primeros 100 metros y su propia evaluación de estar al 60 por ciento. Han Mei fue bronce en los 1.500 femeninos. La jornada final, el 15 de noviembre, decide seis títulos.", "ja": "2026〜27 シーズンの ISU スピードスケート・ワールドカップ北京大会は 2 日目を迎え、中国は金 2、銅 2 を獲得した。男子 1500 m では寧忠岩が第 8 組のインコースでノルウェーのコングスハウグと同走し、終始先行して 1 分 43 秒 64 で優勝。2 位に 1.18 秒差、リンク記録 1 分 43 秒 21 まで 0.43 秒だった。本人は 1 分 44 秒台を想定しており「驚いている」、唯一の悔いは記録更新を逃したことだと語った。前日には 1000 m を 1 分 07 秒 43 で制し、ストルツのリンク記録を更新している。男子 500 m は廉子文が 34 秒 64 でワールドカップ初優勝。オランダのウェステンブルクが 34 秒 71 で 2 位、高亭宇が 34 秒 80 で 3 位、最初の 100 m は 9 秒 48 で「60 パーセントまで回復」と自己評価した。女子 1500 m は韓梅が銅メダル。最終日となる 15 日は男女 500 m、団体追い抜き、マススタートなど 6 種目の金メダルが決まる。"}, "why": {"zh": "1000 米不是他的主项，却在非主项上破了场地纪录——这说明夏训攒下的速度储备是真的。1500 米「赛前想 1 分 44 秒多」却滑出 1 分 43 秒 64，是状态超预期的信号。更值得记的是廉子文：前一天拿 1000 米铜牌是生涯首枚世界杯奖牌，第二天就把首金也拿了。真正的考验在明年 2 月的冰丝带世锦赛，斯托尔茨会回来。", "en": "The 1,000m is not his main event, and he broke the track record in it, which says the speed built over the summer is real. Expecting a low 1:44 and delivering 1:43.64 is a sign of form ahead of plan. Lian Ziwen deserves the note too: his first World Cup medal came a day before his first World Cup gold. The real test is the World Championships back at the Ice Ribbon in February, when Stolz returns.", "es": "Los 1.000 no son su prueba principal y aun así batió el récord de la pista: la velocidad acumulada en verano es real. Esperar un 1:44 alto y firmar 1:43,64 indica una forma por delante de lo previsto. Lian Ziwen merece mención: su primera medalla de Copa del Mundo llegó un día antes de su primer oro. La prueba de verdad será el Mundial en el Ice Ribbon en febrero, con Stolz de vuelta.", "ja": "1000 m は主種目ではないのにリンク記録を更新した。夏の練習で積んだスピードは本物だ。1 分 44 秒台を想定して 1 分 43 秒 64 を出したのは、状態が計画を上回っている証拠である。廉子文にも触れたい。ワールドカップ初メダルが前日、初優勝が翌日だった。本当の試練は 2 月、同じリンクでの世界選手権で、ストルツが戻ってくる。"}}, {"idx": "04", "title": {"zh": "冠中冠决赛变成 90 后的内战：威尔逊 6-4 送走墨菲", "en": "Champion of Champions final is an all-1990s affair as Wilson beats Murphy 6-4", "es": "La final del Champion of Champions será entre dos jugadores de los 90 tras el 6-4 de Wilson a Murphy", "ja": "チャンピオン・オブ・チャンピオンズ決勝は 90 年代生まれの対決に、ウィルソンがマーフィーを 6 対 4"}, "body": {"zh": "11 月 15 日凌晨，2026 年斯诺克冠中冠第二场半决赛在莱斯特马蒂奥利竞技场结束，凯伦·威尔逊 6-4 淘汰肖恩·墨菲，晋级决赛。威尔逊全场打出两杆破百（138、110）和三杆 50+（91、75、92），墨菲打出三杆 50+（82、58、83）。首局威尔逊单杆 138 零封，连下三局以 5-1 拿到赛点；墨菲连救三个赛点追至 4-5，第十局威尔逊单杆 110 一杆制胜。另一场半决赛，克里斯·韦克林 6-2 淘汰世界第三尼尔·罗伯逊，在 2-2 后连下四局，罗伯逊最后三局总共只得到 9 分。此前墨菲在小组赛连赢 10 局、一局未失，先后 4-0 横扫奥沙利文、6-0 横扫中国选手常冰玉。决赛为 19 局 10 胜，11 月 15 日晚间开打，由威尔逊对韦克林——这是冠中冠历史上首次由两位 90 后选手争冠，也必将产生首位 90 后赛会冠军。中国选手吴宜泽、常冰玉、赵心童已全部出局。", "en": "The second semi-final of the 2026 Champion of Champions ended in the early hours of 15 November at Leicester's Mattioli Arena, with Kyren Wilson beating Shaun Murphy 6-4. Wilson made centuries of 138 and 110 plus breaks of 91, 75 and 92; Murphy had 82, 58 and 83. Wilson opened with a 138 clearance, went 5-1 up and, after Murphy saved three match points to close to 4-5, sealed it with a 110 in the tenth. In the other semi-final Chris Wakelin beat world number three Neil Robertson 6-2, winning four frames in a row from 2-2 while Robertson scored just nine points across the last three. Murphy had earlier won ten straight frames without reply in the group stage, 4-0 over Ronnie O'Sullivan and 6-0 over China's Chang Bingyu. The final, best of 19, starts on the evening of 15 November between Wilson and Wakelin — the first all-1990s final in the event's history, and certain to produce its first champion born in that decade. China's Wu Yize, Chang Bingyu and Zhao Xintong are all out.", "es": "La segunda semifinal del Champion of Champions 2026 terminó en la madrugada del 15 de noviembre en el Mattioli Arena de Leicester con Kyren Wilson superando a Shaun Murphy por 6-4. Wilson firmó centenas de 138 y 110 y series de 91, 75 y 92; Murphy logró 82, 58 y 83. Wilson abrió con una tacada de 138, se puso 5-1 y, tras tres bolas de partido salvadas por Murphy que acercaron el 4-5, cerró con 110 en la décima. En la otra semifinal Chris Wakelin venció 6-2 al número tres del mundo, Neil Robertson, con cuatro frames seguidos desde el 2-2 mientras Robertson sumaba solo nueve puntos en los tres últimos. Murphy había ganado antes diez frames consecutivos sin respuesta en la fase de grupos: 4-0 a Ronnie O'Sullivan y 6-0 al chino Chang Bingyu. La final, al mejor de 19, comienza la noche del 15 entre Wilson y Wakelin: la primera final entre dos jugadores nacidos en los noventa y con un campeón garantizado de esa generación. Los chinos Wu Yize, Chang Bingyu y Zhao Xintong quedaron eliminados.", "ja": "11 月 15 日未明、2026 年チャンピオン・オブ・チャンピオンズの第 2 準決勝がレスターのマッティオーリ・アリーナで行われ、カイレン・ウィルソンがショーン・マーフィーを 6 対 4 で破って決勝に進んだ。ウィルソンは 138 と 110 のセンチュリー、91、75、92 のブレイク。マーフィーは 82、58、83。ウィルソンが 138 で先取し 5 対 1 とリード、マーフィーが 3 つのマッチポイントを凌いで 4 対 5 に迫ったが、第 10 フレームで 110 を決めて押し切った。もう一つの準決勝ではクリス・ウェイクリンが世界 3 位のニール・ロバートソンに 6 対 2。2 対 2 から 4 フレーム連取し、ロバートソンは最後の 3 フレームで合計 9 点しか取れなかった。マーフィーはグループ戦で 10 フレーム連取无敗、ロニー・オサリバンに 4 対 0、中国の常冰玉に 6 対 0 だった。決勝は 19 フレーム 10 先取で 15 日の夜に開始。史上初めて 90 年代生まれ同士の決勝となり、同世代初の優勝者が決まる。中国の呉宜沢、常冰玉、趙心童はすべて敗退した。"}, "why": {"zh": "墨菲从「连赢 10 局、一局未失」到半决赛崩盘，正好说明冠中冠这种短局制比的是当天手感，不是统治力。威尔逊 13 天内连拿北爱尔兰公开赛与国锦赛，若再夺冠是本赛季罕见的背靠背三连冠；但半决赛 5-1 后连丢三局，体能已经露了口子。韦克林那边一路踩着霍金斯、塞尔比、罗伯逊上来，没有包袱——决赛未必是名气大的那个赢。", "en": "Murphy going from ten unanswered frames to a semi-final collapse shows what a short-format event rewards: the form of the day, not dominance. Wilson has won the Northern Ireland Open and the International Championship inside 13 days and is chasing a rare back-to-back treble, but dropping three frames from 5-1 suggests the tank is emptying. Wakelin has come through Hawkins, Selby and Robertson with nothing to lose — the final will not necessarily go to the bigger name.", "es": "Que Murphy pase de diez frames consecutivos a desmoronarse en la semifinal muestra qué premia un formato corto: la forma del día, no el dominio. Wilson ha ganado el Abierto de Irlanda del Norte y el Campeonato Internacional en 13 días y busca un triplete consecutivo poco habitual, pero ceder tres frames desde 5-1 indica depósito vaciándose. Wakelin llega tras superar a Hawkins, Selby y Robertson sin nada que perder: la final no irá necesariamente al nombre más grande.", "ja": "マーフィーが 10 フレーム連取から準決勝で崩れたことは、短い形式の大会が問うのが「その日の調子」であり「支配力」ではないことを示す。ウィルソンは 13 日間で北アイルランドオープンとインターナショナル選手権を制し、異例の 3 連勝を狙う。だが 5 対 1 から 3 フレーム連取を許したのはスタミナの陰りだ。ウェイクリンはホーキンス、セルビー、ロバートソンを倒してきて失うものがない。決勝は知名度の高い方が勝つとは限らない。"}}, {"idx": "05", "title": {"zh": "两次救赛点，郭涵煜第一次打年终总决赛就进了四强", "en": "Two match points saved: Guo Hanyu reaches the last four on her WTA Finals debut", "es": "Dos puntos de partido salvados: Guo Hanyu llega a semifinales en su debut en las Finales de la WTA", "ja": "マッチポイントを 2 度しのぎ、郭涵煜が WTA ファイナル初出場で 4 強"}, "body": {"zh": "WTA 年终总决赛（印第安维尔斯）双打一组末轮，3 号种子郭涵煜／穆拉德诺维奇以 6:7(4)、6:3、12:10 逆转 7 号种子张帅／梅尔滕斯，以 2 胜 1 负列小组第二晋级四强。小组赛首战对中国台北选手谢淑薇与奥斯塔彭科，她们在抢十 0-6、2-8 落后的绝境下连救 4 个赛点，以 12:10 完成逆转，那也是郭涵煜的年终赛首胜；次轮 6:7(5)、6:4、5-10 惜败头号种子达布劳斯基／史蒂芬妮。半决赛，郭涵煜／穆拉德诺维奇将对阵小组赛三战全胜的意大利组合埃拉尼／鲍里妮，晋级四强已收获 400 个积分、组合约 19 万美元奖金。女单方面，斯维托丽娜 6:3、3:6、6:1 战胜萨巴伦卡，半决赛对诺斯科娃；安德列娃 6:2、6:1 轻取施耐德，三战全胜出线，小组赛仅丢 11 局，追平 2007 年海宁的纪录。", "en": "In the last match of women's doubles group one at the WTA Finals in Indian Wells, third seeds Guo Hanyu and Kristina Mladenovic came from behind to beat seventh seeds Zhang Shuai and Elise Mertens 6-7(4), 6-3, 12-10, finishing second in the group at 2-1 and reaching the semi-finals. In their opener against Chinese Taipei's Hsieh Su-wei and Jelena Ostapenko they saved four match points from 0-6 and 2-8 down in the match tie-break to win 12-10, Guo's first victory at the Finals. They lost their second match 6-7(5), 6-4, 5-10 to top seeds Dabrowski and Stefani. In the semi-finals they face the unbeaten Italian pair Errani and Paolini; reaching the last four brings 400 points and about 190,000 dollars in prize money for the team. In singles, Elina Svitolina beat Aryna Sabalenka 6-3, 3-6, 6-1 to set up a semi-final with Linda Noskova, while Mirra Andreeva beat Diana Shnaider 6-2, 6-1 to go through unbeaten, dropping only 11 games in the group stage to equal Justine Henin's 2007 mark.", "es": "En el último partido del grupo uno de dobles femenino de las Finales de la WTA en Indian Wells, las terceras cabezas de serie Guo Hanyu y Kristina Mladenovic remontaron ante las séptimas, Zhang Shuai y Elise Mertens, por 6-7(4), 6-3 y 12-10, terminando segundas del grupo con 2-1 y metiéndose en semifinales. En su debut ante la taipeyana Hsieh Su-wei y Jelena Ostapenko salvaron cuatro puntos de partido desde 0-6 y 2-8 en el superdesempate para ganar 12-10, primera victoria de Guo en las Finales. Perdieron el segundo partido 6-7(5), 6-4 y 5-10 ante las primeras favoritas Dabrowski y Stefani. En semifinales se miden a las italianas Errani y Paolini, invictas. El pase da 400 puntos y unos 190.000 dólares de premio para la pareja. En individuales, Elina Svitolina batió a Aryna Sabalenka por 6-3, 3-6 y 6-1 y jugará ante Linda Noskova, mientras Mirra Andreeva superó a Diana Shnaider por 6-2 y 6-1 e invicta, cediendo solo 11 juegos en el grupo e igualando el registro de Justine Henin de 2007.", "ja": "WTA ファイナル（インディアンウェルズ）女子ダブルス第 1 グループ最終戦で、第 3 シードの郭涵煜／ムラデノビッチが第 7 シードの張帥／メルテンスを 6 対 7(4)、6 対 3、12 対 10 で逆転し、2 勝 1 敗の 2 位で 4 強入りした。初戦のチャイニーズタイペイの謝淑薇／オスタペンコ組戦ではタイブレークで 0 対 6、2 対 8 からマッチポイントを 4 つ凌いで 12 対 10 の逆転勝ち、郭にとってファイナル初勝利となった。第 2 戦は第 1 シードのダブロフスキー／ステファニに 6 対 7(5)、6 対 4、5 対 10 で敗れた。準決勝では 3 戦全勝のイタリア組エラーニ／パオリーニと対戦する。4 強進出で 400 ポイント、ペアで約 19 万ドルの賞金。シングルスではスビトリナがサバレンカを 6 対 3、3 対 6、6 対 1 で破り、ノスコバと対戦。アンドレエワはシュナイダーに 6 対 2、6 対 1 で勝ち、グループ戦の失ゲーム 11 は 2007 年エナンの記録に並んだ。"}, "why": {"zh": "两场胜利全部从赛点边缘救回来——这种「命是救回来的」晋级方式，说明这对组合的抗压值高于纸面排名。首次参加年终总决赛就进四强，是中国女双在李娜那一代之后少见的年终赛存在感。半决赛对手小组赛三战全胜，没有包袱的一方反而是她们。", "en": "Both wins came back from match point, and that way of surviving says the pair's composure runs ahead of its ranking. Reaching the semis on debut is the kind of year-end presence Chinese women's doubles has rarely had since Li Na's generation. Their semi-final opponents went unbeaten in the group; the side with nothing to lose is Guo and Mladenovic.", "es": "Las dos victorias llegaron desde puntos de partido en contra, y esa forma de sobrevivir indica que la entereza de la pareja va por delante de su ranking. Llegar a semifinales en el debut es una presencia de fin de año poco frecuente en el dobles femenino chino desde la generación de Li Na. Sus rivales fueron invictas en el grupo; el lado sin nada que perder son ellas.", "ja": "2 勝はいずれもマッチポイントから挽回した。その勝ち方が、このペアの精神力がランキング以上であることを示す。初出場で 4 強は、李娜世代以降の中国女子ダブルスでは珍しい年末の存在感だ。準決勝の相手はグループ戦全勝。失うものがない側は郭組である。"}}]}, {"key": "hot", "num": "05", "color": "#6d28d9", "deep": "#5b21b6", "name": {"zh": "网络热点", "en": "Trending", "es": "Tendencias", "ja": "ネット"}, "items": [{"idx": "01", "title": {"zh": "多地中小学把到校时间往后拨：成都 8:40，低年级 9 点", "en": "Schools push back the morning bell: 8:40 in Chengdu, 9am for the youngest", "es": "Los colegios retrasan la entrada: 8:40 en Chengdu y 9:00 para los más pequeños", "ja": "各地の小中学校が登校時刻を後ろ倒し、成都は 8 時 40 分、低学年は 9 時"}, "body": {"zh": "江苏、重庆、四川等多地中小学近期调整作息，推迟到校时间、取消统一早读。据央视新闻报道，成都部分小学到校时间调整为 8:40，南京、徐州多校推迟 20 至 30 分钟，部分小学一、二年级推迟至 9 时到校；学校同步开放早到托管，缓解家长接送难题。话题「多地中小学宣布调整作息」居百度热搜第 2 位、热度约 771 万（11 月 15 日凌晨在榜）。家长反应两极：多数支持「让孩子多睡一会」，也有家长担心早到的孩子没人管、成绩受影响。", "en": "Schools in Jiangsu, Chongqing, Sichuan and elsewhere have adjusted their timetables, pushing back arrival times and scrapping compulsory morning reading. CCTV reported that some primary schools in Chengdu now start at 8:40, schools in Nanjing and Xuzhou moved 20 to 30 minutes later, and some first and second grades now begin at 9am. Schools have opened early-arrival supervision to ease the drop-off problem for working parents. The topic ranked second on Baidu's trending list with about 7.71 million heat points in the early hours of 15 November. Parents are split: most welcome the extra sleep, some worry about who looks after children who arrive early and about academic impact.", "es": "Escuelas de Jiangsu, Chongqing, Sichuan y otras provincias han ajustado sus horarios: retrasan la entrada y eliminan la lectura matinal obligatoria. Según CCTV, algunos colegios de Chengdu empiezan ahora a las 8:40, los de Nankín y Xuzhou se retrasaron entre 20 y 30 minutos y algunos primeros y segundos cursos comienzan a las 9:00. Los centros abren atención temprana para facilitar la conciliación. El tema fue el segundo más buscado en Baidu, con unos 7,71 millones de puntos de interés en la madrugada del 15 de noviembre. Las familias están divididas: la mayoría celebra que los niños duerman más; otras temen que los que llegan antes no tengan supervisión y que baje el rendimiento.", "ja": "江蘇省、重慶市、四川省などの小中学校が最近、始業時刻を遅らせ、一律の朝読を廃止した。CCTV によると、成都の一部の小学校は登校が 8 時 40 分になり、南京や徐州では 20〜30 分遅くなり、一部の小学 1、2 年生は 9 時登校となった。早着の子を受け入れる預かりも始め、送迎の負担を緩和している。話題は百度の検索ランキングで 2 位、11 月 15 日未明時点で熱度約 771 万。保護者の反応は二分され、多くは「もっと寝かせてあげたい」と支持する一方、早く来た子の見守りや学力への影響を心配する声もある。"}, "why": {"zh": "睡眠管理的规定五年前就写进了文件，这轮调整本质上是把欠孩子的睡眠还回去。真正的成败不在到校时间，而在「早到托管」这一条——没有它，推迟到校只是把家长的上班时间往前挪了半小时。政策的好坏，往往取决于配套的那一句。", "en": "The rules on sleep were written into policy five years ago; this round is essentially handing back sleep that was owed. Success will not be decided by the arrival time but by the early-arrival supervision clause: without it, a later start simply shifts the parent's commute half an hour earlier. Whether a policy works often depends on its accompanying sentence.", "es": "La normativa sobre el sueño se escribió hace cinco años; este ajuste devuelve un sueño que se debía. El éxito no dependerá de la hora de entrada sino de la cláusula de atención temprana: sin ella, entrar más tarde solo adelanta media hora la salida de los padres al trabajo. La calidad de una política suele depender de su frase complementaria.", "ja": "睡眠に関する規定は 5 年前に文書に書かれていた。今回の調整は、子どもに返すべき睡眠を返す作業である。成否は登校時刻ではなく「早着預かり」の一行にかかっている。それがなければ、登校を遅らせた分だけ保護者の出勤が 30 分早まるだけだ。政策の良し悪しは、付随する一行で決まることが多い。"}}, {"idx": "02", "title": {"zh": "北方孩子的雪假来了：吉林连休 5 天，免费滑雪从 1 次加到 3 次", "en": "Snow holidays for northern pupils: five days off in Jilin, free ski passes from one to three", "es": "Vacaciones de nieve en el norte: cinco días en Jilin y esquí gratis de una a tres veces", "ja": "北国の「雪休み」、吉林は 5 連休、無料スキーは 1 回から 3 回に"}, "body": {"zh": "河北张家口、吉林、内蒙古呼伦贝尔、新疆阿勒泰等地陆续公布中小学「雪假」安排。据张家口日报，当地今起在义务教育阶段 1 至 8 年级试行春假、雪假，雪假 3 天、学段错峰；吉林的雪假与周末连休成 5 天小长假，学生免费滑雪从 1 次增至 3 次；多地同步开放免费托管。社交平台上「想重新上一次小学」刷屏，也有教师和班主任担心调课、补课压力。", "en": "Zhangjiakou in Hebei, Jilin, Hulunbuir in Inner Mongolia and Altay in Xinjiang have announced snow holidays for school pupils. According to Zhangjiakou Daily, the city is piloting spring and snow breaks for grades one to eight, with three snow days staggered by age group. In Jilin the snow holiday joins the weekend to make five days off, and free ski passes go from one to three per student. Several places are opening free supervision. Posts saying I want to go back to primary school have flooded social media, while teachers worry about rescheduling and make-up lessons.", "es": "Zhangjiakou (Hebei), Jilin, Hulunbuir (Mongolia Interior) y Altay (Xinjiang) han anunciado vacaciones de nieve para escolares. Según el diario de Zhangjiakou, la ciudad ensaya vacaciones de primavera y nieve para los cursos 1 a 8, con tres días de nieve escalonados. En Jilin se suman al fin de semana y forman cinco días, y los pases de esquí gratuitos pasan de uno a tres por alumno. Varias localidades abren atención gratuita. En redes se repite quiero volver a la primaria, mientras el profesorado teme la reorganización de clases.", "ja": "河北省張家口、吉林省、内蒙古フルンブイル、新疆アルタイなどが小中学生の「雪休み」を相次いで発表した。張家口日報によると、義務教育 1〜8 年生を対象に春休みと雪休みを試行し、雪休みは 3 日で学年ごとにずらす。吉林省は週末と合わせて 5 連休とし、無料スキーを 1 回から 3 回に増やす。各地で無料の預かりも始まった。SNS では「もう一度小学校に通いたい」が溢れる一方、教員からは授業調整や補習の負担を心配する声も出ている。"}, "why": {"zh": "把假期和冰雪消费绑在一起，是地方文旅这几年最直接的一次「供给侧改革」——雪场需要人，孩子需要假期，两件事一拍即合。但假期的成本最终落在学校和教师身上：调课、补课、安全预案不排好，雪假就会变成家长的「新难题」。这类政策的成色，第二年才看得清。", "en": "Tying school holidays to winter sports spending is local tourism's most direct supply-side move in years: resorts need visitors, children need breaks, and the two fit neatly. The cost, though, lands on schools and teachers — without rescheduling, make-up classes and safety plans, the snow holiday becomes a new problem for parents. The real quality of such policies only shows in year two.", "es": "Vincular las vacaciones al consumo de nieve es la medida de oferta más directa del turismo local en años: las estaciones necesitan visitantes, los niños necesitan descanso y encajan. El coste recae en escuelas y docentes: sin reorganización, clases de refuerzo y planes de seguridad, la vacación se convierte en un problema nuevo para las familias. La calidad real se ve el segundo año.", "ja": "休みと雪消費を結びつけるのは、この数年で最も直接的な観光の供給側改革だ。スキー場は人を必要とし、子どもは休みを必要とし、噛み合う。だがコストは学校と教員に落ちる。授業の振り替え、補習、安全計画が整わなければ、雪休みは保護者にとって新たな難題になる。こうした政策の質は 2 年目に見えてくる。"}}, {"idx": "03", "title": {"zh": "拒绝给 HR 带咖啡，面试当场被取消：平台已封禁账号", "en": "Refused to buy the recruiter a coffee, lost the interview: the platform has suspended the account", "es": "Se negó a comprarle un café al reclutador y perdió la entrevista: la plataforma suspendió la cuenta", "ja": "人事にコーヒーを買うのを断ったら面接中止、求人サイトがアカウント停止"}, "body": {"zh": "江苏昆山一名求职者跨城前往公司面试，刚到楼下就收到 HR 消息，要求「点两杯喝的、我要不带咖啡因的」，并明确表示不报销；求职者拒绝后，HR 改口称可以报销，又撂下一句「公司不招斤斤计较的员工」，随后取消面试。11 月 13 日求职者发帖后引发热议，11 月 14 日 BOSS 直聘回应称该招聘者违反平台规则公约，已暂停其账号权限。工商信息显示，涉事公司连续多年 0 人参保，已被列入经营异常名录。", "en": "A job applicant travelling to a company in Kunshan, Jiangsu, was messaged by the recruiter on arrival asking them to order two drinks, one without caffeine, and stating it would not be reimbursed. When the candidate refused, the recruiter said it could be reimbursed after all, added that the company does not hire people who nitpick, and cancelled the interview. The post went viral on 13 November, and on 14 November the platform BOSS Zhipin said the recruiter had broken its rules and suspended the account. Company records show the employer has reported zero insured employees for several consecutive years and is listed as operating abnormally.", "es": "Un candidato que viajó a una empresa en Kunshan (Jiangsu) recibió al llegar un mensaje del reclutador pidiéndole dos bebidas, una sin cafeína, y aclarando que no se reembolsarían. Al negarse, el reclutador dijo que sí se reembolsaría, añadió que la empresa no contrata a quien se fija en nimiedades y canceló la entrevista. La publicación se viralizó el 13 de noviembre y el 14 la plataforma BOSS Zhipin informó de que el reclutador había incumplido sus normas y suspendió la cuenta. Los registros mercantiles muestran que la empresa lleva varios años sin ningún empleado asegurado y figura como anómalamente operativa.", "ja": "江蘇省昆山の求職者が面接のために地方から移動し、会社の下に着いた直後、人事から「飲み物を 2 つ、自分はカフェインなし」と注文を求められ、立替はしないと明言された。断ると一転して「経費で落とす」と言い、「細かいことにこだわる人は採らない」と告げて面接を中止した。11 月 13 日に投稿が拡散し、14 日に BOSS 直聘は規則違反として当該採用担当のアカウントを停止したと回答。企業情報では、この会社は数年にわたり社会保険加入者が 0 人で、経営異常リストに掲載されている。"}, "why": {"zh": "一杯咖啡照出的是一家公司的权力习惯：把求职者当跑腿，说明这家公司对「人」的定价方式。平台封号是止血，但真正该被看见的是那个「0 人参保、经营异常」的标签——如果这些信号在投递前就摆在明面上，很多面试根本不必发生。", "en": "One coffee exposes a company's habits of power: treating a candidate as an errand runner tells you how it prices people. Suspending the account stops the bleeding, but the label that matters is zero insured employees and abnormal operations — if those signals were visible before applying, many interviews would never happen.", "es": "Un café revela los hábitos de poder de una empresa: tratar al candidato de recadero dice cómo valora a las personas. Suspender la cuenta frena la hemorragia, pero la etiqueta que importa es cero empleados asegurados y operación anómala: si esas señales fueran visibles antes de postularse, muchas entrevistas nunca ocurrirían.", "ja": "コーヒー一杯が、その会社の権力の作法を映す。求職者を使い走りに扱う職場は、人をそう値踏みする。アカウント停止は止血にすぎず、本当に見えるべきは「社会保険加入者ゼロ、経営異常」というラベルだ。応募前にそれが見えていれば、そもそも起きなかった面接も多い。"}}, {"idx": "04", "title": {"zh": "误购 2.3 万元机票，几分钟后退票被扣 1 万", "en": "Booked 23,000 yuan of tickets by mistake, cancelled minutes later, charged 10,000", "es": "Compró por error billetes de 23.000 yuanes, canceló minutos después y le cobraron 10.000", "ja": "誤って 2.3 万元の航空券を購入、数分後の払い戻しで 1 万元を差し引かれる"}, "body": {"zh": "据央广网报道，江苏贾先生 8 月 8 日凌晨 2 点误购两张海南航空国际联程机票，航班当日 13 点起飞；付款后几分钟内即申请退票，仍被收取合计超过票价 42%、约 1 万元的退票费。他从凌晨 2 点交涉到中午 12 点无果，最终无奈接受该方案。此前京津冀三地消协已通报航司与在线旅行平台，要求规范机票退改签服务。", "en": "According to China National Radio, a Mr Jia in Jiangsu mistakenly bought two international connecting tickets on Hainan Airlines at 2am on 8 August for a flight departing at 1pm the same day. He applied for a refund within minutes of paying and was still charged about 10,000 yuan, more than 42 percent of the fare. He argued from 2am until noon without success and accepted the charge. Consumer associations in Beijing, Tianjin and Hebei had previously told airlines and online travel platforms to clean up refund and change rules.", "es": "Según Radio Nacional de China, un señor Jia, de Jiangsu, compró por error a las 2 de la madrugada del 8 de agosto dos billetes internacionales con conexión de Hainan Airlines para un vuelo que salía a las 13:00 de ese día. Solicitó el reembolso minutos después de pagar y aun así le cobraron unos 10.000 yuanes, más del 42 por ciento del precio. Negoció desde las 2 hasta el mediodía sin éxito y aceptó el cargo. Las asociaciones de consumidores de Pekín, Tianjin y Hebei ya habían instado a aerolíneas y plataformas a ordenar las condiciones de cambio y devolución.", "ja": "中国之声によると、江蘇省の賈さんは 8 月 8 日午前 2 時、海南航空の国際線乗り継ぎ航空券 2 枚を誤って購入した。出発は同日 13 時。支払い後数分で払い戻しを申請したが、運賃の 42 パーセント超にあたる約 1 万元の手数料を取られた。午前 2 時から正午まで交渉したが覆らず、最終的に受け入れた。北京・天津・河北の消費者団体は以前、航空会社とオンライン旅行サイトに変更・払い戻し規則の適正化を求めている。"}, "why": {"zh": "规则的合理性不等于规则的正当性。误购几分钟内撤单，航司几乎没有实际损失，「42%」更像是把格式条款用到了极致。行业真正需要的是误购冷静期或阶梯费率，而不是让消费者为一次手滑付一万块。这类个案每年都有，规则却总要等到舆情才动。", "en": "That a rule is written down does not make it fair. Cancelling minutes after a mistaken purchase costs the airline almost nothing, and 42 percent looks like a standard-form clause pushed to its limit. What the industry needs is a cooling-off window for mistaken bookings or a tiered fee, not a 10,000 yuan bill for a slip of the thumb. Cases like this appear every year, while the rules only move when public opinion does.", "es": "Que una regla esté escrita no la hace justa. Cancelar minutos después de una compra errónea casi no cuesta a la aerolínea, y un 42 por ciento parece una cláusula abusiva llevada al límite. El sector necesita un periodo de reflexión para compras erróneas o tarifas escalonadas, no una factura de 10.000 yuanes por un desliz. Casos así aparecen cada año y las reglas solo se mueven con la opinión pública.", "ja": "規則が書かれていることは、公正であることを意味しない。誤購入の数分後の取り消しで航空会社に実損はほぼなく、42 パーセントは定型約款を極限まで使った数字に見える。必要なのは誤購入のクーリングオフか段階的な手数料であり、指一本の滑りに 1 万元を払わせることではない。同種の事例は毎年あり、規則は世論が動くまで動かない。"}}, {"idx": "05", "title": {"zh": "北京 WB 4:3 拿下 KPL 年度总决赛，决胜局双方选了同一套阵容", "en": "Beijing WB win the KPL year-end final 4-3 after a deciding game with identical drafts", "es": "Beijing WB gana 4-3 la final anual de la KPL tras un desempate con borradores idénticos", "ja": "北京 WB が KPL 年間王者決定戦を 4 対 3 で制す、最終戦は両者同一構成"}, "body": {"zh": "11 月 14 日晚，2026 年王者荣耀 KPL 年度总决赛在成都凤凰山体育公园落幕。北京 WB 鏖战七局，以 4:3 战胜北京 JDG，夺得年度总冠军，对抗路选手吴喆杰（ID 梓墨）当选总决赛最有价值选手。这是 KPL 历史上第 101 次「巅峰对决」，决胜局双方选出完全相同的五名英雄，形成罕见的「镜像阵容」，转折点是第 4 分钟的暴君争夺——北京 WB 中路选手吴佐（ID 听悦）在团战中精准切入，帮助队伍赢下关键团战，此后 WB 通过连续控制暴君、主宰逐步扩大优势锁定胜局。本届年度总决赛，北京 WB 三次打满七局全部取胜；此前胜者组决赛他们曾 2:4 负于北京 JDG。今年是 KPL 创办十周年，全年四项赛事冠军由四支队伍分享，「WB 夺冠」词条登上热搜第一。", "en": "The 2026 King of Glory KPL year-end final ended at Chengdu's Fenghuangshan Sports Park on the evening of 14 November, with Beijing WB beating Beijing JDG 4-3 across seven games to take the title. Wu Zhejie, the team's lane player known as Zimo, was named finals MVP. It was the 101st deciding game in KPL history, and both sides drafted an identical five-hero lineup, a rare mirror matchup. The turning point came in a four-minute tyrant contest, when mid laner Wu Zuo, known as Tingyue, found a precise entry to win the fight; WB then controlled tyrants and overlords to close it out. WB won all three of their seven-game series this tournament, having lost 2-4 to JDG in the winners' final. This year marks the KPL's tenth anniversary, with the four titles of the season split between four teams. The hashtag WB wins topped the trending list.", "es": "La final anual de la KPL de 2026 terminó el 14 de noviembre en el parque deportivo Fenghuangshan de Chengdu: Beijing WB venció 4-3 a Beijing JDG en siete partidas. Wu Zhejie, de la calle superior y conocido como Zimo, fue elegido MVP de la final. Fue el desempate número 101 de la historia de la KPL y ambos equipos eligieron los mismos cinco héroes, un espejo poco habitual. El punto de inflexión llegó en la disputa del tirano al minuto cuatro, cuando el carril central Wu Zuo, Tingyue, encontró una entrada precisa para ganar la pelea; después WB controló tiranos y overlords. WB ganó sus tres series a siete partidas del torneo, tras perder 2-4 ante JDG en la final del cuadro de ganadores. Este año la KPL cumple diez años y los cuatro títulos de la temporada se repartieron entre cuatro equipos. La etiqueta WB campeón fue la más buscada.", "ja": "11 月 14 日夜、2026 年王者栄耀 KPL 年間王者決定戦が成都鳳凰山体育公園で終了し、北京 WB が 7 試合の末に北京 JDG を 4 対 3 で破って優勝、トップレーナーの呉喆傑（ID 梓墨）が MVP に選ばれた。KPL 史上 101 回目の「頂上決戦」で、最終戦は両チームが同じ 5 体を選ぶ珍しいミラー構成となった。転機は 4 分のタイラント争いで、ミッドの呉佐（ID 聴悦）が的確に切り込んで集団戦を制し、その後 WB がタイラントとオーバーロードを連続で確保して押し切った。WB は今大会 3 度の 7 試合シリーズをすべて制し、勝者組決勝では JDG に 2 対 4 で敗れていた。KPL は今年 10 周年で、年間 4 大会のタイトルは 4 チームで分け合った。「WB 優勝」は検索ランキング 1 位となった。"}, "why": {"zh": "镜像阵容意味着决胜局比的不是套路而是执行——同样的五个英雄，谁先犯错谁就输。这种局面赢下来，通常说明心态更硬，也说明教练组敢把比赛交给选手。对 KPL 来说，十周年把决赛放回《王者荣耀》的诞生地成都，是把「赛事地域化」讲成城市故事的一次演示：票根能带动文旅，冠军能带动一座城的年轻人。", "en": "A mirror draft means the decider tests execution rather than invention: same five heroes, first mistake loses. Winning that kind of game usually says the nerves are steadier and the coaching staff trusts the players to decide it. For the KPL, staging the tenth-anniversary final back in Chengdu, where the game was born, is a demonstration of regionalisation as city storytelling: ticket stubs drive tourism, and a title pulls young people towards a city.", "es": "Un borrador espejo hace que el desempate mida ejecución y no invención: los mismos cinco héroes, el primero que falla pierde. Ganar así suele indicar nervios más firmes y un cuerpo técnico que confía la decisión a los jugadores. Para la KPL, llevar la final del décimo aniversario a Chengdu, donde nació el juego, es una demostración de regionalización como relato urbano: las entradas mueven turismo y un título atrae a los jóvenes hacia una ciudad.", "ja": "ミラー構成の最終戦は、仕掛けではなく執行力の勝負になる。同じ 5 体で、先にミスした方が負ける。それを制したのは精神力の差であり、采配を選手に委ねる監督陣の判断でもある。KPL にとって 10 周年の決勝を『王者栄耀』生誕の地である成都に戻したことは、大会の地域化を都市の物語として語る実演だった。半券は観光を動かし、優勝は街に若者を呼び込む。"}}]}, {"key": "ent", "num": "06", "color": "#db2777", "deep": "#be185d", "name": {"zh": "娱乐八卦", "en": "Showbiz", "es": "Espectáculos", "ja": "エンタメ"}, "items": [{"idx": "01", "title": {"zh": "华晨宇的第 100 场个人演唱会，落在南京汤山", "en": "Hua Chenyu plays his 100th solo concert in Nanjing", "es": "Hua Chenyu ofrece su concierto número 100 en Nankín", "ja": "華晨宇、自身 100 回目のソロ公演を南京で開催"}, "body": {"zh": "2026 年 11 月 15 日，华晨宇第 100 场个人演唱会在南京汤山音乐谷举行，这是其出道 12 年的百场里程碑，也是「火星乐园 2.0」巡演的收官场；第 99 场已于 11 月 14 日在同场地先演，延续昼夜双场模式。他的首场个人演唱会为 2014 年 9 月 6 日北京五棵松体育馆。歌迷会发起「百场百城」大屏应援，在 100 座城市 150 多个商圈投放庆贺画面，并把巡演名场面以围栏形式集中呈现供打卡。", "en": "Hua Chenyu plays his 100th solo concert at Nanjing's Tangshan Music Valley on 15 November 2026, a milestone 12 years after his debut and the closing date of the Mars Paradise 2.0 tour. Concert number 99 was staged at the same site on 14 November, continuing the day-and-night double-show format. His first solo concert was at Beijing's Wukesong Arena on 6 September 2014. Fan clubs organised a hundred-cities billboard campaign, putting celebratory visuals in more than 150 shopping districts across 100 cities and installing fences of tour highlights as photo spots.", "es": "Hua Chenyu ofrece su concierto número 100 en el Tangshan Music Valley de Nankín el 15 de noviembre de 2026, un hito 12 años después de su debut y la fecha de cierre de la gira Mars Paradise 2.0. El concierto 99 se celebró en el mismo recinto el 14 de noviembre, manteniendo el formato de doble función día y noche. Su primer concierto en solitario fue en el Wukesong de Pekín el 6 de septiembre de 2014. Los clubes de fans organizaron una campaña de pantallas en cien ciudades, con imágenes en más de 150 zonas comerciales y vallas con momentos de la gira como puntos fotográficos.", "ja": "2026 年 11 月 15 日、華晨宇の 100 回目のソロ公演が南京湯山音楽谷で行われた。デビュー 12 年での節目であり、「火星楽園 2.0」ツアーの最終公演でもある。99 回目は前日 14 日に同じ会場で昼夜 2 公演形式で開催された。初のソロ公演は 2014 年 9 月 6 日の北京五棵松体育館。ファンクラブは「100 公演・100 都市」の大型ビジョン企画を展開し、100 都市 150 以上の商業施設に祝福映像を出し、ツアーの名場面を围栏として展示して撮影スポットにした。"}, "why": {"zh": "十二年一百场，在华语乐坛是「体育馆级常客」的硬指标——大部分人一辈子都到不了这个数字。更值得看的是形式：他把百场做成户外乐园的双场连演，而不是单场加座。演出行业正在从「卖一张票」转向「卖一段停留时间」，这个变化在票价之外。", "en": "A hundred shows in twelve years is a hard indicator of arena-level staying power; most artists never get near the number. The more interesting part is the format: a two-night outdoor park run rather than one bigger show. Live entertainment is shifting from selling a ticket to selling a stretch of time, and that change does not show up in the ticket price.", "es": "Cien conciertos en doce años es un indicador duro de permanencia en el nivel de pabellón; la mayoría nunca se acerca a esa cifra. Lo interesante es el formato: dos noches en un recinto al aire libre y no un solo espectáculo más grande. El directo pasa de vender una entrada a vender un tramo de tiempo, y ese cambio no aparece en el precio.", "ja": "12 年で 100 公演は、アリーナ級の集客力を持つことの硬い指標だ。多くのアーティストは到底届かない。さらに興味深いのは形式で、1 公演を大きくするのではなく、野外型の 2 日連続公演にした。ライブ産業は「チケットを売る」から「滞在時間を売る」へ移っており、その変化は ticket 価格には現れない。"}}, {"idx": "02", "title": {"zh": "等了五年，陈卓璇和吴宣仪在苏州唱了《野心家》", "en": "Five years on, Chen Zhuoxuan and Wu Xuanyi finally share a stage in Suzhou", "es": "Cinco años después, Chen Zhuoxuan y Wu Xuanyi comparten escenario en Suzhou", "ja": "5 年越し、陳卓璇と呉宣儀が蘇州で共演"}, "body": {"zh": "11 月 14 日 19:00，陈卓璇「当·拾」巡回演唱会苏州收官站在苏州市体育中心体育馆举行。吴宣仪作为惊喜嘉宾登台，两人自 2021 年综艺《爆裂舞台》结识后首次正式同台，合唱《野心家》，吴宣仪另演唱了新歌《一个人还可以》。嘉宾此前一直保密，官宣文案为「拾光落姑苏，双声共绽放」。两人同为「创系」选秀出身，五年间一直保持联系，陈卓璇曾在直播中称对方是「关系密切的好友」并为其音乐剧舞台打 call。现场观众反馈两人声线互补、合唱段落「听得起鸡皮疙瘩」，也有观众提到当晚音响存在瑕疵。", "en": "Chen Zhuoxuan's Dang Shi tour closed in Suzhou on 14 November with a show at the city's sports centre arena. Wu Xuanyi appeared as a surprise guest, the pair performing together for the first time since meeting on the 2021 show Stage Boom, duetting on The Ambitious; Wu also sang her new single One Person Is Still Fine. The guest had been kept secret, announced with a poetic line about light falling on Suzhou and two voices blooming together. Both came up through the same talent-show system and stayed in touch over five years, with Chen calling Wu a close friend on a livestream and promoting her musical theatre run. Audiences described the voices as complementary and the duet as goosebump-inducing, though some noted sound problems.", "es": "La gira Dang Shi de Chen Zhuoxuan cerró en Suzhou el 14 de noviembre con un concierto en el pabellón del centro deportivo. Wu Xuanyi apareció como invitada sorpresa: actuaron juntas por primera vez desde que se conocieron en el programa Stage Boom de 2021, a dúo en The Ambitious; Wu interpretó además su nuevo sencillo One Person Is Still Fine. La invitada se mantuvo en secreto y se anunció con una frase poética sobre la luz cayendo en Suzhou y dos voces floreciendo. Ambas surgieron del mismo sistema de concursos y mantuvieron el contacto cinco años; Chen la llamó amiga cercana en un directo y promocionó su montaje musical. El público destacó voces complementarias y un dúo que eriza la piel, aunque algunos señalaron fallos de sonido.", "ja": "陳卓璇のツアー「当・拾」の蘇州公演が 11 月 14 日 19 時、蘇州市体育中心体育館で開催された。呉宣儀がサプライズゲストとして登場し、2021 年の番組『爆裂舞台』で知り合って以来初めて正式に共演、『野心家』をデュエットした。呉は新曲『一人でも大丈夫』も披露。ゲストは直前まで非公開で、「光が蘇州に落ち、二つの声が咲く」という文言で告知された。二人は同じオーディション番組の出身で 5 年間連絡を取り続け、陳は配信で「親しい友人」と語り、呉のミュージカル舞台も応援していた。観客は声の補完性と「鳥肌が立つ」デュエットを評価する一方、音響の不備を指摘する声もあった。"}, "why": {"zh": "选秀体系留下的关系网，正在以「嘉宾合体」的方式二次变现——这种合作的成本很低，情绪价值却很高。对两位歌手来说，《野心家》的意义不在唱功比拼，而在把「野心」这个词从贬义翻成中性。这是这一代女艺人共同的叙事需求：想赢不再是件需要道歉的事。", "en": "The networks left behind by talent shows are being monetised a second time through guest appearances: low cost, high emotional return. For both singers the point of The Ambitious is not a vocal contest but reclaiming the word ambition from its negative charge. That is a shared need for this generation of women performers: wanting to win should not require an apology.", "es": "Las redes que dejaron los concursos se monetizan de nuevo con apariciones como invitadas: bajo coste y alto retorno emocional. Para ambas, The Ambitious no es un duelo vocal sino recuperar la palabra ambición de su carga negativa. Es una necesidad compartida por esta generación de artistas: querer ganar no debería exigir disculpas.", "ja": "オーディション番組が残した人脈は、ゲスト共演という形で二度目の収益化を迎えている。コストは低く、感情的な価値は高い。二人にとって『野心家』の意味は歌唱力比べではなく、「野心」という言葉を贬義から中性へ戻すことにある。勝ちたいと思うことに謝罪が要らない——それがこの世代の女性アーティストに共通する欲求だ。"}}, {"idx": "03", "tag": {"zh": "进展"}, "title": {"zh": "八千字公开信之后：AI 合成的「卢璐」在直播间卖起了保健品", "en": "After an 8,000-character open letter, AI-generated versions of Liu Huan's widow sell supplements live", "es": "Tras una carta abierta de 8.000 caracteres, una «Lu Lu» generada por IA vende suplementos en directo", "ja": "8000 字の公開書簡のあと、AI 合成の「盧璐」がライブ配信で健康食品を販売"}, "body": {"zh": "11 月 12 日，刘欢在北京怀柔长城脚下安葬。当晚，好友水均益受刘欢夫人卢璐委托，在其个人账号发布卢璐撰写的公开信《她是这样的人》，全文约 8000 字，回顾刘欢 14 年抗癌历程，并逐条澄清多年传言：女儿原名取自刘欢大学外语名的发音、与佛教用语无关；2009 年确诊股骨头缺血性坏死并完成髋关节置换、恢复良好，网传「不死癌症」「常年瘫痪」属夸大；1991 年华东赈灾义演直播口误的主持人并非赵忠祥；刘欢并非谷建芬声乐训练班的学生，也从未正式收徒，「师父」「师娘」只是单方面尊称；近年江浙、安徽多地出现冒名者拍摄虚假视频。信发布后，短视频平台出现一批 AI 合成的「卢璐」账号，哭着讲述病情并挂链接售卖「黄精五黑粉」，另有账号用 AI 合成「刘欢的儿子」直播卖货——刘欢只有一个女儿。央视网核查后认定，画面中的脸与声音均为合成。", "en": "Liu Huan was buried at the foot of the Great Wall in Huairou, Beijing, on 12 November. That evening his friend, the journalist Shui Junyi, published an open letter written by Liu's wife Lu Lu, titled She Is This Kind of Person, at her request. Running some 8,000 characters, it recounts Liu's 14-year fight with cancer and corrects years of rumour one item at a time: their daughter's original name came from the pronunciation of Liu's university foreign-language name and had nothing to do with Buddhist terms; his 2009 diagnosis of avascular necrosis of the femoral head was treated with a hip replacement and recovered well, making claims of an incurable cancer and permanent paralysis exaggerated; the host who fluffed a line during the 1991 flood relief gala was not Zhao Zhongxiang; Liu was not a student of Gu Jianfen's vocal class and never formally took disciples, with teacher and master's wife being honorifics applied from one side only; and impostors have filmed fake videos in several provinces in recent years. After the letter appeared, short-video platforms filled with AI-generated Lu Lu accounts weeping about his illness while linking to a supplement for sale, and another account used an AI-generated son of Liu Huan to sell goods live — he had only one daughter. CCTV's verification team concluded that both face and voice were synthesised.", "es": "Liu Huan fue enterrado al pie de la Gran Muralla en Huairou (Pekín) el 12 de noviembre. Esa noche su amigo, el periodista Shui Junyi, publicó por encargo de la esposa de Liu, Lu Lu, una carta abierta titulada Ella es así, de unos 8.000 caracteres, que repasa los 14 años de enfermedad y corrige años de rumores uno por uno: el nombre original de la hija venía de la pronunciación del nombre universitario de Liu y nada tenía que ver con términos budistas; el diagnóstico de 2009 de necrosis avascular de la cabeza femoral se trató con prótesis de cadera y evolucionó bien, por lo que hablar de cáncer incurable y parálisis permanente es exagerado; el presentador que se equivocó en la gala de 1991 no fue Zhao Zhongxiang; Liu no fue alumno de la clase vocal de Gu Jianfen ni tomó discípulos formales, y maestro y señora eran tratamientos unilaterales; en los últimos años han aparecido impostores grabando vídeos falsos en varias provincias. Tras la carta aparecieron en plataformas de vídeo cuentas de una Lu Lu generada por IA que lloraba la enfermedad y enlazaba un suplemento a la venta, y otra que usaba un hijo de Liu Huan también sintético para vender en directo: solo tuvo una hija. La verificación de CCTV concluyó que rostro y voz eran sintéticos.", "ja": "11 月 12 日、劉歓が北京懐柔の長城の麓に埋葬された。同日夜、友人でジャーナリストの水均益氏が、妻の盧璐氏の依頼で公開書簡『彼女はこういう人』を自身のアカウントに掲載した。約 8000 字で、14 年にわたる闘病を振り返り、長年の噂を一つずつ訂正している。娘の当初の名前は劉歓の大学時代の外国語名の発音に由来し仏教用語とは無関係。2009 年の大腿骨頭壊死は人工関節置換で回復し、「不治の病」「寝たきり」は誇張。1991 年の水害義援番組で言い間違えたのは趙忠祥ではない。劉歓は谷建芬の声楽教室の生徒ではなく、正式な弟子も取っておらず、「師匠」「師母」は一方的な敬称。近年、江蘇・浙江・安徽などでなりすましが偽動画を撮影している。書簡の発表後、動画サイトには AI 合成の「盧璐」が病気を泣きながら語り「黄精五黒粉」を売るアカウントが現れ、AI 合成の「劉歓の息子」がライブ販売するものもあった。娘は一人だけである。CCTV の検証は顔と声がいずれも合成だと結論づけた。"}, "why": {"zh": "活人有版权、有律师、有团队、会发声明；逝者只剩一张脸和一个名字。这条产业链的成本几乎为零，收益却按转化率结算：平台算法不辨真假只认停留时长，商家只算投产比，观众不是坏，是太容易被眼泪打动。家属能做的，只有一遍遍举报、一遍遍辟谣，把伤口撕开给人看。这是 AI 滥用里最难治理的一类——受害者无法为自己发声。", "en": "The living have copyright, lawyers, teams and press statements; the dead have a face and a name. This supply chain costs almost nothing to run and is settled by conversion rate: algorithms do not distinguish true from false, only watch time; sellers count return on spend; audiences are not wicked, just easy to move to tears. All the family can do is report accounts and debunk again and again, reopening the wound for strangers to see. It is the hardest category of AI abuse to police, because the victim cannot speak for himself.", "es": "Los vivos tienen derechos de autor, abogados, equipos y comunicados; los muertos tienen un rostro y un nombre. Esta cadena cuesta casi nada y se liquida por tasa de conversión: los algoritmos no distinguen verdad de mentira, solo tiempo de visionado; los vendedores calculan retorno; el público no es malvado, solo fácil de conmover. La familia solo puede denunciar cuentas y desmentir una y otra vez, abriendo la herida ante extraños. Es la categoría de abuso de IA más difícil de vigilar, porque la víctima no puede hablar por sí misma.", "ja": "生きている者には著作権も弁護士もチームも声明もある。亡くなった者に残るのは顔と名前だけだ。この産業のコストはほぼゼロで、収益は転換率で決まる。アルゴリズムは真偽を判別せず滞在時間だけを見、売り手は費用対効果だけを計算し、受け手は悪意があるのではなく涙に弱い。遺族にできるのは通報と訂正を繰り返し、傷を他人に見せることだけだ。AI 濫用の中で最も統治しにくい類型である。被害者が自ら声を上げられないからだ。"}}, {"idx": "04", "title": {"zh": "《女子推理社3》阵容仍无官宣，李一桐对接账号先划了线", "en": "No official cast list for Her Detective Club 3, but Li Yitong's fan account has already drawn a line", "es": "Sin reparto oficial para Her Detective Club 3, pero la cuenta de fans de Li Yitong ya marcó distancia", "ja": "『女子推理社 3』の出演者発表は依然なく、李一桐の窓口アカウントが先に線を引く"}, "body": {"zh": "截至 11 月 15 日，《女子推理社 3》节目组与芒果 TV 仍未发布正式阵容公告。网传 11 月 15 日在长沙举行发布会，阵容含戚薇、李一桐、陈昊宇、李雪琴、田曦薇、张艺凡，但现有海报仅标注「以现场出席艺人为准」。11 月 12 日曝光的首录阵容为戚薇、陈昊宇、李雪琴、田曦薇、张艺凡、徐梦洁，李一桐不在列——这与 9 月招商方案、10 月 29 日阵容消息中「李一桐为常驻」的说法直接矛盾。11 月 14 日，李一桐粉丝对接账号发布公告，明确「相关综艺内容已与艺人无关」，呼吁粉丝不围观、不发酵、不参与讨论，把重心放回作品。", "en": "As of 15 November neither the producers of Her Detective Club 3 nor Mango TV had released an official cast list. A launch event in Changsha on 15 November was rumoured to feature Qi Wei, Li Yitong, Chen Haoyu, Li Xueqin, Tian Xiwei and Zhang Yifan, but the existing poster says only that the lineup depends on who attends. A recording lineup reported on 12 November listed Qi Wei, Chen Haoyu, Li Xueqin, Tian Xiwei, Zhang Yifan and Xu Mengjie, without Li Yitong — directly contradicting September's pitch deck and a 29 October report that named her as a regular. On 14 November Li Yitong's fan liaison account issued a notice stating that related variety content has nothing to do with the artist and asking fans not to spectate, amplify or discuss it, and to focus on her acting work.", "es": "Al 15 de noviembre ni la productora de Her Detective Club 3 ni Mango TV habían publicado el reparto oficial. Se rumoreaba que la presentación del 15 de noviembre en Changsha incluiría a Qi Wei, Li Yitong, Chen Haoyu, Li Xueqin, Tian Xiwei y Zhang Yifan, pero el cartel existente solo dice que el reparto depende de quién asista. Un reparto de grabación difundido el 12 de noviembre incluía a Qi Wei, Chen Haoyu, Li Xueqin, Tian Xiwei, Zhang Yifan y Xu Mengjie, sin Li Yitong, lo que contradice el dosier de septiembre y una información del 29 de octubre que la daba como fija. El 14 de noviembre la cuenta de enlace con los fans de Li Yitong emitió un aviso: el contenido del programa ya no tiene relación con la artista, y pidió no seguir, amplificar ni discutir el tema, y volver a centrarse en su trabajo.", "ja": "11 月 15 日時点で、『女子推理社 3』の制作側も芒果 TV も正式な出演者発表を行っていない。15 日に長沙で会見があり、戚薇、李一桐、陳昊宇、李雪琴、田曦薇、張芸凡が参加するとの噂があるが、既存のポスターは「当日出席の出演者による」としか記していない。12 日に報じられた初回収録の顔ぶれは戚薇、陳昊宇、李雪琴、田曦薇、張芸凡、徐夢潔で李一桐は含まれず、9 月の企画書や 10 月 29 日の情報で「レギュラー」とされていたことと真っ向から矛盾する。14 日、李一桐のファン窓口アカウントは「関連するバラエティ内容はすでに本人と無関係」とし、見守らず、拡散せず、議論しないよう呼びかけ、作品に目を戻すとした。"}, "why": {"zh": "一档综艺的阵容能在半个月里反复反转，说明招商承诺、录制档期与艺人合约这三张表从来没有对齐过——招商要名单，录制要人，合约要条款，任何一张变了，对外口径就得跟着改。粉丝对接账号替工作室「提前切割」，是这几年艺人与平台关系里越来越常见的自保动作：不确定的事，先划清界限。", "en": "A cast list that flips twice in a fortnight means three spreadsheets never lined up: the pitch deck needs names, the shooting schedule needs bodies, the contract needs clauses, and if any one changes the public line must follow. A fan liaison account drawing a line on the studio's behalf is an increasingly common self-protection move in artist-platform relations: when something is uncertain, distance yourself first.", "es": "Que un reparto cambie dos veces en quince días significa que tres hojas de cálculo nunca cuadraron: el dosier necesita nombres, el calendario de rodaje necesita personas, el contrato necesita cláusulas, y si una cambia, el discurso público debe seguirlo. Que una cuenta de enlace con los fans marque distancia por el estudio es un gesto de autoprotección cada vez más habitual: ante la incertidumbre, sepárate primero.", "ja": "半月で二転した出演者情報は、三つの表がかみ合っていなかったことを示す。企画書は名前を、収録日程は人を、契約は条項を必要とし、どれか一つが変われば対外説明も変わる。ファン窓口が事務所に代わって線を引くのは、この数年で増えた自衛の作法だ。不確かなことは、まず距離を置く。"}}, {"idx": "05", "title": {"zh": "《花千骨》作者的新剧今天中午开播：30 集，优酷独播", "en": "The author of The Journey of Flower returns: a 30-episode fantasy opens today on Youku", "es": "Vuelve la autora de The Journey of Flower: una fantasía de 30 episodios se estrena hoy en Youku", "ja": "『花千骨』原作者の新ドラマが今日正午に配信開始、全 30 話、優酷独占"}, "body": {"zh": "30 集古装奇幻爱情剧《十万狂花入梦来》定档 11 月 15 日 12:00 在优酷独播，孙珍妮、李宏毅领衔主演，原著作者为《花千骨》作者 Fresh 果果。剧情设定为：女主「鸭毛」本体是一株月见还阳草、化形为药灵，血能续命，为救师父误闯凄惶山、放出被囚的魔头岐凤殷；岐凤殷养了千年的灵花被她的血净化成种子、在她头上生根，人与花同命共生，杀人如麻的魔头就此变成替她照看头顶新绿的「园丁」。剧中另有万古大妖灵力低微、附身布偶等设定。", "en": "The 30-episode costume fantasy romance Ten Thousand Wild Flowers Bloom in Dreams premieres on Youku at noon on 15 November, starring Sun Zhenni and Li Hongyi and based on a novel by Fresh Guoguo, author of The Journey of Flower. The premise: the heroine Yamao is a herb spirit whose blood can extend life; trying to save her master she blunders into a forbidden mountain and frees the imprisoned demon Qifeng Yin. The spiritual flower he has tended for a thousand years is purified into a seed by her blood and takes root on her head, binding their lives together, so the mass murderer becomes a reluctant gardener fretting over the green shoots above her. A once-mighty demon reduced to possessing a rag doll is among the other conceits.", "es": "La fantasía romántica de época de 30 episodios Ten Thousand Wild Flowers Bloom in Dreams se estrena en Youku el 15 de noviembre a mediodía, protagonizada por Sun Zhenni y Li Hongyi y basada en una novela de Fresh Guoguo, autora de The Journey of Flower. La premisa: la heroína Yamao es un espíritu de hierba cuya sangre prolonga la vida; al intentar salvar a su maestro entra en una montaña prohibida y libera al demonio Qifeng Yin. La flor espiritual que él cuidó mil años queda purificada en semilla por la sangre de ella y arraiga en su cabeza, uniendo sus vidas, de modo que el asesino en serie se convierte en un jardinero reticente preocupado por los brotes. Un demonio antaño poderoso reducido a poseer un muñeco de trapo es otro de los hallazgos.", "ja": "全 30 話の時代劇ファンタジー恋愛ドラマ『十万狂花入夢来』が 11 月 15 日正午に優酷で独占配信開始。主演は孫珍妮と李宏毅、原作は『花千骨』の Fresh 果果。主人公「鴨毛」は月見還陽草の薬霊で、その血には命を延ばす力がある。師匠を救おうとして禁断の山に迷い込み、囚われていた魔頭・岐鳳殷を解き放ってしまう。千年育てた霊花が彼女の血で種に浄化され頭に根付き、人と花は運命を共にする。殺戮を重ねた魔頭は、頭上の新芽を気にする「庭師」へと変わる。かつての大妖が力を失い縫いぐるみに宿る、といった設定も用意されている。"}, "why": {"zh": "《花千骨》之后，这位作者的「离奇设定 + 宿命绑缚」配方已经被市场验证过一次。这次把「同命共生」做成核心关系，本质是把甜宠换成人质关系——两个人都不自由，反而更容易写出张力。能不能立住，看前五集观众愿不愿意接受这套规则：奇幻剧的失败几乎都发生在「世界观解释得太慢」上。", "en": "Since The Journey of Flower, this author's formula of outlandish premise plus fated entanglement has been market-tested once. Making shared fate the core relationship effectively swaps sweet romance for a hostage arrangement: neither party is free, which is easier to write tension into. Whether it holds depends on the first five episodes — fantasy dramas almost always fail by explaining their world too slowly.", "es": "Desde The Journey of Flower, la fórmula de premisa extravagante más vínculo fatídico de esta autora ya pasó una vez por el mercado. Convertir el destino compartido en la relación central sustituye el romance dulce por un rehén mutuo: ninguno es libre, y eso facilita la tensión. Que funcione depende de los cinco primeros episodios: las fantasías casi siempre fracasan por explicar su mundo demasiado despacio.", "ja": "『花千骨』以降、この作者の「奇抜な設定＋宿命的な結びつき」という処方は一度市場で検証されている。今回は「運命の共有」を中心に据え、甘い恋愛を人質関係に置き換えた。どちらも自由ではなく、だからこそ緊張を書きやすい。成否は最初の 5 話にかかっている。ファンタジードラマの失敗は、世界観の説明が遅すぎることにほぼ集約される。"}}]}], "risk": {"zh": "风险提示：本简报仅作信息汇总，其中涉及的数据不构成任何投资建议。", "en": "Risk notice: this briefing is an information summary only; the data mentioned does not constitute investment advice.", "es": "Aviso de riesgo: este boletín solo resume información; los datos mencionados no constituyen asesoramiento financiero.", "ja": "リスク提示：本ブリーフィングは情報の要約であり、記載のデータは投資助言ではありません。"}}/*__END__*/;

  /* ===== UI 文案（与内容分离，四语齐全） ===== */
  var I18N = {
    "zh": {
      "dateSub": "每日简报", "calBtn": "往期日历", "calFoot": "带圆点的日期可查看当日存档",
      "tag": "进展", "why": "看点：", "badge": "精 选",
      "calWeek": ["日", "一", "二", "三", "四", "五", "六"],
      "calTitle": function (y, m) { return y + " 年 " + m + " 月"; }
    },
    "en": {
      "dateSub": "DAILY BRIEFING", "calBtn": "Archive", "calFoot": "Dots mark dates with a saved issue",
      "tag": "UPDATE", "why": "Why: ", "badge": "EDITOR'S PICK",
      "calWeek": ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"],
      "calTitle": function (y, m) { return ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][m-1] + " " + y; }
    },
    "es": {
      "dateSub": "BOLETÍN DIARIO", "calBtn": "Archivo", "calFoot": "Los puntos marcan fechas con ejemplar guardado",
      "tag": "ACTUALIZACIÓN", "why": "Por qué: ", "badge": "DESTACADO",
      "calWeek": ["Dom", "Lun", "Mar", "Mié", "Jue", "Vie", "Sáb"],
      "calTitle": function (y, m) { return m + " · " + y; }
    },
    "ja": {
      "dateSub": "デイリーブリーフィング", "calBtn": "バックナンバー", "calFoot": "点のついた日付は保存された号があります",
      "tag": "続報", "why": "見どころ：", "badge": "特集",
      "calWeek": ["日", "月", "火", "水", "木", "金", "土"],
      "calTitle": function (y, m) { return y + "年" + m + "月"; }
    }
  };
  var LANGS = ["zh", "en", "es", "ja"];
  var LANG_LABEL = { "zh": "中文", "en": "EN", "es": "ES", "ja": "日本語" };
  var LANG_LABEL_FULL = { "zh": "中文", "en": "English", "es": "Español", "ja": "日本語" };
  var LANG_HTML = { "zh": "zh-CN", "en": "en", "es": "es", "ja": "ja" };

  // 小国旗（内联 SVG，避免外部图标依赖与 emoji 平台差异）
  function flag(lang) {
    if (lang === "zh") return '<svg class="fl" viewBox="0 0 30 20" aria-hidden="true"><rect width="30" height="20" fill="#de2910"/><g fill="#ffde00"><circle cx="5" cy="4" r="2.2"/><circle cx="9" cy="2.4" r="0.8"/><circle cx="10" cy="4" r="0.8"/><circle cx="9" cy="5.6" r="0.8"/><circle cx="7" cy="6.6" r="0.8"/></g></svg>';
    if (lang === "en") return '<svg class="fl" viewBox="0 0 30 20" aria-hidden="true"><rect width="30" height="20" fill="#012169"/><path d="M0 0L30 20M30 0L0 20" stroke="#fff" stroke-width="4"/><path d="M0 0L30 20M30 0L0 20" stroke="#c8102e" stroke-width="2"/><rect x="13" width="4" height="20" fill="#fff"/><rect y="8" width="30" height="4" fill="#fff"/><rect x="14" width="2" height="20" fill="#c8102e"/><rect y="9" width="30" height="2" fill="#c8102e"/></svg>';
    if (lang === "es") return '<svg class="fl" viewBox="0 0 30 20" aria-hidden="true"><rect width="30" height="20" fill="#aa151b"/><rect y="5" width="30" height="10" fill="#f1bf00"/></svg>';
    return '<svg class="fl" viewBox="0 0 30 20" aria-hidden="true"><rect width="30" height="20" fill="#fff"/><circle cx="15" cy="10" r="5.5" fill="#bc002d"/></svg>';
  }

  /* ===== 工具 ===== */
  function T(obj, lang) {
    if (obj == null) return "";
    if (typeof obj === "string") return obj;
    if (obj[lang] != null) return obj[lang];
    return obj.zh != null ? obj.zh : "";
  }
  function pad(n) { return n < 10 ? "0" + n : "" + n; }
  function bing(q) { return "https://www.bing.com/search?q=" + encodeURIComponent(q); }
  function fmtDate(d, lang) {
    var y = d.getFullYear(), m = d.getMonth() + 1, day = d.getDate();
    if (lang === "zh") return y + "." + pad(m) + "." + pad(day);
    if (lang === "ja") return y + "年" + m + "月" + day + "日";
    if (lang === "es") return day + " " + ["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"][m-1] + " " + y;
    return ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][m-1] + " " + day + ", " + y;
  }
  function esc(s) {
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }
  function titleHtml(titleObj, hlObj, lang) {
    var title = T(titleObj, lang);
    var hl = T(hlObj, lang);
    var inner = esc(title);
    if (hl && title.indexOf(hl) >= 0) {
      var i = title.indexOf(hl);
      inner = esc(title.slice(0, i)) + '<span class="hl">' + esc(hl) + "</span>" + esc(title.slice(i + hl.length));
    }
    return '<a class="lk" href="' + bing(title) + '" target="_blank" rel="noopener">' + inner + "</a>";
  }

  /* ===== 语言检测：localStorage > 浏览器语言 > 系统时区 > 中文 ===== */
  function detectLang() {
    try { var s = localStorage.getItem("timab_lang"); if (s && LANGS.indexOf(s) >= 0) return s; } catch (e) {}
    var nav = (navigator.language || "").toLowerCase();
    if (/^zh/.test(nav)) return "zh";
    if (/^ja/.test(nav)) return "ja";
    if (/^es/.test(nav)) return "es";
    if (/^en/.test(nav)) return "en";
    var tz = "";
    try { tz = Intl.DateTimeFormat().resolvedOptions().timeZone || ""; } catch (e) {}
    if (/^Asia\/Tokyo/.test(tz)) return "ja";
    if (/Europe\/Madrid|America\/(Mexico_City|Bogota|Lima|Santiago|Caracas|Guatemala|La_Paz|San_Jose|Panama|Asuncion|Montevideo|Havana|El_Salvador|Managua|Tegucigalpa|Costa_Rica|San_Salvador)|America\/Argentina\//.test(tz)) return "es";
    if (/^(Europe|America|Australia)\//.test(tz)) return "en";
    return "zh";
  }

  var curLang = "zh";
  var langOpen = false;

  /* ===== 渲染 ===== */
  function renderChrome(lang) {
    var i18n = I18N[lang];
    document.documentElement.lang = LANG_HTML[lang];
    // 报头信息行
    var metaEl = document.getElementById("metaRow");
    if (metaEl) metaEl.textContent = T(BRIEFING.meta, lang);
    // 大日期
    var md = document.getElementById("mastDate");
    if (md) {
      var d = new Date(BRIEFING.date + "T00:00:00");
      md.innerHTML = fmtDate(d, lang) + "<small>" + esc(i18n.dateSub) + "</small>";
    }
    // 文档标题
    var siteName = (lang === "zh") ? "提马早报" : "TIMAB DAILY";
    document.title = siteName + " · " + fmtDate(new Date(BRIEFING.date + "T00:00:00"), lang);
    // 导航签
    var nav = document.getElementById("navChips");
    if (nav) {
      var order = ["pick"].concat(BRIEFING.sections.map(function (s) { return s.key; }));
      nav.innerHTML = "";
      order.forEach(function (key) {
        if (key === "pick") {
          var a = document.createElement("a");
          a.className = "chip-pick"; a.href = "#pick"; a.setAttribute("data-nav", "pick");
          a.textContent = T(BRIEFING.spotlight.badge, lang);
          nav.appendChild(a);
        } else {
          var sec = null;
          BRIEFING.sections.forEach(function (s) { if (s.key === key) sec = s; });
          if (!sec) return;
          var b = document.createElement("a");
          b.href = "#" + key; b.setAttribute("data-nav", key);
          b.style.borderColor = sec.color; b.style.color = sec.deep;
          b.textContent = T(sec.name, lang);
          nav.appendChild(b);
        }
      });
    }
    // 日历文案
    var cb = document.getElementById("calBtnText"); if (cb) cb.textContent = i18n.calBtn;
    var cw = document.getElementById("calWeek");
    if (cw) { cw.innerHTML = ""; i18n.calWeek.forEach(function (w) { var s = document.createElement("span"); s.textContent = w; cw.appendChild(s); }); }
    var cf = document.getElementById("calFoot"); if (cf) cf.textContent = i18n.calFoot;
    // 语言切换器（国旗触发 + 下拉）
    var ls = document.getElementById("langSwitch");
    if (ls) {
      ls.className = "lang-switch" + (langOpen ? " open" : "");
      ls.innerHTML = "";
      var trig = document.createElement("button");
      trig.type = "button"; trig.className = "lang-trigger"; trig.id = "langTrigger";
      trig.setAttribute("aria-haspopup", "true");
      trig.setAttribute("aria-expanded", langOpen ? "true" : "false");
      trig.innerHTML = flag(curLang) + '<span class="caret">▾</span>';
      trig.addEventListener("click", function (e) {
        e.stopPropagation();
        langOpen = !langOpen;
        ls.classList.toggle("open", langOpen);
        trig.setAttribute("aria-expanded", langOpen ? "true" : "false");
      });
      ls.appendChild(trig);
      var menu = document.createElement("div");
      menu.className = "lang-menu"; menu.setAttribute("role", "menu");
      LANGS.forEach(function (l) {
        var item = document.createElement("button");
        item.type = "button"; item.className = "lang-item" + (l === curLang ? " sel" : "");
        item.setAttribute("role", "menuitem"); item.setAttribute("data-lang", l);
        item.innerHTML = flag(l) + '<span class="lbl">' + LANG_LABEL_FULL[l] + "</span>";
        item.addEventListener("click", function (e) {
          e.stopPropagation();
          setLang(l);
        });
        menu.appendChild(item);
      });
      ls.appendChild(menu);
    }
  }

  function renderContent(lang) {
    var i18n = I18N[lang];
    var html = "";
    // 精选
    var sp = BRIEFING.spotlight;
    html += '<section class="spotlight" id="pick">'
      + '<div class="badge"><i></i>' + esc(T(sp.badge, lang)) + "</div>"
      + "<h2>" + titleHtml(sp.title, sp.hl, lang) + "</h2>"
      + '<div class="body">' + esc(T(sp.body, lang)) + "</div>"
      + '<div class="why"><b>' + esc(i18n.why) + "</b>" + esc(T(sp.why, lang)) + "</div>"
      + "</section>";
    // 分类
    html += '<div class="grid">';
    BRIEFING.sections.forEach(function (sec) {
      html += '<section class="card" id="' + sec.key + '" style="--ac:' + sec.color + "; --ac-deep:" + sec.deep + ';">'
        + '<div class="sec-head"><span class="sec-num">' + sec.num + "</span>"
        + "<h3>" + esc(T(sec.name, lang)) + "</h3>"
        + '<span class="en">' + sec.key.toUpperCase() + "</span></div>";
      (sec.items || []).forEach(function (it) {
        html += '<div class="item">';
        html += '<div class="t"><span class="idx">' + it.idx + "</span>";
        if (it.tag) html += '<span class="tag">' + esc(it.tag[lang] != null ? it.tag[lang] : i18n.tag) + "</span>";
        html += titleHtml(it.title, it.hl, lang) + "</div>";
        html += '<div class="d">' + esc(T(it.body, lang)) + "</div>";
        html += '<div class="why"><b>' + esc(i18n.why) + "</b>" + esc(T(it.why, lang)) + "</div>";
        html += "</div>";
      });
      html += "</section>";
    });
    html += "</div>";
    var content = document.getElementById("content");
    if (content) content.innerHTML = html;
    // 页脚
    var risk = document.getElementById("risk");
    if (risk) risk.textContent = T(BRIEFING.risk, lang);
  }

  function setLang(lang) {
    if (LANGS.indexOf(lang) < 0) lang = "zh";
    curLang = lang;
    langOpen = false;
    try { localStorage.setItem("timab_lang", lang); } catch (e) {}
    renderChrome(lang);
    renderContent(lang);
  }

  /* ===== 往期日历（保留原逻辑，文案随语言） ===== */
  function initCalendar() {
    var btn = document.getElementById("calBtn");
    var pop = document.getElementById("calPop");
    var grid = document.getElementById("calGrid");
    var title = document.getElementById("calTitle");
    if (!btn || !pop || !grid || !title) return;

    var parts = BRIEFING.date.split("-");
    var todayKey = parts[0].slice(2) + parts[1] + parts[2];
    var cur = { y: +parts[0], m: +parts[1] };
    var has = {};
    for (var i = 0; i < ARCHIVE_DATES.length; i++) { has[ARCHIVE_DATES[i]] = 1; }
    var HIST_BASE = /\/history\//.test(location.pathname) ? "./" : "history/";

    function ckey(y, m, d) { return String(y).slice(2) + pad(m) + pad(d); }

    function render() {
      var i18n = I18N[curLang];
      title.textContent = i18n.calTitle(cur.y, cur.m);
      grid.innerHTML = "";
      var start = new Date(cur.y, cur.m - 1, 1).getDay();
      var days = new Date(cur.y, cur.m, 0).getDate();
      for (var b = 0; b < start; b++) {
        var blank = document.createElement("span");
        blank.className = "cal-cell is-empty"; grid.appendChild(blank);
      }
      for (var d = 1; d <= days; d++) {
        var k = ckey(cur.y, cur.m, d);
        var cell = document.createElement("span");
        cell.className = "cal-cell" + (has[k] ? " has" : "") + (k === todayKey ? " is-today" : "");
        cell.textContent = d;
        if (has[k]) {
          cell.setAttribute("role", "link"); cell.setAttribute("tabindex", "0");
          cell.title = cur.y + "-" + pad(cur.m) + "-" + pad(d) + " 存档";
          (function (target) {
            var go = function () { window.open(HIST_BASE + target + ".html", "_blank", "noopener"); };
            cell.addEventListener("click", go);
            cell.addEventListener("keydown", function (e) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); go(); } });
          })(k);
        }
        grid.appendChild(cell);
      }
    }
    function toggle(open) {
      pop.hidden = !open;
      btn.setAttribute("aria-expanded", open ? "true" : "false");
      if (open) render();
    }
    btn.addEventListener("click", function (e) { e.stopPropagation(); toggle(pop.hidden); });
    document.getElementById("calPrev").addEventListener("click", function () { cur.m--; if (cur.m < 1) { cur.m = 12; cur.y--; } render(); });
    document.getElementById("calNext").addEventListener("click", function () { cur.m++; if (cur.m > 12) { cur.m = 1; cur.y++; } render(); });
    document.addEventListener("click", function (e) { if (!pop.hidden && !pop.contains(e.target)) toggle(false); });
    document.addEventListener("keydown", function (e) { if (e.key === "Escape" && !pop.hidden) toggle(false); });
  }

  /* ===== 启动 ===== */
  function boot() {
    curLang = detectLang();
    renderChrome(curLang);
    renderContent(curLang);
    initCalendar();
    // 关闭语言下拉：点击外部 / Esc
    document.addEventListener("click", function (e) {
      var ls = document.getElementById("langSwitch");
      if (ls && langOpen && !ls.contains(e.target)) {
        langOpen = false;
        ls.classList.remove("open");
        var t = document.getElementById("langTrigger");
        if (t) t.setAttribute("aria-expanded", "false");
      }
    });
    document.addEventListener("keydown", function (e) {
      if (e.key === "Escape" && langOpen) {
        langOpen = false;
        var ls = document.getElementById("langSwitch");
        if (ls) ls.classList.remove("open");
        var t = document.getElementById("langTrigger");
        if (t) t.setAttribute("aria-expanded", "false");
      }
    });
  }
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", boot);
  } else { boot(); }
})();
</script>
