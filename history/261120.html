 de Jannik Sinner no mejora y viajará a Estados Unidos para una nueva evaluación, lo que pone en duda su presencia en el Abierto de Australia.", "ja": "11月19日未明、ATPファイナルズのイワン・レンドル組第2戦で、第2シードのアルカラスがメドベージェフに6-2、6-4で勝利。2戦全勝でセットを落とさず、連勝を11に伸ばして4強入りを確定した。グループ首位通過は2023年、2025年に続き3度目。同じ組のティアフォーがコボッリに7-6(6)、6-0で勝ったことで早期突破が決まった。2敗のコボッリは会見で涙を流した。また、シナーの膝の故障が回復せず、米国で再評価を受けるため、全豪オープンの出場は不透明となっている。"}, "why": {"zh": "前两次头名出线，阿尔卡拉斯都倒在最后一步：2023 年半决赛负德约，2025 年决赛负辛纳。今年他的小组赛干净得不寻常——对蒂亚福 69 分钟、对梅德韦德夫 72 分钟，一个破发点都没送出。真正的问号在第二盘初那次左大腿医疗暂停：赛季末的室内硬地，身体比状态更决定结果。", "en": "Both previous times he topped his group, Alcaraz fell at the last step: the 2023 semi-final to Djokovic, the 2025 final to Sinner. This year his group stage has been unusually clean — 69 minutes against Tiafoe, 72 against Medvedev, without conceding a break point. The real question mark is the medical timeout for his left thigh early in the second set: at the indoor hard-court end of the season, the body decides more than form.", "es": "Las dos veces anteriores que lideró su grupo, Alcaraz cayó en el último escalón: semifinal de 2023 ante Djokovic y final de 2025 ante Sinner. Este año su fase de grupos está siendo inusualmente limpia: 69 minutos ante Tiafoe, 72 ante Medvedev, sin ceder un solo punto de break. La duda real es el tiempo médico por su muslo izquierdo al inicio del segundo set: al final de la temporada en pista dura cubierta, el cuerpo decide más que la forma.", "ja": "過去2度のグループ首位通過はいずれも最後で敗れた。2023年は準決勝でジョコビッチ、2025年は決勝でシナーに敗れている。今季のグループステージは異常なほどクリーンだ。ティアフォー戦69分、メドベージェフ戦72分で、ブレークポイントを一つも与えていない。本当の疑問符は第2セット序盤の左太もものメディカルタイムアウトにある。シーズン終盤の室内ハードコートでは、調子より体が結果を決める。"}}, {"idx": "04", "title": {"zh": "勇士四连败：独行侠 116-94，弗拉格 33+5+9", "en": "Warriors lose a fourth straight: Mavericks win 116-94 behind Flagg's 33 points", "es": "Cuarta derrota seguida de los Warriors: Dallas gana 116-94 con 33 de Flagg", "ja": "ウォリアーズ4連敗、マーベリックスは116-94　フラッグ33得点"}, "body": {"zh": "11 月 19 日 NBA 常规赛，独行侠主场 116-94 击败勇士，终结自身三连败，同时送给勇士四连败。独行侠每节得分均高于对手，弗拉格砍下 33 分 5 篮板 9 助攻，华盛顿 21 分并命中 5 记三分，欧文 17 分 6 篮板 5 助攻；勇士方面理查德 20 分为全队最高，全队三分仅命中 9 记，对手命中 17 记。同日掘金 105-101 胜凯尔特人，火箭 119-104 胜步行者，太阳 128-107 胜国王。", "en": "In NBA action on 19 November, Dallas beat Golden State 116-94 at home, ending a three-game slide and handing the Warriors a fourth straight loss. The Mavericks outscored their visitors in every quarter: Cooper Flagg had 33 points, five rebounds and nine assists, P. J. Washington 21 with five threes, and Kyrie Irving 17 points, six rebounds and five assists. Richard led Golden State with 20, but the team made only nine threes against 17 for Dallas. Elsewhere Denver beat Boston 105-101, Houston beat Indiana 119-104 and Phoenix beat Sacramento 128-107.", "es": "En la NBA del 19 de noviembre, Dallas venció 116-94 en casa a Golden State, cortó una racha de tres derrotas y sumó la cuarta consecutiva de los Warriors. Los Mavericks superaron a su rival en cada cuarto: Cooper Flagg firmó 33 puntos, cinco rebotes y nueve asistencias; P. J. Washington 21 con cinco triples; Kyrie Irving 17 puntos, seis rebotes y cinco asistencias. Richard lideró a Golden State con 20, pero el equipo anotó solo nueve triples frente a 17 del rival. Denver ganó 105-101 a Boston, Houston 119-104 a Indiana y Phoenix 128-107 a Sacramento.", "ja": "11月19日のNBA、マーベリックスは本拠地でウォリアーズに116-94で勝利し、自身の3連敗を止めるとともにウォリアーズを4連敗に追い込んだ。マーベリックスは全てのクォーターで相手を上回り、フラッグが33得点5リバウンド9アシスト、ワシントンが21得点で3ポイント5本、アービングが17得点6リバウンド5アシスト。ウォリアーズはリチャードの20得点が最高で、3ポイントは9本にとどまり、相手は17本だった。同日、ナゲッツはセルティックスに105-101、ロケッツはペイサーズに119-104、サンズはキングスに128-107で勝利した。"}, "why": {"zh": "勇士的问题不在防守而在得分点：库里缺阵后，四节没有一节能拿到 30 分。独行侠则相反——三连败期间被诟病「只有单打」，这一场 4 人上双、17 记三分，靠的是转移球而不是手感。两支球队的差别，正好是「有没有第二个持球点」的差别。", "en": "Golden State's problem is not defence but scoring: without Stephen Curry, they failed to reach 30 points in any quarter. Dallas is the mirror image — criticised during its three-game slide for isolation-heavy play, it produced four double-figure scorers and 17 threes on ball movement rather than hot shooting. The gap between the two teams is precisely whether a second creator exists.", "es": "El problema de Golden State no es la defensa sino el anotar: sin Stephen Curry no llegó a 30 puntos en ningún cuarto. Dallas es el espejo: criticado por abusar del uno contra uno en su racha de tres derrotas, esta vez tuvo cuatro anotadores de dos dígitos y 17 triples gracias al movimiento de balón, no a la muñeca. La diferencia entre ambos es exactamente si existe un segundo creador.", "ja": "ウォリアーズの問題は守備ではなく得点にある。カリー不在ではどのクォーターも30点に届かなかった。マーベリックスは正反対だ。3連敗中は「アイソレーション頼み」と批判されたが、この試合は4人が2桁得点、3ポイント17本を球の移動で生んだ。両者の差は、まさに「第2のクリエイターがいるかどうか」だ。"}}, {"idx": "05", "title": {"zh": "丁俊晖 0-2 落后连赢四局，德国大师赛资格赛过关", "en": "Ding Junhui wins four straight from 0-2 down to qualify for the German Masters", "es": "Ding Junhui gana cuatro seguidas desde 0-2 y se clasifica para el German Masters", "ja": "丁俊暉、0-2から4連取でジャーマン・マスターズ予選突破"}, "body": {"zh": "斯诺克德国大师赛资格赛，丁俊晖在先丢两局的情况下连赢四局，以 5-3 逆转晋级正赛。同日周跃龙、斯佳辉也分别取胜过关。德国大师赛正赛将于明年 1 月在柏林举行。", "en": "In German Masters qualifying, Ding Junhui lost the first two frames and then won four in a row to come through 5-3 and reach the main draw. Zhou Yuelong and Si Jiahui also won their qualifying matches the same day. The German Masters main event is played in Berlin in January.", "es": "En la fase previa del German Masters, Ding Junhui perdió las dos primeras mangas y ganó cuatro seguidas para imponerse 5-3 y clasificarse. Zhou Yuelong y Si Jiahui también ganaron sus partidos ese mismo día. El cuadro principal se disputa en Berlín en enero.", "ja": "スヌーカーのジャーマン・マスターズ予選で、丁俊暉は最初の2フレームを落とした後に4連取し、5-3で逆転して本戦出場を決めた。同日、周躍龍と斯佳輝もそれぞれ勝利した。本戦は来年1月にベルリンで行われる。"}, "why": {"zh": "资格赛分量不大，但「0-2 之后连赢四局」这种赢法对丁俊晖有意义——本赛季他的排名压力不小，正赛席位直接关系到赛季末的巡回锦标赛资格。能在落后时把局面收回来，比一场 5-0 更实用。", "en": "Qualifying carries little prestige, but winning four frames in a row from 0-2 matters for Ding: he is under ranking pressure this season, and a main-draw place feeds directly into the Tour Championship race. Recovering a deficit is more useful to him right now than a 5-0 win.", "es": "La fase previa tiene poco prestigio, pero ganar cuatro mangas seguidas desde 0-2 importa para Ding: esta temporada tiene presión de ranking y un puesto en el cuadro principal alimenta directamente la carrera por el Tour Championship. Remontar le sirve más ahora que un 5-0.", "ja": "予選に格別の価値はないが、0-2から4連取という勝ち方は丁俊暉にとって意味がある。今季はランキング面の圧力が大きく、本戦出場はシーズン末のツアー選手権争いに直結する。今の彼には5-0より、劣勢を立て直す勝ち方のほうが実用的だ。"}}]}, {"key": "hot", "num": "05", "color": "#6d28d9", "deep": "#55209f", "name": {"zh": "网络热点", "en": "Trending", "es": "Tendencias", "ja": "ネット"}, "items": [{"idx": "01", "title": {"zh": "GTA6 首日 1707 万份、17 亿美元，Metacritic 99 分", "en": "GTA VI sells 17.07 million copies and $1.65 billion on day one, with a 99 on Metacritic", "es": "GTA VI vende 17,07 millones de copias y 1.650 millones de dólares el primer día, con un 99 en Metacritic", "ja": "GTA6 初日1707万本・16.5億ドル、Metacritic は99点"}, "body": {"zh": "11 月 19 日，《侠盗猎车手 VI》在 PS5 与 Xbox Series X|S 发售。据 Sensor Tower 统计，首日销量 1707 万份，其中 PlayStation 平台约占 75%、Xbox 约 25%，首日收入超过 16.5 亿美元。Metacritic 收录 170 家媒体评测，均分 99 分，追平 1998 年《塞尔达传说：时之笛》的历史最高分，并获「必玩」认证。受此提振，索尼股价在东京市场逆势收涨近 3% 至 4363 日元。国内「GTA6」「GTA6画质」双双登上微博热搜，玩家对画面细节与主机帧数的取舍争论激烈。PC 版计划 2027 年推出。", "en": "Grand Theft Auto VI launched on PS5 and Xbox Series X|S on 19 November. Sensor Tower put first-day sales at 17.07 million copies — about 75% on PlayStation and 25% on Xbox — with revenue above $1.65 billion. Metacritic logged 170 reviews for an average of 99, matching The Legend of Zelda: Ocarina of Time from 1998 as the highest score on record, with a Must-Play badge. Sony shares rose nearly 3% to 4,363 yen in Tokyo against a weak tech tape. In China, GTA6 and GTA6 graphics both trended on Weibo, with players arguing over visual detail versus frame rates on consoles. A PC version is planned for 2027.", "es": "Grand Theft Auto VI salió el 19 de noviembre para PS5 y Xbox Series X|S. Sensor Tower cifró las ventas del primer día en 17,07 millones de copias —un 75 % en PlayStation y un 25 % en Xbox— con ingresos superiores a 1.650 millones de dólares. Metacritic registró 170 análisis con una media de 99, igualando el máximo histórico de The Legend of Zelda: Ocarina of Time (1998), con la etiqueta Must-Play. Sony subió casi un 3 % hasta 4.363 yenes en Tokio pese a la debilidad tecnológica. En China, GTA6 y la calidad gráfica de GTA6 fueron tendencia en Weibo, con debate sobre detalle visual frente a tasa de fotogramas. La versión para PC llegará en 2027.", "ja": "11月19日、『グランド・セフト・オートVI』がPS5とXbox Series X|Sで発売された。Sensor Towerの集計では初日1707万本、うちPlayStationが約75％、Xboxが約25％で、売上は16.5億ドル超。Metacriticには170媒体のレビューが集まり平均99点で、1998年の『ゼルダの伝説 時のオカリナ』の歴代最高点に並び、「Must-Play」認定を受けた。これを受けてソニー株は東京市場で逆行高となり、3％近く上げて4,363円。中国では「GTA6」「GTA6画質」がWeiboのトレンドに入り、描画の細部とフレームレートのトレードオフをめぐって議論が起きた。PC版は2027年発売予定。"}, "why": {"zh": "1707 万份意味着首日就超过了大多数 3A 作品的终身销量；99 分意味着它已经不在「好不好玩」的评价体系里。更有意思的是平台结构：75% 落在 PlayStation，而 PS5 在售机型八成以上是数字版——索尼抽成的是软件而不是硬件。这正是主机厂商最想要的那种「准独占红利」，哪怕它并非独占。", "en": "17 million copies means day one beat the lifetime sales of most AAA titles; a 99 means the game has left the is-it-fun scale altogether. The platform split is the more interesting number: 75% on PlayStation, where more than 80% of PS5 units sold are digital-only, so Sony takes a cut of software rather than hardware. That is the near-exclusive dividend console makers want, even without exclusivity.", "es": "17 millones significa que el primer día superó las ventas de por vida de la mayoría de los AAA; un 99 significa que el juego ya salió de la escala de «¿es divertido?». Lo más interesante es el reparto por plataforma: 75 % en PlayStation, donde más del 80 % de las PS5 vendidas son solo digitales, de modo que Sony cobra sobre software y no sobre hardware. Es el dividendo cuasi exclusivo que buscan los fabricantes, incluso sin exclusividad.", "ja": "1707万本は、多くのAAAタイトルの生涯販売本数を初日で超えたという意味だ。99点は「面白いか」という評価軸の外に出たということでもある。より興味深いのはプラットフォーム構成で、75％がPlayStation。販売中のPS5の8割以上がディスクレスモデルであり、ソニーはハードではなくソフトから取り分を得る。独占でなくても得られる「準独占の配当」だ。"}}, {"idx": "02", "title": {"zh": "赵本山把 AI 偷走的声音，自己唱了回来", "en": "Zhao Benshan sang back the voice AI had taken", "es": "Zhao Benshan recuperó cantando la voz que la IA le había tomado", "ja": "趙本山が、AIに奪われた声を自分で歌い返した"}, "body": {"zh": "11 月 19 日，「赵本山慌啥子嘛为什么能击中年轻人」登上热搜。这首川渝小调原由「困困羊」作词作曲，此前因网友用 AI 合成赵本山声线翻唱而走红。赵本山团队没有发律师函，而是联系原作者买下版权，69 岁的他进棚逐句真唱。歌曲 11 月 13 日上线，据报道两小时播放量超千万、三小时点赞破百万。评论区里有人说「小时候他逗我笑，长大了他哄我别哭」。", "en": "On 19 November the question of why Zhao Benshan's song Huang Shazi Ma resonates with young people trended on Weibo. The Sichuan-Chongqing folk tune was written by Kun Kun Yang and went viral after users cloned Zhao's voice with AI. Rather than send legal letters, his team bought the rights from the songwriter, and the 69-year-old recorded every line himself. Released on 13 November, the track reportedly passed ten million plays in two hours and a million likes in three. One comment read: he made me laugh as a child, and now he tells me not to cry.", "es": "El 19 de noviembre fue tendencia la pregunta de por qué la canción de Zhao Benshan Huang Shazi Ma conmueve a los jóvenes. La tonada de Sichuan y Chongqing, compuesta por Kun Kun Yang, se hizo viral cuando usuarios clonaron la voz de Zhao con IA. En lugar de enviar cartas legales, su equipo compró los derechos al autor y el artista, de 69 años, grabó cada línea él mismo. Publicada el 13 de noviembre, habría superado los diez millones de reproducciones en dos horas y el millón de me gusta en tres. Un comentario decía: de niño me hacía reír, ahora me dice que no llore.", "ja": "11月19日、「趙本山の『慌啥子嘛』はなぜ若者に刺さるのか」がトレンド入りした。四川・重慶の民謡調で、作詞作曲は「困困羊」。ネット上でAIが趙本山の声を合成して歌わせたことから広がった。弁護士通知ではなく、チームは原作者から権利を買い取り、69歳の本人が一節ずつ歌い直した。11月13日公開で、2時間で再生1,000万回、3時間でいいね100万を超えたと報じられた。コメント欄には「子どもの頃は笑わせてくれた、大人になった今は泣くなと言ってくれる」という言葉があった。"}, "why": {"zh": "这是一次罕见的 AI 侵权处理样本：不打官司、不索赔，用买版权加真人重录，把作品拿回自己手里。它同时解决了两件事——原作者拿到了授权收入，被合成的声音有了合法版本。比任何一份声明都更有说服力的，是那句「慌啥子嘛，慢慢来」由本人唱出来。", "en": "This is a rare template for handling AI infringement: no lawsuit, no damages claim, but buying the rights and re-recording in person to take the work back. It solves two things at once — the songwriter gets licensing income, and the cloned voice gets a legitimate version. More persuasive than any statement is hearing the line don't panic, take it slow from the man himself.", "es": "Es un modelo poco frecuente para afrontar una infracción de IA: sin demanda ni indemnización, comprando los derechos y regrabando en persona para recuperar la obra. Resuelve dos cosas a la vez: el autor cobra licencia y la voz clonada tiene una versión legítima. Más convincente que cualquier comunicado es escuchar «no te apures, despacio» en la voz del propio intérprete.", "ja": "AIによる権利侵害への珍しい処理例だ。訴訟も賠償請求もせず、権利を買って本人が歌い直すことで作品を取り戻した。原作者には許諾収入が入り、合成された声には正規版が生まれた。どんな声明より説得力があるのは、「慌てるな、ゆっくりでいい」という一節を本人が歌っていることだ。"}}, {"idx": "03", "title": {"zh": "邓亚萍晒 13 张合照，和一诺同框被称「两大魔王」", "en": "Deng Yaping posts 13 photos, and her frame with Yinuo becomes two big bosses in one picture", "es": "Deng Yaping publica 13 fotos y su imagen con Yinuo se bautiza como «dos grandes jefas»", "ja": "鄧亜萍が13枚の写真を投稿、一諾との共演が「二人の大魔王」と話題に"}, "body": {"zh": "11 月 19 日，2026 微博竞燃之夜举行，乒乓球大满贯得主邓亚萍出席，并与一诺、无畏等电竞选手同台。当晚邓亚萍在微博晒出 13 张合照，配文「又是一年和老朋友新朋友小朋友们相聚」，照片中还有体操奥运冠军李小鹏、张博恒，举重奥运冠军李雯雯，短道速滑奥运冠军林孝埈等。网友把这次同框概括为「两大魔王跨圈相聚」——今年 9 月名古屋亚运会电竞决赛后，邓亚萍曾发视频祝贺一诺卫冕，一诺在评论区回复「谢谢亚萍姐」。", "en": "The 2026 Weibo esports and sports gala was held on 19 November, with table tennis grand slam winner Deng Yaping on stage alongside esports players including Yinuo and Wuwei. That evening Deng posted 13 photos captioned another year with old friends, new friends and little friends, including gymnasts Li Xiaopeng and Zhang Boheng, weightlifter Li Wenwen and short-track skater Lin Xiaojun. Netizens summed up her frame with Yinuo as two big bosses meeting across disciplines — after the esports final at the Nagoya Asian Games in September, Deng had sent a video congratulating Yinuo on defending his title, and he replied with thanks.", "es": "La gala de deportes y esports de Weibo 2026 se celebró el 19 de noviembre, con la campeona de tenis de mesa Deng Yaping junto a jugadores de esports como Yinuo y Wuwei. Esa noche Deng publicó 13 fotos con el texto «otro año con viejos amigos, nuevos amigos y amigos pequeños», entre ellas con los gimnastas Li Xiaopeng y Zhang Boheng, la halterófila Li Wenwen y el patinador Lin Xiaojun. Los usuarios resumieron su imagen con Yinuo como «dos grandes jefas que se encuentran entre disciplinas»: tras la final de esports de los Juegos Asiáticos de Nagoya en septiembre, Deng felicitó a Yinuo por videomensaje y él le dio las gracias.", "ja": "11月19日、2026 Weibo競燃之夜が開かれ、卓球グランドスラム達成者の鄧亜萍氏が登壇し、一諾や無畏らeスポーツ選手と共演した。同日夜、鄧氏は「今年も旧友、新しい友達、子どもたちと集まった」と添えて13枚の写真を投稿。体操五輪金メダリストの李小鵬、張博恒、重量挙げの李雯雯、ショートトラックの林孝埈らも写っている。ネットでは「二人の大魔王のクロス共演」とまとめられた。9月の名古屋アジア大会eスポーツ決勝後、鄧氏が一諾の連覇を祝う動画を送り、一諾が「亜萍姉さん、ありがとう」と返した経緯がある。"}, "why": {"zh": "传统体育与电竞的「破圈」，过去多是商业活动上的合影；这次被反复提起，是因为两人在各自项目里都有「统治级」标签，同框自带比较的意味。更有价值的信号是前辈的态度——邓亚萍的关注从一条祝贺视频延续到线下合照，这种认可对电竞的职业化叙事比任何宣传都管用。", "en": "Crossovers between traditional sport and esports usually mean a photo op at a commercial event. This one kept being discussed because both carry a dominant-player label, so the frame invites comparison. The more valuable signal is the senior figure's attitude: Deng's attention moved from a congratulatory video to a photo taken in person, and that kind of recognition does more for the professionalisation narrative of esports than any campaign.", "es": "Los cruces entre deporte tradicional y esports suelen ser una foto en un acto comercial. Este se comentó porque ambos cargan la etiqueta de dominadores, y la imagen invita a comparar. La señal más valiosa es la actitud de la veterana: la atención de Deng pasó de un vídeo de felicitación a una foto en persona, y ese reconocimiento hace más por la narrativa de profesionalización de los esports que cualquier campaña.", "ja": "伝統スポーツとeスポーツのクロスオーバーは、これまで商業イベントでの記念撮影が多かった。今回繰り返し語られたのは、両者がそれぞれの競技で「圧倒的」という看板を持つため、並ぶだけで比較の意味が生まれるからだ。より価値のあるシグナルは先輩の姿勢だ。鄧氏の関心は祝福動画から対面の写真へ続いた。この種の承認は、eスポーツの職業化の物語にとってどんな宣伝より効く。"}}, {"idx": "04", "tag": {"zh": "进展"}, "title": {"zh": "蔡国庆回应走秀摔倒：我一切都好", "en": "Cai Guoqing on his runway fall: I am perfectly fine", "es": "Cai Guoqing sobre su caída en la pasarela: estoy perfectamente", "ja": "蔡国慶、ランウェイでの転倒に「すべて大丈夫」"}, "body": {"zh": "11 月 19 日上午，蔡国庆发文回应前一日走秀摔倒：「来看儿子走秀很开心，我一切都好，真诚的感谢大家的关心。」11 月 18 日晚，某品牌「雪落」大秀在北京举行，T 台为营造雪境铺满白色羽毛与泡沫，58 岁的蔡国庆行走中扑倒，工作人员第一时间护住头部并将其扶起；被扶起后他走路不稳、一直用手捂着腹部，但摆手示意不用紧张，坚持走完后续台步并看完整场秀。当晚「蔡国庆摔了」登上热搜，谢娜、周迅、李斯丹妮、谭晶等在场艺人上前搀扶或帮忙清理羽毛。此行他是陪 8 岁的小儿子走秀。", "en": "On the morning of 19 November, Cai Guoqing responded to his fall on a runway the previous evening: watching my son walk the show made me happy, I am perfectly fine, and thank you all sincerely for caring. At a brand show in Beijing on the evening of 18 November the catwalk was covered in white feathers and foam to create a snow scene; the 58-year-old stumbled and fell, staff shielded his head and helped him up. He walked unsteadily and kept a hand over his abdomen but waved off concern, finished his walk and stayed for the whole show. That night the fall trended on Weibo, with Xie Na, Zhou Xun, Li Sidanni and Tan Jing among those who helped him up or brushed off feathers. He had come to accompany his eight-year-old son.", "es": "En la mañana del 19 de noviembre, Cai Guoqing respondió a su caída en una pasarela la noche anterior: «ver desfilar a mi hijo me hizo feliz, estoy perfectamente y agradezco de corazón el interés». En un desfile en Pekín la noche del 18, la pasarela se cubrió de plumas blancas y espuma para simular nieve; el artista de 58 años tropezó y cayó, el personal le protegió la cabeza y lo ayudó a levantarse. Caminó inestable y se cubrió el abdomen con la mano, pero restó importancia, terminó su recorrido y se quedó todo el desfile. Esa noche la caída fue tendencia en Weibo y Xie Na, Zhou Xun, Li Sidanni y Tan Jing estuvieron entre quienes lo ayudaron. Había ido a acompañar a su hijo de ocho años.", "ja": "11月19日午前、蔡国慶は前夜のランウェイでの転倒について「息子のランウェイを見られて嬉しかった。私はすべて大丈夫です。心配してくれて本当にありがとう」と投稿した。18日夜、北京でのブランドショーで、雪の演出のためにランウェイに白い羽根とフォームが敷かれ、58歳の蔡国慶は歩行中に転倒。スタッフが頭を守って起こした。立ち上がった後も足元は不安定で腹部を手で押さえていたが、心配はいらないと手を振り、残りのウォーキングを務め、ショーを最後まで見届けた。同日夜「蔡国慶が転んだ」がトレンド入りし、謝娜、周迅、李斯丹妮、譚晶らが駆け寄って支えた。8歳の次男の付き添いで来ていた。"}, "why": {"zh": "回应只有一句「我一切都好」，没提疼不疼，也没指向主办方——这种处理在当下的舆论场里反而少见。事件真正的公共价值在舞台安全：为营造雪境在 T 台铺羽毛与泡沫，视觉效果与行走安全之间的取舍，主办方该有一份可执行的规范。", "en": "The response was one line: I am fine. No mention of pain, no finger pointed at the organiser — an unusual restraint in today's comment cycle. The real public value is stage safety: covering a catwalk in feathers and foam for a snow effect forces a trade-off between visuals and footing, and organisers should have an enforceable standard for it.", "es": "La respuesta fue una línea: estoy bien. Sin hablar de dolor ni señalar al organizador, una contención poco habitual en el ciclo de comentarios actual. El valor público real está en la seguridad escénica: cubrir una pasarela de plumas y espuma por un efecto de nieve obliga a elegir entre estética y estabilidad, y los organizadores deberían tener una norma exigible.", "ja": "返答は「大丈夫です」の一言だけ。痛みにも触れず、主催者にも矛先を向けていない。今の言論空間ではむしろ珍しい抑制だ。本当の公共的価値は舞台の安全にある。雪の演出のためにランウェイに羽根とフォームを敷くことは、見た目と足元の安全の取舍を迫る。主催者には実行可能な基準が必要だ。"}}, {"idx": "05", "title": {"zh": "长白山站扫雪，成了南方游客的「必玩项目」", "en": "Sweeping snow at Changbaishan station becomes a must-do for southern visitors", "es": "Barrer la nieve en la estación de Changbaishan, plan obligado para los visitantes del sur", "ja": "長白山駅の雪かきが、南方からの観光客の「必須体験」に"}, "body": {"zh": "近日吉林长白山站，刚下火车的南方游客在站前扫雪、玩雪，被当地媒体形容为「必玩项目」。同期强冷空气南下，11 月 19 日 20 时至 20 日 20 时，内蒙古中东部、黑龙江中东部、山东半岛等地有小到中雪或雨夹雪，黑龙江东北部、山东半岛局地有大雪或暴雪；黄淮、江淮、江南等地普遍降温 6 至 10℃，局地超过 12℃，北方或全面入冬。中央气象台提醒关注道路结冰与大风影响。", "en": "At Changbaishan station in Jilin in recent days, southern visitors who had just stepped off the train were sweeping and playing with snow on the forecourt, which local media dubbed a must-do activity. A strong cold front is meanwhile pushing south: from 20:00 on 19 November to 20:00 on 20 November, parts of central and eastern Inner Mongolia, eastern Heilongjiang and the Shandong peninsula expect light to moderate snow or sleet, with heavy snow locally in northeastern Heilongjiang and on the Shandong peninsula. Huang-Huai, Jiang-Huai and Jiangnan areas are cooling by 6-10 degrees Celsius, locally more than 12, and the north may enter winter proper.", "es": "En los últimos días, en la estación de Changbaishan (Jilin), visitantes del sur recién bajados del tren barrieron y jugaron con la nieve en el exterior, algo que los medios locales llamaron actividad obligada. Mientras tanto, un frente frío intenso avanza hacia el sur: del 19 de noviembre a las 20:00 al 20 a las 20:00 se esperan nieve débil o moderada y aguanieve en el centro-este de Mongolia Interior, el este de Heilongjiang y la península de Shandong, con nieve fuerte local en el noreste de Heilongjiang y Shandong. Huang-Huai, Jiang-Huai y Jiangnan bajan 6-10 grados, localmente más de 12, y el norte podría entrar en invierno pleno.", "ja": "吉林省の長白山駅ではこのところ、列車を降りた南方からの観光客が駅前で雪かきや雪遊びをし、地元メディアが「必須の体験」と表現した。同時に強い寒気が南下し、11月19日20時から20日20時にかけて、内蒙古中東部、黒竜江中東部、山東半島などで弱い雪からやや強い雪、またはみぞれが降る見込み。黒竜江東北部と山東半島の一部では大雪や暴雪のおそれ。黄淮、江淮、江南では6〜10度、局地的に12度以上気温が下がり、北方は本格的な冬入りとなる可能性がある。"}, "why": {"zh": "一条轻新闻，却准确描述了今年冬天的一个消费侧变化：冰雪不再是东北的目的地专属，而是「到达即体验」。对地方来说，这意味着车站、街区这些「非景区空间」也开始承担旅游功能——雪要不要留、留多少、怎么保证安全，都是新问题。", "en": "A light item that captures a real shift on the consumption side: ice and snow is no longer confined to designated destinations in the northeast but begins the moment you arrive. For local authorities it means stations and streets — non-scenic spaces — now carry tourism functions, raising new questions about how much snow to leave, and how to keep it safe.", "es": "Una noticia ligera que describe un cambio real en el consumo: la nieve ya no pertenece solo a los destinos del noreste, sino que empieza al bajar del tren. Para las autoridades locales, estaciones y calles —espacios no turísticos— asumen funciones turísticas, lo que plantea cuánta nieve dejar y cómo garantizar la seguridad.", "ja": "軽い話題だが、今冬の消費側の変化を正確に捉えている。雪と氷はもはや東北の目的地だけのものではなく、「着いた瞬間から体験」になっている。地方政府にとっては、駅や街区という「非観光空間」が観光機能を担い始めることを意味し、雪をどれだけ残すか、安全をどう確保するかという新しい課題が生じる。"}}]}, {"key": "ent", "num": "06", "color": "#db2777", "deep": "#b01d5f", "name": {"zh": "娱乐八卦", "en": "Entertainment", "es": "Celebridades", "ja": "エンタメ"}, "items": [{"idx": "01", "title": {"zh": "液氧乐队主唱张宇病逝，48 岁", "en": "Zhang Yu, frontman of Liquid Oxygen, dies at 48", "es": "Muere a los 48 años Zhang Yu, vocalista de Liquid Oxygen", "ja": "中国のニューメタルバンド「液体酸素缶」のボーカル、張宇さん死去　48歳"}, "body": {"zh": "11 月 19 日，液氧乐队发布讣告：主唱张宇因病医治无效，于 2026 年 11 月 19 日在鞍山逝世，享年 48 岁。遗体告别仪式定于 11 月 21 日上午在鞍山市殡仪管理服务中心举行。张宇生于辽宁鞍山，1996 年开始学贝斯，1998 年在鞍山组建乐队，2002 年 8 月加入液氧罐头任主唱。乐队把中国大鼓、汽油桶、扎啤桶带进新金属，2004 年获北京朝阳音乐周「最佳乐队」，2005 年发行首张专辑《这一切变化无常》，收录《观念》《砸碎》《灰、蓝色》等作品，2008 年发行 EP《誓言》并完成 35 城巡演。二手玫瑰主唱梁龙发文悼念。", "en": "Liquid Oxygen announced on 19 November that frontman Zhang Yu died in Anshan on the same day after treatment failed, aged 48. A farewell ceremony is set for the morning of 21 November in Anshan. Born in Anshan, Liaoning, Zhang began learning bass in 1996, formed a band there in 1998 and joined Liquid Oxygen as vocalist in August 2002. The band brought Chinese drums, petrol cans and beer barrels into nu-metal, won best band at the Beijing Chaoyang Music Week in 2004, released its debut album in 2005 with tracks including Concept, Smash and Grey, Blue, and put out the EP Oath in 2008 alongside a 35-city tour. Liang Long of Second Hand Rose posted a tribute.", "es": "Liquid Oxygen anunció el 19 de noviembre la muerte de su vocalista Zhang Yu ese mismo día en Anshan, a los 48 años, tras no superar la enfermedad. El velatorio se celebrará en la mañana del 21 de noviembre en Anshan. Nacido en Anshan (Liaoning), Zhang empezó a estudiar bajo en 1996, formó una banda allí en 1998 y se unió a Liquid Oxygen como vocalista en agosto de 2002. El grupo llevó tambores chinos, bidones de gasolina y barriles de cerveza al nu-metal, ganó el premio a mejor banda en la Semana Musical de Chaoyang de Pekín en 2004, publicó su debut en 2005 con temas como Concepto y Destroza, y el EP Juramento en 2008 junto a una gira por 35 ciudades. Liang Long, de Second Hand Rose, publicó un homenaje.", "ja": "11月19日、ニューメタルバンド「液体酸素缶」は、ボーカルの張宇さんが同日、病気の治療の甲斐なく鞍山で死去したと発表した。48歳。告別式は11月21日午前に鞍山で行われる。遼寧省鞍山生まれの張さんは1996年にベースを始め、1998年に地元でバンドを結成、2002年8月に液体酸素缶にボーカルとして加入した。中国の大太鼓、ガソリンドラム、ビール樽をニューメタルに持ち込み、2004年に北京朝陽音楽週間で最優秀バンド賞、2005年に1stアルバム『這一切変化無常』を発表。2008年にはEP『誓言』と35都市ツアーを行った。セカンドハンド・ローズの梁龍が追悼の言葉を寄せた。"}, "why": {"zh": "液氧罐头是北京地下重型音乐里绕不开的一支——他们把民乐打击乐和工业噪声音色放进新金属，让「重」有了中国式的节奏骨架。张宇的嗓音是那套体系里最锋利的部分。48 岁，对一支仍在演出的乐队来说太早了。", "en": "Liquid Oxygen is unavoidable in any account of Beijing's underground heavy scene: they put Chinese percussion and industrial noise into nu-metal and gave heaviness a Chinese rhythmic skeleton. Zhang's voice was the sharpest element in that system. Forty-eight is too early for a band still playing live.", "es": "Liquid Oxygen es ineludible en la escena pesada underground de Pekín: metieron percusión china y ruido industrial en el nu-metal y dieron a la pesadez un esqueleto rítmico chino. La voz de Zhang era la parte más afilada de ese sistema. Cuarenta y ocho años es demasiado pronto para una banda que seguía tocando.", "ja": "液体酸素缶は北京のアンダーグラウンド・ヘヴィ・シーンで避けて通れない存在だ。中国の打楽器と工業的なノイズをニューメタルに持ち込み、「重さ」に中国的なリズムの骨格を与えた。張さんの声はその体系で最も鋭い部分だった。まだ演奏を続けるバンドにとって、48歳は早すぎる。"}}, {"idx": "02", "title": {"zh": "《繁华落尽》第二季开播：主角第一集就进了监狱", "en": "Fanhua Luojin season two opens with its lead in prison", "es": "La segunda temporada de Fanhua Luojin arranca con su protagonista en prisión", "ja": "『繁華落尽』シーズン2開幕、主人公は第1話で刑務所へ"}, "body": {"zh": "11 月 19 日 12 时，《繁华落尽》第二季在腾讯视频开播。第二季把舞台从夜场搬到监狱：金瀚饰演的图嘉盛主动投案、被判终身监禁，入狱寻找藏身十六年的「老鬼」（果靖霖饰），并与女狱警夏雨嫣（童苡萱饰）形成利益同盟；墙外，周峻纬饰演的赵陆以灰西装形象进入商界与政界。第一季今年 1 月 30 日上线，分账票房 3200 万元。", "en": "Season two of Fanhua Luojin launched on Tencent Video at noon on 19 November. The stage moves from nightlife to prison: Jin Han's Tu Jiasheng turns himself in, is sentenced to life and goes inside to find Laogui, played by Guo Jinglin, who has been hiding for sixteen years; he also forms an alliance of convenience with a female guard, Xia Yuyan, played by Tong Yixuan. Outside, Zhou Junwei's Zhao Lu moves into business and politics in a grey suit. Season one launched on 30 January this year and took 32 million yuan in revenue sharing.", "es": "La segunda temporada de Fanhua Luojin se estrenó en Tencent Video al mediodía del 19 de noviembre. El escenario pasa de la noche a la cárcel: Tu Jiasheng, interpretado por Jin Han, se entrega, es condenado a cadena perpetua y entra para encontrar a Laogui (Guo Jinglin), oculto desde hace dieciséis años; además pacta con una funcionaria de prisión, Xia Yuyan (Tong Yixuan). Fuera, Zhao Lu (Zhou Junwei) entra en los negocios y la política con traje gris. La primera temporada se estrenó el 30 de enero y recaudó 32 millones de yuanes en reparto de ingresos.", "ja": "11月19日正午、『繁華落尽』シーズン2がテンセントビデオで配信開始。舞台は夜の街から刑務所へ移る。金瀚演じる図嘉盛は自ら出頭して終身刑を言い渡され、16年間身を潜めてきた「老鬼」（果靖霖）を探すため収監される。女性刑務官の夏雨嫣（童苡萱）とは利害の同盟を結ぶ。外では周峻緯演じる趙陸がグレーのスーツで財界・政界に入り込む。シーズン1は今年1月30日配信で、分賬収入は3,200万元。"}, "why": {"zh": "国产犯罪剧的第二季通常靠「升级冲突」续命，这一部选的是「换空间」——从江湖火并换成高墙内的信息博弈。风险很明显：失去动作场面，全靠对话与权力关系撑戏；但如果撑住了，它会是今年国产悬疑里叙事密度最高的一部。", "en": "Second seasons of Chinese crime dramas usually survive by escalating conflict; this one changes the space instead, swapping street warfare for an information game inside prison walls. The risk is obvious: without action set pieces, dialogue and power relations must carry everything. If they do, it will be the densest narrative in Chinese suspense this year.", "es": "Las segundas temporadas del thriller chino suelen sobrevivir escalando el conflicto; esta cambia el espacio: de la guerra callejera a un juego de información entre rejas. El riesgo es evidente: sin escenas de acción, todo depende del diálogo y de las relaciones de poder. Si aguanta, será el relato más denso del suspense chino de este año.", "ja": "中国の犯罪ドラマのシーズン2は通常、衝突の拡大で命をつなぐ。今作は空間を変えた。街の抗争から、塀の中の情報戦へ。リスクは明らかだ。アクションを失えば、会話と権力関係だけで持たせるしかない。それに耐えれば、今年の中国サスペンスで最も密度の高い物語になる。"}}, {"idx": "03", "title": {"zh": "《声生不息·天涯共此时》先导片今晚播，许飞一句话被反复解读", "en": "Sheng Sheng Bu Xi returns tonight, and one line from Xu Fei gets over-read", "es": "Sheng Sheng Bu Xi vuelve esta noche y una frase de Xu Fei se sobreinterpreta", "ja": "『声生不息』今夜プレビュー放送、許飛の一言が繰り返し解釈される"}, "body": {"zh": "《声生不息·天涯共此时》11 月 19 日 19:30 在芒果 TV、湖南卫视播出先导片，11 月 20 日 12:00 芒果 TV 上线第一期、19:30 湖南卫视播出。阵容包括蔡琴、张信哲、周传雄、胡海泉、大张伟、郁可唯、魏如昀、曾沛慈、许飞、孙盛希、尤长靖等，何炅、李莎旻子主持。许飞 11 月 17 日官宣加盟，直播中被问推荐谁来节目时回答「姚晨、刘恋」，未提厉娜，弹幕与评论区大量刷「厉娜」。", "en": "Sheng Sheng Bu Xi: Tianya Gong Cishi airs a preview on Mango TV and Hunan Satellite TV at 19:30 on 19 November, with episode one on Mango TV at noon on 20 November and on Hunan TV at 19:30. The line-up includes Tsai Chin, Jeff Chang, Steve Chou, Hu Haiquan, Da Zhangwei, Yisa Yu, Wei Ruyun, Pets Tseng, Xu Fei, Shi Shi and Azora Chin, hosted by He Jiong and Li Shaminzi. Xu Fei was announced on 17 November; asked in a livestream whom she would recommend, she named Yao Chen and Liu Lian but not Li Na, prompting viewers to flood the comments with Li Na's name.", "es": "Sheng Sheng Bu Xi: Tianya Gong Cishi emite un avance el 19 de noviembre a las 19:30 en Mango TV y Hunan TV, con el primer episodio el 20 a mediodía en Mango TV y a las 19:30 en Hunan TV. El cartel incluye a Tsai Chin, Jeff Chang, Steve Chou, Hu Haiquan, Da Zhangwei, Yisa Yu, Wei Ruyun, Pets Tseng, Xu Fei, Shi Shi y Azora Chin, presentado por He Jiong y Li Shaminzi. Xu Fei se anunció el 17 de noviembre; preguntada en un directo a quién recomendaría, mencionó a Yao Chen y Liu Lian pero no a Li Na, y los comentarios se llenaron del nombre de Li Na.", "ja": "『声生不息・天涯共此時』は11月19日19時30分に芒果TVと湖南衛視でプレビュー版を放送し、11月20日12時に芒果TVで第1話、19時30分に湖南衛視で放送する。出演は蔡琴、張信哲、周伝雄、胡海泉、大張偉、郁可唯、魏如昀、曾沛慈、許飛、孫盛希、尤長靖ら。司会は何炅と李莎旻子。許飛は11月17日に出演が発表され、ライブ配信で「誰を推薦するか」と聞かれ「姚晨、劉恋」と答えて厲娜の名を出さず、コメント欄に「厲娜」が溢れた。"}, "why": {"zh": "一档音乐综艺的看点被一句「推荐谁」带偏，说明观众对「重逢叙事」的期待值仍然很高。但对节目本身，真正的考题是阵容的代际跨度——蔡琴、张信哲、周传雄与郁可唯、孙盛希、尤长靖同台，能不能唱出「共同的时代」，而不是拼盘式的轮唱。", "en": "That a music show's buzz got hijacked by a question about recommendations shows how high expectations for reunion narratives still run. The real test for the programme is generational span: Tsai Chin, Jeff Chang and Steve Chou on the same stage as Yisa Yu, Shi Shi and Azora Chin. Can they produce a shared era rather than a revolving medley?", "es": "Que el foco de un programa musical se desvíe por una pregunta sobre recomendaciones demuestra cuánta expectativa hay todavía en los relatos de reencuentro. La prueba real es el arco generacional: Tsai Chin, Jeff Chang y Steve Chou en el mismo escenario que Yisa Yu, Shi Shi y Azora Chin. ¿Lograrán una época compartida en lugar de un popurrí rotatorio?", "ja": "音楽番組の話題が「誰を推薦するか」に逸れたことは、再会の物語への期待値が依然高いことを示す。番組にとっての本当の課題は世代の幅だ。蔡琴、張信哲、周伝雄と郁可唯、孫盛希、尤長靖が同じ舞台に立つとき、「共通の時代」を歌えるのか、寄せ集めの交代歌唱に終わるのか。"}}, {"idx": "04", "title": {"zh": "《奔跑吧·大湾区篇》官宣 22 人，王祖蓝八年后回来", "en": "Running Man's Greater Bay Area season announces 22 names, with Wong Cho-lam back after eight years", "es": "Running Man anuncia 22 nombres para su temporada del Gran Golfo, con Wong Cho-lam de vuelta tras ocho años", "ja": "『奔跑吧・大湾区編』が22人を発表、王祖藍が8年ぶりに復帰"}, "body": {"zh": "11 月 19 日，《奔跑吧·大湾区篇》公布主海报并官宣阵容：8 位常驻为李晨、郑恺、沙溢、白鹿、范丞丞、张真源、孟子义、李昀锐；14 位飞行嘉宾包括王祖蓝、徐志胜、李亚男、何超莲、林依轮、薛凯琪、蒲熠星、周笔畅、蔡文静、王琳凯等。节目 11 月 21 日起每周六 20:30 在浙江卫视播出，首期在广州南沙录制，主题「风起大湾区」，任务融入醒狮、广彩、粤式早茶等元素。宋雨琦因演唱会档期未参与首轮录制。", "en": "On 19 November Running Man's Greater Bay Area season released its main poster and cast: eight regulars — Li Chen, Zheng Kai, Sha Yi, Bai Lu, Fan Chengcheng, Zhang Zhenyuan, Meng Ziyi and Li Yunrui — plus fourteen guests including Wong Cho-lam, Xu Zhisheng, Li Yanan, Ho Chiu-lin, Lin Yilun, Fiona Sit, Pu Yixing, Zhou Bichang, Cai Wenjing and Wang Linkai. The show airs Saturdays at 20:30 on Zhejiang TV from 21 November, with the first episode recorded in Nansha, Guangzhou, themed on the Bay Area and weaving in lion dance, Canton porcelain and Cantonese morning tea. Song Yuqi missed the first recording due to a concert schedule.", "es": "El 19 de noviembre, la temporada del Gran Golfo de Running Man presentó su cartel y su reparto: ocho fijos —Li Chen, Zheng Kai, Sha Yi, Bai Lu, Fan Chengcheng, Zhang Zhenyuan, Meng Ziyi y Li Yunrui— y catorce invitados, entre ellos Wong Cho-lam, Xu Zhisheng, Li Yanan, Ho Chiu-lin, Lin Yilun, Fiona Sit, Pu Yixing, Zhou Bichang, Cai Wenjing y Wang Linkai. Se emite los sábados a las 20:30 en Zhejiang TV desde el 21 de noviembre, con el primer programa grabado en Nansha, Cantón, y elementos de danza del león, porcelana de Cantón y té de la mañana. Song Yuqi no participó en la primera grabación por su agenda de conciertos.", "ja": "11月19日、『奔跑吧・大湾区編』がメインポスターと出演者を発表した。レギュラー8人は李晨、鄭愷、沙溢、白鹿、范丞丞、張真源、孟子義、李昀鋭。ゲスト14人には王祖藍、徐志勝、李亜男、何超蓮、林依輪、薛凱琪、蒲熠星、周筆暢、蔡文静、王琳凱らが名を連ねる。11月21日から毎週土曜20時30分に浙江衛視で放送。初回は広州南沙で収録され、テーマは「風起大湾区」、獅子舞や広彩、広東式朝食などを織り込む。宋雨琦はコンサート日程のため初回収録を欠席した。"}, "why": {"zh": "常驻从 7 人扩到 8 人、飞行 14 人，这个配置说明节目在往「事件化」走——每期靠嘉宾组合制造话题，而不是靠固定班底的化学反应。王祖蓝以飞行身份回归是情怀牌，也是大湾区题材最合适的一张牌：粤语、在地感、综艺节奏，他三项都占。", "en": "Eight regulars and fourteen guests means the show is moving towards event programming: each episode manufactured through casting combinations rather than the chemistry of a fixed cast. Wong Cho-lam returning as a guest is a nostalgia play and also the best fit for a Greater Bay Area theme — Cantonese, local feel and variety pacing in one person.", "es": "Ocho fijos y catorce invitados indican que el programa avanza hacia el formato de evento: cada entrega se fabrica con combinaciones de invitados más que con la química de un elenco estable. El regreso de Wong Cho-lam como invitado es una carta nostálgica y también la mejor para el tema del Gran Golfo: cantonés, cercanía local y ritmo televisivo en una sola persona.", "ja": "レギュラー8人、ゲスト14人という構成は、番組が「事件型」へ向かっていることを示す。固定メンバーの化学反応ではなく、各回のゲスト組み合わせで話題を作る。王祖藍のゲスト復帰は懐かしさの一手であり、大湾区という題材に最も合う一手でもある。広東語、土地感、バラエティの間合い、三つを兼ねる。"}}, {"idx": "05", "title": {"zh": "德普的《寒夜怪谈》登顶全球周末票房", "en": "Depp's gothic Christmas tale tops the global weekend chart", "es": "El cuento gótico navideño de Depp lidera la taquilla mundial del fin de semana", "ja": "デップ主演のゴシック・クリスマス映画が世界週末興収1位"}, "body": {"zh": "约翰尼·德普主演的《寒夜怪谈》上映首周末登顶北美票房榜：北美约 1900 万美元，国际约 2300 万美元，全球约 4200 万美元，为当周全球票房第一；英国-爱尔兰市场约 520 万美元同样登顶。影片由蒂·韦斯特执导、派拉蒙发行，改编狄更斯《圣诞颂歌》，讲述吝啬商人斯克鲁奇在圣诞前夜被「过去、现在、未来」三个幽灵造访。", "en": "Johnny Depp's gothic Christmas film topped the North American weekend chart on debut with about $19 million domestically, $23 million internationally and $42 million worldwide — first globally for the frame — plus $5.2 million in the UK and Ireland, also a number one. Directed by Ti West and released by Paramount, it adapts Dickens's A Christmas Carol, with the miser Scrooge visited on Christmas Eve by the ghosts of past, present and future.", "es": "La película gótica navideña de Johnny Depp lideró la taquilla norteamericana en su estreno con unos 19 millones de dólares en EE. UU., 23 millones internacionales y 42 millones globales, primera del mundo en el fin de semana, más 5,2 millones en Reino Unido e Irlanda, también líder. Dirigida por Ti West y distribuida por Paramount, adapta el Cuento de Navidad de Dickens, con el avaro Scrooge visitado en Nochebuena por los fantasmas del pasado, el presente y el futuro.", "ja": "ジョニー・デップ主演のゴシック調クリスマス映画が初週末で北米興収1位となった。北米約1,900万ドル、海外約2,300万ドル、世界計約4,200万ドルで週末の世界1位、英・アイルランドでも約520万ドルで首位。ティ・ウェスト監督、パラマウント配給で、ディケンズの『クリスマス・キャロル』を原作とし、吝嗇な商人スクルージがクリスマスイブに「過去・現在・未来」の三人の幽霊を迎える物語。"}, "why": {"zh": "4200 万美元的开画成绩谈不上爆款，但对德普是一次有效的「回归测试」——题材是公共版权、导演是恐怖片好手、档期贴着圣诞，风险被压到很低。好莱坞给他的定位正在从「票房保证」转向「低成本类型片里的熟脸」，这种转身如果成立，他的片约会比任何复出宣言都实在。", "en": "A $42 million opening is not a blockbuster, but it works as a comeback test for Depp: public-domain source material, a horror specialist directing, and a Christmas release window keep the risk low. Hollywood is repositioning him from box-office guarantee to recognisable face in low-cost genre films, and if that works his slate will say more than any comeback speech.", "es": "Un estreno de 42 millones no es un taquillazo, pero sirve como prueba de regreso para Depp: material de dominio público, un especialista del terror en la dirección y una fecha navideña mantienen el riesgo bajo. Hollywood lo recoloca de garantía de taquilla a rostro reconocible en cine de género de bajo coste, y si funciona, su agenda dirá más que cualquier discurso de retorno.", "ja": "4,200万ドルの初週は大ヒットとは言えないが、デップにとって有効な「復帰テスト」になっている。原作はパブリックドメイン、監督はホラーの巧者、公開時期はクリスマス。リスクは低く抑えられた。ハリウッドは彼を「興収の保証」から「低予算ジャンル映画の顔」へ移しつつあり、それが成立すれば、出演作の並びがどんな復帰宣言よりも雄弁になる。"}}]}], "risk": {"zh": "风险提示：本简报仅作信息汇总，其中涉及的数据不构成任何投资建议。", "en": "Risk notice: this briefing only summarises information; the data cited does not constitute investment advice.", "es": "Aviso de riesgo: este boletín solo resume información; los datos citados no constituyen asesoramiento de inversión.", "ja": "リスク提示：本ブリーフィングは情報の要約であり、記載のデータは投資助言を構成するものではありません。"}}/*__END__*/;

  /* ===== 工具 ===== */
  function T(obj, lang) {

        html += titleHtml(it.title, it.hl, lang) + "</div>";
        html += '<div class="d">' + esc(T(it.body, lang)) + "</div>";
        html += '<div class="why"><b>' + esc(i18n.why) + "</b>" + esc(T(it.why, lang)) + "</div>";
        html += "</div>";
      });
      html += "</section>";
    });
    html += "</div>";
    var content = document.getElementById("content");
    if (content) content.innerHTML = html;
    // 页脚
    var risk = document.getElementById("risk");
    if (risk) risk.textContent = T(BRIEFING.risk, lang);
  }

  function setLang(lang) {
    if (LANGS.indexOf(lang) < 0) lang = "zh";
    curLang = lang;
    langOpen = false;
    try { localStorage.setItem("timab_lang", lang); } catch (e) {}
    renderChrome(lang);
    renderContent(lang);
  }

  /* ===== 往期日历（保留原逻辑，文案随语言） ===== */
  function initCalendar() {
    var btn = document.getElementById("calBtn");
    var pop = document.getElementById("calPop");
    var grid = document.getElementById("calGrid");
    var title = document.getElementById("calTitle");
    if (!btn || !pop || !grid || !title) return;

    var parts = BRIEFING.date.split("-");
    var todayKey = parts[0].slice(2) + parts[1] + parts[2];
    var cur = { y: +parts[0], m: +parts[1] };
    var has = {};
    for (var i = 0; i < ARCHIVE_DATES.length; i++) { has[ARCHIVE_DATES[i]] = 1; }
    var HIST_BASE = /\/history\//.test(location.pathname) ? "./" : "history/";

    function ckey(y, m, d) { return String(y).slice(2) + pad(m) + pad(d); }

    function render() {
      var i18n = I18N[curLang];
      title.textContent = i18n.calTitle(cur.y, cur.m);
      grid.innerHTML = "";
      var start = new Date(cur.y, cur.m - 1, 1).getDay();
      var days = new Date(cur.y, cur.m, 0).getDate();
      for (var b = 0; b < start; b++) {
        var blank = document.createElement("span");
        blank.className = "cal-cell is-empty"; grid.appendChild(blank);
      }
      for (var d = 1; d <= days; d++) {
        var k = ckey(cur.y, cur.m, d);
        var cell = document.createElement("span");
        cell.className = "cal-cell" + (has[k] ? " has" : "") + (k === todayKey ? " is-today" : "");
        cell.textContent = d;
        if (has[k]) {
          cell.setAttribute("role", "link"); cell.setAttribute("tabindex", "0");
          cell.title = cur.y + "-" + pad(cur.m) + "-" + pad(d) + " 存档";
          (function (target) {
            var go = function () { window.open(HIST_BASE + target + ".html", "_blank", "noopener"); };
            cell.addEventListener("click", go);
            cell.addEventListener("keydown", function (e) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); go(); } });
          })(k);
        }
        grid.appendChild(cell);
      }
    }
    function toggle(open) {
      pop.hidden = !open;
      btn.setAttribute("aria-expanded", open ? "true" : "false");
      if (open) render();
    }
    btn.addEventListener("click", function (e) { e.stopPropagation(); toggle(pop.hidden); });
    document.getElementById("calPrev").addEventListener("click", function () { cur.m--; if (cur.m < 1) { cur.m = 12; cur.y--; } render(); });
    document.getElementById("calNext").addEventListener("click", function () { cur.m++; if (cur.m > 12) { cur.m = 1; cur.y++; } render(); });
    document.addEventListener("click", function (e) { if (!pop.hidden && !pop.contains(e.target)) toggle(false); });
    document.addEventListener("keydown", function (e) { if (e.key === "Escape" && !pop.hidden) toggle(false); });
  }

  /* ===== 启动 ===== */
  function boot() {
    curLang = detectLang();
    renderChrome(curLang);
    renderContent(curLang);
    initCalendar();
    // 关闭语言下拉：点击外部 / Esc
    document.addEventListener("click", function (e) {
      var ls = document.getElementById("langSwitch");
      if (ls && langOpen && !ls.contains(e.target)) {
        langOpen = false;
        ls.classList.remove("open");
        var t = document.getElementById("langTrigger");
        if (t) t.setAttribute("aria-expanded", "false");
      }
    });
    document.addEventListener("keydown", function (e) {
      if (e.key === "Escape" && langOpen) {
        langOpen = false;
        var ls = document.getElementById("langSwitch");
        if (ls) ls.classList.remove("open");
        var t = document.getElementById("langTrigger");
        if (t) t.setAttribute("aria-expanded", "false");
      }
    });
  }
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", boot);
  } else { boot(); }
})();
</script>
