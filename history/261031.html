。10月30日、記者がブランドのミニプログラムを確認したところ、この商品は販売を停止していた。以前から「割れやすい」という苦情が複数寄せられていた。"}, "why": {"zh": "联名卖的是情绪价值，但杯子首先得是杯子。这类事件里，消费者最该保留的三样东西是购买凭证、产品照片和就医记录——它们决定了后续是「协商」还是「维权」。", "en": "A collaboration sells emotional value, but a cup first has to be a cup. In cases like this the three things a consumer should keep are the receipt, photos of the product and medical records — they decide whether what follows is a conversation or a claim.", "es": "Una colaboración vende valor emocional, pero un vaso ante todo tiene que ser un vaso. En casos así, el consumidor debe guardar tres cosas: el comprobante de compra, fotos del producto y el parte médico. Deciden si lo que sigue es una conversación o una reclamación.", "ja": "コラボが売るのは情緒的な価値だが、グラスはまずグラスでなければならない。こうした事例で利用者が残すべきは、購入証明、製品の写真、受診記録の三点だ。その後の交渉なのか権利主張なのかを決める。"}}, {"idx": "03", "tag": {}, "title": {"zh": "「10 元快剪」冲上热搜：被冲击的不是手艺，是销售流程", "en": "The 10-Yuan Quick Haircut Goes Viral: What Is Being Disrupted Is the Sales Script", "es": "El corte exprés de 10 yuanes se hace viral: lo que se rompe es el guion de venta", "ja": "「10元カット」が話題に、打撃を受けているのは技術ではなく販売の流れ"}, "body": {"zh": "10 月 30 日，「10 元快剪正在暴打全国的设计总监」登上热搜。快剪以「不洗头、不推销、不办卡」的极简流程、较小门店与高周转，把基础理发的时间与价格门槛压得很低；传统门店则依赖造型、烫染与长期会员服务。相关讨论集中在「基础服务与高附加值服务该分别定价」，也牵出理发行业长期存在的预付卡纠纷。", "en": "On 30 October the phrase about 10-yuan quick cuts beating the country's design directors trended. Quick-cut chains compress the time and price of a basic haircut through a stripped-down process — no wash, no upselling, no membership cards — smaller shops and high turnover, while traditional salons rely on styling, perming and colouring and long-term memberships. Discussion centred on pricing basic and high-value services separately, and touched on the prepaid-card disputes that have long dogged the trade.", "es": "El 30 de octubre se volvió tendencia la frase sobre los cortes exprés de 10 yuanes que arrasan con los directores creativos del país. Las cadenas exprés reducen el tiempo y el precio del corte básico con un proceso mínimo —sin lavado, sin ventas agresivas, sin tarjetas de socio—, locales pequeños y alta rotación, mientras los salones tradicionales dependen del estilismo, la permanente y el color y de membresías de largo plazo. El debate se centró en cobrar por separado el servicio básico y el de alto valor, y tocó los conflictos por tarjetas prepago que arrastra el sector.", "ja": "10月30日、「10元カットが全国のデザイナーを打ち負かしている」という言い回しがトレンド入りした。低価格チェーンは、洗髪なし・勧誘なし・会員カードなしという最小限の流れと小さな店舗、高い回転率で、基本の散髪の時間と価格の敷居を大きく下げた。従来の店はスタイリングやパーマ、カラー、長期会員に依存している。議論は「基本サービスと付加価値サービスの分離価格」に集まり、業界に長くあるプリペイドカードのトラブルにも及んだ。"}, "why": {"zh": "这不是价格战，是消费结构的分层：人们愿意为设计付费，但不愿意为「必须办卡才能剪头发」付费。被冲击的其实不是手艺，而是过去那套把简单需求复杂化的销售流程。", "en": "This is not a price war but a stratification of consumption: people will pay for design, but not for having to buy a card to get a haircut. What is being disrupted is not craft but the sales process that used to complicate a simple need.", "es": "No es una guerra de precios sino una estratificación del consumo: la gente paga por diseño, pero no por tener que comprar una tarjeta para cortarse el pelo. Lo que se rompe no es el oficio, sino el proceso de venta que complicaba una necesidad simple.", "ja": "これは価格競争ではなく消費の層別化だ。人はデザインには払うが、「カードを作らないと切れない」ことには払わない。打撃を受けているのは技術ではなく、単純なニーズを複雑にしてきた販売の流れのほうだ。"}}, {"idx": "04", "tag": {}, "title": {"zh": "公安部网安局公布 5 起涉巴青地震谣言案例", "en": "Police Publish Five Cases of Rumours About the Baqing Earthquake", "es": "La policía publica cinco casos de bulos sobre el terremoto de Baqing", "ja": "公安当局がバチェン地震に関するデマ5件を公表"}, "body": {"zh": "10 月 30 日，公安部网安局公布 5 起典型案例：多名网民在网络平台编造传播涉西藏巴青地震的不实信息，包括谎称灾区附近水库因地震即将坍塌、捏造并篡改遇难人数、虚构伤亡数据渲染恐慌等，干扰救灾工作、扰乱网络空间秩序。属地公安机关已依法对上述人员作出行政处罚。", "en": "On 30 October the cybersecurity bureau of the Ministry of Public Security published five cases in which internet users fabricated and spread false information about the earthquake in Baqing, Tibet — including claims that a reservoir near the disaster area was about to collapse, and invented or altered death tolls and casualty figures to amplify alarm. The posts disrupted relief work and public order, and local police imposed administrative penalties.", "es": "El 30 de octubre la oficina de ciberseguridad del Ministerio de Seguridad Pública publicó cinco casos de usuarios que inventaron y difundieron información falsa sobre el terremoto de Baqing, en el Tíbet: afirmaciones de que un embalse cercano estaba a punto de colapsar, y cifras de víctimas inventadas o alteradas para amplificar la alarma. Las publicaciones entorpecieron las labores de socorro y el orden público, y la policía local impuso sanciones administrativas.", "ja": "10月30日、公安部サイバーセキュリティ局はチベット・バチェン地震に関するデマ5件を公表した。複数のネット利用者が、被災地近くのダムが崩壊寸前だと偽る情報や、死者数・負傷者数を捏造・改変して不安を煽る情報を拡散し、救援活動とネット空間の秩序を乱した。地元の公安機関は行政処罰を行った。"}, "why": {"zh": "灾害类谣言的成本极低、伤害极直接：它消耗的是救援资源与公众信任。这轮通报点名「篡改真实灾情数据」，也提示平台侧的识别难点——真数字被改一位，比纯编造更难拦。", "en": "Disaster rumours cost almost nothing to make and do direct damage: they consume relief resources and public trust. This round singled out altered real casualty data, which also points to the harder detection problem — a true figure with one digit changed is harder to catch than a pure fabrication.", "es": "Los bulos en catástrofes cuestan casi nada y hacen daño directo: consumen recursos de socorro y confianza pública. Esta vez se señaló la alteración de datos reales de víctimas, lo que apunta al problema difícil de detectar: una cifra verdadera con un dígito cambiado es más difícil de frenar que una invención completa.", "ja": "災害に関するデマは作るのにほとんどコストがかからず、被害は直接的だ。救援資源と公的な信頼を消耗する。今回は「実際の被害データの改変」が名指しされ、検知の難しさも示された。本物の数字を一桁変えたものは、完全な作り話より止めにくい。"}}, {"idx": "05", "tag": {}, "title": {"zh": "「养猫后明白了辱追心理」登上热搜，宠物陪伴成了长期支出", "en": "Cat Owners Say They Finally Understand Unrequited Fandom as the Topic Trends", "es": "Dueños de gatos dicen entender por fin el fanatismo no correspondido, y el tema se hace viral", "ja": "「猫を飼って分かった、報われない推し活の心理」がトレンド入り"}, "body": {"zh": "10 月 30 日，「养猫后明白了辱追心理」成为热搜话题，热度超过百万。宠物主用追星语言描述被猫冷落、却仍持续投入时间与金钱的状态，引发大量转发与共鸣。同期「30 万年轻人排队求陌生人管住钱包」「小伙打工 3 年攒近 17 万」等话题也在榜。", "en": "On 30 October the phrase cat owners finally understand the psychology of unrequited fandom topped a million in heat value on the trending list. Owners used the vocabulary of fandom to describe being ignored by a cat while continuing to spend time and money on it, drawing wide sharing and recognition. Topics about young people joining savings groups to have strangers hold them accountable, and a worker saving nearly 170,000 yuan in three years, trended alongside.", "es": "El 30 de octubre la frase sobre dueños de gatos que por fin entienden la psicología del fanatismo no correspondido superó el millón de puntos de popularidad. Los dueños usaron el vocabulario del fandom para describir que el gato los ignora mientras siguen gastando tiempo y dinero, con miles de compartidos. En paralelo figuraron temas sobre jóvenes que se apuntan a grupos de ahorro para que desconocidos les controlen el gasto y sobre un trabajador que ahorró casi 170.000 yuanes en tres años.", "ja": "10月30日、「猫を飼って分かった、報われない推し活の心理」がトレンド入りし、熱度は100万を超えた。飼い主が推し活の言葉で、猫に無視されながらも時間と金を使い続ける状態を語り、多くが共感して拡散した。同時に「30万人の若者が他人に財布を管理してもらうために行列」「若者が3年で約17万元を貯金」といった話題も上位に入った。"}, "why": {"zh": "一条玩笑式的话题能把宠物经济、情感消费和年轻人的收支焦虑串在一起。轻松的部分是「猫不理我我还爱它」，严肃的部分是：陪伴正在成为一项需要提前预算的长期支出。", "en": "A joking topic links the pet economy, emotional spending and young people's anxiety over income and outgoings. The light part is loving a cat that ignores you; the serious part is that companionship is becoming a long-term expense you have to budget for.", "es": "Un tema en broma conecta la economía de las mascotas, el gasto emocional y la ansiedad de los jóvenes por sus ingresos y gastos. Lo ligero es querer a un gato que te ignora; lo serio es que la compañía se está volviendo un gasto a largo plazo que hay que presupuestar.", "ja": "冗談めいた話題が、ペット経済と感情消費、若者の収支への不安をつなぐ。軽い部分は「無視されても好き」であり、重い部分は、伴侶としての存在が前もって予算を組むべき長期支出になりつつあることだ。"}}]}, {"key": "ent", "num": "06", "color": "#db2777", "deep": "#a81a56", "name": {"zh": "娱乐八卦", "en": "CULTURE", "es": "CULTURA", "ja": "芸能"}, "items": [{"idx": "01", "tag": {}, "title": {"zh": "肖战上海站开票即售罄，超 400 万人参与抢票", "en": "Xiao Zhan's Shanghai Shows Sell Out Instantly With Four Million Queueing", "es": "Las entradas de Xiao Zhan en Shanghái se agotan al instante con cuatro millones en la cola", "ja": "肖戦の上海公演チケットが即完売、400万人超が殺到"}, "body": {"zh": "10 月 30 日 10 时 05 分，肖战 2026「出口·我们」巡回演唱会上海站开票，11 月 6 日、8 日两场同步开售，地点为上海梅赛德斯-奔驰文化中心。开票即售罄，平台显示超过 400 万人参与抢票。工作室发文提醒：门票由大麦独家发售，实行强实名制购票与入场核验，请勿轻信「内部票」「代抢票」「包出票」。巧合的是，肖战多次公开表示喜欢的歌手孙燕姿，也于 11 月 6 日、8 日在长沙举办巡回演唱会。", "en": "Tickets for the Shanghai leg of Xiao Zhan's 2026 tour went on sale at 10:05 on 30 October for shows on 6 and 8 November at the Mercedes-Benz Arena, selling out immediately with the platform showing more than four million people in the queue. His studio reminded fans that tickets are sold only through Damai, with strict real-name purchase and entry checks, and warned against internal tickets, proxy buying and guaranteed-entry offers. Coincidentally, Stefanie Sun — a singer Xiao Zhan has often cited as a favourite — plays Changsha on the same two dates.", "es": "Las entradas de la etapa de Shanghái de la gira de Xiao Zhan 2026 salieron a la venta el 30 de octubre a las 10:05 para los conciertos del 6 y el 8 de noviembre en el Mercedes-Benz Arena, y se agotaron al instante, con más de cuatro millones de personas en la cola según la plataforma. Su estudio recordó que solo se venden por Damai, con compra y acceso con nombre real, y advirtió contra las entradas internas, la compra por encargo y las entradas garantizadas. Casualidad: Stefanie Sun, a quien Xiao Zhan ha citado como referente, actúa en Changsha esas mismas dos fechas.", "ja": "10月30日10時5分、肖戦の2026年ツアー上海公演のチケットが発売された。11月6日と8日の2公演（メルセデス・ベンツアリーナ）は即完売し、プラットフォームには400万人超が列んだ。スタジオは、販売は Damai 限定で本人確認付きの厳格な実名制だとし、「内部チケット」「代理購入」「確実に入れる」といった誘い文句に注意するよう呼びかけた。奇しくも、肖戦が敬愛すると公言してきた孫燕姿も同じ11月6日と8日に長沙で公演を行う。"}, "why": {"zh": "400 万人抢两场票，说明线下演出的供需缺口还在扩大。强实名制压住了黄牛，但「代抢」报价从看台加价两千到内场加价八千，说明灰色空间只是换了形态——票务治理真正的对手是稀缺本身。", "en": "Four million people for two shows shows the live-music supply gap is still widening. Real-name rules squeezed out scalpers, but proxy-buying fees from 2,000 yuan for stands to 8,000 for the floor show the grey market simply changed shape. The real opponent in ticketing is scarcity itself.", "es": "Cuatro millones de personas para dos conciertos muestran que la brecha entre oferta y demanda de música en vivo sigue creciendo. El nombre real frenó a los revendedores, pero las tarifas de compra por encargo —desde 2.000 yuanes en grada hasta 8.000 en pista— indican que el mercado gris solo cambió de forma. El verdadero rival es la escasez.", "ja": "2公演に400万人が集まることは、ライブの需給ギャップがさらに広がっていることを示す。実名制はダフ屋を抑えたが、代理購入の手数料はスタンドで2000元、アリーナで8000元と伝えられ、闇市場は形を変えただけだ。興行の本当の相手は希少性そのものにある。"}}, {"idx": "02", "tag": {}, "title": {"zh": "赵丽颖出任金鸡创投主评审，85 后演员首位", "en": "Zhao Liying Named Lead Juror of the Golden Rooster Venture Capital Unit", "es": "Zhao Liying será jurado principal del foro de proyectos del Golden Rooster", "ja": "趙麗穎、金鶏映画創投の主審に 85後俳優として初"}, "body": {"zh": "10 月 30 日，赵丽颖工作室官宣她出任第八届金鸡电影创投大会主单元主评审，与黄建新、闫妮共同组成主评审团。她是该单元历届主评审中第一位 85 后演员。第八届金鸡电影创投大会 11 月在厦门举行，赵丽颖将于 11 月 6 日出席评审首秀。此前担任过主评审的有李少红、刘德华、徐峥、吴京、郭帆、秦海璐等。", "en": "On 30 October Zhao Liying's studio announced she will serve as a lead juror of the main unit at the eighth Golden Rooster film venture capital event, alongside Huang Jianxin and Yan Ni. She is the first actor born after 1985 to hold the role. The event runs in Xiamen in November, with Zhao appearing on 6 November. Past lead jurors include Li Shaohong, Andy Lau, Xu Zheng, Wu Jing, Frant Gwo and Qin Hailu.", "es": "El 30 de octubre el estudio de Zhao Liying anunció que será jurado principal de la unidad central del octavo foro de proyectos cinematográficos del Golden Rooster, junto a Huang Jianxin y Yan Ni. Es la primera actriz nacida después de 1985 en el puesto. El certamen se celebra en Xiamen en noviembre y Zhao debutará como jurado el 6 de noviembre. Antes ocuparon ese lugar Li Shaohong, Andy Lau, Xu Zheng, Wu Jing, Frant Gwo y Qin Hailu.", "ja": "10月30日、趙麗穎のスタジオは、第8回金鶏映画創投大会のメインユニット主審に就任すると発表した。黄建新、閻妮と三人で主審団を組む。1985年以降生まれの俳優としては初めて。大会は11月に厦門で開かれ、趙麗穎は11月6日に審査デビューする。過去には李少紅、劉徳華、徐崢、呉京、郭帆、秦海璐らが務めた。"}, "why": {"zh": "创投评审席的位置很敏感——它决定新人第一部长片能拿到什么建议和什么资源。把席位交给一位以电视剧实绩为主、电影刚站稳的演员，信号是「作品说话的人往前坐」，也是对「资历等于判断力」的一次松绑。", "en": "A venture-capital jury seat is sensitive: it shapes what advice and resources a first-time feature actually gets. Giving it to an actor whose record is mainly in television and only recently solid in film signals that people with work to show move forward — and loosens the assumption that seniority equals judgement.", "es": "Un asiento en el jurado de proyectos es sensible: define qué consejo y qué recursos recibe realmente un primer largometraje. Dárselo a una actriz con trayectoria sobre todo televisiva y recién consolidada en cine indica que quienes tienen obra avanzan, y afloja la idea de que la antigüedad equivale al criterio.", "ja": "創投の審査席は敏感な位置だ。新人の長編第1作がどんな助言と資源を得られるかを左右する。テレビでの実績が中心で、映画では最近ようやく地歩を固めた俳優に席を渡すことは、「作品で語る人が前に座る」という合図であり、「年功＝判断力」という前提を緩めるものでもある。"}}, {"idx": "03", "tag": {}, "title": {"zh": "帕特里克·斯图尔特去世，享年 86 岁", "en": "Patrick Stewart, Captain Picard and Professor X, Dies at 86", "es": "Muere Patrick Stewart, el capitán Picard y el profesor X, a los 86 años", "ja": "パトリック・スチュワート氏死去 86歳 ピカード艦長とX教授"}, "body": {"zh": "当地时间 10 月 28 日，英国演员帕特里克·斯图尔特在洛杉矶家中去世，享年 86 岁，家属称其因阿尔茨海默病及路易体痴呆离世。他因《星际迷航：下一代》中的皮卡德舰长与《X 战警》系列中的 X 教授为全球观众熟知，舞台生涯横跨数十年，曾长期出演莎士比亚戏剧。漫威方面确认，《复仇者联盟 5》将成为他的银幕绝唱。", "en": "British actor Patrick Stewart died at his home in Los Angeles on 28 October aged 86; his family said the cause was Alzheimer's disease and Lewy body dementia. He was known worldwide as Captain Jean-Luc Picard in Star Trek: The Next Generation and Professor X in the X-Men films, and had a stage career spanning decades, including long runs in Shakespeare. Marvel confirmed Avengers 5 will be his final screen appearance.", "es": "El actor británico Patrick Stewart falleció en su casa de Los Ángeles el 28 de octubre a los 86 años; su familia indicó que la causa fue alzhéimer y demencia con cuerpos de Lewy. Era conocido mundialmente como el capitán Jean-Luc Picard en Star Trek: La nueva generación y como el profesor X en las películas de X-Men, con una carrera teatral de décadas que incluyó largas temporadas de Shakespeare. Marvel confirmó que Avengers 5 será su última aparición en pantalla.", "ja": "英国の俳優パトリック・スチュワート氏が10月28日、ロサンゼルスの自宅で死去した。86歳。家族はアルツハイマー病とレビー小体型認知症が原因としている。「新スタートレック」のピカード艦長、「X-MEN」シリーズのX教授で世界中に知られ、舞台俳優としても数十年にわたりシェイクスピア作品に出演した。マーベルは「アベンジャーズ5」が最後の出演作になると確認した。"}, "why": {"zh": "他演的两个角色都在讲同一件事：如何用理性对待未知。皮卡德靠的是规章与谈判，X 教授靠的是对差异的耐心——这两种气质在今天的科幻里反而稀缺。一个时代的「讲道理的英雄」就此谢幕。", "en": "Both of his signature roles were about the same thing: meeting the unknown with reason. Picard relied on rules and negotiation, Professor X on patience with difference — qualities that are scarce in science fiction now. An era of the hero who argues his case has closed.", "es": "Sus dos papeles emblemáticos trataban de lo mismo: enfrentar lo desconocido con razón. Picard se apoyaba en las normas y la negociación; el profesor X, en la paciencia ante la diferencia. Son cualidades escasas en la ciencia ficción actual. Se cierra una era del héroe que argumenta.", "ja": "代表作の二役は同じことを語っていた。未知に理性で向き合うことだ。ピカードは規則と交渉で、X教授は違いへの忍耐でそれを示した。どちらも今のSFでは乏しい資質だ。「理屈で語る英雄」の一時代が幕を下ろした。"}}, {"idx": "04", "tag": {}, "title": {"zh": "《音乐缘计划 3》先导片开播，11 月 6 日正式上线", "en": "Music Fate Plan 3 Airs Its Preview; Full Run Starts 6 November", "es": "Music Fate Plan 3 estrena su avance y arranca el 6 de noviembre", "ja": "「音楽縁計画3」先導映像を放送、11月6日から本編開始"}, "body": {"zh": "10 月 30 日，江苏卫视与爱奇艺联合推出的原创音乐综艺《音乐缘计划 3》播出先导片，节目将于 11 月 6 日正式开播。嘉宾包括刘宇宁、周深、容祖儿、黄子弘凡、薛之谦等，节目以原创作品为核心，聚焦音乐人与作品之间的「双向奔赴」。", "en": "The original-music variety show Music Fate Plan 3, co-produced by Jiangsu Satellite TV and iQIYI, aired its preview on 30 October ahead of a full launch on 6 November. The line-up includes Liu Yuning, Zhou Shen, Joey Yung, Huang Zihongfan and Joker Xue, with original songs at the centre of the format.", "es": "El programa de variedades de música original Music Fate Plan 3, coproducido por Jiangsu TV e iQIYI, emitió su avance el 30 de octubre antes del estreno completo el 6 de noviembre. El elenco incluye a Liu Yuning, Zhou Shen, Joey Yung, Huang Zihongfan y Joker Xue, con las canciones originales como eje del formato.", "ja": "江蘇衛星テレビとiQIYIが共同制作するオリジナル音楽バラエティ「音楽縁計画3」が10月30日に先導映像を放送し、11月6日から本編が始まる。出演は劉宇寧、周深、容祖児、黄子弘凡、薛之謙ら。オリジナル楽曲を軸に、音楽家と作品の関係を描く。"}, "why": {"zh": "音综这几年最大的问题是「翻唱消耗情怀」，原创赛道是唯一还能长出增量作品的方向。真正要看的不是阵容，而是节目结束后有几首歌能留在播放列表里。", "en": "The problem with music variety shows has been relying on covers and nostalgia; original material is the only lane that still produces new songs. What matters is not the line-up but how many tracks stay in playlists after the finale.", "es": "El problema de los programas musicales ha sido vivir de versiones y nostalgia; el material original es el único camino que aún genera canciones nuevas. Lo importante no es el elenco, sino cuántos temas siguen en las listas tras la final.", "ja": "音楽バラエティの課題は「カバーと懐かしさへの依存」だった。新しい曲が生まれる余地が残るのはオリジナルの路線だけだ。見るべきは出演者ではなく、番組が終わった後に何曲がプレイリストに残るかである。"}}, {"idx": "05", "tag": {}, "title": {"zh": "《不想睡的星期五》长沙站收官，把「浪漫」读给陌生人听", "en": "Late-Night Show Sleepless Friday Wraps Its Changsha Run", "es": "El programa nocturno Sleepless Friday cierra su etapa en Changsha", "ja": "「眠らない金曜日」長沙編が幕、見知らぬ人への告白を朗読"}, "body": {"zh": "10 月 30 日，湖南卫视、芒果 TV 播出的夜生活探访真人秀《不想睡的星期五》迎来长沙站收官。郭京飞、黄明昊、李小冉、孙怡、唐艺昕、周翊然、陈靖可、夏梦全员集结，杨迪担任临时夜务部部长。录制恰逢七夕：一行人搭缆车登岳麓山看日落，在山顶餐厅按菜名接龙；回到民宿开启特别播客《爱的声音》，轮流朗读街头信箱收集的告白信；最后与长沙交警一起铺设爱心斑马线。", "en": "Sleepless Friday, a late-night lifestyle reality show on Hunan Satellite TV and Mango TV, closed its Changsha run on 30 October. The full cast — Guo Jingfei, Justin Huang, Li Xiaoran, Sun Yi, Tang Yixin, Zhou Yiran, Chen Jingke and Xia Meng — assembled with Yang Di as guest night-shift chief. Recorded around Qixi, the episode follows a cable-car climb up Yuelu Mountain for sunset, a naming game at a hilltop restaurant, a podcast in which the cast read confessions collected from street letterboxes, and the painting of a heart-marked zebra crossing with local traffic police.", "es": "Sleepless Friday, el reality nocturno de Hunan TV y Mango TV, cerró su etapa de Changsha el 30 de octubre. Todo el reparto —Guo Jingfei, Justin Huang, Li Xiaoran, Sun Yi, Tang Yixin, Zhou Yiran, Chen Jingke y Xia Meng— se reunió con Yang Di como jefe de turno de noche invitado. Grabado en torno al Qixi, el episodio sube en teleférico al monte Yuelu para ver el atardecer, juega a bautizar platos en un restaurante de la cima, emite un pódcast con cartas de amor recogidas en buzones callejeros y pinta un paso de cebra con corazones junto a la policía de tráfico.", "ja": "湖南衛星テレビと芒果TVの夜型リアリティ番組「眠らない金曜日」が10月30日、長沙編の最終回を迎えた。郭京飛、黄明昊、李小冉、孫怡、唐芸昕、周翊然、陳靖可、夏夢が集結し、楊迪が臨時の夜勤部長を務めた。七夕時期の収録で、ロープウェイで岳麓山に登って夕日を眺め、山頂のレストランで料理名しりとりを行い、民宿で街頭ポストに寄せられた告白の手紙を朗読するポッドキャストを収録。最後は長沙の交通警察とハートの横断歩道を描いた。"}, "why": {"zh": "这档节目好看的地方在于它不教人怎么过周五，只是把几种夜晚摊开给人看。收官这期的巧思是把「浪漫」从情侣扩展到父母、宠物、工作犬和陌生人——城市生活的温度，常常就藏在这些不被计入 KPI 的细节里。", "en": "The show works because it does not teach you how to spend a Friday; it simply lays several kinds of night out to look at. The finale's good idea is widening romance from couples to parents, pets, working dogs and strangers — the warmth of city life tends to live in details no one puts in a KPI.", "es": "El programa funciona porque no enseña cómo pasar un viernes: solo despliega varias clases de noche para mirarlas. El acierto del final es ampliar el romance de las parejas a los padres, las mascotas, los perros de trabajo y los desconocidos: el calor de la vida urbana suele estar en detalles que nadie mide.", "ja": "この番組が良いのは、金曜の過ごし方を教えないところだ。いくつかの夜を並べて見せるだけ。最終回の巧みさは、「ロマンス」を恋人から父母、ペット、働く犬、見知らぬ人へ広げたことにある。都市の暮らしの温度は、KPIに計上されない細部にこそ宿る。"}}]}], "risk": {"zh": "风险提示：本简报仅作信息汇总，其中涉及的数据不构成任何投资建议。", "en": "Disclaimer: this briefing is a summary of information only; the data involved does not constitute investment advice.", "es": "Aviso: este boletín es solo un resumen informativo; los datos citados no constituyen asesoramiento de inversión.", "ja": "免責事項：本ブリーフィングは情報の要約であり、記載のデータは投資助言を構成するものではありません。"}}/*__END__*/;

  /* ===== UI 文案（与内容分离，四语齐全） ===== */
  var I18N = {
    "zh": {
      "dateSub": "每日简报", "calBtn": "往期日历", "calFoot": "带圆点的日期可查看当日存档",
      "tag": "进展", "why": "看点：", "badge": "精 选",
      "calWeek": ["日", "一", "二", "三", "四", "五", "六"],
      "calTitle": function (y, m) { return y + " 年 " + m + " 月"; }
    },
    "en": {
      "dateSub": "DAILY BRIEFING", "calBtn": "Archive", "calFoot": "Dots mark dates with a saved issue",
      "tag": "UPDATE", "why": "Why: ", "badge": "EDITOR'S PICK",
      "calWeek": ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"],
      "calTitle": function (y, m) { return ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][m-1] + " " + y; }
    },
    "es": {
      "dateSub": "BOLETÍN DIARIO", "calBtn": "Archivo", "calFoot": "Los puntos marcan fechas con ejemplar guardado",
      "tag": "ACTUALIZACIÓN", "why": "Por qué: ", "badge": "DESTACADO",
      "calWeek": ["Dom", "Lun", "Mar", "Mié", "Jue", "Vie", "Sáb"],
      "calTitle": function (y, m) { return m + " · " + y; }
    },
    "ja": {
      "dateSub": "デイリーブリーフィング", "calBtn": "バックナンバー", "calFoot": "点のついた日付は保存された号があります",
      "tag": "続報", "why": "見どころ：", "badge": "特集",
      "calWeek": ["日", "月", "火", "水", "木", "金", "土"],
      "calTitle": function (y, m) { return y + "年" + m + "月"; }
    }
  };
  var LANGS = ["zh", "en", "es", "ja"];
  var LANG_LABEL = { "zh": "中文", "en": "EN", "es": "ES", "ja": "日本語" };
  var LANG_LABEL_FULL = { "zh": "中文", "en": "English", "es": "Español", "ja": "日本語" };
  var LANG_HTML = { "zh": "zh-CN", "en": "en", "es": "es", "ja": "ja" };

  // 小国旗（内联 SVG，避免外部图标依赖与 emoji 平台差异）
  function flag(lang) {
    if (lang === "zh") return '<svg class="fl" viewBox="0 0 30 20" aria-hidden="true"><rect width="30" height="20" fill="#de2910"/><g fill="#ffde00"><circle cx="5" cy="4" r="2.2"/><circle cx="9" cy="2.4" r="0.8"/><circle cx="10" cy="4" r="0.8"/><circle cx="9" cy="5.6" r="0.8"/><circle cx="7" cy="6.6" r="0.8"/></g></svg>';
    if (lang === "en") return '<svg class="fl" viewBox="0 0 30 20" aria-hidden="true"><rect width="30" height="20" fill="#012169"/><path d="M0 0L30 20M30 0L0 20" stroke="#fff" stroke-width="4"/><path d="M0 0L30 20M30 0L0 20" stroke="#c8102e" stroke-width="2"/><rect x="13" width="4" height="20" fill="#fff"/><rect y="8" width="30" height="4" fill="#fff"/><rect x="14" width="2" height="20" fill="#c8102e"/><rect y="9" width="30" height="2" fill="#c8102e"/></svg>';
    if (lang === "es") return '<svg class="fl" viewBox="0 0 30 20" aria-hidden="true"><rect width="30" height="20" fill="#aa151b"/><rect y="5" width="30" height="10" fill="#f1bf00"/></svg>';
    return '<svg class="fl" viewBox="0 0 30 20" aria-hidden="true"><rect width="30" height="20" fill="#fff"/><circle cx="15" cy="10" r="5.5" fill="#bc002d"/></svg>';
  }

  /* ===== 工具 ===== */
  function T(obj, lang) {
    if (obj == null) return "";
    if (typeof obj === "string") return obj;
    if (obj[lang] != null) return obj[lang];
    return obj.zh != null ? obj.zh : "";
  }
  function pad(n) { return n < 10 ? "0" + n : "" + n; }
  function bing(q) { return "https://www.bing.com/search?q=" + encodeURIComponent(q); }
  function fmtDate(d, lang) {
    var y = d.getFullYear(), m = d.getMonth() + 1, day = d.getDate();
    if (lang === "zh") return y + "." + pad(m) + "." + pad(day);
    if (lang === "ja") return y + "年" + m + "月" + day + "日";
    if (lang === "es") return day + " " + ["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"][m-1] + " " + y;
    return ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][m-1] + " " + day + ", " + y;
  }
  function esc(s) {
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }
  function titleHtml(titleObj, hlObj, lang) {
    var title = T(titleObj, lang);
    var hl = T(hlObj, lang);
    var inner = esc(title);
    if (hl && title.indexOf(hl) >= 0) {
      var i = title.indexOf(hl);
      inner = esc(title.slice(0, i)) + '<span class="hl">' + esc(hl) + "</span>" + esc(title.slice(i + hl.length));
    }
    return '<a class="lk" href="' + bing(title) + '" target="_blank" rel="noopener">' + inner + "</a>";
  }

  /* ===== 语言检测：localStorage > 浏览器语言 > 系统时区 > 中文 ===== */
  function detectLang() {
    try { var s = localStorage.getItem("timab_lang"); if (s && LANGS.indexOf(s) >= 0) return s; } catch (e) {}
    var nav = (navigator.language || "").toLowerCase();
    if (/^zh/.test(nav)) return "zh";
    if (/^ja/.test(nav)) return "ja";
    if (/^es/.test(nav)) return "es";
    if (/^en/.test(nav)) return "en";
    var tz = "";
    try { tz = Intl.DateTimeFormat().resolvedOptions().timeZone || ""; } catch (e) {}
    if (/^Asia\/Tokyo/.test(tz)) return "ja";
    if (/Europe\/Madrid|America\/(Mexico_City|Bogota|Lima|Santiago|Caracas|Guatemala|La_Paz|San_Jose|Panama|Asuncion|Montevideo|Havana|El_Salvador|Managua|Tegucigalpa|Costa_Rica|San_Salvador)|America\/Argentina\//.test(tz)) return "es";
    if (/^(Europe|America|Australia)\//.test(tz)) return "en";
    return "zh";
  }

  var curLang = "zh";
  var langOpen = false;

  /* ===== 渲染 ===== */
  function renderChrome(lang) {
    var i18n = I18N[lang];
    document.documentElement.lang = LANG_HTML[lang];
    // 报头信息行
    var metaEl = document.getElementById("metaRow");
    if (metaEl) metaEl.textContent = T(BRIEFING.meta, lang);
    // 大日期
    var md = document.getElementById("mastDate");
    if (md) {
      var d = new Date(BRIEFING.date + "T00:00:00");
      md.innerHTML = fmtDate(d, lang) + "<small>" + esc(i18n.dateSub) + "</small>";
    }
    // 文档标题
    var siteName = (lang === "zh") ? "提马早报" : "TIMAB DAILY";
    document.title = siteName + " · " + fmtDate(new Date(BRIEFING.date + "T00:00:00"), lang);
    // 导航签
    var nav = document.getElementById("navChips");
    if (nav) {
      var order = ["pick"].concat(BRIEFING.sections.map(function (s) { return s.key; }));
      nav.innerHTML = "";
      order.forEach(function (key) {
        if (key === "pick") {
          var a = document.createElement("a");
          a.className = "chip-pick"; a.href = "#pick"; a.setAttribute("data-nav", "pick");
          a.textContent = T(BRIEFING.spotlight.badge, lang);
          nav.appendChild(a);
        } else {
          var sec = null;
          BRIEFING.sections.forEach(function (s) { if (s.key === key) sec = s; });
          if (!sec) return;
          var b = document.createElement("a");
          b.href = "#" + key; b.setAttribute("data-nav", key);
          b.style.borderColor = sec.color; b.style.color = sec.deep;
          b.textContent = T(sec.name, lang);
          nav.appendChild(b);
        }
      });
    }
    // 日历文案
    var cb = document.getElementById("calBtnText"); if (cb) cb.textContent = i18n.calBtn;
    var cw = document.getElementById("calWeek");
    if (cw) { cw.innerHTML = ""; i18n.calWeek.forEach(function (w) { var s = document.createElement("span"); s.textContent = w; cw.appendChild(s); }); }
    var cf = document.getElementById("calFoot"); if (cf) cf.textContent = i18n.calFoot;
    // 语言切换器（国旗触发 + 下拉）
    var ls = document.getElementById("langSwitch");
    if (ls) {
      ls.className = "lang-switch" + (langOpen ? " open" : "");
      ls.innerHTML = "";
      var trig = document.createElement("button");
      trig.type = "button"; trig.className = "lang-trigger"; trig.id = "langTrigger";
      trig.setAttribute("aria-haspopup", "true");
      trig.setAttribute("aria-expanded", langOpen ? "true" : "false");
      trig.innerHTML = flag(curLang) + '<span class="caret">▾</span>';
      trig.addEventListener("click", function (e) {
        e.stopPropagation();
        langOpen = !langOpen;
        ls.classList.toggle("open", langOpen);
        trig.setAttribute("aria-expanded", langOpen ? "true" : "false");
      });
      ls.appendChild(trig);
      var menu = document.createElement("div");
      menu.className = "lang-menu"; menu.setAttribute("role", "menu");
      LANGS.forEach(function (l) {
        var item = document.createElement("button");
        item.type = "button"; item.className = "lang-item" + (l === curLang ? " sel" : "");
        item.setAttribute("role", "menuitem"); item.setAttribute("data-lang", l);
        item.innerHTML = flag(l) + '<span class="lbl">' + LANG_LABEL_FULL[l] + "</span>";
        item.addEventListener("click", function (e) {
          e.stopPropagation();
          setLang(l);
        });
        menu.appendChild(item);
      });
      ls.appendChild(menu);
    }
  }

  function renderContent(lang) {
    var i18n = I18N[lang];
    var html = "";
    // 精选
    var sp = BRIEFING.spotlight;
    html += '<section class="spotlight" id="pick">'
      + '<div class="badge"><i></i>' + esc(T(sp.badge, lang)) + "</div>"
      + "<h2>" + titleHtml(sp.title, sp.hl, lang) + "</h2>"
      + '<div class="body">' + esc(T(sp.body, lang)) + "</div>"
      + '<div class="why"><b>' + esc(i18n.why) + "</b>" + esc(T(sp.why, lang)) + "</div>"
      + "</section>";
    // 分类
    html += '<div class="grid">';
    BRIEFING.sections.forEach(function (sec) {
      html += '<section class="card" id="' + sec.key + '" style="--ac:' + sec.color + "; --ac-deep:" + sec.deep + ';">'
        + '<div class="sec-head"><span class="sec-num">' + sec.num + "</span>"
        + "<h3>" + esc(T(sec.name, lang)) + "</h3>"
        + '<span class="en">' + sec.key.toUpperCase() + "</span></div>";
      (sec.items || []).forEach(function (it) {
        html += '<div class="item">';
        html += '<div class="t"><span class="idx">' + it.idx + "</span>";
        if (it.tag) html += '<span class="tag">' + esc(it.tag[lang] != null ? it.tag[lang] : i18n.tag) + "</span>";
        html += titleHtml(it.title, it.hl, lang) + "</div>";
        html += '<div class="d">' + esc(T(it.body, lang)) + "</div>";
        html += '<div class="why"><b>' + esc(i18n.why) + "</b>" + esc(T(it.why, lang)) + "</div>";
        html += "</div>";
      });
      html += "</section>";
    });
    html += "</div>";
    var content = document.getElementById("content");
    if (content) content.innerHTML = html;
    // 页脚
    var risk = document.getElementById("risk");
    if (risk) risk.textContent = T(BRIEFING.risk, lang);
  }

  function setLang(lang) {
    if (LANGS.indexOf(lang) < 0) lang = "zh";
    curLang = lang;
    langOpen = false;
    try { localStorage.setItem("timab_lang", lang); } catch (e) {}
    renderChrome(lang);
    renderContent(lang);
  }

  /* ===== 往期日历（保留原逻辑，文案随语言） ===== */
  function initCalendar() {
    var btn = document.getElementById("calBtn");
    var pop = document.getElementById("calPop");
    var grid = document.getElementById("calGrid");
    var title = document.getElementById("calTitle");
    if (!btn || !pop || !grid || !title) return;

    var parts = BRIEFING.date.split("-");
    var todayKey = parts[0].slice(2) + parts[1] + parts[2];
    var cur = { y: +parts[0], m: +parts[1] };
    var has = {};
    for (var i = 0; i < ARCHIVE_DATES.length; i++) { has[ARCHIVE_DATES[i]] = 1; }
    var HIST_BASE = /\/history\//.test(location.pathname) ? "./" : "history/";

    function ckey(y, m, d) { return String(y).slice(2) + pad(m) + pad(d); }

    function render() {
      var i18n = I18N[curLang];
      title.textContent = i18n.calTitle(cur.y, cur.m);
      grid.innerHTML = "";
      var start = new Date(cur.y, cur.m - 1, 1).getDay();
      var days = new Date(cur.y, cur.m, 0).getDate();
      for (var b = 0; b < start; b++) {
        var blank = document.createElement("span");
        blank.className = "cal-cell is-empty"; grid.appendChild(blank);
      }
      for (var d = 1; d <= days; d++) {
        var k = ckey(cur.y, cur.m, d);
        var cell = document.createElement("span");
        cell.className = "cal-cell" + (has[k] ? " has" : "") + (k === todayKey ? " is-today" : "");
        cell.textContent = d;
        if (has[k]) {
          cell.setAttribute("role", "link"); cell.setAttribute("tabindex", "0");
          cell.title = cur.y + "-" + pad(cur.m) + "-" + pad(d) + " 存档";
          (function (target) {
            var go = function () { window.open(HIST_BASE + target + ".html", "_blank", "noopener"); };
            cell.addEventListener("click", go);
            cell.addEventListener("keydown", function (e) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); go(); } });
          })(k);
        }
        grid.appendChild(cell);
      }
    }
    function toggle(open) {
      pop.hidden = !open;
      btn.setAttribute("aria-expanded", open ? "true" : "false");
      if (open) render();
    }
    btn.addEventListener("click", function (e) { e.stopPropagation(); toggle(pop.hidden); });
    document.getElementById("calPrev").addEventListener("click", function () { cur.m--; if (cur.m < 1) { cur.m = 12; cur.y--; } render(); });
    document.getElementById("calNext").addEventListener("click", function () { cur.m++; if (cur.m > 12) { cur.m = 1; cur.y++; } render(); });
    document.addEventListener("click", function (e) { if (!pop.hidden && !pop.contains(e.target)) toggle(false); });
    document.addEventListener("keydown", function (e) { if (e.key === "Escape" && !pop.hidden) toggle(false); });
  }

  /* ===== 启动 ===== */
  function boot() {
    curLang = detectLang();
    renderChrome(curLang);
    renderContent(curLang);
    initCalendar();
    // 关闭语言下拉：点击外部 / Esc
    document.addEventListener("click", function (e) {
      var ls = document.getElementById("langSwitch");
      if (ls && langOpen && !ls.contains(e.target)) {
        langOpen = false;
        ls.classList.remove("open");
        var t = document.getElementById("langTrigger");
        if (t) t.setAttribute("aria-expanded", "false");
      }
    });
    document.addEventListener("keydown", function (e) {
      if (e.key === "Escape" && langOpen) {
        langOpen = false;
        var ls = document.getElementById("langSwitch");
        if (ls) ls.classList.remove("open");
        var t = document.getElementById("langTrigger");
        if (t) t.setAttribute("aria-expanded", "false");
      }
    });
  }
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", boot);
  } else { boot(); }
})();
</script>
