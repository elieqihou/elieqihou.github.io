  var ARCHIVE_DATES = [/*__ARCHIVE_DATES__*/"260923", "260924", "260925", "260926", "260927", "260928", "260929", "260930", "261001", "261002", "261003", "261004", "261005", "261006", "261007", "261008", "261009", "261010", "261011", "261012", "261013", "261014", "261015", "261016", "261017", "261018", "261019", "261020", "261021", "261022", "261023", "261024"/*__END__*/];
  var BRIEFING = /*__BRIEFING_DATA__*/{"date": "2026-10-25", "meta": {"zh": "星期日 · 农历九月十六 · timab.cn", "en": "Sunday · Lunar September 16 · timab.cn", "es": "Domingo · 16.º día del noveno mes lunar · timab.cn", "ja": "日曜日 · 旧暦九月十六 · timab.cn"}, "spotlight": {"badge": {"zh": "精 选", "en": "SPOTLIGHT", "es": "DESTACADO", "ja": "注 目"}, "title": {"zh": "「脑梗征兆，建议立即就医」：一句 AI 提醒，把父亲从 4.5 小时窗口外拉了回来", "en": "One AI Reply, One Saved Father: How a Chatbot Beat the 4.5-Hour Stroke Window", "es": "Una respuesta de la IA salvó a un padre: la ventana de 4,5 horas del ictus", "ja": "「脳梗塞の兆候、直ちに受診を」 AIの一言が父を4.5時間の壁の内側に引き戻した"}, "hl": {"zh": "4.5 小时窗口", "en": "4.5-hour window", "es": "ventana de 4,5 horas", "ja": "4.5時間の壁"}, "body": {"zh": "山东聊城 90 后于建进发现父亲遛弯回家后双腿无力、吞咽不畅，第一反应是「等天亮再说」。他把症状和父亲的三高病史一起发给了豆包，第一次回复就是「脑梗征兆，建议立即就医」；补充病史后，AI 再次警告「这是高危信号，不能拖」。他随即连夜驱车送医，医院确诊急性脑梗，赶上了静脉溶栓约 4.5 小时的黄金窗口，目前老人恢复良好、未留后遗症。这段经历 24 日冲上微博热搜第一。", "en": "Yu Jianjin, a man in his thirties in Liaocheng, Shandong, noticed his father could not move his legs properly and had trouble swallowing after a walk. His first instinct was to wait until morning. Instead he sent the symptoms, along with his father's history of high blood pressure, blood sugar and cholesterol, to the Doubao chatbot. The first reply was blunt: signs of a cerebral infarction, seek emergency care immediately. After he added the medical history, the AI warned again that this was a high-risk signal and could not wait. He drove his father to hospital that night; doctors confirmed an acute stroke and treated him inside the roughly 4.5-hour window for intravenous thrombolysis. The older man is recovering without lasting damage. The story topped Weibo's trending list on the 24th.", "es": "Yu Jianjin, un hombre de treinta y tantos años de Liaocheng, Shandong, notó que su padre, tras volver de pasear, no movía bien las piernas y tragaba con dificultad. Su primera reacción fue esperar a que amaneciera. En cambio, envió los síntomas junto con el historial de hipertensión, glucosa y colesterol de su padre al chatbot Doubao. La primera respuesta fue tajante: signos de infarto cerebral, acuda de inmediato a urgencias. Tras añadir los antecedentes, la IA volvió a advertir que era una señal de alto riesgo y que no se podía esperar. Esa noche llevó a su padre al hospital; los médicos confirmaron un ictus agudo y lo trataron dentro de la ventana de unas 4,5 horas para la trombólisis intravenosa. El anciano se recupera sin secuelas. La historia encabezó la lista de tendencias de Weibo el día 24.", "ja": "山東省聊城の30代男性、于建進さんは、散歩から戻った父が両脚に力が入らず、飲み込みも悪いことに気づいた。最初は「朝まで様子を見よう」と考えた。だが症状と、高血圧・高血糖・高コレステロールの既往歴をAIチャットbot「豆包」に送ると、最初の返答は「脳梗塞の兆候、直ちに受診を」だった。既往歴を補足すると、AIは「高危険信号、待ってはいけない」と再度警告した。于さんはその夜クルマで病院へ向かい、急性脳梗塞と診断された。静脈血栓溶解の約4.5時間の時間枠に間に合い、現在は後遺症もなく回復している。この体験は24日、Weiboのトレンド1位になった。"}, "why": {"zh": "真正改变结局的不是 AI 的「诊断」，而是它在一个人最容易犹豫的节点上，把「明天挂什么号」改成了「现在去急诊」。但医生也提醒：AI 只能做急症预警与分诊参考，不能替代面诊，更不能用它给自己开药。", "en": "What changed the outcome was not the AI's diagnosis but the moment it interrupted a very human hesitation, turning a plan to book an appointment tomorrow into a drive to the emergency room tonight. Doctors stress the limits too: a chatbot can flag an emergency and help with triage, but it cannot replace an examination, and it must never be used to prescribe for yourself.", "es": "Lo que cambió el desenlace no fue el diagnóstico de la IA, sino el momento en que interrumpió una duda muy humana: convertir la idea de pedir cita mañana en una carrera a urgencias esa misma noche. Los médicos subrayan los límites: un chatbot puede señalar una urgencia y orientar el triaje, pero no sustituye una exploración ni sirve para automedicarse.", "ja": "結末を変えたのはAIの「診断」ではなく、人が最も迷いやすい瞬間に、「明日どの科を受診しよう」を「今すぐ救急へ」に書き換えたことだ。ただし医師は限界も指摘する。AIは救急の警告と受診科目の参考にはなるが、対面診察の代わりにはならず、自己判断の処方に使ってはいけない。"}}, "sections": [{"key": "intl", "num": "01", "color": "#1d4ed8", "deep": "#1e3fa8", "name": {"zh": "国际时事", "en": "WORLD", "es": "MUNDO", "ja": "国際時事"}, "items": [{"idx": "01", "tag": {"zh": "进展"}, "title": {"zh": "奥列什基停火进入倒计时：莫斯科时间 27 日 4 时起「静默」，美方称三方会谈或两周内举行", "en": "Oleshky Ceasefire Countdown: Silence From 4 A.M. Moscow Time on the 27th, Talks Possibly Within Two Weeks", "es": "Cuenta atrás en Oleshki: silencio desde las 4:00 de Moscú del día 27 y conversaciones en dos semanas", "ja": "オレシュキー停戦が秒読み モスクワ時間27日4時から「静寂」、三者協議は2週間内の可能性"}, "body": {"zh": "俄军总参谋长格拉西莫夫宣布，自莫斯科时间 27 日 4 时起在赫尔松方向停止开火、实行「静默状态」；白宫称这份局部停火协议由美方促成，第一夫人参与了斡旋。协议范围仅限奥列什基一城，用于开放人道走廊、允许援助进入并撤离平民。一名美国官员透露，俄美乌三方会谈可能在两周内于阿布扎比或瑞士举行。", "en": "Russian Chief of the General Staff Valery Gerasimov announced that forces would stop firing and enter a state of silence in the Kherson direction from 4 a.m. Moscow time on the 27th. The White House said Washington brokered the limited truce and that the first lady took part in the mediation. Its scope is a single town, Oleshky, opened so that aid can enter and civilians can leave. A US official said trilateral talks involving Russia, the United States and Ukraine could be held within two weeks in Abu Dhabi or Switzerland.", "es": "El jefe del Estado Mayor ruso, Valeri Guerásimov, anunció que las fuerzas dejarán de disparar y entrarán en «estado de silencio» en la dirección de Jersón desde las 4:00 hora de Moscú del día 27. La Casa Blanca afirmó que Washington propició esta tregua limitada y que la primera dama participó en la mediación. El alcance se limita a la ciudad de Oleshki, para abrir un corredor humanitario, permitir la entrada de ayuda y evacuar civiles. Un funcionario estadounidense indicó que las conversaciones tripartitas podrían celebrarse en dos semanas en Abu Dabi o Suiza.", "ja": "ロシア軍総参謀長ゲラシモフ氏は、モスクワ時間27日4時からヘルソン方面で射撃を停止し「静寂状態」に入ると発表した。米ホワイトハウスは、この限定的な停戦は米国が仲介したもので、大統領夫人も関与したと述べた。対象はオレシュキー一市のみで、人道回廊を開き、支援物資の搬入と住民の退避を可能にする。米当局者は、露米宇の三者協議が2週間以内にアブダビかスイスで開かれる可能性があると明かした。"}, "why": {"zh": "一座城、几天时间、没有第三方监督——这更像给平民开一条走廊，而不是给战争划句号。真正的信号要看 11 月会谈能不能谈出「安全保障」的框架。", "en": "One town, a few days, no third-party monitors: this looks more like a corridor for civilians than a full stop to the war. The signal that matters is whether November talks can produce a framework for security guarantees.", "es": "Una ciudad, unos días y ningún observador independiente: parece más un corredor para civiles que un punto final a la guerra. La señal que importa es si las conversaciones de noviembre logran un marco de garantías de seguridad.", "ja": "一都市、数日間、第三者の監視なし――これは戦争に終止符を打つというより、民間人に通路を開くものだ。本当の信号は、11月の協議が「安全保障」の枠組みを打ち出せるかどうかにある。"}}, {"idx": "02", "title": {"zh": "巴西大选今日决选：卢拉与弗拉维奥·博索纳罗民调技术性持平", "en": "Brazil Votes Today: Lula and Flávio Bolsonaro Locked in a Technical Tie", "es": "Brasil vota hoy: Lula y Flávio Bolsonaro empatados técnicamente", "ja": "ブラジル大統領選は今日決選 ルラ氏とボルソナロ氏が技術的互角"}, "body": {"zh": "巴西总统选举第二轮投票 25 日举行。首轮中弗拉维奥·博索纳罗得 47.03% 有效票、卢拉得 45.16%。23 日晚最后一场电视辩论聚焦生活成本、最低工资、公共安全与基础设施投资，两人还就「九指」称呼互相要求道歉。最新 Datafolha 民调显示双方支持率 47% 对 46%，折算有效票为 50% 对 50%。", "en": "Brazil holds the second round of its presidential election on the 25th. In the first round Flávio Bolsonaro took 47.03% of valid votes and Lula 45.16%. The final televised debate on the night of the 23rd centred on the cost of living, the minimum wage, public security and infrastructure, with the two also demanding apologies over a nickname about Lula's missing finger. The latest Datafolha poll puts them at 47% to 46%, or 50-50 among valid votes.", "es": "Brasil celebra el 25 la segunda vuelta presidencial. En la primera, Flávio Bolsonaro obtuvo el 47,03% de los votos válidos y Lula el 45,16%. El último debate televisado, la noche del 23, se centró en el coste de la vida, el salario mínimo, la seguridad pública y la inversión en infraestructuras; ambos se exigieron disculpas por un apodo sobre el dedo amputado de Lula. El último sondeo de Datafolha les da 47% frente a 46%, o 50-50 en votos válidos.", "ja": "ブラジル大統領選の決選投票が25日に行われる。1回目投票ではボルソナロ氏が有効票の47.03%、ルラ氏が45.16%を獲得した。23日夜の最後のテレビ討論は生活費、最低賃金、治安、インフラ投資が中心で、両氏はルラ氏の指の欠損をめぐる呼称について互いに謝罪を要求した。最新の Datafolha 調査は47%対46%、有効票では50%対50%の互角としている。"}, "why": {"zh": "不管谁赢，接手的都是债务占 GDP 82.9%、2027 年增长预期仅约 1% 的巴西。这场选举的悬念不在投票日，而在新政府敢不敢碰财政改革。", "en": "Whichever man wins inherits an economy with debt at 82.9% of GDP and growth forecast at barely 1% for 2027. The real suspense is not election day but whether the next government dares touch fiscal reform.", "es": "Quien gane hereda una economía con deuda del 82,9% del PIB y un crecimiento previsto de apenas el 1% para 2027. La incógnita no está en la jornada electoral, sino en si el próximo gobierno se atreve con la reforma fiscal.", "ja": "どちらが勝っても、債務がGDP比82.9%、2027年の成長率見通しが約1%のブラジルを引き継ぐ。焦点は投票日ではなく、新政権が財政改革に踏み込めるかにある。"}}, {"idx": "03", "title": {"zh": "八国外长呼吁立即重开霍尔木兹海峡，伊朗警告「支持美方者将被列为敌对国家」", "en": "Eight Foreign Ministers Urge Reopening Hormuz; Iran Warns Backers of Washington Could Be \"Hostile States\"", "es": "Ocho cancilleres piden reabrir Ormuz; Irán advierte de que los aliados de EE. UU. serían «Estados hostiles»", "ja": "8カ国外相がホルムズ即時再開を要求 イランは「米支持国は敵対国」と警告"}, "body": {"zh": "土耳其、埃及、巴基斯坦、沙特、英国、法国、德国、意大利八国外长 23 日在土耳其会晤，呼吁立即重新开放霍尔木兹海峡、反对对伊朗采取军事行动，并强调保障黑海海上航行安全。伊朗方面则警告，若美伊重燃战火，任何支持美方的国家都可能被列为「敌对国家」，回应范围不再局限于军事基地。此前两艘超级油轮在海峡南部触雷，共载原油超 450 万桶。", "en": "Foreign ministers of Turkey, Egypt, Pakistan, Saudi Arabia, Britain, France, Germany and Italy met in Turkey on the 23rd, calling for the immediate reopening of the Strait of Hormuz, opposing military action against Iran and stressing the safety of navigation in the Black Sea. Iran warned that if fighting resumes, any country backing Washington could be treated as a hostile state, with retaliation no longer confined to military bases. Two supertankers carrying more than 4.5 million barrels struck mines in the southern part of the strait earlier.", "es": "Los cancilleres de Turquía, Egipto, Pakistán, Arabia Saudí, Reino Unido, Francia, Alemania e Italia se reunieron el 23 en Turquía para pedir la reapertura inmediata del estrecho de Ormuz, rechazar una acción militar contra Irán y subrayar la seguridad de la navegación en el mar Negro. Irán advirtió de que, si se reanuda el conflicto, cualquier país que apoye a Washington podría ser considerado «Estado hostil», con represalias que ya no se limitarían a bases militares. Antes, dos superpetroleros con más de 4,5 millones de barriles chocaron con minas en el sur del estrecho.", "ja": "トルコ、エジプト、パキスタン、サウジアラビア、英、仏、独、伊の8カ国外相が23日にトルコで会談し、ホルムズ海峡の即時再開とイランへの軍事行動反対を呼びかけ、黒海の航行安全の確保を強調した。イラン側は、米国との戦闘が再燃すれば米方を支援する国は「敵対国」と見なし、報復範囲は軍事基地に限らないと警告した。先にこの海峡南部で超大型タンカー2隻が機雷に接触し、原油450万バレル超を積んでいた。"}, "why": {"zh": "八国站出来说话，说明这场对峙已经不只是美伊两家的事——海峡每天过的油，是欧洲和亚洲的账本。外交渠道重新打开，比任何一方的狠话都更值得盯。", "en": "Eight countries speaking up shows this standoff is no longer a bilateral affair: the oil passing through the strait daily sits on European and Asian balance sheets. The reopening of diplomatic channels matters more than anyone's tough talk.", "es": "Que ocho países alcen la voz demuestra que este pulso ya no es bilateral: el petróleo que cruza el estrecho cada día está en los balances de Europa y Asia. La reapertura de los canales diplomáticos importa más que cualquier frase dura.", "ja": "8カ国が声を上げたことは、この対立がもはや米伊二国間の問題ではないことを示す。海峡を毎日通る原油は欧州とアジアの帳簿に載っている。外交チャンネルの再開は、どの強硬発言よりも注視に値する。"}}, {"idx": "04", "title": {"zh": "中期选举前两周，特朗普施政满意度跌至 36% 创新低", "en": "Two Weeks Before the Midterms, Trump's Approval Falls to a Record-Low 36%", "es": "A dos semanas de las legislativas, la aprobación de Trump cae a un mínimo del 36%", "ja": "中間選挙2週間前、トランプ氏の支持率が36%へ低落"}, "body": {"zh": "《纽约时报》与锡耶纳学院 23 日公布的联合民调显示，仅 36% 的潜在选民认可特朗普的施政表现，59% 表示不认可，多数选民不认可其对生活成本、伊朗战事和油价的处理。同日密歇根大学调查显示，10 月美国消费者信心指数终值 48，连续第三个月下滑，比去年同期低 10.4%，也比今年 2 月伊朗冲突爆发前低 15%。", "en": "A joint poll by The New York Times and Siena College published on the 23rd found only 36% of likely voters approve of Trump's job performance while 59% disapprove, with most rejecting his handling of living costs, the Iran conflict and fuel prices. The University of Michigan's October survey, released the same day, put consumer sentiment at a final reading of 48, down for a third straight month, 10.4% lower than a year earlier and 15% below February, before the Iran conflict began.", "es": "Una encuesta conjunta del New York Times y Siena College publicada el 23 muestra que solo el 36% de los votantes probables aprueba la gestión de Trump y el 59% la desaprueba; la mayoría rechaza su manejo del coste de la vida, el conflicto con Irán y los precios del combustible. El sondeo de la Universidad de Michigan difundido ese mismo día situó la confianza del consumidor en 48, su tercer descenso mensual consecutivo, un 10,4% por debajo de hace un año y un 15% por debajo de febrero, antes del conflicto.", "ja": "ニューヨーク・タイムズとシエナ大学が23日に公表した共同調査では、トランプ氏の職務遂行を評価する有権者は36%にとどまり、59%が不支持とした。生活費、イラン戦争、燃料価格への対応を多くの有権者が評価していない。同日発表のミシガン大学調査では、10月の消費者信頼感指数確報値は48と3カ月連続で低下し、前年同月比10.4%減、イラン衝突前の2月より15%低い。"}, "why": {"zh": "36% 的支持率和 48 的消费者信心指向同一件事：选民对钱包的感受，比对战报的感受更直接。距 11 月 3 日中期选举只剩两周，油价与物价会是最硬的议题。", "en": "A 36% approval rating and a 48 sentiment reading point to the same thing: voters feel their wallets more directly than they feel the war. With the 3 November midterms two weeks away, fuel and food prices will be the hardest issues.", "es": "Un 36% de aprobación y un 48 de confianza del consumidor apuntan a lo mismo: los votantes sienten el bolsillo más directamente que el parte de guerra. A dos semanas de las legislativas del 3 de noviembre, la gasolina y los precios serán los temas más duros.", "ja": "支持率36%、消費者信頼感48という数字は同じことを指す。有権者は戦況よりも財布を直接感じている。11月3日の中間選挙まで2週間、燃料と物価が最も厳しい争点になる。"}}, {"idx": "05", "title": {"zh": "菲律宾两架军机训练中相撞，4 名空军飞行员死亡", "en": "Two Philippine Military Aircraft Collide in Training, Killing Four Air Force Pilots", "es": "Dos aviones militares filipinos chocan en un entrenamiento y mueren cuatro pilotos", "ja": "フィリピン軍機2機が訓練中に衝突 空軍パイロット4人死亡"}, "body": {"zh": "菲律宾空军 24 日证实，该国两架飞机 23 日在吕宋岛八打雁省训练时相撞，机上 4 名空军飞行员全部遇难。菲方已暂停相关训练科目并启动调查，事故机型与具体原因尚未公布。", "en": "The Philippine Air Force confirmed on the 24th that two of its aircraft collided during a training flight in Batangas province on Luzon on the 23rd, killing all four air force pilots on board. The service has suspended the training syllabus involved and opened an investigation; the aircraft type and cause have not been released.", "es": "La Fuerza Aérea de Filipinas confirmó el 24 que dos de sus aviones chocaron el 23 durante un vuelo de entrenamiento en la provincia de Batangas, en Luzón, y murieron los cuatro pilotos a bordo. La institución suspendió el programa de entrenamiento y abrió una investigación; aún no se han divulgado el modelo ni las causas.", "ja": "フィリピン空軍は24日、ルソン島バタンガス州での23日の訓練飛行中に軍機2機が衝突し、搭乗していたパイロット4人全員が死亡したと確認した。空軍は該当する訓練課程を停止し調査を開始したが、機種や原因は公表されていない。"}, "why": {"zh": "这是菲律宾空军近年来少见的训练事故。对一支正在加速现代化的空军来说，事故原因（机型、编队、空域协调）会直接影响后续训练节奏与装备采购。", "en": "It is a rare training accident for the Philippine Air Force. For a service pushing rapid modernisation, the cause, whether airframe, formation or airspace coordination, will shape training tempo and procurement.", "es": "Es un accidente de entrenamiento poco habitual en la Fuerza Aérea filipina. Para una institución inmersa en una modernización acelerada, la causa (aparato, formación o coordinación del espacio aéreo) condicionará el ritmo de instrucción y las compras.", "ja": "フィリピン空軍では珍しい訓練事故だ。近代化を急ぐ空軍にとって、機体か編隊か空域調整かという原因の特定は、今後の訓練計画や装備調達に直結する。"}}]}, {"key": "dom", "num": "02", "color": "#cf2f1e", "deep": "#a02316", "name": {"zh": "国内要闻", "en": "CHINA", "es": "CHINA", "ja": "国内要聞"}, "items": [{"idx": "01", "title": {"zh": "二十届中央第八轮巡视对象公布：教育部与 31 所高校党组织", "en": "Eighth Round of Central Inspections Announced: Education Ministry and 31 Universities", "es": "Anunciada la octava ronda de inspecciones: el Ministerio de Educación y 31 universidades", "ja": "第20期中央第8次巡視の対象を公表 教育部と31大学"}, "body": {"zh": "24 日，二十届中央第八轮巡视对象公布，将对教育部、北京大学、清华大学、中国人民大学、复旦大学、上海交通大学等 32 家单位党组织开展常规巡视。名单中 31 家为高校，覆盖多所「双一流」建设高校，巡视重点包括落实党中央重大决策部署、全面从严治党和基层党组织建设情况。", "en": "The targets of the eighth round of inspections by the 20th Central Committee were released on the 24th. Regular inspections will cover 32 party organisations, including the Ministry of Education and universities such as Peking, Tsinghua, Renmin, Fudan and Shanghai Jiao Tong. Thirty-one of them are universities, many part of the Double First-Class programme; the inspections focus on implementation of central decisions, full and rigorous party governance and grassroots party building.", "es": "El 24 se dieron a conocer los objetivos de la octava ronda de inspecciones del XX Comité Central. Se inspeccionarán 32 organizaciones del partido, entre ellas el Ministerio de Educación y universidades como Pekín, Tsinghua, Renmin, Fudan y Shanghai Jiao Tong. Treinta y una son universidades, muchas del programa Doble Primera Clase; se examinará la aplicación de las decisiones centrales, la gobernanza estricta del partido y la construcción de bases.", "ja": "24日、第20期中央第8次巡視の対象が公表された。教育部と北京大学、清華大学、中国人民大学、復旦大学、上海交通大学など32機関の党組織が通常巡視を受ける。うち31が大学で、「双一流」建設校を多く含む。党中央の重大決定の実行、全面的な厳格な党運営、基層党組織の建設状況が重点となる。"}, "why": {"zh": "一次巡视把教育部和 31 所高校放在同一张名单上，指向的是教育系统的治理能力。招生、科研经费、基建采购历来是廉政风险高发区，巡视反馈往往随后带来制度性整改。", "en": "Putting the ministry and 31 universities on one list points at governance capacity across the education system. Admissions, research funding and construction procurement have long been high-risk areas, and inspection feedback usually brings institutional fixes.", "es": "Reunir al ministerio y a 31 universidades en una misma lista apunta a la capacidad de gobernanza del sistema educativo. Las admisiones, los fondos de investigación y las compras de infraestructura son áreas de alto riesgo, y las conclusiones suelen traer reformas institucionales.", "ja": "教育部と31大学を同じ名簿に載せたことは、教育システムのガバナンス能力を問うものだ。入学選抜、研究費、建設調達は従来からリスクの高い分野で、巡視の指摘は制度改正につながることが多い。"}}, {"idx": "02", "title": {"zh": "党的二十届五中全会 26 日至 29 日在京召开，议程聚焦全面从严治党", "en": "Party Plenum Set for 26-29 October in Beijing, Focused on Strict Party Governance", "es": "El pleno del Partido se celebra del 26 al 29 de octubre en Pekín, centrado en la disciplina interna", "ja": "第20期五中全会は26〜29日に北京で開催 全面従厳治党が議題"}, "body": {"zh": "中国共产党第二十届中央委员会第五次全体会议将于 10 月 26 日至 29 日在北京召开，主要议程是中共中央政治局向中央委员会报告工作，研究持之以恒推进全面从严治党若干重大问题。新华社 24 日播发长文回顾新时代全面从严治党历程，称此次全会对巩固党的执政地位、实现党的使命任务意义重大。", "en": "The fifth plenary session of the 20th Central Committee of the Communist Party of China will be held in Beijing from 26 to 29 October. Its main agenda is the Political Bureau's report to the Central Committee and the study of major issues in persistently advancing full and rigorous party governance. Xinhua published a long review on the 24th, saying the session is of great significance for consolidating the party's governing position and fulfilling its mission.", "es": "El quinto pleno del XX Comité Central del Partido Comunista de China se celebrará en Pekín del 26 al 29 de octubre. Su orden del día principal es el informe del Buró Político al Comité Central y el estudio de cuestiones importantes para impulsar de forma sostenida una gobernanza estricta del partido. Xinhua publicó el 24 un extenso repaso y calificó la cita de gran importancia para consolidar la posición de gobierno del partido.", "ja": "中国共産党第20期中央委員会第5回総会が10月26日から29日まで北京で開催される。主な議題は中共中央政治局から中央委員会への活動報告と、全面従厳治党を持続的に進めるうえでの若干の重大問題の検討。新華社は24日、今回の総会が党の執政地位の巩固と使命の遂行にとって重大な意義を持つと伝える長文を配信した。"}, "why": {"zh": "五中全会通常承担定调功能。这次把「全面从严治党」作为主题，意味着未来一段时间的干部管理、监督体系与作风建设会有更明确的制度化安排。", "en": "Plenums usually set the tone for what follows. Making strict party governance the theme implies clearer institutional arrangements for cadre management, supervision and work style in the period ahead.", "es": "Los plenos suelen marcar la pauta. Que el tema sea la gobernanza estricta del partido implica arreglos institucionales más definidos en gestión de cuadros, supervisión y estilo de trabajo.", "ja": "総会は方向性を示す場だ。今回「全面従厳治党」を主題に据えたことは、今後の幹部管理、監督体制、職務作风により明確な制度的枠組みが示されることを意味する。"}}, {"idx": "03", "tag": {"zh": "进展"}, "title": {"zh": "巴青地震救灾转入安置：52450 件物资运抵，2500 余人投入救援", "en": "Baqing Quake Response Moves to Resettlement: 52,450 Relief Items Delivered, 2,500 Rescuers Deployed", "es": "El operativo en Baqing pasa a la reubicación: 52.450 lotes de ayuda y más de 2.500 rescatistas", "ja": "バチェン地震は避難生活へ 救援物資52,450点、2,500人超が従事"}, "body": {"zh": "截至 24 日 11 时，西藏那曲市巴青县 7.0 级地震已致 16 人遇难、76 人受伤。国家、自治区、市、县四级调配的 52450 件（套）救灾物资已陆续运往灾区，各级救援力量超 2500 人投入抢险救援，县城道路交通主干道保持畅通，救灾工作有序开展。", "en": "By 11 a.m. on the 24th, the magnitude-7.0 earthquake in Baqing county, Nagqu, Tibet, had killed 16 people and injured 76. A total of 52,450 relief items allocated at national, regional, municipal and county levels have been arriving in the disaster zone, with more than 2,500 rescuers deployed. Main roads in the county seat remain open and relief work is proceeding in an orderly way.", "es": "Hasta las 11:00 del día 24, el terremoto de magnitud 7,0 en el condado de Baqing, Nagqu (Tíbet), había causado 16 muertos y 76 heridos. Un total de 52.450 lotes de ayuda asignados a nivel nacional, regional, municipal y comarcal han ido llegando a la zona, con más de 2.500 rescatistas desplegados. Las vías principales de la capital comarcal siguen abiertas y la asistencia avanza de forma ordenada.", "ja": "24日11時現在、チベット那曲市バチェン県のマグニチュード7.0の地震で16人が死亡、76人が負傷した。国・自治区・市・県の4段階で配分された救援物資52,450点（組）が順次被災地へ運ばれ、2,500人超の救援要員が従事している。県城の幹線道路は通行可能で、救援活動は秩序立てて進んでいる。"}, "why": {"zh": "高原震区的难点不在「救」而在「供」——低温、缺氧、路远，帐篷和取暖物资的到位速度决定受灾群众能不能熬过最初几夜。物资数量公开得越细，越方便外界判断缺口在哪。", "en": "The hard part on the plateau is not rescue but supply: cold, thin air and long distances mean the speed of tents and heating supplies decides whether people get through the first nights. The more granular the published figures, the easier it is to see where the gaps are.", "es": "En la meseta la dificultad no es el rescate sino el abastecimiento: frío, poco oxígeno y distancias largas hacen que la llegada de tiendas y calefacción decida si la gente supera las primeras noches. Cuanto más detalladas las cifras, más fácil ver dónde faltan recursos.", "ja": "高原被災地の難しさは「救助」より「供給」にある。低温、低酸素、遠距離という条件の下では、テントと暖房資材の到着速度が最初の数日を越えられるかを左右する。物資の数字が細かいほど、不足が見えやすい。"}}, {"idx": "04", "title": {"zh": "渝昆高铁全线铺轨完成，乌蒙山区将连片接入高铁网", "en": "Chongqing-Kunming High-Speed Line Completes Track Laying, Bringing the Wumeng Mountains Onto the Network", "es": "El tren de alta velocidad Chongqing-Kunming completa la vía y conecta la región de Wumeng", "ja": "渝昆高速鉄道が全線レール敷設完了 烏蒙山区が高速鉄道網に接続へ"}, "body": {"zh": "24 日 13 时 30 分，最后一对 500 米长钢轨在渝昆高铁筠连隧道进口铺设就位，全线铺轨完成。线路全长约 700 公里、设计时速 350 公里，途经重庆、四川、贵州、云南，纵贯乌蒙山区，桥隧比高达 87.4%，超 10 公里的隧道有 10 座。下一步进入静态验收与联调联试，预计 2027 年上半年具备通车条件。", "en": "At 1:30 p.m. on the 24th the last pair of 500-metre rails was laid at the entrance to the Junlian tunnel, completing track laying on the Chongqing-Kunming high-speed railway. The roughly 700-kilometre line, designed for 350 km/h, runs through Chongqing, Sichuan, Guizhou and Yunnan and cuts through the Wumeng Mountains, with bridges and tunnels accounting for 87.4% of its length and ten tunnels longer than 10 kilometres. Static acceptance and integrated testing come next, with operation expected in the first half of 2027.", "es": "A las 13:30 del día 24 se colocó el último par de carriles de 500 metros en la entrada del túnel de Junlian, completando la vía del tren de alta velocidad Chongqing-Kunming. La línea, de unos 700 kilómetros y diseñada para 350 km/h, atraviesa Chongqing, Sichuan, Guizhou y Yunnan y cruza la región montañosa de Wumeng, con un 87,4% de puentes y túneles y diez túneles de más de 10 kilómetros. Ahora llegan la aceptación estática y las pruebas integradas; se prevé que esté operativa en el primer semestre de 2027.", "ja": "24日13時30分、最後の500メートルレールが筠連トンネル坑口に敷設され、渝昆高速鉄道の全線レール敷設が完了した。全長約700キロ、設計時速350キロで、重慶・四川・貴州・雲南を通り、烏蒙山区を縦断する。橋梁とトンネルの比率は87.4%に達し、10キロ超のトンネルは10本。次は静的検収と総合試験に入り、2027年上半期の開業が見込まれる。"}, "why": {"zh": "通车后昆明到重庆 2.5 小时、到成都 3 小时以内，改变的不只是旅行时间——乌蒙山区连片接入高铁网，意味着劳务输出、农产品冷链和旅游客流会重新排布。", "en": "Once open, Kunming will be 2.5 hours from Chongqing and under 3 hours from Chengdu. What changes is not only travel time: connecting the Wumeng Mountains to the network rearranges labour migration, cold-chain farm produce and tourist flows.", "es": "Con la línea en servicio, Kunming quedará a 2,5 horas de Chongqing y a menos de 3 de Chengdu. No cambia solo el tiempo de viaje: conectar Wumeng a la red reordena la migración laboral, la cadena de frío agrícola y los flujos turísticos.", "ja": "開業後、昆明―重慶は2.5時間、昆明―成都は3時間以内になる。変わるのは移動時間だけではない。烏蒙山区が鉄道網につながることで、出稼ぎ、農産物のコールドチェーン、観光客の流れが組み替えられる。"}}, {"idx": "05", "title": {"zh": "一箭六星：遥感五十三号 07-09 星、遥感五十六号 19-21 星入轨", "en": "Six Satellites in One Launch: Yaogan-53 07-09 and Yaogan-56 19-21 Reach Orbit", "es": "Seis satélites en un lanzamiento: Yaogan-53 07-09 y Yaogan-56 19-21 en órbita", "ja": "1機6星で打ち上げ 遥感53号07-09星と遥感56号19-21星が軌道へ"}, "body": {"zh": "24 日 3 时 25 分，我国在酒泉卫星发射中心使用长征四号乙运载火箭，成功将遥感五十三号 07-09 星、遥感五十六号 19-21 星共 6 颗卫星送入预定轨道。卫星主要用于科学试验、国土资源普查、农产品估产和防灾减灾等领域。这是长征系列运载火箭第 673 次飞行。", "en": "At 3:25 a.m. on the 24th China launched six satellites from the Jiuquan centre atop a Long March 4B rocket: Yaogan-53 07 through 09 and Yaogan-56 19 through 21. They entered their planned orbits and will mainly serve scientific experiments, land and resource surveys, crop yield estimation and disaster prevention and relief. It was the 673rd flight of the Long March family.", "es": "A las 3:25 del día 24, China lanzó seis satélites desde el centro de Jiuquan con un cohete Larga Marcha 4B: Yaogan-53 07 a 09 y Yaogan-56 19 a 21. Entraron en su órbita prevista y se usarán para experimentos científicos, inventario de recursos, estimación de cosechas y prevención de desastres. Fue el vuelo 673 de la familia Larga Marcha.", "ja": "24日3時25分、中国は酒泉衛星発射センターから長征4号Bロケットで遥感53号07〜09星と遥感56号19〜21星の計6基を打ち上げ、予定軌道に投入した。科学実験、国土資源調査、農産物の収量予測、防災減災などに用いられる。長征シリーズの673回目の飛行となる。"}, "why": {"zh": "一次发射六颗遥感星，说明我国对地观测正在走「组网+高频重访」的路子。农产品估产、灾害评估这类应用，靠的正是同一区域被反复、快速拍到。", "en": "Six remote-sensing satellites on one rocket shows China's Earth observation moving toward constellation coverage and high revisit rates. Crop forecasting and disaster assessment depend precisely on the same area being imaged often and quickly.", "es": "Seis satélites de observación en un solo cohete muestran que la observación de la Tierra avanza hacia constelaciones y revisitas frecuentes. La estimación de cosechas y la evaluación de desastres dependen de fotografiar la misma zona a menudo y rápido.", "ja": "1回の打ち上げで6基のリモートセンシング衛星を投入したことは、地球観測が「コンステレーション化＋高頻度再訪」へ進んでいることを示す。収量予測や災害評価は、同じ地域を繰り返し素早く撮ることが前提になる。"}}]}, {"key": "fin", "num": "03", "color": "#b45309", "deep": "#8a3f07", "name": {"zh": "金融要闻", "en": "FINANCE", "es": "FINANZAS", "ja": "金融要聞"}, "items": [{"idx": "01", "tag": {"zh": "进展"}, "title": {"zh": "现货黄金跌破 4000 美元，国内金饰克价一个月跌约百元", "en": "Spot Gold Falls Below $4,000; Chinese Jewellery Prices Down About 100 Yuan a Gram in a Month", "es": "El oro al contado cae bajo 4.000 dólares y la joyería china baja unos 100 yuanes por gramo en un mes", "ja": "金現物が4,000ドル割れ 中国の宝飾品は1カ月で1グラム約100元下落"}, "body": {"zh": "周五现货黄金价格跌破每盎司 4000 美元关口。10 月 24 日，老庙黄金足金饰品每克下跌约 12 元，周生生、周大福、老凤祥足金饰品报价下跌约 6 元。9 月 24 日国内品牌金饰克价普遍在 1300 元附近，一个月内已回落约 100 元。", "en": "Spot gold fell below $4,000 an ounce on Friday. On 24 October, Lao Miao cut its pure-gold jewellery price by about 12 yuan a gram, while Chow Sang Sang, Chow Tai Fook and Lao Feng Xiang dropped roughly 6 yuan. On 24 September major brands were quoting around 1,300 yuan a gram, so prices have come down about 100 yuan in a month.", "es": "El viernes el oro al contado perdió el nivel de 4.000 dólares la onza. El 24 de octubre, Lao Miao recortó su joyería de oro puro unos 12 yuanes por gramo, y Chow Sang Sang, Chow Tai Fook y Lao Feng Xiang unos 6 yuanes. El 24 de septiembre las grandes marcas cotizaban cerca de 1.300 yuanes por gramo, de modo que el precio ha bajado unos 100 yuanes en un mes.", "ja": "金曜日、金の現物価格は1オンス4,000ドルを割り込んだ。10月24日、老廟黄金は純金宝飾品を1グラム当たり約12元値下げし、周生生、周大福、老鳳祥も約6元下げた。9月24日には主要ブランドの価格は1グラム1,300元前後だったため、1カ月で約100元下がったことになる。"}, "why": {"zh": "金价跌得比涨得快，最先受伤的是「追高买金」的普通人。金饰还有工费和品牌溢价，回收时按金料计价，价差往往比这一百元更大——这也是「买金保值」最容易被忽略的一课。", "en": "Gold is falling faster than it rose, and the first to feel it are ordinary buyers who chased the rally. Jewellery carries fabrication fees and brand premiums but is bought back at bullion value, so the real gap is often wider than that 100 yuan, the most overlooked lesson in buying gold as a store of value.", "es": "El oro cae más rápido de lo que subió y los primeros afectados son los compradores que persiguieron el rally. La joyería incluye mano de obra y prima de marca, pero se recompra a precio de metal, así que la brecha real suele ser mayor que esos 100 yuanes: la lección más olvidada del oro como reserva de valor.", "ja": "金は上がるより速く下がり、真っ先に影響を受けるのは高値で買った一般の購入者だ。宝飾品には加工費とブランド料が乗るが、買い取りは地金価格で行われるため、実際の差はこの100元より大きいことが多い。金で資産を守るという話で最も見落とされる点だ。"}}, {"idx": "02", "title": {"zh": "本周 A 股集体调整，股票型与跨境 ETF 合计净流入 1580.77 亿元", "en": "A-Shares Slip This Week While Equity and Cross-Border ETFs Take In 158.08 Billion Yuan", "es": "La bolsa china corrige y los ETF de renta variable y transfronterizos captan 158.077 millones de yuanes", "ja": "今週のA株は調整も、株式型・クロスボーダーETFに1,580.77億元が流入"}, "body": {"zh": "本周主要股指集体调整，沪深两市股票型 ETF 与跨境型 ETF 合计净流入 1580.77 亿元。行业主题上，机器人相关 ETF 获资金青睐，半导体设备、煤炭相关 ETF 被抛售。10 月 23 日 A 股探底回升，沪指收 3690.48 点、涨 0.89%，深证成指涨 2.79%，创业板指涨 4.16%，成交额 1.97 万亿元。", "en": "Major indices fell this week, yet equity and cross-border ETFs listed in Shanghai and Shenzhen took in a net 158.08 billion yuan. By theme, robotics ETFs attracted money while semiconductor-equipment and coal ETFs were sold. On 23 October A-shares rebounded from early lows: the Shanghai Composite closed at 3,690.48, up 0.89%, the Shenzhen Component rose 2.79% and ChiNext 4.16%, on turnover of 1.97 trillion yuan.", "es": "Los principales índices cayeron esta semana, pero los ETF de renta variable y transfronterizos de Shanghái y Shenzhen captaron 158.077 millones de yuanes netos. Por temática, los ETF de robótica atrajeron dinero y los de equipos de semiconductores y carbón fueron vendidos. El 23 de octubre la bolsa rebotó: el Shanghai Composite cerró en 3.690,48 puntos (+0,89%), el Shenzhen Component subió 2,79% y ChiNext 4,16%, con un volumen de 1,97 billones de yuanes.", "ja": "今週は主要指数がそろって調整したが、上海・深圳の株式型ETFとクロスボーダー型ETFには合計1,580.77億元が純流入した。テーマ別ではロボット関連ETFに資金が向かい、半導体製造装置や石炭関連ETFは売られた。10月23日のA株は底打ちから反発し、上海総合指数は3,690.48（+0.89%）、深セン成分指数は2.79%高、創業板指数は4.16%高、売買代金は1兆9,700億元だった。"}, "why": {"zh": "指数在跌、ETF 在进，说明有一批资金把回调当成了建仓窗口，而且方向很明确——加机器人、减半导体设备与煤炭。这种「越跌越买」的结构性偏好，比指数点位更能说明市场在想什么。", "en": "Indices down, ETFs up: some money is treating the pullback as an entry window, and its direction is clear, adding robotics and cutting semiconductor equipment and coal. That structural preference says more about market thinking than the index level does.", "es": "Índices abajo, ETF arriba: parte del dinero ve la corrección como ventana de entrada y su dirección es clara, más robótica y menos equipos de semiconductores y carbón. Esa preferencia estructural dice más del mercado que el nivel del índice.", "ja": "指数は下がりETFには資金が入る。押し目を買い場と見る資金があり、方向も明確だ。ロボットを買い、半導体製造装置と石炭を売る。この構造的な選好は、指数の水準よりも市場の考え方をよく示している。"}}, {"idx": "03", "title": {"zh": "美联储下周议息，市场预期按兵不动；穆迪维持法国 Aa3 评级", "en": "Fed Meets Next Week With Markets Expecting a Hold; Moody's Keeps France at Aa3", "es": "La Fed se reúne la próxima semana y el mercado espera una pausa; Moody's mantiene la Aa3 de Francia", "ja": "FRBは来週の会合で据え置き観測 ムーディーズはフランスをAa3維持"}, "body": {"zh": "美联储下周召开议息会议，市场预期 10 月按兵不动。穆迪在评级审查中维持法国 Aa3 主权信用评级不变，但展望仍为负面，理由是政治不稳定将持续制约财政整顿。法国 10 年期国债收益率此前一度突破 5%，法德利差处于 2011 年以来高位。", "en": "The Federal Reserve meets next week, with markets expecting no change in October. Moody's kept France's sovereign rating at Aa3 but maintained a negative outlook, citing political instability that will keep weighing on fiscal consolidation. French 10-year yields had briefly pushed above 5%, with the spread over Germany near its widest since 2011.", "es": "La Reserva Federal se reúne la próxima semana y el mercado espera que no mueva tipos en octubre. Moody's mantuvo la calificación soberana de Francia en Aa3 pero conservó la perspectiva negativa, por la inestabilidad política que seguirá lastrando la consolidación fiscal. El bono francés a diez años superó brevemente el 5% y la prima frente a Alemania está cerca de máximos desde 2011.", "ja": "FRBは来週に会合を開くが、市場は10月の据え置きを予想している。ムーディーズはフランスの主权格付けをAa3に据え置いたが、政治的不安定が財政健全化を圧迫し続けるとして見通しは「ネガティブ」を維持した。フランス10年債利回りは一時5%を超え、独仏スプレッドは2011年以来の高水準にある。"}, "why": {"zh": "一个「按兵不动」的美联储加一个「勉强保住评级」的法国，构成同一枚硬币的两面：高债务经济体正在为政治僵局付利息。对新兴市场来说，美元利率停在高位的每一周，都是资本外流的压力测试。", "en": "A Fed on hold and a France that barely kept its rating are two sides of one coin: high-debt economies are paying interest on political gridlock. For emerging markets, every week that dollar rates stay high is another stress test for capital outflows.", "es": "Una Fed en pausa y una Francia que apenas conserva la nota son dos caras de la misma moneda: las economías muy endeudadas pagan intereses por el bloqueo político. Para los mercados emergentes, cada semana con tipos altos en dólares es otra prueba de estrés para la salida de capitales.", "ja": "据え置きのFRBと、格付けを辛うじて維持したフランスは同じコインの裏表だ。高債務の経済は政治の停滞に利子を払っている。新興国にとって、ドル金利が高いままの一週間ごとに、資本流出のストレステストが続く。"}}, {"idx": "04", "title": {"zh": "南方区域电力市场正式运行：全球最大「电力超市」，主体超 29 万家", "en": "Southern China Power Market Goes Live: The World's Largest Electricity Bazaar, 290,000 Participants", "es": "El mercado eléctrico del sur de China entra en operación: el mayor «supermercado eléctrico» del mundo", "ja": "南方区域電力市場が本格運用 世界最大の「電力スーパー」、29万社超が参加"}, "body": {"zh": "我国首个区域电力市场——南方区域电力市场从试运行转入正式运行，经营主体已超 29 万家，涵盖发电企业、售电公司、电力用户、新型储能与虚拟电厂。目前区域新能源发电利用率保持在 95% 以上，高于全国平均水平。", "en": "China's first regional electricity market, covering the south, has moved from trial to formal operation with more than 290,000 participants, including generators, retailers, large users, new-type storage and virtual power plants. Renewable utilisation in the region stays above 95%, higher than the national average.", "es": "El primer mercado eléctrico regional de China, el del sur, pasó de la prueba a la operación formal con más de 290.000 participantes: generadores, comercializadores, grandes consumidores, almacenamiento de nuevo tipo y plantas virtuales. El aprovechamiento renovable de la región se mantiene por encima del 95%, más que la media nacional.", "ja": "中国初の区域電力市場である南方区域電力市場が試行から本格運用に移行した。発電事業者、小売事業者、需要家、新型蓄電池、仮想発電所など参加主体は29万社超。域内の再生可能エネルギーの利用率は95%以上で全国平均を上回る。"}, "why": {"zh": "电力市场的意义在于「跨省买电」变成常态：风光大发时能把电卖出去，缺电时能买到便宜电。虚拟电厂和储能正式入市，也让用电大户第一次能像交易员一样管理自己的负荷。", "en": "The point is that buying power across provinces becomes routine: sell when wind and solar surge, buy cheap when short. Virtual plants and storage now trade officially, letting big consumers manage their load like traders for the first time.", "es": "La clave es que comprar electricidad entre provincias se vuelva rutina: vender cuando sopla el viento o brilla el sol y comprar barato cuando falta. Las plantas virtuales y el almacenamiento ya cotizan, y los grandes consumidores pueden gestionar su demanda como operadores.", "ja": "重要なのは「省をまたいで電気を買う」ことが日常になることだ。風力・太陽光が伸びるときに売り、不足時に安く買う。仮想発電所や蓄電池が正式に市場へ入り、大口需要家も初めてトレーダーのように自らの負荷を管理できる。"}}, {"idx": "05", "title": {"zh": "花旗证券（中国）获批设立，外资独资券商增至 7 家", "en": "Citi Securities (China) Approved, Taking Wholly Foreign-Owned Brokers to Seven", "es": "Se aprueba Citi Securities (China) y ya son siete las corredurías de capital extranjero", "ja": "シティ証券（中国）の設立認可 外資100%の証券会社は7社に"}, "body": {"zh": "中国证监会核准设立花旗证券（中国）有限公司，由花旗环球金融控股有限公司 100% 控股，注册资本 12 亿元人民币，成为国内第七家外资独资券商。此前已有多家外资独资或外资控股券商落地，业务范围覆盖证券经纪、承销保荐与支付清算等领域。", "en": "The China Securities Regulatory Commission approved the establishment of Citi Securities (China) Co Ltd, wholly owned by Citigroup Global Markets Holdings with registered capital of 1.2 billion yuan, making it the seventh wholly foreign-owned brokerage in the country. Several foreign-owned or foreign-controlled brokers already operate there, in areas from brokerage and underwriting to payment clearing.", "es": "La Comisión Reguladora de Valores de China aprobó la creación de Citi Securities (China) Co Ltd, controlada al 100% por Citigroup Global Markets Holdings con un capital registrado de 1.200 millones de yuanes, la séptima correduría de propiedad totalmente extranjera del país. Ya operan varias firmas de capital extranjero en corretaje, colocación de emisiones y compensación de pagos.", "ja": "中国証券監督管理委員会は、シティグループ・グローバル・マーケッツ・ホールディングスが100%出資し、資本金12億元のシティ証券（中国）有限公司の設立を認可した。外資100%の証券会社としては国内7社目となる。すでに複数の外資系証券が証券仲介、引受、決済清算などの分野で事業を行っている。"}, "why": {"zh": "外资券商多一家，短期不会改变市场格局，但会改变「谁能服务谁」——跨境并购、境外上市、全球资产配置这些业务，外资的牌照越全，中资券商面对的竞争就越具体。", "en": "One more foreign broker will not change the market overnight, but it changes who can serve whom: in cross-border M&A, overseas listings and global allocation, the fuller the foreign licences, the more concrete the competition for Chinese firms.", "es": "Una correduría extranjera más no cambiará el mercado de inmediato, pero sí quién puede atender a quién: en fusiones transfronterizas, salidas a bolsa en el exterior y asignación global de activos, cuanto más completas las licencias extranjeras, más concreta la competencia para las firmas chinas.", "ja": "外資系証券が1社増えても市場構造はすぐには変わらない。だが「誰が誰にサービスできるか」は変わる。クロスボーダーM&A、海外上場、グローバル資産配分といった分野では、外資の免許が揃うほど中国系証券との競争は具体的になる。"}}]}, {"key": "spo", "num": "04", "color": "#15803d", "deep": "#0f5c2a", "name": {"zh": "体育竞技", "en": "SPORTS", "es": "DEPORTES", "ja": "スポーツ競技"}, "items": [{"idx": "01", "tag": {"zh": "进展"}, "title": {"zh": "蓉城再失冠军点：0-1 负英博，中超争冠拖到 11 月 8 日末轮", "en": "Chengdu Miss Another Title Chance: 0-1 to Yingbo, CSL Race Goes to the Final Day", "es": "El Chengdu falla otra vez: 0-1 ante Yingbo y el título se decide el 8 de noviembre", "ja": "成都蓉城がまたも優勝逃す 英博に0-1、勝負は11月8日の最終節へ"}, "body": {"zh": "中超第 29 轮，成都蓉城主场 0-1 不敌大连英博。第 38 分钟费利佩主罚点球被门将刘伟国扑出，第 66 分钟马马杜头球破门，补时阶段胡荷韬补射入网因越位被判无效。蓉城仍以 52 分领先 3 分，末轮 11 月 8 日客场对山东泰山，打平即可夺冠；武汉三镇 3-5 负泰山提前降级；北京国安 0-3 落后后 4-3 逆转河南。", "en": "Chengdu Rongcheng lost 0-1 at home to Dalian Yingbo in round 29 of the Chinese Super League. Felipe's 38th-minute penalty was saved by goalkeeper Liu Weiguo, Mamadou headed in on 66 minutes and Hu Hetao's stoppage-time finish was ruled offside. Chengdu still lead by three points on 52; on the final day, 8 November, they visit Shandong Taishan and need only a draw. Wuhan Three Towns lost 3-5 to Taishan and were relegated, while Beijing Guoan came from 0-3 down to beat Henan 4-3.", "es": "El Chengdu Rongcheng perdió 0-1 en casa ante el Dalian Yingbo en la jornada 29 de la Superliga china. El penalti de Felipe en el minuto 38 lo detuvo el portero Liu Weiguo, Mamadou marcó de cabeza en el 66 y el gol de Hu Hetao en el descuento fue anulado por fuera de juego. El Chengdu sigue líder con 52 puntos, tres más; el 8 de noviembre visita al Shandong Taishan y le basta empatar. El Wuhan Three Towns cayó 3-5 ante el Taishan y descendió, y el Beijing Guoan remontó un 0-3 para ganar 4-3 al Henan.", "ja": "中国スーパーリーグ第29節、成都蓉城はホームで大連英博に0-1で敗れた。38分にフェリペのPKがGK劉偉国に止められ、66分にママドゥがヘディングで先制。終了間際の胡荷韜のゴールはオフサイドで取り消された。成都は52ポイントで3差を保ち、11月8日の最終節に山東泰山の敵地で引き分け以上なら優勝。武漢三鎮は泰山に3-5で敗れ降格、北京国安は0-3から4-3で河南を逆転した。"}, "why": {"zh": "连续四轮错失「冠军点」，蓉城的问题不是实力而是临门那一下的心态。末轮客场打泰山、打平就夺冠，听起来容易，但本赛季他们已经证明：越接近终点，越容易手抖。", "en": "Four rounds without converting a championship point suggests Chengdu's problem is nerve, not quality. A draw away at Taishan would be enough, which sounds simple, but this season they have proved that the closer the finish, the shakier they get.", "es": "Cuatro jornadas sin aprovechar el punto de título sugieren que al Chengdu le falta temple, no nivel. Un empate en casa del Taishan bastaría, lo que suena sencillo, pero esta temporada han demostrado que cuanto más cerca está la meta, más tiemblan.", "ja": "4節続けて優勝のチャンスを逃したのは、力ではなく最後の一押しの心理だろう。最終節に泰山の敵地で引き分け以上なら優勝と聞けば簡単に思えるが、今季の成都はゴールが近いほど手が震えることを証明してきた。"}}, {"idx": "02", "title": {"zh": "兰星宇吊环 14.766 分夺金，中国体操收获本届世锦赛第二冠", "en": "Lan Xingyu Wins Rings With 14.766 as China Takes a Second World Championships Gold", "es": "Lan Xingyu gana en anillas con 14,766 y China suma su segundo oro mundialista", "ja": "蘭星宇がつり輪で14.766 中国体操は今大会2つ目の金"}, "body": {"zh": "鹿特丹体操世锦赛首个单项决赛日，兰星宇以难度 6.0、完成分 8.766、总分 14.766 夺得男子吊环金牌，领先希腊老将佩特鲁尼亚斯 0.433 分，继 2021 年北九州世锦赛后第二次拿下该项目世界冠军。继女团夺冠后，这是中国队本届第二金。25 日晚进行最后五个单项决赛，邹敬园出战双杠冲击个人第五冠，张清颖、邱祺缘联手冲击平衡木。", "en": "On the first apparatus finals day in Rotterdam, Lan Xingyu took the men's rings title with a 6.0 difficulty routine, 8.766 for execution and 14.766 overall, beating Greece's Petrounias by 0.433 and winning the event for the second time after Kitakyushu 2021. It is China's second gold of these championships after the women's team title. Five more finals follow on the evening of the 25th, with Zou Jingyuan chasing a fifth parallel bars world title and Zhang Qingying and Qiu Qiyuan both in the beam final.", "es": "En la primera jornada de finales por aparato en Róterdam, Lan Xingyu ganó el título de anillas con una dificultad de 6,0, 8,766 de ejecución y 14,766 total, superando en 0,433 al griego Petrounias y logrando su segundo mundial de la especialidad tras Kitakyushu 2021. Es el segundo oro chino tras el título por equipos femenino. El 25 por la noche se disputan cinco finales más: Zou Jingyuan busca su quinto título mundial en paralelas y Zhang Qingying y Qiu Qiyuan compiten en barra.", "ja": "ロッテルダムの種目別決勝初日、蘭星宇が難度6.0、実施8.766、合計14.766で男子つり輪を制した。ギリシャのペトルニアスに0.433差をつけ、2021年北九州大会に続く2度目の世界一。女子団体に続く中国勢2つ目の金となる。25日夜には残り5種目の決勝が行われ、鄒敬園は平行棒で5度目の優勝を狙い、張清穎と邱祺縁は平均台に出場する。"}, "why": {"zh": "吊环是「慢功夫」项目，兰星宇赢在三个力量静止动作的停留时间与肩角标准——这类细节裁判看得见、观众看不见。31 岁的邹敬园今晚若再夺冠，中国体操的「老将续航」会是比奖牌更值得说的事。", "en": "Rings reward patience: Lan won on the held time and shoulder angles of three strength elements, details judges see and audiences do not. If 31-year-old Zou Jingyuan wins again tonight, the longevity of China's veterans will be a bigger story than the medal.", "es": "Las anillas premian la paciencia: Lan ganó por el tiempo de mantenimiento y los ángulos de hombro en tres elementos de fuerza, detalles que el jurado ve y el público no. Si esta noche gana Zou Jingyuan, de 31 años, la longevidad de los veteranos chinos será una historia mayor que la medalla.", "ja": "つり輪は「時間をかける」種目だ。蘭星宇が勝ったのは3つの力量静止技の保持時間と肩の角度で、審判には見えても観客には見えにくい部分だ。31歳の鄒敬園が今夜も勝てば、中国体操の「ベテランの持続力」はメダル以上に語る価値のある話題になる。"}}, {"idx": "03", "title": {"zh": "徐嘉余一晚两破纪录：100 仰亚洲纪录、50 仰世界纪录", "en": "Xu Jiayu Breaks Two Records in One Night: Asian 100 Back, World 50 Back", "es": "Xu Jiayu rompe dos récords en una noche: Asia en 100 espalda y mundo en 50 espalda", "ja": "徐嘉余が一夜で2記録 100背のアジア新、50背の世界新"}, "body": {"zh": "全国游泳锦标赛（25 米）第二比赛日，31 岁的徐嘉余在男子 100 米仰泳决赛游出 48 秒 77，打破自己 2018 年创造的 48 秒 88 亚洲纪录；一个多小时后，他在男女 4×50 米混合泳接力第一棒游出 22 秒 03，刷新南非选手科策今年创造的 22 秒 09 世界纪录。同场张雨霏 50 蝶 25 秒 12 夺冠，李冰洁 800 自 8 分 12 秒 25 摘金。", "en": "On day two of the national short-course championships, 31-year-old Xu Jiayu swam 48.77 in the 100m backstroke final, breaking his own Asian record of 48.88 set in 2018. Just over an hour later he led off the mixed 4x50m medley relay in 22.03, lowering the 50m backstroke world record of 22.09 set by South Africa's Pieter Coetzé this year. Zhang Yufei won the 50m butterfly in 25.12 and Li Bingjie the 800m freestyle in 8:12.25.", "es": "En la segunda jornada del campeonato nacional de piscina corta, Xu Jiayu, de 31 años, nadó 48,77 en la final de 100 espalda y batió su propio récord de Asia de 48,88 de 2018. Poco más de una hora después abrió el relevo mixto 4x50 estilos con 22,03 y rebajó el récord mundial de 50 espalda de 22,09 del sudafricano Coetzé. Zhang Yufei ganó los 50 mariposa (25,12) y Li Bingjie los 800 libre (8:12,25).", "ja": "短水路全国選手権2日目、31歳の徐嘉余が男子100メートル背泳ぎ決勝で48秒77を記録し、自身が2018年に出したアジア記録48秒88を更新した。1時間余り後の混合4×50メートルメドレーリレー第1泳者では22秒03をマークし、南アフリカのコッツェが今季出した世界記録22秒09を破った。張雨霏は50バタフライを25秒12、李冰潔は800自由形を8分12秒25で制した。"}, "why": {"zh": "短池放大水下腿和转身的优势，31 岁还能把亚洲纪录再削 0.11 秒、把世界纪录提 0.06 秒，靠的不是天赋而是技术细节的复利。他自己说「比一场少一场」，这句话比纪录更让人在意。", "en": "Short course magnifies underwater kicks and turns, and at 31 he still cut 0.11 seconds off an Asian record and 0.06 off a world record. That is compound interest on technical detail, not raw talent. His own line, that every race could be his last, lingers longer than the records.", "es": "La piscina corta amplifica las patadas subacuáticas y los virajes, y a los 31 años aún recortó 0,11 segundos a un récord de Asia y 0,06 a uno mundial. Es interés compuesto del detalle técnico, no talento bruto. Su frase, que cada carrera puede ser la última, queda más que los récords.", "ja": "短水路は水中の蹴りとターンの優位が増幅される。31歳でアジア記録を0.11秒、世界記録を0.06秒縮めたのは才能ではなく技術的細部の複利だ。「一試合ずつ減っていく」という本人の言葉の方が、記録よりも心に残る。"}}, {"idx": "04", "tag": {"zh": "进展"}, "title": {"zh": "亚残运名古屋闭幕：中国 207 金 117 银 111 铜，连续五届双榜第一", "en": "Nagoya Asian Para Games Close: China Takes 207 Golds and Tops Both Tables for a Fifth Time", "es": "Cierran los Juegos Paralímpicos Asiáticos de Nagoya: China logra 207 oros y lidera por quinta vez", "ja": "名古屋アジアパラ閉幕 中国は金207、5大会連続で二冠"}, "body": {"zh": "第五届亚洲残疾人运动会 24 日晚在名古屋瑞穗公园田径场闭幕。中国体育代表团共获 207 金 117 银 111 铜、合计 435 枚奖牌，连续五届位居金牌榜与奖牌榜首位，创境外参赛最好成绩，并打破 11 项世界纪录、18 项亚洲纪录。", "en": "The fifth Asian Para Games closed on the evening of the 24th at the Mizuho Park athletics stadium in Nagoya. China's delegation finished with 207 golds, 117 silvers and 111 bronzes, 435 medals in all, topping both tables for a fifth consecutive edition, its best result abroad, with 11 world and 18 Asian records broken.", "es": "Los quintos Juegos Paralímpicos Asiáticos se clausuraron la noche del 24 en el estadio de atletismo del parque Mizuho, en Nagoya. La delegación china terminó con 207 oros, 117 platas y 111 bronces, 435 medallas, liderando ambas tablas por quinta edición consecutiva, su mejor resultado en el exterior, con 11 récords mundiales y 18 asiáticos.", "ja": "第5回アジアパラ競技大会が24日夜、名古屋の瑞穂公園陸上競技場で閉幕した。中国選手団は金207、銀117、銅111の計435個で、5大会連続して金メダル数とメダル総数の両方で首位。海外大会では最高の成績で、世界記録11、アジア記録18を更新した。"}, "why": {"zh": "境外参赛最好成绩，比主场夺金更能说明训练体系的可复制性。残奥项目的分级、器材、教练配备都需要长期投入，435 枚奖牌背后是一整套不靠临场发挥的保障。", "en": "A best-ever result abroad says more about a repeatable training system than golds won at home. Classification, equipment and coaching in para sport need long-term investment, and 435 medals rest on support structures rather than on-the-day luck.", "es": "El mejor resultado en el exterior dice más de un sistema de entrenamiento replicable que los oros en casa. La clasificación, el material y los entrenadores del deporte paralímpico exigen inversión a largo plazo; 435 medallas se apoyan en estructuras, no en la suerte del día.", "ja": "海外での最高成績は、自国開催の金よりも再現可能な育成システムを示す。パラ競技のクラス分け、用具、指導者には長期投資が必要で、435個のメダルは当日の好調ではなく仕組みに支えられている。"}}, {"idx": "05", "title": {"zh": "CBA 第 4 轮：上海 94-89 福建登顶，广东 86-77 送宁波四连败", "en": "CBA Round 4: Shanghai Beat Fujian 94-89 to Top the Table, Guangdong Send Ningbo to a Fourth Loss", "es": "CBA jornada 4: Shanghái gana 94-89 a Fujian y lidera; Cantón condena a Ningbo a su cuarta derrota", "ja": "CBA第4節 上海が福建に94-89で首位、広東は寧波を86-77"}, "body": {"zh": "上海久事主场 94-89 险胜福建晋江文旅，古德温 18 投 13 中拿下 30 分 6 篮板 11 助攻，上海以 3 胜 1 负暂列积分榜首位。广东东阳光 86-77 胜宁波町渥，博日奇 26 分 10 篮板，末节打出 20-9；长白山恩都里 82-81 一分险胜浙江广厦，广厦最后一攻绝杀未果。宁波遭遇四连败。", "en": "Shanghai beat Fujian 94-89 at home as Goodwin scored 30 points on 13-of-18 shooting with six rebounds and 11 assists, lifting them to 3-1 and first place. Guangdong downed Ningbo 86-77 behind Bozic's 26 points and 10 rebounds, closing with a 20-9 run; Changbaishan beat Zhejiang Guangsha 82-81 after Guangsha missed a final shot. Ningbo have now lost four straight.", "es": "Shanghái venció 94-89 a Fujian en casa con 30 puntos de Goodwin (13 de 18), seis rebotes y 11 asistencias, y lidera con 3-1. Cantón ganó 86-77 a Ningbo con 26 puntos y 10 rebotes de Bozic y un parcial de 20-9 en el último cuarto; Changbaishan superó 82-81 a Zhejiang Guangsha, que falló el tiro final. Ningbo suma cuatro derrotas.", "ja": "上海久事はホームで福建に94-89と競り勝った。グッドウィンが18本中13本成功で30得点6リバウンド11アシストを記録し、上海は3勝1敗で首位。広東は寧波を86-77で下し、ボジッチが26得点10リバウンド、第4クォーターは20-9。長白山は浙江広厦に82-81で競り勝ち、広厦は最後の一撃を決められなかった。寧波は4連敗。"}, "why": {"zh": "四轮过后积分榜还很「糊」，但已经能看出两层：外援质量决定下限，末节单外援时段的本土球员决定上限。上海赢得难看但赢了，广厦输得漂亮但输了——常规赛最终记的是后者。", "en": "Four rounds in, the table is still muddy, but two layers show: imports set the floor, and local players in the single-import fourth quarter set the ceiling. Shanghai won ugly; Guangsha lost beautifully. The standings record only the former.", "es": "Tras cuatro jornadas la tabla sigue difusa, pero se ven dos capas: los extranjeros marcan el suelo y los nacionales en el último cuarto con un solo foráneo marcan el techo. Shanghái ganó feo; Guangsha perdió bonito. La clasificación solo registra lo primero.", "ja": "4節を終えても順位表は混とんとしているが、二層が見える。外国人選手が下限を決め、第4クォーターの1人枠での国内選手が上限を決める。上海は内容で勝ち、広厦は美しく負けた。順位表に残るのは前者だけだ。"}}]}, {"key": "hot", "num": "05", "color": "#6d28d9", "deep": "#4c1d95", "name": {"zh": "网络热点", "en": "TRENDING", "es": "TENDENCIAS", "ja": "ネット話題"}, "items": [{"idx": "01", "title": {"zh": "「独生女继承 2 亿遗产后被离婚分产」再登热搜，媒体核查：旧案翻炒、细节失真", "en": "\"Only Daughter Inherits 200 Million Yuan, Then Divorce\" Tops Weibo Again, But the Case Is an Old One", "es": "Vuelve a ser tendencia el caso de la heredera de 200 millones, pero es un caso antiguo y deformado", "ja": "「一人娘が2億元相続後に離婚分与」が再び話題 報道は「旧案の焼き直し」と指摘"}, "body": {"zh": "24 日，「独生女继承 2 亿遗产 1 年后遭离婚分产」冲上微博热搜第一。澎湃新闻核查发现，该案例早在 2023 年 11 月就曾刷屏，案件更早收录于 2021 年出版的《婚姻律师办案手记》；当时报道显示双方最终调解，男方分得小部分财产后撤诉，而非网传「法院按夫妻共同财产分割」。另有博主称该故事实为律师普法创作的剧本。", "en": "The claim that an only daughter inherited 200 million yuan and was divorced a year later, with her husband taking half, topped Weibo on the 24th. The Paper's check found the case first went viral in November 2023 and appears in a 2021 book by a divorce lawyer; reports at the time said the couple settled, the husband took a small share and withdrew the suit, not the rumoured equal split ordered by a court. Some bloggers say the story was a scripted teaching case.", "es": "El relato de una hija única que heredó 200 millones de yuanes y se divorció un año después, con reparto de bienes, encabezó Weibo el día 24. La verificación de The Paper halló que el caso ya se viralizó en noviembre de 2023 y figura en un libro de 2021 de un abogado de familia; los reportes de entonces indicaban que hubo acuerdo, que el marido recibió una parte pequeña y retiró la demanda, no el reparto igualitario que se difunde. Algunos blogueros afirman que fue un guion didáctico.", "ja": "「一人娘が2億元を相続し、1年後に離婚されて財産分与を求められた」という話題が24日、Weiboのトレンド1位になった。澎湃新聞の検証によると、この事例は2023年11月にも拡散し、2021年刊の離婚弁護士の手記に収録されていた。当時の報道では協議で解決し、男性は少額を得て訴えを取り下げたとされ、ネットで流れる「裁判所が均等分割」ではない。弁護士の教育用シナリオだとの指摘もある。"}, "why": {"zh": "这条热搜真正的价值不在「狗血」，而在它顺带普及了一条硬知识：婚内法定继承所得默认属于夫妻共同财产，除非遗嘱明确写明「只归子女个人」。但把旧案改写成「平分两亿」来引流，消耗的正是公众对普法内容的信任。", "en": "Its real value is not the melodrama but the hard rule it spreads: property inherited during a marriage counts as joint property by default unless a will states it belongs to the child alone. Rewriting an old case as an equal split to farm traffic spends down public trust in legal explainers.", "es": "Su valor real no es el melodrama, sino la regla que difunde: lo heredado durante el matrimonio es ganancial por defecto salvo que el testamento diga que pertenece solo al hijo. Reescribir un caso antiguo como un reparto igualitario para captar tráfico gastas la confianza en la divulgación jurídica.", "ja": "本当の価値は「ドロドロ」ではなく、広まった知識にある。婚姻中に法定相続した財産は、遺言で「子のみに帰属」と明記しない限り原則として共有財産になる。旧案を「2億の半分」に書き換えて集客するのは、普法コンテンツへの信頼を削っている。"}}, {"idx": "02", "title": {"zh": "企业微信客服号凌晨群发低俗引流，官方：第三方外挂被攻破", "en": "Corporate WeChat Service Accounts Push Low-Quality Promo Links at Dawn; Platform Blames a Hacked Third-Party Plugin", "es": "Cuentas de atención al cliente de WeChat Work envían enlaces promocionales de madrugada; la plataforma culpa a un plugin externo", "ja": "企業向けWeChatの窓口アカウントが未明に低俗な勧誘を一斉送信 外部プラグインの侵害が原因"}, "body": {"zh": "24 日凌晨起，安克、耐克、盒马等企业微信客服账号向客户发送疑似低俗引流链接与「新片每日」卡片，有用户称 5 时刚过就被骚扰。企业微信当日下午回应：系某第三方外挂软件服务被攻破，导致使用该外挂的账号受影响，已将受影响账号强制下线并封禁相关引流链接，并提醒「账号多开」「群控」类外挂存在账号被操控与数据泄露风险。安克称已冻结涉事账号并向公安机关报案。", "en": "From the early hours of the 24th, corporate WeChat service accounts branded Anker, Nike and Hema sent customers suspected low-quality promotional links and a card titled New Film Daily; some users said the messages arrived just after 5 a.m. WeCom said that afternoon that a third-party plugin service had been compromised, affecting accounts that used it, and that it had forced those accounts offline and blocked the links. It warned that multi-account and group-control plugins carry risks of account takeover and data leaks. Anker said it froze the accounts and reported to police.", "es": "Desde la madrugada del 24, cuentas de atención al cliente de WeChat Work con marcas como Anker, Nike y Hema enviaron enlaces promocionales sospechosos y una tarjeta titulada «Nueva película diaria»; algunos usuarios recibieron mensajes poco después de las 5:00. WeCom atribuyó el incidente a la vulneración de un servicio de plugin externo, afectó a las cuentas que lo usaban, las desconectó y bloqueó los enlaces. Advirtió de riesgos de control de cuentas y fuga de datos con plugins de multisesión y control de grupos. Anker congeló las cuentas y denunció ante la policía.", "ja": "24日未明から、Anker、Nike、Hema などの企業向け WeChat 窓口アカウントが、低俗な勧誘とみられるリンクや「新作映画毎日」と題したカードを顧客へ送信した。午前5時過ぎに迷惑を受けたとの利用者の声もある。WeComは同日午後、外部プラグインサービスの侵害が原因で、同プラグインを使うアカウントが影響を受けたと説明。該当アカウントを強制ログアウトし、リンクを遮断した。複数アカウント運用やグループ操作の外部ツールには乗っ取りや情報漏えいの危険があると警告した。Ankerはアカウントを凍結し警察に通報した。"}, "why": {"zh": "一个外挂被攻破，几百万客户关系瞬间变成诈骗入口——这是「效率工具」的隐性账单。企业买外挂省下的人力成本，最终会以品牌信任的形式还回去。", "en": "One compromised plugin turned millions of customer relationships into a phishing doorway. That is the hidden invoice of efficiency tools: the headcount a company saves comes back as brand trust spent.", "es": "Un plugin vulnerado convirtió millones de relaciones con clientes en una puerta de estafa. Es la factura oculta de las herramientas de eficiencia: el personal ahorrado se paga con confianza de marca.", "ja": "外部ツール1つの侵害で、数百万の顧客接点が詐欺の入口に変わった。これが「効率化ツール」の隠れた請求書だ。削減した人件費は、最終的にブランドへの信頼で支払うことになる。"}}, {"idx": "03", "title": {"zh": "国庆档总票房 11.65 亿创近十年新低，7.2 分国产片排片只剩 1.4%", "en": "National Day Box Office Hits a Decade Low of 1.165 Billion Yuan; a 7.2-Rated Film Is Left With 1.4% of Screenings", "es": "La taquilla del Puente Nacional cae a 1.165 millones y una película de 7,2 puntos queda con 1,4% de salas", "ja": "国慶節興収は11.65億元で約10年ぶり低水準 7.2点の作品は上映枠1.4%に"}, "body": {"zh": "2026 年国庆档以 11.65 亿元总票房收官，观影人次 3199.59 万，平均票价 36.41 元，国产片占比 78.7%，为近十年最低（2025 年同期 18.35 亿元、2024 年 21.04 亿元）。档期国产新片评分最高的《活色生香》（豆瓣 7.2）排片从首日 6.8% 跌至 1.4%，上映六天票房刚破千万。", "en": "The 2026 National Day holiday ended with 1.165 billion yuan in box office, 31.99 million admissions, an average ticket of 36.41 yuan and domestic films at 78.7% of receipts, the lowest in a decade against 1.835 billion in 2025 and 2.104 billion in 2024. The best-reviewed domestic release, the 7.2-rated Blossoms of Life, saw screenings fall from 6.8% on day one to 1.4%, taking just over 10 million yuan in six days.", "es": "El puente del Día Nacional de 2026 cerró con 1.165 millones de yuanes, 31,99 millones de espectadores, entrada media de 36,41 yuanes y un 78,7% para el cine nacional, el dato más bajo en una década frente a 1.835 millones en 2025 y 2.104 en 2024. La mejor valorada, Blossoms of Life (7,2), pasó del 6,8% de salas el primer día al 1,4% y lleva poco más de 10 millones en seis días.", "ja": "2026年の国慶節映画興収は11.65億元、観客動員3,199万5,900人、平均料金36.41元、国産映画が78.7%で、約10年ぶりの低水準となった（2025年は18.35億元、2024年は21.04億元）。国産新作で最高評価の『活色生香』（豆瓣7.2）は上映枠が初日6.8%から1.4%に減り、6日間で1,000万元をわずかに超えた。"}, "why": {"zh": "没有超级大片，档期就撑不起来；但更值得看的是《活色生香》的遭遇——口碑最好的片子拿不到黄金场次，因为它的观众是 40 岁以上女性和非一线城市。排片是算法，也是偏见。", "en": "Without a tentpole the holiday cannot hold up, but the more telling story is Blossoms of Life: the best-reviewed film cannot get prime slots because its audience is women over 40 and cities outside the top tier. Scheduling is an algorithm, and also a bias.", "es": "Sin un gran estreno el puente no se sostiene, pero lo revelador es Blossoms of Life: la mejor valorada no consigue salas prime time porque su público son mujeres de más de 40 años y ciudades no principales. La programación es algoritmo y también prejuicio.", "ja": "大作がなければ興行は持たない。だがより重要なのは『活色生香』の扱いだ。最高評価の作品がゴールデンタイムの枠を得られないのは、観客が40代以上の女性と地方都市だからだ。上映編成はアルゴリズムであり、偏見でもある。"}}, {"idx": "04", "tag": {"zh": "进展"}, "title": {"zh": "「蔷琵」在浙江近海转向，趋向日本西南部并渐变为温带气旋", "en": "\"Champi\" Turns Off Zhejiang, Heads for Southwest Japan and Weakens Into an Extratropical Cyclone", "es": "«Champi» gira frente a Zhejiang y se dirige al suroeste de Japón como ciclón extratropical", "ja": "台風30号「チャンピ」浙江沖で転向 日本の南西へ、温帯低気圧化へ"}, "body": {"zh": "中央气象台 24 日 18 时继续发布台风蓝色预警：第 30 号台风「蔷琵」以每小时 15 公里速度向北偏东移动、强度逐渐减弱，将在浙江东部近海转向东北，趋向日本西南部沿海并变性为温带气旋。受其影响，杭深铁路、金温铁路、杭台高铁部分列车 24 日临时停运或限速，24 日 20 时至 25 日 20 时华东多地仍有降雨，局地大雨。", "en": "The national meteorological centre kept a blue typhoon warning in force at 6 p.m. on the 24th: typhoon Champi, the 30th of the year, was moving north-northeast at 15 km/h and weakening, expected to turn northeast off eastern Zhejiang, head for southwest Japan and become an extratropical cyclone. Some trains on the Hangzhou-Shenzhen, Jinhua-Wenzhou and Hangzhou-Taizhou lines were suspended or speed-limited on the 24th, with rain continuing across eastern China into the 25th.", "es": "El centro meteorológico nacional mantuvo el aviso azul por tifón a las 18:00 del 24: el tifón Champi, el número 30 del año, avanzaba al nornordeste a 15 km/h y se debilitaba; se esperaba que girara al noreste frente a Zhejiang oriental, rumbo al suroeste de Japón, y se convirtiera en ciclón extratropical. Algunos trenes de las líneas Hangzhou-Shenzhen, Jinhua-Wenzhou y Hangzhou-Taizhou se suspendieron o limitaron su velocidad, y seguirá lloviendo en el este de China hasta el 25.", "ja": "中央気象台は24日18時、台風注意報（青）を継続した。今年30号の台風「チャンピ」は時速15キロで北北東へ進みながら弱まり、浙江東部の沖で北東へ転向して日本の南西部沿岸へ向かい、温帯低気圧に変わる見込み。杭深鉄道、金温鉄道、杭台高速鉄道の一部列車が24日に運休・速度規制となり、24日20時から25日20時まで華東の多くの地域で雨が続き、局地的に大雨となる。"}, "why": {"zh": "转向意味着我国陆地躲过正面登陆，但「擦边」同样要付代价：铁路限速、航班调整、渔船回港，这些成本在台风远离后才被看见。对沿海城市来说，防台的标准答案从来不是「有没有登陆」。", "en": "The turn means no direct landfall in China, but a near miss still costs: speed limits, flight changes, boats recalled to port, expenses noticed only after the storm leaves. For coastal cities the test of typhoon readiness was never just whether it made landfall.", "es": "El giro evita el impacto directo en tierra china, pero un roce también cuesta: límites de velocidad, cambios de vuelo, barcos a puerto, gastos que se ven cuando el tifón se aleja. Para las ciudades costeras, la prueba nunca fue solo si tocó tierra.", "ja": "転向で中国本土への上陸は避けられるが、「かすめる」だけでもコストはかかる。鉄道の速度規制、航空便の変更、漁船の帰港。台風が去ってから見えてくる出費だ。沿岸都市にとって防台の答えは「上陸したかどうか」だけではない。"}}, {"idx": "05", "title": {"zh": "医保钱包 2.0 上线，个人账户跨省共济全国落地", "en": "Medical Insurance Wallet 2.0 Launches, Letting Personal Accounts Be Shared Across Provinces", "es": "Llega la cartera médica 2.0: las cuentas individuales se comparten entre provincias", "ja": "医療保険ウォレット2.0が始動 個人口座の省をまたぐ共用が全国で可能に"}, "body": {"zh": "国家医保局将医保钱包升级至 2.0 版，自 10 月 16 日起，各省、自治区、直辖市及新疆生产建设兵团已全部上线运行。职工医保个人账户资金可跨省共济给近亲属使用，用于支付就医购药等个人负担费用。至此，医保个人账户资金跨省共济在全国全面落地。", "en": "China's National Healthcare Security Administration has upgraded its medical insurance wallet to version 2.0. Since 16 October all provinces, autonomous regions, municipalities and the Xinjiang Production and Construction Corps have been running it, allowing employees' personal account balances to be shared with close relatives across provincial borders for medical visits and medicines.", "es": "La Administración Nacional de Seguridad Sanitaria de China actualizó su cartera de seguro médico a la versión 2.0. Desde el 16 de octubre todas las provincias, regiones autónomas, municipios y el Cuerpo de Producción y Construcción de Xinjiang la tienen operativa, de modo que el saldo de la cuenta individual del trabajador puede compartirse con familiares directos entre provincias para consultas y medicamentos.", "ja": "中国国家医療保障局は医療保険ウォレットを2.0に更新した。10月16日から各省・自治区・直轄市および新疆生産建設兵団で運用が始まり、勤労者の医療保険個人口座の残高を、省をまたいで近親者の受診・薬代に充てられるようになった。"}, "why": {"zh": "对异地家庭来说，这是一条「看不见但天天用得上」的政策：父母在老家看病，子女在一线城市缴的医保个人账户终于能转过去。跨省共济的关键不在技术，而在各地清算规则能不能对得上。", "en": "For families living apart, this is the kind of policy nobody notices until they need it: a child paying into a scheme in a megacity can now fund a parent's care back home. The hard part is not the technology but whether provincial settlement rules line up.", "es": "Para las familias separadas es una política que no se nota hasta que se necesita: lo que un hijo aporta en una gran ciudad puede pagar la atención de sus padres en su provincia. Lo difícil no es la tecnología, sino que las reglas de liquidación provinciales encajen.", "ja": "離れて暮らす家族にとっては、必要になるまで気づかない政策だ。大都市で保険料を払う子の個人口座を、故郷の親の受診に使える。難しさは技術ではなく、各省の精算ルールが噛み合うかにある。"}}]}, {"key": "ent", "num": "06", "color": "#db2777", "deep": "#a81a56", "name": {"zh": "娱乐八卦", "en": "ENTERTAINMENT", "es": "ESPECTÁCULOS", "ja": "エンタメ"}, "items": [{"idx": "01", "title": {"zh": "《小城良方》收视峰值破 3%，口碑却两极：虎扑 3.3 分", "en": "\"A Good Prescription\" Peaks Above 3% in Ratings but Divides Viewers: 3.3 on Hupu", "es": "«A Good Prescription» supera el 3% de audiencia pero divide al público: 3,3 en Hupu", "ja": "「小城良方」視聴率ピーク3%超も評価は真っ二つ 虎撲は3.3"}, "body": {"zh": "央八黄金档《小城良方》开播后收视一路走高，酷云实时峰值达 3.02%，爱奇艺热度 7505，创今年台网同步首日新高；但 CVB 脱水收视率为 1.418%，虎扑评分仅 3.3，豆瓣短评集中吐槽「瞪眼、皱眉、瘪嘴」。首播四集塞进 28 个广告、8 个品牌也引发争议。倪大红、张国强、姜妍的群像表演获普遍认可。", "en": "A Good Prescription, airing in CCTV-8's prime slot, has climbed steadily: a real-time peak of 3.02% on Kuyun, and 7,505 on iQIYI's heat index, a first-day high for a simulcast drama this year. Yet the CVB de-duplicated rating is 1.418% and Hupu users score it just 3.3, with Douban reviews piling on about a single wide-eyed expression. Twenty-eight ad breaks across the first four episodes also drew complaints. The ensemble work of Ni Dahong, Zhang Guoqiang and Jiang Yan is widely praised.", "es": "A Good Prescription, en el prime time de CCTV-8, sube sin pausa: pico en tiempo real del 3,02% en Kuyun y 7.505 de índice de calor en iQIYI, récord de estreno simultáneo del año. Pero la audiencia depurada de CVB es del 1,418% y en Hupu la puntúan con 3,3, mientras Douban acumula críticas sobre una única expresión facial. Los 28 cortes publicitarios de los cuatro primeros capítulos también molestaron. El trabajo coral de Ni Dahong, Zhang Guoqiang y Jiang Yan sí se elogia.", "ja": "CCTV-8のゴールデン帯ドラマ「小城良方」は視聴率が右肩上がりで、酷雲のリアルタイムピークは3.02%、iQIYIのヒート指数は7505と今年の同時配信初日で最高。だがCVBの脱水視聴率は1.418%、虎撲の評価は3.3にとどまり、豆瓣の短評は「見開いた目、しかめた眉」に集中した。初回4話で28本のCMが入ったことも議論を呼んだ。倪大紅、張国強、姜妍らの群像演技は広く評価されている。"}, "why": {"zh": "收视和评分走出两条相反的曲线，说明电视机前的观众和打分平台的用户根本不是同一批人。前者要的是东北小城的烟火气，后者要的是表演层次——这不是谁对谁错，是国产剧正在分裂成两个市场。", "en": "Ratings and reviews moving in opposite directions shows that the people watching television and the people scoring shows are not the same audience. One wants small-town north-east China texture, the other wants layers in the performance. Neither is wrong; domestic drama is splitting into two markets.", "es": "Que audiencia y notas vayan en direcciones opuestas demuestra que quien ve la televisión y quien puntúa en las plataformas no son el mismo público. Uno busca el costumbrismo del noreste; el otro, matices interpretativos. No es cuestión de razón: la ficción china se parte en dos mercados.", "ja": "視聴率と評価が逆方向に動くのは、テレビの前の視聴者と評価サイトの利用者が別の集団だからだ。前者は東北の小都市の生活感を、後者は演技の階層を求める。どちらが正しいかではなく、国産ドラマが二つの市場に分裂している。"}}, {"idx": "02", "title": {"zh": "《一路前行 3》开播，胡歌直播找不到「镜像」、刘涛探头救场也找不到", "en": "\"Go Ahead 3\" Debuts: Hu Ge Can't Find Mirror Mode, Liu Tao Steps In and Can't Either", "es": "Debuta «Go Ahead 3»: Hu Ge no encuentra el modo espejo y Liu Tao tampoco al ayudar", "ja": "「一路前行3」開始 胡歌がミラー機能で迷い、劉濤が助けに入っても見つからない"}, "body": {"zh": "环保纪实节目《一路前行》第三季 24 日起每周六 20:20 在东方卫视播出，胡歌、陈龙扎根青海囊谦，从「观察者」变成环保工作站的「共建者」。首播前连麦直播中，胡歌研究「镜像」功能半天找不到，自嘲「老同志确实不会玩」；预留惊喜的刘涛探头进来帮忙，结果自己的手机也没有这个选项，两人对着屏幕大眼瞪小眼，成了当晚最出圈的画面。", "en": "The third season of environmental documentary series Go Ahead began on Dragon TV on the 24th, Saturdays at 20:20, with Hu Ge and Chen Long based in Nangqian, Qinghai, moving from observers to co-builders of a conservation station. In the pre-launch livestream Hu Ge spent minutes hunting for mirror mode and joked that old comrades really cannot work these things; Liu Tao, kept as a surprise guest, leaned in to help and found her own phone lacked the option too. The two staring at the screen became the night's most shared clip.", "es": "La tercera temporada del documental medioambiental Go Ahead se estrenó el 24 en Dragon TV (sábados a las 20:20), con Hu Ge y Chen Long instalados en Nangqian, Qinghai, pasando de observadores a co-constructores de una estación de conservación. En la emisión previa, Hu Ge buscó sin éxito el modo espejo y bromeó con que los veteranos no saben con estos aparatos; Liu Tao, invitada sorpresa, se asomó a ayudar y su teléfono tampoco tenía la opción. Los dos mirando la pantalla se volvió el momento más compartido.", "ja": "環境ドキュメンタリー「一路前行」第3シーズンが24日、東方衛視で毎週土曜20:20に始まった。胡歌と陳龍が青海省囊謙に拠点を置き、「観察者」から環境工作站の「共同建設者」へと踏み込む。放送前のライブ配信で胡歌はミラー機能を探して見つからず、「年寄りには分からない」と自嘲。サプライズで登場した劉濤が助けに入るも、自分の端末にもその項目がなく、二人で画面を見つめ合う姿が最も話題になった。"}, "why": {"zh": "一场设备故障比任何预告片都有效——观众信的不是「明星做公益」，而是他们连手机功能都搞不定时的那点笨拙。公益综艺最难的是不悬浮，而「翻车」恰好是最好的去悬浮剂。", "en": "A device glitch did more than any trailer: viewers do not buy celebrities doing charity, they buy the clumsiness of people who cannot work a phone setting. The hardest thing in charity television is staying grounded, and a live stumble is the best grounding agent there is.", "es": "Un fallo técnico funcionó mejor que cualquier tráiler: el público no compra «famosos haciendo labor social», compra la torpeza de quien no sabe usar un ajuste del móvil. Lo más difícil del género es no flotar, y un tropiezo en directo es el mejor lastre.", "ja": "機器のトラブルは予告編より効いた。視聴者が信じるのは「芸能人が公益をする」ことではなく、スマホの設定すら分からない不器用さだ。公共番組で最も難しいのは地に足がついていることで、生配信の「失敗」は最良の重しになる。"}}, {"idx": "03", "title": {"zh": "黄景瑜名誉权案胜诉：两主播以「鲸鱼」代称造谣，判赔 10 万并连发 10 天致歉", "en": "Huang Jingyu Wins Defamation Suit: Streamers Who Used a Nickname to Spread Rumours Must Pay 100,000 Yuan", "es": "Huang Jingyu gana su demanda por difamación: dos streamers pagarán 100.000 yuanes por usar un apodo", "ja": "黄景瑜さん名誉毀損で勝訴 「クジラ」の代称で噂流した配信者に10万元の賠償命令"}, "body": {"zh": "人民法院公告网 23 日更新公告，黄景瑜名誉权案胜诉。两名主播在直播中以「鲸鱼」等代称传播不实信息，法院判令其赔偿 10 万元，并连续 10 天公开致歉。", "en": "A notice published on the people's court announcement website on the 23rd shows Huang Jingyu won his defamation case. Two streamers spread false claims in livestreams using nicknames such as whale; the court ordered them to pay 100,000 yuan and issue a public apology for ten consecutive days.", "es": "Un anuncio del portal de los tribunales populares del 23 muestra que Huang Jingyu ganó su demanda por difamación. Dos streamers difundieron bulos en directo usando apodos como «ballena»; el tribunal les ordenó pagar 100.000 yuanes y disculparse públicamente durante diez días consecutivos.", "ja": "人民法院公告網が23日に更新した公告によると、黄景瑜さんの名誉毀損訴訟で勝訴が確定した。配信者2人がライブ配信で「クジラ」などの代称を用いて虚偽情報を流し、裁判所は10万元の賠償と10日間連続の公開謝罪を命じた。"}, "why": {"zh": "用代号影射、规避关键词，是近年网络造谣的常见手法；这次判决的意义在于确认「代称+暗示」同样构成侵权。对靠「猜谜式爆料」涨粉的账号来说，这是一个明确的成本信号。", "en": "Hiding behind a codename to dodge keywords is a common trick in online rumour-mongering. The ruling matters because it confirms that a nickname plus insinuation is still defamation, a clear price signal for accounts that grow on riddling gossip.", "es": "Ocultarse tras un apodo para esquivar palabras clave es un truco habitual del rumor digital. La sentencia importa porque confirma que apodo más insinuación sigue siendo difamación: una señal de coste clara para cuentas que crecen con cotilleos en forma de acertijo.", "ja": "代称でキーワードを避けるのはネット上の噂の常套手段だ。今回の判断は「代称＋暗示」でも名誉毀損になると確認した点に意味がある。謎かけ型の暴露で伸びるアカウントには、明確なコスト提示となる。"}}, {"idx": "04", "title": {"zh": "《现在就出发 4》九寨沟篇上线，「火象三兄弟」合影上热搜", "en": "\"Now Let's Go 4\" Reaches Jiuzhaigou; the \"Fire Signs Trio\" Photo Trends", "es": "«Now Let's Go 4» llega a Jiuzhaigou y la foto del «trío de fuego» se vuelve tendencia", "ja": "「现在就出发4」九寨溝編が配信 「火象三兄弟」の写真がトレンドに"}, "body": {"zh": "24 日，黄景瑜在微博晒出与贾冰、胡先煦的九寨沟合影，配文「火象三兄弟九寨沟合影留念」；胡先煦用一段即兴说唱语音回复，贾冰赶来调侃，相关话题迅速登上热搜。当天恰逢《现在就出发 4》九寨沟篇上线，胡先煦也发出「宇宙最美九寨沟」风景照，与节目形成联动。", "en": "On the 24th Huang Jingyu posted a Jiuzhaigou photo with Jia Bing and Hu Xianxu captioned the fire-sign trio; Hu replied with an improvised rap voice note and Jia joined the banter, sending the topic onto the trending list. The Jiuzhaigou episode of Now Let's Go 4 launched the same day, and Hu also posted landscape shots calling it the most beautiful place in the universe.", "es": "El 24, Huang Jingyu publicó en Weibo una foto en Jiuzhaigou con Jia Bing y Hu Xianxu, titulada «el trío de signos de fuego»; Hu respondió con una nota de voz rapeada y Jia se sumó a la broma, llevando el tema a tendencias. Ese día se estrenó el episodio de Jiuzhaigou de Now Let's Go 4, y Hu publicó también paisajes llamándolo el lugar más bello del universo.", "ja": "24日、黄景瑜さんが賈冰さん、胡先煦さんとの九寨溝での写真をWeiboに投稿し、「火象三兄弟」と記した。胡先煦さんが即興ラップの音声で返し、賈冰さんも加わって話題はトレンド入り。同日は「现在就出发4」の九寨溝編が配信され、胡先煦さんも「宇宙一美しい九寨溝」と風景写真を投稿して連動した。"}, "why": {"zh": "这波热度没有剧本感：熟人之间的互怼、即兴接梗，比刻意制造的冲突更耐看。综艺宣发正在从「预告片+热搜位」转向「嘉宾自己玩起来」，成本更低，可信度更高。", "en": "This burst of attention feels unscripted: friends needling each other and riffing in the moment wears better than manufactured conflict. Variety marketing is shifting from trailers and bought hashtags to letting the cast simply play, which is cheaper and more credible.", "es": "Este pico de interés no huele a guion: amigos que se pinchan y responden al vuelo aguantan mejor que el conflicto fabricado. La promoción de variedades pasa del tráiler y la tendencia comprada a dejar que los invitados jueguen: cuesta menos y se cree más.", "ja": "この盛り上がりには台本感がない。仲の良い者同士の突っ込みや即興の返しは、作られた衝突より長く見られる。バラエティの宣伝は「予告編＋トレンド枠」から「出演者が勝手に遊ぶ」へ移りつつあり、低コストで信頼性が高い。"}}, {"idx": "05", "title": {"zh": "汤姆·斯凯里特去世，享年 93 岁", "en": "Tom Skerritt, Captain Dallas of \"Alien\", Dies at 93", "es": "Muere Tom Skerritt, el capitán Dallas de «Alien», a los 93 años", "ja": "「エイリアン」ダラス船長役 トム・スケリットさん死去 93歳"}, "body": {"zh": "据《人物》杂志报道，美国演员汤姆·斯凯里特于当地时间 10 月 21 日因自然原因去世，终年 93 岁。他最被中国观众熟悉的角色是《异形》中命运多舛的飞船船长达拉斯，以及《壮志凌云》里的飞行教官「毒蛇」；1993 年凭电视剧《警戒围栏》获艾美奖剧情类最佳男主角。家人称他一生重视想象力、创造力与讲故事的能力。", "en": "American actor Tom Skerritt died of natural causes on 21 October local time at 93, People magazine reported. He is best known to Chinese audiences as the ill-fated starship captain Dallas in Alien and flight instructor Viper in Top Gun, and won a 1993 Emmy for lead actor in a drama for Picket Fences. His family said he valued imagination, creativity and the ability to tell stories.", "es": "El actor estadounidense Tom Skerritt murió por causas naturales el 21 de octubre a los 93 años, según People. Es recordado por el capitán Dallas de «Alien» y el instructor Viper de «Top Gun», y ganó un Emmy en 1993 por «Picket Fences». Su familia destacó que valoraba la imaginación, la creatividad y la capacidad de contar historias.", "ja": "米俳優トム・スケリットさんが現地時間10月21日、老衰のため93歳で死去したと「ピープル」誌が報じた。「エイリアン」の不運な宇宙船船長ダラス、「トップガン」の教官ヴァイパー役で知られ、1993年にはドラマ「ピケット・フェンス」でエミー賞主演男優賞を受賞。家族は、想像力と創造力、物語を語る力を重んじた人だったと述べた。"}, "why": {"zh": "他演的多是「沉稳、可信的权威人物」——船长、教官、警长。这类角色不抢戏，却决定了整部作品的可信度。斯凯里特去世，带走的是好莱坞那代「把配角演成地基」的演员。", "en": "He specialised in steady, credible authority: captains, instructors, sheriffs. Such roles never steal a scene, yet they decide whether a film is believable. His death takes away one of the Hollywood generation that treated supporting parts as foundations.", "es": "Se especializó en autoridades serenas y creíbles: capitanes, instructores, alguaciles. Son papeles que no roban escena pero deciden si una película resulta verosímil. Con él se va una generación de Hollywood que hacía de los secundarios los cimientos.", "ja": "演じたのは多くが「落ち着いた信頼できる権威」――船長、教官、保安官。主役を食わないが、作品全体の説得力を決める役だ。スケリットさんの死で、脇役を土台として演じたハリウッドの世代がまた一人去った。"}}]}], "risk": {"zh": "风险提示：本简报仅作信息汇总，其中涉及的数据不构成任何投资建议。", "en": "Disclaimer: This briefing is a news digest only. Data mentioned does not constitute any investment advice.", "es": "Aviso: este resumen es solo una recopilación informativa; los datos citados no constituyen asesoramiento de inversión.", "ja": "リスク表示：本ダイジェストは情報まとめであり、記載データは投資助言を構成しません。"}}/*__END__*/;
