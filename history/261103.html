tivo, Yang Hansen suma 4 y 6 con protección del aro", "ja": "連戦2日目 楊瀚森は4得点6リバウンド リング守備に手応え"}, "body": {"zh": "11 月 2 日，开拓者背靠背出战，中国球员杨瀚森替补登场，5 投 2 中拿下 4 分 6 篮板 1 助攻 1 抢断。据现场复盘，他抢下 6 个后场篮板，篮下多次举手干扰对手上篮与二次进攻，并送出封盖；末节与莫兰特、霍乐迪同时在场，两次掩护后顺下为两人创造出手空间。体能成为制约：背靠背下半段腿部发力不足，一次上篮出现脱手。此前 11 月 1 日对爵士，他出战 13 分 14 秒，5 投 2 中、三分 3 中 2，得到 6 分 5 篮板 1 助攻 1 抢断，三分命中数创赛季新高。开拓者已执行其第三个赛季的球队选项。", "en": "On 2 November, in the second half of a back-to-back, Portland's Yang Hansen came off the bench and finished with four points, six rebounds, one assist and one steal on 2-of-5 shooting. Reviewers noted six defensive rebounds, repeated contests at the rim against drives and put-backs, and a block; in the fourth quarter he shared the floor with Morant and Holiday, setting two screens and rolling to create space for both. Conditioning was the limit: late in the back-to-back his legs went and one layup slipped away. A night earlier against Utah he played 13:14 for six points, five rebounds, one assist and one steal, hitting 2-of-3 from three for a season high. Portland has exercised his third-year team option.", "es": "El 2 de noviembre, en el segundo partido en dos noches, el chino Yang Hansen salió desde el banquillo y terminó con cuatro puntos, seis rebotes, una asistencia y un robo (2/5 en tiros). Los análisis destacan seis rebotes defensivos, varias intimidaciones en la pintura ante penetraciones y segundas opciones, y un tapón; en el último cuarto compartió pista con Morant y Holiday, con dos bloqueos y continuaciones para abrirles espacio. El límite fue físico: en la segunda mitad del back-to-back le faltaron piernas y se le escapó una bandeja. La noche anterior ante Utah jugó 13:14 para seis puntos, cinco rebotes, una asistencia y un robo, con 2/3 en triples, su mejor marca de la temporada. Portland ha ejercido su opción de tercer año.", "ja": "11月2日、連戦2日目となったポートランドの楊瀚森はベンチから出場し、5本中2本成功で4得点6リバウンド1アシスト1スティール。現地の分析では、ディフェンスリバウンド6本、リング下での複数回のシュートへのコンタクト、ブロック1本が評価された。第4Qにはモラント、ホリデーと同時にコートに立ち、2度のスクリーンからロールして両者のシュートスペースを作った。課題は体力で、連戦の後半は脚に力が入らず、レイアップが手から離れた。前夜のユタ戦では13分14秒出場で6得点5リバウンド1アシスト1スティール、3点シュート3本中2本で今季最多。ポートランドは3年目のチームオプションを行使している。"}, "why": {"zh": "一个新秀中锋的说明书，往往写在「不用得分也能留下」的那几分钟里：掩护角度、顺下时机、护筐不犯规。他现在缺的不是技术，是连续高强度对抗下的体能储备——背靠背第二晚的那次脱手，比 6 个篮板更能说明问题。", "en": "A young centre's instruction manual is usually written in the minutes where he does not need to score to stay on the floor: screen angles, roll timing, contesting without fouling. What he lacks is not skill but a tank for consecutive high-intensity games — that fumbled layup on the second night says more than the six rebounds.", "es": "El manual de un pívot joven suele escribirse en los minutos en que no necesita anotar para quedarse: ángulos de bloqueo, tiempo de continuación, intimidar sin faltar. Lo que le falta no es técnica sino depósito para partidos exigentes consecutivos: esa bandeja que se le escapó en la segunda noche dice más que los seis rebotes.", "ja": "若いセンターの取扱説明書は、得点しなくても出場し続けられる数分間に書かれる。スクリーンの角度、ロールのタイミング、ファウルせずに守ること。足りないのは技術ではなく、連戦を戦うスタミナだ。2夜目のあの落としたレイアップは、6リバウンドより多くを語る。"}}]}, {"key": "hot", "num": "05", "color": "#6d28d9", "deep": "#5b21b6", "name": {"zh": "网络热点", "en": "TRENDING", "es": "TENDENCIAS", "ja": "ネット注目"}, "items": [{"idx": "01", "title": {"zh": "海鲜补给被哄抢、餐桌被挤塌，烟台马拉松致歉", "en": "Seafood aid station overrun: Yantai Marathon apologises", "es": "Saqueo en el avituallamiento de marisco: el maratón de Yantai se disculpa", "ja": "海鮮エイドが殺到で混乱 煙台マラソンが謝罪"}, "body": {"zh": "11 月 1 日，一段烟台马拉松赛后海鲜补给遭多人哄抢、餐桌被挤塌的视频在网络传播。11 月 2 日，赛事主办方发布歉意函：本届赛事共准备扇贝 10000 斤、黑蛤 1500 斤、焖子 1000 斤、姜汤 2000 斤；11 月 1 日 9 时 30 分至 10 时，5500 余名跑者集中完赛，30 分钟左右陆续抵达高峰，而海鲜补给须现场加工，单锅加工周期约 20 分钟，出餐速度与集中到达的人流形成矛盾，补给区出现排队等候。现场指挥部增派安保与志愿者、设置隔离设施并广播引导后，秩序恢复，后续跑者领取未受影响。组委会提出三项改进：增加现场加工批次、错峰备餐；扩大取餐区域与排队缓冲空间；把完赛峰值人流纳入赛前演练。", "en": "On 1 November video circulated of runners swarming the post-race seafood station at the Yantai Marathon, with a table collapsing under the crowd. On 2 November organisers published an apology: the race had prepared 10,000 jin of scallops, 1,500 jin of clams, 1,000 jin of menzi and 2,000 jin of ginger soup; between 09:30 and 10:00 some 5,500 runners finished within about half an hour, while seafood had to be cooked on site at roughly 20 minutes per batch, so supply could not keep pace. Command staff added security and volunteers, barriers and broadcast guidance, restoring order without affecting later runners. Organisers pledged three fixes: more cooking batches and staggered preparation, larger pickup and queueing areas, and rehearsing finish-line peaks before the race.", "es": "El 1 de noviembre circuló un vídeo de corredores abalanzándose sobre el avituallamiento de marisco tras el maratón de Yantai, con una mesa que se vino abajo. El 2 de noviembre la organización publicó una disculpa: se habían preparado 10.000 jin de vieiras, 1.500 de almejas, 1.000 de menzi y 2.000 de sopa de jengibre; entre las 09:30 y las 10:00 unos 5.500 corredores llegaron en media hora, mientras el marisco debía cocinarse allí a razón de unos 20 minutos por tanda. Se añadieron efectivos de seguridad y voluntarios, vallas y avisos por megafonía, y el orden se restableció sin afectar a los demás. La organización se comprometió a aumentar tandas y escalonar la preparación, ampliar la zona de recogida y las colas, y ensayar los picos de llegada.", "ja": "11月1日、煙台マラソンのゴール後に海鮮エイドで取り合いになり、テーブルが倒れたとする動画が拡散した。11月2日、主催者はお詫びを公表した。大会はホタテ1万斤、アサリ1,500斤、焖子1,000斤、生姜湯2,000斤を用意。11月1日9時30分から10時の間に5,500人余りが集中して完走し、約30分でピークに達したが、海鮮は現地調理のため1釜約20分かかり、供給が追いつかなかった。本部は警備とボランティアを増派し、柵と放送で誘導して秩序を回復、後続の選手への提供に影響はなかった。主催者は調理ロットの増加と時間分散、受け取りエリアと待機列の拡大、完走ピークを想定した事前訓練の3点を約束した。"}, "why": {"zh": "一万斤扇贝不是诚意不够，是「峰值」没算准：5500 人在 30 分钟内到达，而一口锅 20 分钟出一批——这是典型的排队论题，不是态度题。道歉函里最有价值的一句，是承认「对跑者的热情预估严重不足」。", "en": "Ten thousand jin of scallops is not a shortage of goodwill but a miscalculated peak: 5,500 people arriving within half an hour against a pot that turns out a batch every 20 minutes. That is a queueing problem, not an attitude problem. The most valuable line in the apology is the admission that demand was badly underestimated.", "es": "Diez mil jin de vieiras no revelan falta de voluntad sino un pico mal calculado: 5.500 personas en media hora frente a una olla que saca una tanda cada 20 minutos. Es un problema de colas, no de actitud. La frase más valiosa de la disculpa es admitir que se subestimó gravemente el entusiasmo.", "ja": "ホタテ1万斤は誠意の問題ではなく、ピークの計算違いだ。5,500人が30分に集中し、1釜20分でしか出せない。これは態度の問題ではなく待ち行列の問題である。お詫びで最も価値があるのは「参加者の熱意を大きく見誤った」と認めた一文だ。"}}, {"idx": "02", "title": {"zh": "一句「我画地为牢，厉娜」，把芒果超媒拉上涨停", "en": "One catchphrase, and Mango Excellent Media hits the limit up", "es": "Una frase y Mango Excellent Media sube el límite del 20%", "ja": "「私は自ら囲い込んだ、厲娜」 芒果超媒がストップ高"}, "body": {"zh": "11 月 2 日，芒果超媒录得 20% 涨停，报 26.76 元，成交额 19.66 亿元，封单超 42 万手，总市值回升至 500.6 亿元。导火索是芒果 TV 综艺《后会友期》中的一句「我画地为牢，厉娜」：许飞向昔日好友厉娜倾诉近二十年心结，几乎每句话都以「厉娜」收尾，与厉娜当场用 AI 查词、淡定吃麦当劳形成反差，「厉娜体」迅速走红。芒果 TV 将首页综艺、剧集推荐语末尾统一加上「厉娜」，被戏称「把厉娜当句号使」；绝味鸭脖签约厉娜为「鲜推官」，袁记云饺推出同款套餐。股吧被「我涨停了，厉娜」刷屏。", "en": "Mango Excellent Media closed limit-up at 26.76 yuan on 2 November, a 20% gain, on turnover of 1.966 billion yuan with more than 420,000 lots bid at the close, lifting its market value back to 50.06 billion. The trigger was a line from the Mango TV reality show Reunion: singer Xu Fei, unburdening nearly two decades of grievance to former friend Li Na, ended almost every sentence with her name — \"I built my own prison, Li Na\" — in contrast to Li Na calmly looking words up with AI and eating a McDonald's meal. The \"Li Na style\" spread fast; Mango TV appended her name to every show recommendation on its homepage, and brands including Juewei signed her as a promoter. Stock forums filled with \"I hit the limit up, Li Na\".", "es": "Mango Excellent Media cerró el 2 de noviembre con una subida del 20% hasta 26,76 yuanes, con 1.966 millones de volumen y más de 420.000 lotes en la compra, elevando su capitalización a 50.060 millones. El detonante fue una frase del programa Reunion de Mango TV: la cantante Xu Fei, al desahogar casi veinte años de rencor con su ex amiga Li Na, terminaba casi cada frase con su nombre —\"me encerré yo misma, Li Na\"— frente a Li Na buscando palabras con IA y comiendo tranquilamente en McDonald's. El \"estilo Li Na\" se viralizó; Mango TV añadió su nombre al final de cada recomendación de su portada y varias marcas la ficharon. Los foros bursátiles se llenaron de \"subí al límite, Li Na\".", "ja": "11月2日、芒果超媒が20%高のストップ高となり26.76元、売買代金19.66億元、買い気配42万枚超、時価総額は500.6億元に戻した。発端は Mango TV の番組『後会友期』の一言「私は自ら囲い込んだ、厲娜」。許飛が旧友の厲娜に約20年のわだかまりを打ち明け、ほぼ毎文を「厲娜」で終えた。厲娜がその場で AI に語句を調べ、平然とマクドナルドを食べたこととの対比で「厲娜体」が拡散。Mango TV はトップページの全番組紹介の末尾に「厲娜」を付け、ネットで「句点のように使っている」と話題に。絶味なども彼女を起用した。掲示板は「俺はストップ高だ、厲娜」で埋まった。"}, "why": {"zh": "一个综艺梗能推动 20cm 涨停，说明市场对「内容平台的爆款能力」依旧愿意给溢价——哪怕爆款本身还没变成收入。真正需要观察的是下一季：梗会过期，广告主不会。", "en": "A variety-show catchphrase moving a stock 20% shows the market still pays a premium for a platform's ability to make hits — even before the hit becomes revenue. What matters next season is whether the meme expires before the advertisers do.", "es": "Que una frase de un programa mueva la acción un 20% muestra que el mercado sigue pagando prima por la capacidad de una plataforma de crear fenómenos, incluso antes de que se conviertan en ingresos. La pregunta es la próxima temporada: el meme caduca, los anunciantes no.", "ja": "バラエティの一言が株価を20%動かすということは、市場が「話題を作る力」に依然プレミアムを払うということだ。それが収益になる前でも、である。問われるのは次のシーズン。ミームは期限切れになるが、広告主はそうではない。"}}, {"idx": "03", "title": {"zh": "一年车龄纯电保值率：小米 YU7 以 82.3% 居首", "en": "One-year resale value: Xiaomi's YU7 tops the EV chart at 82.3%", "es": "Valor residual a un año: el Xiaomi YU7 lidera los eléctricos con 82,3%", "ja": "1年落ちの残価率 小米 YU7 が82.3%で首位"}, "body": {"zh": "11 月 2 日，中国汽车流通协会与精真估发布 2026 年 10 月汽车保值率报告。一年车龄纯电车型榜中，小米 YU7 以 82.3% 居首，理想 i6 为 82.0%，蔚来 ES8 为 77.5%，其后是名爵 MG4、乐道 L90、理想 i8、理想 MEGA、极氪 009、问界 M8 等。三年车龄榜则仍由特斯拉领跑：Model 3 为 61.3%、Model X 为 59.4%、Model Y 为 53.9%，比亚迪海鸥 50.4%、极氪 009 49.6% 紧随。报告同时指出，两个榜单并非同一批车的上下集——YU7、i6、新一代 ES8 交付均不足两年，尚未进入三年统计池。", "en": "On 2 November the China Automobile Dealers Association and Jingzhengu published the October resale-value report. Among one-year-old EVs, Xiaomi's YU7 led at 82.3%, followed by Li Auto's i6 at 82.0% and Nio's ES8 at 77.5%, then MG4, Onvo L90, Li Auto i8, Li Auto MEGA, Zeekr 009 and Aito M8. At three years Tesla still led: Model 3 at 61.3%, Model X 59.4% and Model Y 53.9%, with BYD Seagull at 50.4% and Zeekr 009 at 49.6%. The report notes the two tables are not the same cars at different ages — the YU7, i6 and the new ES8 have been on sale less than two years and are not yet in the three-year pool.", "es": "El 2 de noviembre la Asociación China de Concesionarios y Jingzhengu publicaron el informe de valor residual de octubre. Entre los eléctricos de un año, el Xiaomi YU7 lideró con 82,3%, seguido del Li Auto i6 con 82,0% y el Nio ES8 con 77,5%, después MG4, Onvo L90, Li Auto i8, Li Auto MEGA, Zeekr 009 y Aito M8. A tres años Tesla seguía al frente: Model 3 con 61,3%, Model X 59,4% y Model Y 53,9%, con el BYD Seagull en 50,4% y el Zeekr 009 en 49,6%. El informe advierte que no son los mismos coches en distintas edades: el YU7, el i6 y el nuevo ES8 llevan menos de dos años a la venta.", "ja": "11月2日、中国自動車流通協会と精真估が2026年10月の残価率リポートを公表した。1年落ちの電気自動車では小米 YU7 が82.3%で首位、理想 i6 が82.0%、蔚来 ES8 が77.5%、続いて MG4、楽道 L90、理想 i8、理想 MEGA、極氪 009、問界 M8 など。3年落ちではテスラが依然トップで、Model 3 が61.3%、Model X が59.4%、Model Y が53.9%、BYD 海鸥が50.4%、極氪 009 が49.6%だった。リポートは、二つの表は同じ車の続きではないと指摘する。YU7、i6、新型 ES8 は納車から2年に満たず、3年の統計に入っていない。"}, "why": {"zh": "一年榜标的是「当下热不热」：还在排队吗、最近官降了吗、下一代快来了吗；三年榜标的是「还在不在」：车名还在、配件还供、二手市场还认。把两份榜单读成「国产只赢一年」，是把两种完全不同的时间尺度混成了一条结论。", "en": "The one-year table measures heat: is there still a queue, has the price been cut, is the next generation near. The three-year table measures continuity: is the name still around, are parts still supplied, does the used market still want it. Reading them as \"domestic brands only win year one\" collapses two different time scales into one conclusion.", "es": "La tabla de un año mide el momento: ¿sigue habiendo cola, ha bajado el precio, llega pronto la próxima generación? La de tres años mide continuidad: ¿el nombre sigue, hay repuestos, el mercado de segunda mano lo acepta? Leerlas como \"las marcas chinas solo ganan el primer año\" mezcla dos escalas temporales distintas.", "ja": "1年の表が測るのは「今の熱」だ。行列は続くか、値下げはあったか、次期型は近いか。3年の表が測るのは「存続」だ。名前は残るか、部品は供給されるか、中古市場は認めるか。「国産は1年だけ勝つ」と読むのは、二つの異なる時間軸を一つの結論に混ぜている。"}}, {"idx": "04", "tag": {"zh": "进展"}, "title": {"zh": "秦朔起诉抖音副总裁李亮，对方称「会积极应诉」", "en": "Qin Shuo sues Douyin executive Li Liang, who says he will defend it", "es": "Qin Shuo demanda al directivo de Douyin Li Liang, que responderá", "ja": "秦朔氏が字節跳動副総裁を提訴 李氏は「積極的に応訴」"}, "body": {"zh": "11 月 2 日，「秦朔朋友圈」创始人秦朔发布朋友圈表示，针对近期抖音集团副总裁李亮发布的侵害其名誉权的言论，已委托律师向人民法院提起诉讼，依法采取措施维护自身合法权益，追究侵权方的法律责任。李亮回应称「会积极应诉」。此事源于秦朔此前在「秦朔朋友圈」发布《「可怕」的红果与中国互联网的字节时间》一文，文中提出「中国互联网正在从腾讯时间进入字节时间」等观点，双方随后发生争论。此前 10 月下旬，红果短剧因宣布分阶段下线金币、上线休息提醒引发广泛讨论。", "en": "On 2 November Qin Shuo, founder of the WeChat account Qin Shuo's Circle, said he had instructed lawyers to sue Douyin group vice-president Li Liang in a People's Court over remarks he says defamed him, and would pursue legal liability. Li responded that he will defend the case actively. The dispute follows Qin's article \"The 'Frightening' Hongguo and the ByteDance Time of the Chinese Internet\", which argued that Chinese internet time is shifting from Tencent time to ByteDance time; the two then argued publicly. In late October, short-drama app Hongguo drew wide discussion after phasing out its coin rewards and adding rest reminders.", "es": "El 2 de noviembre Qin Shuo, fundador de la cuenta Qin Shuo's Circle, anunció que ha encargado a sus abogados demandar ante un tribunal popular al vicepresidente del grupo Douyin, Li Liang, por unas declaraciones que considera difamatorias, y que exigirá responsabilidades. Li respondió que se defenderá activamente. La disputa sigue a su artículo «El \"temible\" Hongguo y el tiempo ByteDance de internet en China», que sostenía que el tiempo de internet chino pasa del tiempo Tencent al tiempo ByteDance; después ambos polemizaron en público. A fines de octubre, la app de microdramas Hongguo generó debate al retirar por fases sus recompensas en monedas y añadir recordatorios de descanso.", "ja": "11月2日、「秦朔朋友圈」創始者の秦朔氏は、字節跳動（Douyin グループ）副総裁の李亮氏による名誉毀損的発言について、弁護士に委託して人民法院に提訴し、法的責任を追及すると発表した。李氏は「積極的に応訴する」とコメントした。発端は秦氏が「秦朔朋友圈」に発表した論考『「恐ろしい」紅果と中国インターネットの字節時間』で、「中国のインターネットはテンセント時間から字節（ByteDance）時間へ移りつつある」と論じ、双方が論争したことにある。10月下旬には、ショートドラマアプリ「紅果」がコイン報酬の段階的廃止と休憩リマインダー導入を表明し、議論を呼んだ。"}, "why": {"zh": "从文章争论走到诉讼，是把「观点之争」改成「事实之争」：法庭上要证明的不是谁更懂互联网，而是哪句话超出了评论的边界。对内容行业来说，这案子划的线比结论更有用。", "en": "Moving from argument to lawsuit turns a dispute over opinion into one over fact: the court will not decide who understands the internet better, but which sentence crossed the line from commentary. For the content industry the line drawn matters more than the verdict.", "es": "Pasar de la polémica a los tribunales convierte una disputa de opinión en una de hechos: no se decidirá quién entiende mejor internet, sino qué frase cruzó el límite del comentario. Para el sector, la línea que se trace importará más que el fallo.", "ja": "論争から訴訟へ移るということは、「意見の争い」を「事実の争い」に変えることだ。法廷で問われるのは、誰がインターネットをよく分かっているかではなく、どの一文が評論の域を超えたかである。業界にとっては、結論よりも引かれる線のほうが有用だ。"}}, {"idx": "05", "title": {"zh": "半小时卖出 2 万亿 Token，直播间第一次卖算力", "en": "Two trillion tokens in half an hour: livestreaming sells compute", "es": "Dos billones de tokens en media hora: el directo vende cómputo", "ja": "ライブ配信で30分に2兆トークン 初の算力販売"}, "body": {"zh": "11 月 2 日晚，李佳琦直播间双十一首次上架 AI 算力类商品。阿里巴巴集团副总裁、千问办公 CEO 陈宇森进入直播间，千问办公个人会员月卡以 0.01 元促销（原价 28 元），开卖 10 分钟售出 5 万份，半小时累计售出近 10 万份，对应算力额度合计约 2 万亿 Token。该场直播计划发放 20 万亿 Token，直播间同时上架三款内置千问办公的 AI 电脑，价位在 3000 元至 1 万元，以及 AI 听记卡等硬件。今年天猫首次把 Token 设为独立促销品类，智谱、MiniMax、阿里云百炼、月之暗面、阶跃星辰等先后入驻；10 月 20 日双 11 开售首日，淘宝 Token 品类成交额较上月大涨 450%。", "en": "On the evening of 2 November Li Jiaqi's livestream put AI compute on sale for the first time during the Double 11 shopping festival. Alibaba group vice-president and Qwen Office CEO Chen Yusen appeared in the stream as a Qwen Office monthly membership sold for 0.01 yuan against a list price of 28, moving 50,000 units in ten minutes and nearly 100,000 in half an hour — roughly two trillion tokens of compute quota. The session planned to give away 20 trillion tokens and also listed three AI laptops with Qwen Office built in, priced 3,000 to 10,000 yuan, plus AI note-taking hardware. Tmall made tokens a standalone promotional category for the first time this year, with Zhipu, MiniMax, Alibaba Cloud, Moonshot and StepFun joining; on 20 October, the first day of sales, token category turnover rose 450% month on month.", "es": "La noche del 2 de noviembre el directo de Li Jiaqi puso a la venta cómputo de IA por primera vez en el Doble 11. El vicepresidente de Alibaba y consejero delegado de Qwen Office, Chen Yusen, apareció mientras una membresía mensual se vendía a 0,01 yuanes frente a 28 de tarifa: 50.000 unidades en diez minutos y casi 100.000 en media hora, unos dos billones de tokens. La sesión preveía repartir 20 billones y también ofreció tres portátiles con Qwen Office integrado, de 3.000 a 10.000 yuanes, además de hardware de notas con IA. Tmall convirtió los tokens en categoría promocional propia por primera vez, con Zhipu, MiniMax, Alibaba Cloud, Moonshot y StepFun; el 20 de octubre, primer día de ventas, la facturación de la categoría subió 450% intermensual.", "ja": "11月2日夜、李佳琦のライブ配信がダブル11で初めて AI 算力関連商品を扱った。アリババ副総裁で千問办公 CEO の陳宇森氏が出演し、千問办公の個人会員月額カードを0.01元（通常28元）で販売。10分で5万枚、30分で累計10万枚近く、算力換算で約2兆トークンに相当する。この配信では計20兆トークンを配布予定で、千問办公を内蔵した AI パソコン3機種（3,000〜1万元）や AI 録音カードなどのハードも並んだ。天猫は今年初めてトークンを独立したセール区分とし、智譜、MiniMax、阿里雲百煉、月之暗面、階躍星辰などが参加。10月20日の販売初日、淘宝のトークン区分の成交額は前月比450%増だった。"}, "why": {"zh": "八年前同一间直播间卖的是口红，15 分钟 1.5 万支；今天卖的是看不见的调用额度。这个对比真正的含义不是「AI 火了」，而是算力开始按「月卡」的方式被普通人理解——商品化的第一步，永远是先有一个能比较的价格。", "en": "Eight years ago the same room sold 15,000 lipsticks in 15 minutes; today it sells invisible call quotas. The point is not that AI is hot but that compute is now understood by ordinary buyers the way a monthly card is — and the first step of commoditisation is always a price you can compare.", "es": "Hace ocho años ese mismo directo vendió 15.000 pintalabios en 15 minutos; hoy vende cuotas de llamadas invisibles. Lo relevante no es que la IA esté de moda, sino que el cómputo empieza a entenderse como una tarjeta mensual: el primer paso de toda mercantilización es un precio comparable.", "ja": "8年前、同じ配信で15分に1万5千本の口紅が売れた。今日売れたのは目に見えない呼び出し枠である。重要なのは「AI が流行っている」ことではなく、算力が「月額カード」として一般に理解され始めたことだ。商品化の第一歩は、常に比較できる価格である。"}}]}, {"key": "ent", "num": "06", "color": "#db2777", "deep": "#be185d", "name": {"zh": "娱乐八卦", "en": "CULTURE", "es": "CULTURA", "ja": "エンタメ"}, "items": [{"idx": "01", "title": {"zh": "「你能不能删了我，求你」：一场排队求删的老友局", "en": "\"Please delete me\": a queue of old friends asking to be removed", "es": "\"Bórrame, te lo pido\": una cola de viejos amigos pidiendo ser eliminados", "ja": "「私を削除して、お願い」 旧友たちが削除待ちの行列"}, "body": {"zh": "11 月 2 日，马天宇在微博晒出聊天截图，配文「杨幂已经被删除，接下来就是孙怡了」。截图中，备注为「mi」的杨幂主动发来「你能不能删了我，求你」，马天宇对孙怡连发「拉黑你、删除你」，孙怡回复「太好了」。话题登上文娱榜第一，在榜近 12 小时。起因是马天宇在芒果 TV 综艺《后会友期》中自曝早年因拍戏邀约误会，当场删掉制片人张萌微信、两人断联近十年，「不爽就删微信」成为出圈标签。杨幂与马天宇因 2013 年《古剑奇谭》结识，孙怡与其合作《凉生，我们可不可以不忧伤》，三人均为多年好友。杨幂随后发文「蜜蜂不用捞我了」。", "en": "On 2 November actor Ma Tianyu posted chat screenshots on Weibo with the caption \"Yang Mi has been deleted, Sun Yi is next.\" In them Yang Mi, saved simply as \"mi\", asks \"could you delete me, please\", while Sun Yi replies \"great\" to a string of \"blocking you, deleting you\". The topic topped the entertainment chart for nearly 12 hours. It started with Ma's appearance on the Mango TV show Reunion, where he recounted deleting producer Zhang Meng's WeChat over a casting misunderstanding and losing touch for nearly a decade — \"delete if you're annoyed\" became his label. Yang and Ma met on the 2013 drama Swords of Legends; Sun Yi co-starred with him in a later series. Yang later posted that fans need not worry about her.", "es": "El 2 de noviembre el actor Ma Tianyu publicó capturas de chat en Weibo con el texto \"Yang Mi ya está eliminada, ahora va Sun Yi\". En ellas Yang Mi, guardada simplemente como \"mi\", pide \"¿podrías eliminarme, por favor?\", y Sun Yi responde \"genial\" a una retahíla de \"te bloqueo, te elimino\". El tema encabezó la lista de entretenimiento casi 12 horas. Todo viene de su paso por el programa Reunion de Mango TV, donde contó que borró el WeChat de la productora Zhang Meng por un malentendido de rodaje y perdieron el contacto casi una década; \"si me molesta, borro\" se volvió su etiqueta. Yang y Ma se conocieron en la serie de 2013 Swords of Legends; Sun Yi coincidió con él en otra ficción. Yang publicó después que sus fans no debían preocuparse.", "ja": "11月2日、俳優の馬天宇が Weibo にチャットのスクリーンショットを投稿し、「楊冪は削除済み、次は孫怡だ」と記した。楊冪は連絡先名「mi」で「私を削除して、お願い」と送り、孫怡は「ブロックして削除する」の連投に「最高」と返した。話題は芸能ランキング1位に約12時間居座った。発端は馬天宇が Mango TV の番組『後会友期』で、撮影依頼の誤解からプロデューサーの張萌の WeChat をその場で削除し、10年近く絶縁したと明かしたこと。「気に入らなければ削除」が出圈ワードになった。楊冪とは2013年の『古剣奇譚』、孫怡とは別のドラマで共演した旧友である。楊冪は後に「ファンは心配しないで」と投稿した。"}, "why": {"zh": "这场玩梗能成立，恰恰因为它是假的：能公开晒聊天记录、能把备注缩成一个「mi」、能排队接梗，说明关系足够稳。同一档节目里另一对是真删、真断联十年——两种「删好友」放在一起，才看出哪一种是玩笑。", "en": "The joke works precisely because it is not real: posting screenshots in public, saving a name as just \"mi\", queueing up to be deleted all signal a relationship solid enough to take it. The same show features a pair who really did delete each other for a decade — set side by side, you can see which one is a joke.", "es": "La broma funciona justo porque no es real: publicar capturas, guardar un nombre como \"mi\", hacer cola para ser eliminado indica una relación lo bastante sólida. En el mismo programa hay otra pareja que sí se borró durante una década: puestas juntas, se ve cuál es broma.", "ja": "この冗談が成立するのは、それが嘘だからだ。チャットを公開し、連絡先を「mi」とだけ登録し、削除待ちの列に並ぶ。どれも関係が十分に安定している証拠である。同じ番組には本当に10年絶縁した二人がいる。並べてみて初めて、どちらが冗談か分かる。"}}, {"idx": "02", "title": {"zh": "《后会友期》收官：两个人谁都没选「下车」", "en": "Reunion finale: neither of them chose to get off", "es": "Final de Reunion: ninguna de las dos eligió bajarse", "ja": "『後会友期』最終回 二人とも「下車」を選ばず"}, "body": {"zh": "11 月 2 日，《后会友期》收官一集尚未播出，内容已在网络传开：四组旧友中，厉娜与许飞两人都没有选择「下车」——节目中「下车」代表愿意重新走近。两人断联十余年，中间那桩「泄密」旧事没有录音、没有记录、没有第三方，二十年未对出结论。厉娜在节目中表示「不会原谅，也不会理解，我没那么高尚」；许飞那句被传得最广的话是「我画地为牢啊，厉娜」。节目收尾是一句「感谢我的人生你曾出现过」。同一节目里，另两对旧友选择了下车，其中马天宇与张萌说的是「回不到从前」。", "en": "On 2 November, before the Reunion finale aired, word of its content spread: of four pairs of estranged friends, Li Na and Xu Fei both declined to \"get off the bus\", the show's gesture for wanting to try again. They had not spoken for over a decade, and the old accusation between them — no recording, no document, no third party — has never been settled in twenty years. Li Na said on air she will not forgive and does not understand, that she is not that noble; Xu Fei's most quoted line was \"I built my own prison, Li Na\". The episode closed with \"thank you for having been in my life\". Two other pairs did choose to get off, among them Ma Tianyu and Zhang Meng, who said they cannot go back to how it was.", "es": "El 2 de noviembre, antes de que se emitiera el final de Reunion, su contenido se filtró: de cuatro parejas de amigos distanciados, Li Na y Xu Fei rechazaron \"bajarse del autobús\", el gesto del programa para querer intentarlo de nuevo. Llevaban más de una década sin hablarse y la vieja acusación entre ellas —sin grabación, sin documento, sin terceros— sigue sin resolverse veinte años después. Li Na dijo que no perdonará ni comprenderá, que no es tan noble; la frase más citada de Xu Fei fue \"me encerré yo misma, Li Na\". El episodio cerró con \"gracias por haber estado en mi vida\". Otras dos parejas sí se bajaron, entre ellas Ma Tianyu y Zhang Meng, que admitieron no poder volver atrás.", "ja": "11月2日、『後会友期』最終回の放送前に内容が拡散した。4組の旧友のうち、厲娜と許飛は二人とも「下車」を選ばなかった。番組で「下車」は再び近づく意思を表す。二人は10年以上絶縁し、間にある「情報漏洩」の件は録音も記録も第三者也なく、20年たっても結論が出ていない。厲娜は「許さないし、理解もしない。そんなに高尚じゃない」と述べ、許飛の最も引用された言葉は「私は自ら囲い込んだ、厲娜」だった。番組は「あなたが私の人生にいたことに感謝」と締めた。別の2組は下車を選び、馬天宇と張萌は「以前には戻れない」と語った。"}, "why": {"zh": "观众急着给这段关系发一张「体面告别」的证书，两个当事人谁都没签。一个拒绝被夸高尚，一个说自己是被困住的人——这比和解更难拍，也更接近大多数旧友的真实结局。", "en": "Viewers rushed to hand this relationship a certificate of dignified farewell; neither party signed it. One refuses to be called noble, the other calls herself trapped — harder to film than a reconciliation, and closer to how most old friendships actually end.", "es": "El público se apresuró a expedir un certificado de despedida digna; ninguna de las dos lo firmó. Una se niega a ser llamada noble, la otra dice estar atrapada: más difícil de filmar que una reconciliación y más cercano a cómo terminan la mayoría de las viejas amistades.", "ja": "視聴者は「潔い別れ」という証明書を急いで発行したが、当事者二人は誰も署名していない。一人は高尚と呼ばれることを拒み、一人は自分が閉じ込められていると言う。和解より撮るのが難しく、大多数の旧友の実際の結末に近い。"}}, {"idx": "03", "title": {"zh": "赵本山《走马上任》空降开播，40 集民国荒诞喜剧", "en": "Zhao Benshan's new 40-part period comedy drops without warning", "es": "La nueva comedia de época de Zhao Benshan se estrena sin aviso", "ja": "趙本山の新ドラマ『走馬上任』が予告なしで配信開始"}, "body": {"zh": "11 月 2 日中午 12 时，40 集民国荒诞喜剧《走马上任》在腾讯视频「板凳单元」空降开播，咪咕视频同步上线，极光 TV 可看。赵本山特别出演贾归田，王小利一人分饰王老五与马德兵，蒋依杉、葛珊珊、程野等加盟，单集约 32 分钟。首播当日会员可看 1 至 4 集、SVIP 可抢先看第 5 集；11 月 3 日起每日中午 12 时更新 2 集，SVIP 每日多看 1 集，后续还将推出点映礼。开播后腾讯站内热度值破 2200，官微连发喜报。", "en": "At noon on 2 November the 40-episode period comedy Zou Ma Shang Ren dropped on Tencent Video's comedy strand, with Migu Video launching simultaneously and Aurora TV carrying it. Zhao Benshan appears in a special role as Jia Guitian, Wang Xiaoli plays two characters, and Jiang Yishan, Ge Shanshan and Cheng Ye co-star; episodes run about 32 minutes. Members could watch episodes one to four on day one, with SVIP one episode ahead; from 3 November two episodes arrive daily at noon, SVIP one more, and a preview event is planned. Tencent's in-app heat index passed 2,200 shortly after launch.", "es": "Al mediodía del 2 de noviembre la comedia de época de 40 episodios Zou Ma Shang Ren se estrenó sin aviso en Tencent Video, con Migu Video en simultáneo y Aurora TV. Zhao Benshan aparece como Jia Guitian, Wang Xiaoli interpreta dos papeles y completan el reparto Jiang Yishan, Ge Shanshan y Cheng Ye; cada episodio dura unos 32 minutos. Los suscriptores vieron del uno al cuatro el primer día, con SVIP un capítulo por delante; desde el 3 de noviembre llegan dos diarios al mediodía. El índice de popularidad de Tencent superó los 2.200 poco después.", "ja": "11月2日正午、全40話の民国時代の不条理コメディ『走馬上任』が予告なしで Tencent Video のコメディ枠で配信開始、咪咕視頻も同時、極光 TV でも視聴可能。趙本山が賈帰田役で特別出演、王小利が二役、蒋依杉、葛珊珊、程野らが出演し、1話約32分。初日は会員が1〜4話、SVIP は5話まで先行。11月3日から毎日正午に2話更新、SVIP はさらに1話先行で、後日プレミア上映も予定。配信後、Tencent の熱度指数は2,200を超えた。"}, "why": {"zh": "「空降」是当下平台对喜剧的常用打法：不预热、不铺排，直接拿首播热度说话。赵本山这次不是主演而是「特别出演」，把观众预期压在「看个热闹」上——对一部 40 集的剧来说，前四集能不能留住人，比首日热度更关键。", "en": "Dropping without warning is the platforms' standard play for comedy: no warm-up, no build-up, let the first-day number speak. Zhao is billed as a special appearance rather than the lead, which keeps expectations at \"come for the fun\" — and for a 40-episode run, whether the first four hold viewers matters more than day-one heat.", "es": "Estrenar sin aviso es la jugada habitual de las plataformas con la comedia: sin calentamiento, que hable el dato del primer día. Zhao figura como aparición especial y no como protagonista, lo que mantiene la expectativa en \"venir a divertirse\"; en una serie de 40 capítulos, retener con los cuatro primeros importa más que el calor inicial.", "ja": "予告なしの投入は、プラットフォームがコメディでよく使う手だ。事前の盛り上げをせず、初日の数字で語る。趙本山は主演ではなく「特別出演」で、期待値を「とりあえず笑いに来る」に保つ。40話のドラマでは、初日の熱より最初の4話で引き留められるかが重要だ。"}}, {"idx": "04", "title": {"zh": "《折月亮》定档 11 月 5 日，主题曲先到、剧随后", "en": "Zhe Yue Liang set for 5 November, with the theme song first", "es": "Zhe Yue Liang llega el 5 de noviembre, con la canción primero", "ja": "『折月亮』11月5日スタート 主題歌が先に配信"}, "body": {"zh": "11 月 2 日上午 10 时，刘宇宁演唱的《折月亮》同名主题曲上线腾讯音乐娱乐集团旗下平台（QQ 音乐、酷狗音乐、酷我音乐），由四季逗、潘超作词，宋天祥、潘超作曲并担任制作人。同日剧集官宣定档：11 月 5 日起爱奇艺全网独播、江苏卫视独家电视首播。原声带阵容同步公布，包括卢昱晓与林一合唱的《It's you》（惊喜版）、段奥娟片尾曲《一半》、黄婷婷《小小神经质》。当日午间，卢昱晓晒出林一的白衬衫拍立得并配文「当我老婆。」，林一随后晒出卢昱晓的抹胸白纱拍立得回「嗯？靠过来点」，两张单人照拼在一起才构成完整的情侣婚纱组图。", "en": "At 10 a.m. on 2 November Liu Yuning's title song for Zhe Yue Liang went live on Tencent Music platforms — QQ Music, Kugou and Kuwo — written by Sijidou and Pan Chao, composed and produced by Song Tianxiang and Pan Chao. The drama was confirmed the same day: from 5 November it streams exclusively on iQIYI and airs first on Jiangsu Satellite TV. The soundtrack list was released too, including a duet by Lu Yuxiao and Lin Yi, Duan Aojuan's end-credits song and Huang Tingting's contribution. At midday Lu posted a Polaroid of Lin in a white shirt captioned \"be my wife\", and Lin answered with a Polaroid of Lu in a strapless white gown: \"hmm? come closer.\" The two solo shots only form a complete bridal portrait when put together.", "es": "A las 10 de la mañana del 2 de noviembre se estrenó en las plataformas de Tencent Music (QQ Music, Kugou y Kuwo) la canción titular de Zhe Yue Liang, interpretada por Liu Yuning, con letra de Sijidou y Pan Chao y música y producción de Song Tianxiang y Pan Chao. La serie se confirmó ese día: desde el 5 de noviembre en exclusiva en iQIYI y estreno televisivo en Jiangsu TV. Se anunció la banda sonora, con un dueto de Lu Yuxiao y Lin Yi, el tema final de Duan Aojuan y el de Huang Tingting. Al mediodía Lu publicó una Polaroid de Lin con camisa blanca: \"sé mi esposa\"; Lin respondió con una de Lu con vestido blanco: \"¿eh? acércate\". Las dos fotos solo forman el retrato nupcial si se unen.", "ja": "11月2日午前10時、劉宇寧が歌う『折月亮』の主題歌が Tencent Music の各プラットフォーム（QQ 音楽、酷狗音楽、酷我音楽）で配信開始。作詞は四季逗と潘超、作曲・プロデュースは宋天祥と潘超。同日、ドラマは11月5日から iQIYI で独占配信、江蘇衛視でテレビ初放送と発表された。サウンドトラックには盧昱暁と林一のデュエット、段奥娟のエンディング曲、黄婷婷の曲も並ぶ。正午には盧昱暁が林一の白シャツのポラロイドを「私の旦那」と投稿し、林一が白いドレスの盧昱暁の写真に「うん？もっと寄って」と返した。2枚を並べて初めて夫婦のウェディング写真になる仕掛けである。"}, "why": {"zh": "「歌先到、剧随后」是这两年被验证过的节奏：先用一首能单曲循环的歌占住耳朵，再让人去追剧。真正出圈的是那两张拍立得——各发对方的单人照，观众自己动手拼图，参与感比通稿更有效。", "en": "Song first, drama second is a rhythm the industry has validated: occupy the ear with something loopable, then send people to the show. What actually travelled were the two Polaroids — each posting the other's solo shot, leaving the audience to assemble the pair. Participation beats a press release.", "es": "Canción primero, serie después es un ritmo ya validado: ocupar el oído con algo repetible y luego llevar al público a la ficción. Lo que circuló fueron las dos Polaroids: cada uno publica la foto del otro y el público arma la pareja. La participación funciona mejor que una nota de prensa.", "ja": "歌が先、ドラマが後というのはここ数年で定着した型だ。リピートしたくなる曲で耳を押さえ、それから本編へ送る。実際に広がったのは2枚のポラロイドで、互いの単独写真を出し、観客が自分で組み合わせる。参加感はプレスリリースより効く。"}}, {"idx": "05", "tag": {"zh": "进展"}, "title": {"zh": "刘铮亮喊麦：「待我再闯南天门」", "en": "Dr. Liu does a shout-rap promo: \"I'll storm the Southern Gate again\"", "es": "El doctor Liu se pasa al \"hanmai\": \"volveré a cruzar la Puerta del Sur\"", "ja": "劉錚亮が喊麦 「南天門に再び挑む」"}, "body": {"zh": "11 月 2 日，肖战工作室发布《小城良方》魔性喊麦宣传视频，配文「走！跟刘铮亮玩剧本杀吗？」。视频中，剧中冷静内敛的天才神经外科医生刘铮亮以喊麦口吻念出「待我再闯南天门，成为不败的战神」，另有围绕角色的专属喊麦词「刘哥的刘，铮亮的亮，妙手回春一级棒」。追剧团现场播放时，肖战本人害羞低头，被镜头捕捉后进一步放大反差。同日官微还放出主演玩牌花絮，并引导观众前往央视八套与爱奇艺追剧、搜索「小城良方加更礼」直通大结局。此前该剧已用过「刘铮亮开三轮车接心碎家人」「替刘铮亮招师父」等生活化宣传。", "en": "On 2 November Xiao Zhan's studio released a shout-rap promo for the drama Xiaocheng Liangfang, captioned \"coming to play a murder-mystery game with Liu Zhengliang?\" In it the cool, restrained neurosurgeon Liu Zhengliang delivers the line \"I'll storm the Southern Gate again and become an unbeatable god of war\", plus a character-specific chant. When it was played at a fan screening, Xiao Zhan buried his face, and the captured reaction amplified the contrast. The official account also posted cast card-game footage and steered viewers to CCTV-8 and iQIYI, promoting a fast-track pass to the finale. The drama had already used stunts such as Liu driving a three-wheeler to collect grieving families and a recruitment call for a mentor.", "es": "El 2 de noviembre el estudio de Xiao Zhan publicó un vídeo promocional de \"hanmai\" para la serie Xiaocheng Liangfang, con el texto \"¿vienes a jugar un escape room con Liu Zhengliang?\". En él el neurocirujano brillante y contenido Liu Zhengliang suelta \"volveré a cruzar la Puerta del Sur y seré un dios de la guerra invicto\", además de una letra dedicada al personaje. Cuando se proyectó ante fans, Xiao Zhan bajó la cabeza avergonzado, y esa reacción amplió el contraste. La cuenta oficial también publicó imágenes del reparto jugando a las cartas y dirigió al público a CCTV-8 e iQIYI, promocionando un pase directo al final.", "ja": "11月2日、肖戦のスタジオがドラマ『小城良方』の魔性の喊麦（掛け声ラップ）PR 動画を公開し、「さあ、劉錚亮とマーダーミステリーをやらない？」と添えた。映像では、冷静で内向的な天才脳外科医・劉錚亮が「南天門に再び挑み、不敗の戦神になる」と喊麦調で唱え、役柄専用の歌詞も披露。ファン向け上映会で流すと肖戦本人が照れてうつむき、その反応が落差をさらに広げた。公式アカウントは出演者のカードゲーム映像も公開し、CCTV-8 と iQIYI への誘導、「小城良方加更礼」で最終回まで見られるキャンペーンを案内した。"}, "why": {"zh": "一个精英医生去喊麦，反差本身就是传播装置；但更值得注意的是宣发的连续性——三轮车、招师父、剧本杀、喊麦，同一套「接地气」逻辑反复使用，说明剧组很清楚自己要的不是口碑，是让角色变成一个可以被玩梗的人。", "en": "An elite doctor doing shout-rap is a publicity device in itself, but what stands out is the consistency: three-wheeler, mentor hunt, murder-mystery invite, shout-rap — one grounded playbook repeated. The team knows it is not chasing prestige; it is turning the character into someone people can meme.", "es": "Que un médico de élite haga \"hanmai\" es en sí un dispositivo de difusión, pero lo notable es la continuidad: el triciclo, la búsqueda de mentor, el escape room, el rap. Una misma lógica \"de barrio\" repetida: el equipo sabe que no busca prestigio, sino convertir al personaje en alguien con quien se pueda bromear.", "ja": "エリート医師が喊麦をするという落差そのものが拡散装置だが、注目すべきは宣伝の一貫性だ。三輪車、師匠探し、マーダーミステリー、喊麦。同じ「生活感」の論理を繰り返しており、制作側は口碑ではなく、キャラクターを弄れる存在に変えることを狙っていると分かる。"}}]}], "risk": {"zh": "风险提示：本简报仅作信息汇总，其中涉及的数据不构成任何投资建议。", "en": "Risk notice: this briefing is a summary of information only; the data it contains does not constitute investment advice.", "es": "Aviso de riesgo: este boletín es solo un resumen informativo; los datos que contiene no constituyen asesoramiento de inversión.", "ja": "リスク提示：本ブリーフィングは情報の要約であり、記載のデータは投資助言を構成するものではありません。"}}/*__END__*/;

  var LANGS = ["zh", "en", "es", "ja"];

  // 小国旗（内联 SVG，避免外部图标依赖与 emoji 平台差异）

  /* ===== 工具 ===== */
  function T(obj, lang) {

  }

  /* ===== 语言检测：localStorage > 浏览器语言 > 系统时区 > 中文 ===== */
  function detectLang() {

  function renderContent(lang) {

  function setLang(lang) {

      var start = new Date(cur.y, cur.m - 1, 1).getDay();
      var days = new Date(cur.y, cur.m, 0).getDate();
      for (var b = 0; b < start; b++) {
        var blank = document.createElement("span");
        blank.className = "cal-cell is-empty"; grid.appendChild(blank);
      }
      for (var d = 1; d <= days; d++) {
        var k = ckey(cur.y, cur.m, d);
        var cell = document.createElement("span");
        cell.className = "cal-cell" + (has[k] ? " has" : "") + (k === todayKey ? " is-today" : "");
        cell.textContent = d;
        if (has[k]) {
          cell.setAttribute("role", "link"); cell.setAttribute("tabindex", "0");
          cell.title = cur.y + "-" + pad(cur.m) + "-" + pad(d) + " 存档";
          (function (target) {
            var go = function () { window.open(HIST_BASE + target + ".html", "_blank", "noopener"); };
            cell.addEventListener("click", go);
            cell.addEventListener("keydown", function (e) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); go(); } });
          })(k);
        }
        grid.appendChild(cell);
      }
    }
    function toggle(open) {
      pop.hidden = !open;
      btn.setAttribute("aria-expanded", open ? "true" : "false");
      if (open) render();
    }
    btn.addEventListener("click", function (e) { e.stopPropagation(); toggle(pop.hidden); });
    document.getElementById("calPrev").addEventListener("click", function () { cur.m--; if (cur.m < 1) { cur.m = 12; cur.y--; } render(); });
    document.getElementById("calNext").addEventListener("click", function () { cur.m++; if (cur.m > 12) { cur.m = 1; cur.y++; } render(); });
    document.addEventListener("click", function (e) { if (!pop.hidden && !pop.contains(e.target)) toggle(false); });
    document.addEventListener("keydown", function (e) { if (e.key === "Escape" && !pop.hidden) toggle(false); });
  }

  /* ===== 启动 ===== */
  function boot() {
    curLang = detectLang();
    renderChrome(curLang);
    renderContent(curLang);
    initCalendar();
    // 关闭语言下拉：点击外部 / Esc
    document.addEventListener("click", function (e) {
      var ls = document.getElementById("langSwitch");
      if (ls && langOpen && !ls.contains(e.target)) {
        langOpen = false;
        ls.classList.remove("open");
        var t = document.getElementById("langTrigger");
        if (t) t.setAttribute("aria-expanded", "false");
      }
    });
    document.addEventListener("keydown", function (e) {
      if (e.key === "Escape" && langOpen) {
        langOpen = false;
        var ls = document.getElementById("langSwitch");
        if (ls) ls.classList.remove("open");
        var t = document.getElementById("langTrigger");
        if (t) t.setAttribute("aria-expanded", "false");
      }
    });
  }
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", boot);
  } else { boot(); }
})();
</script>
</body>
</html>
