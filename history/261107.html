evio al Doble 11 contra las “tiendas fantasma” y las falsas rebajas", "ja": "「ダブル11」に向けたコンプライアンス提示、ゴースト店舗と架空値下げの防止を要求"}, "body": {"zh": "市场监管总局近日向主要平台企业发布《“双十一”网络集中促销合规提示》，主要包括切实防范“幽灵店铺”“幽灵直播间”、杜绝“先涨价后降价”等内容，要求平台落实主体责任、规范促销行为。", "en": "The State Administration for Market Regulation has issued compliance guidance for major platforms ahead of Double 11, focusing on preventing “ghost stores” and “ghost livestream rooms” and eliminating the practice of raising prices before discounting them, while requiring platforms to take responsibility for promotions.", "es": "La Administración Estatal de Regulación del Mercado ha enviado a las principales plataformas una guía de cumplimiento para el Doble 11 centrada en evitar las “tiendas fantasma” y las “salas de streaming fantasma” y en erradicar la práctica de subir precios antes de rebajarlos.", "ja": "市場監督管理総局はこのほど、主要プラットフォームに「ダブル11」ネット集中販促に関するコンプライアンス上の注意を出し、「ゴースト店舗」「ゴースト配信ルーム」の防止や、値上げ後の値下げ表示の根絶などを求め、プラットフォームに責任遂行を求めた。"}, "why": {"zh": "“幽灵店铺”是新词，问题却很老：有流量、有成交、没有真实经营主体。促销季的监管重点从“价格”扩到“主体”，说明投诉的重心变了。", "en": "“Ghost store” is a new term for an old problem: traffic, sales and no real business entity behind them. Extending supervision from prices to entities shows where complaints have moved.", "es": "“Tienda fantasma” es un término nuevo para un problema viejo: tráfico, ventas y ninguna entidad real detrás. Que la supervisión pase de los precios a los sujetos indica hacia dónde se han movido las quejas.", "ja": "「ゴースト店舗」は新しい言葉だが、問題は古い。集客も売上もあり、実体がない。監督の重点が「価格」から「主体」へ広がったことは、苦情の重心が移ったことを示す。"}}, {"idx": "05", "title": {"zh": "鹤岗一套 68 平方米房子 11 元拍出", "en": "A 68-Square-Metre Flat in Hegang Sells at Auction for 11 Yuan", "es": "Un piso de 68 metros en Hegang se subasta por 11 yuanes", "ja": "鶴崗の68平方メートル住宅が11元で落札"}, "body": {"zh": "11 月 5 日，一套位于黑龙江鹤岗的 68 平方米房产在拍卖平台以 11 元成交，引发关注。拍卖公司称，房屋是可以正常买卖的二手房，平台做活动补贴房款，房屋市场价在 4 万元左右。", "en": "A 68-square-metre flat in Hegang, Heilongjiang, sold at auction for 11 yuan on 5 November, drawing wide attention. The auction house said the property is an ordinary second-hand home that can be bought and sold normally, that the platform subsidised the price as part of a promotion, and that its market value is around 40,000 yuan.", "es": "Un piso de 68 metros cuadrados en Hegang (Heilongjiang) se adjudicó por 11 yuanes el 5 de noviembre, lo que generó gran atención. La casa de subastas explicó que es una vivienda de segunda mano normal, que la plataforma subvencionó el precio dentro de una promoción y que su valor de mercado ronda los 40.000 yuanes.", "ja": "11月5日、黒竜江省鶴崗にある68平方メートルの住宅がオークションで11元で落札され、注目を集めた。オークション会社は、通常に売買できる中古住宅であり、プラットフォームがキャンペーンで代金を補助したものだと説明。市場価格は約4万元だという。"}, "why": {"zh": "11 元不是房价，是营销费用。真正值得看的是那句“市场价 4 万”——鹤岗的房价叙事早被讲成梗，但梗的背后仍是人口与产业的老问题。", "en": "Eleven yuan is not a house price; it is a marketing cost. The line worth noting is “market value around 40,000” — Hegang’s housing story has become a meme, but behind the meme sit the old questions of population and industry.", "es": "Once yuanes no es un precio de vivienda, es un gasto de marketing. La frase que importa es “valor de mercado unos 40.000”: la historia inmobiliaria de Hegang ya es un meme, pero detrás siguen la población y la industria.", "ja": "11元は住宅価格ではなく販促費だ。本当に見るべきは「市場価格は約4万元」という一文である。鶴崗の住宅をめぐる語りはすでにネタになっているが、その背後には人口と産業という古い問題がある。"}}]}, {"key": "ent", "num": "06", "color": "#db2777", "deep": "#be185d", "name": {"zh": "娱乐八卦", "en": "CULTURE", "es": "CULTURA", "ja": "エンタメ"}, "items": [{"idx": "01", "title": {"zh": "金鸡百花电影节开幕：209 部报名，19 个奖项 10 日晚揭晓", "en": "Golden Rooster Opens in Xiamen With 209 Entries and 19 Awards", "es": "Abre el Festival Golden Rooster en Xiamen con 209 películas y 19 premios", "ja": "金鶏百花映画祭が開幕、209作品が応募 19賞は10日夜に発表"}, "body": {"zh": "11 月 6 日晚，2026 年中国金鸡百花电影节暨第 39 届中国电影金鸡奖在福建厦门闽南大戏院开幕。开幕式以“光影归潮”为主题，分“长河入海”“潮生万象”两大篇章，黄晓明与赵丽颖共同点亮金鸡。本届共 209 部影片报名，产生 19 个奖项提名；“最佳导演处女作”更名为“最佳新晋导演”，“最佳美术片”更名为“最佳动画片”。《南京照相馆》《给阿嬷的情书》《镖人：风起大漠》《震耳欲聋》等获多项提名，其中《给阿嬷的情书》6 项。电影节持续至 11 月 10 日，各奖项于 10 日晚揭晓。", "en": "The 2026 China Golden Rooster and Hundred Flowers Film Festival, together with the 39th Golden Rooster Awards, opened at Xiamen’s Minnan Grand Theatre on the evening of 6 November. Under the theme “Light and Shadow Returning to the Tide”, the ceremony featured two chapters, with Huang Xiaoming and Zhao Liying lighting the golden rooster. A total of 209 films entered and 19 awards have nominees; “Best Directorial Debut” is renamed “Best New Director” and “Best Art Film” becomes “Best Animated Feature”. Nanjing Photo Studio, A Letter to Grandma, Blades of the Wind and Deafening received multiple nominations, with A Letter to Grandma leading on six. The festival runs to 10 November, when the winners are announced.", "es": "El Festival de Cine Golden Rooster y Hundred Flowers de China 2026 y la 39.ª edición de los premios se inauguraron el 6 de noviembre en el Gran Teatro Minnan de Xiamen. Bajo el lema “la luz y la sombra vuelven a la marea”, la gala tuvo dos capítulos y Huang Xiaoming y Zhao Liying encendieron el gallo dorado. Se presentaron 209 películas y hay nominados en 19 premios; “Mejor ópera prima” pasa a “Mejor director novel” y “Mejor película artística” a “Mejor largometraje de animación”. Nanjing Photo Studio, A Letter to Grandma, Blades of the Wind y Deafening suman varias candidaturas, con A Letter to Grandma a la cabeza con seis. El festival dura hasta el 10 de noviembre.", "ja": "11月6日夜、2026年中国金鶏百花映画祭および第39回中国映画金鶏賞が福建省アモイの閩南大戯院で開幕した。開会式は「光影帰潮」をテーマに二部構成で、黄暁明と趙麗穎が金鶏を点灯した。応募は209作品、19の賞のノミネートが決まった。「最優秀新人監督賞」への名称変更、「最優秀美術映画」は「最優秀アニメ映画」へ。『南京照相館』『給阿嬤的情書』『震耳欲聾』などが複数ノミネートされ、『給阿嬤的情書』が6部門で最多。映画祭は11月10日まで、受賞作は10日夜に発表される。"}, "why": {"zh": "两个奖项改名，改的其实是评价口径：“新晋导演”看的是第几部作品，“动画片”不再分美术与叙事。分类一变，片方的投递策略就会跟着变。", "en": "Two renamings change the criteria, not just the labels: “new director” asks which film in a career it is, and “animated feature” no longer separates craft from storytelling. Change the category and studios change what they submit.", "es": "Dos cambios de nombre modifican el criterio: “director novel” pregunta por qué película es en una carrera, y “largometraje de animación” ya no separa oficio de narrativa. Si cambia la categoría, cambia lo que se presenta.", "ja": "二つの名称変更は評価のものさしを変える。「新人監督」は監督人生の何作目かを見る賞になり、「アニメ映画」は美術と物語を分けなくなった。分類が変われば、出品側の戦略も変わる。"}}, {"idx": "02", "title": {"zh": "赵丽颖坐进创投评审席，一个拥抱抢了红毯", "en": "Zhao Liying Takes a Venture-Panel Seat as One Hug Steals the Red Carpet", "es": "Zhao Liying se sienta en el jurado de proyectos y un abrazo le roba el protagonismo a la alfombra", "ja": "趙麗穎が投資審査の席へ、抱擁がレッドカーペットをさらう"}, "body": {"zh": "开幕式上，赵丽颖与《知否知否应是绿肥红瘦》中饰演盛长柏的王仁君相遇拥抱、邻座热聊，相关话题登上热搜。本届她担任第八届金鸡电影创投大会主单元主评审，是 85 后演员中首位出任该职务者，同列主评审名单的还有黄建新、闫妮。她当晚还与黄晓明一同登台点亮金鸡。", "en": "At the opening ceremony, Zhao Liying ran into Wang Renjun — who played her elder brother in The Story of Minglan — and the two hugged and chatted in adjacent seats, sending the moment to the top of social media trends. This year she serves as a lead juror of the main unit at the eighth Golden Rooster film venture capital conference, the first actress born in the 1985 cohort to hold that role, alongside Huang Jianxin and Yan Ni. She also appeared with Huang Xiaoming to light the golden rooster.", "es": "En la gala, Zhao Liying se encontró con Wang Renjun —su hermano en la serie The Story of Minglan—, se abrazaron y conversaron en butacas contiguas, lo que llevó el momento a lo más alto de las tendencias. Este año es jurado principal de la unidad central de la octava conferencia de capital riesgo cinematográfico del Golden Rooster, la primera actriz de la generación de 1985 en ese puesto, junto a Huang Jianxin y Yan Ni. También subió al escenario con Huang Xiaoming para encender el gallo.", "ja": "開会式で趙麗穎は、ドラマ『明蘭』で兄を演じた王仁君と再会し、抱擁して隣席で談笑。その様子がトレンド上位に入った。今期は第8回金鶏映画投資大会メインユニットの主審を務め、1985年生まれの俳優として初の就任。黄建新、閻妮と名を連ねる。同日は黄暁明とともに金鶏の点灯も行った。"}, "why": {"zh": "一个没有彩排的拥抱能盖过红毯，是因为观众对“安排好的同框”已经免疫。更值得记的是那把椅子——从被评到评审，位置换了，行业分量也就换了。", "en": "An unrehearsed hug outshone the red carpet because audiences are immune to staged reunions. The seat matters more: moving from being judged to judging changes a career’s weight in the industry.", "es": "Un abrazo sin ensayo superó a la alfombra porque el público ya es inmune a los reencuentros montados. Importa más la silla: pasar de ser evaluada a evaluar cambia el peso de una carrera.", "ja": "リハーサルなしの抱擁がレッドカーペットを上回ったのは、観客が「仕込まれた共演」に免疫を持っているからだ。それ以上に重要なのは席だ。評価される側から評価する側へ移ることで、業界での重みが変わる。"}}, {"idx": "03", "title": {"zh": "冯远征卸任北京人艺院长", "en": "Feng Yuanzheng Steps Down as Head of Beijing People’s Art Theatre", "es": "Feng Yuanzheng deja la dirección del Teatro de Arte del Pueblo de Pekín", "ja": "馮遠征氏、北京人民芸術劇院の院長を退任"}, "body": {"zh": "11 月 6 日，北京人民艺术剧院召开干部大会，霍志静任北京人民艺术剧院党组副书记、院长，冯远征不再担任党组副书记、院长职务。", "en": "Beijing People’s Art Theatre held a cadres’ meeting on 6 November at which Huo Zhijing was appointed deputy Party secretary and president, with Feng Yuanzheng stepping down from both posts.", "es": "El Teatro de Arte del Pueblo de Pekín celebró el 6 de noviembre una reunión de cuadros en la que Huo Zhijing asumió como subsecretario del partido y director, y Feng Yuanzheng dejó ambos cargos.", "ja": "11月6日、北京人民芸術劇院は幹部会議を開き、霍志静氏が党組副書記・院長に就任し、馮遠征氏は党組副書記・院長を退任した。"}, "why": {"zh": "人艺院长这个位置，管的不是一家剧院，是一套“怎么排戏、怎么带人”的传统。换人之后，最先被观察的往往是下一季的剧目单。", "en": "Running the People’s Art Theatre is not managing a venue but a tradition of how plays are staged and actors are trained. After a change at the top, the first thing watched is next season’s programme.", "es": "Dirigir el Teatro de Arte del Pueblo no es gestionar una sala, sino una tradición sobre cómo se montan las obras y se forman los actores. Tras el cambio, lo primero que se mira es la próxima temporada.", "ja": "人芸の院長という職は、一つの劇場ではなく「どう演出し、どう人を育てるか」という伝統を預かるものだ。交代後にまず注目されるのは、多くの場合、次のシーズンの演目である。"}}, {"idx": "04", "title": {"zh": "厉娜的“经济损失”回来了：奈雪、绝味接连官宣", "en": "Li Na’s “Economic Loss” Comes Back as Brands Line Up to Sign Her", "es": "Vuelven las “pérdidas económicas” de Li Na: las marcas se la disputan", "ja": "厲娜の「経済的損失」が戻ってきた、奈雪や絶味が相次ぎ起用"}, "body": {"zh": "11 月 6 日，奈雪的茶官宣厉娜为“奈雪暖暖现烤系列”推荐官；此前 11 月 5 日，绝味鸭脖已官宣厉娜为品牌“鲜推官”。因综艺《后会友期》热播，“那我所有的经济损失呢”“我画地为牢厉娜”等金句刷屏，厉娜与许飞频上热搜。沪上阿姨、茉莉奶白等品牌也在官方账号晒出厉娜手持产品的照片。", "en": "Nayuki announced on 6 November that Li Na would front its warm baked-drinks series, a day after Juewei Duck Neck named her a brand ambassador. Her lines from the variety show Meeting You Later — including “what about all my economic losses?” — went viral and kept her and Xu Fei in the trending lists, while brands from Auntea Jenny to Molly Tea posted photos of her holding their cups.", "es": "Nayuki anunció el 6 de noviembre que Li Na será imagen de su línea de bebidas calientes de panadería, un día después de que Juewei la nombrara embajadora. Sus frases del programa Meeting You Later, como “¿y todas mis pérdidas económicas?”, se hicieron virales y la mantuvieron junto a Xu Fei en las tendencias, mientras otras marcas publicaban fotos de ella con sus productos.", "ja": "11月6日、奈雪の茶は厲娜を「温かい焼き菓子シリーズ」の推薦人に起用すると発表。前日5日には絶味鴨脖が「鮮推官」に迎えていた。バラエティ『後会友期』の「じゃあ私の経済的損失は？」などの名文句が拡散し、厲娜と許飛は繰り返しトレンド入り。滬上阿姨や茉莉奶白なども彼女が商品を持つ写真を投稿した。"}, "why": {"zh": "一句综艺里的抱怨，二十天后变成了商务报价。品牌方的反应速度，本身就是对“什么算热度”最诚实的投票。", "en": "A complaint made on a variety show became a rate card within weeks. How fast brands move is the most honest vote on what counts as heat.", "es": "Una queja dicha en un programa se convirtió en tarifa en pocas semanas. La velocidad de las marcas es el voto más honesto sobre qué es “tener tirón”.", "ja": "バラエティでの一言の愚痴が、三週間で営業の値札に変わった。ブランドの反応の速さそのものが、「何が熱量か」への最も正直な投票である。"}}, {"idx": "05", "title": {"zh": "时代峰峻发致粉丝信，划出五条红线", "en": "Time Fengjun Issues a Letter to Fans and Draws Five Red Lines", "es": "Time Fengjun publica una carta a sus fans y fija cinco líneas rojas", "ja": "時代峰峻がファンへの公開書簡、五つのレッドラインを提示"}, "body": {"zh": "11 月 6 日，时代峰峻在付费高会平台发布《致全体粉丝的一封信》，呼吁停止举报与内耗，称饭圈乱象已对艺人造成“严重且不可逆”的负面影响，并提出五条红线：回归舞台与作品、禁止跟拍追私与非法聚集、点名“恶意举报”等。信中提及，今年 8 月 TOP 登陆少年徐州演出期间，当地热线收到近 4.9 万件相关诉求。部分粉丝不认可，认为公司回避了资源分配与工作人员售卖行程等问题。", "en": "Time Fengjun published an open letter to fans on its paid membership platform on 6 November, urging an end to mass reporting and internal feuding and saying fandom disorder has done “serious and irreversible” damage to its artists. It set five red lines: focus on stages and work, no stalking or unauthorised gatherings, and a specific warning against malicious mass reporting. The letter noted that nearly 49,000 complaints reached local hotlines during a August performance by TOP in Xuzhou. Some fans rejected it, saying the company ignored resource allocation and staff selling itineraries.", "es": "Time Fengjun publicó el 6 de noviembre una carta abierta a los fans en su plataforma de pago, pidiendo el fin de las denuncias masivas y las peleas internas y afirmando que el desorden del fandom ha causado un daño “grave e irreversible” a sus artistas. Fijó cinco líneas rojas: volver a los escenarios y al trabajo, prohibir el acoso y las concentraciones no autorizadas y advertir contra las denuncias maliciosas. La carta menciona casi 49.000 quejas recibidas en líneas locales durante una actuación de TOP en Xuzhou en agosto. Parte de los fans la rechazó.", "ja": "11月6日、時代峰峻は有料会員向けに「ファン全体への手紙」を発表し、通報合戦と内耗の停止を呼びかけた。ファン文化の乱れがアーティストに「深刻かつ不可逆」な悪影響を与えたとし、舞台と作品への回帰、追跡・私的撮影や無許可の集合の禁止、悪意ある集団通報への警告など五つのレッドラインを示した。8月の徐州公演では地元ホットラインに約4万9000件の要望が寄せられたという。一部のファンは、資源配分やスタッフによる日程販売の問題を回避していると反発している。"}, "why": {"zh": "公司第一次把“举报”写成了红线。但粉丝经济的症结在于：当数据和销量由粉丝组织生产，公司就很难只要作品、不要组织。", "en": "For the first time the company has put “mass reporting” on a red-line list. The bind is structural: when data and sales are produced by fan organisations, a company cannot easily keep the output and disown the organiser.", "es": "Por primera vez la empresa incluye las “denuncias masivas” entre sus líneas rojas. El dilema es estructural: si los datos y las ventas los producen las organizaciones de fans, la empresa no puede quedarse con el resultado y desentenderse del organizador.", "ja": "会社が初めて「集団通報」をレッドラインに明記した。だが構造的な矛盾がある。データと売上をファン組織が生み出している以上、会社は成果だけを受け取り、組織を切り離すわけにはいかない。"}}]}], "risk": {"zh": "风险提示：本简报仅作信息汇总，其中涉及的数据不构成任何投资建议。", "en": "Risk notice: this briefing is a summary of information only; the data it contains does not constitute investment advice.", "es": "Aviso de riesgo: este boletín es solo un resumen informativo; los datos que contiene no constituyen asesoramiento de inversión.", "ja": "リスク提示：本ブリーフィングは情報の要約であり、記載のデータは投資助言を構成するものではありません。"}}/*__END__*/;

  // 小国旗（内联 SVG，避免外部图标依赖与 emoji 平台差异）

    if (lang === "es") return '<svg class="fl" viewBox="0 0 30 20" aria-hidden="true"><rect width="30" height="20" fill="#aa151b"/><rect y="5" width="30" height="10" fill="#f1bf00"/></svg>';

  /* ===== 工具 ===== */
  function T(obj, lang) {
    if (obj == null) return "";

  }

  function fmtDate(d, lang) {
    var y = d.getFullYear(), m = d.getMonth() + 1, day = d.getDate();
    if (lang === "zh") return y + "." + pad(m) + "." + pad(day);

  /* ===== 语言检测：localStorage > 浏览器语言 > 系统时区 > 中文 ===== */
  function detectLang() {
    try { var s = localStorage.getItem("timab_lang"); if (s && LANGS.indexOf(s) >= 0) return s; } catch (e) {}
    var nav = (navigator.language || "").toLowerCase();
    if (/^zh/.test(nav)) return "zh";
    if (/^ja/.test(nav)) return "ja";

  }

  var curLang = "zh";

  /* ===== 渲染 ===== */
  function renderChrome(lang) {

    if (md) {
      var d = new Date(BRIEFING.date + "T00:00:00");

    }

    var siteName = (lang === "zh") ? "提马早报" : "TIMAB DAILY";

    var cf = document.getElementById("calFoot"); if (cf) cf.textContent = i18n.calFoot;
    // 语言切换器（国旗触发 + 下拉）

  function renderContent(lang) {

      + "<h2>" + titleHtml(sp.title, sp.hl, lang) + "</h2>"

  function setLang(lang) {

  /* ===== 往期日历（保留原逻辑，文案随语言） ===== */
  function initCalendar() {

    var title = document.getElementById("calTitle");
    if (!btn || !pop || !grid || !title) return;

    var parts = BRIEFING.date.split("-");
    var todayKey = parts[0].slice(2) + parts[1] + parts[2];
    var cur = { y: +parts[0], m: +parts[1] };

    function ckey(y, m, d) { return String(y).slice(2) + pad(m) + pad(d); }

    function render() {
      var i18n = I18N[curLang];
      title.textContent = i18n.calTitle(cur.y, cur.m);
      grid.innerHTML = "";

      for (var b = 0; b < start; b++) {

        if (has[k]) {
          cell.setAttribute("role", "link"); cell.setAttribute("tabindex", "0");
          cell.title = cur.y + "-" + pad(cur.m) + "-" + pad(d) + " 存档";
          (function (target) {
            var go = function () { window.open(HIST_BASE + target + ".html", "_blank", "noopener"); };
            cell.addEventListener("click", go);
            cell.addEventListener("keydown", function (e) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); go(); } });
          })(k);
        }
        grid.appendChild(cell);
      }
    }
    function toggle(open) {
      pop.hidden = !open;
      btn.setAttribute("aria-expanded", open ? "true" : "false");
      if (open) render();
    }
    btn.addEventListener("click", function (e) { e.stopPropagation(); toggle(pop.hidden); });
    document.getElementById("calPrev").addEventListener("click", function () { cur.m--; if (cur.m < 1) { cur.m = 12; cur.y--; } render(); });
    document.getElementById("calNext").addEventListener("click", function () { cur.m++; if (cur.m > 12) { cur.m = 1; cur.y++; } render(); });
    document.addEventListener("click", function (e) { if (!pop.hidden && !pop.contains(e.target)) toggle(false); });
    document.addEventListener("keydown", function (e) { if (e.key === "Escape" && !pop.hidden) toggle(false); });
  }

  /* ===== 启动 ===== */
  function boot() {
    curLang = detectLang();
    renderChrome(curLang);
    renderContent(curLang);
    initCalendar();
    // 关闭语言下拉：点击外部 / Esc
    document.addEventListener("click", function (e) {
      var ls = document.getElementById("langSwitch");
      if (ls && langOpen && !ls.contains(e.target)) {
        langOpen = false;
        ls.classList.remove("open");
        var t = document.getElementById("langTrigger");
        if (t) t.setAttribute("aria-expanded", "false");
      }
    });
    document.addEventListener("keydown", function (e) {
      if (e.key === "Escape" && langOpen) {
        langOpen = false;
        var ls = document.getElementById("langSwitch");
        if (ls) ls.classList.remove("open");
        var t = document.getElementById("langTrigger");
        if (t) t.setAttribute("aria-expanded", "false");
      }
    });
  }
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", boot);
  } else { boot(); }
})();
</script>
</body>
</html>
