  var BRIEFING = /*__BRIEFING_DATA__*/{"date": "2026-10-19", "meta": {"zh": "星期一 · 农历九月初十 · timab.cn", "en": "Monday · Lunar September 10 · timab.cn", "es": "Lunes · 10.º día del noveno mes lunar · timab.cn", "ja": "月曜日 · 旧暦九月十日 · timab.cn"}, "spotlight": {"badge": {"zh": "精 选", "en": "SPOTLIGHT", "es": "DESTACADO", "ja": "注 目"}, "title": {"zh": "中超冠军悬念史诗级续命：蓉城五个冠军点全部落空，10 月 24 日主场对英博一役定乾坤", "en": "The CSL title race refuses to end: Chengdu fails a fifth match point, and October 24's home clash with Dalian Yingbo becomes a winner-take-all showdown", "es": "La pelea por el título de la Superliga china no se rinde: Chengdu falla su quinta bola de partido y el 24 de octubre, ante el Dalian Yingbo, todo se decide", "ja": "スーパーリーグ優勝争いは史劇的な延長戦に：蓉城、5度目の優勝ポイントも空振り——10月24日の大連英博戦が事実上の決勝戦に"}, "hl": {"zh": "五个冠军点全部落空", "en": "a fifth match point falls", "es": "la quinta bola de partido cae", "ja": "5度目の優勝ポイントも空振り"}, "body": {"zh": "中超第 28 轮昨夜全部战罢：只需 1 分即可提前两轮夺冠的成都蓉城客场 0:3 不敌上海海港——王东升头球乌龙、莱昂纳多吊射、武磊空门锁定，海港赛季首度双杀蓉城。追赶者大连英博则 3:1 击败深圳新鹏城豪取三连胜，与榜首差距缩小至 6 分，把冠军悬念强行续到了下一轮：10 月 24 日蓉城坐镇主场迎战英博，蓉城打平即夺冠，输球则争冠彻底失控。这已是蓉城本赛季第五次错过冠军点。", "en": "Chinese Super League round 28 finished on Sunday: Chengdu Rongcheng, needing just one point to seal the title with two rounds to spare, lost 0-3 away to Shanghai Port — an own goal, a Leonardo chip and a Wu Lei tap-in gave Port a season double over the leaders. Chasing Dalian Yingbo beat Shenzhen Peng City 3-1 for a third straight win, cutting the gap to six points and dragging the title race into next round's direct clash: on October 24 Chengdu hosts Yingbo, where a draw crowns the champions but a defeat would throw everything wide open. It is the fifth match point Chengdu has failed to convert this season.", "es": "La jornada 28 de la Superliga china cerró el domingo: Chengdu Rongcheng, que solo necesitaba un punto para ser campeón con dos fechas de sobra, cayó 0-3 en casa del Shanghai Port — un autogol, una vaselina de Leonardo y el gol de Wu Lei sellaron el primer doblete de la temporada sobre el líder. El perseguidor Dalian Yingbo venció 3-1 al Shenzhen Peng City y encadena tres triunfos, recortó la diferencia a seis puntos y arrastró la pelea al duelo directo: el 24 de octubre Chengdu recibe a Yingbo, donde un empate le da el título y una derrota lo cambiaría todo. Es la quinta bola de partido que Chengdu desperdicia esta temporada.", "ja": "スーパーリーグ第28節が18日に全試合終了。勝ち点1で2試合を残しての優勝が決まるはずだった首位の成都蓉城は、アウェイで上海海港に0対3で敗れた——オウンゴール、レオナルドのチップシュート、武磊のダメ押しゴールで、海港は今季初の蓉城ダブルスコア達成。追う大連英博は深圳新鵬城に3対1と勝利し3連勝、差は6に縮まり、優勝争いは来節の直接対決へ持ち越された。10月24日、蓉城は本拠地で英博を迎え、引き分けで優勝が決まるが、負ければ形勢は一変する。蓉城にとって今季5度目の優勝ポイント不成立となった。"}, "why": {"zh": "足球剧本都不敢这么写：一支球队把「冠军点」连丢五次，追兵六分之差步步紧逼，10 月 24 日一战定冠军还是决战到最后一轮，全中国球迷都在等答案。", "en": "No scriptwriter would dare: one team has now blown five title points while the chaser closes to six, and all of China waits to see whether October 24 crowns a champion or forces a final-day finale.", "es": "Ningún guionista se atrevería: un equipo acaba de fallar cinco bolas de título mientras el perseguidor se acerca a seis, y todo el país espera a saber si el 24 de octubre habrá campeón o se jugará todo en la última fecha.", "ja": "脚本でもここまでは描けない。1つのチームが優勝ポイントを5回も逃し、追撃チームは勝差6まで迫った。10月24日に優勝が決まるのか、最終節までもつれるのか、中国中のファンが答えを待っている。"}}, "risk": {"zh": "风险提示：本简报仅作信息汇总，其中涉及的数据不构成任何投资建议。", "en": "Disclaimer: This briefing is a news digest only; data cited does not constitute investment advice.", "es": "Aviso: Este resumen es solo una compilación informativa; los datos citados no constituyen asesoramiento de inversión.", "ja": "注記：本紙は情報のまとめであり、記載データは投資助言を構成するものではありません。"}, "sections": [{"key": "intl", "num": "01", "color": "#1d4ed8", "deep": "#1e3fa8", "name": {"zh": "国际时事", "en": "World", "es": "Internacional", "ja": "国際"}, "items": [{"idx": "01", "tag": {"zh": "进展"}, "title": {"zh": "美乌公开翻脸：泽连斯基批豁免对俄制裁「是错误的」，特朗普称正斡旋和平谈判", "en": "US and Ukraine clash openly: Zelensky calls sanctions relief a mistake as Trump says he is brokering peace talks", "es": "EE. UU. y Ucrania chocan en público: Zelenski tacha de error la exención de sanciones, mientras Trump dice mediar negociaciones de paz", "ja": "米ウクライナが公然と対立：ゼレンスキー氏は対露制裁免除を「誤り」と批判、トランプ氏は和平斡旋を主張"}, "body": {"zh": "美乌分歧持续公开化。泽连斯基 18 日表示，自美方宣布所谓「俄乌能源停火」以来，俄罗斯已对乌能源设施发动 76 次袭击，并称美方豁免对俄制裁「是错误的」，担忧未来还会进一步放松；俄副总理同日称俄柴油将在签约后 15 至 20 天进入美国市场。特朗普则在社交平台发文称正斡旋俄乌和平谈判，批评泽连斯基「不愿停战」；18 日凌晨乌军大规模无人机袭击了圣彼得堡的石油码头等目标。美媒称泽连斯基已决定「公开对抗」特朗普。", "en": "The US-Ukraine rift keeps playing out in public. Zelensky said on Sunday Russia has struck Ukrainian energy facilities 76 times since Washington declared the so-called 'energy ceasefire', calling the US waiver of Russia sanctions 'a mistake' and fearing further loosening ahead; Russia's deputy premier said Russian diesel will reach the US market 15-20 days after contracts are signed. Trump posted that he is brokering Russia-Ukraine peace talks and criticized Zelensky for refusing to stop the war; in the early hours of Sunday Ukrainian drones hit oil terminals in Saint Petersburg. US media say Zelensky has decided to 'confront Trump openly'.", "es": "La gripe entre EE. UU. y Ucrania sigue a la vista pública. Zelenski dijo el domingo que Rusia ha atacado 76 veces instalaciones energéticas ucranianas desde el llamado 'alto el fuego energético', calificó de 'error' la exención de sanciones a Rusia y teme nuevas flexibilizaciones; el viceprimer ministro ruso aseguró que el diésel ruso llegará al mercado estadounidense 15-20 días tras firmar contratos. Trump publicó que media negociaciones de paz entre Rusia y Ucrania y criticó a Zelenski por no querer detener la guerra; en la madrugada del domingo drones ucranianos atacaron terminales petroleras de San Petersburgo. La prensa estadounidense dice que Zelenski ha decidido 'enfrentar a Trump abiertamente'.", "ja": "米国とウクライナの対立が公然と進行している。ゼレンスキー氏は18日、いわゆる「エネルギー停戦」発表以降、ロシアがウクライナのエネルギー施設を76回攻撃したと述べ、対露制裁の免除を「誤り」と批判し、さらなる緩和を懸念。ロシアの副首相は、調印後15〜20日でロシア産ディーゼルが米国市場に流入すると説明した。トランプ氏はSNSで露烏和平交渉を斡旋中だとし、ゼレンスキー氏が停戦を望まないと批判。18日未明にはウクライナの無人機がサンクトペテルブルクの石油ターミナルなどを攻撃した。米メディアは、ゼレンスキー氏がトランプ氏と「公然と対決する」ことを決めたと報じた。"}, "why": {"zh": "豁免制裁、限制星盾、斡旋谈判——美乌关系一周内连环生变，直接牵动战场走向与欧洲安全格局。", "en": "Sanctions relief, Starshield limits, peace brokerage: the US-Ukraine relationship has lurched all week, with direct consequences for the battlefield and Europe's security architecture.", "es": "Exención de sanciones, límites a Starshield, mediación de paz: la relación EE. UU.-Ucrania ha dado giros toda la semana, con efectos directos en el frente y la seguridad europea.", "ja": "制裁免除、スターシールド制限、和平斡旋——米ウクライナ関係は一週間で連続して揺れ、戦局と欧州の安全保障の枠組みを直接左右する。"}}, {"idx": "02", "tag": {"zh": "进展"}, "title": {"zh": "伊朗重申「7 日方案」有效：第 6 天重开霍尔木兹海峡，第 7 天启动谈判", "en": "Iran renews its '7-day plan': Strait of Hormuz reopens on day six, talks start on day seven", "es": "Irán revalida su 'plan de 7 días': el estrecho de Ormuz reabre al sexto día y las conversaciones empiezan al séptimo", "ja": "イランが「7日間プラン」の有効性を再表明：6日目にホルムズ海峡を再開し、7日目に交渉開始"}, "body": {"zh": "伊朗外长阿拉格齐 18 日表示，「7 天内重开霍尔木兹海峡」方案依然有效：若美方遵守伊方条件，海峡可在第 6 天恢复通航、第 7 天启动全面谈判。同日伊朗海军通报，一艘「违规」油轮在海峡南部入口附近触雷起火，近期违规穿越受损油轮数量明显上升；伊朗最高国家安全委员会秘书雷扎伊警告，武装力量已针对任何新的「冒险行径」制定应对方案，其破坏力将远超此前。", "en": "Iranian Foreign Minister Araghchi said on Sunday the 'reopen the Strait of Hormuz within 7 days' plan remains valid: if Washington meets Tehran's conditions, the strait can resume navigation on day six and full talks start on day seven. Iran's navy reported the same day that a 'rule-breaking' tanker hit a mine and caught fire near the strait's southern entrance, with damage to rule-breaking tankers clearly on the rise; SNSC secretary Rezaei warned the armed forces have drawn up a response to any new 'adventure' far more destructive than before.", "es": "El canciller iraní Araghchi dijo el domingo que el plan de 'reabrir el estrecho de Ormuz en 7 días' sigue vigente: si Washington cumple las condiciones de Teherán, la navegación puede reanudarse al sexto día y las conversaciones plenarias iniciar al séptimo. La armada iraní informó ese día que un tanquero infractor chocó contra una mina y se incendió cerca de la entrada sur del estrecho, con un claro aumento de buques dañados; el secretario del Consejo Supremo de Seguridad, Rezaei, advirtió que las fuerzas armadas tienen un plan de respuesta a cualquier nueva 'aventura', mucho más destructivo que antes.", "ja": "イランのアラグチ外相は18日、「7日以内にホルムズ海峡を再開する」プランが依然有効だと表明。米側が条件を受け入れれば、6日目に通航を再開し、7日目に本格交渉を始められるという。同日、イラン海軍は「違反」油槽船が海峡南入口付近で機雷に接触して出火したと通報し、違反通航船の被害が明らかに増加している。最高国家安全委員会事務局長のレザイー氏は、新たな「冒険主義」に対する対応策をすでに策定済みで、その破壊力は以前をはるかに上回ると警告した。"}, "why": {"zh": "海峡通堵已连着全球油价、航运保险与美国中期选举三根弦，「7 日方案」是当前唯一摆在桌面上的降级路线图。", "en": "The strait now ties together global oil prices, shipping insurance and the US midterms — the '7-day plan' is the only de-escalation roadmap on the table.", "es": "El estrecho conecta hoy precios del crudo, seguros marítimos y las elecciones de medio término en EE. UU.: el 'plan de 7 días' es el único mapa de desescalada sobre la mesa.", "ja": "海峡の開閉は世界的な油価、海運保険、米中間選挙の三本の糸で結ばれている。「7日間プラン」は現在、机上に唯一ある緊張緩和のロードマップだ。"}}, {"idx": "03", "tag": {}, "title": {"zh": "法国 55 万人抗议生活成本，2397 人被捕；欧洲多国示威欧元走低", "en": "550,000 protest living costs in France with 2,399 arrests; demonstrations spread across Europe, euro slides", "es": "550.000 personas protestan por el costo de vida en Francia, 2.399 detenidos; las manifestaciones se extienden por Europa y el euro cae", "ja": "フランスで55万人が生活費高騰に抗議、2397人検挙——欧州各国にデモ拡大、ユーロ安進む"}, "body": {"zh": "当地时间 17 日，为抗议生活成本上涨与公共服务恶化，法国多地爆发大规模示威，内政部统计全法约 55 万人参加，全国 2397 人被捕、997 名警察和宪兵受伤，多个城市发生激烈冲突。同一波浪潮中，欧洲多国相继爆发抗议活动，市场对欧洲社会与财政压力的担忧升温，欧元兑主要货币应声下跌。", "en": "On Saturday, large-scale demonstrations over rising living costs and deteriorating public services broke out across France: the Interior Ministry counted about 550,000 participants nationwide, 2,399 arrests and 997 police and gendarmes injured, with violent clashes in several cities. In the same wave, protests erupted in multiple European countries; market worries over Europe's social and fiscal strain rose, and the euro fell against major currencies.", "es": "El sábado, masivas manifestaciones por el alza del costo de vida y el deterioro de los servicios públicos estallaron por Francia: el Ministerio del Interior contabilizó unos 550.000 participantes, 2.399 detenidos y 997 policías y gendarmes heridos, con disturbios violentos en varias ciudades. En la misma ola estallaron protestas en varios países europeos; creció la preocupación del mercado por la tensión social y fiscal europea, y el euro cayó frente a las principales divisas.", "ja": "17日、生活費の高騰と公共サービスの悪化に抗議する大規模デモがフランス各地で発生。内務省集計で全国約55万人が参加し、2397人が検挙され、警察・憲兵997人が負傷、複数都市で激しい衝突が起きた。同じ波は欧州各国にも飛び火し、欧州の社会・財政への懸念から主要通貨に対してユーロが下落した。"}, "why": {"zh": "55 万人与 2397 人被捕是近年罕见规模，社会怒火已从法国烧向多国，欧元与欧债市场本周将直接承压。", "en": "550,000 protesters and 2,399 arrests mark an unusually large mobilization; with anger spreading across countries, the euro and European debt markets will feel the pressure this week.", "es": "550.000 manifestantes y 2.399 detenidos marcan una movilización excepcional; con el malestar extendiéndose por varios países, el euro y la deuda europea sentirán la presión esta semana.", "ja": "55万人デモと2397人検挙は異例の規模だ。怒りが各国に広がるなか、ユーロと欧州債市場は今週直接的な圧力を受ける。"}}, {"idx": "04", "tag": {}, "title": {"zh": "印度加尔各答发生踩踏事故，已致 19 人死亡", "en": "Stampede in Kolkata, India, leaves at least 19 dead", "es": "Una estampida en Calcuta, India, deja al menos 19 muertos", "ja": "インド・カルカッタで群衆事故、19人死亡"}, "body": {"zh": "据印度警方和医院方面的数据，西孟加拉邦首府加尔各答 17 日晚发生的踩踏事故已造成 19 人死亡，另有多人受伤送医。事故发生的具体原因与现场人流管控情况仍在调查核实中，当地已启动应急处置并对相关责任人展开调查。", "en": "According to Indian police and hospital sources, a stampede in Kolkata, capital of West Bengal, on Saturday night has killed at least 19 people, with more injured and hospitalized. The exact cause and crowd-control circumstances are still under investigation, and local authorities have launched an emergency response and an accountability probe.", "es": "Según datos de la policía y hospitales indios, una estampida ocurrida la noche del sábado en Calcuta, capital de Bengala Occidental, ya deja 19 muertos y varios heridos hospitalizados. La causa exacta y las circunstancias del control de multitudes siguen bajo investigación, y las autoridades locales han activado la respuesta de emergencia y una pesquisa de responsabilidades.", "ja": "インド警察と医療機関の情報によると、西ベンガル州都カルカッタで17日夜に起きた群衆事故により、これまでに19人が死亡し、複数の負傷者が搬送された。正確な原因と現場の人流管理状況はまだ調査中で、現地当局は緊急対応と責任追及の調査を開始している。"}, "why": {"zh": "大型活动人流安全再次敲响警钟：踩踏伤亡在极短时间内发生，公共聚集场所的管控与预警值得所有城市引以为鉴。", "en": "Another alarm on crowd safety: a crush can turn deadly within minutes, and crowd control and early warning at mass gatherings is a lesson for every city.", "es": "Otra alarma sobre seguridad multitudinaria: una estampida se vuelve letal en minutos, y el control y la alerta temprana en eventos masivos son una lección para toda ciudad.", "ja": "大規模イベントの人流安全が再び警鐘を鳴らす。群衆事故はわずか数分で死傷に至り、集客場所の管理と早期警戒はすべての都市の教訓となる。"}}, {"idx": "05", "tag": {}, "title": {"zh": "超强台风「蔷琵」逼近菲律宾，预计 20 日进入其责任区", "en": "Super Typhoon Quipi nears the Philippines, expected to enter its area of responsibility on Tuesday", "es": "El súper tifón Quipi se acerca a Filipinas y entrará en su zona de responsabilidad el martes", "ja": "スーパー台風「キョーピー」がフィリピンに接近、20日に責任海域へ"}, "body": {"zh": "菲律宾国家气象局通报，超强台风「蔷琵」目前强度维持并在持续增强路径上移动，预计 20 日进入菲律宾责任区。气象部门提醒沿海地区提前做好防风防浪准备，部分航线与渔业作业或将提前暂停；该台风后期路径与强度仍存在变数，需持续跟踪。", "en": "The Philippine weather bureau said Super Typhoon Quipi is holding strength on a steadily intensifying track and is expected to enter the Philippine area of responsibility on October 20. Coastal areas were told to prepare for high winds and waves, with some shipping routes and fishing operations likely to be suspended in advance; the storm's later path and intensity remain uncertain and warrant continued tracking.", "es": "La agencia meteorológica filipina informó que el súper tifón Quipi mantiene su intensidad en una trayectoria de fortalecimiento sostenido y entrará en la zona de responsabilidad de Filipinas el 20 de octubre. Las zonas costeras fueron advertidas de prepararse para vientos y olas fuertes, con rutas marítimas y faenas pesqueras que podrían suspenderse de antemano; la trayectoria e intensidad posteriores siguen siendo inciertas y exigen seguimiento.", "ja": "フィリピン気象局の発表によると、スーパー台風「キョーピー」は強度を維持したまま発達経路を進んでおり、20日にフィリピンの責任海域に入る見込みだ。沿岸部には風浪への備えを呼びかけ、一部の航路や漁業作業は前倒しで停止する可能性がある。今後の経路と強度にはまだ不確実性があり、継続的な追跡が必要だ。"}, "why": {"zh": "秋末超强台风少见且变数大，若登陆菲律宾后再转向南海，将牵动东南亚航运与华南沿海防台部署。", "en": "A late-season super typhoon is rare and unpredictable; if it crosses the Philippines and turns toward the South China Sea, Southeast Asian shipping and South China coastal defenses will both be on alert.", "es": "Un súper tifón tan tardío es raro e impredecible; si cruza Filipinas y gira hacia el mar de la China Meridional, la navegación del Sudeste Asiático y las defensas costeras del sur de China quedarán en alerta.", "ja": "季節外れのスーパー台風は珍しく変数も大きい。フィリピン通過後に南シナ海へ転向すれば、東南アジアの海運と華南沿岸の防台体制が一斉に動く。"}}]}, {"key": "dom", "num": "02", "color": "#cf2f1e", "deep": "#a82516", "name": {"zh": "国内要闻", "en": "China", "es": "China", "ja": "国内"}, "items": [{"idx": "01", "tag": {}, "title": {"zh": "中国经济「三季报」今日揭晓，2026 金融街论坛年会开幕", "en": "China's Q3 economic report card lands today as the 2026 Financial Street Forum opens", "es": "El balance económico del tercer trimestre de China se publica hoy, con la apertura del Foro de la Calle Financiera 2026", "ja": "中国経済「第3四半期レポート」が本日公表、2026金融街フォーラムが開幕"}, "body": {"zh": "国家统计局今日上午 10 时发布三季度 GDP 与 9 月工业增加值、固定资产投资、社会消费品零售总额等数据，9 时 30 分先行公布 70 城住宅销售价格月报；下午 3 时国新办另场发布会介绍加快推进科技兴商有关情况。同日，2026 金融街论坛年会在北京开幕，会期 19 日至 22 日，中国人民银行行长潘功胜、金融监管总局局长丁向群、中国证监会主席吴清将作主题演讲，国家金融管理部门将集中发布系列金融改革发展政策。", "en": "The National Bureau of Statistics releases third-quarter GDP plus September industrial output, fixed-asset investment and retail sales at 10:00 today, with the 70-city home price report at 09:30; a 15:00 State Council Information Office briefing covers speeding up technology-driven commerce. The same day, the 2026 Financial Street Forum opens in Beijing, running October 19-22: PBoC Governor Pan Gongsheng, NFRA head Ding Xiangqun and CSRC Chairman Wu Qing will deliver keynote speeches, with a batch of financial reform and development policies due for release.", "es": "La Oficina Nacional de Estadísticas publica hoy a las 10:00 el PIB del tercer trimestre y los datos de septiembre de industria, inversión fija y ventas minoristas, con el informe de precios de vivienda de 70 ciudades a las 09:30; a las 15:00 una rueda de prensa de la Oficina de Información aborda el comercio impulsado por tecnología. El mismo día abre en Pekín el Foro de la Calle Financiera 2026, del 19 al 22: el gobernador del banco central Pan Gongsheng, el titular de la regulación financiera Ding Xiangqun y el presidente de la CSRC Wu Qing darán discursos, con una batería de políticas de reforma financiera por anunciar.", "ja": "国家統計局は本日10時、第3四半期GDPと9月の工業生産、固定資産投資、社会消費財小売総額などを発表し、9時30分には70都市住宅価格月報を先に公表する。午後3時には国務院新聞弁公室の発表会でテクノロジー主導の商業促進について説明がある。同日、2026金融街フォーラムが北京で開幕（19〜22日）。中国人民銀行の潘功勝行長、金融監督管理総局の丁向群局長、中国証監会の呉清主席が基調講演を行い、金融改革・発展政策が一挙に公表される見通しだ。"}, "why": {"zh": "三季度数据是判断全年目标成色与四季度政策空间的最重要依据，金融街论坛又是政策密集窗口，两个信号同日释放。", "en": "Q3 data is the single most important input for judging the full-year outlook and Q4 policy space, and the Financial Street Forum is a dense policy window — two signals land the same day.", "es": "Los datos del Q3 son la referencia clave para el objetivo anual y el margen de política del Q4, y el foro es una ventana densa de políticas: dos señales el mismo día.", "ja": "第3四半期データは年間目標の達成度と第4四半期の政策余地を測る最重要の手がかりで、金融街フォーラムは政策の集中放出窓口——2つのシグナルが同日に飛び出す。"}}, {"idx": "02", "tag": {}, "title": {"zh": "中国空间站首次太空培育两代水稻取得新突破", "en": "China's space station achieves a breakthrough growing two generations of rice in orbit", "es": "La estación espacial china logra un avance al cultivar dos generaciones de arroz en órbita", "ja": "中国宇宙ステーション、軌道上で2世代のイネ栽培に新たな突破"}, "body": {"zh": "神舟二十三号航天员乘组已在轨超过 4 个月，日前在中国空间站完成新一批水稻实验样品的采集与存储工作，并播种了部分收获的「太空种子」。我国首次太空培育两代水稻取得新突破，实验数据将为未来空间粮食生产与作物育种研究提供关键支撑。", "en": "The Shenzhou-23 crew, in orbit for over four months, has completed collection and storage of a new batch of rice experiment samples aboard China's space station and sowed part of the harvested 'space seeds'. The breakthrough — the first time two generations of rice have been grown in orbit by China — will underpin future in-space food production and crop breeding research.", "es": "La tripulación de la Shenzhou-23, en órbita desde hace más de cuatro meses, completó la recolección y el almacenamiento de un nuevo lote de muestras de arroz a bordo de la estación espacial china y sembró parte de las 'semillas espaciales' cosechadas. El avance —la primera vez que China cultiva dos generaciones de arroz en órbita— apuntalará la futura producción de alimentos en el espacio y la investigación en mejora de cultivos.", "ja": "神舟23号乗組員は軌道上滞在4カ月を超え、中国宇宙ステーション内で新一批のイネ実験サンプルの採取・保管を完了し、収穫した「宇宙種子」の一部を播種した。中国初となる軌道上での2世代イネ栽培が新たな突破を達成し、将来の宇宙食糧生産と品種改良研究の重要な支えとなる。"}, "why": {"zh": "两代水稻意味着太空作物完成了「从种子到种子」的闭环，这是人类长期驻留深空必须迈过的粮食门槛。", "en": "Two generations of rice means the space crop loop from seed to seed is closed — a food threshold any long-duration deep-space stay must clear.", "es": "Dos generaciones de arroz significan cerrar el ciclo de la cosecha espacial 'de semilla a semilla': un umbral alimentario imprescindible para la estancia prolongada en el espacio profundo.", "ja": "2世代のイネとは「種から種へ」の宇宙作物サイクルが閉じたことを意味し、長期深宇宙滞在が越えるべき食糧の関門だ。"}}, {"idx": "03", "tag": {}, "title": {"zh": "全国铁路车次编排系统性变革：新增 X 字头，可编排车次增长近 40%", "en": "China's train numbering system gets a systemic overhaul: new X prefix lifts capacity nearly 40%", "es": "Reforma sistémica en la numeración de trenes de China: nuevo prefijo X eleva la capacidad casi un 40%", "ja": "中国鉄道、列車番号体系を大改革：新たなX字頭を導入し、利用可能な番号が約40%増"}, "body": {"zh": "随着铁路路网持续扩容、新装备不断投用，沿用多年的全国铁路车次编排近日迎来系统性变革。根据新版《列车车次编排规定》，动车组旅客列车字头由 4 个增至 7 个，可编排车次数量增长近 40%；其中新增的 X 字头，主要用于未来最高运行时速 350 公里以上的复兴号动车组列车，为新一代高速列车上线预留编号空间。", "en": "As the rail network keeps expanding and new equipment enters service, China's long-standing national train numbering system has undergone a systemic overhaul. Under the new edition of the Train Numbering Rules, the number of EMU passenger prefixes rises from four to seven — nearly 40% more assignable train numbers — with the new X prefix reserved mainly for future Fuxing EMUs designed for top speeds above 350 km/h, reserving numbering space for a new generation of high-speed trains.", "es": "Con la expansión continua de la red ferroviaria y la entrada de nuevo material rodante, la numeración de trenes de China ha sufrido una reforma sistémica. Según la nueva edición de las Reglas de numeración, los prefijos de trenes de pasajeros EMU pasan de cuatro a siete —casi un 40% más de números disponibles— y el nuevo prefijo X se reserva principalmente para los futuros Fuxing de más de 350 km/h, guardando espacio para una nueva generación de alta velocidad.", "ja": "鉄道網の拡大と新型車両の投入が進むなか、長年使われてきた全国鉄道の列車番号体系が大改革を迎えた。新版の『列車番号編成規定』により、動車組旅客列車の字頭は4種から7種に増え、編成可能な番号数は約40%増加。新設のX字頭は、将来の最高営業速度350キロ超の復興号動車組を主な対象とし、次世代高速列車の登場に備えた番号空間を確保する。"}, "why": {"zh": "X 字头专为 350 公里以上时速预留，被视为新一轮高铁提速与新车投运的前置信号，铁路迷与出行族都值得盯紧。", "en": "The X prefix reserved for speeds above 350 km/h reads as a leading signal of the next round of HSR speed upgrades and new fleets — worth watching for rail fans and travelers alike.", "es": "El prefijo X reservado a más de 350 km/h se lee como una señal anticipada de la próxima ronda de subidas de velocidad y nuevas series: los ferroaficionados y los viajeros deben estar atentos.", "ja": "時速350キロ超のために確保されたX字頭は、次ラウンドの高速化と新型車両投入の先行シグナルとみられ、鉄道ファンも利用者も要注目だ。"}}, {"idx": "04", "tag": {}, "title": {"zh": "五部门联合提示：「央国企内推」「直签保录」招聘全是骗局", "en": "Five agencies warn: 'state-firm insider referral' and 'guaranteed direct hire' job offers are all scams", "es": "Cinco agencias advierten: las ofertas de 'recomendación interna' y 'contratación garantizada' en empresas estatales son fraudes", "ja": "5部門が合同注意喚起：「中央・国有企業の内部推薦」「直契約確定」採用はすべて詐欺"}, "body": {"zh": "人力资源社会保障部、中央网信办、教育部、公安部、国务院国资委日前联合发布风险提示：当前正值求职旺季，一些不法分子冒用央国企名义发布虚假招聘信息，打着「内部推荐」「直签保录」等幌子，甚至伪造录用材料，诱导求职者支付高额费用。五部门提醒广大求职者特别是高校毕业生增强防范意识，谨防上当。", "en": "China's human resources ministry, cyberspace administration, education ministry, public security ministry and the state-assets regulator jointly issued a risk warning: with job season in full swing, scammers are impersonating state-owned enterprises, posting fake recruitment ads under banners like 'insider referral' and 'guaranteed direct hire' and even forging offer letters to lure applicants into paying steep fees. The five agencies urged jobseekers — especially fresh graduates — to stay alert.", "es": "Los ministerios de recursos humanos, ciberespacio y educación, la policía y el regulador de empresas estatales de China emitieron una advertencia conjunta: en plena temporada de empleo, estafadores se hacen pasar por empresas estatales, publican anuncios falsos bajo lemas como 'recomendación interna' o 'contratación garantizada' e incluso falsifican cartas de oferta para cobrar comisiones altas. Las cinco agencias pidieron a los solicitantes, sobre todo a los recién graduados, mantenerse alerta.", "ja": "人力資源社会保障部、中央網信弁、教育部、公安部、国有資産監督管理委員会の5部門は合同でリスク警告を発表した。就職シーズン真っ只中、一部の不正者が中央・国有企業を装い、「内部推薦」「直契約確定」などを看板に偽の求人情報を出し、採用通知まで偽造して高額料金を支払わせている。5部門は求職者、とくに新卒に対して警戒を強めるよう呼びかけた。"}, "why": {"zh": "秋招正当时，付费内推骗局每年都有人中招；官方点名式提示等于给所有求职者划出最明确的安全线。", "en": "Autumn hiring is peaking and pay-for-referral scams claim victims every year; an explicit five-agency warning draws the clearest possible safety line for jobseekers.", "es": "La contratación de otoño está en su pico y las estafas de pago por recomendación cobran víctimas cada año; la advertencia explícita de cinco agencias traza la línea de seguridad más clara posible.", "ja": "秋採用のピークで、料金を払う内部推薦詐欺の被害は毎年後を絶たない。5部門による公式警告は、求職者にとって最も明確な安全ラインとなる。"}}, {"idx": "05", "tag": {}, "title": {"zh": "我国 60 岁以上人口超 3.23 亿，养老服务「一张网」初步建成", "en": "China's population aged 60+ tops 323 million as a nationwide elderly-care network takes shape", "es": "La población china de 60 años o más supera los 323 millones y toma forma una red nacional de cuidado de mayores", "ja": "中国の60歳以上人口が3.23億人超、養老サービス「一枚のネット」が初歩的に完成"}, "body": {"zh": "我国 60 岁以上老年人口已超 3.23 亿。今年以来，民政部会同有关部门推动县、乡、村三级养老服务体系建设，初步建成覆盖城乡的养老服务「一张网」；国家社保公共服务平台已开通 104 项全国性、跨地区服务，累计服务 113.53 亿人次，养老与社保服务的可及性持续提升。", "en": "China's population aged 60 and above has surpassed 323 million. This year the civil affairs ministry and partners pushed the building of county-township-village three-tier elderly-care systems, preliminarily forming an urban-rural 'one network' of elderly care; the national social security service platform now offers 104 nationwide, cross-region services, having served 11.35 billion visits, steadily improving access to pension and elderly-care services.", "es": "La población china de 60 años o más supera los 323 millones. Este año el ministerio de asuntos civiles y sus socios impulsaron sistemas de cuidado de mayores de tres niveles —condado, municipio y aldea—, formando de manera preliminar una 'única red' urbano-rural; la plataforma nacional de seguridad social ya ofrece 104 servicios nacionales e interregionales, con 11.350 millones de atenciones acumuladas, mejorando el acceso a pensiones y cuidados.", "ja": "中国の60歳以上の高齢者人口は3.23億人を超えた。今年に入り、民政部などは県・郷・村の三層養老サービス体系の構築を推進し、都市と農村を覆う「一枚のネット」が初歩的に完成。国家社保公共サービスプラットフォームは全国・地域横断の104サービスを開設し、累計113.53億人に提供済みで、年金・介護サービスのアクセス性が持続的に向上している。"}, "why": {"zh": "3.23 亿老人的养老需求是未来十年最大的确定性产业，「一张网」建设进度直接关系银发经济的落地速度。", "en": "The needs of 323 million seniors are the largest certainty-industry of the coming decade; how fast the 'one network' builds will set the pace for the silver economy.", "es": "Las necesidades de 323 millones de mayores son la mayor industria cierta de la próxima década; el ritmo de la 'única red' marcará la velocidad de la economía plateada.", "ja": "3.23億人の高齢者の需要は今後10年で最大の確実な産業であり、「一枚のネット」の構築速度がシルバー経済の実装速度を左右する。"}}]}, {"key": "fin", "num": "03", "color": "#b45309", "deep": "#8a3f07", "name": {"zh": "金融要闻", "en": "Finance", "es": "Finanzas", "ja": "金融"}, "items": [{"idx": "01", "tag": {"zh": "进展"}, "title": {"zh": "A 股科技龙头周末集体出手：海光、曙光、澜起等宣布回购，年内拟回购上限已达 3500 亿", "en": "A-share tech giants move in unison over the weekend: Haiguang, Sugon, Montage announce buybacks as 2025-year total proposed cap hits 350 billion yuan", "es": "Los gigantes tecnológicos del mercado A se movilizan el fin de semana: Haiguang, Sugon y Montage anuncian recompras, con un techo propuesto de 350.000 millones de yuanes", "ja": "A株テック大手が週末に一斉行動：海光・曙光・瀾起などが自社株買い表明、年内の上限総額は3500億元に"}, "body": {"zh": "10 月 18 日晚间，A 股回购大军继续扩容：海光信息拟回购 5 亿至 8 亿元，中科曙光 3 亿至 5 亿元，澜起科技 3 亿至 5 亿元，生益科技 2 亿至 3 亿元，格科微 1.5 亿至 3 亿元，均用于员工持股或股权激励。数据显示，年内已有约 1850 家公司推出回购计划、拟回购金额上限合计约 3500 亿元，已实施回购约 1340 亿元，逼近 2025 年全年水平。", "en": "Buyback announcements kept pouring in on Sunday evening: Haiguang Information plans 500-800 million yuan of buybacks, Sugon 300-500 million, Montage Technology 300-500 million, Shengyi Technology 200-300 million and GalaxyCore 150-300 million, all for employee shareholding or equity incentives. Data show about 1,850 companies have proposed buybacks this year with a combined upper limit near 350 billion yuan, and about 134 billion yuan already executed — approaching the full-year 2025 level.", "es": "Los anuncios de recompra siguieron llegando el domingo por la noche: Haiguang Information planea recomprar entre 500 y 800 millones de yuanes, Sugon 300-500, Montage Technology 300-500, Shengyi Technology 200-300 y GalaxyCore 150-300, todos para planes de acciones a empleados. Los datos muestran que unas 1.850 empresas han propuesto recompras este año con un límite conjunto cercano a 350.000 millones de yuanes, y ya se ejecutaron unos 134.000 millones, acercándose al total de todo 2025.", "ja": "18日夜もA株の自社株買いラッシュが続いた。海光信息は5億〜8億元、中科曙光は3億〜5億元、瀾起科技は3億〜5億元、生益科技は2億〜3億元、格科微は1.5億〜3億元の買い戻しを計画し、いずれも従業員持股・株式インセンティブに充てる。年内に自社株買い計画を発表した企業は約1850社・上限総額約3500億元、実行済みは約1340億元で、2025年通年に迫る水準だ。"}, "why": {"zh": "AI 退潮引发全球科技股剧震后，A 股半导体链用真金白银护盘，回购规模与公司级别都明显升级。", "en": "After the global AI selloff rattled tech shares, China's semiconductor chain is defending with real money — buyback scale and the caliber of companies involved both mark a clear escalation.", "es": "Tras la sacudida global de las tecnológicas, la cadena semiconductora china defiende con dinero real: la escala y el nivel de las empresas implicadas marcan una clara escalada.", "ja": "世界的なAI株急落の後、中国半導体チェーンが資金で防衛に動いた。買い戻し規模も対象企業の格も明らかに一段上のレベルだ。"}}, {"idx": "02", "tag": {}, "title": {"zh": "超 130 家 A 股公司三季报预喜，恒力石化净利翻倍", "en": "Over 130 A-share companies flag strong Q3 results, Hengli Petrochemical's profit doubles", "es": "Más de 130 cotizadas del mercado A anticipan buenos resultados del Q3; el beneficio de Hengli Petrochemical se duplica", "ja": "A株130社超が第3四半期業績の好転を予告、恒力石化は利益が倍増"}, "body": {"zh": "A 股三季报预告密集落地，截至目前已有超 130 家公司披露 2026 年前三季度业绩预喜公告。恒力石化预计前三季度净利润约 102.56 亿元、同比增长约 104%，公司称「油、煤、化」深度融合的大化工平台优势持续释放，炼化与 PTA 板块加工价差显著修复；业绩预告密集期与三季报正式披露窗口叠加，市场关注点转向基本面验证。", "en": "Q3 earnings preannouncements are landing in waves: over 130 companies have so far flagged better-than-expected results for the first three quarters. Hengli Petrochemical expects net profit of about 10.256 billion yuan, up roughly 104% year on year, citing its deeply integrated oil-coal-chemicals platform and a marked recovery in refining and PTA spreads; with the preannouncement wave overlapping the formal Q3 disclosure window, market attention is shifting to fundamentals verification.", "es": "Las previsiones del Q3 llegan en oleadas: más de 130 empresas han anticipado resultados superiores a lo esperado en los primeros tres trimestres. Hengli Petrochemical espera un beneficio neto de unos 10.256 millones de yuanes, un 104% más interanual, atribuyéndolo a su plataforma integrada de petróleo, carbón y química y a la marcada recuperación de los diferenciales de refino y PTA; con las previsiones solapando la ventana oficial del Q3, el mercado mira a la verificación de fundamentales.", "ja": "第3四半期の業績予告が続々と発表され、これまでに130社超が前年同期比で好転すると予告。恒力石化は第1〜3四半期の純利益が約102.56億元・前年比約104%増となる見通しで、「油・石炭・化」を深く融合させた大型プラットフォームの優位性と、製油やPTA（精製関連）のスプレッド回復を要因に挙げた。予告ラッシュと正式開示の期間が重なり、市場の関心はファンダメンタルズ検証へ移りつつある。"}, "why": {"zh": "在 AI 估值降温的当口，三季报是资金重找方向的路标——业绩能否接棒故事，本周见分晓。", "en": "With AI valuations cooling, the Q3 reports are the signpost for where money goes next — whether earnings can take over from narrative gets answered this week.", "es": "Con las valoraciones de IA enfriándose, los resultados del Q3 son la señal de hacia dónde va el dinero —si las ganancias relevan a la narrativa se sabrá esta semana—.", "ja": "AIバリュエーションが冷えるなか、第3四半期決算は資金の次の行き先を示す道標。「ストーリーから実力へ」の交代が本周明らかになる。"}}, {"idx": "03", "tag": {"zh": "进展"}, "title": {"zh": "美股 AI 抛售周五收官：纳指跌超 2%，CoreWeave 重挫 12%，资金转投欧股", "en": "US AI selloff closes out the week: Nasdaq drops over 2%, CoreWeave plunges 12%, money rotates into European stocks", "es": "La venta de IA en EE. UU. cierra la semana: el Nasdaq cae más del 2%, CoreWeave se hunde un 12% y el capital rota hacia Europa", "ja": "米国のAI売りで週を締めくくり：ナスダック2%超下落、CoreWeaveは12%急落、資金は欧州株へ"}, "body": {"zh": "上周五美股三大指数集体收跌，纳指跌超 2%，AI 概念与算力板块领跌，CoreWeave 重挫近 12%，纳斯达克与标普 500 均录得 6 月以来最差单周表现。与美股形成对照的是，欧洲股市表现领先，成为投资者撤出 AI 交易后的主要承接方向；高利率与 AI 资本开支回报的双重担忧仍是悬在市场头上的两把剑。", "en": "All three major US indices closed lower on Friday, with the Nasdaq down over 2% led by AI and compute names as CoreWeave plunged nearly 12%; both the Nasdaq and S&P 500 logged their worst week since June. In contrast, European equities outperformed, becoming the main destination for money exiting the AI trade; twin worries over high rates and returns on AI capex still hang over the market.", "es": "Los tres índices estadounidenses cerraron a la baja el viernes, con el Nasdaq cayendo más del 2% arrastrado por la IA y la computación, mientras CoreWeave se hundía casi un 12%; Nasdaq y S&P 500 registraron su peor semana desde junio. En contraste, las bolsas europeas sobresalieron y se volvieron el destino principal del capital que sale de la operación de IA; la doble preocupación por tasas altas y el retorno del capex en IA sigue pendiendo sobre el mercado.", "ja": "先週金曜の米株は3指数そろって下落。ナスダックは2%超安でAI・演算関連が主導し、CoreWeaveは約12%急落、ナスダックとS&P500は6月以来最悪の週となった。対照的に欧州市場が堅調で、AI取引から撤退する資金の受け皿になっている。高金利とAI資本支出の回収不安という二つの懸念が依然として市場に重くのしかかる。"}, "why": {"zh": "AI 交易的资金迁移已经开始，欧股吸金与美债收益率走势将决定这轮回调是健康消化还是趋势逆转。", "en": "The AI-trade rotation has begun: European equities' inflows and Treasury yields will decide whether this pullback is healthy digestion or a trend reversal.", "es": "La rotación de la operación de IA ya empezó: las entradas a Europa y los rendimientos del Tesoro decidirán si esta corrección es una digestión sana o un cambio de tendencia.", "ja": "AI取引からの資金シフトはすでに始まっている。欧州株への流入と米債利回りの動きが、この調整が健全な消化かトレンド転換かを決める。"}}, {"idx": "04", "tag": {}, "title": {"zh": "本周全球市场大事预告：港股今日休市，明日 LPR，Meta、特斯拉等财报扎堆", "en": "Big week ahead: Hong Kong closed today, LPR Tuesday, Meta and Tesla earnings stacked up", "es": "Semana clave: Hong Kong cierra hoy, LPR el martes, y se acumulan resultados de Meta y Tesla", "ja": "今週の市場カレンダー：香港市場は本日休場、明日はLPR、Metaとテスラの決算が集中"}, "body": {"zh": "本周日历密集：港股今日因重阳翌日休市一天；中国 10 月 LPR 明日公布；国务院总理李强 20 日至 22 日赴俄罗斯举行中俄总理第三十一次定期会晤；财报方面 Meta、特斯拉、中国移动、宁德时代、寒武纪等将披露最新业绩；英伟达 GTC 大会将在柏林举行，黄仁勋发表主题演讲；韩国、俄罗斯等多家央行本周公布利率决议。", "en": "A packed calendar: Hong Kong markets close today for the day after Chongyang; China's October LPR lands Tuesday; Premier Li Qiang visits Russia October 20-22 for the 31st regular China-Russia prime ministers' meeting; Meta, Tesla, China Mobile, CATL and Cambricon head the earnings slate; NVIDIA's GTC conference kicks off in Berlin with a Jensen Huang keynote; and several central banks including South Korea's and Russia's decide rates this week.", "es": "Agenda cargada: Hong Kong cierra hoy por el día posterior al Chongyang; el LPR de octubre de China se publica el martes; el primer ministro Li Qiang visita Rusia del 20 al 22 para la 31.ª reunión periódica de primeros ministros; Meta, Tesla, China Mobile, CATL y Cambricon encabezan la agenda de resultados; la conferencia GTC de NVIDIA arranca en Berlín con ponencia de Jensen Huang; y varios bancos centrales, entre ellos los de Corea del Sur y Rusia, deciden tasas esta semana.", "ja": "今週はカレンダーがぎっしり。香港市場は重陽の翌日で本日休場。中国の10月LPRは明日発表。李強首相は20〜22日にロシアを訪問し、露中首相定期会談第31回を開催。決算はMeta、テスラ、中国移動、CATL、寒武紀などが集中し、NVIDIAのGTCカンファレンスはベルリンで開幕してジェンスン・ファンが基調講演を行う。韓国・ロシアなど複数の中央銀行が今週金融政策を決定する。"}, "why": {"zh": "中国数据、AI 财报、央行决议三线同押一周，全球资产定价的「大考周」，仓位与节奏都到了必须做选择的时候。", "en": "Chinese data, AI earnings and central-bank decisions all land in one week — a stress-test week for global asset pricing, when positioning choices can no longer be deferred.", "es": "Datos chinos, resultados de IA y decisiones de bancos centrales caen en la misma semana: una semana de examen para la valoración global, cuando las posiciones ya no admiten aplazamiento.", "ja": "中国データ、AI決算、中央銀行の決定が一週間に集中。世界の資産価格にとっての「試験週間」であり、ポジション判断の先送りはもはや不可能だ。"}}, {"idx": "05", "tag": {"zh": "进展"}, "title": {"zh": "布油触及 110 美元创五个月新高，特朗普动用战略储备压价", "en": "Brent touches $110, a five-month high, as Trump taps strategic reserves to press prices down", "es": "Brent toca los 110 dólares, máximo de cinco meses, mientras Trump usa reservas estratégicas para presionar los precios", "ja": "ブレント原油が110ドルに達し5カ月ぶり高値、トランプ氏は戦略備蓄放出で油価押さえ込む構え"}, "body": {"zh": "霍尔木兹海峡遇袭频发继续支撑油价，布伦特原油上周五盘中触及每桶 110 美元、创五个月新高；WTI 同步走强。为对冲油价上涨与通胀压力，特朗普宣布动用战略石油储备平抑价格，但市场普遍怀疑储备释放的持续性与俄柴油进口的实际替代能力，油价短期或维持高位宽幅震荡。", "en": "Frequent attacks around the Strait of Hormuz keep underpinning oil: Brent touched $110 a barrel intraday on Friday, a five-month high, with WTI firming in step. To offset price and inflation pressure, Trump announced the use of strategic petroleum reserves to tame prices, but markets doubt the sustainability of reserve releases and how much Russian diesel imports can actually substitute — oil may hold a wide high-level range for now.", "es": "Los ataques frecuentes en torno al estrecho de Ormuz siguen sosteniendo el crudo: Brent tocó los 110 dólares por barril intradía el viernes, máximo de cinco meses, con el WTI firme. Para contrarrestar el alza y la inflación, Trump anunció el uso de reservas estratégicas de petróleo, pero el mercado duda de su sostenibilidad y de cuánto puede sustituir realmente el diésel ruso; el petróleo podría mantenerse en un rango alto y amplio por ahora.", "ja": "ホルムズ海峡周辺の攻撃頻発が原油を支え続け、ブレントは先週金曜に一時1バレル110ドルに達し5カ月ぶりの高値を付け、WTIも並行して強含み。油価とインフレ圧力を和らげるためトランプ氏は戦略石油備蓄の放出を表明したが、市場は放出の持続性とロシア産ディーゼル輸入の代替効果を疑っており、当面は高値圏での大幅なもみ合いが続きそうだ。"}, "why": {"zh": "油价连着通胀、加息预期与航运成本三件事，110 美元的布油每多待一天，全球央行的政策容错就少一分。", "en": "Oil ties together inflation, rate expectations and shipping costs: every day Brent holds $110 shrinks the policy margin of error for the world's central banks.", "es": "El crudo conecta inflación, expectativas de tasas y costos logísticos: cada día que Brent aguanta 110 dólares reduce el margen de error de los bancos centrales.", "ja": "油価はインフレ、利上げ観測、海運コストの三つに直結する。ブレントが110ドルに留まる一日ごとに、世界の中央銀行の政策許容誤差は狭まっていく。"}}]}, {"key": "spo", "num": "04", "color": "#15803d", "deep": "#116431", "name": {"zh": "体育竞技", "en": "Sports", "es": "Deportes", "ja": "スポーツ"}, "items": [{"idx": "01", "tag": {"zh": "进展"}, "title": {"zh": "中超第 28 轮收官全景：泰山 5:0 大胜，津门虎四连胜保级成功", "en": "CSL round 28 in full: Shandong rout Zhejiang 5-0 as Jinmen Tiger seals survival with a fourth straight win", "es": "Jornada 28 completa de la Superliga: el Shandong golea 5-0 y el Jinmen Tiger asegura la permanencia con cuarta victoria seguida", "ja": "スーパーリーグ第28節総括：山東が5対0大勝、津門虎は4連勝で残留決定"}, "body": {"zh": "中超第 28 轮全面收官：山东泰山 5:0 大胜九人应战的浙江队，卡扎伊什维利梅开二度、克雷桑读秒破门，积 41 分升至第四；天津津门虎凭谢蒂内世界波 1:0 力克河南，豪取四连胜宣告保级成功；辽宁铁人 4:0 横扫提前降级的青岛海牛同步上岸。武汉三镇 1:3 不敌申花五轮不胜，最后一个降级名额将在河南队与武汉三镇之间产生；北京国安则凭张玉宁头球 1:0 过关，稳居第三。", "en": "CSL round 28 wrapped up across the board: Shandong Taishan thrashed a nine-man Zhejiang 5-0, with Kazishvili scoring twice and Cryzan winning it at the death, moving to fourth on 41 points; Tianjin Jinmen Tiger beat Henan 1-0 via a stunning long-range strike, a fourth straight win that seals survival; Liaoning Tieren swept already-relegated Qingdao Hainiu 4-0 to stay up too. Wuhan Three Towns fell 1-3 to Shanghai Shenhua, winless in five, leaving the last relegation spot to be decided between Henan and Wuhan; Beijing Guoan edged past 1-0 on a Zhang Yuning header, holding third.", "es": "La jornada 28 cerró en todos los frentes: el Shandong Taishan aplastó 5-0 a un Zhejiang con nueve hombres, con doblete de Kazishvili y gol de Cryzan en el descuento, y subió cuarto con 41 puntos; el Tianjin Jinmen Tiger venció 1-0 a Henan con un golazo de media distancia, cuarta victoria seguida que sella la permanencia; el Liaoning Tiren barrió 4-0 a un Qingdao Hainiu ya descendido y también se salvó. El Wuhan Three Towns cayó 1-3 ante el Shenhua y suma cinco sin ganar, dejando la última plaza de descenso entre Henan y Wuhan; el Beijing Guoan pasó 1-0 con cabezazo de Zhang Yuning y afianza el tercer puesto.", "ja": "スーパーリーグ第28節が全面終了。山東泰山は10人（2人退場）の浙江に5対0の大勝——カザイシヴィリが2ゴール、クレサンがロスタイムにダメ押しし、勝点41で4位に浮上。天津津門虎はシェスティネのスーパーゴールで河南に1対0勝利し4連勝、残留を決めた。遼寧鉄人は既に降格が決まっていた青島海牛に4対0圧勝し、こちらも残留。武漢三鎮は上海申花に1対3で敗れ5試合勝ちなし、最後の降格枠は河南と武漢の争いに。北京国安は張玉寧のヘディングで1対0勝利し3位をキープした。"}, "why": {"zh": "冠军悬念之外，保级线同样撕到最后一刻：一个降级名额两支球队抢，四连胜上岸的津门虎则把「关键先生」剧本演满。", "en": "Beyond the title drama, the survival line is torn to the final act: one relegation spot, two teams, while fourth-win-streaking Jinmen Tiger wrote the 'clutch' script to the end.", "es": "Más allá del drama por el título, la línea de permanencia se decide al límite: una plaza, dos equipos, mientras el Jinmen Tiger, con cuatro triunfos seguidos, escribió el guion de los héroes de última hora.", "ja": "優勝争いだけでなく残留ラインも最後の最後まで攻防。降格枠1を2チームが奪い合い、4連勝で安全圏に達した津門虎は「勝負どころで決める」脚本を演じ切った。"}}, {"idx": "02", "tag": {"zh": "进展"}, "title": {"zh": "武网新后加冕：赫瓦林斯卡逆转卡塔尔，首夺 WTA1000 冠军", "en": "New queen of Wuhan: Hwalingjska rallies past Kartal for a first WTA 1000 crown", "es": "Nueva reina de Wuhan: Hwalingjska remonta ante Kartal y conquista su primer título WTA 1000", "ja": "武漢に新女王誕生：フヴァリンスカがカタールを逆転で破り初のWTA1000優勝"}, "body": {"zh": "武汉网球公开赛女单决赛，16 号种子、今年法网亚军赫瓦林斯卡在先丢一盘、次盘一度 0:2 落后的情况下以 2:6、6:4、6:2 逆转英国黑马卡塔尔，夺得个人首个巡回赛暨 WTA1000 级冠军，世界排名将升至生涯新高的第 11 位；世界排名第 170 位、复出仅第二站的卡塔尔虽败犹荣。同期，郑钦文因伤退出了 WTA250 香港站，将专注恢复备战后续赛事。", "en": "In the Wuhan Open women's final, 16th seed and this year's Roland Garros runner-up Hwalingjska overcame a set and an 0-2 second-set deficit to beat British dark horse Kartal 2-6, 6-4, 6-2, taking her first tour title at the WTA 1000 level and rising to a career-high No. 11; world No. 170 Kartal, in only her second event back from injury, exits with honor. Meanwhile, Zheng Qinwen withdrew injured from the WTA 250 Hong Kong Open to focus on recovery.", "es": "En la final del Abierto de Wuhan, la 16.ª cabeza de serie y finalista de Roland Garros Hwalingjska remontó un set abajo y un 0-2 en el segundo para vencer 2-6, 6-4, 6-2 a la sorpresa británica Kartal, llevándose su primer título del tour a nivel WTA 1000 y subiendo al puesto 11, el mejor de su carrera; la número 170 mundial Kartal, en apenas su segundo torneo tras la lesión, se va con honor. Mientras, Zheng Qinwen se retiró lesionada del WTA 250 de Hong Kong para concentrarse en su recuperación.", "ja": "武漢オープン女子シングルス決勝。第16シードで今季全仏準優勝のフヴァリンスカが、第1セットと第2セット序盤0対2とリードを許した状況から2対6、6対4、6対2で逆転。英国のダークホース・カタールを破り、ツアー初且つWTA1000級初タイトルを獲得し、世界ランキングはキャリア最高の11位へ浮上する。世界170位・復帰2戦目のカタールは敗れはしたが堂々の内容だった。一方、鄭欽文は怪我のためWTA250香港オープンを欠場し、回復と次戦準備に専念する。"}, "why": {"zh": "从「磨教」打法到发球上网式小球组合，赫瓦林斯卡用一场逆转证明：1000 冠军不是巨头的专利，打法聪明比身高力量更值钱。", "en": "From grinding rallies to drop-shot-lobs, Hwalingjska's comeback proves a WTA 1000 crown is no giant's monopoly — a smart game beats height and power.", "es": "De las pelotas largas a las combinaciones de dejada y globo, la remontada de Hwalingjska demuestra que un título WTA 1000 no es monopolio de gigantes: la inteligencia vale más que la altura y la fuerza.", "ja": "粘りのラリーからドロップとロブのコンビネーションまで、フヴァリンスカの逆転劇は証明した。WTA1000のタイトルは巨人専売特許ではない——賢いテニスは身長やパワー以上の価値を持つ。"}}, {"idx": "03", "tag": {"zh": "进展"}, "title": {"zh": "上海大师赛新王登基：弗基纳 0:1 落后大逆转霍达尔，中国赛季 10 连胜", "en": "New Shanghai Masters king: Fucsovich overturns a set down against Jodar, riding a 10-match China winning streak", "es": "Nuevo rey del Masters de Shanghái: Fucsovich remonta ante Jodar con una racha de 10 triunfos en China", "ja": "上海マスターズに新王者：フッチョビッチがホダールを逆転破り、中国シリーズ10連勝"}, "body": {"zh": "上海大师赛男单决赛上演西班牙德比：27 岁的弗基纳在首盘 1:6 溃败、次盘又先被破发的绝境下，以 1:6、7:6(5)、6:4 逆转 20 岁的霍达尔，首夺 ATP1000 大师赛冠军，斩获奖金 115 万美元、即时排名升至第 14 位。加上成都 250 赛夺冠，弗基纳今年中国赛季豪取 10 连胜；首进决赛的霍达尔虽获亚军，即时排名仍升至第 11 位。", "en": "The Shanghai Masters men's final staged an all-Spanish duel: 27-year-old Fucsovich, reeling from a 1-6 first set and an early break down in the second, rallied past 20-year-old Jodar 1-6, 7-6(5), 6-4 to lift his first ATP 1000 Masters crown, pocketing $1.15 million and rising to No. 14. Combined with his Chengdu 250 title, Fucsovich is riding a 10-match winning streak in China this season; finalist Jodar still rises to No. 11.", "es": "La final del Masters de Shanghái fue un duelo español: el 27 años Fucsovich, tras un primer set desastroso 1-6 y un break en contra en el segundo, remontó ante el 20 años Jodar por 1-6, 7-6(5), 6-4 y conquistó su primer título ATP 1000, con 1,15 millones de dólares y el puesto 14. Sumado al título de Chengdu 250, Fucsovich acumula 10 victorias seguidas en China esta temporada; el finalista Jodar asciende igualmente al 11.", "ja": "上海マスターズ男子決勝はオールスペイン対決となった。27歳のフッチョビッチは第1セットを1対6で失い、第2セットも序盤にブレイクされる絶境から、1対6、7対6（5）、6対4で20歳のホダールを逆転。ATP1000マスターズ初優勝を果たし、賞金115万ドル、即時ランキングは14位に浮上した。成都250の優勝と合わせ、今季中国シリーズは10連勝。初決勝のホダールも準優勝で即時ランキング11位に上がっている。"}, "why": {"zh": "中国赛季 10 连胜、两个冠军全部在中国拿下——弗基纳把「中国福地」四个字写成了 ATP 新剧本，明年中网武网票房有脸了。", "en": "Ten straight wins and both titles on Chinese soil: Fucsovich has turned 'China lucky ground' into the ATP's new script — and given next year's Beijing and Wuhan events a marketing dream.", "es": "Diez victorias seguidas y ambos títulos en suelo chino: Fucsovich convirtió 'China tierra amiga' en el nuevo guion de la ATP y le dio a Pekín y Wuhan un sueño de marketing para el año que viene.", "ja": "10連勝、優勝2冠はすべて中国の大地で——フッチョビッチは「中国は相性抜群」をATPの新ストーリーに変え、来年の北京と武漢の大会に最高の宣伝文句を届けた。"}}, {"idx": "04", "tag": {}, "title": {"zh": "第五届亚残运会在名古屋开幕，中国代表团今日冲击首金", "en": "Nag Asian Para Games open in Nagoya as China's delegation chases its first gold today", "es": "Los Juegos Parasiáticos de Nagoya abren con la delegación china tras su primer oro hoy", "ja": "第5回アジアパラ競技会が名古屋で開幕、中国代表団は本日初金メダルを狙う"}, "body": {"zh": "18 日晚，第五届亚洲残疾人运动会在日本爱知县名古屋开幕，45 个国家和地区的近 3000 名运动员参赛。中国体育代表团 500 人中运动员 312 人，为我国参加境外亚残运会规模最大的一届，由跆拳道运动员李羽洁与举重运动员闫盼盼担任旗手，将参加 17 个大项 335 个小项的角逐，19 日向首金发起冲击；开幕式前盲人足球队已两连胜（胜日本、泰国），轮椅篮球女队同样两战全胜。", "en": "The fifth Asian Para Games opened in Nagoya, Japan, on Sunday evening, with nearly 3,000 athletes from 45 countries and regions. China's 500-strong delegation includes 312 athletes — its largest-ever away Paralympic-type contingent — flag-carried by taekwondo athlete Li Yujie and powerlifter Yan Panpan, contesting 335 events across 17 sports and chasing a first gold on Monday; before the ceremony the blind football team had already won twice (over Japan and Thailand) and the women's wheelchair basketball team had gone 2-0.", "es": "Los quintos Juegos Parasiáticos de Asia se inauguraron el domingo por la noche en Nagoya, Japón, con casi 3.000 atletas de 45 países y regiones. La delegación china, de 500 integrantes, incluye 312 atletas —la mayor de su historia fuera de casa— con la taekwondista Li Yujie y el levantador Yan Panpan como abanderados, disputará 335 pruebas de 17 deportes y va hoy tras el primer oro; antes de la ceremonia el equipo de fútbol para ciegos ya ganó dos veces (a Japón y Tailandia) y el baloncesto femenino en silla de ruedas suma 2-0.", "ja": "18日夜、第5回アジアパラ競技会が日本の愛知県名古屋で開幕し、45の国と地域から約3000人の選手が参加した。中国代表団は500人中312人が選手で、海外開催のパラ競技会としては史上最大規模。テコンドーの李羽潔とパワーリフティングの閻盼盼が旗手を務め、17競技335種目に出場し、本日初の金メダルを目指す。開会式前にはブラインドサッカーが2連勝（日本・タイランド戦）、車いすバスケットボール女子も2戦全勝としている。"}, "why": {"zh": "312 名业余出身的残疾人运动员出征境外最大规模一届，竞技之外，这是中国残疾人体育体系一次完整的对外检阅。", "en": "312 amateur-background para athletes on the biggest-ever away delegation: beyond medals, it is a full-spectrum showcase of China's para-sport system abroad.", "es": "312 atletas paralímpicos de origen amateur en la delegación fuera de casa más grande: más allá de las medallas, es una vitrina integral del deporte adaptativo chino en el exterior.", "ja": "アマチュア出身のパラアスリート312人が史上最大の海外代表団として出場する。メダルだけでなく、中国の障害者スポーツ体系の総点検となる大会だ。"}}, {"idx": "05", "tag": {}, "title": {"zh": "北马惊现闪电成绩：奥运冠军托拉 2 小时 03 分破赛会纪录夺冠", "en": "Beijing Marathon lightning: Olympic champion Tola breaks the course record at 2:03:10", "es": "Rayo en el maratón de Pekín: el campeón olímpico Tola rompe el récord del recorrido con 2:03:10", "ja": "北京マラソンで電光石火の記録：五輪王者トラが2時間03分10秒でコースレコード更新"}, "body": {"zh": "2026 北京马拉松 18 日开跑，埃塞俄比亚名将、2024 年巴黎奥运会男子马拉松冠军塔米拉特·托拉以 2 小时 03 分 10 秒率先冲线，大幅刷新北马赛会纪录并夺冠。金秋北京低温干燥的赛道条件与高水平兔阵成就了这场速度表演，也再次印证北马正在向世界大满贯级别赛事靠拢。", "en": "The 2026 Beijing Marathon set off on Sunday, with Ethiopian star and Paris 2024 marathon champion Tamirat Tola crossing first in 2:03:10, smashing the course record for the title. Beijing's cool, dry autumn course and a high-caliber pacing crew powered the speed show — further evidence the Beijing Marathon is closing in on world-major status.", "es": "El maratón de Pekín 2026 arrancó el domingo y la estrella etíope y campeón olímpico de París 2024, Tamirat Tola, cruzó primero en 2:03:10, pulverizando el récord del recorrido. Las condiciones frías y secas del otoño pekinés y una liebre de alto nivel hicieron posible el espectáculo —nueva prueba de que el maratón de Pekín se acerca al nivel de los World Marathon Majors—.", "ja": "2026北京マラソンが18日にスタート。エチオピアの英雄で2024年パリ五輪男子マラソン金メダリストのタミラト・トラが2時間03分10秒で先着し、大会記録を大きく更新して優勝した。北京の乾燥した涼しい秋のコンディションと高レベルのペースメーカー陣がスピードショーを後押しし、北京マラソンが世界メジャー級に迫っていることを再確認させた。"}, "why": {"zh": "2 小时 03 分在北马赛道上出现，意味着国内赛事的补给、风速与组织水平已能支撑世界级成绩，跑圈沸腾不是没有道理。", "en": "A 2:03 on Beijing's streets means domestic course support, wind conditions and organization can now carry world-class times — the running community's excitement is fully justified.", "es": "Un 2:03 en las calles de Pekín implica que el avituallamiento, el viento y la organización locales ya sostienen marcas mundiales —la euforia del mundo del running está justificada—.", "ja": "北京の街なかで2時間03分が出たということは、国内大会の給水、風況、運営がすでに世界記録級を支えられるということだ。ランニング界の熱狂は十分に根拠がある。"}}]}, {"key": "hot", "num": "05", "color": "#6d28d9", "deep": "#55208f", "name": {"zh": "网络热点", "en": "Trending", "es": "Tendencias", "ja": "話題"}, "items": [{"idx": "01", "tag": {"zh": "进展"}, "title": {"zh": "新一股较强冷空气今起影响中东部：局地降温 12℃，多地创下半年新低", "en": "A fresh cold wave hits central and eastern China from today: local drops of 12°C, many cities see half-year lows", "es": "Una nueva ola de frío golpea el centro-este de China desde hoy: caídas locales de 12 °C y mínimos de medio año en muchas ciudades", "ja": "新たな強い寒波が本日から中東部を直撃：局所的に12℃低下、多地で下半期最低気温"}, "body": {"zh": "中央气象台预计，19 日至 21 日新一股较强冷空气将影响我国，中东部大部降温 4 至 8℃，西北地区东部、华北和东北南部部分地区降幅可达 10 至 12℃，并伴有 4 至 5 级偏北风、阵风 6 至 8 级。21 至 22 日最低气温 0℃ 线将推进至辽宁南部、河北北部、山西南部一线，呼和浩特、西宁将降至零下 5℃ 左右；此前上周六全国已有 78 个国家级气象站打破 10 月单日降水纪录。", "en": "Per the Central Meteorological Observatory, a fresh strong cold wave sweeps central and eastern China through Wednesday: temperatures fall 4-8°C across most of the region, with drops of 10-12°C in parts of the northwest, north and southern northeast, plus northerly gusts of force 6-8. By Tuesday-Wednesday the 0°C line pushes down to southern Liaoning and northern Hebei; Hohhot and Xining will dip near minus 5°C. Last Saturday 78 national stations had already broken their October single-day rainfall records.", "es": "Según el Observatorio Meteorológico Central, una nueva ola de frío recorre el centro y este de China hasta el miércoles: bajadas de 4-8 °C en la mayoría del territorio, de 10-12 °C en partes del noroeste, norte y sur del noreste, con vientos del norte de fuerza 6-8. Entre martes y miércoles la línea de 0 °C avanzará hasta el sur de Liaoning y el norte de Hebei; Hohhot y Xining rondarán los -5 °C. El sábado pasado 78 estaciones nacionales ya batieron sus récords de precipitación de un solo día en octubre.", "ja": "中央気象台の予報によると、19日から21日にかけて新たな強い寒波が中国の中部・東部を襲い、大部分で4〜8℃低下。西北東部、華北、東北南部の一部では10〜12℃に達し、北風は4〜5、突風は6〜8の強さに。21〜22日には氷点下のラインが遼寧南部・河北北部・山西南部まで南下し、フフホトや西寧はマイナス5℃前後まで下がる見込み。先週の土曜には全国78の国家気象観測所が10月の一日降水量記録を塗り替えたばかりだ。"}, "why": {"zh": "「一夜入冬」式降温叠加历史级秋雨，取暖保供、秋收晾晒与呼吸道疾病防护三线齐紧，早一天备衣少一天挨冻。", "en": "An overnight-winter-style plunge stacked on record autumn rain squeezes heating supply, harvest drying and flu season at once — one day earlier with the coat is one day warmer.", "es": "Un desplome de 'invierno de golpe' sobre lluvias otoñales récord aprieta a la vez calefacción, cosecha y temporada gripal —un día antes con el abrigo, un día menos de frío—.", "ja": "「一晩で冬」級の急減温に記録的な秋雨が重なり、暖房供給、収穫の乾燥、風邪対策の三つが同時に逼迫する。コートの準備は一日早いに越したことはない。"}}, {"idx": "02", "tag": {}, "title": {"zh": "12306 上线「敬」字车次：60 岁以上老人购敬老票享 9 折", "en": "12306 rolls out 'Respect' trains: riders 60 and over get 10% off senior fares", "es": "12306 estrena trenes 'Respeto': los mayores de 60 años obtienen un 10% de descuento", "ja": "12306に「敬」マーク列車が登場：60歳以上は敬老運賃で1割引き"}, "body": {"zh": "重阳节当天，不少旅客发现铁路 12306 客户端出现标注「敬」字的车次。国铁集团明确：年满 60 周岁及以上老年人购买 10 月 18 日至 12 月 30 日之间、标注「敬」字车次的火车票，可在既有执行票价基础上享受 9 折优惠（折上折）。首批敬老车次覆盖多条热门线路，老年旅客可在线上购票时自动识别适用。", "en": "On Double Ninth Festival, travelers noticed trains marked with a 'Respect' (敬) badge in the 12306 app. China State Railway confirmed: passengers aged 60 and above buying tickets for '敬' trains dated October 18 to December 30 get 10% off the existing fare (a discount on top of discounts). The first batch covers several popular routes, with eligibility auto-recognized at online booking.", "es": "En el Festival Chung Yeung, los viajeros notaron trenes con la insignia 'Respeto' (敬) en la app 12306. Ferrocarriles del Estado confirmó: pasajeros de 60 años o más que compren billetes para trenes '敬' entre el 18 de octubre y el 30 de diciembre obtienen un 10% de descuento sobre la tarifa vigente (descuento sobre descuento). El primer lote cubre varias rutas populares, con la elegibilidad reconocida automáticamente al reservar en línea.", "ja": "重陽節のこの日、12306アプリで「敬」マーク付きの列車が見つかると話題に。中国国家鉄路集団は、60歳以上の高齢者が10月18日から12月30日までの「敬」マーク列車の切符を購入する場合、既存運賃からさらに1割引（割引の上乗せ）になると明確化した。第1弾は複数の人気路線をカバーし、オンライン予約時に自動適用される。"}, "why": {"zh": "老年旅客规模随 3.23 亿老龄人口同步膨胀，「敬」字车次是铁路首次系统性的银发定价试点，后续覆盖面值得盯。", "en": "With 323 million seniors, elderly travel demand keeps swelling: the 'Respect' badge is the railway's first systemic silver-hair pricing pilot — watch how far coverage extends.", "es": "Con 323 millones de mayores, la demanda senior crece sin parar: la insignia 'Respeto' es el primer piloto sistemático de tarifas plateadas del ferrocarril —conviene seguir su cobertura—.", "ja": "3.23億人の高齢者を抱え、シニア利用は拡大の一途。「敬」マーク列車は鉄道初の体系的シニア料金実証実験であり、今後の適用範囲を注視したい。"}}, {"idx": "03", "tag": {}, "title": {"zh": "红果短剧「降智」争议刷屏，微短剧质量议题再度引爆", "en": "Hongguo short-drama 'dumbed-down' backlash goes viral, reigniting the quality debate", "es": "La polémica por el 'rebajamiento' de Hongguo en microdramas se viraliza y reaviva el debate de calidad", "ja": "紅果ミニドラマの「退化」騒動が拡散、マイクロドラマの質論争が再燃"}, "body": {"zh": "近日，头部短剧平台红果短剧被大量用户吐槽内容「降智」——剧情悬浮、逻辑粗糙、为反转而反转，相关话题迅速冲上热议榜，也把微短剧行业「重流量、轻质量」的老问题再次推到台前。平台与创作者如何在工业化产能与内容口碑之间找平衡，成为短剧从爆发期走向成熟期的必答题。", "en": "Leading short-drama platform Hongguo is being flooded with user complaints that its content has been 'dumbed down' — floating plots, coarse logic and twist-for-twist's-sake writing sent the topic trending and pushed the industry's old 'traffic over quality' problem back onto the table. How platforms and creators balance industrial-scale output with reputation is the required course as short drama matures.", "es": "La plataforma líder de microdramas Hongguo recibe quejas masivas de que su contenido se ha 'rebajado' —tramas flotantes, lógica burda y giros por los giros—; el tema se viralizó y devolvió a la mesa el viejo problema del sector: tráfico por encima de calidad. Cómo equilibran plataformas y creadores producción industrial y reputación es la asignatura pendiente de la madurez del formato.", "ja": "大手ミニドラマプラットフォーム「紅果」に「内容が馬鹿にされている」という苦情が殺到——浮ついた筋書き、雑な論理、ねつ造のねじれのためのねじれ。話題は一気に拡散し、業界の「流量重視・軽質」という古い問題が再び表に出た。プラットフォームと制作者が工業的生産力と評判のバランスをどう取るかが、成熟期への必答問題となっている。"}, "why": {"zh": "短剧市场规模已数百亿，用户第一次集体用脚投票向「降智」内容说不，平台内容标准怎么调直接影响下一阶段格局。", "en": "Short drama is a tens-of-billions market, and users are voting with their feet against dumbed-down content for the first time en masse — how platforms reset content standards will shape the next phase.", "es": "El mercado de microdramas vale decenas de miles de millones y por primera vez los usuarios votan con los pies contra el contenido rebajado: cómo ajusten las plataformas sus estándares definirá la próxima etapa.", "ja": "ミニドラマ市場は数百億規模に達し、ユーザーが初めて集団で「退化コンテンツ」への拒否票を投じた。プラットフォームの基準をどう引き直すかが次の局面を決める。"}}, {"idx": "04", "tag": {}, "title": {"zh": "儿童近视防控镜片曝冒牌贴牌，厦门、镇江两地立案查处", "en": "Fake and rebranded children's myopia-control lenses exposed; probes open in Xiamen and Zhenjiang", "es": "Expuestos lentes falsificados y relabelados de control de miopía infantil; abren pesquisas en Xiamen y Zhenjiang", "ja": "児童用近視抑制レンズの偽ブランド・貼り替えが発覚、廈門と鎮江が立件"}, "body": {"zh": "央视 18 日报道多家眼镜公司存在儿童近视防控镜片冒牌、贴牌等问题后，厦门市思明区市场监管部门当晚通报：经现场核查情况基本属实，已依法立案查处；江苏镇江市场监管部门同步组织执法核查。近视防控镜片单价高、周期长，冒牌产品不仅让家长白花钱，更可能延误孩子的视力干预窗口。", "en": "After CCTV reported on Sunday that multiple eyewear firms sell fake or rebranded children's myopia-control lenses, Xiamen's Siming district market regulator confirmed the same night that on-site checks largely verified the reports and opened a case; Zhenjiang's regulator in Jiangsu launched parallel checks. These lenses are pricey and used long-term: counterfeits not only waste parents' money but may miss the critical window for children's vision intervention.", "es": "Tras el reporte de CCTV del domingo sobre varias ópticas que venden lentes falsos o relabelados de control de miopía infantil, la reguladora del distrito Siming de Xiamen confirmó esa misma noche que las verificaciones in situ coincidieron en lo esencial y abrió expediente; la reguladora de Zhenjiang, en Jiangsu, inició controles paralelos. Estos lentes son caros y de uso prolongado: las falsificaciones no solo malgastan el dinero de los padres, pueden perder la ventana crítica de intervención visual del niño.", "ja": "18日、CCTVが複数の眼鏡会社で児童用近視抑制レンズの偽ブランド・他社貼り付け問題があると報じた後、廈門市思明区の市場監督部門は当夜、現地確認の結果おおむね事実とし、法に基づき立件したと発表。江蘇省鎮江の監督部門も並行して調査を開始した。近視抑制レンズは単価が高く長期使用のため、偽物は親の金を無駄にするだけでなく、子どもの視力介入の重要なタイミングを逃す恐れがある。"}, "why": {"zh": "儿科视力产品是家长最舍得花钱也最信息不对称的领域，监管连夜立案的速度说明这类「坑娃」生意以后没那么好做了。", "en": "Children's vision products are where parents spend most and understand least; the same-night enforcement shows such 'prey-on-kids' businesses are about to get much harder.", "es": "En productos de visión infantil los padres gastan más y entienden menos; la apertura de expediente esa misma noche muestra que estos negocios 'que muerden a los niños' tendrán días contados.", "ja": "子どもの視力製品は親が最も金をかけ、最も情報格差がある分野だ。夜を徹した立件の速さは、子どもにつけ込む商売が今後簡単には続けられないことを示している。"}}, {"idx": "05", "tag": {}, "title": {"zh": "重庆 2 岁幼童 18 楼坠亡案母亲发声：已申请刑事立案监督", "en": "Mother speaks out in Chongqing toddler's fatal 18th-floor fall case: criminal case-filing review requested", "es": "La madre habla en el caso del menor que murió al caer desde un piso 18 en Chongqing: pide revisión de la apertura de causa penal", "ja": "重慶の2歳児18階転落死事件で母親が声明：刑事立件監督を申請済み"}, "body": {"zh": "此前引发社会关注的重庆「2 岁男童从 18 楼家中坠亡」案有了新进展：18 日男童母亲刘女士表示，已委托律师申请刑事立案监督，目前重庆市渝北分局黄泥塝派出所已受理「过失致人死亡案」。案发时父亲外出遛狗、幼童独自在家，监护责任认定与证据认定成为双方争议焦点，后续司法程序值得关注。", "en": "The Chongqing case of a 2-year-old boy's fatal fall from an 18th-floor apartment has a new development: on Sunday the boy's mother, Liu, said she has retained lawyers to apply for criminal case-filing review, and the Huangnibang police station of Yubei branch has accepted the 'negligent homicide' filing. With the father out walking the dog at the time and the toddler home alone, the crux lies in guardianship responsibility and evidence; the ensuing judicial process bears watching.", "es": "El caso de Chongqing por la muerte de un niño de 2 años que cayó desde un piso 18 registra un avance: el domingo la madre, Liu, dijo que contrató abogados para solicitar la revisión de la apertura de causa penal, y la comisaría Huangnibang de Yubei aceptó la causa por 'homicidio culposo'. Con el padre fuera paseando al perro y el menor solo en casa, el eje está en la responsabilidad de custodia y las pruebas; el proceso judicial posterior merece atención.", "ja": "社会の関心を集めてきた重慶の「2歳男児が18階の自宅から転落死」事件に新展開。18日、男児の母親の劉さんは弁護士を通じて刑事立件監督を申請済みと明かし、重慶市渝北分局の黄泥塝派出所が「過失致死事件」の受理を完了したという。父親が犬の散歩中に幼児が一人で在宅していた当時の状況から、監護責任の認定と証拠認定が争点となっており、今後の司法手続きが注目される。"}, "why": {"zh": "低龄儿童独自在家引发的悲剧一再重演，「谁担责、怎么担」的司法答案，可能推动全社会重新审视幼儿居家看护习惯。", "en": "Tragedies from leaving toddlers home alone keep recurring; the judicial answer on liability may push society to reexamine home child-supervision habits at large.", "es": "Las tragedias por dejar a menores solos en casa se repiten; la respuesta judicial sobre responsabilidad puede llevar a la sociedad a revisar los hábitos de supervisión infantil.", "ja": "幼児を在宅だけで残すことで起きる悲劇は繰り返されている。責任の所在をめぐる司法の答えは、社会全体で幼児の在宅看護習慣を見直す契機になるかもしれない。"}}]}, {"key": "ent", "num": "06", "color": "#db2777", "deep": "#a81d5b", "name": {"zh": "娱乐八卦", "en": "Entertainment", "es": "Entretenimiento", "ja": "エンタメ"}, "items": [{"idx": "01", "tag": {}, "title": {"zh": "肖战十年首巡南京站秒罄：502 万人抢票、砍掉全部内部票，天价谣言被通报", "en": "Xiao Zhan's first tour sells out Nanjing instantly: 5.02 million queue, zero insider tickets, and a sky-high price rumor officially debunked", "es": "La primera gira de Xiao Zhan agota Nankín al instante: 5,02 millones en fila, cero entradas internas y el bulo del precio escandaloso desmentido oficialmente", "ja": "シャオ・ジャン初ツアー南京公演が即完売：502万人が争奪、内部チケット全廃、高額転売デマは公式に否定"}, "body": {"zh": "肖战出道十年首个个人巡演「出口·我们」南京站（10 月 23、25 日）开票，「想看」人数突破 502 万、开票瞬间售罄。本次演出全部票源 100% 公开销售、强制实名加人脸识别，行业惯例中约 15% 的内部预留票被全部砍掉。同日票务平台大麦通报：「第一排 25 万元」等天价票信息系王某某在无任何票源情况下编造，相关职能部门正依法处理。", "en": "Tickets for Xiao Zhan's debut solo tour 'Exit · Us' Nanjing shows (October 23 and 25) sold out instantly with over 5.02 million registered interest. All tickets went 100% public sale with strict real-name and face verification, scrapping the industry-customary ~15% insider allocation. Ticketing platform Damai announced the same day that the '250,000 yuan front-row' listings were fabricated by one Wang with no tickets at hand, and authorities are handling it under law.", "es": "Las entradas de la primera gira en solitario de Xiao Zhan, 'Exit · Us' en Nankín (23 y 25 de octubre), se agotaron al instante con más de 5,02 millones de 'me interesa'. Toda la taquilla se vendió 100% pública con nombre real y verificación facial, eliminando el ~15% de reservas internas habitual. La plataforma Damai informó ese día que el listado de '250.000 yuanes primera fila' fue inventado por un tal Wang sin ninguna entrada, y las autoridades lo están tramitando legalmente.", "ja": "シャオ・ジャンがデビュー10年で初となるソロツアー「出口・我们」南京公演（10月23・25日）のチケットは、「見たい」登録502万人突破で開票即完売した。全席が100%一般販売かつ強制実名・顔認証で、業界慣行の約15%内部確保枠は完全廃止。同日、チケット平台の大麦は「最前列25万元」などの高額転売情報はチケットを一切持たない王某某による捏造だと通告し、当局が法に基づき処理中である。"}, "why": {"zh": "502 万人抢两万张票、内部票清零——这已经不只是明星新闻，而是演出市场公平售票的一次行业级实验。", "en": "5.02 million chasing 20,000 tickets and a zero-insider policy: this is no longer just celebrity news but an industry-scale experiment in fair ticketing.", "es": "5,02 millones persiguiendo 20.000 entradas y cero reservas internas: ya no es solo noticia de famosos, es un experimento de venta justa a escala industrial.", "ja": "502万人が2万枚を争奪し、内部枠ゼロ——これはもう単なる芸能ニュースではなく、チケット販売の公平性を試す業界規模の実験だ。"}}, {"idx": "02", "tag": {"zh": "进展"}, "title": {"zh": "李昀锐孟子义剧宣高甜反差引脱粉争议，《尚公主》预约破 400 万网传 20 日定档", "en": "Li Yunrui and Meng Ziyi's sugary promo sparks fan exodus as The Grand Princess hits 4 million pre-orders, rumored for Oct 20", "es": "La promoción azucarada de Li Yunrui y Meng Ziyi provoca una fuga de fans, mientras La Gran Princesa supera 4 millones de reservas rumoreándose para el 20", "ja": "李昀銳と孟子義の劇宣ラブラブ演出にファン離れ騒動、『尚公主』は予約400万突破で20日放送開始の噂"}, "body": {"zh": "李昀锐空降《你好星期六》接孟子义下班、两人同乘高铁赴广州录制《奔跑吧》特别季，「零互动」到「高甜」的剧宣反差引发 CP 粉狂欢与部分唯粉脱粉，相关话题阅读量破千万。与此同时《尚公主》站内预约突破 400 万创平台古装剧纪录，网传 10 月 20 日定档，男主角「言尚」角色热度值已破亿——流量与争议同时到顶。", "en": "Li Yunrui dropped by Hello Saturday to pick Meng Ziyi up after work and the two boarded the same high-speed train to Guangzhou to tape Run for Time's special season — the swing from 'zero interaction' to 'sugar overload' sent CP fans into rapture while some solo-stan fans walked, with topic reads past ten million. Meanwhile The Grand Princess crossed 4 million pre-orders, a platform record for costume dramas, is rumored to premiere October 20, and lead character Yan Shang's heat score has topped 100 million — hype and controversy peaking together.", "es": "Li Yunrui se plantó en Hello Saturday a recoger a Meng Ziyi tras el trabajo y ambos tomaron el mismo tren bala a Guangzhou para grabar la temporada especial de Run for Time: el salto de 'cero interacción' a 'azúcar por doquier' llevó a los fans CP al éxtasis mientras parte de los fans en solitario se retiraban, con lecturas del tema por encima de diez millones. Mientras, La Gran Princesa superó 4 millones de reservas —récord de la plataforma en dramas de época—, se rumorea estreno el 20 de octubre y el personaje Yan Shang ya rebasó los 100 millones de calor —auge y polémica a la vez—.", "ja": "李昀銳が『你好星期六』の収録現場に乗り込み孟子義の仕事終わりを迎え、2人は同じ高速鉄道で広州へ移動して『奔跑吧』特別シーズンの収録へ。「ゼロ接触」から「高甘度」への劇宣ギャップがCPファンを熱狂させる一方、一部の単独ファンが離反し、関連話題の閲覧数は1000万を突破。同時に『尚公主』は予約数400万を超えて同プラットフォーム時代劇の記録を更新し、10月20日放送開始が噂され、主演キャラ「言尚」の熱量値は1億超え——話題性と論争が同時にピークに達した。"}, "why": {"zh": "剧宣边界之争第一次撕到这么大流量级：CP 营业的红利与反噬同时到账，之后所有剧组都得重新掂量「营业尺度」。", "en": "The promo-boundary fight has hit its biggest traffic level ever: CP-marketing's dividend and backlash arrived together, and every drama team will now recalibrate 'how far is too far'.", "es": "El debate sobre los límites promocionales alcanzó su mayor nivel de tráfico: el dividendo y la reacción de la mercadotecnia CP llegaron juntos, y cada equipo dramático tendrá que recalibrar 'hasta dónde'.", "ja": "劇宣の境界線をめぐる論争が史上最大の流量規模に達した。CP営業の配当と反動が同時に到着し、今後すべての制作陣が「営業の限度」を測り直すことになる。"}}, {"idx": "03", "tag": {}, "title": {"zh": "郭麒麟蒋依依「隐婚」传闻发酵一天即辟谣：回应称「一直是好朋友」", "en": "Guo Qilin and Jiang Yiyi's 'secret marriage' rumor lives a day before denial: 'we've always been just good friends'", "es": "El rumor del 'matrimonio secreto' de Guo Qilin y Jiang Yiyi dura un día: 'siempre hemos sido solo buenos amigos'", "ja": "郭麒麟と蔣依依の「隠し婚」噂は1日で否定：「ずっと良い友達です」と事務所が反論"}, "body": {"zh": "网传「30 岁郭麒麟与 25 岁知名女星已秘密结婚」的消息一夜发酵，传到蒋依依头上后其工作室迅速回应：两人自合作相识以来「一直都是好朋友」，结婚传闻纯属造谣。郭麒麟方面同期因主演剧集《此处通往繁星》的群演争议片段处在风口，短短几天连续遭遇不实爆料，当事人接连辟谣的成本之高也再次引发对造谣成本的讨论。", "en": "A claim that '30-year-old Guo Qilin has secretly married a famous 25-year-old actress' swelled overnight; once it reached Jiang Yiyi, her studio quickly responded that the two have 'always been just good friends' since meeting on a project, calling the marriage rumor pure fabrication. Guo Qilin was already in the storm over an extra's boundary-crossing scene in his drama Here Leads to the Stars — days of consecutive false leaks have reignited discussion about the cost of rumor-making versus debunking.", "es": "La afirmación de que 'Guo Qilin, de 30 años, se casó en secreto con una actriz famosa de 25' creció de noche; al llegar a Jiang Yiyi, su estudio respondió rápido que los dos 'siempre han sido solo buenos amigos' desde que se conocieron rodando, tachando el rumor de fabricación pura. Guo Qilin ya estaba en el ojo del huracán por una escena de un extra en su serie Here Leads to the Stars —días seguidos de filtrados falsos reavivaron el debate sobre el costo de inventar rumores frente al de desmentirlos—.", "ja": "「30歳の郭麒麟が25歳の人気女優と極秘結婚した」という噂が一晩で拡散。噂が蔣依依に及ぶと、彼女の事務所は「共作で知り合ってからずっと良い友達です」と即座に否定し、結婚説は完全な捏造だと説明した。郭麒麟は主演ドラマ『ここから星へ』のエキストラ出演者の越境的シーンでも騒動の渦中にあり、数日で偽情報が連発したことで、デマを流すコストと否定するコストのギャップが改めて議論されている。"}, "why": {"zh": "匿名一句「已结婚」就要当事人动用团队辟谣，造谣与辟谣的成本差再次拉满，这条娱乐新闻其实是一条平台治理议题。", "en": "One anonymous sentence forces a whole team into damage control — the rumor-versus-debunk cost gap is fully on display, making this celebrity item really a platform-governance story.", "es": "Una frase anónima obliga a todo un equipo a controlar daños: la brecha de costos entre inventar y desmentir queda a la vista, convirtiendo esta nota de famosos en un tema de gobernanza de plataformas.", "ja": "匿名の「結婚した」一言のために当事者はチーム総出で否定に回る。デマを流すコストと否定するコストの差が改めて露呈し、この芸能ニュースは実質プラットフォームガバナンスの話題だ。"}}, {"idx": "04", "tag": {}, "title": {"zh": "新垣结衣星野源官宣一孩出生，零剧透式报喜引爆热搜", "en": "Aragaki Yui and Hoshino Gen announce their first child with a zero-teaser reveal", "es": "Aragaki Yui y Hoshino Gen anuncian su primer hijo con un anuncio sin filtraciones", "ja": "新垣結衣と星野源が第一子出産を発表、ネタバレゼロの報告が話題に"}, "body": {"zh": "新垣结衣与星野源 10 月 13 日发布联名公告，宣布第一个孩子平安降生。从结婚到生子，两人几乎没有出现过孕期路透、没有怀孕传闻，连一次街拍都未走漏，「零剧透官宣」直接冲上热搜，网友感慨这对夫妻把私生活的边界感做到了极致，祝福刷屏的同时也带火了「明星隐私权」话题讨论。", "en": "Aragaki Yui and Hoshino Gen announced on October 13 in a joint statement that their first child was born safely. From marriage to childbirth, there were no pregnancy sightings, no rumors, not even a leaked street photo — the 'zero-teaser announcement' shot straight up the trending lists, with netizens marveling at the couple's airtight privacy while congratulations flooded in, fueling a fresh round of discussion about celebrity privacy rights.", "es": "Aragaki Yui y Hoshino Gen anunciaron el 13 de octubre en un comunicado conjunto el nacimiento seguro de su primer hijo. Del matrimonio al parto no hubo ni una foto de embarazo, ni rumor, ni siquiera una foto callejera filtrada: el 'anuncio sin spoilers' subió directo a las tendencias, con internautas admirando la hermeticidad de la pareja mientras las felicitaciones inundaban, reavivando el debate sobre el derecho a la privacidad de las celebridades.", "ja": "新垣結衣と星野源が10月13日、連名の発表で第一子が無事に誕生したことを報告した。結婚から出産まで、妊娠中の目撃情報も噂もなく、街頭スナップすら一枚も流出しなかった。「ネタバレゼロの発表」はトレンドに躍り出て、夫婦のプライバシー境界の徹底ぶりにネットが感嘆、祝福が殺到すると同時に「芸能人のプライバシー権」をめぐる議論も再燃した。"}, "why": {"zh": "在狗仔与算法围猎的时代，能做到孕期零泄露的明星凤毛麟角，这条官宣火的不只是喜事，更是「边界感」本身。", "en": "In an era of paparazzi and algorithmic hunting, a leak-free pregnancy is vanishingly rare: what went viral is not just the happy news but the boundary discipline itself.", "es": "En la era de paparazzi y algoritmos, un embarazo sin filtraciones es casi milagroso: lo viral no es solo la buena noticia, sino la disciplina de límites en sí.", "ja": "パパラッチとアルゴリズムがはりめぐらされる時代に、妊娠期間を完全に漏らさなかった芸能人はごくわずか。話題になったのは喜報そのものより「境界線の守り方」だ。"}}, {"idx": "05", "tag": {}, "title": {"zh": "河正宇官宣 12 月 13 日结婚：与小 11 岁演员车贞媛的六年恋情修成正果", "en": "Ha Jung-woo to wed December 13: six-year romance with actress Cha Jung-won, 11 years his junior, reaches the altar", "es": "Ha Jung-woo se casa el 13 de diciembre: seis años de romance con la actriz Cha Jung-won, once años menor", "ja": "ハ・ジョンウが12月13日結婚を発表：11歳年下の女優・車貞媛と6年交際が実を結ぶ"}, "body": {"zh": "48 岁的韩国演员河正宇 14 日发表声明，宣布将于 12 月 13 日在首尔举行非公开婚礼，新娘是比他小 11 岁的女演员车贞媛。两人 2020 年相识、秘密交往六年，几乎未被媒体拍到同框；经纪公司同步官宣后，韩网与中文社交平台双双刷屏，网友笑称「从《黄海》追到婚礼请柬，追星二十年终于等到这场份子钱」。", "en": "South Korean actor Ha Jung-woo, 48,         html += titleHtml(it.title, it.hl, lang) + "</div>";
        html += '<div class="d">' + esc(T(it.body, lang)) + "</div>";
        html += '<div class="why"><b>' + esc(i18n.why) + "</b>" + esc(T(it.why, lang)) + "</div>";
        html += "</div>";
      });
      html += "</section>";
    });
    html += "</div>";
    var content = document.getElementById("content");
    if (content) content.innerHTML = html;
    // 页脚
    var risk = document.getElementById("risk");
    if (risk) risk.textContent = T(BRIEFING.risk, lang);
  }

  function setLang(lang) {
    if (LANGS.indexOf(lang) < 0) lang = "zh";
    curLang = lang;
    langOpen = false;
    try { localStorage.setItem("timab_lang", lang); } catch (e) {}
    renderChrome(lang);
    renderContent(lang);
  }

  /* ===== 往期日历（保留原逻辑，文案随语言） ===== */
  function initCalendar() {
    var btn = document.getElementById("calBtn");
    var pop = document.getElementById("calPop");
    var grid = document.getElementById("calGrid");
    var title = document.getElementById("calTitle");
    if (!btn || !pop || !grid || !title) return;

    var parts = BRIEFING.date.split("-");
    var todayKey = parts[0].slice(2) + parts[1] + parts[2];
    var cur = { y: +parts[0], m: +parts[1] };
    var has = {};
    for (var i = 0; i < ARCHIVE_DATES.length; i++) { has[ARCHIVE_DATES[i]] = 1; }
    var HIST_BASE = /\/history\//.test(location.pathname) ? "./" : "history/";

    function ckey(y, m, d) { return String(y).slice(2) + pad(m) + pad(d); }

    function render() {
      var i18n = I18N[curLang];
      title.textContent = i18n.calTitle(cur.y, cur.m);
      grid.innerHTML = "";
      var start = new Date(cur.y, cur.m - 1, 1).getDay();
      var days = new Date(cur.y, cur.m, 0).getDate();
      for (var b = 0; b < start; b++) {
        var blank = document.createElement("span");
        blank.className = "cal-cell is-empty"; grid.appendChild(blank);
      }
      for (var d = 1; d <= days; d++) {
        var k = ckey(cur.y, cur.m, d);
        var cell = document.createElement("span");
        cell.className = "cal-cell" + (has[k] ? " has" : "") + (k === todayKey ? " is-today" : "");
        cell.textContent = d;
        if (has[k]) {
          cell.setAttribute("role", "link"); cell.setAttribute("tabindex", "0");
          cell.title = cur.y + "-" + pad(cur.m) + "-" + pad(d) + " 存档";
          (function (target) {
            var go = function () { window.open(HIST_BASE + target + ".html", "_blank", "noopener"); };
            cell.addEventListener("click", go);
            cell.addEventListener("keydown", function (e) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); go(); } });
          })(k);
        }
        grid.appendChild(cell);
      }
    }
    function toggle(open) {
      pop.hidden = !open;
      btn.setAttribute("aria-expanded", open ? "true" : "false");
      if (open) render();
    }
    btn.addEventListener("click", function (e) { e.stopPropagation(); toggle(pop.hidden); });
    document.getElementById("calPrev").addEventListener("click", function () { cur.m--; if (cur.m < 1) { cur.m = 12; cur.y--; } render(); });
    document.getElementById("calNext").addEventListener("click", function () { cur.m++; if (cur.m > 12) { cur.m = 1; cur.y++; } render(); });
    document.addEventListener("click", function (e) { if (!pop.hidden && !pop.contains(e.target)) toggle(false); });
    document.addEventListener("keydown", function (e) { if (e.key === "Escape" && !pop.hidden) toggle(false); });
  }

  /* ===== 启动 ===== */
  function boot() {
    curLang = detectLang();
    renderChrome(curLang);
    renderContent(curLang);
    initCalendar();
    // 关闭语言下拉：点击外部 / Esc
    document.addEventListener("click", function (e) {
      var ls = document.getElementById("langSwitch");
      if (ls && langOpen && !ls.contains(e.target)) {
        langOpen = false;
        ls.classList.remove("open");
        var t = document.getElementById("langTrigger");
        if (t) t.setAttribute("aria-expanded", "false");
      }
    });
    document.addEventListener("keydown", function (e) {
      if (e.key === "Escape" && langOpen) {
        langOpen = false;
        var ls = document.getElementById("langSwitch");
        if (ls) ls.classList.remove("open");
        var t = document.getElementById("langTrigger");
        if (t) t.setAttribute("aria-expanded", "false");
      }
    });
  }
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", boot);
  } else { boot(); }
})();
</script>
