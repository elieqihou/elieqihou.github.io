  var ARCHIVE_DATES = [/*__ARCHIVE_DATES__*/"260923", "260924", "260925", "260926", "260927", "260928", "260929", "260930", "261001", "261002", "261003", "261004", "261005", "261006", "261007", "261008", "261009", "261010", "261011", "261012", "261013"/*__END__*/];
  var BRIEFING = /*__BRIEFING_DATA__*/{"date": "2026-10-14", "meta": {"zh": "星期三 · 农历九月初五 · timab.cn", "en": "Wednesday · Lunar September 5 · timab.cn", "es": "Miércoles · 5.º día del noveno mes lunar · timab.cn", "ja": "水曜日 · 農暦九月五日 · timab.cn"}, "spotlight": {"badge": {"zh": "精 选", "en": "SPOTLIGHT", "es": "DESTACADO", "ja": "注目"}, "title": {"zh": "双汇 1.29 亿元罚单落地 食品安全首次「罚到高管头上」", "en": "Shuanghui hit with a 1.29-billion-yuan fine as food-safety penalties reach executives", "es": "Shuanghui recibe una multa de 1.290 millones de yuanes y por fin se sanciona a los ejecutivos", "ja": "シュアンフイに12.9億元罰金 食品安全で役員個人の処罰が初めて現実に"}, "hl": {"zh": "「罚到高管头上」", "en": "reach executives", "es": "sanciona a los ejecutivos", "ja": "役員個人の処罰"}, "body": {"zh": "双汇发展 9 日晚公告，因控股子公司望奎双汇 2025 年一批次猪后鞧肉林可霉素残留超标 37.5 倍（检出值 7700μg/kg，国标限值 200），公司及子公司合计被罚没 7250.21 万元；董事长万宏伟、总裁、副总裁、总工程师 4 名高管另被罚款 5636.28 万元，总计约 1.29 亿元，预计减少 2026 年归母净利润约 6380 万元。双汇公开致歉并提出源头采购管控、升级检验检测等六项整改举措，这是食品安全「处罚到人」机制落地的标志性一单。", "en": "Shuanghui Development announced on the evening of October 9 that its subsidiary Wangkui Shuanghui produced a batch of pork hind-leg cuts in 2025 with lincomycin residues 37.5 times above the national limit (7,700 μg/kg versus the 200 μg/kg standard). The company and its subsidiary were fined and forfeited 72.5021 million yuan in total, while four executives — chairman Wan Hongwei, the president, a vice-president and the chief engineer — were individually fined another 56.3628 million yuan, adding up to roughly 129 million yuan in total and trimming about 63.81 million yuan from 2026 net profit attributable to shareholders. Shuanghui publicly apologised and rolled out six rectification measures covering supplier audits and upgraded testing — a landmark case for the food-safety practice of holding individuals accountable.", "es": "Shuanghui Development anunció la noche del 9 de octubre que su filial Wangkui Shuanghui produjo en 2025 un lote de carne de cerdo con residuos de lincomicina 37,5 veces por encima del límite nacional (7.700 μg/kg frente a los 200 μg/kg de la norma). La empresa y su filial suman 72,5021 millones de yuanes en multas y decomisos, y otros cuatro ejecutivos —el presidente del consejo Wan Hongwei, el presidente ejecutivo, un vicepresidente y el ingeniero jefe— fueron multados individualmente con 56,3628 millones de yuanes más, un total de unos 1.290 millones de yuanes que recortará unos 63,81 millones de yuanes del beneficio neto de 2026. Shuanghui se disculpó públicamente y presentó seis medidas de corrección, desde la auditoría de proveedores hasta la mejora de los análisis: un caso emblemático de la política de sancionar a las personas responsables.", "ja": "シュアンフイ・ディベロップメントは10月9日夜、傘下の望奎シュアンフイが2025年に製造した豚肉1ロットのリンコマイシン残留が国家基準の37.5倍（検出値7700μg/kg、基準値200）に達したと発表した。会社と子会社の合計罰沒額は7250.21万元、さらに董事長の万宏偉ら役員4名にも5636.28万元の罰金が科され、総額約12.9億元となり、2026年の親会社株主帰属純利益は約6380万元減少する見込み。同社は公に謝罪し、仕入れ管理や検査体制の強化など6項目の是正策を打ち出した。食品安全「個人への処罰」制度が本格始動した象徴的な一例だ。"}, "why": {"zh": "过去「企业认罚、高管无恙」的潜规则被打破——罚款从利润里列支、责任落到具体的人，千亿食品巨头的全链条管控逻辑要重写了。", "en": "The old rule of companies paying and executives walking free is broken: fines now cost real people real money, and a food giant's quality-control playbook has to be rewritten.", "es": "La vieja regla de que la empresa paga y los ejecutivos siguen impunes está rota: ahora las multas cuestan dinero a personas concretas y la cadena de control de un gigante alimentario tiene que reescribirse.", "ja": "「会社が払い、役員は無傷」という暗黙のルールが崩れた。罰金は具体的な人間の懐を直撃し、巨大食品企業の品質管理の論理そのものが書き換えられる。"}}, "risk": {"zh": "风险提示：本简报仅作信息汇总，其中涉及的数据不构成任何投资建议。", "en": "Disclaimer: This briefing is a news digest only; data cited does not constitute investment advice.", "es": "Aviso: Este resumen es solo una compilación informativa; los datos citados no constituyen asesoramiento de inversión.", "ja": "注意：本紙は情報のまとめであり、記載データは投資助言を構成するものではありません。"}, "sections": [{"key": "intl", "num": "01", "color": "#1d4ed8", "deep": "#1e3fa8", "name": {"zh": "国际时事", "en": "World", "es": "Internacional", "ja": "国際"}, "items": [{"idx": "01", "tag": {"zh": "进展"}, "title": {"zh": "沙特再拦胡塞导弹与无人机 特朗普放话「中期选举后我还会在」", "en": "Saudi Arabia intercepts more Houthi missiles and drones as Trump warns he will still be around after midterms", "es": "Arabia Saudí intercepta más misiles y drones hutíes mientras Trump advierte que seguirá ahí tras las legislativas", "ja": "サウジ、フーシのミサイルと無人機を再び迎撃 トランプ「中間選挙後も私はいる」"}, "body": {"zh": "沙特联军发言人表示，13 日在利雅得以北拦截 3 架无人机、击落 2 枚射向也门边境附近海米斯穆谢特的弹道导弹，沙特阿美位于东部宰赫兰的一栋行政办公楼同日遭袭引发小范围火灾、无人伤亡。特朗普在社交媒体上暗示胡塞武装「奉伊朗之命」在美国中期选举前蓄意推高油价：「中期选举结束后我还会在，我永远不会忘记这事！」埃及表态愿为沙特提供任何形式的支持，土耳其总统与沙特王储通话讨论局势，原定在利雅得举行的多场国际活动已受冲击。", "en": "The Saudi-led coalition said on Tuesday it intercepted three drones north of Riyadh and shot down two ballistic missiles aimed at Khamis Mushait near the Yemeni border, while an administrative building of Saudi Aramco in Dhahran was hit the same day, causing a small fire and no casualties. Trump suggested on social media that the Houthis were deliberately driving up oil prices before the US midterms on Iran's orders, writing: I thought they had learned their lesson a year ago. After the midterms I will still be here, and I will never forget this! Egypt offered Saudi Arabia support of any kind, Turkey's president discussed the attacks with the crown prince, and several international events planned for Riyadh have been disrupted.", "es": "La coalición liderada por Riad dijo el martes que interceptó tres drones al norte de Riad y derribó dos misiles balísticos dirigidos a Khamis Mushait, cerca de la frontera yemení, mientras un edificio administrativo de Saudi Aramco en Dhahran fue alcanzado el mismo día, con un pequeño incendio y sin heridos. Trump insinuó en redes sociales que los hutíes encarecen el petróleo a propósito antes de las legislativas estadounidenses por orden de Irán: Pensaba que habían aprendido la lección hace un año. ¡Después de las legislatives seguiré aquí y no lo olvidaré! Egipto ofreció apoyo saudí de cualquier tipo, el presidente turco habló con el príncipe heredero y varios foros internacionales previstos en Riad han quedado afectados.", "ja": "サウジ主導の連合軍は13日、リヤド北方で無人機3機を迎撃し、イエメン国境付近のハーミス・ムーシャトへ向けられた弾道ミサイル2発を撃墜したと発表。同日、東部ダーランのサウジアラムコ事務棟が攻撃を受け、小規模な火災が発生したが負傷者はいない。トランプ大統領はSNSで、フーシがイランの指示で中間選挙前に意図的に油価を吊り上げていると示唆し、「中間選挙の後も私はここにいる。このことは決して忘れない」と書いた。エジプトはあらゆる形の支援を表明し、トルコ大統領はサウジ皇太子と協議。リヤドで予定されていた国際イベントにも影響が出ている。"}, "why": {"zh": "战火烧向全球油市心脏地带，特朗普「记仇式」表态意味着美军直接下场的选项始终摆在桌上——油价与航运风险都没有解除。", "en": "The war has reached the heart of the global oil market, and Trump's grudge-keeping rhetoric keeps the option of direct US involvement on the table — neither the oil-price nor the shipping risk is gone.", "es": "La guerra llegó al corazón del mercado petrolero mundial y la retórica rencorosa de Trump mantiene sobre la mesa la opción de una intervención directa de EE. UU.: ni el riesgo del precio del crudo ni el del transporte marítimo han desaparecido.", "ja": "戦火は世界の油市の心臓部に迫った。トランプの「恨みを忘れない」発言は米軍直接介入の選択肢を常にテーブルに残す。油価も海運もリスクは消えていない。"}}, {"idx": "02", "title": {"zh": "IMF 报告：霍尔木兹海峡航运受阻或拖累世界经济增速", "en": "IMF report: disrupted shipping through the Strait of Hormuz could weigh on world growth", "es": "Informe del FMI: el bloqueo marítimo en Ormuz podría frenar el crecimiento mundial", "ja": "IMF報告：ホルムズ海峡の航行停滞が世界経済の伸びを抑えるおそれ"}, "body": {"zh": "国际货币基金组织在最新报告中警告，霍尔木兹海峡航运受阻可能影响世界经济增速。此前受美伊博弈与地区冲突影响，该海峡 10 月 6 日单日通行船只一度降至 7 艘、创两个月新低；国际油价维持高位，布伦特原油已连续多日在每桶 105 美元上方运行，能源、航运与化工全链条成本同步抬升。", "en": "The International Monetary Fund has warned in a new report that disrupted shipping through the Strait of Hormuz could affect world economic growth. Hit by the US-Iran standoff and regional conflict, daily transits through the strait fell to as few as seven vessels on October 6, a two-month low. Oil prices remain elevated, with Brent crude running above 105 dollars a barrel for several sessions, pushing costs up across the energy, shipping and chemical chains.", "es": "El Fondo Monetario Internacional advirtió en un informe reciente que la interrupción del tráfico marítimo por el estrecho de Ormuz podría afectar al crecimiento económico mundial. Golpeado por la disputa entre EE. UU. e Irán y el conflicto regional, el tránsito diario por el estrecho cayó el 6 de octubre a solo siete buques, mínimo de dos meses. El petróleo sigue caro: el Brent lleva varias sesiones por encima de los 105 dólares el barril y suben los costes de energía, transporte y química.", "ja": "国際通貨基金（IMF）は最新報告で、ホルムズ海峡の航行停滞が世界経済の成長に影響を与えかねないと警告した。米イランの対立や地域紛争の影響で、海峡の1日通航隻数は10月6日に7隻まで落ち込み、2か月ぶりの低水準を記録。国際油価は高止まりし、ブレント原油は1バール105ドル超を連日維持しており、エネルギー・海運・化学の全チェーンでコストが上昇している。"}, "why": {"zh": "能源咽喉被地缘政治「掐住」，IMF 把风险写进官方口径等于全球摊牌——通胀、运价、化工品价格的下一站都系于此。", "en": "The world's energy chokepoint is squeezed by geopolitics, and an IMF warning puts the risk on the record — inflation, freight rates and chemical prices all hinge on what happens next.", "es": "La garganta energética del mundo está estrangulada por la geopolítica y la advertencia del FMI pone el riesgo sobre la mesa: la inflación, los fletes y los precios químicos dependen de lo que venga.", "ja": "世界のエネルギー要衝が地政学に締め上げられている。IMFが公式に警告したことでリスクは表舞台へ——インフレも運賃も化学品価格も、この先の行方次第だ。"}}, {"idx": "03", "tag": {"zh": "进展"}, "title": {"zh": "俄乌「能源停火」两天互相指责 美威胁切断对乌武器供应", "en": "Two days into the energy ceasefire, Moscow and Kyiv trade accusations as the US threatens to cut arms supply", "es": "A los dos días del alto el fuego energético, Moscú y Kiev se acusan mientras EE. UU. amenaza con cortar las armas", "ja": "エネルギー停戦2日目で露乌が非難の応酬 米国は武器供給停止を示唆"}, "body": {"zh": "泽连斯基 13 日称，特朗普宣布「能源停火」两天来，乌克兰没有打击俄罗斯炼油厂或能源行业，但俄方继续袭击乌能源设施与关键基础设施；俄国防部则称 12 日至 13 日在多地及亚速海水域上空拦截摧毁 604 架乌克兰无人机。白宫官员此前表示，希望双方先停止互袭炼油厂、再逐步扩大至电厂与电网；有消息称美国正以切断对乌武器供应相威胁，要求乌方停止对俄能源设施的纵深打击。", "en": "Zelensky said on Monday that in the two days since Trump declared an energy ceasefire, Ukraine had not struck Russian refineries or its energy industry, yet Russia kept attacking Ukrainian energy facilities and critical infrastructure; Russia's defence ministry, for its part, said it intercepted and destroyed 604 Ukrainian drones between October 12 and 13 over multiple regions and the Azov Sea. White House officials have said they want both sides to stop hitting refineries first and then extend the truce to power plants and the grid; reports say Washington is threatening to cut off arms supplies to pressure Kyiv into halting deep strikes on Russian energy infrastructure.", "es": "Zelenski dijo el lunes que en los dos días desde que Trump declaró el alto el fuego energético, Ucrania no atacó refinerías rusas ni su industria energética, pero Rusia siguió golpeando instalaciones energéticas e infraestructura crítica ucranianas; el Ministerio de Defensa ruso afirmó por su parte haber interceptado y destruido 604 drones ucranianos entre el 12 y el 13 de octubre sobre varias regiones y el mar de Azov. Funcionarios de la Casa Blanca quieren que ambas partes cesen primero los ataques a refinerías y luego extiendan la tregua a plantas eléctricas y la red; informes señalan que Washington amenaza con cortar el suministro de armas para presionar a Kiev a frenar los ataques profundos a la energía rusa.", "ja": "ゼレンスキーは13日、トランプがエネルギー停戦を宣言してから2日間、ウクライナはロシアの製油所やエネルギー産業を攻撃していないが、ロシア側はウクライナのエネルギー施設と重要インフラへの攻撃を続けていると述べた。一方ロシア国防省は12〜13日、複数地域とアゾフ海上空でウクライナの無人機604機を迎撃・破壊したと発表。ホワイトハウスはまず製油所攻撃の停止、次いで発電所や送電網への拡大を求めており、米国が武器供給の停止を盾に、ロシアのエネルギー施設への深部攻撃中止をウクライナに迫っていると伝えられる。"}, "why": {"zh": "停火范围从炼油厂到电网每扩一步都伴随新分歧——援助牌与停火牌怎么打，决定这场战争以何种方式降温。", "en": "Every widening of the truce from refineries to the grid comes with fresh disputes; how Washington plays the aid card against the ceasefire card will decide how this war cools down.", "es": "Cada ampliación de la tregua, de refinerías a la red eléctrica, trae disputas nuevas; cómo juegue Washington la carta de la ayuda frente a la del alto el fuego decidirá cómo se enfríe esta guerra.", "ja": "製油所から送電網へと停戦範囲を広げるごとに新たな対立が生じる。援助カードと停戦カードをどう切るかで、戦争の冷め方が決まる。"}}, {"idx": "04", "tag": {"zh": "进展"}, "title": {"zh": "俄美就柴油交易展开谈判 美「松绑」引发两党批评", "en": "Russia and the US open talks on diesel trade as Washington's easing draws bipartisan fire", "es": "Rusia y EE. UU. negocian sobre el diésel mientras la flexibilización genera críticas bipartidistas", "ja": "露米がディーゼル取引の交渉開始 米国の「緩和」に与野党から批判"}, "body": {"zh": "俄罗斯副总理 14 日表示，俄美已开始就柴油交易进行谈判；此前美国部分解除对俄柴油出口禁令、放行 50 万吨，被指意在压低美国国内柴油价格。这一「松绑」在美国国会两党同时挨批，媒体评论称能源利益正冲击美欧对俄制裁的一致性；俄罗斯同日重申支持黎巴嫩领土完整。", "en": "Russia's deputy prime minister said on Tuesday that Moscow and Washington have begun talks on a diesel trade; Washington earlier partially lifted its ban on Russian diesel exports, allowing 500,000 tonnes through, in a move widely read as an attempt to bring down US domestic diesel prices. The easing has drawn fire from both parties in Congress, with commentators saying energy interests are eroding Western sanctions unity on Russia; Moscow the same day reaffirmed its support for Lebanon's territorial integrity.", "es": "El viceprimer ministro ruso dijo el martes que Moscú y Washington ya negocian un acuerdo sobre diésel; antes, EE. UU. levantó parcialmente la prohibición de exportar diésel ruso, autorizando 500.000 toneladas, en una medida leída como intento de abaratar el diésel interno estadounidense. La flexibilización recibió críticas de los dos partidos en el Congreso, y se comenta que los intereses energéticos erosionan la unidad occidental en las sanciones; Moscú reiteró el mismo día su apoyo a la integridad territorial del Líbano.", "ja": "ロシアの副首相は14日、露米がディーゼル取引に関する交渉を開始したと明らかにした。米国は先にロシア産ディーゼルの輸出禁止を一部解除し50万トンを放行しており、国内ディーゼル価格の引き下げが狙いとみられる。この「緩和」は米議会で与野党双方から批判を浴びており、エネルギー利益が対露制裁の一致を揺るがしていると報じられている。ロシアは同日、レバノンの領土保全への支持を改めて表明した。"}, "why": {"zh": "制裁体系第一次为油价「开口子」——松动的口子会不会越撕越大，牵动整个对俄制裁联盟的成色。", "en": "The sanctions regime has cracked open for oil prices for the first time; whether that crack widens will show how much steel is really left in the anti-Russia sanctions coalition.", "es": "El régimen de sanciones se abre por primera vez por el precio del crudo; que la grieta crezca o no dirá cuánta solidez le queda a la coalición de sanciones contra Rusia.", "ja": "制裁体制が油価のために初めて「裂け目」を作った。その裂け目が広がるかどうかで、対露制裁連合の実力が試される。"}}, {"idx": "05", "title": {"zh": "美国驻希腊大使因行为不当辞职 欧洲能源与网络风波不断", "en": "US ambassador to Greece resigns over misconduct claims as Europe faces energy and cyber turmoil", "es": "El embajador de EE. UU. en Grecia dimite por conducta inapropiada mientras Europa afronta turbulencias energéticas y cibernéticas", "ja": "米駐ギリシャ大使が不祥事で辞任 欧州ではエネルギーとサイバーの波乱続く"}, "body": {"zh": "美国驻希腊大使因被指控行为不当于 13 日辞职。同一晚的新闻画面里，欧洲并不平静：法国数百家超市的制冷系统遭网络攻击、损失严重；黎巴嫩外长访俄、俄方重申支持黎领土完整；能源利益冲击之下，美欧对俄制裁的分歧进一步显形。", "en": "The US ambassador to Greece resigned on Monday over misconduct allegations. Europe was hardly quiet the same evening: hackers hit the refrigeration systems of hundreds of French supermarkets with heavy losses, Lebanon's foreign minister visited Moscow where Russia reaffirmed support for Lebanese territorial integrity, and under the pressure of energy interests the transatlantic split over Russia sanctions grew more visible.", "es": "El embajador de EE. UU. en Grecia dimitió el lunes tras acusaciones de conducta inapropiada. Europa tampoco estuvo tranquila esa noche: piratas informáticos atacaron los sistemas de refrigeración de cientos de supermercados franceses con cuantiosas pérdidas, la canciller libanesa visitó Moscú, donde Rusia reiteró su apoyo a la integridad territorial libanesa, y bajo la presión de los intereses energéticos la divergencia transatlántica sobre las sanciones se hace más visible.", "ja": "米駐ギリシャ大使が13日、行動不適切の指摘により辞任した。同じ夜の欧州も静かではない。フランスでは数百家のスーパーマーケットの冷凍冷蔵システムがサイバー攻撃を受け、損失が深刻化。レバノン外相はモスクワを訪れ、ロシアはレバノンの領土保全支持を再確認した。エネルギー利益をめぐる圧力の中で、米欧の対露制裁をめぐる見解の相違はさらに表面化している。"}, "why": {"zh": "外交人事异动叠加网络攻击与能源博弈，大西洋两岸的摩擦面正从贸易扩展到数字基础设施——供应链安全多了一层新含义。", "en": "A diplomatic resignation on top of cyberattacks and energy brinkmanship shows the transatlantic friction surface expanding from trade to digital infrastructure — supply-chain security just gained a new dimension.", "es": "Una dimisión diplomática sumada a ciberataques y pulso energético muestra que la fricción transatlántica pasa del comercio a la infraestructura digital: la seguridad de las cadenas de suministro gana una nueva dimensión.", "ja": "外交人事の交代にサイバー攻撃とエネルギー駆け引きが重なり、大西洋両岸の摩擦は貿易からデジタル基盤へ広がりつつある。サプライチェーン安全に新しい意味が加わった。"}}]}, {"key": "dom", "num": "02", "color": "#cf2f1e", "deep": "#a82618", "name": {"zh": "国内要闻", "en": "China", "es": "China", "ja": "国内"}, "items": [{"idx": "01", "title": {"zh": "习近平会见多哥部长会议主席 中多关系提升为新时代中多命运共同体", "en": "Xi meets Togo's head of government as China and Togo elevate ties to a community with a shared future", "es": "Xi se reúne con el jefe de gobierno de Togo y ambas naciones elevan sus vínculos a una comunidad de futuro compartido", "ja": "習近平国家主席がトーゴー政府首班と会見 両国関係は新時代の運命共同体へ格上げ"}, "body": {"zh": "国家主席习近平 13 日下午在人民大会堂会见来华正式访问的多哥部长会议主席福雷，两国宣布将双边关系定位提升为新时代中多命运共同体。习近平就各方建设性参与非洲热点问题解决提出四条原则：坚持非洲主导、维护公平正义、推动止戈为和、实行标本兼治，并欢迎多哥用好零关税举措与输华产品「绿色通道」。丁薛祥同日会见清华大学经济管理学院顾问委员会委员代表，围绕人工智能发展与治理交流，顾问委员会主席库克表示愿继续深耕中国。", "en": "President Xi Jinping met Togo's President of the Council of Ministers, Faure Gnassingbe, at the Great Hall of the People on Monday afternoon, with the two countries announcing that bilateral ties are elevated to a China-Togo community with a shared future for the new era. Xi set out four principles for outside parties to help resolve African hotspot issues in a constructive way: Africa leads, fairness and justice prevail, force gives way to peace, and root causes are addressed alongside symptoms. Ding Xuexiang met representatives of Tsinghua SEM's advisory board the same day to discuss AI development and governance, with board chairman Tim Cook pledging deeper engagement in China.", "es": "El presidente Xi Jinping recibió el lunes por la tarde al presidente del Consejo de Ministros de Togo, Faure Gnassingbe, en el Gran Salón del Pueblo, con el anuncio de que las relaciones bilaterales se elevan a una comunidad China-Togo de futuro compartido para la nueva era. Xi planteó cuatro principios para que terceros ayuden de forma constructiva a resolver los puntos calientes africanos: liderazgo africano, equidad y justicia, sustituir la guerra por la paz y abordar causas y síntomas. Ding Xuexiang se reunió el mismo día con representantes del consejo asesor de la escuela de negocios de Tsinghua para hablar del desarrollo y la gobernanza de la IA; su presidente, Tim Cook, prometió profundizar su presencia en China.", "ja": "習近平国家主席は13日午後、人民大会堂で公式訪問中のトーゴー閣僚評議会議長フォレと会見し、両国は二国間関係を「新時代の中国・トーゴー運命共同体」へと格上げすると発表した。習主席はアフリカの紛争热点への建設的関与について、アフリカ主導、公平と正義の維持、戦を止めて和を進める、根本と症状の両立という四原則を提示した。丁薛祥氏は同日、清華大学経済管理学院顧問委員会の委員代表と会見し、AIの発展とガバナンスをめぐり意見を交わした。委員長のクック氏は中国での事業深化への意欲を示した。"}, "why": {"zh": "对非外交再落一子，「四条原则」给非洲热点问题的外部参与划定了中国方案；同期苹果库克在京行程密集，外资风向值得关注。", "en": "Another move in China's Africa diplomacy: the four principles define Beijing's formula for outside involvement in African crises, and Tim Cook's busy Beijing schedule keeps the foreign-investment mood in focus.", "es": "Otra jugada de la diplomacia china en África: los cuatro principios fijan la fórmula de Pekín para la participación externa en las crisis africanas, y la apretada agenda de Tim Cook en la capital mantiene el foco en el ánimo inversor extranjero.", "ja": "対アフリカ外交がまた一歩前進。四原則はアフリカの紛争への外部関与に関する中国式の答えを示した。同時期にクック氏の北京での日程が密集しており、外資の風向きにも要注目だ。"}}, {"idx": "02", "tag": {"zh": "进展"}, "title": {"zh": "缅北魏家犯罪集团案一审宣判 三名主犯被判死刑", "en": "Myanmar-border Wei family crime syndicate sentenced: three ringleaders get death penalty", "es": "Sentencia de primera instancia para el cártel de la familia Wei de la frontera con Birmania: tres cabecillas condenados a muerte", "ja": "ミャンマー国境の「魏家」犯罪組織に一審判決 主犯3名に死刑判決"}, "body": {"zh": "缅北魏家犯罪集团案一审宣判，魏怀仁、陈大卫、廖景芳三名被告人被判处死刑——其中陈大卫为向电诈「金主」表诚意，在结拜时随机杀害一名被关禁闭的陌生人。该案与此前央视播出的缅北电诈犯罪集团覆灭纪实相呼应，跨境电诈犯罪集团的司法清算仍在持续推进。", "en": "In the first-instance verdict against the Wei family crime syndicate active on the Myanmar border, defendants Wei Huairen, Chen Dawei and Liao Jingfang were sentenced to death; Chen had killed a stranger held in confinement at random to prove his loyalty to cyber-fraud financiers. The verdict follows the CCTV documentary series that chronicled the takedown of Myanmar-border fraud syndicates, and the judicial reckoning with cross-border scam networks continues.", "es": "En el fallo de primera instancia contra el sindicato criminal de la familia Wei, activo en la frontera con Birmania, los acusados Wei Huairen, Chen Dawei y Liao Jingfang fueron condenados a muerte; Chen mató al azar a un extraño retenido para demostrar lealtad a los financiadores del fraude telemático. La sentencia llega después del documental de CCTV sobre el desmantelamiento de esos cárteles, y el ajuste judicial contra las redes transfronterizas de estafas sigue adelante.", "ja": "ミャンマー国境で活動した「魏家」犯罪組織の一審で、被告人の魏懐仁、陳大衛、廖景芳の3名に死刑判決が下された。うち陳は電信詐欺の「資金提供者」への忠誠を示すため、監禁されていた見ず知らずの人物を無差別に殺害していたという。CCTVのドキュメンタリーが国境電詐組織の壊滅を描いたのに続き、国境を越える詐欺組織への司法の決着が続いている。"}, "why": {"zh": "从荧屏纪实到死刑判决，跨境电诈的「金主—打手」链条被完整摆上台面——威慑意义远超个案本身。", "en": "From on-screen documentary to death sentences, the financier-to-hitman chain of cross-border fraud is laid out in full — the deterrent goes far beyond this one case.", "es": "Del documental a la pena de muerte, la cadena de financiadores y sicarios del fraude transfronterizo queda expuesta: el efecto disuasorio va mucho más allá de este caso.", "ja": "画面のドキュメンタリーから死刑判決へ。国境電詐の「資金屋から実行犯」までの連鎖がすべて明るみに出た。その抑止効果は一事件の枠を超える。"}}, {"idx": "03", "title": {"zh": "2027 年国考报名即将启动 计划招录 3.57 万人", "en": "2027 national civil service exam registration opens soon with 35,700 openings", "es": "Se acerca la inscripción del examen nacional de función pública 2027 con 35.700 plazas previstas", "ja": "2027年国家公務員試験の登録まもなく 採用予定は3万5700人"}, "body": {"zh": "2027 年国考报名即将开始，共计划招录 3.57 万人。河北同日部署严打「公考围岗」——针对个别岗位为特定考生量身定做报考条件的违规操作；市场监管总局 13 日公布 7 起涉导向违法广告典型案例，物化女性、低俗擦边的广告被罚没合计超 250 万元。", "en": "Registration for the 2027 national civil service exam opens soon, with 35,700 positions planned. Hebei province simultaneously announced a crackdown on gerrymandered job requirements written for specific candidates; the market regulator published seven typical cases of improper advertising on Monday, with fines and forfeitures exceeding 2.5 million yuan for ads that objectify women or skirt decency.", "es": "La inscripción del examen nacional de función pública 2027 abre en breve, con 35.700 plazas previstas. Hebei anunció a la vez un endurecimiento contra los perfiles de puesto hechos a medida para candidatos concretos, y el regulador de mercado difundió el lunes siete casos típicos de publicidad ilícita, con multas y decomisos que superan los 2,5 millones de yuanes por anuncios que cosifican a la mujer o rozan el límite de la decencia.", "ja": "2027年国家公務員試験の登録受付が間もなく始まり、採用予定は3万5700人。河北省は同日、特定受験者のために応募条件を「あつらえる」違反行為の取り締まり強化を決めた。市場監督管理総局は13日、女性の対象化や低俗な際どさを含む違法広告の典型例7件を公表し、罰沒額は合計250万元超に上った。"}, "why": {"zh": "招录规模与报考热度再次同框——就业季的「上岸」叙事背后，考试公平与招聘规范是每年都绕不开的话题。", "en": "Scale and demand arrive together again: behind every exam-season race for a government post, exam fairness and hiring rules remain the issues that never go away.", "es": "Escala y demanda vuelven a coincidir: detrás de la carrera por un puesto público en temporada de empleo, la equidad del examen y las reglas de contratación siguen siendo temas ineludibles.", "ja": "採用規模と受験熱がまた並んで登場した。就職シーズンの「安定期」願望の裏で、試験の公平と採用の規範は毎年外せない論点だ。"}}, {"idx": "04", "title": {"zh": "重庆市委原副书记、市政府原市长黄奇帆被查", "en": "Former Chongqing deputy party chief and mayor Huang Qifan under investigation", "es": "El excargo número dos del partido y exalcalde de Chongqing, Huang Qifan, bajo investigación", "ja": "重慶市党委原副書記・元市長の黄奇帆氏、調査対象に"}, "body": {"zh": "中央纪委国家监委 14 日通报，重庆市委原副书记、市政府原市长黄奇帆涉嫌严重违纪违法，目前正接受纪律审查和监察调查。黄奇帆早年长期在上海工作，2001 年调任重庆市副市长，2010 年起任重庆市市长，2016 年卸任后曾任第十二届全国人大财政经济委员会副主任委员。", "en": "China's top anti-graft bodies announced on Tuesday that Huang Qifan, former deputy party chief and former mayor of Chongqing, is suspected of serious violations of discipline and law and is under review and investigation. Huang spent much of his early career in Shanghai, moved to Chongqing as deputy mayor in 2001, served as mayor from 2010, and after leaving office in 2016 served as deputy director of the Financial and Economic Affairs Committee of the 12th National People's Congress.", "es": "Los órganos anticorrupción anunciaron el martes que Huang Qifan, excargo número dos del partido y exalcalde de Chongqing, está bajo investigación por presuntas violaciones graves de la disciplina y la ley. Huang hizo buena parte de su carrera en Shanghái, llegó a vicealcalde de Chongqing en 2001, fue alcalde desde 2010 y tras dejar el cargo en 2016 fue vicedirector de la Comisión de Asuntos Financieros y Económicos de la XII Asamblea Popular.", "ja": "中央規律検査委員会と国家監察委員会は14日、重慶市党委原副書記・元市長の黄奇帆氏が重大な規律・法違反の疑いで規律審査と監察調査を受けていると通報した。黄氏は若手時代を上海で過ごし、2001年に重慶市副市長へ転任、2010年から市長を務め、2016年の退任後は第12期全国人民代表大会財政経済委員会副主任委員を歴任した。"}, "why": {"zh": "又一名省部级退休高官被查——反腐「不存在既往不咎」的信号再度被强化。", "en": "Another retired provincial-level official under investigation: the message that no one is exempt, not even after leaving office, gets reinforced again.", "es": "Otro alto funcionario retirado a nivel provincial bajo investigación: el mensaje de que nadie queda exento, ni siquiera tras dejar el cargo, se refuerza de nuevo.", "ja": "また退任した省部級幹部が調査対象に。反腐敗は「過去のことは問わない」では済まないというシグナルが改めて強まった。"}}, {"idx": "05", "title": {"zh": "《矿产资源目录》发布 我国重划矿产资源「家底」", "en": "New mineral resources catalogue redefines China's resource inventory", "es": "El nuevo catálogo de recursos minerales reordena el inventario de recursos de China", "ja": "「鉱物資源目録」を発表 中国が鉱物資源の「家底」を再整理"}, "body": {"zh": "新版《矿产资源目录》正式发布，对矿产资源「家底」重新划分，矿种边界与类别更加清晰，为新一轮勘查与开发规划打底。农业农村部同日宣布设立我国首个布氏鲸重要栖息地；全国老旧水库改造提升专项行动也已启动，预计今年年底前全面完成排查评估。", "en": "The new edition of the Mineral Resources Catalogue has been officially released, re-sorting China's mineral resource inventory with clearer boundaries between mineral types and categories to underpin the next round of exploration and development planning. The agriculture ministry announced the same day China's first major habitat reserve for Bryde's whales, and a nationwide campaign to renovate and upgrade ageing reservoirs is under way, with a full survey and assessment due by year end.", "es": "La nueva edición del Catálogo de Recursos Minerales se ha publicado oficialmente, reordenando el inventario minero de China con límites más claros entre tipos y categorías, como base para la próxima ronda de exploración y planificación. El ministerio de Agricultura anunció el mismo día la primera reserva de hábitat importante para ballenas de Bryde del país, y está en marcha una campaña nacional para rehabilitar embalses envejecidos, con un censo y evaluación completos previstos para fin de año.", "ja": "新版の「鉱物資源目録」が正式に発表され、鉱物資源の「家底」が再整理された。鉱種の境界と分類がより明確になり、次の探査・開発計画の土台となる。農業農村部は同日、中国初のニタリクジラ重要生息地の設立を発表。全国の老朽ダム改修・強化特別行動も始動し、年末までに調査評価を完了する見込みだ。"}, "why": {"zh": "资源「家底」、生态栖息地、水利设施三条线同日更新——资源安全与生态保护的政策拼图正在加速补齐。", "en": "Resource inventory, wildlife habitat and reservoir safety all updated the same day — the policy puzzle of resource security and ecological protection is being completed faster.", "es": "Inventario minero, hábitats y embalses actualizados el mismo día: el rompecabezas de seguridad de recursos y protección ecológica se completa cada vez más rápido.", "ja": "資源の「家底」、生息地、ダムの三本柱が同じ日に更新。資源安全と生態保護のパズルが加速的に埋まっていく。"}}]}, {"key": "fin", "num": "03", "color": "#b45309", "deep": "#92400e", "name": {"zh": "金融要闻", "en": "Finance", "es": "Finanzas", "ja": "金融"}, "items": [{"idx": "01", "tag": {"zh": "进展"}, "title": {"zh": "A 股沪指收复 3800 点 两市放量 1.68 万亿", "en": "Shanghai index reclaims 3,800 as mainland turnover swells to 1.68 trillion yuan", "es": "El índice de Shanghái recupera los 3.800 puntos con un volumen de 1,68 billones de yuanes", "ja": "A株、上海総合指数が3800ポイント回復 出来高は1.68兆元に拡大"}, "body": {"zh": "13 日 A 股低开后震荡回升，沪指收涨 0.10% 报 3800.86 点，收复 3800 关口；深证成指跌 0.25%、创业板指跌 0.18%，两市成交 1.68 万亿元、较上一交易日放量 1381 亿元，超 2900 只个股上涨。冰雪旅游、PCB 概念全天爆发，航天军工午后拉涨，海运、油气、餐饮旅游、贵金属涨幅居前，算力硬件板块午后集体反弹；保险领跌，半导体冲高回落。", "en": "Mainland shares dipped at the open on Monday then ground higher, with the Shanghai Composite closing up 0.10 percent at 3,800.86 to reclaim the 3,800 mark; the Shenzhen Component fell 0.25 percent and the ChiNext 0.18 percent. Combined turnover swelled to 1.68 trillion yuan, up 138.1 billion from the previous session, with more than 2,900 stocks rising. Ice-and-snow tourism and PCB names surged all day, aerospace and defence rallied in the afternoon, and shipping, oil and gas, dining-travel and precious metals led gainers, while computing-hardware stocks rebounded in the afternoon; insurance lagged and semiconductors faded late.", "es": "La renta variable china abrió a la baja el lunes pero remontó: el Índice Compuesto de Shanghái cerró con un alza del 0,10 por ciento en 3.800,86 puntos y recuperó la marca de 3.800; el Componente de Shenzhen cayó un 0,25 por ciento y el ChiNext un 0,18 por ciento. El volumen combinado se infló a 1,68 billones de yuanes, 138.100 millones más que en la sesión previa, y subieron más de 2.900 valores. Turismo de nieve y PCB se dispararon, aeroespacial y defensa remontaron por la tarde, y transporte marítimo, petróleo y gas, viajes y metales preciosos lideraron las ganancias; los equipos de cómputo rebotaron por la tarde, mientras el seguro lideró las caídas y los semiconductores se apagaron al final.", "ja": "13日の中国株は安く始まった後に戻し、上海総合指数は前日比0.10％高の3800.86で終わり、3800の節目を回復した。深セン成分指数は0.25％安、創業板は0.18％安。二市場の出来高は1.68兆元に拡大し、前日より1381亿元増加、上昇銘柄は2900超。冰雪観光やプリント基板（PCB）関連が終日堅調で、航空宇宙・軍事が午後に急伸し、海運、石油ガス、飲食旅行、貴金属が上位。計算機ハードウェア株は午後に一斉反発した一方、保険が下落率首位で、半導体は上げ一服となった。"}, "why": {"zh": "上期提示的「量能能否修复站回 3800」当日兑现——缩量调整一天后放量收复，短线修复的关键在于放量能否延续。", "en": "The question flagged last issue — can volume repair and the index hold 3,800 — was answered within a day: a light-volume pullback followed by a heavy-volume reclaim, and now the test is whether that volume lasts.", "es": "La pregunta de la entrega anterior —si el volumen se reponía y el índice sostenía 3.800— se respondió en un día: retroceso con poco volumen y recuperación con mucho; ahora la prueba es si el volumen aguanta.", "ja": "前号で示した「出来高が回復し3800を取り戻せるか」は当日に答えが出た。縮量調整の翌日に増量回復——焦点はこの出来高が続くかどうかに移った。"}}, {"idx": "02", "title": {"zh": "韩国综指暴跌 5.46% 亚太算力链遭遇「黑色星期二」", "en": "Kospi plunges 5.46% as Asia-Pacific computing hardware takes a black Tuesday", "es": "La Kospi se desploma un 5,46 por ciento en un martes negro para el hardware de cómputo asiático", "ja": "韓国総合指数が5.46％暴落 アジア太平洋の計算機チェーンに「黒い火曜日」"}, "body": {"zh": "13 日韩国综合指数收跌 5.46% 报 6035.35 点，SK 海力士跌超 10%、三星电子跌超 7%，日经 225 指数收跌 1.82%——存储与算力硬件成为亚太市场重灾区。国内商品期市日间盘主力合约多数下跌，低硫燃料油涨近 6%、纯苯涨超 4%；国债期货收盘多数上涨，避险与风险偏好同步摇摆。", "en": "South Korea's Kospi sank 5.46 percent to 6,035.35 on Monday, with SK Hynix down more than 10 percent and Samsung Electronics over 7 percent, while Japan's Nikkei 225 fell 1.82 percent — memory and computing hardware bore the brunt across the region. In Chinese commodity futures most main contracts slipped, though low-sulphur fuel oil gained nearly 6 percent and pure benzene over 4 percent; government-bond futures mostly closed higher as risk appetite and hedging swung together.", "es": "La Kospi de Corea del Sur cayó el lunes un 5,46 por ciento hasta 6.035,35 puntos, con SK Hynix perdiendo más del 10 por ciento y Samsung Electronics más del 7 por ciento, y el Nikkei 225 japonés cedió un 1,82 por ciento: la memoria y el hardware de cómputo cargaron con lo peor en la región. En los futuros de materias primas chinas la mayoría bajó, aunque el fuel oil de bajo azufre subió casi un 6 por ciento y el benceno más del 4; los futuros de deuda pública cerraron mayormente al alza, con el apetito por el riesgo y la cobertura moviéndose a la vez.", "ja": "13日の韓国総合指数は5.46％安の6035.35で引け、SKハイニックスは10％超、サムスン電子は7％超下落し、日経平均も1.82％安——メモリーと計算機ハードウェアがアジア太平洋市場の最大の震源地となった。中国の商品先物は主力契約の多くが下落したが、低硫黄燃料油は6％近く、純ベンゼンは4％超上昇。国債先物はおおむね上昇して終わり、リスク選好とヘッジが同時に揺れた。"}, "why": {"zh": "前一日美股算力硬件跳水后跌势向亚太传导——A 股算力链能否独善其身，是本周最大的变数。", "en": "After US computing-hardware names tumbled, the slide spread across the Asia-Pacific; whether China's AI-hardware chain can stay above the fray is the biggest variable this week.", "es": "Tras el desplome del hardware de cómputo en Wall Street, la caída se extendió por Asia-Pacífico; si la cadena china de hardware de IA puede quedar al margen es la mayor incógnita de la semana.", "ja": "米国の計算機ハードウェア急落を受けて下落がアジア太平洋へ波及。A株の計算機チェーンが巻き込まれずに済むかが、今週最大の変数だ。"}}, {"idx": "03", "title": {"zh": "央行批准 Visa 筹设银行卡清算机构", "en": "PBOC approves Visa to prepare a bankcard clearing institution in China", "es": "El banco central aprueba que Visa prepare una cámara de compensación de tarjetas en China", "ja": "人民銀行、Visaによるカード決済清算機関の準備設立を認可"}, "body": {"zh": "中国人民银行批准威士（Visa）公司在中国境内筹备银行卡清算机构，境外银行卡组织获准进入境内清算市场的名单再度扩容。央视午夜新闻同步播报了这一消息——获批后，Visa 可按程序推进机构筹建，未来境内持卡人将在更多场景用到境外卡组织的清算网络。", "en": "The People's Bank of China has approved Visa's plan to prepare a bankcard clearing institution in the Chinese mainland, adding another foreign card network to the list of licensed clearing entrants. CCTV's midnight bulletin carried the news — with approval in hand, Visa can now proceed through the required preparation steps, and domestic cardholders will eventually see foreign card networks' clearing rails in more scenarios.", "es": "El Banco Popular de China aprobó el plan de Visa para preparar una cámara de compensación de tarjetas bancarias en la China continental, ampliando de nuevo la lista de redes extranjeras autorizadas en el mercado de compensación. El informativo de medianoche de CCTV dio la noticia: con la aprobación, Visa puede avanzar en los trámites de constitución, y los titulares de tarjetas verán las redes extranjeras en más escenarios.", "ja": "中国人民銀行は、Visa（威士）による中国国内でのバンクカード清算機関の準備設立を認可した。外資系カードブランドの清算市場参入リストがさらに拡大した。CCTVの深夜ニュースもこのニュースを伝えた。認可を得たVisaは所定の手順で設立準備を進め、今後は国内のカード利用者がより多くの場面で海外カードネットワークの決済網を利用できるようになる。"}, "why": {"zh": "支付清算开放再进一步，入境消费的支付堵点被打通——境内持牌机构的竞争压力也会同步上来。", "en": "Another step in opening payments infrastructure clears a blockage for inbound spending — and the competitive pressure on domestic licensed players rises in step.", "es": "La apertura del sistema de pagos avanza un paso y desatasca el gasto de los visitantes; la presión competitiva sobre los operadores locales sube al mismo ritmo.", "ja": "決済インフラの開放が一歩進み、訪問消費の支払いの詰まりが解消されつつある。同時に国内の免許事業者への競争圧力も高まる。"}}, {"idx": "04", "title": {"zh": "东兴、信达证券 19 日终止上市 中金「三合一」迈入换股窗口", "en": "Dongxing and Cinda Securities delist on the 19th as CITIC Securities' three-way merger enters the share-swap window", "es": "Dongxing y Cinda Securities se deslistan el día 19 y entra la ventana de canje de la fusión triple en torno a CICC", "ja": "東興・信達証券が19日上場廃止 中金の「三合一」再編は株式交換の局面へ"}, "body": {"zh": "东兴证券、信达证券公告将于 10 月 19 日终止上市，中金公司牵头的「三合一」重组随之进入换股窗口期——这场券商供给侧整合进入最后冲刺，换股比例与现金选择权的行使安排成为市场关注的最后变量。", "en": "Dongxing Securities and Cinda Securities have announced they will delist on October 19, pushing the three-way consolidation led by China International Capital Corp into its share-swap window — the supply-side shake-up of the brokerage industry is in its final stretch, with the swap ratio and cash-option arrangements the last variables markets are watching.", "es": "Dongxing Securities y Cinda Securities anunciaron su deslistado el 19 de octubre, llevando la consolidación a tres bandas liderada por CICC a su ventana de canje de acciones: la reestructuración del lado de la oferta del sector bursátil entra en la recta final, y la proporción de canje y la opción de efectivo son las últimas variables en observación.", "ja": "東興証券と信達証券は10月19日に上場廃止となると公告し、中金公司が主導する「三合一」再編は株式交換のウインドー期に入った。証券業界の供給側統合が最終スパートを迎え、交換比率と現金選択権の行使安排が市場が注視する最後の変数となっている。"}, "why": {"zh": "券商供给侧整合再下一城——换股窗口既是套利资金的最后博弈点，也是行业格局重排的分水岭。", "en": "Another consolidation win for the brokerage sector: the swap window is both the arbitrage crowd's last battleground and the watershed for the industry's reshuffled order.", "es": "Otra conquista de la consolidación bursátil: la ventana de canje es a la vez la última batalla del dinero de arbitraje y la línea divisoria del nuevo mapa sectorial.", "ja": "証券業界の供給側統合がまた一歩前進。交換ウインドーはアービトラージ資金の最後の駆け引き場であり、業界再編の分水嶺でもある。"}}, {"idx": "05", "title": {"zh": "Meta 发布 Muse Wonder 自称达 AI「前沿」水平", "en": "Meta unveils Muse Wonder, claiming frontier-level AI", "es": "Meta presenta Muse Wonder y reivindica una IA de nivel frontera", "ja": "MetaがMuse Wonderを発表 「フロンティア」レベルを主張"}, "body": {"zh": "Meta 推出新一代模型 Muse Wonder，扎克伯格称其比肩 GPT-6、已达 AI「前沿」水平；字节跳动 Seed 同日成立安全与对齐部门，聚焦智能体安全与前沿风险。大模型竞赛从跑分进入「前沿」口径互相认领的阶段，AI 安全与对齐也从口号变成正式编制。", "en": "Meta rolled out its new Muse Wonder model, with Mark Zuckerberg claiming it stands alongside GPT-6 and has reached AI's frontier level; ByteDance's Seed unit set up a safety and alignment division the same day, focused on agent safety and frontier risks. The large-model race has moved from benchmark scores to competing claims of frontier status, and AI safety and alignment are turning from slogans into real org charts.", "es": "Meta lanzó su nuevo modelo Muse Wonder, y Mark Zuckerberg afirmó que se equipara al GPT-6 y alcanza el nivel frontera de la IA; la unidad Seed de ByteDance creó ese mismo día una división de seguridad y alineación centrada en la seguridad de agentes y los riesgos de frontera. La carrera de los grandes modelos pasa de los benchmarks a los titulares rivales de estatus frontera, y la seguridad y alineación de la IA dejan de ser eslóganes para aparecer en el organigrama.", "ja": "Metaは新世代モデル「Muse Wonder」を発表し、ザッカーバーグ氏はGPT-6に比肩しAIの「フロンティア」レベルに達したと主張した。ByteDanceのSeedも同日、エージェント安全とフロンティアリスクに焦点を当てた安全・アライメント部門を新設。大規模モデル競争はベンチマーク競争から「フロンティア」名乗り合いの段階へ移り、AI安全とアライメントはスローガンから正式な組織編制へ変わっている。"}, "why": {"zh": "「前沿」的认证权成了新战场，AI 安全从口号变成部门编制——技术竞赛与行业治理在同一个节点上加速。", "en": "Who gets to certify frontier status is the new battleground, and AI safety is turning from slogan to staffing — technology racing and industry governance accelerating at the same node.", "es": "Quién certifica el estatus frontera es el nuevo campo de batalla, y la seguridad de la IA pasa de eslogan a plantilla: la carrera tecnológica y la gobernanza se aceleran en el mismo punto.", "ja": "「フロンティア」の認定権が新たな戦場となり、AI安全はスローガンから部門編制へ。技術競争と業界ガバナンスが同じ節目で加速している。"}}]}, {"key": "spo", "num": "04", "color": "#15803d", "deep": "#166534", "name": {"zh": "体育竞技", "en": "Sports", "es": "Deportes", "ja": "スポーツ"}, "items": [{"idx": "01", "tag": {"zh": "进展"}, "title": {"zh": "兹维列夫带伤鏖战 2 小时 41 分钟 晋级上海大师赛八强", "en": "Zverev battles 2 hours 41 minutes on a sore ankle to reach the Shanghai Masters quarterfinals", "es": "Zverev aguanta 2 horas y 41 minutos con el tobillo doliente y alcanza los cuartos del Masters de Shanghái", "ja": "ズベレフ、痛む足首で2時間41分の激闘を制し上海マスターズ8強へ"}, "body": {"zh": "13 日夜场，已提前锁定年终世界第一的兹维列夫 7:6(6)、4:6、7:6(1) 险胜 19 号种子布勃利克——首盘挽救 3 个盘点、决胜盘抢七 7:1 收尾，全场耗时 2 小时 41 分钟。他赛中多次按着右脚踝，赛后承认脚踝「又出状况」，但强调除 2022 年法网外生涯从未退赛。这是他时隔 7 年重返上海八强，下轮对阵同样受困伤病的德米纳尔。", "en": "On Monday night, having already clinched the year-end No. 1, Zverev edged 19th seed Bublik 7:6(6), 4:6, 7:6(1) — saving three set points in the first set and closing the decider's tiebreak 7:1 — in a 2-hour-41-minute war. He pressed his right ankle repeatedly during play and admitted afterwards it was acting up again, but stressed he has never retired from a match except at the 2022 French Open. It is his first Shanghai quarterfinal in seven years, against an also-injured de Minaur next.", "es": "El lunes por la noche, ya asegurado el número uno de fin de año, Zverev superó al 19.º cabeza de serie Bublik por 7:6(6), 4:6 y 7:6(1) —salvó tres puntos de set en la primera manga y cerró la muerte súbita decisiva 7:1— en una guerra de 2 horas y 41 minutos. Apoyó varias veces el tobillo derecho durante el partido y admitió después que volvió a molestarle, aunque recalcó que nunca se ha retirado salvo en Roland Garros 2022. Vuelve a cuartos en Shanghái tras siete años, contra un de Minaur también lesionado.", "ja": "13日夜、すでに年末世界1位を確定させたズベレフが、第19シードのブブリクを7:6(6)、4:6、7:6(1)で破った。第1セットで3本のセットポイントを救い、ファイナルセットのタイブレークを7:1で締める激闘は2時間41分。試合中は何度も右足首を押さえ、試合後は「また調子を崩した」と認めたが、2022年全仏を除いて生涯リタイアしたことがないと強調した。7年ぶりの上海8強で、次は同じく故障がちのデミノーと対戦する。"}, "why": {"zh": "年终第一已到手、排名回报极小仍坚持上场——追逐个人第 8 座大师赛冠军的身体代价，是他和团队最现实的取舍题。", "en": "With the year-end No. 1 secured and little ranking left to gain, every match costs his ankle — chasing an eighth Masters title is now a live risk-reward decision for him and his team.", "es": "Con el número uno de fin de año asegurado y apenas puntos por ganar, cada partido le cuesta al tobillo: la búsqueda de un octavo Masters es ya una decisión de riesgo y beneficio para él y su equipo.", "ja": "年末1位が確定し、ランキングの見返りはほぼないのに試合を続ける。8つ目のマスターズタイトルを追う体への代償は、彼とチームにとって最も現実的な選択問題だ。"}}, {"idx": "02", "title": {"zh": "上海大师赛八强决出四席 前十种子仅剩两人", "en": "Four Shanghai Masters quarterfinalists decided, only two top-ten seeds left", "es": "Cuatro cuartofinalistas decididos en el Masters de Shanghái, solo quedan dos top ten", "ja": "上海マスターズ8強が4枠決定 トップ10シードはわずか2人"}, "body": {"zh": "弗基纳 2:1 掀翻携上海 9 连胜而来的胡尔卡奇——首盘 1:6 失利后连扳两盘、决胜盘抢七 8:6 险胜，终结对手的赛会连胜；法国小将吉亚连克谢尔顿、门希克两位种子，生涯首进大师赛八强；德米纳尔直落两盘淘汰卡恰诺夫。八强前四席中前十球员仅剩兹维列夫与德米纳尔，中国外卡小将周意苦战三盘不敌胡尔卡奇止步 16 强。", "en": "Fucsovics toppled Hurkacz, who arrived on a nine-match Shanghai winning streak — dropping the first set 1:6 then taking two straight, including an 8:6 final tiebreak; a low-ranked French youngster took out Shelton and then Mensik to reach his first Masters quarterfinal; de Minaur dismissed Khachanov in straight sets. Of the first four quarterfinal slots only Zverev and de Minaur are top-ten players, while Chinese wildcard Zhou Yi pushed Hurkacz to three sets before falling in the round of 16.", "es": "Fucsovics derribó a Hurkacz, que llegaba con nueve victorias seguidas en Shanghái: cedió la primera manga 1:6 y ganó dos seguidas, con muerte súbita final de 8:6; el clasificado francés se llevó a Shelton y luego a Mensik para lograr su primer cuartos de Masters; de Minaur despachó a Khachanov en dos sets. De las cuatro plazas decididas, solo Zverev y de Minaur son top ten; el invitado chino Zhou Yi cayó en tres sets ante Hurkacz en octavos.", "ja": "フクソヴィチが上海9連勝で臨んだフルカチュを2:1で破った。第1セットを1:6で落とした後2セット連取し、ファイナルタイブレークは8:6。フランスの若手はシェルトンに続いてメンシクも倒し、生涯初のマスターズ8強入り。デミノーはカチャーノフをストレートで一蹴した。決まった4枠のうちトップ10はズベレフとデミノーだけ。中国のワイルドカード、周意はフルカチュに3セットの末16強で敗れた。"}, "why": {"zh": "阿尔卡拉斯、辛纳、德约相继出局后签表彻底洗牌——黑马成色几何，八强之后见真章。", "en": "With Alcaraz, Sinner and Djokovic all gone, the draw has been fully reshuffled — how real these dark horses are will be settled from the quarterfinals on.", "es": "Con Alcaraz, Sinner y Djokovic fuera, el cuadro quedó del todo revuelto: la verdadera talla de estos outsiders se verá desde cuartos.", "ja": "アルカラス、シナー、ジョコビッチが相次ぎ姿を消し、ドローは大混乱。この黒馬たちの本物度は、8強からが本番だ。"}}, {"idx": "03", "tag": {"zh": "进展"}, "title": {"zh": "亚冠次轮国安客胜海港平 中超两强延续不败", "en": "AFC Elite round two: Guoan win away, Port draw as Chinese clubs stay unbeaten", "es": "Jornada 2 de la AFC Elite: el Guoan gana fuera y el Port empata, los clubes chinos siguen invictos", "ja": "ACLエリート第2節：国安がアウェー勝利、海港は引分 中超勢は無敗継続"}, "body": {"zh": "13 日亚冠精英联赛第二轮：北京国安客场 1:0 击败九外援首发的泰国武里南联，第 80 分钟替补登场的法比奥头球制胜，门将侯森上半场扑出必进之球；上海海港主场 1:1 战平韩国大田韩亚市民，安佩姆破门 5 分钟后被迪奥戈头球扳平。两轮战罢国安两战全胜积 6 分、海港 1 胜 1 平，中超球队亚冠 4 战 3 胜 1 平保持不败，海港各项赛事不败延续到 10 场。", "en": "In AFC Champions League Elite round two on Monday: Beijing Guoan beat Thailand's Buriram United 1:0 away despite the hosts fielding nine foreigners, with substitute Fabio heading the winner on 80 minutes and goalkeeper Hou Sen denying a certain first-half goal; Shanghai Port drew 1:1 with South Korea's Daejeon Hana Citizen, Ampem scoring before Diogo levelled with a header five minutes later. After two rounds Guoan have six points from two wins and Port four from one win and a draw — Chinese clubs are unbeaten in four ACL games, and Port's overall unbeaten run now stands at ten.", "es": "En la jornada 2 de la AFC Champions League Elite del lunes: el Beijing Guoan ganó 1:0 en casa del Buriram United tailandés, que alineó nueve extranjeros, con el cabezazo del suplente Fabio al minuto 80 y el portero Hou Sen negando un gol cantado en la primera parte; el Shanghai Port empató 1:1 con el Daejeon Hana Citizen surcoreano, gol de Ampem y empate de Diogo de cabeza cinco minutos después. Tras dos jornadas, el Guoan suma seis puntos y el Port cuatro: los clubes chinos siguen invictos en cuatro partidos y el Port acumula diez sin perder en todas las competiciones.", "ja": "13日のAFCチャンピオンズリーグエリート第2節。北京国安は外国人9人を先発させたタイのブリラム・ユナイテッドにアウェーで1:0勝利。80分に途中出場のファビオが決勝ヘッドを決め、GK侯森は前半に決定的シュートをセーブした。上海海港は韓国の大田韓亜市民と1:1引分。アンペムが先制したが5分後にディオゴのヘッドで同点。2節終了時点で国安は2戦全勝の勝ち点6、海港は1勝1分。中超勢はACLで4戦3勝1分の無敗を継続し、海港は公式戦10試合連続無敗とした。"}, "why": {"zh": "一周双赛之下中超两强亚冠战线不掉链子——周末联赛的体能分配，才是真正的考验。", "en": "Two matches a week and the Chinese pair still refuse to slip on the continental stage — the real test is how they budget legs for the weekend league.", "es": "Con dos partidos por semana, los dos clubes chinos no tropiezan en el escenario continental: la verdadera prueba es dosificar piernas para la liga del fin de semana.", "ja": "週2試合の過密日程でも中国の2強は大陸の舞台で足を滑らせない。本当の試練は週末のリーグ戦への体力の割り振りだ。"}}, {"idx": "04", "tag": {"zh": "进展"}, "title": {"zh": "武网郭涵煜挽救 3 个赛点 爆冷逆转科斯蒂亚", "en": "Guo Hanyu saves three match points to stun 12th seed Cirstea at the Wuhan Open", "es": "Guo Hanyu salva tres puntos de partido y da la sorpresa ante Cirstea en el Open de Wuhan", "ja": "武漢オープン：郭涵煜が3本のマッチポイントを救いコステアに大逆転勝ち"}, "body": {"zh": "武汉网球公开赛 13 日，持外卡出战的郭涵煜在 1:6、0:4 落后局面下顽强回追，以 1:6、7:6(6)、7:5 逆转 12 号种子科斯蒂亚——决胜盘 3:5 落后时连赢四局，耗时 2 小时 41 分钟，职业生涯首次击败世界前 20、取得武网单打正赛首胜。王曦雨鏖战 2 小时 55 分不敌 17 岁斯洛伐克小将波汉科娃止步次轮，张帅首轮出局；徐一璠/汤千慧晋级女双 16 强。", "en": "At the Wuhan Open on Monday, wildcard Guo Hanyu came back from 1:6, 0:4 down to beat 12th seed Sorana Cirstea 1:6, 7:6(6), 7:5 — winning four straight games from 3:5 in the decider during a 2-hour-41-minute battle, her first career win over a top-20 player and her first main-draw victory in Wuhan. Wang Xiyu fell after 2 hours 55 minutes to Slovakia's teenage player Pohancova, Zhang Shuai lost in the first round, while Xu Yifan and Tang Qianhui advanced to the doubles round of 16.", "es": "En el Open de Wuhan del lunes, la invitada Guo Hanyu remontó un 1:6 y 0:4 para vencer a la 12.ª cabeza de serie Sorana Cirstea por 1:6, 7:6(6) y 7:5 —cuatro juegos seguidos desde el 3:5 de la manga decisiva en 2 horas y 41 minutos—, su primera victoria sobre una top 20 y su primer triunfo en el cuadro principal de Wuhan. Wang Xiyu cayó en 2 horas 55 minutos ante la eslovaca Pohancova, Zhang Shuai perdió en primera ronda y Xu Yifan con Tang Qianhui avanzaron a octavos de dobles.", "ja": "武漢オープン13日、ワイルドカードの郭涵煜が1:6、0:4の劣勢から粘り、第12シードのコステアを1:6、7:6(6)、7:5で逆転破りした。ファイナルセット3:5から4ゲーム連取、試合時間2時間41分。キャリアで初めて世界トップ20に勝利し、武漢の本戦初勝利を挙げた。王曦雨は2時間55分の接戦の末、17歳のスロバキアの若手ポハンコワに敗れて2回戦敗退。張帥は1回戦で敗れ、徐一璠/湯千慧組は女子ダブルス16強へ進んだ。"}, "why": {"zh": "郑钦文伤退后武网东道主光环一度暗淡，郭涵煜这场逆转把本土看点重新拉回中心球场。", "en": "After Zheng Qinwen's withdrawal dimmed the home glow in Wuhan, Guo's comeback puts local interest right back on centre court.", "es": "Tras el retiro de Zheng Qinwen apagó el brillo local en Wuhan, la remontada de Guo devuelve el interés anfitrión a la pista central.", "ja": "鄭欽文の欠場で地元の光が弱まっていた武漢だが、郭の大逆転が再びセンターに注目を取り戻した。"}}, {"idx": "05", "title": {"zh": "中超第 28 轮前瞻：蓉城客场战平即可提前两轮夺冠", "en": "CSL round 28 preview: Rongcheng need only a draw away to clinch the title with two rounds to spare", "es": "Previa de la jornada 28 de la CSL: al Rongcheng le basta empatar fuera para ser campeón con dos jornadas de sobra", "ja": "中超第28節プレビュー：蓉城はアウェー引分で2節を残し優勝決定へ"}, "body": {"zh": "中超第 28 轮焦点战将于 18 日 20:00 打响，上海海港坐镇浦东主场迎战领头羊成都蓉城——蓉城目前 52 分领先大连英博 9 分，客场只需 1 分即可提前两轮锁定队史首冠；上轮主场 0:1 遭津门虎补时绝杀后，蓉城已连续错失冠军点。若海港取胜，冠军悬念将保留至第 29 轮蓉城主场对大连英博的直接对话；青岛海牛已提前降级。", "en": "The round-28 spotlight kicks off at 20:00 on October 18, with Shanghai Port hosting pacesetters Chengdu Rongcheng, who lead Dalian Yingbo by nine points on 52 and need just one point away to seal their first-ever title with two rounds to spare; they have already let championship points slip, including last round's stoppage-time home defeat to Tianjin. A Port win would keep the race alive until round 29's direct clash between Rongcheng and Yingbo; Qingdao Hainiu are already relegated.", "es": "El partidazo de la jornada 28 se juega a las 20:00 del 18 de octubre: el Shanghai Port recibe al líder Chengdu Rongcheng, que marcha con 52 puntos, nueve más que el Dalian Yingbo, y solo necesita un punto fuera para asegurar el primer título de su historia con dos jornadas de margen; ya dejó escapar ocasiones de campeonato, incluida la derrota casera en el descuento ante Tianjin. Si el Port gana, la pelea seguirá hasta el duelo directo de la jornada 29 entre Rongcheng y Yingbo; el Qingdao Hainiu ya está descendido.", "ja": "中超第28節の注目一戦は10月18日20:00開始。上海海港のホームに首位の成都蓉城が乗り込む。蓉城は現在52分で大連英博に9差をつけ、アウェーで勝ち点1を取れば2節を残して球団史上初の優勝を決める。前節はホームで天津津門虎にアディショナルタイムの勝ち越しを許しており、優勝の決定機を連続で逃している。海港が勝てば第29節の蓉城対英博の直接対決へ持ち越される。青島海牛はすでに降格が決定している。"}, "why": {"zh": "「只需 1 分」的客场作战最考验心态——是提前加冕，还是把悬念拖进凤凰山的荣誉之战，周日揭晓。", "en": "Needing just one point away is as much a mental test as a footballing one: early coronation on Sunday, or the title race dragged into a Phoenix Mountain showdown.", "es": "Necesitar solo un punto fuera es tanto prueba mental como futbolística: coronación anticipada el domingo o la pelea arrastrada hasta el duelo de honor en Phoenix Mountain.", "ja": "「勝ち点1だけ」のアウェー戦はメンタルが最大の試練。日曜に即座に戴冠するか、鳳凰山の決戦へ引き延ばすか。"}}]}, {"key": "hot", "num": "05", "color": "#6d28d9", "deep": "#581c87", "name": {"zh": "网络热点", "en": "Trending", "es": "Tendencias", "ja": "話題"}, "items": [{"idx": "01", "title": {"zh": "洗衣凝珠爆裂致角膜腐蚀 「爱用洗衣凝珠的人天塌了」上热搜", "en": "Bursting laundry pods linked to cornea damage as a hashtag explodes", "es": "Las cápsulas de lavadora que estallan dañan la córnea y estallan en redes", "ja": "洗濯ジェルボール破裂で角膜損傷 ハッシュタグが拡散"}, "body": {"zh": "话题 #爱用洗衣凝珠的人天塌了# 冲上热搜——有网友称洗衣凝珠炸裂后洗涤剂溅入眼睛，就医发现角膜被腐蚀。资料显示，洗衣凝珠的高浓度表面活性剂与碱性助剂占比可达 80% 以上，腐蚀性远高于日常洗衣液；医生提醒，溅入眼睛后应立即用流动冷水持续冲洗至少 15 分钟、不要揉眼，并尽快到眼科急诊处理。", "en": "The hashtag loved-by-laundry-pod-users-the-sky-is-falling surged as netizens described pods bursting and detergent splashing into eyes, with one user finding part of her cornea corroded after treatment. Data cited show the concentrated surfactants and alkaline builders in pods can exceed 80 percent, far more corrosive than regular detergent; doctors advise rinsing the eye under running cold water for at least 15 minutes without rubbing and seeking emergency eye care immediately.", "es": "La etiqueta del cielo-cae-para-los-fans-de-las-cápsulas se disparó tras relatos de cápsulas que estallan y detergentes que salpican a los ojos; una usuaria descubrió parte de la córnea corroída tras el tratamiento. Los datos citados indican que los tensoactivos concentrados y los álcalis de las cápsulas superan el 80 por ciento, mucho más corrosivos que el detergente común; los médicos aconsejan lavar con agua fría corriente al menos 15 minutos sin frotarse y acudir ya a urgencias oftalmológicas.", "ja": "#洗濯ジェルボール派が青ざめた# のような話題が検索急上昇。ジェルボールが破裂して洗剤が目に飛び、受診したところ角膜の一部が腐食していたという投稿が相次いだ。資料によれば、ジェルボールの高濃度界面活性剤とアルカリ助剤の割合は80％超に達し、通常の洗濯洗剤より腐食性がはるかに高い。医師は、目に入った場合は流水の冷水で15分以上洗い流し、こすらず、できるだけ早く眼科救急を受診するよう注意を呼び掛けている。"}, "why": {"zh": "家家都在用的日用品被贴上「隐形腐蚀」标签——使用姿势与存放位置这两个细节，值得全家重新学一遍。", "en": "A household staple just got the invisible-corrosion label; how you use it and where you store it are two details worth relearning for the whole family.", "es": "Un básico del hogar acaba de recibir la etiqueta de corrosión invisible: cómo usarlo y dónde guardarlo son dos detalles que conviene reaprender en familia.", "ja": "どの家庭にもある日用品に「見えない腐食」のラベルが付いた。使い方と保管場所、この二つの細部を家族全員で学び直す価値がある。"}}, {"idx": "02", "tag": {"zh": "进展"}, "title": {"zh": "雅思机考连续四天取消 14 日起全面恢复", "en": "IELTS computer tests cancelled four days running, full service returns on the 14th", "es": "El IELTS por ordenador se cancela cuatro días seguidos y se reanuda todo el 14", "ja": "IELTSコンピュータ試験が4日連続中止 14日から全面再開へ"}, "body": {"zh": "继 10 月 10 日至 12 日雅思机考连续三天因技术原因取消后，13 日考试再度取消——主办方称系英国文化教育协会技术故障所致，已向受影响考生全额退还报考费。10 月 14 日起全面恢复考试，19 日、20 日为受影响考生增设两天免费专场，异地考生还可申请交通与住宿费用报销。", "en": "After IELTS computer-based tests were scrapped for three straight days on October 10-12 for technical reasons, Monday's session was cancelled too — the organiser blamed a technical failure at the British Council and has refunded all affected candidates in full. Testing resumes fully on October 14, with two free make-up days on October 19 and 20, plus travel and accommodation reimbursement for out-of-town candidates.", "es": "Tras suspenderse tres días seguidos del 10 al 12 de octubre por fallos técnicos, la sesión del lunes del IELTS por ordenador también se canceló: el organizador lo atribuyó a una avería técnica del British Council y ha reembolsado íntegramente a los afectados. Las pruebas se reanudan por completo el 14 de octubre, con dos días gratuitos de reposición el 19 y el 20 y reembolso de transporte y alojamiento para candidatos de otras ciudades.", "ja": "10月10〜12日に技術的原因で3日連続中止となったIELTSコンピュータ試験は、13日も再び中止となった。主催者は英国文化振興会の技術トラブルが原因と説明し、影響を受けた受験者に受験料を全額返金済みという。10月14日から試験は全面再開。19日と20日には無料の追加開催日が設けられ、遠方からの受験者には交通費・宿泊費の払い戻しも用意された。"}, "why": {"zh": "国际考试第一次出现连续四天「停摆」——应急体系的空白比技术故障本身更值得复盘，赶申请季的考生最需要的是确定性。", "en": "A four-day blackout is a first for an international exam — the missing contingency plan matters more than the glitch itself, and what application-season candidates need most is certainty.", "es": "Un apagón de cuatro días es inédito en un examen internacional: importa más el plan de contingencia ausente que la avería, y lo que necesitan los candidatos en plena temporada de admisiones es certeza.", "ja": "国際試験で4日連続の「停止」は前例がない。技術トラブルそのものより、応急体制の空白こそ検証に値する。出願シーズンの受験者に最も必要なのは確実性だ。"}}, {"idx": "03", "title": {"zh": "员工用 AI 辅助办公被辞退 法院：合理使用不构成违规", "en": "Fired for using AI at work, employee wins: reasonable use is no misconduct, court rules", "es": "Despedido por usar IA en el trabajo, el empleado gana: el uso razonable no es falta, falla el tribunal", "ja": "業務でAIを使い解雇された社員が勝訴 裁判所「合理的利用は違反に当たらない」"}, "body": {"zh": "一名员工因借助 AI 辅助办公遭公司辞退，法院最终认定其合理使用 AI 不构成违规，用人单位以此解除劳动合同缺乏依据。从「AI 生成内容算不算原创」到「AI 办公算不算摸鱼」，司法系统正在给职场 AI 化补上规则注脚。", "en": "An employee dismissed for using AI tools to assist his work won in court, which found that reasonable use of AI does not constitute misconduct and that the employer's grounds for terminating the contract did not stand. From whether AI-generated content counts as original work to whether AI use counts as slacking, the judiciary is writing the missing footnotes for the AI-ised workplace.", "es": "Un empleado despedido por usar herramientas de IA para asistir su trabajo ganó en los tribunales, que determinaron que el uso razonable de la IA no constituye una falta y que los motivos del despido no se sostenían. De si el contenido generado por IA cuenta como obra original a si usar IA es ser un vago, la judicatura va escribiendo las notas que faltaban para la oficina con IA.", "ja": "業務補助にAIを使ったことを理由に解雇された社員が、裁判で勝利した。裁判所は、AIの合理的利用は違反行為に当たらず、使用者側の解雇の根拠は成立しないと認定した。AI生成物はオリジナルか、AI使用はサボりか——司法が職場のAI化に欠けていた注釈を書き加えつつある。"}, "why": {"zh": "越来越多公司一边喊着「全员 AI 化」一边提防员工用 AI——这纸判决把边界画在「合理使用」上，用人单位的制度得跟上。", "en": "Plenty of firms shout all-in-on-AI while policing employees who use it; the court drew the line at reasonable use — company policies now have to catch up.", "es": "Muchas empresas corean IA para todos mientras vigilan a quien la usa; el tribunal trazó la frontera en el uso razonable, y las políticas internas tienen que ponerse al día.", "ja": "「全社AI化」を叫びながら、使う社員を監視する企業は少なくない。判決は境界を「合理的利用」に引いた。使用者側の制度が追いつかねばならない。"}}, {"idx": "04", "title": {"zh": "「四无婚礼」被人民日报点赞 95 后新娘 41 秒致辞开席", "en": "The four-nothing wedding wins People's Daily praise after a 41-second father speech", "es": "La boda sin nada recibe el aplauso del Diario del Pueblo tras un discurso paterno de 41 segundos", "ja": "「四無婚礼」が人民日報に絶賛 父の挨拶は41秒で宴開き"}, "body": {"zh": "宁波一位 95 后新娘的「四无婚礼」刷屏：无接亲、无婚车、无司仪、无跟妆摄影，新人自驾到场，新娘父亲上台 41 秒说完「吃好喝好」直接开席。人民日报评论指出，移风易俗，移的是攀比和折腾，易的是真诚和自在；2026 年中央一号文件明确持续整治农村高额彩礼、培育简约文明的婚俗文化。", "en": "A Ningbo bride born after 1995 went viral for her four-nothing wedding: no bridal pickup, no motorcade, no emcee, no makeup-and-photo crew; the couple drove themselves to the venue, her father spoke for 41 seconds — eat well, drink well — and dinner began. People's Daily commented that changing customs means discarding one-upmanship and fuss while keeping sincerity and ease, noting the 2026 No. 1 central document calls for curbing hefty rural bride prices and nurturing simpler wedding culture.", "es": "Una novia de Ningbo nacida después de 1995 se hizo viral con su boda sin nada: sin recogida de la novia, sin coche nupcial, ni maestro de ceremonias, ni equipo de maquillaje y fotos; los novios llegaron conduciendo, el padre habló 41 segundos —comed bien, bebed bien— y se sirvió la cena. El Diario del Pueblo comentó que cambiar las costumbres es desechar el exhibicionismo y el jaleo para quedarse con la sinceridad y la comodidad, y recuerda que el documento número 1 central de 2026 pide frenar las dotas rurales desorbitadas y cultivar bodas sencillas.", "ja": "寧波のある95後（1995年以降生まれ）の花嫁が「四無婚礼」で話題になった。嫁入り迎撃なし、婚車なし、司会なし、メイク撮影クルーなし。新郎新婦は自ら車を運転して会場に現れ、花嫁の父は41秒で「食べて飲んで楽しんで」と挨拶を済ませ、そのまま宴が始まった。人民日報は、風俗の改革で移すのは見栄と煩わしさであり、残すのは誠実さと気楽さだと論じ、2026年中央一号文件が農村の高額結納の是正と簡素で文明的な婚礼文化の育成を明記したと紹介した。"}, "why": {"zh": "从「零彩礼」到「四无婚礼」，年轻人用减法办婚礼正在从个人选择变成社会新风——省下的排场，都换成了心意。", "en": "From zero bride price to the four-nothing wedding, young couples' subtraction is turning from personal choice into a social current — the pomp saved is converted into sincerity.", "es": "De la dota cero a la boda sin nada, la resta de los jóvenes pasa de elección personal a corriente social: el boato ahorrado se convierte en cariño.", "ja": "ゼロ結納から「四無婚礼」へ。若者が婚礼を減法で組み立てる流れは個人の選択から社会の新風へ変わりつつある。削った派手さはそのまま心遣いに変わった。"}}, {"idx": "05", "tag": {"zh": "进展"}, "title": {"zh": "蒙古国草原火情逼近边境 消防员「以火攻火」坚守 3 天", "en": "Grass fire from Mongolia nears the border as firefighters fight fire with fire for three days", "es": "El incendio de pastizales de Mongolia se acerca a la frontera mientras los bomberos combaten fuego con fuego desde hace tres días", "ja": "モンゴルの草原火災が国境に接近 消防隊が「火で火を防ぐ」3日間"}, "body": {"zh": "蒙古国草原火情逼近我国边境，中蒙边境阻火现场，消防员采取「以火攻火」方式开设隔离带，在山上坚守 3 天、困了席地而眠，目前火情仍在堵截中。", "en": "A grass fire burning in Mongolia has pushed toward the Chinese border; along the China-Mongolia frontier, firefighters are cutting firebreaks by burning ahead of the flames, holding positions in the hills for three days and sleeping on the ground when exhausted, with the blaze still being contained.", "es": "Un incendio de pastizales en Mongolia avanza hacia la frontera china; en el frente fronterizo, los bomberos abren cortafuegos quemando por delante de las llamas, llevan tres días en las colinas durmiendo en el suelo cuando caen rendidos, y el fuego sigue en contención.", "ja": "モンゴル国内の草原火災が中国国境に接近している。中蒙国境の防火現場では、消防隊が「火で火を防ぐ」方式で防火帯を開設し、山中で3日間体制を維持、疲れると地面に寝転んで眠るという状況だ。火災は現在も封じ込め作業が続いている。"}, "why": {"zh": "边境火线背后是连续作战的扑火队员——堵截进展与风向变化，决定这场跨境火情的最终走向。", "en": "Behind the border fire line are crews working day after day; containment progress and wind shifts will decide where this cross-border blaze ends up.", "es": "Tras la línea de fuego fronteriza hay cuadradas trabajando día tras día; el avance del confinamiento y los cambios de viento decidirán el desenlace de este incendio transfronterizo.", "ja": "国境の防火線の後ろには連日戦い続ける消防隊がいる。封じ込めの進捗と風向きの変化が、この越境火災の最終的な行方を決める。"}}]}, {"key": "ent", "num": "06", "color": "#db2777", "deep": "#be185d", "name": {"zh": "娱乐八卦", "en": "Entertainment", "es": "Espectáculos", "ja": "エンタメ"}, "items": [{"idx": "01", "title": {"zh": "张艺兴官宣赴洛杉矶读电影专业 「正式成为一名大学生」", "en": "Lay Zhang enrolls to study film in Los Angeles: officially a university student", "es": "Lay Zhang se matricula en cine en Los Ángeles: oficialmente estudiante universitario", "ja": "張芸興、ロサンゼルスで映画専攻の大学生に 「正式に大学生になりました」"}, "body": {"zh": "13 日张艺兴在海外社交平台用中英双语发文：「拿到了目标托福分数，正式成为一名大学生」，定位洛杉矶，主修电影方向，计划系统学习 2—3 年。17 岁赴韩当练习生放弃高考的他，曾在哈佛演讲时称这是「一直以来的遗憾」；8 月底已低调飞抵美国，出发前一天刚完成电影《绽放》杀青。", "en": "On Monday Lay Zhang posted in Chinese and English: I got my target TOEFL score and am officially a university student — geotagged Los Angeles, majoring in film, planning two to three years of systematic study. The star who gave up gaokao at 17 to become a trainee in Korea has called that his long-standing regret in a Harvard speech; he quietly flew to the US in late August, one day after wrapping the film Blossom.", "es": "El lunes Lay Zhang publicó en chino e inglés: conseguí la nota de TOEFL que me fijé y soy oficialmente estudiante universitario — con ubicación en Los Ángeles, especialidad de cine y entre dos y tres años de estudio sistemático previstos. Quien renunció al gaokao a los 17 años para ser trainee en Corea llamó eso su gran arrepentimiento en una charla en Harvard; voló a Estados Unidos a finales de agosto, un día después de cerrar el rodaje de la película Blossom.", "ja": "13日、張芸興が海外のSNSに中国語と英語で「目標のTOEFLスコアを取り、正式に大学生になりました」と投稿。位置情報はロサンゼルスで、映画を専攻し、2〜3年の体系的学習を計画しているという。17歳で高考を諦めて韓国で練習生になった彼は、ハーバードでの講演でこれを「ずっと心残りだった」と語っていた。8月末に米国へ静かに渡航しており、出発前日には映画『綻放』の撮影を終えたばかりだった。"}, "why": {"zh": "顶流在事业上升期按下求学暂停键——「年纪非常大的学生」这自我调侃背后，是偶像工业里少见的长期主义。", "en": "A top star hitting pause at the peak of his career — the self-mockery of being a very old student hides a long-termism rarely seen in idol manufacturing.", "es": "Una gran estrella pulsa pausa en plena subida: la broma de ser un estudiante muy mayor esconde un longevidad estratégica poco habitual en la fábrica de ídolos.", "ja": "キャリアの上昇期に学業へ一時停止ボタンを押す。「かなりの年配の学生」と自嘲する裏に、アイドル産業では珍しい長期主義がある。"}}, {"idx": "02", "tag": {"zh": "进展"}, "title": {"zh": "《什么意思夫妇》票房破 3 亿 口碑与话题齐飞", "en": "What a Couple crosses 300 million yuan as buzz and split reviews travel together", "es": "Qué pareja cruza los 300 millones de yuanes entre bombo y críticas divididas", "ja": "『なんとか夫婦』興行収入3億元突破 話題と評価の割れが併走"}, "body": {"zh": "小沈阳夫妇的《什么意思夫妇》累计票房 13 日晚突破 3 亿元，稳居国庆档第二；夫妻俩未拿高额现金片酬而是选择收益分成，沈春阳首次执导院线长片。与此同时路演现场赵家班熟脸集体缺席引发外界猜测；影片口碑分化明显，猫眼约 9.5 分、豆瓣维持在 6 分左右。", "en": "Xiao Shenyang and Shen Chunyang's What a Couple passed 300 million yuan at the box office on Monday night, holding second place from the National Day slate; the couple took revenue shares instead of big upfront fees, with Shen directing her first theatrical feature. The family absence of the Benshan troupe's familiar faces from the roadshow set off speculation, while reviews are clearly split: about 9.5 on Maoyan against roughly 6 on Douban.", "es": "Qué pareja, de Xiao Shenyang y Shen Chunyang, superó los 300 millones de yuanes de taquilla el lunes por la noche y mantiene el segundo puesto del festivo nacional; la pareja optó por participación en ingresos en lugar de grandes cachets, con Shen dirigiendo su primer largo comercial. La ausencia de las caras conocidas de la troupe Benshan en la gira promocional desató especulaciones, y las críticas están claramente divididas: unos 9,5 en Maoyan frente a un 6 en Douban.", "ja": "シャオ・シェンヤン夫妻の『なんとか夫婦』は13日夜に累計興行収入3億元を突破し、国慶節檻の2位をキープしている。夫妻は高額の現金ギャラではなく収益分配を選び、沈春陽は商業長編を初監督。一方で舞台挨拶に本山一族の馴染みの顔がそろって姿を見せず、憶測を呼んでいる。評価は割れており、猫眼は約9.5、豆瓣は6前後を維持している。"}, "why": {"zh": "小成本婚姻喜剧靠「像偷看了自己的婚姻」的细节杀出重围——分成模式能不能复制，比票房数字更值得行业琢磨。", "en": "A low-budget marriage comedy broke through on details that felt like reading your own marriage; whether the revenue-share model can be replicated matters more to the industry than the box-office number.", "es": "Una comedia matrimonial de bajo presupuesto se abrió paso con detalles que parecían espiar tu propio matrimonio; si el modelo de reparto de ingresos se puede copiar importa más al sector que la cifra de taquilla.", "ja": "低予算の結婚コメディは「自分の結婚を覗いたみたい」という細部で勝ち抜いた。収益分配モデルが再現できるかどうかは、興収の数字よりも業界が吟味すべき論点だ。"}}, {"idx": "03", "title": {"zh": "AI 综艺《十万个挑战》播放量破 2 亿 「没有人味」争议出圈", "en": "AI variety show Ten Thousand Challenges tops 200 million views amid no-human-touch debate", "es": "El programa de IA Diez Mil Desafíos supera los 200 millones de vistas entre el debate de falta de alma", "ja": "AIバラエティ『十万个挑战』再生数2億突破 「人間味がない」論争が拡散"}, "body": {"zh": "竞技类 AI 综艺《十万个挑战》靠高密度闯关与反转出圈，账号累计播放量已超 2 亿，「AI 综艺会改变综艺行业吗」同步登上热搜。主创回应称 AI 综艺「本质是套了综艺壳的短片」，很难复制真人综艺的意外与随机性，目前核心在游戏规则与场景设计上，对人的描绘力度不大。", "en": "The competitive AI variety show Ten Thousand Challenges went viral on dense rounds and reversals, with its accounts topping 200 million cumulative views and will-AI-change-variety-TV trending alongside. The makers answered that AI variety is essentially a short film wearing a variety-show shell — it can hardly reproduce the surprises and randomness of human shows, with the current core in game rules and scene design rather than depicting people.", "es": "El concurso de IA Diez Mil Desafíos se hizo viral por sus rondas densas y sus giros, con más de 200 millones de vistas acumuladas en sus cuentas y la pregunta de si la IA cambiará los programas de variedades en tendencias. Sus creadores respondieron que es esencialmente un cortometraje con carcasa de talk-show — difícil de replicar la sorpresa y la aleatoriedad humanas, con el núcleo en reglas de juego y diseño de escenas antes que en retratar personas.", "ja": "競技型AIバラエティ『十万个挑战』が高密度なアタックとどんでん返しで話題を集め、アカウントの累計再生数は2億を超え、「AIバラエティは業界を変えるか」が検索急上昇に並んだ。制作側は「AIバラエティの本質はバラエティの殻をかぶった短編映画」だと答え、真人バラエティの偶然性やランダム性の再現は難しく、現時点の核心はゲームルールとシーン設計にあり、人間の描写の力強さはまだ小さいと認めた。"}, "why": {"zh": "制作方亲自承认「没有人味」却挡不住 2 亿播放——观众看的是新奇还是真情，答案将决定 AI 综艺是风口还是烟花。", "en": "The makers admit there is no human touch, yet 200 million views still arrived; whether audiences want novelty or genuine feeling decides if AI variety is a trend or a firework.", "es": "Los creadores admiten que falta alma humana, pero aun así llegaron los 200 millones; si el público busca novedad o emoción genuina decidirá si esto es corriente o un simple firework.", "ja": "制作側みずから「人間味がない」と認めながらも2億再生。視聴者が求めるのは新奇か真情か——その答えがAIバラエティが流行か花火かを決める。"}}, {"idx": "04", "title": {"zh": "芒果 TV 首批 AI 艺人今日「出道」 主演 AI 真人剧上线", "en": "Mango TV's first AI performers debut today, headlining an AI live-action drama", "es": "Las primeras artistas de IA de Mango TV debutan hoy como protagonistas de un drama de acción real", "ja": "芒果TV初のAIタレントが本日デビュー AI実写ドラマに主演"}, "body": {"zh": "芒果 TV 联合相关团队以完整真人经纪运营模式推出 5 位 AI 艺人，其中林恩娜、展颜拥有独立人设资产库与社交账号，14 日主演的 AI 真人剧《了不起啊朋友》上线，成为内娱首批进入主流剧集主演阵容的 AI 女艺人。", "en": "Mango TV and its partners have launched five AI performers under a full human-agency management model; Lin Enna and Zhan Yan carry independent persona asset libraries and social accounts, and the AI live-action drama They Are Amazing Friends starring them goes online on October 14 — the first AI actresses to enter mainstream Chinese drama casts.", "es": "Mango TV y sus socios lanzan cinco artistas de IA bajo un modelo completo de representación humana; Lin Enna y Zhan Yan cuentan con bibliotecas de personaje y cuentas sociales propias, y el drama de acción real con IA Amigos Increíbles protagonizado por ellas se estrena el 14 de octubre: las primeras actrices de IA en el reparto principal de dramas chinos.", "ja": "芒果TVは関連チームと組み、完全な実在タレント事務所運営モデルで5名のAIタレントを投入した。うち林恩娜と展顔は独立したキャラ資産ライブラリとSNSアカウントを持ち、14日には彼女たちが主演するAI実写ドラマ『了不起啊朋友』が配信開始。中国エンタメで初めて主流ドラマの主演枠に入ったAI女優となる。"}, "why": {"zh": "AI 爱豆从舞台走向剧集主演位——虚拟偶像的「戏份」边界、真人经纪的权责划分，行业没有先例可抄。", "en": "AI idols step from stage to leading roles in drama; the boundaries of a virtual performer's billing and the liabilities of human-style management have no precedent to copy.", "es": "Los ídolos de IA saltan del escenario al protagónico; los límites del papel de una intérprete virtual y las responsabilidades de un agenciamiento humano no tienen precedente que copiar.", "ja": "AIアイドルがステージからドラマの主演席へ。バーチャルタレントの「役割」の境界も、実在型マネジメントの権利責任も、業界に参照できる先例はない。"}}, {"idx": "05", "title": {"zh": "杨超越彭冠英《三分之一的我们》宁波开机", "en": "Yang Chaoyue and Peng Guanying start filming One Third of Us in Ningbo", "es": "Yang Chaoyue y Peng Guanying arrancan el rodaje de Un Tercio de Nosotros en Ningbo", "ja": "楊超越と彭冠英『三分之一的我们』が寧波でクランクイン"}, "body": {"zh": "杨超越、江疏影、彭冠英、邢菲主演的 12 集精品短剧《三分之一的我们》13 日在宁波开机，片场夜戏拥抱路透刷屏，被网友形容为「小白兔与大灰狼」的配对感；剧情围绕一幅名画与一个男人同时消失、三个曾互为情敌的女人被迫联手展开。", "en": "One Third of Us, a 12-episode premium series starring Yang Chaoyue, Jiang Shuying, Peng Guanying and Xing Fei, began filming in Ningbo on Monday; night-set hugging paparazzi shots flooded feeds, with netizens calling the pairing a white rabbit and big bad wolf. The plot follows a famous painting and a man vanishing at once, forcing three women who were once romantic rivals to team up.", "es": "Un Tercio de Nosotros, serie premium de 12 episodios protagonizada por Yang Chaoyue, Jiang Shuying, Peng Guanying y Xing Fei, comenzó a rodarse el lunes en Ningbo; las fotos del abrazo en la escena nocturna inundaron las redes, y los internautas hablan de una pareja de conejita blanca y lobo feroz. La trama gira en torno a un cuadro famoso y un hombre que desaparecen a la vez, forzando a tres mujeres que fueron rivales amorosas a aliarse.", "ja": "楊超越、江疏影、彭冠英、邢菲が主演する12話のプレミアム短編ドラマ『三分之一的我们』が13日、寧波でクランクイン。夜撮のハグシーンがネットを席巻し、ネットユーザーは「白ウサギとオオカミ」のペア感と評した。名画とある男が同時に消え、かつて恋敵だった3人の女性が手を組まざるを得なくなるというストーリーだ。"}, "why": {"zh": "「三女一男」悬疑博弈配置加上短剧化体量——长视频平台冲刺年内内容的又一次精品化实验。", "en": "A three-women-one-man suspense setup in a compact premium format — another quality experiment as streamers sprint toward year-end content.", "es": "Una trama de intriga de tres mujeres y un hombre en formato premium compacto: otro experimento de calidad mientras las plataformas corren hacia el contenido de fin de año.", "ja": "「女3人と男1人」のサスペンス設定をコンパクトなプレミアム形式に載せた、年内コンテンツ合戦に向けたプラットフォームのまた一つの質実験だ。"}}]}]}/*__END__*/;
