tida el 6 de noviembre por el Tribunal Popular del Distrito de Weidu (Xuchang), y la causa contra el comerciante en el Tribunal de Internet de Guangzhou se verá el 10 de diciembre.", "ja": "11 月 7 日、「胖東来が販売する日本製シャンプーの産地が偽装されている」とする動画がネットに出回り、国内生産品を輸入品と偽っていると主張した。11 月 8 日、胖東来は説明を発表した。同様の不実情報は 2026 年 1 月にも出回っており、当時から専任の調査チームを設置。中国側の貿易商である広州平辰貿易を訪ねたうえで、日本のコスメビューティ本社で研究開発センターと生産ラインを実地に確認し、企業資格、通関書類、入国検疫証明、原産地証明、ロット検査記録を項目ごとに検証して映像も記録した。その結果、原産地は日本であり、国内生産や偽装の事実は確認できなかったとしている。同社が提起した民事訴訟は 11 月 6 日付で許昌市魏都区人民法院に受理され、貿易商に対する広州インターネット法院の審理は 12 月 10 日に開かれる予定だ。"}, "why": {"zh": "面对谣言，多数企业的第一反应是发一纸声明；这家选择了买机票、查报关单、再上法庭。辟谣这件事的成本，被完整摆到了台面上。", "en": "Most companies answer a rumour with a press release. This one bought plane tickets, checked customs paperwork and went to court, putting the full cost of rebuttal on the table.", "es": "Ante un bulo, casi todas las empresas responden con un comunicado. Esta compró billetes, revisó documentos aduaneros y acudió a los tribunales, poniendo sobre la mesa el coste completo de desmentirlo.", "ja": "うわさに対して多くの企業は声明を出す。この企業は航空券を買い、通関書類を確認し、法廷に立った。反論にはこれだけのコストがかかるという事実を、そのまま示したことになる。"}}, {"idx": "05", "title": {"zh": "大三学生在宿舍做 AI 漫剧，一年营收超 300 万元", "en": "A Third-Year Student Built an AI Comic-Drama Business From His Dorm and Booked Over 3 Million Yuan", "es": "Un estudiante crea series de cómic con IA desde su habitación y factura más de 3 millones de yuanes", "ja": "大学 3 年生が寮で AI 漫画ドラマを制作、1 年で売上 300 万元超"}, "body": {"zh": "苏州大学未来校区机械电子工程专业大三学生肖天乐，去年 11 月起在宿舍试水 AI 漫剧赛道，曾带 5 人团队 7 天制作 3 部漫剧。不到一年，他带领团队创作数百部作品，其中一部爆款收获 15 亿次播放、单剧创收 200 多万元，整体营收超 300 万元。他已在苏州吴江注册公司，表示未来想打磨出能留在银幕上的好故事。", "en": "Xiao Tianle, a third-year mechatronics student at Soochow University's Future Campus, began experimenting with AI-generated comic dramas from his dormitory last November, once producing three titles in seven days with a team of five. In under a year his team has made hundreds of episodes; one hit drew 1.5 billion views and earned more than 2 million yuan on its own, with overall revenue above 3 million yuan. He has registered a company in Wujiang, Suzhou, and says his goal is to craft stories good enough to last on the big screen.", "es": "Xiao Tianle, estudiante de tercer curso de mecatrónica en el campus Future de la Universidad de Soochow, empezó a experimentar el pasado noviembre con series de cómic generadas por IA desde su habitación; llegó a producir tres títulos en siete días con un equipo de cinco personas. En menos de un año el equipo ha hecho cientos de episodios; uno de los éxitos acumuló 1.500 millones de reproducciones y más de 2 millones de yuanes por sí solo, con una facturación total superior a 3 millones. Ha registrado una empresa en Wujiang (Suzhou) y dice que su meta es crear historias que perduren en la pantalla grande.", "ja": "蘇州大学未来キャンパス機械電子工学専攻の 3 年生、肖天楽氏は昨年 11 月から寮で AI 漫画ドラマの制作を始め、5 人のチームで 7 日間に 3 本を制作したこともある。1 年足らずでチームは数百本を手がけ、うち 1 本は再生 15 億回、単体で 200 万元余りの収入を生み、全体の売上は 300 万元を超えた。すでに蘇州呉江に会社を設立し、今後はスクリーンに残る物語を作りたいと話している。"}, "why": {"zh": "「宿舍、五个人、七天三部」这三个数字，比营收更能说明内容行业的门槛正在被重写。接下来拼的不是能不能做，而是做出来有没有人记得。", "en": "A dorm, five people, three titles in seven days — those numbers say more than the revenue about how the barriers in content are being rewritten. The next contest is not whether you can make something, but whether anyone remembers it.", "es": "Una habitación, cinco personas, tres títulos en siete días: esas cifras dicen más que la facturación sobre cómo se reescriben las barreras del sector. La siguiente disputa no es poder producir, sino que alguien lo recuerde.", "ja": "寮、5 人、7 日で 3 本。この三つの数字は売上以上に、コンテンツ業界の参入障壁が書き換えられていることを示す。次の競争は「作れるか」ではなく「記憶に残るか」だ。"}}]}, {"key": "ent", "num": "06", "color": "#db2777", "deep": "#ad1a5e", "name": {"zh": "娱乐八卦", "en": "ENTERTAINMENT", "es": "ESPECTÁCULOS", "ja": "エンタメ"}, "items": [{"idx": "01", "tag": {"zh": "进展"}, "title": {"zh": "金鸡奖今日提名表彰，明晚揭晓 20 个奖项", "en": "Golden Rooster Nominees Honoured Today; 20 Awards Announced Tomorrow Night", "es": "Hoy se homenajea a los nominados al Gallo de Oro; mañana se anuncian los 20 premios", "ja": "金鶏賞は今日ノミネート表彰、明日夜に 20 賞を発表"}, "body": {"zh": "2026 年中国金鸡百花电影节 11 月 6 日至 10 日在厦门举办。11 月 9 日 15 时，第 39 届中国电影金鸡奖提名者表彰仪式在厦门国际博览中心会议中心五洲厅举行；11 月 10 日 16 时 30 分入场仪式、19 时 15 分颁奖典礼暨电影节闭幕式在海峡大剧院举行，20 个奖项现场揭晓。本届共收到 209 部符合条件影片，10 月 19 日公布提名：梁家辉凭《捕风追影》与檀健次凭《震耳欲聋》同争最佳男主角，宋佳凭《志愿军：浴血和平》角逐最佳女主角，同组还有张子枫、高叶。《南京照相馆》《镖人：风起大漠》各获 7 项提名，《给阿嬷的情书》6 项。金鸡影展 11 月 6 日至 29 日展映 84 部影片、29 场见面会。", "en": "The 2026 Golden Rooster and Hundred Flowers Film Festival runs in Xiamen from 6 to 10 November. The 39th Golden Rooster nominee ceremony is held at 15:00 on 9 November in the Wuzhou Hall of the Xiamen International Expo Centre; the red-carpet arrival begins at 16:30 on 10 November and the awards ceremony and closing gala at 19:15 at the Strait Grand Theatre, where all 20 prizes are announced. A record 209 eligible films were submitted and nominations were released on 19 October: Tony Leung Ka-fai (The Shadow's Edge) and Tan Jianci (Deafening) contest Best Actor, while Song Jia (The Volunteers: Peace at the Front) is up for Best Actress alongside Zhang Zifeng and Gao Ye. The Nanjing Photo Studio and Blades of the Desert lead with seven nominations each, followed by A Letter to Grandma with six. The festival's film showcase runs to 29 November with 84 titles and 29 Q&A sessions.", "es": "El Festival de Cine Gallo de Oro y Cien Flores 2026 se celebra en Xiamen del 6 al 10 de noviembre. La ceremonia de nominados de la 39.ª edición tiene lugar a las 15:00 del 9 de noviembre en el pabellón Wuzhou del centro de exposiciones; el 10 de noviembre la alfombra se despliega a las 16:30 y la gala de premios y clausura comienza a las 19:15 en el Gran Teatro del Estrecho, donde se anuncian los 20 premios. Se presentaron 209 películas elegibles y las nominaciones se dieron a conocer el 19 de octubre: Tony Leung Ka-fai (The Shadow's Edge) y Tan Jianci (Deafening) compiten por el premio a mejor actor, y Song Jia (The Volunteers: Peace at the Front) por el de mejor actriz junto a Zhang Zifeng y Gao Ye. The Nanjing Photo Studio y Blades of the Desert lideran con siete nominaciones cada una, seguidas de A Letter to Grandma con seis. La muestra proyecta 84 títulos hasta el 29 de noviembre.", "ja": "2026 年中国金鶏百花映画祭は 11 月 6〜10 日にアモイで開催される。11 月 9 日 15 時、第 39 回中国映画金鶏賞のノミネート表彰式がアモイ国際展覧センター会議中心五洲ホールで行われ、11 月 10 日 16 時 30 分にレッドカーペット、19 時 15 分に海峡大劇場で授賞式と閉幕式が開かれ、20 の賞が発表される。今回は条件を満たす 209 作品が応募し、10 月 19 日にノミネートが公表された。最優秀主演男優賞は『捕風追影』の梁家輝と『震耳欲聾』の檀健次が争い、最優秀主演女優賞は『志願軍：浴血和平』の宋佳に張子楓、高葉が挑む。『南京照相館』と『鏢人：風起大漠』が各 7 部門、『給阿嬤的情書』が 6 部門で最多級のノミネートとなった。映画祭の上映は 11 月 29 日まで 84 作品、29 回の舞台挨拶が予定される。"}, "why": {"zh": "影帝之争是「老戏骨」对「转型演员」，影后是三种完全不同的路数。奖项之外，209 部报名片的构成，其实更能说明今年国产片在往哪儿走。", "en": "Best Actor pits a veteran against a performer reinventing himself; Best Actress sets three entirely different approaches side by side. Beyond the prizes, the makeup of those 209 submissions says more about where Chinese film is heading.", "es": "El premio a mejor actor enfrenta a un veterano con un intérprete en reinvención; el de mejor actriz pone lado a lado tres enfoques distintos. Más allá de los galardones, la composición de esas 209 películas dice hacia dónde va el cine chino.", "ja": "主演男優賞は「ベテラン対・転身中の俳優」、主演女優賞は三つの異なるアプローチの並立だ。賞そのものより、応募 209 作品の構成の方が中国映画の向かう先を語る。"}}, {"idx": "02", "title": {"zh": "《今天是太阳雨》33 小时站内热度破亿，「三万块」跨剧撞梗出圈", "en": "'Today Is Sun Rain' Tops 100 Million in 33 Hours as a Shared '30,000 Yuan' Meme Crosses Shows", "es": "«Today Is Sun Rain» supera los 100 millones en 33 horas y el meme de «30.000 yuanes» cruza de serie a programa", "ja": "『今天是太陽雨』が 33 時間で視聴熱 1 億突破、「3 万元」の偶然がドラマとバラエティを横断"}, "body": {"zh": "杨超越、董思成主演的《今天是太阳雨》开播后，剧中女主郑雨背负的「三万块」债务，与芒果 TV 综艺《后会友期》里嘉宾王子璇、文吉儿争执多年的「三万块」写序酬劳意外撞梗，网友戏称「三万块闭环」。芒果 TV 与节目官微顺势发文「一只眼睛品友情，一只眼睛嗑爱情」，把综艺观众导流到新剧。剧集上线 33 小时站内热度破亿，登抖音影视榜首位，小红书单日讨论量 9.3 万、浏览量超 4417 万。", "en": "After Today Is Sun Rain, starring Yang Chaoyue and Dong Sicheng, premiered, viewers noticed that the 30,000-yuan debt carried by the heroine echoed a long-running argument over a 30,000-yuan fee for writing a preface between two guests on Mango TV's variety show The Aftermath, dubbing it a 30,000-yuan loop. Mango TV and the show's account leaned in with a post about watching friendship with one eye and romance with the other, funneling variety viewers to the drama. The series passed 100 million in platform heat within 33 hours, topped Douyin's film and TV chart, and drew 93,000 discussions and over 44 million views in a single day on Xiaohongshu.", "es": "Tras el estreno de Today Is Sun Rain, protagonizada por Yang Chaoyue y Dong Sicheng, los espectadores notaron que la deuda de 30.000 yuanes de la protagonista coincidía con la discusión de años entre dos invitados del programa de Mango TV The Aftermath por otros 30.000 yuanes, y lo bautizaron «bucle de los 30.000». Mango TV y la cuenta del programa aprovecharon el cruce con un mensaje sobre mirar la amistad con un ojo y el romance con el otro, canalizando audiencia hacia la serie. La ficción superó los 100 millones de índice de calor en 33 horas, lideró la lista de Douyin y generó 93.000 comentarios y más de 44,17 millones de visitas en un día en Xiaohongshu.", "ja": "楊超越と董思成が主演する『今天是太陽雨』の放送開始後、ヒロインが背負う「3 万元」の借金が、Mango TV のバラエティ『后会友期』で出演者二人が長年揉めてきた「3 万元」の序文謝礼と偶然重なり、ネットで「3 万元ループ」と呼ばれた。Mango TV と番組公式は「片目で友情を、片目で恋を味わう」と投稿してバラエティの視聴者をドラマへ誘導。ドラマは配信 33 時間でプラットフォーム内の熱度が 1 億を突破し、Douyin の映像ランキングで首位、小紅書では 1 日の討論 9 万 3000 件、閲覧 4417 万回超となった。"}, "why": {"zh": "一次巧合被两边同时接住，才成了梗。平台把「撞车」做成联动，是今年剧综营销里最省预算的一次——观众替它完成了传播。", "en": "A coincidence only becomes a meme when both sides catch it. Turning the collision into a crossover is the cheapest piece of drama-variety marketing this year, because the audience did the distribution.", "es": "Una coincidencia solo se convierte en meme si ambos lados la recogen. Convertir el choque en un cruce es la acción de marketing más barata del año entre series y programas: el público hizo la difusión.", "ja": "偶然は双方が拾って初めてミームになる。「衝突」を連動企画に変えたのは今年のドラマ×バラエティ宣伝で最も低予算な一手だ。拡散は視聴者がやってくれた。"}}, {"idx": "03", "title": {"zh": "于正隔空喊话「原谅许飞吧」冲上热搜第一，厉娜被确认已读", "en": "Yu Zheng's Public Plea to 'Forgive Xu Fei' Tops Searches; Li Na Confirmed to Have Read It", "es": "La súplica pública de Yu Zheng para «perdonar a Xu Fei» lidera las búsquedas; Li Na ya la ha leído", "ja": "于正氏の「許飛を許してあげて」が検索 1 位、厲娜氏は既読と判明"}, "body": {"zh": "11 月 7 日晚，于正发布视频隔空喊话厉娜「原谅许飞吧」，自称「磕生磕死」地追综艺《后会友期》。11 月 8 日，话题冲上热搜第一。于正回复网友称厉娜「看了也回了」，但未公开回复内容。厉娜此前在节目中明确表态「不会去原谅，也不会去理解」，并称恨过许飞「非常久」；两人是 2006 年超女时期的好友，因一桩「告密」事件决裂近二十年，许飞否认主动告密。于正评论区高赞留言是「下一季想看你和何晟铭」，点赞 6.7 万。", "en": "On the evening of 7 November producer Yu Zheng posted a video urging singer Li Na to forgive Xu Fei, saying he had been binge-watching the variety show The Aftermath. The topic topped search rankings on 8 November. Yu told commenters that Li Na had seen and replied to his message, without disclosing what she said. Li had earlier stated on the show that she would neither forgive nor try to understand, and that she had hated Xu Fei for a very long time; the two were friends from the 2006 Super Girl era and fell out nearly twenty years ago over an allegation of informing, which Xu Fei denies. The most-liked comment under Yu's post, with 67,000 likes, asked to see him and He Shengming on the next season.", "es": "La noche del 7 de noviembre el productor Yu Zheng publicó un vídeo pidiendo públicamente a la cantante Li Na que perdonara a Xu Fei, diciendo que estaba viendo el programa The Aftermath sin parar. El tema lideró las búsquedas el 8 de noviembre. Yu respondió a los comentarios que Li Na lo había visto y contestado, sin revelar qué dijo. Li había afirmado antes en el programa que no perdonaría ni intentaría comprender, y que había odiado a Xu Fei durante mucho tiempo; ambas eran amigas de la época de Super Girl 2006 y se distanciaron hace casi veinte años por una acusación de delación que Xu niega. El comentario más votado bajo la publicación, con 67.000 me gusta, pedía verlo con He Shengming en la próxima temporada.", "ja": "11 月 7 日夜、プロデューサーの于正氏が、バラエティ『后会友期』に夢中だと語りつつ、厲娜氏に「許飛を許してあげて」と呼びかける動画を公開。11 月 8 日、この話題が検索 1 位となった。于正氏はコメント欄で厲娜氏が「見て返信もした」と明かしたが、内容は公表していない。厲娜氏は番組内で「許す気も理解する気もない」と明言し、許飛氏を「とても長く恨んだ」と語っていた。二人は 2006 年スーパーガール時代の友人で、密告をめぐる一件で約 20 年断絶しており、許飛氏は密告を否定している。于正氏の投稿で最も「いいね」を集めたコメント（6 万 7000）は「次のシーズンは何晟銘と一緒に出てほしい」だった。"}, "why": {"zh": "观众爱看的不是和解，是「谁先松口」。当事人二十年没放下的事，被一句隔空喊话重新摆上桌——这才是综艺最会的续集写法。", "en": "What audiences want is not reconciliation but to see who blinks first. A twenty-year grievance was put back on the table by one public sentence, which is exactly how variety television writes its best sequels.", "es": "Al público no le interesa la reconciliación, sino quién cede primero. Un agravio de veinte años volvió a la mesa por una frase pública: así escribe la televisión sus mejores continuaciones.", "ja": "視聴者が見たいのは和解ではなく「どちらが先に折れるか」だ。20 年越しの蟠りが一つの呼びかけで再びテーブルに載った。これこそバラエティが最も得意とする続編の作り方である。"}}, {"idx": "04", "title": {"zh": "林忆莲成都连开两场，60 岁全程唱跳被赞「给年轻歌手上了一课」", "en": "Sandy Lam Plays Two Nights in Chengdu at 60, Praised for 'Teaching Young Singers a Lesson'", "es": "Sandy Lam llena dos noches en Chengdu a los 60 años y es elogiada por «dar una lección a los jóvenes»", "ja": "林憶蓮が 60 歳で成都 2 公演、歌って踊り切って「若手歌手への授業」と評される"}, "body": {"zh": "林忆莲「回响：终章」巡演 11 月 6 日至 7 日在成都东安湖体育公园连开两场，60 岁的她大衣配长手套登台，二十多首歌几乎无停歇地又唱又跳两个多小时，《至少还有你》前奏响起时全场万人合唱。网友评价其不刻意炫技、不打煽情牌、全程气息稳定。同期，王力宏 11 月 7 日广州演唱会返场环节王心凌惊喜登场，两人合唱《爱你》《不可能错过你》，当晚广州下雨、两人未撑伞完成唱跳。", "en": "Sandy Lam's Echoes: Final Chapter tour played two nights at Chengdu's Dong'an Lake Sports Park on 6 and 7 November. At 60, in a coat and long gloves, she sang and danced for more than two hours across some twenty songs with barely a pause, and the crowd sang along as the intro to At Least I Still Have You began. Reviewers noted she neither showed off nor milked sentiment, and her breath control held throughout. In Guangzhou the same week, Wang Leehom's 7 November concert brought a surprise appearance from Cyndi Wang; the two sang Love You and Can't Possibly Miss You in the rain without umbrellas.", "es": "La gira Echoes: Final Chapter de Sandy Lam ofreció dos noches en el parque deportivo Dong'an Lake de Chengdu los días 6 y 7 de noviembre. A los 60 años, con abrigo y guantes largos, cantó y bailó más de dos horas y una veintena de canciones casi sin pausa, y el público coreó la introducción de At Least I Still Have You. La crítica destacó que no alardea ni recurre al sentimentalismo y que mantuvo el control de la respiración de principio a fin. En Cantón, el concierto de Wang Leehom del 7 de noviembre tuvo la aparición sorpresa de Cyndi Wang; ambos cantaron bajo la lluvia sin paraguas.", "ja": "林憶蓮のツアー「回響：終章」が 11 月 6、7 日に成都東安湖スポーツ公園で 2 公演行われた。60 歳の彼女はコートにロンググローブで登場し、20 曲余りをほぼ休みなく 2 時間以上歌って踊り、『至少還有你』のイントロでは会場が万人大合唱となった。技巧を誇示せず、感傷にも頼らず、最後まで息が安定していたと評されている。同じ週、王力宏の 11 月 7 日広州公演のアンコールには王心凌がサプライズ登場し、雨の中で傘も差さずに 2 曲を歌い踊った。"}, "why": {"zh": "在靠修音和剪辑撑现场的年代，「气息稳定」成了最高级的夸奖。这句话本身，就是对整个行业最客气的一次提醒。", "en": "In an era when pitch correction and editing carry live shows, steady breath control has become the highest compliment. That sentence is itself the politest warning the industry could receive.", "es": "En una época en que el autotune y el montaje sostienen los directos, «control de la respiración» se ha vuelto el mayor elogio. Esa frase es, en sí misma, el aviso más cortés que puede recibir el sector.", "ja": "音程補正と編集でライブを支える時代に、「息が安定している」が最高の褒め言葉になった。その一言自体が、業界への最も丁寧な警告である。"}}, {"idx": "05", "title": {"zh": "《音乐缘计划 3》首期开播，胡兵在进博会谈「纸片人」审美", "en": "'Music Fate Plan 3' Premieres; Hu Bing Takes On the 'Paper-Thin' Aesthetic at the CIIE", "es": "Se estrena «Music Fate Plan 3» y Hu Bing critica la estética «de papel» en la CIIE", "ja": "『音楽縁計画 3』が初回放送、胡兵氏は輸入博で「紙のような細さ」の美意識に言及"}, "body": {"zh": "《音乐缘计划 3》首期开播，薛之谦、容祖儿、周深、刘宇宁、黄子弘凡、希林娜依·高、于文文、蔡文静、颜人中、张弛、蒋龙 11 位嘉宾集结；节目在公共区域只设一台「爆灯机」，限时开启、先爆先得。另在第九届进博会上，演员、超模胡兵谈到「纸片人」审美：不少奢侈品牌近年过度追逐纤细风格，成衣脱离真实人体，连身材标准的超模也很难穿上部分国际设计师作品；他认为时尚应服务于人，服装本应提供多元选择，并介绍中国面料已跻身世界顶级行列，兼具防晒、抑菌、抗皱等功能。", "en": "Music Fate Plan 3 has premiered with 11 guests — Xue Zhiqian, Joey Yung, Zhou Shen, Liu Yuning, Huang Zihongfan, Shiringaoyi Gao, Yu Wenwen, Cai Wenjing, Yan Renzhong, Zhang Chi and Jiang Long. The show places a single buzzer in the common area, open for a limited time on a first-come basis. At the ninth CIIE, actor and model Hu Bing criticised the paper-thin aesthetic: several luxury houses have chased extreme slenderness in recent years, producing garments detached from real bodies that even standard-size models struggle to wear; fashion, he said, should serve people and offer multiple choices, adding that Chinese fabrics now rank among the world's best, with sun protection, antibacterial and wrinkle-resistant functions.", "es": "Se ha estrenado Music Fate Plan 3 con 11 invitados: Xue Zhiqian, Joey Yung, Zhou Shen, Liu Yuning, Huang Zihongfan, Shiringaoyi Gao, Yu Wenwen, Cai Wenjing, Yan Renzhong, Zhang Chi y Jiang Long. El programa instala un único pulsador en la zona común, disponible por tiempo limitado y para el primero que lo pulse. En la novena CIIE, el actor y modelo Hu Bing criticó la estética «de papel»: varias casas de lujo han perseguido en los últimos años una delgadez extrema, con prendas alejadas del cuerpo real que incluso modelos de talla estándar no pueden ponerse; la moda, dijo, debe servir a las personas y ofrecer opciones diversas, y añadió que los tejidos chinos ya están entre los mejores del mundo, con funciones de protección solar, antibacterianas y antiarrugas.", "ja": "『音楽縁計画 3』が初回放送を迎え、薛之謙、容祖児、周深、劉宇寧、黄子弘凡、希林娜依・高、于文文、蔡文静、顔人中、張弛、蒋龍の 11 人が集結した。共用エリアに「爆灯機」を 1 台だけ置き、時間限定で先に押した者が得る仕組みだ。一方、第 9 回輸入博では俳優でスーパーモデルの胡兵氏が「紙のような細さ」の美意識に言及。近年の高級ブランドが過度に細身を追求し、衣服が実際の人体から離れてしまい、標準的な体型のモデルでも着られない作品があると指摘した。ファッションは人に奉仕すべきで多様な選択肢を提供すべきだと述べ、中国の生地は日焼け防止や抗菌、防シワなどの機能を備え世界最高水準に達していると紹介した。"}, "why": {"zh": "一边是音乐综艺用「抢」制造紧张感，一边是行业前辈在进博会上谈「衣服该给谁穿」。两条热搜其实在说同一件事：审美和注意力，都在被重新定价。", "en": "One headline has a music show manufacturing tension with a race to grab a song; another has a veteran asking whom clothes are actually for. Both are about the same thing: taste and attention are being repriced.", "es": "Un titular usa un programa musical que genera tensión con una carrera por la canción; otro tiene a un veterano preguntando para quién es la ropa. Ambos hablan de lo mismo: el gusto y la atención se están revalorizando.", "ja": "一方は音楽番組が「取り合い」で緊張感を作り、もう一方は業界の先輩が「服は誰のためか」を問う。二つの話題は同じことを語っている。美意識と注意力の値段が付け直されているのだ。"}}]}], "risk": {"zh": "风险提示：本简报仅作信息汇总，其中涉及的数据不构成任何投资建议。", "en": "Risk notice: this briefing is a summary of information only; the data involved does not constitute investment advice.", "es": "Aviso de riesgo: este boletín es solo un resumen informativo y los datos citados no constituyen asesoramiento de inversión.", "ja": "リスク提示：このブリーフィングは情報の要約のみを目的としており、記載のデータは投資助言を構成するものではありません。"}}/*__END__*/;

  }

  function renderContent(lang) {
    var i18n = I18N[lang];
    var html = "";
    // 精选
    var sp = BRIEFING.spotlight;
    html += '<section class="spotlight" id="pick">'
      + '<div class="badge"><i></i>' + esc(T(sp.badge, lang)) + "</div>"
      + "<h2>" + titleHtml(sp.title, sp.hl, lang) + "</h2>"
      + '<div class="body">' + esc(T(sp.body, lang)) + "</div>"
      + '<div class="why"><b>' + esc(i18n.why) + "</b>" + esc(T(sp.why, lang)) + "</div>"
      + "</section>";
    // 分类
    html += '<div class="grid">';
    BRIEFING.sections.forEach(function (sec) {
      html += '<section class="card" id="' + sec.key + '" style="--ac:' + sec.color + "; --ac-deep:" + sec.deep + ';">'
        + '<div class="sec-head"><span class="sec-num">' + sec.num + "</span>"
        + "<h3>" + esc(T(sec.name, lang)) + "</h3>"
        + '<span class="en">' + sec.key.toUpperCase() + "</span></div>";
      (sec.items || []).forEach(function (it) {
        html += '<div class="item">';
        html += '<div class="t"><span class="idx">' + it.idx + "</span>";
        if (it.tag) html += '<span class="tag">' + esc(it.tag[lang] != null ? it.tag[lang] : i18n.tag) + "</span>";
        html += titleHtml(it.title, it.hl, lang) + "</div>";
        html += '<div class="d">' + esc(T(it.body, lang)) + "</div>";
        html += '<div class="why"><b>' + esc(i18n.why) + "</b>" + esc(T(it.why, lang)) + "</div>";
        html += "</div>";
      });
      html += "</section>";
    });
    html += "</div>";
    var content = document.getElementById("content");
    if (content) content.innerHTML = html;
    // 页脚
    var risk = document.getElementById("risk");
    if (risk) risk.textContent = T(BRIEFING.risk, lang);
  }

  function setLang(lang) {
    if (LANGS.indexOf(lang) < 0) lang = "zh";
    curLang = lang;
    langOpen = false;
    try { localStorage.setItem("timab_lang", lang); } catch (e) {}
    renderChrome(lang);
    renderContent(lang);
  }

  /* ===== 往期日历（保留原逻辑，文案随语言） ===== */
  function initCalendar() {
    var btn = document.getElementById("calBtn");
    var pop = document.getElementById("calPop");
    var grid = document.getElementById("calGrid");
    var title = document.getElementById("calTitle");
    if (!btn || !pop || !grid || !title) return;

    var parts = BRIEFING.date.split("-");
    var todayKey = parts[0].slice(2) + parts[1] + parts[2];
    var cur = { y: +parts[0], m: +parts[1] };
    var has = {};
    for (var i = 0; i < ARCHIVE_DATES.length; i++) { has[ARCHIVE_DATES[i]] = 1; }
    var HIST_BASE = /\/history\//.test(location.pathname) ? "./" : "history/";

    function ckey(y, m, d) { return String(y).slice(2) + pad(m) + pad(d); }

    function render() {
      var i18n = I18N[curLang];
      title.textContent = i18n.calTitle(cur.y, cur.m);
      grid.innerHTML = "";
      var start = new Date(cur.y, cur.m - 1, 1).getDay();
      var days = new Date(cur.y, cur.m, 0).getDate();
      for (var b = 0; b < start; b++) {
        var blank = document.createElement("span");
        blank.className = "cal-cell is-empty"; grid.appendChild(blank);
      }
      for (var d = 1; d <= days; d++) {
        var k = ckey(cur.y, cur.m, d);
        var cell = document.createElement("span");
        cell.className = "cal-cell" + (has[k] ? " has" : "") + (k === todayKey ? " is-today" : "");
        cell.textContent = d;
        if (has[k]) {
          cell.setAttribute("role", "link"); cell.setAttribute("tabindex", "0");
          cell.title = cur.y + "-" + pad(cur.m) + "-" + pad(d) + " 存档";
          (function (target) {
            var go = function () { window.open(HIST_BASE + target + ".html", "_blank", "noopener"); };
            cell.addEventListener("click", go);
            cell.addEventListener("keydown", function (e) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); go(); } });
          })(k);
        }
        grid.appendChild(cell);
      }
    }
    function toggle(open) {
      pop.hidden = !open;
      btn.setAttribute("aria-expanded", open ? "true" : "false");
      if (open) render();
    }
    btn.addEventListener("click", function (e) { e.stopPropagation(); toggle(pop.hidden); });
    document.getElementById("calPrev").addEventListener("click", function () { cur.m--; if (cur.m < 1) { cur.m = 12; cur.y--; } render(); });
    document.getElementById("calNext").addEventListener("click", function () { cur.m++; if (cur.m > 12) { cur.m = 1; cur.y++; } render(); });
    document.addEventListener("click", function (e) { if (!pop.hidden && !pop.contains(e.target)) toggle(false); });
    document.addEventListener("keydown", function (e) { if (e.key === "Escape" && !pop.hidden) toggle(false); });
  }

  /* ===== 启动 ===== */
  function boot() {
    curLang = detectLang();
    renderChrome(curLang);
    renderContent(curLang);
    initCalendar();
    // 关闭语言下拉：点击外部 / Esc
    document.addEventListener("click", function (e) {
      var ls = document.getElementById("langSwitch");
      if (ls && langOpen && !ls.contains(e.target)) {
        langOpen = false;
        ls.classList.remove("open");
        var t = document.getElementById("langTrigger");
        if (t) t.setAttribute("aria-expanded", "false");
      }
    });
    document.addEventListener("keydown", function (e) {
      if (e.key === "Escape" && langOpen) {
        langOpen = false;
        var ls = document.getElementById("langSwitch");
        if (ls) ls.classList.remove("open");
        var t = document.getElementById("langTrigger");
        if (t) t.setAttribute("aria-expanded", "false");
      }
    });
  }
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", boot);
  } else { boot(); }
})();
</script>
</body>
</html>
