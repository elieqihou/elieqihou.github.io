<style>

    --seal: #9e2b25;

    --c-fin: #b45309; --c-fin-deep: #8a3f06;
    --c-spo: #15803d; --c-spo-deep: #105c2c;

  .mast-meta .kicker small { font-weight: 400; letter-spacing: .3em; margin-left: 8px; color: var(--ink-faint); }
  .mast-title-row {
    display: flex; align-items: flex-end; justify-content: space-between;
    gap: 24px; padding: 26px 0 22px;
  }
  .mast-brand { display: flex; align-items: flex-end; gap: 20px; }
  .mast-seal { width: clamp(54px, 7.5vw, 82px); height: auto; flex: none; }
  .mast-title {

  .mast-title em { font-style: normal; color: var(--c-dom); }
  .mast-side { display: flex; flex-direction: column; align-items: flex-end; gap: 12px; }
  .mast-date {

  .mast-date small {
    display: block; font-family: "Noto Sans SC", sans-serif; font-style: normal;
    font-size: 12px; letter-spacing: .3em; color: var(--accent); margin-top: 8px; text-align: right;
  }

  /* ===== 语言切换（国旗触发 + 下拉） ===== */
  .lang-switch { position: relative; display: inline-block; }
  .lang-trigger {
    display: inline-flex; align-items: center; gap: 5px; cursor: pointer;
    background: var(--card); border: 1.5px solid var(--line); border-radius: 999px;
    padding: 3px 9px 3px 4px; font-family: inherit; color: var(--ink-soft);
    transition: border-color .18s ease, color .18s ease;
  }
  .lang-trigger:hover { border-color: var(--accent); color: var(--accent); }
  .lang-switch.open .lang-trigger { border-color: var(--accent); }
  .lang-trigger .caret { font-size: 9px; line-height: 1; opacity: .7; }
  .fl {
    display: block; width: 22px; height: 15px; border-radius: 2px; flex: none;
    box-shadow: 0 0 0 1px rgba(28, 27, 23, .14);
  }
  .lang-menu {
    position: absolute; top: calc(100% + 8px); right: 0; z-index: 70;
    min-width: 150px; padding: 6px; background: var(--card);
    border: 1px solid var(--line); border-radius: 12px;
    box-shadow: 0 18px 44px -18px rgba(28, 27, 23, .45), 0 2px 8px rgba(28, 27, 23, .06);
    display: none; animation: langIn .16s ease both;
  }
  .lang-switch.open .lang-menu { display: block; }
  @keyframes langIn { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }
  .lang-item {
    display: flex; align-items: center; gap: 10px; width: 100%; cursor: pointer;
    background: transparent; border: none; border-radius: 8px; padding: 7px 9px;
    font-family: inherit; font-size: 13px; font-weight: 600; color: var(--ink-soft);
    text-align: left; transition: background .16s ease, color .16s ease;
  }
  .lang-item:hover { background: color-mix(in srgb, var(--accent) 10%, transparent); color: var(--accent); }
  .lang-item.sel { color: var(--accent); background: color-mix(in srgb, var(--accent) 8%, transparent); }
  .lang-item .lbl { letter-spacing: .02em; }

  /* ===== 往期日历 ===== */
  .cal-anchor { position: relative; }
  .cal-link {
    display: inline-flex; align-items: center; gap: 7px; cursor: pointer;
    font-family: inherit; font-size: 13px; font-weight: 700; letter-spacing: .1em;
    color: var(--ink-soft); background: var(--card);
    border: 1.5px solid var(--line); border-radius: 999px; padding: 5px 15px 5px 12px;
    transition: all .2s ease;
  }
  .cal-link:hover { border-color: var(--accent); color: var(--accent); }
  .cal-link svg { width: 14px; height: 14px; display: block; }
  .cal-pop {
    position: absolute; top: calc(100% + 10px); right: 0; z-index: 60;
    width: 274px; padding: 14px 14px 10px;
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    box-shadow: 0 18px 44px -18px rgba(28, 27, 23, .45), 0 2px 8px rgba(28, 27, 23, .06);
    animation: calIn .18s ease both;
  }
  .cal-pop[hidden] { display: none; }
  @keyframes calIn { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }
  .cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .cal-title { font-size: 14px; font-weight: 700; letter-spacing: .08em; color: var(--ink); }
  .cal-nav {
    width: 26px; height: 26px; line-height: 1; cursor: pointer;
    font-family: inherit; font-size: 17px; color: var(--ink-soft);
    background: transparent; border: 1px solid var(--line); border-radius: 8px;
    transition: all .18s ease;
  }
  .cal-nav:hover { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  .cal-week, .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
  .cal-week span {
    text-align: center; font-size: 11px; letter-spacing: .06em;
    color: var(--ink-faint); padding-bottom: 6px;
  }
  .cal-cell {
    position: relative; height: 32px; display: flex; align-items: center; justify-content: center;
    font-size: 13px; color: var(--ink-faint); border-radius: 8px;
    transition: background .18s ease, color .18s ease;
  }
  .cal-cell.is-empty { visibility: hidden; }
  .cal-cell.has { color: var(--ink); font-weight: 700; cursor: pointer; }
  .cal-cell.has::after {
    content: ""; position: absolute; bottom: 3px; left: 50%; transform: translateX(-50%);
    width: 4px; height: 4px; border-radius: 50%; background: var(--accent);
  }
  .cal-cell.has:hover, .cal-cell.has:focus-visible {
    background: color-mix(in srgb, var(--accent) 16%, transparent);
    color: var(--accent); outline: none;
  }
  .cal-cell.is-today { box-shadow: inset 0 0 0 1.5px var(--line); color: var(--ink-soft); }
  .cal-foot {
    margin-top: 9px; padding-top: 8px; border-top: 1px dashed var(--line);
    font-size: 11.5px; color: var(--ink-faint); letter-spacing: .04em;
  }

  /* ===== 导航 ===== */
  .nav-chips { display: flex; flex-wrap: wrap; gap: 10px; padding: 0 0 18px; }
  .nav-chips a {
    text-decoration: none; font-size: 13.5px; font-weight: 700; letter-spacing: .08em;
    color: var(--ink-soft); border: 1.5px solid var(--line);
    border-radius: 999px; padding: 5px 16px; transition: all .2s ease;
  }
  .nav-chips a:hover { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  .nav-chips a.chip-pick { border-color: #0f766e; color: #0b5a54; }
  .nav-chips a.chip-pick:hover { background: #0f766e; color: #fff; }

  /* ===== 精选 ===== */
  .spotlight {
    margin-top: 30px; border-radius: 18px; overflow: hidden;
    background: linear-gradient(120deg, #0f766e 0%, #115e59 46%, #134e4a 100%);
    color: #f2fbfa; padding: 34px 38px 30px; position: relative;
    box-shadow: 0 18px 44px -18px rgba(15, 118, 110, .55);
  }
  .spotlight::after {
    content: ""; position: absolute; right: -60px; top: -60px; width: 240px; height: 240px;
    border-radius: 50%; background: radial-gradient(circle, rgba(255,255,255,.14), transparent 68%);
  }
  .spotlight .badge {
    display: inline-flex; align-items: center; gap: 8px;
    font-size: 12.5px; font-weight: 700; letter-spacing: .3em;
    border: 1.5px solid rgba(242, 251, 250, .55); border-radius: 999px;
    padding: 5px 18px 5px 20px; margin-bottom: 18px;
  }
  .spotlight .badge i {
    width: 8px; height: 8px; border-radius: 50%; background: #5eead4; display: inline-block;
    animation: pulse 2.2s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100% { opacity: 1; transform: scale(1);} 50% { opacity: .45; transform: scale(.78);} }
  .spotlight h2 {
    font-family: "Noto Serif SC", "Noto Serif JP", serif; font-weight: 900;
    font-size: clamp(24px, 3.4vw, 34px); line-height: 1.35; margin-bottom: 14px;
  }
  .spotlight h2 .hl { color: #99f6e4; border-bottom: 3px solid rgba(153, 246, 228, .5); padding-bottom: 2px; }
  .spotlight .body { font-size: 15px; color: #d3efec; max-width: 62em; }
  .spotlight .why {
    margin-top: 18px; padding: 14px 18px; border-left: 3px solid #5eead4;
    background: rgba(255,255,255,.07); border-radius: 0 10px 10px 0;
    font-size: 14px; color: #e8fbf9; max-width: 62em;
  }
  .spotlight .why b { color: #99f6e4; font-weight: 700; }

  /* ===== 分类卡片 ===== */
  .grid { margin-top: 30px; display: grid; grid-template-columns: repeat(2, 1fr); gap: 24px; }
  @media (max-width: 880px) { .grid { grid-template-columns: 1fr; } .spotlight { padding: 26px 22px; } }
  .card {
    background: var(--card); border-radius: 4px 4px 14px 14px;
    box-shadow: 0 1px 3px rgba(28, 27, 23, .07), 0 12px 30px -22px rgba(28,27,23,.35);
    padding: 24px 26px 12px; position: relative; border-top: 6px solid var(--ac);
    animation: rise .6s ease both;
  }
  .card:nth-child(1) { animation-delay: .05s; } .card:nth-child(2) { animation-delay: .12s; }
  .card:nth-child(3) { animation-delay: .19s; } .card:nth-child(4) { animation-delay: .26s; }
  .card:nth-child(5) { animation-delay: .33s; } .card:nth-child(6) { animation-delay: .40s; }
  @keyframes rise { from { opacity: 0; transform: translateY(16px);} to { opacity: 1; transform: none;} }
  .card:hover { transform: translateY(-3px); transition: transform .25s ease; }
  .sec-head {
    display: flex; align-items: center; gap: 12px; margin-bottom: 6px;
    padding-bottom: 12px; border-bottom: 1px solid var(--line);
  }
  .sec-num { font-family: "Playfair Display", serif; font-style: italic; font-weight: 700; font-size: 26px; color: var(--ac); line-height: 1; }
  .sec-head h3 { font-family: "Noto Serif SC", "Noto Serif JP", serif; font-weight: 900; font-size: 21px; letter-spacing: .1em; color: var(--ink); }

  .item .t .tag {

  .item .t a.lk, .spotlight h2 a.lk {

  .item .t a.lk:hover { color: var(--ac-deep); text-decoration-color: currentColor; }
  .spotlight h2 a.lk { text-decoration-color: rgba(242, 251, 250, .35); }

  .noscript-note { padding: 40px 0; text-align: center; color: var(--ink-faint); }

  @media (max-width: 640px) {
    .mast-title-row { flex-wrap: wrap; }
    .mast-side { align-items: flex-start; }
    .cal-pop { right: auto; left: 0; }
  }

  var BRIEFING = /*__BRIEFING_DATA__*/{"date": "2026-11-24", "meta": {"zh": "星期二 · 农历十月十六 · timab.cn", "en": "Tuesday · 16th day of the 10th lunar month · timab.cn", "es": "Martes · 16.º día del 10.º mes lunar · timab.cn", "ja": "火曜日 · 旧暦十月十六 · timab.cn"}, "spotlight": {"badge": {"zh": "精选", "en": "SPOTLIGHT", "es": "DESTACADO", "ja": "注目"}, "title": {"zh": "辞职十二天，他让一家公司一夜长回 9520 亿美元", "en": "Twelve days after resigning, he added $952 billion to a company overnight", "es": "Doce días después de dimitir, añadió 952.000 millones de dólares a una empresa en una noche", "ja": "辞任から 12 日、彼は一晩で 9520 億ドルを会社に戻した"}, "hl": {"zh": "11 月 23 日美股盘前，英伟达宣布重新任命黄仁勋为总裁、首席执行官及董事会成员，即刻生效——距离他 11 月 12 日辞去同一组职务，不到两周。", "en": "Before the US market opened on 23 November, Nvidia announced it had reappointed Jensen Huang as president, chief executive and board member, effective immediately — less than two weeks after he resigned from the same posts on 12 November.", "es": "Antes de la apertura del mercado estadounidense del 23 de noviembre, Nvidia anunció la reincorporación de Jensen Huang como presidente, consejero delegado y miembro del consejo, con efecto inmediato, menos de dos semanas después de que dimitiera de esos mismos cargos el 12 de noviembre.", "ja": "11 月 23 日の米国市場の寄り付き前、NVIDIA はジェンスン・フアン氏を社長兼最高経営責任者（CEO）および取締役に再任し、即日発効すると発表した。同氏が同じ職を辞した 11 月 12 日から 2 週間も経っていない。"}, "body": {"zh": "英伟达董事会主席琼斯在声明中称，这一决定由董事会「一致投票」作出，且「已听取美国政府高层的意见，基于这些意见，董事会有信心复职不会构成国家安全风险」。美国总统特朗普当天在社交媒体上说，这是「正确且恰当的决定」，并称自己「说服了他们」；美国司法部长已确认政府没有证据表明存在不合法行为。黄仁勋回到公司总部，在员工欢呼声中表示：「我第二次当 CEO 会做得更好。」市场给出的回应是：英伟达收涨 31.48%，为 2003 年 5 月以来最大单日涨幅、上市以来第三大，单日市值增加约 9520 亿美元，刷新全球上市公司单日市值增加纪录——此前纪录是微软今年 7 月 30 日的约 4500 亿美元。同日纳指涨 6.51% 报 24089.56 点，标普 500 涨 4.73% 报 7237.17 点，道指涨 3.01% 报 49595.31 点，费城半导体指数涨 14.03%，三大指数均录得 2025 年 4 月以来最大单日涨幅；美光涨逾 19%，英特尔涨逾 16%，戴尔涨 20%，特斯拉涨超 11%。而就在上周五，标普 500 与道指刚刚确认进入调整区间。", "en": "Nvidia's board chair, Jones, said in a statement that the decision was taken by a unanimous board vote and that the board had «received input from senior levels of the United States government, and based on that input... is confident that Mr. Huang's reinstatement poses no national security risk». President Trump wrote on social media that day that it was «the right and appropriate decision» and said he had «convinced them»; the US attorney general confirmed the government had no evidence of wrongdoing. Returning to headquarters to cheering staff, Huang said: «I'll do a better job the second time.» The market's answer: Nvidia closed up 31.48%, its biggest one-day gain since May 2003 and third-largest since listing, adding about $952 billion in market value — a world record for a single session, against Microsoft's previous mark of roughly $450 billion on 30 July. The Nasdaq rose 6.51% to 24,089.56, the S&P 500 4.73% to 7,237.17 and the Dow 3.01% to 49,595.31, while the Philadelphia Semiconductor Index jumped 14.03% — the biggest one-day gains for all three since April 2025. Micron gained more than 19%, Intel more than 16%, Dell 20% and Tesla over 11%. Only last Friday, the S&P 500 and the Dow had just confirmed a correction.", "es": "El presidente del consejo de Nvidia, Jones, afirmó en un comunicado que la decisión se adoptó por votación unánime y que el consejo «recibió información de altos niveles del Gobierno de Estados Unidos y, sobre esa base, confía en que la reincorporación del señor Huang no supone riesgo para la seguridad nacional». El presidente Trump escribió ese día en redes sociales que era «la decisión correcta y adecuada» y dijo que él los había «convencido»; el fiscal general confirmó que el Gobierno no tiene pruebas de irregularidades. De vuelta en la sede, entre aplausos, Huang dijo: «La segunda vez lo haré mejor». La respuesta del mercado: Nvidia cerró con una subida del 31,48 %, su mayor avance diario desde mayo de 2003 y el tercero desde su salida a bolsa, y sumó unos 952.000 millones de dólares de capitalización, récord mundial para una sola sesión frente a los cerca de 450.000 millones de Microsoft el 30 de julio. El Nasdaq subió un 6,51 % hasta 24.089,56 puntos, el S&P 500 un 4,73 % hasta 7.237,17 y el Dow un 3,01 % hasta 49.595,31, mientras el índice de semiconductores de Filadelfia se disparó un 14,03 %: los mayores avances diarios de los tres desde abril de 2025. Micron ganó más del 19 %, Intel más del 16 %, Dell un 20 % y Tesla más del 11 %. Solo el viernes anterior, el S&P 500 y el Dow acababan de confirmar una corrección.", "ja": "NVIDIA の取締役会議長ジョーンズ氏は声明で、この決定は取締役会の「全会一致」で下され、米国政府高官の意見も聴取したうえで「再任が国家安全保障上のリスクにならないと確信している」と述べた。トランプ大統領は同日、ソーシャルメディアで「正しく適切な決定だ」と書き、「私が彼らを説得した」と語った。司法長官も、政府として違法行為の証拠はないと確認している。フアン氏は本社に戻り、従業員の歓声の中で「2 度目の CEO はもっとうまくやる」と述べた。市場の反応はこうだ。NVIDIA は 31.48 % 高で引け、2003 年 5 月以来最大、上場以来 3 番目の上げ幅となった。時価総額は 1 日で約 9520 億ドル増え、世界の上場企業の 1 日増加額の記録を更新した（従来はマイクロソフトが今年 7 月 30 日に付けた約 4500 億ドル）。同日、ナスダック総合指数は 6.51 % 高の 24089.56、S&P 500 種は 4.73 % 高の 7237.17、ダウ平均は 3.01 % 高の 49595.31 となり、フィラデルフィア半導体指数は 14.03 % 上昇。3 指数そろって 2025 年 4 月以来の大きな上げ幅だった。マイクロンは 19 % 超、インテルは 16 % 超、デルは 20 %、テスラは 11 % 超上昇した。わずか前の金曜日、S&P 500 とダウは調整入りを確認したばかりだった。"}, "why": {"zh": "上周五的暴跌与本周一的暴涨之间，没有一份财报发生变化，唯一改变的变量是 CEO 这一栏。全球市值最高的公司之一，把近 1 万亿美元的涨跌押在一个人的去留上——这既是一次关于公司治理的极端实验，也是资本市场对「关键人」最直白的一次定价。看多的解读是「最坏情况已经过去」，BTIG 的看法正相反：标普可能先反弹到 7250 至 7350 点区间，随后很可能再次走低。", "en": "Nothing in the earnings changed between Friday's rout and Monday's surge — the only variable was the name in the CEO slot. One of the world's most valuable companies moved nearly a trillion dollars on one person's comings and goings: an extreme experiment in corporate governance, and the market's bluntest pricing of a key man. The bullish reading is that the worst is over; BTIG disagrees, expecting the S&P 500 to rebound to 7,250–7,350 before probably heading lower again.", "es": "Entre el desplome del viernes y el repunte del lunes no cambió ningún resultado: la única variable fue el nombre en la casilla de consejero delegado. Una de las empresas más valiosas del mundo movió casi un billón de dólares por la ida y vuelta de una persona: un experimento extremo de gobierno corporativo y la valoración más descarnada que el mercado hace de una figura clave. La lectura alcista es que lo peor ya pasó; BTIG opina lo contrario y espera que el S&P 500 rebote hasta 7.250-7.350 puntos antes de probablemente volver a caer.", "ja": "金曜日の急落と月曜日の急騰の間に、決算は一つも変わっていない。変わった変数は CEO の欄だけだ。世界有数の時価総額企業が、1 人の去就で 1 兆ドル近く動いた。これは企業統治をめぐる極端な実験であり、市場が「キーパーソン」に付けた最も露骨な値段でもある。強気の解釈は「最悪期は過ぎた」。BTIG は逆で、S&P 500 はまず 7250〜7350 まで戻した後、再び下げる可能性が高いとみている。"}}, "sections": [{"key": "intl", "num": "01", "color": "#1d4ed8", "deep": "#1e3fa8", "name": {"zh": "国际时事", "en": "World", "es": "Mundo", "ja": "国際"}, "items": [{"idx": "01", "tag": {}, "title": {"zh": "泽连斯基称乌方在利比亚沿海击沉俄「水星」号护卫舰", "en": "Zelensky says Ukraine sank Russia's Merkuryy frigate off Libya", "es": "Zelenski afirma que Ucrania hundió la fragata rusa Merkuryy frente a Libia", "ja": "ゼレンスキー氏、リビア沖でロシア軍艦「メルクーリイ」を撃沈と発表"}, "body": {"zh": "乌克兰总统泽连斯基 23 日在社交媒体发文称，在乌克兰国防军配合下，乌国家安全局 22 日使用 7 艘本国制造的无人艇，在利比亚沿海击沉了俄罗斯「水星」号护卫舰，并称「完成了既定作战目标」。他写道，这艘 2023 年服役的护卫舰是俄最新舰船之一，尽管「敌方试图反击」仍被击沉，一架俄军卡 -27 直升机一并被摧毁；乌方还打击了第二艘目标，即一艘被俄方「用于运输武器」的干货船。泽连斯基称已听取行动的详细报告，并称这是「一次堪称范例的行动」，乌方将继续在指定海域开展作战行动。上述说法由乌方单方面公布，俄方截至发稿未作公开回应，舰艇受损情况尚待独立核实。", "en": "Ukrainian President Volodymyr Zelensky said on social media on 23 November that, with support from Ukraine's defence forces, the Security Service of Ukraine used seven domestically built uncrewed surface vessels on 22 November to sink the Russian frigate Merkuryy off the Libyan coast, «fulfilling the assigned combat objective». He wrote that the ship, commissioned in 2023 and among Russia's newest, went down despite «the enemy's attempts to fight back», and that a Russian Ka-27 helicopter was destroyed with it. Ukraine also struck a second target, a Russian dry-cargo vessel that he said Moscow was «using to transport weapons». Zelensky said he had received a detailed report and called it «an exemplary operation», adding that Ukraine would keep operating in designated sea areas. The account is Ukraine's alone; Russia had made no public response at the time of writing and the extent of the damage remains to be independently verified.", "es": "El presidente ucraniano, Volodímir Zelenski, escribió el 23 de noviembre en redes sociales que, con el apoyo de las fuerzas de defensa, el Servicio de Seguridad de Ucrania empleó el 22 de noviembre siete embarcaciones no tripuladas de fabricación nacional para hundir la fragata rusa Merkuryy frente a las costas de Libia, «cumpliendo el objetivo de combate asignado». Señaló que el buque, en servicio desde 2023 y uno de los más modernos de Rusia, se hundió pese a «los intentos del enemigo de responder», y que con él fue destruido un helicóptero ruso Ka-27. Ucrania también atacó un segundo objetivo, un carguero ruso que, según él, Moscú «utilizaba para transportar armas». Zelenski dijo haber recibido un informe detallado y calificó la acción de «ejemplar», añadiendo que Ucrania seguirá operando en las zonas marítimas designadas. La versión es únicamente ucraniana: Rusia no había respondido públicamente al cierre de esta edición y los daños están pendientes de verificación independiente.", "ja": "ウクライナのゼレンスキー大統領は 23 日、ソーシャルメディアに、国防軍の支援のもとウクライナ保安局が 22 日に国産の無人艇 7 隻を用いてリビア沖でロシアのフリゲート「メルクーリイ」を撃沈し、「所定の作戦目標を達成した」と投稿した。2023 年に就役したこの艦はロシア最新鋭の一隻で、「敵の反撃の試み」があったものの沈没し、ロシア軍の Ka-27 ヘリコプター 1 機も破壊されたという。さらに「武器輸送に使われていた」ロシアの貨物船も攻撃したとしている。ゼレンスキー氏は詳細な報告を受けたと述べ、「模範的な作戦」と評価し、指定海域での作戦を続けるとした。この主張はウクライナ側の単独発表であり、ロシア側は本稿執筆時点で公に反応しておらず、被害の実態は独立した検証を待つ必要がある。"}, "why": {"zh": "战场第一次明显挪到了中东沿海：利比亚沿海不是俄乌交战线，若乌方说法成立，意味着无人艇的作战半径与投送方式都已换了一套路数。同时它也把利比亚这个「外部势力棋盘」再度推到台前——谁在那里有港口、有船只，就成了战争的一部分。", "en": "The battlefield has visibly shifted to the Middle Eastern coast: waters off Libya are not the Russia-Ukraine front, and if Kyiv's account holds, both the range and the delivery method of its drone boats have changed. It also pushes Libya, an established board for outside powers, back into the foreground — whoever has ports and hulls there is now part of this war.", "es": "El frente se ha desplazado visiblemente a la costa de Oriente Próximo: las aguas frente a Libia no son la línea de contacto ruso-ucraniana y, si la versión de Kiev se sostiene, tanto el alcance como el modo de despliegue de sus lanchas no tripuladas han cambiado. Además devuelve al primer plano a Libia, tablero habitual de potencias externas: quien tenga allí puertos y buques pasa a formar parte de esta guerra.", "ja": "戦場が中東沿岸へと目に見えて移った。リビア沖は露宇の交戦線ではなく、ウクライナ側の主張が事実なら、無人艇の作戦半径も投入方法も一段変わったことになる。同時に、外部勢力の盤上にあるリビアを再び前面に押し出した。港と船を持つ者が、この戦争の当事者になる。"}}, {"idx": "02", "tag": {"zh": "进展"}, "title": {"zh": "三艘油轮在霍尔木兹海峡触雷起火，伊朗议长称「有打破封锁的军事手段」", "en": "Three tankers hit mines and burn in Hormuz as Iran's speaker warns of means to break the blockade", "es": "Tres petroleros chocan con minas y arden en Ormuz mientras Irán advierte que puede romper el bloqueo", "ja": "ホルムズ海峡でタンカー3隻が機雷に接触し炎上 イラン議長は「封鎖を破る手段がある」"}, "body": {"zh": "当地时间 24 日凌晨，伊朗伊斯兰革命卫队海军表示，过去几个小时内，三艘油轮在霍尔木兹海峡触雷，引发爆炸并燃起大火；其中一艘在海峡南部近海触雷，另外两艘在海峡东部，事发时这些船只正处于美军的「严密空中掩护和护航」之下。此前一天，伊朗伊斯兰议会议长卡利巴夫表示，外交与战争都是实现威慑的工具，仅靠外交或仅靠战争都无法消除战争阴影，伊朗「有能够打破封锁的军事手段」，如需要将在不久的将来采取行动。伊朗军队另称，一架「入侵的」美制「卢卡斯」无人机在霍尔木兹海峡以东的波斯湾上空被击毁。美方近期把对伊封锁从海上延伸至陆路。上述损失与拦截细节均由伊方公布，美方尚未确认。", "en": "In the early hours of 24 November local time, Iran's Islamic Revolutionary Guard Corps Navy said three tankers had struck mines in the Strait of Hormuz over the preceding hours, exploding and catching fire — one near the southern shore of the strait and two in its eastern waters, at a time when the vessels were under «close US air cover and escort». A day earlier, parliament speaker Mohammad Bagher Qalibaf said diplomacy and war are both instruments of deterrence and neither alone can lift the shadow of war, adding that Iran «has military means to break the blockade» and would use them in the near future if needed. Iran's army separately said it had destroyed an «intruding» US-made Lucas drone over the Persian Gulf east of the strait. Washington has recently extended its blockade of Iran from the sea to land routes. The damage and interception details are Iran's account; the United States has not confirmed them.", "es": "En la madrugada del 24 de noviembre, hora local, la Armada de la Guardia Revolucionaria iraní informó de que tres petroleros chocaron con minas en el estrecho de Ormuz en las horas previas, explosionaron y se incendiaron: uno cerca de la costa sur del estrecho y dos en aguas del este, cuando las embarcaciones estaban bajo «estrecha cobertura aérea y escolta estadounidenses». Un día antes, el presidente del Parlamento, Mohammad Bagher Qalibaf, afirmó que la diplomacia y la guerra son ambos instrumentos de disuasión y que ninguno por sí solo elimina la sombra de la guerra, y sostuvo que Irán «tiene medios militares para romper el bloqueo» y los empleará próximamente si es necesario. El Ejército iraní aseguró por separado haber derribado un dron estadounidense Lucas «intruso» sobre el golfo Pérsico, al este del estrecho. Washington ha extendido recientemente su bloqueo de Irán del mar a las rutas terrestres. Los detalles son la versión iraní; Estados Unidos no los ha confirmado.", "ja": "現地時間 24 日未明、イラン革命防衛隊海軍は、過去数時間にホルムズ海峡でタンカー 3 隻が機雷に接触し、爆発して炎上したと発表した。1 隻は海峡南部の沿岸近く、2 隻は海峡東部で、いずれも米軍の「厳重な空中掩護と護衛」下にあったという。前日の 23 日、イランのガリバフ国会議長は、外交も戦争も抑止の手段であり、どちらか一方だけでは戦争の影を消せないと述べ、「封鎖を破る軍事的手段を持っている」として、必要なら近く実行に移すと語った。イラン軍は別に、海峡東のペルシャ湾上空で「侵入した」米製「ルーカス」無人機を撃墜したと主張した。米国は最近、対イラン封鎖を海上から陸路にも広げている。被害や迎撃の詳細はイラン側の発表であり、米国は確認していない。"}, "why": {"zh": "「美军护航之下仍触雷」这句话，是德黑兰在给华盛顿出的一道题：护航能不能保得住航道，成了封锁政策是否成立的前提。而伊朗议长把「外交」与「战争」并列成两种威慑工具，等于把谈判筹码和军事选项摆在同一张桌上——接下来要看的不是谁说了什么，而是海峡的通行量与战争险保费。", "en": "«Mined even under US escort» is Tehran posing a question to Washington: whether escorts can actually keep the sea lane open is now the premise on which the blockade policy stands. By placing diplomacy and war side by side as instruments of deterrence, the speaker put the negotiating chip and the military option on the same table. What matters next is not who says what, but transit volumes through the strait and war-risk insurance premiums.", "es": "«Minas incluso bajo escolta estadounidense» es Teherán planteando una pregunta a Washington: si las escoltas pueden mantener abierta la ruta marítima es ahora la premisa sobre la que se sostiene la política de bloqueo. Al situar la diplomacia y la guerra como instrumentos de disuasión, el presidente del Parlamento puso la ficha negociadora y la opción militar sobre la misma mesa. Lo decisivo ya no es quién dice qué, sino el volumen de tránsito por el estrecho y las primas de seguro de guerra.", "ja": "「米軍の護衛下でも機雷に接触した」という一言は、テヘランからワシントンへの問いかけだ。護衛で航路を守れるかどうかが、封鎖政策の前提になる。議長が外交と戦争を並べて抑止の手段と呼んだことは、交渉材料と軍事オプションを同じ机に載せたに等しい。今後見るべきは誰が何を言ったかではなく、海峡の通航量と戦争保険料だ。"}}, {"idx": "03", "tag": {"zh": "进展"}, "title": {"zh": "俄方称新一轮俄美乌三方会谈「很快」举行，乌方争取 12 月 25 日前促成四方会议", "en": "Moscow says new trilateral talks are «coming soon» as Kyiv pushes for a four-way meeting by 25 December", "es": "Moscú dice que la nueva ronda trilateral llegará «pronto» mientras Kiev busca una reunión a cuatro bandas antes del 25 de diciembre", "ja": "ロシア「3 者協議は近く開催」 ウクライナは 12 月 25 日までの 4 者会談を模索"}, "body": {"zh": "俄罗斯总统新闻秘书佩斯科夫 23 日对俄新社表示，新一轮俄美乌三方会谈「很快就会举行」，目前考虑的举办地仍是上一轮所在的阿联酋首都阿布扎比，具体日期尚未确定，也可能有其他方案。为期两天的上一轮三方会谈 11 日在阿布扎比结束，各方就大规模交换被俘人员达成协议，但在结束冲突、领土争议、乌克兰安全保障及欧洲未来安全架构等关键问题上仍存「重大分歧」。同日，乌克兰总统泽连斯基表示，乌方愿意尽快举行由乌克兰、欧洲、美国与俄罗斯参与的四方会议，讨论结束战事事宜，乌方称相关伙伴正争取在 12 月 25 日前促成会议。", "en": "Kremlin spokesman Dmitry Peskov told RIA Novosti on 23 November that a new round of Russia-US-Ukraine trilateral talks would take place «very soon», with Abu Dhabi — the venue of the last round — still under consideration, dates not yet fixed and other options possible. The previous two-day round ended in the Emirati capital on 11 November with an agreement on a large-scale exchange of prisoners, but «major differences» remained on ending the conflict, territorial disputes, Ukraine's security guarantees and Europe's future security architecture. The same day, President Zelensky said Kyiv was ready to hold a four-way meeting with Ukraine, Europe, the United States and Russia as soon as possible to discuss ending the war, and Ukrainian officials said partners were pressing to arrange it before 25 December.", "es": "El portavoz del Kremlin, Dmitri Peskov, declaró el 23 de noviembre a RIA Novosti que una nueva ronda de conversaciones trilaterales entre Rusia, Estados Unidos y Ucrania se celebrará «muy pronto», con Abu Dabi —sede de la anterior— todavía en consideración, sin fechas fijadas y con otras opciones posibles. La ronda anterior, de dos días, concluyó en la capital emiratí el 11 de noviembre con un acuerdo para un intercambio masivo de prisioneros, pero persistieron «diferencias importantes» sobre el fin del conflicto, las disputas territoriales, las garantías de seguridad para Ucrania y la futura arquitectura de seguridad europea. Ese mismo día, el presidente Zelenski dijo que Kiev está dispuesta a celebrar cuanto antes una reunión a cuatro bandas con Ucrania, Europa, Estados Unidos y Rusia para discutir el fin de la guerra, y funcionarios ucranianos señalaron que los socios presionan para organizarla antes del 25 de diciembre.", "ja": "ロシア大統領府のペスコフ報道官は 23 日、RIA ノーボスチ通信に、ロシア・米国・ウクライナの 3 者協議の新ラウンドが「近く行われる」と述べた。開催地は前回と同じアラブ首長国連邦の首都アブダビを依然として検討しており、日程は未定で、他の案もあり得るという。前回は 11 日にアブダビで 2 日間の協議を終え、大規模な捕虜交換で合意したものの、紛争終結、領土問題、ウクライナの安全保障、欧州の将来の安保体制といった主要論点では「大きな隔たり」が残った。同日、ゼレンスキー大統領は、ウクライナ・欧州・米国・ロシアによる 4 者会談をできるだけ早く開き、戦争の終結を協議したいと述べ、関係国が 12 月 25 日までの開催を働きかけていると伝えた。"}, "why": {"zh": "「很快举行」四个字从俄方口中说出来，是这轮博弈里第一次由莫斯科给出时间语气。但地点仍是阿布扎比、日期仍未定，说明议程与条件都没谈拢；乌方把 12 月 25 日当作心理节点，也是在给斡旋方上表。三方变四方，多出来的「欧洲」一席，恰恰是俄方此前最不愿意落笔的部分。", "en": "Hearing «very soon» from the Russian side is the first time Moscow has offered any temporal signal in this round. But the venue is still Abu Dhabi and the date is still open, which means agenda and conditions are unsettled; Kyiv's 25 December marker is also a way of putting the mediators on the clock. Going from three parties to four adds a seat for Europe — precisely the part Moscow has least wanted to put in writing.", "es": "Que Moscú diga «muy pronto» es la primera señal temporal rusa en esta ronda. Pero la sede sigue siendo Abu Dabi y la fecha sigue abierta, lo que indica que ni la agenda ni las condiciones están cerradas; la fecha del 25 de diciembre que pone Kiev también sirve para presionar a los mediadores. Pasar de tres a cuatro partes añade un asiento para Europa, justo lo que Moscú menos quería poner por escrito.", "ja": "ロシア側から「近く」という言葉が出たのは、この局面で初めてモスクワが時間のニュアンスを示したものだ。ただし開催地は依然アブダビ、日程も未定で、議題と条件が詰まっていないことを物語る。ウクライナが 12 月 25 日を区切りに置くのは、仲介国に期限を突きつける意味もある。3 者から 4 者になり、「欧州」の席が増える部分こそ、ロシアが最も文書化を嫌ってきた論点だ。"}}, {"idx": "04", "tag": {}, "title": {"zh": "以色列组阁牵头人称伊朗尚不构成「直接威胁」，内塔尼亚胡斥其「淡化威胁」", "en": "Israeli coalition kingmaker sees no «direct threat» from Iran; Netanyahu accuses rivals of playing it down", "es": "El líder que negocia el nuevo Gobierno israelí no ve «amenaza directa» de Irán; Netanyahu le acusa de minimizarla", "ja": "イスラエル連立交渉の立役者「イランは直接の脅威ではない」 ネタニヤフ氏は反発"}, "body": {"zh": "据以色列媒体 23 日报道，以正直党领导人加迪·艾森科特当天在一场党内会议上表示，他目前没有看到伊朗构成需要以色列在新政府组建前采取军事行动的「直接威胁」。他说，伊朗的「最大威胁」是「尚未销毁或移除的 440 公斤浓缩铀」，以色列需要「集中精力处理这一问题」。《以色列时报》同日报道，看守政府总理内塔尼亚胡在利库德集团党内会议前回应称，危险「迫在眉睫」，而其竞争对手是出于政治目的「淡化威胁」。两人表态发生在以色列新政府组阁谈判期间。", "en": "Israeli media reported on 23 November that Gadi Eisenkot, leader of the Yashar party, told a party meeting that he did not currently see Iran posing a «direct threat» that would require Israel to take military action before a new government is formed. He said Iran's «greatest threat» is «440 kilograms of enriched uranium that has not been destroyed or removed», and that Israel needed to «focus on dealing with that». The Times of Israel reported the same day that caretaker Prime Minister Benjamin Netanyahu, speaking before a Likud faction meeting, responded that the danger was «imminent» and that his rivals were «playing down the threat» for political purposes. The exchange came amid coalition talks to form a new Israeli government.", "es": "Medios israelíes informaron el 23 de noviembre de que Gadi Eisenkot, líder del partido Yashar, dijo en una reunión interna que por ahora no ve en Irán una «amenaza directa» que obligue a Israel a actuar militarmente antes de que se forme un nuevo Gobierno. Señaló que la «mayor amenaza» iraní son «440 kilogramos de uranio enriquecido que no han sido destruidos ni retirados», y que Israel debe «concentrarse en eso». The Times of Israel informó ese mismo día de que el primer ministro en funciones, Benjamín Netanyahu, respondió ante la bancada del Likud que el peligro es «inminente» y que sus rivales «minimizan la amenaza» por motivos políticos. El intercambio se produjo en medio de las negociaciones para formar Gobierno.", "ja": "イスラエルメディアは 23 日、イェシャル党のガディ・エイゼンコット党首が党内会合で、新政府の発足前にイスラエルが軍事行動を取る必要のある「直接の脅威」をイランは今のところ示していないと述べたと報じた。イランの「最大の脅威」は「破壊も搬出もされていない 440 キロの濃縮ウラン」であり、イスラエルは「そこに集中すべきだ」と語った。Times of Israel 紙は同日、暫定政権のネタニヤフ首相がリクードの会合前に、危険は「差し迫っている」と反論し、政敵は政治的目的で「脅威を矮小化している」と述べたと伝えた。発言は新政府の連立交渉のさなかに交わされた。"}, "why": {"zh": "同一威胁，两种时间表：一个说「不必在组阁前动手」，一个说「迫在眉睫」。分歧表面是情报判断，实质是组阁筹码——谁把伊朗说成更急的威胁，谁就在联合政府里更有话语权。对市场而言，值得留意的是这种「威胁通胀」往往先于实际动作，也常常在政府成形后迅速降温。", "en": "One threat, two timetables: «no need to act before the government is formed» versus «imminent». The split looks like an intelligence judgement but is really coalition leverage — whoever frames Iran as the more urgent danger gains the louder voice in the next government. For markets, the thing to note is that this kind of threat inflation usually precedes action and often cools quickly once a cabinet is in place.", "es": "Una misma amenaza, dos calendarios: «no hace falta actuar antes de formar Gobierno» frente a «inminente». La discrepancia parece un juicio de inteligencia, pero es sobre todo palanca de coalición: quien presenta a Irán como el peligro más urgente gana voz en el próximo gabinete. Para los mercados, conviene recordar que esta inflación de la amenaza suele preceder a la acción y a menudo se enfría en cuanto el Ejecutivo queda constituido.", "ja": "同じ脅威に二つの時間表。「組閣前に動く必要はない」と「差し迫っている」。対立は情報判断に見えて、実態は連立の材料だ。イランをより切迫した脅威と描いた側が、次の政権で発言権を得る。市場にとって留意すべきは、こうした「脅威のインフレ」が実際の行動に先行し、内閣が固まると急速に冷えることが多い点である。"}}, {"idx": "05", "tag": {"zh": "进展"}, "title": {"zh": "COP31 谈判破裂，「封面决定」未获通过，中方表示失望", "en": "COP31 ends in rupture as the «cover decision» fails; China voices disappointment", "es": "La COP31 termina en ruptura al no aprobarse la «decisión de portada»; China expresa su decepción", "ja": "COP31 が決裂、「カバー決定」採択されず 中国は失望を表明"}, "body": {"zh": "《联合国气候变化框架公约》第三十一次缔约方大会（COP31）在延期两天后于 22 日在土耳其安塔利亚闭幕，会议就公正转型、减缓、适应、资金等议题达成一系列决定，但最终未能就政治决定达成共识，核心政治文件「封面决定」未获通过，直接阻力来自欧盟与巴拿马等缔约方。这份被拦下的草案曾首次在联合国气候机制的正式文本中承认全球变暖正走向突破 1.5 摄氏度门槛，即「超调」。这是自 2009 年哥本哈根 COP15 以来，联合国气候谈判首次出现正式协议在全体会议上被否决；本次加时也打破了 COP25 保持的约 44 小时最长纪录。中国代表团团长、生态环境部副部长李高表示「深感失望」，同时认为不应因此丧失对多边进程的信心；外交部发言人郭嘉昆 23 日表示，中方愿强调全球绿色低碳转型大势不可逆转，各方应坚持共同但有区别的责任原则。下届大会将于 2027 年在埃塞俄比亚举办。", "en": "The 31st Conference of the Parties to the UN Framework Convention on Climate Change closed in Antalya, Türkiye, on 22 November after a two-day overrun, adopting a series of decisions on just transition, mitigation, adaptation and finance but failing to reach consensus on a political decision: the core «cover decision» was not adopted, with EU and Panama among the parties blocking it. The stalled draft would have marked the first time a formal UN climate text acknowledged that warming is heading past the 1.5°C threshold — an «overshoot». It is the first time since Copenhagen in 2009 that a formal agreement has been voted down in plenary, and the overrun broke the roughly 44-hour record set at COP25. Li Gao, head of the Chinese delegation and vice minister of ecology and environment, said China was «deeply disappointed» but that this should not cost anyone faith in the multilateral process; foreign ministry spokesman Guo Jiakun said on 23 November that the global green transition is irreversible and that parties should uphold the principle of common but differentiated responsibilities. COP32 will be held in Ethiopia in 2027.", "es": "La 31.ª Conferencia de las Partes de la Convención Marco de la ONU sobre el Cambio Climático concluyó en Antalya (Turquía) el 22 de noviembre tras dos días de prórroga, con una serie de decisiones sobre transición justa, mitigación, adaptación y financiación, pero sin consenso sobre la decisión política: la «decisión de portada» no fue aprobada, con la UE y Panamá entre las partes que la bloquearon. El borrador detenido habría supuesto el primer reconocimiento en un texto formal de la ONU de que el calentamiento se encamina a superar el umbral de 1,5 °C, es decir, un «sobrepaso». Es la primera vez desde Copenhague 2009 que un acuerdo formal es rechazado en plenaria, y la prórroga batió el récord de unas 44 horas de la COP25. Li Gao, jefe de la delegación china y viceministro de Ecología y Medio Ambiente, dijo que China está «profundamente decepcionada», pero que ello no debe hacer perder la confianza en el proceso multilateral; el portavoz de Exteriores Guo Jiakun afirmó el 23 de noviembre que la transición verde global es irreversible y que las partes deben mantener el principio de responsabilidades comunes pero diferenciadas. La COP32 se celebrará en Etiopía en 2027.", "ja": "国連気候変動枠組条約第 31 回締約国会議（COP31）は 2 日の延長の末、22 日にトルコのアンタルヤで閉幕した。公正な移行、緩和、適応、資金などの分野で一連の決定を採択したものの、政治的决定では合意に至らず、中核文書である「カバー決定」は採択されなかった。阻止したのは EU やパナマなどの締約国である。停止した草案は、温暖化が 1.5 度の閾値を超えつつある、いわゆる「オーバーシュート」を国連気候変動の正式文書として初めて認めるものだった。正式合意が本会議で否決されたのは 2009 年のコペンハーゲン（COP15）以来で、延長幅も COP25 が持つ約 44 時間の記録を更新した。中国代表団長の李高・生態環境次官は「深く失望している」としつつ、多国間プロセスへの信頼を失うべきではないと述べ、外交部の郭嘉昆報道官は 23 日、世界のグリーン・低炭素転換の流れは不可逆であり、「共通だが差異ある責任」の原則を堅持すべきだと語った。次回 COP32 は 2027 年にエチオピアで開かれる。"}, "why": {"zh": "被否掉的不是一份技术文件，而是一句「我们承认会超标」——第一次把「超调」写进正式文本的努力，卡在了「谁该为化石燃料的未来负责」上。2009 年之后十七年，多边气候外交第二次在同一处摔跤。值得留意的是加时纪录本身：谈判越是拖到最后，越说明分歧不在措辞而在利益结构。", "en": "What was rejected was not a technical annex but a sentence — «we acknowledge we will overshoot». The first attempt to write overshoot into a formal text stalled on who is responsible for the future of fossil fuels. Seventeen years after 2009, multilateral climate diplomacy has tripped at the same spot. Note the overrun record itself: the longer talks drag, the clearer it is that the gap is not in wording but in interests.", "es": "Lo rechazado no fue un anexo técnico sino una frase: «reconocemos que vamos a sobrepasarnos». El primer intento de escribir el sobrepaso en un texto formal se atascó en quién es responsable del futuro de los combustibles fósiles. Diecisiete años después de 2009, la diplomacia climática multilateral tropieza en el mismo punto. Conviene mirar el récord de prórroga: cuanto más se alargan las negociaciones, más claro queda que la brecha no está en las palabras sino en los intereses.", "ja": "否決されたのは技術文書ではなく、「超えることを認める」という一文だ。「オーバーシュート」を正式文書に書き込む初めての試みは、化石燃料の将来に誰が責任を負うかで止まった。2009 年から 17 年、多国間気候外交は同じ場所でつまずいた。注目すべきは延長記録そのもので、交渉が長引くほど、隔たりが文言ではなく利害構造にあることがはっきりする。"}}]}, {"key": "dom", "num": "02", "color": "#cf2f1e", "deep": "#a82416", "name": {"zh": "国内要闻", "en": "China", "es": "China", "ja": "国内"}, "items": [{"idx": "01", "tag": {}, "title": {"zh": "《「一老一小」服务体系建设实施方案》发布，2030 年养老护理型床位占比要达到 73%", "en": "China sets 2030 targets for elderly and child care: 73% of nursing beds, 70% community coverage", "es": "China fija metas para 2030 en cuidados de mayores y niños: 73 % de camas asistenciales y 70 % de cobertura comunitaria", "ja": "中国「一老一小」サービス体系の実施方案を公表 2030 年に介護型ベッド 73 % 目標"}, "body": {"zh": "经国务院同意，国家发展改革委、民政部、国家卫生健康委、教育部日前联合印发《「一老一小」服务体系建设实施方案》，11 月 23 日对外公布。方案明确，到 2030 年，养老机构护理型床位占比达到 73%，社区养老服务机构和设施覆盖率达到 70%，3 岁以下婴幼儿入托率较 2025 年提高 6 个百分点，基本形成覆盖城乡、布局合理、价格可接受、质量有保障的普惠养老与托育服务供给格局。任务包括推动医养结合服务设施有序扩容、加快智能技术在养老托育领域落地、探索构建城乡养老服务联合体，并加大资金、土地、人才等要素支撑。方案同时支持有条件的幼儿园举办面向 2 至 3 岁幼儿的托班，提出打造「一刻钟托育服务圈」。", "en": "With State Council approval, the National Development and Reform Commission, the Ministry of Civil Affairs, the National Health Commission and the Ministry of Education issued an implementation plan for the «one elderly, one child» service system, published on 23 November. By 2030, the plan requires nursing-type beds to reach 73% of all elderly-care beds, community elderly-care institutions and facilities to cover 70% of the population, and the enrolment rate for children under three in childcare to rise 6 percentage points from 2025 — building an affordable, quality-assured, universally accessible care system across urban and rural areas. Tasks include expanding integrated medical and elderly care, applying smart technologies, piloting urban-rural elderly-care consortiums and increasing funding, land and staffing support. The plan also backs qualified kindergartens in opening classes for children aged two to three, aiming at a «15-minute childcare circle».", "es": "Con aprobación del Consejo de Estado, la Comisión Nacional de Desarrollo y Reforma, el Ministerio de Asuntos Civiles, la Comisión Nacional de Salud y el Ministerio de Educación publicaron el 23 de noviembre un plan de implementación del sistema de servicios «un mayor, un niño». Para 2030 exige que las camas de tipo asistencial alcancen el 73 % de las plazas geriátricas, que las instituciones y equipamientos de atención comunitaria cubran el 70 % de la población y que la tasa de matrícula en cuidado infantil de menores de tres años suba 6 puntos porcentuales respecto a 2025, configurando un sistema asequible y de calidad en zonas urbanas y rurales. Las tareas incluyen ampliar la atención médica integrada, aplicar tecnologías inteligentes, ensayar consorcios de atención rural-urbana y reforzar financiación, suelo y personal. El plan también respalda que jardines de infancia con condiciones abran clases para niños de dos a tres años, con el objetivo de un «círculo de cuidado infantil de 15 minutos».", "ja": "国務院の同意を得て、国家発展改革委員会、民政部、国家衛生健康委員会、教育部がこのほど「一老一小」サービス体系建設の実施方案を共同で策定し、11 月 23 日に公表した。2030 年までに、養老施設の介護型ベッドの比率を 73 %、社区（コミュニティ）養老サービス施設のカバー率を 70 % とし、3 歳未満の入所率を 2025 年比で 6 ポイント引き上げる。都市と農村を覆い、配置が合理的で、価格が受け入れ可能で、品質が確保された普惠型の養老・託育サービスの供給構造をほぼ形成することを目指す。医療と養老の結合施設の拡充、スマート技術の導入、都市農村の養老サービス連合体の試行、資金・土地・人材の支援強化などを柱とする。条件を満たす幼稚園が 2〜3 歳児の託班を開くことも支持し、「15 分託育サービス圏」の整備を掲げた。"}, "why": {"zh": "三个百分数把话说得很直：养老看「护理型」，说明重心从「有地方住」转向「有人照护」；社区覆盖率 70%，意味着绝大多数老人要在家门口解决问题；入托率提高 6 个百分点，则是把托育从家庭私事变成公共服务。配套的「幼儿园办托班」尤其关键——一边是四年关停超 6 万所幼儿园的空置教室，一边是 7.86% 的实际入托率，供需正好对得上。", "en": "Three percentages tell the story plainly. «Nursing-type» beds mean the focus shifts from having a place to live to having someone to care for you; 70% community coverage means most older people will be served at their doorstep; a six-point rise in childcare enrolment turns a family matter into a public service. The kindergarten provision is the crux: over 60,000 kindergartens have closed in four years, leaving empty classrooms, while the actual childcare enrolment rate stands at 7.86% — supply and demand line up almost exactly.", "es": "Tres porcentajes lo dicen todo. Las camas «asistenciales» indican que el foco pasa de tener dónde vivir a tener quién cuide; el 70 % de cobertura comunitaria implica atender a la mayoría de los mayores en su propio barrio; y seis puntos más de matrícula convierten el cuidado infantil en un servicio público. La medida de los jardines es la clave: más de 60.000 cerrados en cuatro años dejan aulas vacías, mientras la tasa real de matrícula infantil es del 7,86 %; oferta y demanda encajan casi exactamente.", "ja": "三つの数字が率直に語っている。介護型ベッドは「住む場所」から「世話をする人」へ重心が移ることを示し、社区カバー率 70 % は大多数の高齢者が自宅近くで解決することを意味し、入所率 6 ポイント増は託育を家庭の私事から公共サービスに変える。鍵は幼稚園の託班だ。4 年間で 6 万園以上が閉鎖されて教室が余る一方、3 歳未満の実際の入所率は 7.86 %。需給がほぼ噛み合っている。"}}, {"idx": "02", "tag": {}, "title": {"zh": "《社会保险基金监督条例》公开征求意见，任何组织和个人有权举报骗保", "en": "China drafts social insurance fund supervision rules, giving anyone the right to report fraud", "es": "China abre a consulta un reglamento de supervisión de los fondos de la seguridad social con derecho de denuncia para cualquiera", "ja": "社会保険基金監督条例が意見募集 誰でも不正通報できる規定を明記"}, "body": {"zh": "人力资源社会保障部 11 月 23 日发布《社会保险基金监督条例（征求意见稿）》，即日起至 12 月 23 日向社会公开征求意见。征求意见稿聚焦基本养老保险、工伤保险、失业保险基金的支付、管理、投资运营，明确基金管理的原则和要求，规定基金监督的职责、权限与措施，以及欺诈骗保等违法违规行为的法律责任，并明确任何组织和个人有权对侵害社会保险基金的违法违规行为进行举报。人社部称，条例旨在维护社会保险基金安全，守护人民群众的「养老钱」「保命钱」。", "en": "The Ministry of Human Resources and Social Security released a draft regulation on supervising social insurance funds on 23 November, open for public comment until 23 December. The draft focuses on the payment, management and investment operations of basic pension, work-injury and unemployment insurance funds, setting out principles and requirements for fund management, the duties, powers and measures of supervision, and the legal liability for fraud and other violations. It states explicitly that any organisation or individual has the right to report conduct that harms social insurance funds. The ministry said the rules aim to safeguard fund security and protect what it called the public's «pension money» and «lifeline money».", "es": "El Ministerio de Recursos Humanos y Seguridad Social publicó el 23 de noviembre un proyecto de reglamento sobre la supervisión de los fondos de la seguridad social, abierto a comentarios públicos hasta el 23 de diciembre. El texto se centra en el pago, la gestión y la inversión de los fondos de pensiones básicas, accidentes laborales y desempleo, y fija principios y requisitos de gestión, las funciones, competencias y medidas de supervisión, y la responsabilidad legal por fraude y otras infracciones. Establece expresamente que toda organización o persona tiene derecho a denunciar conductas que perjudiquen estos fondos. El ministerio afirma que la norma busca proteger la seguridad de los fondos y lo que denomina el «dinero de la pensión» y el «dinero para vivir» de la ciudadanía.", "ja": "人力資源社会保障部は 11 月 23 日、「社会保険基金監督条例（意見募集稿）」を公表し、12 月 23 日まで意見を募る。基本養老保険、労災保険、失業保険の基金の給付・管理・運用を対象に、基金管理の原則と要件、監督の職責・権限・措置、保険金詐取などの違法行為の法的責任を定める。侵害行為を通報する権利をあらゆる組織・個人が持つことも明記した。同部は、基金の安全と人々の「養老資金」「命綱の資金」を守るためのものだと説明している。"}, "why": {"zh": "社保基金的监管此前散在多份规章里，这次是一部专门条例，而且把「举报权」写给所有组织和个人——等于把监督从部门职责变成社会机制。对普通人更实际的是那句法律责任的明确：骗保不再只是「违规」，而是有了可追的法律后果。征求意见到 12 月 23 日，还有一个月可以提意见。", "en": "Fund supervision was previously scattered across several sets of rules; this is a dedicated regulation, and it grants the right to report to every organisation and individual — turning oversight from a departmental duty into a social mechanism. More concrete for ordinary people is the codified liability: defrauding the funds is no longer merely «non-compliant» but carries enforceable legal consequences. Comments are open until 23 December, so there is a month to weigh in.", "es": "La supervisión de estos fondos estaba repartida en varias normas; ahora hay un reglamento específico que reconoce el derecho de denuncia a toda organización y persona, convirtiendo la vigilancia de una tarea administrativa en un mecanismo social. Para el ciudadano es más relevante la responsabilidad jurídica codificada: defraudar ya no es solo «irregular» sino que acarrea consecuencias exigibles. El plazo de alegaciones termina el 23 de diciembre.", "ja": "基金監督はこれまで複数の規則に分散していたが、今回は専用の条例となり、通報する権利をあらゆる組織・個人に認めた。監督を部署の職務から社会の仕組みへ変える意味がある。市民にとって現実的なのは法的責任の明記だ。不正受給はもはや「違反」ではなく、追及可能な法的帰結を伴う。意見募集は 12 月 23 日まで続く。"}}, {"idx": "03", "tag": {}, "title": {"zh": "海军多型舰机将实装亮相第十六届中国航展，首设高栏海上装备展示区", "en": "Chinese navy to appear in force at Airshow China with first-ever offshore display zone", "es": "La Armada china acudirá con medios reales a Airshow China y estrena una zona de exhibición marítima", "ja": "中国海軍が中国航空ショーに実装参加 初の海上装備展示区を設置"}, "body": {"zh": "人民海军 11 月 23 日发布消息，12 月 7 日至 13 日，海军将实装参加在广东珠海举行的第十六届中国国际航空航天博览会，并首次拓展海上维度，增设高栏海上装备展示区，实现主战舰艇、新锐舰载机、陆战和无人智能装备陆海空联动、全景式亮相，多型现役装备将首次公开。海军将从室内展厅、室外静态展示、飞行表演和舰艇开放四个方面集中展出。075 型两栖攻击舰、055 型导弹驱逐舰和 054A 型导弹护卫舰等新型主战舰艇驻泊高栏港面向公众开放；室外静态展示区展出歼 -15T 舰载战斗机、直 -20F 舰载反潜直升机、运 -9 反潜巡逻机、无直 -2 无人直升机等；飞行表演环节派出歼 -35 与歼 -15T 舰载战斗机、空警 -600 预警机及教 -15、直 -20J、直 -8C 直升机，进行编队飞行、通场飞行与机场破袭演练。本届航展采用航展中心主展区、莲洲无人装备展示区、高栏海上装备展示区的「一展三区」布局，海上展区免费开放、需网上预约。", "en": "The People's Navy announced on 23 November that from 7 to 13 December it will participate with real equipment at the 16th Airshow China in Zhuhai, Guangdong, extending into the maritime dimension for the first time with a new Gaolan offshore equipment display zone — a full sea-air-land showcase of major surface combatants, new carrier aircraft, marine corps and unmanned systems, with several types of in-service equipment shown publicly for the first time. Displays will run across an indoor hall, an outdoor static park, flying displays and ship visits. The Type 075 amphibious assault ship, Type 055 destroyer and Type 054A frigate will berth at Gaolan port and open to the public; the static park features the J-15T carrier fighter, Z-20F anti-submarine helicopter, Y-9 anti-submarine patrol aircraft and the Wuzhi-2 unmanned helicopter. Flying displays will include J-35 and J-15T fighters, the KJ-600 airborne early warning aircraft, plus JL-15, Z-20J and Z-8C helicopters in formation, fly-past and airfield-strike drills. The show uses a «one show, three zones» layout — the main centre, the Lianzhou unmanned systems zone and the Gaolan offshore zone, which is free but requires online booking.", "es": "La Armada Popular anunció el 23 de noviembre que del 7 al 13 de diciembre participará con material real en el 16.º Airshow China en Zhuhai (Guangdong), ampliando por primera vez la dimensión marítima con una nueva zona de exhibición de equipos offshore en Gaolan: un despliegue conjunto mar-aire-tierra de grandes buques de combate, nuevos aviones embarcados, fuerzas de desembarco y sistemas no tripulados, con varios equipos en servicio mostrados en público por primera vez. Habrá pabellón interior, parque estático exterior, exhibiciones de vuelo y visitas a buques. El porta-helicópteros de asalto anfibio Tipo 075, el destructor Tipo 055 y la fragata Tipo 054A atracarán en el puerto de Gaolan y abrirán al público; el parque estático incluye el caza embarcado J-15T, el helicóptero antisubmarino Z-20F, el avión de patrulla Y-9 y el helicóptero no tripulado Wuzhi-2. En vuelo participarán cazas J-35 y J-15T, el avión de alerta temprana KJ-600 y helicópteros JL-15, Z-20J y Z-8C en formaciones, pasadas y ejercicios de asalto a aeródromo. El certamen usa el esquema «una feria, tres zonas»; la zona marítima es gratuita con reserva en línea.", "ja": "人民海軍は 11 月 23 日、12 月 7 日から 13 日まで広東省珠海で開かれる第 16 回中国国際航空宇宙博覧会に実装で参加し、初めて海上方向へ拡張して高欄海上装備展示区を設けると発表した。主力水上戦闘艦、新型艦載機、海兵装備、無人・智能装備が海陸空で連動して全景的に登場し、複数の現役装備が初公開される。屋内展示場、屋外静態展示、飛行展示、艦艇一般公開の 4 面で構成する。075 型強襲揚陸艦、055 型駆逐艦、054A 型フリゲートなどが高欄港に停泊し一般公開される。屋外静態展示には J-15T 艦載戦闘機、Z-20F 対潜ヘリ、Y-9 対潜哨戒機、無人ヘリ Wuzhi-2 などが並ぶ。飛行展示では J-35 と J-15T、早期警戒機 KJ-600、練習機 JL-15、Z-20J、Z-8C が編隊飛行、通過飛行、飛行場破壊演練を行う。今回は会場中心区、蓮洲無人装備区、高欄海上装備区の「1 展示 3 区」体制で、海上区は無料だがオンライン予約が必要だ。"}, "why": {"zh": "「实装」两个字是重点：参展的不是展品，而是常年在外执行战备训练与维权任务的现役装备。更关键的是「舰艇平台 + 舰载航空」第一次成体系同台——过去航展看飞机、看模型，这次能看到航母编队的完整作战链条。075、055、054A 直接停到高栏港对公众开放，也是海军开放度的一次实测。", "en": "The key word is «real equipment»: these are not display pieces but in-service assets that routinely deploy for training and patrol duties. More important, «ship platform plus carrier aviation» appears as a system for the first time — past shows offered aircraft and models; this one shows the full operational chain of a carrier group. Berthing the Type 075, 055 and 054A at Gaolan for public visits is also a live test of how open the navy is willing to be.", "es": "La palabra clave es «material real»: no son piezas de exhibición sino medios en servicio que despliegan habitualmente. Más importante aún, «plataforma naval más aviación embarcada» aparece por primera vez como sistema: antes se veían aviones y maquetas; ahora, la cadena operativa completa de un grupo de portaaviones. Atracar los Tipo 075, 055 y 054A en Gaolan para visitas públicas es también una prueba real de la apertura de la Armada.", "ja": "要点は「実装」の二文字だ。並ぶのは展示品ではなく、遠海で任務に就く現役装備である。さらに重要なのは「艦艇プラットフォーム＋艦載航空」が初めて体系として揃うこと。これまでの航空ショーは機体と模型だったが、今回は空母打撃群の作戦の連なりが見える。075、055、054A を高欄港に停泊させ一般公開するのも、海軍の開放度を測る実地テストになる。"}}, {"idx": "04", "tag": {"zh": "进展"}, "title": {"zh": "神舟二十四号发射在即，空间站与任务各系统准备顺利推进", "en": "Shenzhou-24 launch nears as space station and mission systems report readiness", "es": "Se acerca el lanzamiento de la Shenzhou-24 con los sistemas de la estación y de la misión listos", "ja": "神舟 24 号の打ち上げ間近 宇宙ステーションと各システムの準備順調"}, "body": {"zh": "据中国载人航天工程办公室与央视新闻 11 月 23 日消息，神舟二十四号载人飞船发射在即，目前空间站与任务各系统准备工作顺利推进，发射前各项测试与演练有序开展。此前 11 月 21 日，任务已完成发射前最后一次全区合练，船箭组合体已在发射区待命。此次任务为中国空间站应用与发展阶段的又一次载人飞行。", "en": "According to the China Manned Space Agency and CCTV News on 23 November, the Shenzhou-24 crewed spacecraft is close to launch, with preparations across the space station and mission systems proceeding smoothly and pre-launch tests and drills running on schedule. The mission completed its final full-system rehearsal on 21 November, and the combined spacecraft and rocket have been standing by at the launch area. It will be another crewed flight in the application and development phase of China's space station.", "es": "Según la Agencia China de Vuelos Espaciales Tripulados y CCTV el 23 de noviembre, la nave tripulada Shenzhou-24 está próxima a su lanzamiento: los preparativos de la estación espacial y de los sistemas de la misión avanzan sin contratiempos y las pruebas y simulacros previos se desarrollan según lo previsto. El 21 de noviembre se completó el último ensayo general de todos los sistemas y el conjunto nave-cohete permanece en la zona de lanzamiento. Será otro vuelo tripulado de la fase de aplicación y desarrollo de la estación espacial china.", "ja": "中国有人宇宙飛行弁公室と CCTV の 11 月 23 日の報道によると、神舟 24 号有人宇宙船の打ち上げが近づいており、宇宙ステーションと各システムの準備は順調に進み、打ち上げ前の試験や演練も予定どおり行われている。11 月 21 日には最後の全系統統合演練を終え、船体とロケットの組み合わせは発射区で待機している。中国宇宙ステーションの応用・発展段階における有人飛行となる。"}, "why": {"zh": "从「完成合练」到「各系统准备顺利推进」，措辞的变化通常意味着发射窗口就在眼前。这类任务真正的看点不在发射那一刻，而在后续：乘组轮换、在轨交接与空间站长期运营的节奏能否稳定下来。", "en": "From «rehearsal complete» to «systems ready», the shift in wording usually means the window is close. The real story is not the ignition but what follows: whether crew rotation, in-orbit handover and the cadence of long-term station operations hold steady.", "es": "Pasar de «ensayo completado» a «sistemas listos» suele indicar que la ventana está cerca. Lo relevante no es el encendido, sino lo que viene después: si la rotación de tripulaciones, el relevo en órbita y el ritmo de operación de la estación se mantienen estables.", "ja": "「統合演練の完了」から「各システムの準備順調」への表現の変化は、打ち上げの窓が近いことを意味することが多い。本当の焦点は点火の瞬間ではなく、その先にある。乗組員の交代、軌道上での引き継ぎ、長期運用のリズムが安定するかどうかだ。"}}, {"idx": "05", "tag": {}, "title": {"zh": "国务院台办与中国进出口银行签署「十五五」时期促进两岸融合发展金融合作协议", "en": "Taiwan affairs office and Exim Bank of China sign «15th Five-Year Plan» financing pact for cross-strait integration", "es": "La oficina de asuntos de Taiwán y el Banco de Exportaciones e Importaciones firman un acuerdo financiero para la integración a ambos lados del estrecho", "ja": "国務院台湾事務弁公室と中国輸出入銀行が「第 15 次五カ年計画」期の両岸融合発展金融協力協定に署名"}, "body": {"zh": "国务院台湾事务办公室与中国进出口银行 11 月 23 日在北京签署《「十五五」时期促进两岸融合发展金融合作协议》。根据协议，「十五五」时期，中国进出口银行将在支持台商台企扎根大陆发展、涉台园区建设、大陆企业赴台投资、两岸企业贸易往来、大陆台资企业参与共建「一带一路」等方面加强综合金融服务，提供融资支持。中共中央台办、国务院台办主任宋涛在签署仪式上表示，协议是为台商台企解决融资问题、支持其把握「十五五」发展机遇的具体举措，将秉持两岸一家亲理念，积极为台湾同胞办实事、做好事、解难事。中国进出口银行董事长陈怀宇表示，将把金融资源向两岸融合发展重点领域倾斜。进出口银行上海、重庆、湖北、广东、福建、厦门分行与一批台资企业协会、台资企业现场签署金融合作协议。", "en": "The State Council Taiwan Affairs Office and the Export-Import Bank of China signed an agreement in Beijing on 23 November on financial cooperation to promote cross-strait integration during the 15th Five-Year Plan period. Under the pact, the bank will strengthen integrated financial services and lending support for Taiwan-funded firms putting down roots on the mainland, for Taiwan-related industrial parks, for mainland investment in Taiwan, for trade between companies on both sides and for mainland-based Taiwan firms joining the Belt and Road Initiative. Song Tao, head of the Taiwan Affairs Office, said at the ceremony that the agreement addresses financing difficulties and helps Taiwanese businesses seize opportunities in the new plan period, adding that the office will keep the principle that «both sides of the strait are one family» and work to solve practical problems for Taiwan compatriots. Exim Bank chairman Chen Huaiyu said financial resources would be tilted toward key areas of cross-strait integration. Branches in Shanghai, Chongqing, Hubei, Guangdong, Fujian and Xiamen signed project agreements on site with Taiwan business associations and firms.", "es": "La Oficina de Asuntos de Taiwán del Consejo de Estado y el Banco de Exportaciones e Importaciones de China firmaron el 23 de noviembre en Pekín un acuerdo de cooperación financiera para promover la integración a ambos lados del estrecho durante el 15.º Plan Quinquenal. Según el texto, el banco reforzará los servicios financieros integrales y el apoyo crediticio a las empresas taiwanesas que se establezcan en la China continental, a los parques industriales vinculados a Taiwán, a la inversión continental en Taiwán, al comercio entre empresas de ambos lados y a la participación de firmas taiwanesas en la Franja y la Ruta. Song Tao, director de la oficina, afirmó en la ceremonia que el acuerdo responde a las dificultades de financiación y ayuda a las empresas taiwanesas a aprovechar el nuevo ciclo, y que se mantendrá el principio de que «ambos lados del estrecho son una sola familia». El presidente del banco, Chen Huaiyu, dijo que los recursos financieros se orientarán a las áreas clave de la integración. Sucursales en Shanghái, Chongqing, Hubei, Guangdong, Fujian y Xiamen firmaron acuerdos con asociaciones y empresas taiwanesas.", "ja": "国務院台湾事務弁公室と中国輸出入銀行は 11 月 23 日、北京で「第 15 次五カ年計画」期の両岸融合発展を促進する金融協力協定に署名した。協定により、中国輸出入銀行は大陸に根を下ろす台湾系企業、台湾関連園区の建設、大陸企業の対台湾投資、両岸企業の貿易、大陸の台湾系企業による「一帯一路」共同建設への参加などで総合金融サービスと融資支援を強化する。中共中央台湾工作弁公室・国務院台湾事務弁公室の宋濤主任は署名式で、台湾系企業の資金調達問題を解決し新たな五カ年計画のチャンスをつかむ支援策だと述べ、「両岸は一家族」の理念のもと、台湾同胞のために実事を成す考えを示した。中国輸出入銀行の陳懐宇董事長は、金融資源を両岸融合の重点分野に傾けると語った。上海、重慶、湖北、広東、福建、アモイの分行が台湾系企業協会・企業と現場で金融協力協定を結んだ。"}, "why": {"zh": "这份协议的特别之处是把「金融」放在了融合的最前面：不谈口号，谈授信、谈园区、谈赴台投资与贸易结算。选择在「十五五」开局前签署，等于给台商一个跨周期的资金预期；而把「大陆企业赴台投资」写进协议，也把两岸经贸从单向变成双向叙事。", "en": "What stands out is that finance is placed at the front of integration: no slogans, but credit lines, industrial parks, mainland investment in Taiwan and trade settlement. Signing before the 15th Five-Year Plan begins gives Taiwanese businesses a funding horizon that spans the cycle, and including «mainland investment in Taiwan» turns the cross-strait economic story from one-way to two-way.", "es": "Lo llamativo es que la financiación se coloca al frente de la integración: sin consignas, con líneas de crédito, parques industriales, inversión continental en Taiwán y liquidación comercial. Firmar antes de que arranque el 15.º Plan da a las empresas taiwanesas un horizonte de financiación que cruza el ciclo, e incluir la «inversión continental en Taiwán» convierte el relato económico en bidireccional.", "ja": "特徴は「金融」を融合の最前列に置いたことだ。スローガンではなく、与信、園区、対台湾投資、貿易決済が並ぶ。「第 15 次五カ年計画」の開始前に署名したことは、台湾系企業に周期をまたぐ資金の見通しを与える。さらに「大陸企業の対台湾投資」を書き込んだことで、両岸経済の語り口は一方通行から双方向へ変わる。"}}]}, {"key": "fin", "num": "03", "color": "#b45309", "deep": "#8a3f07", "name": {"zh": "金融要闻", "en": "Markets", "es": "Mercados", "ja": "金融"}, "items": [{"idx": "01", "tag": {"zh": "进展"}, "title": {"zh": "美股一夜回血：纳指涨 6.51%、费半涨 14.03%，标普与道指刚在上周五确认调整", "en": "Wall Street rebounds in a night: Nasdaq +6.51%, chips +14.03%, days after a confirmed correction", "es": "Wall Street rebota en una noche: Nasdaq +6,51 % y semiconductores +14,03 %, días después de confirmar la corrección", "ja": "米国株が一夜で回復 ナスダック 6.51 % 高、半導体指数 14.03 % 高"}, "body": {"zh": "隔夜美股三大指数集体大幅收高，纳指涨 6.51% 报 24089.56 点，标普 500 涨 4.73% 报 7237.17 点，道指涨 3.01% 报 49595.31 点，费城半导体指数大涨 14.03%，均录得 2025 年 4 月以来最大单日涨幅。个股方面，美光科技涨逾 19%，英特尔涨超 16%，戴尔涨 20%，特斯拉涨超 11%，Meta 涨超 6%，纳斯达克中国金龙指数涨 2.44%，阿里巴巴涨 6%，万国数据涨超 13%；新上市的 Anthropic 逆势跌 1.4%。欧洲三大股指同步收涨，德国 DAX 涨 2.15% 报 25337.27 点，法国 CAC40 涨 1.48% 报 8044.84 点，英国富时 100 涨 1.3% 报 10480.82 点。宏观层面，标普全球公布的 11 月综合采购经理指数初值下降 1.3 点至 54.6，为四个月以来最低。富国银行将美国大盘股评级由「看好」上调至「最看好」，认为上周暴跌提供加仓机会，标普 500 的 7000 点可能是第一道关键关口。", "en": "US stocks closed sharply higher overnight: the Nasdaq rose 6.51% to 24,089.56, the S&P 500 4.73% to 7,237.17 and the Dow 3.01% to 49,595.31, while the Philadelphia Semiconductor Index jumped 14.03% — the biggest one-day gains for all since April 2025. Micron climbed more than 19%, Intel over 16%, Dell 20%, Tesla over 11% and Meta over 6%; the Nasdaq Golden Dragon China Index added 2.44%, Alibaba 6% and GDS over 13%, while newly listed Anthropic slipped 1.4%. Europe followed, with Germany's DAX up 2.15% to 25,337.27, France's CAC 40 up 1.48% to 8,044.84 and the FTSE 100 up 1.3% to 10,480.82. On the macro side, the S&P Global November composite PMI fell 1.3 points to 54.6, a four-month low. Wells Fargo upgraded US large caps from «favorable» to «most favorable», calling last week's selloff an opportunity to add, and flagging 7,000 on the S&P 500 as the first key threshold.", "es": "Las bolsas estadounidenses cerraron con fuertes alzas: el Nasdaq subió un 6,51 % hasta 24.089,56, el S&P 500 un 4,73 % hasta 7.237,17 y el Dow un 3,01 % hasta 49.595,31, mientras el índice de semiconductores de Filadelfia saltó un 14,03 %, los mayores avances diarios de todos ellos desde abril de 2025. Micron subió más del 19 %, Intel más del 16 %, Dell un 20 %, Tesla más del 11 % y Meta más del 6 %; el índice Golden Dragon de China en el Nasdaq ganó un 2,44 %, Alibaba un 6 % y GDS más del 13 %, mientras la recién cotizada Anthropic cedió un 1,4 %. Europa acompañó: el DAX alemán subió un 2,15 % hasta 25.337,27, el CAC 40 un 1,48 % hasta 8.044,84 y el FTSE 100 un 1,3 % hasta 10.480,82. En el plano macro, el PMI compuesto de noviembre de S&P Global cayó 1,3 puntos hasta 54,6, mínimo de cuatro meses. Wells Fargo elevó la recomendación sobre la gran capitalización estadounidense de «favorable» a «muy favorable», consideró la caída de la semana pasada una oportunidad de compra y situó los 7.000 puntos del S&P 500 como primer umbral clave.", "ja": "前夜の米国株は主要 3 指数がそろって大幅高となった。ナスダック総合指数は 6.51 % 高の 24089.56、S&P 500 種は 4.73 % 高の 7237.17、ダウ平均は 3.01 % 高の 49595.31、フィラデルフィア半導体指数は 14.03 % 上昇し、いずれも 2025 年 4 月以来の大きな上げ幅となった。個別ではマイクロンが 19 % 超、インテルが 16 % 超、デルが 20 %、テスラが 11 % 超、メタが 6 % 超上昇。ナスダック中国金龍指数は 2.44 % 高、アリババは 6 % 高、GDS は 13 % 超高となった一方、新規上場した Anthropic は 1.4 % 安だった。欧州も連れ高し、ドイツ DAX は 2.15 % 高の 25337.27、フランス CAC40 は 1.48 % 高の 8044.84、英国 FTSE100 は 1.3 % 高の 10480.82。マクロでは S&P グローバルの 11 月総合 PMI 速報値が 1.3 ポイント低下して 54.6 と 4 カ月ぶりの低水準になった。ウェルズ・ファーゴは米国大型株の評価を「強気」から「最も強気」へ引き上げ、先週の急落を買い増しの機会とみて、S&P 500 の 7000 を最初の重要な節目とした。"}, "why": {"zh": "这轮反弹的性质值得看清：不是基本面转好，而是「不确定性被撤掉」。PMI 掉到四个月最低，说明实体数据并不支持大涨；真正把指数拉起来的是「AI 交易里最大的一根刺被拔了」。所以机构的分歧也集中在这里——富国说这是加仓机会，BTIG 说反弹到 7250 至 7350 后「很可能再次走低」。", "en": "The nature of this rebound matters: it is not an improvement in fundamentals but the removal of an uncertainty. The PMI at a four-month low hardly justifies a surge; what lifted the indexes was the extraction of the biggest thorn in the AI trade. That is exactly where strategists split — Wells Fargo calls it a buying opportunity, BTIG expects a rebound to 7,250–7,350 before «likely heading lower again».", "es": "La naturaleza del rebote importa: no es una mejora de los fundamentales sino la retirada de una incertidumbre. Un PMI en mínimos de cuatro meses difícilmente justifica el salto; lo que impulsó los índices fue quitar la mayor espina del comercio de la IA. Ahí se dividen los estrategas: Wells Fargo lo ve como oportunidad de compra y BTIG espera un rebote hasta 7.250-7.350 antes de «probablemente volver a caer».", "ja": "この反発の性格を見極めたい。ファンダメンタルズの改善ではなく、「不確実性の除去」だ。PMI が 4 カ月ぶり低水準では大幅高を説明できない。指数を押し上げたのは AI 相場の最大の棘を抜いたことにある。だから見方も割れる。ウェルズ・ファーゴは買い増しの機会とし、BTIG は 7250〜7350 まで戻した後に「再び下げる可能性が高い」とみる。"}}, {"idx": "02", "tag": {"zh": "进展"}, "title": {"zh": "韩国综指收跌 3.31%、盘中触发「侧车机制」，财长称必要时启用股市稳定基金", "en": "KOSPI falls 3.31% and trips a sidecar as Seoul's finance minister flags a stabilisation fund", "es": "El KOSPI cae un 3,31 % y activa el «sidecar»; el ministro de Finanzas apunta a un fondo de estabilización", "ja": "韓国総合指数 3.31 % 安、「サイドカー」発動 財務相は安定基金の活用に言及"}, "body": {"zh": "受上周全球抛售压力传导，韩国综合指数 23 日收跌 3.31% 报 4708.54 点，盘中一度跌超 5%，触发「侧车机制」，韩国交易所暂停程序化卖盘；三星电子跌 3%，SK 海力士跌 2.5%。韩国财长李炯日表示，正密切关注股市波动，将在必要时及时启用股市稳定基金。同日，日本股市因节假日休市（上周五日经 225 指数已跌 5.06%）；印度 SENSEX30 指数收跌 1.77% 报 82435.99 点。港股方面，恒生指数收跌 0.12%，恒生科技指数跌 0.09%，盘初一度翻红；黄金股逆市走强，灵宝黄金涨超 10%、赤峰黄金涨超 9%、紫金矿业涨超 4%；物理 AI 概念走强，商米科技涨超 48% 创历史新高。", "en": "Carrying last week's global selloff into Asia, South Korea's KOSPI closed down 3.31% at 4,708.54 on 23 November after falling more than 5% intraday and tripping a sidecar mechanism that halted programme selling on the exchange; Samsung Electronics fell 3% and SK Hynix 2.5%. Finance Minister Lee Hyoung-il said the government was closely monitoring volatility and would activate the stock market stabilisation fund in a timely way if needed. Japanese markets were closed for a public holiday, after the Nikkei 225 had already dropped 5.06% on Friday; India's SENSEX fell 1.77% to 82,435.99. Hong Kong's Hang Seng closed down 0.12% and the Hang Seng Tech Index 0.09% after briefly turning positive; gold miners defied the trend, with Lingbao Gold up over 10%, Chifeng Gold over 9% and Zijin Mining over 4%, while physical AI names rallied — Sunmi Technology jumped more than 48% to a record high.", "es": "Contagiado por las ventas globales de la semana pasada, el KOSPI surcoreano cerró el 23 de noviembre con una caída del 3,31 % hasta 4.708,54 tras perder más del 5 % intradía y activar el mecanismo «sidecar», que suspendió la venta programada en el parqué; Samsung Electronics cayó un 3 % y SK Hynix un 2,5 %. El ministro de Finanzas, Lee Hyoung-il, dijo que se vigila de cerca la volatilidad y que se activará el fondo de estabilización bursátil cuando sea necesario. Japón no operó por festivo, después de que el Nikkei 225 ya hubiera caído un 5,06 % el viernes; el SENSEX indio perdió un 1,77 % hasta 82.435,99. En Hong Kong, el Hang Seng cedió un 0,12 % y el Hang Seng Tech un 0,09 % tras girar brevemente a positivo; las mineras de oro desafiaron la tendencia, con Lingbao Gold más del 10 %, Chifeng Gold más del 9 % y Zijin Mining más del 4 %, mientras los valores de «IA física» subían: Sunmi Technology se disparó más del 48 % hasta un máximo histórico.", "ja": "先週の世界的な売りを引き継ぎ、韓国総合指数（KOSPI）は 23 日、3.31 % 安の 4708.54 で引けた。取引中に 5 % 超下落して「サイドカー」が発動し、韓国取引所はプログラム売りを一時停止した。サムスン電子は 3 % 安、SK ハイニックスは 2.5 % 安。韓国の李炯日（イ・ヒョンイル）財務相は、株価の変動を注視しており、必要なら株式安定基金を機動的に活用すると述べた。日本市場は祝日で休場（日経平均はすでに金曜日に 5.06 % 下落）。インドの SENSEX30 は 1.77 % 安の 82435.99。香港はハンセン指数が 0.12 % 安、ハンセン科技指数が 0.09 % 安で、寄り付き後は一時プラスに転じた。金鉱株は逆行高で、霊宝黄金が 10 % 超、赤峰黄金が 9 % 超、紫金鉱業が 4 % 超上昇。フィジカル AI 関連も強く、商米科技は 48 % 超高と史上最高値を付けた。"}, "why": {"zh": "「侧车机制」是韩国市场独有的熔断式安排，被触发本身就是情绪指标的极值。更值得注意的是官方的措辞——「必要时及时启用稳定基金」，这句话在韩国通常出现在真正紧张的时刻。与之对照，同一时段的港股只微跌、A 股反而翻红，说明这一轮冲击的落点高度集中在半导体权重股上。", "en": "The sidecar is a circuit-breaker unique to Korea, and tripping it is itself an extreme sentiment reading. More telling is the official language — activating the stabilisation fund «in a timely way when necessary» is a phrase Seoul usually reserves for genuinely tense moments. Set against that, Hong Kong barely moved and mainland stocks turned positive, showing this shock landed overwhelmingly on semiconductor heavyweights.", "es": "El «sidecar» es un mecanismo específico de Corea y su activación ya es una lectura extrema del sentimiento. Más revelador es el lenguaje oficial: activar el fondo de estabilización «con oportunidad cuando sea necesario» es una fórmula que Seúl suele reservar para momentos de tensión real. Frente a ello, Hong Kong apenas se movió y la China continental giró a positivo: el golpe se concentró en los grandes valores de semiconductores.", "ja": "サイドカーは韓国特有の仕組みで、発動自体がセンチメントの極値を示す。さらに注目すべきは当局の言葉だ。「必要なら機動的に安定基金を活用する」は、ソウルが本当に緊張した局面で使う表現である。対照的に香港は小幅安、中国本土はプラスに転じた。衝撃の着地点が半導体の大型株に集中していたことがわかる。"}}, {"idx": "03", "tag": {"zh": "进展"}, "title": {"zh": "金价止跌反弹，现货金收涨 2.78% 报 3635 美元，美元指数创近 19 个月新高", "en": "Gold snaps its slide, spot closing up 2.78% at $3,635 as the dollar hits a 19-month high", "es": "El oro frena su caída y sube un 2,78 % hasta 3.635 dólares mientras el dólar marca máximos de 19 meses", "ja": "金価格が反発 現物金は 2.78 % 高の 3635 ドル、ドル指数は 19 カ月ぶり高値"}, "body": {"zh": "现货黄金 23 日跳空高开后持续上行，美盘前一度冲上 3690 美元上方，随后回吐部分涨幅，最终收涨 2.78% 报 3635.24 美元/盎司；现货白银收涨 4.77% 报 43.15 美元/盎司。汇市方面，美元指数在欧盘与美盘时段大幅上行，一度冲上 104 关口，创近 19 个月新高，最终收涨 0.44% 报 104.32。债市方面，10 年期美债收益率收跌约 1.1 个基点报 4.939%，对政策利率敏感的 2 年期收益率上涨约 4.7 个基点报 4.696%，收益率曲线形态出现变化。此前一周，现货金累跌约 8.9%、白银跌逾 15%，多家银行发布贵金属风险提示并上调保证金。", "en": "Spot gold gapped higher on 23 November and kept climbing, briefly topping $3,690 before the US session and paring gains to close up 2.78% at $3,635.24 an ounce; spot silver rose 4.77% to $43.15. In currencies, the dollar index surged through European and US hours, briefly clearing 104 to a 19-month high, and closed up 0.44% at 104.32. In rates, the 10-year Treasury yield fell about 1.1 basis points to 4.939% while the policy-sensitive two-year rose about 4.7 basis points to 4.696%, shifting the curve's shape. The previous week, spot gold had fallen about 8.9% and silver more than 15%, prompting several banks to issue precious-metals risk warnings and raise margin requirements.", "es": "El oro al contado abrió con hueco al alza el 23 de noviembre y siguió subiendo, superó brevemente los 3.690 dólares antes de la sesión estadounidense y moderó las ganancias para cerrar con un alza del 2,78 % en 3.635,24 dólares la onza; la plata al contado subió un 4,77 % hasta 43,15 dólares. En divisas, el índice del dólar avanzó con fuerza en las sesiones europea y estadounidense, superó momentáneamente los 104 hasta máximos de 19 meses y cerró con un alza del 0,44 % en 104,32. En renta fija, el bono a 10 años cedió unos 1,1 puntos básicos hasta el 4,939 %, mientras el dos años, sensible a la política monetaria, subió unos 4,7 puntos básicos hasta el 4,696 %. La semana anterior, el oro al contado había caído cerca del 8,9 % y la plata más del 15 %, lo que llevó a varios bancos a emitir avisos de riesgo y subir los márgenes.", "ja": "現物金は 23 日、大きく窓を開けて上昇し、米国時間前に一時 3690 ドルを超えた。その後上げ幅を縮め、前日比 2.78 % 高の 3635.24 ドルで引けた。現物銀は 4.77 % 高の 43.15 ドル。為替ではドル指数が欧州・米国時間に大きく上昇し、一時 104 を突破して約 19 カ月ぶりの高値を付け、0.44 % 高の 104.32 で引けた。債券では 10 年債利回りが約 1.1 ベーシスポイント低下して 4.939 %、政策金利に敏感な 2 年債利回りは約 4.7 ベーシスポイント上昇して 4.696 % となり、イールドカーブの形状が変化した。前週は現物金が約 8.9 %、銀が 15 % 超下落し、複数の銀行が貴金属のリスク警告と追証率の引き上げを行っていた。"}, "why": {"zh": "同一天里，金价涨、美元也涨、2 年期收益率还涨——三个通常互相打架的资产同时走强，说明驱动它们的是同一件事：对政策路径的重新定价，而不是避险。金价从 3537 附近反弹回 3635，是「跌太快的技术性修复」还是「逻辑反转」，关键看接下来能不能站住 3600 上方。", "en": "Gold up, the dollar up, two-year yields up — three assets that usually push against each other all rose together, which says the driver was the same for all: a repricing of the policy path, not a flight to safety. Whether gold's bounce from around $3,537 to $3,635 is a technical repair after a fast fall or a reversal of logic depends on whether it can hold above $3,600.", "es": "Oro al alza, dólar al alza y rendimientos a dos años al alza: tres activos que suelen moverse en direcciones opuestas subieron a la vez, señal de que el motor fue el mismo para todos, una nueva valoración de la senda de política monetaria, no la búsqueda de refugio. Si el rebote del oro desde unos 3.537 hasta 3.635 es una reparación técnica o un cambio de lógica depende de que logre sostenerse sobre 3.600.", "ja": "金が上がり、ドルも上がり、2 年債利回りも上がった。通常は相反する 3 資産が同時に上昇したのは、いずれも同じ要因、つまり政策経路の再評価が働いたためで、逃避需要ではない。金が 3537 近辺から 3635 へ戻したのが急落後のテクニカルな修正か、論理の反転かは、3600 を上抜けて定着できるかで決まる。"}}, {"idx": "04", "tag": {"zh": "进展"}, "title": {"zh": "油价跌超 3%：WTI 收 81.31 美元，中东供应增加与利比亚管道重启压价", "en": "Oil drops over 3%: WTI settles at $81.31 as Middle East supply rises and a Libyan pipeline restarts", "es": "El petróleo cae más del 3 %: el WTI cierra en 81,31 dólares por más suministro y la reapertura de un oleoducto libio", "ja": "原油が 3 % 超下落 WTI は 81.31 ドル、中東供給増とリビア導管再開が重荷"}, "body": {"zh": "受来自中东的供应增加以及利比亚一条石油管道重启影响，国际油价 23 日跌超 3%。WTI 原油日内震荡下行，盘中一度跌至 81 美元下方，最终收跌 4.13% 报 81.31 美元/桶；布伦特原油收跌 3.48% 报 86.33 美元/桶。此前一周，WTI 与布伦特已分别录得约 5.6% 与 3.4% 的周跌幅，三周累计回落约两成。同一时间，霍尔木兹海峡再度出现油轮触雷起火事件，但市场当日并未就此定价。", "en": "International crude fell more than 3% on 23 November as supply from the Middle East increased and a Libyan oil pipeline restarted. WTI swung lower through the session, dipping below $81, and settled down 4.13% at $81.31 a barrel; Brent fell 3.48% to $86.33. The previous week WTI and Brent had already lost about 5.6% and 3.4% respectively, taking the three-week decline to roughly a fifth. The same day, tankers struck mines and caught fire in the Strait of Hormuz again, but the market did not price that in during the session.", "es": "El crudo internacional cayó más del 3 % el 23 de noviembre por un mayor suministro desde Oriente Próximo y la reapertura de un oleoducto libio. El WTI osciló a la baja, perforó los 81 dólares y cerró con una caída del 4,13 % en 81,31 dólares el barril; el Brent cedió un 3,48 % hasta 86,33. La semana anterior el WTI y el Brent ya habían perdido cerca del 5,6 % y el 3,4 %, elevando la caída en tres semanas a alrededor de una quinta parte. Ese mismo día volvieron a producirse explosiones de petroleros por minas en Ormuz, pero el mercado no lo descontó en la sesión.", "ja": "中東からの供給増とリビアの石油導管再開を受け、国際原油は 23 日に 3 % 超下落した。WTI は取引中に軟調に推移し、一時 81 ドルを割り込み、4.13 % 安の 81.31 ドルで引けた。ブレントは 3.48 % 安の 86.33 ドル。前週も WTI は約 5.6 %、ブレントは 3.4 % 下落しており、3 週間の下げは約 2 割に達する。同日、ホルムズ海峡で再びタンカーが機雷に接触して炎上したが、市場はその日の取引で織り込まなかった。"}, "why": {"zh": "最值得记的是这个反差：海峡在同一天又烧起三艘油轮，油价却跌了 4%。这说明当前定价权在「供应过剩与需求走弱」这一侧，地缘溢价被压得很薄。对这种结构的市场来说，真正的风险不是坏消息本身，而是一旦供应侧突然收紧，薄薄的地缘溢价可能瞬间补回来。", "en": "The contrast is the story: three tankers burned in the strait the same day and crude still fell 4%. Pricing power currently sits on the oversupply-and-weak-demand side, and the geopolitical premium has been compressed very thin. In a market with that structure, the real risk is not bad news itself but the moment supply tightens — the thin premium could snap back instantly.", "es": "El contraste es la noticia: tres petroleros ardieron en el estrecho el mismo día y el crudo cayó un 4 %. El poder de fijación de precios está hoy del lado del exceso de oferta y la demanda débil, y la prima geopolítica se ha comprimido mucho. En un mercado así, el riesgo real no son las malas noticias, sino el momento en que la oferta se ajuste: esa prima fina puede recuperarse de golpe.", "ja": "注目すべきはこの対比だ。同じ日に海峡でタンカー 3 隻が炎上したのに、原油は 4 % 下落した。現在の価格決定力は供給過剰と需要減速の側にあり、地政学プレミアムは極めて薄い。こうした構造の市場で本当のリスクは悪材料そのものではなく、供給が突然引き締まった瞬間に薄いプレミアムが一気に戻ることだ。"}}, {"idx": "05", "tag": {"zh": "进展"}, "title": {"zh": "A 股先抑后扬：创业板涨 3.08%、超 4600 只个股上涨，首批 18 只主动 ETF 上市募资 360 亿", "en": "A-shares reverse higher: ChiNext +3.08%, 4,600 stocks up, first 18 active ETFs raise 36 billion yuan", "es": "La bolsa china gira al alza: el ChiNext sube un 3,08 %, 4.600 valores en verde y los primeros 18 ETF activos captan 36.000 millones de yuanes", "ja": "中国株が反転高 創業板 3.08 % 高、4600 銘柄超が上昇 主動型 ETF 18 本が 360 億元調達"}, "body": {"zh": "11 月 23 日，A 股先抑后扬、午后全线拉升。上证指数收涨 0.15% 报 3538.95 点，深证成指涨 1.93% 报 10454.37 点，创业板指涨 3.08% 报 2280.20 点，科创综指涨 2.62%，北证 50 涨 4.67%。沪深京三市成交额约 1.55 万亿元，较前一交易日放量约 1300 亿元；全市场超 4600 只个股上涨，151 只个股涨停，近 300 只涨幅超过 9%。板块上，传媒涨 4.43%、通信涨 4.34%、机械设备涨 4.04%，食品饮料、石油石化、煤炭小幅下跌；人形机器人、物理 AI、影视院线、医疗服务等题材活跃。同日，首批 18 只主动 ETF 在沪深交易所上市，沪市、深市各 9 只，合计募集 360 亿元、有效认购户数超 33 万户，首日合计成交额 80 亿元；产品管理费率均为 1%，单只持有证券不低于 30 只、前十大持仓权重合计不超过 60%。央行当日开展 4995 亿元隔夜逆回购操作，单日净投放 1200 亿元；银行间市场 30 年期国债收益率上行超 1 个基点。", "en": "A-shares opened lower and rallied through the afternoon on 23 November. The Shanghai Composite closed up 0.15% at 3,538.95, the Shenzhen Component 1.93% at 10,454.37, the ChiNext Index 3.08% at 2,280.20, the STAR Composite 2.62% and the Beijing Stock Exchange 50 4.67%. Turnover across Shanghai, Shenzhen and Beijing reached about 1.55 trillion yuan, some 130 billion more than the previous session; more than 4,600 stocks rose, 151 hit the daily limit and nearly 300 gained over 9%. Media led sectors with 4.43%, communications rose 4.34% and machinery 4.04%, while food and beverage, oil and petrochemicals and coal slipped; humanoid robots, physical AI, cinema chains and medical services were among the busiest themes. The same day, the first 18 active ETFs listed in Shanghai and Shenzhen — nine on each exchange — raising a combined 36 billion yuan from more than 330,000 subscribing accounts and trading 8 billion yuan on day one. All charge a 1% management fee and must hold at least 30 securities, with the top ten capped at 60% of net assets. The central bank conducted 499.5 billion yuan of overnight reverse repos, a net injection of 120 billion yuan; the 30-year government bond yield rose more than a basis point.", "es": "La bolsa china abrió a la baja y remontó por la tarde el 23 de noviembre. El Shanghai Composite cerró con un alza del 0,15 % en 3.538,95, el Shenzhen Component un 1,93 % en 10.454,37, el ChiNext un 3,08 % en 2.280,20, el STAR Composite un 2,62 % y el índice 50 de Pekín un 4,67 %. El volumen en las tres plazas alcanzó unos 1,55 billones de yuanes, unos 130.000 millones más que la sesión previa; más de 4.600 valores subieron, 151 marcaron el límite diario y casi 300 ganaron más del 9 %. Medios lideró los sectores con un 4,43 %, comunicaciones subió un 4,34 % y maquinaria un 4,04 %, mientras alimentación, petróleo y carbón cedían; robots humanoides, IA física, cines y servicios médicos fueron los temas más activos. Ese día se estrenaron los primeros 18 ETF activos en Shanghái y Shenzhen —nueve en cada plaza—, que captaron 36.000 millones de yuanes de más de 330.000 cuentas y negociaron 8.000 millones el primer día. Todos cobran un 1 % de gestión y deben tener al menos 30 valores, con los diez mayores limitados al 60 % del patrimonio. El banco central inyectó 120.000 millones netos vía repos inversos; el bono a 30 años subió más de un punto básico.", "ja": "11 月 23 日の中国株は軟調に始まった後、午後に全面高となった。上海総合指数は 0.15 % 高の 3538.95、深セン成分指数は 1.93 % 高の 10454.37、創業板指数は 3.08 % 高の 2280.20、科創総合指数は 2.62 % 高、北京証券取引所 50 指数は 4.67 % 高。上海・深セン・北京の 3 市場の売買代金は約 1 兆 5500 億元で、前日比約 1300 億元増。4600 銘柄超が上昇し、151 銘柄がストップ高、300 銘柄近くが 9 % 超の上昇となった。業種別ではメディアが 4.43 %、通信が 4.34 %、機械設備が 4.04 % 上昇し、食品飲料、石油石化、石炭は小幅安。ヒューマノイドロボット、フィジカル AI、映画館、医療サービスなどが活発だった。同日、初の主動型 ETF 18 本が上海・深セン取引所に上場（各 9 本）。合計 360 亿元を調達し、有効申込口座は 33 万口座超、初日の売買代金は 80 亿元。管理報酬率はいずれも 1 % で、組入銘柄は 30 以上、上位 10 銘柄の比率は合計 60 % 以下とされた。中国人民銀行は 4995 億元の翌日物リバースレポを実施し、1200 億元の純供給。銀行間市場の 30 年国債利回りは 1 ベーシスポイント超上昇した。"}, "why": {"zh": "外围大跌、A 股翻红，这一天最值得看的不是指数，而是「谁在买」：18 只主动 ETF 合计募集 360 亿元、33 万户认购，首日成交 80 亿元，这批产品多数仍在建仓，意味着后续还有增量买盘；而 1.55 万亿元的放量、151 只涨停，说明结构上资金正从「防守」转向「进攻」。需要提醒的是，涨停家数与题材扩散往往是短期情绪的放大器。", "en": "The index move is the least interesting part of the day; who was buying matters more. Eighteen active ETFs raised 36 billion yuan from 330,000 accounts and traded 8 billion on day one, and most are still building positions — meaning incremental buying is still to come. Meanwhile 1.55 trillion yuan of turnover and 151 limit-ups show money rotating from defence to offence. Worth remembering: a wide field of limit-ups and spreading themes usually amplifies short-term sentiment.", "es": "El movimiento del índice es lo menos interesante del día; importa más quién compraba. Dieciocho ETF activos captaron 36.000 millones de yuanes de 330.000 cuentas y negociaron 8.000 millones el primer día, y la mayoría sigue construyendo cartera, así que aún queda compra incremental. Además, 1,55 billones de yuanes de volumen y 151 valores en el límite diario muestran una rotación de la defensa al ataque. Conviene recordar que una amplia lista de límites y temas que se expanden suele amplificar el ánimo de corto plazo.", "ja": "この日、指数の動きよりも重要なのは「誰が買ったか」だ。主動型 ETF 18 本が 33 万口座から 360 亿元を集め、初日 80 亿元を売買した。多くはまだ建玉を積み上げている途中で、追加の買いが残る。一方、1 兆 5500 亿元の出来高と 151 銘柄のストップ高は、資金が守りから攻めへ移ったことを示す。ただしストップ高の広がりとテーマの拡散は、短期のセンチメントを増幅しやすい点には注意したい。"}}]}, {"key": "spo", "num": "04", "color": "#15803d", "deep": "#0f5f2e", "name": {"zh": "体育竞技", "en": "Sport", "es": "Deportes", "ja": "スポーツ"}, "items": [{"idx": "01", "tag": {}, "title": {"zh": "勇士 88 比 87 险胜凯尔特人：库里缺阵、终结五连败，全场双方都没过 90 分", "en": "Warriors edge Celtics 88-87 without Curry, ending a five-game skid in a sub-90 game", "es": "Los Warriors vencen 88-87 a los Celtics sin Curry y cortan una racha de cinco derrotas", "ja": "ウォリアーズが 88 対 87 でセルティックスを下す カリー欠場で 5 連敗を止める"}, "body": {"zh": "北京时间 11 月 23 日（当地时间 22 日），NBA 常规赛勇士主场以 88 比 87 一分险胜凯尔特人，终结此前五连败，同时送给对手四连败——这是凯尔特人近五年首次四连败。勇士此役库里、巴特勒、穆迪等多名主力缺阵，已用到赛季第 13 套阵容；凯尔特人则让核心塔图姆与上一场的怀特提前轮休。首节追梦格林连中三记三分拿下 9 分，帮助勇士 27 比 20 领先；塔图姆半场砍下 21 分并在此役生涯总得分超越名宿比尔·拉塞尔，但绿军整体命中率仅 38.6%。末节勇士靠角色球员打出 12 比 2 追回，最后时刻塔图姆两罚一中、中投绝杀被格林干扰偏出。这是 2024 年以来 NBA 首次出现双方得分均未突破 90 分的常规赛，勇士也成为本赛季首支得分不足 90 分仍赢球的队伍。", "en": "On 23 November Beijing time (22 November local), the Warriors beat the Celtics 88-87 at home to end a five-game losing streak and hand Boston its fourth straight defeat — the franchise's first four-game skid in five years. Golden State was without Curry, Butler, Moody and others, using its 13th different lineup of the season, while Boston rested Jayson Tatum and Derrick White. Draymond Green hit three triples in a 9-point first quarter as the Warriors led 27-20; Tatum scored 21 by halftime and passed Bill Russell on the career scoring list, but Boston shot just 38.6% as a team. A 12-2 run from the bench put Golden State back ahead, and Tatum's game-winner was contested by Green and missed after he made only one of two free throws. It was the NBA's first r
