egular-season game since 2024 in which neither side reached 90 points, and the Warriors became the first team this season to win while scoring fewer than 90.", "es": "El 23 de noviembre (hora de Pekín; 22 local), los Warriors vencieron 88-87 a los Celtics en casa, cortaron una racha de cinco derrotas y sumaron la cuarta consecutiva de Boston, la primera de la franquicia en cinco años. Golden State jugó sin Curry, Butler ni Moody, con su decimotercer quinteto distinto de la temporada, mientras Boston reservó a Jayson Tatum y Derrick White. Draymond Green anotó tres triples en un primer cuarto de 9 puntos y los Warriors se fueron 27-20 arriba; Tatum sumó 21 al descanso y superó a Bill Russell en la lista histórica de anotadores, pero Boston tiró solo un 38,6 % de equipo. Un parcial de 12-2 de los suplentes devolvió la ventaja a Golden State, y el tiro de la victoria de Tatum, contestado por Green, falló después de anotar solo uno de dos libres. Fue el primer partido de temporada regular de la NBA desde 2024 en el que ningún equipo llegó a 90, y los Warriors son el primer equipo de la campaña en ganar anotando menos de 90.", "ja": "北京時間 11 月 23 日（現地 22 日）、NBA レギュラーシーズンでウォリアーズが本拠地でセルティックスを 88 対 87 で破り、5 連敗を止めるとともに相手に 4 連敗を喫させた。セルティックスの 4 連敗は 5 年ぶり。ウォリアーズはカリー、バトラー、ムーディら主力を欠き、今季 13 通り目の布陣。セルティックスはタタムとホワイトを温存した。第 1 クォーターはドレイモンド・グリーンが 3 本のスリーを含む 9 得点で 27 対 20 とリード。タタムはハーフで 21 得点を挙げ、通算得点でビル・ラッセルを抜いたが、チーム全体の成功率は 38.6 % にとどまった。第 4 クォーターに控え陣の 12 対 2 で再逆転し、最後はタタムのフリースロー 2 本中 1 本と、グリーンに阻まれた決勝弾が外れて決着。両チームとも 90 点未満のレギュラーシーズンゲームは 2024 年以来で、90 点未満で勝利したのは今季初のチームとなった。"}, "why": {"zh": "两支球队都缺人、都投不进，反而打出本赛季最像季后赛的一场：88 比 87 的比分本身就是新闻。对勇士来说，赢球的意义在于证明「没有库里也能靠防守赢一场」；对凯尔特人，四连败是五年来第一次，问题不在塔图姆的 27 分，而在他之外全队只有一人得分上双。", "en": "Two depleted teams that could not shoot produced the season's most playoff-like game — an 88-87 scoreline is the story itself. For Golden State, the value is proof that it can win on defence without Curry. For Boston, a first four-game skid in five years is not about Tatum's 27 points but about the fact that only one other Celtic reached double figures.", "es": "Dos equipos mermados y sin acierto firmaron el partido más parecido a los playoffs de la temporada: un 88-87 es la noticia. Para Golden State, vale como prueba de que puede ganar defendiendo sin Curry. Para Boston, la primera racha de cuatro derrotas en cinco años no tiene que ver con los 27 puntos de Tatum, sino con que solo otro jugador llegó a dobles dígitos.", "ja": "欠場者だらけでシュートも入らない両チームが、今季で最もプレーオフらしい試合を作った。88 対 87 というスコア自体がニュースだ。ウォリアーズにとってはカリーなしでも守備で勝てるという証明。セルティックスにとって 5 年ぶりの 4 連敗はタタムの 27 点の問題ではなく、他に 2 桁得点が 1 人しかいないことの問題である。"}}, {"idx": "02", "tag": {}, "title": {"zh": "掘金加时 151 比 145 擒公牛：穆雷 45 分、约基奇 37+18+11，吉迪 22 次助攻创生涯新高", "en": "Nuggets outlast Bulls 151-145 in OT: Murray 45, Jokic 37-18-11, Giddey's career-high 22 assists", "es": "Los Nuggets vencen 151-145 a los Bulls en prórroga: Murray 45, Jokic 37-18-11 y 22 asistencias récord de Giddey", "ja": "ナゲッツが延長 151 対 145 でブルズ下す マレー 45 点、ヨキッチ 37-18-11、ギディ 22 アシスト"}, "body": {"zh": "北京时间 11 月 23 日，NBA 常规赛掘金客场在联合中心加时以 151 比 145 击败公牛，取得赛季首次三连胜，战绩来到 10 胜 5 负，公牛则跌至 4 胜 12 负。穆雷砍下赛季最高 45 分，另有 5 篮板 7 助攻 3 抢断 2 盖帽，投篮 22 中 13、三分 11 中 6、加时独得 8 分；约基奇贡献 37 分、赛季最高 18 篮板和 11 助攻的大号三双，这是其生涯第 202 次三双，距威斯布鲁克保持的 209 次纪录只差 7 次。两人合计 82 分。公牛方面，吉迪拿到 23 分 14 篮板、生涯新高 22 次助攻的三双（并列队史单场第二，仅次于 1966 年罗杰斯的 24 次），希尔德得到赛季最高 33 分，全队投进 25 记三分追平队史单场纪录、送出 39 次助攻。全场出现 24 次打平或领先易手，加时开局掘金打出 8 比 0 后未再落后。", "en": "The Nuggets beat the Bulls 151-145 in overtime at the United Center on 23 November, their first three-game winning streak of the season, moving to 10-5 while Chicago fell to 4-12. Jamal Murray scored a season-high 45 points with 5 rebounds, 7 assists, 3 steals and 2 blocks on 13-of-22 shooting and 6-of-11 from three, including 8 points in overtime; Nikola Jokic posted 37 points, a season-high 18 rebounds and 11 assists for his 202nd career triple-double, seven short of Russell Westbrook's record of 209. The pair combined for 82. For Chicago, Josh Giddey had 23 points, 14 rebounds and a career-high 22 assists — tied for second-most in franchise history behind Rogers' 24 in 1966 — while Hield scored a season-high 33. The Bulls made 25 threes to tie the team record and handed out 39 assists. There were 24 lead changes or ties, and Denver never trailed after an 8-0 start to overtime.", "es": "Los Nuggets vencieron 151-145 en prórroga a los Bulls en el United Center el 23 de noviembre, su primera racha de tres victorias de la temporada, para situarse en 10-5 mientras Chicago cae a 4-12. Jamal Murray anotó 45 puntos, máximo de la campaña, con 5 rebotes, 7 asistencias, 3 robos y 2 tapones, con 13 de 22 en tiros y 6 de 11 en triples, incluidos 8 puntos en la prórroga; Nikola Jokic firmó 37 puntos, 18 rebotes (máximo de la temporada) y 11 asistencias para su vigésimo segundo triple-doble número 202 de su carrera, a siete del récord de 209 de Russell Westbrook. Entre ambos sumaron 82. Por Chicago, Josh Giddey logró 23 puntos, 14 rebotes y 22 asistencias, récord personal y segundo mejor de la historia de la franquicia tras las 24 de Rogers en 1966, mientras Hield anotó 33. Los Bulls igualaron el récord del equipo con 25 triples y repartieron 39 asistencias. Hubo 24 empates o cambios de líder, y Denver no volvió a ir por detrás tras un 8-0 al inicio de la prórroga.", "ja": "11 月 23 日、NBA レギュラーシーズンでナゲッツが敵地ユナイテッド・センターで延長の末、ブルズを 151 対 145 で破った。今季初の 3 連勝で 10 勝 5 敗とし、ブルズは 4 勝 12 敗に沈んだ。マレーは今季最高の 45 得点に 5 リバウンド 7 アシスト 3 スティール 2 ブロック、22 本中 13 本成功、3 点弾 11 本中 6 本成功で延長だけで 8 得点。ヨキッチは 37 得点、今季最多 18 リバウンド、11 アシストの大型トリプルダブルで、通算 202 回目。ラッセル・ウェストブルックの記録 209 回まであと 7 回に迫った。2 人で 82 得点。ブルズはギディが 23 得点 14 リバウンド、自己最多 22 アシストのトリプルダブル（球団史上 1 試合 2 位タイ、1966 年のロジャースの 24 に次ぐ）。ヒールドは今季最多 33 得点。チームは 3 点弾 25 本で球団記録に並び、39 アシストを記録した。試合は 24 回の同点・逆転があり、延長序盤の 8 対 0 でナゲッツが突き放した。"}, "why": {"zh": "这是一场「数据全都不讲道理」的比赛：两队合计 296 分、72 次助攻、公牛 25 记三分追平队史，吉迪 22 次助攻写进队史第二，却还是输了。真正的胜负手藏在两个细节里——约基奇和穆雷这对组合已经第八次同场做到「一人 40+、一人三双」，超过张伯伦分别与罗杰斯、戈拉的组合；而公牛加时开头连续罚丢与失误，把 42 分钟的对抗一次性交了出去。", "en": "A game in which every number defies explanation: 296 combined points, 72 assists, 25 Bulls threes tying a franchise record, and Giddey's 22 assists second-best in team history — in a loss. The margin hid in two details. Jokic and Murray have now done «one scores 40-plus, one posts a triple-double» eight times together, passing the Chamberlain pairings with Rogers and Gola. And Chicago's missed free throws and turnovers at the start of overtime handed over 42 minutes of work in one stretch.", "es": "Un partido en el que todos los números desafían la lógica: 296 puntos entre ambos, 72 asistencias, 25 triples de los Bulls que igualan el récord de la franquicia y las 22 asistencias de Giddey, segundas en la historia del equipo, en una derrota. La diferencia estaba en dos detalles: Jokic y Murray han logrado ocho veces juntos el «uno anota 40 o más, el otro firma un triple-doble», superando a las parejas de Chamberlain con Rogers y Gola; y los fallos en libres y las pérdidas de Chicago al inicio de la prórroga entregaron 42 minutos de trabajo de golpe.", "ja": "あらゆる数字が説明を拒む試合だった。両チーム合計 296 得点、72 アシスト、ブルズの 3 点弾 25 本は球団記録タイ、ギディの 22 アシストは球団史上 2 位。それでも敗れた。勝敗を分けたのは 2 つの細部にある。ヨキッチとマレーは「片方が 40 点以上、片方がトリプルダブル」を 8 回そろえ、チェンバレンとロジャース、ゴラのコンビを上回った。そして延長序盤のフリースロー失敗とターンオーバーが、42 分間の攻防を一気に手放させた。"}}, {"idx": "03", "tag": {}, "title": {"zh": "热火 123 比 113 拿下雷霆取七连胜，连续三场全场未落后创队史", "en": "Heat beat Thunder 123-113 for a seventh straight win, never trailing in three consecutive games", "es": "Los Heat ganan 123-113 al Thunder y suman siete victorias seguidas sin ir por detrás en tres partidos", "ja": "ヒートがサンダーを 123 対 113 で下し 7 連勝、3 試合連続で一度もリードを許さず"}, "body": {"zh": "北京时间 11 月 23 日，NBA 常规赛热火主场 123 比 113 轻取雷霆，迎来七连胜。此役热火自始至终保持领先，这是球队连续第三场比赛全程未落后——自 1996 年 NBA 引入逐回合数据统计以来，热火首次做到这一点。同日其他比赛：老鹰 107 比 97 活塞，奇才 116 比 96 魔术，独行侠 116 比 114 加时险胜爵士，尼克斯 113 比 106 步行者，掘金 151 比 145 加时胜公牛，勇士 88 比 87 凯尔特人。东部排名方面，76 人以 14 胜 3 负居首，老鹰、凯尔特人、尼克斯同为 11 胜 6 负紧随，热火 10 胜 6 负位列第六。", "en": "The Heat beat the Thunder 123-113 at home on 23 November for a seventh straight win, leading wire to wire for a third consecutive game — the first time Miami has done that since the NBA introduced play-by-play data in 1996. Elsewhere: Atlanta beat Detroit 107-97, Washington beat Orlando 116-96, Dallas edged Utah 116-114 in overtime, New York beat Indiana 113-106, Denver beat Chicago 151-145 in overtime and Golden State beat Boston 88-87. In the East, Philadelphia leads at 14-3, with Atlanta, Boston and New York all 11-6 behind, and Miami sixth at 10-6.", "es": "Los Heat vencieron 123-113 al Thunder en casa el 23 de noviembre para sumar su séptima victoria consecutiva, dominando de principio a fin por tercer partido seguido, algo que Miami no lograba desde que la NBA introdujo los datos jugada a jugada en 1996. Otros resultados: Atlanta 107-97 Detroit, Washington 116-96 Orlando, Dallas 116-114 Utah en prórroga, Nueva York 113-106 Indiana, Denver 151-145 Chicago en prórroga y Golden State 88-87 Boston. En el Este, Filadelfia lidera con 14-3, con Atlanta, Boston y Nueva York a 11-6 y Miami sexto con 10-6.", "ja": "11 月 23 日、ヒートが本拠地でサンダーを 123 対 113 で下し 7 連勝。3 試合連続で一度もリードを許さずに勝ち切ったのは、NBA がプレーバイプレーのデータを導入した 1996 年以来、ヒート初のことだ。他の試合はアトランタがデトロイトに 107 対 97、ワシントンがオーランドに 116 対 96、ダラスが延長でユタに 116 対 114、ニューヨークがインディアナに 113 対 106、デンバーが延長でシカゴに 151 対 145、ゴールデンステートがボストンに 88 対 87。東地区はフィラデルフィアが 14 勝 3 敗で首位、アトランタ、ボストン、ニューヨークが 11 勝 6 敗で続き、ヒートは 10 勝 6 敗の 6 位。"}, "why": {"zh": "「连续三场从未落后」听着像巧合，其实是防守强度的指标：全程领先意味着对手一次也没能把比赛拉回自己的节奏。七连胜的热火现在是东部第六，而榜首的 76 人是 14 胜 3 负——这个差距说明东部的分层比连胜数字更值得注意。", "en": "«Never trailing for three straight games» sounds like coincidence but is really a measure of defensive intensity: leading throughout means the opponent never once pulled the game back to its own rhythm. Miami's seven-game run puts it sixth in the East while Philadelphia leads at 14-3 — a gap that says more about the conference's tiers than the streak itself.", "es": "«No ir por detrás en tres partidos seguidos» suena a casualidad, pero mide intensidad defensiva: ir siempre por delante significa que el rival no logró imponer su ritmo ni una vez. La racha de siete lleva a Miami al sexto puesto del Este mientras Filadelfia lidera con 14-3, una diferencia que dice más de los escalones de la conferencia que de la racha.", "ja": "「3 試合連続で一度もリードを許さない」は偶然に見えて、守備強度の指標だ。常に先行するということは、相手に一度も流れを渡していないということ。7 連勝のヒートは東地区 6 位、首位はフィラデルフィアの 14 勝 3 敗。この差は連勝数よりも、カンファレンスの層の厚さを語っている。"}}, {"idx": "04", "tag": {}, "title": {"zh": "海港今晚主场收官战武里南联：亚冠出线关键一战，主场跨赛季九场不胜待破", "en": "Shanghai Port host Buriram tonight with a last-16 place at stake — and a nine-game home winless run to break", "es": "El Shanghai Port recibe al Buriram con la clasificación en juego y nueve partidos sin ganar en casa", "ja": "上海海港が今夜ホームでブリーラム戦 アジア CL 突破へ、本拠地 9 試合未勝利の壁"}, "body": {"zh": "11 月 24 日 20 时 15 分，上汽浦东足球场将迎来上海海港 2026 自然年的最后一个主场——2026/27 亚冠精英联赛东亚区第 5 轮，对手是泰超武里南联。海港前 4 轮 2 胜 1 平 1 负积 7 分，位列东亚区第 5，进 13 球失 10 球，火力突出但防线不稳；武里南联 0 胜 3 平 1 负积 3 分、排第 12，进 2 球仅失 3 球，先后逼平柔佛达鲁塔克欣、大阪钢巴与鹿岛鹿角，主场 0 比 1 不敌北京国安。两队渊源不浅：上赛季亚冠海港客场 0 比 2 不敌对手，上赛季参加亚冠的三支中超球队对武里南联全部落败且一球未进。海港刚在足协杯半决赛击败国安闯入 12 月 6 日的决赛，各赛事三连胜、士气正盛，蒋光太伤愈回归，穆斯卡特无需刻意轮换；但球队亚冠主场已跨赛季连续 9 场不胜。", "en": "At 20:15 on 24 November, the Pudong Football Stadium hosts Shanghai Port's final home match of the 2026 calendar year — matchday five of the 2026/27 AFC Champions League Elite east zone against Thailand's Buriram United. Port have seven points from four games (two wins, one draw, one loss), fifth in the east zone, with 13 scored and 10 conceded: potent going forward, shaky at the back. Buriram are 12th with three points from three draws and a defeat, scoring two and conceding three, having drawn with Johor Darul Ta'zim, Gamba Osaka and Kashima Antlers and lost 0-1 at home to Beijing Guoan. The history is uncomfortable: Port lost 0-2 away to Buriram last season, and all three Chinese Super League sides in the competition failed to score against them. Port arrive on a three-match winning run after beating Guoan in the FA Cup semi-final to reach the 6 December final, with Jiang Guangtai back from injury and no need for rotation — but they have gone nine home ACL matches across seasons without a win.", "es": "El 24 de noviembre a las 20:15, el estadio de Pudong acoge el último partido en casa del Shanghai Port en el año natural 2026: la quinta jornada de la zona este de la Liga de Campeones Elite de la AFC 2026/27 ante el Buriram United tailandés. El Port suma siete puntos en cuatro partidos (dos victorias, un empate y una derrota), quinto del este, con 13 goles a favor y 10 en contra: potente arriba, frágil atrás. El Buriram es duodécimo con tres puntos de tres empates y una derrota, dos goles a favor y tres en contra, tras empatar con Johor Darul Ta'zim, Gamba Osaka y Kashima Antlers y perder 0-1 en casa ante el Beijing Guoan. El historial incomoda: el Port perdió 0-2 en casa del Buriram la temporada pasada y los tres equipos chinos de la competición no marcaron ante ellos. El Port llega con tres victorias seguidas tras ganar al Guoan en semifinales de copa y alcanzar la final del 6 de diciembre, con Jiang Guangtai recuperado y sin necesidad de rotar, pero acumula nueve partidos sin ganar en casa en la competición.", "ja": "11 月 24 日 20 時 15 分、浦東足球場で上海海港の 2026 年最後のホームゲーム、AFC チャンピオンズリーグ・エリート東地区第 5 節が行われ、タイのブリーラム・ユナイテッドを迎える。海港は 4 試合で 2 勝 1 分 1 敗の勝ち点 7、東地区 5 位。13 得点 10 失点で攻撃力は高いが守備は不安定。ブリーラムは 12 位で 3 分 1 敗の勝ち点 3、2 得点 3 失点。ジョホール・ダルル・タクジム、ガンバ大阪、鹿島アントラーズと引き分け、ホームで北京国安に 0 対 1 で敗れた。因縁もある。前季のアジア CL で海港は敵地で 0 対 2 の完敗。前季出場した中国超級リーグの 3 クラブはいずれもブリーラムに敗れ、1 点も取れていない。海港は FA カップ準決勝で国安を破って 12 月 6 日の決勝に進み、公式戦 3 連勝と勢いに乗る。蒋光太も復帰し、ムスカット監督は無理なローテーションを必要としない。ただしアジア CL のホームではシーズンをまたいで 9 試合未勝利が続く。"}, "why": {"zh": "这是「一场比赛、两种性格」的对撞：海港 4 轮进 13 球，武里南 4 轮只失 3 球，前者要破密集防守，后者专打高位防线身后。海港的三个变数很清楚——中场能否切断对手反击的第一传、边后卫助攻与回防的平衡、定位球能否打开铁桶阵。而足协杯决赛还有 12 天，这场球的排兵也顺带透露穆斯卡特对 12 月 6 日的取舍。", "en": "One match, two temperaments: Port have scored 13 in four games, Buriram have conceded three — the hosts must break a packed defence, the visitors live on balls in behind a high line. Port's three variables are clear: whether midfield can cut the first pass of the counter, the balance of full-backs pushing forward, and whether set pieces crack the low block. With the FA Cup final 12 days away, the lineup will also reveal how Muscat is weighing 6 December.", "es": "Un partido, dos temperamentos: el Port ha marcado 13 en cuatro jornadas y el Buriram solo ha encajado tres. El local debe romper un bloque bajo; el visitante vive de los espacios a la espalda de una línea adelantada. Las tres variables del Port son claras: cortar el primer pase de la contra, el equilibrio de los laterales al subir y si el balón parado abre el cerrojo. Con la final de copa a 12 días, la alineación también dirá cómo pondera Muscat el 6 de diciembre.", "ja": "1 試合に二つの性格がぶつかる。海港は 4 試合 13 得点、ブリーラムは 4 試合 3 失点。ホーム側は密集守備を崩す必要があり、相手は高い最終ラインの背後を突いてくる。海港の変数は 3 つ。中盤でカウンターの第一パスを切れるか、サイドバックの攻守のバランス、セットプレーでブロックを崩せるか。FA カップ決勝まで 12 日あり、布陣はムスカット監督が 12 月 6 日をどう位置づけているかも示す。"}}, {"idx": "05", "tag": {}, "title": {"zh": "英锦赛资格赛：高阳 6 比 1 胜「女皇」埃文斯，下一轮与丁俊晖上演中国德比", "en": "UK Championship qualifying: Gao Yang beats Evans 6-1 and sets up an all-Chinese tie with Ding Junhui", "es": "Clasificatorio del UK Championship: Gao Yang gana 6-1 a Evans y se medirá a Ding Junhui", "ja": "UK 選手権予選 高陽がエバンズに 6 対 1 で勝利 次戦は丁俊暉との中国対決"}, "body": {"zh": "北京时间 11 月 23 日至 24 日凌晨，2026 年斯诺克英锦赛资格赛继续进行。22 岁的苏州小将高阳以 6 比 1 击败 12 届女子世锦赛冠军瑞安·埃文斯，全场打出单杆 91、73、52、69 分，制胜局在对手超分在望时清台，72 比 71 一分逆转；下一轮他将对阵丁俊晖，两人此前两次正式交手丁俊晖全胜，这场德比也确保至少一名中国选手进入决胜轮。同日，许医尘 1 比 6 不敌伊安·伯恩斯，新人邓壕辉在 1 比 0、2 比 1 领先的情况下被利亚姆·普伦以 6 比 3 逆转，空砍单杆 105 分。赵心童、吴宜泽等中国选手以种子身份直接进入正赛；三夺英锦赛冠军的丁俊晖需从资格赛打起。另有两场第二轮比赛因耗时过长推迟，王信伯 5 比 3 领先罗斯缪尔，罗泽涛与大卫·里利 5 比 5 战平。", "en": "Qualifying for the 2026 UK Championship continued through 23 and into the early hours of 24 November. Gao Yang, a 22-year-old from Suzhou, beat 12-time women's world champion Reanne Evans 6-1, firing breaks of 91, 73, 52 and 69 and clearing to win the deciding frame 72-71 after Evans had looked set to go ahead. He now meets Ding Junhui, who has won both of their previous professional meetings — a derby that guarantees at least one Chinese player in the final qualifying round. Elsewhere, Xu Yichen lost 1-6 to Ian Burns, and debutant Deng Haohui, leading 1-0 and 2-1, was beaten 6-3 by Liam Pullen despite a 105 break. Zhao Xintong and Wu Yize are seeded straight into the main draw; three-time UK champion Ding must qualify. Two second-round matches were postponed for length, with Wang Xinbo 5-3 up on Ross Muir and Luo Zetao level at 5-5 with David Lilley.", "es": "La fase clasificatoria del UK Championship 2026 continuó el 23 y la madrugada del 24 de noviembre. Gao Yang, un joven de 22 años de Suzhou, venció 6-1 a la doce veces campeona mundial femenina Reanne Evans, con series de 91, 73, 52 y 69, y ganó la manga decisiva 72-71 tras una limpieza cuando Evans parecía encaminada. Ahora se medirá a Ding Junhui, que ha ganado los dos enfrentamientos profesionales previos, un derbi que garantiza al menos un chino en la última ronda clasificatoria. Además, Xu Yichen cayó 1-6 ante Ian Burns y el debutante Deng Haohui, que iba 1-0 y 2-1 arriba, perdió 6-3 con Liam Pullen pese a una serie de 105. Zhao Xintong y Wu Yize entran directamente como cabezas de serie; el tricampeón Ding debe clasificarse. Dos partidos de segunda ronda se aplazaron por duración: Wang Xinbo manda 5-3 a Ross Muir y Luo Zetao empata 5-5 con David Lilley.", "ja": "2026 年 UK 選手権の予選は 11 月 23 日から 24 日未明にかけて続いた。蘇州出身の 22 歳、高陽が女子世界選手権 12 回優勝のリーン・エバンズを 6 対 1 で破った。ブレイクは 91、73、52、69。決勝フレームは相手がリードを広げかけたところからクリアして 72 対 71 の 1 点差で制した。次戦は丁俊暉との対戦となる。過去の公式戦 2 回はいずれも丁が勝利しており、この中国対決で少なくとも 1 人が最終予選ラウンドに進むことが確定した。同日、許医塵はイアン・バーンズに 1 対 6 で敗れ、新人の鄧壕輝は 1 対 0、2 対 1 とリードしながらリアム・プレンに 6 対 3 で逆転された（ブレイク 105）。趙心童、呉宜澤らはシードで本戦へ。UK 選手権 3 度優勝の丁俊暉は予選から出場する。長時間化で 2 試合が延期され、王信伯はロス・ミューアに 5 対 3、羅澤涛はデビッド・リリーと 5 対 5 となっている。"}, "why": {"zh": "英锦赛是三冠赛中门槛最「残酷」的一站：种子直接进正赛，其余人要在资格赛里连赢四轮。高阳这一场的价值不只是比分——出杆 24.4 秒、把「女皇」压到全场最高单杆只有 22 分，是节奏上的完胜。而德比的意义在于确定性：不管谁赢，中国军团已经锁定一个决胜轮名额。", "en": "The UK Championship is the cruellest of the Triple Crown events to enter: seeds go straight in, everyone else must win four qualifying rounds. Gao's value was not only the scoreline — 24.4 seconds per shot and holding Evans to a top break of 22 was a victory of tempo. The derby's real meaning is certainty: whoever wins, a Chinese player is guaranteed a place in the final qualifying round.", "es": "El UK Championship es el más cruel de los tres majors para entrar: los cabezas de serie pasan directo y el resto debe ganar cuatro rondas. El valor de Gao no fue solo el marcador: 24,4 segundos por tiro y dejar a Evans con una serie máxima de 22 fue una victoria de ritmo. El derbi aporta certeza: gane quien gane, habrá un chino en la última ronda.", "ja": "UK 選手権は 3 大大会で最も入口が厳しい。シードは本戦ストレートイン、それ以外は予選を 4 連勝しなければならない。高陽の価値はスコアだけではない。1 ショット 24.4 秒、エバンズを最高ブレイク 22 に抑えたのはテンポの完勝だった。中国対決の意味は確実性にある。どちらが勝っても、最終予選ラウンドに中国勢が 1 人は残る。"}}]}, {"key": "hot", "num": "05", "color": "#6d28d9", "deep": "#54209f", "name": {"zh": "网络热点", "en": "Trending", "es": "Tendencias", "ja": "ネット話題"}, "items": [{"idx": "01", "tag": {}, "title": {"zh": "「treetree 炸鸡店老板最新发声」登上热搜第一：血条清空，先歇几天", "en": "«Tree tree» fried-chicken owner tops Weibo: health bar empty, closing for a few days", "es": "El dueño del pollo frito «tree tree» lidera Weibo: «sin barra de vida», cierra unos días", "ja": "「tree tree」フライドチキン店主が熱搜 1 位 「体力ゲージが空」で数日休業"}, "body": {"zh": "11 月 23 日，「treetree 炸鸡店老板最新发声」冲上微博热搜第一。起因是河南许昌一家经营十年的披萨店，因一位外卖员发布的视频意外走红，网友调侃「数年炸鸡无人晓，一句 tree tree 全网知」。随后不少人专程到店打卡，炸鸡上架 3 分钟就卖光一天的量；老板称客流远超门店承载能力，忙到凌晨一两点，每天只睡四个多小时，店里只有他和妻子两人经营。23 日，店家在社交平台发布暂停营业通知：「实在抱歉，我们血条已清空，需要歇一歇。十年披萨老店，等几天，还是那个味。我们想要细水长流，不做一波流。」老板还回应称披萨才是主业、炸鸡只是「彩蛋」。对部分网友质疑系策划广告，外卖小哥发视频表示自己「不接线下餐饮广告」，希望公众理性消费。", "en": "On 23 November, «the tree tree fried-chicken owner speaks» topped Weibo's trending list. The story began with a ten-year-old pizza shop in Xuchang, Henan, that went viral after a delivery rider posted a video — «years of chicken, nobody knew; one 'tree tree' and the whole internet does». Crowds came to check in, and a day's batch of fried chicken sold out three minutes after coming out of the fryer. The owner said footfall far exceeded what the shop could handle, that he and his wife run it alone, finishing at one or two in the morning on four hours' sleep. On 23 November the shop posted a notice: «Sorry — our health bar is empty and we need a rest. Ten years of pizza; give us a few days and it will taste the same. We want a long, thin stream, not one big wave.» He added that pizza is the main business and the chicken was a bonus. After some users suspected a staged advert, the rider posted that he does not take offline restaurant advertising and asked people to spend sensibly.", "es": "El 23 de noviembre, «el dueño del pollo frito tree tree habla» encabezó las tendencias de Weibo. Todo empezó con una pizzería de diez años en Xuchang (Henan) que se hizo viral tras un vídeo de un repartidor: «años de pollo y nadie lo sabía; un 'tree tree' y lo sabe todo internet». La gente fue a hacerse fotos y una tanda de pollo se agotó tres minutos después de salir de la freidora. El dueño dijo que la afluencia superaba con creces la capacidad del local, que atienden solo él y su mujer, que cierra a la una o las dos de la madrugada y duerme cuatro horas. El 23 de noviembre el negocio publicó un aviso: «Lo sentimos, nuestra barra de vida está vacía y necesitamos descansar. Diez años de pizza; dennos unos días y sabrá igual. Queremos un chorro fino y largo, no una ola». Añadió que la pizza es el negocio principal y el pollo un extra. Ante las sospechas de publicidad encubierta, el repartidor publicó que no acepta anuncios de restaurantes y pidió consumo responsable.", "ja": "11 月 23 日、「tree tree フライドチキン店主が最新の思いを語る」が微博の熱搜 1 位になった。発端は河南省許昌市の 10 年続くピザ店。配達員の投稿した動画で思わぬ形で話題になり、ネットでは「何年もチキンは誰も知らなかったのに、ひと声 tree tree で全国区」と評された。その後、多くの人が来店し、チキンは揚げて 3 分でその日の分が完売。店主は、客足が店の許容量をはるかに超え、夫婦 2 人だけで切り盛りして深夜 1〜2 時に終わり、睡眠は 4 時間余りだと語った。23 日、店は「申し訳ありません、体力ゲージが空になりました。少し休ませてください。10 年のピザ店です。数日待てば味は変わりません。細く長く続けたいのであって、一発屋にはなりたくない」と休業を知らせた。ピザが本業でチキンはおまけだとも述べている。やらせではないかとの指摘に対し、配達員は「実店舗の飲食広告は受けない」と動画で説明し、冷静な消費を呼びかけた。"}, "why": {"zh": "这条热搜之所以让人愿意看，是因为它提供了一个罕见的样本：流量来了，店主的第一反应是关门。在「泼天富贵」几乎等于「必须接住」的语境里，「我们想要细水长流，不做一波流」这句话反而成了最有传播力的文案。它也顺手暴露了一个现实——两个人的小店，靠爆红是撑不住的。", "en": "What makes this one worth reading is the rarity of the sample: the traffic arrived and the owner's first instinct was to close the door. In a culture where «a fortune from the sky» is assumed to be something you must catch, «we want a long, thin stream, not one big wave» became the most shareable line of the day. It also quietly exposes a fact: a two-person shop cannot be held up by going viral.", "es": "Lo que hace valiosa esta historia es lo raro del caso: llegó el tráfico y el dueño decidió cerrar. En un contexto donde «la fortuna caída del cielo» se supone que hay que atrapar, «queremos un chorro fino y largo, no una ola» se volvió la frase más compartida del día. Y de paso revela algo real: un local de dos personas no se sostiene con la fama repentina.", "ja": "この話題が読むに値するのは、事例が珍しいからだ。流れが来たのに、店主が最初にしたのは店を閉めることだった。「降って湧いた富」は受け止めるものという空気の中で、「細く長く、一発屋はいやだ」が最も共有された言葉になった。同時に、2 人で回す店はバズでは支えきれないという現実もさらけ出した。"}}, {"idx": "02", "tag": {"zh": "进展"}, "title": {"zh": "云南昭通苹果园事件通报：损毁 181 斤，系主播「找错地点误入」，双方已达成赔偿", "en": "Zhaotong apple-orchard case: 181 jin damaged, streamer «went to the wrong plot», compensation agreed", "es": "Caso del manzanar de Zhaotong: 181 jin dañados, el creador «se equivocó de parcela» y hubo acuerdo", "ja": "雲南昭通のリンゴ園事件 被害 181 斤、配信者は「場所を間違えた」 賠償で合意"}, "body": {"zh": "11 月 23 日凌晨，云南省昭通市昭阳区洒渔镇人民政府就「有主播私闯果园带货糟蹋苹果」发布情况通报：事发后洒渔镇迅速开展调查，在双方见证下现场称量，损毁苹果共计 181 斤。经进一步核实，11 月 9 日、10 日，应果农常某某邀请，「妈妈的果园」主播到其苹果园直播带货，因常某某未到现场，主播找错地点误入相邻的陈某某果园，并在直播过程中切开苹果展示品质。经调解，11 月 22 日双方已就赔偿事宜达成一致，「妈妈的果园」负责人已向陈某某当面道歉，并赔偿其经济损失。此前 11 月 20 日，陈某某发视频称主播未经许可私自进入果园、切开 200 多斤苹果展示，果肉被扔在地上。", "en": "In the early hours of 23 November, the government of Sayu township in Zhaoyang district, Zhaotong, Yunnan, issued a notice on the case of a streamer said to have entered an orchard without permission and ruined apples. Investigators weighed the damage on site with both sides present: 181 jin in total. Further checks found that on 9 and 10 November the «Mama's Orchard» streamer had been invited by a grower surnamed Chang to livestream from his orchard; because Chang was not there, the streamer went to the wrong plot and entered the neighbouring orchard of a man surnamed Chen, cutting apples open on camera to show quality. Mediation produced an agreement on 22 November: the head of «Mama's Orchard» apologised to Chen in person and paid compensation for his losses. On 20 November, Chen had posted video saying the streamer entered without permission and cut open more than 200 jin of apples, leaving the flesh on the ground.", "es": "En la madrugada del 23 de noviembre, el gobierno del municipio de Sayu, distrito de Zhaoyang (Zhaotong, Yunnan), emitió un aviso sobre el caso del creador que habría entrado sin permiso en un manzanar y destrozado manzanas. Los investigadores pesaron los daños en el lugar con ambas partes presentes: 181 jin. Las comprobaciones hallaron que el 9 y 10 de noviembre el creador de «Mama's Orchard» había sido invitado por un agricultor de apellido Chang a emitir desde su manzana; como Chang no estaba, acudió a la parcela equivocada y entró en la contigua, de un vecino apellidado Chen, cortando manzanas ante la cámara para mostrar su calidad. La mediación logró un acuerdo el 22 de noviembre: el responsable de «Mama's Orchard» se disculpó en persona ante Chen y le indemnizó. El 20 de noviembre, Chen había publicado un vídeo denunciando la entrada sin permiso y el corte de más de 200 jin de manzanas.", "ja": "11 月 23 日未明、雲南省昭通市昭陽区洒漁鎮人民政府が「配信者が果樹園に無断侵入しリンゴを台無しにした」との件について状況を通報した。双方立会いのもと現場で計量したところ、損傷したリンゴは合計 181 斤。さらに確認したところ、11 月 9 日と 10 日、農家の常氏の招きで「ママの果樹園」の配信者が同氏のリンゴ園でライブコマースを行う予定だったが、常氏が現場に来なかったため場所を誤り、隣の陳氏の果樹園に入り込んでいた。配信中に品質を見せるためリンゴを切っていたという。調停により 11 月 22 日、双方は賠償で合意し、「ママの果樹園」の責任者が陳氏に直接謝罪し、経済的損失を賠償した。11 月 20 日には陳氏が、無断で園内に入られ 200 斤余りのリンゴを切られ実を地面に捨てられたと動画で訴えていた。"}, "why": {"zh": "通报把「硬闯」改成了「误入」，这是本案最关键的定性变化——它把一场可能的侵权纠纷拉回到民事赔偿的轨道上。但通报也留下一个没有被回答的问题：为了展示品质，真的需要切掉 181 斤苹果吗？「误入」消解的是故意，消解不了方式本身的粗糙。", "en": "The notice reframes «forced entry» as «wrong plot», the case's decisive shift — it moves a potential rights dispute back onto the track of civil compensation. But it leaves a question unanswered: to demonstrate quality, was cutting up 181 jin of apples really necessary? «Wrong plot» removes intent; it does not remove the roughness of the method.", "es": "El aviso cambia «entrada forzada» por «parcela equivocada», el giro decisivo del caso: devuelve un posible conflicto de derechos al cauce de la indemnización civil. Pero deja una pregunta sin responder: para mostrar la calidad, ¿era necesario cortar 181 jin de manzanas? «Equivocarse de parcela» elimina la intención, no la tosquedad del método.", "ja": "通報は「無断侵入」を「場所の間違い」に置き換えた。これが本件の決定的な位置づけの変化で、権利侵害の紛争になり得た話を民事賠償の枠内に戻した。ただし答えのない問いも残る。品質を見せるのに、本当に 181 斤のリンゴを切る必要があったのか。「場所を間違えた」は故意を消しても、やり方の雑さは消せない。"}}, {"idx": "03", "tag": {}, "title": {"zh": "「幼儿园要招 2 岁孩子了」冲上热搜：托班向下延伸，家长最担心的是「敢不敢送」", "en": "«Kindergartens to take two-year-olds» trends as parents ask whether they dare send them", "es": "«Los jardines de infancia aceptarán niños de dos años»: la duda de los padres es si atreverse", "ja": "「幼稚園が 2 歳児を受け入れる」が話題 保護者の本音は「預けて大丈夫か」"}, "body": {"zh": "11 月 23 日，「幼儿园要招 2 岁孩子了」冲上微博热搜前列。政策背景是四部门当日公布的《「一老一小」服务体系建设实施方案》，明确支持有条件的幼儿园举办面向 2 至 3 岁幼儿的托班，并提出打造「一刻钟托育服务圈」、建设更多家门口的托位。数据解释了幼儿园为何向下伸手：2025 年全国幼儿园净减少 2.14 万所，在园幼儿降至 3225 万，四年累计关停超过 6 万所；另一边，全国 3 岁以下婴幼儿实际入托率仅 7.86%，超过三成家庭有送托需求。价格是家长最直接的感受：社会力量办的托育机构多在每月三四千至五六千元，幼儿园办托班则明显更低，哈尔滨公办园托班最高 858 元，阿克苏指导价 540 元，杭州 2026 年春季普惠托位约 1000 至 2000 元。讨论中最集中的顾虑并非价格，而是 2 岁幼儿表达与自理能力有限带来的照护质量担忧。", "en": "On 23 November, «kindergartens are going to take two-year-olds» climbed Weibo's trending list. The policy behind it is the «one elderly, one child» implementation plan published the same day, which backs qualified kindergartens in running classes for children aged two to three and aims at a «15-minute childcare circle» with more places near home. The numbers explain why kindergartens are reaching downward: China had 21,400 fewer kindergartens in 2025, enrolment fell to 32.25 million, and more than 60,000 have closed over four years. On the other side, the actual childcare enrolment rate for under-threes is just 7.86%, while over 30% of families want places. Price is what parents notice first: private childcare centres typically charge 3,000 to 6,000 yuan a month, while kindergarten classes are far cheaper — up to 858 yuan at public kindergartens in Harbin, a guided price of 540 yuan in Aksu, and about 1,000 to 2,000 yuan for inclusive places in Hangzhou in spring 2026. The dominant worry in discussion is not cost but care quality, given how little two-year-olds can express or do for themselves.", "es": "El 23 de noviembre, «los jardines de infancia aceptarán niños de dos años» escaló en las tendencias de Weibo. La política detrás es el plan de servicios «un mayor, un niño» publicado ese mismo día, que respalda que jardines con condiciones abran clases para niños de dos a tres años y busca un «círculo de cuidado de 15 minutos» con más plazas cerca de casa. Los datos explican el movimiento: en 2025 China tenía 21.400 jardines menos, la matrícula bajó a 32,25 millones y más de 60.000 han cerrado en cuatro años. Al otro lado, la tasa real de cuidado de menores de tres años es solo del 7,86 %, mientras más del 30 % de las familias quiere plaza. El precio es lo primero que notan los padres: los centros privados cobran entre 3.000 y 6.000 yuanes al mes, frente a los 858 yuanes máximos en jardines públicos de Harbin, 540 de precio orientativo en Aksu y unos 1.000 a 2.000 en plazas inclusivas de Hangzhou. La preocupación dominante no es el coste, sino la calidad del cuidado.", "ja": "11 月 23 日、「幼稚園が 2 歳児を受け入れる」が微博の熱搜上位に入った。背景には同日公表された「一老一小」サービス体系建設の実施方案があり、条件を満たす幼稚園が 2〜3 歳児の託班を開くことを支持し、「15 分託育サービス圏」と自宅近くの託位の整備を掲げる。数字が下方向への動きを説明する。2025 年に全国の幼稚園は純減 2 万 1400 園、在園児は 3225 万人に減り、4 年間で 6 万園以上が閉鎖された。一方、3 歳未満の実際の入所率は 7.86 % にとどまり、3 割超の家庭に預けたい需要がある。保護者がまず感じるのは価格だ。民間の託育施設は月 3000〜6000 元が多いのに対し、幼稚園の託班はハルビンの公立園で最高 858 元、アクスの指導価格は 540 元、杭州の 2026 年春の普惠託位は 1000〜2000 元程度。議論で最も多い不安は価格ではなく、2 歳児の表現力と自立度が限られることによるケアの質である。"}, "why": {"zh": "这条热搜是政策的「用户视角」：文件里写的是「入托率提高 6 个百分点」，落到家长身上就是「一个月八百块，我敢不敢把孩子放进去」。空置教室与 7.86% 的入托率之间的落差，是政策最容易见效的地方；而「不放心」三个字，恰恰是价格解决不了的那部分——2 岁孩子回家说不清今天发生了什么，这是托育服务最难攻的关口。", "en": "This is the policy seen from the user's side: the document says «raise enrolment by six points», which for a parent becomes «800 yuan a month — do I dare put my child in?». The gap between empty classrooms and a 7.86% enrolment rate is where policy can show results fastest. But «I'm not reassured» is precisely the part price cannot fix: a two-year-old cannot tell you what happened today, and that is childcare's hardest gate.", "es": "Es la política vista por el usuario: el documento dice «subir la matrícula seis puntos», que para un padre se traduce en «800 yuanes al mes, ¿me atrevo a dejar a mi hijo?». La brecha entre aulas vacías y un 7,86 % de matrícula es donde la política puede rendir antes. Pero «no me fío» es justo lo que el precio no arregla: un niño de dos años no puede contar qué pasó hoy, y esa es la puerta más difícil del cuidado infantil.", "ja": "これは政策を「利用者の側」から見た話題だ。文書には「入所率を 6 ポイント上げる」とあるが、保護者にとっては「月 800 元で、預けて大丈夫か」になる。空いた教室と 7.86 % の入所率の落差は、政策が最も早く効果を出せる場所だ。しかし「不安」は価格では解決できない部分でもある。2 歳児は今日何があったか家で説明できない。そこが託育サービスの最も難しい関門である。"}}, {"idx": "04", "tag": {}, "title": {"zh": "今晚超级月亮现身，12 月与明年 1 月各再一次，凑成罕见「三连超级月亮」", "en": "A supermoon rises tonight, with more in December and January for a rare three-in-a-row", "es": "Esta noche hay superluna y habrá otra en diciembre y enero: tres seguidas, algo poco común", "ja": "今夜スーパームーン 12 月と来年 1 月にも出現し「3 連続スーパームーン」に"}, "body": {"zh": "据中央气象台与央视新闻消息，11 月 24 日晚，超级月亮将现身夜空；今年 12 月和明年 1 月还会各出现一次，构成十分罕见的跨年度「三连超级月亮」。超级月亮指满月时月球位于近地点附近，视觉上比平时更大更亮。中央气象台发布的 11 月 24 日夜间全国赏月地图显示，北方大部地区天晴朗、适宜赏月，江南一带云相伴、月色朦胧，西南地区雨雪较多、观月条件不佳。同日气象部门继续发布大风蓝色预警，预计内蒙古中东部、山西北部、河北北部、辽宁大部、吉林大部、黑龙江东部和南部、山东半岛以及西藏北部、青海东北部和西南部等地部分地区有 5 至 7 级风，阵风 8 至 9 级，局地 10 级。", "en": "According to the National Meteorological Centre and CCTV News, a supermoon will appear on the night of 24 November, with another in December and a third in January — a rare three-in-a-row spanning the new year. A supermoon occurs when a full moon coincides with the Moon near perigee, making it appear larger and brighter than usual. The centre's viewing map for the night of 24 November shows clear skies and good viewing across most of the north, cloud accompanying the moon along the Yangtze, and poor conditions with rain and snow in the southwest. The same day, the meteorological service kept a blue gale warning in effect, forecasting force 5-7 winds with gusts of 8-9 and locally 10 across parts of eastern Inner Mongolia, northern Shanxi and Hebei, most of Liaoning and Jilin, eastern and southern Heilongjiang, the Shandong peninsula, northern Tibet and northeastern and southwestern Qinghai.", "es": "Según el Centro Meteorológico Nacional y CCTV, la noche del 24 de noviembre habrá una superluna, con otra en diciembre y una tercera en enero: tres seguidas a caballo entre dos años, algo poco frecuente. Una superluna ocurre cuando la luna llena coincide con el paso por el perigeo y se ve más grande y brillante. El mapa de observación del centro para esa noche muestra cielos despejados en buena parte del norte, nubes junto a la luna en el valle del Yangtsé y malas condiciones con lluvia y nieve en el suroeste. Ese mismo día se mantuvo el aviso azul por vientos fuertes, con fuerza 5 a 7 y rachas de 8 a 9, localmente 10, en zonas del este de Mongolia Interior, norte de Shanxi y Hebei, buena parte de Liaoning y Jilin, este y sur de Heilongjiang, península de Shandong, norte del Tíbet y noreste y suroeste de Qinghai.", "ja": "中央気象台と CCTV によると、11 月 24 日の夜にスーパームーンが現れる。12 月と来年 1 月にもそれぞれ出現し、年をまたぐ「3 連続スーパームーン」という珍しい現象になる。スーパームーンは満月が近地点付近に重なる時に起こり、通常より大きく明るく見える。中央気象台の 24 日夜の全国観月マップによれば、北方の大部分は晴れて観月に適し、江南は雲がかかって月はおぼろ、西南は雨雪で条件が良くない。同日、気象当局は強風ブルー警報を継続し、内蒙古中東部、山西北部、河北北部、遼寧の大部分、吉林の大部分、黒竜江の東部と南部、山東半島、チベット北部、青海の北東部と南西部の一部で 5〜7 の風、突風 8〜9、局地的に 10 と予想した。"}, "why": {"zh": "「三连超级月亮」之所以少见，是因为它要求连续三个月的满月都恰好落在近地点附近——天文学上属于巧合，传播上属于天然话题。真正决定今晚体验的不是月亮，而是天气：北方晴朗、江南朦胧、西南难见，同一个夜晚被切成三种观感。", "en": "Three supermoons in a row is rare because it requires three consecutive full moons to fall near perigee — an astronomical coincidence and a natural talking point. What decides tonight is not the Moon but the weather: clear in the north, hazy along the Yangtze, largely hidden in the southwest, splitting one night into three experiences.", "es": "Tres superlunas seguidas es raro porque exige que tres lunas llenas consecutivas caigan cerca del perigeo: una coincidencia astronómica y un tema natural. Lo que decidirá la noche no es la Luna sino el tiempo: despejado en el norte, brumoso en el Yangtsé, casi invisible en el suroeste, dividiendo una misma noche en tres experiencias.", "ja": "3 連続スーパームーンが珍しいのは、3 カ月続けて満月が近地点付近に来る必要があるからだ。天文学的な偶然であり、話題としても自然である。今夜を決めるのは月ではなく天気だ。北方は晴れ、江南はおぼろ、西南はほぼ見えない。同じ夜が三つの体感に分かれる。"}}, {"idx": "05", "tag": {}, "title": {"zh": "2027 年度国考笔试本周末举行，23 日起可打印准考证", "en": "2027 national civil service exam is this weekend; admission tickets printable from 23 November", "es": "El examen nacional de funcionarios de 2027 es este fin de semana; entradas imprimibles desde el 23", "ja": "2027 年度国家公務員試験は今週末 11 月 23 日から受験票を印刷可能"}, "body": {"zh": "中央机关及其直属机构 2027 年度考试录用公务员笔试将于本周末举行。11 月 23 日 0 时起至 11 月 29 日 15 时，考生可登录专题网站打印准考证。同期，多地发布考前提示，提醒考生核对考点地址、提前熟悉考场周边交通，并注意证件与文具要求。此次考试报名与资格审查工作已于此前结束。", "en": "The written exam for the 2027 recruitment of civil servants by central agencies and their directly affiliated bodies will be held this weekend. From 00:00 on 23 November to 15:00 on 29 November, candidates can log in to the dedicated website to print their admission tickets. Local authorities have issued pre-exam notices urging candidates to check their test centre addresses, familiarise themselves with nearby transport and note the rules on ID documents and stationery. Registration and qualification review closed earlier.", "es": "El examen escrito para la selección de funcionarios de 2027 de los organismos centrales y sus entidades dependientes se celebrará este fin de semana. Desde las 00:00 del 23 de noviembre hasta las 15:00 del 29, los aspirantes pueden imprimir su entrada en el sitio web oficial. Varias autoridades locales han publicado avisos que piden comprobar la dirección del centro, conocer el transporte cercano y revisar los requisitos de documentación y material. La inscripción y la verificación de requisitos ya concluyeron.", "ja": "中央機関および直属機関の 2027 年度国家公務員採用試験の筆記試験が今週末に行われる。11 月 23 日 0 時から 11 月 29 日 15 時まで、受験者は特設サイトで受験票を印刷できる。各地は考前の注意を発出し、会場の住所確認、周辺交通の下見、身分証明書と筆記用具の要件の確認を呼びかけている。出願と資格審査はすでに終了した。"}, "why": {"zh": "对考生来说，这一周真正要紧的只有三件事：准考证、考点路线、证件文具。每年都有人在这三件事上出错，而它们和复习水平完全无关。提醒一句：打印截止到 11 月 29 日 15 时，别等到考前那一晚。", "en": "For candidates, only three things matter this week: the admission ticket, the route to the test centre, and documents plus stationery. Every year someone stumbles on exactly these, and none of them has anything to do with how well they studied. One reminder: printing closes at 15:00 on 29 November — don't wait for the night before.", "es": "Para los aspirantes solo importan tres cosas esta semana: la entrada, la ruta al centro y los documentos con el material. Cada año alguien falla justo en eso, y nada de ello depende de lo bien que haya estudiado. Un recordatorio: la impresión cierra a las 15:00 del 29 de noviembre.", "ja": "受験者にとって今週重要なのは 3 つだけ。受験票、会場までの経路、身分証明書と筆記用具だ。毎年この 3 点でつまずく人がいて、いずれも勉強量とは関係ない。印刷の締め切りは 11 月 29 日 15 時。前夜まで待たないように。"}}]}, {"key": "ent", "num": "06", "color": "#db2777", "deep": "#ad1a5c", "name": {"zh": "娱乐八卦", "en": "Entertainment", "es": "Espectáculos", "ja": "エンタメ"}, "items": [{"idx": "01", "tag": {}, "title": {"zh": "「马天宇送谢兴阳房车」冲上热搜，本人紧急澄清：是租的不是送的", "en": "«Ma Tianyu gave Xie Xingyang a motorhome» trends; he clarifies it was rented, not gifted", "es": "«Ma Tianyu regaló una autocaravana a Xie Xingyang» se hace viral; él aclara que era alquilada", "ja": "「馬天宇が謝興陽にキャンピングカーを贈った」が話題 本人が「借りたもの」と訂正"}, "body": {"zh": "11 月 23 日，演员谢兴阳在个人微博晒出房车照片，配文「人生的第一个房车，是马哥给的」「离开马哥谁还把我当小孩」，被快速解读为「马天宇赠送谢兴阳房车」，话题迅速登上热搜，最高至文娱榜第 5 位、热搜榜第 11 位，在榜时长超过 5 小时。话题发酵后，谢兴阳本人在评论区紧急纠正，连称「天老爷，不是送的，不是送的」，解释这台房车是两人合作拍摄电视剧《三人行》期间，马天宇特意安排给他租用的，用于拍摄间隙落脚休息、应对严寒酷暑，并非赠送产权。两人因该剧结缘，剧中饰演同一角色的不同年龄段；此前马天宇也曾送他羽绒服、红参茶，过年给过红包。", "en": "On 23 November, actor Xie Xingyang posted photos of a motorhome on Weibo with the caption «my first motorhome in life, from Brother Ma» and «who else would treat me like a kid once I leave Brother Ma», which was quickly read as Ma Tianyu having given him the vehicle. The topic hit the trending list, peaking at fifth on the entertainment chart and eleventh overall, and stayed there for over five hours. As it spread, Xie corrected it in the comments, exclaiming «good heavens, it wasn't a gift, it wasn't a gift», explaining that during filming of the drama Three of Us, Ma had arranged a rental for him to rest between takes and cope with extreme weather — not a transfer of ownership. The two met on that show, playing the same character at different ages; Ma had previously given him a down jacket and red ginseng tea, and a red envelope at Lunar New Year.", "es": "El 23 de noviembre, el actor Xie Xingyang publicó fotos de una autocaravana en Weibo con el texto «la primera autocaravana de mi vida, me la dio el hermano Ma» y «¿quién me trataría como a un niño si no fuera por el hermano Ma?», lo que se interpretó rápidamente como un regalo de Ma Tianyu. El tema llegó a lo más alto de las tendencias, quinto en la lista de espectáculos y undécimo en la general, y permaneció más de cinco horas. Al difundirse, Xie lo corrigió en los comentarios: «¡Dios mío, no fue un regalo, no fue un regalo!», y explicó que durante el rodaje de la serie Three of Us, Ma le había alquilado la autocaravana para descansar entre tomas y protegerse del frío y el calor, sin transmitirle la propiedad. Se conocieron en esa serie, donde interpretan al mismo personaje en distintas edades; antes Ma le había regalado un abrigo de plumas y té de ginseng rojo.", "ja": "11 月 23 日、俳優の謝興陽が個人の Weibo にキャンピングカーの写真を投稿し、「人生で初めてのキャンピングカーは馬さんがくれたもの」「馬さんがいなければ誰が私を子ども扱いしてくれるのか」と添えたことから、「馬天宇が謝興陽にキャンピングカーを贈った」と解釈され、話題は文娛榜 5 位、熱搜榜 11 位まで上がり、5 時間以上ランクインした。拡散後、謝興陽本人がコメント欄で「まさか、贈られたものではありません、違います」と訂正し、ドラマ『三人行』の共演中に馬天宇が手配して借りたものだと説明した。撮影の合間に休むため、厳しい寒暖に対応するためで、所有権の贈与ではないという。2 人はこの作品で知り合い、同じ役の異なる年齢を演じた。馬天宇は以前にもダウンジャケットや紅参茶を贈り、旧正月にはお年玉を渡していた。"}, "why": {"zh": "这条热搜的传播逻辑很清楚：一句「是马哥给的」被读成「赠送」，而「赠送」在娱乐圈意味着人情与资源的重量级表态，传播势能立刻拉满。真正有意思的是澄清的方式——本人用「天老爷」这种带情绪的口气连说两遍，比工作室声明管用得多。", "en": "The mechanics are plain: «from Brother Ma» was read as «a gift», and in the entertainment industry a gift of that size implies a heavyweight statement of favours and resources — enough to power the trend. What is genuinely interesting is the correction: «good heavens», said twice with real feeling, worked far better than an agency statement would have.", "es": "La mecánica es clara: «me la dio el hermano Ma» se leyó como «un regalo», y en la industria un regalo así implica una declaración de peso sobre favores y recursos, suficiente para impulsar la tendencia. Lo interesante es la corrección: un «¡Dios mío!» repetido dos veces con emoción funcionó mucho mejor que un comunicado de agencia.", "ja": "構図は明快だ。「馬さんがくれた」が「贈与」と読まれ、芸能界でその規模の贈り物は人脈と資源の重い表明を意味するため、一気に拡散した。面白いのは訂正の仕方である。「まさか」という感情のこもった言い方を 2 度繰り返すほうが、事務所の声明よりはるかに効いた。"}}, {"idx": "02", "tag": {}, "title": {"zh": "迪士尼动画《魔法秘境》上海首映，王玉雯为中文版配音", "en": "Disney's Hexed premieres in Shanghai with Wang Yuwen voicing the Mandarin version", "es": "Hexed, de Disney, se estrena en Shanghái con Wang Yuwen en la versión mandarín", "ja": "ディズニー『魔法秘境』上海でプレミア 中国語版吹き替えは王玉雯"}, "body": {"zh": "11 月 23 日，华特迪士尼动画工作室出品的原创奇幻冒险动画电影《魔法秘境》（Hexed）在上海新天地举行中国首映礼。为影片中文版配音的青年演员王玉雯现身，与现场观众分享幕后配音趣事；当天新天地户外大屏同步亮起电影主题广告。影片由《冰雪奇缘》《疯狂动物城》团队打造，将女巫国度「魔法国」搬上银幕，主角为迪士尼全新大女主比莉·朵，故事围绕魔力觉醒、自我探寻与共同成长展开。", "en": "Walt Disney Animation Studios held the Chinese premiere of its original fantasy adventure Hexed at Xintiandi in Shanghai on 23 November. Actress Wang Yuwen, who voices the Mandarin version, appeared to share behind-the-scenes stories, while the district's outdoor screens carried the film's themed advertising. Made by the team behind Frozen and Zootopia, the film brings the witch kingdom of «Hexed» to the screen with a new Disney heroine, Billie Doe, in a story about awakening powers, self-discovery and growing up together.", "es": "Walt Disney Animation Studios celebró el 23 de noviembre en Xintiandi (Shanghái) el estreno en China de Hexed, su aventura fantástica original. La actriz Wang Yuwen, voz de la versión mandarín, presentó la película y contó anécdotas del doblaje, mientras las pantallas exteriores del barrio mostraban la publicidad temática. Realizada por el equipo de Frozen y Zootopia, lleva a la pantalla el reino de las brujas con una nueva heroína, Billie Doe, en una historia sobre el despertar de la magia, la búsqueda personal y el crecimiento compartido.", "ja": "11 月 23 日、ウォルト・ディズニー・アニメーション・スタジオのオリジナル奇幻冒険アニメ『魔法秘境』（Hexed）が上海の新天地で中国プレミアを開催した。中国語版の吹き替えを担当した若手女優の王玉雯が登壇し、収録の裏話を語った。同日、新天地の屋外大型スクリーンには映画の広告が点灯した。『アナと雪の女王』『ズートピア』のチームが手がけ、魔女の国「魔法国」を舞台に、新ヒロインのビリー・ドゥが魔力の覚醒、自己探究、共に成長する物語を繰り広げる。"}, "why": {"zh": "迪士尼在中国的常规打法是「大 IP + 明星配音 + 城市地标」，这一场三样都齐了。值得留意的是宣发节奏——距离上映还有一段时间就先做首映礼，说明片方对「魔法系大女主」这条线在中国市场的期待不低，也说明贺岁档的预热已经开始。", "en": "Disney's standard playbook in China is big IP plus celebrity dubbing plus a city landmark, and this had all three. Note the timing: a premiere well before release signals that the studio has high hopes for the «magical heroine» line in this market — and that the year-end season's warm-up has already begun.", "es": "El manual habitual de Disney en China es gran propiedad intelectual, doblaje de celebridades y un emblema urbano: aquí estuvieron los tres. Llama la atención el calendario: un estreno mucho antes del lanzamiento indica que el estudio confía en la línea de «heroína mágica» en este mercado y que el calentamiento de la temporada de fin de año ya empezó.", "ja": "中国でのディズニーの定石は「大型 IP＋著名人の吹き替え＋都市のランドマーク」で、今回は三つとも揃った。注目すべきは宣伝のタイミングだ。公開まで間があるのにプレミアを打つのは、「魔法系ヒロイン」という路線への中国市場での期待の高さを示すと同時に、年末商戦の助走が始まったことを意味する。"}}, {"idx": "03", "tag": {}, "title": {"zh": "儒意电影官宣国内首创院线互动影综《好友意思的年会呀》", "en": "Ruyi Films unveils China's first interactive cinema variety show, A Very Friendly Annual Meeting", "es": "Ruyi Films presenta el primer programa de variedades interactivo para cines de China", "ja": "儒意電影が中国初の映画館向けインタラクティブ映像バラエティを発表"}, "body": {"zh": "11 月 23 日，儒意电影官宣国内首创院线互动影综《好友意思的年会呀》。产品主打年末解压的轻喜剧团建题材，以哈尔滨冰雪城市为天然片场，把地域文旅元素融入综艺叙事；体验上打破影院「保持安静、禁止互动」的固有规则，鼓励观众放声欢笑、实时联动；商业逻辑上跳出单一票房思维，探索票根经济，让一张观影票串联景区、餐饮、出行等城市文旅权益。业内认为，其意义在于让院线从内容的「搬运工」转向内容的「生产者」，用新品类填满影片空档期、盘活影厅闲置时段，降低对大片档期的依赖。", "en": "On 23 November, Ruyi Films announced A Very Friendly Annual Meeting, billed as China's first interactive cinema variety format. It is a light-comedy team-building story aimed at year-end stress relief, shot in the icy city of Harbin with local tourism woven into the narrative. It breaks cinemas' «keep quiet, no interaction» rule by encouraging laughter and real-time participation, and it steps outside single-ticket thinking to explore «ticket-stub economics», linking one cinema ticket to scenic spots, restaurants and transport perks. The industry reads its significance as moving exhibitors from hauling content to producing it — filling release gaps with a new category, using idle screening slots and reducing dependence on blockbuster windows.", "es": "El 23 de noviembre, Ruyi Films anunció A Very Friendly Annual Meeting, presentado como el primer formato de variedades interactivo para salas de cine en China. Es una comedia ligera de team building pensada para descomprimir el fin de año, rodada en la ciudad helada de Harbin con el turismo local integrado en la narrativa. Rompe la regla de «silencio y nada de interacción» al animar a reír y participar en tiempo real, y sale del modelo de entrada única para explorar la «economía del talón», vinculando una entrada a ventajas en lugares turísticos, restaurantes y transporte. El sector lo lee como un paso de los exhibidores de transportar contenido a producirlo: llenar huecos de cartelera, usar franjas ociosas y depender menos de los grandes estrenos.", "ja": "11 月 23 日、儒意電影は中国初の映画館向けインタラクティブ映像バラエティ『好友意思的年会呀』を発表した。年末のストレス解消を狙った軽喜剧のチームビルディング企画で、氷雪の街ハルビンを天然の舞台にし、地域観光の要素を物語に織り込む。映画館の「静かに、私語厳禁」という前提を破り、笑い声とリアルタイムの参加を促す。単一のチケット収入から離れ、「半券経済」を模索し、1 枚の鑑賞券を観光地、飲食、交通などの特典につなげる。業界は、配給側がコンテンツの「運び屋」から「作り手」へ移る意味があるとみる。新ジャンルで公開の谷間を埋め、遊休時間を活用し、大作依存を減らす狙いだ。"}, "why": {"zh": "「互动影综」这个提法真正想解决的是影院的病根：上座率完全被片单绑定。把综艺搬到银幕、允许观众出声、再用一张票串起文旅权益，本质是把影院从「放电影的地方」变成「聚会的场所」。它能不能成，取决于内容是否真的好笑、互动机制是否顺畅——但方向找得比多数院线自救方案更准。", "en": "What «interactive cinema variety» is really aimed at is the cinema's chronic disease: attendance lives or dies by the release calendar. Moving variety onto the big screen, letting the audience make noise, and tying one ticket to tourism perks turns the cinema from a place that shows films into a place people gather. Whether it works depends on whether it is genuinely funny and whether the interaction flows — but the direction is better aimed than most exhibitor self-rescue plans.", "es": "Lo que el «variedades interactivo» ataca es la enfermedad crónica de las salas: la asistencia depende por completo de la cartelera. Llevar el formato al gran formato, permitir que el público haga ruido y unir una entrada a ventajas turísticas convierte el cine de lugar donde se proyectan películas en lugar donde la gente se reúne. El éxito depende de que sea realmente divertido y de que la interacción fluya, pero el rumbo está mejor apuntado que la mayoría de los planes de auto rescate del sector.", "ja": "「インタラクティブ映像バラエティ」が本当に狙うのは映画館の慢性疾患だ。稼働率が作品ラインナップに完全に縛られている。バラエティをスクリーンに載せ、観客の声を許し、1 枚の券を観光特典につなげるのは、映画館を「映画を流す場所」から「人が集まる場所」に変える試みである。成否は内容が本当に面白いか、仕組みが滑らかに動くか次第だが、方向性は多くの自救策より的を射ている。"}}, {"idx": "04", "tag": {"zh": "进展"}, "title": {"zh": "《两京十五日》首播峰值收视破 2，第 7 集仍达 2.09%", "en": "Fifteen Days in Two Capitals opens above 2 in ratings and holds 2.09% by episode seven", "es": "Fifteen Days in Two Capitals debuta por encima de 2 y mantiene un 2,09 % en el capítulo siete", "ja": "『両京十五日』初回が視聴率 2 % 超、第 7 話も 2.09 %"}, "body": {"zh": "据收视监测数据，《两京十五日》首播酷云实时峰值约 2.36%，站上 2% 关口；在央一与央八黄金档古装剧首播合并统计中，以 2.33% 的合并值位列第四，前三分别为《大生意人》2.52%、《太平年》2.47%、《清明上河图密码》2.41%。若把口径从峰值换成双集均值，与接档前剧《谷雨》的差距仅 0.0071 个百分点。11 月 23 日播至第 7 集，实时收视仍达 2.09%、市占率 10.29%；网络端爱奇艺站内首日热度峰值约 7840，开播 24 个广告、7 个品牌。另有监测体系显示欢网实时峰值一度冲至 3.16%，与酷云不宜直接换算比较。", "en": "According to ratings monitors, Fifteen Days in Two Capitals peaked at about 2.36% in real-time Kuyun data on its premiere, clearing the 2% mark. Among primetime costume drama premieres on CCTV-1 and CCTV-8 combined, its 2.33% combined figure ranks fourth behind The Big Businessman at 2.52%, Peaceful Years at 2.47% and The Code of Along the River During the Qingming Festival at 2.41%. Switching from peak to two-episode average, the gap with the preceding drama Gu Yu narrows to 0.0071 percentage points. By episode seven on 23 November, real-time ratings still stood at 2.09% with a 10.29% audience share; on iQiyi the first-day heat peak was about 7,840, with 24 ad slots from seven brands. Another monitoring system showed a Huanwang real-time peak of 3.16%, though the two are not directly comparable.", "es": "Según los medidores de audiencia, Fifteen Days in Two Capitals alcanzó un pico en tiempo real de alrededor del 2,36 % en Kuyun durante su estreno, superando el 2 %. Entre los estrenos de época en horario estelar de CCTV-1 y CCTV-8 combinados, su 2,33 % conjunto ocupa el cuarto puesto, tras The Big Businessman (2,52 %), Peaceful Years (2,47 %) y The Code of Along the River During the Qingming Festival (2,41 %). Si se pasa del pico a la media de dos capítulos, la diferencia con la serie anterior Gu Yu se reduce a 0,0071 puntos. En el capítulo siete, el 23 de noviembre, la audiencia en tiempo real seguía en el 2,09 % con una cuota del 10,29 %; en iQiyi el pico de popularidad del primer día fue de unos 7.840, con 24 espacios publicitarios de siete marcas. Otro sistema mostró un pico de 3,16 % en Huanwang, aunque no son comparables directamente.", "ja": "視聴率調査によると、『両京十五日』は初回の Kuyun リアルタイム峰值が約 2.36 % となり 2 % の大台に乗った。CCTV-1 と CCTV-8 のゴールデンタイム時代劇初回を合わせた統計では、合算 2.33 % で 4 位。上位は『大生意人』2.52 %、『太平年』2.47 %、『清明上河図密碼』2.41 %。ピークではなく 2 話平均で見ると、前作『谷雨』との差はわずか 0.0071 ポイント。11 月 23 日の第 7 話でもリアルタイム視聴率は 2.09 %、シェア 10.29 % を維持した。配信の愛奇芸では初日の熱度ピークが約 7840、広告は 7 ブランド 24 枠。別系統の Huanwang ではピーク 3.16 % を記録したが、単純比較はできない。"}, "why": {"zh": "「破 2」这个说法要看清口径：破的是实时峰值，不是均值；换成双集均值，它和接档前的《谷雨》只差 0.0071 个百分点。也就是说，这是一次「第一梯队开局」，不是「断层领先」。真正值得跟的是第 7 集还稳在 2.09%——长剧的胜负通常在第三周才见分晓。", "en": "Read «above 2» carefully: that is the real-time peak, not the average, and on a two-episode average the gap with the preceding drama is 0.0071 points. In other words, this is a top-tier opening, not a runaway lead. The number worth tracking is episode seven holding at 2.09% — for a long drama, the verdict usually arrives in week three.", "es": "Cuidado con el «más de 2»: es el pico en tiempo real, no la media, y en media de dos capítulos la diferencia con la serie anterior es de 0,0071 puntos. Es un arranque de primera fila, no un liderazgo arrollador. El dato a seguir es el 2,09 % del capítulo siete: en una serie larga, el veredicto suele llegar en la tercera semana.", "ja": "「2 % 超え」は口径に注意が必要だ。超えたのはリアルタイム峰值で平均ではない。2 話平均に置き換えると、前作との差は 0.0071 ポイントしかない。つまり「第一梯队の滑り出し」であって「独走」ではない。追うべきは第 7 話でも 2.09 % を保っている点だ。長編ドラマの勝負は通常 3 週目に見える。"}}, {"idx": "05", "tag": {}, "title": {"zh": "金鸡奖提名影片《乌龙镇》定档 11 月 28 日，李梦、宇文秋实领衔", "en": "Golden Rooster nominee Wu Long Zhen sets a 28 November release with Li Meng and Yuwen Qiushi", "es": "Wu Long Zhen, nominada al Gallo de Oro, se estrena el 28 de noviembre con Li Meng y Yuwen Qiushi", "ja": "金鶏賞ノミネート作『烏龍鎮』が 11 月 28 日公開 李夢、宇文秋実が主演"}, "body": {"zh": "11 月 23 日，电影《乌龙镇》宣布定档 11 月 28 日全国公映并发布定档预告，预售同步开启。影片由阿年执导，李梦、宇文秋实领衔主演，赵燕国彰、陈创、李梦男、白红标、韩童生等共同出演。该片此前获第 38 届中国电影金鸡奖最佳中小成本故事片提名，并入围第 33 届大学生电影节「光影青春」优秀国产影片单元。同日，多部新片陆续公布档期，年末档期的排片竞争开始升温。", "en": "On 23 November, the film Wu Long Zhen announced a nationwide release on 28 November, dropping a dated trailer and opening presales. Directed by A Nian, it stars Li Meng and Yuwen Qiushi, with Zhao Yanguozhang, Chen Chuang, Li Mengnan, Bai Hongbiao and Han Tongsheng among the cast. It was previously nominated for Best Small and Medium-Budget Feature at the 38th Golden Rooster Awards and shortlisted in the «Light and Shadow of Youth» section of the 33rd College Student Film Festival. Several other titles also confirmed dates the same day, heating up competition for the year-end slot.", "es": "El 23 de noviembre, la película Wu Long Zhen anunció su estreno nacional para el 28 de noviembre, con tráiler de fecha y preventa abierta. Dirigida por A Nian, está protagonizada por Li Meng y Yuwen Qiushi, con Zhao Yanguozhang, Chen Chuang, Li Mengnan, Bai Hongbiao y Han Tongsheng en el reparto. Antes fue nominada a Mejor Largometraje de Presupuesto Pequeño y Medio en los 38.º Premios Gallo de Oro y preseleccionada en la sección «Luz y sombra de la juventud» del 33.º Festival de Cine Universitario. Otras películas confirmaron fecha ese mismo día, avivando la competencia de fin de año.", "ja": "11 月 23 日、映画『烏龍鎮』が 11 月 28 日の全国公開を発表し、予告編を公開、前売りも開始した。監督は阿年、主演は李夢と宇文秋実。趙燕国彰、陳創、李夢男、白紅標、韓童生らが共演する。第 38 回中国映画金鶏賞の最優秀中小予算作品賞にノミネートされ、第 33 回大学生映画祭の「光影青春」優秀国産映画部門にも選ばれた。同日、複数の新作が公開日を発表し、年末商戦の競争が熱を帯びてきた。"}, "why": {"zh": "中小成本片挤进贺岁档，靠的往往不是排片而是口碑：《乌龙镇》手里最实的牌是金鸡提名和大学生电影节的入围，这两项都指向「评论友好」而非「票房友好」。11 月 28 日到 12 月初是一段空窗，能不能靠口碑逆袭，第一周的场均人次就是答案。", "en": "Small and medium-budget films entering the year-end season usually rely on word of mouth rather than screen count. Wu Long Zhen's strongest cards are the Golden Rooster nomination and the college festival shortlisting — both signals of critical favour rather than box-office appeal. Late November to early December is a gap in the calendar; whether it can ride reviews to a surprise run will show in first-week attendance per screening.", "es": "Las películas de presupuesto medio que entran en la temporada de fin de año suelen depender del boca a boca más que de las salas. Las mejores cartas de Wu Long Zhen son la nominación al Gallo de Oro y la selección universitaria, señales de favor crítico más que de tirón comercial. Entre finales de noviembre y principios de diciembre hay un hueco; si puede remontar por crítica se verá en la asistencia por sesión de la primera semana.", "ja": "中小予算作品が年末商戦に入る場合、頼りになるのは上映館数よりも口コミだ。『烏龍鎮』の実質的な切り札は金鶏賞ノミネートと大学生映画祭への選出で、いずれも「批評に強い」ことを示すもので、興行に強いという意味ではない。11 月 28 日から 12 月初旬は空白期間であり、口コミで逆転できるかは初週の 1 回あたり動員数でわかる。"}}]}], "risk": {"zh": "风险提示：本简报仅作信息汇总，其中涉及的数据不构成任何投资建议。", "en": "Risk notice: this briefing is a summary of information only; the data cited does not constitute investment advice.", "es": "Aviso de riesgo: este boletín es solo un resumen informativo; los datos citados no constituyen asesoramiento de inversión.", "ja": "リスク表示：このブリーフィングは情報の要約であり、記載のデータは投資助言を構成するものではありません。"}}/*__END__*/;

  /* ===== UI 文案（与内容分离，四语齐全） ===== */
  var I18N = {

    },
    "en": {

      "tag": "UPDATE", "why": "Why: ", "badge": "EDITOR'S PICK",
      "calWeek": ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"],
      "calTitle": function (y, m) { return ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][m-1] + " " + y; }
    },
    "es": {
      "dateSub": "BOLETÍN DIARIO", "calBtn": "Archivo", "calFoot": "Los puntos marcan fechas con ejemplar guardado",
      "tag": "ACTUALIZACIÓN", "why": "Por qué: ", "badge": "DESTACADO",
      "calWeek": ["Dom", "Lun", "Mar", "Mié", "Jue", "Vie", "Sáb"],
      "calTitle": function (y, m) { return m + " · " + y; }
    },
    "ja": {
      "dateSub": "デイリーブリーフィング", "calBtn": "バックナンバー", "calFoot": "点のついた日付は保存された号があります",
      "tag": "続報", "why": "見どころ：", "badge": "特集",
      "calWeek": ["日", "月", "火", "水", "木", "金", "土"],
      "calTitle": function (y, m) { return y + "年" + m + "月"; }
    }
  };
  var LANGS = ["zh", "en", "es", "ja"];
  var LANG_LABEL = { "zh": "中文", "en": "EN", "es": "ES", "ja": "日本語" };
  var LANG_LABEL_FULL = { "zh": "中文", "en": "English", "es": "Español", "ja": "日本語" };
  var LANG_HTML = { "zh": "zh-CN", "en": "en", "es": "es", "ja": "ja" };

  // 小国旗（内联 SVG，避免外部图标依赖与 emoji 平台差异）
  function flag(lang) {
    if (lang === "zh") return '<svg class="fl" viewBox="0 0 30 20" aria-hidden="true"><rect width="30" height="20" fill="#de2910"/><g fill="#ffde00"><circle cx="5" cy="4" r="2.2"/><circle cx="9" cy="2.4" r="0.8"/><circle cx="10" cy="4" r="0.8"/><circle cx="9" cy="5.6" r="0.8"/><circle cx="7" cy="6.6" r="0.8"/></g></svg>';
    if (lang === "en") return '<svg class="fl" viewBox="0 0 30 20" aria-hidden="true"><rect width="30" height="20" fill="#012169"/><path d="M0 0L30 20M30 0L0 20" stroke="#fff" stroke-width="4"/><path d="M0 0L30 20M30 0L0 20" stroke="#c8102e" stroke-width="2"/><rect x="13" width="4" height="20" fill="#fff"/><rect y="8" width="30" height="4" fill="#fff"/><rect x="14" width="2" height="20" fill="#c8102e"/><rect y="9" width="30" height="2" fill="#c8102e"/></svg>';
    if (lang === "es") return '<svg class="fl" viewBox="0 0 30 20" aria-hidden="true"><rect width="30" height="20" fill="#aa151b"/><rect y="5" width="30" height="10" fill="#f1bf00"/></svg>';
    return '<svg class="fl" viewBox="0 0 30 20" aria-hidden="true"><rect width="30" height="20" fill="#fff"/><circle cx="15" cy="10" r="5.5" fill="#bc002d"/></svg>';
  }

  /* ===== 工具 ===== */
  function T(obj, lang) {
    if (obj == null) return "";
    if (typeof obj === "string") return obj;
    if (obj[lang] != null) return obj[lang];
    return obj.zh != null ? obj.zh : "";
  }
  function pad(n) { return n < 10 ? "0" + n : "" + n; }
  function bing(q) { return "https://www.bing.com/search?q=" + encodeURIComponent(q); }
  function fmtDate(d, lang) {
    var y = d.getFullYear(), m = d.getMonth() + 1, day = d.getDate();
    if (lang === "zh") return y + "." + pad(m) + "." + pad(day);
    if (lang === "ja") return y + "年" + m + "月" + day + "日";
    if (lang === "es") return day + " " + ["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"][m-1] + " " + y;
    return ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][m-1] + " " + day + ", " + y;
  }
  function esc(s) {
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }
  function titleHtml(titleObj, hlObj, lang) {
    var title = T(titleObj, lang);
    var hl = T(hlObj, lang);
    var inner = esc(title);
    if (hl && title.indexOf(hl) >= 0) {
      var i = title.indexOf(hl);
      inner = esc(title.slice(0, i)) + '<span class="hl">' + esc(hl) + "</span>" + esc(title.slice(i + hl.length));
    }
    return '<a class="lk" href="' + bing(title) + '" target="_blank" rel="noopener">' + inner + "</a>";
  }

  /* ===== 语言检测：localStorage > 浏览器语言 > 系统时区 > 中文 ===== */
  function detectLang() {
    try { var s = localStorage.getItem("timab_lang"); if (s && LANGS.indexOf(s) >= 0) return s; } catch (e) {}
    var nav = (navigator.language || "").toLowerCase();
    if (/^zh/.test(nav)) return "zh";
    if (/^ja/.test(nav)) return "ja";
    if (/^es/.test(nav)) return "es";
    if (/^en/.test(nav)) return "en";
    var tz = "";
    try { tz = Intl.DateTimeFormat().resolvedOptions().timeZone || ""; } catch (e) {}
    if (/^Asia\/Tokyo/.test(tz)) return "ja";
    if (/Europe\/Madrid|America\/(Mexico_City|Bogota|Lima|Santiago|Caracas|Guatemala|La_Paz|San_Jose|Panama|Asuncion|Montevideo|Havana|El_Salvador|Managua|Tegucigalpa|Costa_Rica|San_Salvador)|America\/Argentina\//.test(tz)) return "es";
    if (/^(Europe|America|Australia)\//.test(tz)) return "en";
    return "zh";
  }

  var curLang = "zh";
  var langOpen = false;

  /* ===== 渲染 ===== */
  function renderChrome(lang) {
    var i18n = I18N[lang];
    document.documentElement.lang = LANG_HTML[lang];
    // 报头信息行
    var metaEl = document.getElementById("metaRow");
    if (metaEl) metaEl.textContent = T(BRIEFING.meta, lang);
    // 大日期
    var md = document.getElementById("mastDate");
    if (md) {
      var d = new Date(BRIEFING.date + "T00:00:00");
      md.innerHTML = fmtDate(d, lang) + "<small>" + esc(i18n.dateSub) + "</small>";
    }
    // 文档标题
    var siteName = (lang === "zh") ? "提马早报" : "TIMAB DAILY";
    document.title = siteName + " · " + fmtDate(new Date(BRIEFING.date + "T00:00:00"), lang);
    // 导航签
    var nav = document.getElementById("navChips");
    if (nav) {
      var order = ["pick"].concat(BRIEFING.sections.map(function (s) { return s.key; }));
      nav.innerHTML = "";
      order.forEach(function (key) {
        if (key === "pick") {
          var a = document.createElement("a");
          a.className = "chip-pick"; a.href = "#pick"; a.setAttribute("data-nav", "pick");
          a.textContent = T(BRIEFING.spotlight.badge, lang);
          nav.appendChild(a);
        } else {
          var sec = null;
          BRIEFING.sections.forEach(function (s) { if (s.key === key) sec = s; });
          if (!sec) return;
          var b = document.createElement("a");
          b.href = "#" + key; b.setAttribute("data-nav", key);
          b.style.borderColor = sec.color; b.style.color = sec.deep;
          b.textContent = T(sec.name, lang);
          nav.appendChild(b);
        }
      });
    }
    // 日历文案
    var cb = document.getElementById("calBtnText"); if (cb) cb.textContent = i18n.calBtn;
    var cw = document.getElementById("calWeek");
    if (cw) { cw.innerHTML = ""; i18n.calWeek.forEach(function (w) { var s = document.createElement("span"); s.textContent = w; cw.appendChild(s); }); }
    var cf = document.getElementById("calFoot"); if (cf) cf.textContent = i18n.calFoot;
    // 语言切换器（国旗触发 + 下拉）
    var ls = document.getElementById("langSwitch");
    if (ls) {
      ls.className = "lang-switch" + (langOpen ? " open" : "");
      ls.innerHTML = "";
      var trig = document.createElement("button");
      trig.type = "button"; trig.className = "lang-trigger"; trig.id = "langTrigger";
      trig.setAttribute("aria-haspopup", "true");
      trig.setAttribute("aria-expanded", langOpen ? "true" : "false");
      trig.innerHTML = flag(curLang) + '<span class="caret">▾</span>';
      trig.addEventListener("click", function (e) {
        e.stopPropagation();
        langOpen = !langOpen;
        ls.classList.toggle("open", langOpen);
        trig.setAttribute("aria-expanded", langOpen ? "true" : "false");
      });
      ls.appendChild(trig);
      var menu = document.createElement("div");
      menu.className = "lang-menu"; menu.setAttribute("role", "menu");
      LANGS.forEach(function (l) {
        var item = document.createElement("button");
        item.type = "button"; item.className = "lang-item" + (l === curLang ? " sel" : "");
        item.setAttribute("role", "menuitem"); item.setAttribute("data-lang", l);
        item.innerHTML = flag(l) + '<span class="lbl">' + LANG_LABEL_FULL[l] + "</span>";
        item.addEventListener("click", function (e) {
          e.stopPropagation();
          setLang(l);
        });
        menu.appendChild(item);
      });
      ls.appendChild(menu);
    }
  }

  function renderContent(lang) {
    var i18n = I18N[lang];
    var html = "";
    // 精选
    var sp = BRIEFING.spotlight;
    html += '<section class="spotlight" id="pick">'
      + '<div class="badge"><i></i>' + esc(T(sp.badge, lang)) + "</div>"
      + "<h2>" + titleHtml(sp.title, sp.hl, lang) + "</h2>"
      + '<div class="body">' + esc(T(sp.body, lang)) + "</div>"
      + '<div class="why"><b>' + esc(i18n.why) + "</b>" + esc(T(sp.why, lang)) + "</div>"
      + "</section>";
    // 分类
    html += '<div class="grid">';
    BRIEFING.sections.forEach(function (sec) {
      html += '<section class="card" id="' + sec.key + '" style="--ac:' + sec.color + "; --ac-deep:" + sec.deep + ';">'
        + '<div class="sec-head"><span class="sec-num">' + sec.num + "</span>"
        + "<h3>" + esc(T(sec.name, lang)) + "</h3>"
        + '<span class="en">' + sec.key.toUpperCase() + "</span></div>";
      (sec.items || []).forEach(function (it) {
        html += '<div class="item">';
        html += '<div class="t"><span class="idx">' + it.idx + "</span>";
        if (it.tag) html += '<span class="tag">' + esc(it.tag[lang] != null ? it.tag[lang] : i18n.tag) + "</span>";
        html += titleHtml(it.title, it.hl, lang) + "</div>";
        html += '<div class="d">' + esc(T(it.body, lang)) + "</div>";
        html += '<div class="why"><b>' + esc(i18n.why) + "</b>" + esc(T(it.why, lang)) + "</div>";
        html += "</div>";
      });
      html += "</section>";
    });
    html += "</div>";
    var content = document.getElementById("content");
    if (content) content.innerHTML = html;
    // 页脚
    var risk = document.getElementById("risk");
    if (risk) risk.textContent = T(BRIEFING.risk, lang);
  }

  function setLang(lang) {
    if (LANGS.indexOf(lang) < 0) lang = "zh";
    curLang = lang;
    langOpen = false;
    try { localStorage.setItem("timab_lang", lang); } catch (e) {}
    renderChrome(lang);
    renderContent(lang);
  }

  /* ===== 往期日历（保留原逻辑，文案随语言） ===== */
  function initCalendar() {
    var btn = document.getElementById("calBtn");
    var pop = document.getElementById("calPop");
    var grid = document.getElementById("calGrid");
    var title = document.getElementById("calTitle");
    if (!btn || !pop || !grid || !title) return;

    var parts = BRIEFING.date.split("-");
    var todayKey = parts[0].slice(2) + parts[1] + parts[2];
    var cur = { y: +parts[0], m: +parts[1] };
    var has = {};
    for (var i = 0; i < ARCHIVE_DATES.length; i++) { has[ARCHIVE_DATES[i]] = 1; }
    var HIST_BASE = /\/history\//.test(location.pathname) ? "./" : "history/";

    function ckey(y, m, d) { return String(y).slice(2) + pad(m) + pad(d); }

    function render() {
      var i18n = I18N[curLang];
      title.textContent = i18n.calTitle(cur.y, cur.m);
      grid.innerHTML = "";
      var start = new Date(cur.y, cur.m - 1, 1).getDay();
      var days = new Date(cur.y, cur.m, 0).getDate();
      for (var b = 0; b < start; b++) {
        var blank = document.createElement("span");
        blank.className = "cal-cell is-empty"; grid.appendChild(blank);
      }
      for (var d = 1; d <= days; d++) {
        var k = ckey(cur.y, cur.m, d);
        var cell = document.createElement("span");
        cell.className = "cal-cell" + (has[k] ? " has" : "") + (k === todayKey ? " is-today" : "");
        cell.textContent = d;
        if (has[k]) {
          cell.setAttribute("role", "link"); cell.setAttribute("tabindex", "0");
          cell.title = cur.y + "-" + pad(cur.m) + "-" + pad(d) + " 存档";
          (function (target) {
            var go = function () { window.open(HIST_BASE + target + ".html", "_blank", "noopener"); };
            cell.addEventListener("click", go);
            cell.addEventListener("keydown", function (e) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); go(); } });
          })(k);
        }
        grid.appendChild(cell);
      }
    }
    function toggle(open) {
      pop.hidden = !open;
      btn.setAttribute("aria-expanded", open ? "true" : "false");
      if (open) render();
    }
    btn.addEventListener("click", function (e) { e.stopPropagation(); toggle(pop.hidden); });
    document.getElementById("calPrev").addEventListener("click", function () { cur.m--; if (cur.m < 1) { cur.m = 12; cur.y--; } render(); });
    document.getElementById("calNext").addEventListener("click", function () { cur.m++; if (cur.m > 12) { cur.m = 1; cur.y++; } render(); });
    document.addEventListener("click", function (e) { if (!pop.hidden && !pop.contains(e.target)) toggle(false); });
    document.addEventListener("keydown", function (e) { if (e.key === "Escape" && !pop.hidden) toggle(false); });
  }

  /* ===== 启动 ===== */
  function boot() {
    curLang = detectLang();
    renderChrome(curLang);
    renderContent(curLang);
    initCalendar();
    // 关闭语言下拉：点击外部 / Esc
    document.addEventListener("click", function (e) {
      var ls = document.getElementById("langSwitch");
      if (ls && langOpen && !ls.contains(e.target)) {
        langOpen = false;
        ls.classList.remove("open");
        var t = document.getElementById("langTrigger");
        if (t) t.setAttribute("aria-expanded", "false");
      }
    });
    document.addEventListener("keydown", function (e) {
      if (e.key === "Escape" && langOpen) {
        langOpen = false;
        var ls = document.getElementById("langSwitch");
        if (ls) ls.classList.remove("open");
        var t = document.getElementById("langTrigger");
        if (t) t.setAttribute("aria-expanded", "false");
      }
    });
  }
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", boot);
  } else { boot(); }
})();
</script>
</body>
</html>
