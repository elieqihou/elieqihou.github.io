<style>

  .mast-title-row {

  .mast-title {

  /* ===== 语言切换（国旗触发 + 下拉） ===== */
  .lang-switch { position: relative; display: inline-block; }
  .lang-trigger {

  .fl {
    display: block; width: 22px; height: 15px; border-radius: 2px; flex: none;

  }
  .lang-menu {
    position: absolute; top: calc(100% + 8px); right: 0; z-index: 70;
    min-width: 150px; padding: 6px; background: var(--card);
    border: 1px solid var(--line); border-radius: 12px;
    box-shadow: 0 18px 44px -18px rgba(28, 27, 23, .45), 0 2px 8px rgba(28, 27, 23, .06);
    display: none; animation: langIn .16s ease both;

  .lang-switch.open .lang-menu { display: block; }
  @keyframes langIn { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }
  .lang-item {
    display: flex; align-items: center; gap: 10px; width: 100%; cursor: pointer;

    font-family: inherit; font-size: 13px; font-weight: 600; color: var(--ink-soft);
    text-align: left; transition: background .16s ease, color .16s ease;

  .lang-item:hover { background: color-mix(in srgb, var(--accent) 10%, transparent); color: var(--accent); }
  .lang-item.sel { color: var(--accent); background: color-mix(in srgb, var(--accent) 8%, transparent); }
  .lang-item .lbl { letter-spacing: .02em; }

  /* ===== 往期日历 ===== */
  .cal-anchor { position: relative; }
  .cal-link {
    display: inline-flex; align-items: center; gap: 7px; cursor: pointer;
    font-family: inherit; font-size: 13px; font-weight: 700; letter-spacing: .1em;
    color: var(--ink-soft); background: var(--card);
    border: 1.5px solid var(--line); border-radius: 999px; padding: 5px 15px 5px 12px;
    transition: all .2s ease;
  }
  .cal-link:hover { border-color: var(--accent); color: var(--accent); }
  .cal-link svg { width: 14px; height: 14px; display: block; }
  .cal-pop {
    position: absolute; top: calc(100% + 10px); right: 0; z-index: 60;
    width: 274px; padding: 14px 14px 10px;
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    box-shadow: 0 18px 44px -18px rgba(28, 27, 23, .45), 0 2px 8px rgba(28, 27, 23, .06);
    animation: calIn .18s ease both;
  }
  .cal-pop[hidden] { display: none; }
  @keyframes calIn { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }
  .cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .cal-title { font-size: 14px; font-weight: 700; letter-spacing: .08em; color: var(--ink); }
  .cal-nav {

    font-family: inherit; font-size: 17px; color: var(--ink-soft);

  .cal-week span {
    text-align: center; font-size: 11px; letter-spacing: .06em;
    color: var(--ink-faint); padding-bottom: 6px;
  }
  .cal-cell {
    position: relative; height: 32px; display: flex; align-items: center; justify-content: center;
    font-size: 13px; color: var(--ink-faint); border-radius: 8px;
    transition: background .18s ease, color .18s ease;
  }
  .cal-cell.is-empty { visibility: hidden; }
  .cal-cell.has { color: var(--ink); font-weight: 700; cursor: pointer; }
  .cal-cell.has::after {
    content: ""; position: absolute; bottom: 3px; left: 50%; transform: translateX(-50%);
    width: 4px; height: 4px; border-radius: 50%; background: var(--accent);
  }
  .cal-cell.has:hover, .cal-cell.has:focus-visible {
    background: color-mix(in srgb, var(--accent) 16%, transparent);
    color: var(--accent); outline: none;
  }
  .cal-cell.is-today { box-shadow: inset 0 0 0 1.5px var(--line); color: var(--ink-soft); }
  .cal-foot {
    margin-top: 9px; padding-top: 8px; border-top: 1px dashed var(--line);
    font-size: 11.5px; color: var(--ink-faint); letter-spacing: .04em;
  }

  /* ===== 导航 ===== */
  .nav-chips { display: flex; flex-wrap: wrap; gap: 10px; padding: 0 0 18px; }
  .nav-chips a {
    text-decoration: none; font-size: 13.5px; font-weight: 700; letter-spacing: .08em;
    color: var(--ink-soft); border: 1.5px solid var(--line);
    border-radius: 999px; padding: 5px 16px; transition: all .2s ease;
  }
  .nav-chips a:hover { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  .nav-chips a.chip-pick { border-color: #0f766e; color: #0b5a54; }
  .nav-chips a.chip-pick:hover { background: #0f766e; color: #fff; }

  /* ===== 精选 ===== */
  .spotlight {
    margin-top: 30px; border-radius: 18px; overflow: hidden;
    background: linear-gradient(120deg, #0f766e 0%, #115e59 46%, #134e4a 100%);
    color: #f2fbfa; padding: 34px 38px 30px; position: relative;
    box-shadow: 0 18px 44px -18px rgba(15, 118, 110, .55);
  }
  .spotlight::after {
    content: ""; position: absolute; right: -60px; top: -60px; width: 240px; height: 240px;
    border-radius: 50%; background: radial-gradient(circle, rgba(255,255,255,.14), transparent 68%);
  }
  .spotlight .badge {
    display: inline-flex; align-items: center; gap: 8px;
    font-size: 12.5px; font-weight: 700; letter-spacing: .3em;
    border: 1.5px solid rgba(242, 251, 250, .55); border-radius: 999px;
    padding: 5px 18px 5px 20px; margin-bottom: 18px;
  }
  .spotlight .badge i {
    width: 8px; height: 8px; border-radius: 50%; background: #5eead4; display: inline-block;
    animation: pulse 2.2s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100% { opacity: 1; transform: scale(1);} 50% { opacity: .45; transform: scale(.78);} }
  .spotlight h2 {
    font-family: "Noto Serif SC", "Noto Serif JP", serif; font-weight: 900;
    font-size: clamp(24px, 3.4vw, 34px); line-height: 1.35; margin-bottom: 14px;
  }
  .spotlight h2 .hl { color: #99f6e4; border-bottom: 3px solid rgba(153, 246, 228, .5); padding-bottom: 2px; }
  .spotlight .body { font-size: 15px; color: #d3efec; max-width: 62em; }
  .spotlight .why {
    margin-top: 18px; padding: 14px 18px; border-left: 3px solid #5eead4;
    background: rgba(255,255,255,.07); border-radius: 0 10px 10px 0;
    font-size: 14px; color: #e8fbf9; max-width: 62em;
  }
  .spotlight .why b { color: #99f6e4; font-weight: 700; }

  /* ===== 分类卡片 ===== */
  .grid { margin-top: 30px; display: grid; grid-template-columns: repeat(2, 1fr); gap: 24px; }
  @media (max-width: 880px) { .grid { grid-template-columns: 1fr; } .spotlight { padding: 26px 22px; } }
  .card {
    background: var(--card); border-radius: 4px 4px 14px 14px;
    box-shadow: 0 1px 3px rgba(28, 27, 23, .07), 0 12px 30px -22px rgba(28,27,23,.35);
    padding: 24px 26px 12px; position: relative; border-top: 6px solid var(--ac);
    animation: rise .6s ease both;
  }
  .card:nth-child(1) { animation-delay: .05s; } .card:nth-child(2) { animation-delay: .12s; }
  .card:nth-child(3) { animation-delay: .19s; } .card:nth-child(4) { animation-delay: .26s; }
  .card:nth-child(5) { animation-delay: .33s; } .card:nth-child(6) { animation-delay: .40s; }
  @keyframes rise { from { opacity: 0; transform: translateY(16px);} to { opacity: 1; transform: none;} }
  .card:hover { transform: translateY(-3px); transition: transform .25s ease; }
  .sec-head {
    display: flex; align-items: center; gap: 12px; margin-bottom: 6px;
    padding-bottom: 12px; border-bottom: 1px solid var(--line);
  }
  .sec-num { font-family: "Playfair Display", serif; font-style: italic; font-weight: 700; font-size: 26px; color: var(--ac); line-height: 1; }

    .mast-title-row { flex-wrap: wrap; }
    .mast-side { align-items: flex-start; }

  var BRIEFING = /*__BRIEFING_DATA__*/{"date": "2026-11-27", "meta": {"zh": "星期五 · 农历十月十九 · timab.cn", "en": "Friday · 19th day of the 10th lunar month · timab.cn", "es": "Viernes · 19.o día del 10.o mes lunar · timab.cn", "ja": "金曜日 · 旧暦十月十九 · timab.cn"}, "spotlight": {"badge": {"zh": "精选", "en": "SPOTLIGHT", "es": "DESTACADO", "ja": "注目"}, "title": {"zh": "凌晨回家：神舟二十三号带回一位巴基斯坦队友", "en": "Home before dawn: Shenzhou-23 brings a Pakistani crewmate back", "es": "A casa antes del amanecer: la Shenzhou-23 trae de vuelta a un compañero paquistaní", "ja": "未明の帰還――神舟二十三号がパキスタン人飛行士を乗せて戻る"}, "hl": {"zh": "东风着陆场 26 日完成最后一次全系统演练，5 架直升机在无环境光的戈壁上等一个落点；这次回来的三个人里，有一位外籍航天员。", "en": "Dongfeng ran its final full-system rehearsal on 26 November: five helicopters waiting over a lightless Gobi for one impact point. One of the three returning astronauts is a foreign national.", "es": "Dongfeng completó el 26 de noviembre su último ensayo general: cinco helicópteros esperaban sobre un Gobi sin luz un único punto de impacto. Uno de los tres astronautas que regresan es extranjero.", "ja": "東風着陸場は 11 月 26 日、最後の全系統総合演習を終えた。環境光のないゴビで 5 機のヘリが一つの着地点を待つ。帰還する 3 人のうち 1 人は外国籍の飛行士だ。"}, "body": {"zh": "神舟二十三号载人飞船将于近日返回地球。11 月 26 日，东风着陆场按全系统、全状态、全流程组织完成搜救回收任务最后一次综合演练：地面分队的指挥车、搜索车、通信车、医监医救车进入待命点，空中分队 5 架直升机按口字形编队覆盖着陆场区 1300 平方千米，接到落点坐标通报后精准降落在返回舱周围，实现「舱落机临」，随后依次完成无水肼检测、警戒区搭建、开舱门处置。本次返回乘组为航天员张志远、黎家盈和巴基斯坦航天员穆罕默德·齐尚·阿里。飞船预计在凌晨时段着陆，针对夜间低温与戈壁无环境光，地面分队强化御寒措施，采用系留无人机天幕补光加地面灯具分层布光；医监医保在通用流程之外，就外籍航天员与女航天员的个体化健康评估和护理照料细化了方案。目前着陆场各搜救力量、装备状态与气象条件均满足返回任务要求。", "en": "Shenzhou-23 is due back on Earth in the coming days. On 26 November the Dongfeng landing site completed the last full-system, full-state, full-process rehearsal of its search-and-recovery mission: command, search, communications and medical-monitoring vehicles moved to standby points, while five helicopters flew a square formation covering 1,300 square kilometres of the landing zone. On receiving the impact-point coordinates they set down around the capsule so that aircraft and capsule arrive together, then ran hydrazine detection, cordon setup and hatch opening in sequence. The returning crew is Zhang Zhiyuan, Li Jiaying and Pakistani astronaut Muhammad Zeeshan Ali. Landing is expected before dawn; for the night-time cold and a Gobi with no ambient light, ground teams reinforced insulation, used tethered drones to light the sky plus layered ground lamps to light the work area, and tailored individual health assessment and nursing for a female and a foreign astronaut. Recovery forces, equipment and weather all now meet the mission requirements.", "es": "La Shenzhou-23 regresará a la Tierra en los próximos días. El 26 de noviembre el sitio de aterrizaje de Dongfeng completó el último ensayo general, de sistema, estado y proceso completos, de su misión de búsqueda y recuperación: los vehículos de mando, búsqueda, comunicaciones y monitoreo médico ocuparon sus puestos de espera, y cinco helicópteros volaron en formación cuadrada cubriendo 1.300 kilómetros cuadrados de la zona de aterrizaje. Al recibir las coordenadas del punto de impacto descendieron alrededor de la cápsula para que aeronave y cápsula lleguen juntas, y luego ejecutaron la detección de hidracina, el cerco de seguridad y la apertura de la escotilla. La tripulación que regresa es Zhang Zhiyuan, Li Jiaying y el astronauta paquistaní Muhammad Zeeshan Ali. El aterrizaje se espera antes del amanecer; ante el frío nocturno y un Gobi sin luz ambiental, los equipos de tierra reforzaron el aislamiento, usaron drones cautivos para iluminar el cielo y lámparas terrestres por capas para el área de trabajo, y adaptaron la evaluación médica y los cuidados a una astronauta y a un tripulante extranjero. Fuerzas, equipos y meteorología cumplen ya los requisitos de la misión.", "ja": "神舟二十三号は近く地球に帰還する。11 月 26 日、東風着陸場は全系統・全状態・全工程での搜救回収任務の最後の総合演習を完了した。地上分队の指揮車、搜索車、通信車、医監医救車が待機位置に就き、空中分队のヘリ 5 機がロの字編隊で着陸場区の 1300 平方キロを覆い、着地点の座標通报を受けると帰還舱の周囲に精密に着陸して「舱落機臨」を実現、その後无水肼の検測、警戒区の設置、ハッチ開放の処置を順にこなした。今回帰還するのは宇宙飛行士の張志遠、黎家盈、そしてパキスタンの宇宙飛行士ムハンマド・ゼーシャン・アリの 3 人。着陸は未明の時間帯の見込みで、夜間の低温と環境光のないゴビに対応するため、地上分队は防寒措置を強化し、係留ドローンによる天幕照明と地上灯具の階層的な配光を組み合わせた。医監医保は一般手順に加え、女性飛行士と外国籍飛行士に合わせた個別の健康評価と看護の方案を細分化している。現在、搜救要員、装備の状態、気象条件はいずれも帰還任務の要件を満たしている。"}, "why": {"zh": "值得看的不是「回家」这个动作，而是三个细节：夜间、低温、外籍乘组。暗舱夜航、沙尘地起降、系留无人机天幕补光——这些能力平时不会出现在新闻里，却决定了一次夜间返回能不能做到「舱落机临」。而「外籍航天员乘中国飞船返回」是空间站国际合作第一次走到闭环：25 日送上去，27 日接回来，两件事拼起来才是完整的轮换。", "en": "The landing is not the story; three details are: night, cold, and a mixed crew. Dark-cabin night flying, take-offs and landings in dust, tethered drones spreading a canopy of light — none of it usually makes the news, yet all of it decides whether a night-time recovery can put aircraft beside the capsule. And a foreign astronaut returning aboard a Chinese spacecraft closes the loop on the space-station partnership: up on the 25th, down on the 27th. Only the two halves together make a full crew rotation.", "es": "Lo importante no es el aterrizaje, sino tres detalles: noche, frío y una tripulación mixta. Vuelo nocturno en cabina a oscuras, despegues y aterrizajes en polvo, drones cautivos que extienden un techo de luz: nada de eso suele aparecer en las noticias, y sin embargo decide si una recuperación nocturna logra poner la aeronave junto a la cápsula. Y que un astronauta extranjero regrese en una nave china cierra el círculo de la cooperación en la estación espacial: arriba el día 25, abajo el 27. Solo las dos mitades juntas completan una rotación.", "ja": "焦点は着陸そのものではなく、夜間・低温・混成乗組という三つの細部にある。暗舱での夜間飛行、砂塵地での離着陸、係留ドローンによる天幕照明――普段はニュースにならないこうした能力が、夜間回収で「舱落機臨」を実現できるかを決める。そして外国籍飛行士が中国の宇宙船で帰還することは、宇宙ステーション国際協力が一つの循環を閉じたことを意味する。25 日に送り、27 日に迎える。二つ揃って初めて完全な交代になる。"}}, "sections": [{"key": "intl", "num": "01", "color": "#1d4ed8", "deep": "#1e3fa8", "name": {"zh": "国际时事", "en": "World", "es": "Internacional", "ja": "国際情勢"}, "items": [{"idx": "01", "title": {"zh": "伊朗无人机袭击科威特防空设施，两名意大利技术人员身亡", "en": "Iranian drones hit a Kuwaiti air-defence site, killing two Italian technicians", "es": "Drones iraníes atacan una instalación antiaérea en Kuwait y matan a dos técnicos italianos", "ja": "イラン製ドローンがクウェートの防空施設を攻撃、イタリア人技術者 2 人が死亡"}, "body": {"zh": "意大利外交部 26 日证实，两名意大利公民当天在科威特一处防空设施为科威特军方维护雷达探测天线时遇袭身亡，两人均为德国莱茵金属公司旗下意大利企业的技术人员。意大利副总理兼外长塔亚尼称，意大利时间 26 日 14 时左右，数架来自伊朗的无人机袭击了该军事设施并引发剧烈爆炸。意大利外交部危机处理部门、驻科威特使馆与国防部正共同跟进。伊朗方面尚未对该事件作出回应。", "en": "Italy's foreign ministry confirmed on 26 November that two Italian citizens were killed while servicing radar antennae for the Kuwaiti military at an air-defence site in Kuwait; both worked for the Italian subsidiary of German defence group Rheinmetall. Deputy premier and foreign minister Antonio Tajani said several Iranian drones struck the military facility at around 14:00 Italian time, causing a heavy explosion. The ministry's crisis unit, the embassy in Kuwait and the defence ministry are following the case jointly. Iran has not yet responded.", "es": "El Ministerio de Asuntos Exteriores italiano confirmó el 26 de noviembre que dos ciudadanos italianos murieron mientras daban mantenimiento a antenas de radar para el ejército kuwaití en una instalación antiaérea de Kuwait; ambos trabajaban para la filial italiana del grupo alemán Rheinmetall. El vicepresidente y ministro de Exteriores, Antonio Tajani, dijo que varios drones iraníes atacaron la instalación hacia las 14:00 hora italiana y provocaron una fuerte explosión. La unidad de crisis del ministerio, la embajada en Kuwait y el Ministerio de Defensa siguen el caso conjuntamente. Irán aún no ha respondido.", "ja": "イタリア外務省は 11 月 26 日、クウェートの防空施設でクウェート軍のレーダー探知アンテナの整備にあたっていたイタリア国籍の 2 人が攻撃を受けて死亡したと確認した。2 人はドイツの防衛大手ラインメタル傘下のイタリア企業の技術者だった。イタリアのタヤーニ副首相兼外相は、イタリア時間 26 日 14 時ごろ、イランから飛来した複数のドローンが軍事施設を攻撃し激しい爆発を引き起こしたと述べた。外務省の危機対策部門、在クウェート大使館、国防省が共同で対応にあたっている。イラン側はまだ反応を示していない。"}, "why": {"zh": "这是本轮冲突第一次出现「第三国技术人员在第三国领土上被打死」——科威特不是交战国，意大利不是参战国，但雷达天线是防空系统的眼睛。这类目标一旦被纳入打击清单，海湾国家口中的「中立」就只剩下纸面意义，也解释了为什么战争险保费和美军护航同时在上行。", "en": "This is the first time in this round that technicians from a third country have been killed on the soil of another third country: Kuwait is not a belligerent and Italy is not a participant, yet radar antennae are the eyes of an air-defence system. Once such targets enter a strike list, the Gulf's claim to neutrality survives only on paper, which is also why war-risk premiums and US escorts are rising at the same time.", "es": "Es la primera vez en esta ronda que técnicos de un tercer país mueren en el territorio de otro tercer país: Kuwait no es beligerante e Italia no participa, pero las antenas de radar son los ojos de un sistema antiaéreo. Cuando esos objetivos entran en una lista de ataques, la neutralidad que declaran los países del Golfo queda solo en el papel, y eso explica que las primas de riesgo de guerra y las escoltas estadounidenses suban a la vez.", "ja": "今回の衝突で初めて、第三国の技術者が別の第三国の領土で死亡した事例となった。クウェートは交戦国ではなく、イタリアも参戦国ではない。だがレーダーアンテナは防空システムの目だ。こうした目標が攻撃リストに入れば、湾岸諸国が掲げる「中立」は紙の上だけのものになる。戦争保険料と米軍の護衛が同時に上がっている理由もそこにある。"}}, {"idx": "02", "tag": {"zh": "进展"}, "title": {"zh": "霍尔木兹海峡两艘油轮触雷起火，其中一艘载油超 200 万桶", "en": "Two tankers hit mines and burn in Hormuz, one carrying over 2 million barrels", "es": "Dos petroleros chocan con minas y arden en Ormuz, uno con más de 2 millones de barriles", "ja": "ホルムズ海峡でタンカー2隻が機雷に触れ炎上、1隻は200万バレル超を積載"}, "body": {"zh": "伊朗伊斯兰革命卫队海军公共关系部门 26 日发表声明说，两艘油轮当天在霍尔木兹海峡触雷爆炸起火，事发水域位于阿曼海塞卜港以北，其中一艘为载油超过 200 万桶的超大型油轮。声明称两艘油轮「身份不明」，关闭了导航系统，试图借助美军战机护航、取道未经伊方许可的航道秘密通过海峡，最终触雷并停止航行。此前 24 日已有三艘油轮在同一海域触雷起火，伊朗议长此前称伊方握有「打破封锁的军事手段」。", "en": "The public-relations office of Iran's Revolutionary Guard navy said on 26 November that two tankers struck mines and caught fire in the Strait of Hormuz, north of Khasab port in Oman; one was a very large crude carrier holding more than 2 million barrels. The statement described both vessels as unidentified, said they had switched off navigation systems and tried to slip through on an unapproved route under US fighter escort, and hit mines and stopped. Three tankers had already struck mines in the same waters on 24 November. Iran's parliamentary speaker has said Tehran holds military means to break the blockade.", "es": "La oficina de comunicación de la marina de la Guardia Revolucionaria iraní informó el 26 de noviembre de que dos petroleros chocaron con minas y se incendiaron en el estrecho de Ormuz, al norte del puerto omaní de Khasab, uno de ellos un buque cisterna de crudo de más de 2 millones de barriles. El comunicado calificó a ambas naves de «no identificadas», señaló que apagaron los sistemas de navegación e intentaron cruzar por una ruta no autorizada con escolta de cazas estadounidenses, y que finalmente tocaron minas y se detuvieron. El 24 de noviembre otros tres petroleros habían chocado con minas en la misma zona.", "ja": "イラン革命防衛隊海軍の広報部門は 11 月 26 日、タンカー2隻がホルムズ海峡で機雷に触れて爆発・炎上したと発表した。現場はオマーンのハサブ港北方の海域で、1隻は 200 万バレル超を積む超大型原油タンカーだった。声明は2隻を「身元不明」とし、航法システムを切って米軍戦闘機の護衛を受け、イラン側の許可のない航路で海峡を秘かに通過しようとして機雷に触れ航行を停止したと主張した。24 日にも同海域で3隻が機雷に触れて炎上している。"}, "why": {"zh": "这是四天内第二批触雷油轮，吨位还升级到了超大型油轮。关键词是「关闭导航 + 借美军护航」：伊方的叙事把事故归因于「未经许可的航道」，等于给海峡通行重新定义了规则。对市场的影响不在这一艘船，而在保险费率和船东还敢不敢走这条线——这也直接解释了这两天油价的涨幅。", "en": "This is the second batch of mined tankers in four days, and the tonnage has climbed to a VLCC. The key phrase is off navigation plus US escort: by blaming an unapproved route, Tehran is effectively rewriting the rules of passage. The market impact is not this one ship but insurance rates and whether owners still dare use the lane, which is exactly what has been driving oil prices this week.", "es": "Es el segundo grupo de petroleros minados en cuatro días y el tonelaje ya llega a un VLCC. La clave está en «navegación apagada más escolta estadounidense»: al atribuir el incidente a una ruta no autorizada, Teherán reescribe de hecho las reglas del paso. El impacto no está en este barco, sino en las primas de seguro y en si los armadores se atreven a seguir usando la ruta, que es justo lo que empuja el precio del crudo.", "ja": "4 日間で 2 度目の機雷被害であり、今回は超大型原油タンカーにまで大型化した。鍵は「航法装置を切って米軍の護衛を受けた」という点にある。許可のない航路に原因を帰すことで、イランは海峡通過のルールを事実上書き換えている。市場への影響はこの 1 隻ではなく、保険料率と船主がこの航路を使い続けるかどうかであり、それがこのところの原油高の直接の理由でもある。"}}, {"idx": "03", "tag": {"zh": "进展"}, "title": {"zh": "特朗普称已敦促普京尽快与乌克兰达成协议", "en": "Trump says he pressed Putin to reach a deal with Ukraine quickly", "es": "Trump dice que instó a Putin a alcanzar pronto un acuerdo con Ucrania", "ja": "トランプ氏、プーチン氏にウクライナとの合意を急ぐよう促したと表明"}, "body": {"zh": "美国总统特朗普 26 日在社交媒体发文说，他日前在与俄罗斯总统普京的会谈中敦促其尽快与乌克兰达成协议，以结束俄乌冲突；他表示坚信「这很有可能实现」，并称「若能达成协议，那将是对所有人的一大贡献」。特朗普还说，他 25 日晚在佛罗里达州海湖庄园会见北约秘书长吕特，向其通报了与普京的谈话内容，双方重点讨论俄乌冲突与伊朗战事，强调应避免任何可能导致冲突升级的行动。同日，美国国务院批准一项价值 6.219 亿美元的对乌军售，用于出售 F-16 战机保障维护设备及相关服务，资金来自比利时、丹麦、荷兰和挪威的援助。", "en": "US President Donald Trump said on social media on 26 November that he had urged Russian President Vladimir Putin in a recent conversation to reach a deal with Ukraine quickly to end the war, adding that he firmly believes this is highly likely and that a deal would be a great contribution to everyone. He said he met NATO Secretary General Mark Rutte at Mar-a-Lago on the evening of 25 November and briefed him on the Putin talks; the two focused on Ukraine and Iran and stressed that both sides should avoid any escalation. The same day the State Department approved a 621.9 million dollar arms sale to Ukraine for F-16 sustainment equipment and services, funded by aid from Belgium, Denmark, the Netherlands and Norway.", "es": "El presidente de EE. UU., Donald Trump, dijo en redes sociales el 26 de noviembre que había instado al presidente ruso, Vladímir Putin, a alcanzar pronto un acuerdo con Ucrania para terminar la guerra, y afirmó que cree firmemente que es muy probable y que un acuerdo sería una gran contribución para todos. Señaló que se reunió con el secretario general de la OTAN, Mark Rutte, en Mar-a-Lago la noche del 25 de noviembre y le informó de la conversación con Putin; ambos trataron Ucrania e Irán y subrayaron que hay que evitar cualquier escalada. Ese mismo día el Departamento de Estado aprobó una venta de armas a Ucrania por 621,9 millones de dólares para equipo y servicios de sostenimiento de los F-16, financiada con ayuda de Bélgica, Dinamarca, Países Bajos y Noruega.", "ja": "米国のトランプ大統領は 11 月 26 日、SNS への投稿で、近く行ったロシアのプーチン大統領との会談でウクライナとの合意を急ぎ紛争を終わらせるよう促したと述べ、「実現する可能性は高い」と確信しているとし、「合意ができれば誰にとっても大きな貢献になる」と強調した。25 日夜にフロリダ州の私邸で NATO のルッテ事務総長と会談し、プーチン氏とのやり取りを伝えたとも述べ、双方はウクライナとイランの戦況を議論し、事態をエスカレートさせる行動を避けるべきだとの認識で一致した。同日、米国務省はウクライナへの F-16 維持整備器材と関連サービス供与として 6 億 2190 万ドルの武器売却を承認した。"}, "why": {"zh": "一边说「很快能谈成」，一边批 F-16 保障包——这两件事同时发生并不矛盾：军售是给谈判桌加筹码。真正的观察点是「协议」到底指什么，是停火线还是领土安排；以及欧洲会不会被排除在流程之外——俄副外长 26 日已经放话，若设前提条件，英法德将失去参与谈判的机会。", "en": "Saying a deal is close while approving an F-16 support package is not a contradiction: arms sales are chips placed on the negotiating table. What matters is what the word deal covers, a ceasefire line or a territorial arrangement, and whether Europe will be shut out of the process. Russia's deputy foreign minister already warned on 26 November that if preconditions are set, Britain, France and Germany will lose their chance to take part.", "es": "Decir que el acuerdo está cerca y a la vez aprobar un paquete de sostenimiento para los F-16 no es contradictorio: la venta de armas son fichas sobre la mesa de negociación. Lo importante es qué abarca la palabra acuerdo, una línea de alto el fuego o un arreglo territorial, y si Europa quedará fuera del proceso. El viceministro de Exteriores ruso advirtió el 26 de noviembre de que, si se ponen condiciones previas, Reino Unido, Francia y Alemania perderán la oportunidad de participar.", "ja": "「まもなく合意できる」と言いながら F-16 の維持整備パッケージを承認するのは矛盾ではない。武器売却は交渉のテーブルに置く駒だ。見るべきは「合意」が何を指すか――停戦ラインなのか領土の取り決めなのか。そして欧州が手続きから排除されるかどうかだ。ロシア外務次官は 26 日、前提条件を設けるなら英仏独は交渉に参加する機会を失うとけん制した。"}}, {"idx": "04", "title": {"zh": "以色列防长：哈马斯不解除武装将驱离百万加沙居民", "en": "Israeli defence minister: if Hamas does not disarm, a million Gazans will be displaced", "es": "El ministro de Defensa israelí: si Hamás no se desarma, se desplazará a un millón de gazatíes", "ja": "イスラエル国防相、ハマスが武装解除しなければガザ住民100万人を退去させると発言"}, "body": {"zh": "以色列国防部长卡茨 26 日在社交媒体发表声明称，如果哈马斯不解除武装，以色列国防军将继续发动军事行动，并驱离 100 万加沙地带居民。巴勒斯坦伊斯兰抵抗运动（哈马斯）政治局领导人哈亚同日发表声明，谴责以方持续违反加沙停火协议、针对巴勒斯坦民众发动军事袭击，并表示正与巴勒斯坦各派别磋商应对措施。同日，以色列正直党与以色列民主党发表联合声明，称两党已就双边组阁协议达成共识，民主党成为继「以色列是我们的家园」党之后第二个与正直党敲定组阁协议的反对派阵营政党。", "en": "Israeli Defence Minister Israel Katz said in a statement on social media on 26 November that if Hamas does not disarm, the Israeli army will keep up military operations and displace one million residents of the Gaza Strip. Hamas political bureau leader Khalil al-Hayya said the same day that Israel keeps violating the Gaza ceasefire and attacking Palestinians, and that the movement is consulting other Palestinian factions on a response. Also on 26 November, Israel's Yashar party and the Israeli Democrats said they had agreed a bilateral coalition deal, making the Democrats the second opposition-aligned party after Yisrael Beiteinu to sign with Yashar.", "es": "El ministro de Defensa israelí, Israel Katz, declaró en redes sociales el 26 de noviembre que, si Hamás no se desarma, el ejército seguirá con las operaciones militares y desplazará a un millón de residentes de la Franja de Gaza. El líder del buró político de Hamás, Khalil al-Hayya, denunció ese mismo día que Israel sigue violando el alto el fuego y atacando a la población palestina, y dijo que el movimiento consulta a las demás facciones palestinas sobre la respuesta. También el 26 de noviembre, el partido israelí Yashar y los Demócratas Israelíes anunciaron un acuerdo de coalición bilateral; los Demócratas son el segundo partido de la oposición, tras Yisrael Beiteinu, en pactar con Yashar.", "ja": "イスラエルのカッツ国防相は 11 月 26 日、SNS への声明で、ハマスが武装解除しなければイスラエル軍は軍事作戦を続け、ガザ地区の住民 100 万人を退去させると述べた。ハマスのハイヤ政治局長は同日、イスラエルがガザ停戦合意に繰り返し違反しパレスチナ住民への攻撃を続けていると非難し、対応を協議するためパレスチナ各派と接触していると表明した。同日、イスラエルのヤシャル党とイスラエル民主党は連立に関する二党間合意に達したと共同声明を出した。"}, "why": {"zh": "「驱离一百万」不是战术表述，是把人口迁移当成谈判杠杆——这种话一旦写进正式声明，停火协议的第二阶段就很难谈。另一条线是以色列组阁：正直党连着拉两个反对派阵营政党，说明内部正在为「后停火」的政治安排重新排队，而任何协议能走多远，最终取决于这个排队的结果。", "en": "Displacing a million people is not a tactical phrase; it turns population movement into leverage. Once that enters an official statement, the second phase of the ceasefire becomes very hard to negotiate. The other thread is coalition building: Yashar has now signed two opposition-aligned parties, which means Israeli politics is already queueing up for the post-ceasefire arrangement, and how far any deal goes will depend on where that queue ends.", "es": "Desplazar a un millón de personas no es una frase táctica: convierte la migración de población en palanca de negociación. Cuando eso entra en una declaración oficial, la segunda fase del alto el fuego se vuelve muy difícil de negociar. El otro hilo es la coalición: Yashar ya firmó con dos partidos de la oposición, lo que indica que la política israelí se está ordenando para el escenario posterior al alto el fuego, y hasta dónde llegue cualquier acuerdo dependerá de ese orden.", "ja": "100 万人の退去は戦術の言葉ではなく、人口移動を交渉のてこに変えるものだ。これが公式声明に入れば、停戦合意の第 2 段階の交渉は極めて難しくなる。もう一つの糸は連立工作である。ヤシャル党が相次いで野党系 2 党と合意したことは、イスラエル政治が「停戦後」の枠組みに向けて並び直していることを示す。合意がどこまで進むかは、その並び順が決める。"}}, {"idx": "05", "tag": {"zh": "进展"}, "title": {"zh": "日本民众集会反对修改「无核三原则」，在野党提交问责决议案", "en": "Japanese protesters rally against weakening the non-nuclear principles", "es": "Protestas en Japón contra la revisión de los tres principios no nucleares", "ja": "「非核三原則」見直しに反対する集会、野党は問責決議案を提出"}, "body": {"zh": "11 月 26 日，日本民众举行集会，反对政府讨论为「无核三原则」设例外。此前有报道称，日方正在探讨允许美军核武器在特定情况下进入日本领海与港口。集会参加者认为，这类调整会实质性改变日本战后安全政策。同日，立宪民主党、国民民主党等 8 个在野党派向参议院共同提交针对文部科学大臣关芳弘的问责决议案，要求其辞职。相关讨论目前仍处内部协调阶段，尚无正式方案。", "en": "Japanese citizens rallied on 26 November against government deliberations on creating exceptions to the country's three non-nuclear principles. Reports have said Tokyo is exploring whether to allow US nuclear weapons into Japanese waters and ports under certain circumstances. Participants argued that such a change would substantively alter Japan's post-war security policy. The same day, eight opposition parties including the Constitutional Democratic Party and the Democratic Party for the People jointly submitted a censure motion in the House of Councillors against education minister Yoshihiro Seki, demanding his resignation. The nuclear discussion remains at an internal coordination stage with no formal proposal.", "es": "Ciudadanos japoneses se manifestaron el 26 de noviembre contra el debate del gobierno sobre abrir excepciones a los tres principios no nucleares. Según informes, Tokio estudia permitir armas nucleares estadounidenses en aguas y puertos japoneses en determinadas circunstancias. Los participantes sostienen que ese cambio alteraría de fondo la política de seguridad de posguerra. Ese mismo día, ocho partidos de la oposición, entre ellos el Partido Democrático Constitucional y el Partido Democrático para el Pueblo, presentaron conjuntamente en la Cámara de Consejeros una moción de censura contra el ministro de Educación, Yoshihiro Seki, exigiendo su dimisión. El debate nuclear sigue en fase de coordinación interna sin propuesta formal.", "ja": "11 月 26 日、日本で「非核三原則」の例外を認める議論に反対する集会が開かれた。特定の状況で米国の核兵器を日本の領海・港に入れることを検討しているとの報道がある。参加者は、こうした調整は戦後の安全保障政策を実質的に変えると訴えた。同日、立憲民主党や国民民主党など野党 8 党は参議院に文部科学大臣に対する問責決議案を共同提出し、辞任を求めた。非核三原則をめぐる議論は依然として内部調整の段階にあり、正式な方案は示されていない。"}, "why": {"zh": "从「讨论」到「集会」，说明这件事已经进入社会动员阶段。无核三原则是日本战后安全政策公开的底线，任何「例外」的技术性表述都会被读成实质转向；而在野党同日开辟第二条战线（内阁问责），意味着执政联盟要同时应付政策争议与人事压力。", "en": "Moving from deliberation to street protest means the issue has entered the stage of social mobilisation. The three principles are the public floor of Japan's post-war security policy, so any technical wording about exceptions is read as a substantive turn. The opposition opening a second front the same day, with a censure motion, means the ruling coalition must handle a policy dispute and personnel pressure at once.", "es": "Pasar del debate a la calle indica que el asunto ha entrado en la fase de movilización social. Los tres principios son el suelo público de la política de seguridad japonesa de posguerra, así que cualquier formulación técnica sobre excepciones se lee como un giro sustantivo. Que la oposición abra ese mismo día un segundo frente con una moción de censura obliga a la coalición gobernante a atender a la vez el debate político y la presión sobre el gabinete.", "ja": "「議論」から「集会」へ移ったことは、この問題が社会運動の段階に入ったことを意味する。非核三原則は戦後安全保障政策の公的な下限であり、「例外」という技術的な言い回しも実質的な転換として読まれる。野党が同日、内閣問責という第二の戦線を開いたことは、与党連合が政策論争と人事圧力に同時に対応を迫られていることを示す。"}}]}, {"key": "dom", "num": "02", "color": "#cf2f1e", "deep": "#a82416", "name": {"zh": "国内要闻", "en": "China", "es": "China", "ja": "中国国内"}, "items": [{"idx": "01", "title": {"zh": "中纪委连打三「虎」：蔡赴朝被开除党籍，李伟被「双开」", "en": "Anti-graft body expels three senior officials in a single day", "es": "El órgano anticorrupción expulsa a tres altos cargos en un solo día", "ja": "中央紀委が同日に幹部3人を処分、蔡赴朝氏は党籍剥奪"}, "body": {"zh": "11 月 26 日，中央纪委国家监委连发三份通报：中央宣传部原副部长、原国家新闻出版广电总局党组书记、局长蔡赴朝被开除党籍；江西省委原常委、统战部原部长李伟被开除党籍和公职；中国华能集团原党组成员、总会计师王益华被开除党籍。三人均被指大搞权钱交易、涉嫌受贿犯罪，涉嫌犯罪问题已移送检察机关依法审查起诉。同日，陕西省西安市人大常委会原党组书记、主任韩松受贿案一审宣判，获刑十三年。", "en": "On 26 November China's top anti-graft bodies issued three notices in one day: Cai Fuchao, former deputy head of the publicity department and former party secretary and director of the press, publication, radio, film and television administration, was expelled from the party; Li Wei, former standing committee member of the Jiangxi provincial party committee and former head of its united front department, was expelled from both party and public office; Wang Yihua, former party member and chief accountant of China Huaneng Group, was expelled from the party. All three were accused of trading power for money and of suspected bribery, and the cases have been transferred to prosecutors. The same day a court handed a 13-year sentence to Han Song, former party secretary and director of the Xi'an municipal people's congress standing committee, in a bribery case.", "es": "El 26 de noviembre los máximos órganos anticorrupción de China emitieron tres comunicados en un día: Cai Fuchao, exvicejefe del departamento de propaganda y exsecretario del partido y director de la administración de prensa, publicaciones, radio, cine y televisión, fue expulsado del partido; Li Wei, exmiembro del comité provincial de Jiangxi y exjefe de su departamento de frente unido, fue expulsado del partido y del cargo público; Wang Yihua, exmiembro del partido y contable jefe de China Huaneng Group, fue expulsado del partido. Los tres fueron acusados de tráfico de influencias y de presunto soborno, y los casos pasaron a la fiscalía. Ese mismo día un tribunal condenó a 13 años a Han Song, exsecretario del partido y director del comité permanente de la asamblea popular de Xi'an, por soborno.", "ja": "11 月 26 日、中央紀委国家監察委員会は一日に三件の通報を出した。中央宣伝部元副部長で国家新聞出版広電総局の元党組書記・局長だった蔡赴朝氏は党籍を剥奪され、江西省党委員会元常務委員で統一戦線工作部元部長の李偉氏は党籍と公職を剥奪され、中国華能集団の元党組成員・総会計士の王益華氏も党籍を剥奪された。3 人はいずれも権力と金銭の取引を行い、収賄の疑いがあるとされ、事件は検察に移送された。同日、西安市人民代表大会常務委員会の元党組書記・主任、韓松氏の収賄事件で一審判決があり、懲役 13 年が言い渡された。"}, "why": {"zh": "三份通报同日发出，覆盖宣传系统、地方党委与央企三条线，是典型的「批量通报」节奏——它释放的信号比个案更重要：能源、宣传、地方班子仍是重点领域。读这类通报值得留意措辞差异，「双开」与「开除党籍」对应的是不同处置阶段，也决定了后续是否移送司法。", "en": "Three notices on one day, spanning the propaganda system, a provincial party committee and a central state-owned enterprise: that is the rhythm of a batch release, and the signal matters more than any single case. Energy, propaganda and local leadership teams remain the focus areas. The wording is worth reading closely, because expulsion from party and office and expulsion from the party alone mark different stages and determine whether a case goes to prosecutors.", "es": "Tres comunicados en un día, que abarcan el sistema de propaganda, un comité provincial y una empresa estatal central: es el ritmo de una publicación en bloque, y la señal importa más que cada caso. Energía, propaganda y equipos locales siguen siendo áreas prioritarias. Conviene leer la letra: la expulsión del partido y del cargo y la expulsión solo del partido marcan etapas distintas y determinan si el caso pasa a la fiscalía.", "ja": "同じ日に三件の通報が出て、宣伝系統・地方党委員会・中央企業という三つの線を覆った。これは典型的な「まとめて公表」のリズムであり、個別案件よりも信号の意味が大きい。エネルギー、宣伝、地方の指導部が引き続き重点領域だ。文言の違いにも注意したい。「双開」（党籍と公職の剥奪）と「党籍剥奪」は処分の段階が異なり、司法移送の有無を左右する。"}}, {"idx": "02", "tag": {"zh": "进展"}, "title": {"zh": "商务部回应美 301 关税：典型单边主义，坚决反对", "en": "Commerce ministry calls new US Section 301 tariffs typical unilateralism", "es": "Comercio califica de unilateralismo típico los nuevos aranceles de la Sección 301", "ja": "商務部、米国の 301 条関税は「典型的な一国主義」と反発"}, "body": {"zh": "针对美国贸易代表办公室宣布「产能过剩」301 调查结果、发布拟议措施，提出对包括中国在内的 14 个经济体加征 301 关税，商务部新闻发言人何亚东 26 日在例行新闻发布会上表示，美方 301 调查是典型的单边主义行为，严重破坏国际经济秩序、严重违反世贸组织规则，中方对此坚决反对；中方敦促美方纠正错误做法，回到通过对话协商解决问题的正确轨道上来，将密切关注事态进展，保留采取必要措施的权利，坚决捍卫自身正当权益。", "en": "Responding to the US Trade Representative's announcement of the conclusions of its overcapacity Section 301 investigation and proposed measures imposing duties on 14 economies including China, commerce ministry spokesman He Yadong said on 26 November that the probe is a textbook act of unilateralism that seriously damages the international economic order and violates WTO rules, and that China firmly opposes it. He urged Washington to correct course and return to dialogue and consultation, saying Beijing will closely follow developments, reserves the right to take necessary measures and will firmly defend its legitimate rights and interests.", "es": "Ante el anuncio de la oficina del Representante Comercial de EE. UU. sobre las conclusiones de su investigación de la Sección 301 por «exceso de capacidad» y las medidas propuestas que imponen aranceles a 14 economías, entre ellas China, el portavoz del Ministerio de Comercio, He Yadong, dijo el 26 de noviembre que la investigación es un acto típico de unilateralismo que daña gravemente el orden económico internacional y viola las reglas de la OMC, y que China lo rechaza con firmeza. Instó a Washington a rectificar y volver al diálogo y la consulta, y advirtió de que Pekín seguirá de cerca la evolución, se reserva el derecho a adoptar las medidas necesarias y defenderá firmemente sus derechos legítimos.", "ja": "米通商代表部が「過剰生産能力」をめぐる 301 条調査の結論と、中国を含む 14 の経済圏への追加関税の提案を公表したことについて、商務部の何亜東報道官は 11 月 26 日の定例記者会見で、米国の 301 条調査は典型的な一国主義であり、国際経済秩序を大きく損ない、WTO ルールに深刻に反すると述べ、中国は断固反対すると表明した。米側に誤ったやり方を改め、対話と協議による解決の軌道に戻るよう促すとともに、事態を注視し、必要な措置を取る権利を留保し、正当な権益を断固守るとした。"}, "why": {"zh": "与 25 日外交部「关税战没有出路」的表述相比，商务部这一版多了两个动作词：「保留必要措施」和「密切关注」——这是把反制留在工具箱里但暂不出手。接下来真正决定企业成本的是公众意见期的税率细节与豁免清单，而不是表态的强弱。", "en": "Compared with the foreign ministry's line on 25 November that a tariff war leads nowhere, the commerce ministry version adds two action words: reserving necessary measures and closely following developments. Countermeasures stay in the toolbox for now. What will actually set costs for companies is the rate detail and exemption list emerging from the comment period, not the volume of the statements.", "es": "Frente a la frase del Ministerio de Exteriores del 25 de noviembre de que la guerra arancelaria no lleva a ninguna parte, la versión de Comercio añade dos verbos de acción: reservarse medidas necesarias y seguir de cerca la evolución. Las contramedidas quedan por ahora en la caja de herramientas. Lo que de verdad fijará los costes empresariales son los tipos y la lista de exenciones que salgan del periodo de consulta, no la dureza de las declaraciones.", "ja": "25 日の外交部の「関税戦争に出口はない」という表現に比べ、商務部の版は「必要な措置を留保」「事態を注視」という二つの動作動詞が加わっている。対抗措置はひとまず道具箱に残した形だ。企業のコストを実際に決めるのは、意見募集期間に出てくる税率の細目と除外リストであり、発言の強弱ではない。"}}, {"idx": "03", "title": {"zh": "外交部回应日本船只非法侵闯钓鱼岛领海", "en": "Beijing protests after Japanese vessel intrudes into waters off Diaoyu Dao", "es": "Pekín protesta por la intrusión de una nave japonesa en aguas de Diaoyu Dao", "ja": "日本船の尖閣領海侵入に中国外交部が抗議"}, "body": {"zh": "11 月 26 日外交部例行记者会上，发言人郭嘉昆就日本海上保安厅要求中国船只离开钓鱼岛及其附属岛屿附近海域回应说，钓鱼岛及其附属岛屿是中国固有领土，日本船只非法侵闯钓鱼岛领海挑衅滋事，严重侵犯中国主权、破坏钓鱼岛局势稳定，中方已向日方提出严正交涉；中国海警船依法对有关船只采取必要管控措施。他表示，中方坚定维护国家领土主权和海洋权益，敦促日方恪守中日四点原则共识，停止一切侵权挑衅行为，切实采取措施防止类似事件再次发生。", "en": "At a regular briefing on 26 November, foreign ministry spokesman Guo Jiakun responded to the Japanese coast guard's radio warnings telling Chinese vessels to leave waters near Diaoyu Dao and its affiliated islands. He said Diaoyu Dao and its affiliated islands are inherent Chinese territory, that the Japanese vessel illegally intruded into China's territorial waters in a provocative act that seriously infringed sovereignty and undermined stability, and that China has lodged a solemn representation. Chinese coast guard ships took necessary control measures in accordance with the law. He said China firmly safeguards territorial sovereignty and maritime rights, and urged Japan to abide by the four-point principled consensus and stop all infringing and provocative acts.", "es": "En la rueda de prensa del 26 de noviembre, el portavoz del Ministerio de Exteriores, Guo Jiakun, respondió a las advertencias por radio de la guardia costera japonesa para que buques chinos abandonaran aguas cercanas a Diaoyu Dao y sus islas adjuntas. Afirmó que Diaoyu Dao y sus islas adjuntas son territorio inherente de China, que la nave japonesa entró ilegalmente en aguas territoriales chinas en un acto provocador que vulnera gravemente la soberanía y la estabilidad, y que China presentó una protesta formal. Buques de la guardia costera china adoptaron las medidas de control necesarias conforme a la ley. Pekín instó a Tokio a respetar el consenso de cuatro puntos y cesar toda conducta de infracción y provocación.", "ja": "11 月 26 日の定例記者会見で、外交部の郭嘉昆報道官は、日本の海上保安庁が中国船に対して尖閣諸島周辺海域からの退去を求める警告を出したことについて、尖閣諸島とその附属島嶼は中国の固有の領土であり、日本船が領海に不法に侵入して挑発し、中国の主権を深刻に侵害し情勢の安定を損なったと述べ、中国側は日本側に厳正な申し入れを行ったと明らかにした。中国海警船は関係船舶に対し法に基づき必要な管理措置を取った。中国は領土主権と海洋権益を断固守り、日本側に中日間の四つの原則的共通認識を守り、一切の権益侵害と挑発行為を止めるよう求めた。"}, "why": {"zh": "这轮交锋的次序值得注意：日方先以「广播警告」制造叙事，中方随后用「非法侵闯 + 严正交涉 + 依法管控」三句话定性。对海上执法而言，关键词是「必要管控措施」——它既保留了执法弹性，也把责任明确归到对方先动，这是这类事件里最标准的表达方式。", "en": "The sequence matters: Tokyo first created a narrative with radio warnings, then Beijing framed the incident in three moves — illegal intrusion, solemn representation, lawful control. For maritime enforcement the operative phrase is necessary control measures, which preserves operational flexibility while pinning responsibility on whoever moved first. That is the standard formulation in incidents of this kind.", "es": "Importa la secuencia: Tokio creó primero un relato con advertencias por radio y Pekín encuadró después el incidente en tres pasos: intrusión ilegal, protesta formal y control conforme a la ley. Para la aplicación marítima la frase clave es «medidas de control necesarias», que preserva flexibilidad operativa y atribuye la responsabilidad a quien se movió primero. Es la formulación habitual en este tipo de incidentes.", "ja": "順序が重要だ。日本側がまず「無線警告」で物語を作り、中国側がその後「不法侵入・厳正な申し入れ・法に基づく管理」の三手で位置づけた。海上法執行の観点で鍵となるのは「必要な管理措置」という表現で、運用の柔軟性を残しつつ、責任が先に動いた側にあることを明確にする。この種の事案では最も標準的な言い方である。"}}, {"idx": "04", "title": {"zh": "空军 33 型 60 余件装备将参加第十六届中国航展", "en": "PLA Air Force to send 33 types and over 60 items to the 16th Airshow China", "es": "La Fuerza Aérea china llevará 33 tipos y más de 60 equipos a Airshow China", "ja": "中国空軍、第16回中国国際航空宇宙博に33型・60余点を出品"}, "body": {"zh": "人民空军 11 月 26 日消息，第十六届中国航展将于 12 月 7 日至 13 日在广东珠海举办，空军将采取「飞行展示 + 地面静态展示」相结合方式，选派 33 型 60 余件装备参加，歼-20A、运-20B 等多型国产主战装备将首次对公众展示。本届航展海军也将实装参展，首设高栏海上装备展示区，075 型两栖攻击舰、055 型驱逐舰、054A 型护卫舰驻泊开放，歼-35、歼-15T、空警-600 等进行飞行表演。", "en": "The PLA Air Force said on 26 November that the 16th Airshow China will run from 7 to 13 December in Zhuhai, Guangdong, and that it will send 33 types and more than 60 items of equipment for flying and static display. The J-20A and Y-20B are among the domestic combat types to be shown to the public for the first time. The navy will also exhibit real vessels, opening a Gaolan maritime display area with a Type 075 amphibious assault ship, a Type 055 destroyer and a Type 054A frigate moored for visitors, plus flight displays by the J-35, J-15T and KJ-600.", "es": "La Fuerza Aérea del Ejército Popular dijo el 26 de noviembre que la 16.ª edición de Airshow China se celebrará del 7 al 13 de diciembre en Zhuhai, Guangdong, y que enviará 33 tipos y más de 60 equipos para exhibición en vuelo y estática. El J-20A y el Y-20B figuran entre los modelos de combate nacionales que se mostrarán al público por primera vez. La marina también expondrá buques reales y abrirá una zona marítima en Gaolan con un buque de asalto anfibio Tipo 075, un destructor Tipo 055 y una fragata Tipo 054A atracados, además de exhibiciones de vuelo del J-35, el J-15T y el KJ-600.", "ja": "人民空軍は 11 月 26 日、第 16 回中国国際航空宇宙博が 12 月 7 日から 13 日まで広東省珠海で開かれ、空軍は飛行展示と地上静的展示を組み合わせて 33 型・60 余点を出品すると発表した。J-20A や Y-20B など複数の国産主力装備が初めて一般公開される。海軍も実装で参加し、高欄海上装備展示区を初めて設けて 075 型強襲揚陸艦、055 型駆逐艦、054A 型フリゲートを停泊公開するほか、J-35、J-15T、空警-600 などが飛行展示を行う。"}, "why": {"zh": "「首次对公众展示」这五个字才是航展真正的卖点——歼-20A 与运-20B 从「列装」走到「可看」，意味着型号成熟度已经过了保密优先的阶段。对普通观众，这是一次近距离看装备迭代的机会；对观察者，航展历来是新装备公开的窗口，值得留意还有哪些「未预告」的机型出现。", "en": "First public display is the real selling point: when the J-20A and Y-20B move from in service to on show, it means the types are mature enough that secrecy is no longer the priority. For visitors it is a close look at how fast the inventory is changing; for observers, airshows have always been the window where new equipment is revealed, so watch for types that were not announced in advance.", "es": "«Primera exhibición pública» es el verdadero gancho: que el J-20A y el Y-20B pasen de estar en servicio a mostrarse indica que los modelos han madurado lo suficiente para que el secreto deje de ser prioritario. Para el público es una ocasión de ver de cerca cómo cambia el inventario; para los analistas, los salones siempre han sido la ventana donde aparecen equipos nuevos, así que conviene fijarse en modelos no anunciados.", "ja": "「初の一般公開」こそが本当の売りだ。J-20A と Y-20B が「配備」から「見せる」段階に移ったことは、機密優先の時期を過ぎた成熟度を示す。来場者にとっては装備の更新を間近で見る機会であり、観測者にとって航空ショーは常に新装備が姿を現す窓である。事前告知のない機種にも注目したい。"}}, {"idx": "05", "title": {"zh": "新一代通信网时间表：2030 年建成，适时开展 6G 建设", "en": "New communications blueprint sets 2030 target and a window for 6G", "es": "Plan de telecomunicaciones fija 2030 y una ventana para el 6G", "ja": "次世代通信網の工程表、2030 年完成と 6G の適時開始を明記"}, "body": {"zh": "工业和信息化部、国家网信办、国家发展改革委日前印发《新一代通信网建设实施方案》，提出到 2030 年建成覆盖完善、性能领先的新一代通信网：适时开展 6G 网络建设，低轨卫星互联网系统基本建成，国际海陆缆布局持续优化，工业互联网、车联网等融合网络实现规模化发展；5G-A、万兆光网在重点区域部署应用。方案还提出提升网络韧性、安全防护与绿色低碳水平。专家指出，这一建设并非推倒重来，而是盘活现有网络资产、适度超前建设。", "en": "The industry and information technology ministry, the cyberspace administration and the development and reform commission have issued an implementation plan for a new-generation communications network, targeting a comprehensive, high-performance network by 2030: 6G deployment when conditions allow, a basically completed low-orbit satellite internet system, an optimised layout of international submarine and land cables, and large-scale integrated networks for industry and connected vehicles, with 5G-Advanced and 10-gigabit optical access deployed in key areas. The plan also covers network resilience, security and green operations. Experts stress it is not a rebuild but a case of putting existing assets to work and building moderately ahead of demand.", "es": "El Ministerio de Industria y Tecnologías de la Información, la administración del ciberespacio y la comisión de desarrollo y reforma publicaron un plan para una red de comunicaciones de nueva generación, con el objetivo de contar en 2030 con una red completa y de alto rendimiento: despliegue de 6G cuando las condiciones lo permitan, un sistema de internet por satélite en órbita baja prácticamente terminado, una mejor disposición de los cables submarinos y terrestres internacionales y redes integradas a gran escala para la industria y los vehículos conectados, con 5G-Advanced y acceso óptico de 10 gigas en zonas clave. El plan también aborda resiliencia, seguridad y eficiencia energética. Los expertos subrayan que no es una reconstrucción, sino aprovechar lo existente y construir con cierta anticipación.", "ja": "工業情報化部、国家インターネット情報弁公室、国家発展改革委員会はこのほど「次世代通信網建設実施方案」を公表し、2030 年までに網羅性が高く性能で先行する次世代通信網を構築するとした。状況に応じて 6G 網の建設を開始し、低軌道衛星インターネットをほぼ完成させ、国際的な海底ケーブル・陸上ケーブルの配置を継続的に最適化し、産業インターネットや車載網などの融合網を規模展開する。5G-A と万兆光回線は重点区域で導入する。方案はネットワークの強靱性、安全性、省エネも盛り込んだ。専門家は、既存網の作り直しではなく、資産を活用し適度に先行して整備するものだと指摘する。"}, "why": {"zh": "把 6G、低轨卫星、海陆缆放进同一份方案，说明「通信基础设施」的定义已经从基站扩展到「天地一体 + 国际通道」。对产业来说，2030 年是可排产的时间表；对读者来说，「不是推倒重来」这句话更重要——它意味着 5G 资产不会被浪费，运营商的资本开支节奏也不会突然跳变。", "en": "Putting 6G, low-orbit satellites and international cables in one plan shows that communications infrastructure now means space-plus-ground plus global routes, not just base stations. For industry, 2030 is a date you can schedule against; for everyone else the sentence that matters is that this is not a rebuild, which means 5G assets will not be stranded and operator capex will not suddenly lurch.", "es": "Reunir 6G, satélites de órbita baja y cables internacionales en un mismo plan demuestra que la infraestructura de comunicaciones ya significa espacio más tierra más rutas globales, no solo estaciones base. Para la industria, 2030 es una fecha con la que se puede planificar; para el resto, la frase decisiva es que no se reconstruye desde cero, lo que implica que los activos 5G no quedarán varados ni el gasto de capital de los operadores dará un salto brusco.", "ja": "6G、低軌道衛星、海底・陸上ケーブルを一つの方案にまとめたことは、通信インフラの定義が基地局から「宇宙と地上の一体＋国際ルート」に広がったことを示す。産業にとって 2030 年は計画に落とせる日程であり、読者にとって重要なのは「作り直しではない」という一文だ。5G 資産が無駄にならず、通信事業者の設備投資も急に跳ねないという意味になる。"}}]}, {"key": "fin", "num": "03", "color": "#b45309", "deep": "#8a3f07", "name": {"zh": "金融要闻", "en": "Finance", "es": "Finanzas", "ja": "金融・経済"}, "items": [{"idx": "01", "tag": {"zh": "进展"}, "title": {"zh": "A 股缩量震荡，沪指尾盘翻红守住 3470 点", "en": "A-shares steady after two-day slide as Shanghai edges up on thin volume", "es": "La bolsa china se estabiliza tras dos caídas y Shanghái cierra plano", "ja": "中国株は縮小商いで下げ止まり、上海総合は小反発"}, "body": {"zh": "11 月 26 日，A 股主要指数走势分化：上证指数涨 0.01% 报 3476.88 点，深证成指跌 0.02% 报 10084.04 点，创业板指涨 0.29% 报 2189.82 点，科创综指跌 1.00% 报 1304.37 点，北证 50 跌 0.45%。沪深两市成交约 1.32 万亿元，较前一交易日缩量 658 亿元。盘面上，贵金属、元件、煤炭开采加工涨幅居前，PCB、光模块等算力硬件反弹，中际旭创、新易盛获大额资金流入；银行板块午后拉升，南京银行、交通银行、中信银行等多只个股盘中创出新高；机场航运、生物制品、医疗器械跌幅居前。", "en": "Chinese equities diverged on 26 November: the Shanghai composite rose 0.01% to 3,476.88, the Shenzhen component slipped 0.02% to 10,084.04, the ChiNext index gained 0.29% to 2,189.82, the STAR composite fell 1.00% to 1,304.37 and the Beijing 50 dropped 0.45%. Turnover across the two mainland exchanges was about 1.32 trillion yuan, 65.8 billion less than the previous session. Precious metals, electronic components and coal led gains; PCB and optical-module names rebounded, with Zhongji Innolight and Eoptolink drawing large inflows. Banks rallied in the afternoon, with Bank of Nanjing, Bank of Communications and China CITIC Bank hitting intraday highs. Airports, biologics and medical devices lagged.", "es": "La bolsa china se dividió el 26 de noviembre: el índice compuesto de Shanghái subió un 0,01% a 3.476,88 puntos, el componente de Shenzhen bajó un 0,02% a 10.084,04, el ChiNext ganó un 0,29% a 2.189,82, el compuesto STAR cedió un 1,00% a 1.304,37 y el Beijing 50 perdió un 0,45%. El volumen de los dos mercados fue de unos 1,32 billones de yuanes, 65.800 millones menos que la sesión anterior. Lideraron las subidas metales preciosos, componentes electrónicos y carbón; rebotaron los fabricantes de placas de circuito y módulos ópticos, con fuertes entradas en Zhongji Innolight y Eoptolink. La banca repuntó por la tarde, con Bank of Nanjing, Bank of Communications y China CITIC Bank en máximos intradía. Aeropuertos, biológicos y dispositivos médicos quedaron rezagados.", "ja": "11 月 26 日の中国株はまちまちだった。上海総合指数は 0.01% 高の 3476.88、深セン成分指数は 0.02% 安の 10084.04、創業板指数は 0.29% 高の 2189.82、科創綜指は 1.00% 安の 1304.37、北証 50 は 0.45% 安だった。上海・深センの売買代金は約 1 兆 3200 億元で、前日より 658 億元減少した。貴金属、電子部品、石炭が上昇し、PCB や光モジュールなど算力関連が反発、中際旭創や新易盛に資金が流入した。銀行株は午後に上げ幅を広げ、南京銀行、交通銀行、中信銀行などが日中高値を付けた。空港、生物製品、医療機器は下落した。"}, "why": {"zh": "连续两天大跌之后，指数只做到「翻红不涨」，说明这是止跌而不是反攻。结构比点位更值得看：资金从半导体撤出后没有离场，而是去了贵金属、煤炭、银行这些「确定性资产」，同时用 PCB、光模块留一点弹性——典型的防守里带一点进攻。成交缩量 658 亿，分歧在收敛，但也意味着没人愿意先加仓。", "en": "After two heavy down days the index managed only to turn green without rising, which is stabilisation rather than counterattack. The structure matters more than the level: money leaving semiconductors did not leave the market, it moved into precious metals, coal and banks, while keeping some elasticity through PCB and optical modules. Turnover shrank by 65.8 billion yuan, so disagreement is narrowing, but it also means nobody wants to add first.", "es": "Tras dos jornadas de fuertes caídas, el índice solo logró cerrar en verde sin subir: es estabilización, no contraataque. La estructura importa más que el nivel: el dinero que salió de los semiconductores no abandonó el mercado, se fue a metales preciosos, carbón y banca, manteniendo cierta elasticidad en placas y módulos ópticos. El volumen cayó en 65.800 millones de yuanes: la discrepancia se reduce, pero también significa que nadie quiere ser el primero en comprar.", "ja": "二日続落の後、指数は「プラス圏に戻したが上げない」にとどまり、これは反発ではなく下げ止まりを示す。水準よりも構造が重要だ。半導体から抜けた資金は市場を離れず、貴金属・石炭・銀行といった「確実性の資産」に向かい、PCB と光モジュールで弾力を残した。売買代金は 658 億元減り、見方の差は縮まっているが、同時に誰も先に買い増したくないという意味でもある。"}}, {"idx": "02", "title": {"zh": "感恩节全球股市大反攻，美股休市、芯片股领涨", "en": "Global rally on Thanksgiving as US markets close and chip stocks lead", "es": "Rebote global en Acción de Gracias con Wall Street cerrado y chips al alza", "ja": "感謝祭に世界株が反発、米国は休場で半導体がけん引"}, "body": {"zh": "11 月 26 日美国感恩节假期，美股休市，27 日将提前至美东时间 13 时收市。亚太与欧洲股市集体反弹：日经 225 涨 0.86%，韩国综合指数涨 0.29%，恒生指数尾盘涨 1.52%，澳大利亚 ASX 200 涨 0.82%；泛欧斯托克 600 涨 2.03%，德国 DAX 涨 2.34%，法国 CAC 40 涨 1.86%，英国富时 100 涨 1.99%，意大利富时 MIB 涨 2.71%。芯片股领涨，铠侠在东京大涨 14%（此前宣布与英伟达合作探索 GPU 内存扩容），软银涨逾 7%，爱德万测试涨 4.57%。同日有消息称，英伟达已要求制造伙伴停止向马来西亚、新加坡、泰国和印度尼西亚运送 AI 服务器，以配合美国新出口管制规定。", "en": "US markets were closed for Thanksgiving on 26 November and will close early at 13:00 Eastern on the 27th. Asia-Pacific and European bourses rallied together: the Nikkei 225 rose 0.86%, Korea's Kospi 0.29%, the Hang Seng 1.52% late in the session and Australia's ASX 200 0.82%, while the pan-European Stoxx 600 gained 2.03%, Germany's DAX 2.34%, France's CAC 40 1.86%, the FTSE 100 1.99% and Italy's FTSE MIB 2.71%. Chip names led: Kioxia jumped 14% in Tokyo after saying it would work with Nvidia on expanding GPU memory capacity, SoftBank gained over 7% and Advantest 4.57%. Reports also said Nvidia has asked manufacturing partners to stop shipping AI servers to Malaysia, Singapore, Thailand and Indonesia to comply with new US export controls.", "es": "Los mercados estadounidenses cerraron por Acción de Gracias el 26 de noviembre y el 27 lo harán a las 13:00 hora del Este. Asia-Pacífico y Europa rebotaron a la vez: el Nikkei 225 subió un 0,86%, el Kospi un 0,29%, el Hang Seng un 1,52% al cierre y el ASX 200 un 0,82%; el Stoxx 600 paneuropeo ganó un 2,03%, el DAX alemán un 2,34%, el CAC 40 un 1,86%, el FTSE 100 un 1,99% y el FTSE MIB italiano un 2,71%. Lideraron los chips: Kioxia saltó un 14% en Tokio tras anunciar que colaborará con Nvidia para ampliar la capacidad de memoria de las GPU, SoftBank ganó más del 7% y Advantest un 4,57%. También trascendió que Nvidia pidió a sus socios industriales dejar de enviar servidores de IA a Malasia, Singapur, Tailandia e Indonesia para cumplir los nuevos controles de exportación.", "ja": "11 月 26 日は感謝祭で米国市場は休場、27 日は東部時間 13 時に早期終了する。アジア太平洋と欧州はそろって反発し、日経平均は 0.86% 高、韓国総合株価指数は 0.29% 高、ハンセン指数は引け際に 1.52% 高、ASX 200 は 0.82% 高。欧州はストックス 600 が 2.03% 高、ドイツ DAX が 2.34% 高、フランス CAC 40 が 1.86% 高、英 FTSE 100 が 1.99% 高、伊 FTSE MIB が 2.71% 高となった。半導体が相場を導き、キオクシアは GPU メモリー容量の拡張でエヌビディアと協業すると発表して 14% 急騰、ソフトバンクは 7% 超高、アドバンテストは 4.57% 高。同日、エヌビディアが新たな輸出管理に対応するため、マレーシア・シンガポール・タイ・インドネシアへの AI サーバー出荷を製造パートナーに停止させたとの報道もあった。"}, "why": {"zh": "反弹的直接理由是「关税没有想象中狠」，但更实的支撑是铠侠与英伟达的合作——它把「AI 内存不够用」这个产业问题变成了可交易的预期。风险在另一边：英伟达停供东南亚四国，说明出口管制正从「卖什么」扩展到「在哪里组装」，AI 供应链的迁移成本会被重新定价。", "en": "The stated reason for the rally is that the tariffs were less harsh than feared, but the firmer support is the Kioxia-Nvidia tie-up, which turns the industry problem of insufficient AI memory into a tradable expectation. The risk sits on the other side: Nvidia halting shipments to four Southeast Asian countries shows export controls expanding from what you sell to where you assemble it, and the cost of moving AI supply chains will be repriced.", "es": "La razón esgrimida del rebote es que los aranceles fueron menos duros de lo temido, pero el apoyo más sólido es la alianza Kioxia-Nvidia, que convierte el problema sectorial de la falta de memoria para IA en una expectativa negociable. El riesgo está al otro lado: que Nvidia frene los envíos a cuatro países del sudeste asiático muestra que los controles de exportación pasan de «qué se vende» a «dónde se ensambla», y el coste de mover las cadenas de suministro de IA se recalculará.", "ja": "反発の表向きの理由は「関税が想定より厳しくなかった」ことだが、より確かな支えはキオクシアとエヌビディアの協業だ。AI メモリー不足という産業課題を、取引可能な期待に変えた。リスクは逆側にある。エヌビディアが東南アジア 4 か国への出荷を止めたことは、輸出管理が「何を売るか」から「どこで組み立てるか」へ広がったことを示し、AI 供給網の移転コストが再評価される。"}}, {"idx": "03", "title": {"zh": "中东袭击推高油价，金价盘中跌破 3500 美元后拉回", "en": "Middle East strikes lift oil as gold dips below $3,500 and rebounds", "es": "Los ataques en Oriente Medio impulsan el crudo y el oro cae bajo 3.500 y rebota", "ja": "中東攻撃で原油高、金は3500ドル割れから反発"}, "body": {"zh": "受中东能源设施与霍尔木兹海峡船只接连遇袭影响，国际油价延续涨势，WTI 原油在 84 美元附近、布伦特原油在 90 美元上方波动，此前两个交易日累计涨幅接近 6%。现货黄金盘中一度跌破 3500 美元/盎司，随后反弹至 3590 美元附近；COMEX 黄金期货收涨 0.74% 报 3588.40 美元，白银期货涨 0.90% 报 41.15 美元。美元指数在 103.7 附近持稳，离岸人民币报 6.6675；10 年期美债收益率跌至 4.858%，30 年期报 5.250%，2 年期 4.646%。", "en": "After successive attacks on Middle East energy facilities and ships in the Strait of Hormuz, crude extended gains, with WTI trading around 84 dollars a barrel and Brent above 90 after a nearly 6% rise over the previous two sessions. Spot gold briefly fell below 3,500 dollars an ounce before rebounding towards 3,590; COMEX gold futures settled 0.74% higher at 3,588.40 dollars and silver rose 0.90% to 41.15. The dollar index held near 103.7 and the offshore yuan traded at 6.6675. The 10-year Treasury yield fell to 4.858%, the 30-year to 5.250% and the 2-year to 4.646%.", "es": "Tras los sucesivos ataques a instalaciones energéticas de Oriente Medio y a buques en el estrecho de Ormuz, el crudo amplió sus ganancias: el WTI rondó los 84 dólares por barril y el Brent superó los 90, después de subir casi un 6% en las dos sesiones previas. El oro al contado cayó momentáneamente por debajo de 3.500 dólares la onza y luego rebotó hacia 3.590; los futuros COMEX cerraron con un alza del 0,74% en 3.588,40 dólares y la plata subió un 0,90% a 41,15. El índice del dólar se mantuvo cerca de 103,7 y el yuan offshore cotizó en 6,6675. El bono a 10 años bajó a 4,858%, el de 30 años a 5,250% y el de 2 años a 4,646%.", "ja": "中東のエネルギー施設とホルムズ海峡の船舶への攻撃が続くなか、原油は上げを伸ばし、WTI は 1 バレル 84 ドル前後、ブレントは 90 ドル台前半で推移した。前 2 営業日で約 6% 上昇した後の動きだ。金は一時 1 オンス 3500 ドルを割り込み、その後 3590 ドル前後まで戻した。COMEX 金先物は 0.74% 高の 3588.40 ドル、銀先物は 0.90% 高の 41.15 ドルで引けた。ドル指数は 103.7 近辺で横ばい、オフショア人民元は 6.6675。米 10 年債利回りは 4.858%、30 年債は 5.250%、2 年債は 4.646% となった。"}, "why": {"zh": "黄金「跌破 3500 又拉回」是这轮最诚实的信号——避险需求还在，但高位获利盘同样坚决，多空在 3500 这条线上打了一整天。油价则是纯粹的地缘溢价：供应并没有实质中断，涨的是「可能中断」的保险费。两者放在一起看，市场是在为一个「不会马上打大仗、但也不会马上太平」的中东定价。", "en": "Gold dipping below 3,500 and then recovering is the most honest signal in this market: haven demand is still there, but profit-taking at highs is just as determined, and the two sides fought over that line all day. Oil, by contrast, is pure geopolitical premium: supply has not actually been interrupted, what is rising is the insurance cost of a possible interruption. Together they price a Middle East that will neither go to full war nor settle down soon.", "es": "Que el oro perfore 3.500 y luego recupere es la señal más honesta: la demanda de refugio sigue ahí, pero la toma de beneficios en máximos es igual de firme, y ambos bandos se pelearon esa línea todo el día. El crudo, en cambio, es prima geopolítica pura: el suministro no se ha interrumpido de verdad, lo que sube es el seguro contra una posible interrupción. Juntos ponen precio a un Oriente Medio que no irá a una guerra total pero tampoco se calmará pronto.", "ja": "金が 3500 ドルを割ってから戻したのは、この相場で最も正直な信号だ。逃避需要は残っているが、高値での利益確定も同じくらい強い。どちらも 3500 ドルという線で一日中やり合った。原油は純粋な地政学プレミアムである。供給は実際には途絶えておらず、上がっているのは「途絶するかもしれない」保険料だ。両方を合わせると、市場は「すぐ全面戦争にはならないが、すぐには落ち着かない」中東に値をつけている。"}}, {"idx": "04", "title": {"zh": "韩国央行加息 25 个基点至 3.25%，上调明年增长预测", "en": "Bank of Korea raises rates 25bp to 3.25% and lifts next year's growth forecast", "es": "El Banco de Corea sube tipos 25 pb al 3,25% y mejora la previsión de crecimiento", "ja": "韓国銀行が 25bp 利上げし 3.25% に、来年の成長率見通しを上方修正"}, "body": {"zh": "韩国央行 11 月 26 日宣布上调基准利率 25 个基点至 3.25%，同时上调 2027 年经济增长预测。受此影响，韩国 3 年期国债收益率小幅上行。同日韩国综合股价指数收涨 0.29%，SK 海力士涨逾 2%，三星电子涨 0.35%。市场此前普遍预期本次会议将维持利率不变，加息决定与国内房价、家庭债务压力以及韩元汇率有关。", "en": "The Bank of Korea raised its policy rate by 25 basis points to 3.25% on 26 November and lifted its growth forecast for 2027. The three-year government bond yield edged higher. The Kospi still closed up 0.29%, with SK Hynix gaining more than 2% and Samsung Electronics 0.35%. Markets had largely expected a hold; the decision is linked to property prices, household debt and the won.", "es": "El Banco de Corea subió el 26 de noviembre su tasa de referencia 25 puntos básicos hasta el 3,25% y elevó su previsión de crecimiento para 2027. El rendimiento del bono a tres años subió ligeramente. El Kospi cerró aun así con un alza del 0,29%, con SK Hynix ganando más del 2% y Samsung Electronics un 0,35%. El mercado esperaba en general un mantenimiento; la decisión se relaciona con los precios inmobiliarios, el endeudamiento de los hogares y el won.", "ja": "韓国銀行は 11 月 26 日、政策金利を 25bp 引き上げて 3.25% とし、2027 年の成長率見通しを上方修正した。これを受けて 3 年物国債利回りは小幅に上昇した。韓国総合株価指数は 0.29% 高で引け、SK ハイニックスは 2% 超高、サムスン電子は 0.35% 高だった。市場は据え置きを広く予想していたが、今回の決定は住宅価格、家計債務、ウォン相場を意識したものとみられる。"}, "why": {"zh": "在美联储 12 月议息之前，韩国先动了一步——既是对国内房价与家庭债务的回应，也是在美元高位时守住利差。值得对照的是股市反应：加息落地而指数照涨，说明市场把它读成「经济够强才敢加息」。对出口型经济体，这是一个信号：亚洲的货币政策正在从「跟美联储」转向「看自己」。", "en": "Korea moved before the Fed's December meeting, responding to property prices and household debt while defending its rate differential with a strong dollar. The equity reaction is the interesting part: the index rose anyway, which means the market read the hike as a sign the economy is strong enough to absorb it. For export economies this is a signal that Asian monetary policy is shifting from following the Fed to watching itself.", "es": "Corea se movió antes de la reunión de la Fed en diciembre: responde a los precios inmobiliarios y al endeudamiento de los hogares y defiende su diferencial de tipos con un dólar fuerte. Lo interesante es la reacción bursátil: el índice subió igualmente, lo que indica que el mercado leyó la subida como señal de una economía con fuerza suficiente. Para las economías exportadoras es una señal de que la política monetaria asiática pasa de seguir a la Fed a mirarse a sí misma.", "ja": "FRB の 12 月会合を前に韓国が先に動いた。住宅価格と家計債務への対応であり、ドル高のなかで金利差を守る意味もある。注目すべきは株式市場の反応だ。利上げがあっても指数は上昇し、市場は「経済が強いから上げられる」と読んだ。輸出型経済にとってこれは、アジアの金融政策が「FRB に追随する」から「自国を見る」へ移りつつある信号である。"}}, {"idx": "05", "title": {"zh": "成品油价格下调，92 号汽油部分地区重返「7 元时代」", "en": "Pump prices cut as 92-octane returns to 7 yuan a litre in parts of China", "es": "Bajan los carburantes y la gasolina de 92 octanos vuelve a 7 yuanes en algunas zonas", "ja": "国内ガソリン価格を引き下げ、92 号は一部地域で「7 元時代」に"}, "body": {"zh": "国家发展改革委通知，自 11 月 26 日 24 时起，国内汽、柴油（标准品）价格每吨分别下调 440 元、425 元。折合成升价，全国柴油价格和部分地区 92 号汽油价格重返「7 元时代」。按现行成品油价格机制，调价窗口每 10 个工作日开启一次，本轮调价对应的国际油价均值低于上一轮。", "en": "China's development and reform commission said retail prices for gasoline and diesel would fall by 440 yuan and 425 yuan per tonne respectively from midnight on 26 November. Converted to pump prices, diesel nationwide and 92-octane gasoline in parts of the country returned to the 7 yuan a litre range. Under the current mechanism the pricing window opens every ten working days, and the average international crude price behind this adjustment was lower than in the previous cycle.", "es": "La comisión de desarrollo y reforma de China anunció una rebaja de 440 yuanes por tonelada en la gasolina y de 425 en el diésel desde la medianoche del 26 de noviembre. En precios de surtidor, el diésel en todo el país y la gasolina de 92 octanos en algunas zonas volvieron a la franja de 7 yuanes por litro. Con el mecanismo actual la ventana de ajuste se abre cada diez días hábiles y el precio medio internacional de referencia fue inferior al del ciclo anterior.", "ja": "国家発展改革委員会は、11 月 26 日 24 時から国内のガソリンと軽油（標準品）の小売価格を 1 トンあたりそれぞれ 440 元、425 元引き下げると通知した。1 リットル換算では、全国の軽油と一部地域の 92 号ガソリンが「7 元時代」に戻る。現行の価格機制では調整窓口は 10 営業日ごとに開き、今回の調整に対応する国際原油価格の平均は前回を下回った。"}, "why": {"zh": "440 元/吨的降幅不算小，折算到加满一箱油是几十块钱的差别——这类数字对宏观数据影响有限，但对「体感通胀」影响直接。更值得注意的是它和油价走势的错位：国际市场因中东局势在涨，国内零售价却在下调，原因是调价看的是前 10 个工作日的均价，机制天然滞后，地缘溢价要等下一轮窗口才会真正传导进来。", "en": "A 440 yuan per tonne cut is not trivial: at the pump it means tens of yuan on a full tank, which barely moves the macro data but moves the felt rate of inflation directly. More interesting is the mismatch with crude: international prices are rising on Middle East risk while Chinese retail prices fall, because the mechanism averages the previous ten working days and lags by design. The geopolitical premium only arrives at the next window.", "es": "Una rebaja de 440 yuanes por tonelada no es menor: en el surtidor supone decenas de yuanes por depósito, algo que apenas mueve los datos macro pero sí la inflación percibida. Más interesante es el desajuste con el crudo: el precio internacional sube por el riesgo en Oriente Medio mientras el minorista chino baja, porque el mecanismo promedia los diez días hábiles previos y llega tarde por diseño. La prima geopolítica solo entrará en la próxima ventana.", "ja": "1 トン 440 元の引き下げは小さくない。満タンで数十元の差になり、マクロ統計はほとんど動かないが、体感の物価には直接効く。興味深いのは原油とのずれだ。中東情勢で国際価格が上がる一方、中国の小売価格は下がる。調整は過去 10 営業日の平均を見る仕組みで、構造的に遅れるからだ。地政学プレミアムが反映されるのは次の窓口になる。"}}]}, {"key": "spo", "num": "04", "color": "#15803d", "deep": "#0f5f2e", "name": {"zh": "体育竞技", "en": "Sports", "es": "Deportes", "ja": "スポーツ"}, "items": [{"idx": "01", "title": {"zh": "U17 国足 8-0 大胜斐济，时隔 21 年再进世界杯淘汰赛", "en": "China's U17s thrash Fiji 8-0 to reach a World Cup knockout round after 21 years", "es": "China sub-17 golea 8-0 a Fiyi y vuelve a una fase final tras 21 años", "ja": "U17中国代表がフィジーに8-0、21年ぶりに世界大会決勝トーナメントへ"}, "body": {"zh": "11 月 26 日，U17 男足世界杯 H 组第三轮在卡塔尔多哈进行，中国队 8-0 大胜斐济：赵松源开场 3 分钟破门，邝兆镭两射一传并造点，万项两球并制造对手乌龙，张君豪头球建功，替补登场的梁仕宇打入最后一球。中国队小组赛 1 胜 1 平 1 负积 4 分、净胜球 +3，以 8 个成绩最好的小组第三之一晋级 32 强。这是中国队继 1985、2005 年之后队史第三次晋级世少赛淘汰赛，也是各级国字号男足时隔 21 年再次在世界大赛决赛圈赢球并小组出线。淘汰赛对手将在 28 日全部小组赛结束后按跨组排名确定。", "en": "China beat Fiji 8-0 in the final Group H match of the Under-17 World Cup in Doha on 26 November: Zhao Songyuan scored after three minutes, Kuang Zhaolei got two goals, an assist and a penalty, Wan Xiang scored twice and forced an own goal, Zhang Junhao headed in and substitute Liang Shiyu finished the scoring. China finished with four points from a win, a draw and a loss and a plus-three goal difference, going through among the eight best third-placed teams. It is the third time China has reached the knockout stage of this tournament after 1985 and 2005, and the first time in 21 years that a Chinese men's youth team has won a match and advanced from a group at a world finals. The opponent will be set after all groups finish on 28 November.", "es": "China goleó 8-0 a Fiyi en la última jornada del Grupo H del Mundial sub-17 en Doha el 26 de noviembre: Zhao Songyuan marcó a los tres minutos, Kuang Zhaolei logró dos goles, una asistencia y un penalti, Wan Xiang anotó dos veces y provocó un gol en propia puerta, Zhang Junhao marcó de cabeza y el suplente Liang Shiyu cerró la cuenta. China sumó cuatro puntos con una victoria, un empate y una derrota, con diferencia de +3, y avanzó entre los ocho mejores terceros. Es la tercera vez que China alcanza las eliminatorias de este torneo tras 1985 y 2005, y la primera en 21 años en que una selección masculina juvenil china gana un partido y supera una fase de grupos en un Mundial. El rival se definirá el 28 de noviembre.", "ja": "11 月 26 日、ドーハで行われた U17 ワールドカップ H 組最終戦で、中国はフィジーに 8-0 で大勝した。趙松源が開始 3 分で先制し、鄺兆鎬が 2 ゴール 1 アシストと PK 獲得、万項が 2 得点と相手のオウンゴールを誘発、張君豪がヘッドで決め、途中出場の梁仕宇が締めくくった。中国は 1 勝 1 分 1 敗の勝ち点 4、得失点差 +3 で、3 位グループ上位 8 チームに入り 32 強へ進んだ。1985 年、2005 年に続く 3 度目の決勝トーナメント進出であり、男子の年代別代表が世界大会の決勝圈で勝利しグループを突破するのは 21 年ぶりとなる。対戦相手は 28 日の全グループ終了後に決まる。"}, "why": {"zh": "8-0 的比分不是重点，重点是「必须赢、而且要赢得够多」这场球里，球队没有出现过去常见的保守——开场 3 分钟就压上，点球罚丢之后继续进攻。青年队的价值不在这一场的比分，而在「该赢的球能不能赢下来」这种能力有没有被建立起来。", "en": "The scoreline is not the point. The point is that in a match they had to win by a margin, this team did not slip into the caution that has often marked Chinese youth sides: they pressed from the third minute and kept attacking after missing a penalty. The value of a youth team is not one result but whether the ability to win the matches you must win has actually been built.", "es": "El marcador no es lo importante. Lo importante es que en un partido que había que ganar por diferencia, el equipo no cayó en la cautela que suele caracterizar a las selecciones juveniles chinas: presionó desde el minuto tres y siguió atacando tras fallar un penalti. El valor de una selección juvenil no es un resultado, sino si se ha construido la capacidad de ganar los partidos que hay que ganar.", "ja": "8-0 というスコアが要点ではない。勝ち点と得失点差が必要な一戦で、過去の中国の年代別代表にありがちだった慎重さに陥らず、3 分から押し上げ、PK を外した後も攻め続けたことだ。ユース代表の価値は 1 試合の結果ではなく、「勝たなければならない試合を勝ち切る力」が築けたかどうかにある。"}}, {"idx": "02", "title": {"zh": "英锦赛审判轮：丁俊晖 6-5 逆转，中国 9 人进正赛", "en": "Ding fights back 6-5 as nine Chinese players reach the UK Championship", "es": "Ding remonta 6-5 y nueve chinos entran al UK Championship", "ja": "英錦選考で丁俊暉が6-5の逆転勝ち、中国勢9人が本戦へ"}, "body": {"zh": "北京时间 11 月 27 日凌晨，2026 斯诺克英锦赛资格赛审判轮收官。丁俊晖在 2-4、3-5 落后、对手先拿赛点的情况下连追两局，决胜局抓住罗比·威廉姆斯留下的袋口球，单杆 79 分制胜，6-5 逆转晋级，保住自 2005 年首夺英锦赛冠军以来从未缺席正赛的纪录。袁思俊 6-4 淘汰 2023 年世锦赛冠军卢卡·布雷塞尔，职业生涯首次战胜对手；周跃龙在 2-4 落后时连赢四局，6-4 逆转丹尼尔·威尔斯。加上此前突围的张安达、范争一，以及种子选手赵心童、吴宜泽、肖国栋、常冰玉，中国共 9 人出战正赛，丁俊晖首轮对阵阿里·卡特。", "en": "The final round of UK Championship qualifying finished in the early hours of 27 November Beijing time. Ding Junhui, trailing 2-4 and then 3-5 with his opponent holding match points, won two frames in a row and then took the decider with a 79 break after Robbie Williams left a ball hanging in the pocket, completing a 6-5 comeback and preserving a record of never missing the main draw since winning the title in 2005. Yuan Sijun beat 2023 world champion Luca Brecel 6-4 for his first win over him, and Zhou Yuelong came from 2-4 down to beat Daniel Wells 6-4. With Zhang Anda and Fan Zhengyi, plus seeded Zhao Xintong, Wu Yize, Xiao Guodong and Chang Bingyu, nine Chinese players are in the main draw; Ding faces Ali Carter in round one.", "es": "La última ronda de la clasificación del UK Championship terminó en la madrugada del 27 de noviembre (hora de Pekín). Ding Junhui, que perdía 2-4 y luego 3-5 con puntos de partido en contra, ganó dos frames seguidos y se llevó el decisivo con una serie de 79 tras un error de Robbie Williams, firmando una remontada 6-5 y manteniendo su récord de no faltar nunca al cuadro principal desde que ganó el título en 2005. Yuan Sijun eliminó 6-4 al campeón mundial de 2023 Luca Brecel, su primera victoria ante él, y Zhou Yuelong remontó de 2-4 para vencer 6-4 a Daniel Wells. Con Zhang Anda, Fan Zhengyi y los cabezas de serie Zhao Xintong, Wu Yize, Xiao Guodong y Chang Bingyu, China tendrá nueve jugadores; Ding se enfrenta a Ali Carter.", "ja": "北京時間 11 月 27 日未明、英錦選考の最終ラウンドが終了した。丁俊暉は 2-4、3-5 とリードを許し相手にマッチポイントを握られながら 2 フレーム連取、決定戦ではロビー・ウィリアムズが残したポケット際の球を捉えて 79 のブレイクで制し、6-5 の逆転で本戦入りを決めた。2005 年の初優勝以来、本戦を一度も逃していない記録を守った。袁思俊は 2023 年世界王者ルカ・ブレチェルを 6-4 で破り、自身初勝利。周躍龍は 2-4 から 4 連取でダニエル・ウェルズに 6-4。張安達、范争一、シードの趙心童、呉宜沢、肖国棟、常冰玉を加え中国勢は 9 人。丁俊暉は 1 回戦でアリ・カーターと対戦する。"}, "why": {"zh": "三场都是逆转，而且都发生在「输一局就回家」的审判轮——这个赛制把心理素质的权重放到最大。丁俊晖这场的意义在于他终于把关键球打进了：决胜局那杆 79 分之前，他刚连续挽救两个赛点。9 人进正赛是中国斯诺克的新厚度，但正赛首轮就要内战（周跃龙对常冰玉），厚度也会变成消耗。", "en": "All three were comebacks, and all in a winner-takes-the-place qualifying round where a single lost frame ends your tournament, which puts a premium on nerve. For Ding the significance is that he finally potted the crucial ball: the 79 came right after saving two match points. Nine players in the main draw is new depth for Chinese snooker, though an all-Chinese first round between Zhou Yuelong and Chang Bingyu shows depth can also mean attrition.", "es": "Las tres fueron remontadas, y en una ronda decisiva donde perder un solo frame te elimina, lo que multiplica el peso de los nervios. Para Ding lo importante es que por fin metió la bola decisiva: la serie de 79 llegó justo después de salvar dos puntos de partido. Nueve jugadores en el cuadro principal es una profundidad nueva para el snooker chino, aunque un duelo chino en primera ronda, Zhou Yuelong contra Chang Bingyu, muestra que la profundidad también es desgaste.", "ja": "3 試合とも逆転で、しかも 1 フレーム落とせば終わる選考ラウンドだった。メンタルの比重が最大になる形式だ。丁俊暉にとって重要なのは、肝心の球をようやく決められたことにある。79 のブレイクは、2 つのマッチポイントをしのいだ直後だった。本戦に 9 人は中国スナックーの新たな厚みだが、1 回戦で周躍龍と常冰玉が当たるように、厚みは消耗にもなる。"}}, {"idx": "03", "title": {"zh": "欧冠第 5 轮：皇马 5 战全胜领跑，拜仁客场负里尔", "en": "Real Madrid stay perfect in Europe as Bayern lose at Lille", "es": "El Real Madrid sigue perfecto y el Bayern cae en Lille", "ja": "欧州CL第5節、レアルは全勝首位、バイエルンはリールに敗戦"}, "body": {"zh": "北京时间 11 月 26 日凌晨，欧冠联赛阶段第 5 轮 18 场全部结束。皇马主场 5-1 大胜埃因霍温，5 战全胜积 15 分独自领跑，是唯一保持全胜的球队；巴黎圣日耳曼 2-2 平罗马，四连胜终结，积 13 分列第二；利物浦客场 3-0 完胜布鲁日（伊萨克两球、维尔茨一球）升至第五；拜仁客场 1-2 负于里尔，于帕梅卡诺先拔头筹，上田绮世扳平、帕夫洛维奇乌龙送礼，拜仁遭遇本赛季欧冠首败、5 轮仅积 8 分排第 15；曼联客场 2-2 平葡萄牙体育，排名跌至第 19。联赛阶段还剩三轮，前八名直接晋级 16 强。", "en": "All 18 matches of the fifth round of the Champions League league phase finished in the early hours of 26 November Beijing time. Real Madrid thrashed PSV 5-1 at home to stay the only perfect side with 15 points from five games. Paris Saint-Germain drew 2-2 with Roma, ending a four-match winning run, and sit second on 13. Liverpool won 3-0 at Club Brugge with two goals from Isak and one from Wirtz to climb to fifth. Bayern lost 1-2 at Lille — Upamecano opened the scoring, Ueda equalised and Pavlovic scored an own goal — suffering their first European defeat of the season and sitting 15th on eight points. Manchester United drew 2-2 at Sporting and dropped to 19th. Three rounds remain; the top eight go straight to the last 16.", "es": "Los 18 partidos de la quinta jornada de la fase liga de la Champions terminaron en la madrugada del 26 de noviembre (hora de Pekín). El Real Madrid goleó 5-1 al PSV en casa y es el único equipo con pleno de victorias, 15 puntos en cinco partidos. El Paris Saint-Germain empató 2-2 con la Roma, cortando una racha de cuatro triunfos, y es segundo con 13. El Liverpool ganó 3-0 al Brujas con dos goles de Isak y uno de Wirtz y subió al quinto puesto. El Bayern perdió 1-2 en Lille —gol inicial de Upamecano, empate de Ueda y autogol de Pavlovic—, sufrió su primera derrota europea de la temporada y es decimoquinto con ocho puntos. El Manchester United empató 2-2 en Lisboa y bajó al puesto 19. Quedan tres jornadas y los ocho primeros pasan directo a octavos.", "ja": "北京時間 11 月 26 日未明、欧州チャンピオンズリーグのリーグフェーズ第 5 節 18 試合が終了した。レアル・マドリードはホームで PSV に 5-1 と大勝し、5 戦全勝の勝ち点 15 で単独首位。唯一の全勝チームとなった。パリ・サンジェルマンはローマと 2-2 で引き分け、4 連勝が止まり勝ち点 13 で 2 位。リバプールはブルージュに 3-0（イサク 2 得点、ヴィルツ 1 得点）で快勝し 5 位に浮上。バイエルンはリールに 1-2（ウパメカノ先制、上田綺世が同点、パヴロヴィッチのオウンゴール）で今季欧州初黒星、5 節で勝ち点 8 の 15 位。マンチェスター・ユナイテッドはスポルティングと 2-2 で 19 位に後退した。残り 3 節、上位 8 チームが 16 強に直行する。"}, "why": {"zh": "这一轮的看点不是皇马赢球，而是「强队的分层」：皇马 15 分、巴黎 13 分，拜仁 8 分、曼联 7 分——同样是豪门，处境已经分成两档。拜仁的失利尤其典型：控球 65%、射门占优，却输在一个乌龙球上，说明这赛季的欧冠对「效率」的惩罚比以往更狠。", "en": "The story is not Real Madrid winning but the stratification of the giants: 15 points for Madrid, 13 for Paris, against eight for Bayern and seven for United. Same stature, two different tiers. Bayern's defeat is the model case: 65% possession, more shots, beaten by an own goal, which shows this season's competition punishes inefficiency harder than before.", "es": "La noticia no es que gane el Real Madrid, sino la estratificación de los grandes: 15 puntos para el Madrid, 13 para el PSG, frente a ocho del Bayern y siete del United. El mismo cartel, dos niveles distintos. La derrota del Bayern es el caso típico: 65% de posesión, más remates, y pierde por un autogol, lo que indica que esta Champions castiga la falta de eficacia más que antes.", "ja": "焦点はレアルの勝利ではなく「強豪の階層化」にある。レアルが 15、パリが 13 に対し、バイエルンは 8、ユナイテッドは 7。同じ名門でも二つの層に分かれた。バイエルンの敗戦は典型例だ。65% のポゼッションと本数の優位を持ちながら、オウンゴールで落とした。今季の CL が「効率」への罰を以前より厳しくしていることを示す。"}}, {"idx": "04", "title": {"zh": "NBA：勇士 129-110 国王，文班 44+16 仍难救马刺", "en": "NBA: Warriors rout Kings as Wembanyama's 44-16 fails to save the Spurs", "es": "NBA: los Warriors aplastan a los Kings y el 44-16 de Wembanyama no salva a los Spurs", "ja": "NBA、ウォリアーズがキングスに快勝、44得点16リバウンドのウェンビーも及ばず"}, "body": {"zh": "北京时间 11 月 26 日，NBA 杯与常规赛多场进行：勇士 129-110 大胜国王，首节净胜 25 分，梅尔顿 14 投 8 中拿下 24 分 7 助攻，格林送出 11 次助攻；尼克斯 121-102 胜骑士；森林狼 113-106 胜雷霆，亚历山大空砍 32 分；火箭 116-104 胜太阳，申京拿下 23 分 11 篮板 11 助攻三双；灰熊 115-97 胜快船；开拓者 116-111 胜马刺，文班亚马 44 分 16 篮板仍难救主，阿夫迪亚 33 分 12 篮板 7 助攻；76 人 111-104 胜热火，以 15 胜 4 负居东部第一。", "en": "In NBA Cup and regular-season games on 26 November Beijing time, the Warriors beat the Kings 129-110 after winning the first quarter by 25 points, with Melton scoring 24 on 8-of-14 shooting plus seven assists and Green handing out 11 assists. The Knicks beat the Cavaliers 121-102, the Timberwolves beat the Thunder 113-106 despite 32 from Gilgeous-Alexander, the Rockets beat the Suns 116-104 behind Sengun's 23-11-11 triple-double, the Grizzlies beat the Clippers 115-97 and the Trail Blazers beat the Spurs 116-111 even though Wembanyama had 44 points and 16 rebounds, with Avdija adding 33-12-7. The 76ers beat the Heat 111-104 and lead the East at 15-4.", "es": "En la NBA Cup y la temporada regular del 26 de noviembre (hora de Pekín), los Warriors vencieron 129-110 a los Kings tras ganar el primer cuarto por 25 puntos, con 24 puntos de Melton (8 de 14) y siete asistencias, más 11 asistencias de Green. Los Knicks ganaron 121-102 a los Cavaliers; los Timberwolves 113-106 al Thunder pese a los 32 de Gilgeous-Alexander; los Rockets 116-104 a los Suns con un triple-doble de 23-11-11 de Sengun; los Grizzlies 115-97 a los Clippers; y los Trail Blazers 116-111 a los Spurs aunque Wembanyama firmó 44 puntos y 16 rebotes, con 33-12-7 de Avdija. Los 76ers ganaron 111-104 al Heat y lideran el Este con 15-4.", "ja": "北京時間 11 月 26 日、NBA カップとレギュラーシーズンの試合が行われた。ウォリアーズは第 1 クオーターで 25 点差をつけキングスに 129-110。メルトンが 14 本中 8 本成功で 24 得点 7 アシスト、グリーンは 11 アシスト。ニックスはキャバリアーズに 121-102、ティンバーウルブズはサンダーに 113-106（ギルジャス＝アレクサンダー 32 得点）、ロケッツはサンズに 116-104（シェングン 23 得点 11 リバウンド 11 アシストのトリプルダブル）、グリズリーズはクリッパーズに 115-97、トレイルブレイザーズはスパーズに 116-111（ウェンビー 44 得点 16 リバウンド、アブディヤ 33 得点 12 リバウンド 7 アシスト）。セブンティシクサーズはヒートに 111-104 で勝ち、15 勝 4 敗で東部首位。"}, "why": {"zh": "这场球值得看的是「没有超级得分手时怎么赢」——勇士用首节 25 分的强度把比赛提前打死，靠的是梅尔顿的持球和格林的串联，而不是某个人的爆发。另一边，文班 44+16 却输球，正好说明马刺现在的问题不在天赋，而在「最后五分钟谁来组织」。", "en": "The interesting question is how to win without a superstar scorer: Golden State killed the game early with a 25-point first quarter, built on Melton's ball handling and Green's passing rather than one man's explosion. At the other end, Wembanyama's 44 and 16 in a loss shows San Antonio's problem is not talent but who organises the last five minutes.", "es": "La pregunta interesante es cómo ganar sin un anotador superestrella: Golden State sentenció el partido con un primer cuarto de 25 puntos de ventaja, apoyado en la conducción de Melton y el pase de Green, no en la explosión de uno. Al otro lado, los 44 y 16 de Wembanyama en una derrota muestran que el problema de San Antonio no es el talento, sino quién organiza los últimos cinco minutos.", "ja": "面白いのは「超一流の得点源がいない時にどう勝つか」だ。ウォリアーズは第 1 クオーターで 25 点差をつけ試合を早々に決めた。メルトンのボール運びとグリーンのパスが土台で、誰かの爆発ではない。一方、44 得点 16 リバウンドを挙げながら敗れたスパーズは、問題が才能ではなく「最後の 5 分を誰が組み立てるか」にあることを示した。"}}, {"idx": "05", "tag": {"zh": "进展"}, "title": {"zh": "亚冠东亚区：日本两队零封取胜，海港 12 月 1 日客战浦项", "en": "AFC Champions League: Japanese sides win clean sheets, Port visit Pohang next", "es": "Champions de Asia: victorias japonesas sin goles y el Port visita Pohang", "ja": "AFCチャンピオンズリーグ、日本勢が無失点勝利、上海海港は浦項戦へ"}, "body": {"zh": "亚冠精英联赛东亚区第 5 轮，大阪钢巴 2-0 击败狮子港，鹿岛鹿角 3-0 完胜全北现代，两支日本球队本轮均以零封取胜。中超方面，上海海港此前主场 3-1 击败武里南联，5 轮 3 胜 1 平 1 负积 10 分升至东亚区第四，12 月 1 日将客场挑战浦项制铁；北京国安客场 2-3 不敌大田韩亚市民，遭遇客场两连败，出线形势被动。", "en": "In round five of the AFC Champions League Elite east zone, Gamba Osaka beat Port FC 2-0 and Kashima Antlers beat Jeonbuk Hyundai 3-0, both Japanese sides winning without conceding. In Chinese Super League colours, Shanghai Port had beaten Buriram United 3-1 at home to reach 10 points from five games and fourth place in the east zone; they travel to Pohang Steelers on 1 December. Beijing Guoan lost 2-3 at Daejeon Hana Citizen for a second straight away defeat, leaving their progress in doubt.", "es": "En la quinta jornada de la zona este de la Liga de Campeones Elite de la AFC, el Gamba Osaka venció 2-0 al Port FC y el Kashima Antlers 3-0 al Jeonbuk Hyundai, ambos equipos japoneses con portería a cero. Entre los clubes chinos, el Shanghai Port había ganado 3-1 al Buriram United en casa para sumar 10 puntos en cinco partidos y el cuarto puesto de la zona; el 1 de diciembre visita al Pohang Steelers. El Beijing Guoan perdió 2-3 en cas
