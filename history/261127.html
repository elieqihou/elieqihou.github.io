a del Daejeon Hana Citizen, su segunda derrota seguida como visitante, y complica su clasificación.", "ja": "AFC チャンピオンズリーグ・エリートの東地区第 5 節、ガンバ大阪はポート FC に 2-0、鹿島アントラーズは全北現代に 3-0 と、日本の 2 クラブがそろって無失点勝利を収めた。中国勢では上海海港がホームでブリーラム・ユナイテッドに 3-1 と勝ち、5 節で勝ち点 10 の東地区 4 位。12 月 1 日には浦項スティーラーズの敵地に乗り込む。北京国安は大田ハナシチズンに 2-3 で敗れ、アウェー 2 連敗で突破が厳しくなった。"}, "why": {"zh": "东亚区的格局在这一轮变得清晰：日本球队的稳定性（两队零封取胜）和中超球队的波动（海港主场强、客场弱）形成对比。海港 12 月 1 日客战浦项是出线的关键节点——按目前积分，客场拿到分数基本锁定晋级，输球则要看别人脸色。", "en": "The east zone took shape this round: Japanese consistency, with two clean-sheet wins, against Chinese volatility, where Port are strong at home and fragile away. The trip to Pohang on 1 December is the hinge: on current points, a draw or win would all but secure progress, while a defeat leaves them dependent on other results.", "es": "La zona este tomó forma en esta jornada: la consistencia japonesa, con dos victorias sin goles, frente a la irregularidad china, con un Port fuerte en casa y frágil fuera. La visita a Pohang del 1 de diciembre es la bisagra: con los puntos actuales, puntuar casi aseguraría el pase, y una derrota los dejaría pendientes de otros resultados.", "ja": "東地区の構図が今節で見えてきた。無失点勝利を重ねる日本勢の安定と、ホームに強くアウェーに弱い中国勢の波が対照的だ。12 月 1 日の浦項戦が分岐点になる。現状の勝ち点なら引き分け以上で突破がほぼ確定し、敗れれば他試合の結果待ちとなる。"}}]}, {"key": "hot", "num": "05", "color": "#6d28d9", "deep": "#54209f", "name": {"zh": "网络热点", "en": "Trending", "es": "Tendencias", "ja": "ネット話題"}, "items": [{"idx": "01", "title": {"zh": "武汉大学、安徽省教育厅同日通报：两人违规使用科研经费被免职", "en": "Two university officials removed over misuse of research funds", "es": "Dos cargos universitarios cesados por uso indebido de fondos de investigación", "ja": "研究費の不正使用で大学幹部2人を免職、武漢大学と安徽省教育庁が同日通報"}, "body": {"zh": "11 月 26 日，武汉大学与安徽省委教育工委同日通报针对武汉大学教师曾某某被实名举报的调查处理结果：曾某某在其牵头负责的科研项目中，将劳务费发给学生后部分收回、指定学生保管，用于课题组集体支出，违规使用科研经费属实，被给予党内严重警告处分、免去物理化学研究所副所长职务；付某在武汉大学工作期间存在同类型问题，被免去安徽大学党委常委、副校长职务。通报称，调查累计谈话 238 人次、调阅材料 523 份、交叉比对数据信息 10 万余条；对「逾越师生同事交往边界」「将实验室改建成私人空间」等举报，认定不能成立或与事实不符。", "en": "On 26 November Wuhan University and the Anhui provincial education authorities issued findings on a whistleblower complaint against a Wuhan University professor. Zeng was found to have paid allowances to students and then clawed part of the money back, entrusting students to hold it for group expenses — misuse of research funds — and was given a serious warning within the party and removed as deputy director of the physical chemistry institute. Fu, who had the same problem while at Wuhan University, was removed as party standing committee member and vice-president of Anhui University. The inquiry involved 238 interviews, 523 documents and cross-checks of more than 100,000 data entries; allegations about boundary-crossing relationships and a laboratory converted into private space were found unsupported or contrary to fact.", "es": "El 26 de noviembre, la Universidad de Wuhan y las autoridades educativas de Anhui publicaron las conclusiones sobre una denuncia contra una profesora de Wuhan. Se comprobó que Zeng pagó asignaciones a estudiantes y luego recuperó parte, dejándolas en manos de alumnos para gastos del grupo: uso indebido de fondos de investigación. Recibió una advertencia grave del partido y fue cesada como subdirectora del instituto de química física. Fu, con el mismo problema cuando trabajaba en Wuhan, fue cesado como miembro del comité del partido y vicerrector de la Universidad de Anhui. La investigación incluyó 238 entrevistas, 523 documentos y el cruce de más de 100.000 datos; las acusaciones sobre límites personales y un laboratorio convertido en espacio privado no se sostuvieron.", "ja": "11 月 26 日、武漢大学と安徽省の教育当局は、武漢大学の教員に対する実名告発の調査結果を同日に公表した。曾氏は自ら率いる研究プロジェクトで学生に劳务費を支給した後、一部を回収して学生に保管させ、研究室の集体支出に充てていた。研究費の不正使用が事実と認定され、党内严重警告処分と物理化学研究所副所長の解任となった。付氏も武漢大学在職中に同種の問題があり、安徽大学の党委員会常務委員・副学長を解任された。調査では延べ 238 人への聞き取り、資料 523 点の閲覧、10 万件余りのデータ照合を行い、交際の境界や研究室の私的転用といった告発は認定できない、または事実と異なるとした。"}, "why": {"zh": "这份通报的可读性在于它把「查了什么、怎么查、哪条成立、哪条不成立」逐项写清楚了——238 人次谈话、523 份材料、10 万余条数据，是近年高校举报通报里少见的细节密度。它也划出一条边界：科研经费里的「集体支出」惯例不等于合规，劳务费回收再分配是明确的红线。", "en": "What makes this notice readable is that it sets out what was investigated, how, which allegations held and which did not: 238 interviews, 523 documents, more than 100,000 records is unusual density for a university case. It also draws a line: the habit of pooling money for group expenses does not make it compliant, and clawing back student allowances is a clear red line.", "es": "Lo que hace legible este comunicado es que detalla qué se investigó, cómo, qué acusaciones se sostienen y cuáles no: 238 entrevistas, 523 documentos y más de 100.000 registros es una densidad poco habitual en un caso universitario. También traza un límite: la costumbre de reunir dinero para gastos del grupo no lo hace conforme, y recuperar asignaciones estudiantiles es una línea roja clara.", "ja": "この通報が読めるのは、何をどう調べ、どの告発が認められ、どれが認められなかったかを書き切っているからだ。238 人への聞き取り、資料 523 点、10 万件超のデータ照合は、大学の事案としては異例の密度である。同時に一線も引いた。集体支出という慣行は適法性を意味せず、学生への劳务費を回収して再配分するのは明確な紅線だ。"}}, {"idx": "02", "tag": {"zh": "进展"}, "title": {"zh": "可口可乐只标保质期不标生产日期？市场监管总局回应", "en": "Why some Coke bottles show only a use-by date: regulator explains", "es": "Por qué algunas botellas de Coca-Cola solo muestran la fecha de caducidad", "ja": "コカ・コーラに製造日表示がない理由、市場監督总局が説明"}, "body": {"zh": "针对部分可口可乐瓶身仅标注保质期到期日、未标注生产日期，市场监管总局食品生产经营司 11 月 26 日回应称，这并非企业在标签上遗漏信息，而是提前执行新的食品安全国家标准。此前该话题登上热搜，消费者担心看不到生产日期就无法判断产品新鲜度，也有人质疑是否存在标签违规。按现行规定，预包装食品应标注生产日期与保质期。", "en": "Responding to reports that some Coca-Cola bottles carry only a use-by date and no production date, the food division of the market regulation administration said on 26 November that this is not an omission but early implementation of a new national food safety standard. The topic trended beforehand, with consumers worried they cannot judge freshness without a production date and some asking whether the labels break the rules. Current rules require prepackaged food to carry both a production date and a shelf life.", "es": "Ante las informaciones de que algunas botellas de Coca-Cola solo llevan fecha de caducidad y no de producción, la división de alimentos de la administración de regulación del mercado dijo el 26 de noviembre que no es una omisión, sino la aplicación anticipada de una nueva norma nacional de seguridad alimentaria. El tema se volvió tendencia: los consumidores temen no poder juzgar la frescura sin fecha de producción y algunos se preguntan si la etiqueta incumple la normativa. Las reglas vigentes exigen ambas fechas en los alimentos envasados.", "ja": "一部のコカ・コーラのボトルに賞味期限のみが表示され製造日がないことについて、市場監督管理総局の食品生産経営司は 11 月 26 日、企業がラベル表示を省略したのではなく、新しい食品安全国家標準を前倒しで実行しているものだと説明した。この話題は以前からネットで話題になり、製造日が見えないと鮮度を判断できないという懸念や、表示違反ではないかという疑問が出ていた。現行規則では、包装食品に製造日と賞味期限の両方を表示することが求められている。"}, "why": {"zh": "这条回应解开的是「合规还是偷工」的疑问，但也暴露一个沟通问题：标准换了，货架上的说明没换，消费者只能靠热搜来理解标签。对食品企业，这类「提前执行新标准」的操作在过渡期最容易引发误解，提前在包装或渠道做解释，成本远低于一次舆情。", "en": "The answer settles whether this is compliance or corner-cutting, but it exposes a communication gap: the standard changed, the explanation on the shelf did not, so shoppers learned about their labels from a trending topic. For food companies, early adoption of a new standard is precisely the move most likely to be misread during a transition, and explaining it on pack or in store costs far less than a backlash.", "es": "La respuesta aclara si se trata de cumplimiento o de ahorro, pero revela un fallo de comunicación: cambió la norma, no la explicación en el lineal, y el consumidor se enteró por una tendencia. Para las empresas alimentarias, aplicar antes una norma nueva es justo lo que más se malinterpreta en la transición, y explicarlo en el envase o en la tienda cuesta mucho menos que una crisis.", "ja": "この回答は「適法か手抜きか」の疑問を解いたが、コミュニケーションの穴も露呈した。標準は変わったのに店頭の説明は変わらず、消費者はトレンドで初めて知ることになった。食品企業にとって新標準の前倒し適用は移行期に最も誤解されやすい施策であり、パッケージや店頭で先に説明する方が炎上よりはるかに安い。"}}, {"idx": "03", "title": {"zh": "国家卫健委给体检套餐「挤水分」：不得强制受检者接受项目", "en": "Health commission tells check-up providers to stop pushing add-on tests", "es": "Sanidad pide a los centros de chequeos que dejen de imponer pruebas adicionales", "ja": "健康診断の「過剰項目」に規制、受診者への強制を禁止"}, "body": {"zh": "11 月 26 日，国家卫生健康委办公厅发布通知，规范健康体检项目管理：健康体检机构不得提供明确禁止或无明确意义的检查检验项目，不得强制受检者接受体检项目，并加大对违法违规行为的整治力度。通知还要求优化体检场地布局与服务流程，规范出具并及时反馈体检报告，对异常结果明确标注和解释说明；探索实施体检结果风险程度分级管理制度，提出通俗易懂、有针对性的建议；同时推进「互联网 + 健康体检」。", "en": "The National Health Commission's general office issued a notice on 26 November tightening rules on health check-ups: providers may not offer tests that are explicitly prohibited or of no clear value, may not force examinees to accept items, and enforcement against violations will be strengthened. The notice also calls for better layout and service flow, standardised and timely reports with abnormal results clearly flagged and explained, a pilot risk-grading system for results with plain-language advice, and wider use of internet-based services.", "es": "La oficina general de la Comisión Nacional de Salud emitió el 26 de noviembre una circular que endurece las reglas de los chequeos médicos: los centros no podrán ofrecer pruebas prohibidas o sin valor claro, no podrán imponer estudios al examinado y se reforzará la vigilancia de infracciones. La norma pide además mejorar la disposición y los flujos de servicio, emitir informes normalizados y puntuales con los resultados anómalos señalados y explicados, ensayar un sistema de clasificación de riesgo con recomendaciones claras y ampliar los servicios digitales.", "ja": "11 月 26 日、国家衛生健康委員会弁公庁は健康診断の項目管理を規範化する通知を出した。健康診断機関は明確に禁止された項目や意義の不明な検査を提供してはならず、受診者に項目を強制してはならない。違法行為への取り締まりも強化する。通知はまた、会場配置とサービス動線の改善、報告書の適切な作成と速やかなフィードバック、異常結果の明示と説明、結果のリスク度に応じた段階管理の試行と分かりやすい助言、オンライン健康診断の推進も求めた。"}, "why": {"zh": "体检行业的痛点从来不是「查得少」，而是「查得多、看不懂、没人管」。这份通知三句话对应三个老问题：打包捆绑推销、报告只给箭头不给解释、异常结果无人随访。真正的考验在执行——套餐定价权在机构手里，「不强制」能不能落到收银台，要看各地卫健委的检查频次。", "en": "The pain point in health screening was never too few tests but too many, poorly explained and unmanaged. Three sentences in this notice answer three old problems: bundled upselling, reports that show arrows without explanations, and abnormal results nobody follows up. The test is enforcement: pricing sits with providers, so whether not forced reaches the cashier depends on how often local authorities inspect.", "es": "El problema de los chequeos nunca fue hacer pocas pruebas, sino demasiadas, mal explicadas y sin seguimiento. Tres frases de la circular responden a tres viejos problemas: la venta empaquetada, los informes con flechas sin explicación y los resultados anómalos sin seguimiento. La prueba está en la ejecución: el precio lo fija el centro, así que que «no se imponga» llegue al mostrador depende de la frecuencia de inspección local.", "ja": "健康診断の痛点は「検査が少ない」ことではなく、「多すぎて、分からず、誰も見ない」ことにある。通知の三つの文は三つの古い問題に対応する。セット販売、矢印だけで説明のない報告書、そして異常所見のフォローなしだ。試されるのは執行である。価格設定は機関側にあり、「強制しない」が受付に届くかは各地の衛生当局の検査頻度にかかっている。"}}, {"idx": "04", "title": {"zh": "美团、淘宝闪购全面取消超时扣款，18 家平台完成算法协商", "en": "Meituan and Taobao Flash now waive late-delivery penalties as 18 platforms finish algorithm talks", "es": "Meituan y Taobao Flash eliminan las multas por retraso y 18 plataformas cierran la negociación algorítmica", "ja": "美団と淘宝閃購が遅延ペナルティを全面廃止、18 社がアルゴリズム協議を完了"}, "body": {"zh": "全国总工会 2026 年第四季度新闻发布会 11 月 26 日介绍，截至 11 月 10 日，网络货运、网约车、网约配送、快递 4 个行业 18 家重点平台企业已全部完成劳动规则和算法协商并签订协议，覆盖新就业形态劳动者超过 2500 万人；其中美团和淘宝闪购已全面取消超时扣款处罚。同日，工会职工争议调解服务平台启用，在全国 31 个省（区、市）和新疆生产建设兵团总工会同步上线；平台试运行至 11 月 25 日，已受理劳动争议调解、法律援助案件 1080 件，为职工挽回经济损失 1832 万元。", "en": "The All-China Federation of Trade Unions said at its fourth-quarter briefing on 26 November that by 10 November, 18 major platform companies across freight, ride-hailing, delivery and courier services had completed consultations on labour rules and algorithms and signed agreements covering more than 25 million workers in new forms of employment. Meituan and Taobao Flash have fully scrapped late-delivery penalty deductions. A union mediation service for labour disputes also went live the same day across 31 provincial-level federations and the Xinjiang Production and Construction Corps; by 25 November it had handled 1,080 mediation and legal-aid cases and recovered 18.32 million yuan for workers.", "es": "La Federación de Sindicatos de China informó en su rueda de prensa del cuarto trimestre, el 26 de noviembre, de que al 10 de noviembre 18 grandes plataformas de transporte de carga, VTC, reparto y mensajería habían completado la negociación de reglas laborales y algoritmos y firmado acuerdos que cubren a más de 25 millones de trabajadores de nuevas formas de empleo. Meituan y Taobao Flash han eliminado por completo las multas por retraso. Ese mismo día entró en servicio una plataforma sindical de mediación de conflictos laborales en 31 federaciones provinciales y en el Cuerpo de Producción y Construcción de Xinjiang; hasta el 25 de noviembre había atendido 1.080 casos y recuperado 18,32 millones de yuanes para los trabajadores.", "ja": "全国総工会の 2026 年第 4 四半期記者会見で 11 月 26 日、11 月 10 日時点でトラック輸送、ライドシェア、デリバリー、宅配の 4 業種 18 社の主要プラットフォームが労働ルールとアルゴリズムの協議をすべて終え、協定を締結したと発表した。対象は新しい就業形態の労働者 2500 万人超。美団と淘宝閃購は遅延に対する減点・罰金処分を全面的に廃止した。同日、労働争議の調停サービスプラットフォームが 31 の省・自治区・直轄市と新疆生産建設兵団の総工会で稼働を開始し、11 月 25 日までの試行で調停と法律扶助の案件 1080 件を受け付け、労働者の損失 1832 万元を取り戻した。"}, "why": {"zh": "「取消超时扣款」是算法协商里最实在的一条——它改的不是口号，而是骑手在红灯前的那个决定。把 2500 万人纳入集体协商，本质上是给「平台定规则」加了一道程序；而调解平台 1080 件、1832 万元的试运行数据，说明争议已经进入可统计、可处理的通道。", "en": "Scrapping late penalties is the most concrete outcome of algorithm bargaining: it changes not a slogan but the decision a rider makes at a red light. Bringing 25 million people into collective consultation effectively adds a procedural step to platforms setting rules unilaterally, and 1,080 cases with 18.32 million yuan recovered shows disputes now flow through a channel that can be counted and handled.", "es": "Eliminar las multas por retraso es el resultado más concreto de la negociación algorítmica: no cambia un eslogan, cambia la decisión de un repartidor ante un semáforo en rojo. Incorporar a 25 millones de personas a la negociación colectiva añade un paso procedimental a la fijación unilateral de reglas, y los 1.080 casos con 18,32 millones recuperados muestran que los conflictos ya pasan por un canal contable y gestionable.", "ja": "遅延ペナルティの廃止はアルゴリズム協議で最も実のある成果だ。変わるのはスローガンではなく、配達員が赤信号の前で下す判断である。2500 万人を集団協議に組み入れることは、プラットフォームが一方的にルールを決める手続きに一段階を加えることを意味する。調停プラットフォームの 1080 件・1832 万元という試行データは、紛争が統計可能で処理可能な経路に入ったことを示す。"}}, {"idx": "05", "title": {"zh": "郑州胖东来暂未开业，周边商铺已被抢租；南阳一加油站公示进货价", "en": "Pang Dong Lai not yet open in Zhengzhou but nearby shops are already taken; a Nanyang petrol station posts its cost price", "es": "Pang Dong Lai aún no abre en Zhengzhou pero las tiendas cercanas ya están alquiladas; una gasolinera de Nanyang publica su precio de compra", "ja": "鄭州の胖東来は未開業ながら周辺店舗が埋まる、南陽の給油所は仕入れ値を公開"}, "body": {"zh": "郑州胖东来门店暂未开业，周边商铺已被抢先租下，成为当地商业热点。与此同时，河南南阳一处加油站因「学习胖东来」引发关注：站内公示当批次汽油、柴油的进货价格、运输费用、采购源头、每升成本与销售价格，并张贴对应批次的进货发票与油品检测报告，不设复杂宣传话术。当地媒体探访称，公示单与发票、检测报告一并张贴在站内显眼位置。", "en": "The Pang Dong Lai store in Zhengzhou has yet to open, but shops around it have already been snapped up, making the site a local commercial talking point. In Nanyang, Henan, a petrol station drew attention for copying the retailer's approach: it posts the purchase price, transport cost, source, per-litre cost and retail price for each batch of gasoline and diesel, along with the matching invoices and fuel test reports, without marketing language. Local reporters found the notices, invoices and reports displayed prominently on site.", "es": "La tienda de Pang Dong Lai en Zhengzhou aún no ha abierto, pero los locales cercanos ya están alquilados, lo que ha convertido la zona en un foco comercial. En Nanyang, Henan, una gasolinera llamó la atención por imitar al minorista: publica el precio de compra, el coste de transporte, el origen, el coste por litro y el precio de venta de cada lote de gasolina y diésel, junto con las facturas correspondientes y los informes de análisis del combustible, sin mensajes publicitarios. Los periodistas locales comprobaron que los avisos, facturas e informes están expuestos en un lugar visible.", "ja": "鄭州の胖東来はまだ開業していないが、周辺の店舗はすでに借り手がつき、地元の商業的な話題になっている。一方、河南省南陽市のある給油所は「胖東来に学ぶ」として注目を集めている。各バッチのガソリン・軽油の仕入れ値、輸送費、仕入れ先、1 リットルあたりのコストと販売価格を掲示し、対応する仕入れ請求書と油質検査報告書も貼り出している。複雑な宣伝文句はない。地元メディアの取材によれば、掲示物と請求書、検査報告書は目立つ位置に並べて貼られている。"}, "why": {"zh": "这两件事放在一起很有意思：一个是「流量溢出」——胖东来还没开门，先把周边租金抬起来；一个是「透明度模仿」——加油站把进货价贴出来，等于把「每升赚多少」交给顾客自己算。后者的示范意义更大：当一家企业把成本结构公开，同行要么跟进，要么解释为什么不跟进。", "en": "Together they tell a story: one is spillover, where a store that has not opened already lifts nearby rents; the other is imitation of transparency, where a station hands customers the arithmetic of its per-litre margin. The second matters more: once one player publishes its cost structure, competitors either follow or have to explain why they will not.", "es": "Juntas cuentan algo: una es desbordamiento, una tienda que aún no abre ya eleva los alquileres vecinos; la otra es imitación de la transparencia, una gasolinera que entrega al cliente la aritmética de su margen por litro. La segunda importa más: cuando uno publica su estructura de costes, los competidores o lo imitan o deben explicar por qué no.", "ja": "二つ並べると物語になる。一つは「波及」で、まだ開店していない店が周辺の家賃を押し上げている。もう一つは「透明性の模倣」で、給油所が 1 リットルあたりの粗利の計算を客に渡した。意味が大きいのは後者だ。一社がコスト構造を公開すれば、同業は追随するか、しない理由を説明するしかなくなる。"}}]}, {"key": "ent", "num": "06", "color": "#db2777", "deep": "#ad1a5c", "name": {"zh": "娱乐八卦", "en": "Entertainment", "es": "Espectáculos", "ja": "エンタメ"}, "items": [{"idx": "01", "title": {"zh": "2026 贺岁档 11 月 27 日开启，35 天超 50 部影片定档", "en": "Year-end season opens with more than 50 films across 35 days", "es": "La temporada de fin de año arranca con más de 50 películas en 35 días", "ja": "年末商戦が 11 月 27 日開幕、35 日間に 50 本超が公開へ"}, "body": {"zh": "2026 年电影贺岁档 11 月 27 日开启、12 月 31 日结束，共 35 天，截至目前已有超 50 部影片定档。开幕日《像风一样自由》与迪士尼动画《魔法秘境》同日上映；12 月 16 日《复仇者联盟 5：毁灭之日》上映，12 月 10 日在上海东方体育中心举办影迷盛典，免费门票放票即空；12 月 31 日《沙丘 3》收官，《沙丘》《沙丘 2》分别于 11 月 27 日、12 月 4 日重映，部分影院推出观影马拉松。国产片方面，《乌龙镇》《凤凰山下·词》11 月 28 日、《蔓延》12 月 4 日、《西游记之真假美猴王》与《请不走的门神》12 月 5 日陆续上映。", "en": "China's year-end film season runs from 27 November to 31 December, 35 days, with more than 50 titles dated so far. Opening day brings Like the Wind and Disney animation Magic Realm. Avengers: Doomsday opens on 16 December with a fan event at Shanghai's Oriental Sports Center on 10 December whose free tickets went instantly. Dune Part Three closes the season on 31 December, with the first two Dune films re-released on 27 November and 4 December and some cinemas running viewing marathons. Domestic titles include Wulong Town and Words at the Foot of Phoenix Mountain on 28 November, Spread on 4 December, and Journey to the West: The Real and Fake Monkey King plus The Door Gods Who Won't Leave on 5 December.", "es": "La temporada cinematográfica de fin de año en China va del 27 de noviembre al 31 de diciembre, 35 días, con más de 50 títulos ya fechados. El día inaugural llegan Like the Wind y la animación de Disney Magic Realm. Avengers: Doomsday se estrena el 16 de diciembre, con un evento de fans el 10 de diciembre en el Centro Deportivo Oriental de Shanghái cuyas entradas gratuitas se agotaron al instante. Dune Parte Tres cierra el 31 de diciembre, con reposiciones de las dos primeras el 27 de noviembre y el 4 de diciembre y maratones en algunas salas. Entre los títulos chinos: Wulong Town y Words at the Foot of Phoenix Mountain el 28 de noviembre, Spread el 4 de diciembre y Journey to the West: The Real and Fake Monkey King junto a The Door Gods Who Won't Leave el 5 de diciembre.", "ja": "2026 年の年末映画シーズンは 11 月 27 日から 12 月 31 日までの 35 日間で、これまでに 50 本超の公開が決まっている。初日は「像風一様自由」とディズニーアニメ「魔法秘境」が同時公開。12 月 16 日には「アベンジャーズ 5：ドゥームズデイ」が公開され、12 月 10 日には上海東方体育中心でファンイベントが開かれ、無料チケットは配布と同時に完売した。12 月 31 日は「デューン 3」が締めくくり、第 1 作と第 2 作は 11 月 27 日と 12 月 4 日に再上映され、一部の劇場では一挙上映も行われる。中国映画は「烏龍鎮」「鳳凰山下・詞」が 11 月 28 日、「蔓延」が 12 月 4 日、「西遊記之真假美猴王」と「請不走的神門」が 12 月 5 日公開。"}, "why": {"zh": "35 天塞进 50 多部片子，真正稀缺的是排片和注意力——进口续集占住 12 月 16 日和 31 日两个节点，国产片集中在中段靠口碑发酵。对观众，这是一年里最难挑片的一个月；对片方，首周口碑决定能不能活到跨年。", "en": "Fifty-plus films in 35 days means the scarce resources are screens and attention. Imported sequels occupy the 16 and 31 December anchors while domestic titles cluster in the middle and rely on word of mouth. For audiences this is the hardest month of the year to choose; for distributors, first-week reception decides whether a film survives to New Year.", "es": "Más de cincuenta películas en 35 días significa que lo escaso son las salas y la atención. Las secuelas importadas ocupan los anclajes del 16 y el 31 de diciembre, mientras los títulos chinos se concentran en el tramo medio y dependen del boca a boca. Para el público es el mes más difícil del año para elegir; para los distribuidores, la acogida de la primera semana decide si una película llega a Año Nuevo.", "ja": "35 日に 50 本超となれば、希少なのはスクリーンと注意力だ。輸入続編が 12 月 16 日と 31 日という二つの柱を押さえ、中国映画は中盤に集まって口コミに賭ける。観客にとっては一年で最も選びにくい一か月、配給側にとっては初週の評判が年を越せるかを決める。"}}, {"idx": "02", "title": {"zh": "《编个丈夫》定档 12 月 5 日，奥利维娅·科尔曼主演", "en": "Olivia Colman comedy The Wicker Husband set for 5 December in China", "es": "La comedia The Wicker Husband, con Olivia Colman, llega a China el 5 de diciembre", "ja": "オリヴィア・コールマン主演「編個丈夫」が 12 月 5 日に中国公開"}, "body": {"zh": "电影《编个丈夫》11 月 26 日正式定档 12 月 5 日，由埃莉诺·威尔逊与亚历克斯·休斯顿·费舍尔执导，奥利维娅·科尔曼、亚历山大·斯卡斯加德领衔主演，彼特·丁拉基、伊丽莎白·德比齐参演。影片讲述一位备受排挤的渔妇委托当地篮匠为她编织一个「丈夫」，柳条人出现后却意外引发嫉妒与动荡，打破村庄安宁。该片由美国黑熊影业出品，中国电影集团公司进口，中国电影产业集团股份有限公司发行、译制。同日，2026 法国新版《悲惨世界》确认 12 月 4 日全国上映。", "en": "The Wicker Husband was dated for 5 December in China on 26 November. Directed by Eleanor Wilson and Alex Houston Fischer, it stars Olivia Colman and Alexander Skarsgard with Peter Dinklage and Elizabeth Debicki. A shunned fisherwoman asks the village basket-weaver to make her a husband; when the wicker man appears he stirs jealousy and upheaval in the village. The film is produced by Black Bear Pictures, imported by China Film Group and released and dubbed by China Film Industry Group. A new French adaptation of Les Miserables was also confirmed for 4 December.", "es": "The Wicker Husband fijó su estreno en China para el 5 de diciembre, según el anuncio del 26 de noviembre. Dirigida por Eleanor Wilson y Alex Houston Fischer, cuenta con Olivia Colman y Alexander Skarsgard, junto a Peter Dinklage y Elizabeth Debicki. Una pescadora marginada pide al cestero del pueblo que le teja un marido; cuando el hombre de mimbre aparece, despierta celos y desorden en la aldea. La produce Black Bear Pictures, la importa China Film Group y la distribuye y dobla China Film Industry Group. También se confirmó para el 4 de diciembre una nueva versión francesa de Les Miserables.", "ja": "映画「編個丈夫」が 11 月 26 日、12 月 5 日の中国公開と正式に決定した。エレノア・ウィルソンとアレックス・ヒューストン・フィッシャーが監督し、オリヴィア・コールマン、アレクサンダー・スカルスガルドが主演、ピーター・ディンクレイジとエリザベス・デビッキが共演する。村で疎まれる漁婦が籠職人に「夫」を編むよう頼み、柳細工の男が現れると嫉妬と動揺が村を揺るがす物語。米ブラックベア・ピクチャーズ製作、中国電影集団が輸入し、中国電影産業集団が配給・吹替を担当する。同日、2026 年のフランス新版「レ・ミゼラブル」も 12 月 4 日の全国公開が確認された。"}, "why": {"zh": "贺岁档的进口片结构今年很特别：超级英雄和科幻续集拿走大档期，艺术向的《编个丈夫》《悲惨世界》放在中段——这是发行方对「口碑片」的定位，靠长线而不是首日。科尔曼这类演员在国内有稳定的文艺片受众，这类片子的票房天花板不高，但上座率往往更稳。", "en": "The import slate this season has an unusual shape: superhero and sci-fi sequels take the big dates while arthouse titles such as The Wicker Husband and Les Miserables sit in the middle, a positioning that bets on legs rather than opening day. Colman has a steady arthouse following in China; such films have a low ceiling but often hold their screens more firmly.", "es": "La oferta importada de esta temporada tiene una forma peculiar: las secuelas de superhéroes y ciencia ficción ocupan las grandes fechas, mientras títulos de autor como The Wicker Husband y Les Miserables se colocan en el tramo medio, una apuesta por la permanencia más que por el día del estreno. Colman tiene un público estable de cine de autor en China; esas películas tienen techo bajo pero suelen mantener mejor la sala.", "ja": "今季の輸入映画の構成は特異だ。ヒーローものと SF 続編が大きな档期を取り、アート系の「編個丈夫」「レ・ミゼラブル」は中盤に置かれた。初日ではなく長期の口コミに賭ける配給判断である。コールマンには中国でも安定したアート系ファンがおり、こうした作品は天井は低いが客席の維持率は高い。"}}, {"idx": "03", "title": {"zh": "「网友抵制王玉雯代言皮草」登娱乐热搜第一", "en": "Fur endorsement backlash tops China's entertainment trends", "es": "La polémica por un anuncio de pieles encabeza las tendencias de entretenimiento", "ja": "毛皮起用への抵制がエンタメ热搜1位に"}, "body": {"zh": "11 月 26 日，「网友抵制王玉雯代言皮草」登上微博娱乐热搜第一位。有网友发起抵制其皮草代言的呼吁，支持与反对的声音都不小，讨论集中在明星商业选择与动物保护立场之间。同日娱乐热搜还包括「厉娜被雪藏的那一年长这样」「田淼直播说徐若晗演戏不用心」「2026 电影贺岁档来了」「胡海泉辟谣炒股亏了近 1 个亿」「我叫金三顺时隔 21 年的售后」等。", "en": "A call to boycott Wang Yuwen's fur endorsement topped Weibo's entertainment trends on 26 November, with both support and opposition, and the debate centring on where a celebrity's commercial choices meet animal-welfare positions. Other trending items that day included a retrospective on singer Li Na's quiet years, actress Tian Miao saying in a livestream that Xu Ruohan acts without commitment, the year-end film season, Hu Haiquan denying he lost nearly 100 million yuan in stocks, and new content for My Lovely Sam Soon 21 years on.", "es": "Un llamamiento a boicotear el anuncio de pieles de Wang Yuwen encabezó las tendencias de entretenimiento de Weibo el 26 de noviembre, con apoyo y rechazo, y el debate se centró en dónde se cruzan las decisiones comerciales de una celebridad con las posiciones sobre bienestar animal. Otros temas del día fueron la retrospectiva sobre los años silenciosos de la cantante Li Na, la actriz Tian Miao diciendo en directo que Xu Ruohan actúa sin compromiso, la temporada de cine de fin de año, Hu Haiquan negando haber perdido casi 100 millones de yuanes en bolsa y nuevo contenido de My Lovely Sam Soon 21 años después.", "ja": "11 月 26 日、「王玉雯の毛皮起用に抵制を」という声が Weibo のエンタメ热搜 1 位になった。賛否両論があり、議論は芸能人の商業的選択と動物保護の立場がどこで交わるかに集中している。同日の热搜には、歌手・厲娜の露出が減った時期を振り返る話題、俳優の田淼が配信で徐若晗の演技を批判した件、年末映画シーズン、胡海泉が株で約 1 億元失ったとの噂を否定した件、「私の名前はキム・サムスン」21 年ぶりの新コンテンツなどが並んだ。"}, "why": {"zh": "这类争议的本质是消费价值观与明星商业价值的碰撞——代言是商业选择，抵制也是。值得注意的是它已经形成固定节奏：热搜起、品牌观望、工作室回应或不回应。对艺人团队，真正的风险不是这一波声音，而是品牌方在合约期内的态度。", "en": "At bottom this is a collision between consumer values and a celebrity's commercial value: endorsement is a business choice, and so is boycotting. The pattern is now standard — trend, brand silence, statement or no statement. For a talent team the real risk is not this wave of posts but where the brand stands for the rest of the contract.", "es": "En el fondo es un choque entre los valores del consumidor y el valor comercial de una celebridad: el anuncio es una decisión comercial y el boicot también. El patrón ya es fijo: tendencia, marca que guarda silencio, comunicado o silencio total. Para el equipo del artista el riesgo real no es esta ola de mensajes, sino la posición de la marca durante el resto del contrato.", "ja": "本質は消費者の価値観と芸能人の商業価値の衝突だ。起用は商業判断であり、抵制もまた判断である。すでに定型のリズムがある。热搜が立ち、ブランドが様子を見て、事務所が声明を出すか出さないか。芸能事務所にとって本当のリスクはこの一波ではなく、契約期間中にブランドがどう構えるかである。"}}, {"idx": "04", "title": {"zh": "胡海泉辟谣「炒股亏了近 1 个亿」", "en": "Hu Haiquan denies rumour he lost nearly 100 million yuan in stocks", "es": "Hu Haiquan niega haber perdido casi 100 millones de yuanes en bolsa", "ja": "胡海泉、株で約1億元の損失という噂を否定"}, "body": {"zh": "11 月 26 日，歌手胡海泉就「炒股亏了近 1 个亿」的传闻作出辟谣回应，相关话题登上微博热搜。此前网络流传其投资出现大额亏损的说法，涉及个人财务的具体数字真假难辨，此次为当事人出面否认。胡海泉此前以参与创投与文化产业投资为人熟知，其投资动向长期受到关注。", "en": "Singer Hu Haiquan denied a rumour on 26 November that he had lost nearly 100 million yuan in the stock market, and the topic trended on Weibo. Claims about large investment losses had been circulating, and figures about personal finances are hard to verify; this time the person concerned spoke himself. Hu is known for venture and cultural-industry investments, and his moves have long drawn attention.", "es": "El cantante Hu Haiquan desmintió el 26 de noviembre el rumor de que había perdido casi 100 millones de yuanes en bolsa, y el tema se volvió tendencia en Weibo. Circulaban versiones sobre grandes pérdidas de inversión y las cifras sobre finanzas personales son difíciles de verificar; en esta ocasión habló el propio interesado. Hu es conocido por sus inversiones en capital riesgo y en la industria cultural, y sus movimientos despiertan interés desde hace años.", "ja": "11 月 26 日、歌手の胡海泉が「株で約 1 億元の損失を出した」との噂を否定し、関連する話題が Weibo の热搜に入った。投資で多額の損失が出たという話が流れており、個人の資産に関する数字は真偽を確かめにくい。今回は本人が否定に動いた。胡海泉はベンチャーや文化産業への投資で知られ、その動向は以前から注目されている。"}, "why": {"zh": "明星的「投资传闻」之所以容易传播，是因为它同时满足两种想象：一是「明星也会亏」，二是「亏得比我还多」。这类消息的处理方式通常只有两种——不理，或者一次性说清；含糊回应反而会让数字继续长。", "en": "Investment rumours about celebrities travel because they satisfy two fantasies at once: that stars lose money too, and that they lose more than you do. There are only two ways to handle it — ignore it, or say everything at once; a vague answer lets the number keep growing.", "es": "Los rumores de inversión sobre famosos circulan porque satisfacen dos fantasías a la vez: que las estrellas también pierden y que pierden más que uno. Solo hay dos maneras de tratarlos: ignorarlos o decirlo todo de una vez; una respuesta vaga deja que la cifra siga creciendo.", "ja": "芸能人の投資にまつわる噂が広がるのは、「スターも損をする」「自分より多く損をしている」という二つの想像を同時に満たすからだ。対処は二つしかない。無視するか、一度で全部説明するか。曖昧な答えは数字を育てるだけである。"}}, {"idx": "05", "title": {"zh": "《我叫金三顺》时隔 21 年推出「售后」内容", "en": "My Lovely Sam Soon returns with new content 21 years on", "es": "My Lovely Sam Soon vuelve con contenido nuevo 21 años después", "ja": "「私の名前はキム・サムスン」21年ぶりの新コンテンツが話題"}, "body": {"zh": "11 月 26 日，「我叫金三顺时隔 21 年的售后」登上微博娱乐热搜。这部 2005 年播出的韩剧在 21 年后推出新的「售后」内容，勾起不少观众的回忆，讨论集中在演员现状与剧中名场面的重提。同日，「吴青峰张钧甯想上《后会友期》」也引发讨论，目前更多是嘉宾本人表达的意愿，是否成行仍待节目组官宣。", "en": "New content for My Lovely Sam Soon, the 2005 Korean drama, trended on Weibo on 26 November, 21 years after it aired, reviving memories and discussion of the cast today and the show's best-known scenes. Also trending was word that Wu Qingfeng and Janine Chang would like to appear on the variety show Hou Hui You Qi; so far that reflects the guests' own wishes, with any booking awaiting an official announcement.", "es": "El nuevo contenido de My Lovely Sam Soon, la serie coreana de 2005, se volvió tendencia en Weibo el 26 de noviembre, 21 años después de su emisión, reavivando recuerdos y debates sobre el elenco actual y las escenas más conocidas. También sonó que Wu Qingfeng y Janine Chang quieren participar en el programa Hou Hui You Qi; por ahora es solo el deseo de los invitados y falta el anuncio oficial.", "ja": "11 月 26 日、「私の名前はキム・サムスン」21 年ぶりの新コンテンツが Weibo のエンタメ热搜に入った。2005 年放送の韓国ドラマが 21 年を経て新たな内容を出し、出演者の現在や名場面が改めて話題になった。同日、吳青峰と張鈞寧が番組「後会友期」への出演を希望しているとの話も注目を集めたが、現時点では本人たちの意向であり、実現するかは番組側の発表待ちだ。"}, "why": {"zh": "老剧「售后」是这两年最稳的情绪生意——《请回答 1988》《武林外传》都试过。它不需要新故事，只需要把观众的记忆重新调出来；风险也在这里：一旦「售后」质量不行，伤的是原作的口碑。对平台，这是低成本高热度的内容；对观众，最好把它当成一次聚会，而不是续集。", "en": "Revivals are the most reliable sentiment business of recent years, tried with Reply 1988 and My Own Swordsman among others. They need no new story, only a trigger for memory, and that is also the risk: if the revival is poor, the original's reputation takes the damage. For platforms it is cheap, high-heat content; for viewers, better treated as a reunion than a sequel.", "es": "Los reencuentros son el negocio emocional más fiable de los últimos años, probado con Reply 1988 y My Own Swordsman. No necesitan una historia nueva, solo reactivar la memoria, y ahí está el riesgo: si el reencuentro es flojo, el daño recae en la reputación del original. Para las plataformas es contenido barato y caliente; para el público, conviene tomarlo como una reunión, no como una secuela.", "ja": "往年ドラマの「アフターサービス」はこの数年で最も堅い感情ビジネスだ。「応答せよ 1988」も「武林外伝」も試している。新しい物語は不要で、記憶を呼び戻せばいい。危うさもそこにある。内容が伴わなければ、傷つくのは原作の評価だ。配信側には低コスト高熱量のコンテンツであり、視聴者には続編ではなく同窓会として楽しむのがよい。"}}]}], "risk": {"zh": "风险提示：本简报仅作信息汇总，其中涉及的数据不构成任何投资建议。", "en": "Disclaimer: this briefing is a summary of information only; the data cited does not constitute investment advice.", "es": "Aviso: este boletín es solo un resumen informativo; los datos citados no constituyen asesoramiento de inversión.", "ja": "免責事項：このブリーフィングは情報の要約であり、記載のデータは投資助言を構成するものではありません。"}}/*__END__*/;

  /* ===== 语言检测：localStorage > 浏览器语言 > 系统时区 > 中文 ===== */
  function detectLang() {
    try { var s = localStorage.getItem("timab_lang"); if (s && LANGS.indexOf(s) >= 0) return s; } catch (e) {}
    var nav = (navigator.language || "").toLowerCase();
    if (/^zh/.test(nav)) return "zh";
    if (/^ja/.test(nav)) return "ja";
    if (/^es/.test(nav)) return "es";
    if (/^en/.test(nav)) return "en";
    var tz = "";
    try { tz = Intl.DateTimeFormat().resolvedOptions().timeZone || ""; } catch (e) {}
    if (/^Asia\/Tokyo/.test(tz)) return "ja";
    if (/Europe\/Madrid|America\/(Mexico_City|Bogota|Lima|Santiago|Caracas|Guatemala|La_Paz|San_Jose|Panama|Asuncion|Montevideo|Havana|El_Salvador|Managua|Tegucigalpa|Costa_Rica|San_Salvador)|America\/Argentina\//.test(tz)) return "es";
    if (/^(Europe|America|Australia)\//.test(tz)) return "en";
    return "zh";
  }

  var curLang = "zh";
  var langOpen = false;

  /* ===== 渲染 ===== */
  function renderChrome(lang) {
    var i18n = I18N[lang];
    document.documentElement.lang = LANG_HTML[lang];
    // 报头信息行
    var metaEl = document.getElementById("metaRow");
    if (metaEl) metaEl.textContent = T(BRIEFING.meta, lang);
    // 大日期
    var md = document.getElementById("mastDate");
    if (md) {
      var d = new Date(BRIEFING.date + "T00:00:00");
      md.innerHTML = fmtDate(d, lang) + "<small>" + esc(i18n.dateSub) + "</small>";
    }
    // 文档标题
    var siteName = (lang === "zh") ? "提马早报" : "TIMAB DAILY";
    document.title = siteName + " · " + fmtDate(new Date(BRIEFING.date + "T00:00:00"), lang);
    // 导航签
    var nav = document.getElementById("navChips");
    if (nav) {
      var order = ["pick"].concat(BRIEFING.sections.map(function (s) { return s.key; }));
      nav.innerHTML = "";
      order.forEach(function (key) {
        if (key === "pick") {
          var a = document.createElement("a");
          a.className = "chip-pick"; a.href = "#pick"; a.setAttribute("data-nav", "pick");
          a.textContent = T(BRIEFING.spotlight.badge, lang);
          nav.appendChild(a);
        } else {
          var sec = null;
          BRIEFING.sections.forEach(function (s) { if (s.key === key) sec = s; });
          if (!sec) return;
          var b = document.createElement("a");
          b.href = "#" + key; b.setAttribute("data-nav", key);
          b.style.borderColor = sec.color; b.style.color = sec.deep;
          b.textContent = T(sec.name, lang);
          nav.appendChild(b);
        }
      });
    }
    // 日历文案
    var cb = document.getElementById("calBtnText"); if (cb) cb.textContent = i18n.calBtn;
    var cw = document.getElementById("calWeek");
    if (cw) { cw.innerHTML = ""; i18n.calWeek.forEach(function (w) { var s = document.createElement("span"); s.textContent = w; cw.appendChild(s); }); }
    var cf = document.getElementById("calFoot"); if (cf) cf.textContent = i18n.calFoot;
    // 语言切换器（国旗触发 + 下拉）
    var ls = document.getElementById("langSwitch");
    if (ls) {
      ls.className = "lang-switch" + (langOpen ? " open" : "");
      ls.innerHTML = "";
      var trig = document.createElement("button");
      trig.type = "button"; trig.className = "lang-trigger"; trig.id = "langTrigger";
      trig.setAttribute("aria-haspopup", "true");
      trig.setAttribute("aria-expanded", langOpen ? "true" : "false");
      trig.innerHTML = flag(curLang) + '<span class="caret">▾</span>';
      trig.addEventListener("click", function (e) {
        e.stopPropagation();
        langOpen = !langOpen;
        ls.classList.toggle("open", langOpen);
        trig.setAttribute("aria-expanded", langOpen ? "true" : "false");
      });
      ls.appendChild(trig);
      var menu = document.createElement("div");
      menu.className = "lang-menu"; menu.setAttribute("role", "menu");
      LANGS.forEach(function (l) {
        var item = document.createElement("button");
        item.type = "button"; item.className = "lang-item" + (l === curLang ? " sel" : "");
        item.setAttribute("role", "menuitem"); item.setAttribute("data-lang", l);
        item.innerHTML = flag(l) + '<span class="lbl">' + LANG_LABEL_FULL[l] + "</span>";
        item.addEventListener("click", function (e) {
          e.stopPropagation();
          setLang(l);
        });
        menu.appendChild(item);
      });
      ls.appendChild(menu);
    }
  }

  function renderContent(lang) {
    var i18n = I18N[lang];
    var html = "";
    // 精选
    var sp = BRIEFING.spotlight;
    html += '<section class="spotlight" id="pick">'
      + '<div class="badge"><i></i>' + esc(T(sp.badge, lang)) + "</div>"
      + "<h2>" + titleHtml(sp.title, sp.hl, lang) + "</h2>"
      + '<div class="body">' + esc(T(sp.body, lang)) + "</div>"
      + '<div class="why"><b>' + esc(i18n.why) + "</b>" + esc(T(sp.why, lang)) + "</div>"
      + "</section>";
    // 分类
    html += '<div class="grid">';
    BRIEFING.sections.forEach(function (sec) {
      html += '<section class="card" id="' + sec.key + '" style="--ac:' + sec.color + "; --ac-deep:" + sec.deep + ';">'
        + '<div class="sec-head"><span class="sec-num">' + sec.num + "</span>"
        + "<h3>" + esc(T(sec.name, lang)) + "</h3>"
        + '<span class="en">' + sec.key.toUpperCase() + "</span></div>";
      (sec.items || []).forEach(function (it) {
        html += '<div class="item">';
        html += '<div class="t"><span class="idx">' + it.idx + "</span>";
        if (it.tag) html += '<span class="tag">' + esc(it.tag[lang] != null ? it.tag[lang] : i18n.tag) + "</span>";
        html += titleHtml(it.title, it.hl, lang) + "</div>";
        html += '<div class="d">' + esc(T(it.body, lang)) + "</div>";
        html += '<div class="why"><b>' + esc(i18n.why) + "</b>" + esc(T(it.why, lang)) + "</div>";
        html += "</div>";
      });
      html += "</section>";
    });
    html += "</div>";
    var content = document.getElementById("content");
    if (content) content.innerHTML = html;
    // 页脚
    var risk = document.getElementById("risk");
    if (risk) risk.textContent = T(BRIEFING.risk, lang);
  }

  function setLang(lang) {
    if (LANGS.indexOf(lang) < 0) lang = "zh";
    curLang = lang;
    langOpen = false;
    try { localStorage.setItem("timab_lang", lang); } catch (e) {}
    renderChrome(lang);
    renderContent(lang);
  }

  /* ===== 往期日历（保留原逻辑，文案随语言） ===== */
  function initCalendar() {
    var btn = document.getElementById("calBtn");
    var pop = document.getElementById("calPop");
    var grid = document.getElementById("calGrid");
    var title = document.getElementById("calTitle");
    if (!btn || !pop || !grid || !title) return;

    var parts = BRIEFING.date.split("-");
    var todayKey = parts[0].slice(2) + parts[1] + parts[2];
    var cur = { y: +parts[0], m: +parts[1] };
    var has = {};
    for (var i = 0; i < ARCHIVE_DATES.length; i++) { has[ARCHIVE_DATES[i]] = 1; }
    var HIST_BASE = /\/history\//.test(location.pathname) ? "./" : "history/";

    function ckey(y, m, d) { return String(y).slice(2) + pad(m) + pad(d); }

    function render() {
      var i18n = I18N[curLang];
      title.textContent = i18n.calTitle(cur.y, cur.m);
      grid.innerHTML = "";
      var start = new Date(cur.y, cur.m - 1, 1).getDay();
      var days = new Date(cur.y, cur.m, 0).getDate();
      for (var b = 0; b < start; b++) {
        var blank = document.createElement("span");
        blank.className = "cal-cell is-empty"; grid.appendChild(blank);
      }
      for (var d = 1; d <= days; d++) {
        var k = ckey(cur.y, cur.m, d);
        var cell = document.createElement("span");
        cell.className = "cal-cell" + (has[k] ? " has" : "") + (k === todayKey ? " is-today" : "");
        cell.textContent = d;
        if (has[k]) {
          cell.setAttribute("role", "link"); cell.setAttribute("tabindex", "0");
          cell.title = cur.y + "-" + pad(cur.m) + "-" + pad(d) + " 存档";
          (function (target) {
            var go = function () { window.open(HIST_BASE + target + ".html", "_blank", "noopener"); };
            cell.addEventListener("click", go);
            cell.addEventListener("keydown", function (e) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); go(); } });
          })(k);
        }
        grid.appendChild(cell);
      }
    }
    function toggle(open) {
      pop.hidden = !open;
      btn.setAttribute("aria-expanded", open ? "true" : "false");
      if (open) render();
    }
    btn.addEventListener("click", function (e) { e.stopPropagation(); toggle(pop.hidden); });
    document.getElementById("calPrev").addEventListener("click", function () { cur.m--; if (cur.m < 1) { cur.m = 12; cur.y--; } render(); });
    document.getElementById("calNext").addEventListener("click", function () { cur.m++; if (cur.m > 12) { cur.m = 1; cur.y++; } render(); });
    document.addEventListener("click", function (e) { if (!pop.hidden && !pop.contains(e.target)) toggle(false); });
    document.addEventListener("keydown", function (e) { if (e.key === "Escape" && !pop.hidden) toggle(false); });
  }

  /* ===== 启动 ===== */
  function boot() {
    curLang = detectLang();
    renderChrome(curLang);
    renderContent(curLang);
    initCalendar();
    // 关闭语言下拉：点击外部 / Esc
    document.addEventListener("click", function (e) {
      var ls = document.getElementById("langSwitch");
      if (ls && langOpen && !ls.contains(e.target)) {
        langOpen = false;
        ls.classList.remove("open");
        var t = document.getElementById("langTrigger");
        if (t) t.setAttribute("aria-expanded", "false");
      }
    });
    document.addEventListener("keydown", function (e) {
      if (e.key === "Escape" && langOpen) {
        langOpen = false;
        var ls = document.getElementById("langSwitch");
        if (ls) ls.classList.remove("open");
        var t = document.getElementById("langTrigger");
        if (t) t.setAttribute("aria-expanded", "false");
      }
    });
  }
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", boot);
  } else { boot(); }
})();
</script>
