ombre por costumbre. Un tema viral que enseña a millones a leer la etiqueta rinde más que diez inspecciones.", "ja": "この「名前遊び」が効くのは規制の隙間を突いているからだ。商品名は組成表示の規則に縛られず、消費者は習慣で名前から素材を判断する。何百万人に洗濯表示の見方を教える热搜 1 本は、抜き打ち検査 10 回より効率がよい。"}}, {"idx": "03", "title": {"zh": "「酸奶界的爱马仕」一年关掉 66 家店", "en": "The 'Hermès of yoghurt' closes 66 stores in a year", "es": "El «Hermès del yogur» cierra 66 tiendas en un año", "ja": "「ヨーグルト界のエルメス」が 1 年で 66 店閉鎖"}, "body": {"zh": "网红酸奶品牌 Blueglass 一年内门店数量净减 66 家，降幅约 31%。单杯定价接近 50 元的高溢价模式，在消费趋于理性的背景下正面临需求收缩。相关话题登上百度热点榜首。", "en": "Premium yoghurt brand Blueglass closed a net 66 stores over the past year, a decline of about 31%. Its high-price model — nearly 50 yuan a cup — is meeting weaker demand as consumption turns more rational. The topic topped Baidu's trending list.", "es": "La marca premium de yogur Blueglass redujo 66 locales netos en un año, cerca de un 31 %. Su modelo de precio alto —casi 50 yuanes por vaso— enfrenta una demanda menor en un consumo más racional. El tema encabezó las tendencias de Baidu.", "ja": "プレミアムヨーグルトブランド Blueglass は 1 年で 66 店舗純減、約 31％の減少となった。1 杯 50 元近い高価格モデルは、消費の合理化を背景に需要が縮んでいる。関連話題は百度の話題ランキング首位になった。"}, "why": {"zh": "50 元一杯的酸奶，卖的不是酸奶，是「我在善待自己」这个瞬间。当这个瞬间可以用 15 元的替代品满足时，溢价就失去了支点。网红餐饮的退潮通常不是慢慢发生的，而是某一天突然发现：隔壁新开的店，比你便宜一半还更好拍。", "en": "A 50-yuan yoghurt is not selling yoghurt; it sells the moment of treating yourself. Once a 15-yuan substitute delivers that moment, the premium loses its fulcrum. The retreat of viral food brands rarely happens gradually — one day the shop next door is half the price and photographs better.", "es": "Un yogur de 50 yuanes no vende yogur: vende el instante de consentirse. Cuando un sustituto de 15 yuanes entrega ese instante, la prima pierde su apoyo. La retirada de las marcas virales rara vez es gradual: un día la tienda de al lado cuesta la mitad y sale mejor en las fotos.", "ja": "50 元のヨーグルトが売っているのはヨーグルトではなく、「自分を大切にする瞬間」だ。15 元の代替品がその瞬間を提供できれば、プレミアムは支点を失う。流行る飲食ブランドの退潮はゆっくり起きるのではなく、ある日突然、隣の新店のほうが半額で写真映えもよいと気づく形で訪れる。"}}, {"idx": "04", "title": {"zh": "多地医院调整配置，部分院区停止接诊急诊", "en": "Hospitals in several cities stop taking emergencies at some campuses", "es": "Varios hospitales dejan de atender urgencias en algunas sedes", "ja": "複数の都市で病院が配置見直し、一部院区で救急受け入れ停止"}, "body": {"zh": "贵州、石家庄、郴州等地部分医院近期公告，将优化医疗资源配置，停止部分院区的急诊接诊，需求向主院区集中。院方口径是整合分散的急救力量、提升急危重症抢救能力；对周边居民而言，急诊资源的物理收缩改变了就医可及性与急救响应时间。相关话题登上微博热搜。", "en": "Hospitals in Guizhou, Shijiazhuang, Chenzhou and elsewhere have announced they will optimise resource allocation and stop receiving emergency patients at some campuses, concentrating demand at main sites. Administrators say the aim is to consolidate scattered emergency capacity and improve critical care; for nearby residents, the physical withdrawal of emergency services changes access and response times. The topic trended on Weibo.", "es": "Hospitales de Guizhou, Shijiazhuang, Chenzhou y otras ciudades anunciaron que optimizarán recursos y dejarán de atender urgencias en algunas sedes, concentrando la demanda en la principal. La dirección sostiene que busca consolidar capacidad dispersa y mejorar la atención crítica; para los vecinos, la retirada física de las urgencias cambia el acceso y los tiempos de respuesta. El tema fue tendencia en Weibo.", "ja": "貴州省、石家荘、郴州などの一部病院が、医療資源の最適化として一部院区での救急受け入れを停止し、需要を本院に集めると公告した。病院側は分散した救急体制を集約し、重症対応力を高めるためと説明する。周辺住民にとっては救急資源の物理的な縮小であり、受診のしやすさと応答時間が変わる。関連話題は Weibo の热搜に入った。"}, "why": {"zh": "「优化配置」在管理上说得通，在急救上却要算另一笔账：心梗和卒中的黄金救治时间以分钟计，急诊搬走 5 公里，可能就是另一套结局。资源整合该有配套——转运能力、社区首诊、急救地图，缺一环都会把成本转给患者。", "en": "Optimising allocation makes sense on a spreadsheet; emergency care runs a different ledger. Golden hours for heart attack and stroke are counted in minutes, and moving an ER five kilometres away can change outcomes. Consolidation needs companions — transfer capacity, community first contact, an emergency map — or the cost shifts to patients.", "es": "Optimizar recursos tiene sentido en un balance; las urgencias llevan otra contabilidad. La hora dorada del infarto y el ictus se mide en minutos, y mover urgencias cinco kilómetros puede cambiar el desenlace. La consolidación necesita acompañantes: traslados, primer contacto comunitario, un mapa de emergencias; sin ellos, el coste pasa al paciente.", "ja": "「配置の最適化」は管理の理屈では通るが、救急では別の勘定になる。心筋梗塞と脳卒中のゴールデンタイムは分単位で、救急が 5 キロ離れれば結末が変わりうる。統合には搬送力、地域のかかりつけ、救急マップという伴走者が要る。一つ欠ければコストは患者に移る。"}}, {"idx": "05", "title": {"zh": "「烤红薯香是加了香精」被指捕风捉影", "en": "'Roasted sweet potatoes are perfumed with additives' debunked", "es": "Desmienten que las batatas asadas lleven aromas artificiales", "ja": "「焼き芋の香りは香料」説は根拠薄いと専門家"}, "body": {"zh": "针对网络流传的「烤红薯特别香是加了香精」，专家辟谣指出，烤红薯的浓郁香味主要来自高温烤制时的美拉德反应，与香精无关。部分消费者因「闻着香吃着不算甜」产生疑虑，实为红薯品种与糖化程度的差异。此类以「可能」为起点的避雷帖，在传播中容易演变成对食品安全的普遍恐慌。", "en": "Responding to claims that the strong aroma of roasted sweet potatoes comes from added flavouring, specialists said the smell mainly results from the Maillard reaction during high-temperature roasting and has nothing to do with additives. Some shoppers puzzled that a sweet potato smells sweeter than it tastes are seeing differences between varieties and degrees of starch-to-sugar conversion. Warnings that begin with 'it might be' easily turn into broad anxiety about food safety.", "es": "Ante la versión de que el intenso aroma de las batatas asadas se debe a aromatizantes, los expertos señalaron que proviene principalmente de la reacción de Maillard durante el asado a alta temperatura y nada tiene que ver con aditivos. Que algunas se huelan más dulces de lo que saben se explica por la variedad y el grado de conversión del almidón en azúcar. Las advertencias que empiezan con «podría» acaban en alarma alimentaria general.", "ja": "「焼き芋の強い香りは香料によるもの」とのネット上の指摘に対し、専門家は、香りの主因は高温で焼く際のメイラード反応であり香料とは無関係だと説明した。「香りほど甘くない」と感じるのは品種と糖化の度合いの違いによるもの。「かもしれない」から始まる注意喚起は、拡散の中で食品安全への漠然とした不安に変わりやすい。"}, "why": {"zh": "辟谣最难的地方不是给出正确答案，而是解释「为什么听起来像真的」。美拉德反应这个知识点并不新，但它需要一个具体的场景才会被记住。对内容生产者来说，这类题材的价值在于：把常识重新讲一遍，本身就是公共服务。", "en": "The hard part of debunking is not supplying the right answer but explaining why the wrong one sounded plausible. The Maillard reaction is old knowledge, but it sticks only when attached to a concrete scene. For anyone producing content, restating the obvious is itself a public service.", "es": "Lo difícil de desmentir no es dar la respuesta correcta, sino explicar por qué el error sonaba creíble. La reacción de Maillard no es nueva, pero solo se recuerda cuando se ata a una escena concreta. Para quien produce contenido, volver a contar lo obvio es en sí un servicio público.", "ja": "否定するのが難しいのは正解を示すことではなく、「なぜ間違いが本当らしく聞こえるか」を説明することだ。メイラード反応は新しい知識ではないが、具体的な場面と結びついて初めて記憶に残る。当たり前を語り直すこと自体が公共サービスになる。"}}]}, {"key": "ent", "num": "06", "color": "#db2777", "deep": "#be185d", "name": {"zh": "娱乐八卦", "en": "Showbiz", "es": "Espectáculos", "ja": "エンタメ"}, "items": [{"idx": "01", "title": {"zh": "蒋欣李光洁从夫妻变叔嫂，《多喜一家人》央视一套开播", "en": "Jiang Xin and Li Guangjie go from spouses to in-laws in new CCTV drama", "es": "Jiang Xin y Li Guangjie pasan de esposos a cuñados en el nuevo drama de CCTV", "ja": "蒋欣と李光潔が夫婦から義理の叔嫂に、CCTV 新ドラマが放送開始"}, "body": {"zh": "11 月 16 日晚 8 点，梁冠华、蒋欣领衔的胶东家庭群像剧《多喜一家人》在央视一套黄金档开播，腾讯视频同步独播。故事围绕 2008 年胶东半岛一笔 1428 万元拆迁款展开，五兄妹的代际矛盾由此撕开，全程在青岛取景。蒋欣饰演大嫂闻佳音，李光洁饰演老二赛秀亮——两人上一次同框还是《小巷人家》里的夫妻，这次成了针锋相对的叔嫂。", "en": "A family drama set on the Jiaodong peninsula, starring Liang Guanhua and Jiang Xin, premiered in CCTV-1's prime slot at 8pm on 16 November and streams exclusively on Tencent Video. The plot turns on 14.28 million yuan of demolition compensation in 2008 that cracks open old fault lines among five siblings; it was shot entirely in Qingdao. Jiang Xin plays the eldest sister-in-law Wen Jiayin and Li Guangjie the second brother Sai Xiuliang — the pair last appeared together as a married couple in 'Romance in the Alley'.", "es": "El drama familiar «Una familia feliz», protagonizado por Liang Guanhua y Jiang Xin, se estrenó el 16 de noviembre a las 20:00 en el horario estelar de CCTV-1 y en exclusiva en Tencent Video. La trama gira en torno a 14,28 millones de yuanes de indemnización por derribo en 2008 que abren grietas entre cinco hermanos; se rodó íntegramente en Qingdao. Jiang Xin interpreta a la cuñada mayor Wen Jiayin y Li Guangjie al segundo hermano Sai Xiuliang, que en su anterior serie eran matrimonio.", "ja": "梁冠華と蒋欣が主演する家族ドラマ『多喜一家人』が 11 月 16 日午後 8 時、CCTV-1 のゴールデンタイムに始まり、Tencent Video でも独占配信された。2008 年の膠東半島で支払われた 1,428 万元の立ち退き補償をめぐり、5 人きょうだいの世代間対立が噴き出す物語で、全編を青島で撮影。蒋欣は長男の妻・聞佳音、李光潔は次男・賽秀亮を演じ、前作『小巷人家』では夫婦役だった 2 人が今回は義理の叔嫂となる。"}, "why": {"zh": "家庭剧的胜负手从来不是「撕得多狠」，而是「像不像」。1428 万这个数字选得准：它刚好够改变一个普通家庭的命运，又不够让所有人满意。观众看的不是剧情，是自己家饭桌上那些没说完的话。", "en": "Family dramas are decided not by how vicious the fights are but by how recognisable they feel. The 14.28 million figure is well chosen: enough to change an ordinary family's fate, not enough to satisfy everyone. Viewers are not watching plot; they are watching the unfinished sentences at their own dinner tables.", "es": "Los dramas familiares no se deciden por la dureza de las peleas sino por el reconocimiento. La cifra de 14,28 millones está bien elegida: basta para cambiar el destino de una familia y no alcanza para contentar a todos. El público no ve trama, ve las frases sin terminar de su propia mesa.", "ja": "家族ドラマの勝負は「どれだけ激しく撕るか」ではなく「どれだけリアルに見えるか」だ。1,428 万元という数字は絶妙で、普通の家の運命を変えるには足り、全員を満足させるには足りない。視聴者が見ているのは筋書きではなく、自分の食卓で言い終わらなかった言葉である。"}}, {"idx": "02", "title": {"zh": "总台首部精品短剧集《奇迹》开播，张颂文演《红树流年》", "en": "CCTV's first premium short-drama series 'Miracle' opens with Zhang Songwen", "es": "CCTV estrena «Milagro», su primera serie de microdramas, con Zhang Songwen", "ja": "CCTV 初の本格ショートドラマ『奇跡』開始、張頌文が出演"}, "body": {"zh": "中央广播电视总台首部精品短剧集《奇迹》11 月 16 日在 CCTV-8 下午档开播，共 24 集单元剧，主打「以小见大」的现实题材，试图跳出段子合集式的短剧逻辑。张颂文参演其中《红树流年》单元。同日，央视一套《多喜一家人》开播、《折月亮》迎来大结局，长剧与短剧在同一周正面相遇。", "en": "China Media Group's first premium short-drama collection, 'Miracle', began airing in CCTV-8's afternoon slot on 16 November: 24 standalone episodes with a realistic, small-story tone, an attempt to break away from the gag-compilation logic of short drama. Zhang Songwen appears in the episode 'Years of the Mangroves'. The same day saw CCTV-1's family drama premiere and the finale of 'Zhe Yue Liang', putting long and short formats head to head in one week.", "es": "La primera colección de microdramas de calidad de China Media Group, «Milagro», se estrenó el 16 de noviembre en la franja de tarde de CCTV-8: 24 episodios unitarios de tono realista que buscan romper la lógica de recopilación de sketches. Zhang Songwen participa en el episodio «Años de los manglares». Ese mismo día se estrenó el drama familiar de CCTV-1 y terminó «Zhe Yue Liang».", "ja": "中国中央広播電視総台の初となる本格ショートドラマ集『奇跡』が 11 月 16 日、CCTV-8 の午後に始まった。全 24 話の単元ドラマで、「小さく見て大きく描く」リアリズム路線を掲げ、ギャグ寄せ集め型のショートドラマから脱しようとしている。張頌文は「紅樹流年」の回に出演。同日、CCTV-1 の家族ドラマが始まり、『折月亮』が最終回を迎え、長編と短編が同じ週にぶつかった。"}, "why": {"zh": "总台下场做短剧，改的不是时长，是「谁来定义短剧」。过去两年这个赛道的关键词是「爽点密度」，现在多了一个变量：主流平台能不能用十几分钟讲完一个有分量的故事。如果成了，短剧就从流量生意变成内容品类。", "en": "When the national broadcaster enters short drama, what changes is not runtime but who defines the form. For two years the keyword in this lane was density of gratification; now there is another variable — whether a mainstream platform can tell a substantial story in fifteen minutes. If it works, short drama stops being a traffic business and becomes a content genre.", "es": "Cuando la radiotelevisión pública entra en el microdrama, lo que cambia no es la duración sino quién define el formato. Durante dos años la palabra clave fue la densidad de estímulos; ahora hay otra variable: si una plataforma generalista puede contar una historia con peso en quince minutos. Si funciona, el microdrama deja de ser negocio de tráfico y pasa a ser género.", "ja": "公共放送がショートドラマに参入して変わるのは尺ではなく、「誰がショートドラマを定義するか」だ。この 2 年、この領域のキーワードは「快感の密度」だったが、今はもう一つの変数がある。主流プラットフォームが十数分で重みのある物語を語れるか。成功すれば、ショートドラマはトラフィック事業からコンテンツのジャンルになる。"}}, {"idx": "03", "title": {"zh": "范丞丞一天官宣两部：新剧开机，综艺定档 11 月 21 日", "en": "Fan Chengcheng announces two projects in one day", "es": "Fan Chengcheng anuncia dos proyectos en un solo día", "ja": "范丞丞が 1 日に 2 作品を発表、新ドラマ撮影開始とバラエティ放送決定"}, "body": {"zh": "11 月 16 日，范丞丞一天内接连官宣两部作品：电视剧《璀璨之上》开机，陈畅执导，孙千、范丞丞领衔主演，金世佳、唐艺昕特别出演，腾讯视频独播；综艺《奔跑吧·风起大湾区》定档 11 月 21 日起每周六 20:30 在浙江卫视播出，常驻阵容包括李晨、郑恺、沙溢、白鹿、张真源、孟子义、李昀锐等。", "en": "On 16 November Fan Chengcheng announced two projects in a single day: shooting began on the drama 'Above the Brilliance', directed by Chen Chang and starring Sun Qian and Fan, with Jin Shijia and Tang Yixin in special appearances, for exclusive release on Tencent Video; and the variety show 'Keep Running: Greater Bay Area' was scheduled from 21 November, Saturdays at 20:30 on Zhejiang Satellite TV, with Li Chen, Zheng Kai, Sha Yi, Bai Lu, Zhang Zhenyuan, Meng Ziyi and Li Yunrui in the regular cast.", "es": "El 16 de noviembre Fan Chengcheng anunció dos proyectos en un día: el inicio de rodaje de la serie «Above the Brilliance», dirigida por Chen Chang y protagonizada por Sun Qian y Fan, con Jin Shijia y Tang Yixin como invitados, en exclusiva para Tencent Video; y el estreno del programa «Keep Running: Gran Área de la Bahía» desde el 21 de noviembre, sábados a las 20:30 en Zhejiang TV, con Li Chen, Zheng Kai, Sha Yi, Bai Lu, Zhang Zhenyuan, Meng Ziyi y Li Yunrui.", "ja": "11 月 16 日、范丞丞が 1 日のうちに 2 作品を発表した。ドラマ『璀璨之上』がクランクインし、陳暢監督、孫千と范丞丞が主演、金世佳と唐芸昕が特別出演、Tencent Video で独占配信。バラエティ『奔跑吧・風起大湾区』は 11 月 21 日から毎週土曜 20:30 に浙江衛視で放送され、レギュラーは李晨、鄭愷、沙溢、白鹿、張真源、孟子義、李昀鋭ら。"}, "why": {"zh": "上午开机、傍晚定档，一天两条赛道的官宣是当下艺人团队的标准动作：综艺保曝光，剧集攒作品。真正的考题在后面——两部作品的口碑会同时到账，观众不会因为「他很忙」而降低标准。", "en": "Shooting announcement in the morning, broadcast date in the evening: hitting two lanes in one day is standard practice now — variety for exposure, drama for body of work. The real test comes later, when both are judged at once; audiences do not lower the bar because someone is busy.", "es": "Rodaje por la mañana y fecha de estreno por la tarde: anunciar en dos frentes el mismo día es ya la norma, variedades para visibilidad y series para obra. La prueba llega después, cuando ambas se juzgan a la vez; el público no baja el listón porque alguien esté ocupado.", "ja": "午前にクランクイン、夕方に放送決定。1 日で二つの路線を発表するのは今の定石だ。バラエティで露出、ドラマで作品を積む。試されるのはその後で、二作品の評価は同時に届く。多忙だからといって観客の基準は下がらない。"}}, {"idx": "04", "title": {"zh": "69 岁赵本山进棚录音，正面打假「AI 赵本山」", "en": "At 69, Zhao Benshan records in studio to counter AI voice clones", "es": "Zhao Benshan, de 69 años, graba en estudio contra los clones de voz con IA", "ja": "69 歳の趙本山がスタジオ録音、「AI 趙本山」に対抗"}, "body": {"zh": "针对网络上出现的 AI 仿声内容，69 岁的赵本山进棚录制《慌啥子嘛》，花絮中逐句打磨唱腔。相关视频发布后被视为对 AI 深度伪造的正面回应，也被业内看作「用真声当凭证」的样本。此前，多起 AI 合成名人声音、形象带货的事件引发关注。", "en": "Responding to AI-cloned versions of his voice circulating online, 69-year-old Zhao Benshan went into a studio to record a song, honing each line of the vocal in behind-the-scenes footage. The video is being read as a direct answer to deepfakes and, in the industry, as a template for using one's real voice as proof. Several recent cases of AI-synthesised celebrity voices and likenesses being used to sell goods have drawn attention.", "es": "Ante las versiones clonadas de su voz que circulan en internet, Zhao Benshan, de 69 años, entró en un estudio para grabar un tema, puliendo cada frase en el metraje detrás de cámaras. El vídeo se lee como respuesta directa a los deepfakes y, en el sector, como modelo de usar la voz real como prueba. Varios casos de voces e imágenes de famosos sintetizadas con IA para vender productos han llamado la atención.", "ja": "ネット上に出回る自身の声の AI 複製に対し、69 歳の趙本山がスタジオに入り楽曲を録音、メイキング映像で一節ずつ歌い方を詰めた。この映像はディープフェイクへの正面からの回答と受け止められ、業界では「本物の声を証拠にする」事例とも見られている。著名人の声や姿を AI で合成して商品販売に使う事例が相次ぎ、注目を集めていた。"}, "why": {"zh": "对付 AI 仿声，最有效的办法可能不是打官司，而是「本人再唱一遍」。当一个 69 岁的演员用一条花絮证明「我还在」，它同时完成了两件事：辟谣，以及把「真实」变成可消费的内容。这大概是深度伪造时代最体面的反击。", "en": "The most effective answer to a voice clone may not be a lawsuit but the original performer singing again. When a 69-year-old actor uses a behind-the-scenes clip to prove he is still here, he does two things at once: debunks the fake and turns authenticity into content. It may be the most dignified counterattack available in the deepfake era.", "es": "La respuesta más eficaz a un clon de voz quizá no sea un juicio, sino que el original vuelva a cantar. Cuando un actor de 69 años usa un clip de rodaje para demostrar que sigue aquí, hace dos cosas: desmiente y convierte la autenticidad en contenido. Probablemente sea el contraataque más decoroso posible en la era del deepfake.", "ja": "声の複製への最も有効な対抗は訴訟ではなく、「本人がもう一度歌う」ことかもしれない。69 歳の俳優がメイキング映像で「まだここにいる」と示すとき、二つのことが同時に起きる。噂を否定し、「本物」を消費可能なコンテンツに変える。ディープフェイク時代で最も品位ある反撃だろう。"}}, {"idx": "05", "title": {"zh": "赵丽颖坐进金鸡创投评审席，85 后演员第一次", "en": "Zhao Liying joins the Golden Rooster project-market jury, a first for her generation", "es": "Zhao Liying se suma al jurado del mercado de proyectos del Golden Rooster", "ja": "趙麗穎が金鶏映画創投の審査員に、85 後世代として初"}, "body": {"zh": "第八届金鸡电影创投大会公布评审阵容，赵丽颖与导演黄建新、演员闫妮同坐主评审席，成为首位担任该位置主评审的 85 后演员。据现场报道，她全程听取项目陈述并给出具体建议。此前，赵丽颖起诉红果短剧等运营方 AI 换脸侵权的案件已于 11 月 10 日在北京门头沟法院云法庭开庭，尚未宣判。", "en": "The 8th Golden Rooster project market announced its jury, with Zhao Liying seated alongside director Huang Jianxin and actress Yan Ni on the main panel — the first actress of her generation to hold that position. Reports from the session said she listened to every pitch and gave specific notes. Separately, her lawsuit against the operators of Hongguo short drama over AI face-swapping opened at Beijing's Mentougou court via cloud hearing on 10 November and has yet to be ruled on.", "es": "El 8.º mercado de proyectos del Golden Rooster anunció su jurado: Zhao Liying se sienta con el director Huang Jianxin y la actriz Yan Ni en el panel principal, la primera actriz de su generación en ese puesto. Según crónicas del evento, escuchó todas las presentaciones y dio sugerencias concretas. Su demanda contra los operadores de la plataforma de microdramas Hongguo por intercambio de rostros con IA se celebró el 10 de noviembre en el juzgado de Mentougou, sin fallo aún.", "ja": "第 8 回金鶏映画創投大会の審査員が発表され、趙麗穎が黄建新監督、閻妮とともに主審査員席に就き、85 後世代として初の同職となる。現地報道によれば、全プロジェクトの説明を聞き具体的な助言を行った。彼女が紅果（Hongguo）の運営側を AI 顔入れ替えの権利侵害で訴えた件は 11 月 10 日、北京門頭溝法院のオンライン法廷で審理され、判決はまだ出ていない。"}, "why": {"zh": "创投评审席是个信号位：它意味着演员开始参与「项目从哪来」这一环，而不只是「演哪个角色」。对行业来说，这比任何一部爆款都更能说明 85 花的位置变化——从被选择，到参与选择。", "en": "A project-market jury seat is a signal position: it means an actor participates in where projects come from, not just which role to play. For the industry that says more about the standing of her generation than any single hit — from being chosen to helping choose.", "es": "Un asiento en el jurado de un mercado de proyectos es una posición simbólica: la actriz pasa a participar en el origen de los proyectos, no solo en qué papel interpretar. Para el sector dice más del lugar de su generación que cualquier éxito: de ser elegida a participar en elegir.", "ja": "創投の審査員席は象徴的な位置だ。俳優が「どの役を演じるか」ではなく「企画がどこから来るか」に関わることを意味する。業界にとっては、一つのヒット作よりも彼女の世代の位置の変化をよく示している。選ばれる側から、選ぶ側へ。"}}]}], "risk": {"zh": "风险提示：本简报仅作信息汇总，其中涉及的数据不构成任何投资建议。", "en": "Risk notice: this briefing is an information summary only; the data mentioned does not constitute investment advice.", "es": "Aviso de riesgo: este boletín solo resume información; los datos mencionados no constituyen asesoramiento financiero.", "ja": "リスク表示：本ブリーフィングは情報の要約であり、記載のデータは投資助言ではありません。"}}/*__END__*/;

          e.stopPropagation();
          setLang(l);
        });
        menu.appendChild(item);
      });
      ls.appendChild(menu);
    }
  }

  function renderContent(lang) {
    var i18n = I18N[lang];
    var html = "";
    // 精选
    var sp = BRIEFING.spotlight;
    html += '<section class="spotlight" id="pick">'
      + '<div class="badge"><i></i>' + esc(T(sp.badge, lang)) + "</div>"
      + "<h2>" + titleHtml(sp.title, sp.hl, lang) + "</h2>"
      + '<div class="body">' + esc(T(sp.body, lang)) + "</div>"
      + '<div class="why"><b>' + esc(i18n.why) + "</b>" + esc(T(sp.why, lang)) + "</div>"
      + "</section>";
    // 分类
    html += '<div class="grid">';
    BRIEFING.sections.forEach(function (sec) {
      html += '<section class="card" id="' + sec.key + '" style="--ac:' + sec.color + "; --ac-deep:" + sec.deep + ';">'
        + '<div class="sec-head"><span class="sec-num">' + sec.num + "</span>"
        + "<h3>" + esc(T(sec.name, lang)) + "</h3>"
        + '<span class="en">' + sec.key.toUpperCase() + "</span></div>";
      (sec.items || []).forEach(function (it) {
        html += '<div class="item">';
        html += '<div class="t"><span class="idx">' + it.idx + "</span>";
        if (it.tag) html += '<span class="tag">' + esc(it.tag[lang] != null ? it.tag[lang] : i18n.tag) + "</span>";
        html += titleHtml(it.title, it.hl, lang) + "</div>";
        html += '<div class="d">' + esc(T(it.body, lang)) + "</div>";
        html += '<div class="why"><b>' + esc(i18n.why) + "</b>" + esc(T(it.why, lang)) + "</div>";
        html += "</div>";
      });
      html += "</section>";
    });
    html += "</div>";
    var content = document.getElementById("content");
    if (content) content.innerHTML = html;
    // 页脚
    var risk = document.getElementById("risk");
    if (risk) risk.textContent = T(BRIEFING.risk, lang);
  }

  function setLang(lang) {
    if (LANGS.indexOf(lang) < 0) lang = "zh";
    curLang = lang;
    langOpen = false;
    try { localStorage.setItem("timab_lang", lang); } catch (e) {}
    renderChrome(lang);
    renderContent(lang);
  }

  /* ===== 往期日历（保留原逻辑，文案随语言） ===== */
  function initCalendar() {
    var btn = document.getElementById("calBtn");
    var pop = document.getElementById("calPop");
    var grid = document.getElementById("calGrid");
    var title = document.getElementById("calTitle");
    if (!btn || !pop || !grid || !title) return;

    var parts = BRIEFING.date.split("-");
    var todayKey = parts[0].slice(2) + parts[1] + parts[2];
    var cur = { y: +parts[0], m: +parts[1] };
    var has = {};
    for (var i = 0; i < ARCHIVE_DATES.length; i++) { has[ARCHIVE_DATES[i]] = 1; }
    var HIST_BASE = /\/history\//.test(location.pathname) ? "./" : "history/";

    function ckey(y, m, d) { return String(y).slice(2) + pad(m) + pad(d); }

    function render() {
      var i18n = I18N[curLang];
      title.textContent = i18n.calTitle(cur.y, cur.m);
      grid.innerHTML = "";
      var start = new Date(cur.y, cur.m - 1, 1).getDay();
      var days = new Date(cur.y, cur.m, 0).getDate();
      for (var b = 0; b < start; b++) {
        var blank = document.createElement("span");
        blank.className = "cal-cell is-empty"; grid.appendChild(blank);
      }
      for (var d = 1; d <= days; d++) {
        var k = ckey(cur.y, cur.m, d);
        var cell = document.createElement("span");
        cell.className = "cal-cell" + (has[k] ? " has" : "") + (k === todayKey ? " is-today" : "");
        cell.textContent = d;
        if (has[k]) {
          cell.setAttribute("role", "link"); cell.setAttribute("tabindex", "0");
          cell.title = cur.y + "-" + pad(cur.m) + "-" + pad(d) + " 存档";
          (function (target) {
            var go = function () { window.open(HIST_BASE + target + ".html", "_blank", "noopener"); };
            cell.addEventListener("click", go);
            cell.addEventListener("keydown", function (e) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); go(); } });
          })(k);
        }
        grid.appendChild(cell);
      }
    }
    function toggle(open) {
      pop.hidden = !open;
      btn.setAttribute("aria-expanded", open ? "true" : "false");
      if (open) render();
    }
    btn.addEventListener("click", function (e) { e.stopPropagation(); toggle(pop.hidden); });
    document.getElementById("calPrev").addEventListener("click", function () { cur.m--; if (cur.m < 1) { cur.m = 12; cur.y--; } render(); });
    document.getElementById("calNext").addEventListener("click", function () { cur.m++; if (cur.m > 12) { cur.m = 1; cur.y++; } render(); });
    document.addEventListener("click", function (e) { if (!pop.hidden && !pop.contains(e.target)) toggle(false); });
    document.addEventListener("keydown", function (e) { if (e.key === "Escape" && !pop.hidden) toggle(false); });
  }

  /* ===== 启动 ===== */
  function boot() {
    curLang = detectLang();
    renderChrome(curLang);
    renderContent(curLang);
    initCalendar();
    // 关闭语言下拉：点击外部 / Esc
    document.addEventListener("click", function (e) {
      var ls = document.getElementById("langSwitch");
      if (ls && langOpen && !ls.contains(e.target)) {
        langOpen = false;
        ls.classList.remove("open");
        var t = document.getElementById("langTrigger");
        if (t) t.setAttribute("aria-expanded", "false");
      }
    });
    document.addEventListener("keydown", function (e) {
      if (e.key === "Escape" && langOpen) {
        langOpen = false;
        var ls = document.getElementById("langSwitch");
        if (ls) ls.classList.remove("open");
        var t = document.getElementById("langTrigger");
        if (t) t.setAttribute("aria-expanded", "false");
      }
    });
  }
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", boot);
  } else { boot(); }
})();
</script>
