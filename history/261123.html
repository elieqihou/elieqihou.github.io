sa, el Saarbrucken de Fan Zhendong perdió 3-1 ante el Dusseldorf, con Fan cayendo 1-3 frente a Ionescu en su partido individual. El tema encabezó Weibo esa noche, con debate sobre cuánto conocen sus rivales su juego y sobre la adaptación a una liga extranjera; también se situó otro tema sobre lo bien que Franziska lee el juego de Fan. El Saarbrucken compite esta temporada en la Bundesliga y en la Champions League, y Fan había ganado la mayoría de sus partidos antes de esta derrota.", "ja": "ドイツ・卓球ブンデスリーガで、樊振東の所属するザールブリュッケンはデュッセルドルフに1-3で敗れ、樊振東はシングルスでイオネスクに1-3で屈した。この話題は当晚微博の総合1位となり、相手が彼の球筋を熟知している点や海外リーグへの適応が議論された。フランチスカが樊振東の球筋をよく知るという関連話題も同時にランクインした。ザールブリュッケンは今季ブンデスリーガとチャンピオンズリーグの二線作戦で、樊振東はこれまで多くの試合で高い勝率を保っていた。"}, "why": {"zh": "一场俱乐部联赛的失利能压过所有娱乐话题登上热搜第一，说明樊振东的「留洋」本身就是公共事件。真正有信息量的是输球方式——不是状态崩盘，而是被熟悉其球路的老对手针对。对国乒而言，这种「被研究」的经历，可能比在国内赢十场更有价值。", "en": "That a club-league defeat could outrank every entertainment topic on Weibo shows Fan's move abroad is itself a public event. The informative part is how he lost: not a collapse, but being targeted by an old rival who knows his patterns. For the national team, being studied like this may be worth more than ten easy wins at home.", "es": "Que una derrota de liga de clubes supere en Weibo a cualquier tema de entretenimiento demuestra que la salida al exterior de Fan es en sí un acontecimiento público. Lo informativo es cómo perdió: no un colapso, sino el acoso de un rival veterano que conoce sus patrones. Para la selección china, ser estudiado así puede valer más que diez victorias fáciles en casa.", "ja": "クラブリーグの1敗がエンタメ話題を抑えて微博1位になったこと自体、樊振東の海外挑戦が公共的な出来事であることを示す。情報量があるのは負け方だ。崩れたのではなく、彼の球筋を知る古敵に狙われた。代表チームにとって、こうして研究される経験は、国内で10勝するより価値があるかもしれない。"}}, {"idx": "05", "tag": {}, "title": {"zh": "郎平获国际排联最高荣誉「排球勋章」", "en": "Lang Ping receives volleyball's highest honour from the world federation", "es": "Lang Ping recibe la máxima distinción de la federación mundial de voleibol", "ja": "郎平氏に国際バレーボール連盟の最高栄誉「バレーボール勲章」"}, "body": {"zh": "国际排联近日宣布，将最高荣誉「排球勋章」授予中国排球名宿郎平，以表彰她对世界排球运动发展作出的贡献。郎平运动员时期是中国女排「五连冠」核心成员，转型教练后先后执教中国女排与美国女排，并于 2016 年率中国女排夺得里约奥运会冠军。她是世界排球史上少数以球员和教练身份都获得奥运金牌的人物。", "en": "The international volleyball federation has awarded its highest honour, the Volleyball Medal, to Chinese volleyball great Lang Ping for her contribution to the development of the sport worldwide. As a player she was a core member of China's five-time champion national team; as a coach she led both China and the United States and guided China to the Rio 2016 Olympic title. She is among the few figures in the sport's history to win Olympic gold both as a player and as a coach.", "es": "La federación internacional de voleibol ha concedido su máxima distinción, la Medalla del Voleibol, a la gran jugadora china Lang Ping por su contribución al desarrollo del deporte en el mundo. Como jugadora fue pieza central de la selección china que ganó cinco títulos consecutivos; como entrenadora dirigió a China y a Estados Unidos y llevó a China al oro en Río 2016. Es una de las pocas figuras de la historia de este deporte con oro olímpico como jugadora y como entrenadora.", "ja": "国際バレーボール連盟は、世界のバレーボール発展への貢献を称え、中国の名選手・郎平氏に最高栄誉「バレーボール勲章」を授与すると発表した。選手時代は中国女子代表の5連覇の中心メンバーであり、指導者に転じてからは中国と米国を率い、2016年には中国をリオ五輪優勝に導いた。選手と監督の両方で五輪金メダルを手にした、この競技史上まれな人物である。"}, "why": {"zh": "这个奖的分量在于它是「运动本身」的认可，而不是某一国的战绩表。郎平的独特之处，是她同时被两套排球体系接纳——中国女排的精神符号，和美国排球职业化的一部分。这种跨体系的信誉，在当下的国际体育环境里越来越稀缺。", "en": "The weight of this award is that it recognises the sport itself rather than one country's record. What makes Lang Ping singular is that two volleyball worlds accept her at once: she is a symbol of the Chinese women's team and part of the professionalisation of the American game. Cross-system credibility like that is increasingly rare in international sport.", "es": "El peso del premio está en que reconoce al deporte en sí, no el historial de un país. Lo singular de Lang Ping es que dos mundos del voleibol la aceptan a la vez: es símbolo del equipo femenino chino y parte de la profesionalización del juego estadounidense. Esa credibilidad transversal es cada vez más escasa en el deporte internacional.", "ja": "この賞の重みは、特定国の戦績ではなく「競技そのもの」への評価にある。郎平氏の特異さは、二つのバレーボール界に同時に受け入れられていることだ。中国女子代表の精神的象徴であり、米国バレーのプロ化の一部でもある。そうした越境的な信頼は、今の国際スポーツ環境でますます希少になっている。"}}]}, {"key": "hot", "num": "05", "color": "#6d28d9", "deep": "#54209f", "name": {"zh": "网络热点", "en": "Trending", "es": "Tendencias", "ja": "ネット話題"}, "items": [{"idx": "01", "tag": {}, "title": {"zh": "主播私闯果园直播，切开苹果扔地上，果农称糟蹋超一千斤", "en": "Streamer enters an orchard uninvited, cuts apples and drops them; grower says over half a tonne was ruined", "es": "Un streamer entra sin permiso en un manzanal, corta manzanas y las tira: el agricultor cifra en más de media tonelada el daño", "ja": "配信者が無断で果樹園に入り林檎を切って投げ捨て 農家は「1千斤以上を台無しに」"}, "body": {"zh": "近日，一名拥有百万粉丝的主播被果农指控未经许可进入果园直播，在镜头前切开苹果后随手扔在地上，果农称被糟蹋的果子超过一千斤。事发后涉事主播账号已设为私密、相关视频下架，其方面表示仅愿赔偿 6000 元。果农已报警，具体赔偿金额与法律责任有待调查认定。同类事件此前已多次出现，焦点集中在直播拍摄的边界与对他人财产的尊重。", "en": "A streamer with a million followers has been accused by a fruit grower of entering an orchard without permission to livestream, cutting apples open on camera and dropping them on the ground; the grower says more than 500 kilograms were ruined. The account has since been made private and the videos taken down, and the streamer's side offered only 6,000 yuan in compensation. The grower has reported the case to police, with the final compensation and legal liability pending investigation. Similar incidents have occurred repeatedly, focusing attention on the boundaries of livestream filming and respect for other people's property.", "es": "Un streamer con un millón de seguidores ha sido acusado por un fruticultor de entrar sin permiso en su manzanal para retransmitir en directo, cortar manzanas ante la cámara y tirarlas al suelo; el agricultor cifra en más de 500 kilos lo echado a perder. La cuenta se ha vuelto privada y los vídeos se han retirado, y el entorno del streamer ofreció solo 6.000 yuanes de compensación. El agricultor ha denunciado ante la policía y la indemnización y la responsabilidad legal quedan pendientes de investigación. Hechos similares se han repetido, centrando el debate en los límites de la grabación en directo y el respeto a la propiedad ajena.", "ja": "100万人のフォロワーを持つ配信者が、許可なく果樹園に入って配信し、カメラの前で林檎を切って地面に投げ捨てたとして農家から非難されている。農家は500キロ以上が台無しになったと主張する。配信者のアカウントは非公開化され、動画も削除された。賠償として提示されたのは6000元のみだという。農家は警察に届け出ており、賠償額と法的責任は調査を待つ。同種の事案は繰り返されており、配信撮影の境界と他人の財産への尊重が焦点となっている。"}, "why": {"zh": "这件事的传播点不是「一个主播没素质」，而是「流量可以把别人的果园当成布景」。一斤苹果的价钱可以算清，但「不打招呼就进园、拍完就走」这种行为成本长期为零，才是类似事件反复出现的原因。6000 元这个数字刺耳，是因为它把侵权折算成了拍摄成本。", "en": "The story is not that one streamer behaved badly, but that traffic can turn someone else's orchard into a backdrop. The price of a kilogram of apples can be calculated; what has long cost nothing is walking in without asking and leaving once filming is done — which is why these incidents recur. The 6,000 yuan figure stings because it converts an infringement into a production cost.", "es": "El tema no es que un streamer se portara mal, sino que el tráfico puede convertir el manzanal ajeno en un decorado. El precio del kilo de manzanas se puede calcular; lo que durante mucho tiempo no ha costado nada es entrar sin avisar e irse al terminar de grabar, y por eso estos casos se repiten. La cifra de 6.000 yuanes escuece porque convierte una vulneración en un coste de producción.", "ja": "論点は「配信者のマナー」ではなく、「再生数が他人の果樹園を背景にしてしまう」ことにある。林檎1キロの値段は計算できるが、断りもなく入り、撮り終えたら去るという行為のコストは長くゼロだった。だから同種の事案が繰り返される。6000元という数字が刺さるのは、権利侵害を撮影コストに換算してしまっているからだ。"}}, {"idx": "02", "tag": {}, "title": {"zh": "新版国际高血压指南：130-139/80-89 不再算「正常高值」", "en": "New global hypertension guidance: 130-139/80-89 is no longer near-normal", "es": "Nueva guía internacional de hipertensión: 130-139/80-89 ya no se considera casi normal", "ja": "高血圧の新国際ガイドライン 130-139/80-89は「正常高値」ではなくなる"}, "body": {"zh": "国际高血压学会发布新版指南，将血压 130-139／80-89 毫米汞柱的区间从「正常高值」重新定义为「血压升高」，意味着处于该区间的人群需要更早进行生活方式干预与临床评估，而不再被视为「接近正常」。新标准基于多项长期流行病学数据，目标是降低心血管事件的长期风险。国内专家提醒，单次测量不足以判定，应结合家庭自测与动态血压监测。", "en": "The International Society of Hypertension has issued new guidance reclassifying blood pressure of 130-139 over 80-89 mmHg from high-normal to elevated, meaning people in that range should receive earlier lifestyle intervention and clinical assessment rather than being treated as near-normal. The change rests on long-term epidemiological data and aims to lower lifetime cardiovascular risk. Chinese specialists caution that a single reading is not enough and that home monitoring and ambulatory measurement should be combined.", "es": "La Sociedad Internacional de Hipertensión ha publicado una nueva guía que reclasifica la presión arterial de 130-139 sobre 80-89 mmHg de normal-alta a elevada, lo que implica que las personas en ese rango necesitan intervención en el estilo de vida y evaluación clínica más tempranas, en lugar de considerarse casi normales. El cambio se basa en datos epidemiológicos de largo plazo y busca reducir el riesgo cardiovascular a lo largo de la vida. Los especialistas chinos advierten de que una sola medición no basta y que deben combinarse la automedición en casa y la monitorización ambulatoria.", "ja": "国際高血圧学会は新しいガイドラインを公表し、血圧130-139／80-89mmHgの範囲を「正常高値」から「血圧上昇」に再定義した。この範囲の人は「正常に近い」と見なされず、より早い生活習慣への介入と臨床評価が必要になる。変更は長期の疫学データに基づき、生涯の心血管リスクを下げることが目的だ。中国の専門家は、1回の測定では判定できず、家庭での自己測定と24時間血圧測定を組み合わせるべきだと注意を促している。"}, "why": {"zh": "把「正常高值」改叫「血压升高」，改的是词，动的是很多人的自我认知。这类标准下调通常会带来双重效应：早期干预的人变多，被「贴标签」焦虑的人也变多。真正有用的行动只有一条——先买个上臂式血压计，连续测一周，再决定要不要慌。", "en": "Renaming high-normal as elevated changes a word and, with it, how many people see themselves. Lowering a threshold usually cuts both ways: more early intervention, but also more anxiety about being labelled. The one genuinely useful step is to buy an upper-arm monitor, measure for a week, and then decide whether to worry.", "es": "Llamar elevada a lo que era normal-alta cambia una palabra y, con ella, la percepción de mucha gente sobre sí misma. Bajar un umbral suele tener doble efecto: más intervención temprana, pero también más ansiedad por la etiqueta. El único paso realmente útil es comprar un tensiómetro de brazo, medir durante una semana y luego decidir si hay que preocuparse.", "ja": "「正常高値」を「血圧上昇」と呼び替えることは、言葉を変え、多くの人の自己認識を動かす。基準の引き下げは両面あり、早期介入が増える一方で「レッテル」への不安も増える。本当に役立つ行動は一つだけだ。上腕式の血圧計を買い、1週間続けて測り、それから慌てるかどうかを決めればいい。"}}, {"idx": "03", "tag": {}, "title": {"zh": "特朗普连发 30 多张 APEC 照片，其中一张配文「GOAT」", "en": "Trump posts more than 30 APEC photos, one captioned GOAT", "es": "Trump publica más de 30 fotos del APEC, una con la leyenda GOAT", "ja": "トランプ氏がAPECの写真を30枚以上投稿 1枚には「GOAT」の文字"}, "body": {"zh": "从深圳返回美国后，美国总统特朗普在社交平台「真实社交」连续发布 30 多张 APEC 会议相关照片，内容包括中方在深圳机场为其举行的欢迎仪式、会议期间与其他领导人的合影等。其中一张照片配文「GOAT」，俄罗斯卫星通讯社称其意为「有史以来最伟大的」。相关话题在 22 日登上多个平台热榜，也为深圳 APEC 会议带来一轮额外曝光。", "en": "After returning to the United States from Shenzhen, President Trump posted more than 30 APEC-related photographs on Truth Social, including images of the welcome ceremony held for him at Shenzhen airport and group shots with other leaders during the summit. One carried the caption GOAT, which Sputnik described as meaning greatest of all time. The topic trended across several platforms on 22 November, giving the Shenzhen summit an extra round of exposure.", "es": "Tras regresar a Estados Unidos desde Shenzhen, el presidente Trump publicó más de 30 fotografías relacionadas con el APEC en Truth Social, entre ellas imágenes de la ceremonia de bienvenida en el aeropuerto de Shenzhen y fotos de grupo con otros líderes durante la cumbre. Una llevaba la leyenda GOAT, que Sputnik interpretó como el mejor de todos los tiempos. El tema se situó entre los más comentados en varias plataformas el 22 de noviembre y dio a la cumbre de Shenzhen una ronda extra de visibilidad.", "ja": "深圳から米国に戻ったトランプ大統領は、SNS「Truth Social」に APEC 関連の写真を30枚以上連続投稿した。深圳空港での歓迎式や、会議期間中の各国首脳との集合写真などが含まれる。1枚には「GOAT」の文字が添えられ、スプートニクは「史上最高」の意味だと伝えた。この話題は22日に複数のプラットフォームで上位に入り、深圳の APEC 会議にもう一段の露出をもたらした。"}, "why": {"zh": "这条新闻的有趣之处，是一位以「不可预测」著称的领导人，用最直白的方式给一次多边会议打了五星。对外交而言，30 张照片的实际信息量几乎为零，但传播效果很实在——它把「深圳」这两个字，塞进了美国社交媒体的时间线。", "en": "What is interesting is that a leader known for unpredictability gave a multilateral summit a five-star review in the most direct way possible. Diplomatically the 30 photos carry almost no information, but the effect is real: they put the word Shenzhen into American social media timelines.", "es": "Lo interesante es que un líder famoso por su imprevisibilidad diera a una cumbre multilateral cinco estrellas de la forma más directa. Diplomáticamente, las 30 fotos no aportan casi información, pero el efecto es real: meten la palabra Shenzhen en las líneas de tiempo estadounidenses.", "ja": "面白いのは、「予測不能」で知られる指導者が、最も直接的な方法で多国間会議に五つ星をつけたことだ。外交的な情報量はほぼゼロだが、効果は確かにある。Shenzhen という二文字を、米国の SNS のタイムラインに押し込んだのだ。"}}, {"idx": "04", "tag": {}, "title": {"zh": "山东一村推行「一日丧」：去世到安葬不超过 24 小时", "en": "A Shandong village tries one-day funerals: burial within 24 hours", "es": "Un pueblo de Shandong prueba funerales de un día: entierro en menos de 24 horas", "ja": "山東省の村が「一日葬」を導入 死去から埋葬まで24時間以内"}, "body": {"zh": "山东一地有村庄推行「一日丧」，即从去世到安葬不超过 24 小时，只提供大锅菜配馒头或米饭，不设流水席、不收份子钱。村委会表示该做法并非强制，主要目的是减轻村民在时间、精力和人情往来上的负担。相关话题登上热搜后，讨论集中在「移风易俗」与「尊重传统」之间如何取得平衡，也有网友担心过快办理会让亲属来不及告别。", "en": "A village in Shandong has introduced one-day funerals, with burial within 24 hours of death, offering only a simple meal of stewed dishes with bread or rice, no banquet and no cash gifts. The village committee says the practice is not compulsory and is meant to ease the burden of time, effort and social obligations on villagers. After the topic trended, debate focused on balancing changing customs with respect for tradition, and some netizens worried that moving too fast leaves relatives no time to say goodbye.", "es": "Un pueblo de Shandong ha implantado funerales de un día, con entierro en menos de 24 horas, ofreciendo solo un guiso sencillo con pan o arroz, sin banquete ni sobres de dinero. El comité de la aldea afirma que no es obligatorio y que busca aliviar la carga de tiempo, esfuerzo y compromisos sociales. Tras hacerse tendencia, el debate se centró en equilibrar el cambio de costumbres con el respeto a la tradición, y algunos usuarios temen que tanta prisa impida a los familiares despedirse.", "ja": "山東省のある村が「一日葬」を導入した。死去から埋葬まで24時間以内とし、料理は大鍋の煮物に饅頭か米飯のみ。流しの宴会も香典もなしという。村委員会は強制ではなく、村民の時間・労力・付き合いの負担を軽くするためだと説明する。話題がトレンド入りすると、「習俗の見直し」と「伝統の尊重」のバランスをめぐる議論が起き、急ぎすぎて別れの時間が持てないのではという懸念も出た。"}, "why": {"zh": "「一日丧」之所以引发共鸣，是因为它戳中了农村人情支出的真实痛点——一场丧事往往是一笔沉重开支。但丧葬改革最容易翻车的地方，恰恰是「效率」压过「情感」：24 小时能省下钱，却未必能让人好好告别。移风易俗的关键不在规定多严，而在有没有给悲伤留出空间。", "en": "One-day funerals resonate because they touch a real sore point in rural social spending: a funeral is often a heavy outlay. But the place where funeral reform most often fails is exactly where efficiency overrides feeling — 24 hours saves money without necessarily allowing a proper goodbye. The key to changing customs is not how strict the rules are but whether grief is given room.", "es": "Los funerales de un día conectan porque tocan un punto doloroso real del gasto social rural: un entierro suele ser un desembolso pesado. Pero donde la reforma funeraria suele fracasar es justo donde la eficiencia se impone al sentimiento: 24 horas ahorran dinero, no necesariamente permiten despedirse bien. La clave del cambio de costumbres no es la dureza de la norma, sino si se deja espacio al duelo.", "ja": "「一日葬」が共感を呼ぶのは、農村の付き合い支出という実際の痛みに触れるからだ。葬儀はしばしば重い出費になる。だが葬送改革が最も失敗しやすいのは、効率が感情を上回る瞬間である。24時間は金を節約できても、きちんと別れる時間を保証しない。習俗改革の鍵は規制の厳しさではなく、悲しみに余地を残すかどうかにある。"}}, {"idx": "05", "tag": {}, "title": {"zh": "黑龙江依安县一乡政府大院变集市：凌晨 4 点扫雪、摊位免费", "en": "A township government yard in Heilongjiang becomes a market: snow cleared at 4am, stalls free", "es": "El patio de un ayuntamiento de Heilongjiang se convierte en mercado: nieve retirada a las 4 y puestos gratis", "ja": "黒竜江省依安県の鄉政府の庭が市場に 午前4時から雪かき、出店は無料"}, "body": {"zh": "近日，黑龙江齐齐哈尔依安县新发乡把政府大院开放给乡亲赶集，凌晨 4 点开始清扫积雪、免费提供摊位，还供应热水并有民警值守。相关视频在网上传播后获得大量点赞。当地表示，冬季气温低、露天集市难办，开放院内场地是为了让摊贩和群众有个避风的地方。有网友打趣「上车要脱鞋吗」，也有人称这是「最实在的政务服务」。", "en": "The government compound of Xinfazhen township in Yi'an county, Qiqihar, Heilongjiang, has been opened to residents as a market: snow is cleared from 4am, stalls are free, hot water is provided and police are on duty. Videos of the scene drew widespread approval online. Local officials say open-air markets are hard to run in the winter cold, and the yard gives vendors and shoppers shelter. Some netizens joked about taking off their shoes before entering; others called it the most practical government service around.", "es": "El recinto del ayuntamiento del municipio de Xinfazhen, en el condado de Yi'an (Qiqihar, Heilongjiang), se ha abierto a los vecinos como mercado: la nieve se retira desde las 4 de la mañana, los puestos son gratuitos, hay agua caliente y agentes de servicio. Los vídeos difundidos en internet recibieron numerosos elogios. Las autoridades locales explican que con el frío invernal es difícil celebrar mercados al aire libre y que el patio da refugio a vendedores y compradores. Algunos usuarios bromearon preguntando si hay que quitarse los zapatos al entrar; otros lo llamaron el servicio público más tangible.", "ja": "黒竜江省チチハル市依安県新発郷は、鄉政府の庭を住民の市に開放した。午前4時から雪かきをし、出店は無料、お湯も提供し、警察官も配置された。映像がネットで拡散すると多くの称賛を集めた。地元は、冬は寒く露天の市が開きにくいため、庭を開放して出店者と住民に風をしのぐ場所を提供していると説明する。靴を脱ぐのかと冗談を言う声もあれば、これこそ最も実のある行政サービスだと評する声もあった。"}, "why": {"zh": "这类新闻之所以总能刷屏，是因为它提供了一种稀缺的治理样本：不新增预算、不发文件，只是把已有的空间让出来。它同时说明，基层创新的门槛有时低到只需要一句「进来吧」——难的是愿意开这个口。", "en": "Stories like this travel because they offer a rare model of governance: no new budget, no directive, just making existing space available. It also shows that the barrier to innovation at the grassroots can be as low as saying come in — the hard part is being willing to say it.", "es": "Estas noticias se viralizan porque ofrecen un modelo de gobernanza poco frecuente: sin presupuesto nuevo ni directrices, solo cediendo un espacio que ya existe. También muestra que la barrera para innovar en el ámbito local puede ser tan baja como decir «pasen»; lo difícil es querer decirlo.", "ja": "こうしたニュースが拡散されるのは、希少な統治の手本を示すからだ。予算を増やさず、通達も出さず、既にある空間を明け渡すだけ。同時に、現場の工夫の敷居は「入っていいよ」の一言ほど低いことも示す。難しいのは、その一言を口にする意思である。"}}]}, {"key": "ent", "num": "06", "color": "#db2777", "deep": "#ad1a5c", "name": {"zh": "娱乐八卦", "en": "Culture", "es": "Cultura", "ja": "エンタメ"}, "items": [{"idx": "01", "tag": {}, "title": {"zh": "第 46 届华鼎奖揭晓：朱一龙、赵丽颖获华语视帝视后", "en": "Huading Awards: Zhu Yilong and Zhao Liying take the Chinese acting honours", "es": "Premios Huading: Zhu Yilong y Zhao Liying se llevan los galardones de interpretación china", "ja": "第46回華鼎賞 朱一龍と趙麗穎が中国語作品の主演男優・女優賞"}, "body": {"zh": "11 月 22 日，第 46 届华鼎奖获奖名单公布。朱一龙获华语最佳影视男演员，赵丽颖获华语最佳影视女演员，两人曾因《知否知否应是绿肥红瘦》合作，此次同台领奖使相关话题登上热搜。全球单元方面，巴西演员瓦格纳·马拉获最佳影视男演员，爱尔兰演员杰西·巴克利获最佳影视女演员，克里斯托弗·诺兰获最佳导演，安东尼·霍普金斯获终身公益成就奖，越剧演员陈丽君获最佳戏剧戏曲和曲艺艺术家。同日，赵丽颖还入选 2026 亚太最具影响力青年女性 TOP100。", "en": "The 46th Huading Awards were announced on 22 November. Zhu Yilong won best Chinese actor and Zhao Liying best Chinese actress; the two previously worked together on The Story of Minglan, and their shared stage sent the topic trending. In the global categories, Brazil's Wagner Moura took best actor, Ireland's Jessie Buckley best actress, Christopher Nolan best director, Anthony Hopkins a lifetime achievement award for public welfare, and Yue opera performer Chen Lijun best artist in traditional theatre. Zhao Liying was also named to a 2026 list of the 100 most influential young women in Asia-Pacific the same day.", "es": "El 22 de noviembre se anunciaron los premios Huading. Zhu Yilong ganó mejor actor chino y Zhao Liying mejor actriz china; ambos coincidieron antes en la serie The Story of Minglan y su encuentro en el escenario hizo tendencia el tema. En las categorías globales, el brasileño Wagner Moura se llevó el premio a mejor actor, la irlandesa Jessie Buckley el de mejor actriz, Christopher Nolan el de mejor director, Anthony Hopkins un galardón a la trayectoria por labor social y la intérprete de ópera Yue Chen Lijun el de mejor artista de teatro tradicional. Ese mismo día, Zhao Liying fue incluida en una lista de 2026 de las 100 mujeres jóvenes más influyentes de Asia-Pacífico.", "ja": "11月22日、第46回華鼎賞の受賞者が発表された。朱一龍が中国語作品の最優秀男優賞、趙麗穎が最優秀女優賞を受賞。二人は『明蘭〜才媛の春〜』で共演しており、同じ舞台に立ったことが話題となった。グローバル部門では、ブラジルのワグネル・モウラが最優秀男優賞、アイルランドのジェシー・バックリーが最優秀女優賞、クリストファー・ノーランが最優秀監督賞、アンソニー・ホプキンスが社会貢献の功労賞、越劇の陳麗君が伝統演劇部門の最優秀芸術家賞を受けた。同日、趙麗穎は2026年アジア太平洋の若手女性影響力 TOP100 にも選ばれた。"}, "why": {"zh": "赵丽颖这一晚拿到的不只是视后，而是「转型完成」的公开认证——《幸福到万家》《风吹半夏》把她从古装偶像推到了现实题材。华鼎奖的评语把公益与市场口碑写进考评，也透露出国内影视奖项正在寻找一种「既看演技也看公众形象」的新标准。", "en": "What Zhao Liying collected that night was not just a trophy but public certification that her reinvention is complete: roles in The Story of Xingfu and Wind Blows from Longxi moved her from costume drama idol to realist drama. The citation folded public welfare and market reputation into the assessment, hinting that domestic awards are hunting for a standard that weighs both craft and public image.", "es": "Esa noche Zhao Liying no se llevó solo un premio, sino la certificación pública de que su reinvención está completa: sus papeles en The Story of Xingfu y Wind Blows from Longxi la llevaron del ídolo de época al drama realista. El acta incorporó la labor social y la reputación de mercado, lo que sugiere que los premios chinos buscan un criterio que pese tanto el oficio como la imagen pública.", "ja": "趙麗穎がその夜得たのは賞だけではなく、「転換完了」の公的な証明だった。『幸福到万家』『風吹半夏』で古装アイドルからリアリズム作品へと軸を移した。華鼎賞が社会貢献と市場の評判を評価に組み込んだことは、国内の映像賞が「演技も公共イメージも見る」新たな基準を探っていることをうかがわせる。"}}, {"idx": "02", "tag": {}, "title": {"zh": "央视主持人杨帆录节目烤瓷门牙被粘掉，全员「满地找牙」上热搜", "en": "CCTV host loses a porcelain tooth filming in Kashgar, and the whole crew hunts for it", "es": "Un presentador de CCTV pierde un diente de porcelana grabando en Kashgar y todo el equipo lo busca", "ja": "CCTVの司会者、カシュガルでの収録中に前歯が取れ 出演者総出で捜索"}, "body": {"zh": "11 月 22 日晚，央视主持人杨帆在新疆喀什集市录制《此生要去的 100 个地方》时，品尝当地美食导致烤瓷门牙被粘脱落。他走出一段路后才察觉，起初私下向录音师求助，随后发动集市上的小朋友帮忙寻找并悬赏 100 元；同行的陆虎猜测牙齿可能粘在鞋底，节目组全员当场抬脚检查。寻牙未果后，杨帆暂停录制前往附近口腔诊所，王冰冰、陆虎、郭采洁闻讯赶到诊所围观。尼格买提发文调侃「传出去：杨帆牙掉了」。相关话题登上热搜。", "en": "On the evening of 22 November, CCTV host Yang Fan was filming 100 Places to See in This Life at a market in Kashgar, Xinjiang, when a piece of local food pulled out a porcelain front tooth. He noticed only after walking on, first quietly asking the sound engineer for help, then recruiting children at the market with a 100-yuan reward. Singer Lu Hu suggested it might be stuck to a shoe sole, and the whole crew lifted their feet to check. With the tooth still missing, Yang Fan paused filming and went to a nearby dental clinic, where Wang Bingbing, Lu Hu and Amber Kuo arrived to watch. Nigmaiti joked online that word should be spread: Yang Fan lost a tooth. The topic trended.", "es": "En la noche del 22 de noviembre, el presentador de CCTV Yang Fan grababa 100 lugares que ver en esta vida en un mercado de Kashgar, Xinjiang, cuando una comida local le arrancó un diente de porcelana. Lo notó al rato, pidió ayuda discretamente al técnico de sonido y luego reclutó a niños del mercado con una recompensa de 100 yuanes. El cantante Lu Hu sugirió que podía estar pegado a una suela, y todo el equipo se levantó los pies para comprobarlo. Sin encontrarlo, Yang Fan paró la grabación y acudió a una clínica dental cercana, adonde llegaron Wang Bingbing, Lu Hu y Amber Kuo para mirar. Nigmaiti bromeó en redes pidiendo que se corriera la voz: Yang Fan perdió un diente. El tema se hizo tendencia.", "ja": "11月22日夜、CCTVの司会者・楊帆氏が新疆カシュガルの市場で番組『此生要去的100个地方』を収録中、地元料理を食べて前歯のセラミックが抜けた。しばらく歩いてから気づき、最初は録音技師に密かに相談し、その後市場の子どもたちに100元の懸賞をかけて捜索を依頼。同行の陸虎が靴底に付いたのではと推測し、番組スタッフ全員がその場で靴を掲げて確認した。見つからず収録を中断して近くの歯科へ向かうと、王冰冰、陸虎、郭采潔が聞きつけて見物に来た。ニグマティ氏は「楊帆の歯が抜けたと広めよう」と投稿。話題はトレンド入りした。"}, "why": {"zh": "一条毫无信息增量的综艺花絮能冲上热搜第二，说明观众对「完美人设」已经疲劳，反而愿意为这种真实的狼狈买单。对节目组而言，这是意外收获的最好素材；对当事人而言，一颗门牙换一次全民好感，性价比相当高。", "en": "That a behind-the-scenes clip with zero news value could reach second place on Weibo shows audiences are tired of flawless personas and will pay for real embarrassment. For the producers it is the best footage they never planned; for the man himself, one front tooth bought a national surge of affection at a very good exchange rate.", "es": "Que un clip sin valor informativo llegue al segundo puesto de Weibo demuestra que el público está cansado de las imágenes perfectas y paga por el ridículo auténtico. Para el equipo es el mejor material que no planearon; para el protagonista, un diente compró un afecto nacional a un tipo de cambio muy favorable.", "ja": "情報量ゼロの舞台裏映像が微博2位に入ったことは、観客が「完璧な人設」に疲れ、本物の不格好さにお金を払うことを示す。番組側にとっては想定外の最良素材であり、本人にとっては前歯1本で全国的な好感を得た、非常に割の良い取引だ。"}}, {"idx": "03", "tag": {}, "title": {"zh": "余文乐自曝躯体化与恐慌症：开不了车，也坐不了飞机", "en": "Shawn Yue on panic disorder: he cannot drive, and cannot fly", "es": "Shawn Yue habla del trastorno de pánico: no puede conducir ni volar", "ja": "余文楽が身体化症状とパニック障害を告白 車も飛行機も無理"}, "body": {"zh": "11 月 23 日，「余文乐躯体化严重到不能开车」登上微博热搜，文娱榜最高第一。在湖南卫视访谈节目《背后 2》中，45 岁的余文乐首次详述多年来的恐慌症与躯体化经历：开车途中突然双手发抖、全身冒冷汗、胸闷喘不上气，只能紧急靠边停车；飞往法国的航班上症状在万米高空发作，最终要求下机。他表示自己甚至害怕走进有几十个人的化妆间，参加《披荆斩棘 2026》时也会想掉头就走。", "en": "On 23 November the topic of Shawn Yue's severe somatic symptoms leaving him unable to drive topped Weibo's entertainment chart. In the Hunan TV interview programme Behind 2, the 45-year-old described years of panic disorder and somatic symptoms for the first time: behind the wheel his hands would shake, he would break into cold sweats and struggle to breathe, forcing him to pull over; on a flight to France the symptoms struck at altitude and he asked to get off. He said he even dreads walking into a dressing room with dozens of people, and felt like turning around at the door while filming a reality show.", "es": "El 23 de noviembre, el tema sobre los graves síntomas somáticos que impiden conducir a Shawn Yue encabezó la lista de entretenimiento de Weibo. En el programa de entrevistas Behind 2, de Hunan TV, el actor de 45 años describió por primera vez años de trastorno de pánico y somatización: al volante le temblaban las manos, sudaba frío y le faltaba el aire, obligándole a detenerse; en un vuelo a Francia los síntomas aparecieron en pleno vuelo y pidió bajar. Dijo que incluso teme entrar en un camerino con decenas de personas y que quiso dar media vuelta al llegar a un programa.", "ja": "11月23日、「余文楽の身体化症状が深刻で車を運転できない」が微博のエンタメ榜1位となった。湖南衛視のインタビュー番組『背後2』で、45歳の余文楽は長年のパニック障害と身体化症状を初めて詳述した。運転中に突然手が震え、冷や汗と息苦しさに襲われて路肩に停めるしかなかったこと、フランス行きの便では上空で症状が出て降機を求めたことを語った。数十人がいる楽屋に入るのも怖く、バラエティ収録では引き返したくなるとも話した。"}, "why": {"zh": "这条热搜的价值不在「明星也有病」，而在于它把「躯体化」这个生僻词送进了大众视野——情绪问题会以心慌、手抖、窒息感的形式出现在身体上，而当事人往往先去看心内科。一个公众人物愿意把最失控的时刻讲出来，比十篇科普都管用。", "en": "The value here is not that a celebrity gets ill but that a clinical term reached a mass audience: emotional distress can surface physically as palpitations, tremors and a sense of suffocation, and sufferers usually see a cardiologist first. A public figure willing to describe his most out-of-control moments does more than ten explainers.", "es": "El valor no está en que un famoso enferme, sino en que un término clínico llegó al gran público: el malestar emocional puede manifestarse como palpitaciones, temblores y sensación de ahogo, y quien lo sufre suele acudir primero al cardiólogo. Que una figura pública describa sus momentos más descontrolados sirve más que diez divulgaciones.", "ja": "価値は「有名人も病気になる」ことではなく、「身体化」という専門用語が一般の視野に入ったことにある。感情の不調は動悸や手の震え、息苦しさとして身体に現れ、本人はまず循環器科を受診しがちだ。公人が最も制御を失った瞬間を語ることは、解説記事10本に勝る。"}}, {"idx": "04", "tag": {}, "title": {"zh": "孙芮后援会宣布关站，结余 74357.13 元全数捐出", "en": "Sun Rui's fan club shuts down and donates its remaining 74,357.13 yuan", "es": "El club de fans de Sun Rui cierra y dona sus 74.357,13 yuanes restantes", "ja": "孫芮のファンクラブが閉鎖 残金7万4357.13元を全額寄付"}, "body": {"zh": "11 月 22 日，孙芮官方应援会发布公告，宣布即日起停止更新与维护、正式关站，此时距孙芮官宣结婚怀孕不到两天。公告回顾了从 SNH48 舞台新人到两届总选冠军、再到单飞发展的历程，并交代截至公告日账户结余 74357.13 元，将以全体粉丝名义全数捐赠至女性相关慈善项目，后续补发捐款凭证。公告中一句「失望不必翻译成祝福，生气不必包装成体谅」被大量转发。", "en": "On 22 November Sun Rui's official fan club announced it would stop updating and close, less than two days after she announced her marriage and pregnancy. The notice reviewed her path from newcomer on the SNH48 stage to two-time general election champion and solo artist, and disclosed a remaining balance of 74,357.13 yuan, to be donated in the name of all fans to women's charities, with receipts to follow. One line was widely shared: disappointment need not be translated into blessings, and anger need not be packaged as understanding.", "es": "El 22 de noviembre el club de fans oficial de Sun Rui anunció el cierre y el fin de sus actualizaciones, menos de dos días después de que ella anunciara su boda y embarazo. El comunicado repasó su trayectoria desde novata en el escenario de SNH48 hasta dos veces campeona de las elecciones generales y artista en solitario, y reveló un saldo de 74.357,13 yuanes que se donará en nombre de todos los fans a proyectos benéficos para mujeres, con los recibos pendientes. Una frase se difundió mucho: la decepción no tiene por qué traducirse en bendiciones ni la rabia envolverse en comprensión.", "ja": "11月22日、孫芮の公式ファンクラブが同日をもって更新と運営を停止し閉鎖すると発表した。孫芮が結婚と妊娠を公表してから2日も経っていない。告知は SNH48 の舞台新人から総選挙2回王者、ソロ活動までの歩みを振り返り、公告日時点の残高7万4357.13元を全ファンの名義で女性関連の慈善事業に全額寄付し、後日領収書を公開するとした。「失望を祝福に翻訳する必要はなく、怒りを理解に包装する必要もない」という一節が多く共有された。"}, "why": {"zh": "偶像婚讯引发的粉丝退场，通常是撕扯、控评与互相指责；这一次却是一份账目清楚、去向明确的告别公告。它给出的示范是：粉丝的爱可以有终点，但不必以难堪收场。「结余全捐」这个动作，把一场可能的舆论危机，变成了一次体面的收尾。", "en": "A fan exodus after an idol's wedding usually means sniping, comment control and recrimination. This time it was a farewell notice with clean books and a stated destination. The lesson: fandom can end without ending badly. Donating the balance turned a potential public-relations crisis into a dignified exit.", "es": "La salida de fans tras la boda de una idol suele traer ataques, control de comentarios y reproches. Esta vez fue un comunicado de despedida con cuentas claras y destino definido. La lección: el amor fan puede tener final sin terminar mal. Donar el saldo convirtió una posible crisis de imagen en una salida digna.", "ja": "アイドルの結婚発表後のファン離れは、通常は罵り合いやコメント管理、非難になる。今回は帳簿が明確で使途も示された告別の告知だった。示されたのは、ファンの愛には終わりがあっても、みっともなく終わる必要はないということだ。残金の全額寄付が、起こり得た炎上を品位ある幕引きに変えた。"}}, {"idx": "05", "tag": {}, "title": {"zh": "高迪大美被共同好友证实已办完离婚，11 年感情留下三个孩子", "en": "Influencer couple Gaodi and Damei confirmed divorced after 11 years and three children", "es": "Confirman el divorcio de los influencers Gaodi y Damei tras 11 años y tres hijos", "ja": "インフルエンサー夫婦の高迪と大美、離婚が成立 11年の交際と3人の子ども"}, "body": {"zh": "11 月 22 日，网红夫妻高迪与「黑暗萝莉」大美的共同好友贝源哥在直播中确认，两人已办完离婚手续，目前处于分开冷静状态，三个孩子暂由高迪的母亲照料。此前 11 月 9 日高迪发文称「没对不起过大美」并暂停所有线下活动，12 日凌晨大美发文确认正在办理离婚，16 日又传出高迪取消明年 1 月演唱会、房子车子存款全部留给妻子。高迪否认出轨与家暴传闻，称将净身出户；大美则称其冷漠提出离婚，并晒出受伤照片与聊天记录。相关热搜词条累计已超百条。", "en": "On 22 November a mutual friend of the influencer couple Gaodi and Damei confirmed in a livestream that their divorce is finalised, that they are now taking time apart, and that the three children are being cared for by Gaodi's mother. On 9 November Gaodi said he had not wronged her and suspended all offline appearances; early on 12 November Damei confirmed the divorce was in process; on 16 November came reports that he had cancelled a January concert and was leaving her the house, car and savings. Gaodi denies cheating or domestic violence and says he is leaving with nothing; Damei says he raised divorce coldly and has posted photos of injuries and chat records. More than a hundred related trending entries have accumulated.", "es": "El 22 de noviembre un amigo común de los influencers Gaodi y Damei confirmó en directo que su divorcio está formalizado, que atraviesan un periodo de separación y que los tres hijos quedan al cuidado de la madre de él. El 9 de noviembre Gaodi dijo que no le había faltado al respeto y suspendió sus apariciones; de madrugada el 12, Damei confirmó que tramitaban el divorcio; el 16 se supo que él canceló un concierto de enero y dejaba casa, coche y ahorros a su mujer. Gaodi niega infidelidad y violencia machista y dice que se va sin nada; Damei afirma que él planteó el divorcio con frialdad y ha publicado fotos de lesiones y conversaciones. Se acumulan más de cien entradas relacionadas en tendencias.", "ja": "11月22日、インフルエンサー夫婦の高迪と「暗黒ロリ」大美の共通の友人が配信で、離婚手続きが完了し、現在は距離を置いて冷静になる期間にあり、3人の子どもは高迪の母が面倒を見ていると明かした。11月9日に高迪は「大美に負い目はない」と投稿して対面活動を休止、12日未明に大美が離婚手続き中と認め、16日には高迪が来年1月のコンサートを中止し、家・車・預金をすべて妻に残すと報じられた。高迪は不貞とDVを否定し、無一文で出ると述べ、大美は冷たく離婚を切り出されたと主張して負傷写真とやり取りを公開した。関連するトレンドは延べ100件を超える。"}, "why": {"zh": "这对初代网红夫妻的故事之所以让人唏嘘，是因为它完整展示了「把私生活当内容」的代价——恋爱、求婚、生子都在镜头里完成，散场时也必然在镜头里被逐帧审视。三个孩子的抚养与财产分割才是真正要紧的事，而它恰恰是最不适合直播的部分。", "en": "What makes this couple's story poignant is that it shows the full price of treating private life as content: the courtship, the proposal and the children all happened on camera, so the break-up is bound to be examined frame by frame on camera too. Custody of three children and the division of assets are what actually matter — and they are precisely the part least suited to a livestream.", "es": "Lo que hace conmovedora esta historia es que muestra el precio completo de convertir la vida privada en contenido: el noviazgo, la petición de mano y los hijos ocurrieron ante la cámara, así que la ruptura también será examinada fotograma a fotograma. La custodia de tres niños y el reparto de bienes son lo que de verdad importa, y es justo la parte menos apta para un directo.", "ja": "この夫婦の物語が胸を打つのは、「私生活をコンテンツにする」ことの代価を余すところなく示すからだ。交際もプロポーズも出産もカメラの中で起きたのだから、別れもまたフレーム単位で検証される。本当に重要なのは3人の子どもの養育と財産分与であり、それは配信に最も向かない部分である。"}}]}], "risk": {"zh": "风险提示：本简报仅作信息汇总，其中涉及的数据不构成任何投资建议。", "en": "Risk notice: this briefing is a summary of information only; the data cited does not constitute investment advice.", "es": "Aviso de riesgo: este boletín es solo un resumen informativo; los datos citados no constituyen asesoramiento de inversión.", "ja": "リスク表示：本ブリーフィングは情報の要約であり、記載のデータは投資助言を構成するものではありません。"}}/*__END__*/;

  /* ===== UI 文案（与内容分离，四语齐全） ===== */
  var I18N = {
    "zh": {
      "dateSub": "每日简报", "calBtn": "往期日历", "calFoot": "带圆点的日期可查看当日存档",
      "tag": "进展", "why": "看点：", "badge": "精 选",
      "calWeek": ["日", "一", "二", "三", "四", "五", "六"],
      "calTitle": function (y, m) { return y + " 年 " + m + " 月"; }
    },
    "en": {
      "dateSub": "DAILY BRIEFING", "calBtn": "Archive", "calFoot": "Dots mark dates with a saved issue",
      "tag": "UPDATE", "why": "Why: ", "badge": "EDITOR'S PICK",
      "calWeek": ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"],
      "calTitle": function (y, m) { return ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][m-1] + " " + y; }
    },
    "es": {
      "dateSub": "BOLETÍN DIARIO", "calBtn": "Archivo", "calFoot": "Los puntos marcan fechas con ejemplar guardado",
      "tag": "ACTUALIZACIÓN", "why": "Por qué: ", "badge": "DESTACADO",
      "calWeek": ["Dom", "Lun", "Mar", "Mié", "Jue", "Vie", "Sáb"],
      "calTitle": function (y, m) { return m + " · " + y; }
    },
    "ja": {
      "dateSub": "デイリーブリーフィング", "calBtn": "バックナンバー", "calFoot": "点のついた日付は保存された号があります",
      "tag": "続報", "why": "見どころ：", "badge": "特集",
      "calWeek": ["日", "月", "火", "水", "木", "金", "土"],
      "calTitle": function (y, m) { return y + "年" + m + "月"; }
    }
  };
  var LANGS = ["zh", "en", "es", "ja"];
  var LANG_LABEL = { "zh": "中文", "en": "EN", "es": "ES", "ja": "日本語" };
  var LANG_LABEL_FULL = { "zh": "中文", "en": "English", "es": "Español", "ja": "日本語" };
  var LANG_HTML = { "zh": "zh-CN", "en": "en", "es": "es", "ja": "ja" };

  // 小国旗（内联 SVG，避免外部图标依赖与 emoji 平台差异）
  function flag(lang) {
    if (lang === "zh") return '<svg class="fl" viewBox="0 0 30 20" aria-hidden="true"><rect width="30" height="20" fill="#de2910"/><g fill="#ffde00"><circle cx="5" cy="4" r="2.2"/><circle cx="9" cy="2.4" r="0.8"/><circle cx="10" cy="4" r="0.8"/><circle cx="9" cy="5.6" r="0.8"/><circle cx="7" cy="6.6" r="0.8"/></g></svg>';
    if (lang === "en") return '<svg class="fl" viewBox="0 0 30 20" aria-hidden="true"><rect width="30" height="20" fill="#012169"/><path d="M0 0L30 20M30 0L0 20" stroke="#fff" stroke-width="4"/><path d="M0 0L30 20M30 0L0 20" stroke="#c8102e" stroke-width="2"/><rect x="13" width="4" height="20" fill="#fff"/><rect y="8" width="30" height="4" fill="#fff"/><rect x="14" width="2" height="20" fill="#c8102e"/><rect y="9" width="30" height="2" fill="#c8102e"/></svg>';
    if (lang === "es") return '<svg class="fl" viewBox="0 0 30 20" aria-hidden="true"><rect width="30" height="20" fill="#aa151b"/><rect y="5" width="30" height="10" fill="#f1bf00"/></svg>';
    return '<svg class="fl" viewBox="0 0 30 20" aria-hidden="true"><rect width="30" height="20" fill="#fff"/><circle cx="15" cy="10" r="5.5" fill="#bc002d"/></svg>';
  }

  /* ===== 工具 ===== */
  function T(obj, lang) {
    if (obj == null) return "";
    if (typeof obj === "string") return obj;
    if (obj[lang] != null) return obj[lang];
    return obj.zh != null ? obj.zh : "";
  }
  function pad(n) { return n < 10 ? "0" + n : "" + n; }
  function bing(q) { return "https://www.bing.com/search?q=" + encodeURIComponent(q); }
  function fmtDate(d, lang) {
    var y = d.getFullYear(), m = d.getMonth() + 1, day = d.getDate();
    if (lang === "zh") return y + "." + pad(m) + "." + pad(day);
    if (lang === "ja") return y + "年" + m + "月" + day + "日";
    if (lang === "es") return day + " " + ["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"][m-1] + " " + y;
    return ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][m-1] + " " + day + ", " + y;
  }
  function esc(s) {
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }
  function titleHtml(titleObj, hlObj, lang) {
    var title = T(titleObj, lang);
    var hl = T(hlObj, lang);
    var inner = esc(title);
    if (hl && title.indexOf(hl) >= 0) {
      var i = title.indexOf(hl);
      inner = esc(title.slice(0, i)) + '<span class="hl">' + esc(hl) + "</span>" + esc(title.slice(i + hl.length));
    }
    return '<a class="lk" href="' + bing(title) + '" target="_blank" rel="noopener">' + inner + "</a>";
  }

  /* ===== 语言检测：localStorage > 浏览器语言 > 系统时区 > 中文 ===== */
  function detectLang() {
    try { var s = localStorage.getItem("timab_lang"); if (s && LANGS.indexOf(s) >= 0) return s; } catch (e) {}
    var nav = (navigator.language || "").toLowerCase();
    if (/^zh/.test(nav)) return "zh";
    if (/^ja/.test(nav)) return "ja";
    if (/^es/.test(nav)) return "es";
    if (/^en/.test(nav)) return "en";
    var tz = "";
    try { tz = Intl.DateTimeFormat().resolvedOptions().timeZone || ""; } catch (e) {}
    if (/^Asia\/Tokyo/.test(tz)) return "ja";
    if (/Europe\/Madrid|America\/(Mexico_City|Bogota|Lima|Santiago|Caracas|Guatemala|La_Paz|San_Jose|Panama|Asuncion|Montevideo|Havana|El_Salvador|Managua|Tegucigalpa|Costa_Rica|San_Salvador)|America\/Argentina\//.test(tz)) return "es";
    if (/^(Europe|America|Australia)\//.test(tz)) return "en";
    return "zh";
  }

  var curLang = "zh";
  var langOpen = false;

  /* ===== 渲染 ===== */
  function renderChrome(lang) {
    var i18n = I18N[lang];
    document.documentElement.lang = LANG_HTML[lang];
    // 报头信息行
    var metaEl = document.getElementById("metaRow");
    if (metaEl) metaEl.textContent = T(BRIEFING.meta, lang);
    // 大日期
    var md = document.getElementById("mastDate");
    if (md) {
      var d = new Date(BRIEFING.date + "T00:00:00");
      md.innerHTML = fmtDate(d, lang) + "<small>" + esc(i18n.dateSub) + "</small>";
    }
    // 文档标题
    var siteName = (lang === "zh") ? "提马早报" : "TIMAB DAILY";
    document.title = siteName + " · " + fmtDate(new Date(BRIEFING.date + "T00:00:00"), lang);
    // 导航签
    var nav = document.getElementById("navChips");
    if (nav) {
      var order = ["pick"].concat(BRIEFING.sections.map(function (s) { return s.key; }));
      nav.innerHTML = "";
      order.forEach(function (key) {
        if (key === "pick") {
          var a = document.createElement("a");
          a.className = "chip-pick"; a.href = "#pick"; a.setAttribute("data-nav", "pick");
          a.textContent = T(BRIEFING.spotlight.badge, lang);
          nav.appendChild(a);
        } else {
          var sec = null;
          BRIEFING.sections.forEach(function (s) { if (s.key === key) sec = s; });
          if (!sec) return;
          var b = document.createElement("a");
          b.href = "#" + key; b.setAttribute("data-nav", key);
          b.style.borderColor = sec.color; b.style.color = sec.deep;
          b.textContent = T(sec.name, lang);
          nav.appendChild(b);
        }
      });
    }
    // 日历文案
    var cb = document.getElementById("calBtnText"); if (cb) cb.textContent = i18n.calBtn;
    var cw = document.getElementById("calWeek");
    if (cw) { cw.innerHTML = ""; i18n.calWeek.forEach(function (w) { var s = document.createElement("span"); s.textContent = w; cw.appendChild(s); }); }
    var cf = document.getElementById("calFoot"); if (cf) cf.textContent = i18n.calFoot;
    // 语言切换器（国旗触发 + 下拉）
    var ls = document.getElementById("langSwitch");
    if (ls) {
      ls.className = "lang-switch" + (langOpen ? " open" : "");
      ls.innerHTML = "";
      var trig = document.createElement("button");
      trig.type = "button"; trig.className = "lang-trigger"; trig.id = "langTrigger";
      trig.setAttribute("aria-haspopup", "true");
      trig.setAttribute("aria-expanded", langOpen ? "true" : "false");
      trig.innerHTML = flag(curLang) + '<span class="caret">▾</span>';
      trig.addEventListener("click", function (e) {
        e.stopPropagation();
        langOpen = !langOpen;
        ls.classList.toggle("open", langOpen);
        trig.setAttribute("aria-expanded", langOpen ? "true" : "false");
      });
      ls.appendChild(trig);
      var menu = document.createElement("div");
      menu.className = "lang-menu"; menu.setAttribute("role", "menu");
      LANGS.forEach(function (l) {
        var item = document.createElement("button");
        item.type = "button"; item.className = "lang-item" + (l === curLang ? " sel" : "");
        item.setAttribute("role", "menuitem"); item.setAttribute("data-lang", l);
        item.innerHTML = flag(l) + '<span class="lbl">' + LANG_LABEL_FULL[l] + "</span>";
        item.addEventListener("click", function (e) {
          e.stopPropagation();
          setLang(l);
        });
        menu.appendChild(item);
      });
      ls.appendChild(menu);
    }
  }

  function renderContent(lang) {
    var i18n = I18N[lang];
    var html = "";
    // 精选
    var sp = BRIEFING.spotlight;
    html += '<section class="spotlight" id="pick">'
      + '<div class="badge"><i></i>' + esc(T(sp.badge, lang)) + "</div>"
      + "<h2>" + titleHtml(sp.title, sp.hl, lang) + "</h2>"
      + '<div class="body">' + esc(T(sp.body, lang)) + "</div>"
      + '<div class="why"><b>' + esc(i18n.why) + "</b>" + esc(T(sp.why, lang)) + "</div>"
      + "</section>";
    // 分类
    html += '<div class="grid">';
    BRIEFING.sections.forEach(function (sec) {
      html += '<section class="card" id="' + sec.key + '" style="--ac:' + sec.color + "; --ac-deep:" + sec.deep + ';">'
        + '<div class="sec-head"><span class="sec-num">' + sec.num + "</span>"
        + "<h3>" + esc(T(sec.name, lang)) + "</h3>"
        + '<span class="en">' + sec.key.toUpperCase() + "</span></div>";
      (sec.items || []).forEach(function (it) {
        html += '<div class="item">';
        html += '<div class="t"><span class="idx">' + it.idx + "</span>";
        if (it.tag) html += '<span class="tag">' + esc(it.tag[lang] != null ? it.tag[lang] : i18n.tag) + "</span>";
        html += titleHtml(it.title, it.hl, lang) + "</div>";
        html += '<div class="d">' + esc(T(it.body, lang)) + "</div>";
        html += '<div class="why"><b>' + esc(i18n.why) + "</b>" + esc(T(it.why, lang)) + "</div>";
        html += "</div>";
      });
      html += "</section>";
    });
    html += "</div>";
    var content = document.getElementById("content");
    if (content) content.innerHTML = html;
    // 页脚
    var risk = document.getElementById("risk");
    if (risk) risk.textContent = T(BRIEFING.risk, lang);
  }

  function setLang(lang) {
    if (LANGS.indexOf(lang) < 0) lang = "zh";
    curLang = lang;
    langOpen = false;
    try { localStorage.setItem("timab_lang", lang); } catch (e) {}
    renderChrome(lang);
    renderContent(lang);
  }

  /* ===== 往期日历（保留原逻辑，文案随语言） ===== */
  function initCalendar() {
    var btn = document.getElementById("calBtn");
    var pop = document.getElementById("calPop");
    var grid = document.getElementById("calGrid");
    var title = document.getElementById("calTitle");
    if (!btn || !pop || !grid || !title) return;

    var parts = BRIEFING.date.split("-");
    var todayKey = parts[0].slice(2) + parts[1] + parts[2];
    var cur = { y: +parts[0], m: +parts[1] };
    var has = {};
    for (var i = 0; i < ARCHIVE_DATES.length; i++) { has[ARCHIVE_DATES[i]] = 1; }
    var HIST_BASE = /\/history\//.test(location.pathname) ? "./" : "history/";

    function ckey(y, m, d) { return String(y).slice(2) + pad(m) + pad(d); }

    function render() {
      var i18n = I18N[curLang];
      title.textContent = i18n.calTitle(cur.y, cur.m);
      grid.innerHTML = "";
      var start = new Date(cur.y, cur.m - 1, 1).getDay();
      var days = new Date(cur.y, cur.m, 0).getDate();
      for (var b = 0; b < start; b++) {
        var blank = document.createElement("span");
        blank.className = "cal-cell is-empty"; grid.appendChild(blank);
      }
      for (var d = 1; d <= days; d++) {
        var k = ckey(cur.y, cur.m, d);
        var cell = document.createElement("span");
        cell.className = "cal-cell" + (has[k] ? " has" : "") + (k === todayKey ? " is-today" : "");
        cell.textContent = d;
        if (has[k]) {
          cell.setAttribute("role", "link"); cell.setAttribute("tabindex", "0");
          cell.title = cur.y + "-" + pad(cur.m) + "-" + pad(d) + " 存档";
          (function (target) {
            var go = function () { window.open(HIST_BASE + target + ".html", "_blank", "noopener"); };
            cell.addEventListener("click", go);
            cell.addEventListener("keydown", function (e) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); go(); } });
          })(k);
        }
        grid.appendChild(cell);
      }
    }
    function toggle(open) {
      pop.hidden = !open;
      btn.setAttribute("aria-expanded", open ? "true" : "false");
      if (open) render();
    }
    btn.addEventListener("click", function (e) { e.stopPropagation(); toggle(pop.hidden); });
    document.getElementById("calPrev").addEventListener("click", function () { cur.m--; if (cur.m < 1) { cur.m = 12; cur.y--; } render(); });
    document.getElementById("calNext").addEventListener("click", function () { cur.m++; if (cur.m > 12) { cur.m = 1; cur.y++; } render(); });
    document.addEventListener("click", function (e) { if (!pop.hidden && !pop.contains(e.target)) toggle(false); });
    document.addEventListener("keydown", function (e) { if (e.key === "Escape" && !pop.hidden) toggle(false); });
  }

  /* ===== 启动 ===== */
  function boot() {
    curLang = detectLang();
    renderChrome(curLang);
    renderContent(curLang);
    initCalendar();
    // 关闭语言下拉：点击外部 / Esc
    document.addEventListener("click", function (e) {
      var ls = document.getElementById("langSwitch");
      if (ls && langOpen && !ls.contains(e.target)) {
        langOpen = false;
        ls.classList.remove("open");
        var t = document.getElementById("langTrigger");
        if (t) t.setAttribute("aria-expanded", "false");
      }
    });
    document.addEventListener("keydown", function (e) {
      if (e.key === "Escape" && langOpen) {
        langOpen = false;
        var ls = document.getElementById("langSwitch");
        if (ls) ls.classList.remove("open");
        var t = document.getElementById("langTrigger");
        if (t) t.setAttribute("aria-expanded", "false");
      }
    });
  }
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", boot);
  } else { boot(); }
})();
</script>
</body>
</html>
